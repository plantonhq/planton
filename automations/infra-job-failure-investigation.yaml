# Infra Job Failure Investigation
#
# The proving case for the automation definition machinery. Every seam of
# this definition is BOUND (see the README's authoring contracts): the
# predicate is CEL over the event resource's document; runtime values ride
# the engine's `${.env_vars.KEY}` / `${.secrets.KEY}` placeholder form; the
# fetched document reaches the agent through task chaining (a task's input
# IS the previous task's output -- the agent_call message embeds it with an
# inline jq expression, because the engine passes the agent ONLY the
# resolved message, never the task input); and the investigation's
# conclusion lands through the structured output contract below -- the
# engine extracts and validates `{title, summary, content}` from the
# agent's answer, and the platform's run reconciler writes it onto the
# run's finding record.
slug: infra-job-failure-investigation
displayName: Infra Job Failure Investigation
description: >-
  When a deployment fails, the assistant investigates immediately: it reads
  the failed Infra Job's diagnostics — the error messages, the per-resource
  failures, the operation summary — reasons over what actually went wrong,
  and writes up a finding with the likely root cause and suggested next
  steps. Read-only: it never touches your infrastructure, it only
  investigates and reports.
automationClass: automation_class_read
triggerBindings:
  - resourceKind: infra_job
    eventType: status_updated
    # CEL over the event resource's protobuf-JSON document, bound as
    # `resource` (enum values read as their NAMES, as strings). Fires only
    # when the job's execution has completed with a failed result; a
    # re-saved terminal record fires again by design (events carry no
    # previous state) — the dispatcher's deterministic run identity is what
    # makes refires idempotent.
    predicate: 'resource.status.progress.status == "completed" && resource.status.progress.result == "failed"'
budget:
  # $2.00 per run, engine-enforced, terminate on exceeded (the publish lane
  # applies the terminate policy; it is deliberately not authorable here).
  maxCostMicros: 2000000
# Automation agent_calls run the engine's NATIVE harness, whose model
# registry uses dot-form ids (claude-haiku-4.5; the cursor harness's
# dash-form ids are a different namespace). Verified against the live
# registry and executed live.
pinnedModel: claude-haiku-4.5
dailyRunCapDefault: 25
workflow:
  description: |
    Two steps, deterministic hands then agent judgment: an http_call fetches
    the failed Infra Job's full document (diagnostics, per-operation errors,
    progress snapshot) from the platform API using the run's own read-only
    credential; an agent_call then reasons over the fetched bundle and
    produces the investigation finding. The agent never fetches — every fact
    it sees was retrieved deterministically first.
  tasks:
    - name: fetch_infra_job
      kind: http_call
      config:
        method: POST
        endpoint:
          # The platform API base URL and the run-scoped credential arrive
          # in the run's env, threaded by the trigger bridge at dispatch.
          # The placeholder form is the engine's runtime grammar
          # (`${.env_vars.KEY}` / `${.secrets.KEY}` — no space after `${`),
          # resolved by the runner against the execution's runtime_env.
          uri: ${.env_vars.PLANTON_API_BASE_URL}/ai.planton.infrahub.infrajob.v1alpha1.InfraJobQueryController/get
        headers:
          Authorization: Bearer ${.secrets.PLANTON_RUN_CREDENTIAL}
          Content-Type: application/json
        body:
          value: ${.env_vars.PLANTON_TRIGGER_RESOURCE_ID}
    - name: investigate
      kind: agent_call
      config:
        # org/slug reference form; the run executes in the org's own engine
        # workspace, so the org segment resolves per run.
        agent: ${.env_vars.PLANTON_ENGINE_ORG}/planton-assistant
        # The fetched Infra Job document is this task's INPUT (a task's
        # input is the previous task's output), embedded below with the
        # jq expression form `${ . | tojson }` — a space after `${`
        # distinguishes jq expressions from the runtime placeholder
        # grammar. The engine passes the agent only this resolved message.
        message: |
          A deployment just failed. The complete Infra Job document —
          including its diagnostics, per-operation errors, and progress
          snapshot — is included below as JSON. Investigate the failure:
          identify the likely root cause, distinguish infrastructure causes
          (quota, permission, provider outage) from configuration causes
          (bad input, missing dependency), and recommend one concrete next
          step. Do not attempt any fix — this is a read-only investigation.

          Answer with your structured finding:
          - title: one line (under 90 characters) naming the root cause,
            specific enough to tell two different failures apart at a glance.
          - summary: one short paragraph — what failed, why, and the next
            step — readable on its own in an activity feed.
          - content: the full investigation as markdown, with sections for
            what happened, the root cause, the evidence (quote the exact
            error lines you relied on), and the recommended next step.
            Be thorough but bounded: keep it under roughly 2000 words.

          The Infra Job document:

          ${ . | tojson }
        # The finding contract: the engine extracts structured JSON from the
        # agent's answer and validates it against this schema before the
        # task completes; the platform reads the validated object into the
        # run's finding record. The engine enforces a schema SUBSET (type,
        # required, properties, enum) — length guidance lives in the message
        # above, deliberately not in unenforced schema constraints.
        output:
          schema:
            type: object
            required: [title, summary, content]
            properties:
              title:
                type: string
              summary:
                type: string
              content:
                type: string
          # Each retry re-runs the full agent call — real spend inside the
          # run's budget — so one retry is the deliberate ceiling.
          on_invalid: ON_INVALID_RETRY
          max_retries: 1
