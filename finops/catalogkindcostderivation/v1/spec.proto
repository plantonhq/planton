syntax = "proto3";

package dev.planton.finops.catalogkindcostderivation.v1;

// CatalogKindCostDerivationSpec holds one kind's machine-executable
// derivation rules: how ANY manifest's spec values become metered
// quantities and price choices. The estimator evaluates these rules
// against a typed manifest and either produces an exact, source-cited
// monthly estimate or refuses with the reason it cannot know the number
// -- it never guesses. Authoring contract: every numeric literal is a
// decimal STRING (never a YAML float), every rule defends itself in
// basis prose, every sku_meter must be declared by the kind's
// cost.yaml, and every field path must resolve against the kind's
// served spec contract -- the derivation conformance gate enforces all
// of it, and the estimate generator replays every catalog preset through
// these rules, so a rule that disagrees with the hand-verified estimates
// fails CI.
message CatalogKindCostDerivationSpec {
  // ISO 4217 currency every price this derivation selects must be
  // pinned in ("USD"). One currency per kind: a bill that mixes
  // currencies cannot be summed honestly.
  string currency = 1;

  // The hours-in-a-month convention behind time-metered quantities. 730
  // (365.25 days / 12 months x 24 hours) is the industry convention
  // shared by the major providers' own calculators. Quantity factors
  // reference it through the hours_in_month arm so the convention has
  // exactly one home.
  int32 hours_per_month = 2;

  // Where the estimate's pricing region comes from. Regional price-book
  // entries only price manifests resolved to their own region; a
  // manifest resolved to a region the book does not carry refuses
  // honestly instead of borrowing another region's price.
  RegionBinding region = 3;

  // Configurations whose committed cost this derivation cannot know.
  // Refusal is a first-class outcome: when any rule here matches, the
  // manifest gets NO estimate and the reason travels with the refusal.
  // A number would be a guess wearing a dollar sign -- absence is the
  // honest state (a rate delegated to a referenced resource, a value
  // the price book does not yet cover).
  repeated RefusalRule refusals = 4;

  // The metered consumptions, one rule per priced functionality per
  // pricing variant. Rules whose conditions do not hold simply emit
  // nothing; rules that evaluate to a zero quantity emit nothing (a
  // scale-to-zero pool honestly totals 0.00). Lines that resolve to the
  // same meter and price merge by summing quantities -- a bill has one
  // line per SKU.
  repeated LineRule lines = 5;

  // What every estimate this derivation produces deliberately excludes
  // because no manifest can know it (traffic, request volume, storage
  // growth). Entries with conditions ride only the estimates whose
  // manifests match, so the exclusions stay configuration-honest. An
  // estimate must never render a number without its exclusions.
  repeated ConditionalText exclusions = 6;

  // Free-form notes on the estimate's assumptions that fit no
  // structured field (free-tier effects, floor-vs-ceiling autoscaling
  // notes). Matching notes join in authored order; author conditions
  // mutually exclusive when one note must stand alone.
  repeated ConditionalText notes = 7;
}

// RegionBinding resolves the pricing region from the manifest, with a
// declared assumption when the manifest cannot answer.
message RegionBinding {
  // Spec-relative snake_case dotted path to the field carrying the
  // provider region or location (e.g. "region", "location"). A value
  // wrapped in angle brackets ("<aws-region>") is a catalog placeholder
  // and reads as unset. Empty when the kind's spec carries no
  // region field.
  string from_field = 1;

  // The region assumed when from_field is empty or unresolved, e.g.
  // "us-east-1". The produced estimate always states the region it
  // actually priced, so an assumption is visible, never silent.
  string assumption = 2;

  // When true, a location value carrying a single-letter zone suffix
  // resolves to its region ("us-central1-a" prices as "us-central1") --
  // the GCP convention where a location names a region OR one of its
  // zones, while list prices are regional. A value with no zone suffix
  // passes through unchanged. Leave false for providers whose region
  // fields are always regions.
  bool zone_to_region = 3;
}

// RefusalRule names one configuration shape whose committed cost is
// unknowable, and why.
message RefusalRule {
  // The conditions under which this refusal fires; ALL must hold. Must
  // not be empty -- an unconditional refusal means the kind should
  // simply ship no derivation.
  repeated Condition when = 1;

  // The honest sentence explaining what cannot be known and where the
  // answer lives (e.g. "the instance type and disk are delegated to the
  // referenced AwsLaunchTemplate and invisible in this manifest").
  string reason = 2;
}

// LineRule derives one estimate line: which meter, when it applies, how
// much is consumed, and which pinned price values it.
message LineRule {
  // The functionality being metered (FOCUS SkuMeter). Must match a
  // baseline charge or cost driver sku_meter in the kind's
  // cost.yaml -- a derivation cannot price a meter the cost profile
  // does not declare.
  string sku_meter = 1;

  // The conditions under which this line exists; ALL must hold; empty
  // means the line always applies. Pricing variants of one meter (e.g.
  // Multi-AZ vs Single-AZ instance hours) are authored as sibling rules
  // with disjoint conditions, each selecting its own price -- the
  // conditions carry the variant logic so quantities and prices stay
  // simple. These read from the SPEC ROOT even on an expanded rule
  // (they gate the whole rule -- an engine choice at the cluster level
  // gates every instance); per-element filtering belongs to
  // element_applies_when.
  repeated Condition applies_when = 2;

  // The monthly quantity as a PRODUCT of factors (e.g. node count x
  // hours in the month; node count x disk GiB). At least one factor.
  // Sums are never authored: two rules resolving to the same meter and
  // price merge by adding quantities, so "floor nodes plus warm-pool
  // nodes" is two rules, not an expression.
  repeated QuantityFactor quantity = 3;

  // The pinned price valuing this line, from the kind's provider
  // price book. Whichever arm is used, the entry must be priced in the
  // spec's currency and for the resolved region (or globally) -- the
  // estimator refuses otherwise.
  oneof price {
    // The slug of one book entry, for prices no spec value selects
    // (e.g. "alb-hours-us-east-1").
    string price_slug = 4;

    // A value-keyed lookup, for prices the manifest selects (e.g. the
    // instance class picking the rate). Resolves to exactly one entry
    // or refuses -- zero and several matches are both refusals, never
    // a pick.
    PriceLookup price_lookup = 5;
  }

  // How the quantity derives from the manifest, in one plain sentence
  // (e.g. "one public IPv4 node per subnet's Availability Zone x 730
  // hours"). Rides the estimate line as its audit trail; merged lines
  // join their sentences in authored order.
  string basis = 6;

  // When set, the rule evaluates ONCE PER ELEMENT of this repeated
  // MESSAGE field (spec-relative snake_case dotted path) instead of
  // once against the spec -- the shape of clustered services where
  // each element of an instances list carries its own class and bills
  // its own rate. Scopes are explicit, never mixed within one list:
  // applies_when keeps reading the SPEC ROOT (it gates the whole
  // rule), element_applies_when filters elements, and the rule's
  // VALUE-carrying paths -- quantity field reads, subtract_baseline
  // fields, price-lookup from_field bindings -- are ELEMENT-relative.
  // Root-scoped facts a line needs (a cluster-level scaling floor)
  // belong in a sibling non-expanded rule, conditioned with
  // any_element_of when it must key off element identity; root-fixed
  // price identity (the cluster's engine) rides constant attribute
  // bindings on sibling rules gated by root conditions. Elements
  // resolving to the same meter and price merge by the ordinary rule,
  // so N identical instances collapse to one line whose quantity is
  // the sum. An empty list emits nothing.
  string expand_over = 7;

  // Element filters for an expanded rule; ALL must hold for an element
  // to contribute, read ELEMENT-relative; empty means every element
  // contributes; an element the conditions reject simply contributes
  // nothing (a serverless instance filtered out of a provisioned-rate
  // rule), never a refusal. Only legal on a rule with expand_over.
  repeated Condition element_applies_when = 8;
}

// Condition compares one spec field against a literal. Comparisons read
// the field's EFFECTIVE value (proto getter semantics: an unset scalar
// reads as its zero value, an enum renders its name, a bool renders
// "true"/"false", numbers render as plain decimals); presence checks
// read explicit presence. A string value wrapped in angle brackets is a
// catalog placeholder and reads as unset.
message Condition {
  // Spec-relative snake_case dotted path to the field examined, in the
  // same vocabulary as the cost profile's driver field paths. Inside a
  // rule that expands over a repeated field (LineRule.expand_over) or
  // when any_element_of is set, the path is ELEMENT-relative instead --
  // it starts at the element message, never back at the spec root.
  string field_path = 1;

  // How the field is examined.
  Op op = 2;

  // The literal compared against, for equals / not_equals /
  // starts_with (e.g. "true", "SPOT", "0", "composer-3"). Empty for
  // is_set / is_unset.
  string value = 3;

  // When set, the condition ranges over the elements of this repeated
  // MESSAGE field (spec-relative snake_case dotted path) and holds when
  // ANY element satisfies field_path/op/value read element-relative --
  // the existential form, for billing identities that live inside
  // repeated configuration trees (e.g. "does any WAF rule reference a
  // subscription-bearing managed rule group?"). An empty list satisfies
  // nothing. Leave empty for the ordinary whole-spec form. Not
  // combinable with expand_over's element scope: inside an expanded
  // rule the conditions already read the current element.
  string any_element_of = 4;

  enum Op {
    op_unspecified = 0;
    // The field's effective value renders equal to value.
    equals = 1;
    // The field's effective value renders different from value.
    not_equals = 2;
    // The field carries an explicit value (message present, repeated
    // non-empty, scalar with explicit presence set). A value-or-reference
    // wrapper is set when EITHER arm is populated -- a real literal or a
    // reference to another resource's output: wiring the field by
    // reference IS configuring it, even though the referenced value
    // stays unknowable to comparisons, quantities, and price lookups.
    // A placeholder literal ("<ipam-pool-id>") reads unset.
    is_set = 3;
    // The field carries no explicit value (the mirror of is_set,
    // including the wrapper and placeholder rules above).
    is_unset = 4;
    // The field's effective value begins with value (an exact prefix
    // match on the rendered string; value must be non-empty). For
    // version-family detection where enumerating every member is
    // impossible ("composer-3" catches composer-3.1.2 and every future
    // patch). An unset field renders empty and never matches a
    // non-empty prefix.
    starts_with = 5;
  }
}

// QuantityFactor is one term of a quantity product.
message QuantityFactor {
  oneof factor {
    // A literal decimal string (e.g. "2" for a stated two-AZ minimum
    // whose basis prose defends the assumption).
    string constant = 1;

    // A numeric spec field's value.
    FieldValue field_value = 2;

    // The element count of a repeated spec field (snake_case dotted
    // path), e.g. one public IPv4 address per subnet. Counting is
    // always determinate -- placeholders in the elements do not matter.
    string count_of = 3;

    // The spec's declared hours_per_month, so the one convention has
    // one home. True enables the arm.
    bool hours_in_month = 4;

    // A numeric spec field's value MINUS a stated included allotment,
    // floored at zero -- the excess-over-baseline shape providers bill
    // performance dials with (gp3 IOPS above the included 3,000,
    // throughput above the included 125 MiB/s, scale units above a
    // SKU's included count). Only the excess bills; provisioning at or
    // under the baseline honestly contributes zero, which drops the
    // line entirely.
    SubtractBaseline subtract_baseline = 5;
  }
}

// SubtractBaseline reads a numeric spec field and subtracts the
// provider's included allotment, floored at zero. The baseline is a
// verified fact from the provider's own pricing page -- the basis prose
// states both the provisioned value's origin and the included
// allotment, so the arithmetic audits itself.
message SubtractBaseline {
  // Spec-relative snake_case dotted path to the numeric field carrying
  // the provisioned value (element-relative inside an expanded rule).
  string field_path = 1;

  // The included allotment as a literal decimal string (e.g. "3000"
  // for gp3's included IOPS). Must be positive -- a zero baseline is a
  // plain field_value, not a subtraction.
  string baseline = 2;
}

// FieldValue reads a numeric spec field, with an optional declared
// default for fields the provider defaults when unset.
message FieldValue {
  // Spec-relative snake_case dotted path to the numeric field.
  string field_path = 1;

  // The decimal value assumed when the field reads as its zero value,
  // for fields whose zero is NOT a meaningful configuration and whose
  // provider documents a default (e.g. a disk size the provider
  // defaults). NEVER set this on fields where zero is a real choice
  // (a scale-to-zero floor): a declared default would silently
  // overwrite an honest zero. Empty means the effective value is used
  // as-is.
  string default_when_unset = 2;
}

// PriceLookup selects one price-book entry by decomposed identity
// instead of a hardcoded slug, so the manifest's own values pick the
// price.
message PriceLookup {
  // The provider offering that bills (FOCUS ServiceName), exactly as
  // the kind's cost.yaml declares it. Narrows the candidate
  // entries.
  string service_name = 1;

  // The unit the price must be quoted in (FOCUS PricingUnit).
  string pricing_unit = 2;

  // The attribute values the matching entry must carry, e.g.
  // instance_class from the manifest plus deployment "multi-az" from
  // the rule's own conditions. The lookup is deterministic-or-dead:
  // exactly one entry carries this identity or the estimate refuses.
  repeated AttributeBinding attributes = 3;
}

// AttributeBinding supplies one attribute value for a price lookup.
message AttributeBinding {
  // The attribute key, matching the price-book entry's attributes map
  // (e.g. "instance_class", "engine", "deployment").
  string key = 1;

  oneof value {
    // A literal attribute value, for identity the rule's conditions
    // already fixed (e.g. deployment "multi-az" on the multi_az rule).
    string constant = 2;

    // Spec-relative snake_case dotted path to the field carrying the
    // value (e.g. "instance_class"). A binding on a repeated field
    // resolves only when the list has exactly ONE element -- several
    // elements mean the provider picks among them and the committed
    // rate is indeterminate, which is a refusal, never a first-element
    // guess.
    string from_field = 3;
  }

  // The value assumed when from_field reads as unset, for values a
  // manifest legitimately delegates (a read replica inherits its engine
  // from the source instance) or the provider defaults (an unset storage
  // type). The rule's basis prose MUST state the assumption -- a stated
  // assumption is honest the way the region assumption is; a silent one
  // would be a guess. Leave empty to refuse when the field is unset:
  // wrong-but-labeled beats absent-but-implied, but only when labeled.
  string assumption_when_unset = 4;
}

// ConditionalText is one exclusion or note sentence, optionally scoped
// to the configurations it is true for.
message ConditionalText {
  // The conditions under which the text rides the estimate; ALL must
  // hold; empty means always.
  repeated Condition applies_when = 1;

  // The sentence itself.
  string text = 2;
}
