syntax = "proto3";

package dev.planton.finops.catalogkindcostestimate.v1;

// CatalogKindCostEstimateSpec holds one monthly estimate per catalog preset.
// Authoring contract: every monetary value is a decimal STRING (never a
// YAML float -- floats corrupt cents), every unit price names its source
// URL and retrieval date, and every meter priced here must be declared by
// the kind's cost.yaml (the conformance gate enforces the binding in
// both documents' favor: an estimate cannot price a meter the cost profile
// does not know about).
message CatalogKindCostEstimateSpec {
  // One estimate per preset shipped by the kind, keyed by the preset
  // file stem. Every preset the kind ships should eventually carry an
  // estimate; a preset without one simply renders no price.
  repeated PresetEstimate presets = 1;
}

// PresetEstimate is the monthly list-price estimate for one preset: what
// the preset's manifest values cost per month at published list prices,
// with the usage-dependent dimensions excluded and named.
message PresetEstimate {
  // The preset's file stem under the kind's presets/ directory, e.g.
  // "02-production-ha" for presets/02-production-ha.yaml. The conformance
  // gate fails an estimate whose preset file does not exist.
  string preset = 1;

  // The region whose list prices this estimate uses, e.g. "us-east-1".
  // Cloud list prices vary by region; an estimate is only reproducible
  // with its region pinned. Empty only for cluster-capacity kinds,
  // which price nothing regional.
  string region_assumption = 2;

  // ISO 4217 currency of every monetary value in this estimate ("USD").
  string currency = 3;

  // The hours-in-a-month convention used to convert hourly prices to
  // monthly figures. 730 (365.25 days / 12 months x 24 hours) is the
  // industry convention shared by the major providers' own calculators.
  // Declared explicitly so every quantity below is reproducible.
  int32 hours_per_month = 4;

  // The priced charges, one per metered functionality, ordered largest
  // list_cost first. Empty for cluster-capacity kinds, which carry a
  // capacity_footprint instead of priced lines.
  repeated LineItem line_items = 5;

  // For cluster-capacity kinds only: the cluster resources the preset
  // reserves, stated as capacity rather than dollars. A workload that
  // consumes shares of an existing cluster has no honest dollar figure of
  // its own -- its cost is the cluster's node economics, which this
  // catalog cannot know. Stating capacity is the truthful alternative.
  CapacityFootprint capacity_footprint = 6;

  // Sum of the line items' list_cost values, as a decimal string. The
  // conformance gate re-computes this sum -- the total can never drift
  // from its lines. Empty when capacity_footprint is used.
  string total_list_cost = 7;

  // What this estimate deliberately excludes because no manifest can know
  // it (traffic, request volume, storage growth, cross-AZ transfer).
  // Surfaces rendering the estimate must show these alongside the number.
  repeated string exclusions = 8;

  // Free-form notes on the estimate's assumptions that fit no structured
  // field (free-tier effects, floor-vs-ceiling autoscaling notes).
  string notes = 9;
}

// LineItem prices one metered functionality for one month. Charge identity
// (service_name, sku_meter, pricing_unit) and pricing columns
// (pricing_quantity, list_unit_price, list_cost) follow the FinOps FOCUS
// column semantics, so estimate rows and actual billing rows share one
// vocabulary and can be joined and compared per charge.
message LineItem {
  // The provider offering that bills (FOCUS ServiceName), exactly as the
  // kind's cost.yaml declares it, e.g. "Google Kubernetes Engine".
  string service_name = 1;

  // The functionality being metered (FOCUS SkuMeter). Must match a
  // baseline charge or cost driver sku_meter in the kind's cost.yaml
  // -- the gate rejects an estimate that prices an undeclared meter.
  string sku_meter = 2;

  // The unit the price is quoted in (FOCUS PricingUnit), e.g. "hours",
  // "WCU-hours", "GB-months".
  string pricing_unit = 3;

  // Monthly quantity of pricing_unit consumed, as a decimal string
  // (FOCUS PricingQuantity), e.g. "730" hours, "2190" node-hours.
  string pricing_quantity = 4;

  // How the quantity derives from the preset's manifest values, in one
  // plain sentence (e.g. "3 nodes at the autoscaling floor x 730 hours").
  // This is the estimate's audit trail back to the preset.
  string quantity_basis = 5;

  // The provider's published list price per pricing_unit, as a decimal
  // string (FOCUS ListUnitPrice), e.g. "0.10".
  string list_unit_price = 6;

  // URL of the provider pricing page the unit price was read from.
  string price_source = 7;

  // The date the unit price was read from price_source (YYYY-MM-DD).
  // Prices drift; a dated price is a fact, an undated price is a rumor.
  string retrieved_on = 8;

  // pricing_quantity x list_unit_price, as a decimal string (FOCUS
  // ListCost). The conformance gate re-computes the multiplication
  // exactly; a stale or fudged figure fails CI.
  string list_cost = 9;
}

// CapacityFootprint states what a cluster-capacity preset reserves from
// its cluster, summed across all replicas/instances. Values are Kubernetes
// resource quantities ("2", "500m", "4Gi", "300Gi").
message CapacityFootprint {
  // Total CPU requests across all instances (what the scheduler reserves).
  string cpu_requests = 1;
  // Total memory requests across all instances.
  string memory_requests = 2;
  // Total CPU limits across all instances (the burst ceiling).
  string cpu_limits = 3;
  // Total memory limits across all instances.
  string memory_limits = 4;
  // Total persistent volume storage across all instances, including
  // dedicated WAL/log volumes.
  string persistent_storage = 5;
  // How the totals derive from the preset's manifest values, in one plain
  // sentence (e.g. "3 instances x (1 CPU / 2Gi requests, 100Gi data +
  // 20Gi WAL storage)").
  string basis = 6;
}
