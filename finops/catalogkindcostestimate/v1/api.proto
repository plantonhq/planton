syntax = "proto3";

package dev.planton.finops.catalogkindcostestimate.v1;

import "finops/catalogkindcostestimate/v1/spec.proto";
import "shared/metadata.proto";

// CatalogKindCostEstimate carries a kind's per-preset monthly cost
// estimates at published list prices. It is the VOLATILE half of cost
// knowledge: the kind's cost.yaml declares WHAT bills (the stable
// shape); this document declares what those meters cost TODAY, priced from
// the providers' published list prices. Prices churn, so these documents
// live centrally under catalog/_pricing/estimates/ (one file per kind,
// filename = kind directory name) rather than beside the kind.
// Follows the KRM pattern (apiVersion + kind + metadata + spec).
//
// Honesty contract: every priced line carries the source URL and retrieval
// date of its unit price, every preset states what the estimate excludes,
// and the conformance gate re-computes all arithmetic -- a figure that does
// not equal quantity x unit price, or a total that does not equal the sum
// of its lines, fails CI. Estimates carry FOCUS list-price semantics
// (provider-published, discount-exclusive): the pre-deploy counterpart of
// post-deploy billed/effective cost, joinable on the same charge identity.
//
// Example:
//   apiVersion: finops.planton.dev/v1
//   kind: CatalogKindCostEstimate
//   metadata:
//     name: awsalb
//   spec:
//     presets:
//       - preset: 01-internet-facing
//         region_assumption: us-east-1
//         currency: USD
//         hours_per_month: 730
//         line_items:
//           - service_name: Elastic Load Balancing
//             sku_meter: Application Load Balancer hours
//             pricing_unit: hours
//             pricing_quantity: "730"
//             quantity_basis: one load balancer, billed every hour of the month
//             list_unit_price: "0.0225"
//             price_source: https://aws.amazon.com/elasticloadbalancing/pricing/
//             retrieved_on: "2026-08-14"
//             list_cost: "16.4250"
//         total_list_cost: "16.4250"
//         exclusions:
//           - LCU usage (traffic-dependent)
message CatalogKindCostEstimate {
  string api_version = 1;
  string kind = 2;
  dev.planton.shared.CatalogObjectMetadata metadata = 3;
  CatalogKindCostEstimateSpec spec = 4;
}
