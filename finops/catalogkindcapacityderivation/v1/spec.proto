syntax = "proto3";

package dev.planton.finops.catalogkindcapacityderivation.v1;

import "finops/catalogkindcostderivation/v1/spec.proto";

// CatalogKindCapacityDerivationSpec holds one cluster-capacity kind's
// machine-executable capacity rules: how ANY manifest's spec values become
// the cluster resources the workload reserves (CPU/memory requests and
// limits, persistent volume storage). Cluster-capacity kinds create
// no cloud SKU -- their cost is the share of the target cluster they
// reserve, so the honest manifest-time statement is a capacity footprint,
// never a dollar figure. The estimate generator replays every catalog
// preset through these rules to emit the kind's committed
// CatalogKindCostEstimate (capacity_footprint blocks, no priced lines), and
// the same rules can compute a live manifest's footprint server-side.
// Authoring contract: every field path must resolve against the
// kind's served spec contract, resources paths must name the shared
// ContainerResources message so requests/limits are read by type, and the
// capacity-derivation conformance gate enforces all of it. Conditions and
// conditional prose reuse the cost-derivation schema's vocabulary -- one
// condition grammar across both derivation standards.
message CatalogKindCapacityDerivationSpec {
  // The workloads whose reservations sum into the footprint, one binding
  // per scalable pod class (a database's instances, a coordinator, a
  // worker pool). A kind with several ContainerResources blocks
  // binds each to its own multiplier -- footprints never assume one
  // replica count covers every workload.
  repeated WorkloadBinding workloads = 1;

  // What every footprint this derivation produces deliberately excludes
  // because no manifest can know it (the cluster's node economics,
  // object-store growth). Entries with conditions ride only the
  // estimates whose manifests match, so the exclusions stay
  // configuration-honest. A footprint must never render without its
  // exclusions.
  repeated dev.planton.finops.catalogkindcostderivation.v1.ConditionalText exclusions = 2;

  // Free-form notes on the footprint's assumptions that fit no
  // structured field. Matching notes join in authored order.
  repeated dev.planton.finops.catalogkindcostderivation.v1.ConditionalText notes = 3;
}

// WorkloadBinding states where one workload's reservations live in the
// spec: the ContainerResources block, the instance multiplier, and the
// per-instance persistent volumes.
message WorkloadBinding {
  // The singular noun the basis prose calls one instance of this
  // workload (e.g. "instance", "worker", "coordinator"). Pluralized
  // mechanically in the rendered basis.
  string label = 1;

  // Spec-relative snake_case dotted path to the workload's
  // ContainerResources field (the shared requests/limits message). The
  // gate verifies the terminal field IS that message, so CPU and memory
  // are read by type, never by guessed field names. Empty only for a
  // workload that reserves volumes without a resources block.
  string resources_path = 2;

  // How many instances of this workload the manifest runs -- every
  // resources block and per-instance volume multiplies by it.
  InstanceCount instances = 3;

  // The persistent volumes EACH instance provisions (a data volume, a
  // dedicated WAL volume). A volume whose size path resolves to nothing
  // simply contributes nothing -- optional volumes stay honest without
  // conditions.
  repeated VolumeBinding volumes = 4;
}

// InstanceCount is a workload's instance multiplier: a literal, or a
// numeric spec field with the provider's documented default.
message InstanceCount {
  oneof count {
    // A literal decimal string, for workloads whose multiplicity is
    // fixed by the kind itself (a singleton operator's "1").
    string constant = 1;

    // A numeric spec field carrying the count (e.g. "instances",
    // "replicas"), with default_when_unset for fields the provider
    // defaults -- the same contract as the cost derivation's FieldValue.
    dev.planton.finops.catalogkindcostderivation.v1.FieldValue field_value = 2;
  }
}

// VolumeBinding states where one per-instance volume's size lives.
message VolumeBinding {
  // The short noun the basis prose calls this volume (e.g. "data",
  // "WAL").
  string label = 1;

  // Spec-relative snake_case dotted path to the volume's size field, a
  // Kubernetes quantity string ("100Gi"). An unresolved path (the
  // volume is optional and the manifest omits it) contributes nothing.
  // A PRESENT size on a manifest whose configuration provisions no
  // volume at all is a different case -- gate it with applies_when.
  string size_path = 2;

  // The conditions under which this volume EXISTS; ALL must hold; empty
  // means the volume always binds when its size resolves. For modes
  // that provision no persistent volume regardless of the size field
  // (an ephemeral cluster on emptyDir keeps its disk_size value AND its
  // spec-declared default while binding nothing) -- a size without a
  // volume must contribute nothing, never a fabricated reservation.
  repeated dev.planton.finops.catalogkindcostderivation.v1.Condition applies_when = 3;
}
