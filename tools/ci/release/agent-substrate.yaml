# The Agent Substrate release Planton publishes an install set for
# (tools/ci/release/publish_agent_substrate.sh, run by
# .github/workflows/release.agent-substrate.yaml or from a laptop;
# tools/ci/release/README.md).
#
# Upstream (github.com/agent-substrate/substrate) publishes its release images
# itself from v1.0.0, and no pre-built install. This is the one version the lane
# composes and publishes an install set for: a rehearsal composes and checks it,
# `make release-agent-substrate` tags it, and the lane refuses to publish any
# version that is neither this one nor already published. Adopting a new
# upstream release moves this line, in the change whose rehearsal proves the
# new version composes.
version: v1.0.0
# The release whose install this one shares (images.json's `shape`): the
# control-plane module composes exactly one shape, and installs any published
# release of it when a customer sets the kind's version. A release equal to
# `version` is a new shape, which the module must be adapted to before anyone
# can install it. A release claiming an earlier shape is published only when
# its install is that shape's apart from its images, which the lane proves
# (compose_agent_substrate_release.py, "The install shape").
shape: v1.0.0
# Where upstream publishes the release's images, by name and tag
# (docs/dev/releasing.md, "Release images", at the release's tag). The install
# set pins each one by the digest that registry serves.
repository: ghcr.io/agent-substrate/substrate
