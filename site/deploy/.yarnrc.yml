# The deploy jobs check out site/deploy alone, without site/.yarnrc.yml, so this
# package names its own linker. Under Yarn's default (Plug'n'Play) wrangler reads
# the export through PnP's patched fs, whose readdir ignores `recursive` -- the
# first deploy uploaded the 77 top-level files and none of the pages beneath them.
nodeLinker: node-modules
