syntax = "proto3";

package dev.planton.iac.providerimportcatalog.v1;

import "iac/providerimportcatalog/v1/spec.proto";
import "shared/metadata.proto";

// ProviderImportCatalog declares, per provider, the import-ID format of every
// IaC resource type the provider's kinds import by. Follows the KRM
// pattern (apiVersion + kind + metadata + spec).
// Lives at catalog/{provider}/aa_import/catalog.yaml.
//
// Example:
//   apiVersion: iac.planton.dev/v1
//   kind: ProviderImportCatalog
//   metadata:
//     name: aws
//   spec:
//     resource_types:
//       - terraform_type: aws_s3_bucket
//         pulumi_type: aws:s3/bucketV2:BucketV2
//         id_format: "{bucket}"
message ProviderImportCatalog {
  string api_version = 1;
  string kind = 2;
  dev.planton.shared.CatalogObjectMetadata metadata = 3;
  ProviderImportCatalogSpec spec = 4;
}
