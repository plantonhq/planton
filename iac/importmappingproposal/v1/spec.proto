syntax = "proto3";

package dev.planton.iac.importmappingproposal.v1;

import "google/protobuf/struct.proto";

// ImportMappingProposalSpec is the structured answer a mapper gives to the
// question "how does this set of discovered provider resources map into Planton
// kinds?". It is the contract between any proposer -- a deterministic
// mapper today, an AI mapping agent later -- and everything downstream that
// consumes a mapping: the eval scorer that grades proposals against a known
// ground truth, and the review surfaces a human approves before anything is
// created.
//
// Two invariants shape this contract:
//
//  1. Proposed resources are MANIFESTS, not a parallel encoding. The import
//     journey's end product is KRM manifests, so a proposal carries exactly
//     the manifests it proposes (apiVersion/kind/metadata/spec), with
//     value_from references inside the spec where they belong. There is no
//     second schema to drift out of sync with the real one, and validating a
//     proposal reuses the same typed-kind parsing every manifest already
//     goes through.
//
//  2. Every discovered resource is accounted for, honestly. Each proposed
//     manifest CLAIMS the account resources it covers, and everything the
//     proposer could not map lands in unmapped with a reason. Import
//     coverage can never exceed catalog coverage; this contract makes the
//     gap explicit ("178 of 214 resources map") instead of silent.
message ImportMappingProposalSpec {
  // The proposed component instances. Order carries no meaning; creation
  // ordering is derived downstream from the value_from reference graph.
  repeated ProposedResource resources = 1;

  // Discovered account resources the proposer examined but could not map to
  // any Planton kind -- the honest remainder.
  repeated UnmappedAccountResource unmapped = 2;
}

// ProposedResource is one proposed Planton component instance: the manifest
// that would be created, plus the accounting of which discovered account
// resources it covers.
message ProposedResource {
  // The full proposed KRM manifest (apiVersion, kind, metadata, spec) as a
  // dynamic document. It must parse into the kind's typed api message with
  // no unknown fields -- the loader enforces this, so a malformed proposal
  // fails at the contract, never downstream. value_from references between
  // proposed instances address each other by metadata.name and may only
  // target names present in this proposal (or resources already managed by
  // the platform); a dangling reference is a contract violation because it
  // would fail resolution at the first infra-job build.
  google.protobuf.Struct manifest = 1;

  // The discovered account resources this instance accounts for. A claim
  // says "creating this manifest and importing its state covers that provider
  // resource". Claims are how grouping quality is measured: the scorer
  // compares an instance's claims against the resources its ground-truth
  // counterpart actually owns. Instances are matched by kind plus claim
  // overlap -- never by name, since a blind proposer cannot know what an
  // account's owners called things internally.
  repeated AccountResourceClaim claims = 2;

  // Optional short explanation of why these resources were grouped into
  // this instance (which signal drove the grouping). Surfaces in review;
  // never scored.
  string rationale = 3;
}

// AccountResourceClaim identifies one discovered account resource by the
// same coordinates the read-only inventory scan reports: the CloudFormation
// type name and the type's primary identifier.
message AccountResourceClaim {
  // CloudFormation resource type name, e.g. "AWS::S3::Bucket".
  string type_name = 1;
  // The type's primary identifier as reported by the scan (e.g. the bucket
  // name, "vpc-0abc...", a queue URL). Compound identifiers join segments
  // with "|" in the type's schema order.
  string identifier = 2;
}

// UnmappedAccountResource records one discovered account resource the
// proposer could not map, with the reason -- no Planton kind covers it, an
// ambiguous grouping the proposer declined to guess, or a resource that is
// implicitly created by the cloud provider and deliberately not modeled
// (e.g. a VPC's main route table).
message UnmappedAccountResource {
  // CloudFormation resource type name.
  string type_name = 1;
  // The type's primary identifier.
  string identifier = 2;
  // Why this resource is not part of any proposed instance.
  string reason = 3;
}
