# Preset-validity baseline -- the accepted backlog of presets that fail their
# own kind's validation rules: presets authored before validity was
# machine-enforced and not yet brought to the bar. Each provider's sweep burns
# its entries down; the list trends to 0 and never grows.
#
# The CI guardrail (go test ./pkg/presetvalidity/...) fails when:
#   - a violation appears that is NOT listed here (a preset shipped invalid), or
#   - a listed entry is no longer a violation (it was fixed -- remove it here).
#
# Entry format: <repo-relative preset yaml path>:<rule>   (see pkg/presetvalidity rule constants)
# Regenerate with:  PLANTON_REGEN_PRESET_VALIDITY_BASELINE=1 go test ./pkg/presetvalidity/
violations:
  - catalog/azure/azurelocalnetworkgateway/presets/01-static-site.yaml:invalid-preset
  - catalog/azure/azurelocalnetworkgateway/presets/02-bgp-site.yaml:invalid-preset
  - catalog/azure/azureprivatelinkservice/presets/02-fixed-destination-ip.yaml:invalid-preset
  - catalog/azure/azurevirtualnetworkgatewayconnection/presets/01-site-to-site.yaml:invalid-preset
  - catalog/azure/azurevirtualnetworkgatewayconnection/presets/02-custom-ipsec-policy.yaml:invalid-preset
  - catalog/gcp/gcpcloudrun/presets/03-gpu-inference.yaml:invalid-preset
  - catalog/gcp/gcpfirewallrule/presets/01-ingress-allow-web.yaml:invalid-preset
  - catalog/gcp/gcpfirewallrule/presets/02-ingress-allow-ssh-iap.yaml:invalid-preset
  - catalog/gcp/gcpfirewallrule/presets/03-egress-deny-all.yaml:invalid-preset
  - catalog/gcp/gcpgkeworkloadidentitybinding/presets/01-standard.yaml:invalid-preset
  - catalog/gcp/gcpglobaladdress/presets/01-external-static-ip.yaml:invalid-preset
  - catalog/gcp/gcpglobaladdress/presets/02-internal-vpc-peering-range.yaml:invalid-preset
