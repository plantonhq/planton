# The CSIDriverConfig custom resource definition (ate.dev/v1alpha1) as Agent
# Substrate v0.6.0 publishes it -- the release whose install shape
# KubernetesAgentSubstrate composes, and the one the
# KubernetesAgentSubstrateCsiDriverConfig spec mirrors. It is upstream's own
# generated definition, byte for byte from its first document (the file's
# license header and leading separator dropped):
#
#   git show v0.6.0:manifests/ate-install/generated/ate.dev_csidriverconfigs.yaml
#
# in github.com/agent-substrate/substrate (the same document Planton's
# published crds.yaml for v0.6.0 carries). Never edit it by hand; replace it
# from a newer tag to move the pin.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: csidriverconfigs.ate.dev
spec:
  group: ate.dev
  names:
    kind: CSIDriverConfig
    listKind: CSIDriverConfigList
    plural: csidriverconfigs
    shortNames:
    - csidriverconfig
    singular: csidriverconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.driverName
      name: Driver
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CSIDriverConfig is the Schema for the csidriverconfigs API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of CSIDriverConfig
            properties:
              controllerEndpoint:
                description: |-
                  controllerEndpoint is the gRPC endpoint for the CSI Controller service.
                  Must be a valid network URI (e.g. dns:///csi-service:9000 or tcp://127.0.0.1:9000).
                pattern: ^(tcp|dns)://.+$
                type: string
              driverName:
                description: |-
                  driverName is the standard CSI driver name (e.g. "hostpath.csi.k8s.io").
                  Matches the StorageClass referenced in ActorTemplate volume definitions.
                maxLength: 63
                minLength: 1
                pattern: ^(substrate\.io/)?([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)$
                type: string
              nodeSocketOverride:
                description: |-
                  nodeSocketOverride is an optional override for the CSI Node service socket
                  on the worker nodes. If empty, ATE defaults to unix:///var/lib/kubelet/plugins/[DriverName]/csi.sock.
                pattern: ^unix://.+$
                type: string
              tls:
                description: tls configures TLS/mTLS for the connection to the ControllerEndpoint.
                properties:
                  enabled:
                    description: enabled controls whether TLS is used.
                    type: boolean
                  serverName:
                    description: |-
                      serverName specifies the expected server name (SAN) for TLS certificate verification.
                      Required when TLS is enabled.
                    type: string
                  usePodIdentity:
                    description: usePodIdentity indicates whether to reuse Substrate's
                      Pod Identity (SPIFFE) certificates.
                    type: boolean
                required:
                - enabled
                type: object
                x-kubernetes-validations:
                - message: tls.usePodIdentity must be true when tls.enabled is true;
                    manual certificates are not yet supported
                  rule: '!self.enabled || (has(self.usePodIdentity) && self.usePodIdentity)'
                - message: tls.serverName is required when tls.enabled is true
                  rule: '!self.enabled || (has(self.serverName) && size(self.serverName)
                    > 0)'
            required:
            - controllerEndpoint
            - driverName
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
