# Price-provenance baseline -- the dollar tokens the prose scanner accepts.
#
# `allowed` is PERMANENT and hand-curated: user-chosen dollar values that
# illustrate a dollar-typed configuration field (a budget limit, an alert
# threshold -- the user's number, never a provider rate), and non-price tokens
# the scanner cannot distinguish (regex backreferences like "/v2/$1"). Every
# entry carries its reason as a comment beside it. Regeneration preserves it.
#
# `gaps` is the BURN-DOWN backlog: hand-typed prices that have not been
# rewritten to driver-teaching copy yet. It trends to 0 and never grows.
# Prices belong in exactly one place -- catalog/_pricing/ (pinned price books
# and generated estimates, source-dated). Prose teaches cost DRIVERS.
#
# The CI guardrail (go test ./pkg/priceprovenance/...) fails when:
#   - a dollar token appears that is in neither list (a new hand-typed price
#     shipped -- rewrite it to teach the driver, or, ONLY for a user-chosen
#     dollar-typed config example, add it to allowed with its reason), or
#   - a listed entry no longer matches anything (it was fixed or the file
#     moved -- remove it here so both lists stay truthful).
#
# Entry format: <repo-relative path>:<token>
# Regenerate gaps with:  PLANTON_REGEN_PRICE_BASELINE=1 go test ./pkg/priceprovenance/
allowed:
  # AwsCostAnomalyMonitor is a dollar-typed kind: the alert threshold IS
  # a user-chosen dollar value (ANOMALY_TOTAL_IMPACT_ABSOLUTE), not a rate.
  - "catalog/aws/awscostanomalymonitor/GUIDE.md:$100"
  - "catalog/aws/awscostanomalymonitor/presets/01-service-monitor.md:$100"
  - "catalog/aws/awscostanomalymonitor/presets/02-custom-slice-monitor.md:$50"
  - "catalog/aws/awscostanomalymonitor/v1alpha1/reference.md:$100"
  # CloudflareAiGateway's preset configures a user-chosen daily spend cap;
  # the doc explicitly tells the reader to change it.
  - "catalog/cloudflare/cloudflareaigateway/presets/01-guarded-gateway.md:$50"
  # Regex backreferences in listener-rule rewrite examples ("/v2/$1"), not prices.
  - "catalog/aws/awslblistenerrule/presets/01-path-based-routing.md:$1"
  - "catalog/aws/awslblistenerrule/v1alpha1/reference.md:$1"
  # Regex capture group in ExternalSecret JSON-extraction templates, not a price.
  - "catalog/kubernetes/kubernetesexternalsecret/catalog.md:$1"
  - "catalog/kubernetes/kubernetesexternalsecret/presets/02-extract-json-document.md:$1"
  - "catalog/kubernetes/kubernetesexternalsecret/v1alpha1/reference.md:$1"
  # Prometheus relabeling replacement capture groups ("$1"), not prices.
  - "catalog/kubernetes/kubernetespodmonitor/v1alpha1/reference.md:$1"
  - "catalog/kubernetes/kubernetesservicemonitor/v1alpha1/reference.md:$1"
  # nginx rewrite-target annotation syntax ("/$2"), not a price.
  - "catalog/kubernetes/kubernetesingress/README.md:$2"
  - "catalog/kubernetes/kubernetesingress/v1alpha1/reference.md:$2"
  # bcrypt htpasswd hash syntax ("$2y$10$7O40..." -> $2/$10/$7), not prices.
  - "catalog/kubernetes/kubernetesloki/v1alpha1/reference.md:$10"
  - "catalog/kubernetes/kubernetesloki/v1alpha1/reference.md:$2"
  - "catalog/kubernetes/kubernetesloki/v1alpha1/reference.md:$7"
gaps: []
