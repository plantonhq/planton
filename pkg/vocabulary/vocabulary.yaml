# Planton's vocabulary: the words this repository uses for Planton's own
# concepts, and the spellings it does not use.
#
# One idea has one word, the same in the console, the CLI, the API, the docs
# and the code, so a platform engineer, a developer and an agent never meet
# two names for one thing. The words follow the industry's own picture: an
# InfraChart installs into an environment as an InfraStack of InfraComponents,
# an InfraPipeline runs one InfraJob per InfraComponent, and the catalog holds
# catalog kinds whose instances are catalog objects.
#
# pkg/vocabulary reads this file. Its whole-tree test (go test
# ./pkg/vocabulary/..., the lint.vocabulary lane) fails on any spelling under
# `retired` or `phrases` that is not inside an `allow` span.
#
#   words    the current words, with what each one means.
#   retired  spellings matched case-insensitively in every case form: the
#            entry CloudResource also matches cloudResource, cloud_resource,
#            CLOUD_RESOURCE, cloud-resource, cloudresource and "cloud
#            resource", anywhere in a line, including inside longer
#            identifiers. `use` says what to write instead, by meaning.
#   phrases  retired names and shapes matched as RE2 regular expressions.
#            `anchors` lists lowercase literals of which every match holds
#            one; the scan tries the pattern only on lines that hold one. A
#            space in an anchor stands for an optional separator (none, a
#            space, _ or -).
#   allow    spans that contain a retired spelling but are someone else's
#            word (a vendor's API, a vendor's type, a vendor's CLI). `paths` (optional)
#            scopes an allowance to repository paths (globs; ** crosses
#            directories). Never add an allowance for a Planton word.
#   exclude  repository paths never scanned: third-party trees and vendors'
#            manifests and CRDs vendored verbatim, and this package's own files.

words:
  - name: CatalogKind
    means: A type of thing the catalog offers (AwsS3Bucket, GcpGkeCluster). Its schema is a proto message; its enum value names are permanent.
  - name: CatalogObject
    means: One instance document of a catalog kind (apiVersion, kind, metadata, spec), as written in a manifest.
  - name: CatalogObjectMetadata
    means: The metadata block every catalog object carries.
  - name: CatalogProvider
    means: The provider a catalog kind belongs to (AWS, GCP, Kubernetes, Cloudflare).
  - name: CatalogProviderServiceGroup
    means: A provider's own grouping of its services (AWS Networking, GCP Compute).
  - name: CatalogKindPreset
    means: A ready starting configuration for one catalog kind.
  - name: CatalogObjectManifest
    means: One rendered catalog object, as an InfraChart or a deployment produces it.
  - name: InfraCatalog
    means: The catalog of catalog kinds and InfraCharts an organization can deploy.
  - name: InfraChart
    means: A parameterized template of catalog objects, installable into an environment.
  - name: InfraStack
    means: One InfraChart installed into one environment.
  - name: InfraComponent
    means: One deployed instance of a catalog kind, in one environment.
  - name: InfraPipeline
    means: One run of one operation (deploy or undeploy) over an InfraStack.
  - name: InfraJob
    means: The IaC work for exactly one InfraComponent (init, refresh, preview, then apply or destroy, or a state operation).
  - name: IacInput
    means: What an IaC module receives for one InfraComponent (<Kind>IacInput, read under planton:iac-input).
  - name: Outputs
    means: What an IaC module returns for one InfraComponent (<Kind>Outputs, held in status.outputs).
  - name: Promotion Path
    means: "One product line's way through its organization's environments: named, ordered stages (dev → {demo, prod}). An organization's Promotion Paths are one record, the PromotionPathSet kind (id ppset_<ulid>). A service follows the paths its environments sit on, a stack its environment's; an environment on no path is never guessed into an order. Never \"promotion order\" or \"deployment order\" for it. planton promotion-path."
  - name: stage
    means: "A set of environments at one point in a Promotion Path; each comes after every environment of the stages before it, and the environments inside one stage (siblings) have no order among them. Never one environment's tile: that is an environment on a Delivery Path."
  - name: Promote
    means: Carry one environment's live template and chart version to the same stack in another environment of its Promotion Path (the same name on the same path is the same stack); that environment keeps its own values. planton infra stack promote.
  - name: Roll Back
    means: Plan an earlier revision's declaration again, fresh against today's cloud, as a new revision; module versions stay current. planton infra stack rollback.
  - name: Upgrade
    means: Move a stack to its catalog chart's newest version, keeping its values and the files it customised; a file both changed asks Keep Mine or Take vN. planton infra stack upgrade.
  - name: Compare
    means: "Two environments of a stack, or two of its revisions, side by side: values first, then the template's distance, then files. planton infra stack diff."
  - name: Revisions
    means: A stack's history of applied plans (r1, r2, ...), newest first, each with where it came from; Roll Back and Compare start here.
  - name: Not Applied
    means: "A stage of a stack that has nothing applied: never applied, or undeployed since. Never \"Nothing applied\" or \"Never Applied\"."

retired:
  - spelling: CloudResource
    use: CatalogKind for the type, InfraComponent for one deployed instance, CatalogObjectMetadata for the metadata block, CatalogProvider for the provider
  - spelling: CloudObject
    use: CatalogObject (CatalogObjectManifest for one rendered object, CatalogKindPreset for a preset)
  - spelling: CloudCatalog
    use: InfraCatalog
  - spelling: CloudProviderServiceGroup
    use: CatalogProviderServiceGroup
  - spelling: StackInput
    use: IacInput (<Kind>IacInput; the module reads it under planton:iac-input)
  - spelling: StackOutput
    use: Outputs (<Kind>Outputs)
  - spelling: StackJob
    use: InfraJob
  - spelling: StackExecute
    use: IacExecute
  - spelling: InfraProject
    use: InfraStack
  - spelling: crkreflect
    use: catalogkindreflect
  # What Planton itself provides is "platform"; the platform's preset-proof
  # helper names say so (platformPresetSlugs, platformPresetSpec).
  - spelling: OfficialPreset
    use: platform preset (platformPresetSlugs, platformPresetSpec)
  # An environment's order is where the organization's Promotion Paths place
  # it, never a number on the environment.
  - spelling: PromotionRank
    use: the environment's stage on its Promotion Path (planton promotion-path, PromotionPathSet)

phrases:
  # "Component" names one deployed InfraComponent and nothing else. These are
  # the names that once used it for a catalog kind.
  - pattern: '(?i)component[ _-]?(cost[ _-]?profile|control[ _-]?profile|e2e[ _-]?profile|permissions|import[ _-]?map|cost[ _-]?estimate|cost[ _-]?derivation|capacity[ _-]?derivation)'
    anchors: ['component cost', 'component control', 'component e2e', 'component permissions', 'component import', 'component capacity']
    use: CatalogKind (CatalogKindCostProfile, CatalogKindControlProfile, CatalogKindE2EProfile, CatalogKindPermissions, CatalogKindImportMap, ...)
  - pattern: '(?i)e2e-component'
    anchors: ['e2e-component']
    use: e2e-catalog-kind
  - pattern: '(?i)\b(catalog|deployment|cloud)[ _-]components?'
    anchors: ['catalog component', 'deployment component', 'cloud component']
    use: catalog kind
  - pattern: '(?i)(forge|audit|update|complete|fix|delete|rename|localize|write|create)-planton-component'
    anchors: ['-planton-component']
    use: <verb>-catalog-kind
  - pattern: '_rules/component\b'
    anchors: ['_rules/component']
    use: _rules/catalog-kind
  - pattern: 'architecture/component\.md'
    anchors: ['architecture/component']
    use: architecture/catalog-kind.md
  - pattern: 'runAllScenariosForComponent'
    anchors: ['runallscenariosforcomponent']
    use: runAllScenariosForKind
  - pattern: '(?i)\b[0-9,]+\+ components\b'
    anchors: ['+ components']
    use: <N>+ catalog kinds
  - pattern: '(?i)lego[ _-]?blocks?'
    anchors: ['lego block']
    use: catalog kinds
  # What Planton itself provides -- its modules, charts and presets -- is
  # "platform". "Official" stays only as another company's word: a vendor's
  # official Helm chart, image or icon.
  - pattern: '(?i)\bofficial[ _-]?((iac|pulumi|opentofu|terraform|tofu)[ _-]?)?modules?\b'
    anchors: ['official module', 'official iac', 'official pulumi', 'official opentofu', 'official terraform', 'official tofu', 'officialmodule']
    use: platform module (the IaC modules Planton ships in its release)
  - pattern: '(?i)\bofficial[ _-]?(presets?|chart[ _-]?fleet|catalog)\b|org \+ official'
    anchors: ['official preset', 'official chart', 'official catalog', 'org + official']
    use: platform preset / platform chart / platform catalog
  # ...including with a kind named between ("every official AwsVpc preset",
  # "the official kubernetestrino modules").
  - pattern: '(?i)\bofficial [a-z0-9]+ (presets?|modules?)\b'
    anchors: ['official ']
    use: platform <Kind> preset / platform <kind> modules
  # A new organization deploys with OpenTofu; Pulumi is an organization's own
  # choice, never Planton's default.
  - pattern: '(?i:\bpulumi \(default\)|\bpulumi is the (platform )?default\b)'
    anchors: ['pulumi (default)', 'pulumi is the']
    use: OpenTofu by default; Pulumi when the organization chooses it
  # Retired ID shapes. An InfraComponent ID is ic_<kind id prefix>_<ulid>, an
  # InfraJob ID ij_<ulid>, an InfraStack ID infstk_<ulid>, an InfraPipeline ID
  # infpipe_<ulid>.
  - pattern: '(?i)\b(cr|sj|infpj|infproj)_([a-z0-9]+_)?[0-9a-hjkmnp-tv-z]{26}\b'
    anchors: ['cr_', 'sj_', 'infpj_', 'infproj_']
    use: ic_<kind id prefix>_<ulid> for an InfraComponent, ij_<ulid> for an InfraJob, infstk_<ulid> for an InfraStack
  - pattern: '\b(cr|sj|infpj|infproj)_(<|\{|\.\.\.|…|[0-9][0-9A-Za-z]{0,24}…)'
    anchors: ['cr_', 'sj_', 'infpj_', 'infproj_']
    use: ic_, ij_ or infstk_
  - pattern: '`(cr|sj|infpj|infproj)_`'
    anchors: ['cr_', 'sj_', 'infpj_', 'infproj_']
    use: '`ic_`, `ij_` or `infstk_`'
  - pattern: '["''](cr|sj|infpj|infproj)_["'']'
    anchors: ['cr_', 'sj_', 'infpj_', 'infproj_']
    use: the ID prefix ic_, ij_ or infstk_
  # An InfraStack is never a "project": that word belongs to Google Cloud,
  # Pulumi, a repository's project root and a company's projects. These are
  # the shapes that used it for the deployed stack.
  - pattern: '(?i)\bdeployed[ _-]projects?\b'
    anchors: ['deployed project']
    use: deployed Infra Stack
  - pattern: '\.planton/project\.yaml'
    anchors: ['.planton/project.yaml']
    use: .planton/stack.yaml (stackId, stackName)
  - pattern: '\bplanton projects? (create|get|list|delete|apply|checkout|undeploy|purge)\b'
    anchors: ['planton project']
    use: planton infra stack <verb>; planton chart install creates one
  # Every IaC-execution setting.
  - pattern: '(?i)\bstack[_-]execution[_-]'
    anchors: ['stack_execution', 'stack-execution']
    use: IAC_EXECUTION_ (iac-execution- in kebab case)
  # A resource its stack lets go of keeps running on its provider -- AWS,
  # Stripe, Auth0, a cluster -- which is rarely "the cloud". The object may
  # be named ("Keeping a Resource in the Cloud").
  - pattern: '(?i)keep[-_ ]?in[-_ ]?cloud|kept[-_ ]?in[-_ ]?cloud|\b(keeps?|kept|keeping) (it |them |running |each |(an? |the |this |that )?resources? )?in the cloud'
    anchors: ['keep in cloud', 'kept in cloud', 'in the cloud']
    use: planton.dev/keep-on-provider; Keep and Kept, named by the provider ("Keep in Stripe", "Kept in AWS")

  # No name is ever typed, ticked or passed to destroy, replace or approve
  # infrastructure: one consent rule covers every destroy (asked at a
  # terminal; --yes, confirm or a reviewed digest ahead). Typing a name stays
  # only for deleting an organization, an environment or a service account.
  - pattern: '(?i)\btyp(e|es|ed|ing)\s+(its|each|their)\s+names?\s+to\s+(destroy|approve|replace)\b'
    anchors: ['its name', 'each name', 'their name']
    use: one consent rule (asks at a terminal; --yes, confirm or a reviewed digest answers ahead)
  - pattern: '(?i)<type [A-Za-z0-9]+/'
    anchors: ['<type ']
    use: Kind/name with --keep, or --yes for every Destroy and Replace
  - pattern: '(?i)named[ _-]?consent'
    anchors: ['named consent']
    use: consent (--yes, confirm, or a reviewed digest)
  - pattern: '(?i)holds data a (destroy|replace)'
    anchors: ['holds data a']
    use: what a destroyed or replaced resource holds does not come back
  - pattern: '(?i)consents? to no destroy'
    anchors: ['to no destroy']
    use: --yes consents to every Destroy and Replace

allow:
  # Dated changelog entries keep the words of their day; history is never
  # rewritten. Every newer entry speaks "platform module".
  - pattern: '(?i)official[ _-]?(iac[ _-]?)?modules?'
    paths:
      - '_changelog/2026-09/2026-09-16-003000-the-platform-downloads-official-modules-at-its-own-catalog-release-and-the-operator-stops-naming-one.md'
      - '_changelog/2026-09/2026-09-27-060000-a-secret-a-resource-generates-is-declared-and-kept-secret.md'
      - '_changelog/2026-10/2026-10-17-020000-every-release-publishes-its-modules-checksums-and-builds-them-reproducibly.md'
    reason: dated changelog entries written before Planton's modules were called platform modules
  # Current words followed by an ordinary word, which would otherwise read as
  # a retired spelling: the InfraStack Input tab, an InfraStack job, and an
  # InfraComponent's cost estimate.
  - pattern: '(?i)infra[ _-]?stack (inputs?|outputs?|jobs?|execute)'
    reason: InfraStack followed by an ordinary word
  - pattern: '(?i)infra[ _-]?component[ _-]?cost[ _-]?estimate'
    reason: an InfraComponent's cost estimate
  - pattern: '(?i)cloud[ _-]?resource[ _-]?manager'
    reason: Google Cloud's Resource Manager API (cloudresourcemanager.googleapis.com)
  - pattern: '(?i)google[ _-]?cloud[ _-]?resource'
    reason: Google's own resource-name type in workload identity and BigQuery
  - pattern: '(?i)cloud[ _-]?resource[ _-]?service[ _-]?account'
    reason: the service account BigQuery creates for a Cloud Resource connection
  - pattern: '(?i)gcp[ _-]?big[ _-]?query[ _-]?connection[ _-]?cloud[ _-]?resource|cloud[ _-]?resource[ _-]?(connection|arm)|\bcloud_resource\b|\bcloudResource\b|\bGetCloudResource\b|\bCloudResource\b|\bConnectionCloudResource\w*|biglake-cloud-resource|scenarios/cloud-resource'
    paths: ['**/gcpbigqueryconnection/**', '**/gcpdatastreamstream/**', 'catalog/gcp/aa_e2e/verify/bigquery_connection.go']
    reason: BigQuery's own Cloud Resource connection type, its field, its REST key, the files named after it, and the Datastream stream that writes through one
  - pattern: '(?i)cloud_?resource'
    paths: ['catalog/gcp/gcpbigqueryconnection/v1alpha1/*.pb.go']
    reason: the same BigQuery field as protoc encodes it in the generated descriptor, where an escape sequence runs into the name
  - pattern: '(?i)\b(google|hetzner|alibaba|ali|oracle|ibm|tencent|huawei|sap|civo|scaleway|ovh|vultr|linode|akamai)[ _-]?cloud[ _-]?(resources?|objects?|catalogs?|components?)'
    reason: a provider whose name ends in Cloud (Google Cloud, Hetzner Cloud, Alibaba Cloud), followed by the provider's own word
  - pattern: '(?i)\b(open|cloud|dev|local)stack[ _-]?(inputs?|outputs?|jobs?)'
    reason: OpenStack, CloudStack, DevStack and LocalStack followed by an ordinary word
  - pattern: '(?i)solr[ _-]?cloud[ _-]?resources?'
    reason: Apache Solr's SolrCloud custom resource
  - pattern: '(?i)barman[ _-]?cloud[ _-]?object'
    reason: CloudNativePG's Barman Cloud object store
  - pattern: '(?i)cloud[ _-]?object[ _-]?stor'
    reason: the industry's own phrase for object storage in the cloud
  - pattern: '(?i)multi[ _-]?cloud[ _-]?catalog'
    reason: the multi-cloud-catalog skill's name
  - pattern: '(?i)pulumi stack output'
    reason: the Pulumi CLI's own command
  - pattern: '(?i)kube[ _-]?prometheus[ _-]?stack[ _-]?outputs?'
    reason: the kube-prometheus-stack chart's name, as in the kind KubernetesKubePrometheusStack and its KubernetesKubePrometheusStackOutputs

exclude:
  - 'pkg/vocabulary/**'
  - 'operator/internal/resources/manifests/**'
  - 'operator/config/crd/**'
  - 'helm/**/crds/**'
  - 'pkg/kubernetes/helmcrds/testdata/**'
  - 'pkg/kubernetes/kubernetestypes/**'
  - 'pkg/iac/actioninventory/*.yaml'
  - 'pkg/providerparity/schemas/**'
