# -- Planton Runner Helm Chart values.
# See README.md for full documentation.

image:
  # -- Container image repository.
  repository: ghcr.io/plantonhq/planton/runner
  # -- Container image tag: the runner release this pod runs. Empty falls back
  # to the chart's appVersion, the runner line this chart was validated
  # against; the KubernetesPlantonRunner kind always sets it to the release
  # the enrolling instance runs (a runner and its control plane move together).
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Optional image pull secrets for private registries.
imagePullSecrets: []

# -- Override the release name prefix used in resource names.
nameOverride: ""
# -- Override the full resource name (disables prefix generation).
fullnameOverride: ""

# Runner enrollment -- the runner token that authorizes this runner to JOIN
# the control plane. The token is never the runner's identity: on first boot
# the runner presents it to the public join door, registers itself, and
# receives its own individually revocable identity document, which it
# persists on the pod's identity volume. Create a token with:
#   planton runner token create <token-name>
enrollment:
  # -- The runner token (prt_ prefixed). Required unless existingSecret is set.
  # Provide via: helm install ... --set enrollment.token=prt_...
  token: ""

  # -- The runner's name in your organization. The runner registers itself
  # under this name on arrival. Empty uses the Helm release name.
  runnerName: ""

  # -- Control-plane gRPC endpoint the runner joins (host:port). Empty uses
  # the runner's built-in hosted default (api.live.planton.ai:443); set it
  # for self-hosted or local instances.
  endpoint: ""

  # -- Use a pre-existing Kubernetes Secret holding the token instead of
  # creating one. When set, enrollment.token is ignored and no Secret is
  # created by the chart.
  existingSecret: ""

  # -- Key within the existing Secret that holds the token.
  # Only used when existingSecret is set.
  existingSecretKey: "token"

# Runner operational settings (independent of enrollment).
runner:
  # -- The runner's gRPC port. CloudOps reaches it through the tunnel when the
  # enrolling instance operates one, and it serves the standard gRPC health
  # service in every execution mode, which is what the pod's probes dial.
  port: 50051
  # -- Log level: debug, info, warn, error.
  logLevel: "info"
  # -- Execution mode: auto, grpc, temporal, dual. "auto" derives the mode
  # from the identity document the runner receives when it enrolls and from
  # its perimeter: a Temporal address with a tunnel is dual (deploys and
  # builds over Temporal, live cloud operations over the tunnel); a Temporal
  # address without one -- every runner enrolled with a self-hosted instance,
  # which operates no runner tunnel -- is temporal, a pure worker. Set an
  # explicit mode only to override; "grpc" also switches the readiness probe
  # to the overall health service, since a grpc-only runner runs no worker.
  executionMode: "auto"

# Temporal worker settings -- an OVERRIDE lane only. The identity document
# the runner receives at enrollment already carries the instance's
# runner-reachable Temporal coordinates; set these only to point the worker
# somewhere else.
temporal:
  # -- Temporal server address (host:port) override.
  address: ""
  # -- Temporal namespace override.
  namespace: "default"
  # -- Maximum concurrent Temporal activities.
  maxConcurrency: 10

# Build capability -- this runner executes build pipelines on its own cluster:
# it creates Tekton PipelineRuns, streams task pod logs to the control plane,
# receives Tekton CloudEvents on its webhook, and serves readiness probes.
# Requires Tekton Pipelines installed on the cluster and executionMode
# temporal or dual (the build worker is a Temporal worker).
build:
  # -- Enable the pipeline-build worker and the Tekton CloudEvents webhook.
  # Rendered explicitly either way so the deployment states its contract:
  # a runner without builds must not run a webhook that nothing should call.
  enabled: false

  # -- Namespace where build PipelineRuns land when a build connection leaves
  # placement empty, and the namespace the log streamer watches. Empty uses
  # the runner's own namespace. Exactly ONE build-capable runner may watch a
  # Tekton namespace (the log streamer is a singleton per namespace).
  tektonNamespace: ""

  # -- Port the Tekton CloudEvents webhook listens on inside the container.
  webhookPort: 8086

  rbac:
    # -- Create the Role/RoleBinding the build capability needs in the build
    # namespace (create PipelineRuns and supporting resources, reconcile by
    # list, label-scoped cleanup, follow task pod logs), plus the read grant
    # on Tekton's config-defaults ConfigMap that makes the events-sink
    # readiness check conclusive.
    create: true

  tekton:
    # -- Namespace of the Tekton Pipelines installation (where its cluster-wide
    # config-defaults ConfigMap lives). Tekton's installer pins this name.
    installNamespace: "tekton-pipelines"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

serviceAccount:
  # -- Create a Kubernetes ServiceAccount for the runner pod.
  create: true
  # -- Annotations for the ServiceAccount (e.g., for IRSA or Workload Identity).
  annotations: {}
  # -- Override the ServiceAccount name. Defaults to the release fullname.
  name: ""

# -- Additional labels to apply to all resources.
commonLabels: {}

# -- Additional annotations for the Deployment pod template.
podAnnotations: {}

# -- Node selector for pod scheduling.
nodeSelector: {}

# -- Tolerations for pod scheduling.
tolerations: []

# -- Affinity rules for pod scheduling.
affinity: {}
