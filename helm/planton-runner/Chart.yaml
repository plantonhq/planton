apiVersion: v2
name: planton-runner
description: Deploy Planton Runner with a runner token -- the runner enrolls itself on first boot and receives its own identity from the control plane
type: application
# version is stamped at release time from the chart's tag
# (helm/planton-runner/vX.Y.Z); the value below marks a checkout as a
# development build.
version: 0.0.0-dev
# appVersion is the runner release this chart was validated against, and the
# image tag a bare `helm install` runs. It is a pin, not this chart's own
# version: the runner image is built in the platform repo and published to
# ghcr.io/plantonhq/planton/runner, so it moves deliberately when a new runner
# line is published. The KubernetesPlantonRunner kind overrides it with the
# release the enrolling instance runs. v0.0.69 is the first runner line that
# derives a pure-worker mode for an instance without a runner tunnel; this
# chart's gRPC probes assume it (an older runner on a tunnel-less instance
# binds its webhook to loopback and is not made whole by the probes alone).
# v0.0.75 is the first line that carries its jobs to their end through the
# control plane's door, the only road this chart's instances now route a
# remote runner's work calls on, and that pre-creates a build's ConfigMaps
# under the verbs this chart's build Role grants.
appVersion: "v0.0.75"
home: https://github.com/plantonhq/planton
sources:
  - https://github.com/plantonhq/planton
maintainers:
  - name: Planton
    url: https://planton.ai
keywords:
  - planton
  - runner
  - cloud-operations
  - enrollment
  - runner-token
  - tunnel
