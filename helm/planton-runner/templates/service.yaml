{{- if .Values.build.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "planton-runner.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "planton-runner.labels" . | nindent 4 }}
spec:
  # ClusterIP only, and only when builds are enabled: the runner receives its
  # deploy work through the reverse tunnel or its Temporal queues, not through
  # Kubernetes networking, so this Service exists for exactly one caller --
  # Tekton, posting pipeline CloudEvents to the webhook. Health is probed on
  # the pod (see deployment.yaml), and a Service with no ports is invalid, so
  # a runner without builds renders no Service at all.
  type: ClusterIP
  selector:
    {{- include "planton-runner.selectorLabels" . | nindent 4 }}
  ports:
    # The Tekton CloudEvents webhook, kept for one more release for instances
    # whose control plane predates the run watcher: a sink pointed at
    # http://<this-service>.<namespace>.svc.cluster.local/service-hub/tekton/cloud-event
    # still works and is redundant beside the watch (served on port 80 so the
    # URL needs no explicit port; the path is required, the webhook serves
    # only that route). Live build status no longer depends on it.
    - name: webhook
      port: 80
      targetPort: webhook
      protocol: TCP
{{- end }}
