{{- include "planton-runner.validateBuild" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "planton-runner.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "planton-runner.labels" . | nindent 4 }}
spec:
  # Always exactly 1 replica: a runner's identity is individually minted for
  # ONE live instance -- a second pod joining under the same name would
  # revoke the first pod's key (token lineage: re-admission re-mints and
  # revokes). The runner also maintains a stateful tunnel connection, and
  # when builds are enabled the build log streamer is a singleton per
  # watched Tekton namespace.
  replicas: 1
  # Recreate, not RollingUpdate: a rolling surge would briefly run two pods
  # under one runner name, and the surged pod's join revokes the old pod's
  # key while it still serves. Terminate first, then start fresh -- the new
  # pod re-joins with the token and receives a fresh identity.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "planton-runner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.enrollment.existingSecret }}
        checksum/token: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "planton-runner.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "planton-runner.serviceAccountName" . }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: runner
          image: {{ include "planton-runner.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "start"
          env:
            # Enrollment contract: the runner joins with the token on first
            # boot and persists the identity document it receives at the
            # configured path (the writable identity volume below). Container
            # restarts find it there and skip the join; a pod recreated
            # without its volume simply re-joins -- the same token re-admits
            # its own runner with a fresh key.
            - name: PLANTON_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "planton-runner.tokenSecretName" . }}
                  key: {{ include "planton-runner.tokenSecretKey" . }}
            - name: PLANTON_RUNNER_NAME
              value: {{ include "planton-runner.runnerName" . | quote }}
            {{- if .Values.enrollment.endpoint }}
            - name: PLANTON_RUNNER_ENDPOINT
              value: {{ .Values.enrollment.endpoint | quote }}
            {{- end }}
            - name: PLANTON_RUNNER_CREDENTIALS_FILE
              value: "/var/lib/planton-runner/credentials.json"
            - name: PORT
              value: {{ .Values.runner.port | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.runner.logLevel | quote }}
            - name: EXECUTION_MODE
              value: {{ .Values.runner.executionMode | quote }}
            {{- if .Values.temporal.address }}
            - name: TEMPORAL_SERVICE_ADDRESS
              value: {{ .Values.temporal.address | quote }}
            - name: TEMPORAL_NAMESPACE
              value: {{ .Values.temporal.namespace | quote }}
            - name: TEMPORAL_MAX_CONCURRENCY
              value: {{ .Values.temporal.maxConcurrency | quote }}
            {{- end }}
            # Build capability: rendered explicitly BOTH ways so the deployment
            # states its contract. The two flags flip together -- a build
            # cluster needs the Tekton CloudEvents webhook, and a runner
            # without builds must not run a webhook nothing should call.
            - name: BUILD_WORKER_ENABLED
              value: {{ .Values.build.enabled | quote }}
            - name: WEBHOOK_ENABLED
              value: {{ .Values.build.enabled | quote }}
            {{- if .Values.build.enabled }}
            - name: WEBHOOK_PORT
              value: {{ .Values.build.webhookPort | quote }}
            {{- if .Values.build.tektonNamespace }}
            # Build placement: PipelineRuns whose build connection names no
            # namespace land here, and the log streamer watches exactly this
            # namespace. Empty falls back to the runner's own namespace.
            - name: TEKTON_NAMESPACE
              value: {{ .Values.build.tektonNamespace | quote }}
            {{- end }}
            {{- end }}
          ports:
            # The runner's port serves the standard gRPC health service in
            # EVERY execution mode (the CloudOps server's in grpc/dual, a
            # health-only server's in temporal), so it is the one probe target
            # a chart that cannot know the runner's mode can rely on.
            - name: grpc
              containerPort: {{ .Values.runner.port }}
              protocol: TCP
            # The tunnel agent's health and metrics ports. They exist only when
            # the identity document carries a tunnel endpoint (an instance that
            # operates a runner tunnel); a runner enrolled with a self-hosted
            # instance opens neither. Declared for what they are, never probed.
            - name: health
              containerPort: 8093
              protocol: TCP
            - name: admin
              containerPort: 8094
              protocol: TCP
            {{- if .Values.build.enabled }}
            - name: webhook
              containerPort: {{ .Values.build.webhookPort }}
              protocol: TCP
            {{- end }}
          # Probes ride the gRPC health service on the runner's port -- the
          # same contract the operator's in-cluster runner uses, so every
          # runner is probed one way whatever its tunnel. A gRPC probe names a
          # port number, not a named port.
          #
          # Readiness gates on the IaC worker's health key: SERVING once the
          # worker is actually polling its Temporal queue, not merely once the
          # port is bound. An explicit grpc mode runs no worker and never
          # registers that key, so it is probed on the overall service instead;
          # auto derives grpc only from a document that names no deploy queue,
          # which no current instance issues -- a runner meant to be grpc-only
          # says so in runner.executionMode.
          readinessProbe:
            grpc:
              port: {{ .Values.runner.port }}
              {{- if ne .Values.runner.executionMode "grpc" }}
              service: ai.planton.runner.iac.worker
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness probes only the overall health service, never the worker
          # key: a Temporal outage must read as "not ready", never as a
          # kill-and-restart loop of a healthy process.
          livenessProbe:
            grpc:
              port: {{ .Values.runner.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Writable identity volume: the runner persists the identity
            # document it receives at enrollment here, so container restarts
            # within the pod's lifetime reuse it instead of re-joining.
            - name: identity
              mountPath: /var/lib/planton-runner
      volumes:
        - name: identity
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
