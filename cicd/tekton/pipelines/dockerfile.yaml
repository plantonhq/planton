# The platform's dockerfile build track: clone, build with BuildKit
# (daemon-less), export the rendered Dockerfile, and render kustomize
# overlays. Task references are plain Tekton name refs -- the compiler
# resolves them from the embedded task catalog and inlines them; nothing
# here is ever resolved cluster-side.
#
# ConfigMap-writing tasks receive $(context.pipelineRun.namespace) so the
# compiled pipeline is target-neutral: it writes into whatever namespace
# the run executes in, never a hardcoded one.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: dockerfile
spec:
  description: >
    Build and push a container image from a Dockerfile, and render the
    service's kustomize overlays.
  params:
    - name: git-url
      type: string
      description: "The Git URL to clone"
    - name: git-revision
      type: string
      description: "Git revision to checkout"
      default: "main"
    - name: git-branch
      type: string
      description: "Git branch name"
      default: ""
    - name: image-name
      type: string
      description: "The full destination image (registry/repo:tag)"
    - name: build-context
      type: string
      description: "Docker build context directory, repository-root-relative (dispatch supplies the service's build.dockerfile.context, defaulting to its project root)"
    - name: dockerfile-path
      type: string
      description: "Relative path to your Dockerfile inside the build context"
      default: "Dockerfile"
    - name: kustomize-manifests-config-map-name
      type: string
      description: "Name of the config-map to store service manifests generated by kustomize"
    - name: project-root
      type: string
      description: "Relative path to the project's root inside the cloned repo"
      default: "."
    - name: sparse-checkout-directories
      type: string
      description: "list of comma separated directory patterns to git-clone Task's sparseCheckoutDirectories param"
      default: ""
    - name: kustomize-base-directory
      type: string
      description: "Relative path to the kustomize base directory inside project root"
      default: "_kustomize"
    - name: dockerfile-config-map-name
      type: string
      description: "Name of the config-map to store dockerfile content"
    - name: owner-identifier-label-key
      type: string
      description: Optional owner identifier label key to add to the ConfigMap
      default: ""
    - name: owner-identifier-label-value
      type: string
      description: Optional owner identifier label value
      default: ""
    # An optional fact the platform supplies only because this pipeline
    # declares it: the platform(s) the deploy target runs (os/arch,
    # comma-separated when several). Empty means the build machine's own.
    # BuildKit builds for the target, emulating when the machine differs; the
    # run records which, from the build-node-architecture result.
    - name: target-platform
      type: string
      description: "The platform(s) the image must be built for, e.g. linux/amd64 -- the deploy target's, supplied by the platform; empty builds for the build machine's own"
      default: ""

    # An optional fact the platform supplies only because this pipeline
    # declares it: one stable reference the build cache lives at (the image's
    # repository, tag buildcache), so a build tagged per commit still reads
    # the last build's layers. Empty keeps the task's own default.
    - name: cache-image
      type: string
      description: "A stable reference for the build cache, e.g. registry/repo:buildcache -- supplied by the platform; empty keeps the default"
      default: ""
    # An optional fact the runner supplies only because this pipeline
    # declares it: when the registry sign-in it minted for this build expires
    # (Unix seconds), so a push refused after that moment says so.
    - name: registry-sign-in-expires-at
      type: string
      description: "When the registry sign-in this build pushes with expires, as Unix seconds -- supplied by the runner; empty when it outlives any build"
      default: ""
    # An optional fact the platform supplies only because this pipeline
    # declares it: the release's tag when this build is a tag release
    # (v1.4.0), empty otherwise. The build task also names the image by it.
    - name: git-tag
      type: string
      description: "The release's tag for a tag release, e.g. v1.4.0 -- supplied by the platform; empty for every other build"
      default: ""

  workspaces:
    - name: source
      description: "Workspace where source code is cloned"

  tasks:
    - name: git-checkout
      taskRef:
        name: git-clone
      params:
        - name: url
          value: "$(params.git-url)"
        - name: revision
          value: "$(params.git-revision)"
        - name: deleteExisting
          value: "true"
        - name: sparseCheckoutDirectories
          value: "$(params.sparse-checkout-directories)"
        - name: gitInitImage
          value: "ghcr.io/tektoncd/github.com/tektoncd/pipeline/cmd/git-init:v0.45.0@sha256:8ab0f58d8381b0b71f5b2bae1f63522989d739e3154d8cab1bacfa0ef5317214"
      workspaces:
        - name: output
          workspace: source

    - name: build-image
      runAfter:
        - git-checkout
      taskRef:
        name: buildkit-daemonless
      params:
        - name: image
          value: "$(params.image-name)"
        - name: platforms
          value: "$(params.target-platform)"
        # The Docker context is its own param, deliberately NOT project-root:
        # a monorepo service can live in its own directory (project-root, the
        # trigger and kustomize base) while its image builds from a wider
        # context (e.g. the repository root, when the Dockerfile copies
        # shared libraries from across the repo).
        - name: contextDir
          value: "$(params.build-context)"
        - name: dockerfilePath
          value: "$(params.dockerfile-path)"
        - name: cache
          value: "true"
        - name: cacheImage
          value: "$(params.cache-image)"
        - name: registrySignInExpiresAt
          value: "$(params.registry-sign-in-expires-at)"
        - name: releaseTag
          value: "$(params.git-tag)"
        - name: dockerfile-config-map-namespace
          value: "$(context.pipelineRun.namespace)"
        - name: dockerfile-config-map-name
          value: "$(params.dockerfile-config-map-name)"
        - name: owner-identifier-label-key
          value: "$(params.owner-identifier-label-key)"
        - name: owner-identifier-label-value
          value: "$(params.owner-identifier-label-value)"
      workspaces:
        - name: source
          workspace: source

    - name: kustomize-build
      runAfter:
        - git-checkout
      taskRef:
        name: kustomize-build
      params:
        - name: config-map-name
          value: "$(params.kustomize-manifests-config-map-name)"
        - name: config-map-namespace
          value: "$(context.pipelineRun.namespace)"
        - name: project-root
          value: "$(params.project-root)"
        - name: kustomize-base-directory
          value: "$(params.kustomize-base-directory)"
        - name: owner-identifier-label-key
          value: "$(params.owner-identifier-label-key)"
        - name: owner-identifier-label-value
          value: "$(params.owner-identifier-label-value)"
      workspaces:
        - name: source
          workspace: source
