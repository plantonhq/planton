apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildkit-daemonless
spec:
  description: >
    Build and push OCI‑compatible images using BuildKit in daemon‑less mode.

  # ------------------------------ parameters -----------------------------
  params:
    - name: image                  # registry/repo:tag
      type: string
    - name: contextDir             # build context directory
      type: string
      default: "."
    - name: dockerfilePath         # Dockerfile relative to contextDir
      type: string
      default: "Dockerfile"
    - name: platforms              # e.g. linux/amd64,linux/arm64
      type: string
      default: ""
    - name: cache                  # "true" ➜ reuse the last build's layers
      type: string
      default: "true"
    - name: cacheImage             # registry/repo:buildcache, or empty
      type: string
      description: >-
        One stable reference the build cache lives at (the image's own
        repository, tag buildcache), so every build of the image reads the
        layers the last one wrote whatever its own tag. Empty keeps the cache
        inline in the pushed image, which a build tagged per commit never
        finds again.
      default: ""
    - name: registrySignInExpiresAt  # Unix seconds, or empty
      type: string
      description: >-
        When the registry sign-in this build pushes with stops being
        accepted, as Unix seconds; empty when it outlives any build. A push
        the registry refuses after that moment says so, with both times.
      default: ""
    - name: releaseTag             # v1.4.0, or empty
      type: string
      description: >-
        The release's tag when this build is a tag release (v1.4.0); empty
        otherwise. A tag that is also a valid image tag names the pushed image
        too, on the same digest, so the registry answers "which image is
        v1.4.0". A tag an image cannot carry (release/1.4) is said and left
        off: the image keeps its commit's name only.
      default: ""
    - name: push                   # "true" ➜ push to registry
      type: string
      default: "true"
    - name: buildArgs              # each line KEY=value
      type: string
      default: ""
    - name: buildkitImage          # override only if needed
      type: string
      default: "moby/buildkit:v0.23.2-rootless@sha256:cab936745de5d673465948f1e93ff4d6e372bbe33f218afd3314eba45a6f85a9"
    # --- new parameters ---
    - name: dockerfile-config-map-name
      type: string
      description: Name of the ConfigMap that will store the Dockerfile content.
    - name: dockerfile-config-map-namespace
      type: string
      description: Namespace in which to create/update the ConfigMap. Callers
        pass the run's own namespace -- there is deliberately no default, so
        a build can never write into a namespace it does not execute in.
    - name: owner-identifier-label-key
      type: string
      description: Optional owner identifier label key to add to the ConfigMap
      default: ""
    - name: owner-identifier-label-value
      type: string
      description: Optional owner identifier label value
      default: ""

  # ------------------------------ workspaces -----------------------------
  workspaces:
    - name: source                 # mandatory source workspace
      description: Source code
    - name: dockerconfig           # optional registry creds
      optional: true
      description: Holds .docker/config.json

  # ------------------------------ results --------------------------------
  results:
    - name: image-digest
      description: >-
        The content digest (sha256:…) of the image this build pushed, as
        BuildKit reported it -- what a deployment pins, so re-pushing the tag
        never changes what runs. Empty when the build did not push.
    - name: build-node-architecture
      description: >-
        The architecture of the machine this build ran on (amd64, arm64), as
        the pod itself saw it. Read beside the platforms the image was built
        for, it says whether the build ran native or emulated.
    - name: release-tag
      description: >-
        The release tag this build also pushed the image under, on the same
        digest; empty when it pushed none (not a tag release, a tag no image
        can carry, or no push).

  # ------------------------------ steps ---------------------------------
  steps:
    # ------------------- export Dockerfile ---------------------
    - name: export-dockerfile
      image: bitnamilegacy/kubectl:latest@sha256:cd354d5b25562b195b277125439c23e4046902d7f1abc0dc3c75aad04d298c17
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        dockerfile_path="$(workspaces.source.path)/$(params.contextDir)/$(params.dockerfilePath)"
        if [[ ! -f "$dockerfile_path" ]]; then
          echo "Dockerfile not found at $dockerfile_path"
          exit 1
        fi

        echo "Creating/updating ConfigMap '$(params.dockerfile-config-map-name)'..."
        encoded="$(base64 -w 0 "$dockerfile_path")"

        kubectl create configmap "$(params.dockerfile-config-map-name)" \
          --namespace "$(params.dockerfile-config-map-namespace)" \
          --from-literal=Dockerfile="$encoded" \
          --dry-run=client -o yaml | kubectl apply -f -

        if [[ -n "$(params.owner-identifier-label-key)" && -n "$(params.owner-identifier-label-value)" ]]; then
          kubectl label configmap "$(params.dockerfile-config-map-name)" \
            --namespace "$(params.dockerfile-config-map-namespace)" \
            "$(params.owner-identifier-label-key)=$(params.owner-identifier-label-value)" --overwrite
        fi

    # ------------------- build and push image ---------------------
    - name: build-and-push
      image: "$(params.buildkitImage)"
      workingDir: "$(workspaces.source.path)/$(params.contextDir)"
      securityContext:
        privileged: true          # required even for rootless image
      # BuildKit's layer store lives on a pod volume, not inside the step's own
      # root filesystem. A container's root filesystem is already an overlay
      # mount, and the kernel refuses an overlay whose upper directory sits on
      # another overlay; BuildKit would then fall back to fuse-overlayfs, whose
      # mounts the executor cannot always run build steps on (nested Docker
      # environments fail with exit code 255) and which is slower everywhere.
      # An emptyDir sits on the node's real filesystem, so the auto-detected
      # snapshotter is plain overlayfs on every cluster shape.
      volumeMounts:
        - name: layers-dir
          mountPath: /var/lib/buildkit
      env:
        - name: DOCKER_CONFIG
          value: "$(workspaces.dockerconfig.path)"
      script: |
        #!/usr/bin/env sh
        set -eux

        # This step's own image is multi-arch, so it runs on the node's real
        # architecture even when the image it is about to build is emulated
        # -- which is exactly why its word about the machine can be trusted.
        case "$(uname -m)" in
          x86_64) node_arch=amd64 ;;
          aarch64|arm64) node_arch=arm64 ;;
          *) node_arch="$(uname -m)" ;;
        esac
        printf '%s' "$node_arch" > "$(results.build-node-architecture.path)"

        extra_opts=""

        [ -n "$(params.platforms)" ] && \
          extra_opts="$extra_opts --opt platform=$(params.platforms)"

        if [ "$(params.cache)" = "true" ] && [ -n "$(params.cacheImage)" ]; then
          # A registry that refuses the cache reference never fails the build.
          extra_opts="$extra_opts --import-cache type=registry,ref=$(params.cacheImage) \
            --export-cache type=registry,ref=$(params.cacheImage),mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true"
        elif [ "$(params.cache)" = "true" ]; then
          extra_opts="$extra_opts --export-cache type=inline \
            --import-cache type=registry,ref=$(params.image)"
        fi

        # A tag release also names the image by its release, on the same
        # digest -- one push, two names. Docker's tag grammar is narrower
        # than git's, so a tag an image cannot carry is said, never mangled.
        names="$(params.image)"
        release_tag=""
        if [ -n "$(params.releaseTag)" ]; then
          if printf '%s' "$(params.releaseTag)" | grep -qE '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            repository="$(printf '%s' "$(params.image)" | sed 's|:[^:/]*$||')"
            names="$names,$repository:$(params.releaseTag)"
            release_tag="$(params.releaseTag)"
          else
            echo "The release tag $(params.releaseTag) isn't a valid image tag (letters, digits, '_', '.' and '-', up to 128), so the image is pushed under its commit only." >&2
          fi
        fi

        printf '%s\n' "$(params.buildArgs)" | while IFS= read -r arg; do
          [ -z "$arg" ] || extra_opts="$extra_opts --opt build-arg:$arg"
        done

        # Use modern dockerfile frontend (v1) for proper ARG variable expansion
        # The legacy dockerfile.v0 has known bugs with ARG expansion in COPY instructions
        # See: https://github.com/moby/buildkit/issues/2374
        # The build's output streams to the step log as it runs and is kept,
        # so a refused push can be read afterwards.
        log=/tmp/build.log
        mkfifo /tmp/build.fifo
        tee "$log" < /tmp/build.fifo &
        tee_pid=$!
        set +e
        buildctl-daemonless.sh build \
          --frontend=gateway.v0 \
          --opt source=docker/dockerfile:1 \
          --opt filename=$(params.dockerfilePath) \
          --local context=$(workspaces.source.path)/$(params.contextDir) \
          --local dockerfile=$(workspaces.source.path)/$(params.contextDir) \
          $extra_opts \
          --output "type=image,\"name=$names\",push=$(params.push)" \
          --metadata-file /tmp/build-metadata.json \
          --progress=plain > /tmp/build.fifo 2>&1
        status=$?
        set -e
        wait "$tee_pid"

        if [ "$status" -ne 0 ]; then
          set +x
          # A push refused after the sign-in Planton made for this build
          # expired: say both moments, and the way out.
          expires="$(params.registrySignInExpiresAt)"
          if [ -n "$expires" ] && grep -qiE '401 unauthorized|unauthorized:|authentication required' "$log"; then
            if [ "$(date -u +%s)" -ge "$expires" ]; then
              echo "The registry sign-in Planton made when this build started expired at $(date -u -d "@$expires" '+%H:%M UTC'), before the push at $(date -u '+%H:%M UTC'). Give the registry connection its own key (a service-account key or an access token), which outlives any build, or shorten the build so it pushes within the hour the sign-in lasts." >&2
            fi
          fi
          exit "$status"
        fi

        # What was pushed, by its digest: a build that pushed and cannot name
        # its image fails here, where the fact is born, rather than deploy by
        # a tag anyone can re-push.
        if [ "$(params.push)" = "true" ]; then
          digest="$(sed -n 's/.*"containerimage\.digest": *"\(sha256:[0-9a-f]\{64\}\)".*/\1/p' /tmp/build-metadata.json | head -n 1)"
          if [ -z "$digest" ]; then
            set +x
            echo "BuildKit pushed $(params.image) but reported no image digest, so this build cannot name the image it produced; nothing deploys an image it cannot name." >&2
            exit 1
          fi
          printf '%s' "$digest" > "$(results.image-digest.path)"
          printf '%s' "$release_tag" > "$(results.release-tag.path)"
        else
          printf '' > "$(results.image-digest.path)"
          printf '' > "$(results.release-tag.path)"
        fi

  volumes:
    - name: layers-dir
      emptyDir: {}
