---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildpacks
  labels:
    app.kubernetes.io/version: "0.6"
  annotations:
    tekton.dev/categories: Image Build
    tekton.dev/pipelines.minVersion: "0.17.0"
    tekton.dev/tags: image-build
    tekton.dev/displayName: "Buildpacks"
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    The Buildpacks task builds source into a container image and pushes it to a registry,
    using Cloud Native Buildpacks.

  workspaces:
    - name: source
      description: Directory where application source is located.
    - name: cache
      description: Directory where cache is stored (when no cache image is provided).
      optional: true
    - name: dockerconfig
      description: >-
        An optional workspace that allows providing a .docker/config.json file
        for Buildpacks lifecycle binary to access the container registry.
        The file should be placed at the root of the Workspace with name config.json.
      optional: true

  params:
    - name: APP_IMAGE
      description: The name of where to store the app image.
    - name: BUILDER_IMAGE
      description: The image on which builds will run (must include lifecycle and compatible buildpacks).
    - name: SOURCE_SUBPATH
      description: A subpath within the `source` input where the source to build is located.
      default: ""
    - name: ENV_VARS
      type: array
      description: Environment variables to set during _build-time_.
      default: []
    - name: PROCESS_TYPE
      description: The default process type to set on the image.
      default: "web"
    - name: RUN_IMAGE
      description: Reference to a run image to use.
      default: ""
    - name: CACHE_IMAGE
      description: The name of the persistent app cache image (if no cache workspace is provided).
      default: ""
    - name: SKIP_RESTORE
      description: Do not write layer metadata or restore cached layers.
      default: "false"
    - name: USER_ID
      description: The user ID of the builder image user.
      default: "0"
    - name: GROUP_ID
      description: The group ID of the builder image user.
      default: "0"
    - name: PLATFORM_DIR
      description: The name of the platform directory.
      default: empty-dir
    - name: TARGET_PLATFORM
      description: >-
        The platform(s) the image must be built for (os/arch, comma-separated
        when several), or empty for the build machine's own. The Buildpacks
        lifecycle builds for the builder image's architecture and nothing
        else, and the builder this task pins exists for linux/amd64 only --
        so any other target is refused before the build starts, in plain
        words, rather than producing an image the target cannot run.
      default: ""

  results:
    - name: image-digest
      description: >-
        The content digest (sha256:…) of the image this build pushed, as the
        lifecycle reported it -- what a deployment pins, so re-pushing the tag
        never changes what runs.
    - name: APP_IMAGE_DIGEST
      description: The digest of the built `APP_IMAGE`.
    - name: APP_IMAGE_URL
      description: The URL of the built `APP_IMAGE`.
    - name: build-node-architecture
      description: >-
        The architecture of the machine this build ran on (amd64, arm64), as
        the pod itself saw it. Read beside the platform the image was built
        for, it says whether the build ran native or emulated -- on an arm64
        machine the Buildpacks track always runs emulated.

  stepTemplate:
    env:
      - name: CNB_PLATFORM_API
        value: "0.9"

  steps:
    - name: prepare
      image: docker.io/library/bash:5.1.4@sha256:c523c636b722339f41b6a431b44588ab2f762c5de5ec3bd7964420ff982fb1d9
      args:
        - "--env-vars"
        - "$(params.ENV_VARS[*])"
      script: |
        #!/usr/bin/env bash
        set -e

        # This step's image is multi-arch, so it runs on the node's real
        # architecture even though the builder step that follows may be
        # emulated -- its word about the machine is the trustworthy one.
        case "$(uname -m)" in
          x86_64) node_arch=amd64 ;;
          aarch64|arm64) node_arch=arm64 ;;
          *) node_arch="$(uname -m)" ;;
        esac
        printf '%s' "$node_arch" > "$(results.build-node-architecture.path)"

        # The builder image exists for linux/amd64 only, so that is the only
        # platform this track can honestly build. Refuse anything else here,
        # before a single layer is pulled, naming the two ways out.
        case "$(params.TARGET_PLATFORM)" in
          ""|linux/amd64) ;;
          *)
            echo "The Buildpacks build makes linux/amd64 images only -- the builder image this platform pins exists for no other architecture. This service targets $(params.TARGET_PLATFORM): switch it to a Dockerfile build, or change the target's platform."
            exit 1
            ;;
        esac

        if [[ "$(workspaces.cache.bound)" == "true" ]]; then
          echo "> Setting permissions on '$(workspaces.cache.path)'..."
          chown -R "$(params.USER_ID):$(params.GROUP_ID)" "$(workspaces.cache.path)"
        fi

        for path in "/tekton/home" "/layers" "$(workspaces.source.path)"; do
          echo "> Setting permissions on '$path'..."
          chown -R "$(params.USER_ID):$(params.GROUP_ID)" "$path"

          if [[ "$path" == "$(workspaces.source.path)" ]]; then
              chmod 775 "$(workspaces.source.path)"
          fi
        done

        echo "> Parsing additional configuration..."
        parsing_flag=""
        envs=()
        for arg in "$@"; do
            if [[ "$arg" == "--env-vars" ]]; then
                echo "-> Parsing env variables..."
                parsing_flag="env-vars"
            elif [[ "$parsing_flag" == "env-vars" ]]; then
                envs+=("$arg")
            fi
        done

        echo "> Processing any environment variables..."
        ENV_DIR="/platform/env"

        echo "--> Creating 'env' directory: $ENV_DIR"
        mkdir -p "$ENV_DIR"

        for env in "${envs[@]}"; do
            IFS='=' read -r key value <<< "$env"
            if [[ "$key" != "" && "$value" != "" ]]; then
                path="${ENV_DIR}/${key}"
                echo "--> Writing ${path}..."
                echo -n "$value" > "$path"
            fi
        done
      volumeMounts:
        - name: layers-dir
          mountPath: /layers
        - name: $(params.PLATFORM_DIR)
          mountPath: /platform


    - name: create
      image: $(params.BUILDER_IMAGE)
      imagePullPolicy: Always
      command: ["/cnb/lifecycle/creator"]
      env:
        - name: DOCKER_CONFIG
          value: $(workspaces.dockerconfig.path)
      args:
        - "-app=$(workspaces.source.path)/$(params.SOURCE_SUBPATH)"
        - "-cache-dir=$(workspaces.cache.path)"
        - "-cache-image=$(params.CACHE_IMAGE)"
        - "-uid=$(params.USER_ID)"
        - "-gid=$(params.GROUP_ID)"
        - "-layers=/layers"
        - "-platform=/platform"
        - "-report=/layers/report.toml"
        - "-process-type=$(params.PROCESS_TYPE)"
        - "-skip-restore=$(params.SKIP_RESTORE)"
        - "-previous-image=$(params.APP_IMAGE)"
        - "-run-image=$(params.RUN_IMAGE)"
        - "$(params.APP_IMAGE)"
      volumeMounts:
        - name: layers-dir
          mountPath: /layers
        - name: $(params.PLATFORM_DIR)
          mountPath: /platform
      securityContext:
        runAsUser: 0
        runAsGroup: 0

    - name: results
      image: docker.io/library/bash:5.1.4@sha256:c523c636b722339f41b6a431b44588ab2f762c5de5ec3bd7964420ff982fb1d9
      script: |
        #!/usr/bin/env bash
        set -e
        digest="$(grep "digest" /layers/report.toml | cut -d'"' -f2 | tr -d '\n')"
        # A build that pushed and cannot name its image fails here, where the
        # fact is born, rather than deploy by a tag anyone can re-push.
        if [ -z "$digest" ]; then
          echo "The lifecycle pushed $(params.APP_IMAGE) but reported no image digest, so this build cannot name the image it produced; nothing deploys an image it cannot name." >&2
          exit 1
        fi
        printf '%s' "$digest" | tee "$(results.APP_IMAGE_DIGEST.path)"
        printf '%s' "$digest" > "$(results.image-digest.path)"
        echo -n "$(params.APP_IMAGE)" | tee "$(results.APP_IMAGE_URL.path)"
      volumeMounts:
        - name: layers-dir
          mountPath: /layers

  volumes:
    - name: empty-dir
      emptyDir: {}
    - name: layers-dir
      emptyDir: {}
