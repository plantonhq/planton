syntax = "proto3";

package dev.planton.compliance.catalogkindcontrolprofile.v1;

// CatalogKindControlProfileSpec lists the kind's posture per control.
// Authoring contract: EVERY control in the central catalog appears exactly
// once -- use not_applicable (with a reason in notes) rather than omission
// when a control genuinely cannot apply. An omitted control is
// indistinguishable from an unexamined one, and this profile's value is
// that every control WAS examined; the conformance gate enforces
// completeness.
message CatalogKindControlProfileSpec {
  repeated ControlPosture controls = 1;
}

// ControlPosture is the kind's stance on one catalog control.
message ControlPosture {
  // The control's id in the central control catalog
  // (catalog/_compliance/controls-catalog.yaml). Must exist there -- the
  // conformance gate enforces it.
  string control_id = 1;
  // Whether the official modules enforce, expose, or cannot express the
  // control.
  Status status = 2;
  // The spec field that turns the control on/off or tunes it. Required when
  // status is configurable; spec-relative proto field path (snake_case,
  // dot-separated), validated against the served version's descriptors.
  string field_path = 3;
  // Why the claim is true. Required for enforced_by_default and
  // configurable -- an evidence-free posture claim is marketing, not data.
  Evidence evidence = 4;
  // Free-form context: for not_applicable, WHY it cannot apply (required);
  // for configurable, which presets enable it; caveats a security reviewer
  // should hear.
  string notes = 5;
}

// Status is the kind's enforcement stance on a control.
enum Status {
  status_unspecified = 0;
  // The official modules (or the provider itself) enforce the control on
  // every deployment; no spec choice can disable it.
  enforced_by_default = 1;
  // The control is a spec choice: field_path names the field, and notes
  // should say which presets enable it.
  configurable = 2;
  // The control has no meaning for this kind class (e.g. "automated
  // backup" for a stateless load balancer). notes must say why.
  not_applicable = 3;
}

// Evidence is the verifiable ground for a posture claim.
message Evidence {
  // What kind of ground backs the claim.
  Type type = 1;
  // The pointer a reviewer follows to verify: the module behavior described
  // in one sentence (module_default), the provider guarantee in one
  // sentence (provider_default), the spec field and its declared default
  // (spec_default), or the scanner check id (scanner_check).
  string reference = 2;
}

// Type classifies where evidence comes from.
enum Type {
  type_unspecified = 0;
  // The official IaC modules hardcode the posture (verified in module
  // source).
  module_default = 1;
  // The cloud provider guarantees the posture for this resource class;
  // it cannot be disabled at any configuration level.
  provider_default = 2;
  // The spec field's declared default value produces the posture; deviating
  // requires an explicit spec choice.
  spec_default = 3;
  // A policy scanner check asserts the posture on the preset-rendered
  // configuration (check id in reference). Generated evidence lands with
  // the scanner integration; hand-authored profiles use the other types.
  scanner_check = 4;
  // A validation rule on the spec makes contrary configuration
  // unrepresentable -- the strongest spec-side evidence (e.g. a rule
  // requiring at least two subnets in different zones). reference names
  // the rule.
  spec_validation = 5;
}
