# =============================================================================
# Definitions Release (Reusable Workflow)
# =============================================================================
# Packages the definition trees (skills/, agents/, automations/) into a
# definitions release and uploads it to Cloudflare R2 (downloads.planton.ai):
# one deterministic zip per skill, each agent's instructions file, each
# automation's definition file, and a definitions-manifest.json carrying the
# release version, per-artifact SHA-256 checksums, and the compatibility
# floor from skills/compat.yaml.
#
# Consumers resolve the manifest at a pinned tag and verify every artifact's
# checksum before installing -- which is why the manifest publishes checksums
# explicitly rather than relying on transport integrity alone.
#
# Job shape -- the Actions UI shows exactly what a release ships:
#   package                  builds everything ONCE (the manifest's checksums
#                            cover all artifacts, so packaging is atomic) and
#                            discovers the skill/agent/automation slugs from
#                            the output
#   skill (<slug>)           one job per skill, uploads skill-<slug>.zip
#   agent (<slug>)           one job per agent, uploads agent-<slug>-instructions.md
#   automation (<slug>)      one job per automation, uploads automation-<slug>.yaml
#                            (skipped entirely when the release carries none)
#   exploded                 unzips every skill archive into the browsable
#                            exploded/<slug>/ layout, verifies every file's
#                            checksum against definitions-browse.json (both
#                            directions: checklist + file count), then uploads
#                            the tree and the browse manifest -- reading
#                            surfaces fetch one file per click instead of a
#                            whole archive. The tree is DERIVED from the
#                            archives (deterministic stored zips), never
#                            packaged twice, so the two shapes cannot diverge.
#   publish-manifest         uploads definitions-manifest.json, moves the
#                            stable channel pointer, then appends the tag to
#                            the releases index -- it needs every upload
#                            job, so the DAG itself enforces that neither the
#                            pointer nor the index ever names a release whose
#                            artifacts are not yet retrievable
#   distribution-repo        writes the verified exploded skill trees into
#                            github.com/plantonhq/skills -- the repository
#                            coding agents (Cursor, Claude Code, Codex, ...)
#                            install the skills from -- as one commit tagged
#                            with this release's tag. It runs AFTER
#                            publish-manifest, so that repository can never
#                            carry a release the stable channel does not.
#
# Distribution repository push credential: SKILLS_DISTRIBUTION_GITHUB_TOKEN,
# a fine-grained token scoped to plantonhq/skills with contents read/write
# (the default workflow token cannot push to another repository). Without
# the secret every CDN upload still lands and the job fails with the exact
# fix in its log: degraded, never silent -- the same posture as the
# auto-heal workflow's AUTO_HEAL_PUSH_TOKEN.
#
# Upload path: s3://planton-foundation-downloads/releases/{tag}/definitions/{file}
# Public URL:  https://downloads.planton.ai/releases/{tag}/definitions/{file}
# Exploded:    .../releases/{tag}/definitions/exploded/{skill-slug}/{path}
#              (tree described by .../definitions-browse.json at the same tag)
#
# Releases index (browse surfaces' release picker; appended only after every
# upload succeeded, so -- unlike the GitHub releases list -- it can never name
# a tag whose definitions content is incomplete):
#   https://downloads.planton.ai/definitions/releases/index.json
#
# Channel pointer:
#   s3://planton-foundation-downloads/definitions/stable/version.txt
#   https://downloads.planton.ai/definitions/stable/version.txt
# Runtime consumers (the desktop daemon's definitions roll-forward) resolve
# this pointer to discover the current definitions release, then fetch the
# manifest at that tag and verify every artifact checksum. ROLLBACK is a
# pointer rewrite -- point it back at a previous good tag and every install
# re-adopts that version on its next seed:
#   echo "v0.X.Y" | aws s3 cp - \
#     s3://planton-foundation-downloads/definitions/stable/version.txt \
#     --endpoint-url "$CLOUDFLARE_R2_ENDPOINT" --content-type text/plain \
#     --cache-control "no-cache"
#
# Release candidates (prerelease input): the package, every per-artifact
# upload, the exploded tree and the manifest publish at the candidate's own
# tag, so a platform can pin and verify them; the stable pointer, the
# releases index and the distribution repository are left alone, so no
# install rolls forward to a candidate and no picker offers one.
#
# Called by: .github/workflows/release.yaml (after its github-release job creates the release)
# =============================================================================

name: release.definitions

on:
  workflow_call:
    inputs:
      # True for a release candidate (vX.Y.Z-rc.N), decided once by
      # release.yaml's github-release job.
      prerelease:
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_R2_ACCESS_KEY_ID:
        required: true
      CLOUDFLARE_R2_SECRET_ACCESS_KEY:
        required: true
      CLOUDFLARE_R2_ENDPOINT:
        required: true
      # Optional at the workflow-call boundary so a missing secret fails the
      # distribution-repo job with a readable message instead of failing the
      # whole workflow before any CDN upload runs.
      SKILLS_DISTRIBUTION_GITHUB_TOKEN:
        required: false

permissions:
  contents: read

env:
  R2_BUCKET: planton-foundation-downloads

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skills: ${{ steps.discover.outputs.skills }}
      agents: ${{ steps.discover.outputs.agents }}
      automations: ${{ steps.discover.outputs.automations }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Package definitions release
        # -embed-catalog-pack ships the catalog skill self-contained (its
        # kinds/ reference pack inside the archive). Artifacts above
        # the engines' 10MB inline lane ride the capability-URL transfer
        # lane; pushing them needs Stigmer SDK >= v3.12.3 (go.mod pins it).
        run: |
          TAG="${GITHUB_REF_NAME}"
          go run ./pkg/skills/defspack -version "$TAG" -out build/definitions -embed-catalog-pack

      # The slug lists are derived from what defspack actually built, so a
      # new skill, agent, or automation gets its own upload job with zero
      # workflow edits. Any file outside the four contractual name patterns
      # fails the release -- a straggler would upload nowhere.
      - name: Discover skills, agents, and automations
        id: discover
        run: |
          cd build/definitions
          for f in *; do
            case "$f" in
              definitions-manifest.json|definitions-browse.json|skill-*.zip|agent-*-instructions.md|automation-*.yaml) ;;
              *)
                echo "ERROR: unexpected artifact '$f' matches no upload job"
                exit 1
                ;;
            esac
          done
          skills=$(find . -maxdepth 1 -name 'skill-*.zip' | sed -E 's|^\./skill-(.+)\.zip$|\1|' | sort | jq -R . | jq -cs .)
          agents=$(find . -maxdepth 1 -name 'agent-*-instructions.md' | sed -E 's|^\./agent-(.+)-instructions\.md$|\1|' | sort | jq -R . | jq -cs .)
          automations=$(find . -maxdepth 1 -name 'automation-*.yaml' | sed -E 's|^\./automation-(.+)\.yaml$|\1|' | sort | jq -R . | jq -cs .)
          echo "skills=$skills" >> "$GITHUB_OUTPUT"
          echo "agents=$agents" >> "$GITHUB_OUTPUT"
          echo "automations=$automations" >> "$GITHUB_OUTPUT"
          echo "skills: $skills"
          echo "agents: $agents"
          echo "automations: $automations"

      - name: Share the packaged release with the upload jobs
        uses: actions/upload-artifact@v4
        with:
          name: definitions
          path: build/definitions/
          if-no-files-found: error

  skill:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.package.outputs.skills) }}
    steps:
      - name: Download packaged release
        uses: actions/download-artifact@v4
        with:
          name: definitions

      - name: Upload skill-${{ matrix.slug }}.zip to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: |
          R2_KEY="releases/${GITHUB_REF_NAME}/definitions/skill-${{ matrix.slug }}.zip"
          aws s3 cp "skill-${{ matrix.slug }}.zip" "s3://${R2_BUCKET}/${R2_KEY}" \
            --endpoint-url "${AWS_ENDPOINT_URL}" \
            --cache-control "public, max-age=31536000, immutable"
          echo "uploaded: https://downloads.planton.ai/${R2_KEY}"

  agent:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.package.outputs.agents) }}
    steps:
      - name: Download packaged release
        uses: actions/download-artifact@v4
        with:
          name: definitions

      - name: Upload agent-${{ matrix.slug }}-instructions.md to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: |
          R2_KEY="releases/${GITHUB_REF_NAME}/definitions/agent-${{ matrix.slug }}-instructions.md"
          aws s3 cp "agent-${{ matrix.slug }}-instructions.md" "s3://${R2_BUCKET}/${R2_KEY}" \
            --endpoint-url "${AWS_ENDPOINT_URL}" \
            --cache-control "public, max-age=31536000, immutable"
          echo "uploaded: https://downloads.planton.ai/${R2_KEY}"

  automation:
    needs: package
    # A matrix over an empty list fails the workflow outright, so a release
    # carrying zero automations skips this job instead; publish-manifest's
    # condition below accepts exactly this skip and nothing else.
    if: needs.package.outputs.automations != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.package.outputs.automations) }}
    steps:
      - name: Download packaged release
        uses: actions/download-artifact@v4
        with:
          name: definitions

      - name: Upload automation-${{ matrix.slug }}.yaml to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: |
          R2_KEY="releases/${GITHUB_REF_NAME}/definitions/automation-${{ matrix.slug }}.yaml"
          aws s3 cp "automation-${{ matrix.slug }}.yaml" "s3://${R2_BUCKET}/${R2_KEY}" \
            --endpoint-url "${AWS_ENDPOINT_URL}" \
            --cache-control "public, max-age=31536000, immutable"
          echo "uploaded: https://downloads.planton.ai/${R2_KEY}"

  exploded:
    needs: package
    runs-on: ubuntu-latest
    # ~3,700 objects ride this upload today (the catalog pack's exploded
    # tree), so this job gets headroom the single-file upload jobs don't
    # need.
    timeout-minutes: 20
    steps:
      - name: Download packaged release
        uses: actions/download-artifact@v4
        with:
          name: definitions

      - name: Explode skill archives and verify against the browse manifest
        # The exploded tree is the archives unzipped -- deterministic stored
        # zips make the bytes identical by construction -- and the browse
        # manifest is built from the same source of truth by defspack. The
        # verification here closes the loop in both directions before any
        # byte reaches the CDN: every listed file must exist with its exact
        # checksum, and no file may exist that the manifest does not list.
        run: |
          set -euo pipefail
          for zipfile in skill-*.zip; do
            slug="${zipfile#skill-}"
            slug="${slug%.zip}"
            mkdir -p "exploded/${slug}"
            unzip -q "$zipfile" -d "exploded/${slug}"
          done
          jq -r '.skills[] | .slug as $slug | .files[] | "\(.sha256)  exploded/\($slug)/\(.path)"' \
            definitions-browse.json > exploded.sha256
          sha256sum --check --quiet exploded.sha256
          listed=$(wc -l < exploded.sha256 | tr -d ' ')
          actual=$(find exploded -type f | wc -l | tr -d ' ')
          if [ "$listed" != "$actual" ]; then
            echo "ERROR: exploded tree carries ${actual} files but the browse manifest lists ${listed}"
            exit 1
          fi
          echo "verified ${actual} exploded file(s) against the browse manifest"

      # The verified tree (and its checklist) is handed to distribution-repo
      # as an artifact, so that job re-checks the same bytes it commits
      # instead of exploding the archives a second time.
      - name: Share the verified exploded tree with distribution-repo
        uses: actions/upload-artifact@v4
        with:
          name: definitions-exploded
          path: |
            exploded/
            exploded.sha256
          if-no-files-found: error

      - name: Upload exploded layout and browse manifest to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: |
          aws s3 cp exploded "s3://${R2_BUCKET}/releases/${GITHUB_REF_NAME}/definitions/exploded" \
            --recursive --only-show-errors --endpoint-url "${AWS_ENDPOINT_URL}" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp definitions-browse.json \
            "s3://${R2_BUCKET}/releases/${GITHUB_REF_NAME}/definitions/definitions-browse.json" \
            --content-type application/json --endpoint-url "${AWS_ENDPOINT_URL}" \
            --cache-control "public, max-age=31536000, immutable"
          echo "uploaded: https://downloads.planton.ai/releases/${GITHUB_REF_NAME}/definitions/definitions-browse.json"

  # Runs only after EVERY artifact upload succeeded: the manifest that names
  # the artifacts, then the channel pointer that names the release, then the
  # releases index entry. A consumer can never resolve a tag whose content is
  # missing -- the ordering is enforced by the job DAG, not by step order
  # inside one job. The automation job may legitimately SKIP (zero
  # automations in the release); any other non-success still refuses the
  # pointer move.
  publish-manifest:
    needs: [skill, agent, automation, exploded]
    if: |
      always()
      && needs.skill.result == 'success'
      && needs.agent.result == 'success'
      && needs.exploded.result == 'success'
      && (needs.automation.result == 'success' || needs.automation.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download packaged release
        uses: actions/download-artifact@v4
        with:
          name: definitions

      - name: Upload definitions-manifest.json to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: |
          R2_KEY="releases/${GITHUB_REF_NAME}/definitions/definitions-manifest.json"
          aws s3 cp "definitions-manifest.json" "s3://${R2_BUCKET}/${R2_KEY}" \
            --endpoint-url "${AWS_ENDPOINT_URL}" \
            --cache-control "public, max-age=31536000, immutable"
          echo "uploaded: https://downloads.planton.ai/${R2_KEY}"

      - name: Move the stable channel pointer
        if: ${{ !inputs.prerelease }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "$TAG" | aws s3 cp - "s3://${R2_BUCKET}/definitions/stable/version.txt" \
            --endpoint-url "${AWS_ENDPOINT_URL}" \
            --content-type text/plain \
            --cache-control "no-cache"
          echo "  stable channel -> ${TAG} (https://downloads.planton.ai/definitions/stable/version.txt)"

      - name: Append the release to the definitions releases index
        if: ${{ !inputs.prerelease }}
        # The index is the browse surfaces' release picker. It lives HERE --
        # after every upload job and the pointer move -- so it inherits the
        # DAG's only-complete-releases guarantee; the GitHub releases list
        # cannot promise that (a release tag can exist whose definitions
        # uploads failed). First release: no index exists yet, start empty --
        # but ONLY when the store answers "not found": any other failed read
        # (a network blip, a throttle) fails the step, because rewriting the
        # index from an empty list would drop every earlier release from it.
        # Re-run safe: a tag enters the list once, newest first.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          INDEX_KEY="definitions/releases/index.json"
          if aws s3api head-object --bucket "${R2_BUCKET}" --key "${INDEX_KEY}" \
              --endpoint-url "${AWS_ENDPOINT_URL}" > /dev/null 2> head.err; then
            aws s3 cp "s3://${R2_BUCKET}/${INDEX_KEY}" index.json \
              --endpoint-url "${AWS_ENDPOINT_URL}"
          elif grep -qE '\(404\)|Not Found|NoSuchKey' head.err; then
            echo '{"releases":[]}' > index.json
          else
            cat head.err >&2
            echo "::error::could not read ${INDEX_KEY}; refusing to rewrite it from an empty list"
            exit 1
          fi
          jq --arg tag "$TAG" '.releases |= ([$tag] + (. - [$tag]))' index.json > index.next.json
          aws s3 cp index.next.json "s3://${R2_BUCKET}/${INDEX_KEY}" \
            --endpoint-url "${AWS_ENDPOINT_URL}" \
            --content-type application/json \
            --cache-control "no-cache"
          echo "  releases index += ${TAG} (https://downloads.planton.ai/${INDEX_KEY})"

  # The coding-agent lane. github.com/plantonhq/skills is a distribution
  # repository: its skills/ tree is release output (this job's writes and
  # nothing else -- a guard workflow there refuses pull requests touching
  # it), every commit is a Planton release, and every commit carries the
  # release's tag. Installers (`npx skills add plantonhq/skills`, Claude
  # Code's `/plugin marketplace add plantonhq/skills`) clone that repository,
  # so coding agents run exactly the skill bytes the stable channel points
  # to -- which is why this job needs publish-manifest, never just exploded.
  distribution-repo:
    needs: publish-manifest
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the distribution repository token
        env:
          TOKEN: ${{ secrets.SKILLS_DISTRIBUTION_GITHUB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            cat <<'EOF'
          ERROR: SKILLS_DISTRIBUTION_GITHUB_TOKEN is not set on this repository.

          The release is complete on the CDN and the stable channel already
          points to it; only the coding-agent distribution repository
          (github.com/plantonhq/skills) was not updated.

          Fix: create a fine-grained GitHub token scoped to plantonhq/skills
          with Contents: read and write, store it as the Actions secret
          SKILLS_DISTRIBUTION_GITHUB_TOKEN on plantonhq/planton, then re-run
          this job.
          EOF
            exit 1
          fi

      - name: Download the verified exploded tree
        uses: actions/download-artifact@v4
        with:
          name: definitions-exploded

      - name: Re-verify the tree against its checklist
        # The checklist was written by the exploded job from
        # definitions-browse.json; checking it again here means the bytes
        # committed below are proven, not assumed, to be the release's.
        run: sha256sum --check --quiet exploded.sha256

      - name: Check out plantonhq/skills
        uses: actions/checkout@v4
        with:
          repository: plantonhq/skills
          token: ${{ secrets.SKILLS_DISTRIBUTION_GITHUB_TOKEN }}
          path: distribution
          fetch-depth: 1

      - name: Write the release into the distribution repository
        # skills/ is replaced wholesale (a skill removed from a release
        # disappears here too); the plugin manifests are stamped with the
        # release tag as their version, which is what tells Claude Code an
        # installed plugin has an update. Re-run safe: a tag already on the
        # remote means this release was published before, and nothing is
        # pushed twice.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd distribution
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "release ${TAG} is already published to plantonhq/skills; nothing to do"
            exit 0
          fi
          rm -rf skills
          mkdir skills
          cp -R ../exploded/. skills/
          jq --arg v "$TAG" '(.plugins[] | select(.name == "planton") | .version) = $v' \
            .claude-plugin/marketplace.json > marketplace.next.json
          mv marketplace.next.json .claude-plugin/marketplace.json
          jq --arg v "$TAG" '.version = $v' .claude-plugin/plugin.json > plugin.next.json
          mv plugin.next.json .claude-plugin/plugin.json
          git config user.name "planton-release"
          git config user.email "release@planton.ai"
          git add -A
          git commit --allow-empty -m "release: ${TAG}" \
            -m "Skill trees are the checksum-verified exploded archives of definitions release ${TAG} (https://downloads.planton.ai/releases/${TAG}/definitions/definitions-manifest.json)."
          git tag "$TAG"
          git push origin HEAD:main "refs/tags/${TAG}"
          echo "published: https://github.com/plantonhq/skills/tree/${TAG}"
