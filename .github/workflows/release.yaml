# =============================================================================
# Release Orchestrator
# =============================================================================
# Single entry point for all release workflows. Triggers on semantic version
# tags (v*) and orchestrates the release of all Pulumi module binaries, all
# Terraform module zips, content distribution zips (presets, IaC source,
# catalog pages, proto source, the kind reference pack), and the
# InfraChart catalog zip.
#
# Architecture:
#   1. The github-release job creates the GitHub Release for the tag
#   2. Pulumi modules, Terraform modules, Content, and Definitions jobs
#      upload to Cloudflare R2 (downloads.planton.ai) after it completes
#   3. Each module lane's manifest job publishes that engine's module
#      manifest the moment the lane has uploaded every module: OpenTofu's
#      within minutes of the tag, Pulumi's once its binaries are built.
#      Neither waits for the other, so a platform that runs OpenTofu modules
#      pins a release without waiting for Pulumi's build
#   4. Charts job attaches the InfraChart catalog zip to the GitHub Release
#
# One code path: every lane a platform pin reads (the GitHub Release, the
# charts, the BSR labels, the content, the stub SDKs, the OpenTofu modules and
# both engines' manifests) is a tools/ci/release script the job runs, and
# `make release-without-actions tag=<tag>` runs the same scripts from a
# laptop when Actions cannot (tools/ci/release/README.md).
#
# Job visibility: the content and definitions workflows run ONE JOB PER
# ARTIFACT (content: one per zip; definitions: one per skill/agent, with the
# manifest + channel pointer as the fan-in) so the Actions job list reads as
# the release's artifact inventory.
#
# Artifact hosting:
#   - Pulumi modules -> Cloudflare R2 (downloads.planton.ai/releases/{tag}/modules/pulumi/)
#   - Terraform zips -> Cloudflare R2 (downloads.planton.ai/releases/{tag}/modules/terraform/)
#   - Module manifests -> Cloudflare R2 (downloads.planton.ai/releases/{tag}/modules/{terraform,pulumi}/manifest.json)
#   - Content zips   -> Cloudflare R2 (downloads.planton.ai/releases/{tag}/content/)
#   - Stub SDKs      -> Cloudflare R2 (downloads.planton.ai/releases/{tag}/stubs/)
#   - Buf module     -> BSR (buf.build/planton/planton, labeled with the tag)
#   - Chart catalog  -> GitHub Release (infra-charts.zip + .sha256 + version.txt)
#   - Definitions    -> Cloudflare R2 (downloads.planton.ai/releases/{tag}/definitions/)
#
# Trigger: git tag v0.1.0 && git push origin v0.1.0
# Note: Only triggers on strict semver tags (v1.2.3) and release candidates
# (v1.2.3-rc.1), not auto-release tags (v1.2.3+cli.*, v1.2.3-pulumi.*).
#
# Release candidates: a vX.Y.Z-rc.N tag publishes everything a platform pins
# -- the Go module version, a BSR label, every per-tag R2 artifact, the
# definitions at the candidate's own tag, and the module matrices that
# compile every kind -- and moves no shared channel: the GitHub release is a
# pre-release that is never "latest", the BSR `main` label, the versionless
# logos, the definitions stable pointer and releases index, the
# plantonhq/skills distribution repository and the Stigmer skills all stay
# on the last stable release. The github-release job decides which a tag is,
# once, and every job below reads its `prerelease` output.
# =============================================================================

name: release

on:
  push:
    tags:
      # Strict semver and release candidates - excludes auto-release tags (v*+*, v*-pulumi.*)
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ============================================================================
  # GitHub Release - creates the release object the chart assets attach to
  # and that /releases/latest/download resolves to
  # ============================================================================
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Classify the tag (stable release or release candidate)
        id: channel
        run: |
          set -euo pipefail
          channel="$(bash tools/ci/release/release_channel.sh "${GITHUB_REF_NAME}")"
          echo "prerelease=$([ "${channel}" = candidate ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "${GITHUB_REF_NAME} is a ${channel} release"

      - name: Create the GitHub Release for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci/release/create_github_release.sh "${GITHUB_REF_NAME}"

  # ============================================================================
  # Pulumi Modules - All providers (uploads to Cloudflare R2)
  # ============================================================================
  pulumi-modules:
    needs: github-release
    uses: ./.github/workflows/release.pulumi-modules.yaml
    secrets:
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}

  # ============================================================================
  # Terraform Modules - All providers (uploads to Cloudflare R2)
  # ============================================================================
  terraform-modules:
    needs: github-release
    uses: ./.github/workflows/release.terraform-modules.yaml
    secrets:
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}

  # ============================================================================
  # Module Manifests - one per engine: every module's published checksums and
  # digest. Each is published once its own lane has uploaded every module of
  # that engine, and never waits for the other lane: a platform pins a
  # release once the manifest of the engine it runs by default (OpenTofu)
  # exists, and a runner runs a platform module only when its bytes match its
  # engine's manifest, so a partial manifest is never published (modulebuild
  # refuses one). The download pattern is what keeps each manifest to its own
  # engine's parts. A rerun of a failed leg reruns its manifest job;
  # publish_once.sh keeps a manifest already published.
  # ============================================================================
  terraform-module-manifest:
    needs: [terraform-modules]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Collect what every OpenTofu leg published
        uses: actions/download-artifact@v4
        with:
          pattern: module-part-terraform-*
          path: ${{ runner.temp }}/parts

      - name: Assemble and publish the OpenTofu module manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: bash tools/ci/release/publish_module_manifest.sh "${GITHUB_REF_NAME}" terraform "${RUNNER_TEMP}/parts"

  pulumi-module-manifest:
    needs: [pulumi-modules]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Collect what every Pulumi leg published
        uses: actions/download-artifact@v4
        with:
          pattern: module-part-pulumi-*
          path: ${{ runner.temp }}/parts

      - name: Assemble and publish the Pulumi module manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: bash tools/ci/release/publish_module_manifest.sh "${GITHUB_REF_NAME}" pulumi "${RUNNER_TEMP}/parts"

  # ============================================================================
  # Content Distribution - one job per zip: presets, IaC source, catalog
  # pages, proto source, reference pack, catalog bundle
  # ============================================================================
  content:
    needs: github-release
    uses: ./.github/workflows/release.content.yaml
    with:
      prerelease: ${{ needs.github-release.outputs.prerelease == 'true' }}
    secrets:
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}

  # ============================================================================
  # BSR Push - the buf module with the release tag as label; the platform's
  # label-pinned buf dep resolves upstream proto imports from it
  # ============================================================================
  buf-push:
    needs: github-release
    uses: ./.github/workflows/release.buf-push.yaml
    secrets:
      BUF_TOKEN: ${{ secrets.BUF_TOKEN }}

  # ============================================================================
  # Stub SDKs - prebuilt Java + TypeScript stub trees the platform repo
  # extracts instead of regenerating (uploads to Cloudflare R2)
  # ============================================================================
  stub-sdks:
    needs: github-release
    uses: ./.github/workflows/release.stub-sdks.yaml
    secrets:
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}

  # ============================================================================
  # Infra Charts - attach the chart catalog zip to the GitHub Release
  # ============================================================================
  charts:
    needs: github-release
    uses: ./.github/workflows/release.charts.yaml

  # ============================================================================
  # Definitions - one job per skill/agent definition, manifest + channel
  # pointer published last (uploads to Cloudflare R2)
  # ============================================================================
  definitions:
    needs: github-release
    uses: ./.github/workflows/release.definitions.yaml
    with:
      prerelease: ${{ needs.github-release.outputs.prerelease == 'true' }}
    secrets:
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
      SKILLS_DISTRIBUTION_GITHUB_TOKEN: ${{ secrets.SKILLS_DISTRIBUTION_GITHUB_TOKEN }}

  # ============================================================================
  # Stigmer Skills - push the same deterministic skill archives to the hosted
  # Stigmer engine (one job per skill; unchanged content is a no-op). Agents
  # resolve the engine's latest, so a release candidate never publishes here.
  # ============================================================================
  stigmer-skills:
    needs: github-release
    if: needs.github-release.outputs.prerelease != 'true'
    uses: ./.github/workflows/release.stigmer-skills.yaml
    secrets:
      STIGMER_API_KEY_PLANTON_PROD: ${{ secrets.STIGMER_API_KEY_PLANTON_PROD }}
      STIGMER_API_KEY_PLANTON_PREPROD: ${{ secrets.STIGMER_API_KEY_PLANTON_PREPROD }}
