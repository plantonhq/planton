# =============================================================================
# Release Orchestrator
# =============================================================================
# Single entry point for all release workflows. Triggers on semantic version
# tags (v*) and orchestrates the release of all Pulumi module binaries, all
# Terraform module zips, content distribution zips (presets, IaC source,
# catalog pages, proto source, the component reference pack), and the
# InfraChart catalog zip.
#
# Architecture:
#   1. The github-release job creates the GitHub Release for the tag
#   2. Pulumi modules, Terraform modules, Content, and Definitions jobs
#      upload to Cloudflare R2 (downloads.planton.dev) after it completes
#   3. Charts job attaches the InfraChart catalog zip to the GitHub Release
#
# Job visibility: the content and definitions workflows run ONE JOB PER
# ARTIFACT (content: one per zip; definitions: one per skill/agent, with the
# manifest + channel pointer as the fan-in) so the Actions job list reads as
# the release's artifact inventory.
#
# Artifact hosting:
#   - Pulumi modules -> Cloudflare R2 (downloads.planton.dev/releases/{tag}/modules/pulumi/)
#   - Terraform zips -> Cloudflare R2 (downloads.planton.dev/releases/{tag}/modules/terraform/)
#   - Content zips   -> Cloudflare R2 (downloads.planton.dev/releases/{tag}/content/)
#   - Stub SDKs      -> Cloudflare R2 (downloads.planton.dev/releases/{tag}/stubs/)
#   - Buf module     -> BSR (buf.build/planton/planton, labeled with the tag)
#   - Chart catalog  -> GitHub Release (infra-charts.zip + .sha256 + version.txt)
#   - Definitions    -> Cloudflare R2 (downloads.planton.dev/releases/{tag}/definitions/)
#
# Trigger: git tag v0.1.0 && git push origin v0.1.0
# Note: Only triggers on strict semver tags (v1.2.3), not auto-release tags (v1.2.3+cli.*)
# =============================================================================

name: release

on:
  push:
    tags:
      # Strict semver only - excludes auto-release tags (v*+*)
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ============================================================================
  # GitHub Release - creates the release object the chart assets attach to
  # and that /releases/latest/download resolves to
  # ============================================================================
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create the GitHub Release for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "Release ${VERSION} already exists"
          else
            gh release create "${VERSION}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${VERSION}" \
              --generate-notes
          fi

  # ============================================================================
  # Pulumi Modules - All providers (uploads to Cloudflare R2)
  # ============================================================================
  pulumi-modules:
    needs: github-release
    uses: ./.github/workflows/release.pulumi-modules.yaml
    secrets:
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}

  # ============================================================================
  # Terraform Modules - All providers (uploads to Cloudflare R2)
  # ============================================================================
  terraform-modules:
    needs: github-release
    uses: ./.github/workflows/release.terraform-modules.yaml
    secrets:
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}

  # ============================================================================
  # Content Distribution - one job per zip: presets, IaC source, catalog
  # pages, proto source, reference pack, catalog bundle
  # ============================================================================
  content:
    needs: github-release
    uses: ./.github/workflows/release.content.yaml
    secrets:
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}

  # ============================================================================
  # BSR Push - the buf module with the release tag as label; the platform's
  # label-pinned buf dep resolves upstream proto imports from it
  # ============================================================================
  buf-push:
    needs: github-release
    uses: ./.github/workflows/release.buf-push.yaml
    secrets:
      BUF_TOKEN: ${{ secrets.BUF_TOKEN }}

  # ============================================================================
  # Stub SDKs - prebuilt Java + TypeScript stub trees the platform repo
  # extracts instead of regenerating (uploads to Cloudflare R2)
  # ============================================================================
  stub-sdks:
    needs: github-release
    uses: ./.github/workflows/release.stub-sdks.yaml
    secrets:
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}

  # ============================================================================
  # Infra Charts - attach the chart catalog zip to the GitHub Release
  # ============================================================================
  charts:
    needs: github-release
    uses: ./.github/workflows/release.charts.yaml

  # ============================================================================
  # Definitions - one job per skill/agent definition, manifest + channel
  # pointer published last (uploads to Cloudflare R2)
  # ============================================================================
  definitions:
    needs: github-release
    uses: ./.github/workflows/release.definitions.yaml
    secrets:
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
      SKILLS_DISTRIBUTION_GITHUB_TOKEN: ${{ secrets.SKILLS_DISTRIBUTION_GITHUB_TOKEN }}

  # ============================================================================
  # Stigmer Skills - push the same deterministic skill archives to the hosted
  # Stigmer engine (one job per skill; unchanged content is a no-op)
  # ============================================================================
  stigmer-skills:
    needs: github-release
    uses: ./.github/workflows/release.stigmer-skills.yaml
    secrets:
      STIGMER_API_KEY_PLANTON_PROD: ${{ secrets.STIGMER_API_KEY_PLANTON_PROD }}
      STIGMER_API_KEY_PLANTON_PREPROD: ${{ secrets.STIGMER_API_KEY_PLANTON_PREPROD }}
