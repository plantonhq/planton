# =============================================================================
# Operator Static Gate
# =============================================================================
# The Kubernetes operator (operator/) is its own Go module, built with the Go
# toolchain directly and packaged by helm/planton-operator. This lane is the
# headless proof for both: the code compiles and vets, the envtest suite passes
# against a real API server, everything controller-gen derives from the Go
# sources (CRDs, the manager ClusterRole, deepcopy code) is committed fresh in
# config/ AND in the chart, and the chart lints and renders.
#
# Jobs:
#   manifests-fresh (PR + push, BLOCKING) -- regenerate with controller-gen and
#                    diff; a hand-edited CRD or a chart copy that drifted from the
#                    RBAC markers fails here. See hack/guards/ensure_operator_manifests_fresh.sh.
#   build-and-test  (PR + push, BLOCKING) -- go build, go vet, envtest, and the
#                    chart's render assertions (operator/test/chart renders the
#                    chart through the Helm SDK and holds its CRD contract and
#                    its stamped-at-release version placeholder).
#
# helm lint/template/package of every chart is lint.helm.yaml; the Kind e2e lane
# is e2e-operator.yaml; the release (image + chart from one tag) is
# release.operator.yaml.
# =============================================================================

name: lint.operator

on:
  pull_request:
    paths:
      - 'operator/**'
      - 'helm/planton-operator/**'
      - 'hack/guards/ensure_operator_manifests_fresh.sh'
      - '.github/workflows/lint.operator.yaml'
  push:
    branches:
      - main
    paths:
      - 'operator/**'
      - 'helm/planton-operator/**'
      - 'hack/guards/ensure_operator_manifests_fresh.sh'
      - '.github/workflows/lint.operator.yaml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lint-operator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests-fresh:
    # ubuntu-latest, not a larger runner: this is a public repository, so standard
    # hosted runners are free while larger runners bill from the first minute
    # (founder direction 2026-09-17). Slower is fine; paid is not.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      - name: Verify generated CRDs, RBAC, and deepcopy code are committed fresh
        run: bash ./hack/guards/ensure_operator_manifests_fresh.sh

  build-and-test:
    # ubuntu-latest, not a larger runner: this is a public repository, so standard
    # hosted runners are free while larger runners bill from the first minute
    # (founder direction 2026-09-17). Slower is fine; paid is not.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit and envtest suites
        run: make test
