# =============================================================================
# Operator Static Gate
# =============================================================================
# The Kubernetes operator (operator/) is its own Go module, built with the Go
# toolchain directly and packaged by helm/planton-operator. This lane is the
# headless proof for both: the code compiles and vets, the envtest suite passes
# against a real API server, everything controller-gen derives from the Go
# sources (CRDs, the manager ClusterRole, deepcopy code) is committed fresh in
# config/ AND in the chart, and the chart lints and renders.
#
# Jobs:
#   manifests-fresh (PR + push, BLOCKING) -- regenerate with controller-gen and
#                    diff; a hand-edited CRD or a chart copy that drifted from the
#                    RBAC markers fails here. See hack/guards/ensure_operator_manifests_fresh.sh.
#   build-and-test  (PR + push, BLOCKING) -- go build, go vet, envtest, and the
#                    chart's render assertions (operator/test/chart renders the
#                    chart through the Helm SDK and holds its CRD contract and
#                    its stamped-at-release version placeholder).
#   platform-floor-published (PR + push, BLOCKING, only when the floor, the
#                    operator's image defaults, a platform kind scenario, or the
#                    guard changed) -- the floor's control plane, runner and console
#                    images are published, with their architectures printed, and
#                    no platform kind scenario sits below the floor. Reads GHCR
#                    anonymously. See hack/guards/ensure_platform_floor_is_published.sh.
#
# helm lint/template/package of every chart is lint.helm.yaml; the Kind e2e lane
# is e2e-operator.yaml; the release (image + chart from one tag) is
# release.operator.yaml.
# =============================================================================

name: lint.operator

on:
  pull_request:
    paths:
      - 'operator/**'
      - 'helm/planton-operator/**'
      - 'hack/guards/ensure_operator_manifests_fresh.sh'
      - 'hack/guards/ensure_platform_floor_is_published.sh'
      - 'hack/guards/ensure_platform_floor_is_published_test.sh'
      - 'catalog/kubernetes/kubernetesplantonplatform/e2e/scenarios/**'
      - '.github/workflows/lint.operator.yaml'
  push:
    branches:
      - main
    paths:
      - 'operator/**'
      - 'helm/planton-operator/**'
      - 'hack/guards/ensure_operator_manifests_fresh.sh'
      - 'hack/guards/ensure_platform_floor_is_published.sh'
      - 'hack/guards/ensure_platform_floor_is_published_test.sh'
      - 'catalog/kubernetes/kubernetesplantonplatform/e2e/scenarios/**'
      - '.github/workflows/lint.operator.yaml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lint-operator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests-fresh:
    # ubuntu-latest, not a larger runner: this is a public repository, so standard
    # hosted runners are free while larger runners bill from the first minute
    # (founder direction 2026-09-17). Slower is fine; paid is not.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      - name: Verify generated CRDs, RBAC, and deepcopy code are committed fresh
        run: bash ./hack/guards/ensure_operator_manifests_fresh.sh

  build-and-test:
    # ubuntu-latest, not a larger runner: this is a public repository, so standard
    # hosted runners are free while larger runners bill from the first minute
    # (founder direction 2026-09-17). Slower is fine; paid is not.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit and envtest suites
        run: make test

  platform-floor-published:
    # ubuntu-latest, not a larger runner: this is a public repository, so standard
    # hosted runners are free while larger runners bill from the first minute
    # (founder direction 2026-09-17). Slower is fine; paid is not.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The registry read is scoped to the changes that can move its answer, so
      # an unrelated operator change never waits on GHCR. A manual run always
      # checks, and so does a push whose base cannot be diffed.
      - name: Did the floor, the image defaults, a scenario, or the guard change?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          watched=(
            operator/internal/platformversion/platformversion.go
            operator/internal/resources/images.go
            operator/internal/plantonregistry/plantonregistry.go
            catalog/kubernetes/kubernetesplantonplatform/e2e/scenarios
            hack/guards/ensure_platform_floor_is_published.sh
            hack/guards/ensure_platform_floor_is_published_test.sh
            .github/workflows/lint.operator.yaml
          )
          case "$EVENT" in
            pull_request) range="origin/${BASE_REF}...HEAD" ;;
            push) range="${BEFORE}..HEAD" ;;
            *) echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if ! changed="$(git diff --name-only "$range" -- "${watched[@]}" 2>/dev/null)"; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing the floor check reads changed"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Test the guard against a fake registry
        if: steps.changed.outputs.run == 'true'
        run: bash ./hack/guards/ensure_platform_floor_is_published_test.sh
      - name: Verify the floor's images are published and no scenario sits below it
        if: steps.changed.outputs.run == 'true'
        run: bash ./hack/guards/ensure_platform_floor_is_published.sh
