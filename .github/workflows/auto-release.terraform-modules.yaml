# =============================================================================
# Terraform Modules Auto-Release
# =============================================================================
# Zips a Terraform module, uploads it to Cloudflare R2
# (downloads.planton.ai), and creates a GitHub release with download links.
#
# Tag Format: v{semver}-terraform.{kind}.{YYYYMMDD}.{N}
# Example: v0.3.5-terraform.awsecsservice.20260108.0
#
# Upload path: s3://planton-foundation-downloads/releases/{tag}/modules/terraform/{kind}/module.zip
# Public URL:  https://downloads.planton.ai/releases/{tag}/modules/terraform/{kind}/module.zip
#
# Triggered by: auto-tag.yaml via workflow_dispatch (one call per kind)
# =============================================================================

name: auto-release.terraform-modules
run-name: "Terraform: ${{ inputs.kind }} (${{ inputs.tag }})"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.3.5-terraform.awsecsservice.20260108.0)'
        required: true
        type: string
      kind:
        description: 'Kind name (e.g., awsecsservice)'
        required: true
        type: string
      provider:
        description: 'Provider name (e.g., aws, gcp, kubernetes)'
        required: true
        type: string
      path:
        description: 'Path to the Terraform module (e.g., catalog/aws/awsecsservice/iac/tf)'
        required: true
        type: string

permissions:
  contents: write

env:
  R2_BUCKET: planton-foundation-downloads

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip Terraform module
        run: |
          KIND="${{ inputs.kind }}"
          MODULE_PATH="${{ inputs.path }}"
          # One live module set per kind: the artifact carries no API
          # version segment -- same layout the full release workflow writes.
          ARTIFACT_NAME="${KIND}_module.zip"
          
          echo "========================================"
          echo "ZIPPING: ${KIND}"
          echo "Path: ${MODULE_PATH}"
          echo "========================================"
          
          (cd "${MODULE_PATH}" && zip -r "${GITHUB_WORKSPACE}/${ARTIFACT_NAME}" .)
          
          ZIP_SIZE=$(ls -lh "${ARTIFACT_NAME}" | awk '{print $5}')
          echo "Created: ${ARTIFACT_NAME} (${ZIP_SIZE})"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: |
          TAG="${{ inputs.tag }}"
          KIND="${{ inputs.kind }}"
          ARTIFACT_NAME="${KIND}_module.zip"
          R2_KEY="releases/${TAG}/modules/terraform/${KIND}/module.zip"
          
          aws s3 cp "${ARTIFACT_NAME}" "s3://${R2_BUCKET}/${R2_KEY}" \
            --endpoint-url "${AWS_ENDPOINT_URL}" \
            --cache-control "public, max-age=31536000, immutable"
          echo "✓ Uploaded: https://downloads.planton.ai/${R2_KEY}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          KIND="${{ inputs.kind }}"
          PROVIDER="${{ inputs.provider }}"
          MODULE_PATH="${{ inputs.path }}"
          DOWNLOAD_URL="https://downloads.planton.ai/releases/${TAG}/modules/terraform/${KIND}/module.zip"

          cat > release-notes.md << 'EOF'
          ## Terraform Module Auto-Release

          This is an auto-release of the **KIND_PLACEHOLDER** Terraform module.

          ---

          ## Module Info

          | Field | Value |
          |-------|-------|
          | Kind | KIND_PLACEHOLDER |
          | Provider | PROVIDER_PLACEHOLDER |
          | Tag | `TAG_PLACEHOLDER` |
          | Commit | COMMIT_PLACEHOLDER |

          ---

          ## Option 1: Download Zip (Recommended)

          Download the pre-packaged module:

          ```bash
          # Download and extract
          curl -LO DOWNLOAD_URL_PLACEHOLDER
          unzip module.zip -d KIND_PLACEHOLDER
          cd KIND_PLACEHOLDER

          # Initialize and apply
          terraform init
          terraform plan
          terraform apply
          ```

          ---

          ## Option 2: Reference via Git Source

          Add this module directly to your Terraform configuration:

          ```hcl
          module "KIND_PLACEHOLDER" {
            source = "git::https://github.com/plantonhq/planton.git//PATH_PLACEHOLDER?ref=TAG_PLACEHOLDER"

            # Add your variables here
          }
          ```

          ---

          ## Available Artifacts

          | Artifact | Download |
          |----------|----------|
          | `KIND_PLACEHOLDER/module.zip` | [Download](DOWNLOAD_URL_PLACEHOLDER) |

          ---

          ## Documentation

          For detailed configuration options, see the module's README at:

          `PATH_PLACEHOLDER/README.md`
          EOF

          sed -i "s|TAG_PLACEHOLDER|${TAG}|g" release-notes.md
          sed -i "s|KIND_PLACEHOLDER|${KIND}|g" release-notes.md
          sed -i "s|PROVIDER_PLACEHOLDER|${PROVIDER}|g" release-notes.md
          sed -i "s|PATH_PLACEHOLDER|${MODULE_PATH}|g" release-notes.md
          sed -i "s|COMMIT_PLACEHOLDER|${{ github.sha }}|g" release-notes.md
          sed -i "s|DOWNLOAD_URL_PLACEHOLDER|${DOWNLOAD_URL}|g" release-notes.md

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
          else
            echo "Creating release ${TAG}..."
            # --latest=false: kind point releases carry no infra-charts/version.txt
            # assets, so they must never move the /releases/latest pointer that chart
            # consumers (e.g. the desktop daemon's chart seeder) resolve. Only the
            # strict-semver orchestrated release marks latest.
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file release-notes.md \
              --latest=false
          fi

          echo ""
          echo "========================================"
          echo "RELEASE COMPLETE: ${KIND}"
          echo "========================================"
          echo "https://github.com/${{ github.repository }}/releases/tag/${TAG}"

      - name: Generate summary
        run: |
          TAG="${{ inputs.tag }}"
          KIND="${{ inputs.kind }}"
          PROVIDER="${{ inputs.provider }}"
          DOWNLOAD_URL="https://downloads.planton.ai/releases/${TAG}/modules/terraform/${KIND}/module.zip"
          
          echo "## Terraform Module Auto-Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Kind:** ${KIND}" >> $GITHUB_STEP_SUMMARY
          echo "**Provider:** ${PROVIDER}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifact" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [${KIND}/module.zip](${DOWNLOAD_URL})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Usage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Download zip:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "curl -LO ${DOWNLOAD_URL}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/${TAG})" >> $GITHUB_STEP_SUMMARY
