# =============================================================================
# Catalog Page Guard
# =============================================================================
# Fails the PR when a kind's catalog.md ships below the ONE catalog page
# standard -- a malformed head (the console card title and description are
# extracted from it), a nonstandard section skeleton, a broken InfraChart law,
# or an embedded manifest that does not validate -- and the gap is not in the
# accepted baseline. Also fails on a stale baseline entry, so the burn-down
# list can only shrink truthfully.
#
# To fix a failure: bring the page to the standard (the violation detail says
# how; the standard is _rules/docs/write-catalog-kind-catalog-md.mdc), or
# -- for a page whose upgrade is deliberately routed to its provider's sweep
# batch -- regenerate the baseline with PLANTON_REGEN_CATALOG_PAGE_BASELINE=1
# and justify the growth in review. See pkg/catalogpage.
# =============================================================================

name: lint.catalog-page

on:
  pull_request:
    paths:
      - 'catalog/**/catalog.md'
      - 'pkg/catalogpage/**'
      - '.github/workflows/lint.catalog-page.yaml'
  push:
    branches:
      - main
    paths:
      - 'catalog/**/catalog.md'
      - 'pkg/catalogpage/**'
      - '.github/workflows/lint.catalog-page.yaml'

permissions:
  contents: read

jobs:
  catalog-page:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run catalog-page gate
        run: go test ./pkg/catalogpage/...
