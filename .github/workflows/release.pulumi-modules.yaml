# =============================================================================
# Pulumi Modules Release (Reusable Workflow)
# =============================================================================
# Builds pre-compiled binaries for all Pulumi modules across
# all providers and uploads them to Cloudflare R2 (downloads.planton.dev).
#
# Features:
#   - Dynamic kind discovery from directory structure
#   - Matrix-based parallelization: provider × platform
#   - Multi-platform builds: linux_amd64, linux_arm64, darwin_arm64, darwin_amd64, windows_amd64
#     (linux_arm64 is every ARM runner the platform ships: Graviton, and kind
#     on an Apple Silicon Mac, whose containers are Linux ARM)
#   - Clear progress logging with kind counts
#   - No hardcoded kind paths - auto-discovers from filesystem
#
# Upload path: s3://downloads-dot-planton-dot-dev-bucket/releases/{tag}/modules/pulumi/{kind}/{platform}.gz
#              (windows artifacts carry the executable suffix: {platform}.exe.gz)
# Public URL:  https://downloads.planton.dev/releases/{tag}/modules/pulumi/{kind}/{platform}.gz
#
# Each kind also publishes its module SOURCE alongside the binaries:
#   releases/{tag}/modules/pulumi/{kind}/source.zip
# Source is platform-independent, so the zip uploads from exactly one matrix
# leg (linux_amd64) instead of five redundant writes. Consumers: the CLI's
# module-eject flow and source-rendering surfaces.
#
# Path pattern: catalog/{provider}/{kind}/iac/pulumi (one live module set
# per kind -- the key carries no API version segment; the release tag
# versions the artifact)
#
# Called by: .github/workflows/release.yaml (after CLI release creates the release)
# =============================================================================

name: release.pulumi-modules

on:
  workflow_call:
    secrets:
      CLOUDFLARE_R2_ACCESS_KEY_ID:
        required: true
      CLOUDFLARE_R2_SECRET_ACCESS_KEY:
        required: true
      CLOUDFLARE_R2_ENDPOINT:
        required: true

permissions:
  contents: read

env:
  GO_VERSION: '1.25'
  CATALOG_ROOT: catalog
  R2_BUCKET: downloads-dot-planton-dot-dev-bucket

jobs:
  # ============================================================================
  # Pre-flight: reject missing/misplaced Pulumi entrypoints before the long matrix
  # ============================================================================
  # The matrix build below runs `go build ./<...>/iac/pulumi` per kind, which
  # requires a `package main` at the entrypoint root. Catch a broken entrypoint ONCE here
  # (seconds) instead of failing dozens of expensive matrix legs after long compiles.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Pulumi entrypoints
        run: bash ./hack/guards/ensure_pulumi_entrypoints.sh

  # ============================================================================
  # Build all kinds for each provider × platform combination
  # ============================================================================
  build:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 72
      matrix:
        provider:
          - auth0
          - aws
          - azure
          - cloudflare
          - digitalocean
          - gcp
          - kubernetes
        platform:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build and upload all kinds
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          PROVIDER: ${{ matrix.provider }}
          GOOS: ${{ matrix.platform.goos }}
          GOARCH: ${{ matrix.platform.goarch }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PROVIDER_PATH="${CATALOG_ROOT}/${PROVIDER}"
          PLATFORM_LABEL="${GOOS}_${GOARCH}"
          
          # Discover all kinds by listing directories
          if [ ! -d "$PROVIDER_PATH" ]; then
            echo "WARNING: Provider path not found: $PROVIDER_PATH"
            exit 0
          fi
          
          # Get all kinds that have a pulumi module. Modules live at the
          # kind root (one live module set per kind), so discovery
          # is a single-level walk with no version segment.
          KINDS=()
          for kind_path in "$PROVIDER_PATH"/*/; do
            kind=$(basename "$kind_path")
            if [ -d "${kind_path}iac/pulumi" ]; then
              KINDS+=("${kind}")
            fi
          done
          
          TOTAL=${#KINDS[@]}
          
          echo "========================================"
          echo "PROVIDER: ${PROVIDER}"
          echo "PLATFORM: ${PLATFORM_LABEL}"
          echo "KINDS: ${TOTAL}"
          echo "========================================"
          echo ""
          echo "Kinds:"
          printf '  - %s\n' "${KINDS[@]}"
          echo ""
          echo "========================================"
          
          if [ $TOTAL -eq 0 ]; then
            echo "WARNING: No kinds found for provider ${PROVIDER}"
            exit 0
          fi
          
          COMPLETED=0
          FAILED=0
          
          for kind in "${KINDS[@]}"; do
            COMPLETED=$((COMPLETED + 1))
            REMAINING=$((TOTAL - COMPLETED))
            
            KIND_PATH="${PROVIDER_PATH}/${kind}/iac/pulumi"
            
            # Handle Windows .exe extension
            if [ "$GOOS" = "windows" ]; then
              BINARY_NAME="${kind}.exe"
              ARTIFACT_NAME="${PLATFORM_LABEL}.exe.gz"
            else
              BINARY_NAME="${kind}"
              ARTIFACT_NAME="${PLATFORM_LABEL}.gz"
            fi
            
            R2_KEY="releases/${TAG}/modules/pulumi/${kind}/${ARTIFACT_NAME}"
            
            echo ""
            echo "----------------------------------------"
            echo "BUILDING: ${kind} (${PLATFORM_LABEL})"
            echo "Progress: ${COMPLETED}/${TOTAL} (${REMAINING} remaining)"
            echo "----------------------------------------"
            
            # Build
            if CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build \
              -ldflags="-s -w" \
              -o "${BINARY_NAME}" \
              "./${KIND_PATH}"; then
              
              # Compress
              gzip -9 -c "${BINARY_NAME}" > "${ARTIFACT_NAME}"
              rm -f "${BINARY_NAME}"
              
              # Upload to R2
              if aws s3 cp "${ARTIFACT_NAME}" "s3://${R2_BUCKET}/${R2_KEY}" \
                --endpoint-url "${AWS_ENDPOINT_URL}"; then
                echo "✓ Uploaded: https://downloads.planton.dev/${R2_KEY}"
                LAST_UPLOADED_KEY="${R2_KEY}"
              else
                echo "✗ ERROR: Failed to upload ${ARTIFACT_NAME} to R2"
                FAILED=$((FAILED + 1))
              fi
              
              # Clean up
              rm -f "${ARTIFACT_NAME}"
            else
              echo "✗ ERROR: Failed to build ${kind} for ${PLATFORM_LABEL}"
              FAILED=$((FAILED + 1))
            fi
            
            # Publish the module source once per kind (source is
            # platform-independent; the linux_amd64 leg is the designated
            # writer). Apache-2.0 §4(d): LICENSE and NOTICE must accompany
            # every redistribution, and a source zip is a standalone
            # redistribution of that kind — both land at the zip root,
            # mirroring the terraform module lane.
            if [ "${PLATFORM_LABEL}" = "linux_amd64" ]; then
              SOURCE_ARTIFACT="${kind}_source.zip"
              SOURCE_R2_KEY="releases/${TAG}/modules/pulumi/${kind}/source.zip"
              
              if (cd "${KIND_PATH}" && zip -q -r "${GITHUB_WORKSPACE}/${SOURCE_ARTIFACT}" .) \
                && zip -q -j "${SOURCE_ARTIFACT}" LICENSE NOTICE; then
                
                if aws s3 cp "${SOURCE_ARTIFACT}" "s3://${R2_BUCKET}/${SOURCE_R2_KEY}" \
                  --endpoint-url "${AWS_ENDPOINT_URL}"; then
                  echo "✓ Uploaded: https://downloads.planton.dev/${SOURCE_R2_KEY}"
                  LAST_UPLOADED_SOURCE_KEY="${SOURCE_R2_KEY}"
                else
                  echo "✗ ERROR: Failed to upload ${SOURCE_ARTIFACT} to R2"
                  FAILED=$((FAILED + 1))
                fi
                rm -f "${SOURCE_ARTIFACT}"
              else
                echo "✗ ERROR: Failed to zip source for ${kind}"
                FAILED=$((FAILED + 1))
              fi
            fi
          done
          
          # Probe one uploaded artifact through the public URL. The CLI
          # composes these URLs from a shape it pins in its own tests
          # (pkg/downloads); this probe pins the OTHER half of the contract —
          # that what CI just uploaded actually serves at that shape. Without
          # it, a key-shape change here ships silently and every released CLI
          # degrades module fetches into full git clones.
          if [ -n "${LAST_UPLOADED_KEY:-}" ]; then
            PROBE_URL="https://downloads.planton.dev/${LAST_UPLOADED_KEY}"
            PROBE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -I "${PROBE_URL}")
            if [ "${PROBE_CODE}" = "200" ]; then
              echo "✓ Public URL probe passed: ${PROBE_URL}"
            else
              echo "✗ ERROR: uploaded artifact does not serve at its public URL (HTTP ${PROBE_CODE}): ${PROBE_URL}"
              FAILED=$((FAILED + 1))
            fi
          fi
          
          # Same probe for the source artifact (only the linux_amd64 leg
          # uploads one). The CLI's eject flow composes this URL from a shape
          # pinned in pkg/downloads — this pins the CI half of that contract.
          if [ -n "${LAST_UPLOADED_SOURCE_KEY:-}" ]; then
            PROBE_URL="https://downloads.planton.dev/${LAST_UPLOADED_SOURCE_KEY}"
            PROBE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -I "${PROBE_URL}")
            if [ "${PROBE_CODE}" = "200" ]; then
              echo "✓ Public URL probe passed: ${PROBE_URL}"
            else
              echo "✗ ERROR: uploaded source zip does not serve at its public URL (HTTP ${PROBE_CODE}): ${PROBE_URL}"
              FAILED=$((FAILED + 1))
            fi
          fi
          
          echo ""
          echo "========================================"
          echo "JOB SUMMARY: ${PROVIDER} / ${PLATFORM_LABEL}"
          echo "========================================"
          echo "Total kinds: ${TOTAL}"
          echo "Successfully built: $((TOTAL - FAILED))"
          echo "Failed: ${FAILED}"
          echo "========================================"
          
          if [ $FAILED -gt 0 ]; then
            echo "ERROR: ${FAILED} kind(s) failed to build"
            exit 1
          fi
