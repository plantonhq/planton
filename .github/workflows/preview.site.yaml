# =============================================================================
# Website Previews, the build (review-<n>.planton.dev)
# =============================================================================
# Every pull request that changes the website gets its own preview, the exact
# build production would serve, at https://review-<pull request number>.<zone>.
# A push updates it; merging or closing the pull request closes it.
#
# This half builds the export and holds no key, so it runs for every pull
# request alike, forks included: a fork's run gets a read-only token and no
# secrets, and a fork can rewrite this file in its own pull request. Nothing
# here is trusted. publish.site-preview.yaml, which runs from main only, picks
# up the export when this run succeeds, writes the preview's noindex header
# itself and uploads it; for a fork it first waits for a maintainer's approval.
#
# Path-filtered like the website's release: only site/ changes (or this
# workflow) make a preview.
# =============================================================================

name: preview.site

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "site/**"
      - ".github/workflows/preview.site.yaml"

permissions:
  contents: read

concurrency:
  # One build per pull request at a time; a newer push cancels an older build.
  group: preview.site-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: site/.nvmrc

      - name: Build site
        run: |
          corepack enable
          make -C site build

      # publish.site-preview.yaml downloads this by name, from this run.
      - name: Upload the export
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site/out
          include-hidden-files: true
          retention-days: 3
