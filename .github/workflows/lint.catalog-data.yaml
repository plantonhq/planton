# =============================================================================
# Catalog Data Guard
# =============================================================================
# Fails the PR when the catalog's authored data products break their
# contracts: a catalog kind cost profile (cost.yaml), control profile
# (controls.yaml), or runner permissions manifest (iac/permissions.yaml)
# that fails strict schema parsing, references a control the central catalog
# does not define, skips a control the catalog does define, names a spec
# field path that no longer resolves against the served contract, or ships
# a permission entry without provenance or structural validity, or an AWS,
# Azure, or GCP permission action, a Cloudflare token permission group
# (name and scope), or a DigitalOcean token scope that does not exist in
# the provider's own inventory (pkg/iac/actioninventory's committed
# snapshots -- an invented or misspelled name cannot ship), or an AWS
# statement whose resource scope disagrees with its actions' published
# scopability (an ARN-scoped grant on a non-scopable action denies at
# runtime; a wildcard grant on all-scopable actions is wider than
# required), or a DigitalOcean alias scope (api:read/api:write expand to
# everything -- never least privilege). Also guards
# the central control catalog and framework crosswalks themselves
# (catalog/_compliance/) and the whole cost-estimate pipeline
# (catalog/_pricing/): the price books' pinned prices must carry sources
# and retrieval dates, the estimate models' quantities must name declared
# meters and resolvable prices, cluster-capacity kinds' capacity
# derivations must bind real spec structure, and the GENERATED estimates
# must be byte-identical to a fresh generation -- every multiplication and
# total re-computed exactly, every model/price-book/cost.yaml disagreement
# fatal, every unreferenced price rejected as dead weight.
#
# Enrollment is file presence -- every discovered sidecar is checked, no
# allowlist. See pkg/finops/costprofile, pkg/finops/pricebook,
# pkg/finops/estimatemodel, pkg/finops/estimategen (the drift gate),
# pkg/finops/costestimate, pkg/finops/costderivation,
# pkg/finops/capacityderivation, pkg/compliance/controlcatalog,
# pkg/compliance/controlprofile, pkg/iac/permissions,
# pkg/iac/actioninventory.
# =============================================================================

name: lint.catalog-data

on:
  pull_request:
    paths:
      - 'catalog/**'
      - 'pkg/finops/**'
      - 'pkg/compliance/**'
      - 'pkg/iac/permissions/**'
      - 'pkg/iac/actioninventory/**'
      - 'pkg/specpath/**'
      - 'pkg/yamlemit/**'
      # The Pulumi wait gate (pkg/iac/permissions) reads the provider SDK's
      # pin, the generated CRD SDKs, and the shared module helpers.
      - 'go.mod'
      - 'pkg/kubernetes/kubernetestypes/**'
      - 'pkg/iac/pulumi/pulumimodule/**'
      - '.github/workflows/lint.catalog-data.yaml'
  push:
    branches:
      - main
    paths:
      - 'catalog/**'
      - 'pkg/finops/**'
      - 'pkg/compliance/**'
      - 'pkg/iac/permissions/**'
      - 'pkg/iac/actioninventory/**'
      - 'pkg/specpath/**'
      - 'pkg/yamlemit/**'
      # The Pulumi wait gate (pkg/iac/permissions) reads the provider SDK's
      # pin, the generated CRD SDKs, and the shared module helpers.
      - 'go.mod'
      - 'pkg/kubernetes/kubernetestypes/**'
      - 'pkg/iac/pulumi/pulumimodule/**'
      - '.github/workflows/lint.catalog-data.yaml'

permissions:
  contents: read

jobs:
  catalog-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run catalog-data gates
        run: go test ./pkg/specpath/... ./pkg/finops/... ./pkg/compliance/... ./pkg/iac/permissions/... ./pkg/iac/actioninventory/...
