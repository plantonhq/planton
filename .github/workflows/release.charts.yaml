# =============================================================================
# Infra Charts Release (Reusable Workflow)
# =============================================================================
# Packages the InfraChart catalog (the charts/ tree) as a single versioned zip
# and attaches it - with its checksum and a version pointer - to the GitHub
# Release that the orchestrator's github-release job already created for this
# tag. There is nothing to "build": a chart is just files (Chart.yaml +
# values.yaml + templates/), so this is a publish step, not a build pipeline.
#
# Why an explicit checksummed asset instead of GitHub's auto source archive:
#   - GitHub does NOT guarantee byte-stable source archives, so a pinned
#     SHA-256 can silently break. We emit the zip and its checksum together, so
#     the hash is stable by construction. A consumer composes real cloud
#     infrastructure from these charts, so integrity verification matters.
#   - The auto `main.zip` is continuous; a tagged release gives a deliberate
#     cadence.
#
# Consumers fetch the three assets from the PINNED per-tag URLs
# (releases/download/<tag>/...): the plantond daemon fetches the tag its build
# is pinned to, and the operator hands the same pinned URL to the control
# plane's JVM seeder. Charts are validated by protos generated from this same
# tag, so consumer and bundle can never drift. (The `latest` URLs still
# resolve -- pre-pinning desktop builds in the field read them -- which is why
# what the newest release publishes remains fleet-sensitive until those
# builds age out.)
#
# Called by: .github/workflows/release.yaml (after its github-release job
# publishes the release). Not triggered directly - it rides every release,
# stable and release candidate alike, so every pinnable tag carries its own
# bundle; a candidate's release is a pre-release, which `latest` never names.
# =============================================================================

name: release.charts

on:
  workflow_call:

permissions:
  contents: write

jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Release gate: the bundle must be publishable BY THIS TAG'S OWN
      # contract before it ships. The same two gates as the PR lane
      # (lint.charts.yaml) run here against the tag itself, because the PR
      # lane guards main, not the ref being released: the structure guard
      # (incl. the apiVersion identity every control plane's proto constraint
      # enforces at apply) and the offline validator built FROM THIS TAG --
      # charts and the protos that validate them come from one release, so a
      # release can never publish charts its own tree rejects. An unguarded
      # publish once shipped charts that bricked every installed desktop.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify chart structure
        run: bash ./hack/guards/ensure_chart_structure.sh

      # Validation runs the minimal chart-validator binary, NOT the full CLI:
      # same command, same engine, same verdicts (pkg/infrachart/validatecmd
      # is the single implementation all mounts share), but without the
      # pulumi/cloud SDKs in the build graph. The full-CLI build spent 6-9
      # minutes here (measured v0.4.1-v0.4.4) and was this job's entire cost
      # -- packaging is 1 second -- which also made it the long pole of the
      # release's artifact-ready point that the platform's upgrade gate waits
      # on. The validator must still be built FROM THIS TAG: its bulk is the
      # generated contract (kind schemas + CEL rules), which changes every
      # release -- never swap this for a prebuilt/committed binary.
      - name: Validate charts against this tag's own contract
        run: |
          set -euo pipefail
          go build -o /tmp/chart-validator ./cmd/chart-validator
          if find charts -type f -name 'Chart.yaml' -not -path '*/build/*' | grep -q .; then
            /tmp/chart-validator --all charts/
          else
            echo "no charts in the tree; nothing to validate"
          fi

      - name: Package and attach the chart catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"

          # `git archive` zips exactly the tracked charts/ tree: gitignored
          # build/ outputs are excluded automatically and the result is
          # deterministic. The natural charts/ root is fine - the daemon's
          # seeder walks the whole tree and finds charts by Chart.yaml presence.
          git archive --format=zip -o infra-charts.zip HEAD charts/

          # Checksum emitted alongside the zip it describes -> stable by construction.
          sha256sum infra-charts.zip | awk '{print $1}' > infra-charts.sha256

          # The latest pointer consumers read to decide whether to re-download.
          printf '%s\n' "${VERSION}" > version.txt

          echo "Built infra-charts.zip ($(wc -c < infra-charts.zip) bytes), sha256=$(cat infra-charts.sha256)"

          # Attach to the release the github-release job already created for this tag.
          # --clobber makes a re-run of the tag idempotent.
          gh release upload "${VERSION}" \
            infra-charts.zip \
            infra-charts.sha256 \
            version.txt \
            --clobber
