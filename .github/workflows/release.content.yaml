# =============================================================================
# Content Distribution Release (Reusable Workflow)
# =============================================================================
# Packages Planton content into eight zips and uploads them to Cloudflare R2
# (downloads.planton.ai). These zips decouple downstream consumers (e.g. the
# Planton upgrade-planton script) from needing a local Planton checkout.
#
# Every artifact is built by its OWN job so the Actions UI shows exactly what
# a release ships -- the job list IS the artifact inventory. The six
# source-file zips share one matrix job (each entry displayed by artifact
# name); the catalog bundle and the catalog schemas have dedicated jobs
# because they are compiled, verified artifacts with their own toolchain
# (Go + buf), not file collections.
#
# Artifacts created:
#   presets.zip           -- Preset YAML + MD, kind enum proto
#   iac-source.zip        -- IaC module source (.go, .tf, .md, .yaml) plus the
#                            provider import catalogs (aa_import/catalog.yaml)
#   catalog-pages.zip     -- Per-kind-root catalog.md
#   proto-source.zip      -- Raw proto source (spec, api, input, outputs)
#   reference-pack.zip    -- Kind reference pack (generated reference pages,
#                            indexes, cross-reference graph, commons, GUIDE.md /
#                            patterns wisdom layer)
#   conversion-corpus.zip -- The golden conversion corpus: authored
#                            ConversionSpecs + testdata fixtures. Engine
#                            certification data (every conversion engine,
#                            in-repo or external, gates on this one corpus).
#   catalog-bundle.zip    -- The catalog as DATA: buf-built descriptor set
#                            (schemas + validation rules + kind registry),
#                            conversion specs, presets, catalog entries,
#                            checksummed manifest. Verified against the
#                            compiled registry BEFORE upload; a non-conformant
#                            bundle fails the release.
#   catalog-schemas.zip   -- One JSON schema document per catalog .proto (the
#                            pkg/catalogschema published contract, authored
#                            source included) for consoles and tools that
#                            render API contracts without compiling protos.
#                            Verified against the compiled registry BEFORE
#                            upload; an incomplete artifact fails the release.
#
# Upload path: s3://planton-foundation-downloads/releases/{tag}/content/{name}.zip
# Public URL:  https://downloads.planton.ai/releases/{tag}/content/{name}.zip
#
# Kind logos publish separately to VERSIONLESS keys -- they are branding
# assets, not release-coupled binaries, so their URLs must never churn:
#   s3://planton-foundation-downloads/catalog/logos/{provider}/{kind}/logo.svg
#   https://downloads.planton.ai/catalog/logos/{provider}/{kind}/logo.svg
# Chart iconUrl fields and platform-generated seed iconUrls embed these URLs.
# A changed logo may serve stale for the CDN cache TTL (accepted: logos
# change rarely; add a purge step only if that ever matters).
# The sync deliberately has NO --delete: versionless keys must keep serving
# consoles pinned to OLDER releases, so a kind rename orphans its old
# key by design instead of breaking every pinned consumer of it.
# After the sync, every staged key is verified SERVING through the public
# CDN URL (200 + image/svg+xml) -- a release whose logos fail to serve
# fails loudly here instead of shipping broken icons silently. A release
# candidate (prerelease input) publishes its zips at its own tag and leaves
# the versionless logos to the stable releases.
#
# Called by: .github/workflows/release.yaml (after its github-release job creates the release)
# =============================================================================

name: release.content

on:
  workflow_call:
    inputs:
      # True for a release candidate (vX.Y.Z-rc.N), decided once by
      # release.yaml's github-release job.
      prerelease:
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_R2_ACCESS_KEY_ID:
        required: true
      CLOUDFLARE_R2_SECRET_ACCESS_KEY:
        required: true
      CLOUDFLARE_R2_ENDPOINT:
        required: true

permissions:
  contents: read

env:
  R2_BUCKET: planton-foundation-downloads

jobs:
  # One matrix entry per source-file zip, displayed by artifact name.
  # fail-fast is off: the artifacts are independent, so one broken selector
  # must not cancel the other uploads.
  zip:
    name: ${{ matrix.zip }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        zip:
          - presets
          - iac-source
          - catalog-pages
          - proto-source
          - reference-pack
          - conversion-corpus
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package ${{ matrix.zip }}.zip
        run: bash tools/ci/release/package_content.sh "${GITHUB_REF_NAME}" "${{ matrix.zip }}"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: |
          R2_KEY="releases/${GITHUB_REF_NAME}/content/${{ matrix.zip }}.zip"
          aws s3 cp "${{ matrix.zip }}.zip" "s3://${R2_BUCKET}/${R2_KEY}" \
            --endpoint-url "${AWS_ENDPOINT_URL}" \
            --cache-control "public, max-age=31536000, immutable"
          echo "uploaded: https://downloads.planton.ai/${R2_KEY}"

  logos:
    if: ${{ !inputs.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage kind logos
        run: |
          # Stage into build/logos/{provider}/{kind}/logo.svg so the sync
          # maps 1:1 onto the versionless key shape. The _test refusal and
          # the empty-selection failure mirror package_content.sh's guards.
          mkdir -p build/logos
          count=0
          for f in catalog/*/*/logo.svg; do
            case "$f" in
              catalog/_test/*)
                echo "ERROR: _test provider content must never ship: $f"
                exit 1
                ;;
            esac
            dest="build/logos/${f#catalog/}"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "ERROR: no logos selected -- the selector no longer matches the tree"
            exit 1
          fi
          echo "staged ${count} logos"

      - name: Upload to R2 (versionless keys)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: |
          aws s3 sync build/logos "s3://${R2_BUCKET}/catalog/logos" \
            --content-type image/svg+xml \
            --cache-control "public, max-age=3600" \
            --endpoint-url "${AWS_ENDPOINT_URL}"
          echo "uploaded: https://downloads.planton.ai/catalog/logos/{provider}/{kind}/logo.svg"

      - name: Verify every logo serves through the CDN
        run: |
          # HEAD every staged key on the PUBLIC url -- the path users hit,
          # not the S3 API -- asserting 200 and the svg content type. This
          # is the release's proof that what it staged is what the world
          # gets; a sync that silently skipped or a key that serves the
          # wrong type fails the release here.
          fails=0
          checked=0
          for f in build/logos/*/*/logo.svg; do
            key="${f#build/logos/}"
            url="https://downloads.planton.ai/catalog/logos/${key}"
            read -r code ctype <<<"$(curl -sfI -o /dev/null -w '%{http_code} %{content_type}' \
              --retry 3 --retry-delay 5 --retry-all-errors "$url")"
            checked=$((checked + 1))
            if [ "$code" != "200" ] || [ "${ctype%%;*}" != "image/svg+xml" ]; then
              echo "FAIL: $url -> $code $ctype"
              fails=$((fails + 1))
            fi
          done
          echo "verified ${checked} logos serving (${fails} failures)"
          [ "$fails" -eq 0 ]

  catalog-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Build and verify the catalog bundle
        run: |
          make build-catalog-bundle tag="${GITHUB_REF_NAME}"
          make verify-catalog-bundle

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: |
          R2_KEY="releases/${GITHUB_REF_NAME}/content/catalog-bundle.zip"
          aws s3 cp "build/catalog-bundle.zip" "s3://${R2_BUCKET}/${R2_KEY}" \
            --endpoint-url "${AWS_ENDPOINT_URL}" \
            --cache-control "public, max-age=31536000, immutable"
          echo "uploaded: https://downloads.planton.ai/${R2_KEY}"

  catalog-schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: Build and verify the catalog schemas
        run: |
          make build-catalog-schemas
          make verify-catalog-schemas

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: |
          R2_KEY="releases/${GITHUB_REF_NAME}/content/catalog-schemas.zip"
          aws s3 cp "build/catalog-schemas.zip" "s3://${R2_BUCKET}/${R2_KEY}" \
            --endpoint-url "${AWS_ENDPOINT_URL}" \
            --cache-control "public, max-age=31536000, immutable"
          echo "uploaded: https://downloads.planton.ai/${R2_KEY}"
