# =============================================================================
# Vocabulary Guard
# =============================================================================
# Fails the PR when a tracked file carries a spelling Planton does not use for
# its own concepts -- one idea, one word, the same in the console, the CLI,
# the API, the docs and the code. pkg/vocabulary/vocabulary.yaml states the
# words, the spellings they replace, and the narrow allowances for other
# people's words (a vendor's API or type, a vendor's CLI) and for addresses
# the outside world already holds.
#
# To fix a failure: write the word the finding names. Never add an allowance
# for a Planton word. See pkg/vocabulary.
# =============================================================================

name: lint.vocabulary

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  vocabulary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run vocabulary gate
        run: go test ./pkg/vocabulary/...
