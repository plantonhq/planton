# -----------------------------------------------------------------------------

name: e2e-operator

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-operator-${{ github.ref }}
  cancel-in-progress: true

env:
  KIND_VERSION: v0.27.0
  # The operator serves no webhooks, so the kubebuilder suite's optional
  # cert-manager install is a minute of irrelevant network work per run.
  CERT_MANAGER_INSTALL_SKIP: 'true'

jobs:
  e2e:
    # ubuntu-latest, not a larger runner: this is a public repository, so standard
    # hosted runners are free while larger runners bill from the first minute
    # (founder direction 2026-09-17). Slower is fine; paid is not.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      - name: Install kind
        run: |
          go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run the operator Kind e2e lane
        run: make -C operator test-e2e

  chart-lifecycle:
    # ubuntu-latest, not a larger runner: this is a public repository, so standard
    # hosted runners are free while larger runners bill from the first minute
    # (founder direction 2026-09-17). Slower is fine; paid is not.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      - name: Install kind
        run: |
          go install "sigs.k8s.io/kind@${KIND_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run the chart lifecycle lane
        run: make -C operator test-chart-lifecycle
