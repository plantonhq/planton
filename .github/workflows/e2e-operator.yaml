# =============================================================================
# Operator E2E (Kind)
# =============================================================================
# Two Kind suites, each on its own cluster, zero cloud cost:
#
#   e2e             -- the operator's own end-to-end suite (operator/test/e2e):
#                      builds the manager image from the working tree, loads it
#                      into Kind, installs the CRDs and the manager through the
#                      kubebuilder path, and asserts the manager runs and serves
#                      metrics (KIND_CLUSTER=planton-operator-test-e2e). The same
#                      package also carries the vault restore lanes (two whole
#                      platform lifecycles, labeled vault-restore); this job runs
#                      the default label filter, which excludes them -- they run
#                      post-merge in e2e-operator-vault-restore.yaml, which queues
#                      rather than cancels and lets the suite install cert-manager.
#   chart-lifecycle -- the chart's lifecycle suite (operator/test/chartlifecycle):
#                      installs helm/planton-operator from the working tree and
#                      proves it owns its definitions (install, keep, reinstall,
#                      crds.keep=false), then rehearses both upgrade paths from
#                      the last published charts that predate that ownership --
#                      the adoption the chart explains, run verbatim, and the
#                      schema carried by the upgrade (KIND_CHART_CLUSTER=
#                      planton-operator-test-chart). Helm runs through its SDK;
#                      no helm binary is needed on the runner.
#
# Runs directly on the runner host, not in the CI toolchain container. Kind
# publishes the cluster's API server on the Docker host's loopback; inside a
# container job 127.0.0.1 is the job container, so kubectl can create the
# cluster (kind drives the node over the Docker socket) yet never reach it.
# The host runner has Docker and kubectl; kind is installed at the same pin the
# toolchain image carries (tools/ci/docker/Dockerfile).
#
# Triggers: pull requests and pushes touching operator/** or the two charts the
# lifecycle suite installs, a weekly schedule as the drift net (it also catches
# a published chart moving under the suite), and manual dispatch.
# =============================================================================

# -----------------------------------------------------------------------------
# PAUSED (founder direction 2026-09-17, GitHub Actions budget). This workflow
# runs on manual dispatch only: its push, pull_request, and schedule triggers
# are retired below, verbatim, so re-enabling is a restore and not a guess.
# In the first 17 days of September 2026 the automatic E2E runs on this
# repository cost about $25 in larger-runner minutes for proofs nobody was
# waiting on. Restore the block under `on:` when the budget allows.
#
# Retired triggers:
#    pull_request:
#      paths:
#        - 'operator/**'
#        - 'helm/planton-operator/**'
#        - 'helm/planton/**'
#        - '.github/workflows/e2e-operator.yaml'
#    push:
