# =============================================================================
# Terraform Modules Release (Reusable Workflow)
# =============================================================================
# Zips all Terraform component folders across all providers and
# uploads them to Cloudflare R2 (downloads.planton.dev).
#
# Features:
#   - Dynamic component discovery from directory structure
#   - Matrix-based parallelization: one job per provider
#   - Simple zip operation - no compilation needed
#   - Clear progress logging with component counts
#   - No hardcoded component paths - auto-discovers from filesystem
#
# Upload path: s3://downloads-dot-planton-dot-dev-bucket/releases/{tag}/modules/terraform/{component}/module.zip
# Public URL:  https://downloads.planton.dev/releases/{tag}/modules/terraform/{component}/module.zip
#
# Path pattern: catalog/{provider}/{component}/iac/tf (one live module set per
# component -- the key carries no API version segment; the release tag
# versions the artifact)
#
# Called by: .github/workflows/release.yaml (after CLI release creates the release)
# =============================================================================

name: release.terraform-modules

on:
  workflow_call:
    secrets:
      CLOUDFLARE_R2_ACCESS_KEY_ID:
        required: true
      CLOUDFLARE_R2_SECRET_ACCESS_KEY:
        required: true
      CLOUDFLARE_R2_ENDPOINT:
        required: true

permissions:
  contents: read

env:
  CATALOG_ROOT: catalog
  R2_BUCKET: downloads-dot-planton-dot-dev-bucket

jobs:
  # ============================================================================
  # Zip and upload all Terraform modules for each provider
  # ============================================================================
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        provider:
          - auth0
          - aws
          - azure
          - cloudflare
          - digitalocean
          - gcp
          - kubernetes
          - openfga
          - stripe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip and upload all Terraform modules
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          PROVIDER: ${{ matrix.provider }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PROVIDER_PATH="${CATALOG_ROOT}/${PROVIDER}"
          
          # Discover all components by listing directories
          if [ ! -d "$PROVIDER_PATH" ]; then
            echo "WARNING: Provider path not found: $PROVIDER_PATH"
            exit 0
          fi
          
          # Get all components that have a tf module. Modules live at the
          # component root (one live module set per component), so discovery
          # is a single-level walk with no version segment.
          COMPONENTS=()
          for component_dir in "$PROVIDER_PATH"/*/; do
            component=$(basename "$component_dir")
            if [ -d "${component_dir}iac/tf" ]; then
              COMPONENTS+=("${component}")
            fi
          done
          
          TOTAL=${#COMPONENTS[@]}
          
          echo "========================================"
          echo "PROVIDER: ${PROVIDER}"
          echo "TERRAFORM MODULES: ${TOTAL}"
          echo "========================================"
          echo ""
          echo "Modules:"
          printf '  - %s\n' "${COMPONENTS[@]}"
          echo ""
          echo "========================================"
          
          if [ $TOTAL -eq 0 ]; then
            echo "WARNING: No Terraform modules found for provider ${PROVIDER}"
            exit 0
          fi
          
          COMPLETED=0
          FAILED=0
          
          for component in "${COMPONENTS[@]}"; do
            COMPLETED=$((COMPLETED + 1))
            REMAINING=$((TOTAL - COMPLETED))
            
            TF_PATH="${PROVIDER_PATH}/${component}/iac/tf"
            ARTIFACT_NAME="${component}_module.zip"
            R2_KEY="releases/${TAG}/modules/terraform/${component}/module.zip"
            
            echo ""
            echo "----------------------------------------"
            echo "ZIPPING: ${component}"
            echo "Progress: ${COMPLETED}/${TOTAL} (${REMAINING} remaining)"
            echo "----------------------------------------"
            
            # Apache-2.0 §4(d): LICENSE and NOTICE must accompany every
            # redistribution, and a module zip is a standalone redistribution of
            # that component. Both land at the zip root; terraform ignores
            # non-.tf files, so consumers are unaffected.
            if (cd "${TF_PATH}" && zip -r "${GITHUB_WORKSPACE}/${ARTIFACT_NAME}" .) \
              && zip -j "${GITHUB_WORKSPACE}/${ARTIFACT_NAME}" LICENSE NOTICE; then
              
              ZIP_SIZE=$(ls -lh "${ARTIFACT_NAME}" | awk '{print $5}')
              echo "Created: ${ARTIFACT_NAME} (${ZIP_SIZE})"
              
              # Upload to R2
              if aws s3 cp "${ARTIFACT_NAME}" "s3://${R2_BUCKET}/${R2_KEY}" \
                --endpoint-url "${AWS_ENDPOINT_URL}"; then
                echo "✓ Uploaded: https://downloads.planton.dev/${R2_KEY}"
                LAST_UPLOADED_KEY="${R2_KEY}"
              else
                echo "✗ ERROR: Failed to upload ${ARTIFACT_NAME} to R2"
                FAILED=$((FAILED + 1))
              fi
              
              # Clean up
              rm -f "${ARTIFACT_NAME}"
            else
              echo "✗ ERROR: Failed to zip ${entry}"
              FAILED=$((FAILED + 1))
            fi
          done
          
          # Probe one uploaded artifact through the public URL. The CLI
          # composes these URLs from a shape it pins in its own tests
          # (pkg/downloads); this probe pins the OTHER half of the contract —
          # that what CI just uploaded actually serves at that shape. Without
          # it, a key-shape change here ships silently and every released CLI
          # degrades module fetches into full git clones.
          if [ -n "${LAST_UPLOADED_KEY:-}" ]; then
            PROBE_URL="https://downloads.planton.dev/${LAST_UPLOADED_KEY}"
            PROBE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -I "${PROBE_URL}")
            if [ "${PROBE_CODE}" = "200" ]; then
              echo "✓ Public URL probe passed: ${PROBE_URL}"
            else
              echo "✗ ERROR: uploaded artifact does not serve at its public URL (HTTP ${PROBE_CODE}): ${PROBE_URL}"
              FAILED=$((FAILED + 1))
            fi
          fi
          
          echo ""
          echo "========================================"
          echo "JOB SUMMARY: ${PROVIDER}"
          echo "========================================"
          echo "Total modules: ${TOTAL}"
          echo "Successfully zipped: $((TOTAL - FAILED))"
          echo "Failed: ${FAILED}"
          echo "========================================"
          
          if [ $FAILED -gt 0 ]; then
            echo "ERROR: ${FAILED} module(s) failed to zip"
            exit 1
          fi
