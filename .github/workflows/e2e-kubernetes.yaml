# =============================================================================
# Kubernetes E2E Tests
# =============================================================================
# Runs E2E tests for all Kubernetes components on kind clusters at zero cloud
# cost. Uses the E2E profile framework to dynamically discover testable
# components and generate a parallel test matrix.
#
# Architecture:
#   1. build-check: compile E2E code + go vet (fast gate, every trigger)
#   2. discover: read E2E profiles, output GitHub Actions matrix JSON
#   3. e2e: matrix of (tier × provisioner) cells, each with its own kind cluster
#      (on the host runner: a kind cluster is unreachable from a container job)
#   4. summary: aggregate JUnit results into GitHub Step Summary
#
# Triggers:
#   - Pull requests (path-filtered): build-check only (~2 min)
#   - Weekly schedule: full pipeline (build-check → discover → e2e → summary)
#   - Manual dispatch: configurable tier/provisioner filters
# =============================================================================

# -----------------------------------------------------------------------------
# PAUSED (founder direction 2026-09-17, GitHub Actions budget). This workflow
# runs on manual dispatch only: its push, pull_request, and schedule triggers
# are retired below, verbatim, so re-enabling is a restore and not a guess.
# In the first 17 days of September 2026 the automatic E2E runs on this
# repository cost about $25 in larger-runner minutes for proofs nobody was
# waiting on. Restore the block under `on:` when the budget allows.
#
# Retired triggers:
#    schedule:
#      - cron: '0 3 * * 0' # Weekly Sunday 3am UTC
#    pull_request:
#      paths:
#        - 'catalog/kubernetes/**'
#        - 'e2e/**'
#        - 'pkg/iac/**'
#        - 'pkg/e2e/**'
#        - 'go.mod'
#        - 'go.sum'
#        - 'Makefile'
#        - '.github/workflows/e2e-kubernetes.yaml'
# -----------------------------------------------------------------------------

name: e2e-kubernetes

on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'Tier to test (0 = all)'
        required: false
        default: '0'
        type: string
      provisioner:
        description: 'Provisioner filter (empty = all)'
        required: false
        default: ''
        type: string
concurrency:
  group: e2e-kubernetes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PULUMI_CONFIG_PASSPHRASE: ''
  # kind's version is coupled to the Kubernetes node image it pulls; keep in
  # lockstep with the toolchain image (tools/ci/docker/Dockerfile).
  KIND_VERSION: v0.27.0
  # CI runners are ephemeral: delete the kind cluster at teardown. Local runs keep
  # the cluster alive across back-to-back sessions (the harness's persistent lane).
  PLANTON_E2E_DESTROY_CLUSTER: '1'

jobs:
  # ============================================================================
  # Build Check -- fast compile + vet gate (every trigger)
  # ============================================================================
  build-check:
    runs-on: ubuntu-latest
    container: ghcr.io/plantonhq/planton/ci-toolchain:latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compile E2E tests
        run: make e2e-build

      - name: Vet E2E packages
        run: make e2e-vet

  # ============================================================================
  # Discover -- load pre-generated matrix JSON (no Go compilation needed)
  # ============================================================================
  discover:
    needs: build-check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Load and filter E2E matrix
        id: discover
        run: |
          FULL_MATRIX=$(cat .github/e2e-matrix-kubernetes.json)

          # Apply optional filters from workflow_dispatch
          TIER="${{ github.event.inputs.tier }}"
          if [ -n "$TIER" ] && [ "$TIER" != "0" ]; then
            FULL_MATRIX=$(echo "$FULL_MATRIX" | jq --argjson tier "$TIER" '{include: [.include[] | select(.tier == $tier)]}')
          fi

          PROV="${{ github.event.inputs.provisioner }}"
          if [ -n "$PROV" ]; then
            FULL_MATRIX=$(echo "$FULL_MATRIX" | jq --arg eng "$PROV" '{include: [.include[] | select(.engine == $eng)]}')
          fi

          echo "matrix=$(echo "$FULL_MATRIX" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "Matrix loaded:"
          echo "$FULL_MATRIX" | jq .

  # ============================================================================
  # E2E -- dynamic matrix, one kind cluster per cell
  # ============================================================================
  e2e:
    needs: discover
    if: github.event_name != 'pull_request'
    # On the HOST runner, not in the toolchain container: kind publishes the
    # cluster's API server on the Docker host's loopback, and inside a
    # container job 127.0.0.1 is the job container, so kubectl could create
    # the cluster (kind drives the node over the Docker socket) yet never
    # reach it. The tools the toolchain image carries are installed here at
    # the same pins (kind's version is coupled to the node image; the rest
    # track latest, as the image does). kubectl, helm and Docker are
    # preinstalled on ubuntu-latest.
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install kind and gotestsum
        run: |
          go install "sigs.k8s.io/kind@${KIND_VERSION}"
          go install gotest.tools/gotestsum@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Install Pulumi
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Run E2E tests
        run: |
          gotestsum \
            --format=testdox \
            --junitfile="results-${{ matrix.name }}.xml" \
            -- \
            -tags=e2e \
            -timeout=${{ matrix.timeout }}m \
            -v \
            -count=1 \
            -run '${{ matrix.run_regex }}' \
            ./e2e/...

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.name }}
          path: results-${{ matrix.name }}.xml
          retention-days: 30

  # ============================================================================
  # Summary -- aggregate results into GitHub Step Summary
  # ============================================================================
  summary:
    needs: e2e
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-results-*
          merge-multiple: true

      - name: Generate summary
        run: |
          echo "## Kubernetes E2E Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cell | Tests | Passed | Failed | Skipped | Duration |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|--------|--------|---------|----------|" >> "$GITHUB_STEP_SUMMARY"

          TOTAL_TESTS=0
          TOTAL_PASS=0
          TOTAL_FAIL=0
          TOTAL_SKIP=0

          for f in results-*.xml; do
            [ -f "$f" ] || continue
            CELL=$(basename "$f" .xml | sed 's/^results-//')

            TESTS="$(grep -c '<testcase' "$f" 2>/dev/null | tr -d '[:space:]')"
            TESTS="${TESTS:-0}"
            FAILURES="$(grep -oP 'failures="\K[0-9]+' "$f" 2>/dev/null | head -1 | tr -d '[:space:]')"
            FAILURES="${FAILURES:-0}"
            SKIPPED="$(grep -c '<skipped' "$f" 2>/dev/null | tr -d '[:space:]')"
            SKIPPED="${SKIPPED:-0}"
            TIME="$(grep -oP 'time="\K[0-9.]+' "$f" 2>/dev/null | head -1 | tr -d '[:space:]')"
            TIME="${TIME:-0}"
            PASSED=$((TESTS - FAILURES - SKIPPED))

            TOTAL_TESTS=$((TOTAL_TESTS + TESTS))
            TOTAL_PASS=$((TOTAL_PASS + PASSED))
            TOTAL_FAIL=$((TOTAL_FAIL + FAILURES))
            TOTAL_SKIP=$((TOTAL_SKIP + SKIPPED))

            STATUS="✅"
            [ "$FAILURES" -gt 0 ] && STATUS="❌"

            echo "| $STATUS $CELL | $TESTS | $PASSED | $FAILURES | $SKIPPED | ${TIME}s |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "| **Total** | **$TOTAL_TESTS** | **$TOTAL_PASS** | **$TOTAL_FAIL** | **$TOTAL_SKIP** | |" >> "$GITHUB_STEP_SUMMARY"

          if [ "$TOTAL_FAIL" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Failures" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            for f in results-*.xml; do
              [ -f "$f" ] || continue
              FAILURES="$(grep -oP 'failures="\K[0-9]+' "$f" 2>/dev/null | head -1 | tr -d '[:space:]')"
              FAILURES="${FAILURES:-0}"
              [ "$FAILURES" -gt 0 ] || continue

              CELL=$(basename "$f" .xml | sed 's/^results-//')
              echo "**$CELL:**" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              grep -A5 '<failure' "$f" 2>/dev/null | head -30 >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            done
          fi
