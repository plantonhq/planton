# =============================================================================
# Stigmer Skills Publish (Reusable Workflow)
# =============================================================================
# Publishes every skill in the definitions tree to the hosted Stigmer engine
# (Stigmer Cloud), so conversations pick up released skill content on their
# next message -- agents resolve skill references to the engine's latest
# version at every execution, no client update required.
#
# Planton holds TWO organizations on Stigmer Cloud, the shape of its identity
# tenants: planton-prod serves production, planton-preprod serves every
# environment below it (dev, demo). Both receive every skill, because dev and
# demo are copies of production with different configuration and the same
# skill bytes must be what every environment's conversations run. Each
# organization has its own API key, so the caller passes both secrets and the
# publish job selects by organization.
#
# The publish pushes the SAME deterministic archives the definitions release
# uploads to the CDN (pkg/skills/defspack builds them; the engine keys a
# skill version on the archive's SHA-256), and pkg/skills/stigmerpublish
# asserts after every push that the engine registered exactly the manifest's
# checksum. One content state, one checksum, everywhere. Re-publishing
# unchanged content is a no-op by construction, so running on every release
# can never spam versions.
#
# Job shape -- the Actions UI shows exactly what reached the engine:
#   package             builds the definitions release once and discovers
#                       the skill slugs from its manifest
#   publish (<slug>, <org>)  one job per skill per organization, pushes and
#                       verifies that skill there
#
# There is deliberately NO probe gate here: the same content already flows
# ungated to every local desktop through the definitions channel pointer,
# and probe-gating this lane only starved it (the founder retired the gate,
# 2026-08-13).
#
# Called by: .github/workflows/release.yaml (every full semver release) and
# auto-release.stigmer-skills.yaml (per-skill auto-releases).
# =============================================================================

name: release.stigmer-skills

on:
  workflow_call:
    inputs:
      skill:
        description: 'Limit the publish to one skill slug (default: every skill in the manifest)'
        required: false
        type: string
        default: ''
      version:
        description: 'Version stamped into the packaged manifest (default: the triggering ref name)'
        required: false
        type: string
        default: ''
    secrets:
      STIGMER_API_KEY_PLANTON_PROD:
        description: 'API key for the planton-prod organization on Stigmer Cloud'
        required: true
      STIGMER_API_KEY_PLANTON_PREPROD:
        description: 'API key for the planton-preprod organization on Stigmer Cloud'
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skills: ${{ steps.discover.outputs.skills }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Package definitions release
        # -embed-catalog-pack ships the catalog skill self-contained (its
        # components/ reference pack inside the archive). Artifacts above
        # the engines' 10MB inline lane ride the capability-URL transfer
        # lane; pushing them needs Stigmer SDK >= v3.12.3 (go.mod pins it).
        run: |
          VERSION="${{ inputs.version }}"
          go run ./pkg/skills/defspack -version "${VERSION:-$GITHUB_REF_NAME}" -out build/definitions -embed-catalog-pack

      - name: Discover skills
        id: discover
        run: |
          cd build/definitions
          if [ -n "${{ inputs.skill }}" ]; then
            # Scoped run: publish exactly the requested skill; a slug the
            # manifest does not carry must fail loudly, not publish nothing.
            if [ ! -f "skill-${{ inputs.skill }}.zip" ]; then
              echo "ERROR: skill '${{ inputs.skill }}' is not in the packaged manifest"
              exit 1
            fi
            skills=$(printf '%s' "${{ inputs.skill }}" | jq -R . | jq -cs .)
          else
            skills=$(find . -maxdepth 1 -name 'skill-*.zip' | sed -E 's|^\./skill-(.+)\.zip$|\1|' | sort | jq -R . | jq -cs .)
          fi
          echo "skills=$skills" >> "$GITHUB_OUTPUT"
          echo "skills: $skills"

      - name: Share the packaged release with the publish jobs
        uses: actions/upload-artifact@v4
        with:
          name: definitions-for-stigmer
          path: build/definitions/
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.package.outputs.skills) }}
        org: [planton-prod, planton-preprod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Download packaged release
        uses: actions/download-artifact@v4
        with:
          name: definitions-for-stigmer
          path: build/definitions

      - name: Publish skill ${{ matrix.slug }} to Stigmer Cloud (${{ matrix.org }})
        env:
          # One key per organization; the matrix's org selects it below.
          STIGMER_API_KEY_PLANTON_PROD: ${{ secrets.STIGMER_API_KEY_PLANTON_PROD }}
          STIGMER_API_KEY_PLANTON_PREPROD: ${{ secrets.STIGMER_API_KEY_PLANTON_PREPROD }}
        run: |
          case "${{ matrix.org }}" in
            planton-prod) export STIGMER_API_KEY="${STIGMER_API_KEY_PLANTON_PROD}" ;;
            planton-preprod) export STIGMER_API_KEY="${STIGMER_API_KEY_PLANTON_PREPROD}" ;;
            *) echo "::error::unknown organization '${{ matrix.org }}'"; exit 1 ;;
          esac
          if [ -z "${STIGMER_API_KEY}" ]; then
            echo "::error::the API key secret for ${{ matrix.org }} is not configured"
            exit 1
          fi
          go run ./pkg/skills/stigmerpublish \
            -dir build/definitions \
            -org "${{ matrix.org }}" \
            -skill "${{ matrix.slug }}" | tee -a "$GITHUB_STEP_SUMMARY"
