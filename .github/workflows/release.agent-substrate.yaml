# =============================================================================
# Agent Substrate Release: Planton's install set for upstream's release
# =============================================================================
# Agent Substrate (github.com/agent-substrate/substrate) publishes its release
# images itself from v1.0.0 (ghcr.io/agent-substrate/substrate/<image>:vX.Y.Z)
# but no pre-built install. Planton publishes one, for the one version
# tools/ci/release/agent-substrate.yaml declares, composed from the exact
# upstream tag and its published images:
#
#   Install: https://downloads.planton.ai/releases/agent-substrate/vX.Y.Z/
#            manifests/...  upstream's manifests/ tree, images pinned by digest
#            crds.yaml      the CRD bundle the kept-CRD mechanism fetches
#            images.json    the version, its install shape, the upstream
#                           commit, every pinned image
#            setup.sql      upstream's database setup script
#            LICENSE, third-party-licenses.tar.gz, SHA256SUMS (uploaded last)
#
# The lane is one script, tools/ci/release/publish_agent_substrate.sh, which a
# laptop runs the same way when Actions cannot (make release-without-actions
# tag=agent-substrate/vX.Y.Z). It resolves the tag to its commit, fetches each
# released image's index anonymously, composes and checks the set, and, when
# publishing, uploads it with publish_once.sh and verifies what an adopter
# downloads and pulls. tools/ci/release/compose_agent_substrate_release.py says
# why the install is upstream's whole tree rather than one file, and how a
# release claiming an earlier install shape is proven to share it.
#
# No step runs upstream's code: the composer reads upstream's files as text,
# and its images are pulled by nobody here. So the lane needs no isolation
# between a credential-free build and a publishing job, and runs as one job.
#
# Triggers:
#   - push of a tag agent-substrate/vX.Y.Z   (front door: make release-agent-substrate)
#   - pull_request touching this lane, its scripts or the declared version ->
#     rehearse the declared version: compose and check, publish nothing
#   - workflow_dispatch: re-run a version, or rehearse with dry_run=true
#
# Immutability. A version is sealed once its SHA256SUMS is on
# downloads.planton.ai: a later run composes nothing and only verifies what is
# published. Before the seal, a re-run is safe: publish_once.sh keeps every
# file already published, and the verify step fails any file a previous run
# left behind with other bytes.
# =============================================================================

name: release.agent-substrate

on:
  push:
    tags:
      - 'agent-substrate/v*'
  pull_request:
    paths:
      - '.github/workflows/release.agent-substrate.yaml'
      - 'tools/ci/release/agent-substrate.yaml'
      - 'tools/ci/release/compose_agent_substrate_release.py'
      - 'tools/ci/release/compose_agent_substrate_release_test.py'
      - 'tools/ci/release/ensure_release_tools.sh'
      - 'tools/ci/release/publish_agent_substrate.sh'
      - 'tools/ci/release/verify_agent_substrate_release.sh'
  workflow_dispatch:
    inputs:
      version:
        description: 'Agent Substrate version (vX.Y.Z); empty means the version tools/ci/release/agent-substrate.yaml declares'
        required: false
        type: string
      dry_run:
        description: 'Rehearse: compose and check, publish nothing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-agent-substrate-${{ github.ref }}
  # A newer push to a pull request supersedes its rehearsal; a publish always
  # runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve version and mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          case "${EVENT}" in
            push)         version="${GITHUB_REF_NAME#agent-substrate/}"; publish=true ;;
            pull_request) version=""; publish=false ;;
            *)            version="${INPUT_VERSION}"
                          if [ "${DRY_RUN}" = "true" ]; then publish=false; else publish=true; fi ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Rehearse
        if: steps.mode.outputs.publish != 'true'
        env:
          VERSION: ${{ steps.mode.outputs.version }}
        run: bash tools/ci/release/publish_agent_substrate.sh --rehearse ${VERSION:+"${VERSION}"}

      - name: Publish
        if: steps.mode.outputs.publish == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
          VERSION: ${{ steps.mode.outputs.version }}
        run: bash tools/ci/release/publish_agent_substrate.sh ${VERSION:+"${VERSION}"}
