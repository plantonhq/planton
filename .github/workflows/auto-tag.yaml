# =============================================================================
# Auto-Tag Creator
# =============================================================================
# Creates per-component pre-release tags and triggers the matching
# auto-release workflows via workflow_dispatch, one dispatch per tag.
#
# This workflow CREATES TAGS and TRIGGERS RELEASES - but does not build.
# The actual build/release is handled by the auto-release workflows.
#
# Tag Formats (pre-release of NEXT version):
#   - Pulumi: v{next}-pulumi.{kind}.{YYYYMMDD}.{N}
#   - Terraform: v{next}-terraform.{kind}.{YYYYMMDD}.{N}
#   - Stigmer skills: v{next}-skill.{slug}.{YYYYMMDD}.{N}
#
# Example: If latest release is v0.3.4, auto-releases become
# v0.3.5-pulumi.awsvpc.20260108.0. This ensures auto-release tags sort ABOVE
# the current release in GitHub's UI.
#
# Two kinds of lane, two triggers (founder direction, 2026-09-04):
#
#   - Skill lanes tag ON PUSH. The skills are definitions that a consumer
#     (Stigmer) reads the same day they change; a merge to main IS the
#     publish decision for them, and a push produces at most two skill tags
#     however many files it touched.
#   - Module lanes (Pulumi, Terraform) tag ON DISPATCH ONLY, via the
#     force_*_all flags. A merge to main is not a release decision for a
#     module; the unified release at a v* tag ships every module. The
#     change-based path detection these lanes used to run on push (and the
#     mass-change guard that throttled it) is retired; the detector script
#     stays in tools/ci/release/ for the day push module tags come back.
#     See .github/workflows/docs/auto-tags.md.
#
# Trigger: push to main touching a skill's published artifact; workflow_dispatch
# =============================================================================

name: auto-tag
run-name: "Auto-tag: ${{ github.event.head_commit.message || 'Manual dispatch' }}"

on:
  push:
    branches: [main]
    paths:
      # Stigmer skill lanes only: the authored skill trees, plus (for the
      # catalog skill, whose archive embeds the reference pack) every file
      # the pack assembler selects -- see pkg/skills/defspack/catalogpack.go.
      # No iac/ path here on purpose: module tags are dispatch-only.
      - 'skills/**'
      - 'catalog/**/reference.md'
      - 'catalog/**/GUIDE.md'
      - 'catalog/**/reference-index.md'
      - 'catalog/**/reference-graph.yaml'
      - 'catalog/**/reference-commons.md'
      - 'catalog/_patterns/**'

  workflow_dispatch:
    inputs:
      force_pulumi_all:
        description: 'Tag every Pulumi module (the only way module tags are cut)'
        required: false
        type: boolean
        default: false
      force_terraform_all:
        description: 'Tag every Terraform module (the only way module tags are cut)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write  # Required to trigger auto-release workflow

jobs:
  # ===========================================================================
  # Detect Changes and Create Tags
  # ===========================================================================
  create-tags:
    runs-on: ubuntu-latest
    outputs:
      pulumi_modules: ${{ steps.detect.outputs.pulumi_modules }}
      terraform_modules: ${{ steps.detect.outputs.terraform_modules }}
      stigmer_skills: ${{ steps.detect.outputs.stigmer_skills }}
      any_tags_created: ${{ steps.detect.outputs.any_tags_created }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes and create tags
        id: detect
        run: |
          set -e

          TODAY=$(date +%Y%m%d)
          ANY_TAGS_CREATED="false"

          # Configure git for tagging
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # =================================================================
          # Get latest semantic version and compute next version for auto-releases
          # =================================================================
          # Auto-releases are pre-releases of the NEXT version, so they sort above
          # the current release in GitHub's tag list.
          LATEST_SEMVER=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST_SEMVER" ]; then
            LATEST_SEMVER="v0.0.0"
            echo "No semantic version tags found, using default: ${LATEST_SEMVER}"
          else
            echo "Latest semantic version: ${LATEST_SEMVER}"
          fi

          # Increment patch version for auto-release base
          MAJOR=$(echo "$LATEST_SEMVER" | sed 's/v\([0-9]*\)\..*/\1/')
          MINOR=$(echo "$LATEST_SEMVER" | sed 's/v[0-9]*\.\([0-9]*\)\..*/\1/')
          PATCH=$(echo "$LATEST_SEMVER" | sed 's/v[0-9]*\.[0-9]*\.\([0-9]*\)/\1/')
          NEXT_PATCH=$((PATCH + 1))
          NEXT_SEMVER="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
          echo "Auto-release base version: ${NEXT_SEMVER}"

          # =================================================================
          # Get changed files (skill lanes only)
          # =================================================================
          # The module lanes never read this list: they are dispatch-only and
          # take their directories from the force flags below.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch - skill lanes idle, module lanes follow the force flags"
            CHANGED_FILES=""
          else
            echo "Detecting changes between ${{ github.event.before }} and ${{ github.sha }}"
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || git diff --name-only HEAD~1 HEAD)
            echo "Changed files:"
            echo "$CHANGED_FILES"
          fi

          # =================================================================
          # Module Directories (dispatch-only)
          # =================================================================
          # Module tags are cut only when a force flag asks for them, and then
          # for every module of that flavor. There is no change-based path on
          # push any more (see the header); when it comes back, the detector
          # is tools/ci/release/detect_module_dirs.sh.
          PULUMI_DIRS=""
          if [ "${{ inputs.force_pulumi_all }}" = "true" ]; then
            echo "Pulumi: all modules, forced via manual dispatch"
            PULUMI_DIRS=$(find catalog -type d -name "pulumi" -path "*/iac/pulumi" 2>/dev/null | sort)
          fi

          TERRAFORM_DIRS=""
          if [ "${{ inputs.force_terraform_all }}" = "true" ]; then
            echo "Terraform: all modules, forced via manual dispatch"
            TERRAFORM_DIRS=$(find catalog -type d -name "tf" -path "*/iac/tf" 2>/dev/null | sort)
          fi

          # =================================================================
          # Pulumi Modules Tags
          # =================================================================
          # Output JSON array with full module info for triggering releases.
          PULUMI_JSON="[]"

          for dir in $PULUMI_DIRS; do
            PROVIDER=$(echo "$dir" | sed 's|catalog/\([^/]*\)/.*|\1|')
            KIND=$(echo "$dir" | sed 's|catalog/[^/]*/\([^/]*\)/.*|\1|')

            # Skip test providers
            if [ "$PROVIDER" = "_test" ]; then
              continue
            fi

            TAG_PREFIX="${NEXT_SEMVER}-pulumi.${KIND}.${TODAY}"
            LATEST_TAG=$(git tag -l "${TAG_PREFIX}.*" 2>/dev/null | sort -t. -k2 -n | tail -1)
            if [ -z "$LATEST_TAG" ]; then
              NEXT_SEQ=0
            else
              CURRENT_SEQ=$(echo "$LATEST_TAG" | sed "s/${TAG_PREFIX}\.//")
              NEXT_SEQ=$((CURRENT_SEQ + 1))
            fi

            NEXT_TAG="${TAG_PREFIX}.${NEXT_SEQ}"
            echo "Creating Pulumi tag: ${NEXT_TAG} (${PROVIDER}/${KIND})"
            git tag -a "${NEXT_TAG}" -m "Auto-tag Pulumi module ${KIND} - ${NEXT_TAG}"
            git push origin "${NEXT_TAG}"
            
            # Add to JSON array
            PULUMI_JSON=$(echo "$PULUMI_JSON" | jq -c --arg tag "$NEXT_TAG" --arg comp "$KIND" --arg prov "$PROVIDER" --arg path "$dir" '. + [{"tag": $tag, "kind": $comp, "provider": $prov, "path": $path}]')
            ANY_TAGS_CREATED="true"
          done

          echo "pulumi_modules=${PULUMI_JSON}" >> $GITHUB_OUTPUT

          # =================================================================
          # Terraform Modules Tags
          # =================================================================
          # Output JSON array with full module info for triggering releases.
          TERRAFORM_JSON="[]"

          for dir in $TERRAFORM_DIRS; do
            PROVIDER=$(echo "$dir" | sed 's|catalog/\([^/]*\)/.*|\1|')
            KIND=$(echo "$dir" | sed 's|catalog/[^/]*/\([^/]*\)/.*|\1|')

            # Skip test providers
            if [ "$PROVIDER" = "_test" ]; then
              continue
            fi

            TAG_PREFIX="${NEXT_SEMVER}-terraform.${KIND}.${TODAY}"
            LATEST_TAG=$(git tag -l "${TAG_PREFIX}.*" 2>/dev/null | sort -t. -k2 -n | tail -1)
            if [ -z "$LATEST_TAG" ]; then
              NEXT_SEQ=0
            else
              CURRENT_SEQ=$(echo "$LATEST_TAG" | sed "s/${TAG_PREFIX}\.//")
              NEXT_SEQ=$((CURRENT_SEQ + 1))
            fi

            NEXT_TAG="${TAG_PREFIX}.${NEXT_SEQ}"
            echo "Creating Terraform tag: ${NEXT_TAG} (${PROVIDER}/${KIND})"
            git tag -a "${NEXT_TAG}" -m "Auto-tag Terraform module ${KIND} - ${NEXT_TAG}"
            git push origin "${NEXT_TAG}"
            
            # Add to JSON array
            TERRAFORM_JSON=$(echo "$TERRAFORM_JSON" | jq -c --arg tag "$NEXT_TAG" --arg comp "$KIND" --arg prov "$PROVIDER" --arg path "$dir" '. + [{"tag": $tag, "kind": $comp, "provider": $prov, "path": $path}]')
            ANY_TAGS_CREATED="true"
          done

          echo "terraform_modules=${TERRAFORM_JSON}" >> $GITHUB_OUTPUT

          # =================================================================
          # Stigmer Skill Tags
          # =================================================================
          # One tag per skill whose PUBLISHED ARTIFACT changed. A skill's
          # trigger set is its own skills/<slug>/ tree; the catalog skill's
          # archive additionally embeds the kind reference pack, so its
          # set extends to every file the pack assembler selects (mirrors
          # pkg/skills/defspack/catalogpack.go -- name-based, _test excluded).
          # These are the lanes that tag on push: a catalog-wide regeneration
          # sweep is still exactly one catalog-skill tag, and publishing
          # unchanged content downstream is a no-op by construction
          # (content-addressed engine), so there is nothing to throttle.
          SKILLS_JSON="[]"

          PLANTON_SKILL_CHANGED=$(echo "$CHANGED_FILES" | grep -cE '^skills/planton/' || true)
          CATALOG_SKILL_CHANGED=$(echo "$CHANGED_FILES" \
            | grep -vE '^catalog/_test/|/_test/' \
            | grep -cE '^skills/multi-cloud-catalog/|^catalog/(.+/)?(reference\.md|GUIDE\.md|reference-index\.md|reference-graph\.yaml|reference-commons\.md)$|^catalog/_patterns/.+\.md$' || true)

          CHANGED_SKILLS=""
          [ "$PLANTON_SKILL_CHANGED" -gt 0 ] && CHANGED_SKILLS="planton"
          [ "$CATALOG_SKILL_CHANGED" -gt 0 ] && CHANGED_SKILLS="$CHANGED_SKILLS multi-cloud-catalog"

          for SLUG in $CHANGED_SKILLS; do
            TAG_PREFIX="${NEXT_SEMVER}-skill.${SLUG}.${TODAY}"
            LATEST_TAG=$(git tag -l "${TAG_PREFIX}.*" 2>/dev/null | sort -t. -k2 -n | tail -1)
            if [ -z "$LATEST_TAG" ]; then
              NEXT_SEQ=0
            else
              CURRENT_SEQ=$(echo "$LATEST_TAG" | sed "s/${TAG_PREFIX}\.//")
              NEXT_SEQ=$((CURRENT_SEQ + 1))
            fi

            NEXT_TAG="${TAG_PREFIX}.${NEXT_SEQ}"
            echo "Creating Stigmer skill tag: ${NEXT_TAG} (${SLUG})"
            git tag -a "${NEXT_TAG}" -m "Auto-tag Stigmer skill ${SLUG} - ${NEXT_TAG}"
            git push origin "${NEXT_TAG}"

            SKILLS_JSON=$(echo "$SKILLS_JSON" | jq -c --arg tag "$NEXT_TAG" --arg skill "$SLUG" '. + [{"tag": $tag, "skill": $skill}]')
            ANY_TAGS_CREATED="true"
          done

          echo "stigmer_skills=${SKILLS_JSON}" >> $GITHUB_OUTPUT
          echo "any_tags_created=${ANY_TAGS_CREATED}" >> $GITHUB_OUTPUT

          # =================================================================
          # Summary
          # =================================================================
          echo ""
          echo "========================================"
          echo "TAG CREATION SUMMARY"
          echo "========================================"
          echo "Latest Release: ${LATEST_SEMVER}"
          echo "Auto-Release Base: ${NEXT_SEMVER}"
          echo "Tags Created: ${ANY_TAGS_CREATED}"
          echo "========================================"

  # ===========================================================================
  # Trigger Auto-Release for Each Tag
  # ===========================================================================
  trigger-releases:
    needs: create-tags
    if: needs.create-tags.outputs.any_tags_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Pulumi releases
        if: needs.create-tags.outputs.pulumi_modules != '[]'
        uses: actions/github-script@v7
        with:
          script: |
            const modules = JSON.parse('${{ needs.create-tags.outputs.pulumi_modules }}');
            for (const mod of modules) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'auto-release.pulumi-modules.yaml',
                ref: 'main',
                inputs: {
                  tag: mod.tag,
                  kind: mod.kind,
                  provider: mod.provider,
                  path: mod.path
                }
              });
              console.log('Triggered auto-release.pulumi-modules for: ' + mod.kind + ' (' + mod.tag + ')');
            }

      - name: Trigger Terraform releases
        if: needs.create-tags.outputs.terraform_modules != '[]'
        uses: actions/github-script@v7
        with:
          script: |
            const modules = JSON.parse('${{ needs.create-tags.outputs.terraform_modules }}');
            for (const mod of modules) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'auto-release.terraform-modules.yaml',
                ref: 'main',
                inputs: {
                  tag: mod.tag,
                  kind: mod.kind,
                  provider: mod.provider,
                  path: mod.path
                }
              });
              console.log('Triggered auto-release.terraform-modules for: ' + mod.kind + ' (' + mod.tag + ')');
            }

      - name: Trigger Stigmer skill releases
        if: needs.create-tags.outputs.stigmer_skills != '[]'
        uses: actions/github-script@v7
        with:
          script: |
            const skills = JSON.parse('${{ needs.create-tags.outputs.stigmer_skills }}');
            for (const entry of skills) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'auto-release.stigmer-skills.yaml',
                ref: 'main',
                inputs: {
                  tag: entry.tag,
                  skill: entry.skill
                }
              });
              console.log('Triggered auto-release.stigmer-skills for: ' + entry.skill + ' (' + entry.tag + ')');
            }

  # ===========================================================================
  # Summary
  # ===========================================================================
  summary:
    needs: [create-tags, trigger-releases]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        run: |
          echo "## Auto-Tag Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Tags Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-----|" >> $GITHUB_STEP_SUMMARY

          PULUMI_MODULES='${{ needs.create-tags.outputs.pulumi_modules }}'
          if [ "$PULUMI_MODULES" != "[]" ] && [ -n "$PULUMI_MODULES" ]; then
            echo "$PULUMI_MODULES" | jq -r '.[] | "| Pulumi: \(.kind) | `\(.tag)` |"' >> $GITHUB_STEP_SUMMARY
          fi

          TERRAFORM_MODULES='${{ needs.create-tags.outputs.terraform_modules }}'
          if [ "$TERRAFORM_MODULES" != "[]" ] && [ -n "$TERRAFORM_MODULES" ]; then
            echo "$TERRAFORM_MODULES" | jq -r '.[] | "| Terraform: \(.kind) | `\(.tag)` |"' >> $GITHUB_STEP_SUMMARY
          fi

          STIGMER_SKILLS='${{ needs.create-tags.outputs.stigmer_skills }}'
          if [ "$STIGMER_SKILLS" != "[]" ] && [ -n "$STIGMER_SKILLS" ]; then
            echo "$STIGMER_SKILLS" | jq -r '.[] | "| Stigmer skill: \(.skill) | `\(.tag)` |"' >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.create-tags.outputs.any_tags_created }}" != "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "_No tags were created: no skill artifact changed, and no module force flag was set (module tags are dispatch-only)._" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Note:** Component-specific auto-release workflows have been triggered for each tag above." >> $GITHUB_STEP_SUMMARY
          fi

