# Pull-consumer CloudflareQueue scenario: queue-level delivery settings plus
# an http_pull consumer -- the consumer resource's full lifecycle without
# needing a Worker (external clients would pull batches over the REST API).
# script_name is deliberately absent: it applies only to worker (push)
# consumers, which are offline-plan-proven (see e2e/worker-consumer-plan.yaml).
# The name carries the run id (queue names are unique within an account).
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareQueue
metadata:
  name: planton-oss-e2e-cloudflarequeue-pull-consumer
  id: planton-oss-e2e-cloudflarequeue-pull-consumer
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: cloudflarequeue
  annotations:
    planton.dev/e2e: "true"
    # The consumer STRUCTURALLY cannot round-trip: the upstream resource
    # ships no ImportState at v5.23.0, and the re-create path the runner
    # tolerates for not-importable types is rejected by Cloudflare because
    # the live consumer still exists -- POST .../consumers answers 400 code
    # 11004 "Queue ... already has a consumer" (measured 2026-08-26). One
    # consumer per queue is Cloudflare's documented model, so no recipe can
    # converge. The queue's own importer is proven by the minimal scenario.
    planton.dev/e2e-import-roundtrip-skip: >-
      cloudflare_queue_consumer has no upstream importer and its tolerated
      re-create is refused while the live consumer exists (400 code 11004
      "already has a consumer"; one consumer per queue by Cloudflare design,
      measured 2026-08-26) -- the consumer cannot round-trip on any recipe;
      the queue importer is proven by the minimal scenario.
  tags:
    - planton-e2e
spec:
  accountId: ${E2E_ENV:PLANTON_E2E_CLOUDFLARE_ACCOUNT_ID}
  queueName: planton-e2e-${E2E_RUN_ID}-q-pull
  settings:
    deliveryDelay: 5
    messageRetentionPeriod: 3600
  consumer:
    type: http_pull
    settings:
      batchSize: 5
      maxRetries: 3
      visibilityTimeoutMs: 60000
