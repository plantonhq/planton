# CloudflareQueue install profile used as a prerequisite by scenario-declared
# consumers (today: CloudflareR2Bucket's event-notification scenario, which
# delivers object events to a queue -- the edge is per-scenario, not a
# registry prerequisite, because a bucket does not require a queue). The
# fixture is minimal: a bare queue whose queue_id output the consumer's
# valueFrom resolves. The name is run-scoped (queue names are unique within
# an account). metadata.name stays stable -- it is the key consumers'
# valueFrom references resolve against.
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareQueue
metadata:
  name: planton-oss-e2e-cloudflarequeue-prereq
  id: planton-oss-e2e-cloudflarequeue-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: cloudflarequeue
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  accountId: ${E2E_ENV:PLANTON_E2E_CLOUDFLARE_ACCOUNT_ID}
  queueName: planton-e2e-${E2E_RUN_ID}-q-prereq
