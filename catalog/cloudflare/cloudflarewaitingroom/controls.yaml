# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflarewaitingroom
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The room stores queue configuration and cookie attributes at Cloudflare, not customer data this component encrypts.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No customer-managed key surface (see enc-at-rest).
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Room management traffic to the Cloudflare API is HTTPS. The component has no toggle that would send configuration in the clear.
    - control_id: no-public-access
      status: not_applicable
      notes: The room is a queue in front of an existing host+path, not a public endpoint this component exposes.
    - control_id: restricted-ingress
      status: configurable
      field_path: bypass_rules
      evidence:
        type: spec_default
        reference: bypass_rules[].expression selects which requests skip the queue; this list is the room's entire bypass table and replaces it on every apply.
      notes: Destroy PUTs an empty list and wipes rules created outside this manifest.
    - control_id: edge-protection
      status: configurable
      field_path: turnstile_mode
      evidence:
        type: spec_default
        reference: turnstile_mode and turnstile_action decide how the room challenges queued visitors at the edge. Non-off modes and infinite_queue need the Advanced add-on.
      notes: Default is invisible / log -- a bot check that records and lets through.
    - control_id: rbac
      status: not_applicable
      notes: Management access is Cloudflare account-membership posture; the room exposes no data plane of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The component holds no credentials.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication path of its own.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Cloudflare records waiting-room changes in the account audit log unconditionally -- not a property this component configures.
    - control_id: monitoring-integration
      status: not_applicable
      notes: Queue metrics live in the Cloudflare dashboard; this kind has no monitoring toggle.
    - control_id: backup-recovery
      status: not_applicable
      notes: Declarative configuration, fully re-creatable from the manifest. Destroy deletes the room and empties its bypass-rule table.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Zone-scoped room served by Cloudflare's global edge.
    - control_id: deletion-protection
      status: not_applicable
      notes: Destroy is a real delete of the room. The folded bypass-rules resource PUTs an empty list first, wiping rules created outside this manifest. Events that referenced waiting_room_id start failing their lookup.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- Cloudflare operates waiting rooms; no customer-visible patch surface exists.
