syntax = "proto3";

package dev.planton.cloudflare.cloudflarewaitingroom.v1alpha1;

import "catalog/cloudflare/cloudflarewaitingroom/v1alpha1/api.proto";
import "catalog/cloudflare/provider.proto";

// CloudflareWaitingRoomIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message CloudflareWaitingRoomIacInput {
  // target infra-component to be deployed
  CloudflareWaitingRoom target = 1;
  // provider-config for Cloudflare authentication
  dev.planton.cloudflare.CloudflareProviderConfig provider_config = 2;
}
