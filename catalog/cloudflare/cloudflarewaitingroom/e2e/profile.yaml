apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarewaitingroom
spec:
  # Waiting rooms under live E2E: the harness deploys the CloudflareDnsZone
  # prerequisite, resolves zone_id, creates the room (host = the run-scoped
  # fixture domain -- the same ${E2E_RUN_ID} token both manifests expand),
  # verifies via the zone's waiting_rooms API, destroys (real delete, honest
  # 404). The folded bypass-rules list rides the room's lane: Cloudflare
  # replaces the per-room list WHOLE on every apply, and the rules resource's
  # destroy PUTs [] -- on the run-scoped fixture zone that wipe is exactly
  # the zero-orphan behavior the lane wants. Watch items for the proving
  # session: (a) the live arm stays free-plan-safe -- Advanced-subscription
  # fields are plan-proven offline at e2e/advanced-plan.yaml and live proof
  # waits for the add-on (a recorded deferral); (b) the room needs no
  # traffic to prove its lifecycle -- thresholds at Cloudflare's floor of
  # 200 keep the object inert. Rooms create in seconds at zero cost.
  tier: 1
  status: deferred
  deferred_reason: >-
    Entitlement-blocked, measured live 2026-08-27: POST
    zones/{zone_id}/waiting_rooms answers 400 code 1034 "Zone not entitled to
    this functionality" on a free-plan zone (probe on a throwaway zone; the
    account's ACTIVE test zones are also free-plan). Cloudflare's own plan
    matrix (developers.cloudflare.com/waiting-room/plans, read 2026-08-27)
    gates Waiting Room availability at BUSINESS and above -- the authoring
    assumption "basic rooms are free-plan" was wrong -- and gates Waiting
    Room RULES and SCHEDULED EVENTS behind the Enterprise advanced add-on,
    so even a Business zone (~$250/mo) proves only a rule-less basic room.
    The offline bar (validate + the advanced-plan arm) remains this kind's
    shape proof. Unblock: a Business-plan (or Enterprise) zone injected via
    the env-gated ACTIVE-zone form -- redesign the scenario's zone reference
    to ${E2E_ENV:PLANTON_E2E_CLOUDFLARE_ZONE_ID} with a
    planton.dev/e2e-required-env gate, drop the bypass rule unless the zone
    carries the Enterprise advanced add-on, then both lanes unchanged.
  timeout_minutes: 10
