apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarepagesproject
spec:
  # A Pages project under live E2E: account-scoped -- deploy -> GET
  # accounts/{account_id}/pages/projects/{name} verify -> destroy ->
  # verify-destroyed on both provisioners. Identity is the project NAME, not
  # a UUID. Two scenarios: `minimal` (name + production_branch, the
  # provider's own minimal fixture -- no git source) and `kv-binding` (a
  # production KV namespace binding via a scenario-declared
  # CloudflareKvNamespace edge; a project does not require a namespace, so
  # the edge is per-scenario). Deliberately not live: git-connected source
  # (needs a one-time dashboard authorization) and custom domains (sit
  # pending forever on a throwaway name; proven by an offline plan at
  # e2e/domains-plan.yaml). Watch: secrets in deployment_configs do not
  # survive import; build_config may normalize to null. Free; objects
  # create in seconds.
  tier: 1
  # Proven live 2026-08-28: both engines ran minimal + kv-binding (over the
  # consumer-scoped CloudflareKvNamespace fixture) through the full lifecycle
  # with the apply-idempotency re-plan green, plus blind import round-trips on
  # both Terraform scenarios -- zero tolerances CONSUMED (the pre-declared
  # build_config/deployment_configs normalization tolerances never fired on
  # the direct-upload shapes). All first-run.
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
