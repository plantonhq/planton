# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflarepagesproject
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The project stores the site's own published build artifacts -- content produced to be served publicly -- plus configuration. Secret environment variables are managed-secret references resolved just-in-time at deploy (the spec marks them sensitive), never plaintext in the manifest. Cloudflare exposes no per-project encryption-at-rest surface for a spec field to govern.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data-at-rest key surface exists for this component class (see enc-at-rest); Cloudflare offers no customer-managed-key option for Pages.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every deployment serves over HTTPS from Cloudflare's edge -- the project's own *.pages.dev subdomain is TLS-terminated by Cloudflare, and for each entry in domains the spec's contract states Cloudflare provisions and manages the certificate. No spec choice produces a plaintext-only site.
    - control_id: no-public-access
      status: not_applicable
      notes: A Pages project is a public website by design -- the spec's contract notes the *.pages.dev subdomain is always available. Restricting audience (for example gating preview deployments behind Cloudflare Access) is account-level Zero Trust configuration outside this spec.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The project exposes no ingress filter of its own -- inbound restriction for a custom domain lives on that domain's zone (WAF and IP access rules), managed by zone-scoped components, not by any field here.
    - control_id: edge-protection
      status: not_applicable
      notes: Request filtering attaches at the zone serving the custom domain (WAF rulesets, rate limiting), not on the Pages project object; the spec carries no filtering field. Traffic to the site does transit Cloudflare's edge, but the configurable protections belong to other components.
    - control_id: rbac
      status: not_applicable
      notes: Management access is governed by Cloudflare's account-level token model (the Pages Read/Write permission groups); the serving plane is anonymous public traffic. The spec carries no per-project access-control field because the provider offers none.
    - control_id: workload-identity
      status: configurable
      field_path: deployment_configs
      evidence:
        type: spec_default
        reference: The per-environment binding families (kv_namespaces, d1_databases, r2_buckets, queue_producers, services, and the rest) let Pages Functions reach Cloudflare services through platform-issued bindings -- no static credential is ever held by the Function for a bound resource. Foreign-key references resolve bound resources from other catalog kinds.
      notes: Preset 02-direct-upload-site binds a KV namespace keylessly; preset 01-git-connected-site declares no bindings. Secrets exist for external APIs the binding model cannot reach and are managed-secret references resolved at deploy.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The serving plane is an anonymous public website with no authentication path at all, and the management plane accepts only token-authenticated HTTPS -- there is no weaker legacy path to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Management operations against the project land in Cloudflare's account-level audit logs as account-wide posture; neither the spec nor the modules expose a per-project audit toggle.
    - control_id: monitoring-integration
      status: configurable
      field_path: build_config.web_analytics_tag
      evidence:
        type: spec_default
        reference: Setting web_analytics_tag (paired with the sensitive web_analytics_token) injects Cloudflare Web Analytics into served pages, exporting real-user traffic signals to the account's Web Analytics site. Both modules pass the pair through to the project's build configuration.
      notes: Neither shipped preset sets it. Functions observability beyond this (Workers Logs for Pages Functions) is account-plan behavior outside the spec.
    - control_id: backup-recovery
      status: not_applicable
      notes: The project holds no application data to back up -- deployments are immutable build artifacts fully re-creatable from the connected repository or a re-run of wrangler pages deploy, and the project configuration re-applies from this manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Deployments are served from Cloudflare's globally distributed network with no zonal or regional placement for this spec to configure -- there is no availability topology to choose.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither the Cloudflare API nor either official module exposes a deletion-protection flag for Pages projects; deletion succeeds whenever the credential allows it.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Cloudflare operates and patches the build fleet and the serving edge. The spec's build_image_major_version and compatibility_date fields pin behavior versions for reproducibility; the infrastructure running them is patched by Cloudflare with no customer maintenance surface.
