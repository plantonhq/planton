apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarezerotrustaccessgroup
spec:
  # An Access group under live E2E: the live scenarios are ACCOUNT-scoped (the
  # kind is dual-scope; account is the common, reusable case -- the
  # zone-scoped arm is offline-proven and recorded as not-wired in the
  # verifier, the ruleset precedent) -- deploy -> GET
  # accounts/{account_id}/access/groups/{group_id} verify -> destroy ->
  # verify-destroyed on both provisioners. Two scenarios: `minimal` (include:
  # everyone -- the smallest valid group) and `rule-mix` (include/exclude/
  # require lists over the self-contained rule types email, email_domain, ip,
  # geo -- the variants needing no IdP, list, or token setup). The
  # group-of-groups edge cannot ride a live lane (a group fixture for a group
  # is a self-kind fixture the framework rejects) -- it is proven by a real
  # offline plan at e2e/group-of-groups-plan.yaml. Entitlement: requires the
  # account's Zero Trust organization (team name) to exist -- a one-time
  # account setup, not a paid gate (Zero Trust Free covers 50 users). Objects
  # create in seconds at zero cost.
  tier: 1
  # Proven live 2026-08-26: both engines ran minimal + rule-mix through the
  # full lifecycle (deploy -> REST-API verify -> destroy -> verify-absent)
  # with the apply-idempotency re-plan green, plus blind import round-trips
  # on the Terraform lanes (tolerating the declared is_default
  # import-restore gap -- see the import catalog row).
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
