# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflarecustomhostname
spec:
  cloudflare:
    groups:
      - purpose: ManageHostname
        name: SSL and Certificates Write
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: Covers the Terraform module's single cloudflare_custom_hostname resource and the Pulumi module's matching CustomHostname resource -- create/update/delete the custom hostname and its ssl block via POST/PATCH/DELETE /zones/{zone_id}/custom_hostnames[/{id}] (the Create Custom Hostname endpoint reference's Accepted Permissions section names exactly this group -- https://developers.cloudflare.com/api/resources/custom_hostnames/methods/create/, retrieved 2026-08-22; neither engine performs secondary lookups). Group name verbatim from the Cloudflare API token permissions reference (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22).
      - purpose: ReadHostname
        name: SSL and Certificates Read
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: Read-side of the same resource -- refresh/import the custom hostname via GET /zones/{zone_id}/custom_hostnames/{id} (derived from the module's API surface).
