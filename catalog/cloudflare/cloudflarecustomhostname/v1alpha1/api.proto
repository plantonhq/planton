syntax = "proto3";

package dev.planton.cloudflare.cloudflarecustomhostname.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflarecustomhostname/v1alpha1/outputs.proto";
import "catalog/cloudflare/cloudflarecustomhostname/v1alpha1/spec.proto";
import "shared/metadata.proto";

// cloudflare-custom-hostname
message CloudflareCustomHostname {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareCustomHostname'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  CloudflareCustomHostnameSpec spec = 4 [(buf.validate.field).required = true];

  //status
  CloudflareCustomHostnameStatus status = 5;
}

// cloudflare-custom-hostname status
message CloudflareCustomHostnameStatus {
  //outputs
  //  cloudflare-custom-hostname outputs
  CloudflareCustomHostnameOutputs outputs = 1;
}
