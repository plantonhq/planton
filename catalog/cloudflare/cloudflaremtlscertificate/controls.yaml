# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflaremtlscertificate
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Cloudflare stores uploaded certificates (and the optional leaf private key) encrypted in its key infrastructure; the API never returns the key.
      notes: CA uploads used to validate clients carry no key at all -- the signing key stays in your PKI.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No customer-managed key surface -- Cloudflare's key infrastructure holds the upload.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The store exists to power mutual TLS -- its consumers authenticate encrypted connections by design.
      notes: Management traffic to the Cloudflare API is HTTPS unconditionally.
    - control_id: no-public-access
      status: not_applicable
      notes: The store is account-internal; nothing here is publicly served.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No ingress surface of its own.
    - control_id: edge-protection
      status: not_applicable
      notes: Trust material for client validation, not an edge-protection policy.
    - control_id: rbac
      status: not_applicable
      notes: Management access is Cloudflare account-membership posture; the store exposes no data plane of its own.
    - control_id: workload-identity
      status: configurable
      field_path: ca
      evidence:
        type: spec_default
        reference: A leaf upload (ca false, with private_key) IS a workload identity Cloudflare presents as a client; a CA upload (ca true) is the trust anchor validating such identities.
      notes: The flag is create-only -- the identity class of an upload never silently changes.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication path of its own. Prefer a scoped API token with Account SSL and Certificates Edit.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Cloudflare records store uploads and deletions in the account audit log unconditionally -- not a property this component configures.
    - control_id: monitoring-integration
      status: not_applicable
      notes: No metrics surface of its own; watch the expires_on output for rotation, which is this component's operational duty.
    - control_id: backup-recovery
      status: not_applicable
      notes: Declarative configuration re-creatable from the manifest PLUS the externally held PEM material -- the API never returns the key, so the secret store is the real backup.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The account store is served by Cloudflare's global control plane; consumers read it from every edge location.
    - control_id: deletion-protection
      status: not_applicable
      notes: Destroy is a real delete. Re-point consumers at replacement material BEFORE destroying -- an upload referenced by CA associations or Workers bindings strands them when it goes.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- Cloudflare operates the store; the customer's only lifecycle duty is certificate rotation.
