apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflaremtlscertificate
spec:
  # mTLS certificate under live E2E: account-scoped (no zone fixture) -- the
  # harness uploads the env-supplied CA certificate to the account store,
  # verifies via the account's mtls_certificates API, destroys (real
  # delete). A self-signed CA is the product's own use case here, so the
  # proof session mints one at setup (openssl, documented in the program's
  # account-setup guide); without the env var the lane skips honestly.
  # Measured truths from the proving session (2026-08-28): (a) EVERY field
  # is create-only at the API -- any in-place change plans a replace;
  # (b) Cloudflare canonicalizes the stored PEM to end with exactly one
  # trailing newline and the store is content-addressed (identical content
  # returns the existing certificate id; a live duplicate upload answers
  # 400 code 1471 "This certificate already exists") -- both modules
  # canonicalize certificates before sending, so the blind round-trip
  # proved at ZERO tolerances (the CA upload carries no key at all);
  # (c) a deleted certificate answers 400 code 1472 "Certificate not
  # found.", which the harness client classifies as absent.
  tier: 1
  # Proven live 2026-08-28: both engines through the full lifecycle on the
  # real account, plus the blind import round-trip on the Terraform lane at
  # zero tolerances.
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
