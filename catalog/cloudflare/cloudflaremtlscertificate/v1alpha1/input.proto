syntax = "proto3";

package dev.planton.cloudflare.cloudflaremtlscertificate.v1alpha1;

import "catalog/cloudflare/cloudflaremtlscertificate/v1alpha1/api.proto";
import "catalog/cloudflare/provider.proto";

// CloudflareMtlsCertificateIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message CloudflareMtlsCertificateIacInput {
  // target infra-component to be deployed
  CloudflareMtlsCertificate target = 1;
  // provider-config for Cloudflare authentication
  dev.planton.cloudflare.CloudflareProviderConfig provider_config = 2;
}
