# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: cloudflaremtlscertificate
spec:
  billing_model: free
  notes: The account mTLS certificate store is free on every plan -- uploads, storage, and deletion create no charge. The consumers that reference an upload (Authenticated Origin Pulls, Workers mTLS bindings) carry their own cost profiles.
