# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
#
# The similarly named "Access: Mutual TLS Certificates Write" group is NOT
# needed: it covers Cloudflare Access (Zero Trust) mTLS certificates, a
# different API surface from the account mTLS certificate store this module
# manages.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflaremtlscertificate
spec:
  cloudflare:
    groups:
      - purpose: ManageCertificate
        name: "Account: SSL and Certificates Write"
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Covers the Terraform module's single cloudflare_mtls_certificate resource and the Pulumi module's matching MtlsCertificate resource -- upload/delete the mTLS certificate via POST/DELETE /accounts/{account_id}/mtls_certificates[/{id}] (every argument is create-only, so update is replace -- delete + create) (derived from the module's API surface; neither engine performs secondary lookups). Group names verbatim from the Cloudflare API token permissions reference (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22).
      - purpose: ReadCertificate
        name: "Account: SSL and Certificates Read"
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Read-side of the same resources -- refresh/import the certificate via GET /accounts/{account_id}/mtls_certificates/{id} (derived from the module's API surface).
