# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflarezerotrusttunnelroute
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A route stores no customer data -- it is a routing-table entry in Cloudflare's control plane.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to key (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: The route carries no traffic itself -- packets following it ride the referenced tunnel's always-encrypted cloudflared connection (see the CloudflareZeroTrustTunnel profile).
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Advertising a CIDR through a tunnel exposes nothing publicly -- the range becomes reachable only to the account's authenticated WARP clients and connected tunnels inside Zero Trust; there is no field that could publish the range to the internet.
    - control_id: restricted-ingress
      status: configurable
      field_path: network
      evidence:
        type: spec_default
        reference: The advertised CIDR is the declared reachability scope -- only addresses inside network route through the tunnel, and the spec supports single-host advertisements (/32 or /128) for least-privilege routing.
      notes: Advertise the narrowest range that serves the need; a /8 route makes the whole private class reachable to every enrolled WARP user unless Gateway policies say otherwise (see rbac).
    - control_id: edge-protection
      status: not_applicable
      notes: The route moves packets; it inspects nothing. Traffic filtering for the advertised range is Gateway network-policy territory.
    - control_id: rbac
      status: not_applicable
      notes: The route grants reachability, not permission -- WHICH users may actually reach hosts in the advertised range is decided by Gateway network policies (CloudflareZeroTrustGatewayPolicy) and Access infrastructure applications, not by any field of this spec. Treat an advertised route as reachable-by-default for enrolled users until those policies restrict it.
    - control_id: workload-identity
      status: not_applicable
      notes: The component holds no credentials and calls no cloud APIs.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication path of its own.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Route changes land in the Cloudflare account audit log unconditionally -- not a property this component configures.
    - control_id: monitoring-integration
      status: not_applicable
      notes: No monitoring signal to switch; a route has no runtime of its own.
    - control_id: backup-recovery
      status: not_applicable
      notes: Declarative configuration, fully re-creatable from the manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The route is control-plane state on Cloudflare's global network; availability of the path is the tunnel's connector story, not the route's.
    - control_id: deletion-protection
      status: not_applicable
      notes: Destroy withdraws the advertisement -- WARP clients immediately lose the path to the range. That fails CLOSED (connectivity lost, nothing exposed); re-create the route to restore reachability.
    - control_id: managed-patching
      status: not_applicable
      notes: A route is static routing configuration; nothing runs, so nothing patches.
