syntax = "proto3";

package dev.planton.cloudflare.cloudflarezerotrusttunnelroute.v1alpha1;

// CloudflareZeroTrustTunnelRouteOutputs captures the outputs after provisioning a
// Cloudflare Tunnel route.
message CloudflareZeroTrustTunnelRouteOutputs {
  // The Cloudflare-assigned UUID of the route.
  string route_id = 1;

  // The private CIDR advertised by this route (echoed for convenience).
  string network = 2;
}
