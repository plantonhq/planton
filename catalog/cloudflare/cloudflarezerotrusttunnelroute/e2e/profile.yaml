apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarezerotrusttunnelroute
spec:
  # A tunnel route under live E2E: account-scoped, one registry prerequisite
  # (CloudflareZeroTrustTunnel -- the run-scoped bare-tunnel fixture) --
  # deploy -> GET accounts/{account_id}/teamnet/routes/{route_id} verify ->
  # destroy -> verify-destroyed on both provisioners. Two scenarios: `minimal`
  # (a CIDR routed through the tunnel fixture in the account's DEFAULT virtual
  # network -- route CIDRs are unique per virtual network, so two concurrent
  # runs on one account could collide there; the proof-queue watch-list
  # carries it) and `isolated-vnet` (the same-shaped CIDR inside a
  # scenario-declared virtual-network fixture -- collision-free and proving
  # the optional virtual_network_id edge). Cloudflare SOFT-DELETES routes
  # (GET 200 with deleted_at after destroy), so this kind's verifier uses the
  # deleted_at-aware probe. Objects create in seconds at zero cost (part of
  # Zero Trust Free).
  tier: 1
  # Proven live 2026-08-26: both engines ran minimal (account default vnet)
  # + isolated-vnet through the full lifecycle over the tunnel/vnet fixtures
  # (deploy -> REST-API verify -> destroy -> verify-absent via the deleted_at
  # soft-delete probe, live-confirmed) with the apply-idempotency re-plan
  # green, plus blind import round-trips on the Terraform lanes at a clean
  # no-op plan.
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
