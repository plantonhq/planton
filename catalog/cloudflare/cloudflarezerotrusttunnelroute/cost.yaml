# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: cloudflarezerotrusttunnelroute
spec:
  billing_model: free
  free_tier: "A tunnel route is a routing-table entry -- it advertises a private CIDR as reachable through a tunnel inside Cloudflare Tunnel, which Cloudflare's own landing page banners as \"Available on all plans\" (https://developers.cloudflare.com/tunnel/, fetched 2026-08-22). No meter counts routes, the size of the advertised range, or the traffic that follows the route."
  notes: "No field of this spec buys anything: network (the CIDR), the tunnel and virtual-network references, and comment are pure routing configuration. The real spend lives where the traffic actually flows: the machines running the tunnel's cloudflared connectors and the private infrastructure inside the advertised range bill as their own catalog kinds, and their egress rides that infrastructure's own network billing. The USERS who reach the range are the other real cost -- each WARP user who authenticates into Zero Trust consumes a seat, free through 50 users and per-user above, chosen at the account (https://developers.cloudflare.com/cloudflare-one/team-and-resources/users/seat-management/, fetched 2026-08-22). The route itself is free at any count."
