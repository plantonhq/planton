# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflarewaitingroomevent
spec:
  cloudflare:
    groups:
      - purpose: ManageEvent
        name: Waiting Rooms Write
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: Create/update/delete the event via POST/PATCH/DELETE /zones/{zone_id}/waiting_rooms/{waiting_room_id}/events[/{event_id}] (derived from the module's API surface). Covers the Terraform module's single cloudflare_waiting_room_event resource and the Pulumi module's matching WaitingRoomEvent resource; neither engine performs secondary lookups or data-source reads. Group names are from the Cloudflare API token permissions reference (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22); the reference's API-name table renders the pair as "Waiting Rooms Read" / "Waiting RoomsWrite" -- the missing space before "Write" is a rendering artifact affecting many rows of that page.
      - purpose: ReadEvent
        name: Waiting Rooms Read
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: Refresh/import the event via GET /zones/{zone_id}/waiting_rooms/{waiting_room_id}/events/{event_id} (derived from the module's API surface).
