apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarewaitingroomevent
spec:
  # Waiting room events under live E2E: the harness deploys the
  # CloudflareWaitingRoom prerequisite (whose own chain brings the run-scoped
  # zone), resolves waiting_room_id and zone_id, creates the event, verifies
  # via the room's events API, destroys (real delete, honest 404). The
  # scenario's window is fixed far-future (2030) -- deterministic, always
  # valid against the API's start-before-end and prequeue rules, and the
  # event never activates during a lane. Overrides are null-means-inherit;
  # the scenario sets the users pair (both together -- the API requires it)
  # to prove overrides live. Events are free-plan objects on the room,
  # created in seconds.
  tier: 1
  status: deferred
  deferred_reason: >-
    Entitlement-blocked, measured live 2026-08-27 through its prerequisite
    chain: the CloudflareWaitingRoom fixture cannot install on any zone this
    account carries (400 code 1034 "Zone not entitled" -- Waiting Room is
    Business+), and SCHEDULED EVENTS specifically are an Enterprise advanced
    add-on per Cloudflare's plan matrix
    (developers.cloudflare.com/waiting-room/plans, read 2026-08-27) -- a
    Business zone alone would not unblock this kind. The offline bar remains
    the shape proof. Unblock: an Enterprise zone with the advanced Waiting
    Room add-on, injected via the env-gated ACTIVE-zone form on both the
    room fixture and this kind's scenario; then both lanes unchanged.
  timeout_minutes: 10
