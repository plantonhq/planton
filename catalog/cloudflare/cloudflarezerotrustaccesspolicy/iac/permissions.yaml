# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflarezerotrustaccesspolicy
spec:
  cloudflare:
    groups:
      - purpose: ManagePolicy
        name: "Access: Apps and Policies Write"
        scope: com.cloudflare.api.account
        provenance: derived
        notes: This kind is account-scoped only (the spec requires account_id). Create/update/delete the policy via POST/PUT/DELETE /accounts/{account_id}/access/policies[/{policy_id}]. Covers the Terraform module's single cloudflare_zero_trust_access_policy resource and the Pulumi module's matching ZeroTrustAccessPolicy resource; Access groups, IdPs, and email lists appearing in rules are referenced by ID, never created or read by these modules. The write group is upgraded to documented provenance by the endpoint page cited here. Group names verbatim from the Cloudflare API token permissions reference (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22), cross-checked against the "Accepted Permissions" section of the Access policies create endpoint doc (https://developers.cloudflare.com/api/resources/zero_trust/subresources/access/subresources/policies/methods/create/, retrieved 2026-08-22), which names exactly one group.
      - purpose: ReadPolicy
        name: "Access: Apps and Policies Read"
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Refresh/import the policy via GET .../access/policies/{policy_id} (Write covers the whole lifecycle; Read is only needed for read-only credentials).
