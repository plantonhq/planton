apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: cloudflarezerotrustaccesspolicy
spec:
  # A standalone policy is account-scoped by API design, so its import ID is
  # the bare two-segment "{account_id}/{policy_id}" -- no scope prefix.
  # account_id is spec-relative; policy_id is the deploy's own output.
  values:
    - name: account_id
      derivations:
        - from_spec_field: account_id
      where_to_find: >-
        Cloudflare dashboard -> the account's Overview (Account ID in the
        right-hand API panel), or `GET /accounts` on the Cloudflare v4 API.
    - name: policy_id
      derivations:
        - from_output: policy_id
      where_to_find: >-
        Zero Trust dashboard -> Access -> Policies -> the policy (the policy
        ID is in the API, not the UI), or
        `GET /accounts/<account_id>/access/policies` on the Cloudflare v4
        API (the id field of the entry whose name matches).
