# Minimal CloudflareZeroTrustAccessPolicy scenario: the smallest valid
# standalone policy -- allow + include everyone. This is also the exact shape
# of the kind's install fixture (e2e/prerequisite.yaml), so the application
# lane and this lane prove the same object shape independently. The name
# carries the run id.
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareZeroTrustAccessPolicy
metadata:
  name: planton-oss-e2e-cloudflarezerotrustaccesspolicy-minimal
  id: planton-oss-e2e-cloudflarezerotrustaccesspolicy-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: cloudflarezerotrustaccesspolicy
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  accountId: ${E2E_ENV:PLANTON_E2E_CLOUDFLARE_ACCOUNT_ID}
  name: planton-e2e-${E2E_RUN_ID}-pol-min
  decision: allow
  include:
    - everyone: {}
