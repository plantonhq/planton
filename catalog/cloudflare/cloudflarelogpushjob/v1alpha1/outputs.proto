syntax = "proto3";

package dev.planton.cloudflare.cloudflarelogpushjob.v1alpha1;

// CloudflareLogpushJobOutputs captures the observable outputs after
// creating the Logpush job.
message CloudflareLogpushJobOutputs {
  // The Cloudflare-assigned numeric job ID, in string form.
  string job_id = 1;

  // The account the job lives in (account-scoped jobs).
  string account_id = 2;

  // The zone the job lives in (zone-scoped jobs).
  string zone_id = 3;

  // Name of the challenge file Cloudflare dropped into the destination
  // (only when the generate_ownership_challenge arm ran). Fetch the token
  // from this file and set spec.ownership_challenge.
  string ownership_challenge_filename = 4;

  // Message accompanying the issued challenge, when Cloudflare returns one.
  string ownership_challenge_message = 5;

  // Whether Cloudflare reported the destination valid when issuing the
  // challenge.
  bool ownership_challenge_valid = 6;
}
