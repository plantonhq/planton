syntax = "proto3";

package dev.planton.cloudflare.cloudflarelogpushjob.v1alpha1;

import "catalog/cloudflare/cloudflarelogpushjob/v1alpha1/api.proto";
import "catalog/cloudflare/provider.proto";

// CloudflareLogpushJobIacInput is the input to the IaC module. It
// contains the target resource and provider configuration.
message CloudflareLogpushJobIacInput {
  // target infra-component to be deployed
  CloudflareLogpushJob target = 1;
  // provider-config for Cloudflare authentication
  dev.planton.cloudflare.CloudflareProviderConfig provider_config = 2;
}
