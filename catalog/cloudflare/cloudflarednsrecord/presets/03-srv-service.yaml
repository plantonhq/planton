apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareDnsRecord
metadata:
  name: my-srv-record
spec:
  zoneId:
    value: <cloudflare-zone-id>
  name: _sip._tcp
  type: SRV
  ttl: 3600
  # The typed record data is a proto oneof: its active case (srv, caa, ...)
  # sits at the spec top level -- never under a `data:` wrapper key.
  srv:
    priority: 10
    weight: 5
    port: 5060
    target:
      value: <service-hostname>
