syntax = "proto3";

package dev.planton.cloudflare.cloudflarednsrecord.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflarednsrecord/v1alpha1/outputs.proto";
import "catalog/cloudflare/cloudflarednsrecord/v1alpha1/spec.proto";
import "shared/metadata.proto";

// CloudflareDnsRecord is a Kubernetes Resource Model (KRM) style resource for managing
// individual DNS records within a Cloudflare DNS zone.
message CloudflareDnsRecord {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareDnsRecord'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  CloudflareDnsRecordSpec spec = 4 [(buf.validate.field).required = true];

  // status
  CloudflareDnsRecordStatus status = 5;
}

// CloudflareDnsRecordStatus represents the observed state of a Cloudflare DNS record.
message CloudflareDnsRecordStatus {
  // outputs from the IaC deployment
  CloudflareDnsRecordOutputs outputs = 1;
}
