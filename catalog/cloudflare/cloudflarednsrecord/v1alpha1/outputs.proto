syntax = "proto3";

package dev.planton.cloudflare.cloudflarednsrecord.v1alpha1;

// CloudflareDnsRecordOutputs captures the outputs after provisioning a Cloudflare DNS record.
// It includes the record's unique identifier and name for reference.
message CloudflareDnsRecordOutputs {
  // The unique identifier of the created DNS record in Cloudflare.
  string record_id = 1;

  // The DNS record name as declared in the spec (relative to the zone, e.g.
  // "www" or "@" for the apex). Deliberately NOT the API's echo: Cloudflare
  // normalizes names to the full FQDN on read, so echoing the refreshed value
  // would flip this output after the first refresh.
  string record_name = 2;

  // The DNS record type that was created.
  string record_type = 3;

  // Whether the record is proxied through Cloudflare (orange cloud).
  bool proxied = 4;

  // The Cloudflare Zone ID the record lives in. A record's API identity is
  // (zone_id, record_id), so downstream consumers -- verification tooling,
  // imports, chart blocks composing on the record -- need the zone alongside
  // the record's own id.
  string zone_id = 5;
}
