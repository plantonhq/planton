# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflareorigincacertificate
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The component stores no customer data -- it issues a certificate (public material) and, when no CSR is supplied, a private key that is handled as a sensitive output for the origin to mount. Neither is a data store this component owns.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to key (see enc-at-rest); the Origin CA API exposes no KMS surface.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Transit encryption is this component's entire product -- the issued certificate exists solely to encrypt the Cloudflare-to-origin hop so the zone can run Full (Strict) SSL mode, and no spec field can produce a cleartext alternative. The issuance API calls themselves ride HTTPS.
      notes: The certificate only takes effect once installed on the origin and the zone's SSL mode is raised to Full (Strict) -- both happen outside this component (the SSL mode is CloudflareZoneSettings territory).
    - control_id: no-public-access
      status: not_applicable
      notes: A certificate is not a network endpoint. It is deliberately NOT publicly trusted -- only Cloudflare's edge trusts the Origin CA -- so it cannot even be used to serve browsers directly.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network surface exists to filter; the certificate is key material, not a listener.
    - control_id: edge-protection
      status: not_applicable
      notes: The certificate receives no HTTP requests -- request filtering belongs to the zone's WAF and ruleset kinds.
    - control_id: rbac
      status: not_applicable
      notes: Issuance and revocation are governed by the Cloudflare API token's permission groups (account-membership posture); the certificate exposes no data plane of its own to authorize.
    - control_id: workload-identity
      status: not_applicable
      notes: The private key is TLS material for serving traffic, not a credential for calling cloud APIs; no workload authenticates AS this component.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication path of its own.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Cloudflare records certificate issuance and revocation in the account audit log unconditionally -- not a property this component configures.
    - control_id: monitoring-integration
      status: not_applicable
      notes: No monitoring signal to switch. Cloudflare documents that it does not send expiration notifications for Origin CA certificates -- track the expires_on output in your own certificate inventory (https://developers.cloudflare.com/ssl/origin-configuration/origin-ca/, fetched 2026-08-22).
    - control_id: backup-recovery
      status: not_applicable
      notes: Declarative configuration -- re-running the manifest issues a fresh certificate. The generated private key exists only as the sensitive output; if you discard it, re-issue rather than restore.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The certificate is account-scoped material trusted at every Cloudflare edge location; there is no zonal placement to configure.
    - control_id: deletion-protection
      status: not_applicable
      notes: Destroy revokes the certificate, and Cloudflare documents revocation as irreversible ("You cannot undo this process"). Origins still serving the revoked certificate keep answering Cloudflare until the edge notices, so swap the origin's certificate before destroying this resource.
    - control_id: managed-patching
      status: not_applicable
      notes: A certificate is static key material with no software to patch; rotation happens by re-issuing, not patching.
