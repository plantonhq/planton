syntax = "proto3";

package dev.planton.cloudflare.cloudflareorigincacertificate.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflareorigincacertificate/v1alpha1/outputs.proto";
import "catalog/cloudflare/cloudflareorigincacertificate/v1alpha1/spec.proto";
import "shared/metadata.proto";

// cloudflare-origin-ca-certificate
message CloudflareOriginCaCertificate {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareOriginCaCertificate'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  CloudflareOriginCaCertificateSpec spec = 4 [(buf.validate.field).required = true];

  //status
  CloudflareOriginCaCertificateStatus status = 5;
}

// cloudflare-origin-ca-certificate status
message CloudflareOriginCaCertificateStatus {
  //outputs
  //  cloudflare-origin-ca-certificate outputs
  CloudflareOriginCaCertificateOutputs outputs = 1;
}
