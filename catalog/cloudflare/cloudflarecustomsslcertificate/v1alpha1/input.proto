syntax = "proto3";

package dev.planton.cloudflare.cloudflarecustomsslcertificate.v1alpha1;

import "catalog/cloudflare/cloudflarecustomsslcertificate/v1alpha1/api.proto";
import "catalog/cloudflare/provider.proto";

// CloudflareCustomSslCertificateIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message CloudflareCustomSslCertificateIacInput {
  // target infra-component to be deployed
  CloudflareCustomSslCertificate target = 1;
  // provider-config for Cloudflare authentication
  dev.planton.cloudflare.CloudflareProviderConfig provider_config = 2;
}
