syntax = "proto3";

package dev.planton.cloudflare.cloudflarecustomsslcertificate.v1alpha1;

// CloudflareCustomSslCertificateOutputs captures the observable outputs
// after uploading a custom SSL certificate.
message CloudflareCustomSslCertificateOutputs {
  // The ID of the uploaded certificate.
  string certificate_id = 1;

  // The zone the certificate belongs to.
  string zone_id = 2;

  // When the certificate expires (RFC3339).
  string expires_on = 3;

  // Field 4 (status) was removed: deployment is asynchronous (a fresh
  // upload reports a pending state before turning active), so a
  // point-in-time phase can never be a stable output -- it flips on
  // the first refresh after the transition and re-plans forever (the class
  // was measured live 2026-08-28 on the sibling Authenticated Origin Pulls
  // certificate). Read deployment status from the Cloudflare API or
  // dashboard instead.
  reserved 4;
  reserved "status";
}
