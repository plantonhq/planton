# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflarewebanalyticssite
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Cloudflare stores the collected analytics; the component holds no customer data of its own beyond the site configuration.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Cloudflare offers no customer-managed key for RUM data.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The beacon posts measurements to Cloudflare over HTTPS; the snippet output references the https beacon script.
    - control_id: no-public-access
      status: not_applicable
      notes: The measurement token ships inside public pages by design (that is how a browser beacon works); the analytics data itself is readable only through the authenticated dashboard and API.
    - control_id: restricted-ingress
      status: configurable
      field_path: rules
      evidence:
        type: spec_default
        reference: The include/exclude rules bound which hosts and paths are measured at all -- the component's own scoping control.
    - control_id: edge-protection
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Beacon collection runs on Cloudflare's anycast edge with its standard DDoS posture.
    - control_id: rbac
      status: not_applicable
      notes: Who may manage sites is Cloudflare account-membership and API-token-scope posture (Account Settings Write).
    - control_id: workload-identity
      status: not_applicable
      notes: The beacon is unauthenticated browser JavaScript keyed by the site token; there is no workload identity surface.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No user-auth surface.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Site and rule changes land in the Cloudflare account audit log.
    - control_id: monitoring-integration
      status: configurable
      field_path: host
      evidence:
        type: spec_default
        reference: This component IS a monitoring surface -- privacy-first real-user monitoring for the declared host or zone.
    - control_id: backup-recovery
      status: not_applicable
      notes: Configuration-only surface, reproducible from the manifest; collected analytics are Cloudflare-retained.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: RUM retention is a Cloudflare plan property with no configurable knob at the provider.
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Cloudflare-operated SaaS collection on its global network; there is no zonal placement to configure.
    - control_id: deletion-protection
      status: not_applicable
      notes: No provider-side deletion guard; deleting a site stops measurement and retires its rules (see GUIDE.md).
    - control_id: managed-patching
      status: not_applicable
      notes: SaaS control plane and Cloudflare-served beacon script -- Cloudflare operates both.
