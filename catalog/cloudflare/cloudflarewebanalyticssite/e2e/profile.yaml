apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarewebanalyticssite
spec:
  # Web Analytics sites under live E2E: plain CRUD objects (real create,
  # update, delete on both the site and its folded rules), account-scoped,
  # free on every plan -- but the TOKEN needs Account Settings READ on top
  # of Write (measured 403/10000: the write half creates sites that its
  # holder cannot read back, breaking every provider refresh mid-lane).
  # MEASURED (live, 2026-08-27/28), all taught on spec/modules/GUIDE:
  # (1) rules exist ONLY on zone-linked sites -- host-identified sites have
  # no ruleset in any API response, so host+rules is structurally
  # undeployable (spec CEL wall added; the rules scenario is the env-gated
  # zone-linked form on the sanctioned active zone); (2) the create
  # response omits `snippet`, so both modules read-after-create (data
  # source / lookup) for the snippet/ruleset_id outputs; (3) auto_install
  # is echoed as a server-side false when never sent -- both modules
  # always-send it (the echoed-server-default class); (4) Cloudflare's
  # rule form requires EVERY field present (400/10001 per omitted field;
  # empty host is spelled "*") -- both modules always-send all four rule
  # fields; (5) the rule create is NOT upsert-convergent (409/10010
  # duplicateFound), so the rules arm's round-trip is scenario-skipped
  # with the delete-rules-first adoption recipe on the catalog row; the
  # site's own blind round-trip is proven by host-minimal, consuming
  # exactly the pre-declared no_refresh host tolerance; (6) the provider's
  # rule refresh is deliberately BLIND (empty Read) -- the idempotency
  # re-plan proves our declared rows only, never server drift; (7)
  # site_token and snippet reached the outputs map secret-marked without
  # landing in logs (the Pulumi lookup results re-marked via ToSecret).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
