# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: cloudflaresnippetrules
spec:
  billing_model: free
  notes: Snippet rules are included on every plan. Creating or replacing the zone's routing table creates no charge of its own. Snippet COUNT limits bill on the CloudflareSnippet side (and on the zone plan), never through this component.
