# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflaresnippetrules
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The routing table stores match expressions and snippet names at Cloudflare, not customer data this component encrypts.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No customer-managed key surface (see enc-at-rest).
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Rule-table management traffic to the Cloudflare API is HTTPS. The component has no toggle that would send expressions in the clear.
    - control_id: no-public-access
      status: not_applicable
      notes: The table is a zone singleton, not a public endpoint this component exposes.
    - control_id: restricted-ingress
      status: configurable
      field_path: rules
      evidence:
        type: spec_default
        reference: rules[].expression selects which requests invoke which snippet; this list is the entire ingress table for snippets on the zone.
      notes: Every apply replaces the whole table. Rules you did not declare disappear.
    - control_id: edge-protection
      status: configurable
      field_path: rules.enabled
      evidence:
        type: spec_default
        reference: enabled defaults TRUE in this spec (Cloudflare's provider default is FALSE) so a declared rule runs at the edge.
      notes: Set enabled false explicitly to stage a rule without activating it.
    - control_id: rbac
      status: not_applicable
      notes: Management access is Cloudflare account-membership posture; the table exposes no data plane of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The component holds no credentials.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication path of its own.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Cloudflare records snippet-rule changes in the account audit log unconditionally -- not a property this component configures.
    - control_id: monitoring-integration
      status: not_applicable
      notes: No monitoring signal to switch.
    - control_id: backup-recovery
      status: not_applicable
      notes: Declarative configuration. Destroy empties the zone's entire snippet-rule table, including rows created outside this manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Zone-scoped singleton served by Cloudflare's global edge.
    - control_id: deletion-protection
      status: not_applicable
      notes: Destroy wipes ALL snippet rules in the zone, including ones created outside this manifest. The snippets themselves survive. There is no selective delete.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- Cloudflare operates snippet rules; no customer-visible patch surface exists.
