syntax = "proto3";

package dev.planton.cloudflare.cloudflaresnippetrules.v1alpha1;

import "catalog/cloudflare/cloudflaresnippetrules/v1alpha1/api.proto";
import "catalog/cloudflare/provider.proto";

// CloudflareSnippetRulesIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message CloudflareSnippetRulesIacInput {
  // target infra-component to be deployed
  CloudflareSnippetRules target = 1;
  // provider-config for Cloudflare authentication
  dev.planton.cloudflare.CloudflareProviderConfig provider_config = 2;
}
