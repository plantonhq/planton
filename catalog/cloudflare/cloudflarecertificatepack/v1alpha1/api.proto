syntax = "proto3";

package dev.planton.cloudflare.cloudflarecertificatepack.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflarecertificatepack/v1alpha1/outputs.proto";
import "catalog/cloudflare/cloudflarecertificatepack/v1alpha1/spec.proto";
import "shared/metadata.proto";

// cloudflare-certificate-pack
message CloudflareCertificatePack {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareCertificatePack'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  CloudflareCertificatePackSpec spec = 4 [(buf.validate.field).required = true];

  //status
  CloudflareCertificatePackStatus status = 5;
}

// cloudflare-certificate-pack status
message CloudflareCertificatePackStatus {
  //outputs
  //  cloudflare-certificate-pack outputs
  CloudflareCertificatePackOutputs outputs = 1;
}
