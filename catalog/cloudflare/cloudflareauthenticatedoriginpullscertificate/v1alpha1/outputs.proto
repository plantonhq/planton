syntax = "proto3";

package dev.planton.cloudflare.cloudflareauthenticatedoriginpullscertificate.v1alpha1;

// CloudflareAuthenticatedOriginPullsCertificateOutputs captures the
// observable outputs after uploading an Authenticated Origin Pulls client
// certificate.
message CloudflareAuthenticatedOriginPullsCertificateOutputs {
  // The ID of the uploaded certificate -- what per-hostname associations
  // reference.
  string certificate_id = 1;

  // The zone the certificate belongs to.
  string zone_id = 2;

  // When the certificate expires (RFC3339).
  string expires_on = 3;

  // Field 4 (status) was removed: deployment is asynchronous (a fresh
  // upload transitions pending_deployment -> active seconds later), so a
  // point-in-time phase can never be a stable output -- it flips on
  // the first refresh after the transition and re-plans forever (measured
  // live 2026-08-28). Read deployment status from the Cloudflare API or
  // dashboard instead.
  reserved 4;
  reserved "status";
}
