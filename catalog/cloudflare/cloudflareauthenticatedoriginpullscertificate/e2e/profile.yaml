apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflareauthenticatedoriginpullscertificate
spec:
  # AOP client certificate under live E2E: the harness deploys the
  # CloudflareDnsZone prerequisite, resolves zone_id, uploads the
  # env-supplied self-signed client certificate (self-signed is the normal
  # case -- the origin, not the public, validates it; the proof session
  # mints the pair at setup), verifies via the zone's origin_tls_client_auth
  # hostname-certificates API, destroys (real delete). Watch items for the
  # proving session: (a) DELETION IS ASYNC -- the API answers 200 with
  # status pending_deletion/deleted before the record goes; the verifier
  # treats those statuses as absent (the session-011 status-enum class);
  # (b) the live arm is the HOSTNAME-scoped upload; the zone-scoped surface
  # is plan-proven offline because its provider Update is empty and its
  # private_key does not force replacement -- a key-only rotation silently
  # no-ops (measured provider defect at v5.23.0; the GUIDE teaches
  # rotate-cert-and-key-together); (c) the private key never returns from
  # the API AND is RequiresReplace on the hostname surface, so a blind
  # import's only reconcile is a replace -- the round-trip is
  # scenario-skipped with the reason (measured live 2026-08-28; the
  # adoption recipe lives on the import catalog row). Deployment status is
  # asynchronous and deliberately NOT an output (it flips
  # pending_deployment -> active on the first refresh and would re-plan
  # forever -- measured live 2026-08-28).
  tier: 1
  # Proven live 2026-08-28: both engines through the full lifecycle on the
  # real account (hostname-upload with a leaf client certificate). The
  # round-trip is scenario-skipped with the recorded reason: private_key is
  # write-only AND RequiresReplace, so a blind import's only reconcile is a
  # replace (the adoption recipe lives on the import catalog row).
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
