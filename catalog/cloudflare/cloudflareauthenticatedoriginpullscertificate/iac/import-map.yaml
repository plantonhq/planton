apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: cloudflareauthenticatedoriginpullscertificate
spec:
  values:
    - name: zone_id
      derivations:
        - from_output: zone_id
      where_to_find: >-
        Cloudflare dashboard -> the zone's Overview page (Zone ID in the
        right-hand API panel), or `GET /zones?name=<domain>` on the
        Cloudflare v4 API (the id field).
    - name: certificate_id
      derivations:
        - from_output: certificate_id
      where_to_find: >-
        For zone-scoped uploads `GET /zones/<zone_id>/origin_tls_client_auth`
        on the Cloudflare v4 API; for hostname-scoped uploads
        `GET /zones/<zone_id>/origin_tls_client_auth/hostnames/certificates`
        (the id field of the matching entry). The scope in the spec must
        match the surface the certificate was uploaded to.
