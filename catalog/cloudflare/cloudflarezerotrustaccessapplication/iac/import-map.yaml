apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: cloudflarezerotrustaccessapplication
spec:
  # The application imports with a literal "accounts/" scope prefix recorded
  # in the provider catalog's id_format: the owning account plus the app's
  # server-assigned UUID. account_id is spec-relative for the account-scoped
  # case the live scenarios prove; a zone-scoped application imports via the
  # zones/ arm instead (the outputs do not carry zone_id today -- the ruleset
  # precedent). application_id is the deploy's own output.
  values:
    - name: account_id
      derivations:
        - from_spec_field: account_id
      where_to_find: >-
        Cloudflare dashboard -> the account's Overview (Account ID in the
        right-hand API panel), or `GET /accounts` on the Cloudflare v4 API.
    - name: application_id
      derivations:
        - from_output: application_id
      where_to_find: >-
        Zero Trust dashboard -> Access -> Applications -> the application
        (the Application ID / AUD on its overview), or
        `GET /accounts/<account_id>/access/apps` on the Cloudflare v4 API
        (the id field of the entry whose name matches).
