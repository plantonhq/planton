apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarezerotrustaccessapplication
spec:
  # An Access application under live E2E: the live scenarios are
  # ACCOUNT-scoped (the kind is dual-scope; account is the common case -- the
  # zone-scoped arm is offline-proven and recorded as not-wired in the
  # verifier, the ruleset precedent) -- deploy -> GET
  # accounts/{account_id}/access/apps/{app_id} verify -> destroy ->
  # verify-destroyed on both provisioners. Two scenarios: `bookmark-minimal`
  # (a bookmark tile -- the cheapest type, no domain ownership, no fixtures)
  # and `self-hosted` (the flagship type on a run-scoped hostname of a real
  # ACTIVE zone -- env-gated on PLANTON_E2E_CLOUDFLARE_ZONE_NAME -- with a
  # standalone policy attached by reference, proving the app->policy graph
  # edge live; the policy fixture is scenario-declared because an application
  # requires no policy). MEASURED (live, 2026-08-26): Access REJECTS a
  # self_hosted domain on a PENDING (undelegated) zone with 400
  # "access.api.error.invalid_request: domain does not belong to zone" and
  # accepts the identical create on an ACTIVE zone -- the wall is delegation
  # state, which is why this arm rides the sanctioned active test zone, not
  # the run-scoped pending-zone fixture. Deliberately not live: saas/oauth,
  # scim, and IdP-coupled surfaces -- they need a configured identity
  # provider no throwaway lane owns; they are preset-proven. Entitlement:
  # requires the account's Zero Trust organization (team name) to exist --
  # one-time setup, Zero Trust Free. Objects create in seconds at zero cost.
  tier: 1
  # Proven live 2026-08-26: both engines ran bookmark-minimal + self-hosted
  # through the full lifecycle (deploy -> REST-API verify -> destroy ->
  # verify-absent) with the apply-idempotency re-plan green, plus blind
  # import round-trips on the Terraform lanes (the self-hosted round-trip
  # tolerates the three declared echo toggles -- see the import catalog row).
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
