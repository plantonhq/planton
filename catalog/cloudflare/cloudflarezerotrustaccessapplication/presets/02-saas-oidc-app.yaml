apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareZeroTrustAccessApplication
metadata:
  name: grafana-saas
spec:
  accountId: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d" # replace with your account id
  name: grafana
  type: saas
  # Federate into a SaaS app over OIDC. Cloudflare issues the client_id/secret
  # (exported as outputs) for you to paste into the SaaS provider.
  saasApp:
    authType: oidc
    redirectUris:
      - https://grafana.example.com/login/generic_oauth
    grantTypes:
      - authorization_code
    scopes:
      - openid
      - email
      - profile
  policies:
    - policy:
        valueFrom:
          kind: CloudflareZeroTrustAccessPolicy
          name: allow-staff
          fieldPath: status.outputs.policy_id
      precedence: 1
