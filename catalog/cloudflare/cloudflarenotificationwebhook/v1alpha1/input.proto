syntax = "proto3";

package dev.planton.cloudflare.cloudflarenotificationwebhook.v1alpha1;

import "catalog/cloudflare/cloudflarenotificationwebhook/v1alpha1/api.proto";
import "catalog/cloudflare/provider.proto";

// CloudflareNotificationWebhookIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message CloudflareNotificationWebhookIacInput {
  // target infra-component to be deployed
  CloudflareNotificationWebhook target = 1;
  // provider-config for Cloudflare authentication
  dev.planton.cloudflare.CloudflareProviderConfig provider_config = 2;
}
