# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflarenotificationwebhook
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The only stored value is the shared secret, which Cloudflare holds encrypted and never returns in any API response body.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Cloudflare offers no customer-managed key for notification secrets.
    - control_id: enc-in-transit
      status: configurable
      field_path: url
      evidence:
        type: spec_default
        reference: Delivery security follows the declared URL scheme -- every documented destination (Slack, Google Chat, Datadog, Splunk, Opsgenie, generic) uses an https endpoint.
    - control_id: no-public-access
      status: not_applicable
      notes: A destination record; it exposes no listener of its own (the receiving endpoint is the operator's).
    - control_id: restricted-ingress
      status: not_applicable
      notes: No ingress surface; Cloudflare pushes outbound to the URL.
    - control_id: edge-protection
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The alerting API runs on Cloudflare's anycast edge with its standard DDoS posture.
    - control_id: rbac
      status: not_applicable
      notes: Who may register destinations is Cloudflare account-membership and API-token-scope posture (Notifications Write).
    - control_id: workload-identity
      status: configurable
      field_path: secret
      evidence:
        type: spec_default
        reference: The shared secret is how the receiver authenticates Cloudflare's deliveries; it is a write-only managed-secret reference in this spec.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No user-auth surface.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Destination changes land in the Cloudflare account audit log; last_success and last_failure timestamps are observable on the object.
    - control_id: monitoring-integration
      status: configurable
      field_path: url
      evidence:
        type: spec_default
        reference: The destination IS the monitoring integration -- it carries Cloudflare alerts into the operator's incident tooling.
    - control_id: backup-recovery
      status: not_applicable
      notes: Configuration-only surface, reproducible from the manifest (the secret re-asserts from its managed-secret reference).
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No stored data beyond the secret.
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Cloudflare-operated SaaS delivery on its global network; there is no zonal placement to configure.
    - control_id: deletion-protection
      status: not_applicable
      notes: No provider-side deletion guard; deleting a destination silently drops it from every policy that referenced it (see GUIDE.md).
    - control_id: managed-patching
      status: not_applicable
      notes: SaaS control plane -- Cloudflare operates it.
