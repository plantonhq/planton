# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflarebotmanagement
spec:
  cloudflare:
    groups:
      - purpose: ManageBotConfig
        name: Bot Management Write
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: Covers the Terraform module's single cloudflare_bot_management resource and the Pulumi module's matching BotManagement resource -- apply the zone's singleton bot configuration via PUT /zones/{zone_id}/bot_management (create and update are both this PUT; destroy is a no-op at Cloudflare, no delete call exists) (derived from the module's API surface; neither engine performs secondary lookups). Group name verbatim from the Cloudflare API token permissions reference (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22).
      - purpose: ReadBotConfig
        name: Bot Management Read
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: Read-side of the same resource -- refresh/import the configuration via GET /zones/{zone_id}/bot_management (derived from the module's API surface).
