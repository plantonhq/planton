apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarebotmanagement
spec:
  # Bot Management under live E2E: the harness deploys the CloudflareDnsZone
  # prerequisite (a run-scoped pending zone), resolves zone_id, then runs
  # deploy -> settings-surface verify -> destroy -> verify on both
  # provisioners. THE CLASS CONTRACT: Bot Management has NO delete at
  # Cloudflare (the provider's Delete is literally empty and its plans warn
  # about it), so verify-destroyed asserts the surface STILL ANSWERS --
  # never absence. Zero-orphan cleanup rides the run-scoped zone fixture's
  # own destroy. Scenario ordering is the revert discipline: fight-mode
  # sorts first, revert-off sorts last and turns the managed toggle back
  # off before the lane ends. Live arms stick to the FREE field
  # (fight_mode) -- the provider's own state-consistency test proves a
  # fight_mode-only config plans clean on non-entitled zones. SBFM and
  # Enterprise fields are plan-gated deferrals (offline-plan-proven at
  # e2e/sbfm-plan.yaml): on non-entitled zones the API omits those fields
  # from responses entirely, the class behind the provider's own recorded
  # refresh-drift issue -- never set them live on the free fixture zone.
  tier: 1
  # PROVEN live 2026-08-27: both scenarios on both engines through the full
  # lifecycle; the bare-zone-id blind import round-trip passed at zero
  # tolerances; the settings-singleton verify-absent (surface still answers)
  # validated on a pending zone. First contact measured the FIGHT-MODE PAIR
  # RULE: Cloudflare refuses fight_mode while the zone's JS detections are
  # off (400 code 10400) -- the fight-mode scenario declares enable_js: true
  # alongside, and the pair rule is taught on the spec fields and GUIDE.
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 10
