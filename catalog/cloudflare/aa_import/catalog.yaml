      pulumi_type: cloudflare:index/botManagement:BotManagement
      id_format: "{zone_id}"
    - terraform_type: cloudflare_snippet
      pulumi_type: cloudflare:index/snippet:Snippet
      not_importable_upstream_reason: >-
