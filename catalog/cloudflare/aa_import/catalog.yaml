        "zones/<zone_id>/<rule_id>". The recorded format is the account form
        because the catalog carries one format per type and no blind
        derivation can discriminate scope per deployment; zone-scoped
        adopters substitute the zones/ prefix and the rule's zone id
        (both on the rule's outputs).
