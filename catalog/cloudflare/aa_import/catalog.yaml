    # Access rules are dual-scope: the documented import ID carries a literal
    # "accounts/" or "zones/" prefix. Live scenarios are account-scoped.
    - terraform_type: cloudflare_access_rule
      pulumi_type: cloudflare:index/accessRule:AccessRule
      id_format: "accounts/{account_id}/{rule_id}"
