    # --- Logs -------------------------------------------------------------------
    # Logpush jobs are dual-scope: the import id carries the scope
    # discriminator, so an account job imports as
    # accounts/<account_id>/<job_id> and a zone job as
    # zones/<zone_id>/<job_id>.
    - terraform_type: cloudflare_logpush_job
      pulumi_type: cloudflare:index/logpushJob:LogpushJob
      id_format: "{scope_prefix}/{scope_id}/{job_id}"
      notes: >-
        ownership_challenge is write-only (never returned by the API) and must
        be re-asserted from configuration after import. kind cannot be changed
        on an existing job -- Cloudflare rejects the update with HTTP 400 even
        though the provider plans it in place -- and a legacy job may read
        back kind "instant-logs", which the provider normalizes to "". The
        scope discriminator makes this id blind-underivable (no resolver arm
        can pick accounts vs zones from a manifest), so the human recipe is
        the import path: an account job imports as
        accounts/<account_id>/<job_id>, a zone job as
        zones/<zone_id>/<job_id>, both ids in the where_to_find entries.
