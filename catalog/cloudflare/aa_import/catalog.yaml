    # Four zone singletons plus the per-(setting, hostname) override fan-out
    # and the CA hostname associations (dual format).
    - terraform_type: cloudflare_universal_ssl_setting
      pulumi_type: cloudflare:index/universalSslSetting:UniversalSslSetting
      id_format: "{zone_id}"
    - terraform_type: cloudflare_total_tls
      pulumi_type: cloudflare:index/totalTls:TotalTls
      id_format: "{zone_id}"
    - terraform_type: cloudflare_zone_auto_origin_tls_kex
      pulumi_type: cloudflare:index/zoneAutoOriginTlsKex:ZoneAutoOriginTlsKex
      id_format: "{zone_id}"
    - terraform_type: cloudflare_origin_tls_compliance_modes
      pulumi_type: cloudflare:index/originTlsComplianceModes:OriginTlsComplianceModes
      id_format: "{zone_id}"
    - terraform_type: cloudflare_hostname_tls_setting
      pulumi_type: cloudflare:index/hostnameTlsSetting:HostnameTlsSetting
      not_importable_upstream_reason: >-
        The provider ships an ImportState but it is DEFECTIVE at v5.23.0: it
        parses only "{zone_id}/{setting_id}" and never restores the Required
        hostname (and its Read consults the zone-wide list endpoint through a
        single-object envelope), so every post-import plan destroys and
        recreates the override -- no configuration can dodge a defective
        import read (the crashing-snippet-importer class). Adopt by
        re-asserting the override from configuration instead: the
        per-(setting, hostname) write is an idempotent upsert for identical
        values, so a plain apply adopts the live override without churn.
        Upstream v5.24.0 fixed ImportState (it parses
        "{zone_id}/{setting_id}/{hostname}") but broke Read differently --
        it GETs a per-hostname path Cloudflare answers with 405 (measured
        live 2026-08-29) -- so this row stays not-importable until a
        release ships a working Read AND the canonical pin bumps.
