        Everything round-trips (no write-only fields), but the provider ships
        no import acceptance test for this resource -- unlike its webhooks
        sibling -- so verify the imported filters tree against configuration
        before trusting a clean plan.
    - terraform_type: cloudflare_notification_policy_webhooks
      pulumi_type: cloudflare:index/notificationPolicyWebhooks:NotificationPolicyWebhooks
      id_format: "{account_id}/{webhook_id}"
      notes: >-
        secret never round-trips ("Secrets are not returned in any API
        response body") and must be re-asserted from configuration. The
        provider's own import tests additionally ignore created_at and type on
        verify; type is a server-inferred echo of the URL, never configured.
    # --- Analytics --------------------------------------------------------------
    - terraform_type: cloudflare_web_analytics_site
      pulumi_type: cloudflare:index/webAnalyticsSite:WebAnalyticsSite
      id_format: "{account_id}/{site_tag}"
      # enabled/host/lite are no_refresh at v5.23.0 (web_analytics_site/
      # model.go tags all four; the importer hand-backfills only zone_tag
      # from the computed ruleset) -- a blind import restores none of them,
      # so the first post-import plan re-asserts whichever the configuration
      # sets. That update is the documented adoption shape, not a wrong
      # import.
      write_normalized_attributes:
        - enabled
        - host
        - lite
      notes: >-
        The import id uses the site TAG (the resource's real key; its id
        attribute is a copy). Four attributes -- enabled, host, lite, zone_tag
        -- are never read back from the API, so an imported site carries them
        only from configuration; the provider hand-backfills zone_tag from the
        computed ruleset during import, and the first post-import apply
        re-asserts the other three from configuration (an idempotent write).
    - terraform_type: cloudflare_web_analytics_rule
      pulumi_type: cloudflare:index/webAnalyticsRule:WebAnalyticsRule
      not_importable_upstream_reason: >-
        The provider ships no ImportState, and its Read is an empty stub, so
        rules are write-only from IaC's perspective. The re-assert path has a
        measured wall: the rule create REJECTS duplicates (409 code 10010
        duplicateFound against surviving rule objects), so adopting a site
        whose ruleset already carries rules requires deleting the existing
        rules first (dashboard -> Web Analytics -> the site's rules, or
        DELETE /accounts/{account_id}/rum/v2/{ruleset_id}/rule/{rule_id}),
        after which the first apply re-creates exactly the declared rows.
    # --- Accounts, IAM & organization ------------------------------------------
    - terraform_type: cloudflare_account_token
      pulumi_type: cloudflare:index/accountToken:AccountToken
      id_format: "{account_id}/{token_id}"
      notes: >-
        The token VALUE is never re-fetchable (returned only by the original
        create), so an imported token has no usable credential in state -- if
        the value was lost, rotate the token rather than importing it. The
        provider's own import tests also ignore policies, because Cloudflare
        returns them in canonical order rather than the order applied.
