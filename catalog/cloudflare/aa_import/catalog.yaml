apiVersion: iac.planton.dev/v1
kind: ProviderImportCatalog
metadata:
  name: cloudflare
spec:
  # Import-ID formats per Cloudflare resource type, as documented by the
  # upstream terraform-provider-cloudflare (v5 line). The FORMAT lives here
  # (provider knowledge, shared by every kind); which concrete value
  # fills each {placeholder} lives in the owning kind's import-map.yaml.
  # Correctness is machine-proven by the E2E import round-trip (deploy a
  # fixture, set state aside, re-import blind, plan must show zero diff) --
  # never by review alone.
  #
  # Cloudflare import IDs follow the API's resource hierarchy: zone-scoped
  # objects import as "<zone_id>/<id>", account-scoped objects as
  # "<account_id>/<id>", and the zone itself as "<zone_id>". There is no
  # scan-side correspondence here (cloud_control_type_name is an AWS-only
  # concept); account discovery happens through the Cloudflare API itself.
  resource_types:
    # --- DNS ------------------------------------------------------------------
    # The zone and its zone-singleton satellites (dns settings, dnssec, hold,
    # subscription) all carry the bare zone id as their identity.
    - terraform_type: cloudflare_zone
      pulumi_type: cloudflare:index/zone:Zone
      id_format: "{zone_id}"
    - terraform_type: cloudflare_zone_dns_settings
      pulumi_type: cloudflare:index/zoneDnsSettings:ZoneDnsSettings
      not_importable_upstream_reason: >-
        No ImportState on the upstream resource at v5.23.0 (docs: "This
        resource does not currently support terraform import"). The create is
        a zone-singleton PUT, idempotent for identical values, so the
        adopter's re-create path converges on the live settings -- the round
        trip skips the import and proves that path instead.
      notes: >-
        The API identity is the bare zone id (GET
        /zones/{zone_id}/dns_settings); it is recorded here for the day the
        provider ships an importer.
    - terraform_type: cloudflare_zone_dnssec
      pulumi_type: cloudflare:index/zoneDnssec:ZoneDnssec
      id_format: "{zone_id}"
    - terraform_type: cloudflare_zone_hold
      pulumi_type: cloudflare:index/zoneHold:ZoneHold
      id_format: "{zone_id}"
    - terraform_type: cloudflare_zone_subscription
      pulumi_type: cloudflare:index/zoneSubscription:ZoneSubscription
      id_format: "{zone_id}"
    - terraform_type: cloudflare_dns_record
      pulumi_type: cloudflare:index/dnsRecord:DnsRecord
      id_format: "{zone_id}/{dns_record_id}"
    # --- Workers --------------------------------------------------------------
    - terraform_type: cloudflare_workers_script
      pulumi_type: cloudflare:index/workersScript:WorkersScript
      id_format: "{account_id}/{script_name}"
      # The v5.23.0 ImportState fetches only the script-content GET and
      # unmarshals the raw body as JSON -- it restores nothing beyond the
      # identity (account_id/script_name), and the settings Read that follows
      # does not return main_module and reads collections back in normalized
      # (empty-vs-null) form. A plan after a faithful import therefore shows
      # in-place updates on exactly these attributes (measured live
      # 2026-08-26); content, compatibility_date, and the identity stay under
      # the round-trip oracle.
      write_normalized_attributes:
        - main_module
        - bindings
        - compatibility_flags
        - tail_consumers
        - etag
        - handlers
        - has_assets
        - has_modules
        - last_deployed_from
        - modified_on
    - terraform_type: cloudflare_workers_script_subdomain
      pulumi_type: cloudflare:index/workersScriptSubdomain:WorkersScriptSubdomain
      id_format: "{account_id}/{script_name}"
    - terraform_type: cloudflare_workers_custom_domain
      pulumi_type: cloudflare:index/workersCustomDomain:WorkersCustomDomain
      id_format: "{account_id}/{domain_id}"
    - terraform_type: cloudflare_workers_route
      pulumi_type: cloudflare:index/workersRoute:WorkersRoute
      id_format: "{zone_id}/{route_id}"
    - terraform_type: cloudflare_workers_cron_trigger
      pulumi_type: cloudflare:index/workersCronTrigger:WorkersCronTrigger
      id_format: "{account_id}/{script_name}"
    # --- Load Balancing ---------------------------------------------------------
    # The load balancer's documented import ID carries a literal scope prefix
    # ("{accounts|zones}/{scope_id}/{lb_id}"); the catalog kind is zone-scoped,
    # so the zones/ arm is the one recorded here.
    # The importer parses plain "<zone_id>/<load_balancer_id>" (ImportState in
    # the provider's load_balancer resource) -- a literal "zones/" scope prefix
    # is REJECTED with "invalid ID" (measured live 2026-08-28; the prefix
    # appears only in the API path, never in the import ID).
    - terraform_type: cloudflare_load_balancer
      pulumi_type: cloudflare:index/loadBalancer:LoadBalancer
      id_format: "{zone_id}/{load_balancer_id}"
    # --- Email Routing ----------------------------------------------------------
    # Settings, the managed DNS records, and the catch-all rule are zone
    # singletons -- their import identity is the bare zone id. Rules are
    # zone-scoped objects; destination addresses are account-scoped objects.
    - terraform_type: cloudflare_email_routing_settings
      pulumi_type: cloudflare:index/emailRoutingSettings:EmailRoutingSettings
      id_format: "{zone_id}"
    - terraform_type: cloudflare_email_routing_dns
      pulumi_type: cloudflare:index/emailRoutingDns:EmailRoutingDns
      id_format: "{zone_id}"
    - terraform_type: cloudflare_email_routing_catch_all
      pulumi_type: cloudflare:index/emailRoutingCatchAll:EmailRoutingCatchAll
      id_format: "{zone_id}"
    - terraform_type: cloudflare_email_routing_rule
      pulumi_type: cloudflare:index/emailRoutingRule:EmailRoutingRule
      id_format: "{zone_id}/{rule_id}"
    - terraform_type: cloudflare_email_routing_address
      pulumi_type: cloudflare:index/emailRoutingAddress:EmailRoutingAddress
      id_format: "{account_id}/{address_id}"
    # --- Rulesets -----------------------------------------------------------------
    # The ruleset's documented import ID carries a literal scope prefix
    # ("{accounts|zones}/{account_id|zone_id}/{ruleset_id}"); the catalog
    # kind's live scenarios are zone-scoped, so the zones/ arm is the one
    # recorded here (an account-scoped ruleset imports via the accounts/ arm).
    - terraform_type: cloudflare_ruleset
      pulumi_type: cloudflare:index/ruleset:Ruleset
      id_format: "zones/{zone_id}/{ruleset_id}"
    # --- Workers KV -------------------------------------------------------------
    # The namespace is the container; an entry's identity appends its key.
    # Import IDs are strictly positional slash-delimited segments, so a key
    # containing "/" cannot be imported -- catalog scenarios keep keys
    # slash-free.
    - terraform_type: cloudflare_workers_kv_namespace
      pulumi_type: cloudflare:index/workersKvNamespace:WorkersKvNamespace
      id_format: "{account_id}/{namespace_id}"
    - terraform_type: cloudflare_workers_kv
      pulumi_type: cloudflare:index/workersKv:WorkersKv
      id_format: "{account_id}/{namespace_id}/{key_name}"
      # Cloudflare re-serializes the entry's metadata JSON on read (the
      # import restores it byte-different, semantically identical -- measured
      # live 2026-08-26 as a whitespace-only plan), so the first
      # post-adoption apply rewrites formatting and nothing else.
      write_normalized_attributes:
        - metadata
    # --- D1 ---------------------------------------------------------------------
    - terraform_type: cloudflare_d1_database
      pulumi_type: cloudflare:index/d1Database:D1Database
      id_format: "{account_id}/{database_id}"
    # --- Queues -----------------------------------------------------------------
    - terraform_type: cloudflare_queue
      pulumi_type: cloudflare:index/queue:Queue
      id_format: "{account_id}/{queue_id}"
    - terraform_type: cloudflare_queue_consumer
      pulumi_type: cloudflare:index/queueConsumer:QueueConsumer
      not_importable_upstream_reason: >-
        No ImportState on the upstream resource at v5.23.0 (docs: "This
        resource does not currently support terraform import"). An adopted
        queue re-asserts its consumer from configuration on the next apply.
      notes: >-
        The consumer's API identity is
        GET /accounts/{account_id}/queues/{queue_id}/consumers/{consumer_id},
        where consumer_id is server-assigned. The re-create path is NOT
        convergent: the create is a plain POST and Cloudflare enforces one
        active consumer per queue, so re-asserting against a queue whose live
        consumer still exists is refused with 400 code 11004 "already has a
        consumer" (measured 2026-08-26). Adopting a queue that already
        carries a consumer means deleting that consumer first (or leaving it
        managed outside) -- there is no import and no idempotent re-put.
    # --- R2 ---------------------------------------------------------------------
    # The bucket's import ID is strictly positional THREE segments: the
    # provider's parser rejects a two-segment ID, so a default-jurisdiction
    # bucket imports with the literal "default" as its third segment. The six
    # bucket-scoped companions (cors, lifecycle, lock, event notifications,
    # custom and managed domains) ship NO importer at v5.23.0 -- each row
    # records the API identity and the round-trip expectation instead. All R2
    # API calls carry the jurisdiction as a cf-r2-jurisdiction HEADER, never a
    # path segment.
    - terraform_type: cloudflare_r2_bucket
      pulumi_type: cloudflare:index/r2Bucket:R2Bucket
      id_format: "{account_id}/{bucket_name}/{jurisdiction}"
    - terraform_type: cloudflare_r2_bucket_cors
      pulumi_type: cloudflare:index/r2BucketCors:R2BucketCors
      not_importable_upstream_reason: >-
        No ImportState on the upstream resource at v5.23.0 ("This resource
        does not currently support terraform import"). The create is a
        bucket-singleton PUT, idempotent for identical values, so an adopted
        bucket re-asserts its CORS policy from configuration on the next
        apply.
      notes: >-
        The API identity is the bucket
        (GET /accounts/{account_id}/r2/buckets/{bucket_name}/cors).
    - terraform_type: cloudflare_r2_bucket_lifecycle
      pulumi_type: cloudflare:index/r2BucketLifecycle:R2BucketLifecycle
      not_importable_upstream_reason: >-
        No ImportState on the upstream resource at v5.23.0 ("This resource
        does not currently support terraform import"). The create is a
        bucket-singleton PUT, idempotent for identical values, so an adopted
        bucket re-asserts its lifecycle policy from configuration on the next
        apply.
      notes: >-
        The API identity is the bucket
        (GET /accounts/{account_id}/r2/buckets/{bucket_name}/lifecycle).
    - terraform_type: cloudflare_r2_bucket_lock
      pulumi_type: cloudflare:index/r2BucketLock:R2BucketLock
      not_importable_upstream_reason: >-
        No ImportState on the upstream resource at v5.23.0 ("This resource
        does not currently support terraform import"). The create is a
        bucket-singleton PUT, idempotent for identical values, so an adopted
        bucket re-asserts its lock policy from configuration on the next
        apply.
      notes: >-
        The API identity is the bucket
        (GET /accounts/{account_id}/r2/buckets/{bucket_name}/lock).
    - terraform_type: cloudflare_r2_bucket_event_notification
      pulumi_type: cloudflare:index/r2BucketEventNotification:R2BucketEventNotification
      not_importable_upstream_reason: >-
        No ImportState on the upstream resource at v5.23.0 ("This resource
        does not currently support terraform import"). The re-create path is
        NOT convergent: the per-queue PUT MERGES rules instead of replacing
        them, so re-putting an identical rule while the live config exists
        answers 400 code 11020 "rules have invalid overlap" (measured
        2026-08-26). Adopting a bucket that already carries a notification
        config means deleting that config first (or leaving it managed
        outside).
      notes: >-
        The API identity is
        GET /accounts/{account_id}/event_notifications/r2/{bucket_name}/configuration/queues/{queue_id}.
        The config also outlives its bucket: deleting the bucket does NOT
        delete its notification configs, and a dangling config blocks the
        target queue's deletion with 400 code 11017 (measured 2026-08-26) --
        delete the notification config explicitly before retiring either
        side.
    - terraform_type: cloudflare_r2_custom_domain
      pulumi_type: cloudflare:index/r2CustomDomain:R2CustomDomain
      not_importable_upstream_reason: >-
        No ImportState on the upstream resource at v5.23.0 ("This resource
        does not currently support terraform import"). An adopted bucket
        re-asserts its custom domain from configuration on the next apply.
      notes: >-
        The API identity is
        GET /accounts/{account_id}/r2/buckets/{bucket_name}/domains/custom/{domain}.
    - terraform_type: cloudflare_r2_managed_domain
      pulumi_type: cloudflare:index/r2ManagedDomain:R2ManagedDomain
      not_importable_upstream_reason: >-
        No ImportState at v5.23.0, and the provider's Read AND Delete for
        this resource are EMPTY function bodies -- it never refreshes from
        the API and cannot be destroyed through terraform (the managed
        r2.dev domain stays in the API until manually disabled). An adopted
        bucket re-asserts the toggle from configuration on the next apply.
      notes: >-
        The API identity is
        GET /accounts/{account_id}/r2/buckets/{bucket_name}/domains/managed.
    # --- Hyperdrive -------------------------------------------------------------
    # The origin password is write-only (the API never returns it -- the
    # provider schema's own words at v5.23.0), so an imported config lands
    # with an empty password in state and the first post-import plan
    # re-asserts it from configuration. The dotted tolerance below prunes
    # exactly that leaf from the round-trip oracle; any sibling drift inside
    # origin still fails.
    - terraform_type: cloudflare_hyperdrive_config
      pulumi_type: cloudflare:index/hyperdriveConfig:HyperdriveConfig
      id_format: "{account_id}/{hyperdrive_id}"
      write_normalized_attributes:
        - origin.password
    # --- Zero Trust: Access -------------------------------------------------------
    # Applications and groups are dual-scope: the documented import ID carries a
    # literal scope prefix ("{accounts|zones}/{account_id|zone_id}/{id}"); the
    # catalog kinds' live scenarios are account-scoped, so the accounts/ arm is
    # the one recorded here (a zone-scoped object imports via the zones/ arm).
    # Standalone policies are account-scoped by API design -- no scope prefix.
    - terraform_type: cloudflare_zero_trust_access_application
      pulumi_type: cloudflare:index/zeroTrustAccessApplication:ZeroTrustAccessApplication
      id_format: "accounts/{account_id}/{application_id}"
      # The inverse of the group/policy import gap: the app GET ECHOES these
      # toggles as false for types that support them, so ImportState restores
      # false where a modules-authored config deliberately omits them (they
      # are sent only when true -- the API rejects them on incompatible app
      # types). A blind re-import therefore plans an in-place update that
      # "unsets" them -- a no-op against the API's real state (measured live
      # on a self_hosted app; upstream's own import tests ignore this same
      # set, plus service_auth_401_redirect which our arms never saw echo).
      write_normalized_attributes:
        - auto_redirect_to_identity
        - enable_binding_cookie
        - options_preflight_bypass
    - terraform_type: cloudflare_zero_trust_access_group
      pulumi_type: cloudflare:index/zeroTrustAccessGroup:ZeroTrustAccessGroup
      id_format: "accounts/{account_id}/{group_id}"
      # The group GET omits is_default, so ImportState leaves it null while a
      # created state keeps the configured value (the Stainless read decodes
      # over prior state, and there is none on import). Upstream's own import
      # tests ignore exactly this attribute (resource_test.go
      # ImportStateVerifyIgnore: is_default at v5.23.0), and the gap was
      # measured live: a blind re-import plans an in-place update on
      # is_default alone. The first post-adoption apply re-asserts it -- a
      # no-op write against the API's real state.
      write_normalized_attributes:
        - is_default
    - terraform_type: cloudflare_zero_trust_access_policy
      pulumi_type: cloudflare:index/zeroTrustAccessPolicy:ZeroTrustAccessPolicy
      id_format: "{account_id}/{policy_id}"
      # Same import-restore gap class as the group's is_default: the policy
      # GET omits these three booleans, so ImportState leaves them null while
      # a created state keeps the configured values. Upstream's own import
      # test ignores exactly these attributes (resource_test.go
      # ImportStateVerifyIgnore: approval_required, isolation_required,
      # purpose_justification_required at v5.23.0). The first post-adoption
      # apply re-asserts them -- a no-op write against the API's real state.
      write_normalized_attributes:
        - approval_required
        - isolation_required
        - purpose_justification_required
    # Identity providers and service tokens are dual-scope like applications
    # and groups: the documented import ID carries a literal scope prefix
    # ("{accounts|zones}/{account_id|zone_id}/{id}"). Live scenarios are
    # account-scoped, so the accounts/ arm is the one recorded here. The
    # SCIM secret (IdP) and client_secret (service token) never survive
    # import -- Cloudflare returns them only at create/rotation.
    - terraform_type: cloudflare_zero_trust_access_identity_provider
      pulumi_type: cloudflare:index/zeroTrustAccessIdentityProvider:ZeroTrustAccessIdentityProvider
      id_format: "accounts/{account_id}/{identity_provider_id}"
      # The OAuth client secret is write-only (the provider's own import test
      # ignores exactly config.client_secret at v5.23.0, and its Read rescues
      # the value from prior state -- a rescue ImportState never performs), so
      # a blind import lands with a null secret and the first post-adoption
      # apply re-asserts it from configuration. The dotted form prunes only
      # that leaf; any sibling drift inside config still fails the oracle.
      write_normalized_attributes:
        - config.client_secret
    - terraform_type: cloudflare_zero_trust_access_service_token
      pulumi_type: cloudflare:index/zeroTrustAccessServiceToken:ZeroTrustAccessServiceToken
      id_format: "accounts/{account_id}/{service_token_id}"
      # Two write-only attributes (measured live 2026-08-26): the
      # previous-secret expiry is never returned by the API (every one of the
      # provider's 11 import steps ignores it at v5.23.0), and the token GET
      # omits client_secret_version too, so both import as null and the first
      # post-adoption apply re-asserts them from configuration (or the
      # schema's default version 1). That write is a no-op against the API's
      # real state: rotation triggers only when the version INCREASES past
      # the token's actual version, never on an equal re-assert.
      # client_secret needs no declaration: it is an output, never
      # configuration, so the round-trip oracle never sees it -- and it is
      # UNRECOVERABLE after import (returned only at create/rotation).
      write_normalized_attributes:
        - previous_client_secret_expires_at
        - client_secret_version
    # The organization is a singleton upsert: import adopts whatever the
    # account carries. ACCOUNT SCOPE ONLY -- the provider's importer never
    # populates zone_id, so a zone-scoped organization cannot be imported
    # (its docs page claims no import support at all; the code ships an
    # account-scoped ImportState, exercised by the provider's own tests).
    # deny_unmatched_requests and its exempted-zone-names sibling are
    # write-normalized: import bypasses the provider's false/null
    # normalization, so the raw API answers (false; an empty list) land in
    # state where config carried null (the boolean is in the provider's own
    # import-test ignore list -- zero_trust_organization resource_test.go,
    # ImportStateVerifyIgnore, v5.23.0; the list measured live 2026-08-27,
    # same direction). The first post-adoption apply re-asserts both as
    # no-ops.
    - terraform_type: cloudflare_zero_trust_organization
      pulumi_type: cloudflare:index/zeroTrustOrganization:ZeroTrustOrganization
      id_format: "{account_id}"
      write_normalized_attributes:
        - deny_unmatched_requests
        - deny_unmatched_requests_exempted_zone_names
    # The key-rotation cadence is an account singleton like the org itself.
    - terraform_type: cloudflare_zero_trust_access_key_configuration
      pulumi_type: cloudflare:index/zeroTrustAccessKeyConfiguration:ZeroTrustAccessKeyConfiguration
      id_format: "{account_id}"
    - terraform_type: cloudflare_zero_trust_access_infrastructure_target
      pulumi_type: cloudflare:index/zeroTrustAccessInfrastructureTarget:ZeroTrustAccessInfrastructureTarget
      id_format: "{account_id}/{target_id}"
    # MCP portals and servers import by their user-chosen ids (slugs).
    # The server's auth_credentials and client_secret are write-only and
    # never round-trip; last_synced moves server-side between apply and
    # import (the provider's own test ignores it on verify).
    # The portal's servers rows are write-normalized: the GET returns server
    # rows in a different shape than the config writes (measured live
    # 2026-08-26: a blind import restores rows WITHOUT server_id and with
    # the server-echoed default_disabled), so import cannot reconstruct the
    # configured rows. The first post-adoption apply re-asserts them -- an
    # idempotent replace of the portal's server list.
    - terraform_type: cloudflare_zero_trust_access_ai_controls_mcp_portal
      pulumi_type: cloudflare:index/zeroTrustAccessAiControlsMcpPortal:ZeroTrustAccessAiControlsMcpPortal
      id_format: "{account_id}/{portal_id}"
      write_normalized_attributes:
        - servers
    - terraform_type: cloudflare_zero_trust_access_ai_controls_mcp_server
      pulumi_type: cloudflare:index/zeroTrustAccessAiControlsMcpServer:ZeroTrustAccessAiControlsMcpServer
      id_format: "{account_id}/{server_id}"
    # --- Zero Trust: Gateway ------------------------------------------------------
    # Gateway policies and Zero Trust lists are account-scoped by API design
    # -- no scope prefix. Policy import is "{account_id}/{rule_id}"; list
    # import is "{account_id}/{list_id}".
    - terraform_type: cloudflare_zero_trust_gateway_policy
      pulumi_type: cloudflare:index/zeroTrustGatewayPolicy:ZeroTrustGatewayPolicy
      id_format: "{account_id}/{policy_id}"
      notes: >-
        The importer works, but at provider v5.23.0 the post-import plan (like
        every refreshed plan on this resource) never converges -- computed
        attributes re-plan forever (upstream issue #7106, measured live
        2026-08-26 on every configuration shape). Applies are no-op writes;
        plan-gated pipelines see a permanent diff until upstream fixes it.
    - terraform_type: cloudflare_zero_trust_list
      pulumi_type: cloudflare:index/zeroTrustList:ZeroTrustList
      id_format: "{account_id}/{list_id}"
    # The Gateway configuration and logging surfaces are account singletons
    # (no-op destroy class): import adopts whatever the account carries as
    # the bare account id.
    - terraform_type: cloudflare_zero_trust_gateway_settings
      pulumi_type: cloudflare:index/zeroTrustGatewaySettings:ZeroTrustGatewaySettings
      id_format: "{account_id}"
    - terraform_type: cloudflare_zero_trust_gateway_logging
      pulumi_type: cloudflare:index/zeroTrustGatewayLogging:ZeroTrustGatewayLogging
      id_format: "{account_id}"
    - terraform_type: cloudflare_zero_trust_gateway_pacfile
      pulumi_type: cloudflare:index/zeroTrustGatewayPacfile:ZeroTrustGatewayPacfile
      id_format: "{account_id}/{pacfile_id}"
    - terraform_type: cloudflare_zero_trust_dns_location
      pulumi_type: cloudflare:index/zeroTrustDnsLocation:ZeroTrustDnsLocation
      id_format: "{account_id}/{location_id}"
    # --- Zero Trust: Tunnels ------------------------------------------------------
    # The tunnel and its remote-ingress config are separate provider resources
    # sharing ONE identity: the config is a tunnel-singleton, so both import as
    # "<account_id>/<tunnel_id>". Routes and virtual networks carry their own
    # server-assigned UUIDs. Tunnels and routes SOFT-DELETE (the API keeps
    # answering with deleted_at set), so an import target must be an ACTIVE
    # object -- importing a soft-deleted id converges on a create, not an
    # adoption.
    - terraform_type: cloudflare_zero_trust_tunnel_cloudflared
      pulumi_type: cloudflare:index/zeroTrustTunnelCloudflared:ZeroTrustTunnelCloudflared
      id_format: "{account_id}/{tunnel_id}"
      # Upstream ships NO import acceptance test for this resource at
      # v5.23.0 -- the importer's first systematic exercise was ours, and it
      # measured a FULL-body restore (name, config_src, computed fields; the
      # write-only tunnel_secret stays null on both paths): a blind
      # re-import plans a clean no-op with zero tolerances.
    - terraform_type: cloudflare_zero_trust_tunnel_cloudflared_config
      pulumi_type: cloudflare:index/zeroTrustTunnelCloudflaredConfig:ZeroTrustTunnelCloudflaredConfig
      id_format: "{account_id}/{tunnel_id}"
    - terraform_type: cloudflare_zero_trust_tunnel_cloudflared_route
      pulumi_type: cloudflare:index/zeroTrustTunnelCloudflaredRoute:ZeroTrustTunnelCloudflaredRoute
      id_format: "{account_id}/{route_id}"
    - terraform_type: cloudflare_zero_trust_tunnel_cloudflared_virtual_network
      pulumi_type: cloudflare:index/zeroTrustTunnelCloudflaredVirtualNetwork:ZeroTrustTunnelCloudflaredVirtualNetwork
      id_format: "{account_id}/{virtual_network_id}"
    # --- Zero Trust: Devices --------------------------------------------------------
    # The default profile is an account singleton: import adopts whatever the
    # account carries as the bare account id. The provider's own import tests
    # ignore exclude/include, fallback_domains, default, gateway_unique_id,
    # service_mode_v2, and the lan_allow pair on verify -- re-assert those
    # from configuration after import.
    - terraform_type: cloudflare_zero_trust_device_default_profile
      pulumi_type: cloudflare:index/zeroTrustDeviceDefaultProfile:ZeroTrustDeviceDefaultProfile
      id_format: "{account_id}"
    # The account-default fallback list is a singleton like the profile it
    # rides.
    - terraform_type: cloudflare_zero_trust_device_default_profile_local_domain_fallback
      pulumi_type: cloudflare:index/zeroTrustDeviceDefaultProfileLocalDomainFallback:ZeroTrustDeviceDefaultProfileLocalDomainFallback
      id_format: "{account_id}"
    - terraform_type: cloudflare_zero_trust_device_default_profile_certificates
      pulumi_type: cloudflare:index/zeroTrustDeviceDefaultProfileCertificates:ZeroTrustDeviceDefaultProfileCertificates
      not_importable_upstream_reason: >-
        The v5.23.0 terraform provider ships NO importer for this resource
        (the package has no ImportState, and its plan modifier warns the
        resource "cannot be destroyed from Terraform").
      notes: >-
        The API identity is /zones/{zone_id}/devices/policy/certificates (a
        zone-scoped settings toggle; the provider writes it with PATCH). A
        blind round-trip skips the import for this address and re-asserts
        the toggle from configuration. CREDENTIAL WALL, measured live
        2026-08-27: the endpoint refuses ACCOUNT-OWNED API tokens on both
        reads and writes (401 code 1039 "malformed actor email claim") --
        adopting or managing this fold needs a user-actor credential (a
