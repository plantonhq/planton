      not_importable_upstream_reason: >-
        The provider ships no ImportState for the challenge, and its Read and
        Delete are both empty -- the resource records a one-shot POST that
        Cloudflare keeps forever. Its own plan warning says it "cannot be
        destroyed from Terraform" and destroying it only drops it from state.
