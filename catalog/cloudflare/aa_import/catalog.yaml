    # --- Origin CA --------------------------------------------------------------
    # Account-unscoped: the certificate's identity is the bare certificate_id
    # (GET /certificates/{id}). csr is write-only (never returned); 
    # requested_validity is not returned after creation. The generated-key
    # convenience path also declares hashicorp/tls helpers (below).
    - terraform_type: cloudflare_origin_ca_certificate
      pulumi_type: cloudflare:index/originCaCertificate:OriginCaCertificate
      id_format: "{certificate_id}"
      config_only_attributes: [csr]
      write_normalized_attributes: [requested_validity]
      notes: >-
        csr is write-only -- the API never returns it. requested_validity is
        not returned after creation. Both are ignored by the provider's own
        import verification. Revoke is not delete: a revoked certificate
        keeps answering GET 200 with revoked_at set, and the revocation
        reaches reads asynchronously (measured 9+ seconds behind the revoke).
        Adoption: a BYO-CSR certificate imports cleanly as the bare id; a
        generated-key certificate's tls helpers cannot import (no upstream
        importers), so the first apply after import mints a new key+CSR and
        RE-ISSUES the certificate -- expect the replace, it is the honest
        adoption.
    - terraform_type: tls_private_key
      pulumi_type: tls:index/privateKey:PrivateKey
      not_importable_upstream_reason: >-
        hashicorp/tls ships NO ImportState for tls_private_key -- the
        import command answers "Resource Import Not Implemented" (measured
        live 2026-08-28 at v4.3.0). Module plumbing for
        CloudflareOriginCaCertificate's generated-key path; adopting such a
        certificate mints a NEW key+CSR on first apply and re-issues the
        certificate (csr is ForceNew) -- the re-issue is the honest
        adoption. Count is 0 when the spec supplies a CSR, so this address
        is absent on that arm.
    - terraform_type: tls_cert_request
      pulumi_type: tls:index/certRequest:CertRequest
      not_importable_upstream_reason: >-
        The hashicorp/tls provider ships NO ImportState for tls_cert_request
        (verified in the provider source) -- it is module plumbing, not a
        cloud identity. Recreating the CSR from the same key+hostnames
        yields a different PEM, and csr is ForceNew on
        cloudflare_origin_ca_certificate, so adoption of a generated-key
        certificate re-creates this helper on first apply rather than
        importing it.
