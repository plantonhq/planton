# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflarezerotrustmcpportal
spec:
  cloudflare:
    groups:
      - purpose: ManagePortal
        name: MCP Portals Write
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Create/update/delete the MCP portal via POST/PUT/DELETE /accounts/{account_id}/access/ai-controls/mcp/portals[/{portal_id}] (named by the endpoint reference's Accepted Permissions). The MCP Portals groups are not yet listed on the general API token permissions reference (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22); their names are verbatim from the "Accepted Permissions" section of the MCP Portals API endpoint reference (https://developers.cloudflare.com/api/resources/zero_trust/subresources/access/subresources/ai_controls/subresources/mcp/subresources/portals/methods/list/, retrieved 2026-08-22). Covers the Terraform module's single cloudflare_zero_trust_access_ai_controls_mcp_portal resource and the Pulumi module's matching ZeroTrustAccessAiControlsMcpPortal resource; neither engine performs secondary lookups.
      - purpose: ReadPortal
        name: MCP Portals Read
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Refresh/import the portal via GET /accounts/{account_id}/access/ai-controls/mcp/portals/{portal_id} (named by the endpoint reference's Accepted Permissions).
