syntax = "proto3";

package dev.planton.cloudflare.cloudflarezerotrustmcpportal.v1alpha1;

// CloudflareZeroTrustMcpPortalOutputs captures the observable outputs
// after publishing the MCP portal.
message CloudflareZeroTrustMcpPortalOutputs {
  // The portal's identifier (the user-chosen slug).
  string portal_id = 1;

  // The hostname the portal is served on -- what users and AI clients
  // connect to.
  string hostname = 2;
}
