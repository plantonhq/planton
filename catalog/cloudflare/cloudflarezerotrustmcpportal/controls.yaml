# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflarezerotrustmcpportal
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A publishing endpoint -- no customer data is stored by the portal itself.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No storage surface.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The portal is served HTTPS-only on Cloudflare's edge; upstream MCP calls re-originate over HTTPS.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The portal endpoint sits behind Access -- unauthenticated requests never reach a published server.
    - control_id: restricted-ingress
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Access policy on the portal hostname is the ingress control; there is no unauthenticated path.
    - control_id: edge-protection
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Portal traffic rides Cloudflare's edge with its standard DDoS and TLS posture.
    - control_id: rbac
      status: configurable
      field_path: servers
      evidence:
        type: spec_default
        reference: servers rows (default_disabled, per-tool/prompt enabled switches) curate what THIS audience may invoke, on top of the server registration's own floor.
    - control_id: workload-identity
      status: configurable
      field_path: servers
      evidence:
        type: spec_default
        reference: servers rows' on_behalf decides whether Cloudflare's held credential or the user's own upstream session authenticates upstream calls.
    - control_id: no-legacy-auth
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Portal access is Access-authenticated only -- there is no password-only or anonymous path.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The portal IS an end-user sign-in destination -- users (and their AI clients) reach it through Cloudflare Access on its hostname -- but this spec models no credential-strength dial of its own. Strength lives in the Access layer it delegates to -- the identity providers verify first factors, Access application/policy mfa_config fields require second factors, and the organization kind carries the org-wide MFA stance.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Portal configuration changes land in the account audit log; user invocations are logged by Access AI Controls.
    - control_id: monitoring-integration
      status: not_applicable
      notes: No metrics surface of its own.
    - control_id: backup-recovery
      status: not_applicable
      notes: Configuration-only surface, reproducible from the manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No stored data.
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The portal is served from Cloudflare's global anycast network; there is no zonal placement to configure.
    - control_id: deletion-protection
      status: not_applicable
      notes: No provider-side deletion guard; a deleted portal is recreated from the manifest (clients reconnect to the same slug/hostname).
    - control_id: managed-patching
      status: not_applicable
      notes: SaaS control plane -- Cloudflare operates it.
