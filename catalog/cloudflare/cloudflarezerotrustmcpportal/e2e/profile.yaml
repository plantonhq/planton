apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarezerotrustmcpportal
spec:
  # MCP portals under live E2E: account-scoped creates with a real delete
  # and an honest 404. Watch items for the proving session: (1) the portal
  # hostname may need to sit on a zone the account serves -- the scenarios
  # use a run-scoped hostname under example.com, and if the API rejects it,
  # re-pointing at the run zone fixture's domain is the proof lane's call;
  # (2) Access AI Controls is a young product surface -- entitlement or
  # regional gates are possible, and a recorded deferral is a legitimate
  # outcome; (3) the with-server arm's row references a scenario-declared
  # MCP server fixture (background sync error on the fixture is harmless);
  # (4) the Access family needs the account's Zero Trust organization
  # (Phase-2 account setup).
  tier: 1
  cost_class: cheap_ephemeral
  status: green
  # LIVE-PROVEN 2026-08-26: minimal + with-server on both engines, full
  # lifecycle, blind import round-trips green (the with-server round-trip
  # consumes exactly the declared `servers` write-normalized tolerance --
  # import restores rows without server_id). Two walls measured and taught:
  # the portal hostname MUST sit on an account-served zone (400 code 7012
  # "invalid_domain" on unowned domains; scenarios are env-gated on
  # PLANTON_E2E_CLOUDFLARE_ZONE_NAME), and tool/prompt overrides are
  # validated against the server's SYNCED inventory (400 code 7001 on a
  # throwaway fixture server -- the override shape is offline-plan-proven
  # by e2e/manifest.yaml). No AI Controls entitlement gate fired.
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
