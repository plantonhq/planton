syntax = "proto3";

package dev.planton.cloudflare.cloudflareemailroutingrule.v1alpha1;

// CloudflareEmailRoutingRuleOutputs captures the outputs after creating a
// routing rule.
message CloudflareEmailRoutingRuleOutputs {
  // The Cloudflare-assigned identifier of the routing rule.
  string rule_id = 1;

  // The zone ID the rule belongs to.
  string zone_id = 2;
}
