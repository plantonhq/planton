syntax = "proto3";

package dev.planton.cloudflare.cloudflareemailroutingrule.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflareemailroutingrule/v1alpha1/outputs.proto";
import "catalog/cloudflare/cloudflareemailroutingrule/v1alpha1/spec.proto";
import "shared/metadata.proto";

// cloudflare-email-routing-rule
message CloudflareEmailRoutingRule {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareEmailRoutingRule'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  CloudflareEmailRoutingRuleSpec spec = 4 [(buf.validate.field).required = true];

  //status
  CloudflareEmailRoutingRuleStatus status = 5;
}

// cloudflare-email-routing-rule status
message CloudflareEmailRoutingRuleStatus {
  //outputs
  //  cloudflare-email-routing-rule outputs
  CloudflareEmailRoutingRuleOutputs outputs = 1;
}
