# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflareemailroutingrule
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The rule stores matcher and action configuration in Cloudflare's control plane -- no customer data store exists here to encrypt. Mail content passes through Cloudflare's pipeline and is not stored by this object.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to key (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: The rule terminates no connections. Transport security for inbound and forwarded mail is SMTP/TLS behavior of Cloudflare's mail pipeline and the destination provider -- no field on this spec.
    - control_id: no-public-access
      status: not_applicable
      notes: The rule exposes no endpoint. What it does expose is mail flow -- which recipients route where -- and that is exactly what the required matchers and actions declare.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network ingress surface of its own. The matchers filter mail by recipient, not connections by source.
    - control_id: edge-protection
      status: not_applicable
      notes: The rule routes email; web application firewalls have no HTTP traffic here to filter. Anti-spam/anti-abuse screening on inbound mail is Cloudflare's pipeline behavior, not this spec.
    - control_id: rbac
      status: not_applicable
      notes: Management is Cloudflare account-membership and API-token posture; the rule exposes no data plane of its own to govern.
    - control_id: workload-identity
      status: not_applicable
      notes: The component holds no credentials -- forward targets must be pre-verified destination addresses, and the worker action references a script by name.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication path of its own. Prefer a scoped API token over the legacy Global API Key when provisioning.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Cloudflare records routing-rule changes in the account audit log unconditionally -- not a property this component configures.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The spec exposes no monitoring surface; Email Routing activity analytics are zone-level Cloudflare features outside this object.
    - control_id: backup-recovery
      status: not_applicable
      notes: Declarative configuration, fully re-creatable from the manifest -- there is no data to back up.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The rule is evaluated by Cloudflare's globally operated mail pipeline; there is no zonal placement to configure.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Cloudflare nor the modules expose a deletion-protection flag. Destroy is a real delete -- matched mail falls through to the zone's catch-all (or is rejected if none). The enabled flag (default true) pauses the rule without losing it.
    - control_id: managed-patching
      status: not_applicable
      notes: A pure configuration object with no software of its own to patch; the pipeline evaluating it is Cloudflare-operated. Code in a referenced Email Worker is that CloudflareWorker resource's concern.
