# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
#
# The kind's catalog.md states the requirement in prose ("Email Routing
# edit access (and Workers Scripts access when routing to an Email Worker)")
# -- migrated here losslessly. The Workers Scripts clause is catalog.md's
# claim, NOT derivable from the modules' API surface: both engines call only
# the email-routing-rules endpoint and pass the worker script name as an
# action value, performing no Workers API call. Whether Cloudflare's rule
# endpoint itself demands a Workers permission to accept a worker action is
# unverified -- an honest unknown for the live capture lane to settle.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflareemailroutingrule
spec:
  cloudflare:
    groups:
      - purpose: ManageRule
        name: Email Routing Rules Write
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: Covers the Terraform module's single cloudflare_email_routing_rule resource and the Pulumi module's matching EmailRoutingRule resource -- create/update/delete the routing rule via POST/PUT/DELETE /zones/{zone_id}/email/routing/rules[/{id}] (dedicated group, direct name match; the path mapping is derived from the module's API surface; neither engine performs secondary lookups). Group name verbatim from the Cloudflare API token permissions reference (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22).
      - purpose: ReadRule
        name: Email Routing Rules Read
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: Read-side of the same resource -- refresh/import the rule via GET /zones/{zone_id}/email/routing/rules/{id}.
