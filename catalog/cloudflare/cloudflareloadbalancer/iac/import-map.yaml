apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: cloudflareloadbalancer
spec:
  # A load balancer's import identity is compound: the zone it lives in plus
  # the load balancer's own Cloudflare-assigned id, joined as plain
  # "{zone_id}/{load_balancer_id}" -- the provider importer REJECTS a literal
  # "zones/" scope prefix with "invalid ID" (measured live; the prefix exists
  # only in the API path). Both values are discoverable from a prior deploy's
  # outputs; neither is derivable from metadata.
  values:
    - name: zone_id
      derivations:
        - from_output: zone_id
      where_to_find: >-
        Cloudflare dashboard -> the zone's Overview page (Zone ID in the
        right-hand API panel), or `GET /zones?name=<domain>` on the
        Cloudflare v4 API (the id field).
    - name: load_balancer_id
      derivations:
        - from_output: load_balancer_id
      where_to_find: >-
        Cloudflare dashboard -> the zone -> Traffic -> Load Balancing (open
        the load balancer; the id is in the URL), or
        `GET /zones/<zone_id>/load_balancers` on the Cloudflare v4 API (the
        id field of the entry whose name is the load balancer's hostname).
