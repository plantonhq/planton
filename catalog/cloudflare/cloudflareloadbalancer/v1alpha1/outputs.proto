syntax = "proto3";

package dev.planton.cloudflare.cloudflareloadbalancer.v1alpha1;

// CloudflareLoadBalancerOutputs describes the outputs after provisioning a Cloudflare Load Balancer.
message CloudflareLoadBalancerOutputs {
  // Unique identifier of the Cloudflare load balancer.
  string load_balancer_id = 1;
  // The hostname DNS record associated with the load balancer.
  string load_balancer_dns_record_name = 2;
  // The canonical CNAME target that the hostname resolves to (Cloudflare endpoint).
  string load_balancer_cname_target = 3;
  // The Cloudflare zone that owns the load balancer. A zone-scoped resource
  // publishes its parent scope: the load balancer's API identity (and its
  // Terraform import ID) is compound -- zones/{zone_id}/load_balancers/{id}.
  string zone_id = 4;
}
