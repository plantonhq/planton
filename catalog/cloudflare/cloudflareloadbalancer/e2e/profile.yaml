apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflareloadbalancer
spec:
  # A load balancer under live E2E: the harness installs the CloudflareDnsZone
  # and CloudflareLoadBalancerPool prerequisites first (the kind's registry
  # prerequisites), resolves the zone and pool references against their
  # outputs, then runs deploy -> GET zones/{zone_id}/load_balancers/{id}
  # verify -> destroy -> verify-destroyed on both provisioners. The minimal
  # scenario proves the static-failover path; rules-steering proves the
  # steering-overrides rule mode plus session affinity; fixed-response proves
  # the terminating rule mode. The two rule modes live in SEPARATE scenarios
  # because Basic Load Balancing caps rules at 1 per load balancer (400/1002
  # "rule count 2 exceeds limit 1", measured live 2026-08-28).
  #
  # Entitlement gate: Cloudflare Load Balancing is a paid account add-on
  # (~$5/mo + per-origin) and it gates the WHOLE chain -- pools included.
  # A PENDING (undelegated) zone ACCEPTS load balancer creation (measured
  # live 2026-08-28 by direct-API probe on a throwaway pending zone), so the
  # run-scoped pending fixture zone serves these lanes as-is -- no env-gated
  # ACTIVE-zone arm is needed.
  # Deliberately not in the live scenarios: pop_pools (Enterprise-only
  # entitlement) and networks (needs a private-network setup; the send path
  # is proven by the offline plan).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
