# Flagship CloudflareLoadBalancer scenario: the traffic-rules surface plus
# session affinity. ONE steering-overrides rule (explicit steering_policy
# "off" and session_affinity "none", proving the override-presence semantics:
# an explicit default-valued override is SENT, not dropped). Proxied, with
# cookie affinity at the top level so the override has something real to
# override. Exactly one rule by design: Basic Load Balancing caps rules at 1
# per load balancer -- a second rule answers 400 code 1002 "rule count 2
# exceeds limit 1" (measured live 2026-08-28); the terminating fixed-response
# mode lives in its own `fixed-response` scenario for the same reason.
# Deliberately absent: pop_pools (Enterprise entitlement) and networks (needs
# a private-network setup; offline plan proves the send path).
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareLoadBalancer
metadata:
  name: planton-oss-e2e-cloudflareloadbalancer-rules
  id: planton-oss-e2e-cloudflareloadbalancer-rules
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: cloudflareloadbalancer
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  # Fully qualified, composed with the fixture zone's run token -- Cloudflare
  # rejects bare labels (400/1002 "invalid hostname", measured live).
  hostname: e2e-lb-rules.planton-e2e-${E2E_RUN_ID}.com
  zoneId:
    valueFrom:
      kind: CloudflareDnsZone
      name: planton-oss-e2e-cloudflarednszone-prereq
      fieldPath: status.outputs.zone_id
  defaultPools:
    - valueFrom:
        kind: CloudflareLoadBalancerPool
        name: planton-oss-e2e-cloudflareloadbalancerpool-prereq
        fieldPath: status.outputs.pool_id
  fallbackPool:
    valueFrom:
      kind: CloudflareLoadBalancerPool
      name: planton-oss-e2e-cloudflareloadbalancerpool-prereq
      fieldPath: status.outputs.pool_id
  proxied: true
  sessionAffinity: cookie
  sessionAffinityTtl: 1800
  sessionAffinityAttributes:
    samesite: Lax
    secure: Auto
    zeroDowntimeFailover: temporary
  rules:
    - name: api-no-affinity
      condition: http.request.uri.path contains "/api"
      priority: 2
      overrides:
        steeringPolicy: "off"
        sessionAffinity: none
