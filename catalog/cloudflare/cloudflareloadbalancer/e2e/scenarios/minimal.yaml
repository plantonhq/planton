# Minimal CloudflareLoadBalancer scenario: static failover (steering off) over
# one prerequisite pool, gray-clouded, in the prerequisite zone. The zone_id
# and pool references resolve from the prerequisites' outputs (the kind's
# registry prerequisites). The hostname is FULLY QUALIFIED, composed from the
# fixture zone's run-scoped name with the same run token: Cloudflare rejects a
# bare label with 400 code 1002 "Invalid load balancer name: invalid hostname"
# (measured live 2026-08-28) -- the API wants the complete DNS name, exactly
# as the spec models it.
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareLoadBalancer
metadata:
  name: planton-oss-e2e-cloudflareloadbalancer-minimal
  id: planton-oss-e2e-cloudflareloadbalancer-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: cloudflareloadbalancer
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  hostname: e2e-lb-minimal.planton-e2e-${E2E_RUN_ID}.com
  zoneId:
    valueFrom:
      kind: CloudflareDnsZone
      name: planton-oss-e2e-cloudflarednszone-prereq
      fieldPath: status.outputs.zone_id
  defaultPools:
    - valueFrom:
        kind: CloudflareLoadBalancerPool
        name: planton-oss-e2e-cloudflareloadbalancerpool-prereq
        fieldPath: status.outputs.pool_id
  fallbackPool:
    valueFrom:
      kind: CloudflareLoadBalancerPool
      name: planton-oss-e2e-cloudflareloadbalancerpool-prereq
      fieldPath: status.outputs.pool_id
  proxied: false
  ttl: 30
