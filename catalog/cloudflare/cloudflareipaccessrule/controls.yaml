# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflareipaccessrule
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The rule stores a selector (IP, CIDR, ASN, country) at Cloudflare, not customer data this component encrypts.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No customer-managed key surface (see enc-at-rest).
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Rule management traffic to the Cloudflare API is HTTPS. The component has no toggle that would send the selector in the clear.
    - control_id: no-public-access
      status: not_applicable
      notes: The rule is an edge decision, not a public endpoint this component exposes.
    - control_id: restricted-ingress
      status: configurable
      field_path: configuration
      evidence:
        type: spec_default
        reference: configuration.target and configuration.value select the IP, range, ASN, or country the rule matches; mode decides allow, block, or challenge.
      notes: This is the ingress control -- a static selector applied before other security products. Changing target/value on an existing rule does not stick; recreate to change the match.
    - control_id: edge-protection
      status: configurable
      field_path: mode
      evidence:
        type: spec_default
        reference: mode is block, challenge, whitelist, js_challenge, or managed_challenge -- the action taken on matching traffic at the edge.
      notes: whitelist bypasses other security features for the matched selector; pick it deliberately.
    - control_id: rbac
      status: not_applicable
      notes: Management access is Cloudflare account-membership posture; the rule exposes no data plane of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The component holds no credentials.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication path of its own.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Cloudflare records rule changes in the account audit log unconditionally -- not a property this component configures.
    - control_id: monitoring-integration
      status: not_applicable
      notes: No monitoring signal to switch.
    - control_id: backup-recovery
      status: not_applicable
      notes: Declarative configuration, fully re-creatable from the manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Account-scoped rules apply to every zone; zone-scoped rules apply to one zone. Served by Cloudflare's global edge.
    - control_id: deletion-protection
      status: not_applicable
      notes: Destroy is a real delete. Changing configuration (target/value) is not a replace -- it plans an in-place update that Cloudflare ignores, so the old match keeps serving until you recreate the rule.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- Cloudflare operates IP Access rules; no customer-visible patch surface exists.
