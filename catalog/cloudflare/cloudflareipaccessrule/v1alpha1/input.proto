syntax = "proto3";

package dev.planton.cloudflare.cloudflareipaccessrule.v1alpha1;

import "catalog/cloudflare/cloudflareipaccessrule/v1alpha1/api.proto";
import "catalog/cloudflare/provider.proto";

// CloudflareIpAccessRuleIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message CloudflareIpAccessRuleIacInput {
  // the catalog object to deploy to be deployed
  CloudflareIpAccessRule target = 1;
  // provider-config for Cloudflare authentication
  dev.planton.cloudflare.CloudflareProviderConfig provider_config = 2;
}
