# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
#
# The spec pins the rule to exactly ONE scope (account XOR zone), so a
# given stack needs only that scope's pair of groups.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflareipaccessrule
spec:
  cloudflare:
    groups:
      - purpose: ManageZoneRule
        name: Firewall Services Write
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: Needed only when the rule is zone-scoped (spec.zone_id set) -- create/update/delete the rule via POST/PATCH/DELETE /zones/{zone_id}/firewall/access_rules/rules[/{id}] (derived from the module's API surface). Covers the Terraform module's single cloudflare_access_rule resource and the Pulumi module's matching AccessRule resource; neither engine performs secondary lookups. Group names verbatim from the Cloudflare API token permissions reference (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22).
      - purpose: ReadZoneRule
        name: Firewall Services Read
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: Needed only when the rule is zone-scoped (spec.zone_id set) -- refresh/import the rule via GET on the same path (derived from the module's API surface).
      - purpose: ManageAccountRule
        name: Account Firewall Access Rules Write
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Needed only when the rule is account-wide (spec.account_id set) -- create/update/delete the rule via POST/PATCH/DELETE /accounts/{account_id}/firewall/access_rules/rules[/{id}] (derived from the module's API surface). Covers the Terraform module's single cloudflare_access_rule resource and the Pulumi module's matching AccessRule resource; neither engine performs secondary lookups.
      - purpose: ReadAccountRule
        name: Account Firewall Access Rules Read
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Needed only when the rule is account-wide (spec.account_id set) -- refresh/import the rule via GET on the same path (derived from the module's API surface).
