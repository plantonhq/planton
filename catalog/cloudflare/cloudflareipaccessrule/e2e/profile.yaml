apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflareipaccessrule
spec:
  # IP Access rules under live E2E: the account-scoped arm needs no fixture
  # (block an IP account-wide, verify via the firewall access_rules API,
  # destroy 404s honestly -- real delete). The zone-scoped arm declares the
  # zone fixture per-scenario (planton.dev/e2e-prerequisites) because the
  # kind has no registry prerequisite -- account scope is the canonical case.
  # Watch items for the proving session: (a) the API honors in-place updates
  # only for mode and notes -- the idempotency re-plan is clean, but any
  # future update-scenario touching configuration must expect the change not
  # to stick (provider defect class, taught in the spec); (b) rules are
  # free-plan objects that create in seconds at zero cost.
  tier: 1
  # PROVEN live 2026-08-27: both scenarios on both engines through the full
  # lifecycle; the account arm's blind import round-trip passed at zero
  # tolerances; the zone arm skips the round-trip by scenario annotation
  # (dual-scope id underivable -- see the scenario) and its lifecycle proved
  # the dual-scope verifier's zone path. T1/managed_challenge accepted on a
  # pending zone; account and zone deletes both 404 honestly.
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 10
