syntax = "proto3";

package dev.planton.cloudflare.cloudflareworkerskvpair.v1alpha1;

// CloudflareWorkersKvPairOutputs captures the outputs after writing a
// Workers KV entry.
message CloudflareWorkersKvPairOutputs {
  // The entry's key name.
  string key_name = 1;

  // The namespace ID the entry was written to.
  string namespace_id = 2;
}
