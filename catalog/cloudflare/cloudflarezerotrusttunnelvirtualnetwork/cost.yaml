# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: cloudflarezerotrusttunnelvirtualnetwork
spec:
  billing_model: free
  free_tier: "A virtual network is an isolated routing segment inside Cloudflare Tunnel -- a namespace that lets overlapping private CIDRs ride different tunnels without collision. Cloudflare Tunnel is \"Available on all plans\" per its own landing page (https://developers.cloudflare.com/tunnel/, fetched 2026-08-22), and no meter counts virtual networks, the routes inside them, or the traffic that flows through them."
  notes: "No field of this spec buys anything: name, comment, and is_default_network are pure routing-namespace configuration -- four fields, none spend-capable. The real spend lives entirely downstream of the segment: the tunnels' cloudflared connector machines and the private infrastructure reachable inside the segment bill as their own components, egress rides that infrastructure's own network billing, and the WARP users who select the virtual network consume Zero Trust seats -- free through 50 users, per-user above, chosen at the account (https://developers.cloudflare.com/cloudflare-one/team-and-resources/users/seat-management/, fetched 2026-08-22)."
