apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarezerotrusttunnelvirtualnetwork
spec:
  # A tunnel virtual network under live E2E: account-scoped, no prerequisites
  # -- deploy -> GET accounts/{account_id}/teamnet/virtual_networks/{vnet_id}
  # verify -> destroy -> verify-destroyed on both provisioners. The minimal
  # scenario creates one named network with a comment (names are unique within
  # an account, so the name carries the run id). Deliberately not live:
  # is_default_network -- promoting a network to the account's default demotes
  # the existing default, a real account-level mutation a throwaway lane must
  # not make; the field is preset-proven (presets/02-default-network). Unlike
  # tunnels and routes, a destroyed virtual network 404s honestly, so the
  # plain existence probe verifies destroy. Objects create in seconds at zero
  # cost (part of Zero Trust Free).
  tier: 1
  # Proven live 2026-08-26: both engines ran minimal through the full
  # lifecycle (deploy -> REST-API verify -> destroy -> verify-absent; a
  # destroyed virtual network 404s honestly, live-confirmed) with the
  # apply-idempotency re-plan green, plus the blind import round-trip on the
  # Terraform lane at a clean no-op plan.
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
