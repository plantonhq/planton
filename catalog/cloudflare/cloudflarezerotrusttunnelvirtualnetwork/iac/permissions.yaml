# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflarezerotrusttunnelvirtualnetwork
spec:
  cloudflare:
    groups:
      - purpose: ManageVirtualNetwork
        name: Cloudflare Tunnel Write
        scope: com.cloudflare.api.account
        provenance: derived
        notes: "Create/update/delete the virtual network via POST/PATCH/DELETE /accounts/{account_id}/teamnet/virtual_networks[/{virtual_network_id}]. Chosen as the primary claim because it is the group the permissions reference documents (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22) and the one a stack that also manages tunnels and routes already holds; \"Cloudflare One Networks Write\" is the documented narrower alternate for routes/vnets-only credentials -- the \"Accepted Permissions\" section of the virtual networks create endpoint doc (https://developers.cloudflare.com/api/resources/zero_trust/subresources/networks/subresources/virtual_networks/methods/create/, retrieved 2026-08-22) accepts either of the two groups (either suffices), the same pair as tunnel routes. Covers the Terraform module's single cloudflare_zero_trust_tunnel_cloudflared_virtual_network resource and the Pulumi module's matching ZeroTrustTunnelCloudflaredVirtualNetwork resource; no other API is touched. The header inventory recorded this entry as documented provenance (the write group upgraded from static analysis by the endpoint page cited above); the schema's provenance vocabulary is derived/proven, so it is carried as derived until the live capture lane upgrades it."
      - purpose: ReadVirtualNetwork
        name: Cloudflare Tunnel Read
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Refresh/import via GET (Write covers the whole lifecycle; Read is only needed for read-only credentials).
