apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflareruleset
spec:
  # A ruleset under live E2E: the harness deploys the CloudflareDnsZone
  # prerequisite (a run-scoped pending zone), resolves zone_id from its
  # outputs, then runs deploy -> GET zones/{zone_id}/rulesets/{ruleset_id}
  # verify -> destroy -> verify-destroyed on both provisioners. The
  # custom-firewall scenario proves the zone-scoped ruleset lifecycle in the
  # free-plan http_request_firewall_custom phase (two custom rules: a block
  # and a managed challenge). Deliberately not live: the skip-rules map
  # (targeting specific rule IDs inside another ruleset needs a second
  # deployed ruleset's introspected IDs -- offline-plan-proven at
  # e2e/skip-rules-plan.yaml), account-scoped rulesets (the harness verifier
  # and outputs are wired for the zone scope; the account arm is a recorded
  # follow-up), and paid/Enterprise phases (managed WAF execution,
  # http_ratelimit) per the program's entitlement gates. Watch: whether a
  # PENDING (undelegated) zone accepts ruleset creation is unverified
  # offline. Objects create in seconds at zero cost.
  tier: 1
  # Proven live 2026-08-26: both engines ran custom-firewall through the full
  # lifecycle (deploy -> REST-API verify -> destroy -> verify-absent) with
  # the apply-idempotency re-plan green, plus the blind import round-trip
  # (zones/{zone_id}/{ruleset_id}) on the Terraform lane. Rulesets confirmed
  # to deploy on a PENDING (undelegated) zone. The lane also measured the
  # free-plan expression-grammar wall: operator-form starts_with is rejected
  # (400 code 20127), function-form starts_with() deploys -- the scenario
  # and every committed example use the function form.
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
