# Custom-firewall CloudflareRuleset scenario: a zone-scoped ruleset in the
# free-plan http_request_firewall_custom phase with two ordered custom rules
# (a block on a marker path and a managed challenge on another) -- the
# smallest live shape that proves rule ordering, expressions, and per-rule
# enable flags. The zone_id resolves from the CloudflareDnsZone
# prerequisite's outputs; ruleset names need no run-scoping (rulesets are
# zone-local and the fixture zone is already run-scoped).
#
# Expression grammar is plan-gated at Cloudflare: the OPERATOR form
# (`http.request.uri.path starts_with "/x"`) is rejected on free-plan zones
# with 400 code 20127 "expected ComparisonOp" -- the free-plan filter parser
# simply lacks the operator (measured live 2026-08-26). The FUNCTION form
# (`starts_with(http.request.uri.path, "/x")`) parses and deploys on the
# free plan (measured the same day), so these expressions use it.
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareRuleset
metadata:
  name: planton-oss-e2e-cloudflareruleset-firewall
  id: planton-oss-e2e-cloudflareruleset-firewall
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: cloudflareruleset
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  zone_id:
    valueFrom:
      kind: CloudflareDnsZone
      name: planton-oss-e2e-cloudflarednszone-prereq
      fieldPath: status.outputs.zone_id
  ruleset_kind: zone
  phase: http_request_firewall_custom
  name: planton-e2e-custom-firewall
  rules:
    - ref: block-marker-path
      expression: 'starts_with(http.request.uri.path, "/planton-e2e-block")'
      action: block
      description: planton e2e block rule
      enabled: true
    - ref: challenge-marker-path
      expression: 'starts_with(http.request.uri.path, "/planton-e2e-challenge")'
      action: managed_challenge
      description: planton e2e managed-challenge rule
      enabled: true
