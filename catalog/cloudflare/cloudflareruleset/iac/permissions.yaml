# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
#
# The module manages one cloudflare_ruleset resource against
# POST/PUT/GET/DELETE /{accounts|zones}/{account_or_zone_id}/rulesets
# [/{ruleset_id}] -- the spec's zone_id/account_id oneof decides the scope.
# The entries below cover ACCOUNT-LEVEL rulesets (spec sets account_id).
#
# ZONE-LEVEL rulesets (spec sets zone_id): HONEST UNKNOWN. The create
# endpoint doc publishes only the account-scope list carried in the write
# entry's notes, and Cloudflare publishes no phase-to-group mapping for
# zone rulesets. The permissions reference's zone tables carry per-product
# write groups ("Zone WAF Write", "Cache Settings Write", "Zone Transform
# Rules Write", "Dynamic URL Redirects Write", "Origin Write", "Zone
# Settings Write"), each plausibly scoped to its own phase, but no
# Cloudflare page states which group unlocks which phase, so this file does
# not guess. This component's README has long claimed "Zone > Zone Settings
# > Edit for most phases" (migrated here verbatim as the README's claim,
# not Cloudflare's). The live capture lane resolves the zone-scope story to
# proven.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflareruleset
spec:
  cloudflare:
    groups:
      - purpose: ManageRuleset
        name: Account Rulesets Write
        scope: com.cloudflare.api.account
        provenance: derived
        notes: "Applies to account-level rulesets (spec sets account_id) -- covers the Terraform module's single cloudflare_ruleset resource and the Pulumi module's matching Ruleset resource against POST/PUT/DELETE /accounts/{account_id}/rulesets[/{ruleset_id}] (neither engine performs secondary lookups); the general account-rulesets group. The create endpoint's Accepted Permissions list names it verbatim (alongside narrower product groups: \"Mass URL Redirects Write\", \"Magic Firewall Write\", \"L4 DDoS Managed Ruleset Write\", \"Transform Rules Write\", \"Select Configuration Write\", \"Account WAF Write\", \"Logs Write\" -- at least one is required, and the product groups only cover their own phases) -- documented-strength evidence (https://developers.cloudflare.com/api/resources/rulesets/methods/create/, retrieved 2026-08-22), recorded as derived until the live capture lane proves it. Group names verbatim from the Cloudflare API token permissions reference (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22)."
      - purpose: ReadRuleset
        name: Account Rulesets Read
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Applies to account-level rulesets (spec sets account_id) -- refresh/import the ruleset via GET (Write covers the whole lifecycle; Read is only needed for read-only credentials).
