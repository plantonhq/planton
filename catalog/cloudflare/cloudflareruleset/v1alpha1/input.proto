syntax = "proto3";

package dev.planton.cloudflare.cloudflareruleset.v1alpha1;

import "catalog/cloudflare/cloudflareruleset/v1alpha1/api.proto";
import "catalog/cloudflare/provider.proto";

// CloudflareRulesetIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message CloudflareRulesetIacInput {
  // target infra-component to be deployed
  CloudflareRuleset target = 1;
  // provider-config for Cloudflare authentication
  dev.planton.cloudflare.CloudflareProviderConfig provider_config = 2;
}
