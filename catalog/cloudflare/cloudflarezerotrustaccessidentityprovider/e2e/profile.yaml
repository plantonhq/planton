apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarezerotrustaccessidentityprovider
spec:
  # Access identity providers under live E2E: account-scoped, no prerequisites
  # -- deploy -> API verify -> destroy -> verify-absent on both provisioners.
  # Delete is a real API DELETE with an honest 404 read after it (note: the
  # provider's own test suite has NO CheckDestroy for this resource, so our
  # verify-absent is stricter than upstream). Creates in seconds; free.
  # PREREQUISITE (account setup, not a fixture): the account's Zero Trust
  # organization (team name) must exist or every Access create fails at the
  # API -- a one-time Phase-2 provisioning step. The github-oauth scenario
  # uses dummy OAuth credentials: creation validates SHAPE, not credentials
  # (users could not log in through it; the lane never needs them to). The
  # SAML shape is offline-plan-proven via e2e/saml-plan.yaml. The onetimepin
  # shape is offline-plan-proven via e2e/onetimepin-plan.yaml: one-time PIN is
  # an ACCOUNT SINGLETON (a second create answers 409 "a onetimepin connection
  # already exists", measured live 2026-08-26 on both engines) and the shared
  # test account permanently carries its production OTP provider. The
  # upstream OTP API-token-auth watch item is therefore moot live (that arm
  # never runs); it returns if a future account ever runs an OTP lane.
  # LIVE-PROVEN 2026-08-26: github-oauth on both engines, full lifecycle +
  # blind import round-trip; a tofu output-sensitivity taint on scim outputs
  # was caught live and fixed (see iac/tf/outputs.tf).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
  cost_class: cheap_ephemeral
