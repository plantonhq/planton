syntax = "proto3";

package dev.planton.cloudflare.cloudflarezerotrustaccessidentityprovider.v1alpha1;

import "catalog/cloudflare/cloudflarezerotrustaccessidentityprovider/v1alpha1/api.proto";
import "catalog/cloudflare/provider.proto";

// CloudflareZeroTrustAccessIdentityProviderIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message CloudflareZeroTrustAccessIdentityProviderIacInput {
  // target infra-component to be deployed
  CloudflareZeroTrustAccessIdentityProvider target = 1;
  // provider-config for Cloudflare authentication
  dev.planton.cloudflare.CloudflareProviderConfig provider_config = 2;
}
