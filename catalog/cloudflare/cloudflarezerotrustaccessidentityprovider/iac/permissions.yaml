# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflarezerotrustaccessidentityprovider
spec:
  cloudflare:
    groups:
      - purpose: ManageIdentityProvider
        name: "Access: Organizations, Identity Providers, and Groups Write"
        scope: com.cloudflare.api.account
        provenance: derived
        notes: "Create/update/delete the identity provider via POST/PUT/DELETE /accounts/{account_id}/access/identity_providers[/{idp_id}] (or the /zones/{zone_id}/... variant when the spec targets a zone). Each endpoint's docs name THIS combined group as the accepted permission; the narrower \"Access: Identity Providers Write\" group also exists on the general reference, but the endpoint docs do not list it as accepted, so we do not claim it suffices. Covers the Terraform module's single cloudflare_zero_trust_access_identity_provider resource and the Pulumi module's matching ZeroTrustAccessIdentityProvider resource; neither engine performs secondary lookups or data-source reads. Group names verbatim from the Cloudflare API token permissions reference (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22), cross-checked against the \"Accepted Permissions\" sections of the Access identity provider API endpoint docs (https://developers.cloudflare.com/api/resources/zero_trust/subresources/identity_providers/, create/get/update/delete method pages, retrieved 2026-08-22)."
      - purpose: ReadIdentityProvider
        name: "Access: Organizations, Identity Providers, and Groups Read"
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Refresh/import the identity provider via GET /accounts/{account_id}/access/identity_providers/{idp_id} (the get endpoint accepts Read or Write; Write alone covers the whole lifecycle, so Read is only needed for read-only credentials).
