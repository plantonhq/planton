syntax = "proto3";

package dev.planton.cloudflare.cloudflareaigateway.v1alpha1;

import "catalog/cloudflare/cloudflareaigateway/v1alpha1/api.proto";
import "catalog/cloudflare/provider.proto";

// CloudflareAiGatewayIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message CloudflareAiGatewayIacInput {
  // target infra-component to be deployed
  CloudflareAiGateway target = 1;
  // provider-config for Cloudflare authentication
  dev.planton.cloudflare.CloudflareProviderConfig provider_config = 2;
}
