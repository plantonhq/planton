# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
#
# "AI Gateway Run" (WebSockets runtime access) is NOT needed: the modules
# only provision the control plane, they never invoke the gateway.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflareaigateway
spec:
  cloudflare:
    groups:
      - purpose: ManageGateway
        name: AI Gateway Write
        scope: com.cloudflare.api.account
        provenance: derived
        notes: "Covers the Terraform module's cloudflare_ai_gateway and cloudflare_ai_gateway_dynamic_routing resources and the Pulumi module's matching AiGateway and AiGatewayDynamicRouting resources -- create/update/delete the gateway via POST/PUT/DELETE /accounts/{account_id}/ai-gateway/gateways[/{id}] and its dynamic-routing objects via POST/PUT/DELETE /accounts/{account_id}/ai-gateway/gateways/{gateway_id}/dynamic-routes[/{id}] (derived from the module's API surface; neither engine performs secondary lookups). Name note: the docs-site permissions reference page spells this group \"AI Gateway Edit\" (retrieved 2026-08-22), but the provider's own permission-group inventory -- the source token creation validates against and this catalog's gate proves against -- defines \"AI Gateway Write\" at account scope (retrieved 2026-08-22); the docs page carries the dashboard-flavored spelling."
      - purpose: ReadGateway
        name: AI Gateway Read
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Read-side of the same resources -- refresh/import the gateway and its dynamic routes via GET on the same paths (derived from the module's API surface).
