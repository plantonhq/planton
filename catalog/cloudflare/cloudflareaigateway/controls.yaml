# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflareaigateway
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Collected logs and cached responses are stored by Cloudflare encrypted at rest; zdr can prevent body storage entirely.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No customer-managed key surface; logpush_public_key encrypts SHIPPED logs, which is transit posture, not at-rest CMK.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The gateway endpoint is HTTPS-only, and upstream calls to model providers ride TLS.
    - control_id: no-public-access
      status: configurable
      field_path: authentication
      evidence:
        type: spec_default
        reference: authentication requires the cf-aig-authorization token on every request; without it the endpoint is callable by anyone who knows the URL slug.
      notes: Set authentication true on any gateway fronting paid providers -- an open slug is someone else's free API key.
    - control_id: restricted-ingress
      status: configurable
      field_path: rate_limiting_limit
      evidence:
        type: spec_validation
        reference: The required rate-limiting pair (interval/limit, technique fixed|sliding) budgets requests per window at the gateway.
    - control_id: edge-protection
      status: configurable
      field_path: guardrails
      evidence:
        type: spec_validation
        reference: Guardrails (per-hazard FLAG/BLOCK on prompts and responses) and dlp screening are the gateway's content-protection edge.
    - control_id: rbac
      status: not_applicable
      notes: Management access is Cloudflare account-membership posture; caller access is the authentication token (see no-public-access).
    - control_id: workload-identity
      status: not_applicable
      notes: The gateway proxies credentials (BYO keys via store_id) rather than being an identity itself.
    - control_id: no-legacy-auth
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The only caller-auth mechanism is the cf-aig-authorization bearer token -- no basic auth or legacy scheme exists on this surface.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: configurable
      field_path: collect_logs
      evidence:
        type: spec_validation
        reference: collect_logs (required, explicit) decides whether request/response logs are collected; log_management caps retention; logpush ships them out.
    - control_id: monitoring-integration
      status: configurable
      field_path: otel
      evidence:
        type: spec_validation
        reference: otel destinations export gateway telemetry to any OpenTelemetry endpoint.
    - control_id: backup-recovery
      status: not_applicable
      notes: Declarative configuration re-creatable from the manifest; collected logs are operational data with their own retention (log_management), not backups.
    - control_id: backup-retention-policy
      status: configurable
      field_path: log_management
      evidence:
        type: spec_validation
        reference: log_management.max_records (10k-10M) plus strategy (STOP_INSERTING / DELETE_OLDEST) is a literal retention policy over stored logs.
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The gateway runs on Cloudflare's global edge; there is no single-zone deployment mode.
    - control_id: deletion-protection
      status: not_applicable
      notes: Destroy is a real delete of the gateway and its routes -- clients calling the endpoint URL fail immediately; drain traffic first.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- Cloudflare operates the gateway; the customer owns only its configuration.
