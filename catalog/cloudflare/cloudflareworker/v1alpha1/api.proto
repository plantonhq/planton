syntax = "proto3";

package dev.planton.cloudflare.cloudflareworker.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflareworker/v1alpha1/outputs.proto";
import "catalog/cloudflare/cloudflareworker/v1alpha1/spec.proto";
import "shared/metadata.proto";

// cloudflare-worker
message CloudflareWorker {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareWorker'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  CloudflareWorkerSpec spec = 4 [(buf.validate.field).required = true];

  //status
  CloudflareWorkerStatus status = 5;
}

// cloudflare-worker status
message CloudflareWorkerStatus {
  //outputs
  //  cloudflare-worker outputs
  CloudflareWorkerOutputs outputs = 1;
}
