apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflareworker
spec:
  # A Worker under live E2E: the harness deploys the script (inline content,
  # no prerequisites), then GETs accounts/{account}/workers/services/{name}
  # to prove it exists, then destroy, then prove it is gone. Two live
  # scenarios: minimal (inline hello-world on workers.dev) and
  # observability-json (nested logs + traces). A third, r2-bundle, builds
  # the script from an R2 bundle as the harness's connection-with-r2
  # identity; it needs an owner-arranged bucket and R2 key pair (see its
  # header) and skips without them. Durable Object migrations
  # are a one-shot Cloudflare tag — a second apply of the same new_tag is
  # rejected — so they live in e2e/migrations-plan.yaml for offline plan
  # only, never in e2e/scenarios/ (the provider profile asserts apply
  # idempotency). Workers create in seconds on the free tier.
  tier: 1
  # Proven live 2026-08-26 on the real account: both scenarios through the
  # full lifecycle on both engines (idempotency gate green) plus the blind
  # import round-trip on both terraform lanes (script + subdomain re-imported
  # blind; the plan proposed no real change beyond the catalog-declared
  # import-normalization set). Live proof also caught and fixed: the pulumi
  # module's missing main_module="index.js" default (legacy-script upload
  # rejected ES-module syntax) and the traces propagation_policy account
  # feature gate (403 code 100342) -- that field is offline-only here now.
  status: green
  timeout_minutes: 15
  validated_provisioners:
    - pulumi
    - terraform
