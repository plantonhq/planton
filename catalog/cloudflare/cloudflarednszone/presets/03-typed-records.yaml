apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareDnsZone
metadata:
  name: my-dns-zone
spec:
  zoneName: replaceme.example.com # replace with your domain
  accountId: "0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d" # replace with your account id
  records:
    - name: www
      type: A
      content:
        value: <web-server-ipv4>
      proxied: true
    - name: "@"
      type: MX
      content:
        value: <mail-host.your-domain.com>
      priority: 10
    - name: "@"
      type: TXT
      content:
        value: "v=spf1 include:_spf.<mail-provider.com> ~all"
    - name: _sip._tcp
      type: SRV
      srv:
        priority: 10
        weight: 5
        port: 5060
        target:
          value: <sip-host.your-domain.com>
    - name: "@"
      type: CAA
      caa:
        tag: issue
        value: <ca-domain.org>
