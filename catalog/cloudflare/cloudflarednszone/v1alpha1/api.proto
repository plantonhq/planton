syntax = "proto3";

package dev.planton.cloudflare.cloudflarednszone.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflarednszone/v1alpha1/outputs.proto";
import "catalog/cloudflare/cloudflarednszone/v1alpha1/spec.proto";
import "shared/metadata.proto";

// cloudflare-dns-zone
message CloudflareDnsZone {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareDnsZone'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  CloudflareDnsZoneSpec spec = 4 [(buf.validate.field).required = true];

  //status
  CloudflareDnsZoneStatus status = 5;
}

// cloudflare-dns-zone status
message CloudflareDnsZoneStatus {
  //outputs
  //  cloudflare-dns-zone outputs
  CloudflareDnsZoneOutputs outputs = 1;
}
