# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflarednszone
spec:
  cloudflare:
    groups:
      - purpose: ManageZone
        name: Zone Write
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: Covers the Terraform module's cloudflare_zone resource plus conditional cloudflare_zone_subscription, cloudflare_zone_dnssec, cloudflare_zone_hold, and cloudflare_zone_dns_settings singletons and per-record cloudflare_dns_record resources, and the Pulumi module's matching Zone, ZoneSubscription, ZoneDnssec, ZoneHold, ZoneDnsSettings, and DnsRecord resources (neither engine performs secondary lookups) -- create/delete the zone via POST/DELETE /zones[/{id}] (the create endpoint's Accepted Permissions lists the dashboard-flavored "Zone Zone Edit" and "Zone DNS Edit" -- https://developers.cloudflare.com/api/resources/zones/methods/create/, retrieved 2026-08-22) and manage the zone hold via POST/DELETE /zones/{zone_id}/hold (that endpoint's Accepted Permissions names "Zone Write" verbatim -- https://developers.cloudflare.com/api/resources/zones/subresources/holds/methods/create/, retrieved 2026-08-22). Group name verbatim from the Cloudflare API token permissions reference (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22).
      - purpose: ReadZone
        name: Zone Read
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: Refresh/import the zone and hold via GET on the same paths (derived from the modules' API surface).
      - purpose: ManageRecords
        name: DNS Write
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: Create/update/delete the zone's DNS records via POST/PATCH/DELETE /zones/{zone_id}/dns_records[/{id}] (https://developers.cloudflare.com/api/resources/dns/subresources/records/methods/create/ names "DNS Write", retrieved 2026-08-22), enable DNSSEC via PATCH /zones/{zone_id}/dnssec (https://developers.cloudflare.com/api/resources/dns/subresources/dnssec/methods/edit/ names "DNS Write", retrieved 2026-08-22), and write zone-wide DNS settings via PATCH /zones/{zone_id}/dns_settings (https://developers.cloudflare.com/api/resources/dns/subresources/settings/subresources/zone/methods/edit/ accepts "DNS Write" alongside "Zone DNS Settings Write", a group the general reference does not list; retrieved 2026-08-22).
      - purpose: ReadRecords
        name: DNS Read
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: Refresh/import records, DNSSEC, and DNS settings via GET on the same paths (derived from the modules' API surface).
      - purpose: ManagePlan
        name: Billing Write
        scope: com.cloudflare.api.account
        provenance: derived
        notes: "CONDITIONAL -- needed only when the spec sets a subscription: the zone plan is created via PUT /zones/{zone_id}/subscription, whose endpoint reference's Accepted Permissions names \"Billing Write\" verbatim (https://developers.cloudflare.com/api/resources/zones/subresources/subscriptions/methods/create/, retrieved 2026-08-22), matching the spec's own contract comment; the group exists verbatim in the reference's account-permissions table."
