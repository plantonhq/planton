# Records-portfolio CloudflareDnsZone scenario: one zone carrying the folded
# record surface that is free-plan-safe on a run-scoped PENDING zone --
# inline records through BOTH value paths (simple `content` records and typed
# structured-data records at the record level: srv/caa) plus a record
# comment. The A record stays gray-clouded (proxied=false): a proxied record
# on a pending zone serves nothing and adds no verification value. The NS
# record's content ends in the root dot, the way another provider's zone
# output spells a nameserver: Cloudflare stores it without the dot, so the
# apply-idempotency re-plan proves the module sends what Cloudflare keeps.
#
# Live-measured walls keep the dnsSettings singleton and three record
# surfaces OUT of this scenario (all remain offline-plan-proven by the kind's
# e2e/manifest.yaml; measured 2026-08-26 on the real account):
#   - record tags: 400 code 9300 "DNS record has 1 tags, exceeding the quota
#     of 0" (a paid entitlement);
#   - record settings ipv4_only/ipv6_only: 400 code 9227 "not available to
#     this zone";
#   - dnsSettings (the whole singleton): its non-default values are
#     entitlement-gated one by one (soa tuning, nsTtl, flattenAllCnames each
#     answer 400 code 1003 "not available to this account or zone"), and even
#     a defaults-only write (zoneMode: standard PATCHes fine) re-plans forever
#     on the terraform engine: the v5.23.0 provider echoes server defaults
#     (ns_ttl 86400, the SOA timer block, nameservers.type) into state on
#     refresh while the schema marks those attributes Optional but NOT
#     Computed, so an unset field plans a perpetual removal -- an upstream
#     modeling defect the apply-idempotency gate rightly refuses. Pulumi's
#     preview never refreshes, so only terraform detects it.
#   - dnssec: 400 code 1017 "Invalid zone plan for action" on a PENDING zone
#     -- the same PATCH succeeds on an ACTIVE free-plan zone, so the wall is
#     delegation state, not plan tier; a zone this kind creates is always
#     pending, so DNSSEC is provable live only on a registrar-delegated zone.
# The plan-gated levers (vanity nameservers, foundation_dns, multi_provider)
# were offline-only from authoring.
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareDnsZone
metadata:
  name: planton-oss-e2e-cloudflarednszone-portfolio
  id: planton-oss-e2e-cloudflarednszone-portfolio
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: cloudflarednszone
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  zoneName: planton-e2e-rec-${E2E_RUN_ID}.com
  accountId: ${E2E_ENV:PLANTON_E2E_CLOUDFLARE_ACCOUNT_ID}
  records:
    - name: www
      type: A
      content:
        value: "192.0.2.10"
      ttl: 300
      comment: planton e2e portfolio scenario
    - name: "@"
      type: MX
      content:
        value: mail.planton-e2e.example.com
      ttl: 300
      priority: 10
    - name: _e2e._tcp
      type: SRV
      srv:
        priority: 10
        weight: 5
        port: 8443
        target:
          value: e2e.planton-e2e.example.com
    - name: "@"
      type: CAA
      caa:
        tag: issue
        value: letsencrypt.org
    - name: "@"
      type: TXT
      content:
        value: "planton-e2e-verification=portfolio"
    - name: e2e-delegated
      type: NS
      content:
        value: ns-cloud-a1.googledomains.com.
      ttl: 300
