# Invisible CloudflareTurnstileWidget scenario: no interactive challenge.
# Same dummy domain as `managed`; distinct name so both can coexist.
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareTurnstileWidget
metadata:
  name: planton-oss-e2e-cloudflareturnstilewidget-invisible
  id: planton-oss-e2e-cloudflareturnstilewidget-invisible
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: cloudflareturnstilewidget
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  accountId: ${E2E_ENV:PLANTON_E2E_CLOUDFLARE_ACCOUNT_ID}
  name: planton-e2e-${E2E_RUN_ID}-ts-inv
  domains:
    - planton-e2e.example
  mode: invisible
