syntax = "proto3";

package dev.planton.cloudflare.cloudflareturnstilewidget.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflareturnstilewidget/v1alpha1/outputs.proto";
import "catalog/cloudflare/cloudflareturnstilewidget/v1alpha1/spec.proto";
import "shared/metadata.proto";

// cloudflare-turnstile-widget
message CloudflareTurnstileWidget {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareTurnstileWidget'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  CloudflareTurnstileWidgetSpec spec = 4 [(buf.validate.field).required = true];

  //status
  CloudflareTurnstileWidgetStatus status = 5;
}

// cloudflare-turnstile-widget status
message CloudflareTurnstileWidgetStatus {
  //outputs
  //  cloudflare-turnstile-widget outputs
  CloudflareTurnstileWidgetOutputs outputs = 1;
}
