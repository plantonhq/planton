apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflaresnippet
spec:
  # Snippets under live E2E: the harness deploys the CloudflareDnsZone
  # prerequisite (a run-scoped pending zone), resolves zone_id, deploys the
  # snippet, verifies via the zone's snippets API, destroys (real delete by
  # name -- an honest 404 after). Watch items for the proving session:
  # (a) THE CONTENT-DRIFT CLASS -- the provider rebuilds file content from
  # the API's multipart response on refresh and takes the entry module from
  # a response header, so any server-side normalization of the source reads
  # back as drift against our idempotency gate; the scenario's content is a
  # deliberately byte-stable single line, and the provider's own v4
  # migration tests quietly tolerate non-empty plans here (their plan check
  # is a debug printer) -- if the re-plan drifts, it is this class, not the
  # module. (b) Create is an UPSERT: a name collision silently adopts an
  # existing snippet -- the run-scoped name prevents it. (c) MEASURED
  # 2026-08-27: Snippets are a PAID-PLAN product ("snippets are not allowed"
  # on any free zone) -- the live arm is env-gated on the operator's paid
  # test zone (PLANTON_E2E_CLOUDFLARE_ZONE_ID) and skips honestly when
  # unset. Objects create in seconds at no per-object cost on an entitled
  # zone.
  tier: 1
  # PROVEN live 2026-08-27 on the Pro test zone: minimal on both engines
  # through the full lifecycle. The round-trip runs the ADOPTER path: the
  # upstream importer crashes the provider (nil Metadata dereference on the
  # import read, v5.23.0..master -- catalog row has the evidence), so the
  # catalog declares not-importable and the runner proved the upsert
  # re-create converges instead. Verify-absent consumed the code-less 400
  # "requested snippet not found" absence class (harness client extended).
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 10
