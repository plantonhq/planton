# CloudflareSnippet install profile used as a prerequisite by
# CloudflareSnippetRules (its registry prerequisite): every snippet rule
# invokes a snippet by name, so one must exist before the rules table's lane
# deploys. The fixture is the cheapest deployable snippet -- a one-line
# pass-through module. The snippet_name is run-scoped with the UNDERSCORE
# run-ID variant (snippet names forbid hyphens; the plain token carries the
# runner's hyphenated engine suffix). metadata.name stays stable -- it is the
# key consumers' valueFrom references resolve against.
#
# The zone is the ENV-INJECTED paid test zone, not the run-scoped fixture
# zone: Snippets are a paid-plan product ("snippets are not allowed" on any
# free zone, measured live 2026-08-27), and fixture zones are always free.
# Consumers gate on PLANTON_E2E_CLOUDFLARE_ZONE_ID via e2e-required-env, so
# this fixture never installs with the token unset.
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareSnippet
metadata:
  name: planton-oss-e2e-cloudflaresnippet-prereq
  id: planton-oss-e2e-cloudflaresnippet-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: cloudflaresnippet
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  zone_id:
    value: ${E2E_ENV:PLANTON_E2E_CLOUDFLARE_ZONE_ID}
  snippet_name: e2e_prereq_${E2E_RUN_ID_UNDERSCORE}
  files:
    - name: main.js
      content: "export default { async fetch(request) { return fetch(request); } };"
  main_module: main.js
