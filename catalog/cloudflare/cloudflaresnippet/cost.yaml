# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: cloudflaresnippet
spec:
  billing_model: free
  notes: >-
    Snippets are included on every PAID plan but are NOT available on the
    Free plan -- Cloudflare's availability table shows Free at 0 snippets,
    Pro 25, Business 50, Enterprise 300
    (https://developers.cloudflare.com/rules/snippets/, retrieved
    2026-08-22). Creating a snippet creates no charge of its own. Cloudflare
    caps snippet COUNT per zone (per the plan tiers above) and code size per
    snippet -- the API enforces both at create. Plan upgrades that raise the
    count bill on the zone, never through this component.
