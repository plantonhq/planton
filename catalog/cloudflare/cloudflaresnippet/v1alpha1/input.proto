syntax = "proto3";

package dev.planton.cloudflare.cloudflaresnippet.v1alpha1;

import "catalog/cloudflare/cloudflaresnippet/v1alpha1/api.proto";
import "catalog/cloudflare/provider.proto";

// CloudflareSnippetIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message CloudflareSnippetIacInput {
  // target infra-component to be deployed
  CloudflareSnippet target = 1;
  // provider-config for Cloudflare authentication
  dev.planton.cloudflare.CloudflareProviderConfig provider_config = 2;
}
