syntax = "proto3";

package dev.planton.cloudflare.cloudflareemailroutingaddress.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflareemailroutingaddress/v1alpha1/outputs.proto";
import "catalog/cloudflare/cloudflareemailroutingaddress/v1alpha1/spec.proto";
import "shared/metadata.proto";

// cloudflare-email-routing-address
message CloudflareEmailRoutingAddress {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareEmailRoutingAddress'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  CloudflareEmailRoutingAddressSpec spec = 4 [(buf.validate.field).required = true];

  //status
  CloudflareEmailRoutingAddressStatus status = 5;
}

// cloudflare-email-routing-address status
message CloudflareEmailRoutingAddressStatus {
  //outputs
  //  cloudflare-email-routing-address outputs
  CloudflareEmailRoutingAddressOutputs outputs = 1;
}
