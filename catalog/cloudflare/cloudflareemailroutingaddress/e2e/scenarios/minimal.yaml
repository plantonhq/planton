# Minimal CloudflareEmailRoutingAddress scenario: one run-scoped destination
# address. The mailbox domain is the run's throwaway zone name (never
# registered -- the verification email goes nowhere, no third party is
# touched), and the address stays unverified, which does not block the
# create/verify/destroy lifecycle. The account comes from the harness env.
# The destroy-retry opt-in below exists because Cloudflare refuses deleting
# a destination address for ~10 minutes after create (400 code 2032;
# measured 2026-08-26: refused at 9m14s, accepted at 10m15s) -- the lane
# reaches destroy in under a minute, so the phase retries until the guard
# window passes.
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareEmailRoutingAddress
metadata:
  name: planton-oss-e2e-cloudflareemailroutingaddress-minimal
  id: planton-oss-e2e-cloudflareemailroutingaddress-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: cloudflareemailroutingaddress
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-destroy-retry: >-
      Cloudflare guards destination-address deletes for ~10 minutes after
      create (400 code 2032 "created too recently"); destroy retries until
      the window passes.
  tags:
    - planton-e2e
spec:
  accountId: ${E2E_ENV:PLANTON_E2E_CLOUDFLARE_ACCOUNT_ID}
  email: e2e-dest@planton-e2e-${E2E_RUN_ID}.com
