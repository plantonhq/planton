apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflareemailroutingaddress
spec:
  # A destination address under live E2E: account-scoped, no prerequisites --
  # deploy -> GET accounts/{account_id}/email/routing/addresses/{address_id}
  # verify -> destroy -> verify-destroyed on both provisioners. The minimal
  # scenario creates a run-scoped address on the run's never-registered
  # throwaway domain: Cloudflare sends its verification email into the void
  # by design (no third-party mailbox is ever touched), the address simply
  # stays unverified, and the lifecycle is fully provable regardless --
  # verification is orthogonal to create/delete. Deliberately not live: the
  # status override (spec.status) -- Cloudflare only permits flipping a
  # VERIFIED address back to unverified, and no lane can click the emailed
  # link to produce one; the send path is offline-plan-proven (and is a
  # documented Pulumi PARITY-EXCEPTION until the SDK carries the field).
  # Objects create in seconds at zero cost, but DESTROY WAITS: Cloudflare
  # refuses deleting an address for ~10 minutes after create (400 code 2032,
  # measured 2026-08-26), so the scenario opts into the runner's
  # destroy-retry and the timeout budget covers the guard window.
  tier: 1
  # Proven live 2026-08-26: both engines ran minimal through the full
  # lifecycle (deploy -> REST-API verify -> destroy -> verify-absent) with
  # the apply-idempotency re-plan green, plus the blind import round-trip
  # ({account_id}/{address_id}) on the Terraform lane. The DESTROY phase
  # rode the runner's scenario-declared destroy-retry through Cloudflare's
  # ~10-minute delete guard (400 code 2032) on both engines -- 10m08s and
  # 10m07s measured -- and verify-absent answered an honest 404 after.
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
