syntax = "proto3";

package dev.planton.cloudflare.cloudflarekvnamespace.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflarekvnamespace/v1alpha1/outputs.proto";
import "catalog/cloudflare/cloudflarekvnamespace/v1alpha1/spec.proto";
import "shared/metadata.proto";

// cloudflare-kv-namespace
message CloudflareKvNamespace {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareKvNamespace'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  CloudflareKvNamespaceSpec spec = 4 [(buf.validate.field).required = true];

  //status
  CloudflareKvNamespaceStatus status = 5;
}

// cloudflare-kv-namespace status
message CloudflareKvNamespaceStatus {
  //outputs
  //  cloudflare-kv-namespace outputs
  CloudflareKvNamespaceOutputs outputs = 1;
}
