# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
#
# The kind's catalog.md says only that the token needs "Workers KV
# permissions" -- no more specific prose existed to migrate.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflarekvnamespace
spec:
  cloudflare:
    groups:
      - purpose: ManageNamespace
        name: Workers KV Storage Write
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Covers the Terraform module's single cloudflare_workers_kv_namespace resource and the Pulumi module's matching WorkersKvNamespace resource -- create the namespace via POST /accounts/{account_id}/storage/kv/namespaces, rename it via PUT /accounts/{account_id}/storage/kv/namespaces/{namespace_id}, and delete it via DELETE on the same path (derived from the modules' API surface; neither engine performs secondary lookups or data-source reads). Group name verbatim from the Cloudflare API token permissions reference (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22; the page lists this account-scoped group in two naming variants -- "Workers KV Storage Edit" and "Workers KV Storage Write" -- both verbatim on the page; the Write form is used here).
      - purpose: ReadNamespace
        name: Workers KV Storage Read
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Read-side of the same resources -- refresh/import the namespace via GET /accounts/{account_id}/storage/kv/namespaces/{namespace_id} (derived from the modules' API surface).
