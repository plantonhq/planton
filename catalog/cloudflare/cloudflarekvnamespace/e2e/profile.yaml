apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarekvnamespace
spec:
  # A Workers KV namespace under live E2E: account-scoped, no prerequisites --
  # deploy -> GET accounts/{account_id}/storage/kv/namespaces/{namespace_id}
  # verify -> destroy -> verify-destroyed on both provisioners. The minimal
  # scenario creates one namespace with a run-scoped title (titles are unique
  # within an account, so concurrent lanes must not collide). The spec surface
  # is title + account only, so the single scenario covers the whole kind;
  # entries are seeded through CloudflareWorkersKvPair, whose lane installs
  # THIS kind's e2e/prerequisite.yaml as its fixture. Objects create in
  # seconds at zero cost (Workers Free includes KV).
  tier: 1
  # Proven live 2026-08-26: both engines ran minimal through the full
  # lifecycle (deploy -> REST-API verify -> destroy -> verify-absent) with
  # the apply-idempotency re-plan green, plus the blind import round-trip
  # ({account_id}/{namespace_id}) on the Terraform lane -- all first-run.
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
