syntax = "proto3";

package dev.planton.cloudflare.cloudflareloadbalancerpool.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflareloadbalancerpool/v1alpha1/outputs.proto";
import "catalog/cloudflare/cloudflareloadbalancerpool/v1alpha1/spec.proto";
import "shared/metadata.proto";

// cloudflare-load-balancer-pool
message CloudflareLoadBalancerPool {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareLoadBalancerPool'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  CloudflareLoadBalancerPoolSpec spec = 4 [(buf.validate.field).required = true];

  //status
  CloudflareLoadBalancerPoolStatus status = 5;
}

// cloudflare-load-balancer-pool status
message CloudflareLoadBalancerPoolStatus {
  //outputs
  //  cloudflare-load-balancer-pool outputs
  CloudflareLoadBalancerPoolOutputs outputs = 1;
}
