# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: cloudflareloadbalancerpool
spec:
  billing_model: free
  free_tier: A pool is a configuration object inside Cloudflare Load Balancing -- no Cloudflare page prices pools, and nothing on this spec (origins, monitor reference, check regions, steering, shedding, notification filters) can express a charge of its own. Creating, holding, or reusing one across many load balancers costs nothing.
  notes: "The real spend lives in the product this object presupposes: \"Load balancing is an add-on for your account\" that requires a billing profile, where you \"Choose your plan options and confirm payment\" (https://developers.cloudflare.com/load-balancing/get-started/enable-load-balancing/, retrieved 2026-08-22). The plan options chosen at purchase set the account's origin and health-check entitlements, so the size of the origins list rides that subscription -- which this catalog carries on the CloudflareLoadBalancer kind's hybrid cost profile; Cloudflare publishes no dollar figures for the add-on in its docs. The origin servers named in origins bill as their own infrastructure (their own catalog kinds when composed by reference), and health-check probes from the referenced monitor land on them as ordinary requests. Applying this resource on an account without the add-on fails the apply rather than incurring cost."
