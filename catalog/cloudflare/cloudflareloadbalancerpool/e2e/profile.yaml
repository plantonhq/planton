apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflareloadbalancerpool
spec:
  # A load-balancer pool under live E2E: account-scoped -- deploy -> GET
  # accounts/{account_id}/load_balancers/pools/{id} verify -> destroy ->
  # verify-destroyed on both provisioners. Two scenarios: `minimal` (one
  # TEST-NET origin, no monitor -- origins without a monitor are always
  # considered healthy) and `monitored` (the optional monitor FK, via a
  # scenario-declared CloudflareLoadBalancerMonitor edge). The existing
  # e2e/prerequisite.yaml is the load balancer's registry-prerequisite
  # fixture and is not rewritten here. Pool names are unique per account, so
  # both carry the run id. Entitlement gate: the Load Balancing paid add-on
  # (the same gate already on the load-balancer proof group). Objects create
  # in seconds.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
  cost_class: cheap_ephemeral
