# Monitored CloudflareLoadBalancerPool scenario: one globally-routable origin
# plus the optional monitor FK, resolved from a SCENARIO-declared
# CloudflareLoadBalancerMonitor prerequisite (a pool does not require a
# monitor, so the edge is per-scenario, never registry). The origin is
# Cloudflare's own resolver address: once a monitor is attached, Cloudflare
# rejects non-routable origins with 400 code 1002 "Origin address is invalid
# or is not globally routable and has health monitoring enabled" (measured
# live 2026-08-28) -- TEST-NET is legal ONLY on unmonitored pools. Requires
# the Load Balancing add-on.
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareLoadBalancerPool
metadata:
  name: planton-oss-e2e-cloudflareloadbalancerpool-monitored
  id: planton-oss-e2e-cloudflareloadbalancerpool-monitored
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: cloudflareloadbalancerpool
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: CloudflareLoadBalancerMonitor
  tags:
    - planton-e2e
spec:
  accountId: ${E2E_ENV:PLANTON_E2E_CLOUDFLARE_ACCOUNT_ID}
  name: planton-e2e-pmon-${E2E_RUN_ID}
  origins:
    - name: origin-1
      address:
        value: 1.1.1.1
  monitor:
    valueFrom:
      kind: CloudflareLoadBalancerMonitor
      name: planton-oss-e2e-cloudflareloadbalancermonitor-prereq
      fieldPath: status.outputs.monitor_id
