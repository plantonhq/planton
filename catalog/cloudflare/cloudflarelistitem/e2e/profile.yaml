apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarelistitem
spec:
  # A list item under live E2E: the harness installs the CloudflareList
  # prerequisite first (the kind's registry prerequisite -- an ip-kind
  # list), then deploy -> GET
  # accounts/{account_id}/rules/lists/{list_id}/items/{item_id} verify ->
  # destroy -> verify-destroyed on both provisioners. The live scenario is
  # one TEST-NET CIDR in the fixture list (the cheapest arm of the
  # ip/asn/hostname/redirect oneof). Delete is an async bulk POST the
  # provider never polls; the verifier retries the absent-check. Deliberately
  # not live: a redirect item (the import ID would need URL-encoding of the
  # source_url). Free; objects create in seconds.
  tier: 1
  # Proven live 2026-08-28: both engines ran ip-entry through the full
  # lifecycle over the CloudflareList registry fixture (deploy -> REST-API
  # verify -> destroy -> verify-absent) with the apply-idempotency re-plan
  # green, plus the blind three-segment import round-trip at zero tolerances
  # -- all first-run. The async bulk-delete race the retry guard exists for
  # never fired; fixture teardown was clean.
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
