syntax = "proto3";

package dev.planton.cloudflare.cloudflarelistitem.v1alpha1;

// CloudflareListItemOutputs captures the outputs after writing a list entry.
message CloudflareListItemOutputs {
  // The Cloudflare-assigned identifier of the list item.
  string item_id = 1;

  // The list ID the entry was written to.
  string list_id = 2;
}
