syntax = "proto3";

package dev.planton.cloudflare.cloudflarelistitem.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflarelistitem/v1alpha1/outputs.proto";
import "catalog/cloudflare/cloudflarelistitem/v1alpha1/spec.proto";
import "shared/metadata.proto";

// cloudflare-list-item
message CloudflareListItem {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareListItem'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  CloudflareListItemSpec spec = 4 [(buf.validate.field).required = true];

  //status
  CloudflareListItemStatus status = 5;
}

// cloudflare-list-item status
message CloudflareListItemStatus {
  //outputs
  //  cloudflare-list-item outputs
  CloudflareListItemOutputs outputs = 1;
}
