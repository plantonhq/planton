# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
#
# The kind's catalog.md states the requirement in prose ("a Cloudflare
# API token that has Account Filter Lists edit access") -- migrated here
# losslessly; that prose uses the dashboard-name spelling of exactly the
# write grant below.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflarelistitem
spec:
  cloudflare:
    groups:
      - purpose: ManageItem
        name: Account Rule Lists Write
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Covers the Terraform module's single cloudflare_list_item resource and the Pulumi module's matching ListItem resource -- create/update/delete the entry via POST/PUT/DELETE /accounts/{account_id}/rules/lists/{list_id}/items (the reference describes the group as "Grants write access to Account Filter Lists"; its dashboard-name spelling is "Account Filter Lists Edit". Path mapping derived from the module's API surface; neither engine performs secondary lookups). Group names verbatim from the Cloudflare API token permissions reference (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22).
      - purpose: ReadItem
        name: Account Rule Lists Read
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Read-side of the same resources -- refresh/import the entry via GET /accounts/{account_id}/rules/lists/{list_id}/items[/{item_id}].
