apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: cloudflarezerotrustaccessservicetoken
spec:
  # Dual-scope: the documented import ID carries a literal "accounts/" or
  # "zones/" prefix. Live scenarios are account-scoped, so the accounts/ arm
  # is the one recorded here. client_secret never survives import --
  # Cloudflare returns it only at create and rotation.
  values:
    - name: account_id
      derivations:
        - from_spec_field: account_id
      where_to_find: >-
        Cloudflare dashboard -> the account's Overview (Account ID in the
        right-hand API panel), or `GET /accounts` on the Cloudflare v4 API.
    - name: service_token_id
      derivations:
        - from_output: service_token_id
      where_to_find: >-
        Zero Trust dashboard -> Access -> Service Auth -> the token, or
        `GET /accounts/<account_id>/access/service_tokens` on the
        Cloudflare v4 API (the id field of the entry whose name matches).
