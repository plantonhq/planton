syntax = "proto3";

package dev.planton.cloudflare.cloudflarezerotrustaccessservicetoken.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflarezerotrustaccessservicetoken/v1alpha1/outputs.proto";
import "catalog/cloudflare/cloudflarezerotrustaccessservicetoken/v1alpha1/spec.proto";
import "shared/metadata.proto";

// CloudflareZeroTrustAccessServiceToken is a KRM-style resource for managing a
// Cloudflare Access service token: a machine credential (client-ID/client-secret
// pair) that non-human clients present to pass Access-protected applications.
message CloudflareZeroTrustAccessServiceToken {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareZeroTrustAccessServiceToken'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  CloudflareZeroTrustAccessServiceTokenSpec spec = 4 [(buf.validate.field).required = true];

  // status
  CloudflareZeroTrustAccessServiceTokenStatus status = 5;
}

// CloudflareZeroTrustAccessServiceTokenStatus represents the observed state of
// an Access service token.
message CloudflareZeroTrustAccessServiceTokenStatus {
  // outputs from the IaC deployment
  CloudflareZeroTrustAccessServiceTokenOutputs outputs = 1;
}
