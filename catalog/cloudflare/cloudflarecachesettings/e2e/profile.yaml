apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarecachesettings
spec:
  # Cache settings under live E2E: the harness deploys the CloudflareDnsZone
  # prerequisite (a run-scoped pending zone), resolves zone_id, then runs
  # deploy -> settings-surface verify -> destroy -> verify on both
  # provisioners. Destroy classes are MIXED: smart tiered cache and cache
  # variants have real deletes; the other four toggles have literally empty
  # provider Deletes, so verify-destroyed asserts the settings surface still
  # answers -- never absence. Zero-orphan cleanup comes from the run-scoped
  # zone fixture. THE MEASURED ENTITLEMENT MAP (live, 2026-08-27) corrected
  # the authoring free-plan claim: smart_tiered_cache is the family's ONLY
  # free toggle (the free-tiered-cache scenario); cache_variants is Pro+
  # (1135 on Free, exists-on-write on Pro -- live via the env-gated
  # pro-variants-arm scenario on the sanctioned paid zone); and
  # regional_tiered_cache answers 1135 on Free AND Pro (the Enterprise
  # class -- offline arm in e2e/paid-arms-plan.yaml; unblock: an
  # Enterprise-entitled zone via the env-gated form). The PAID-billing
  # toggles never enter a live lane: cache_reserve bills storage while on
  # (and its surface is read-gated 1135 even on Pro), and argo_smart_routing
  # bills monthly plus per-GB AND KEEPS BILLING after destroy (its Delete is
  # a no-op) -- both offline-plan-proven via e2e/paid-arms-plan.yaml and
  # deferred to a budget-approved proof lane. Watch item: create==update
  # semantics differ on tiered_cache only (POST New vs PATCH Edit) -- the
  # idempotency re-plan is the canary. Settings apply in seconds; the live
  # scenarios cost nothing.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
  cost_class: cheap_ephemeral
