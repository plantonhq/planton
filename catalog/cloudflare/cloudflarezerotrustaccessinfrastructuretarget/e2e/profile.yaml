apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarezerotrustaccessinfrastructuretarget
spec:
  # Infrastructure targets under live E2E: account-scoped creates with a
  # real delete and an honest 404. Watch items for the proving session:
  # (1) the provider ships ZERO acceptance tests for this resource -- our
  # lane is its first real-world exercise anywhere, so expect the
  # unexpected and record everything; (2) targets belong to the Access
  # family, which needs the account's Zero Trust organization (team name)
  # to exist -- a Phase-2 account-setup fact, not an entitlement gate;
  # (3) the isolated-vnet scenario declares its own virtual network via
  # the scenario-prerequisite channel -- collision-free by construction.
  tier: 1
  cost_class: cheap_ephemeral
  status: green
  # LIVE-PROVEN 2026-08-26: minimal (default vnet) + isolated-vnet (own
  # vnet fixture) on both engines, full lifecycle, ALL FIRST-RUN -- the
  # provider's first real-world exercise of this resource anywhere ran
  # clean, and both blind import round-trips passed at ZERO declared
  # tolerances. Deleted targets 404 honestly.
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
