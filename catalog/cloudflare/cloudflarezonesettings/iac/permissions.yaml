# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
#
# UNRESOLVED: origin cloud region mappings
# (PUT/GET/DELETE /zones/{zone_id}/origin/cloud_regions/{origin_ip}, the
# cloudflare_origin_cloud_region rows -- the Terraform module's per-row
# cloudflare_origin_cloud_region resources and the Pulumi module's matching
# OriginCloudRegion resources). Cloudflare publishes NO "Accepted
# Permissions" section on any of this endpoint's reference pages, and the
# general permissions reference lists no matching group, so the required
# group cannot be stated without guessing. The live capture lane is the
# honest path to resolving it.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflarezonesettings
spec:
  cloudflare:
    groups:
      - purpose: ManageZoneSettings
        name: Zone Settings Write
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: The per-setting fan-out via PATCH /zones/{zone_id}/settings/{setting_id} (named by https://developers.cloudflare.com/api/resources/zones/subresources/settings/methods/edit/, retrieved 2026-08-22). Covers the Terraform module's per-setting cloudflare_zone_setting fan-out and the Pulumi module's matching ZoneSetting resources; neither engine performs secondary lookups. Group name verbatim from the Cloudflare API token permissions reference (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22).
      - purpose: ReadZoneSettings
        name: Zone Settings Read
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: Refresh each managed setting via GET /zones/{zone_id}/settings/{setting_id} (named by the matching get endpoint reference, retrieved 2026-08-22).
      - purpose: ManageManagedHeaders
        name: Managed headers Write
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: Managed transforms via PUT /zones/{zone_id}/managed_headers and URL normalization via PUT /zones/{zone_id}/url_normalization. Both endpoints accept any one of a shared set of ruleset-phase groups; this single group covers both (named by https://developers.cloudflare.com/api/resources/managed_transforms/methods/edit/ and https://developers.cloudflare.com/api/resources/url_normalization/methods/update/, retrieved 2026-08-22). Covers the Terraform module's conditional cloudflare_managed_transforms and cloudflare_url_normalization_settings singletons and the Pulumi module's matching ManagedTransforms and UrlNormalizationSettings resources.
      - purpose: ReadManagedHeaders
        name: Managed headers Read
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: Refresh both surfaces via GET on the same paths (named by the matching list/get endpoint references, retrieved 2026-08-22).
      - purpose: ManageWaitingRoomSettings
        name: Waiting Rooms Write
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: The waiting-room crawler-bypass singleton via PATCH /zones/{zone_id}/waiting_rooms/settings (named by https://developers.cloudflare.com/api/resources/waiting_rooms/subresources/settings/methods/edit/, retrieved 2026-08-22). Covers the Terraform module's conditional cloudflare_waiting_room_settings singleton and the Pulumi module's matching WaitingRoomSettings resource.
      - purpose: ReadWaitingRoomSettings
        name: Waiting Rooms Read
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: Refresh the singleton via GET on the same path (named by the matching get endpoint reference, retrieved 2026-08-22).
