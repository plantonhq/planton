syntax = "proto3";

package dev.planton.cloudflare.cloudflarezerotrustlist.v1alpha1;

import "catalog/cloudflare/cloudflarezerotrustlist/v1alpha1/api.proto";
import "catalog/cloudflare/provider.proto";

// CloudflareZeroTrustListIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message CloudflareZeroTrustListIacInput {
  // target infra-component to be deployed
  CloudflareZeroTrustList target = 1;
  // provider-config for Cloudflare authentication
  dev.planton.cloudflare.CloudflareProviderConfig provider_config = 2;
}
