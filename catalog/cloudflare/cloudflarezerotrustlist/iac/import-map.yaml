apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: cloudflarezerotrustlist
spec:
  # Account-scoped by API design: the import ID is the bare two-segment
  # "{account_id}/{list_id}". account_id is spec-relative; list_id is the
  # deploy's own output.
  values:
    - name: account_id
      derivations:
        - from_spec_field: account_id
      where_to_find: >-
        Cloudflare dashboard -> the account's Overview (Account ID in the
        right-hand API panel), or `GET /accounts` on the Cloudflare v4 API.
    - name: list_id
      derivations:
        - from_output: list_id
      where_to_find: >-
        Zero Trust dashboard -> My Team -> Lists -> the list, or
        `GET /accounts/<account_id>/gateway/lists` on the Cloudflare v4
        API (the id field of the entry whose name matches).
