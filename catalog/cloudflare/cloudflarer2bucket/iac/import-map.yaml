apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: cloudflarer2bucket
spec:
  # The bucket imports as {account_id}/{bucket_name}/{jurisdiction} --
  # strictly positional THREE segments (the provider's parser rejects two),
  # so a default-jurisdiction bucket uses the literal "default" as its third
  # segment. The six bucket-scoped companions (cors, lifecycle, lock, event
  # notifications, custom and managed domains) ship no importer at v5.23.0
  # (see the provider catalog's notes rows) -- a blind round-trip re-asserts
  # them from configuration using these same placeholders. account_id and
  # jurisdiction are spec-relative; the bucket's identity IS its name (R2
  # has no separate id), so bucket_name comes from the deploy's outputs.
  values:
    - name: account_id
      derivations:
        - from_spec_field: account_id
      where_to_find: >-
        Cloudflare dashboard -> the account's Overview (Account ID in the
        right-hand API panel), or `GET /accounts` on the Cloudflare v4 API.
    - name: bucket_name
      derivations:
        - from_output: bucket_name
      where_to_find: >-
        Cloudflare dashboard -> R2 Object Storage (the bucket list), or
        `GET /accounts/<account_id>/r2/buckets` on the Cloudflare v4 API (the
        name field).
    - name: jurisdiction
      # Ordered derivations: an empty spec field falls through to the literal
      # "default" -- the provider's parser demands all three segments, so a
      # default-jurisdiction bucket (the spec's unset case) must still render
      # a third segment.
      derivations:
        - from_spec_field: jurisdiction
        - literal: "default"
      where_to_find: >-
        The spec's jurisdiction field ("default", "eu", or "fedramp"). When
        the spec leaves it empty, use the literal "default" -- the import ID
        always needs all three segments. The dashboard shows the jurisdiction
        on the bucket's settings page; the API carries it as the
        cf-r2-jurisdiction header on every R2 call.
