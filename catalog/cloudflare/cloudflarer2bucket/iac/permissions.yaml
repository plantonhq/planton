# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
#
# HONEST UNKNOWNS: (1) custom-domain attachment operates through the R2 API
# but connects a hostname in a Cloudflare zone on the same account -- whether
# Cloudflare additionally requires a zone-scoped permission (e.g. DNS Write
# on the target zone) for that call is not stated on the permissions
# reference page; the live capture lane should settle it. (2) Event
# notifications target a queue by ID; whether the R2 group alone authorizes
# the subscription or a Queues-scoped permission is also checked is likewise
# unstated. Both entries stay derived until proven. The component catalog.md
# says only that the token needs "R2 permissions" -- no more specific prose
# existed to migrate.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflarer2bucket
spec:
  cloudflare:
    groups:
      - purpose: ManageBucket
        name: Workers R2 Storage Write
        scope: com.cloudflare.api.account
        provenance: derived
        notes: "Covers the Terraform module's cloudflare_r2_bucket, cloudflare_r2_managed_domain, cloudflare_r2_custom_domain, cloudflare_r2_bucket_cors, cloudflare_r2_bucket_lifecycle, cloudflare_r2_bucket_lock, and cloudflare_r2_bucket_event_notification resources, mirrored by the Pulumi module -- the modules drive seven bucket-scoped resources, all under the account R2 API at /accounts/{account_id}/r2/buckets...: the bucket itself (create/delete), the managed r2.dev public domain (.../domains/managed), custom domains (.../domains/custom[/{domain}]), CORS (.../cors), lifecycle (.../lifecycle), object lock (.../lock), and event notifications (.../event_notifications/configuration/queues/{queue_id}) (derived from the modules' API surface; neither engine performs secondary lookups or data-source reads). Group name verbatim from the Cloudflare API token permissions reference (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22; the page lists this account-scoped group in two naming variants -- \"Workers R2 Storage Edit\" and \"Workers R2 Storage Write\" -- both verbatim on the page; the Write form is used here)."
      - purpose: ReadBucket
        name: Workers R2 Storage Read
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Read-side of the same resources -- refresh/import the bucket and its sub-resources via GET on the same paths (derived from the modules' API surface).
