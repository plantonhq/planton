apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarer2bucket
spec:
  # An R2 bucket under live E2E: account-scoped -- deploy -> GET
  # accounts/{account_id}/r2/buckets/{bucket_name} verify -> destroy ->
  # verify-destroyed on both provisioners. Three scenarios: `minimal` (a
  # private bucket, default jurisdiction), `data-governance` (CORS + object
  # lifecycle + object lock -- the three bucket-scoped policy resources,
  # self-contained), and `event-notification` (object events delivered to a
  # queue; the queue fixture is scenario-declared via
  # planton.dev/e2e-prerequisites because a bucket does not require one).
  # Bucket names are unique within an account, so all three carry the run id.
  # No scenario ever writes an object, so destroy stays clean: R2 refuses to
  # delete a non-empty bucket (upstream API behavior; the provider does no
  # draining). Deliberately not live: custom domains (need a zone, and
  # whether a PENDING undelegated zone can serve one is unverified offline)
  # and the managed r2.dev public domain (the provider's Read AND Delete for
  # it are empty -- it stays in the API until manually removed, an orphan
  # class this lane refuses to create); both are proven by a real offline
  # plan at e2e/domains-plan.yaml. Entitlement gates: R2 must be enabled on
  # the account (requires a payment method on file even at the free tier),
  # and the event-notification arm rides the Queues entitlement (see the
  # queue kind's profile). Objects create in seconds at zero cost.
  tier: 1
  # Proven live 2026-08-26: both engines ran minimal + data-governance +
  # event-notification through the full lifecycle with the apply-idempotency
  # re-plan green; blind import round-trips passed on minimal and
  # data-governance -- the three-segment {account_id}/{bucket_name}/
  # {jurisdiction} ID composed with the literal "default" fallback, and the
  # cors/lifecycle/lock re-creates converged as idempotent PUTs. First
  # contact taught two walls: notification rule filters echo "" for unset
  # (both engines now send the empty strings), and the notification config
  # is NOT re-creatable while live (PUT merges rules; 400/11020) nor deleted
  # with its bucket (a dangling config blocks queue deletion with 11017) --
  # the event-notification scenario carries the reason-carrying
  # import-roundtrip-skip and the GUIDE teaches both lifecycle walls.
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
