# Event-notification CloudflareR2Bucket scenario: object events (uploads and
# deletions under events/) delivered to a Cloudflare Queue. The queue is a
# SCENARIO-declared prerequisite (planton.dev/e2e-prerequisites), not a
# registry one, because a bucket does not require a queue -- only this arm
# does. The reference resolves against the queue kind's install fixture. The
# name carries the run id (bucket names are unique within an account).
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareR2Bucket
metadata:
  name: planton-oss-e2e-cloudflarer2bucket-event-notification
  id: planton-oss-e2e-cloudflarer2bucket-event-notification
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: cloudflarer2bucket
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: CloudflareQueue
    # The notification STRUCTURALLY cannot round-trip: the upstream resource
    # ships no ImportState at v5.23.0, and the re-create path the runner
    # tolerates for not-importable types is refused while the live config
    # exists -- the per-queue PUT MERGES rules instead of replacing them, so
    # re-putting the identical rule answers 400 code 11020 "rules have
    # invalid overlap" (measured 2026-08-26). The bucket's own importer is
    # proven by the minimal and data-governance scenarios.
    planton.dev/e2e-import-roundtrip-skip: >-
      cloudflare_r2_bucket_event_notification has no upstream importer and
      its tolerated re-create is refused while the live config exists (the
      per-queue PUT merges rules, so an identical re-put answers 400 code
      11020 "rules have invalid overlap"; measured 2026-08-26) -- the
      notification cannot round-trip on any recipe; the bucket importer is
      proven by the minimal and data-governance scenarios.
  tags:
    - planton-e2e
spec:
  bucketName: planton-e2e-${E2E_RUN_ID}-r2-evt
  accountId: ${E2E_ENV:PLANTON_E2E_CLOUDFLARE_ACCOUNT_ID}
  eventNotifications:
    - queue:
        valueFrom:
          kind: CloudflareQueue
          name: planton-oss-e2e-cloudflarequeue-prereq
          fieldPath: status.outputs.queue_id
      rules:
        - actions:
            - PutObject
            - DeleteObject
          description: planton-e2e object events
          prefix: events/
