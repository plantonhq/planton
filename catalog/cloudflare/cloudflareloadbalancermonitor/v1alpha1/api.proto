syntax = "proto3";

package dev.planton.cloudflare.cloudflareloadbalancermonitor.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflareloadbalancermonitor/v1alpha1/outputs.proto";
import "catalog/cloudflare/cloudflareloadbalancermonitor/v1alpha1/spec.proto";
import "shared/metadata.proto";

// cloudflare-load-balancer-monitor
message CloudflareLoadBalancerMonitor {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareLoadBalancerMonitor'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  CloudflareLoadBalancerMonitorSpec spec = 4 [(buf.validate.field).required = true];

  //status
  CloudflareLoadBalancerMonitorStatus status = 5;
}

// cloudflare-load-balancer-monitor status
message CloudflareLoadBalancerMonitorStatus {
  //outputs
  //  cloudflare-load-balancer-monitor outputs
  CloudflareLoadBalancerMonitorOutputs outputs = 1;
}
