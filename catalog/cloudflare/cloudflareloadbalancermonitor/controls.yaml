# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflareloadbalancermonitor
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The monitor stores probe configuration in Cloudflare's control plane -- no customer data store exists here to encrypt.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to key (see enc-at-rest).
    - control_id: enc-in-transit
      status: configurable
      field_path: allow_insecure
      evidence:
        type: spec_default
        reference: For https monitors the probe connection is TLS by definition, and allow_insecure (default false) is the one switch that weakens it -- when true, Cloudflare skips TLS certificate validation while probing. The type field itself chooses whether probes are encrypted at all (https vs http/tcp/icmp).
      notes: "Neither preset sets allow_insecure; the spec comment says \"use with care\". Encryption of the traffic the load balancer actually serves is the zone's and origins' posture, not the probe's."
    - control_id: no-public-access
      status: not_applicable
      notes: The monitor exposes no endpoint -- it originates probes from Cloudflare toward pool origins. Origin reachability is the pool's posture (see that kind's profile).
    - control_id: restricted-ingress
      status: not_applicable
      notes: No inbound surface of its own to filter. Origins that firewall probe sources manage that on their own network edge.
    - control_id: edge-protection
      status: not_applicable
      notes: The monitor serves no client traffic; web application firewalls have nothing to attach to.
    - control_id: rbac
      status: not_applicable
      notes: Management is Cloudflare account-membership and API-token posture; the monitor exposes no data plane of its own to govern.
    - control_id: workload-identity
      status: not_applicable
      notes: The monitor holds no credentials. Probe headers can carry a Host override, not secrets -- anything placed there is plain configuration.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication path of its own. Prefer a scoped API token over the legacy Global API Key when provisioning.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Cloudflare records monitor changes in the account audit log unconditionally -- not a property this component configures.
    - control_id: monitoring-integration
      status: configurable
      field_path: type
      evidence:
        type: spec_default
        reference: The monitor IS the health-monitoring surface of Cloudflare Load Balancing -- type selects the probe protocol (http/https/tcp/udp_icmp/icmp_ping/smtp), and path, expected_codes, expected_body, interval, timeout, retries, consecutive_up and consecutive_down define what healthy means and how fast state flips. Its verdicts drive pool failover and Cloudflare's health notifications.
      notes: Both presets configure real probes (an https /healthz check and a tcp port 5432 check). Where notifications go is the pool's notification_filter and the account's notification policies, outside this spec.
    - control_id: backup-recovery
      status: not_applicable
      notes: Declarative configuration, fully re-creatable from the manifest -- there is no data to back up.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Probes are executed by Cloudflare's global infrastructure; WHERE they run from is chosen on the pool (check_regions), not on the monitor. There is no placement to configure here.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Cloudflare nor the modules expose a deletion-protection flag. Destroy is a real delete -- pools still referencing the monitor lose their health checking.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The probing infrastructure is fully Cloudflare-operated -- the component only configures it; no customer-visible patch surface exists.
