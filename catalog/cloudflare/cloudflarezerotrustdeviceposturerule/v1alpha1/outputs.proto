syntax = "proto3";

package dev.planton.cloudflare.cloudflarezerotrustdeviceposturerule.v1alpha1;

// CloudflareZeroTrustDevicePostureRuleOutputs captures the observable
// outputs after creating the posture rule.
message CloudflareZeroTrustDevicePostureRuleOutputs {
  // The Cloudflare-assigned UUID of the rule (what Access and Gateway
  // policies reference).
  string rule_id = 1;
}
