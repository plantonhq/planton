# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflarezerotrustdeviceposturerule
spec:
  controls:
    - control_id: enc-at-rest
      status: configurable
      field_path: input.require_all
      evidence:
        type: spec_default
        reference: The disk_encryption check type (input.require_all / input.check_disks) is itself the control that ENFORCES encryption-at-rest on devices -- the rule stores no data of its own.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No storage surface.
    - control_id: enc-in-transit
      status: not_applicable
      notes: A check definition; posture results travel inside the WARP client's encrypted channel.
    - control_id: no-public-access
      status: not_applicable
      notes: A configuration surface; nothing is exposed publicly.
    - control_id: restricted-ingress
      status: not_applicable
      notes: Gating decisions belong to the Access/Gateway policies that consume the rule.
    - control_id: edge-protection
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The posture API runs on Cloudflare's anycast edge with its standard DDoS posture.
    - control_id: rbac
      status: not_applicable
      notes: Who may change rules is Cloudflare account-membership posture; enforcement lives in the consuming policies.
    - control_id: workload-identity
      status: configurable
      field_path: input.certificate_id
      evidence:
        type: spec_default
        reference: The client_certificate_v2 check (certificate_id, check_private_key, extended_key_usage, locations) verifies device identity cryptographically before policies admit it.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No user-auth surface of its own.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Rule changes land in the Cloudflare account audit log.
    - control_id: monitoring-integration
      status: not_applicable
      notes: No metrics surface of its own; per-device posture results surface in the Zero Trust dashboard.
    - control_id: backup-recovery
      status: not_applicable
      notes: Configuration-only surface, reproducible from the manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No stored data.
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The posture control plane is Cloudflare-operated SaaS on its global network; there is no zonal placement to configure.
    - control_id: deletion-protection
      status: not_applicable
      notes: No provider-side deletion guard; deleting a rule a policy still requires changes that policy's behavior (see GUIDE.md's delete-consumers-first discipline).
    - control_id: managed-patching
      status: not_applicable
      notes: SaaS control plane -- Cloudflare operates it.
