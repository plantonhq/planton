apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: cloudflarezerotrustdeviceposturerule
spec:
  values:
    - name: account_id
      derivations:
        - from_spec_field: account_id
      where_to_find: >-
        Cloudflare dashboard -> the account home (Account ID in the
        right-hand panel), or `GET /accounts` on the Cloudflare v4 API (the
        id field).
    - name: rule_id
      derivations:
        - from_output: rule_id
      where_to_find: >-
        `GET /accounts/<account_id>/devices/posture` on the Cloudflare v4
        API (the id field; match by name), or the Zero Trust dashboard ->
        Settings -> WARP Client -> Device posture checks.
