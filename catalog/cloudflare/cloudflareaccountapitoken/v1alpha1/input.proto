syntax = "proto3";

package dev.planton.cloudflare.cloudflareaccountapitoken.v1alpha1;

import "catalog/cloudflare/cloudflareaccountapitoken/v1alpha1/api.proto";
import "catalog/cloudflare/provider.proto";

// CloudflareAccountApiTokenIacInput is the input to the IaC module. It
// contains the target resource and provider configuration.
message CloudflareAccountApiTokenIacInput {
  // target infra-component to be deployed
  CloudflareAccountApiToken target = 1;
  // provider-config for Cloudflare authentication
  dev.planton.cloudflare.CloudflareProviderConfig provider_config = 2;
}
