# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
#
# Provenance note: the account-scoped "Account API Tokens Write/Read"
# groups are absent from the docs-site permissions reference page but are
# defined in Cloudflare's own permission-group inventory (the API behind
# this catalog's inventory snapshot) and named verbatim by the account
# token endpoints' Accepted Permissions -- the docs page is the incomplete
# surface, not the provider. Cloudflare's account-owned-tokens fundamentals
# page additionally notes that creating one from the DASHBOARD requires
# Super Administrator; the API-token grant vocabulary is what this manifest
# declares.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflareaccountapitoken
spec:
  cloudflare:
    groups:
      - purpose: ManageAccountTokens
        name: Account API Tokens Write
        scope: com.cloudflare.api.account
        provenance: derived
        notes: "Covers the Terraform module's single cloudflare_account_token resource and the Pulumi module's matching AccountToken resource (neither engine performs secondary lookups) -- create/update/delete the account-owned token via POST/PATCH/DELETE /accounts/{account_id}/tokens[/{token_id}]. Named verbatim by the create endpoint's Accepted Permissions (https://developers.cloudflare.com/api/resources/accounts/subresources/tokens/methods/create/, retrieved 2026-08-22)."
      - purpose: ReadAccountTokens
        name: Account API Tokens Read
        scope: com.cloudflare.api.account
        provenance: derived
        notes: "Read-side of the same resource -- refresh/import the token via GET /accounts/{account_id}/tokens/{token_id}. Verified present at account scope in Cloudflare's own permission-group inventory (retrieved 2026-08-22)."
