apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: cloudflareaccountapitoken
spec:
  values:
    - name: account_id
      derivations:
        - from_spec_field: account_id
      where_to_find: >-
        Cloudflare dashboard -> the account home (Account ID in the
        right-hand panel), or `GET /accounts` on the Cloudflare v4 API (the
        id field).
    - name: token_id
      derivations:
        - from_output: token_id
      where_to_find: >-
        `GET /accounts/<account_id>/tokens` on the Cloudflare v4 API (the id
        field; match by name), or the dashboard -> the account -> API Tokens.
        Importing recovers the token's CONFIGURATION only -- its secret value
        is never re-fetchable, so a token whose value was lost should be
        rotated rather than imported.
