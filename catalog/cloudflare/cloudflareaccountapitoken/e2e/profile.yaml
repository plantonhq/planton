apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflareaccountapitoken
spec:
  # Account API tokens under live E2E: plain CRUD objects (real create,
  # update, delete), account-scoped, free -- self-cleaning lanes.
  # MEASURED (live, 2026-08-27): both arms (whole-resource grant; nested
  # sub-resources + request-IP condition + expiry) passed all phases on
  # both engines first-run. The harness token's "Account API Tokens Write"
  # sufficed for the full lifecycle; the permission-group UUID enters by
  # env (one-line fetch:
  # GET /accounts/{account_id}/tokens/permission_groups?name=DNS%20Read).
  # Cloudflare's canonical re-ordering of policies/permission groups never
  # surfaced a diff: the idempotency re-plans came back clean and both
  # blind import round-trips converged at ZERO tolerances -- the provider's
  # order-matching machinery and upstream's ImportStateVerifyIgnore
  # "policies" hint both proved unnecessary for single-policy shapes. The
  # secret value reached the outputs map without landing in logs.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
