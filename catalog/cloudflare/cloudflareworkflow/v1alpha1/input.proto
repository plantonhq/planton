syntax = "proto3";

package dev.planton.cloudflare.cloudflareworkflow.v1alpha1;

import "catalog/cloudflare/cloudflareworkflow/v1alpha1/api.proto";
import "catalog/cloudflare/provider.proto";

// CloudflareWorkflowIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message CloudflareWorkflowIacInput {
  // the catalog object to deploy to be deployed
  CloudflareWorkflow target = 1;
  // provider-config for Cloudflare authentication
  dev.planton.cloudflare.CloudflareProviderConfig provider_config = 2;
}
