syntax = "proto3";

package dev.planton.cloudflare.cloudflareworkflow.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflareworkflow/v1alpha1/outputs.proto";
import "catalog/cloudflare/cloudflareworkflow/v1alpha1/spec.proto";
import "shared/metadata.proto";

// CloudflareWorkflow is a KRM-style resource for managing one Workflow
// registration: the binding of a durable-execution class exported by a
// Worker script to a named workflow in the account.
message CloudflareWorkflow {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareWorkflow'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  CloudflareWorkflowSpec spec = 4 [(buf.validate.field).required = true];

  // status
  CloudflareWorkflowStatus status = 5;
}

// CloudflareWorkflowStatus represents the observed state of the workflow
// registration.
message CloudflareWorkflowStatus {
  // outputs from the IaC deployment
  CloudflareWorkflowOutputs outputs = 1;
}
