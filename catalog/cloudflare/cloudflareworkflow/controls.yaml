# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflareworkflow
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Workflow instance state and step results are stored by the Workers platform's managed storage, encrypted at rest by Cloudflare.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No customer-managed key surface on the Workers platform's storage.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Management traffic to the Cloudflare API and the engine's internal traffic are TLS unconditionally.
    - control_id: no-public-access
      status: not_applicable
      notes: A workflow registration has no public surface -- instances run inside the Workers platform; any exposure comes from the Worker script, which carries its own profile.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No ingress surface of its own.
    - control_id: edge-protection
      status: not_applicable
      notes: A durable-execution registration, not an edge-protection policy.
    - control_id: rbac
      status: not_applicable
      notes: Management access is Cloudflare account-membership posture; instance creation is governed by the owning Worker's own access controls.
    - control_id: workload-identity
      status: not_applicable
      notes: Instances execute AS the owning Worker script -- identity lives on the CloudflareWorker, not the registration.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication path of its own. Prefer a scoped API token with Account Workers Scripts Edit.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Cloudflare records workflow create/update/delete in the account audit log unconditionally -- not a property this component configures.
    - control_id: monitoring-integration
      status: not_applicable
      notes: Instance observability rides the owning Worker's observability settings; the registration has no metrics surface of its own.
    - control_id: backup-recovery
      status: configurable
      field_path: default_retention
      evidence:
        type: spec_default
        reference: default_retention decides how long finished instances (and their step results) stay queryable -- the platform's own recovery window for post-hoc inspection.
      notes: Unset keeps Cloudflare's defaults. Retention is queryability, not a restorable backup -- workflow definitions re-create from the manifest.
    - control_id: backup-retention-policy
      status: configurable
      field_path: default_retention
      evidence:
        type: spec_default
        reference: error_retention / success_retention are literal retention policies over finished instances.
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The Workflows engine runs on Cloudflare's global Workers platform; durability across failures is the product's core promise.
    - control_id: deletion-protection
      status: not_applicable
      notes: Destroy is a real delete (the API tombstones with is_deleted). Running instances are not awaited -- drain triggers first when an orderly stop matters.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed engine -- Cloudflare operates the platform; the customer owns only the workflow code inside the Worker script.
