# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflarelist
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A list is a named container for rule-expression values (IPs, ASNs, hostnames, redirects) held in Cloudflare's control plane -- no customer data store exists here to encrypt.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to key (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: The list terminates no connections; it is referenced by name inside rule expressions evaluated at Cloudflare's edge.
    - control_id: no-public-access
      status: not_applicable
      notes: The list exposes no endpoint. It is readable and writable only through the account's management plane.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No ingress surface of its own. An ip-kind list often IS the source-restriction data for zone rules, but the filtering happens in the rulesets that reference it -- their posture, not this container's.
    - control_id: edge-protection
      status: not_applicable
      notes: The list holds match values; the WAF custom rules and redirect rulesets that consume it do the request filtering. Nothing on this four-field spec attaches protection by itself.
    - control_id: rbac
      status: not_applicable
      notes: Management is Cloudflare account-membership and API-token posture; the list exposes no data plane of its own to govern.
    - control_id: workload-identity
      status: not_applicable
      notes: The component holds no credentials.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication path of its own. Prefer a scoped API token over the legacy Global API Key when provisioning.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Cloudflare records list changes in the account audit log unconditionally -- not a property this component configures.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The spec exposes no monitoring surface; rule-match analytics belong to the consuming rulesets and zones.
    - control_id: backup-recovery
      status: not_applicable
      notes: Declarative configuration, fully re-creatable from the manifest; entries re-apply with their own CloudflareListItem manifests.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Lists are account-level objects replicated across Cloudflare's global network as provider behavior; there is no zonal placement to configure.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Cloudflare nor the modules expose a deletion-protection flag. Cloudflare does refuse to delete a list still referenced by rule expressions -- a dependency guard of the provider, not a configurable protection. Note kind and name are immutable, so changing either replaces the list.
    - control_id: managed-patching
      status: not_applicable
      notes: A pure configuration container with no software of its own to patch; the rule engine evaluating it is Cloudflare-operated.
