# CloudflareList install profile used as a prerequisite by CloudflareListItem
# (its registry prerequisite): an item is written into a list, so the list
# must exist before the item's lane deploys. Kind is ip (the cheapest item
# arm). The name is underscored and run-scoped (list names are unique within
# an account and CEL-constrained to letters/digits/underscores -- the
# hyphenated engine suffix on E2E_RUN_ID would fail CEL, so this uses
# E2E_RUN_ID_UNDERSCORE). metadata.name
# stays stable -- it is the key consumers' valueFrom references resolve against.
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareList
metadata:
  name: planton-oss-e2e-cloudflarelist-prereq
  id: planton-oss-e2e-cloudflarelist-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: cloudflarelist
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  accountId: ${E2E_ENV:PLANTON_E2E_CLOUDFLARE_ACCOUNT_ID}
  kind: ip
  name: plante2eprereq_${E2E_RUN_ID_UNDERSCORE}
