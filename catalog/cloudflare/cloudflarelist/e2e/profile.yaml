apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarelist
spec:
  # A Cloudflare List under live E2E: account-scoped, no catalog
  # prerequisites -- deploy -> GET accounts/{account_id}/rules/lists/{id}
  # verify -> destroy -> verify-destroyed on both provisioners. Two
  # scenarios: `ip-minimal` (an empty IP list) and `redirect` (an empty
  # bulk-redirect list). Inline `items` is deliberately unmodeled -- entries
  # live on the CloudflareListItem kind; the provider forbids mixing the
  # two. List names are unique within an account and CEL-constrained to
  # letters/digits/underscores (no hyphens), so both names are underscored
  # and carry the run id. Free; objects create in seconds.
  tier: 1
  # Proven live 2026-08-28: both engines ran ip-minimal + redirect through the
  # full lifecycle (deploy -> REST-API verify -> destroy -> verify-absent)
  # with the apply-idempotency re-plan green, plus blind import round-trips
  # on both Terraform scenarios at zero tolerances -- all first-run.
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
