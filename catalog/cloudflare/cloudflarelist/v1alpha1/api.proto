syntax = "proto3";

package dev.planton.cloudflare.cloudflarelist.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflarelist/v1alpha1/outputs.proto";
import "catalog/cloudflare/cloudflarelist/v1alpha1/spec.proto";
import "shared/metadata.proto";

// cloudflare-list
message CloudflareList {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareList'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  CloudflareListSpec spec = 4 [(buf.validate.field).required = true];

  //status
  CloudflareListStatus status = 5;
}

// cloudflare-list status
message CloudflareListStatus {
  //outputs
  //  cloudflare-list outputs
  CloudflareListOutputs outputs = 1;
}
