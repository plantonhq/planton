apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: cloudflareauthenticatedoriginpulls
spec:
  values:
    - name: zone_id
      derivations:
        - from_output: zone_id
      where_to_find: >-
        Cloudflare dashboard -> the zone's Overview page (Zone ID in the
        right-hand API panel), or `GET /zones?name=<domain>` on the
        Cloudflare v4 API (the id field).
    - name: hostname
      derivations:
        # The module fans out one cloudflare_authenticated_origin_pulls per
        # association row, keyed by the row's hostname (unique per zone) --
        # the enumerated address's instance key IS the hostname segment.
        - from_address_key: true
      where_to_find: >-
        The hostname the association covers -- one import per association
        row. `GET /zones/<zone_id>/origin_tls_client_auth/hostnames` on the
        Cloudflare v4 API lists the zone's associations. The zone-wide
        toggle imports separately with the bare zone id.
