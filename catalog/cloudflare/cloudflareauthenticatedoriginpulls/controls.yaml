# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflareauthenticatedoriginpulls
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The enablement stores toggle and association configuration at Cloudflare, not customer data this component encrypts.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No customer-managed key surface (see enc-at-rest).
    - control_id: enc-in-transit
      status: configurable
      field_path: zone_enabled
      evidence:
        type: spec_default
        reference: Enabling AOP makes every Cloudflare-to-origin pull a mutually authenticated TLS connection -- the component's entire purpose is strengthening transit security.
      notes: The origin must REQUIRE and VALIDATE the client certificate for the control to hold; Cloudflare's side alone presents but does not enforce.
    - control_id: no-public-access
      status: configurable
      field_path: zone_enabled
      evidence:
        type: spec_default
        reference: With AOP enabled and the origin validating, connections that bypass Cloudflare cannot authenticate to the origin -- the practical origin-lockdown control.
      notes: The enforcement point is the origin's TLS configuration, outside this spec.
    - control_id: restricted-ingress
      status: not_applicable
      notes: Origin-side ingress restriction is the origin's firewall/TLS posture; this component supplies the credential Cloudflare presents.
    - control_id: edge-protection
      status: not_applicable
      notes: AOP protects the ORIGIN from non-Cloudflare traffic; edge protection (WAF, bot management) is separate kinds.
    - control_id: rbac
      status: not_applicable
      notes: Management access is Cloudflare account-membership posture; the surface exposes no data plane of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The client certificates themselves are the identities -- uploaded through CloudflareAuthenticatedOriginPullsCertificate, not held here.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication path of its own. Prefer a scoped API token with Zone SSL and Certificates Edit.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Cloudflare records AOP changes in the account audit log unconditionally -- not a property this component configures.
    - control_id: monitoring-integration
      status: not_applicable
      notes: No metrics surface of its own; origin access logs are where AOP enforcement is observed.
    - control_id: backup-recovery
      status: not_applicable
      notes: Declarative configuration, fully re-creatable from the manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The enablement applies at Cloudflare's global edge -- every location presents the client certificate on origin pulls.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither surface deletes on destroy -- the zone toggle is abandoned (assert false BEFORE destroying when AOP must end OFF) and associations are reverted by a null write.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- Cloudflare operates the certificate presentation; no customer-visible patch surface exists.
