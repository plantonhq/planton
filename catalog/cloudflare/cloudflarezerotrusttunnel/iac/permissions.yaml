# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflarezerotrusttunnel
spec:
  cloudflare:
    groups:
      - purpose: ManageTunnel
        name: Cloudflare Tunnel Write
        scope: com.cloudflare.api.account
        provenance: derived
        notes: "Covers the module's entire API surface: create/update/delete the tunnel (POST/PATCH/DELETE /accounts/{account_id}/cfd_tunnel[/{tunnel_id}]), manage the remote ingress configuration (PUT .../cfd_tunnel/{tunnel_id}/configurations -- a separate resource in both modules so ingress edits never recreate the tunnel), and fetch the connector run token (GET .../cfd_tunnel/{tunnel_id}/token). This is the group the permissions reference documents for creating and deleting Cloudflare Tunnels (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22); the \"Accepted Permissions\" sections of the cloudflared tunnel endpoint docs (create, configurations update, and token get method pages under https://developers.cloudflare.com/api/resources/zero_trust/subresources/tunnels/, retrieved 2026-08-22) show all three endpoints the module touches accept the same three write groups -- \"Cloudflare One Connectors Write\", \"Cloudflare One Connector: cloudflared Write\", and \"Cloudflare Tunnel Write\" (any one suffices) -- so the \"Cloudflare One Connector(s)\" groups are documented alternates. NOTE on read-only credentials: the token GET endpoint's Accepted Permissions list names ONLY the three Write groups -- \"Cloudflare Tunnel Read\" is NOT listed there, so a read-only credential holding only the Read group can refresh the tunnel object but cannot fetch the run token the stack exports; a drift-checking credential for this component therefore still needs a Write group (observed on the endpoint doc cited above). Covers the Terraform module's cloudflare_zero_trust_tunnel_cloudflared resource + cloudflare_zero_trust_tunnel_cloudflared_config resource + the cloudflare_zero_trust_tunnel_cloudflared_token data source, and the Pulumi module's matching trio. The header inventory recorded this entry as documented provenance (upgraded from static analysis by the endpoint pages cited above); the schema's provenance vocabulary is derived/proven, so it is carried as derived until the live capture lane upgrades it."
