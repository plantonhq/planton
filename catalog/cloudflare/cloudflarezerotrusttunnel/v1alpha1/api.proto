import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflarezerotrusttunnel/v1alpha1/outputs.proto";
import "catalog/cloudflare/cloudflarezerotrusttunnel/v1alpha1/spec.proto";
import "shared/metadata.proto";

// cloudflare-zero-trust-tunnel
message CloudflareZeroTrustTunnel {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  //resource-kind
