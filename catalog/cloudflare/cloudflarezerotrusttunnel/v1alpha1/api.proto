}

// cloudflare-zero-trust-tunnel status
message CloudflareZeroTrustTunnelStatus {
  //outputs
  //  cloudflare-zero-trust-tunnel outputs
  CloudflareZeroTrustTunnelOutputs outputs = 1;
}
