# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflarenotificationpolicy
spec:
  cloudflare:
    groups:
      - purpose: ManagePolicy
        name: Notifications Write
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Covers the Terraform module's single cloudflare_notification_policy resource and the Pulumi module's matching NotificationPolicy resource -- create/update/delete the policy via POST/PUT/DELETE /accounts/{account_id}/alerting/v3/policies[/{id}] (derived from the module's API surface; neither engine performs secondary lookups -- the referenced webhook/PagerDuty destination ids travel as opaque values). Group names verbatim from the Cloudflare API token permissions reference (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22).
      - purpose: ReadPolicy
        name: Notifications Read
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Read-side of the same resources -- refresh/import the policy via GET /accounts/{account_id}/alerting/v3/policies/{id} (derived from the module's API surface).
