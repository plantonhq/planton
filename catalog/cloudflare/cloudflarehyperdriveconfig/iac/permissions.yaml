# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
#
# The kind's catalog.md states the requirement in prose ("a Cloudflare
# API token that has Hyperdrive edit access") -- migrated here losslessly;
# "edit access" is the dashboard-name spelling of the same write grant on
# the permissions reference. The origin database password and optional
# Access service-token secret the config carries are payload values resolved
# from managed secrets, not Cloudflare token permissions.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflarehyperdriveconfig
spec:
  cloudflare:
    groups:
      - purpose: ManageConfig
        name: Hyperdrive Write
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Covers the Terraform module's single cloudflare_hyperdrive_config resource and the Pulumi module's matching HyperdriveConfig resource -- create/update/delete the Hyperdrive config via POST/PUT/DELETE /accounts/{account_id}/hyperdrive/configs[/{id}] (dedicated group, direct name match; the path mapping is derived from the module's API surface; neither engine performs secondary lookups). Group name verbatim from the Cloudflare API token permissions reference (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22).
      - purpose: ReadConfig
        name: Hyperdrive Read
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Read-side of the same resource -- refresh/import the config via GET /accounts/{account_id}/hyperdrive/configs/{id}.
