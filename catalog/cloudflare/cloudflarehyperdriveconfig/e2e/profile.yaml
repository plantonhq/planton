apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarehyperdriveconfig
spec:
  # A Hyperdrive config under live E2E: account-scoped, no catalog
  # prerequisites -- deploy -> GET
  # accounts/{account_id}/hyperdrive/configs/{hyperdrive_id} verify ->
  # destroy -> verify-destroyed on both provisioners. The real-world
  # dependency is not a catalog kind: Cloudflare validates the origin
  # database connection at CREATE, so the minimal scenario is env-gated
  # (planton.dev/e2e-required-env) on a reachable origin Postgres the proof
  # session provides -- PLANTON_E2E_HYPERDRIVE_ORIGIN_HOST / _USER /
  # _PASSWORD / _DATABASE. Until those are set the lane skips honestly
  # instead of failing on an unreachable origin. The scenario also exercises
  # explicit caching (maxAge + staleWhileRevalidate). Deliberately not live:
  # mtls (needs CA/client certificates pre-uploaded to Cloudflare) and a VPC
  # Service origin (needs a Workers VPC setup); both module paths are
  # offline-plan-proven via the kind's e2e manifest and presets. Watch: the
  # origin password is write-only (the API never returns it) -- the blind
  # import round-trip lands with an empty password in state and must
  # re-assert it from configuration. Objects create in seconds at zero cost
  # (the origin database is the proof session's only real expense).
  tier: 1
  status: deferred
  deferred_reason: >-
    Environment-blocked, not defective: Cloudflare validates the origin
    database connection at CREATE, and the 2026-08-26 proof session (which
    proved the other five kinds of its group live) had no internet-reachable
    origin Postgres to offer -- the operator declined provisioning one, so
    the env-gated lane skipped honestly rather than fail on an unreachable
    origin. Nothing about the kind itself is blocked: both modules build,
    every shape is offline-plan-proven, and the import surface is already
    prepared (origin.password is declared write-normalized in the provider
    import catalog, so the blind round-trip's one expected diff is
    tolerated; the provider preserves the password from state on refresh
    per its own custom.go). One cross-engine fix landed pre-proof: the
    pulumi module now omits an unset origin.host like the terraform module
    does (a VPC-service origin legitimately omits host). Unblock: set
    PLANTON_E2E_HYPERDRIVE_ORIGIN_HOST / _USER / _PASSWORD / _DATABASE to
    any small internet-reachable Postgres (a free-tier Neon database
    suffices; TLS is fine -- Hyperdrive negotiates it), then run both
    engine lanes plus the terraform round-trip unchanged.
  timeout_minutes: 10
