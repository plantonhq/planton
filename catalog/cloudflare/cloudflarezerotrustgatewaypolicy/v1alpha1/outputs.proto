syntax = "proto3";

package dev.planton.cloudflare.cloudflarezerotrustgatewaypolicy.v1alpha1;

// CloudflareZeroTrustGatewayPolicyOutputs captures the observable outputs
// after creating a Gateway policy.
message CloudflareZeroTrustGatewayPolicyOutputs {
  // The UUID of the created policy.
  string policy_id = 1;

  // The policy's evaluation precedence (Cloudflare assigns one when the spec
  // leaves it unset; lower runs earlier).
  string precedence = 2;
}
