apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarezerotrustgatewaypolicy
spec:
  # Gateway policies under live E2E: account-scoped, no prerequisites --
  # deploy -> API verify -> destroy -> verify-absent on both provisioners.
  # Delete is a real API DELETE; the schema carries a computed deleted_at the
  # provider never reads, so the verifier uses the soft-delete-aware probe (a
  # tombstoned 200 counts as absent either way). Creates in seconds; free
  # (Zero Trust Free). PREREQUISITE (account setup, not a fixture): the
  # account's Zero Trust organization (team name) must exist -- a one-time
  # Phase-2 provisioning step. Live scenarios set enabled + precedence
  # EXPLICITLY (the provider defaults enabled to FALSE) and avoid the
  # UPSTREAM-DEFECT fields: the v5 provider shows computed-field drift EVEN ON
  # FIRST APPLY for rule_settings carrying add_headers or override_ips (its
  # own migration tests expect a non-empty plan) -- those shapes are
  # offline-plan-proven via e2e/add-headers-plan.yaml, never live until the
  # defect clears. Entitlement-gated arms are offline too: isolate needs the
  # Browser Isolation add-on (e2e/isolate-plan.yaml), egress needs dedicated
  # egress IPs (e2e/egress-plan.yaml) -- recorded deferrals, not skips.
  # Wirefilter expressions are API-reformatted; the idempotency re-plan is the
  # drift canary.
  tier: 1
  status: deferred
  deferred_reason: >-
    Blocked by an upstream provider defect, measured live 2026-08-26 on the
    real account: the resource's Computed attributes ship no
    UseStateForUnknown plan modifiers (terraform-provider-cloudflare issue
    #7106), so a refresh-inclusive plan NEVER converges -- every
    configuration shape re-plans an in-place update forever (measured:
    rule_settings absent, rule_settings {}, and both live scenarios'
    populated shapes; the visible driver is
    rule_settings.ignore_cname_category_matches, which the Gateway API
    accepts but never echoes -- probed via direct POST/PUT/GET on dns and
    http rules, sparse echoes on all). Module-side remedies measured
    non-fixing: an explicit-false send is accepted-and-dropped, and
    lifecycle ignore_changes cannot suppress a provider-planned unknown.
    v5.24.0 verified identical at source (zero commits touched the resource
    between tags, none on provider main either). Both PULUMI lanes passed
    all phases 2026-08-26 (previews do not refresh, so the defect cannot
    fire there), but the kind stays deferred rather than half-claimed.
    Unblock: a provider release fixing #7106 (state-preserving plan
    modifiers on gateway policy), plus its pulumi-cloudflare bridge; then
    run both lanes unchanged -- scenarios, verifier, and import map are
    ready, and the import round-trip should ride the first green Terraform
    lane.
  timeout_minutes: 10
  cost_class: cheap_ephemeral
