# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflarezerotrustgatewaypolicy
spec:
  cloudflare:
    groups:
      - purpose: ManagePolicy
        name: Zero Trust Write
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Create/update/delete the Gateway policy via POST/PUT/DELETE /accounts/{account_id}/gateway/rules[/{rule_id}]; the reference publishes no narrower group for Gateway policies (derived from the module's API surface). Covers the Terraform module's single cloudflare_zero_trust_gateway_policy resource and the Pulumi module's matching ZeroTrustGatewayPolicy resource; neither engine performs secondary lookups. Group name verbatim from the Cloudflare API token permissions reference (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22).
      - purpose: ReadPolicy
        name: Zero Trust Read
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Refresh/import the policy via GET /accounts/{account_id}/gateway/rules/{rule_id} (derived from the module's API surface).
