apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: cloudflarezerotrustgatewaypolicy
spec:
  # Account-scoped by API design: the import ID is the bare two-segment
  # "{account_id}/{rule_id}". account_id is spec-relative; policy_id is the
  # deploy's own output (the provider names the path segment rule_id).
  values:
    - name: account_id
      derivations:
        - from_spec_field: account_id
      where_to_find: >-
        Cloudflare dashboard -> the account's Overview (Account ID in the
        right-hand API panel), or `GET /accounts` on the Cloudflare v4 API.
    - name: policy_id
      derivations:
        - from_output: policy_id
      where_to_find: >-
        Zero Trust dashboard -> Gateway -> Firewall policies -> the policy,
        or `GET /accounts/<account_id>/gateway/rules` on the Cloudflare v4
        API (the id field of the entry whose name matches).
