# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflarezerotrustgatewaypolicy
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A Gateway policy is a filter rule, not a data store.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to encrypt (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: The policy inspects already-proxied employee traffic; it does not terminate TLS itself. TLS floors for websites are CloudflareZoneSettings / ZoneTlsSettings territory.
    - control_id: no-public-access
      status: not_applicable
      notes: Gateway policies filter employee traffic through Cloudflare's WARP/Gateway path, not a public endpoint this component exposes.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No ingress of its own (see no-public-access).
    - control_id: edge-protection
      status: configurable
      field_path: action
      evidence:
        type: spec_default
        reference: action plus filter, traffic, identity, and device_posture decide what employee DNS/HTTP/network traffic is allowed, blocked, isolated, redirected, or overridden.
      notes: Production accounts should set enabled true explicitly -- Cloudflare defaults enabled to false, so an omitted toggle deploys a rule that filters nothing.
    - control_id: rbac
      status: configurable
      field_path: identity
      evidence:
        type: spec_default
        reference: The identity wirefilter expression scopes the policy to users, groups, or IdP claims. Absent identity matches everyone.
    - control_id: workload-identity
      status: not_applicable
      notes: The policy evaluates human and device posture; machine credentials are CloudflareZeroTrustAccessServiceToken.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication path of its own.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: configurable
      field_path: rule_settings.payload_log
      evidence:
        type: spec_default
        reference: payload_log.enabled records request payloads for matching HTTP traffic. Account-level Gateway logging is CloudflareZeroTrustGatewaySettings (a later kind).
    - control_id: monitoring-integration
      status: configurable
      field_path: rule_settings.notification_settings
      evidence:
        type: spec_default
        reference: notification_settings.enabled sends a notice when the policy matches; include_context, msg, and support_url shape the message.
    - control_id: backup-recovery
      status: not_applicable
      notes: Declarative configuration, fully re-creatable from the manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Account-scoped policy served by Cloudflare's global Gateway edge.
    - control_id: deletion-protection
      status: not_applicable
      notes: Destroy is a real delete. Disable a policy (enabled false) instead of deleting it when you need a reversible off-switch.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- Cloudflare operates Gateway; no customer-visible patch surface exists.
