apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarezerotrustorganization
spec:
  # Zero Trust organization under live E2E: an ACCOUNT-SCOPED SINGLETON
  # UPSERT with a NO-OP destroy -- the lane MUTATES THE ACCOUNT'S REAL
  # ORGANIZATION (the one Phase-2 account setup created with the team name).
  # Watch items for the proving session: (1) capture the organization's
  # prior values (GET accounts/{a}/access/organizations) BEFORE the lane and
  # restore them in VERIFY-CLN -- destroy reverts nothing; (2) the scenario
  # deliberately avoids auth_domain -- changing the team domain mid-proof
  # would break every Access login on the account; (3) the folded
  # key-rotation cadence rides the same lane (also singleton, also no-op
  # destroy) -- capture and restore it the same way; (4) the Access family's
  # API-token defect class (the key-configuration upstream test blanks
  # CLOUDFLARE_API_TOKEN): a 403 on the PUT under our token credential is
  # the expected ambush, and a recorded deferral is the honest outcome.
  tier: 1
  status: green
  # LIVE-PROVEN 2026-08-27: login-design on both engines, full lifecycle,
  # with the two-resource blind round-trip (organization + key
  # configuration, both bare account-id imports) consuming exactly the two
  # declared deny_unmatched_requests* tolerances. Three walls measured and
  # taught: (1) auth_domain is REQUIRED on every write (11004
  # invalid_auth_domain when omitted) -- the spec now requires it and the
  # scenario sends the account's real team domain UNCHANGED via
  # PLANTON_E2E_CLOUDFLARE_TEAM_DOMAIN; (2) the org's display name echoes
  # on read, so an omitted name re-plans "name -> null" forever -- the
  # scenario declares a run-scoped name; (3) capture-and-restore held: org
  # values, login design, session duration, and the 42-day key-rotation
  # cadence all verified restored byte-for-byte after the lanes. The
  # API-token 403 ambush never fired.
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
