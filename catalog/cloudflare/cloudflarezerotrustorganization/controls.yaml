# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflarezerotrustorganization
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: Configuration-only surface -- no customer data is stored by the organization settings.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No storage surface.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Management traffic to the Cloudflare API is HTTPS unconditionally; the Access login page itself is served only over HTTPS on the team domain.
    - control_id: no-public-access
      status: not_applicable
      notes: The login page is public BY DESIGN (it is the front door); what it guards is governed by Access applications and policies.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network ingress surface of its own.
    - control_id: edge-protection
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The Access login flow runs entirely on Cloudflare's edge with its standard DDoS and TLS posture.
    - control_id: rbac
      status: configurable
      field_path: mfa_config
      evidence:
        type: spec_default
        reference: mfa_config declares the organization-wide MFA policy (allowed authenticators, MFA session durations, PIV key requirements) -- the account-level authentication-strength control.
      notes: Per-application authorization lives on Access policies; this is the strength floor beneath them.
    - control_id: workload-identity
      status: not_applicable
      notes: Human login configuration; machine identity is CloudflareZeroTrustAccessServiceToken.
    - control_id: no-legacy-auth
      status: configurable
      field_path: mfa_required_for_all_apps
      evidence:
        type: spec_default
        reference: mfa_required_for_all_apps applies global MFA to every application by default, removing password-only access across the organization.
    - control_id: strong-user-auth
      status: configurable
      field_path: mfa_config
      evidence:
        type: spec_default
        reference: Unset leaves the organization's MFA policy unmanaged; allowed_authenticators pins which second factors count (totp, biometrics, security_key, ssh_piv_key), session_duration bounds how long an MFA assertion stays valid, and mfa_ssh_piv_key_requirements constrains accepted hardware keys down to PIN/touch policy and FIPS certification. mfa_required_for_all_apps then applies the policy to every application by default.
      notes: The 02-mfa-hardening preset allows only security_key and totp with a 12-hour MFA session and enables mfa_required_for_all_apps. First-factor password strength rides the configured identity providers -- Access verifies identity, it stores no passwords of its own.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Access login and configuration changes land in Cloudflare's account audit log unconditionally.
    - control_id: monitoring-integration
      status: not_applicable
      notes: No metrics surface of its own; Access analytics ride the Zero Trust dashboard.
    - control_id: backup-recovery
      status: not_applicable
      notes: Configuration-only surface, reproducible from the manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No stored data.
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The Access control plane runs on Cloudflare's global anycast network; there is no zonal placement to configure.
    - control_id: deletion-protection
      status: enforced_by_default
      evidence:
        type: module_default
        reference: Destroy is a NO-OP at the provider (empty Delete) -- the organization configuration cannot be destroyed from IaC at all.
    - control_id: managed-patching
      status: not_applicable
      notes: SaaS control plane -- Cloudflare operates it.
