apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: cloudflarezerotrustorganization
spec:
  values:
    - name: account_id
      derivations:
        - from_spec_field: account_id
      where_to_find: >-
        Cloudflare dashboard -> the account home (Account ID in the
        right-hand panel), or `GET /accounts` on the Cloudflare v4 API (the
        id field). Import is ACCOUNT SCOPE ONLY: a zone-scoped organization
        cannot be imported (the provider's importer never populates
        zone_id).
