apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflaresecretsstore
spec:
  # Secrets Store under live E2E: account-scoped create of the vault, verify
  # via the store GET-by-id, destroy (real delete). THE ONE-STORE-PER-ACCOUNT
  # LIMIT IS MEASURED REAL: a second create is refused with error 1003
  # "maximum_stores_exceeded" (live 2026-08-27). The test account carried the
  # auto-provisioned EMPTY "default_secrets_store"; per owner approval the
  # lane freed the slot by deleting it and recreated a store of the same name
  # after the lanes (empty container, nothing referenced it; the recreated
  # store has a new id -- recorded in the session changelog). Any future lane
  # on this account inherits that pattern: verify the default store is empty,
  # escalate, delete, restore. Every field is create-only; the idempotency
  # re-plan measured empty.
  tier: 1
  status: green
  # LIVE-PROVEN 2026-08-27: minimal on both engines, full lifecycle, all
  # first-run once the store slot was freed; the blind import round-trip
  # passed with ZERO declared tolerances.
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
