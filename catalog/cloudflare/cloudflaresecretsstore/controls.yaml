# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflaresecretsstore
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The Secrets Store exists to hold secrets encrypted in Cloudflare's key infrastructure; values are write-only and never returned by the API.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No customer-managed key surface -- Cloudflare's key infrastructure holds the vault.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Management traffic to the Cloudflare API is HTTPS unconditionally; consumers read secrets inside Cloudflare's platform, never over the public network.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The store is account-internal -- only in-account surfaces a secret's scopes allow (Workers, AI Gateway, DEX, Access) can read values, and no public endpoint serves it.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No ingress surface of its own.
    - control_id: edge-protection
      status: not_applicable
      notes: A vault, not an edge-protection policy.
    - control_id: rbac
      status: not_applicable
      notes: Management access is Cloudflare account-membership posture; read access is governed per secret by its scopes (see CloudflareSecretsStoreSecret).
    - control_id: workload-identity
      status: not_applicable
      notes: The store holds credentials; it is not itself an identity surface.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication path of its own. Prefer a scoped API token with Account Secrets Store Edit.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Cloudflare records store creation and deletion in the account audit log unconditionally -- not a property this component configures.
    - control_id: monitoring-integration
      status: not_applicable
      notes: No metrics surface of its own.
    - control_id: backup-recovery
      status: not_applicable
      notes: The container re-creates from the manifest, but the secret VALUES inside are write-only and unrecoverable from Cloudflare -- the managed-secret references behind each CloudflareSecretsStoreSecret are the real backup.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The store is served by Cloudflare's global control plane; consumers read it from every edge location.
    - control_id: deletion-protection
      status: not_applicable
      notes: Destroy is a real delete that takes EVERY secret in the store with it -- treat the store as permanent infrastructure and destroy it last, if ever.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- Cloudflare operates the vault; the customer's only lifecycle duty is secret rotation.
