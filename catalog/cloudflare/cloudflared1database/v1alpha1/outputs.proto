syntax = "proto3";

package dev.planton.cloudflare.cloudflared1database.v1alpha1;

// CloudflareD1DatabaseOutputs captures the outputs after provisioning a Cloudflare D1 database.
message CloudflareD1DatabaseOutputs {
  // The unique identifier of the created D1 database. A Worker's `d1` binding
  // references this value.
  string database_id = 1;

  // The name of the database (same as the input name).
  string database_name = 2;

  // The D1 engine version Cloudflare reports for the database (server-assigned,
  // e.g. "production"). Informational; not used for wiring.
  string version = 3;
}
