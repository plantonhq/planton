syntax = "proto3";

package dev.planton.cloudflare.cloudflared1database.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflared1database/v1alpha1/outputs.proto";
import "catalog/cloudflare/cloudflared1database/v1alpha1/spec.proto";
import "shared/metadata.proto";

// cloudflare-d1-database
message CloudflareD1Database {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareD1Database'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  CloudflareD1DatabaseSpec spec = 4 [(buf.validate.field).required = true];

  //status
  CloudflareD1DatabaseStatus status = 5;
}

// cloudflare-d1-database status
message CloudflareD1DatabaseStatus {
  //outputs
  //  cloudflare-d1-database outputs
  CloudflareD1DatabaseOutputs outputs = 1;
}
