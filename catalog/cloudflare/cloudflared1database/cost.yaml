# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: cloudflared1database
spec:
  billing_model: usage_based
  cost_drivers:
    - field_path: read_replication.mode
      sku_meter: rows read
      pricing_unit: millions of rows
      impact: "Setting mode to auto adds cross-region read replicas at no extra replica charge -- Cloudflare's D1 pricing states \"Read replication does not charge extra for read replicas. You incur the same usage billing based on rows_read and rows_written by your queries\" (https://developers.cloudflare.com/d1/platform/pricing/, retrieved 2026-08-22). Replica-served queries meter rows read at the same rate as primary-served ones, so the field changes latency geography, not the rate card."
  free_tier: "Two distinct allowances. The Workers Free plan permanently includes 5 million rows read/day, 100,000 rows written/day, and 5 GB total storage -- these are hard quotas that make further operations FAIL when exceeded, never bill (limits reset daily at 00:00 UTC). The Workers Paid plan's monthly included allotments -- first 25 billion rows read, first 50 million rows written, first 5 GB stored -- are conditional on holding that $5/mo subscription (https://developers.cloudflare.com/d1/platform/pricing/, retrieved 2026-08-22)."
  estimate_exclusions:
    - rows read are query-driven -- a full table scan reads every row it scans regardless of what it returns, and no manifest can know query volume or shape
    - rows written follow INSERT/UPDATE/DELETE volume (indexed columns add one extra written row per index touched), driven entirely by application traffic
    - storage bills on the account-wide sum of all D1 databases' gigabytes stored per month, growing with data, tables, and indexes -- not knowable from this manifest
    - the Worker compute that queries D1 (serializing results, running application logic) bills as Workers requests and CPU time on the querying CloudflareWorker component, not here
    - the $5/mo Workers Paid subscription is account-level plan spend chosen at the account -- no field in this spec pins or creates it
  notes: "A D1 database idles at effectively $0: Cloudflare's pricing page states \"Scale-to-zero: You are not billed for hours or capacity units. If you are not running queries against your database, you are not billed for compute\" (https://developers.cloudflare.com/d1/platform/pricing/, retrieved 2026-08-22). The three meters, verbatim from that page's Workers Paid column: rows read \"First 25 billion / month included + $0.001 / million rows\", rows written \"First 50 million / month included + $1.00 / million rows\", storage \"First 5 GB included + $0.75 / GB-mo\". These are list-price overage rates past the plan's included allotments, never netted against them. D1 charges nothing for data transfer or egress (the pricing FAQ answers \"Does D1 charge for data transfer / egress?\" with \"No.\"), and dashboard or Wrangler queries count as billable usage like any other. An empty database consumes about 12 KB of storage per the same page -- far inside every plan's included 5 GB, so creating one moves no meter. Region and jurisdiction fix placement only; the pricing table carries no region dimension."
