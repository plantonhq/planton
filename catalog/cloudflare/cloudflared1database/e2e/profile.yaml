apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflared1database
spec:
  # A D1 database under live E2E: account-scoped, no prerequisites -- deploy
  # -> GET accounts/{account_id}/d1/database/{database_id} verify -> destroy
  # -> verify-destroyed on both provisioners. Two scenarios: `minimal` (bare
  # database, Cloudflare picks placement) and `replicated` (region hint weur +
  # read replication auto -- the placement and replication surfaces in one
  # arm). Database names are unique within an account, so both carry the run
  # id. Deliberately not live: jurisdiction ("eu"/"fedramp") -- it is
  # mutually exclusive with region so it cannot ride the replicated arm, and
  # a data-residency placement adds no lifecycle surface beyond the minimal
  # arm; the module path is offline-plan-proven via the kind's e2e manifest
  # and presets. Watch: whether read replication (`auto`) is entitled on the
  # free plan is unverified offline -- if the live lane hits an entitlement
  # wall, the replicated arm falls back to region-hint-only under proof-lane
  # design authority. Objects create in seconds at zero cost.
  tier: 1
  # Proven live 2026-08-26: both engines ran minimal + replicated through
  # the full lifecycle with the apply-idempotency re-plan green, plus both
  # blind import round-trips ({account_id}/{database_id}) at zero change on
  # the Terraform lane. Read replication `auto` confirmed AVAILABLE on the
  # free plan (the offline entitlement question resolved). First contact
  # fixed two module classes in both engines: read_replication coalesces to
  # the server default "disabled" (Optional-not-Computed echo), and
  # primary_location_hint is ignore_changes (create-only, never read back,
  # replace-forcing -- a blind import otherwise planned a data-destroying
  # replace to move a hint).
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
