apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarezerotrustdnslocation
spec:
  # DNS locations under live E2E: account-scoped creates with a real delete
  # and an honest 404 (both scenarios cheap and self-contained). Watch items
  # for the proving session: (1) the basic upstream acceptance test blanks
  # CLOUDFLARE_API_TOKEN (the Access/Gateway auth-defect class) -- a 403
  # under our token credential is the expected ambush; (2) client_default is
  # deliberately never set -- flipping the account's default location is a
  # real account-level mutation; (3) update is a full replace at the API, so
  # the endpoints-doh arm keeps max_ttl declared to prove the idempotent
  # re-plan.
  tier: 1
  cost_class: cheap_ephemeral
  status: green
  # LIVE-PROVEN 2026-08-26: minimal + endpoints-doh on both engines, full
  # lifecycle, blind import round-trips at ZERO declared tolerances. Three
  # walls measured and taught: (1) the provider's raw-typed
  # computed-optional attributes (max_ttl, every networks list) CRASH the
  # apply when null -- both modules coalesce to documented server defaults
  # ({mode: inherit}, empty lists); (2) declared endpoints with EMPTY
  # network lists re-plan forever (API drops empty lists on read) -- the
  # endpoints-doh scenario declares real rows; (3) the account's FIRST
  # location is auto-promoted to an undeletable, undemotable default
  # (errors 1217/1216) -- the e2e account carries the permanent
  # planton-default-location-placeholder so run-scoped locations lifecycle
  # cleanly. Deleted locations answer GET 400 code 1103 (absence-classified
  # in the harness client). The upstream test's API-token blanking did not
  # reproduce -- no 403 anywhere.
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
