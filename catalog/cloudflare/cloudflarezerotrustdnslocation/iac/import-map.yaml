apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: cloudflarezerotrustdnslocation
spec:
  values:
    - name: account_id
      derivations:
        - from_spec_field: account_id
      where_to_find: >-
        Cloudflare dashboard -> the account home (Account ID in the
        right-hand panel), or `GET /accounts` on the Cloudflare v4 API (the
        id field).
    - name: location_id
      derivations:
        - from_output: location_id
      where_to_find: >-
        `GET /accounts/<account_id>/gateway/locations` on the Cloudflare v4
        API (the id field; match by name), or the Zero Trust dashboard ->
        Gateway -> DNS locations.
