# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflarezerotrustdnslocation
spec:
  cloudflare:
    groups:
      - purpose: ManageLocation
        name: Zero Trust Write
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Create/update/delete the Gateway DNS location via POST/PUT/DELETE /accounts/{account_id}/gateway/locations[/{location_id}]; the reference publishes no narrower group for Gateway locations (derived from the module's API surface). Covers the Terraform module's single cloudflare_zero_trust_dns_location resource and the Pulumi module's matching ZeroTrustDnsLocation resource; neither engine performs secondary lookups. Group name verbatim from the Cloudflare API token permissions reference (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22).
      - purpose: ReadLocation
        name: Zero Trust Read
        scope: com.cloudflare.api.account
        provenance: derived
        notes: Refresh/import the location via GET /accounts/{account_id}/gateway/locations/{location_id} (derived from the module's API surface).
