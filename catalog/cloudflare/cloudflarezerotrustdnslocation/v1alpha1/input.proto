syntax = "proto3";

package dev.planton.cloudflare.cloudflarezerotrustdnslocation.v1alpha1;

import "catalog/cloudflare/cloudflarezerotrustdnslocation/v1alpha1/api.proto";
import "catalog/cloudflare/provider.proto";

// CloudflareZeroTrustDnsLocationIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message CloudflareZeroTrustDnsLocationIacInput {
  // the catalog object to deploy to be deployed
  CloudflareZeroTrustDnsLocation target = 1;
  // provider-config for Cloudflare authentication
  dev.planton.cloudflare.CloudflareProviderConfig provider_config = 2;
}
