# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflaresecretsstoresecret
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Secret values are stored encrypted in Cloudflare's key infrastructure and are write-only -- the API never returns them.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No customer-managed key surface -- Cloudflare's key infrastructure holds the value.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The value travels once, over HTTPS, at write time; consumers read it inside Cloudflare's platform, never over the public network.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Secrets are readable only by the in-account surfaces their scopes allow -- no public endpoint serves values.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No ingress surface of its own.
    - control_id: edge-protection
      status: not_applicable
      notes: A credential record, not an edge-protection policy.
    - control_id: rbac
      status: configurable
      field_path: scopes
      evidence:
        type: spec_validation
        reference: scopes is the secret's access-control list -- only the listed surfaces (access, ai_gateway, dex, workers) may read the value, and the spec walls the legal set.
      notes: Grant only the surfaces that actually read the secret; widening later is a plain in-place update.
    - control_id: workload-identity
      status: not_applicable
      notes: The secret IS a credential consumers present; identity of the consumer lives on the consumer's own kind.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication path of its own. Prefer a scoped API token with Account Secrets Store Edit.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Cloudflare records secret writes and deletions in the account audit log unconditionally -- not a property this component configures.
    - control_id: monitoring-integration
      status: not_applicable
      notes: No metrics surface of its own.
    - control_id: backup-recovery
      status: not_applicable
      notes: The value is write-only and unrecoverable from Cloudflare -- the managed-secret reference behind `value` is the real system of record and the only backup.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Secrets are served by Cloudflare's global control plane; scoped consumers read them from every edge location.
    - control_id: deletion-protection
      status: not_applicable
      notes: Destroy is a real delete. Consumers referencing the name fail reads at RUNTIME -- re-point or retire them first.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- Cloudflare operates the store; the customer's only lifecycle duty is value rotation.
