syntax = "proto3";

package dev.planton.cloudflare.cloudflaresecretsstoresecret.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflaresecretsstoresecret/v1alpha1/outputs.proto";
import "catalog/cloudflare/cloudflaresecretsstoresecret/v1alpha1/spec.proto";
import "shared/metadata.proto";

// CloudflareSecretsStoreSecret is a KRM-style resource for managing one
// secret inside the account Secrets Store.
message CloudflareSecretsStoreSecret {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareSecretsStoreSecret'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  CloudflareSecretsStoreSecretSpec spec = 4 [(buf.validate.field).required = true];

  // status
  CloudflareSecretsStoreSecretStatus status = 5;
}

// CloudflareSecretsStoreSecretStatus represents the observed state of the
// secret.
message CloudflareSecretsStoreSecretStatus {
  // outputs from the IaC deployment
  CloudflareSecretsStoreSecretOutputs outputs = 1;
}
