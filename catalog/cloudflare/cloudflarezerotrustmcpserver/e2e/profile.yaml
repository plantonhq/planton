apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarezerotrustmcpserver
spec:
  # MCP server registrations under live E2E: account-scoped creates with a
  # real delete and an honest 404. Watch items for the proving session:
  # (1) the registration's background prompt/tool sync will land in status
  # "error" for a throwaway hostname -- the OBJECT still exists and the
  # lane is honest (sync state is server-reported, never asserted);
  # (2) Access AI Controls is a young product surface -- entitlement or
  # regional availability gates are possible and a recorded deferral is a
  # legitimate outcome; (3) the Access family needs the account's Zero
  # Trust organization (team name) to exist (Phase-2 account setup).
  tier: 1
  cost_class: cheap_ephemeral
  status: green
  # LIVE-PROVEN 2026-08-26: unauthenticated-minimal on both engines, full
  # lifecycle, all first-run; the blind import round-trip passed at ZERO
  # declared tolerances. No AI Controls entitlement gate fired. The server
  # hostname is a full URL (bare hostnames rejected 400 code 7001 "Invalid
  # url", probe-measured) and external -- unlike the portal's, it needs no
  # account-served zone. Deleted servers 404 honestly.
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
