# CloudflareZeroTrustMcpServer install profile used as a SCENARIO-declared
# prerequisite (planton.dev/e2e-prerequisites) by the MCP portal's
# with-server arm: a portal does not REQUIRE servers, so the edge is
# per-scenario, never a registry prerequisite. The registration is a
# throwaway unauthenticated server on a run-scoped hostname (background
# sync lands in status "error" -- harmless; the registration object is what
# the portal row references). metadata.name stays stable -- it is the key
# consumers' valueFrom references resolve against.
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareZeroTrustMcpServer
metadata:
  name: planton-oss-e2e-cloudflarezerotrustmcpserver-prereq
  id: planton-oss-e2e-cloudflarezerotrustmcpserver-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: cloudflarezerotrustmcpserver
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  account_id: ${E2E_ENV:PLANTON_E2E_CLOUDFLARE_ACCOUNT_ID}
  server_id: e2e-mcp-prereq-${E2E_RUN_ID}
  name: Planton E2E MCP fixture ${E2E_RUN_ID}
  hostname: https://mcp-e2e-prereq-${E2E_RUN_ID}.example.com
  auth_type: unauthenticated
