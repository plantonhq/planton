# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
#
# The component's catalog.md states the same requirement in prose ("a
# Cloudflare API token that has SSL and Certificates edit access") --
# migrated here losslessly; "edit access" is the dashboard-name spelling of
# the same write grant on the permissions reference.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflarecustomhostnamefallbackorigin
spec:
  cloudflare:
    groups:
      - purpose: ManageFallbackOrigin
        name: SSL and Certificates Write
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: Covers the Terraform module's single cloudflare_custom_hostname_fallback_origin resource and the Pulumi module's matching CustomHostnameFallbackOrigin resource -- create/update/delete the zone's fallback origin via PUT/DELETE /zones/{zone_id}/custom_hostnames/fallback_origin (the Cloudflare-for-SaaS custom-hostname surface lives in the SSL and Certificates product family; the mapping from that API path to this group is derived from the module's API surface; neither engine performs secondary lookups). Group name verbatim from the Cloudflare API token permissions reference (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22).
      - purpose: ReadFallbackOrigin
        name: SSL and Certificates Read
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: Read-side of the same resource -- refresh/import the fallback origin via GET /zones/{zone_id}/custom_hostnames/fallback_origin.
