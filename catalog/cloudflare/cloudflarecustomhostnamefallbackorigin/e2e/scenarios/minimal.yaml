# Minimal CloudflareCustomHostnameFallbackOrigin scenario: the zone
# singleton that every custom hostname routes to unless overridden. The
# origin hostname composes the fixture zone's run token. There is no
# DNS-record fixture yet -- the API may reject an origin with no record;
# if the lane measures that, author the cloudflarednsrecord install
# profile (the kind is proven and released) and declare it here. The
# whole surface is gated on Cloudflare for SaaS enrollment (400/1456
# measured 2026-08-28) -- see the profile for the unblock.
apiVersion: cloudflare.planton.dev/v1alpha1
kind: CloudflareCustomHostnameFallbackOrigin
metadata:
  name: planton-oss-e2e-cloudflarecustomhostnamefallbackorigin-minimal
  id: planton-oss-e2e-cloudflarecustomhostnamefallbackorigin-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: cloudflarecustomhostnamefallbackorigin
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  zone_id:
    valueFrom:
      kind: CloudflareDnsZone
      name: planton-oss-e2e-cloudflarednszone-prereq
      fieldPath: status.outputs.zone_id
  origin:
    value: origin.planton-e2e-${E2E_RUN_ID}.com
