apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarecustomhostnamefallbackorigin
spec:
  # A custom-hostname fallback origin under live E2E: a zone singleton (one
  # per SaaS zone). The harness installs the CloudflareDnsZone prerequisite
  # first, then deploy -> GET zones/{zone_id}/custom_hostnames/fallback_origin
  # verify -> destroy -> verify-destroyed. The origin hostname composes the
  # fixture zone's run token. The 1456 wall (measured 2026-08-28: the
  # account was NOT enrolled in Cloudflare for SaaS -- the PUT answered 400
  # code 1456) FELL 2026-08-29 when the owner enrolled the account
  # (account-wide `ssl_for_saas_basic`): the fallback PUT succeeds on a
  # run-scoped PENDING zone with NO DNS record for the origin
  # (write-probe-measured -- the no-record rejection risk did not fire).
  # Standing watch for the lanes: the provider's own test unsets
  # CLOUDFLARE_API_TOKEN because the PUT "does not yet support API tokens"
  # (Create=Update, so the idempotency re-apply may 403). The verifier
  # treats GET 200 with status pending_deletion as gone (async delete).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
