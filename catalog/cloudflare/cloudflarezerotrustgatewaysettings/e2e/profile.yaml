apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarezerotrustgatewaysettings
spec:
  # Gateway settings under live E2E: an ACCOUNT-SCOPED SINGLETON fold
  # (settings + logging, both no-op destroy) plus the real-lifecycle PAC
  # files. The lane MUTATES THE ACCOUNT'S REAL GATEWAY CONFIGURATION.
  # Watch items for the proving session: (1) capture the prior settings and
  # logging values (GET accounts/{a}/gateway/configuration and /logging)
  # BEFORE the lane and restore them in VERIFY-CLN -- destroy reverts
  # nothing; (2) the live scenario touches only drift-safe surfaces -- the
  # provider's own tests record PERMANENT refresh drift on
  # block_page.{mode,include_context,suppress_footer,target_uri}, and its
  # sweeper documents that enabling tls_decrypt/fips/deep body_scanning
  # without an activated certificate leaves the account erroring (code
  # 2211): those surfaces stay offline-plan-only (e2e/hazard-plan.yaml);
  # (3) the settings acceptance tests upstream blank CLOUDFLARE_API_TOKEN
  # (the Access auth-defect class) -- a 403 under our token credential is
  # the expected ambush; (4) PAC files delete for real and ride the same
  # lane.
  tier: 1
  status: green
  # LIVE-PROVEN 2026-08-27: safe-surfaces on both engines, full lifecycle,
  # with the THREE-resource blind round-trip green at zero tolerances --
  # settings + logging as bare account-id singletons and the PAC file via
  # the pacfile_ids keyed output. One wall measured and fixed at the
  # full bar: an omitted PAC-file slug gets a RANDOM server slug that is
  # replace-forcing, so every refreshed plan proposed recreating the file
  # -- both modules now derive a deterministic name-based slug when unset.
  # Capture-and-restore held: gateway configuration (incl. the certificate
  # binding) and the complete logging tree verified restored after the
  # lanes (the re-PUT of the same certificate id also moved its stuck
  # binding_status pending_deployment -> active, a server-side status
  # progression). The API-token 403 ambush never fired.
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
