syntax = "proto3";

package dev.planton.cloudflare.cloudflarezerotrustgatewaysettings.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflarezerotrustgatewaysettings/v1alpha1/outputs.proto";
import "catalog/cloudflare/cloudflarezerotrustgatewaysettings/v1alpha1/spec.proto";
import "shared/metadata.proto";

// CloudflareZeroTrustGatewaySettings is a KRM-style resource for managing
// the account's Secure Web Gateway configuration, logging controls, and PAC
// files.
message CloudflareZeroTrustGatewaySettings {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareZeroTrustGatewaySettings'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  CloudflareZeroTrustGatewaySettingsSpec spec = 4 [(buf.validate.field).required = true];

  // status
  CloudflareZeroTrustGatewaySettingsStatus status = 5;
}

// CloudflareZeroTrustGatewaySettingsStatus represents the observed state of
// the Gateway configuration.
message CloudflareZeroTrustGatewaySettingsStatus {
  // outputs from the IaC deployment
  CloudflareZeroTrustGatewaySettingsOutputs outputs = 1;
}
