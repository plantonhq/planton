# Least-privilege permissions the IaC runner's Cloudflare credential needs
# to provision, update, and destroy this component with the official
# modules. Cloudflare authenticates with a bearer API token assembled from
# named permission groups; every group entry is `derived` (static analysis
# of the module sources, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: cloudflarehealthcheck
spec:
  cloudflare:
    groups:
      - purpose: ManageHealthCheck
        name: Health Checks Write
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: Covers the Terraform module's single cloudflare_healthcheck resource and the Pulumi module's matching Healthcheck resource -- create/update/delete the standalone health check via POST/PATCH/DELETE /zones/{zone_id}/healthchecks[/{id}] (derived from the module's API surface; neither engine performs secondary lookups). Group name verbatim from the Cloudflare API token permissions reference (https://developers.cloudflare.com/fundamentals/api/reference/permissions/, retrieved 2026-08-22).
      - purpose: ReadHealthCheck
        name: Health Checks Read
        scope: com.cloudflare.api.account.zone
        provenance: derived
        notes: Read-side of the same resource -- refresh/import the health check via GET /zones/{zone_id}/healthchecks/{id} (derived from the module's API surface).
