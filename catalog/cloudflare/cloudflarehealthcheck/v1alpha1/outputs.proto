syntax = "proto3";

package dev.planton.cloudflare.cloudflarehealthcheck.v1alpha1;

// CloudflareHealthcheckOutputs captures the observable outputs after
// creating a health check.
message CloudflareHealthcheckOutputs {
  // The ID of the created health check.
  string healthcheck_id = 1;

  // The zone the health check belongs to.
  string zone_id = 2;
}
