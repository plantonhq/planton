syntax = "proto3";

package dev.planton.cloudflare.cloudflarehealthcheck.v1alpha1;

import "catalog/cloudflare/cloudflarehealthcheck/v1alpha1/api.proto";
import "catalog/cloudflare/provider.proto";

// CloudflareHealthcheckIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message CloudflareHealthcheckIacInput {
  // the catalog object to deploy to be deployed
  CloudflareHealthcheck target = 1;
  // provider-config for Cloudflare authentication
  dev.planton.cloudflare.CloudflareProviderConfig provider_config = 2;
}
