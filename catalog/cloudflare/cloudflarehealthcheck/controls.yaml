# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflarehealthcheck
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The health check stores probe configuration at Cloudflare, not customer data this component encrypts.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No customer-managed key surface (see enc-at-rest).
    - control_id: enc-in-transit
      status: configurable
      field_path: http_config.allow_insecure
      evidence:
        type: spec_default
        reference: Probe traffic from Cloudflare to the origin is HTTPS when type is HTTPS. allow_insecure skips origin certificate validation (self-signed origins).
      notes: Management traffic to the Cloudflare API is HTTPS unconditionally. allow_insecure is only meaningful for HTTPS probes.
    - control_id: no-public-access
      status: not_applicable
      notes: The check is a probe Cloudflare sends to your origin, not a public endpoint this component exposes.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No ingress of its own (see no-public-access).
    - control_id: edge-protection
      status: not_applicable
      notes: The check observes origin health; it does not protect the edge.
    - control_id: rbac
      status: not_applicable
      notes: Management access is Cloudflare account-membership posture; the check exposes no data plane of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The component holds no credentials.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication path of its own. Prefer a scoped API token; some upstream provider tests blank CLOUDFLARE_API_TOKEN and that auth-defect class is real.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Cloudflare records health-check changes in the account audit log unconditionally -- not a property this component configures.
    - control_id: monitoring-integration
      status: configurable
      field_path: address
      evidence:
        type: spec_default
        reference: address plus type and http_config/tcp_config define the standalone probe whose healthy/unhealthy status feeds Cloudflare alerting.
      notes: This is the monitoring object -- no load balancer required. Notifications are configured in Cloudflare's alerting, not on this spec.
    - control_id: backup-recovery
      status: not_applicable
      notes: Declarative configuration, fully re-creatable from the manifest. Probe history does not survive destroy.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: configurable
      field_path: check_regions
      evidence:
        type: spec_default
        reference: check_regions selects which Cloudflare regions probe the origin. ALL_REGIONS is Enterprise only. Unset lets Cloudflare pick a default region.
      notes: The check itself is zone-scoped; probe diversity is the region list.
    - control_id: deletion-protection
      status: not_applicable
      notes: Destroy is a real delete. Set suspended true to pause probing without losing the ID or history.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- Cloudflare operates the probes; no customer-visible patch surface exists.
