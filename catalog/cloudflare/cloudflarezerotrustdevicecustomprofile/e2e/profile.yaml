apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflarezerotrustdevicecustomprofile
spec:
  # Custom device profiles under live E2E: plain CRUD objects (real create,
  # update, delete -- deleting a profile returns its devices to the default
  # profile), so lanes are self-cleaning. PROVEN live 2026-08-27 (session
  # 031): both scenarios on both engines, all phases first-run, blind import
  # round-trips (profile + folded fallback list) at ZERO tolerances --
  # upstream's import tests ignore exclude/include on verify, but the live
  # round-trip measured both surviving import cleanly, so no tolerance is
  # declared. The fallback companion's upstream tests blank
  # CLOUDFLARE_API_TOKEN (the API-token defect class), but the account-owned
  # token credential never 403'd -- the ambush stayed stale here too.
  # Standing watch item: precedence is FIXED per scenario (8500/8600), so
  # two concurrent runs of the SAME scenario collide (the tunnel-route
  # fixed-CIDR class); the one-live-lane-process rule covers it.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
