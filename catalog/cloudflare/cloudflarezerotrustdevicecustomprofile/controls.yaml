# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflarezerotrustdevicecustomprofile
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A device settings surface -- no customer data stored.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No storage surface.
    - control_id: enc-in-transit
      status: configurable
      field_path: tunnel_protocol
      evidence:
        type: spec_default
        reference: All WARP tunnel traffic is encrypted; tunnel_protocol selects the transport (wireguard or masque). The split-tunnel exclude list is what carves traffic OUT of the encrypted tunnel -- keep it minimal.
    - control_id: no-public-access
      status: not_applicable
      notes: A configuration surface consumed by matched devices; nothing is exposed publicly.
    - control_id: restricted-ingress
      status: configurable
      field_path: virtual_networks
      evidence:
        type: spec_default
        reference: virtual_networks restricts which Zero Trust virtual networks matched devices may reach, with an explicit default landing network.
    - control_id: edge-protection
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: WARP tunnels terminate on Cloudflare's anycast edge with its standard DDoS posture.
    - control_id: rbac
      status: configurable
      field_path: switch_locked
      evidence:
        type: spec_default
        reference: switch_locked and allowed_to_leave remove matched users' ability to disable WARP or unenroll -- the device-side privilege levers this surface owns.
    - control_id: workload-identity
      status: not_applicable
      notes: Client certificate provisioning is the default profile's zone_certificates surface; custom profiles carry no certificate arm at the provider.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No user-auth surface; enrollment identity is the Access organization's concern.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Profile changes land in the Cloudflare account audit log.
    - control_id: monitoring-integration
      status: not_applicable
      notes: No metrics surface of its own; device connectivity analytics live in the Zero Trust dashboard.
    - control_id: backup-recovery
      status: not_applicable
      notes: Configuration-only surface, reproducible from the manifest (the per-profile fallback list is full-replacement -- the manifest IS the list).
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No stored data.
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The device policy control plane is Cloudflare-operated SaaS on its global network; there is no zonal placement to configure.
    - control_id: deletion-protection
      status: not_applicable
      notes: No provider-side deletion guard; deleting the profile returns matched devices to the default profile (a routing change -- see GUIDE.md).
    - control_id: managed-patching
      status: not_applicable
      notes: SaaS control plane -- Cloudflare operates it (client updates are governed by allow_updates).
