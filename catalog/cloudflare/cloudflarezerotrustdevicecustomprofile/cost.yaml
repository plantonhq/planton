# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: cloudflarezerotrustdevicecustomprofile
spec:
  billing_model: free
  notes: >-
    Custom device profiles create no charge of their own -- WARP device
    management is included in every Zero Trust plan (Free covers 50 users).
    Seat billing is driven by enrolled users, never by profile count.
