# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: cloudflareemailroutingzone
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The component stores routing configuration in Cloudflare's control plane -- no customer data store exists here to encrypt. Mail content passes through Cloudflare's pipeline and is not stored by this object.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to key (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: The component terminates no connections. Transport security for inbound and forwarded mail is SMTP/TLS behavior of Cloudflare's mail pipeline and the destination provider -- no field on this spec. SPF/DKIM records are provisioned automatically on enable as provider behavior.
    - control_id: no-public-access
      status: not_applicable
      notes: Enabling Email Routing publishes the zone's MX records -- accepting public inbound mail for the domain is the product's entire purpose, not an exposure this component could withhold. What happens to unmatched mail is governed by catch_all (Cloudflare's default is drop).
    - control_id: restricted-ingress
      status: not_applicable
      notes: No connection-level ingress filter exists on the mail surface; anti-spam/anti-abuse screening of inbound mail is Cloudflare's pipeline behavior, not this spec.
    - control_id: edge-protection
      status: not_applicable
      notes: The component routes email; web application firewalls have no HTTP traffic here to filter.
    - control_id: rbac
      status: not_applicable
      notes: Management is Cloudflare account-membership and API-token posture; the component exposes no data plane of its own to govern.
    - control_id: workload-identity
      status: not_applicable
      notes: The component holds no credentials -- catch-all forward targets must be pre-verified destination addresses, and the worker action references a script by name.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication path of its own. Prefer a scoped API token over the legacy Global API Key when provisioning.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Cloudflare records Email Routing settings changes in the account audit log unconditionally -- not a property this component configures.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The spec exposes no monitoring surface; Email Routing activity analytics are zone-level Cloudflare dashboard features outside this object.
    - control_id: backup-recovery
      status: not_applicable
      notes: Declarative configuration, fully re-creatable from the manifest -- there is no data to back up.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Email Routing runs on Cloudflare's globally operated mail infrastructure; there is no zonal placement to configure.
    - control_id: deletion-protection
      status: configurable
      field_path: lock_dns_records
      evidence:
        type: spec_default
        reference: lock_dns_records (default false) instantiates the managed Email Routing DNS records so they cannot be modified or removed out-of-band -- both modules create the email-routing-dns resource only when it is set. Unset, the auto-provisioned MX/SPF/DKIM records are ordinary zone records an out-of-band edit can silently break.
      notes: This guards the routing-critical DNS records, the component's real out-of-band-change surface; neither preset enables it. The component itself has no delete-refusal flag -- destroy disables Email Routing on the zone. Caveat from the modules -- destroying only the catch-all sub-resource is a provider no-op that leaves the zone's last catch-all behavior in place.
    - control_id: managed-patching
      status: not_applicable
      notes: A pure configuration object with no software of its own to patch; the mail pipeline and record management are Cloudflare-operated.
