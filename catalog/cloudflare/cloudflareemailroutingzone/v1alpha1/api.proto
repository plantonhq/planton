syntax = "proto3";

package dev.planton.cloudflare.cloudflareemailroutingzone.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/cloudflare/cloudflareemailroutingzone/v1alpha1/outputs.proto";
import "catalog/cloudflare/cloudflareemailroutingzone/v1alpha1/spec.proto";
import "shared/metadata.proto";

// cloudflare-email-routing-zone
message CloudflareEmailRoutingZone {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'cloudflare.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'CloudflareEmailRoutingZone'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  CloudflareEmailRoutingZoneSpec spec = 4 [(buf.validate.field).required = true];

  //status
  CloudflareEmailRoutingZoneStatus status = 5;
}

// cloudflare-email-routing-zone status
message CloudflareEmailRoutingZoneStatus {
  //outputs
  //  cloudflare-email-routing-zone outputs
  CloudflareEmailRoutingZoneOutputs outputs = 1;
}
