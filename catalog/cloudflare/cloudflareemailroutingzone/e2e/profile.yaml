apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: cloudflareemailroutingzone
spec:
  # Email Routing under live E2E: the harness deploys the CloudflareDnsZone
  # prerequisite (a run-scoped pending zone), resolves zone_id from its
  # outputs, then runs deploy -> GET zones/{zone_id}/email/routing verify ->
  # destroy -> verify-destroyed on both provisioners. The minimal scenario
  # proves the enable/disable lifecycle; the catch-all scenario proves the
  # folded catch-all rule (drop action, named). Deliberately not in the live
  # scenarios: forward/worker catch-all actions (they require a VERIFIED
  # destination address / deployed Email Worker -- verification is an emailed
  # link no lane can click; both send paths are offline-plan-proven), the
  # dns_name subdomain arm and lock_dns_records (offline-plan-proven; the
  # managed-DNS resource on a pending zone is an unverified interaction), and
  # the address status override. Two live measurements from 2026-08-26 for
  # the session that unblocks this kind: (1) on a PENDING (undelegated) zone
  # the plain enable endpoint answers success but the zone stays
  # enabled=false with status "unconfigured" -- expect the enable lifecycle
  # to be only fully provable on an ACTIVE zone (the env-gated
  # PLANTON_E2E_CLOUDFLARE_ZONE_ID arm is the designed escape hatch); (2)
  # the settings GET answers 200 with enabled=false after disable (the
  # settings-singleton revert class), so verify-absent needs the
  # value-aware probe the verifier comment describes. Objects create in
  # seconds at zero cost.
  tier: 1
  status: deferred
  deferred_reason: >-
    Blocked by an upstream provider defect, measured live on BOTH engines
    2026-08-26: cloudflare_email_routing_settings fails EVERY create/refresh
    with "Value Conversion Error ... Struct defines fields not found in
    object: support_subaddress" -- the v5.23.0 model gained
    support_subaddress but ResourceSchema() never did
    (terraform-provider-cloudflare issue #7301, open fix PR #7302; v5.24.0
    verified still broken at source, and pulumi-cloudflare v6.19.0 -- the
    newest -- bridges the broken code). No module or config change can work
    around a schema/model mismatch. Offline plans stay green because plan
    never invokes the conversion. Unblock: a provider release carrying the
    schema fix, plus the pulumi-cloudflare release that bridges it; then run
    both lanes unchanged. Note for that session: the settings GET answers
    200 with enabled=false after disable (measured via the REST API
    2026-08-26), so verify-absent needs the value-aware probe the verifier
    comment describes.
  timeout_minutes: 10
