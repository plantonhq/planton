syntax = "proto3";

package dev.planton.cloudflare.cloudflarezonetlssettings.v1alpha1;

import "catalog/cloudflare/cloudflarezonetlssettings/v1alpha1/api.proto";
import "catalog/cloudflare/provider.proto";

// CloudflareZoneTlsSettingsIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message CloudflareZoneTlsSettingsIacInput {
  // the catalog object to deploy to be deployed
  CloudflareZoneTlsSettings target = 1;
  // provider-config for Cloudflare authentication
  dev.planton.cloudflare.CloudflareProviderConfig provider_config = 2;
}
