# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: openfgaauthorizationmodel
spec:
  billing_model: free
  free_tier: "An authorization model is an API object written into a store on a customer-run OpenFGA server, and OpenFGA is open-source software (Apache-2.0, a CNCF incubating project, verified at openfga.dev and github.com/openfga/openfga) -- no vendor meters model writes, and the software carries no license fee however many model versions accumulate."
  notes: "No field of this spec buys anything: store_id addresses an existing store, and model_dsl / model_json are the policy document itself. Models are immutable -- every change writes a new version and the old ones are retained undeletably -- but those versions are rows in the datastore BEHIND the customer-run OpenFGA server, so the real spend lives in the infrastructure hosting that server: its compute (a Kubernetes workload, VM, or container service billing as its own catalog kind) and its backing database (Postgres, MySQL, or SQLite; production deployments run a managed database that bills on its own meters). A commercial hosted service such as Okta FGA prices by its own subscription, outside this component's claim, which describes the open-source server the official modules target."
