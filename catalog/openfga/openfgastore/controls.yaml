# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: openfgastore
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: "A store is a logical container inside the OpenFGA server, not a data store this component owns. Its contents (models, tuples) persist in the server's backing datastore (Postgres, MySQL, or SQLite); encryption at rest is that datastore deployment's posture, configured nowhere in this spec's single field (name)."
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: There is no data at rest for this component to key (see enc-at-rest); key management belongs to the datastore behind the customer-run OpenFGA server.
    - control_id: enc-in-transit
      status: not_applicable
      notes: "A store terminates no connections of its own. The API calls that create and use it travel to the OpenFGA server, whose TLS posture is server deployment configuration (the server's http.tls settings) -- outside this spec, which carries only a name."
    - control_id: no-public-access
      status: not_applicable
      notes: A store has no network endpoint to expose. Whether the OpenFGA API is internet-reachable is decided by how the customer deploys and fronts the server, not by anything in this spec.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network surface exists to filter; the store is an API object addressed only through the OpenFGA server's endpoint.
    - control_id: edge-protection
      status: not_applicable
      notes: A store receives no HTTP requests directly -- request filtering would attach to the OpenFGA server deployment or the proxy in front of it, neither of which this spec configures.
    - control_id: rbac
      status: not_applicable
      notes: "The spec carries a single field (name) and no access-control surface. WHO may call the store's API is the OpenFGA server's authentication configuration (pre-shared keys or OIDC, server-level and unscoped per store); WHAT access the store's contents govern is authored by the OpenFgaAuthorizationModel and OpenFgaRelationshipTuple components deployed into it."
    - control_id: workload-identity
      status: not_applicable
      notes: "The store holds no credentials and authenticates to nothing. The credential the IaC runner presents to the OpenFGA server is the provider connection's concern, documented in iac/permissions.yaml -- no spec field selects between static and federated auth."
    - control_id: no-legacy-auth
      status: not_applicable
      notes: "A store carries no credential path of its own to weaken or disable. The OpenFGA server's authentication method (none, pre-shared key, or OIDC) is server deployment configuration outside this spec."
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: "The spec exposes no audit surface. The OpenFGA server emits structured logs (log-format/log-level server flags) as server-level posture; there is no per-store audit toggle in the OpenFGA API or the modules."
    - control_id: monitoring-integration
      status: not_applicable
      notes: "OpenFGA publishes Prometheus metrics and optional OTLP traces at the server level; no per-store metric surface exists in the API or this spec."
    - control_id: backup-recovery
      status: not_applicable
      notes: "The store object itself is declaratively re-creatable from the manifest, and the authorization data accumulated inside it lives in the OpenFGA server's backing datastore -- backups are that database deployment's posture. Neither the OpenFGA API nor the modules expose a per-store backup surface."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist at this component's level to retain (see backup-recovery); retention is the backing datastore's policy.
    - control_id: multi-zone-ha
      status: not_applicable
      notes: "A store has no placement to configure. Availability is the OpenFGA server deployment's posture -- server replicas plus the datastore's replication (e.g. Postgres primary/replica, which OpenFGA supports server-side) -- none of it reachable from this spec."
    - control_id: deletion-protection
      status: not_applicable
      notes: "Neither the OpenFGA API nor the Terraform provider exposes a deletion-protection flag for stores: a delete request proceeds when issued, removing the store and the authorization data inside it. Protection, where wanted, is an operational concern outside this spec."
    - control_id: managed-patching
      status: not_applicable
      notes: A store is a pure configuration object with no software of its own to patch; upgrading the OpenFGA server binary is the server deployment's channel.
