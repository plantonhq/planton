# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: openfgastore
spec:
  billing_model: free
  free_tier: "A store is a logical container created via the OpenFGA API inside a customer-run OpenFGA server, and OpenFGA is open-source software (Apache-2.0, a CNCF incubating project, verified at openfga.dev and github.com/openfga/openfga) -- no vendor meters store creation, and the software itself carries no license fee no matter how many stores exist."
  notes: "The spec's single field (name) buys nothing -- it is a label on an API object. The real spend lives entirely in the infrastructure that HOSTS the OpenFGA server: the compute running the server binary (a Kubernetes workload, VM, or container service billing as its own component) and the datastore behind it (the Postgres, MySQL, or SQLite instance the server is configured with -- production deployments run a managed database that bills on its own meters). A commercial hosted service such as Okta FGA prices by its own subscription, outside this component's claim, which describes the open-source server the official modules target."
