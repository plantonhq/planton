# AwsLbTargetGroup install profile used as a prerequisite by composed
# kinds (a listener's forward action, a rule's forward action). The
# harness deploys it after the AwsVpc prerequisite (vpcId resolves against the
# VPC) and captures target_group_arn for the dependent's references. Kept
# deliberately simple -- an HTTP group for IP targets with default health
# checks. Full metadata is supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsLbTargetGroup
metadata:
  name: planton-oss-e2e-lbtg-prereq
  id: planton-oss-e2e-lbtg-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awslbtargetgroup
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: planton-oss-e2e-awsvpc-prereq
      fieldPath: status.outputs.vpc_id
  targetType: ip
  port: 8080
  protocol: HTTP
