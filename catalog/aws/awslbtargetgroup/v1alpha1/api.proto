syntax = "proto3";

package dev.planton.aws.awslbtargetgroup.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awslbtargetgroup/v1alpha1/outputs.proto";
import "catalog/aws/awslbtargetgroup/v1alpha1/spec.proto";
import "shared/metadata.proto";

//aws-lb-target-group
message AwsLbTargetGroup {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsLbTargetGroup'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsLbTargetGroupSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsLbTargetGroupStatus status = 5;
}

//aws-lb-target-group status
message AwsLbTargetGroupStatus {
  //outputs
  AwsLbTargetGroupOutputs outputs = 1;
}
