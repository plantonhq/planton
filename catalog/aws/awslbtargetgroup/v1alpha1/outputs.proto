syntax = "proto3";

package dev.planton.aws.awslbtargetgroup.v1alpha1;

// AwsLbTargetGroupOutputs captures the observable outputs of a
// provisioned target group, for listeners, listener rules, ECS services, and
// auto-scaling groups to reference.
message AwsLbTargetGroupOutputs {
  // The ARN of the target group (e.g. "arn:aws:elasticloadbalancing:
  // us-west-2:123456789012:targetgroup/api/50dc6c495c0c9188"). The primary
  // handle other resources reference via status.outputs.target_group_arn --
  // listener forward actions, ECS service load-balancer wiring, and ASG
  // attachments all take this value.
  string target_group_arn = 1;

  // The friendly name of the target group (metadata.name, truncated to the
  // 32-character AWS limit when necessary), for console URLs and CLI
  // commands.
  string target_group_name = 2;

  // The ARN suffix (e.g. "targetgroup/api/50dc6c495c0c9188") used as the
  // TargetGroup dimension in CloudWatch metrics -- the handle alarms and
  // dashboards need.
  string arn_suffix = 3;
}
