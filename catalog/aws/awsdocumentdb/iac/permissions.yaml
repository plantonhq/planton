# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. DocumentDB
# management actions live under the rds: prefix -- there is no docdb:
# action namespace (docdb-elastic is the separate elastic offering). Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awsdocumentdb
spec:
  aws:
    statements:
      - sid: ManageDbCluster
        actions:
          - rds:CreateDBCluster
          - rds:DeleteDBCluster
          - rds:ModifyDBCluster
          - rds:DescribeDBClusters
          - rds:RestoreDBClusterFromSnapshot
          - rds:RestoreDBClusterToPointInTime
          - rds:AddTagsToResource
          - rds:RemoveTagsFromResource
          - rds:ListTagsForResource
        resources:
          - arn:aws:rds:*:*:cluster:*
          - arn:aws:rds:*:*:cluster-pg:*
          - arn:aws:rds:*:*:subgrp:*
          - arn:aws:rds:*:*:cluster-snapshot:*
          - arn:aws:rds:*:*:global-cluster:*
          - arn:aws:rds:*:*:db:*
        provenance: derived
        notes: Covers aws_docdb_cluster across its create shapes -- fresh cluster, snapshot restore, point-in-time restore/clone, and global-cluster join -- plus modify, tagging, and teardown. CreateDBCluster and the Restore* calls authorize against the cluster parameter group and subnet group ARNs resolved for the request (defaults included), the source snapshot on snapshot restores, and the global cluster when global_cluster_identifier is set -- omitting those formats denies the create. Tagging (AddTagsToResource et al.) also authorizes against the instance (db), subnet-group, and parameter-group ARNs the module tags.
      - sid: ManageClusterInstances
        actions:
          - rds:CreateDBInstance
          - rds:DeleteDBInstance
          - rds:ModifyDBInstance
          - rds:DescribeDBInstances
        resources:
          - arn:aws:rds:*:*:db:*
          - arn:aws:rds:*:*:cluster:*
        provenance: derived
        notes: Covers aws_docdb_cluster_instance -- one per spec.instances entry. Creating an instance inside a cluster authorizes against both the db and cluster ARNs.
      - sid: ManageClusterSnapshotsOnLifecycle
        actions:
          - rds:CreateDBClusterSnapshot
          - rds:DeleteDBClusterSnapshot
          - rds:DescribeDBClusterSnapshots
        resources:
          - arn:aws:rds:*:*:cluster-snapshot:*
          - arn:aws:rds:*:*:cluster:*
        provenance: derived
        notes: Final snapshots on teardown (skip_final_snapshot=false) and reads of the source snapshot for restore-based creates.
      - sid: ManageSubnetAndParameterGroups
        actions:
          - rds:CreateDBSubnetGroup
          - rds:DeleteDBSubnetGroup
          - rds:ModifyDBSubnetGroup
          - rds:DescribeDBSubnetGroups
          - rds:CreateDBClusterParameterGroup
          - rds:DeleteDBClusterParameterGroup
          - rds:ModifyDBClusterParameterGroup
          - rds:DescribeDBClusterParameterGroups
          - rds:DescribeDBClusterParameters
        resources:
          - arn:aws:rds:*:*:subgrp:*
          - arn:aws:rds:*:*:cluster-pg:*
        provenance: derived
        notes: Covers the conditional aws_docdb_subnet_group and aws_docdb_cluster_parameter_group satellites -- each created only when the spec provides subnets or inline parameters.
      - sid: DescribeVpcContext
        actions:
          - ec2:DescribeSubnets
          - ec2:DescribeSecurityGroups
          - ec2:DescribeVpcs
        resources:
          - "*"
        provenance: derived
        notes: Subnet-group creation and security-group attachment validate their references. EC2 Describe APIs support no resource-level scoping, so the wildcard is the narrowest possible scope.
      - sid: UseCustomerManagedKeys
        actions:
          - kms:DescribeKey
          - kms:CreateGrant
        resources:
          - arn:aws:kms:*:*:key/*
        provenance: derived
        notes: Required only when kms_key_id (or a per-instance performance_insights_kms_key_id) selects a customer-managed key -- the service creates grants against the key during cluster create.
