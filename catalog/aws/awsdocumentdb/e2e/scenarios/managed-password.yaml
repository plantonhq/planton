# DocumentDB managed-password scenario: the recommended default cluster
# shape. Exercises the folded instances list (one db.t4g.medium instance
# materialized as its own provider resource) and the AWS-managed master
# password (no secret in the manifest or state; the secret ARN surfaces as
# an output). engine_version is deliberately unpinned so the scenario rides
# the current AWS default and never goes stale. The subnet pair prerequisite
# satisfies the two-AZ DB subnet group requirement; no security groups are
# given, so AWS attaches the VPC's default group (the documented default
# this kind preserves). skipFinalSnapshot keeps the destroy phase
# unconditional. Full metadata is supplied for tagging/orphan cleanup.
#
# Free arms proven live on this lane: the tri-state CA-rotation restart
# opt-out set to an EXPLICIT false, and instance-level apply_immediately.
# Evidence bar for BOTH arms is ENGINE-NATIVE, deliberately: AWS accepts
# CertificateRotationRestart and ApplyImmediately only as ModifyDBInstance
# inputs (the provider sends the restart flag solely when
# ca_cert_identifier changes, never at create) and NO describe output
# echoes either -- so the live proof is the Terraform plan rendering
# certificate_rotation_restart = "false" plus the Pulumi preview/state
# carrying the same string (the nullable-bool STRING bridge is the heal
# under proof), with the value state-pinned and armed for the next CA
# rotation. A missing field in DescribeDBInstances here is the API's
# contract, not an engine silently dropping the value.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsDocumentDb
metadata:
  name: planton-oss-e2e-docdb-mmp
  id: planton-oss-e2e-docdb-mmp
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsdocumentdb
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-b
        fieldPath: status.outputs.subnet_id
  masterUsername: e2eadmin
  manageMasterUserPassword: true
  storageEncrypted: true
  instances:
    - name: one
      instanceClass: db.t4g.medium
      certificateRotationRestart: false
      applyImmediately: true
  skipFinalSnapshot: true
