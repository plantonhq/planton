syntax = "proto3";

package dev.planton.aws.awsdocumentdb.v1alpha1;

import "catalog/aws/awsdocumentdb/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsDocumentDbIacInput is the input for the IaC modules that deploy the DocumentDB cluster.
message AwsDocumentDbIacInput {
  // target is the AwsDocumentDb resource to deploy.
  AwsDocumentDb target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
