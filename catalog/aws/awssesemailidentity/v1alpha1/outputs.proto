syntax = "proto3";

package dev.planton.aws.awssesemailidentity.v1alpha1;

// AwsSesEmailIdentityOutputs captures the observable identifiers and
// verification state of the SES email identity.
message AwsSesEmailIdentityOutputs {
  // The Amazon Resource Name (ARN) of the identity -- the resource for
  // identity-policy grants and IAM statements that scope sending.
  string identity_arn = 1;

  // The identity string itself (the domain or email address) -- the join
  // key downstream automation uses to compose DNS names.
  string email_identity = 2;

  // The identity type AWS classified this as: "DOMAIN" or
  // "EMAIL_ADDRESS".
  string identity_type = 3;

  // The identity's verification status at deploy time: "PENDING" until
  // the DKIM CNAMEs (domain) or the confirmation link (email address)
  // have been acted on, then "SUCCESS". A PENDING identity exists but
  // cannot send yet -- publish the dkim_tokens records to complete
  // domain verification.
  string verification_status = 4;

  // Easy DKIM's three CNAME tokens. Publish each as
  // "<token>._domainkey.<domain>" CNAME "<token>.dkim.amazonses.com"
  // (composable with AwsRoute53DnsRecord); SES flips the identity to
  // verified once it sees them. Empty for BYODKIM (you publish your own
  // selector record) and for email-address identities.
  repeated string dkim_tokens = 5;
}
