# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awssesemailidentity
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: An identity stores no message content -- mail transits SES and is never an artifact this component holds. The one secret the spec can carry, the BYODKIM private signing key, is marked sensitive contract-side (never logged, never exported) and lives in SES's managed control plane once delivered.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: With no data store there is no key surface -- the SESv2 identity API exposes no customer-managed-key option.
    - control_id: enc-in-transit
      status: configurable
      field_path: configuration_set
      evidence:
        type: spec_default
        reference: "Unset leaves this identity's mail on SES's transport default -- attempt TLS to the receiving server, fall back to plaintext SMTP. Referencing a configuration set whose delivery_options set tls_policy REQUIRE enforces TLS-or-fail delivery for every message sent from the identity; the transport posture is inherited, decided once on the set."
      notes: The SESv2 management API carrying the identity's own configuration is HTTPS-only regardless.
    - control_id: no-public-access
      status: configurable
      field_path: policies
      evidence:
        type: spec_default
        reference: "With no policies attached, only this account's IAM principals can send as the identity. Each authorization policy widens who may send AS the domain -- a policy naming a wildcard principal would hand the domain's sending reputation to anyone, so grants should name exact account IDs or role ARNs and nothing broader."
      notes: This is the identity's real exposure surface -- it serves no network endpoint, but an over-broad sending grant is the email equivalent of a public bucket.
    - control_id: restricted-ingress
      status: not_applicable
      notes: Nothing listens on an identity; there is no inbound network surface to restrict. Inbound mail handling is a different SES surface with its own components.
    - control_id: edge-protection
      status: not_applicable
      notes: With no request-serving surface there is no WAF attachment point; edge filtering has no meaning for a sending identity.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every operation on the identity and its satellites -- create, DKIM changes, MAIL FROM changes, feedback toggles, policy edits, delete -- is IAM-authorized against the identity's own ARN (arn:aws:ses:region:account:identity/name), so grants can be scoped to exactly this domain.
    - control_id: workload-identity
      status: not_applicable
      notes: An identity runs no user workload -- it is the FROM-address trust anchor. The applications that send through it authenticate to SES with their own IAM credentials on their own components.
    - control_id: no-legacy-auth
      status: configurable
      field_path: dkim_signing.next_signing_key_length
      evidence:
        type: spec_default
        reference: "DKIM is the domain's email-authentication signature, and the key length is its strength dial: unset (and AWS's default) is RSA_2048_BIT; RSA_1024_BIT exists only for DNS providers with 255-character TXT limits and is the weak-crypto choice to avoid when the DNS host allows 2048."
      notes: The custom MAIL FROM domain (mail_from) is the companion posture -- it aligns SPF with the sending domain so DMARC can be enforced downstream; behavior_on_mx_failure REJECT_MESSAGE refuses to send unaligned rather than fall back.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every change to the identity -- a new sending grant, a DKIM rotation, feedback forwarding turned off, deletion -- is a management event captured in CloudTrail unconditionally; widening who may send as the domain is always on the record.
    - control_id: monitoring-integration
      status: configurable
      field_path: configuration_set
      evidence:
        type: spec_default
        reference: Unset means sends from this identity emit no events by default; referencing a configuration set with event destinations gives every message the set's bounce/complaint/delivery feedback loop -- the production observability channel for a sending domain.
      notes: email_forwarding_enabled is the fallback channel -- bounce and complaint notices forwarded by email, on by AWS default. Turn it off only once event destinations carry the feedback; an identity with neither is flying blind on the metrics SES suspends accounts over.
    - control_id: backup-recovery
      status: not_applicable
      notes: There is nothing to back up -- the identity is configuration, recreatable by re-applying the manifest. With the DKIM CNAMEs still published in DNS, a recreated domain identity re-verifies automatically; only the BYODKIM private key must be re-supplied from wherever the operator keeps secrets.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: With no backup facility there is no backup retention to set; no field of this spec governs retention of any stored data.
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: SES is a regional managed service AWS operates across availability zones; the identity has no zonal footprint the manifest could configure. Regional resilience is by design instead -- verify the same domain in each sending region.
    - control_id: deletion-protection
      status: not_applicable
      notes: "No deletion-protection flag exists on an identity. Destroy stops all sending as the domain immediately -- the blast radius is broken sends, not lost data. One retention quirk survives deletion: SES remembers the last-written feedback-forwarding position per identity name (live-verified 2026-08-12), so a recreated identity inherits its old explicit setting rather than AWS's default."
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- AWS operates and patches SES's verification, signing, and sending pipeline (including Easy DKIM key rotation); the identity exposes no runtime, version, or maintenance surface.
