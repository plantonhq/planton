# Domain identity with Easy DKIM and a default configuration set composed
# from the shared AwsSesConfigurationSet fixture. Uses a fixed e2e subdomain
# under planton.test (no Route53 verification required for existence
# checks; the identity stays PENDING).
#
# The fixed name makes GetEmailIdentity's FeedbackForwardingStatus
# HISTORY-DEPENDENT, never asserted: SES retains the last-written
# forwarding value per identity name across identity delete/recreate
# (live-verified 2026-08-12 -- this name echoes false, inherited from
# earlier lanes whose feedback satellite's destroy reset it), so evidence
# claims about AWS's forwarding DEFAULT need a fresh name probe.
#
# Deliberately NOT in the live scenario: identity policies. AWS validates
# CreateEmailIdentityPolicy strictly — the document's Resource must be the
# identity's own ARN (which embeds the account ID and region), so a static
# committed manifest cannot carry one (the live rejection: "Invalid ARN:
# ARNs must start with 'arn:': *"). The policies fold is proven by spec/CEL
# tests and the offline plan gate; the ${...} template-introducer escape
# class is live-proven by the DynamoDB and EFS policy scenarios.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsSesEmailIdentity
metadata:
  name: planton-oss-e2e-awssesidentity
  id: planton-oss-e2e-awssesidentity
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awssesemailidentity
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsSesConfigurationSet"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  emailIdentity: ses-e2e.planton.test
  configurationSet:
    valueFrom:
      kind: AwsSesConfigurationSet
      name: planton-oss-e2e-awssesconfigset-prereq
      fieldPath: status.outputs.configuration_set_name
  dkimSigning:
    nextSigningKeyLength: RSA_2048_BIT
