# AwsTransitGatewayVpcAttachment scenario: a two-AZ attachment on the
# segmented gateway fixture, exercising the option surface -- explicit DNS
# support, appliance mode (the inspection-VPC shape), and pinned-off
# default-table membership (the tri-state contract's explicit-false arm).
# Chains the registry prerequisites: gateway + subnets (VPC transitively).
# Full metadata is supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsTransitGatewayVpcAttachment
metadata:
  name: planton-oss-e2e-awstgwa-twoaz
  id: planton-oss-e2e-awstgwa-twoaz
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awstransitgatewayvpcattachment
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  transitGatewayId:
    valueFrom:
      kind: AwsTransitGateway
      name: planton-oss-e2e-awstgw-prereq
      fieldPath: status.outputs.transit_gateway_id
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: planton-oss-e2e-awsvpc-prereq
      fieldPath: status.outputs.vpc_id
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-b
        fieldPath: status.outputs.subnet_id
  dnsSupport: true
  applianceModeSupport: true
  defaultRouteTableAssociation: false
  defaultRouteTablePropagation: false
