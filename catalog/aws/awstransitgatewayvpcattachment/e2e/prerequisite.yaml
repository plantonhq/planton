# Install fixture consumed by kinds that compose an
# AwsTransitGatewayVpcAttachment (route-table lanes). Two-AZ shape on the
# shared VPC/subnet fixtures and the segmented gateway fixture, with
# default-table membership pinned OFF so a consuming route-table lane can
# associate it explicitly (AWS allows one association per attachment,
# gateway-wide).
apiVersion: aws.planton.dev/v1alpha1
kind: AwsTransitGatewayVpcAttachment
metadata:
  name: planton-oss-e2e-awstgwa-prereq
  id: planton-oss-e2e-awstgwa-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awstransitgatewayvpcattachment
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  transitGatewayId:
    valueFrom:
      kind: AwsTransitGateway
      name: planton-oss-e2e-awstgw-prereq
      fieldPath: status.outputs.transit_gateway_id
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: planton-oss-e2e-awsvpc-prereq
      fieldPath: status.outputs.vpc_id
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-b
        fieldPath: status.outputs.subnet_id
  defaultRouteTableAssociation: false
  defaultRouteTablePropagation: false
