syntax = "proto3";

package dev.planton.aws.awstransitgatewayvpcattachment.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awstransitgatewayvpcattachment/v1alpha1/outputs.proto";
import "catalog/aws/awstransitgatewayvpcattachment/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsTransitGatewayVpcAttachment represents a managed AWS Transit Gateway
// VPC attachment deployed via Planton. This resource connects one VPC to a
// Transit Gateway hub through elastic network interfaces in the chosen
// subnets, making the VPC a spoke of the hub-and-spoke topology.
message AwsTransitGatewayVpcAttachment {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this Transit Gateway VPC attachment resource.
  string kind = 2 [(buf.validate.field).string.const = "AwsTransitGatewayVpcAttachment"];

  // metadata captures identifying information (name, org, version, etc.)
  // and must pass standard validations for resource naming.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the core configuration defining how the attachment is
  // provisioned.
  AwsTransitGatewayVpcAttachmentSpec spec = 4 [(buf.validate.field).required = true];

  // status holds runtime or post-deployment information.
  AwsTransitGatewayVpcAttachmentStatus status = 5;
}

// AwsTransitGatewayVpcAttachmentStatus describes the status fields for a
// Transit Gateway VPC attachment resource.
message AwsTransitGatewayVpcAttachmentStatus {
  // outputs captures the outputs returned by Pulumi/Terraform after
  // provisioning.
  AwsTransitGatewayVpcAttachmentOutputs outputs = 1;
}
