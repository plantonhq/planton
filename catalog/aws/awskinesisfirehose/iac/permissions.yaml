# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awskinesisfirehose
spec:
  aws:
    statements:
      - sid: ManageDeliveryStream
        actions:
          - firehose:CreateDeliveryStream
          - firehose:DescribeDeliveryStream
          - firehose:UpdateDestination
          - firehose:DeleteDeliveryStream
          - firehose:StartDeliveryStreamEncryption
          - firehose:StopDeliveryStreamEncryption
          - firehose:TagDeliveryStream
          - firehose:UntagDeliveryStream
          - firehose:ListTagsForDeliveryStream
        resources:
          - arn:aws:firehose:*:*:deliverystream/*
        provenance: derived
        notes: Covers aws_kinesis_firehose_delivery_stream (and its Pulumi twin), the module's single resource. Destination configuration changes flow through UpdateDestination (the destination TYPE itself is ForceNew -- a type change is a delete-and-create). Toggling sse_enabled after creation calls Start/StopDeliveryStreamEncryption, and CreateDeliveryStream folds in firehose:TagDeliveryStream when tags ride the create. Every action here scopes to the deliverystream ARN per the service reference.
      - sid: PassDeliveryRoles
        actions:
          - iam:PassRole
        resources:
          - arn:aws:iam::*:role/*
        provenance: derived
        notes: Creating or updating the stream passes every role the manifest references -- the destination's role_arn (required on all eight destination shapes), the source roles (kinesis_stream_source.role_arn, msk_source.role_arn), processor roles, vpc_config.role_arn for ENI management, and secrets_manager_config roles. Firehose assumes them at runtime for its reads and writes. Add an iam:PassedToService=firehose.amazonaws.com condition and narrow to the actual role ARNs in a hardened deployment.
