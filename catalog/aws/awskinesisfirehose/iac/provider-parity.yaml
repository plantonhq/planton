      - spec: spec.opensearch.s3_config.buffering.interval_in_seconds
        arg: opensearch_configuration.s3_configuration.buffering_interval
      - spec: spec.opensearch.s3_config.buffering.size_in_mbs
        arg: opensearch_configuration.s3_configuration.buffering_size
