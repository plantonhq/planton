      - arg: opensearchserverless_configuration.processing_configuration.processors.parameters.parameter_name
        reason: rendered from the typed processor arms (spec.opensearch_serverless.processing.processors) -- normalized into the provider's generic vocabulary
      - arg: opensearchserverless_configuration.processing_configuration.processors.parameters.parameter_value
        reason: rendered from the typed processor arms (spec.opensearch_serverless.processing.processors) -- normalized into the provider's generic vocabulary
      - arg: http_endpoint_configuration.processing_configuration.processors.type
        reason: rendered from the typed processor arms (spec.http_endpoint.processing.processors) -- normalized into the provider's generic vocabulary
      - arg: http_endpoint_configuration.processing_configuration.processors.parameters.parameter_name
        reason: rendered from the typed processor arms (spec.http_endpoint.processing.processors) -- normalized into the provider's generic vocabulary
      - arg: http_endpoint_configuration.processing_configuration.processors.parameters.parameter_value
        reason: rendered from the typed processor arms (spec.http_endpoint.processing.processors) -- normalized into the provider's generic vocabulary
      - arg: redshift_configuration.processing_configuration.processors.type
        reason: rendered from the typed processor arms (spec.redshift.processing.processors) -- normalized into the provider's generic vocabulary
      - arg: redshift_configuration.processing_configuration.processors.parameters.parameter_name
        reason: rendered from the typed processor arms (spec.redshift.processing.processors) -- normalized into the provider's generic vocabulary
      - arg: redshift_configuration.processing_configuration.processors.parameters.parameter_value
        reason: rendered from the typed processor arms (spec.redshift.processing.processors) -- normalized into the provider's generic vocabulary
      - arg: splunk_configuration.processing_configuration.processors.type
