      - arg: opensearch_configuration.processing_configuration.processors.parameters.parameter_name
        reason: rendered from the typed processor arms (spec.opensearch.processing.processors) -- normalized into the provider's generic vocabulary
      - arg: opensearch_configuration.processing_configuration.processors.parameters.parameter_value
        reason: rendered from the typed processor arms (spec.opensearch.processing.processors) -- normalized into the provider's generic vocabulary
      - arg: opensearchserverless_configuration.processing_configuration.processors.type
