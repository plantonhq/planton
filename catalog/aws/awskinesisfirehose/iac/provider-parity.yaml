      - spec: spec.opensearch.buffering.size_in_mbs
        arg: opensearch_configuration.buffering_size
      - spec: spec.opensearch.retry_duration_in_seconds
        arg: opensearch_configuration.retry_duration
      - spec: spec.opensearch.logging
        arg: opensearch_configuration.cloudwatch_logging_options
      - spec: spec.opensearch.processing
