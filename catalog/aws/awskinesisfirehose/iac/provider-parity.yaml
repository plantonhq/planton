# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# Reading guide: the spec names each destination without the provider's
# _configuration suffix (extended_s3, opensearch, ...), groups buffering as
# interval_in_seconds/size_in_mbs under one message, calls every
# cloudwatch_logging_options block `logging`, every staging/backup S3 block
# `s3_config`/`s3_backup`, and every secrets_manager_configuration block
# `secrets_manager` -- so each destination carries the same small mapping
# set below its subtree root, and exact matching covers the rest.

resources:
  aws_kinesis_firehose_delivery_stream:
    mappings:
      # --- Sources -----------------------------------------------------
      - spec: spec.kinesis_stream_source
        arg: kinesis_source_configuration
      - spec: spec.kinesis_stream_source.stream_arn
        arg: kinesis_source_configuration.kinesis_stream_arn
      # The MSK authentication wrapper (single-use) is flattened into the
      # source message.
      - spec: spec.msk_source
        arg: msk_source_configuration
      - spec: spec.msk_source.connectivity
        arg: msk_source_configuration.authentication_configuration.connectivity
      - spec: spec.msk_source.role_arn
        arg: msk_source_configuration.authentication_configuration.role_arn

      # --- Server-side encryption (Direct PUT only) --------------------
      - spec: spec.sse_enabled
        arg: server_side_encryption.enabled
      - spec: spec.sse_kms_key_arn
        arg: server_side_encryption.key_arn

      # --- Extended S3 destination --------------------------------------
      - spec: spec.extended_s3
        arg: extended_s3_configuration
      - spec: spec.extended_s3.buffering.interval_in_seconds
        arg: extended_s3_configuration.buffering_interval
      - spec: spec.extended_s3.buffering.size_in_mbs
