        arg: http_endpoint_configuration.buffering_size
      - spec: spec.http_endpoint.retry_duration_in_seconds
        arg: http_endpoint_configuration.retry_duration
      - spec: spec.http_endpoint.logging
        arg: http_endpoint_configuration.cloudwatch_logging_options
      - spec: spec.http_endpoint.processing
        arg: http_endpoint_configuration.processing_configuration
      - spec: spec.http_endpoint.request_config
        arg: http_endpoint_configuration.request_configuration
      - spec: spec.http_endpoint.secrets_manager
        arg: http_endpoint_configuration.secrets_manager_configuration
      - spec: spec.http_endpoint.s3_config
        arg: http_endpoint_configuration.s3_configuration
      - spec: spec.http_endpoint.s3_config.buffering.interval_in_seconds
        arg: http_endpoint_configuration.s3_configuration.buffering_interval
      - spec: spec.http_endpoint.s3_config.buffering.size_in_mbs
        arg: http_endpoint_configuration.s3_configuration.buffering_size
      - spec: spec.http_endpoint.s3_config.logging
