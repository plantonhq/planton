      - spec: spec.extended_s3.s3_backup.buffering.size_in_mbs
        arg: extended_s3_configuration.s3_backup_configuration.buffering_size
      - spec: spec.extended_s3.s3_backup.logging
        arg: extended_s3_configuration.s3_backup_configuration.cloudwatch_logging_options
      - spec: spec.extended_s3.dynamic_partitioning
        arg: extended_s3_configuration.dynamic_partitioning_configuration
      - spec: spec.extended_s3.dynamic_partitioning.retry_duration_in_seconds
        arg: extended_s3_configuration.dynamic_partitioning_configuration.retry_duration
      # Data format conversion: the provider's single-use
      # input_format_configuration.deserializer / output_format_configuration.serializer
      # wrappers are flattened -- the spec's four arms sit directly on the
      # conversion message, and arm presence selects the format.
      - spec: spec.extended_s3.data_format_conversion
        arg: extended_s3_configuration.data_format_conversion_configuration
      - spec: spec.extended_s3.data_format_conversion.open_x_json
        arg: extended_s3_configuration.data_format_conversion_configuration.input_format_configuration.deserializer.open_x_json_ser_de
      - spec: spec.extended_s3.data_format_conversion.hive_json
        arg: extended_s3_configuration.data_format_conversion_configuration.input_format_configuration.deserializer.hive_json_ser_de
      - spec: spec.extended_s3.data_format_conversion.parquet
        arg: extended_s3_configuration.data_format_conversion_configuration.output_format_configuration.serializer.parquet_ser_de
      - spec: spec.extended_s3.data_format_conversion.orc
        arg: extended_s3_configuration.data_format_conversion_configuration.output_format_configuration.serializer.orc_ser_de
      - spec: spec.extended_s3.data_format_conversion.schema
        arg: extended_s3_configuration.data_format_conversion_configuration.schema_configuration

