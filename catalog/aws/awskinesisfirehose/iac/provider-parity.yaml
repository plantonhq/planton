  - field: spec.extended_s3.processing.processors
    reason: typed arms normalized into the provider's generic processors.type/parameters pairs (judged on the consuming destination's processing exclusions)
  - field: spec.opensearch.processing.processors
    reason: typed arms normalized into the provider's generic processors.type/parameters pairs (judged on the consuming destination's processing exclusions)
