    exclusions:
      # --- Top-level machinery and derived values -------------------------
      - arg: name
        reason: wired by the module from metadata.name (the delivery stream name; ForceNew)
      - arg: destination
        reason: wired by the module from the destination oneof arm -- each arm renders its configuration block plus the matching destination string
      - arg: arn
        reason: legacy Optional+Computed attribute -- AWS always assigns the ARN; read back as the delivery_stream_arn output, never real configuration
      - arg: destination_id
        reason: provider handshake attribute (Optional+Computed) -- exposed as the destination_id output, never user surface
      - arg: version_id
        reason: provider handshake attribute (Optional+Computed) -- exposed as the version_id output, never user surface
      - arg: server_side_encryption.key_type
        reason: derived by the module from sse_kms_key_arn presence -- CUSTOMER_MANAGED_CMK when a key is set, AWS_OWNED_CMK otherwise
      - arg: tags
        reason: wired by the module from metadata (the Name tag plus the planton.ai identity keys) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own

      # --- Typed processor arms vs the provider's generic vocabulary ------
      # The spec models the pipeline as typed arms (lambda,
      # metadata_extraction, decompression, cloudwatch_log_processing,
      # append_delimiter, record_deaggregation); the modules normalize them
      # into the provider's generic type/parameters pairs once, shared by
      # every destination. Per-arm judgment under specExclusions.
      - arg: extended_s3_configuration.processing_configuration.processors.type
        reason: rendered from the typed processor arms (spec.extended_s3.processing.processors) -- normalized into the provider's generic vocabulary
      - arg: extended_s3_configuration.processing_configuration.processors.parameters.parameter_name
        reason: rendered from the typed processor arms (spec.extended_s3.processing.processors) -- normalized into the provider's generic vocabulary
      - arg: extended_s3_configuration.processing_configuration.processors.parameters.parameter_value
        reason: rendered from the typed processor arms (spec.extended_s3.processing.processors) -- normalized into the provider's generic vocabulary
      - arg: opensearch_configuration.processing_configuration.processors.type
