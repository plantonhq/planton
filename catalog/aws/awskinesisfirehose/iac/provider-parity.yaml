      - spec: spec.iceberg.destination_tables
        arg: iceberg_configuration.destination_table_configuration
      - spec: spec.iceberg.s3_config
        arg: iceberg_configuration.s3_configuration
      - spec: spec.iceberg.s3_config.buffering.interval_in_seconds
        arg: iceberg_configuration.s3_configuration.buffering_interval
      - spec: spec.iceberg.s3_config.buffering.size_in_mbs
