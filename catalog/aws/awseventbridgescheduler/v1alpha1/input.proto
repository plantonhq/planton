syntax = "proto3";

package dev.planton.aws.awseventbridgescheduler.v1alpha1;

import "catalog/aws/awseventbridgescheduler/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsEventBridgeSchedulerIacInput is the input for the IaC modules
// that manage an EventBridge Scheduler schedule (and optionally its
// group).
message AwsEventBridgeSchedulerIacInput {
  // target is the AwsEventBridgeScheduler resource to deploy.
  AwsEventBridgeScheduler target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
