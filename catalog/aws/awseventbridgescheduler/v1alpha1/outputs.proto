syntax = "proto3";

package dev.planton.aws.awseventbridgescheduler.v1alpha1;

// AwsEventBridgeSchedulerOutputs captures the observable state of
// the schedule (and owned group) after apply.
message AwsEventBridgeSchedulerOutputs {
  // The schedule's ARN.
  string schedule_arn = 1;

  // The group the schedule lives in - the owned group's name, the
  // joined group_name, or "default". With the schedule name
  // (metadata.name), this forms the provider's "{group}/{name}" import
  // ID.
  string group_name = 2;

  // The owned group's ARN. Empty when the instance owns no group.
  string group_arn = 3;
}
