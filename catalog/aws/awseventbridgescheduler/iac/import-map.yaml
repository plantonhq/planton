# Where each placeholder in this component's import-ID formats comes
# from (the formats themselves live in aa_import/catalog.yaml).
apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awseventbridgescheduler
spec:
  values:
    - name: group_name
      derivations:
        - from_output: group_name
      where_to_find: >-
        EventBridge console -> Scheduler -> Schedules (the Group
        column; "default" for ungrouped schedules), or
        `aws scheduler list-schedules` (GroupName).
    - name: schedule_name
      derivations:
        - from_metadata_name: true
      where_to_find: >-
        The component's metadata.name (the schedule's name in AWS), or
        `aws scheduler list-schedules` (Name).
