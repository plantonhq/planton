# AwsBedrockAgentCoreIdentity minimal scenario: one workload identity --
# the smallest arm of the bundle. Fixture-free.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsBedrockAgentCoreIdentity
metadata:
  name: planton-oss-e2e-awsacid-min
  id: planton-oss-e2e-awsacid-min
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsbedrockagentcoreidentity
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  workloadIdentities:
    - name: planton-e2e-workload-min
