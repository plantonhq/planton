# AwsBedrockAgentCoreIdentity full-surface scenario: every arm of the
# bundle -- a workload identity with return URLs, a vaulted API key, a
# CUSTOM-vendor OAuth2 provider (discovery by URL against a real public
# OIDC document), and a Cedar policy engine with one policy. The
# credential values are throwaway test literals: the lanes prove the
# vaulting mechanics (AWS stores them in Secrets Manager under the token
# vault), never real credentials.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsBedrockAgentCoreIdentity
metadata:
  name: planton-oss-e2e-awsacid-full
  id: planton-oss-e2e-awsacid-full
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsbedrockagentcoreidentity
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  workloadIdentities:
    - name: planton-e2e-workload-full
      # AWS validates return URLs server-side and rejects
      # reserved/documentation TLDs (".test" fails with "Invalid redirect
      # url"); a real-TLD https URL or http://localhost is required.
      allowedResourceOauth2ReturnUrls:
        - https://e2e.planton.ai/oauth/callback
  apiKeyCredentialProviders:
    - name: planton-e2e-api-key
      apiKey: planton-e2e-throwaway-key-value
  oauth2CredentialProviders:
    - name: planton-e2e-custom-idp
      vendor: CUSTOM
      clientId: planton-e2e-client
      clientSecret: planton-e2e-throwaway-secret
      oauthDiscovery:
        discoveryUrl: https://accounts.google.com/.well-known/openid-configuration
  policyEngine:
    engineName: planton_e2e_authz
    description: Planton E2E policy engine
    policies:
      - name: allow_reads
        description: Permit the read action for every principal
        # AWS rejects a fully-wildcard resource at CreatePolicy ("a
        # wildcard resource was detected") -- the statement must
        # constrain resource to a specific AgentCore::Gateway or to the
        # AgentCore::Gateway resource TYPE, as below (live-caught
        # 2026-08-14; the type constraint probed accepted).
        cedarStatement: 'permit(principal, action, resource is AgentCore::Gateway);'
        validationMode: IGNORE_ALL_FINDINGS
