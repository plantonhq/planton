syntax = "proto3";

package dev.planton.aws.awsbedrockagentcoreidentity.v1alpha1;

import "catalog/aws/awsbedrockagentcoreidentity/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsBedrockAgentCoreIdentityIacInput is the input for the IaC modules
// that deploy the AgentCore identity bundle.
message AwsBedrockAgentCoreIdentityIacInput {
  // target is the AwsBedrockAgentCoreIdentity resource to deploy.
  AwsBedrockAgentCoreIdentity target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
