apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awsbedrockagentcoreidentity
spec:
  # The workload identities and credential providers import by NAME (their
  # AWS identity), which is exactly the module's for_each address key. The
  # policy engine imports by its id; each policy composes the engine id
  # with its own id, derived blind from the policy_ids output map.
  values:
    - name: name
      derivations:
        - from_address_key: true
      where_to_find: >-
        The resource name IS its AWS identity -- each workload_identities /
        api_key_credential_providers / oauth2_credential_providers entry's
        name (`aws bedrock-agentcore-control list-workload-identities` /
        `list-api-key-credential-providers` /
        `list-oauth2-credential-providers` show name).
    - name: policy_engine_id
      derivations:
        - from_output: policy_engine_id
      where_to_find: >-
        Bedrock AgentCore console -> Policy engines -> <engine> (the ID),
        or `aws bedrock-agentcore-control list-policy-engines`
        (policyEngineId).
    - name: policy_id
      derivations:
        - from_output_keyed_by_address: policy_ids
      where_to_find: >-
        `aws bedrock-agentcore-control list-policies --policy-engine-id
        <id>` lists policyId per policy; match each to its
        spec.policy_engine.policies entry by name.
