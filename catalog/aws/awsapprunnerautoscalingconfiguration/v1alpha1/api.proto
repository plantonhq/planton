syntax = "proto3";

package dev.planton.aws.awsapprunnerautoscalingconfiguration.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsapprunnerautoscalingconfiguration/v1alpha1/outputs.proto";
import "catalog/aws/awsapprunnerautoscalingconfiguration/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsAppRunnerAutoScalingConfiguration is the API envelope for an App Runner
// auto scaling configuration -- the reusable, versioned scaling policy that
// App Runner services reference to control concurrency-based instance
// scaling.
message AwsAppRunnerAutoScalingConfiguration {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this resource, must be
  // "AwsAppRunnerAutoScalingConfiguration".
  string kind = 2 [(buf.validate.field).string.const = "AwsAppRunnerAutoScalingConfiguration"];

  // metadata captures identifying information (name, org, environment,
  // labels) and must pass standard validations for resource naming.
  // The configuration's AWS name is metadata.name; revisions register under
  // this name.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the desired configuration of the auto scaling configuration.
  AwsAppRunnerAutoScalingConfigurationSpec spec = 4 [(buf.validate.field).required = true];

  // status holds post-deployment information.
  AwsAppRunnerAutoScalingConfigurationStatus status = 5;
}

// AwsAppRunnerAutoScalingConfigurationStatus describes the status of an App
// Runner auto scaling configuration resource.
message AwsAppRunnerAutoScalingConfigurationStatus {
  // outputs captures the observable values returned by Pulumi/Terraform
  // after provisioning.
  AwsAppRunnerAutoScalingConfigurationOutputs outputs = 1;
}
