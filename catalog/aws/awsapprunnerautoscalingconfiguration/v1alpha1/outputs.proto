syntax = "proto3";

package dev.planton.aws.awsapprunnerautoscalingconfiguration.v1alpha1;

// AwsAppRunnerAutoScalingConfigurationOutputs captures observable
// identifiers from a provisioned App Runner auto scaling configuration.
// Services reference the configuration by its revision-carrying ARN.
message AwsAppRunnerAutoScalingConfigurationOutputs {
  // The ARN of this configuration revision (e.g. "arn:aws:apprunner:
  // us-west-2:123456789012:autoscalingconfiguration/my-asc/3/abc123").
  // The ARN carries the revision number, so registering a new revision
  // changes this output and rolls referencing services on their next
  // deployment.
  string configuration_arn = 1;

  // The revision this deployment registered (e.g. 3). Revisions are
  // immutable; every value change registers the next number under the same
  // configuration name.
  int64 configuration_revision = 2;

  // Whether this revision is the latest one registered under the
  // configuration name.
  bool latest = 3;

  // Whether this configuration holds the account/region default
  // designation at the end of the deployment (true when
  // set_as_account_default claimed it).
  bool is_default = 4;
}
