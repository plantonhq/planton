# Fargate compute environment on the shared subnet + security-group
# fixtures: the zero-instance shape (no EC2 is ever launched -- Fargate only
# provisions capacity when jobs run, and this lane submits none). The
# registry declares the AwsSubnet prerequisite; the security group is
# scenario-declared optional composition. The EC2/SPOT arm is proven by the
# spec tests and the offline plan gate -- an EC2 lane would exercise the same
# provider payload without launching instances either (min/desired 0).
apiVersion: aws.planton.dev/v1alpha1
kind: AwsBatchComputeEnvironment
metadata:
  name: planton-oss-e2e-awsbat
  id: planton-oss-e2e-awsbat
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsbatchcomputeenvironment
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsSecurityGroup"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  computeResources:
    type: FARGATE
    maxVcpus: 16
    subnetIds:
      - valueFrom:
          kind: AwsSubnet
          name: planton-oss-e2e-awssubnet-prereq-a
          fieldPath: status.outputs.subnet_id
      - valueFrom:
          kind: AwsSubnet
          name: planton-oss-e2e-awssubnet-prereq-b
          fieldPath: status.outputs.subnet_id
    securityGroupIds:
      - valueFrom:
          kind: AwsSecurityGroup
          name: planton-oss-e2e-awssg-prereq
          fieldPath: status.outputs.security_group_id
