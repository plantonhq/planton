syntax = "proto3";

package dev.planton.aws.awsbatchcomputeenvironment.v1alpha1;

import "catalog/aws/awsbatchcomputeenvironment/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsBatchComputeEnvironmentIacInput is the input for the IaC modules that
// deploy the Batch compute environment, job queues, and scheduling policy.
message AwsBatchComputeEnvironmentIacInput {
  // target is the AwsBatchComputeEnvironment resource to deploy.
  AwsBatchComputeEnvironment target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
