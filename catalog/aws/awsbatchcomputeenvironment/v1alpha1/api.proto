syntax = "proto3";

package dev.planton.aws.awsbatchcomputeenvironment.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsbatchcomputeenvironment/v1alpha1/outputs.proto";
import "catalog/aws/awsbatchcomputeenvironment/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsBatchComputeEnvironment is the API envelope for an AWS Batch MANAGED
// compute environment -- the elastic EC2 / Spot / Fargate compute pool that
// AWS Batch scales to run jobs. Queues (AwsBatchJobQueue) map onto it and
// job definitions (AwsBatchJobDefinition) describe what runs on it.
message AwsBatchComputeEnvironment {
  // api_version specifies the API version for this resource.
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  // kind identifies this resource type.
  string kind = 2 [(buf.validate.field).string.const = 'AwsBatchComputeEnvironment'];

  // metadata contains standard resource metadata including name, labels, and annotations.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec defines the desired state of the Batch compute environment.
  AwsBatchComputeEnvironmentSpec spec = 4 [(buf.validate.field).required = true];

  // status contains the observed state and outputs from the deployment.
  AwsBatchComputeEnvironmentStatus status = 5;
}

// AwsBatchComputeEnvironmentStatus contains the status and outputs for the
// Batch compute environment.
message AwsBatchComputeEnvironmentStatus {
  // outputs contains the values exported from the IaC stack after deployment.
  AwsBatchComputeEnvironmentOutputs outputs = 1;
}
