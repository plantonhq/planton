apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsorganizationaccount
spec:
  # A member account under live E2E: creation, contact satellites, and
  # the close-on-destroy path. NOTE this kind's deferral is stronger
  # than the family's org-wall: even with an organization available,
  # member-account creation is NEVER zero-orphan - CloseAccount leaves
  # a ~90-day PENDING_CLOSURE residue and is quota-limited per rolling
  # 30 days, and RemoveAccountFromOrganization leaves a LIVE standalone
  # account. Treat any future live lane as an explicit owner call with
  # a real teardown budget, never a routine proof.
  #
  # Deliberately not exercised (beyond the deferral):
  # - the regions arm -- opt-in region enable/disable are ~60-minute
  #   operations each way (and delete is a no-op by design);
  # - create_govcloud -- a second (GovCloud) account per run;
  # - parent_id moves -- need a second OU fixture; the move is an
  #   in-place MoveAccount, representative from the schema.
  #
  # Verification is DescribeAccount keyed on account_id (state ACTIVE;
  # GetAlternateContact per configured arm).
  tier: 1
  status: deferred
  deferred_reason: >-
    Deferred by owner decision (2026-08-16, the standing org-wall
    class, PLUS the member-account orphan wall): account creation
    requires a management account, and neither destroy path is
    zero-orphan (close = ~90-day PENDING_CLOSURE + closure quota;
    remove = a live standalone account). The kind is offline-proven
    (green tofu plan + pulumi preview per engine). Unblock: an owner
    decision accepting the closure residue on an org-capable account -
    a deliberate budgeted run, not a routine lane.
  timeout_minutes: 30
