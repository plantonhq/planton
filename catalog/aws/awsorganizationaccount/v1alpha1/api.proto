syntax = "proto3";

package dev.planton.aws.awsorganizationaccount.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsorganizationaccount/v1alpha1/outputs.proto";
import "catalog/aws/awsorganizationaccount/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsOrganizationAccount {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsOrganizationAccount'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsOrganizationAccountSpec spec = 4 [(buf.validate.field).required = true];
  AwsOrganizationAccountStatus status = 5;
}

message AwsOrganizationAccountStatus {
  AwsOrganizationAccountOutputs outputs = 1;
}
