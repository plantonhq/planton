# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: awsorganizationaccount
spec:
  billing_model: free
  free_tier: "The AWS Organizations pricing page covers account creation with the service itself: 'AWS Organizations is offered at no additional charge. You are charged only for AWS resources that users and roles in your member accounts use.' Creating a member account, placing it in the OU tree, naming its cross-account role, setting contacts, and enabling opt-in regions carry no meter -- an empty member account accrues exactly nothing."
  notes: "The routing matters more than the zero. Spend appears the moment workloads are deployed INSIDE the member account, and each of those bills as its own component against the member account's usage -- then, because this account is an organization member, the pricing page's payer rule applies: 'The owner of the management account is responsible for paying for all usage, data, and resources used by the accounts in the organization.' So this object creates a new place for spend to originate and rolls that spend up to the management account's consolidated bill, without ever billing for itself. No spec arm changes that: iam_user_access_to_billing only gates who may SEE billing data, regions enablement opens opt-in regions for future workloads without charging for the opening, create_govcloud creates a companion GovCloud account that is equally free until used, and the contact arms are postal metadata. Even the delete contract is meter-free -- removal leaves a standalone account (which then needs its own billing details), and closure suspends the account through a ~90-day PENDING_CLOSURE with nothing billed for the closing itself."
