# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsorganizationaccount
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The member-account object stores no customer data -- its name, placement, contacts, and region switches are Organizations and Account Management control-plane metadata held inside AWS's own service infrastructure, not a data store this component owns.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: There is no data at rest to key (see enc-at-rest); neither Organizations nor Account Management exposes a KMS surface for the account object.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The account object terminates no connections of its own. The only wire traffic involving it -- Organizations and Account Management API calls from the management account -- happens on AWS API endpoints, which serve exclusively over TLS as provider behavior, not per-account configuration.
    - control_id: no-public-access
      status: not_applicable
      notes: A member account has no network endpoint to expose. What its workloads expose is decided by the resources deployed inside it, each governed on its own catalog kind.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network surface exists to filter; the account is a governance boundary, not an addressable resource.
    - control_id: edge-protection
      status: not_applicable
      notes: The account object receives no HTTP requests -- web ACLs and request filters have nothing to attach to.
    - control_id: rbac
      status: configurable
      field_path: role_name
      evidence:
        type: spec_default
        reference: "Cross-account administrative access into the new member account rides the IAM role AWS pre-creates at account creation, trusting the management account -- role_name names it (unset means AWS's default 'OrganizationAccountAccessRole'). It is write-once: AWS exposes no API to read it back, and both modules deliberately ignore later changes. Placement through parent_id is the other access lever -- the account inherits every SCP attached to its OU chain the moment it lands there."
      notes: iam_user_access_to_billing narrows who inside the account may access billing information -- DENY locks it to the root user, and the field is immutable (changing it forces replacement). All management-plane calls this component makes are IAM-authorized from the management account.
    - control_id: workload-identity
      status: not_applicable
      notes: The account object runs no workload. How workloads inside the member account authenticate is decided per workload on its own catalog kind (roles, OIDC providers).
    - control_id: no-legacy-auth
      status: not_applicable
      notes: Account creation necessarily mints a root user on the email this spec carries -- that long-lived credential path is not disableable from this component. Centrally removing member-account root credentials is the AwsOrganization kind's root_access_management arm (IAM's RootCredentialsManagement feature), governed there.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: The spec exposes no audit surface. Organizations and Account Management calls against the account are recorded by AWS CloudTrail as account-level posture, and capturing the member account's own activity is an organization trail's job on the AwsCloudtrail kind.
    - control_id: monitoring-integration
      status: not_applicable
      notes: Neither Organizations nor Account Management publishes CloudWatch metrics for a member account object; account lifecycle signals surface through CloudTrail events, outside this spec and the modules.
    - control_id: backup-recovery
      status: not_applicable
      notes: "The account object holds no data to back up, but it is NOT freely re-creatable either: the root email is unique across all of AWS, closures are quota-limited per rolling 30 days, and a closed account sits in PENDING_CLOSURE ~90 days. Treat member accounts as long-lived rather than recoverable-by-recreate."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Organizations and Account Management are global control-plane services -- AWS replicates account state across its own infrastructure; the regions arm opens opt-in regions for workloads but places nothing zonal itself.
    - control_id: deletion-protection
      status: configurable
      field_path: close_on_deletion
      evidence:
        type: spec_default
        reference: "The default (false) means destroy never destroys the account -- it is REMOVED from the organization and survives standalone (AWS requires the account to carry standalone billing information for the removal to even succeed). Only an explicit close_on_deletion=true makes destroy CLOSE the account, and even then AWS suspends it in PENDING_CLOSURE for ~90 days before permanent deletion -- a built-in recovery window -- with closures quota-limited per rolling 30 days."
      notes: Both modules pin the flag explicitly, so the manifest always records which delete contract is in force. Neither path is a clean immediate delete, by AWS's design.
    - control_id: managed-patching
      status: not_applicable
      notes: The account object is pure configuration with no software to patch.
