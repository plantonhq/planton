# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: awsbedrockmodelaccess
spec:
  billing_model: free
  free_tier: "A model-access agreement is an entitlement, not a resource -- the Bedrock pricing page hangs every charge on model usage (per-token inference, provisioned throughput, batch, fine-tuning) and lists no meter for holding access, and the modules accept the model's PUBLIC offer, whose subscription component is $0 for Bedrock serverless models. AWS's model-access documentation frames access as the default posture ('Access to all Amazon Bedrock foundation models is enabled by default with the correct AWS Marketplace permissions') -- what you pay for is invoking, at the model's published rates. The Anthropic use-case form is a compliance record with no charge attached."
  notes: "No field of this spec buys anything: region and model_id select WHICH entitlement to accept, and use_case_form files the account-global Anthropic questionnaire -- all control-plane paperwork. The real spend is everything this grant unlocks: the first InvokeModel after acceptance starts the model's per-token meters (billed as Bedrock usage against the account, visible on the pricing page's per-model rate cards), and heavier commitments layered on top -- provisioned throughput, fine-tuning jobs, batch inference -- are their own deliberate acts with their own meters. One boundary to know: this kind covers Bedrock serverless foundation models whose public offers carry $0 subscriptions; Marketplace-listed models deployed to endpoints (Bedrock Marketplace) carry seller-priced software fees plus SageMaker infrastructure, a different product with different components. Destroying this component cancels the agreement and removes the region's access -- it stops future invocations, and costs nothing either way."
