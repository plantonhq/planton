# AwsKinesisStream install profile used as a prerequisite by composed
# kinds (the enhanced fan-out consumer's registry prerequisite; any
# scenario composing a stream via the e2e-prerequisites annotation). An
# ON_DEMAND stream: nothing else must exist first and there is no shard
# capacity to plan, so the fixture deploys in seconds at negligible cost.
# enforceConsumerDeletion guards teardown -- if a dependent lane ever fails
# between consumer deploy and consumer destroy, the stream can still delete
# itself instead of erroring on the registered consumer. Full metadata is
# supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsKinesisStream
metadata:
  name: planton-oss-e2e-awskinesisstream-prereq
  id: planton-oss-e2e-awskinesisstream-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awskinesisstream
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  streamMode: ON_DEMAND
  enforceConsumerDeletion: true
