# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. This component deliberately ships no
# estimate model: its presets commit real spend (desired_count copies of a
# task), but the per-copy rate lives on the referenced AwsEcsTaskDefinition's
# cpu/memory -- invisible in this manifest, so a dollar figure here would be
# a guess wearing a dollar sign. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: awsecsservice
spec:
  billing_model: hybrid
  baseline_charges:
    - service_name: AWS Fargate
      sku_meter: task vCPU hours
      pricing_unit: vCPU-hours
      description: Every running task bills its task definition's vCPU allocation per hour, around the clock, from placement to stop -- desired_count times the referenced AwsEcsTaskDefinition's cpu is the bill's core, and that rate lives on the other component.
    - service_name: AWS Fargate
      sku_meter: task memory hours
      pricing_unit: GB-hours
      description: The memory half of the same always-on bill -- each running task's GB allocation per hour, sized by the referenced task definition.
  cost_drivers:
    - field_path: desired_count
      sku_meter: task vCPU hours
      pricing_unit: vCPU-hours
      impact: The direct multiplier -- how many copies of the task bill around the clock.
    - field_path: capacity_provider_strategy
      sku_meter: task vCPU hours
      pricing_unit: vCPU-hours
      impact: The FARGATE vs FARGATE_SPOT split -- Spot tasks run roughly 70% below the On-Demand rate, interruptible with two minutes' notice.
    - field_path: launch_type
      sku_meter: task vCPU hours
      pricing_unit: vCPU-hours
      impact: FARGATE bills per task; EC2 shifts compute cost onto the cluster's instance capacity, billed there instead.
    - field_path: autoscaling.min_tasks
      sku_meter: task vCPU hours
      pricing_unit: vCPU-hours
      impact: The always-on floor -- autoscaling never goes below it, so it is the committed part of a scaled service's bill.
    - field_path: autoscaling.max_tasks
      sku_meter: task vCPU hours
      pricing_unit: vCPU-hours
      impact: The spend ceiling -- the most copies autoscaling may bill during load.
    - field_path: volume_configuration.managed_ebs_volume.size_in_gb
      sku_meter: task EBS storage
      pricing_unit: GB-months
      impact: Each running task carries its own EBS volume of this size, billed per GB-month while the task lives (gp3 IOPS and throughput above baseline bill separately).
    - field_path: deployment_maximum_percent
      sku_meter: task vCPU hours
      pricing_unit: vCPU-hours
      impact: Rolling deployments run up to this percentage of desired_count -- at 200%, every deploy transiently doubles the billing task count.
    - field_path: deployment_configuration.strategy
      sku_meter: task vCPU hours
      pricing_unit: vCPU-hours
      impact: Blue/green runs two full task sets for the bake window on every deploy -- deployment safety bought with double capacity for bake_time_in_minutes.
    - field_path: network.assign_public_ip
      sku_meter: public IPv4 addresses
      pricing_unit: IP-hours
      impact: A public IP on every task ENI bills hourly per address -- multiplied by task count.
    - field_path: service_connect
      sku_meter: log ingestion
      pricing_unit: GB
      impact: The Service Connect proxy consumes part of each task's cpu/memory allocation, and its access logs ship to CloudWatch at ingestion rates.
  estimate_exclusions:
    - the per-task rate is the referenced AwsEcsTaskDefinition's cpu/memory times Fargate's unit prices -- this manifest sets the count, never the size, which is why no estimate document exists for this component
    - the load balancer and target groups referenced by load_balancers bill on their own components
    - EC2 launch type bills through the cluster's capacity providers instead of per task
    - data transfer between zones and out of the region follows traffic
  notes: "The honest estimate lives at composition time: count from this manifest, size from the task definition, rate from the price book. Each piece is verified data -- only their join is deferred, to the surface that sees both components together."
