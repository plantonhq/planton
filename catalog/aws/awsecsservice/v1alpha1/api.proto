syntax = "proto3";

package dev.planton.aws.awsecsservice.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsecsservice/v1alpha1/outputs.proto";
import "catalog/aws/awsecsservice/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsEcsService represents a containerized application deployed on AWS ECS.
// This resource manages ECS services that can run on either Fargate or EC2.
message AwsEcsService {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this ECS service resource, typically "AwsEcsService".
  string kind = 2 [(buf.validate.field).string.const = 'AwsEcsService'];

  // metadata captures identifying information (name, org, version, etc.)
  // and must pass standard validations for resource naming.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the core configuration data defining how the ECS service is deployed.
  AwsEcsServiceSpec spec = 4 [(buf.validate.field).required = true];

  // status holds runtime or post-deployment information.
  AwsEcsServiceStatus status = 5;
}

// AwsEcsServiceStatus describes the status fields for an ECS service resource.
message AwsEcsServiceStatus {
  // outputs captures the outputs returned by Pulumi/Terraform after provisioning.
  AwsEcsServiceOutputs outputs = 1;
}
