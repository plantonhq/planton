# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awsecsservice
spec:
  aws:
    statements:
      - sid: ManageService
        actions:
          - ecs:CreateService
          - ecs:DescribeServices
          - ecs:UpdateService
          - ecs:DeleteService
          - ecs:TagResource
          - ecs:UntagResource
          - ecs:ListTagsForResource
        resources:
          - arn:aws:ecs:*:*:service/*
        provenance: derived
        notes: Covers aws_ecs_service -- creation, convergence of every declared block (deployment configuration, Service Connect, volume configuration), and the scale-to-zero-then-delete teardown.
      - sid: ManageAutoscaling
        actions:
          - application-autoscaling:RegisterScalableTarget
          - application-autoscaling:DeregisterScalableTarget
          - application-autoscaling:DescribeScalableTargets
          - application-autoscaling:PutScalingPolicy
          - application-autoscaling:DeleteScalingPolicy
          - application-autoscaling:DescribeScalingPolicies
        resources:
          - "*"
        provenance: derived
        notes: Covers aws_appautoscaling_target and the three aws_appautoscaling_policy resources (cpu, memory, requests), created only when spec.autoscaling is set. Application Auto Scaling does not support resource-level ARN scoping for these actions -- the wildcard is the service's own documented policy shape; condition keys can pin the ecs service namespace in a hardened deployment.
      - sid: PassTaskRoles
        actions:
          - iam:PassRole
        resources:
          - arn:aws:iam::*:role/*
        provenance: derived
        notes: CreateService and UpdateService pass the referenced task definition's execution and task roles (and the infrastructure role for managed EBS volumes) to ECS. Scope to the actual role ARNs in a hardened deployment.
      - sid: CreateServiceLinkedRole
        actions:
          - iam:CreateServiceLinkedRole
        resources:
          - arn:aws:iam::*:role/aws-service-role/*
        provenance: derived
        notes: First use of ECS (and of Application Auto Scaling's ECS integration) in an account creates their service-linked roles implicitly -- required once per account, then dormant.
