# Password-authenticated AwsMemorydbUser: the standard per-application
# identity. Dependency-free leaf; creates in seconds (CreateUser does not
# wait). Exercises the dual-password zero-downtime-rotation shape and a
# scoped access string. The passwords are throwaway test material. Full
# metadata is supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsMemorydbUser
metadata:
  name: planton-oss-e2e-awsmdbuser-pw
  id: planton-oss-e2e-awsmdbuser-pw
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsmemorydbuser
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  accessString: on ~orders:* +@read +@write -@dangerous
  authenticationMode:
    type: password
    passwords:
      - planton-e2e-throwaway-pass-1
      - planton-e2e-throwaway-pass-2
