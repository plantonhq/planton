# IAM-authenticated AwsMemorydbUser: no credential material anywhere --
# clients sign short-lived tokens with their AWS identity. Proves the iam
# arm's empty-passwords contract live. Dependency-free leaf. Full metadata
# is supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsMemorydbUser
metadata:
  name: planton-oss-e2e-awsmdbuser-iam
  id: planton-oss-e2e-awsmdbuser-iam
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsmemorydbuser
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  accessString: on ~analytics:* +@read
  authenticationMode:
    type: iam
