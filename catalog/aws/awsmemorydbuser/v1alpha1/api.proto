syntax = "proto3";

package dev.planton.aws.awsmemorydbuser.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsmemorydbuser/v1alpha1/outputs.proto";
import "catalog/aws/awsmemorydbuser/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsMemorydbUser represents one identity in MemoryDB's ACL authentication
// system: a named user with a Redis ACL access string and an authentication
// mode, grouped into ACLs (AwsMemorydbAcl) that attach to clusters.
message AwsMemorydbUser {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this MemoryDB user resource.
  string kind = 2 [(buf.validate.field).string.const = "AwsMemorydbUser"];

  // metadata captures identifying information (name, org, version, etc.)
  // and must pass standard validations for resource naming. The name IS the
  // AWS user name (the AUTH identity, max 40 characters) and is create-time
  // immutable.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the core configuration data defining how the user is provisioned.
  AwsMemorydbUserSpec spec = 4 [(buf.validate.field).required = true];

  // status holds runtime or post-deployment information.
  AwsMemorydbUserStatus status = 5;
}

// AwsMemorydbUserStatus describes the status fields for a MemoryDB user resource.
message AwsMemorydbUserStatus {
  // outputs captures the outputs returned by Pulumi/Terraform after provisioning.
  AwsMemorydbUserOutputs outputs = 1;
}
