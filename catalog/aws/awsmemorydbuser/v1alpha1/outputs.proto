syntax = "proto3";

package dev.planton.aws.awsmemorydbuser.v1alpha1;

// AwsMemorydbUserOutputs captures observable identifiers from a
// provisioned MemoryDB user. These outputs are used by downstream resources
// to wire dependencies via StringValueOrRef — most importantly the ACL's
// `user_names` membership list.
message AwsMemorydbUserOutputs {
  // The user's name — the single identity clients present in the AUTH
  // command and the identifier ACLs reference in their membership list.
  // Exported so ACL membership and application configuration are wired from
  // the resource graph instead of duplicating the value.
  string user_name = 1;

  // The Amazon Resource Name of the user. Used in IAM policies — an
  // IAM-authenticated client needs `memorydb:Connect` on both the user ARN
  // and the cluster ARN.
  string user_arn = 2;

  // The minimum engine version the user's configuration requires. AWS
  // computes this from the ACL feature set the user exercises; an ACL (and
  // the cluster it attaches to) must run at least this engine version.
  string minimum_engine_version = 3;
}
