apiVersion: aws.planton.dev/v1alpha1
kind: AwsCognitoUserPool
metadata:
  name: ${name}
  org: '${org}'
  env: ${env}
  id: ${id}
  annotations:
    planton.dev/provisioner: pulumi
    pulumi.planton.dev/stack.name: ${env}.AwsCognitoUserPool.${name}
spec:
  region: <aws-region>
  usernameAttributes:
    - email
  userPoolTier: PLUS
  passwordPolicy:
    minimumLength: 12
    requireLowercase: true
    requireUppercase: true
    requireNumbers: true
    requireSymbols: true
    passwordHistorySize: 5
  mfaConfiguration: OPTIONAL
  softwareTokenMfaEnabled: true
  autoVerifiedAttributes:
    - email
  attributesRequireVerificationBeforeUpdate:
    - email
  accountRecoveryMechanisms:
    - name: verified_email
      priority: 1
  emailConfiguration:
    emailSendingAccount: DEVELOPER
    sourceArn:
      value: "<ses-identity-arn>"
  userPoolAddOns:
    advancedSecurityMode: ENFORCED
  riskConfiguration:
    accountTakeover:
      highAction:
        eventAction: BLOCK
        notify: true
      mediumAction:
        eventAction: MFA_IF_CONFIGURED
        notify: true
      lowAction:
        eventAction: NO_ACTION
        notify: false
      notifyConfiguration:
        sourceArn:
          value: "<ses-identity-arn>"
        blockEmail:
          subject: "We blocked a sign-in attempt on your account"
          htmlBody: "<p>We detected and blocked a risky sign-in attempt. If this was you, reset your password and try again.</p>"
          textBody: "We detected and blocked a risky sign-in attempt. If this was you, reset your password and try again."
        mfaEmail:
          subject: "We asked for extra verification on your sign-in"
          htmlBody: "<p>A sign-in attempt looked unusual, so we required multi-factor verification.</p>"
          textBody: "A sign-in attempt looked unusual, so we required multi-factor verification."
    compromisedCredentials:
      eventAction: BLOCK
    # Replace with your office/VPN egress ranges (CIDR notation).
    riskException:
      skippedIpRanges:
        - "203.0.113.0/24"
  userGroups:
    - name: admins
      description: Operators with elevated application access
      precedence: 1
      roleArn:
        value: "<admin-role-arn>"
    - name: members
      description: Standard application users
      precedence: 10
  deletionProtection: true
  domain:
    domain: ${name}-auth
