syntax = "proto3";

package dev.planton.aws.awscognitouserpool.v1alpha1;

// AwsCognitoUserPoolOutputs captures observable identifiers and endpoints
// from a provisioned Cognito User Pool. Downstream resources (app clients,
// identity providers, resource servers, JWT authorizers, ALB authentication
// actions) wire their dependencies from these values via StringValueOrRef.
message AwsCognitoUserPoolOutputs {
  // The user pool identifier. Primary reference used in SDK calls, IAM policies,
  // and as the user_pool_id input for app clients, identity providers, and
  // resource servers. Format: "{region}_{poolId}" (e.g., "us-east-1_Ab1Cd2EfG").
  string user_pool_id = 1;

  // The Amazon Resource Name of the user pool. Used in IAM policies,
  // cross-service permissions, and ALB authenticate-cognito actions.
  string user_pool_arn = 2;

  // The pool's endpoint as AWS reports it -- host and path WITHOUT a scheme:
  // "cognito-idp.{region}.amazonaws.com/{user_pool_id}". Use `issuer` when a
  // consumer needs the full OIDC issuer URL.
  string user_pool_endpoint = 3;

  // The OIDC issuer URL for tokens minted by this pool:
  // "https://cognito-idp.{region}.amazonaws.com/{user_pool_id}".
  // This is the value JWT authorizers (API Gateway, ALB) and OIDC client
  // libraries validate the token's "iss" claim against.
  string issuer = 4;

  // The hosted-UI domain exactly as configured on the pool -- the prefix of a
  // Cognito-hosted domain (e.g. "myapp-auth") or the full custom domain (e.g.
  // "auth.example.com"), with no scheme. This is the join key ALB
  // authenticate-cognito actions take as their user_pool_domain. Empty when no
  // domain is configured.
  string user_pool_domain = 5;

  // The full https:// URL of the hosted sign-in UI:
  // "https://{prefix}.auth.{region}.amazoncognito.com" for Cognito-hosted
  // domains, or "https://{custom_domain}" for custom domains. Empty when no
  // domain is configured.
  string hosted_ui_url = 6;

  // The CloudFront distribution DOMAIN NAME fronting a custom domain (e.g.
  // "d111abcdef8.cloudfront.net"). Point the custom domain's DNS at this
  // value -- with AwsRoute53DnsRecord, an alias A record composed from this
  // output and `cloudfront_hosted_zone_id`. Empty for Cognito-hosted prefix
  // domains or when no domain is configured.
  string cloudfront_distribution = 7;

  // The ARN of the CloudFront distribution fronting a custom domain. Useful
  // for IAM policies and tag-based governance. Empty for prefix domains.
  string cloudfront_distribution_arn = 8;

  // The Route53 hosted-zone ID of the CloudFront distribution (the fixed
  // CloudFront zone) -- the alias target zone for DNS alias records pointing
  // the custom domain at CloudFront. Empty for prefix domains.
  string cloudfront_hosted_zone_id = 9;
}
