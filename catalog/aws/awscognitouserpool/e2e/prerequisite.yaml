# Install fixture consumed by kinds that declare AwsCognitoUserPool as a
# prerequisite (app clients, identity providers, resource servers). Deliberately
# dependency-free and minimal: an email-username pool with nothing that needs
# SES, SNS roles, or a domain, so consumers pay the minimum fixture cost
# (Cognito pools create in seconds). The kind's own richer lane lives in
# scenarios/full-surface-pool.yaml.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsCognitoUserPool
metadata:
  name: planton-oss-e2e-awscog-prereq
  id: planton-oss-e2e-awscog-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awscognitouserpool
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  usernameAttributes:
    - email
  autoVerifiedAttributes:
    - email
  accountRecoveryMechanisms:
    - name: verified_email
      priority: 1
