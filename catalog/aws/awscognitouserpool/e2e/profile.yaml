apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awscognitouserpool
spec:
  # A user pool under live E2E: dependency-free by design (COGNITO_DEFAULT
  # email, no SMS role, ESSENTIALS tier), so the lane proves create (the pool
  # itself is seconds; the prefix domain resolves in about a minute), verify
  # (DescribeUserPool), destroy (the module removes the domain before the
  # pool; Cognito deletes are synchronous), and verify-destroyed on both
  # provisioners. The user-groups fold is a live arm (free, dependency-free
  # without role ARNs). SES-dependent arms (DEVELOPER email, email MFA), SMS
  # arms (SNS caller role), the custom-domain arm (needs owned DNS + a
  # us-east-1 ACM certificate), log delivery, and the PLUS-tier threat
  # protection + risk-configuration arm (billing posture unverified; the
  # 04-threat-protected preset is its offline fixture) are excluded from the
  # live lane; their wiring is proven by the offline gate.
  #
  # Proven live 2026-08-12, both engines, through the depth-closure surface:
  # the user-groups fold's first live pass (two groups applied and destroyed
  # with the pool — no verifier probe BY DESIGN: DescribeUserPool does not
  # report groups and creation/destroy are atomic with the pool), and the
  # three state-pinned Pulumi sends (deletion_protection INACTIVE,
  # schema.required, allow_admin_create_user_only) applied cleanly. The
  # risk-configuration arm stays offline-proven per the exclusion above.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
  # 2026-08-13 tag-convergence sweep: the Terraform module's metadata.labels
  # merge into cloud tags was dropped (the canonical six-key identity map --
  # user labels are platform metadata). Declared-set equality is now
  # machine-enforced by hack/guards/ensure_cross_engine_tag_keys.sh; the
  # change class is live-re-proven once via Q31 (awscloudwatchloggroup
  # represents it).
