syntax = "proto3";

package dev.planton.aws.awssagemakernotebookinstance.v1alpha1;

import "catalog/aws/awssagemakernotebookinstance/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsSagemakerNotebookInstanceIacInput is the input for the IaC
