apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awssagemakernotebookinstance
spec:
  # A notebook instance under live E2E: two lanes on ml.t3.medium
  # (~$0.05/hour; InService in ~3-5 min, delete stops first then
  # removes - ~10 min per lane). The minimal lane proves the bare
  # create -> InService lifecycle; the full-surface lane adds the
  # folded lifecycle configuration (BOTH scripts must echo back
  # base64-decoded), IMDSv2-only, root lockdown, the AL2023 platform,
  # and a public default code repository. Verification is
  # DescribeNotebookInstance keyed on notebook_instance_name (status
  # InService) plus the lifecycle-config echo.
  #
  # Deliberately not exercised live: the VPC arm
  # (direct_internet_access Disabled requires a NAT path for the
  # notebook to reach SageMaker APIs - unblock: a NAT-wired subnet
  # fixture) and the KMS volume arm (rides the VPC scenario) -
  # offline-proven via e2e/manifest.yaml.
  #
  # pending_proof: forged this session to the full offline bar -- Q36
  # proves it live.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 45
