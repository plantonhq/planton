apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awssagemakernotebookinstance
spec:
  # Both resources import by their bare names: the instance by its own,
  # the folded lifecycle configuration by its derived stable name
  # (carried in the lifecycle_config_name output).
  values:
    - name: notebook_instance_name
      derivations:
        - from_output: notebook_instance_name
      where_to_find: >-
        SageMaker console -> Notebook instances (the name), or
        `aws sagemaker list-notebook-instances` (NotebookInstanceName).
    - name: lifecycle_config_name
      derivations:
        - from_output: lifecycle_config_name
      where_to_find: >-
        `aws sagemaker describe-notebook-instance
        --notebook-instance-name <name>` shows
        NotebookInstanceLifecycleConfigName.
