# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awssagemakernotebookinstance
spec:
  aws:
    statements:
      - sid: ManageNotebookInstance
        actions:
          - sagemaker:CreateNotebookInstance
          - sagemaker:DescribeNotebookInstance
          - sagemaker:UpdateNotebookInstance
          - sagemaker:StartNotebookInstance
          - sagemaker:StopNotebookInstance
          - sagemaker:DeleteNotebookInstance
          - sagemaker:AddTags
          - sagemaker:DeleteTags
          - sagemaker:ListTags
        resources:
          - arn:aws:sagemaker:*:*:notebook-instance/*
        provenance: derived
        notes: Covers aws_sagemaker_notebook_instance. Stop and Start are not optional -- SageMaker requires a Stopped instance for UpdateNotebookInstance, so the provider rides a stop-update-start choreography on most changes, and deletion also stops first. Every action authorizes on the notebook-instance ARN format per the service reference.
      - sid: ManageLifecycleConfiguration
        actions:
          - sagemaker:CreateNotebookInstanceLifecycleConfig
          - sagemaker:DescribeNotebookInstanceLifecycleConfig
          - sagemaker:UpdateNotebookInstanceLifecycleConfig
          - sagemaker:DeleteNotebookInstanceLifecycleConfig
          - sagemaker:AddTags
          - sagemaker:DeleteTags
          - sagemaker:ListTags
        resources:
          - arn:aws:sagemaker:*:*:notebook-instance-lifecycle-config/*
        provenance: derived
        notes: Covers aws_sagemaker_notebook_instance_lifecycle_configuration, created only when spec.lifecycle_config carries a script (the module base64-encodes the plain shell before sending). All actions authorize on the notebook-instance-lifecycle-config ARN format per the service reference.
      - sid: PassExecutionRole
        actions:
          - iam:PassRole
        resources:
          - arn:aws:iam::*:role/*
        provenance: derived
        notes: CreateNotebookInstance and UpdateNotebookInstance pass the referenced execution role (role_arn, required by the spec) to SageMaker, which the notebook assumes for AWS API calls. Add an iam:PassedToService=sagemaker.amazonaws.com condition and narrow to the actual role ARN in a hardened deployment.
