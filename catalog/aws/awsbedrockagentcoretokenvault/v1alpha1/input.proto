syntax = "proto3";

package dev.planton.aws.awsbedrockagentcoretokenvault.v1alpha1;

import "catalog/aws/awsbedrockagentcoretokenvault/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsBedrockAgentCoreTokenVaultIacInput is the input for the IaC
// modules that manage the token vault's encryption key.
message AwsBedrockAgentCoreTokenVaultIacInput {
  // target is the AwsBedrockAgentCoreTokenVault resource to deploy.
  AwsBedrockAgentCoreTokenVault target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
