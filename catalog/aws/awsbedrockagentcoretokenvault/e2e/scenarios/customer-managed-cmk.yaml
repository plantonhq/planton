# Full surface: the default vault encrypted with a customer-managed
# KMS key. The key is the harness's STANDING fixture (alias
# planton-e2e-acetv, ensured by the test entrypoint and exported as the
# E2E_ENV token below), NOT a chain-deployed prerequisite: AWS validates
# the PREVIOUS key is ENABLED on every SetTokenVaultCMK write, so the
# service-managed revert only succeeds while this key still lives -- a
# per-lane key dying into its deletion window at fixture teardown wedges
# the vault (live-caught).
# Run BEFORE the service-managed scenario -- that one doubles as the
# revert that returns the vault to AWS-owned encryption (destroy alone
# is a no-op at AWS).
apiVersion: aws.planton.dev/v1alpha1
kind: AwsBedrockAgentCoreTokenVault
metadata:
  name: planton-oss-e2e-awsacetv-cmk
  id: planton-oss-e2e-awsacetv-cmk
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsbedrockagentcoretokenvault
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  keyType: CustomerManagedKey
  kmsKeyArn:
    value: ${E2E_ENV:PLANTON_E2E_ACETV_KMS_KEY_ARN}
