apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsrestapiusageplan
spec:
  # A usage plan under live E2E: one lane composing the dependency-free
  # REST API prerequisite fixture, covering that API's prod stage with
  # a daily quota, a throttle, and one generated API key. Verification
  # is GetUsagePlan keyed on usage_plan_id. Usage plans and keys are
  # free to keep.
  #
  # Deliberately not exercised live: per-method throttles (offline in
  # e2e/manifest.yaml), a caller-supplied key value (the generated
  # value is the recommended path; supplying one is a secret-rotation
  # concern), and Marketplace product_code (needs a Marketplace listing).
  #
  # Proven live 2026-08-25: full-surface green on both engines first
  # pass with the blind round-trip (plan + attached key + API key
  # re-imported at no real change).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
