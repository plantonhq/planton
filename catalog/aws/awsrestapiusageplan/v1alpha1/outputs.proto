syntax = "proto3";

package dev.planton.aws.awsrestapiusageplan.v1alpha1;

// AwsRestApiUsagePlanOutputs captures observable identifiers from
// a provisioned usage plan and its API keys. Key VALUES are secrets
// and deliberately not exported - read them from the AWS API/console
// when distributing to consumers.
message AwsRestApiUsagePlanOutputs {
  // The usage plan ID.
  string usage_plan_id = 1;

  // The usage plan ARN.
  string usage_plan_arn = 2;

  // API key IDs keyed by each `api_keys` entry's name.
  map<string, string> api_key_ids = 3;

  // API key ARNs keyed by each `api_keys` entry's name.
  map<string, string> api_key_arns = 4;
}
