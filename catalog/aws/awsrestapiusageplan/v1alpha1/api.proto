syntax = "proto3";

package dev.planton.aws.awsrestapiusageplan.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsrestapiusageplan/v1alpha1/outputs.proto";
import "catalog/aws/awsrestapiusageplan/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsRestApiUsagePlan {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsRestApiUsagePlan'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsRestApiUsagePlanSpec spec = 4 [(buf.validate.field).required = true];
  AwsRestApiUsagePlanStatus status = 5;
}

message AwsRestApiUsagePlanStatus {
  AwsRestApiUsagePlanOutputs outputs = 1;
}
