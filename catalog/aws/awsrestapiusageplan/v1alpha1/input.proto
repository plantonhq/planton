syntax = "proto3";

package dev.planton.aws.awsrestapiusageplan.v1alpha1;

import "catalog/aws/awsrestapiusageplan/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsRestApiUsagePlanIacInput is the input for the IaC modules that
// deploy the usage plan.
message AwsRestApiUsagePlanIacInput {
  // target is the AwsRestApiUsagePlan resource to deploy.
  AwsRestApiUsagePlan target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
