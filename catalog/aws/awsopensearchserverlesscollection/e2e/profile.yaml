apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsopensearchserverlesscollection
spec:
  # An OpenSearch Serverless collection under live E2E: one full-surface
  # lane -- the collection (SEARCH, standby DISABLED for the 0.5+0.5 OCU
  # dev floor) plus all four module-rendered collection-scoped policies:
  # encryption (AWS-owned key -- the policy that must exist BEFORE the
  # collection; its create/destroy ordering is the module's own dependency
  # edge), network (public posture, collection + dashboard rules), data
  # access (one rule against the test account's admin role), and retention
  # (a 24h rule). Collection provisioning is minutes-scale (~5-10 each
  # way); cost is the OCU floor for the lane's minutes -- pennies.
  # Verification is BatchGetCollection keyed on the collection name
  # (ACTIVE counts as present; DELETING counts as absent) plus the four
  # policies' Get* echoes.
  #
  # Deliberately not exercised live: a customer-managed KMS key (the
  # AWS-owned-key arm is the live path; the KmsARN document member is
  # offline-proven), VPC-endpoint network access (needs an OpenSearch
  # Serverless VPC endpoint -- a future kind; unblock: model it and
  # compose), collection groups (needs a collection-group fixture -- a
  # future kind), and vector acceleration (VECTORSEARCH GPU capacity --
  # cost).
  #
  # Proven live 2026-08-13, both engines, full-surface (composed IAM-role
  # fixture), with the IDEMPOTENCY phase and the blind import round-trip
  # green (all 5 resources: the collection by service-generated id, the
  # four policies by {name}/{type} composites; zero tolerated updates).
  # Per-engine watcher evidence (distinct collection ids attribute the
  # windows): AWSOwnedKey=true encryption document, AllowFromPublic=true
  # network document with the dashboard rule, the data-access document
  # naming the composed role fixture ARN, MinIndexRetention=24h; status
  # ACTIVE ~3 min after create. Ordering from the engines' own logs:
  # encryption policy created BEFORE the collection, collection destroyed
  # BEFORE the encryption policy -- AWS accepted the policy deletion
  # immediately (no Q25-class settle needed). Lane timing: ~13 min per
  # engine end-to-end incl. the fixture chain (~3.5 min up/down each).
  # Record-only probe: CreateCollection with inline encryptionConfig and
  # NO policy reached ACTIVE (the inline arm stands alone) -- judgment in
  # GUIDE.md; the policy-path module design stands.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 45
