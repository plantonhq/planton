syntax = "proto3";

package dev.planton.aws.awsopensearchserverlesscollection.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsopensearchserverlesscollection/v1alpha1/outputs.proto";
import "catalog/aws/awsopensearchserverlesscollection/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsOpenSearchServerlessCollection is a kind for creating and managing
// Amazon OpenSearch Serverless collections - fully managed, auto-scaling
// OpenSearch workspaces for search, time-series, and vector workloads -
// together with the collection-scoped encryption, network, data-access, and
// retention policies that make a collection usable.
message AwsOpenSearchServerlessCollection {
  // api_version specifies the API version for this resource.
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  // kind identifies this resource type.
  string kind = 2 [(buf.validate.field).string.const = 'AwsOpenSearchServerlessCollection'];

  // metadata contains standard resource metadata including name, labels, and annotations.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec defines the desired state of the collection.
  AwsOpenSearchServerlessCollectionSpec spec = 4 [(buf.validate.field).required = true];

  // status contains the observed state and outputs from the deployment.
  AwsOpenSearchServerlessCollectionStatus status = 5;
}

// AwsOpenSearchServerlessCollectionStatus contains the status and outputs
// for the collection.
message AwsOpenSearchServerlessCollectionStatus {
  // outputs contains the values exported from the IaC stack after deployment.
  AwsOpenSearchServerlessCollectionOutputs outputs = 1;
}
