apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsrestapigateway
spec:
  # A REST API under live E2E: two lanes. The minimal lane proves the
  # MOCK health-check form ($0, fixture-free, create -> GetRestApi ->
  # destroy). The full-surface lane composes the AwsLambda smoke
  # fixture for an AWS_PROXY route plus a TOKEN authorizer (create
  # does not invoke the function) and stage method settings (the
  # PATCH-view satellite). Verification is GetRestApi keyed on
  # rest_api_id. REST APIs are free to keep; billing starts when
  # callers invoke or a cache cluster is enabled.
  #
  # Deliberately not exercised live: the OpenAPI body arm (XOR with
  # typed routes -- proven by spec tests), the stage cache cluster
  # (bills hourly; enabling waits up to 90 minutes -- unblock: a
  # dedicated cache lane with a 90-minute timeout), VPC_LINK
  # integrations (the AwsRestApiVpcLink lane covers the link),
  # generated client certificates, and documentation publishing --
  # all offline-proven via e2e/manifest.yaml.
  #
  # Proven live 2026-08-25: minimal + full-surface green on both engines
  # with blind import round-trips (12 resources full-surface / 7 minimal
  # re-imported at no real change; the deployment declared
  # skip-and-recreate -- its trigger hash never round-trips). The
  # definition-hash redeploy contract evidenced per engine by $0
  # two-apply probes (new deployment minted, stage repointed).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
