apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awsrestapigateway
spec:
  # The REST API imports by its bare id. Folded satellites compose that
  # id with the satellite's own identity (resource id, method, status
  # code, authorizer id, ...) -- formats live in the provider catalog.
  values:
    - name: rest_api_id
      derivations:
        - from_output: rest_api_id
      where_to_find: >-
        API Gateway console -> APIs -> the REST API (the ID), or
        `aws apigateway get-rest-apis` (id).
    # The route and route-response instance keys are COMPOSITE
    # ("GET /orders/{id}", "GET /orders/{id}|200"), so their placeholder
    # values resolve through echo maps the modules export keyed exactly
    # like the instances. Derivations are ordered first-resolves-wins: a
    # tree-node address (path-keyed) hits resource_ids, a route address
    # hits route_resource_ids, a response address hits
    # response_resource_ids -- the key shapes never collide (paths start
    # with "/", route keys with the HTTP method).
    - name: resource_id
      derivations:
        - from_output_keyed_by_address: resource_ids
        - from_output_keyed_by_address: route_resource_ids
        - from_output_keyed_by_address: response_resource_ids
      where_to_find: >-
        `aws apigateway get-resources --rest-api-id <id>` lists resource
        ids keyed by path; match each to the derived tree node (or to
        the route's path for method/integration/response addresses).
    - name: http_method
      derivations:
        - from_output_keyed_by_address: route_methods
        - from_output_keyed_by_address: response_methods
      where_to_find: >-
        The HTTP method is the first token of each route's for_each key
        ("GET /orders/{id}").
    - name: status_code
      derivations:
        - from_output_keyed_by_address: response_status_codes
      where_to_find: >-
        The status code is the token after "|" on each route-response
        for_each key ("GET /orders/{id}|200").
    - name: authorizer_id
      derivations:
        - from_output_keyed_by_address: authorizer_ids
      where_to_find: >-
        `aws apigateway get-authorizers --rest-api-id <id>` (id), matched
        to each spec.authorizers entry by name.
    - name: model_name
      derivations:
        - from_address_key: true
      where_to_find: >-
        The model NAME is its AWS identity -- each spec.models entry's
        name (`aws apigateway get-models --rest-api-id <id>` shows name).
    - name: request_validator_id
      derivations:
        - from_output_keyed_by_address: request_validator_ids
      where_to_find: >-
        `aws apigateway get-request-validators --rest-api-id <id>` (id),
        matched to each spec.request_validators entry by name.
    - name: response_type
      derivations:
        - from_address_key: true
      where_to_find: >-
        The gateway-response type IS its AWS identity -- each
        spec.gateway_responses entry's response_type.
    - name: stage_name
      derivations:
        - from_output: stage_name
      where_to_find: >-
        `aws apigateway get-stages --rest-api-id <id>` (stageName).
    - name: method_path
      derivations:
        - from_address_key: true
      where_to_find: >-
        Each spec.stage.method_settings entry's method_path
        ("*/*" or "{resource-path}/{METHOD}").
    - name: documentation_part_id
      derivations:
        - from_output_keyed_by_address: documentation_part_ids
      where_to_find: >-
        `aws apigateway get-documentation-parts --rest-api-id <id>`
        (id), matched to each spec.documentation.parts entry by
        declaration position.
    # The documentation version resource is count-based (its address
    # key is "0"), so the version string derives from the spec field,
    # never from the address.
    - name: version
      derivations:
        - from_spec_field: documentation.published_version.version
      where_to_find: >-
        The published documentation version string
        (spec.documentation.published_version.version).
    - name: client_certificate_id
      derivations:
        - from_output: client_certificate_id
      where_to_find: >-
        `aws apigateway get-client-certificates` (clientCertificateId)
        when stage.client_certificate.generate is true.