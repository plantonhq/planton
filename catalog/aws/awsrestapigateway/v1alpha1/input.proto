syntax = "proto3";

package dev.planton.aws.awsrestapigateway.v1alpha1;

import "catalog/aws/awsrestapigateway/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsRestApiGatewayIacInput is the input for the IaC modules that
// deploy the REST API.
message AwsRestApiGatewayIacInput {
  // target is the AwsRestApiGateway resource to deploy.
  AwsRestApiGateway target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
