syntax = "proto3";

package dev.planton.aws.awsbedrockprovisionedthroughput.v1alpha1;

import "catalog/aws/awsbedrockprovisionedthroughput/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsBedrockProvisionedThroughputIacInput is the input for the IaC
// modules that deploy the Bedrock provisioned throughput.
message AwsBedrockProvisionedThroughputIacInput {
  // target is the AwsBedrockProvisionedThroughput resource to deploy.
  AwsBedrockProvisionedThroughput target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
