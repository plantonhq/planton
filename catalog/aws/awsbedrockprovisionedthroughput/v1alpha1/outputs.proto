syntax = "proto3";

package dev.planton.aws.awsbedrockprovisionedthroughput.v1alpha1;

// AwsBedrockProvisionedThroughputOutputs captures observable
// identifiers from a provisioned Bedrock throughput purchase.
message AwsBedrockProvisionedThroughputOutputs {
  // ARN of the provisioned model - the modelId applications pass to
  // InvokeModel/Converse to consume the dedicated capacity.
  string provisioned_model_arn = 1;

  // The provisioned model's name. Matches metadata.name.
  string provisioned_model_name = 2;
}
