syntax = "proto3";

package dev.planton.aws.awsbedrockprovisionedthroughput.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsbedrockprovisionedthroughput/v1alpha1/outputs.proto";
import "catalog/aws/awsbedrockprovisionedthroughput/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsBedrockProvisionedThroughput is a kind for purchasing and
// managing Amazon Bedrock Provisioned Throughput - dedicated model serving
// capacity in model units, the required serving path for fine-tuned custom
// models.
message AwsBedrockProvisionedThroughput {
  // api_version specifies the API version for this resource.
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  // kind identifies this resource type.
  string kind = 2 [(buf.validate.field).string.const = 'AwsBedrockProvisionedThroughput'];

  // metadata contains standard resource metadata including name, labels, and annotations.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec defines the desired state of the provisioned throughput.
  AwsBedrockProvisionedThroughputSpec spec = 4 [(buf.validate.field).required = true];

  // status contains the observed state and outputs from the deployment.
  AwsBedrockProvisionedThroughputStatus status = 5;
}

// AwsBedrockProvisionedThroughputStatus contains the status and outputs
// for the provisioned throughput.
message AwsBedrockProvisionedThroughputStatus {
  // outputs contains the values exported from the IaC stack after deployment.
  AwsBedrockProvisionedThroughputOutputs outputs = 1;
}
