# AwsFsxOntapStorageVirtualMachine scenario: a UNIX data server on the
# ONTAP file-system fixture, with an explicit root volume security style
# and the vsadmin password (proves the sensitive arm end to end). The
# Active Directory arm is excluded — no reachable directory exists in the
# test account (recorded in profile.yaml).
apiVersion: aws.planton.dev/v1alpha1
kind: AwsFsxOntapStorageVirtualMachine
metadata:
  name: planton-oss-e2e-awsfxosvm-unix
  id: planton-oss-e2e-awsfxosvm-unix
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsfsxontapstoragevirtualmachine
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  fileSystemId:
    valueFrom:
      kind: AwsFsxOntapFileSystem
      name: planton-oss-e2e-awsfxo-prereq
      fieldPath: status.outputs.file_system_id
  name: svm_e2e_unix
  rootVolumeSecurityStyle: UNIX
  svmAdminPassword: PlantonE2eVsadmin1!
