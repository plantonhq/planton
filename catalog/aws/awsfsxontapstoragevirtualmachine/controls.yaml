# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsfsxontapstoragevirtualmachine
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every FSx for ONTAP file system encrypts all data at rest with no opt-out -- the SVM's root volume and everything served under it ride the file system's encryption unconditionally.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: The KMS key decision (AWS-managed vs customer-managed) is made once on the parent AwsFsxOntapFileSystem; this spec carries no key surface of its own.
    - control_id: enc-in-transit
      status: not_applicable
      notes: Protocol encryption is negotiated per protocol and client -- SMB encryption for SMB 3 clients, Kerberos-secured NFS (krb5p) via mount options -- and enforcing it per share or export is ONTAP CLI administration, outside this spec and the module. No field here can require or forbid encrypted transport.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The SVM's NFS, SMB, iSCSI, and management endpoints are addresses inside the parent file system's VPC subnets -- FSx exposes no public endpoint for SVM traffic at any configuration.
    - control_id: restricted-ingress
      status: not_applicable
      notes: Inbound filtering is owned by the parent file system's security groups on its network interfaces; the SVM adds endpoints behind them but carries no security-group surface of its own.
    - control_id: edge-protection
      status: not_applicable
      notes: A file-protocol data server carries no HTTP request surface -- web ACLs and request filters have nothing to attach to.
    - control_id: rbac
      status: configurable
      field_path: active_directory_configuration
      evidence:
        type: spec_default
        reference: Omitted means no domain join and no SMB endpoint -- access is NFS/iSCSI governed by export policies and initiator mappings; configuring the block joins the SVM to a self-managed Active Directory, gating SMB access on AD identities and Windows ACLs, with file_system_administrators_group scoping share-administration rights (default Domain Admins).
      notes: The 02-smb-windows and 03-multiprotocol presets join a domain. The whole block updates in place -- the SVM re-joins a new domain without replacement. svm_admin_password separately enables the SVM-scoped vsadmin ONTAP CLI account; leaving it unset keeps that management path closed.
    - control_id: workload-identity
      status: not_applicable
      notes: The SVM runs no workloads and holds no cloud credentials; the AD service-account credentials it consumes for the domain join are directory credentials, and the spec marks the password sensitive.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The spec exposes no protocol or authentication floor -- SMB dialect and NFS security flavors are negotiated per client, and tightening them (e.g. rejecting unencrypted SMB) is ONTAP CLI administration outside this spec.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: The spec exposes no audit surface. ONTAP native NAS auditing (per-SVM file-access event logging) is configured through the ONTAP CLI, outside the module; API-level administrative actions land in CloudTrail as account-level posture.
    - control_id: monitoring-integration
      status: not_applicable
      notes: FSx publishes its automatic CloudWatch metrics at the file-system and volume levels; the SVM is a logical namespace between them with no metric dimension of its own -- its traffic appears in the parent file system's and child volumes' metrics.
    - control_id: backup-recovery
      status: not_applicable
      notes: An SVM stores no data of its own to back up -- data lives in volumes, which back up as their own catalog kind, and the SVM itself is declarative configuration re-creatable from the manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist at the SVM level to retain (see backup-recovery); volume backup retention is the parent file system's setting.
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Availability is inherited from the parent file system's deployment type -- the SVM's endpoints fail over with the file system's HA layout and cannot choose their own.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither AWS nor the module exposes a deletion-protection flag for SVMs. AWS does refuse to delete an SVM that still contains non-root volumes -- a dependency guard, not a configurable protection.
    - control_id: managed-patching
      status: not_applicable
      notes: An SVM is a logical data server with no software of its own; ONTAP software patching happens on the parent file system during its weekly maintenance window.
