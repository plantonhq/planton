# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsapigatewayaccountsettings
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The account object stores no data -- it is a control-plane settings row holding a role ARN pointer and serving read-only throttle limits. There is nothing at rest to encrypt.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest exists at this level (see enc-at-rest), so no key choice arises.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The account object serves no traffic -- it has no data-plane endpoint. It is read and written only through the AWS API, whose TLS posture is provider-wide, not a property of this spec.
    - control_id: no-public-access
      status: not_applicable
      notes: No addressable endpoint exists -- the account object cannot be exposed or hidden. Public reachability is decided per API on the AwsRestApiGateway and AwsHttpApiGateway components.
    - control_id: restricted-ingress
      status: not_applicable
      notes: There is no network surface to filter; ingress control lives on the region's individual APIs and their endpoint configurations.
    - control_id: edge-protection
      status: not_applicable
      notes: Web ACLs attach to API stages, never to the account settings object -- it carries no HTTP request surface.
    - control_id: rbac
      status: not_applicable
      notes: Who may read or change the region's account settings is governed by IAM policy on the apigateway /account resource -- account-level posture. The spec exposes no access-control surface of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The component runs no workloads. The one credential it wires -- the CloudWatch logging role -- is an IAM role API Gateway assumes via STS for short-lived credentials; a static-key path for log delivery does not exist on this surface.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The component authenticates nothing itself; management calls are SigV4-signed AWS API calls like every other control-plane operation.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: configurable
      field_path: cloudwatch_role_arn
      evidence:
        type: spec_default
        reference: Unset means the region has no API Gateway logging role, and stage-level execution and access logging on every REST API in the region silently delivers nothing. Setting the role is the one-time regional prerequisite that lets REST API stages deliver execution and access logs to CloudWatch Logs.
      notes: This kind IS the region's API Gateway logging enabler -- the classic silent failure it prevents is stages with logging enabled producing no logs. Per-stage log levels and access-log formats remain each API's own settings. Administrative changes to the account object itself land in CloudTrail as account-level posture.
    - control_id: monitoring-integration
      status: not_applicable
      notes: API Gateway publishes its CloudWatch metrics per API and stage automatically; the account object contributes no metric dimension. Its throttle_burst_limit and api_key_version are read-only outputs, not monitoring levers.
    - control_id: backup-recovery
      status: not_applicable
      notes: The object is declarative configuration -- one role ARN -- fully re-creatable from the manifest. There is no data to back up.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist at this level to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: A regional control-plane settings row has no availability posture of its own; API availability is the API Gateway service's managed concern.
    - control_id: deletion-protection
      status: not_applicable
      notes: The account object cannot be deleted at all -- it always exists per region. Destroying this component merely resets the CloudWatch role to none, which the region's stages then experience as logging going dark.
    - control_id: managed-patching
      status: not_applicable
      notes: Fully managed service surface with no customer-visible software to patch.
