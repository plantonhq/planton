apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awsapigatewayaccountsettings
spec:
  values:
    - name: account_id
      derivations:
        - from_output: account_id
      where_to_find: >-
        The 12-digit AWS account id (top-right account menu, or
        `aws sts get-caller-identity`).
