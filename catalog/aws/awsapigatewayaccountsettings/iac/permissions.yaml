# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awsapigatewayaccountsettings
spec:
  aws:
    statements:
      - sid: ManageAccountSettings
        actions:
          - apigateway:GET
          - apigateway:PATCH
        resources:
          - arn:aws:apigateway:*::/account
        provenance: derived
        notes: Covers aws_api_gateway_account (tf) and apigateway.Account (pulumi) -- API Gateway authorizes by HTTP verb against resource paths, and the service reference maps the Account resource to exactly GET and PATCH. Create and update PATCH /cloudwatchRoleArn on the region's singleton /account object; read GETs it; destroy PATCHes the role away rather than deleting anything. The /account ARN carries no account-id segment.
      - sid: PassCloudWatchRoleToApiGateway
        actions:
          - iam:PassRole
        resources:
          - arn:aws:iam::*:role/*
        provenance: derived
        notes: Setting cloudwatch_role_arn passes the named role to the API Gateway service (which must trust apigateway.amazonaws.com); AWS validates the trust policy and the role's log-delivery permissions at apply time and rejects the PATCH otherwise. Needed only when the spec sets a role. Hardened deployments should scope this to the specific logging role's ARN.
