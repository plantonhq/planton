apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsapigatewayaccountsettings
spec:
  # A settings singleton under live E2E: the scenario composes a
  # consumer-scoped IAM role (apigateway.amazonaws.com trust +
  # CloudWatch Logs write), applies it as the region's API Gateway
  # logging role, verifies GetAccount echoes it, then destroys.
  # DESTROY RESETS, NEVER DELETES: the account object always exists --
  # verify-absent asserts the role ARN is EMPTY, not that the object
  # is gone. Free (settings object; no billable resources).
  #
  # Singleton collision class: both engines' lanes and any concurrent
  # session target the SAME one-per-region account object -- lanes run
  # sequentially within a session, and concurrent sessions must not
  # run this kind's lanes in the same region simultaneously.
  #
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
