# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awscloudfront
spec:
  aws:
    statements:
      - sid: ManageDistribution
        actions:
          - cloudfront:GetDistribution
          - cloudfront:UpdateDistribution
          - cloudfront:DeleteDistribution
          - cloudfront:TagResource
          - cloudfront:UntagResource
          - cloudfront:ListTagsForResource
        resources:
          - arn:aws:cloudfront::*:distribution/*
        provenance: derived
        notes: Covers aws_cloudfront_distribution -- create, read, converge, tag, and the disable-then-delete teardown. CloudFront is a global service; the distribution id is the ARN's variable part.
      - sid: CreateGlobalResources
        actions:
          - cloudfront:CreateDistribution
          - cloudfront:CreateOriginAccessControl
          - cloudfront:CreateContinuousDeploymentPolicy
        resources:
          - "*"
        provenance: derived
        notes: The service reference lists NO resource types for these three Create actions -- the CloudFront developer guide's own policy examples specify Resource "*" for CreateDistribution, not a distribution-ARN pattern -- while every read/update/delete/tag sibling scopes to its resource ARN. An ARN-scoped create grant never matches and would deny provisioning at runtime; the wildcard is the narrowest possible scope.
      - sid: ManageOriginAccessControl
        actions:
          - cloudfront:GetOriginAccessControl
          - cloudfront:UpdateOriginAccessControl
          - cloudfront:DeleteOriginAccessControl
        resources:
          - arn:aws:cloudfront::*:origin-access-control/*
        provenance: derived
        notes: Covers aws_cloudfront_origin_access_control, created for each S3 origin with create_origin_access_control true so the bucket accepts only this distribution's signed requests.
      - sid: ManageContinuousDeploymentPolicy
        actions:
          - cloudfront:GetContinuousDeploymentPolicy
          - cloudfront:UpdateContinuousDeploymentPolicy
          - cloudfront:DeleteContinuousDeploymentPolicy
        resources:
          - arn:aws:cloudfront::*:continuous-deployment-policy/*
        provenance: derived
        notes: Covers aws_cloudfront_continuous_deployment_policy, created only when spec.continuous_deployment wires a staging distribution for weighted or header-routed canary traffic.
      - sid: ManageMonitoringSubscription
        actions:
          - cloudfront:CreateMonitoringSubscription
          - cloudfront:GetMonitoringSubscription
          - cloudfront:DeleteMonitoringSubscription
        resources:
          - "*"
        provenance: derived
        notes: Covers aws_cloudfront_monitoring_subscription, created only when enable_additional_metrics is true. The service reference lists NO resource types for any of the three subscription actions, so IAM evaluates them against Resource "*" -- an ARN-scoped grant never matches. The wildcard is the narrowest possible scope.
