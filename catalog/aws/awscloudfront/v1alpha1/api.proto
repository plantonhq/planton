syntax = "proto3";

package dev.planton.aws.awscloudfront.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awscloudfront/v1alpha1/outputs.proto";
import "catalog/aws/awscloudfront/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsCloudFront is the top-level API resource envelope.
message AwsCloudFront {
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];
  string kind = 2 [(buf.validate.field).string.const = "AwsCloudFront"];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsCloudFrontSpec spec = 4 [(buf.validate.field).required = true];
  AwsCloudFrontStatus status = 5;
}

// AwsCloudFrontStatus captures lifecycle, audit and outputs.
message AwsCloudFrontStatus {
  //outputs
  AwsCloudFrontOutputs outputs = 1;
}
