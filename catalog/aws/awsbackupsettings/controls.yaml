# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsbackupsettings
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The settings singleton stores no customer data -- opt-in maps and global flags are AWS Backup control-plane metadata. Encryption of actual backup data is each vault's posture (the vault's KMS key), decided on the AwsBackupVault kind.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: With no data store there is no key surface -- the settings APIs expose no customer-managed-key option anywhere.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The AWS Backup management API carrying these settings (UpdateGlobalSettings, UpdateRegionSettings) is HTTPS-only; no plaintext path to the settings objects exists.
    - control_id: no-public-access
      status: not_applicable
      notes: Settings expose no endpoint -- they are pure control-plane configuration. The cross-account switch widens sharing only inside the AWS Organization, never to the internet; vault access policies (on AwsBackupVault) govern who reaches actual backups.
    - control_id: restricted-ingress
      status: not_applicable
      notes: Nothing listens on a settings object; there is no inbound network surface to restrict.
    - control_id: edge-protection
      status: not_applicable
      notes: With no request-serving surface there is no WAF attachment point; edge filtering has no meaning for account-level configuration.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every read and write of these settings is IAM-authorized (backup:UpdateGlobalSettings, backup:UpdateRegionSettings and their Describe twins). The service reference publishes no resource types for any of the four actions, so authorization is all-or-nothing per principal -- a grant to flip one opt-in is a grant to rewrite the region's whole Backup posture.
    - control_id: workload-identity
      status: not_applicable
      notes: A settings singleton runs no workload -- there is no execution context to give an identity to. The backup jobs the settings scope run under the IAM roles of the plans that schedule them.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: "AWS Backup has a single authentication path: SigV4-signed IAM requests; no legacy or weaker protocol exists to disable."
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: UpdateGlobalSettings and UpdateRegionSettings are management events captured in CloudTrail unconditionally -- who opted a resource type out of protection, or opened cross-account backup for the organization, is always on the record.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The settings object carries no monitoring hooks -- backup observability lives on the estate it scopes (vault notifications on AwsBackupVault, plan compliance through Audit Manager frameworks on AwsBackupFramework).
    - control_id: backup-recovery
      status: not_applicable
      notes: "There is nothing to back up -- both arms are maps of flags, recreatable by re-applying the manifest. The persistence quirk works in recovery's favor: destroy is a no-op, so the last-applied posture survives even the component's deletion."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: With no backup facility of its own there is no backup retention to set here -- recovery-point retention is the lifecycle block of each AwsBackupPlan rule.
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: AWS Backup is a regional managed service AWS operates across availability zones; the settings objects have no zonal footprint the manifest could configure.
    - control_id: deletion-protection
      status: not_applicable
      notes: "No deletion-protection flag exists, and none is needed: destroy is a no-op on BOTH arms (the provider registers no delete call), so deleting this component cannot lose or revert anything -- the last-applied settings stay in effect indefinitely. The corollary is the real operational rule: to turn a setting off, apply the false value; never rely on destroy."
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- AWS operates and patches the Backup control plane; the settings objects expose no runtime, version, or maintenance surface.
