syntax = "proto3";

package dev.planton.aws.awsbackupsettings.v1alpha1;

// AwsBackupSettingsOutputs captures the observable state of the
// Backup settings after apply.
message AwsBackupSettingsOutputs {
  // The AWS account ID the global arm manages (the global settings
  // resource's own identity at AWS).
  string account_id = 1;

  // The region the region arm manages (the region settings resource's
  // own identity at AWS).
  string region = 2;
}
