syntax = "proto3";

package dev.planton.aws.awsbackupsettings.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsbackupsettings/v1alpha1/outputs.proto";
import "catalog/aws/awsbackupsettings/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsBackupSettings {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsBackupSettings'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsBackupSettingsSpec spec = 4 [(buf.validate.field).required = true];
  AwsBackupSettingsStatus status = 5;
}

message AwsBackupSettingsStatus {
  AwsBackupSettingsOutputs outputs = 1;
}
