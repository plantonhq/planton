# VPC link across the shared subnet fixture's two-AZ pair with the shared
# security-group fixture attached -- the production shape (multi-AZ reach +
# an explicit egress group). The subnets come from the registry prerequisite;
# the security group is optional on the kind, so the scenario composes it via
# the e2e-prerequisites annotation.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsHttpApiVpcLink
metadata:
  name: planton-oss-e2e-awshttpvpcl
  id: planton-oss-e2e-awshttpvpcl
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awshttpapivpclink
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsSecurityGroup"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-b
        fieldPath: status.outputs.subnet_id
  securityGroupIds:
    - valueFrom:
        kind: AwsSecurityGroup
        name: planton-oss-e2e-awssg-prereq
        fieldPath: status.outputs.security_group_id
