apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awshttpapivpclink
spec:
  # A VPC link under live E2E: the registry-declared AwsSubnet prerequisite
  # chain (VPC -> two-AZ subnets) deploys first, the scenario composes the
  # shared security-group fixture via the e2e-prerequisites annotation, then
  # the link proves create (AWS waits for AVAILABLE while provisioning the
  # managed ENIs, typically 2-5 minutes), verify (GetVpcLink), destroy (ENI
  # reclamation is asynchronous -- DELETING is treated as absent), and
  # verify-destroyed on both provisioners.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
