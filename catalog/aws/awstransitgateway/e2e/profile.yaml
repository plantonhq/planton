apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awstransitgateway
spec:
  # A Transit Gateway under live E2E: a dependency-free leaf lane (the
  # gateway is a pure hub; attachments and route tables are their own
  # kinds with their own lanes). The scenario exercises the non-default
  # dial surface: custom ASN, explicit tri-state dials incl. an explicit
  # false, SG referencing, and a TGW Connect CIDR block. Verification is
  # DescribeTransitGateways keyed on the gateway ID, state-aware
  # (deleting/deleted count as absent -- the NAT-gateway lifecycle class).
  # Live dual-engine run 2026-07-08: Pulumi ~4m17s / Terraform 4m44s
  # (deploy 1m26s, destroy 3m16s); zero-orphan sweep clean.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 25
