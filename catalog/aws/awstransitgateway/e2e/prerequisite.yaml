# Install fixture consumed by kinds that declare AwsTransitGateway as a
# prerequisite (VPC attachments, route tables). Deliberately the SEGMENTED
# posture: both default-table dials off, so consumer lanes fully control
# route-table membership -- an attachment fixture is never auto-associated,
# which would make the route-table lane's explicit association collide with
# AWS's one-association-per-attachment rule. The dial-rich shape lives in
# the component's own scenario.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsTransitGateway
metadata:
  name: planton-oss-e2e-awstgw-prereq
  id: planton-oss-e2e-awstgw-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awstransitgateway
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E transit gateway fixture
  defaultRouteTableAssociation: false
  defaultRouteTablePropagation: false
