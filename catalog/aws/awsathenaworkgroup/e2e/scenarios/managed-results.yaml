# AwsAthenaWorkgroup managed-results scenario: query results in AWS-managed
# storage -- no S3 bucket anywhere in the lane, which is exactly the point.
# AWS forbids combining managed results with an S3 output_location (the spec
# CEL mirrors the rule), so this arm needs its own lane; a dependency-free
# leaf proving the newest result-storage shape end to end with the AWS-owned
# encryption key.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsAthenaWorkgroup
metadata:
  name: planton-oss-e2e-awsathwg-mqr
  id: planton-oss-e2e-awsathwg-mqr
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsathenaworkgroup
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E Athena workgroup with AWS-managed results
  managedQueryResults: {}
  bytesScannedCutoffPerQuery: 10737418240
  enforceWorkgroupConfiguration: true
  forceDestroy: true
