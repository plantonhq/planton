# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awsathenaworkgroup
spec:
  aws:
    statements:
      - sid: ManageWorkgroup
        actions:
          - athena:CreateWorkGroup
          - athena:GetWorkGroup
          - athena:UpdateWorkGroup
          - athena:DeleteWorkGroup
        resources:
          - arn:aws:athena:*:*:workgroup/*
        provenance: derived
        notes: Covers aws_athena_workgroup / athena.Workgroup end to end -- the single provider resource carries the whole configuration surface (result storage, cost controls, engine version, Spark role, Identity Center, monitoring), so create, the read on every plan/refresh, in-place updates, and destroy are these four calls. All four -- INCLUDING the create, because the caller names the workgroup so its ARN is known up front -- authorize on the workgroup ARN per the service reference; nothing here needs a wildcard. force_destroy rides DeleteWorkGroup's recursive-delete option, no extra action.
      - sid: TagWorkgroup
        actions:
          - athena:TagResource
          - athena:UntagResource
          - athena:ListTagsForResource
        resources:
          - arn:aws:athena:*:*:workgroup/*
        provenance: derived
        notes: Tag-on-create plus later tag reconciliation and the tag read on every refresh. The service reference scopes all three tagging actions to the workgroup ARN format (they also accept capacity-reservation, datacatalog, and session ARNs, none of which this component touches).
      - sid: PassSparkExecutionRole
        actions:
          - iam:PassRole
        resources:
          - arn:aws:iam::*:role/*
        provenance: derived
        notes: Exercised only when the spec sets execution_role (Spark and Identity Center-enabled workgroups) -- the workgroup configuration hands the referenced role to Athena, which requires iam:PassRole on the role being passed. Harden per environment by pinning the resource to the actual execution role's ARN and adding an iam:PassedToService condition for athena.amazonaws.com. The role's own permissions (S3 data sources, result writes, Glue Data Catalog) are the referenced AwsIamRole's contract, not runner grants. Plain SQL workgroups never trigger this statement.
