# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: awsssmdocument
spec:
  billing_model: free
  free_tier: "A Systems Manager document is free to create, version, store, and share -- the Systems Manager pricing page carries no meter for documents at all, and the features customer documents power are themselves free: Run Command on EC2 instances (\"No additional charges for usage on Amazon EC2 instances\"), State Manager (\"No additional charges. Limits may apply.\"), and Session Manager on EC2. No charge counts documents, document versions, version labels, or sharing grants."
  notes: "The conditional charges start when specific document types are EXERCISED, never when they exist. (1) An Automation document bills per execution -- $0.002 per step plus $0.00003 per second for aws:executeScript steps, with no per-step free allotment published today; the runbook sitting unexecuted costs nothing. (2) Attachments uploaded to Automation runbooks bill storage at $0.046 per GB-month plus $0.900 per GB for cross-account or out-of-Region transfer -- a meter only attachment_sources can start. (3) A Package document distributed through Distributor bills for non-AWS packages: $0.046 per GB-month of storage, $0.025 per 1,000 Get/Describe calls, and $0.900 per GB transferred out-of-Region or on-premises (AWS and third-party-owned packages distribute free). (4) Command documents executed on hybrid or multicloud nodes ride Run Command's hybrid meter -- $0.002 per invocation starting September 30, 2026. The scheduling layer that runs a document against a fleet is the AwsSsmAssociation component, where the same execution economics are routed from the other side."
