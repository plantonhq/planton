# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsssmdocument
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: "A document is authored configuration stored in Systems Manager's managed control plane -- there is no data store on this component for an encryption posture to apply to. The operational rule that matters: never embed secrets in content -- anyone with ssm:GetDocument reads the body verbatim; reference Parameter Store SecureStrings or Secrets Manager from the steps instead."
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: With no data store there is no key surface -- the document API exposes no customer-managed-key option.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The Systems Manager API is HTTPS-only, and the SSM Agent fetches document content over TLS when a run needs it -- no plaintext path carries the document body.
    - control_id: no-public-access
      status: configurable
      field_path: share_with_account_ids
      evidence:
        type: spec_default
        reference: "Unset means the document is private to the owning account. Listing account IDs shares it with exactly those accounts -- and the single entry \"All\" publishes it to EVERY AWS account, making the runbook's full logic (and any operational detail in it) world-readable. Public sharing is a deliberate act on this one field, never a default."
    - control_id: restricted-ingress
      status: not_applicable
      notes: Nothing listens on a document; there is no inbound network surface to restrict.
    - control_id: edge-protection
      status: not_applicable
      notes: With no request-serving surface there is no WAF attachment point; edge filtering has no meaning for stored automation content.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every document operation -- create, content updates, default-version promotion, sharing changes, delete -- is IAM-authorized and scoped to the document's own ARN (arn:aws:ssm:region:account:document/name), so grants can be pinned to specific documents.
    - control_id: workload-identity
      status: not_applicable
      notes: A document is inert content -- it runs nothing itself. When executed, commands run under each target instance's IAM instance profile and Automation runbooks under their own assumed roles; identity belongs to the executors, on their components.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: "Systems Manager has a single authentication path: SigV4-signed IAM requests; no legacy or weaker protocol exists to disable."
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Document create, every content update, default-version promotion, sharing changes, and deletion are management events captured in CloudTrail unconditionally -- who changed the runbook a fleet executes, and who shared it, is always on the record.
    - control_id: monitoring-integration
      status: not_applicable
      notes: A document carries no monitoring hooks -- it is inert until something runs it. Execution observability (command output to S3, compliance reporting, automation step tracking) lives on the executors -- the AwsSsmAssociation that schedules it and the Automation service that runs it.
    - control_id: backup-recovery
      status: not_applicable
      notes: The document is fully recreatable from the manifest's content field, and AWS keeps every prior document version server-side when content updates -- rollback is re-pinning a version, not restoring a backup.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: With no backup facility there is no backup retention to set; document versions accumulate under AWS's own versioning rules, not a retention field of this spec.
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Systems Manager is a regional managed service AWS operates across availability zones; a stored document has no zonal footprint the manifest could configure.
    - control_id: deletion-protection
      status: not_applicable
      notes: No deletion-protection flag exists on a document. AWS refuses to delete a document that is still shared (sharing must be removed first), which is incidental protection for published runbooks; deleting an in-use document breaks every association and automation that references it by name from the next run onward.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- AWS operates and patches the document store and execution plumbing; the document exposes no runtime, version, or maintenance surface of its own.
