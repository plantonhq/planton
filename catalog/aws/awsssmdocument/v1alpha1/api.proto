syntax = "proto3";

package dev.planton.aws.awsssmdocument.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsssmdocument/v1alpha1/outputs.proto";
import "catalog/aws/awsssmdocument/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsSsmDocument {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsSsmDocument'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsSsmDocumentSpec spec = 4 [(buf.validate.field).required = true];
  AwsSsmDocumentStatus status = 5;
}

message AwsSsmDocumentStatus {
  AwsSsmDocumentOutputs outputs = 1;
}
