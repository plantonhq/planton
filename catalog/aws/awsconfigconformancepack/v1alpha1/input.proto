syntax = "proto3";

package dev.planton.aws.awsconfigconformancepack.v1alpha1;

import "catalog/aws/awsconfigconformancepack/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsConfigConformancePackIacInput is the input for the IaC
// modules that manage a Config conformance pack.
message AwsConfigConformancePackIacInput {
  // target is the AwsConfigConformancePack resource to deploy.
  AwsConfigConformancePack target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
