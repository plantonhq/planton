syntax = "proto3";

package dev.planton.aws.awsconfigconformancepack.v1alpha1;

// AwsConfigConformancePackOutputs captures the observable state
// of the conformance pack after apply.
message AwsConfigConformancePackOutputs {
  // The pack's name (also the provider's import ID, at either scope).
  string pack_name = 1;

  // The pack's ARN (the account-scope or organization-scope ARN,
  // whichever this instance deployed).
  string pack_arn = 2;

  // The AWS region the pack lives in. Conformance packs are
  // region-scoped and addressed by region + name, so any consumer (or
  // verifier) reaching the pack off the ambient region needs this
  // alongside pack_name.
  string region = 3;
}
