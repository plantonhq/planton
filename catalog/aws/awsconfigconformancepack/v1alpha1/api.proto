syntax = "proto3";

package dev.planton.aws.awsconfigconformancepack.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsconfigconformancepack/v1alpha1/outputs.proto";
import "catalog/aws/awsconfigconformancepack/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsConfigConformancePack {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsConfigConformancePack'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsConfigConformancePackSpec spec = 4 [(buf.validate.field).required = true];
  AwsConfigConformancePackStatus status = 5;
}

message AwsConfigConformancePackStatus {
  AwsConfigConformancePackOutputs outputs = 1;
}
