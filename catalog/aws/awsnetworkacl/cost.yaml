# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: awsnetworkacl
spec:
  billing_model: free
  free_tier: A network ACL carries no meter -- the VPC pricing page enumerates every charge the VPC service bills (NAT Gateway, IPAM, Network Analysis, Public IPv4 addresses, contiguous IPv4 blocks, VPC Route Server, VPC Peering data, ODB Peering, Encryption Controls) and network ACLs appear in none of them. The ACL object, its allow and deny rules in both directions, the stateless evaluation AWS performs on every packet crossing an associated subnet's boundary, and the subnet associations themselves are all free base-VPC constructs.
  notes: "No field of this spec buys anything: ingress and egress rules, ICMP selectors, and subnet_ids associations are all free VPC configuration -- rule counts are bounded by quota, never by a bill. The real spend lives on the workloads inside the filtered subnets -- the instances, databases, and endpoints those subnets host bill as their own components, and the traffic the ACL's allow rules admit bills on THEIR data-transfer meters. Like the security group one layer down, packet filtering is a part of the path AWS gives away."
