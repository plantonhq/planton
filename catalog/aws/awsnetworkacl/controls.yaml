# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsnetworkacl
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A network ACL stores nothing -- its rules are VPC control-plane configuration; no customer data rests anywhere in the construct.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: There is no data at rest to key (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: A network ACL filters packets at layers 3 and 4 -- it neither terminates nor inspects TLS, and cannot require the traffic it admits to be encrypted. Transport encryption belongs to the workloads on each side.
    - control_id: no-public-access
      status: not_applicable
      notes: The ACL has no endpoint of its own to expose. Whether workloads in its subnets are internet-reachable is exactly what its rules (with the route table and security groups) decide -- that surface is assessed under restricted-ingress, where this kind is an enforcement layer.
    - control_id: restricted-ingress
      status: configurable
      field_path: ingress
      evidence:
        type: spec_default
        reference: Inbound rules evaluate in rule_no order, first match wins, and traffic matching no rule falls through to AWS's invisible catch-all DENY -- an empty ingress list means deny all inbound at the subnet boundary. Unlike a security group, a rule here can explicitly DENY, which makes the ACL the subnet-level quarantine and blocklist tool.
      notes: "Statelessness is the operational trap: replies are not tracked, so admitting inbound 443 without an egress rule for the ephemeral reply range (1024-65535) silently breaks the connection -- both presets model the paired-direction pattern. Restriction quality is the operator's; a 0.0.0.0/0 allow validates fine, so review rules for public CIDRs on sensitive ports."
    - control_id: edge-protection
      status: not_applicable
      notes: A layer-3/4 packet filter is not a web application firewall -- it cannot inspect HTTP requests. Edge protection attaches at layer 7 (AWS WAF on the fronting load balancer, CloudFront, or API Gateway), complementing rather than replacing this ACL.
    - control_id: rbac
      status: not_applicable
      notes: The ACL has no management or data plane of its own to gate -- managing it is the EC2 API, governed by the account's IAM posture, and the packets it filters carry no identity model.
    - control_id: workload-identity
      status: not_applicable
      notes: The ACL runs no workloads and holds no credentials of any kind.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The ACL exposes no authentication path at all -- there is nothing to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: The spec exposes no audit surface. Rule and association changes land in AWS CloudTrail as account-level posture, and per-packet visibility (which rules dropped what) is VPC Flow Logs, configured on the VPC, subnet, or interface -- none of it per-ACL configuration.
    - control_id: monitoring-integration
      status: not_applicable
      notes: A network ACL publishes no CloudWatch metrics of its own -- traffic it admits or drops appears in VPC Flow Logs and in the metrics of the workloads behind it, both owned elsewhere.
    - control_id: backup-recovery
      status: not_applicable
      notes: The ACL is declarative configuration fully re-creatable from the manifest -- rules and associations live inline and re-create with it; there is no data to back up.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: A network ACL has no zonal existence to replicate -- it applies to whichever subnets associate with it, in any availability zone, as VPC control-plane configuration. There is nothing to place or fail over.
    - control_id: deletion-protection
      status: not_applicable
      notes: "Neither AWS nor the modules expose a deletion-protection flag. Know the failure mode instead: a subnet always belongs to SOME ACL, so deleting this one re-parents its subnets to the VPC's default NACL -- which allows all traffic in both directions. Deletion does not close the subnets; it silently WIDENS them."
    - control_id: managed-patching
      status: not_applicable
      notes: A network ACL is a pure configuration object with no software to patch.
