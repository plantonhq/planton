syntax = "proto3";

package dev.planton.aws.awsnetworkacl.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsnetworkacl/v1alpha1/outputs.proto";
import "catalog/aws/awsnetworkacl/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsNetworkAcl {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsNetworkAcl'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsNetworkAclSpec spec = 4 [(buf.validate.field).required = true];
  AwsNetworkAclStatus status = 5;
}

message AwsNetworkAclStatus {
  AwsNetworkAclOutputs outputs = 1;
}
