apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsstepfunction
spec:
  # A Step Functions state machine under live E2E: the registry-declared
  # AwsIamRole prerequisite deploys first (the states.amazonaws.com trust
  # document), then a published Pass-state STANDARD workflow proves create,
  # versioning (publish + version ARN outputs), verify (DescribeStateMachine),
  # destroy, and verify-destroyed on both provisioners. Creates in seconds.
  # Deliberately not in the live lane: execution logging (would pull the
  # CloudWatch log-group full-surface chain), customer-managed KMS encryption
  # (slows the destroy leg), and the EXPRESS type (same create path) -- all
  # proven by spec tests and the offline gate.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 10
