syntax = "proto3";

package dev.planton.aws.awsstepfunction.v1alpha1;

// AwsStepFunctionOutputs captures observable identifiers from a provisioned
// Step Functions state machine. These outputs are used by downstream resources
// (e.g., EventBridge rule targets, API Gateway integrations, Lambda invocations)
// to wire dependencies via StringValueOrRef.
message AwsStepFunctionOutputs {
  // The Amazon Resource Name (ARN) of the state machine. This is the primary
  // identifier used for invoking the state machine and for cross-service
  // references (EventBridge targets, API Gateway integrations, IAM policies).
  string state_machine_arn = 1;

  // The name of the state machine. Useful for dashboards, monitoring, and
  // human-readable references in logs and alerts.
  string state_machine_name = 2;

  // The ARN of the most recently published version of the state machine
  // (e.g. "...:stateMachine:orders:3"). Populated only when spec.publish is
  // true. Point consumers (EventBridge targets, aliases) at this ARN to pin
  // them to an immutable snapshot instead of the mutable state machine.
  string state_machine_version_arn = 3;

  // The revision identifier of the current state machine definition. AWS
  // assigns a new revision id on every definition or configuration change,
  // whether or not a version is published. Useful for change auditing.
  string revision_id = 4;

  // Lifecycle status of the state machine as reported by AWS
  // (e.g. "ACTIVE", "DELETING").
  string status = 5;

  // RFC3339 timestamp of when the state machine was created.
  string creation_date = 6;

  // Alias ARNs keyed by alias name (spec.aliases[].name), e.g.
  // "prod" -> "...:stateMachine:orders:prod". Each alias routes to the
  // version this deployment published; consumers invoke the alias ARN to
  // follow deployments without repointing.
  map<string, string> alias_arns = 7;
}
