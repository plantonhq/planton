syntax = "proto3";

package dev.planton.aws.awsstepfunction.v1alpha1;

import "catalog/aws/awsstepfunction/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsStepFunctionIacInput is the input envelope passed to IaC modules for provisioning.
message AwsStepFunctionIacInput {
  // target is the fully-specified AwsStepFunction resource to provision.
  AwsStepFunction target = 1;

  // provider_config supplies AWS credentials and region for the deployment.
  // When nil the module falls back to ambient credentials (environment variables
  // or instance profile).
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
