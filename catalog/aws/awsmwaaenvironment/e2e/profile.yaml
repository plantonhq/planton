apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsmwaaenvironment
spec:
  # An MWAA environment under E2E: the harness deploys the AwsVpc ->
  # AwsSubnet pair -> AwsSecurityGroup registry chain (the environment
  # attaches the MWAA-shaped fixture group, which carries the
  # self-referencing rule the components communicate through), plus the
  # versioned S3 bucket and MWAA execution role composed via the
  # scenario's e2e-prerequisites annotation. Verification is MWAA
  # GetEnvironment keyed on the environment name.
  #
  # deferred: both engines are validated offline only -- tofu init +
  # validate, spec/CEL tests, outputs conformance, and Pulumi module
  # compile -- with no live provision lane (plan/preview lanes also not
  # run: no usable AWS credentials were reachable). MWAA is one of the
  # slowest AWS resources (provider ceilings: create 120 min, delete 90
  # min; realistic ~20-40 min create + ~15-30 min destroy per engine),
  # and a long-tail kind by first-months adoption likelihood. The
  # scenario, prerequisite chain, and verifier are live-ready; flip to
  # green after the first full deploy -> verify -> destroy run on both
  # provisioners.
  tier: 2
  status: deferred
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 150
  deferred_reason: >-
    Long-tail kind with the slowest AWS provisioning profile (create up to
    120 min, delete up to 90 min per engine); live lane deferred by owner
    decision, re-affirmed at the depth closure. Offline gate fully green on
    the closed surface (offline tofu plan + Pulumi preview arm-for-arm,
    spec/CEL tests incl. the PUBLIC_AND_PRIVATE access mode and the
    maintenance-window format, the log_level empty-string plan-failure heal,
    outputs conformance); artifacts live-ready.
