syntax = "proto3";

package dev.planton.aws.awsfsxontapvolume.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsfsxontapvolume/v1alpha1/outputs.proto";
import "catalog/aws/awsfsxontapvolume/v1alpha1/spec.proto";
import "shared/metadata.proto";

// aws-fsx-ontap-volume
message AwsFsxOntapVolume {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsFsxOntapVolume'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsFsxOntapVolumeSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsFsxOntapVolumeStatus status = 5;
}

// aws-fsx-ontap-volume status
message AwsFsxOntapVolumeStatus {
  //outputs
  AwsFsxOntapVolumeOutputs outputs = 1;
}
