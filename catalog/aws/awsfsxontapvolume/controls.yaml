# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsfsxontapvolume
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every FSx for ONTAP file system encrypts all data at rest with no opt-out -- a volume's blocks are encrypted wherever they live (provisioned SSD or capacity pool) because the file system beneath it is.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: The KMS key decision (AWS-managed vs customer-managed) is made once on the parent AwsFsxOntapFileSystem and covers every volume; this spec carries no key surface of its own.
    - control_id: enc-in-transit
      status: not_applicable
      notes: Protocol encryption (SMB encryption, Kerberos-secured NFS) is negotiated between clients and the parent SVM's endpoints per protocol and mount option -- the volume is a data container behind those endpoints with no transport surface of its own.
    - control_id: no-public-access
      status: not_applicable
      notes: A volume exposes no network endpoint. It is reachable only through its parent SVM's NFS/SMB/iSCSI endpoints, which are network interfaces inside the file system's VPC subnets.
    - control_id: restricted-ingress
      status: not_applicable
      notes: Network reachability is owned by the parent file system's security groups and subnets; the volume itself has no ingress surface. junction_path is the one access-shaped choice here -- a volume without one exists but is not mountable over NFS/SMB.
    - control_id: edge-protection
      status: not_applicable
      notes: A storage volume carries no HTTP request surface -- web ACLs and request filters have nothing to attach to.
    - control_id: rbac
      status: not_applicable
      notes: Data-plane authorization is file permissions -- UNIX mode bits, NTFS ACLs, or both, selected by security_style (inherited from the SVM when unset) -- evaluated by the protocol stack the SVM serves; management access is AWS-account IAM posture, not a component choice.
    - control_id: workload-identity
      status: not_applicable
      notes: The volume runs no workloads and holds no credentials of its own.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The volume exposes no authentication paths of its own; protocol and authentication floors live on the parent SVM and the clients' mount options.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: configurable
      field_path: snaplock_configuration.audit_log_volume
      evidence:
        type: spec_default
        reference: Defaults to false; when true, this volume is designated the SVM's SnapLock audit log volume, recording WORM operations -- file commits, retention changes, and privileged deletions -- for the SVM's SnapLock volumes.
      notes: The scope is SnapLock WORM activity only. General file-access auditing (ONTAP native NAS auditing) is configured through the ONTAP CLI, outside this spec and the module; API-level administrative actions land in CloudTrail as account-level posture.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: FSx reports per-volume metrics (storage consumed, IOPS, throughput) to CloudWatch automatically for every ONTAP volume -- there is no opt-in and no way to disable it.
    - control_id: backup-recovery
      status: configurable
      field_path: skip_final_backup
      evidence:
        type: spec_default
        reference: Defaults to false -- deleting the volume takes an automatic final backup, keeping a last-resort restore point; true opts out for disposable volumes.
      notes: Daily automatic backups of the volume are scheduled and retained by the parent file system's backup settings, not this spec. The snapshot_policy field adds in-volume point-in-time recovery (the ONTAP default policy keeps 6 hourly + 2 daily + 2 weekly snapshots). The delete-time controls are read from state at destroy time -- set them BEFORE the change that deletes the volume.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: Backup retention length is the parent AwsFsxOntapFileSystem's setting; this spec carries no retention field. Snapshot retention (counts per schedule) follows the named snapshot_policy, whose schedules are defined in ONTAP, not here.
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Availability is inherited from the parent file system's deployment type -- a volume spans whatever single-AZ or multi-AZ layout the file system provides and cannot choose its own.
    - control_id: deletion-protection
      status: configurable
      field_path: snaplock_configuration.snaplock_type
      evidence:
        type: spec_default
        reference: A SnapLock volume holding unexpired WORM files refuses deletion -- bypass_snaplock_enterprise_retention defaults to false, so even ENTERPRISE volumes cannot be destroyed past retention without an explicit bypass, and COMPLIANCE volumes can never be bypassed by anyone.
      notes: The 02-compliance-snaplock preset creates a COMPLIANCE volume. This is retention-driven refusal, not a general deletion-protection toggle -- a non-SnapLock volume has no protection flag. snaplock_type is ForceNew; choosing COMPLIANCE is effectively irreversible while data holds retention.
    - control_id: managed-patching
      status: not_applicable
      notes: A volume is a data container with no software of its own; ONTAP software patching happens on the parent file system during its weekly maintenance window.
