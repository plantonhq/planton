# AwsFsxOntapVolume scenario: a mounted RW FlexVol on the SVM fixture with
# a junction path, explicit security style, AUTO tiering (31-day cooling),
# storage efficiency enabled, tag copying, and skip_final_backup: true so
# the destroy leaves no billed final backup. SnapLock, FLEXGROUP, and the
# byte-precise size arm are excluded with reasons recorded in profile.yaml.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsFsxOntapVolume
metadata:
  name: planton-oss-e2e-awsfxov-flexvol
  id: planton-oss-e2e-awsfxov-flexvol
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsfsxontapvolume
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  storageVirtualMachineId:
    valueFrom:
      kind: AwsFsxOntapStorageVirtualMachine
      name: planton-oss-e2e-awsfxosvm-prereq
      fieldPath: status.outputs.svm_id
  name: vol_e2e_flexvol
  sizeInMegabytes: 10240
  junctionPath: /e2e
  securityStyle: UNIX
  snapshotPolicy: default
  storageEfficiencyEnabled: true
  copyTagsToBackups: true
  skipFinalBackup: true
  tieringPolicy:
    name: AUTO
    coolingPeriod: 31
