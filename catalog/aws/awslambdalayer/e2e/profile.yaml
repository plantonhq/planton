apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awslambdalayer
spec:
  # One scenario: a layer published from the staged zip fixture with a
  # self-account share grant. Free at AWS (layer storage and dormant
  # versions bill nothing). Watch: the version-number string-to-int
  # bridge on the permission (first live run), and the blind
  # round-trip's config-only posture on the never-read-back archive
  # location.
  #
  # Deliberately not exercised live:
  #   - the organization grant arm (principal "*" + organization_id) --
  #     the shared test account is deliberately standalone (the
  #     recorded org-wall class). Unblock: an organization-joined
  #     account, then one scenario extension.
  #   - skip_destroy (leaves dormant versions to sweep manually --
  #     the lane proves the default full-cleanup path instead).
  #
  # PROVEN 2026-08-26: both engines green through the full lifecycle
  # plus the TF blind round-trip (version ARN + the
  # "{layer_arn},{version}" comma composite re-imported at no real
  # change - the version string-to-int bridge held live, and the
  # verifier proved the self-account grant via GetLayerVersionPolicy).
  # Layer version numbers continue across recreates (the Pulumi lane
  # published v1, the TF lane v2 of the same name - the Batch-style
  # monotonic-revision class, harmless). Zero catches.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
