# Where each placeholder in this component's import-ID formats comes
# from (the formats themselves live in aa_import/catalog.yaml).
apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awslambdalayer
spec:
  # The layer version imports by its full version ARN; each share
  # grant composes the unversioned layer ARN with the published
  # version number.
  values:
    - name: layer_version_arn
      derivations:
        - from_output: layer_version_arn
      where_to_find: >-
        Lambda console -> Layers -> the layer -> Versions (the version
        ARN), or `aws lambda list-layer-versions --layer-name <name>`
        (LayerVersionArn).
    - name: layer_arn
      derivations:
        - from_output: layer_arn
      where_to_find: >-
        The unversioned layer ARN - `aws lambda list-layers`
        (LayerArn).
    - name: layer_version
      derivations:
        - from_output: version
      where_to_find: >-
        The published version number - `aws lambda list-layer-versions
        --layer-name <name>` (Version).
