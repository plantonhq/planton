apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awsorganizationalunit
spec:
  # The OU imports by its AWS-generated "ou-..." ID.
  values:
    - name: ou_id
      derivations:
        - from_output: ou_id
      where_to_find: >-
        Organizations console -> AWS accounts (select the OU; the ID
        under its name), or `aws organizations
        list-organizational-units-for-parent --parent-id <root-or-ou>`
        (Id).
