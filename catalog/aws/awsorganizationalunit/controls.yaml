# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsorganizationalunit
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: An OU stores no customer data -- its name and tree position are Organizations control-plane metadata held inside AWS's own service infrastructure, not a data store this component owns.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: There is no data at rest to key (see enc-at-rest); Organizations exposes no KMS surface.
    - control_id: enc-in-transit
      status: not_applicable
      notes: An OU terminates no connections of its own. The only wire traffic involving it -- Organizations management API calls -- happens on AWS API endpoints, which serve exclusively over TLS as provider behavior, not per-OU configuration.
    - control_id: no-public-access
      status: not_applicable
      notes: An OU has no network endpoint to expose; it is a grouping container with no addressable surface.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network surface exists to filter (see no-public-access).
    - control_id: edge-protection
      status: not_applicable
      notes: An OU receives no HTTP requests -- web ACLs and request filters have nothing to attach to.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every OU operation -- create, rename, delete -- is IAM-authorized on the OU (or parent) ARN, and Organizations restricts the calls to the organization's management account (or a member account granted the actions through the organization's resource policy). Member accounts cannot restructure the tree they sit in.
      notes: The OU is itself an access-control INSTRUMENT -- SCPs attached to it through AwsOrganizationPolicy bind every account beneath it. That inherited governance is configured on the policy component, not here.
    - control_id: workload-identity
      status: not_applicable
      notes: An OU runs no workload; there is no principal to give an identity to.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: Organizations has a single authentication path -- SigV4-signed IAM requests; no legacy or weaker protocol exists to disable on an OU.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: The spec exposes no audit surface. Organizations calls that create, rename, or delete the OU are recorded by AWS CloudTrail as account-level posture, not per-OU configuration.
    - control_id: monitoring-integration
      status: not_applicable
      notes: Organizations publishes no CloudWatch metrics for OUs; tree-change signals surface through CloudTrail events, outside this spec and the modules.
    - control_id: backup-recovery
      status: not_applicable
      notes: An OU holds no data to back up -- it is declarative configuration fully re-creatable from the manifest. Note the parent reference is immutable, so "restoring" an OU elsewhere in the tree is a recreate that then needs accounts moved into it.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Organizations is a global control-plane service -- the OU is the same object from every region, with no zonal placement to configure.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither AWS nor the modules expose a deletion-protection flag. AWS does refuse DeleteOrganizationalUnit while the OU still contains accounts or child OUs -- a structural dependency guard, not a configurable protection.
    - control_id: managed-patching
      status: not_applicable
      notes: An OU is a pure configuration object with no software to patch.
