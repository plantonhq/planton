syntax = "proto3";

package dev.planton.aws.awsorganizationalunit.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsorganizationalunit/v1alpha1/outputs.proto";
import "catalog/aws/awsorganizationalunit/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsOrganizationalUnit {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsOrganizationalUnit'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsOrganizationalUnitSpec spec = 4 [(buf.validate.field).required = true];
  AwsOrganizationalUnitStatus status = 5;
}

message AwsOrganizationalUnitStatus {
  AwsOrganizationalUnitOutputs outputs = 1;
}
