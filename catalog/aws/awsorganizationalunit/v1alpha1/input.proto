syntax = "proto3";

package dev.planton.aws.awsorganizationalunit.v1alpha1;

import "catalog/aws/awsorganizationalunit/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsOrganizationalUnitIacInput is the input for the IaC modules
// that manage an organizational unit.
message AwsOrganizationalUnitIacInput {
  // target is the AwsOrganizationalUnit resource to deploy.
  AwsOrganizationalUnit target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
