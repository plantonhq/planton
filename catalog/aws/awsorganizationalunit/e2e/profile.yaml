apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsorganizationalunit
spec:
  # An organizational unit under live E2E: one first-level OU under
  # the organization fixture's root (the registry-prerequisite chain
  # deploys the org), proving the composed root_id wiring, the
  # spaces-legal explicit ou_name, and the identity tag map. Nested
  # OUs ride the same render path (a literal ou- parent) - one level
  # is representative.
  #
  # Verification is DescribeOrganizationalUnit keyed on ou_id.
  tier: 1
  status: deferred
  deferred_reason: >-
    Deferred by owner decision (2026-08-16, the standing org-wall
    class): OUs exist only inside an organization and the shared test
    account is deliberately standalone/non-org - the fixture chain
    would have to create THE organization first. The kind is
    offline-proven (green tofu plan + pulumi preview per engine).
    Unblock: an owner reversal to the transient-organization posture
    or a dedicated org-capable test account.
  timeout_minutes: 20
