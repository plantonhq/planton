syntax = "proto3";

package dev.planton.aws.awsekscluster.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsekscluster/v1alpha1/outputs.proto";
import "catalog/aws/awsekscluster/v1alpha1/spec.proto";
import "shared/metadata.proto";

// aws-eks-cluster
message AwsEksCluster {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsEksCluster'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsEksClusterSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsEksClusterStatus status = 5;
}

// aws-eks-cluster status
message AwsEksClusterStatus {
  //outputs
  //  aws-eks-cluster outputs
  AwsEksClusterOutputs outputs = 1;
}
