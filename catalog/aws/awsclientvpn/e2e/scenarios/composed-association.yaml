# AwsClientVpn composed scenario: the full remote-access posture. One
# target network association (the slow part -- AWS takes ~10 minutes each
# to attach and detach, with a 4-minute waiter floor), the VPC surface
# (vpc_id from the VPC fixture; the subnet from the shared subnet
# fixture arrives via the e2e-prerequisites annotation), an extra route
# through the associated subnet (proving the route→association ordering
# edge both modules declare), and authorization rules for both the VPC
# range and the routed destination. UDP transport exercises the arm the
# endpoint-only lane leaves out.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsClientVpn
metadata:
  name: planton-oss-e2e-awsvpn-assoc
  id: planton-oss-e2e-awsvpn-assoc
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsclientvpn
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsSubnet"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E Client VPN composed association lane
  authenticationOptions:
    - type: certificate-authentication
      rootCertificateChainArn:
        valueFrom:
          kind: AwsCertManagerCert
          name: planton-oss-e2e-acm-prereq
          fieldPath: status.outputs.cert_arn
  serverCertificateArn:
    valueFrom:
      kind: AwsCertManagerCert
      name: planton-oss-e2e-acm-prereq
      fieldPath: status.outputs.cert_arn
  clientCidrBlock: 10.100.0.0/22
  splitTunnel: true
  transportProtocol: udp
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: planton-oss-e2e-awsvpc-prereq
      fieldPath: status.outputs.vpc_id
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
  authorizationRules:
    - targetNetworkCidr: 10.0.0.0/16
      authorizeAllGroups: true
      description: reach the fixture VPC range
    - targetNetworkCidr: 192.168.0.0/16
      authorizeAllGroups: true
      description: reach the routed on-prem-style range
  routes:
    - destinationCidrBlock: 192.168.0.0/16
      targetSubnetId:
        valueFrom:
          kind: AwsSubnet
          name: planton-oss-e2e-awssubnet-prereq-a
          fieldPath: status.outputs.subnet_id
      description: on-prem-style range via the associated subnet
