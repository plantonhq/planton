apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsclientvpn
spec:
  # A Client VPN endpoint under live E2E: two lanes. The endpoint-only lane
  # is fast (endpoint create is near-instant; a zero-association endpoint
  # is a valid pre-staged front door) and proves the endpoint surface plus
  # a folded authorization rule. The composed lane pays the association
  # cost -- AWS takes ~10 minutes each way with a 4-minute waiter floor --
  # to prove the association/route/rule folds and their ordering edge.
  # Registry prerequisite: AwsCertManagerCert (the imported self-signed
  # fixture serves as both server certificate and client CA chain).
  # Excluded arms recorded in the scenarios: directory/federated auth
  # (need an AD directory / IAM SAML provider), connection logging (needs
  # a log-group fixture; proven offline), IPv6/dual-stack address types,
  # the transit-gateway arm (needs a live TGW). Verification is
  # DescribeClientVpnEndpoints keyed on the endpoint ID, state-aware
  # (deleting counts as absent).
  #
  # Proven live 2026-08-13, both engines, both scenarios (the reopened
  # owner deferral closed). Observed timings: composed lane ~16 min
  # (Pulumi) / ~29 min (Terraform) per engine end-to-end; the association
  # attach/detach ran ~5-7 min each way (faster than the historical ~10).
  # ONE live catch, fixed at the full bar: AWS deletes a route through the
  # associated target network SLOWLY — 'deleting' past the provider's
  # 4-minute default delete timeout (twice) — both modules now pin the
  # route's create/delete timeouts at 10m. The un-disable heal is
  # live-proven three ways: the endpoint-only lane echoed the connect
  # hook explicitly disabled (applied) beside the enabled banner; the
  # composed lane echoed connect AND banner explicitly disabled; and a
  # two-apply revert probe on BOTH engines flipped an enabled banner to
  # a removed block with AWS reporting Enabled=false after the second
  # apply (pre-heal: a silent no-op).
  tier: 2
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 60
