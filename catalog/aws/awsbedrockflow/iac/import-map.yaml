apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awsbedrockflow
spec:
  # The flow imports by its bare id.
  values:
    - name: flow_id
      derivations:
        - from_output: flow_id
      where_to_find: >-
        Bedrock console -> Flows -> <flow> (the ID), or
        `aws bedrock-agent list-flows` (id).
