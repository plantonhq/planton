syntax = "proto3";

package dev.planton.aws.awsbedrockflow.v1alpha1;

import "catalog/aws/awsbedrockflow/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsBedrockFlowIacInput is the input for the IaC modules that deploy
// the Bedrock flow.
message AwsBedrockFlowIacInput {
  // target is the AwsBedrockFlow resource to deploy.
  AwsBedrockFlow target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
