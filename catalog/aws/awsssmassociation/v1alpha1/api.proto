syntax = "proto3";

package dev.planton.aws.awsssmassociation.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsssmassociation/v1alpha1/outputs.proto";
import "catalog/aws/awsssmassociation/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsSsmAssociation {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsSsmAssociation'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsSsmAssociationSpec spec = 4 [(buf.validate.field).required = true];
  AwsSsmAssociationStatus status = 5;
}

message AwsSsmAssociationStatus {
  AwsSsmAssociationOutputs outputs = 1;
}
