# Minimal Redis serverless cache: fastest-provisioning ElastiCache shape for
# live E2E. Subnet pair prerequisite satisfies the VPC endpoint requirement.
# Minimum usage limits keep cost bounded; major engine version unpinned.
# Full metadata is supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsServerlessElasticache
metadata:
  name: planton-oss-e2e-srvless-smoke
  id: planton-oss-e2e-srvless-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsserverlesselasticache
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  engine: redis
  description: Planton OSS E2E serverless Redis
  dataStorageMaxGb: 1
  ecpuMax: 1000
  ecpuMin: 1000
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-b
        fieldPath: status.outputs.subnet_id
