apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsserverlesselasticache
spec:
  # ElastiCache Serverless cache under live E2E: the harness deploys the
  # AwsVpc + two-AZ AwsSubnet prerequisites, runs deploy ->
  # DescribeServerlessCaches verify -> destroy -> verify-destroyed on both
  # provisioners. The scenario is a Redis serverless cache with minimum usage
  # limits — the fastest-provisioning cache kind in the family. Serverless
  # endpoint creation dominates runtime at roughly five minutes each way.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
