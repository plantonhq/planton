syntax = "proto3";

package dev.planton.aws.awsserverlesselasticache.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsserverlesselasticache/v1alpha1/outputs.proto";
import "catalog/aws/awsserverlesselasticache/v1alpha1/spec.proto";
import "shared/metadata.proto";

// aws-serverless-elasticache
message AwsServerlessElasticache {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsServerlessElasticache'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsServerlessElasticacheSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsServerlessElasticacheStatus status = 5;
}

// aws-serverless-elasticache status
message AwsServerlessElasticacheStatus {
  //outputs
  AwsServerlessElasticacheOutputs outputs = 1;
}
