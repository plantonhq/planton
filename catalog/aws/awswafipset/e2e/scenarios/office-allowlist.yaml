# AwsWafIpSet scenario: a REGIONAL IPv4 allow-list carrying both entry
# shapes AWS accepts -- a /24 range and a /32 single host (WAF rejects bare
# addresses, so the /32 form is the single-host idiom the spec's CEL
# enforces up front). A true leaf: WAF sets need no VPC or IAM fixtures.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsWafIpSet
metadata:
  name: planton-oss-e2e-awswafipset-office
  id: planton-oss-e2e-awswafipset-office
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awswafipset
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  scope: REGIONAL
  ipAddressVersion: IPV4
  addresses:
    - 203.0.113.0/24
    - 198.51.100.44/32
  description: Corporate office egress ranges for e2e
