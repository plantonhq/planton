# Fixture AwsWafIpSet consumed by web-ACL scenarios that exercise
# ip_set_reference statements. Dependency-free (WAF sets need no VPC), fixed
# name so name-aware resolution and orphan sweeps stay stable.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsWafIpSet
metadata:
  name: planton-oss-e2e-awswafipset-prereq
  id: planton-oss-e2e-awswafipset-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awswafipset
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  scope: REGIONAL
  ipAddressVersion: IPV4
  addresses:
    - 203.0.113.0/24
    - 198.51.100.44/32
  description: E2E fixture allow-list
