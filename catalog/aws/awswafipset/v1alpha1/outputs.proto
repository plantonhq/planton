syntax = "proto3";

package dev.planton.aws.awswafipset.v1alpha1;

// AwsWafIpSetOutputs captures observable identifiers from a provisioned
// WAFv2 IP set.
//
// The primary output is `ip_set_arn` — the value a web ACL's
// ip_set_reference statement (AwsWafWebAcl) points at to match requests
// against this set's addresses.
message AwsWafIpSetOutputs {
  // The Amazon Resource Name of the IP set
  // (arn:aws:wafv2:<region>:<account>:<scope>/ipset/<name>/<id>).
  // The identifier web ACL rules reference.
  string ip_set_arn = 1;

  // The AWS-assigned IP set ID (a UUID). Used together with the name and
  // scope when addressing the set through the WAFv2 API directly.
  string ip_set_id = 2;

  // The IP set name as created in AWS (derived from metadata.name).
  string ip_set_name = 3;
}
