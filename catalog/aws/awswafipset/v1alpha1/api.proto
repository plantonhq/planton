syntax = "proto3";

package dev.planton.aws.awswafipset.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awswafipset/v1alpha1/outputs.proto";
import "catalog/aws/awswafipset/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsWafIpSet is the API envelope for an AWS WAFv2 IP set — a named,
// reusable collection of IP addresses/CIDR ranges that web ACL rules match
// requests against (allow-lists, deny-lists, rate-limit scoping).
message AwsWafIpSet {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this resource, must be "AwsWafIpSet".
  string kind = 2 [(buf.validate.field).string.const = "AwsWafIpSet"];

  // metadata captures identifying information (name, org, environment,
  // labels) and must pass standard validations for resource naming.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the desired configuration of the IP set.
  AwsWafIpSetSpec spec = 4 [(buf.validate.field).required = true];

  // status holds post-deployment information.
  AwsWafIpSetStatus status = 5;
}

// AwsWafIpSetStatus describes the status of a WAFv2 IP set resource.
message AwsWafIpSetStatus {
  // outputs captures the observable values returned by Pulumi/Terraform
  // after provisioning.
  AwsWafIpSetOutputs outputs = 1;
}
