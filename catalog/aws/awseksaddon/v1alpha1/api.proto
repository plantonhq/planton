syntax = "proto3";

package dev.planton.aws.awseksaddon.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awseksaddon/v1alpha1/outputs.proto";
import "catalog/aws/awseksaddon/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsEksAddon represents an EKS managed add-on: cluster software whose
// install, upgrades, configuration, and removal AWS manages through the
// EKS control plane, installed on an AwsEksCluster.
message AwsEksAddon {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this managed add-on resource.
  string kind = 2 [(buf.validate.field).string.const = "AwsEksAddon"];

  // metadata captures identifying information (name, org, version, etc.)
  // and must pass standard validations for resource naming.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the core configuration data defining how the add-on is provisioned.
  AwsEksAddonSpec spec = 4 [(buf.validate.field).required = true];

  // status holds runtime or post-deployment information.
  AwsEksAddonStatus status = 5;
}

// AwsEksAddonStatus describes the status fields for a managed add-on resource.
message AwsEksAddonStatus {
  // outputs captures the outputs returned by Pulumi/Terraform after provisioning.
  AwsEksAddonOutputs outputs = 1;
}
