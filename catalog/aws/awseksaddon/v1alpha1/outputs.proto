syntax = "proto3";

package dev.planton.aws.awseksaddon.v1alpha1;

// AwsEksAddonOutputs describes the values returned after
// provisioning an EKS managed add-on.
message AwsEksAddonOutputs {
  // addon_arn is the Amazon Resource Name of the add-on --
  // arn:aws:eks:<region>:<account>:addon/<cluster>/<addon-name>/<uuid>.
  string addon_arn = 1;

  // addon_name is the EKS catalog name the add-on was installed under
  // (e.g. "vpc-cni").
  string addon_name = 2;

  // addon_version is the version actually running -- the resolved AWS
  // default when the spec left addon_version empty, else the pinned
  // version.
  string addon_version = 3;
}
