syntax = "proto3";

package dev.planton.aws.awsnlb.v1alpha1;

import "catalog/aws/awsnlb/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsNlbIacInput provides the inputs to the IaC modules
// (Pulumi or Terraform) that provision the Network Load Balancer.
message AwsNlbIacInput {
  // target infra-component
  AwsNlb target = 1;
  // provider-config
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
