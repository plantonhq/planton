syntax = "proto3";

package dev.planton.aws.awsnlb.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsnlb/v1alpha1/outputs.proto";
import "catalog/aws/awsnlb/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsNlb represents a managed AWS Network Load Balancer
// deployed via Planton. This resource provisions a Layer 4 load balancer
// with listeners, target groups, and optional Route53 DNS records.
message AwsNlb {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this NLB resource.
  string kind = 2 [(buf.validate.field).string.const = "AwsNlb"];

  // metadata captures identifying information (name, org, version, etc.)
  // and must pass standard validations for resource naming.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the core configuration defining how the NLB is provisioned.
  AwsNlbSpec spec = 4 [(buf.validate.field).required = true];

  // status holds runtime or post-deployment information.
  AwsNlbStatus status = 5;
}

// AwsNlbStatus describes the status fields for an NLB resource.
message AwsNlbStatus {
  // outputs captures the outputs returned by Pulumi/Terraform after provisioning.
  AwsNlbOutputs outputs = 1;
}
