syntax = "proto3";

package dev.planton.aws.awsapprunnerservice.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsapprunnerservice/v1alpha1/outputs.proto";
import "catalog/aws/awsapprunnerservice/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsAppRunnerService is the API envelope for an AWS App Runner service --
// the fully managed path from a container image or source repository to a
// scaled, load-balanced HTTPS endpoint.
message AwsAppRunnerService {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this resource, must be "AwsAppRunnerService".
  string kind = 2 [(buf.validate.field).string.const = "AwsAppRunnerService"];

  // metadata captures identifying information (name, org, environment,
  // labels) and must pass standard validations for resource naming.
  // The service's AWS name is metadata.name (ForceNew: renaming replaces
  // the service).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the desired configuration of the App Runner service.
  AwsAppRunnerServiceSpec spec = 4 [(buf.validate.field).required = true];

  // status holds post-deployment information.
  AwsAppRunnerServiceStatus status = 5;
}

// AwsAppRunnerServiceStatus describes the status of an App Runner service
// resource.
message AwsAppRunnerServiceStatus {
  // outputs captures the observable values returned by Pulumi/Terraform
  // after provisioning.
  AwsAppRunnerServiceOutputs outputs = 1;
}
