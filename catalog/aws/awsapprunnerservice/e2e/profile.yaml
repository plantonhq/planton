apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsapprunnerservice
spec:
  # Two scenarios: the dependency-free minimal service (a public sample
  # image to an HTTPS endpoint; App Runner provisions + health-checks in
  # roughly 3-5 minutes, waiter ceiling 20) and the composed shape (auto
  # scaling + observability configurations by reference, WAF association)
  # whose companions install through the e2e-prerequisites annotation.
  # Custom domains are excluded from the live lane: association requires a
  # domain the test tenant owns (the ACM validated-certificate class); the
  # fold is proven by spec tests and the offline plan gate.
  # The vpc_ingress_connections fold is offline-proven
  # (canonical-manifest plan/preview render the connection on both
  # engines); its live arm is a recorded deferral -- unblock: an
  # AwsVpcEndpoint fixture for com.amazonaws.<region>.apprunner.requests
  # (that kind is itself un-closed; pair the arm with its depth session).
  # Live API evidence (DescribeService, both engines' instances): a
  # tracing-less service echoes NO ObservabilityConfiguration member at
  # all (nil), never {ObservabilityEnabled: false} -- so an always-render
  # module heal for the provider's un-disable gap would perpetually diff
  # on the majority shape and stays rejected.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
