syntax = "proto3";

package dev.planton.aws.awssecretsmanagersecret.v1alpha1;

// AwsSecretsManagerSecretOutputs captures observable identifiers from a
// provisioned Secrets Manager secret. These outputs are used by downstream
// resources to wire dependencies via StringValueOrRef.
message AwsSecretsManagerSecretOutputs {
  // The Amazon Resource Name of the secret - the canonical join key for IAM
  // policies, ECS/Lambda secret injection, and cross-service references.
  // Note AWS appends a random 6-character suffix to secret ARNs
  // (arn:...:secret:name-AbCdEf), so the ARN is not derivable from the name.
  string secret_arn = 1;

  // The secret's AWS name (spec.secret_name, else metadata.name).
  // Consumers that resolve secrets by name (SDK GetSecretValue calls)
  // join on this.
  string secret_name = 2;

  // The version ID of the secret version this deployment manages (the
  // AWSCURRENT version when a value arm is set; empty for a shell secret
  // with no managed value).
  string version_id = 3;
}
