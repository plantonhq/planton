syntax = "proto3";

package dev.planton.aws.awssecretsmanagersecret.v1alpha1;

import "catalog/aws/awssecretsmanagersecret/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsSecretsManagerSecretIacInput is the input for the IaC modules that
// deploy the Secrets Manager secret.
message AwsSecretsManagerSecretIacInput {
  // target is the AwsSecretsManagerSecret resource to deploy.
  AwsSecretsManagerSecret target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
