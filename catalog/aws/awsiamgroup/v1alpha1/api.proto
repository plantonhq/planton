syntax = "proto3";

package dev.planton.aws.awsiamgroup.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsiamgroup/v1alpha1/outputs.proto";
import "catalog/aws/awsiamgroup/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsIamGroup {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsIamGroup'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsIamGroupSpec spec = 4 [(buf.validate.field).required = true];
  AwsIamGroupStatus status = 5;
}

message AwsIamGroupStatus {
  AwsIamGroupOutputs outputs = 1;
}
