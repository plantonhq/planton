syntax = "proto3";

package dev.planton.aws.awsiamgroup.v1alpha1;

import "catalog/aws/awsiamgroup/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsIamGroupIacInput is the input for the IaC modules that manage
// an IAM group, its declarative membership, and its policies.
message AwsIamGroupIacInput {
  // target is the AwsIamGroup resource to deploy.
  AwsIamGroup target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
