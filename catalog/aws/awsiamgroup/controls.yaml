# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsiamgroup
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A group stores no customer data -- its membership and policy documents are IAM control-plane metadata held inside AWS's own service infrastructure, not a data store this component owns.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: There is no data at rest to key (see enc-at-rest); IAM exposes no KMS surface for groups.
    - control_id: enc-in-transit
      status: not_applicable
      notes: A group terminates no connections of its own. The only wire traffic involving it -- IAM management calls -- happens on AWS API endpoints, which serve exclusively over TLS as account-wide provider behavior, not per-group configuration.
    - control_id: no-public-access
      status: not_applicable
      notes: A group has no network endpoint to expose. Its exposure surface is identity -- which users belong and what they may do -- governed by the membership and policy arms (see rbac).
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network surface exists to filter; a group is an identity container with no addresses or ports.
    - control_id: edge-protection
      status: not_applicable
      notes: A group receives no HTTP requests -- web ACLs and request filters have nothing to attach to.
    - control_id: rbac
      status: configurable
      field_path: managed_policy_arns
      evidence:
        type: spec_default
        reference: "The group IS an RBAC instrument -- it binds a job-function permission set to a membership list. managed_policy_arns carries the reusable grants (AwsIamPolicy references or AWS-managed literals), inline_policies the grants unique to this one group, and users the DECLARATIVE membership: the list is authoritative, so members added out-of-band are removed on the next apply -- drift toward wider access self-heals."
      notes: The quality of the control is the operator's -- attaching PowerUserAccess to a broad membership is representable. Attachments made outside this resource are left alone by design (each attachment reconciles individually), so out-of-band GRANTS do not self-heal the way out-of-band memberships do.
    - control_id: workload-identity
      status: not_applicable
      notes: Groups cannot be assumed and hold no workload sessions -- they exist to organize IAM USERS (human, long-lived-credential identities). Keyless workload identity is the AwsIamRole/AwsIamOidcProvider territory.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: A group carries no credential path at all -- no password, no keys, nothing to authenticate AS. The long-lived credentials belong to its member users, whose hygiene is governed on AwsIamUser and the account's password policy (AwsIamAccountSettings).
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: The spec exposes no audit surface. IAM management calls against the group -- membership changes, policy attachments -- are recorded by AWS CloudTrail as account-level posture, not per-group configuration.
    - control_id: monitoring-integration
      status: not_applicable
      notes: IAM publishes no CloudWatch metrics per group; access-hygiene signals (Access Analyzer findings, last-used data) are account-level IAM features outside this spec and the modules.
    - control_id: backup-recovery
      status: not_applicable
      notes: A group holds no data to back up -- it is declarative configuration fully re-creatable from the manifest; memberships, attachments, and inline policies re-apply with it.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: IAM is a global control-plane service -- AWS replicates group definitions across its own infrastructure, and the group binds account-wide with no zonal placement to configure.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither AWS nor the modules expose a deletion-protection flag for groups. AWS does refuse DeleteGroup while members or policies remain -- the modules sweep the ones they own on destroy, so only out-of-band wiring blocks deletion, a dependency guard rather than a configurable protection.
    - control_id: managed-patching
      status: not_applicable
      notes: A group is a pure configuration object with no software to patch.
