# Private AwsRoute53Zone scenario: split-horizon zone resolving only inside
# the composed VPC — the arm that exercises the zone's vpc block (the
# private/public split drives most of the module's shape). The AwsVpc
# fixture is composed via the e2e-prerequisites annotation because a private
# zone OPTIONALLY needs a VPC (the kind's registry stays honest: public
# zones are leaves). vpc_region is omitted to prove the defaults-to-zone-
# region behavior.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsRoute53Zone
metadata:
  name: planton-oss-e2e-private.internal
  id: planton-oss-e2e-awsroute53zone-priv
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsroute53zone
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsVpc"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  isPrivate: true
  forceDestroy: true
  vpcAssociations:
    - vpcId:
        valueFrom:
          kind: AwsVpc
          name: planton-oss-e2e-awsvpc-prereq
          fieldPath: status.outputs.vpc_id
