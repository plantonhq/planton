# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awsmskserverlesscluster
spec:
  aws:
    statements:
      - sid: ManageServerlessCluster
        actions:
          - kafka:CreateClusterV2
          - kafka:DeleteCluster
          - kafka:TagResource
          - kafka:UntagResource
        resources:
          - arn:aws:kafka:*:*:cluster/*
        provenance: derived
        notes: Covers aws_msk_serverless_cluster / msk.ServerlessCluster -- the single resource both modules create. Serverless clusters are created through CreateClusterV2 (the V2 API that carries the serverless configuration; the original CreateCluster cannot make one) and deleted through the shared DeleteCluster. All four actions authorize on the cluster ARN format (cluster/${ClusterName}/${Uuid}) per the service reference. TagResource rides the create call's tags and serves later tag reconciliation -- the only in-place update this effectively immutable resource supports.
      - sid: ReadClusterState
        actions:
          - kafka:DescribeClusterV2
          - kafka:ListTagsForResource
        resources:
          - arn:aws:kafka:*:*:cluster/*
        provenance: derived
        notes: Plan/refresh reads and the create/delete wait loops -- the provider polls DescribeClusterV2 until the cluster reaches ACTIVE after create and until it disappears after delete. Both actions take resource-level scoping on the cluster ARN.
      - sid: ReadBootstrapBrokers
        actions:
          - kafka:GetBootstrapBrokers
        resources:
          - "*"
        provenance: derived
        notes: Populates the bootstrap_brokers_sasl_iam attribute both modules export (the port-9098 connection string, the only one serverless MSK exposes). The service reference lists NO resource types for GetBootstrapBrokers -- unlike its Describe siblings -- so IAM evaluates it against Resource "*" and an ARN-scoped grant would deny the read at runtime. The wildcard is the narrowest possible scope.
      - sid: CreateKafkaServiceLinkedRole
        actions:
          - iam:CreateServiceLinkedRole
        resources:
          - arn:aws:iam::*:role/aws-service-role/kafka.amazonaws.com/AWSServiceRoleForKafka*
        provenance: derived
        notes: The first MSK cluster in an account creates the AWSServiceRoleForKafka service-linked role automatically -- the role MSK itself uses to place and manage the client-facing network interfaces in the referenced subnets. The deploying principal therefore needs no ec2:* grants (ENI work is the service-linked role's, not the caller's), but a fresh account's first create fails without this narrowly scoped IAM grant.
