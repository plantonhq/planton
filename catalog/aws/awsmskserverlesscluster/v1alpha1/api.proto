syntax = "proto3";

package dev.planton.aws.awsmskserverlesscluster.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsmskserverlesscluster/v1alpha1/outputs.proto";
import "catalog/aws/awsmskserverlesscluster/v1alpha1/spec.proto";
import "shared/metadata.proto";

// aws-msk-serverless-cluster
message AwsMskServerlessCluster {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsMskServerlessCluster'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsMskServerlessClusterSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsMskServerlessClusterStatus status = 5;
}

// aws-msk-serverless-cluster status
message AwsMskServerlessClusterStatus {
  //outputs
  AwsMskServerlessClusterOutputs outputs = 1;
}
