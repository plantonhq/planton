# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awswafwebacl
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The web ACL stores rule configuration, not customer data. Request logs persist at the chosen destination (CloudWatch Logs, S3, or Firehose) under that component's encryption posture; data_protection_config can mask sensitive request fields in ALL WAF outputs before they ever leave WAF.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to encrypt (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: WAF inspects requests inline at the protected resource; TLS termination and protocol floors belong to that resource (the ALB's listeners, the CloudFront distribution's viewer policy), never to the ACL.
    - control_id: no-public-access
      status: not_applicable
      notes: A web ACL is a policy document, not an addressable endpoint -- it has no network exposure of its own. Which resources it protects is each protected resource's setting (AwsAlb.spec.web_acl_arn, CloudFront's web_acl_arn), never the ACL's.
    - control_id: restricted-ingress
      status: configurable
      field_path: default_action
      evidence:
        type: spec_default
        reference: The choice is always explicit (default_action is required, type restricted by CEL to exactly allow or block) -- block denies every request no rule explicitly allows (deny-by-default, the private-API posture), allow permits unmatched traffic (the public-website posture).
      notes: All four presets choose allow and restrict through rules instead -- rate limits, geo blocks, and managed rule groups. The rules field is where allow-posture ACLs earn their restrictions.
    - control_id: edge-protection
      status: configurable
      field_path: rules
      evidence:
        type: spec_default
        reference: With no rules, only the default_action applies -- the ACL filters nothing. Each rule adds inspection at the edge, and the full WAFv2 statement language (managed rule groups, rate limiting, geo/IP/byte/SQLi/XSS matching, AND/OR/NOT composition) is modeled in the spec.
      notes: This component IS the edge-protection layer other profiles point at. All four presets attach AWS managed rule groups (Common, KnownBadInputs, SQLi, IP reputation, Anonymous IP) and two add rate limiting; protection only lands once a resource associates the ACL from its own spec.
    - control_id: rbac
      status: not_applicable
      notes: Management access is AWS-account IAM posture, not a component choice; the ACL exposes no authentication plane of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The ACL runs no workloads and holds no credentials of its own.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths of its own -- CAPTCHA and challenge actions verify clients are human or browser-driven, which is bot mitigation, not authentication.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: configurable
      field_path: logging
      evidence:
        type: spec_default
        reference: Unset means no request logging; configuring logging delivers one detailed record per inspected request (matched rules, action taken, request metadata) to a CloudWatch Logs, S3, or Firehose destination whose name must start with "aws-waf-logs-".
      notes: Presets 03 and 04 enable it, both redacting authorization and cookie headers and the query string. Preset 04's filter keeps only records where WAF acted (BLOCK, COUNT, EXCLUDED_AS_COUNT) -- the honest trade of forensic completeness for logging cost.
    - control_id: monitoring-integration
      status: configurable
      field_path: visibility_config
      evidence:
        type: module_default
        reference: When visibility_config is omitted, both modules enable CloudWatch metrics and request sampling with metric_name set to the resource name; setting cloudwatch_metrics_enabled=false is an explicit opt-out.
      notes: Per-rule visibility_config blocks get the same defaulting (metric name = rule name). Every preset leaves the defaults on.
    - control_id: backup-recovery
      status: not_applicable
      notes: The ACL is declarative configuration with no runtime state to back up -- it is re-creatable from the manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: WAF runs at the Region (REGIONAL scope) or the CloudFront edge (CLOUDFRONT scope) with no customer-visible zonal footprint; nothing in the spec places the ACL in Availability Zones.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither AWS nor this spec offers a deletion-protection flag for a web ACL; the blast radius of deletion is protected resources reverting to unfiltered traffic, recreated declaratively from the manifest.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- AWS operates the inspection fleet; no customer-visible patch surface exists.
      notes: Vendor-maintained managed rule groups update automatically as threats evolve UNLESS pinned via the statement's version field -- pinning trades surprise rule changes for the duty to re-pin.
