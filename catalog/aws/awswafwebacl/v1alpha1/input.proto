syntax = "proto3";

package dev.planton.aws.awswafwebacl.v1alpha1;

import "catalog/aws/awswafwebacl/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsWafWebAclIacInput provides the inputs required by Pulumi/Terraform
// modules to provision a WAFv2 Web ACL.
message AwsWafWebAclIacInput {
  // the catalog object to deploy
  AwsWafWebAcl target = 1;
  // provider-config
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
