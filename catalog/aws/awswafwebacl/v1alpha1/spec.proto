    id: "field_keys_scope"
    message: "field_keys is only valid for SINGLE_HEADER/SINGLE_COOKIE/SINGLE_QUERY_ARGUMENT (omit it to protect all keys of the field type)"
    expression: "size(this.field_keys) == 0 || this.field_type in ['SINGLE_HEADER', 'SINGLE_COOKIE', 'SINGLE_QUERY_ARGUMENT']"
  };
}

// AwsWafWebAclCustomResponse defines the HTTP response returned to clients
// when a request is blocked. Use this to provide branded error pages or
// structured API error responses instead of the default AWS WAF block page.
message AwsWafWebAclCustomResponse {
  // HTTP response status code to return. Range: 200-600.
  // Common values: 403 (Forbidden), 429 (Too Many Requests), 503 (Service Unavailable).
  int32 response_code = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {
      gte: 200
      lte: 600
    }
  ];

  // Key referencing a custom_response_body defined at the Web ACL level.
  // When set, the response body from the matching custom_response_body is
  // returned with the specified response_code and content type.
  string custom_response_body_key = 2;

  // Additional HTTP headers to include in the block response.
  repeated AwsWafWebAclCustomHeader response_headers = 3;
}

// AwsWafWebAclCustomHeader defines an HTTP header name-value pair for custom
// request handling (inserted into forwarded requests) or custom responses
// (returned in block responses).
message AwsWafWebAclCustomHeader {
  // HTTP header name (case-insensitive). 1-64 characters: letters, digits,
  // and _ $ . - only. For INSERTED request headers, WAF prefixes the name
  // with "x-amzn-waf-" on the wire (name "sample" arrives as
  // "x-amzn-waf-sample") to avoid clobbering existing request headers;
  // response headers are sent under the name as given.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 64
      pattern: "^[0-9A-Za-z_$.-]+$"
    }
  ];

  // HTTP header value. 1-255 characters.
  string value = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 255
    }
  ];
}

// AwsWafWebAclCustomResponseBody defines a reusable response body template
// that can be referenced by block actions via custom_response_body_key.
//
// Define common error pages once and reference them from multiple rules to
// maintain consistent user experience across different block scenarios.
message AwsWafWebAclCustomResponseBody {
  // Unique key used to reference this response body from custom_response
  // configurations. Must be unique within the Web ACL. 1-128 characters:
  // letters, digits, underscore, hyphen.
  string key = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 128
      pattern: "^[\\w\\-]+$"
    }
  ];

  // The response body content (HTML, plain text, or JSON). Max 10,240 bytes.
  string content = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 10240
    }
  ];

  // MIME type of the content.
  // Valid values: "TEXT_PLAIN", "TEXT_HTML", "APPLICATION_JSON".
  string content_type = 3 [(buf.validate.field).required = true];

  // content_type must be valid.
  option (buf.validate.message).cel = {
    id: "content_type_valid"
    message: "content_type must be 'TEXT_PLAIN', 'TEXT_HTML', or 'APPLICATION_JSON'"
    expression: "this.content_type in ['TEXT_PLAIN', 'TEXT_HTML', 'APPLICATION_JSON']"
  };
}

// AwsWafWebAclLoggingConfig defines the logging destination and optional
// field redaction for WAF request logs.
//
// WAF logging captures detailed information about each request inspected by
// the Web ACL, including matched rules, actions taken, and request metadata.
// This data is essential for security monitoring, forensics, and WAF tuning.
//
// Important: The destination resource name must start with "aws-waf-logs-"
// (enforced by AWS at the API level).
//
// For masking that applies to ALL WAF outputs (not just the log
// destination), see the spec's data_protection_config.
message AwsWafWebAclLoggingConfig {
  // ARN of the logging destination. Must be one of:
  // - CloudWatch Logs log group ARN
  // - S3 bucket ARN
  // - Kinesis Firehose delivery stream ARN
  //
  // The destination resource name must start with "aws-waf-logs-".
  //
  // Deliberately singular: AWS allows exactly one logging destination per
  // web ACL (the Terraform provider's log_destination_configs argument
  // nominally accepts up to 100 entries, but the service contract — SDK:
  // "You can associate one logging destination to a web ACL" — is one).
  //
  // No default_kind is set because the destination can be any of three
  // different resource types; the three are declared as candidates, each
  // with its ARN output.
  dev.planton.shared.foreignkey.v1.StringValueOrRef destination_arn = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.candidate) = {
      kind: AwsCloudwatchLogGroup
      field_path: "status.outputs.log_group_arn"
    },
    (dev.planton.shared.foreignkey.v1.candidate) = {
      kind: AwsS3Bucket
      field_path: "status.outputs.bucket_arn"
    },
    (dev.planton.shared.foreignkey.v1.candidate) = {
      kind: AwsKinesisFirehose
      field_path: "status.outputs.delivery_stream_arn"
    }
  ];

  // HTTP header names to redact from logs (each 1-64 characters). Redacted
  // headers appear as "REDACTED" in log entries instead of their actual
  // values.
  //
  // Common headers to redact: "Authorization", "Cookie", "X-Api-Key".
  repeated string redacted_header_names = 2 [(buf.validate.field).repeated.items.string = {
    min_len: 1
    max_len: 64
  }];

  // Redact the URI path from log entries. When true, the URI path appears
  // as "REDACTED" in logs.
  bool redact_uri_path = 3;

  // Redact the query string from log entries. When true, query string
  // parameters appear as "REDACTED" in logs.
  bool redact_query_string = 4;

  // Redact the HTTP method from log entries. When true, the method appears
  // as "REDACTED" in logs. (Method, query string, URI path, and single
  // headers are the only components AWS supports redacting.)
  bool redact_method = 5;

  // Optional log filtering: keep or drop log records by the action WAF
  // applied or by labels on the request, instead of logging every inspected
  // request. Typical use: keep only BLOCK and COUNT records to cut logging
  // cost on high-traffic ACLs.
  AwsWafWebAclLoggingFilterConfig filter = 6;
}

// AwsWafWebAclLoggingFilterConfig routes each request's log record through
// the filters: the first matching filter's behavior (keep/drop) applies, and
// records matching no filter get default_behavior.
message AwsWafWebAclLoggingFilterConfig {
  // What happens to log records that match NONE of the filters:
  // "KEEP" (log them) or "DROP" (discard them).
  string default_behavior = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "KEEP",
        "DROP"
      ]
    }
  ];

  // The filters, each with its own keep/drop behavior. At least one.
  repeated AwsWafWebAclLoggingFilter filters = 2 [(buf.validate.field).repeated.min_items = 1];
}

// AwsWafWebAclLoggingFilter is one keep-or-drop routing rule for log
// records.
message AwsWafWebAclLoggingFilter {
  // What happens to log records matching this filter: "KEEP" or "DROP".
  string behavior = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "KEEP",
        "DROP"
      ]
    }
  ];

  // How the conditions combine: "MEETS_ALL" (every condition must match)
  // or "MEETS_ANY" (at least one condition matches).
  string requirement = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "MEETS_ALL",
        "MEETS_ANY"
      ]
    }
  ];

  // The match conditions. At least one.
  repeated AwsWafWebAclLoggingFilterCondition conditions = 3 [(buf.validate.field).repeated.min_items = 1];
}

// AwsWafWebAclLoggingFilterCondition is a single match condition for a
// logging filter — exactly one of action / label_name per condition (add
// more conditions to combine them).
message AwsWafWebAclLoggingFilterCondition {
  // Match log records by the action WAF applied to the request:
  // "ALLOW", "BLOCK", "COUNT", "CAPTCHA", "CHALLENGE",
  // "EXCLUDED_AS_COUNT" (rules overridden to count — the tuning-noise
  // filter), or "MONETIZE" (marketplace rule groups only).
  string action = 1 [(buf.validate.field).cel = {
    id: "filter_action_valid"
    message: "action must be 'ALLOW', 'BLOCK', 'COUNT', 'CAPTCHA', 'CHALLENGE', 'EXCLUDED_AS_COUNT', or 'MONETIZE' when set"
    expression: "this == '' || this in ['ALLOW', 'BLOCK', 'COUNT', 'CAPTCHA', 'CHALLENGE', 'EXCLUDED_AS_COUNT', 'MONETIZE']"
  }];

  // Match log records carrying this label. Must be the FULLY QUALIFIED
  // label name including the prefix, e.g.
  // "awswaf:managed:aws:bot-control:bot:category:monitoring".
  string label_name = 2 [(buf.validate.field).string.max_len = 1024];

  // Exactly one condition type per entry.
  option (buf.validate.message).cel = {
    id: "exactly_one_condition"
    message: "set exactly one of action or label_name per condition"
    expression: "(this.action != '') != (this.label_name != '')"
  };
}
