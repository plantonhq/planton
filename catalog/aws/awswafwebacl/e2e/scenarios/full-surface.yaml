# Full-surface AwsWafWebAcl scenario: a REGIONAL ACL exercising every layer
# of the statement language in one document --
#   - a managed rule group tuned three ways (count override on one noisy
#     rule, a NOT byte-match scope-down, a pinned-latest omitted version);
#   - composite rate limiting (CUSTOM_KEYS: per API key header AND source
#     IP), proving the aggregation key surface;
#   - a typed reference chain into BOTH set kinds (ip_set_reference and
#     regex_pattern_set_reference resolve against the fixture sets declared
#     by the e2e-prerequisites annotation);
#   - AND/OR/NOT composition with a label match, exercising three levels of
#     statement nesting (the Terraform module's full unrolled depth);
#   - a `${jndi:` search string, proving the tfvars template-introducer
#     escape live on the byte-match path;
#   - custom response bodies + a branded 403, data protection (hashed
#     Authorization header), a raised API-gateway body-inspection limit, and
#     web-ACL-wide CAPTCHA/challenge immunity windows.
# Logging is NOT wired: the destination must be named aws-waf-logs-* and
# would drag a CloudWatch log group fixture into the chain -- recorded as a
# profile exclusion.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsWafWebAcl
metadata:
  name: planton-oss-e2e-awswafwebacl-full
  id: planton-oss-e2e-awswafwebacl-full
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awswafwebacl
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsWafIpSet,AwsWafRegexPatternSet"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  scope: REGIONAL
  description: E2E full-surface web ACL
  defaultAction:
    type: allow
    customRequestHeaders:
      - name: x-waf-checked
        value: "true"
  captchaConfig:
    immunityTimeSec: 300
  challengeConfig:
    immunityTimeSec: 900
  associationConfig:
    apiGatewayRequestBodyLimit: KB_32
  dataProtectionConfig:
    dataProtections:
      - fieldType: SINGLE_HEADER
        fieldKeys:
          - authorization
        action: HASH
  customResponseBodies:
    - key: blocked-json
      content: '{"error": "request blocked by WAF"}'
      contentType: APPLICATION_JSON
  rules:
    # Priority 0 is deliberate: AWS's rule priorities are 0-based and the
    # spec types priority presence-aware precisely so 0 stays expressible --
    # this arm proves the zero-priority path live.
    - name: managed-common
      priority: 0
      overrideAction: none
      statement:
        managedRuleGroup:
          name: AWSManagedRulesCommonRuleSet
          vendorName: AWS
          ruleActionOverrides:
            - name: SizeRestrictions_BODY
              action: count
          scopeDownStatement:
            notStatement:
              statement:
                byteMatch:
                  searchString: /health
                  positionalConstraint: STARTS_WITH
                  fieldToMatch:
                    uriPath: true
                  textTransformations:
                    - priority: 0
                      type: NONE
    - name: rate-limit-per-api-key
      priority: 2
      action: block
      customResponse:
        responseCode: 429
        customResponseBodyKey: blocked-json
      statement:
        rateBased:
          limit: 500
          evaluationWindowSec: 300
          aggregateKeyType: CUSTOM_KEYS
          customKeys:
            - header:
                name: x-api-key
                textTransformations:
                  - priority: 0
                    type: NONE
            - ip: true
    - name: office-allowlist
      priority: 3
      action: allow
      statement:
        ipSetReference:
          arn:
            valueFrom:
              kind: AwsWafIpSet
              name: planton-oss-e2e-awswafipset-prereq
              fieldPath: status.outputs.ip_set_arn
    - name: scanner-probes
      priority: 4
      action: block
      statement:
        regexPatternSetReference:
          arn:
            valueFrom:
              kind: AwsWafRegexPatternSet
              name: planton-oss-e2e-awswafregex-prereq
              fieldPath: status.outputs.regex_pattern_set_arn
          fieldToMatch:
            uriPath: true
          textTransformations:
            - priority: 0
              type: LOWERCASE
    - name: log4j-probe-block
      priority: 5
      action: block
      ruleLabels:
        - e2e:exploit:jndi
      statement:
        orStatement:
          statements:
            - byteMatch:
                searchString: ${jndi:ldap
                positionalConstraint: CONTAINS
                fieldToMatch:
                  headers:
                    matchPattern:
                      all: true
                    matchScope: VALUE
                    oversizeHandling: MATCH
                textTransformations:
                  - priority: 0
                    type: URL_DECODE
                  - priority: 1
                    type: LOWERCASE
            - andStatement:
                statements:
                  - geoMatch:
                      countryCodes:
                        - RU
                        - KP
                  - notStatement:
                      statement:
                        labelMatch:
                          scope: NAMESPACE
                          key: "awswaf:managed:aws:core-rule-set:"
    - name: oversized-bodies
      priority: 6
      action: block
      statement:
        sizeConstraint:
          comparisonOperator: GT
          size: 16384
          fieldToMatch:
            body:
              oversizeHandling: MATCH
          textTransformations:
            - priority: 0
              type: NONE
