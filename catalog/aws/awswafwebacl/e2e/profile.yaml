apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awswafwebacl
spec:
  # A WAFv2 web ACL under live E2E: the harness deploys the fixture IP set
  # and regex pattern set (declared by the scenario's e2e-prerequisites
  # annotation), then runs deploy -> GetWebACL verify (id/name/scope parsed
  # from the ARN output) -> destroy -> verify-destroyed on both
  # provisioners. The full-surface scenario covers the managed rule group
  # configs path, CUSTOM_KEYS rate aggregation, both set-reference kinds,
  # three levels of AND/OR/NOT nesting, custom responses, data protection,
  # association config, and a literal `${jndi:` search string proving the
  # tfvars template-introducer escape live. Deliberately not in the live
  # scenario:
  #   - CLOUDFRONT scope: requires us-east-1 while the shared fixtures live
  #     in us-west-2; the rule engine is identical across scopes.
  #   - logging (destination, the full redaction surface, and the logging
  #     filter): the destination must be named aws-waf-logs-* and would
  #     drag a CloudWatch log group fixture into every run; the whole
  #     surface is a single put-style satellite proven by the offline gate
  #     (the canonical manifest carries destination + all four redaction
  #     arms + a keep-only-enforcement filter; unblock: a shared
  #     aws-waf-logs-* log-group fixture if one ever ships).
  #   - intelligent-threat configs (ATP/ACFP/Bot Control/anti-DDoS): paid
  #     add-on rule groups with per-request pricing; their JSON serialization
  #     is locked by the module unit tests.
  #   - CAPTCHA/challenge rule actions and token_domains: need a JS client
  #     integration to observe; the immunity-time configs ARE deployed live.
  # Live dual-engine run 2026-07-08 (with both set fixtures deployed by the
  # prerequisite chain): Pulumi 1m09s / Terraform 1m27s. Flipped to
  # pending_proof 2026-08-11: the depth closure modeled the logging filter
  # and method redaction, presence-typed the rule priority (0 now
  # expressible), and repaired the data-protection field_keys CEL -- the
  # rule-tree serializers are byte-identical, but the spec and the logging
  # renderers changed in both engines, so the earned proof no longer covers
  # the shipped surface.
  #
  # Re-proven 2026-08-12 (both engines, all eight phases): Pulumi 1m44s /
  # Terraform 1m35s. The priority-0 arm's first live proof: GetWebACL on
  # BOTH lanes' ACLs echoed the managed-common rule at Priority 0
  # (capacity 834) -- the presence-typed field round-trips AWS's 0-based
  # console default. The new no-logging render path also ran clean four
  # more times as the ALB lanes' fixture chains this same session.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
