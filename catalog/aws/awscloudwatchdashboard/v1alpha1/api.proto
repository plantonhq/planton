syntax = "proto3";

package dev.planton.aws.awscloudwatchdashboard.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awscloudwatchdashboard/v1alpha1/outputs.proto";
import "catalog/aws/awscloudwatchdashboard/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsCloudwatchDashboard {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsCloudwatchDashboard'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsCloudwatchDashboardSpec spec = 4 [(buf.validate.field).required = true];
  AwsCloudwatchDashboardStatus status = 5;
}

message AwsCloudwatchDashboardStatus {
  AwsCloudwatchDashboardOutputs outputs = 1;
}
