syntax = "proto3";

package dev.planton.aws.awsiamaccountsettings.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsiamaccountsettings/v1alpha1/outputs.proto";
import "catalog/aws/awsiamaccountsettings/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsIamAccountSettings {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsIamAccountSettings'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsIamAccountSettingsSpec spec = 4 [(buf.validate.field).required = true];
  AwsIamAccountSettingsStatus status = 5;
}

message AwsIamAccountSettingsStatus {
  AwsIamAccountSettingsOutputs outputs = 1;
}
