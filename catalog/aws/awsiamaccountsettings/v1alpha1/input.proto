syntax = "proto3";

package dev.planton.aws.awsiamaccountsettings.v1alpha1;

import "catalog/aws/awsiamaccountsettings/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsIamAccountSettingsIacInput is the input for the IaC modules
// that manage IAM's account-level settings.
message AwsIamAccountSettingsIacInput {
  // target is the AwsIamAccountSettings resource to deploy.
  AwsIamAccountSettings target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
