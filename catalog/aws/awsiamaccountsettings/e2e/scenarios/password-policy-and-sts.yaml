# The two account-local arms live: a hardened password policy and the
# v2 STS token version. The ALIAS arm is deliberately NOT exercised -
# an account has exactly one alias and applying one would REPLACE the
# shared test account's sign-in URL (unblock: a verified-alias-free or
# dedicated account). Destroy contracts asserted by the verifier:
# the policy RESETS to AWS defaults (reads back as no custom policy);
# the STS preference PERSISTS at v2 (no-op delete). v2 tokens are
# valid in every region, so leaving the shared account on v2 is
# benign and deliberate. ~$0.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamAccountSettings
metadata:
  name: planton-oss-e2e-awsiamas
  id: planton-oss-e2e-awsiamas
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsiamaccountsettings
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-east-1
  passwordPolicy:
    minimumPasswordLength: 14
    requireLowercaseCharacters: true
    requireNumbers: true
    requireSymbols: true
    requireUppercaseCharacters: true
    allowUsersToChangePassword: true
    maxPasswordAge: 365
    passwordReusePrevention: 12
  sts:
    globalEndpointTokenVersion: v2Token
