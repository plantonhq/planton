syntax = "proto3";

package dev.planton.aws.awsbackupplan.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsbackupplan/v1alpha1/outputs.proto";
import "catalog/aws/awsbackupplan/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsBackupPlan {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsBackupPlan'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsBackupPlanSpec spec = 4 [(buf.validate.field).required = true];
  AwsBackupPlanStatus status = 5;
}

message AwsBackupPlanStatus {
  AwsBackupPlanOutputs outputs = 1;
}
