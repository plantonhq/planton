syntax = "proto3";

package dev.planton.aws.awssesaccountsettings.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awssesaccountsettings/v1alpha1/outputs.proto";
import "catalog/aws/awssesaccountsettings/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsSesAccountSettings {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsSesAccountSettings'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsSesAccountSettingsSpec spec = 4 [(buf.validate.field).required = true];
  AwsSesAccountSettingsStatus status = 5;
}

message AwsSesAccountSettingsStatus {
  AwsSesAccountSettingsOutputs outputs = 1;
}
