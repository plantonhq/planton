apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awssesaccountsettings
spec:
  # A settings singleton under live E2E with the class's ASYMMETRIC
  # destroy contract: the scenario applies both arms (suppression
  # BOUNCE+COMPLAINT, VDM enabled), GetAccount verifies the echoes,
  # then destroy -- VDM resets to DISABLED (a real revert) while
  # suppression PERSISTS (upstream delete is a no-op; the last-applied
  # reasons stay in effect). Verify-absent asserts exactly that
  # asymmetry, and the retained suppression posture is this kind's
  # recorded settings-retention class (the SES feedback-forwarding
  # precedent), not an orphan. VDM billing prorates to minutes -- ~$0.
  #
  # Singleton collision class: one SES account object per
  # account+region -- lanes run sequentially within a session, and
  # concurrent sessions must not run this kind's lanes in the same
  # region simultaneously.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
