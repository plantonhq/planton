# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_sesv2_account_suppression_attributes:
    mappings:
      # v6 per-resource region override -- the modules wire the provider
      # to spec.region.
      - arg: region
        spec: spec.region
      # The suppression arm names the list "reasons" inside its message.
      - arg: suppressed_reasons
        spec: spec.suppression.reasons
  aws_sesv2_account_vdm_attributes:
    mappings:
      # v6 per-resource region override.
      - arg: region
        spec: spec.region
      # The spec models FeatureStatus strings as booleans; the modules
      # render ENABLED/DISABLED.
      - arg: vdm_enabled
        spec: spec.vdm.enabled
      # The provider's one-member dashboard/guardian wrappers collapse to
      # the spec's presence-typed leaves.
      - arg: dashboard_attributes
        spec: spec.vdm.engagement_metrics
      - arg: dashboard_attributes.engagement_metrics
        spec: spec.vdm.engagement_metrics
      - arg: guardian_attributes
        spec: spec.vdm.optimized_shared_delivery
      - arg: guardian_attributes.optimized_shared_delivery
        spec: spec.vdm.optimized_shared_delivery

specExclusions:
  # The suppression arm's own switch. SES spells "auto-suppression off" as
  # the empty reason list, so the module writes [] when the switch is off
  # and the switch itself has no argument to reach.
  - field: spec.suppression.enabled
    reason: an explicit switch the module honors by writing the empty suppressed_reasons list when off -- SES has no enabled flag on suppression
