apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awssesaccountsettings
spec:
  values:
    - name: account_id
      derivations:
        - from_output: account_id
      where_to_find: >-
        The 12-digit AWS account id (top-right account menu, or
        `aws sts get-caller-identity`). Only the suppression resource
        needs it; the VDM resource imports by the provider's literal
        word (no placeholder).
