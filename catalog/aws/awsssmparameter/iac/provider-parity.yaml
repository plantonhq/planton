# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_ssm_parameter:
    mappings:
      # v6 per-resource region override -- the module wires every resource
      # to spec.region.
      - arg: region
        spec: spec.region
      # The name is an explicit spec field (hierarchical names carry
      # slashes metadata.name cannot).
      - arg: name
        spec: spec.parameter_name
      # The spec's two value arms cross-map onto the provider's two:
      # the SECRET arm renders as the provider's sensitive `value`, and
      # the PLAIN arm as `insecure_value` (readable plans - that
      # argument's whole point).
      - arg: value
        spec: spec.secure_value
      - arg: insecure_value
        spec: spec.value
    exclusions:
      - arg: value_wo
        reason: Terraform's write-only state-avoidance alternative to `value` -- the platform's just-in-time managed-secret resolution (spec.secure_value) is the equivalent posture, so the pair would be a second redundant secret path
      - arg: value_wo_version
        reason: the change-trigger companion of value_wo -- excluded with it
      - arg: arn
        reason: writable-but-always-overwritten legacy attribute (the provider re-sets it from the API on every read) -- never honest user surface; the ARN is an output
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own
