syntax = "proto3";

package dev.planton.aws.awsssmparameter.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsssmparameter/v1alpha1/outputs.proto";
import "catalog/aws/awsssmparameter/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsSsmParameter {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsSsmParameter'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsSsmParameterSpec spec = 4 [(buf.validate.field).required = true];
  AwsSsmParameterStatus status = 5;
}

message AwsSsmParameterStatus {
  AwsSsmParameterOutputs outputs = 1;
}
