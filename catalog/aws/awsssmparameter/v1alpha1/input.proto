syntax = "proto3";

package dev.planton.aws.awsssmparameter.v1alpha1;

import "catalog/aws/awsssmparameter/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsSsmParameterIacInput is the input for the IaC modules that
// manage an SSM Parameter Store entry.
message AwsSsmParameterIacInput {
  // target is the AwsSsmParameter resource to deploy.
  AwsSsmParameter target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
