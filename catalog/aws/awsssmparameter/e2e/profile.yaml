apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsssmparameter
spec:
  # A Parameter Store entry under live E2E: both value arms prove
  # their render paths - the secret arm as a hierarchical SecureString
  # under the default aws/ssm key (placeholder secret, minutes-lived),
  # the plain arm as a flat String with allowed_pattern/data_type/
  # overwrite. Standard tier throughout (~$0 - Standard parameters are
  # free).
  #
  # Deliberately not exercised live:
  #   - Advanced / Intelligent-Tiering tiers -- Advanced bills per
  #     parameter-hour. Unblock: a costed lane when the proof queue
  #     wants the tier-resolution datapoint.
  #   - an explicit customer-managed key_id -- the KMS reference is
  #     conditional and the default aws/ssm key proves the encryption
  #     path. Unblock: an AwsKmsKey fixture via scenario annotations.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
