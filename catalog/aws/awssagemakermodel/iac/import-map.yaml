apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awssagemakermodel
spec:
  # The model imports by its bare name.
  values:
    - name: model_name
      derivations:
        - from_output: model_name
      where_to_find: >-
        SageMaker console -> Inference -> Models (the name), or
        `aws sagemaker list-models` (ModelName).
