# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awssagemakermodel
spec:
  aws:
    statements:
      - sid: ManageModel
        actions:
          - sagemaker:CreateModel
          - sagemaker:DescribeModel
          - sagemaker:DeleteModel
        resources:
          - arn:aws:sagemaker:*:*:model/*
        provenance: derived
        notes: Covers aws_sagemaker_model / sagemaker.Model. DescribeModel serves every plan/refresh. There is no UpdateModel -- SageMaker models are immutable, so EVERY spec change is a Delete followed by a Create; both actions fire on routine edits, not just at creation and teardown. All three actions take resource-level scoping on the model ARN format per the service reference.
      - sid: TagModel
        actions:
          - sagemaker:AddTags
          - sagemaker:DeleteTags
          - sagemaker:ListTags
        resources:
          - arn:aws:sagemaker:*:*:model/*
        provenance: derived
        notes: Tag-on-create plus later tag reconciliation and the tag read on every refresh. The service reference scopes the tagging trio to dozens of SageMaker resource formats; the model format is the only one this component touches.
      - sid: PassExecutionRole
        actions:
          - iam:PassRole
        resources:
          - arn:aws:iam::*:role/*
        provenance: derived
        notes: CreateModel passes the referenced role (execution_role_arn, required by the spec) to SageMaker, which assumes it at deployment time to pull the ECR image and read S3 artifacts -- and because the model is immutable, changing the role replaces the model and passes the new one. Add an iam:PassedToService=sagemaker.amazonaws.com condition and narrow to the actual role ARN in a hardened deployment. The vpc_config subnets and security groups are stored as strings at create -- SageMaker materializes ENIs only at deployment, so the runner needs no ec2 grants here.
