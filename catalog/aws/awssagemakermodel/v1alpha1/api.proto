syntax = "proto3";

package dev.planton.aws.awssagemakermodel.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awssagemakermodel/v1alpha1/outputs.proto";
import "catalog/aws/awssagemakermodel/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsSagemakerModel {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsSagemakerModel'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsSagemakerModelSpec spec = 4 [(buf.validate.field).required = true];
  AwsSagemakerModelStatus status = 5;
}

message AwsSagemakerModelStatus {
  AwsSagemakerModelOutputs outputs = 1;
}
