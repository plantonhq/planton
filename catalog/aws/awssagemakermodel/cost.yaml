# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: awssagemakermodel
spec:
  billing_model: free
  free_tier: "A SageMaker AI model is an immutable serving definition -- container image, artifact location, execution role, networking -- and the model object carries no meter anywhere on SageMaker AI's published price sheet. The pricing page's stated dimensions are instance usage, storage, data processing, model deployment, and MLOps: what bills is DEPLOYING a model (real-time, serverless, asynchronous inference, or batch transform compute), never the definition sitting in the registry of models. An account can hold a thousand model objects and pay nothing until one of them is put behind compute."
  notes: "No field of this spec buys anything: the container form (primary_container or the 2-15 container pipeline), environment variables, network isolation, and vpc_config are all stored configuration that SageMaker consults at deployment time. The real spend lives in what deploys the model: AwsSagemakerEndpoint prices the hosting meters (instance-hours or serverless duration, data processing, storage volumes), and batch transform jobs bill their instance-hours when they run. Two referenced storage surfaces bill on their own components regardless -- model artifacts as S3 storage under model_data_url / model_data_source (billed on the owning bucket), and the inference image as ECR storage on its AwsEcrRepo. Deleting or keeping the model object changes none of those lines."
