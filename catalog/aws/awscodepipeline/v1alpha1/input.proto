syntax = "proto3";

package dev.planton.aws.awscodepipeline.v1alpha1;

import "catalog/aws/awscodepipeline/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsCodePipelineIacInput is the input for the IaC modules that
// deploy the CodePipeline pipeline, stages, and actions.
message AwsCodePipelineIacInput {
  // target is the AwsCodePipeline resource to deploy.
  AwsCodePipeline target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
