# AwsCodePipeline live scenario: a two-stage V2 pipeline composed against
# three fixtures -- the versioned shared S3 bucket (source object + artifact
# store), the CodePipeline IAM role, and the CodeBuild fixture project
# (declared via the e2e-prerequisites annotation; its own IAM prerequisite
# chains transitively). The S3 source action references the fixture bucket
# by its fixed name inside the free-form configuration map (plain strings by
# AWS's design), while the artifact store location resolves as a reference.
# QUEUED execution mode, a pipeline variable, a namespaced source action,
# ROLLBACK failure handling on the Build stage, and a Compute action with
# inline commands, an exported variable, and a file-based output artifact
# exercise the V2 surface live. Compute actions are free at create time --
# they bill CodeBuild compute only when an execution actually runs the
# commands, which this lane's failing execution never reaches. (No action
# timeout override: AWS only supports it on Manual Approval actions — the
# spec CEL enforces this.)
#
# The pipeline's first execution starts automatically and fails on the
# missing source object -- expected and harmless: execution outcomes are
# data plane, outside the create/verify/destroy contract.
#
# Deliberately not exercised live: triggers (require a CodeConnections
# source action -- the connection needs a manual console OAuth handshake),
# cross-region artifact stores, and condition RULES (the managed rule
# providers act only during executions); all proven by spec tests + the
# offline plan gate against e2e/manifest.yaml.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsCodePipeline
metadata:
  name: planton-oss-e2e-awscodepipeline-chain
  id: planton-oss-e2e-awscodepipeline-chain
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awscodepipeline
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsCodeBuildProject"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  pipelineType: V2
  executionMode: QUEUED
  roleArn:
    valueFrom:
      kind: AwsIamRole
      name: planton-oss-e2e-codepipeline-role
      fieldPath: status.outputs.role_arn
  artifactStores:
    - location:
        valueFrom:
          kind: AwsS3Bucket
          name: planton-oss-e2e-awss3bucket-prereq
          fieldPath: status.outputs.bucket_id
  variables:
    - name: DeployEnvironment
      defaultValue: e2e
      description: Exercised as a V2 pipeline-level variable
  stages:
    - name: Source
      actions:
        - name: SourceAction
          category: Source
          owner: AWS
          provider: S3
          version: "1"
          namespace: SourceVars
          outputArtifacts:
            - SourceOutput
          configuration:
            S3Bucket: planton-oss-e2e-awss3bucket-prereq
            S3ObjectKey: source.zip
            PollForSourceChanges: "false"
    - name: Build
      actions:
        - name: BuildAction
          category: Build
          owner: AWS
          provider: CodeBuild
          version: "1"
          inputArtifacts:
            - SourceOutput
          configuration:
            ProjectName: planton-oss-e2e-awscodebuild-prereq
        # The Compute-action arm: accepted (and verifiable via GetPipeline)
        # at create time; the commands never run in this lane because the
        # execution fails at the Source stage.
        - name: InlineChecks
          category: Compute
          owner: AWS
          provider: Commands
          version: "1"
          runOrder: 2
          namespace: ComputeVars
          inputArtifacts:
            - SourceOutput
          commands:
            - export CHECK_STATUS=ok
            - echo "planton e2e inline check $CHECK_STATUS" > check-report.txt
          outputVariables:
            - CHECK_STATUS
          outputArtifactsForComputeAction:
            - name: CheckReports
              files:
                - check-report.txt
      onFailure:
        result: ROLLBACK
