# Consumer-scoped AwsS3Bucket install profile for the fixture
# recorder's delivery channel (see awsiamrole.yaml -- rules need a
# recorder, and a running recorder needs a channel).
apiVersion: aws.planton.dev/v1alpha1
kind: AwsS3Bucket
metadata:
  name: planton-oss-e2e-awscfgrl-history
  id: planton-oss-e2e-awscfgrl-history
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awss3bucket
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  # The fixture recorder's delivery channel writes configuration
  # history/snapshot objects into the bucket while the rule lanes run,
  # and they survive the recorder's delete -- so the fixture bucket
  # must force-destroy or its teardown fails BucketNotEmpty (the
  # service-written-canary class, live-caught on the CloudTrail
  # sibling).
  forceDestroy: true
  policy:
    Version: "2012-10-17"
    Statement:
      - Sid: AWSConfigBucketPermissionsCheck
        Effect: Allow
        Principal:
          Service: config.amazonaws.com
        Action: s3:GetBucketAcl
        Resource: arn:aws:s3:::planton-oss-e2e-awscfgrl-history
      - Sid: AWSConfigBucketDelivery
        Effect: Allow
        Principal:
          Service: config.amazonaws.com
        Action: s3:PutObject
        Resource: arn:aws:s3:::planton-oss-e2e-awscfgrl-history/*
        Condition:
          StringEquals:
            s3:x-amz-acl: bucket-owner-full-control
