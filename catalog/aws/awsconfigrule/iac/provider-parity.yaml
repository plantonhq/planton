# Provider-parity manifest: this kind's recorded judgment against the pinned
# aws provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  aws_config_config_rule:
    mappings:
      # v6 per-resource region override -- the module wires every resource
      # to spec.region.
      - arg: region
        spec: spec.region
      # The one-of source arms: identifier for managed rules, function ARN
      # for custom-lambda rules (the CEL keeps them exclusive).
      - arg: source.source_identifier
        spec: spec.managed.rule_identifier
      - arg: source.source_detail.message_type
        spec: spec.custom_lambda.source_details.message_type
      - arg: source.source_detail.maximum_execution_frequency
        spec: spec.custom_lambda.source_details.maximum_execution_frequency
      - arg: source.custom_policy_details.policy_runtime
        spec: spec.custom_policy.policy_runtime
      - arg: source.custom_policy_details.policy_text
        spec: spec.custom_policy.policy_text
      - arg: source.custom_policy_details.enable_debug_log_delivery
        spec: spec.custom_policy.enable_debug_log_delivery
      - arg: scope.compliance_resource_id
        spec: spec.scope.compliance_resource_id
      - arg: scope.compliance_resource_types
        spec: spec.scope.compliance_resource_types
      - arg: scope.tag_key
        spec: spec.scope.tag_key
      - arg: scope.tag_value
        spec: spec.scope.tag_value
      - arg: evaluation_mode.mode
        spec: spec.evaluation_modes
    exclusions:
      - arg: name
        reason: metadata.name is the rule name on both engines -- never free-form spec surface
      - arg: source.owner
        reason: the derived discriminator of the one-of source arms (managed=AWS, custom_lambda=CUSTOM_LAMBDA, custom_policy=CUSTOM_POLICY) -- both engines always send it, never user-facing
      - arg: source.source_detail.event_source
        reason: the only value AWS accepts is the default "aws.config" -- carrying it would be dead configuration
      - arg: tags
        reason: wired by the module from metadata (the canonical identity tag map) -- never free-form user surface
      - arg: tags_all
        reason: provider-side merge of resource and provider-default tags -- reflects tags, carries no configuration of its own

  aws_config_organization_managed_rule:
    mappings:
      - arg: region
        spec: spec.region
      - arg: rule_identifier
        spec: spec.managed.rule_identifier
      - arg: excluded_accounts
        spec: spec.organization.excluded_accounts
      # The org rules' flat *_scope arguments are the same scope concepts
      # the account rule nests -- one spec message covers both shapes.
      - arg: resource_id_scope
        spec: spec.scope.compliance_resource_id
      - arg: resource_types_scope
        spec: spec.scope.compliance_resource_types
      - arg: tag_key_scope
        spec: spec.scope.tag_key
      - arg: tag_value_scope
        spec: spec.scope.tag_value
    exclusions:
      - arg: name
        reason: metadata.name is the rule name on both engines -- never free-form spec surface

  aws_config_organization_custom_rule:
    mappings:
      - arg: region
        spec: spec.region
      - arg: lambda_function_arn
        spec: spec.custom_lambda.function_arn
      - arg: trigger_types
        spec: spec.organization.trigger_types
      - arg: excluded_accounts
        spec: spec.organization.excluded_accounts
      - arg: resource_id_scope
        spec: spec.scope.compliance_resource_id
      - arg: resource_types_scope
        spec: spec.scope.compliance_resource_types
      - arg: tag_key_scope
        spec: spec.scope.tag_key
      - arg: tag_value_scope
        spec: spec.scope.tag_value
    exclusions:
      - arg: name
        reason: metadata.name is the rule name on both engines -- never free-form spec surface

  aws_config_organization_custom_policy_rule:
    mappings:
      - arg: region
        spec: spec.region
      - arg: policy_runtime
        spec: spec.custom_policy.policy_runtime
      - arg: policy_text
        spec: spec.custom_policy.policy_text
      - arg: trigger_types
        spec: spec.organization.trigger_types
      - arg: excluded_accounts
        spec: spec.organization.excluded_accounts
      - arg: debug_log_delivery_accounts
        spec: spec.organization.debug_log_delivery_accounts
      - arg: resource_id_scope
        spec: spec.scope.compliance_resource_id
      - arg: resource_types_scope
        spec: spec.scope.compliance_resource_types
      - arg: tag_key_scope
        spec: spec.scope.tag_key
      - arg: tag_value_scope
        spec: spec.scope.tag_value
    exclusions:
      - arg: name
        reason: metadata.name is the rule name on both engines -- never free-form spec surface

  aws_config_remediation_configuration:
    specRoot: spec.remediation
    mappings:
      - arg: region
        spec: spec.region
      # The provider's two-level execution_controls.ssm_controls wrapper
      # flattens (it carries no identity).
      - arg: execution_controls.ssm_controls.concurrent_execution_rate_percentage
        spec: spec.remediation.concurrent_execution_rate_percentage
      - arg: execution_controls.ssm_controls.error_percentage
        spec: spec.remediation.error_percentage
      - arg: parameter.name
        spec: spec.remediation.parameters.name
      - arg: parameter.resource_value
        spec: spec.remediation.parameters.resource_value
      - arg: parameter.static_value
        spec: spec.remediation.parameters.static_value
      - arg: parameter.static_values
        spec: spec.remediation.parameters.static_values
    exclusions:
      - arg: config_rule_name
        reason: module-wired parent linkage to the rule created in the same plan
      - arg: target_type
        reason: the only target type AWS supports is SSM_DOCUMENT -- both engines always send it, never user-facing

specExclusions:
  # The organization block's own switch. It chooses WHICH provider resource
  # renders (an account-scoped aws_config_config_rule, or one of the three
  # organization rule resources); no single argument carries it.
  - field: spec.organization.enabled
    reason: an explicit scope switch the module honors by choosing the account-scoped or organization-scoped resource -- no provider argument carries the choice
