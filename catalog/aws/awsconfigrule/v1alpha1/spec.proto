syntax = "proto3";

package dev.planton.aws.awsconfigrule.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// AwsConfigRuleSpec defines the desired configuration for one AWS
// Config rule - a compliance check evaluated against recorded
// resource configurations - plus its optional auto-remediation.
//
// The rule name is metadata.name (AWS caps account-scoped rule names
// at 128 characters; ORGANIZATION-scoped rule names at 64).
//
// One of three rule sources must be chosen:
//   - managed: an AWS-authored rule referenced by identifier (e.g.
//     "S3_BUCKET_VERSIONING_ENABLED") - the zero-code path.
//   - custom_lambda: your Lambda function evaluates resources.
//   - custom_policy: a CloudFormation-Guard policy evaluates
//     resources - custom logic without a function.
//
// Setting `organization` deploys the rule across EVERY account in the
// AWS Organization instead of just this one - run it from the
// management account or the Config delegated administrator. The
// region needs a running configuration recorder (AwsConfigRecorder)
// or every evaluation reports nothing.
//
// Destroying this component deletes the rule (and its remediation
// configuration); recorded evaluation history ages out with AWS
// Config retention.
message AwsConfigRuleSpec {
  // The AWS region the rule is created in.
  // Example: "us-west-2", "eu-west-1"
  string region = 1 [(buf.validate.field).string.min_len = 1];

  // What this rule checks (shown in the AWS console).
  string description = 2 [(buf.validate.field).string.max_len = 256];

  // Rule parameters as a JSON object string (e.g.
  // '{"desiredInstanceType":"t3.micro"}' for DESIRED_INSTANCE_TYPE).
  // AWS validates the JSON and each key against the rule's schema at
  // apply.
  string input_parameters = 3 [(buf.validate.field).string.max_len = 2048];

  // How often a PERIODIC rule evaluates (change-triggered rules
  // ignore it). Unset = the rule's default (TwentyFour_Hours).
  string maximum_execution_frequency = 4 [(buf.validate.field).string = {
    in: [
      "",
      "One_Hour",
      "Three_Hours",
      "Six_Hours",
      "Twelve_Hours",
      "TwentyFour_Hours"
    ]
  }];

  // An AWS-managed rule, by identifier. The zero-code path - AWS
  // maintains the evaluation logic.
  AwsConfigRuleManagedSource managed = 5;

  // A custom rule backed by your Lambda function.
  AwsConfigRuleCustomLambdaSource custom_lambda = 6;

  // A custom rule backed by a CloudFormation-Guard policy.
  AwsConfigRuleCustomPolicySource custom_policy = 7;

  // Which resources the rule evaluates. Unset = every recorded
  // resource the rule's logic applies to.
  AwsConfigRuleScope scope = 8;

  // Evaluation modes: DETECTIVE (after deployment, the default) and/or
  // PROACTIVE (before provisioning, via the Config proactive APIs).
  // Account-scoped rules only - AWS has no proactive organization
  // rules.
  repeated string evaluation_modes = 9 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {
        in: [
          "DETECTIVE",
          "PROACTIVE"
        ]
      }
    }
  }];

  // Deploy the rule organization-wide. Declaring this message (with its
  // switch on, the default) makes it an ORGANIZATION rule (name cap drops
  // to 64 characters; run from the management or delegated-admin account);
  // `organization.enabled: false` keeps the organization settings in the
  // manifest while the rule deploys account-scoped.
  AwsConfigRuleOrganization organization = 10;

  // Auto-remediation: the SSM document AWS Config runs against
  // non-compliant resources. Account-scoped rules only.
  AwsConfigRuleRemediation remediation = 11;

  // AWS Config rules have exactly one evaluation source.
  option (buf.validate.message).cel = {
    id: "exactly_one_source"
    message: "set exactly one of managed, custom_lambda, custom_policy"
    expression: "[has(this.managed), has(this.custom_lambda), has(this.custom_policy)].filter(x, x).size() == 1"
  };

  // Organization managed rules derive triggers from the managed
  // rule's own definition; custom ones must declare them.
  option (buf.validate.message).cel = {
    id: "org_trigger_types_by_source"
    message: "organization.trigger_types is required for custom_lambda/custom_policy organization rules and must be empty for managed ones"
    expression: "!(has(this.organization) && (!has(this.organization.enabled) || this.organization.enabled)) || (has(this.managed) ? size(this.organization.trigger_types) == 0 : size(this.organization.trigger_types) > 0)"
  };

  // The Guard engine evaluates on configuration changes only - AWS
  // rejects ScheduledNotification for organization custom-policy
  // rules.
  option (buf.validate.message).cel = {
    id: "org_custom_policy_no_scheduled_trigger"
    message: "organization custom_policy rules do not accept the ScheduledNotification trigger"
    expression: "!(has(this.organization) && (!has(this.organization.enabled) || this.organization.enabled)) || !has(this.custom_policy) || !('ScheduledNotification' in this.organization.trigger_types)"
  };

  // Debug log delivery is a Guard-engine feature.
  option (buf.validate.message).cel = {
    id: "debug_accounts_custom_policy_only"
    message: "organization.debug_log_delivery_accounts applies only to custom_policy rules"
    expression: "!(has(this.organization) && (!has(this.organization.enabled) || this.organization.enabled)) || size(this.organization.debug_log_delivery_accounts) == 0 || has(this.custom_policy)"
  };

  // Organization custom rules declare triggers on the organization
  // message; per-detail sources are the account-scoped shape.
  option (buf.validate.message).cel = {
    id: "org_lambda_uses_trigger_types"
    message: "organization custom_lambda rules declare triggers via organization.trigger_types, not custom_lambda.source_details"
    expression: "!(has(this.organization) && (!has(this.organization.enabled) || this.organization.enabled)) || !has(this.custom_lambda) || size(this.custom_lambda.source_details) == 0"
  };

  // AWS remediation configurations attach to account-scoped rules by
  // rule name; organization rules have no remediation surface.
  option (buf.validate.message).cel = {
    id: "remediation_account_scope_only"
    message: "remediation is not supported on organization rules"
    expression: "!has(this.remediation) || !(has(this.organization) && (!has(this.organization.enabled) || this.organization.enabled))"
  };

  // Proactive evaluation exists only for account-scoped rules.
  option (buf.validate.message).cel = {
    id: "evaluation_modes_account_scope_only"
    message: "evaluation_modes apply only to account-scoped rules"
    expression: "size(this.evaluation_modes) == 0 || !(has(this.organization) && (!has(this.organization.enabled) || this.organization.enabled))"
  };
}

// AwsConfigRuleManagedSource references an AWS-managed rule.
message AwsConfigRuleManagedSource {
  // The managed rule identifier (e.g.
  // "S3_BUCKET_VERSIONING_ENABLED", "REQUIRED_TAGS",
  // "DESIRED_INSTANCE_TYPE") - the full list lives in the AWS Config
  // managed-rules reference.
  string rule_identifier = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
}

// AwsConfigRuleCustomLambdaSource backs the rule with a Lambda
// function. AWS Config must be allowed to invoke it (a
// lambda:InvokeFunction permission for config.amazonaws.com).
message AwsConfigRuleCustomLambdaSource {
  // The Lambda function that evaluates resources.
  dev.planton.shared.foreignkey.v1.StringValueOrRef function_arn = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsLambda,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.function_arn"
  ];

  // When the function is invoked (account-scoped rules; organization
  // rules declare triggers on the organization message instead). Unset
  // = AWS derives from the function's evaluation logic at apply.
  repeated AwsConfigRuleSourceDetail source_details = 2 [(buf.validate.field).repeated.max_items = 25];
}

// AwsConfigRuleSourceDetail is one trigger for an account-scoped
// custom-lambda rule.
message AwsConfigRuleSourceDetail {
  // The notification that triggers evaluation.
  string message_type = 1 [(buf.validate.field).string = {
    in: [
      "ConfigurationItemChangeNotification",
      "OversizedConfigurationItemChangeNotification",
      "ScheduledNotification",
      "ConfigurationSnapshotDeliveryCompleted"
    ]
  }];

  // For ScheduledNotification triggers: how often. Unset =
  // TwentyFour_Hours.
  string maximum_execution_frequency = 2 [(buf.validate.field).string = {
    in: [
      "",
      "One_Hour",
      "Three_Hours",
      "Six_Hours",
      "Twelve_Hours",
      "TwentyFour_Hours"
    ]
  }];
}

// AwsConfigRuleCustomPolicySource backs the rule with a
// CloudFormation-Guard policy - custom logic without running any
// compute of your own.
message AwsConfigRuleCustomPolicySource {
  // The Guard runtime version. Only "guard-2.x.x" exists today.
  string policy_runtime = 1 [(buf.validate.field).string.pattern = "^guard\\-2\\.x\\.x$"];

  // The Guard policy source (rules written in the Guard DSL).
  string policy_text = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 10000
  }];

  // Deliver Guard debug logs to CloudWatch (account-scoped rules; for
  // organization rules use organization.debug_log_delivery_accounts).
  bool enable_debug_log_delivery = 3;
}

// AwsConfigRuleScope narrows WHICH resources the rule evaluates. Tag
// scope and resource-type scope may combine; a resource ID pins the
// rule to one specific resource.
message AwsConfigRuleScope {
  // Evaluate only this one resource (requires exactly one entry in
  // compliance_resource_types naming its type).
  string compliance_resource_id = 1 [(buf.validate.field).string.max_len = 768];

  // Evaluate only these resource types (e.g. "AWS::EC2::Instance").
  repeated string compliance_resource_types = 2 [(buf.validate.field).repeated = {
    unique: true
    max_items: 100
  }];

  // Evaluate only resources carrying this tag key (optionally with
  // tag_value).
  string tag_key = 3 [(buf.validate.field).string.max_len = 128];

  // The tag value paired with tag_key.
  string tag_value = 4 [(buf.validate.field).string.max_len = 256];

  // AWS requires the type of a pinned resource.
  option (buf.validate.message).cel = {
    id: "resource_id_needs_one_type"
    message: "compliance_resource_id requires exactly one compliance_resource_types entry"
    expression: "this.compliance_resource_id == '' || size(this.compliance_resource_types) == 1"
  };

  // A tag value without its key scopes nothing.
  option (buf.validate.message).cel = {
    id: "tag_value_needs_key"
    message: "tag_value requires tag_key"
    expression: "this.tag_value == '' || this.tag_key != ''"
  };
}

// AwsConfigRuleOrganization deploys the rule across the AWS
// Organization. Run from the management account or the Config
// delegated administrator; member accounts get the rule
// automatically. Declaring the block makes the rule organization-scoped;
// `enabled: false` records the decision to deploy it account-scoped while
// keeping these settings in place.
message AwsConfigRuleOrganization {
  // Member accounts to EXCLUDE from the rule.
  repeated string excluded_accounts = 1 [(buf.validate.field).repeated = {
    unique: true
    max_items: 1000
    items: {
      string: {pattern: "^[0-9]{12}$"}
    }
  }];

  // When custom rules evaluate (required for custom_lambda /
  // custom_policy organization rules; managed rules derive their own).
  repeated string trigger_types = 2 [(buf.validate.field).repeated = {
    unique: true
    max_items: 3
    items: {
      string: {
        in: [
          "ConfigurationItemChangeNotification",
          "OversizedConfigurationItemChangeNotification",
          "ScheduledNotification"
        ]
      }
    }
  }];

  // Accounts allowed to receive Guard debug logs (custom_policy rules
  // only).
  repeated string debug_log_delivery_accounts = 3 [(buf.validate.field).repeated = {
    unique: true
    max_items: 1000
    items: {
      string: {pattern: "^[0-9]{12}$"}
    }
  }];

  // Whether the rule deploys organization-wide. Unset means yes: declaring
  // the block has always meant an organization rule, and this switch lets
  // a manifest say the opposite out loud.
  optional bool enabled = 4 [(dev.planton.shared.options.default) = "true"];
}

// AwsConfigRuleRemediation runs an SSM document against resources the
// rule marks non-compliant.
message AwsConfigRuleRemediation {
  // Remediate automatically when a resource turns non-compliant.
  // False = remediation is available in the console but a human
  // triggers it.
  bool automatic = 1;

  // The SSM document to run (e.g. "AWS-DisableS3BucketPublicReadWrite"
  // or your own document's name). The only target type AWS supports is
  // SSM_DOCUMENT - both engines send it implicitly.
  string target_id = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];

  // The document version to run. Unset = the document's default
  // version.
  string target_version = 3;

  // The resource type this remediation applies to (e.g.
  // "AWS::S3::Bucket") - required by AWS when the rule covers multiple
  // types.
  string resource_type = 4;

  // Parameters passed to the SSM document.
  repeated AwsConfigRuleRemediationParameter parameters = 5 [(buf.validate.field).repeated.max_items = 25];

  // How many times AWS retries an automatic remediation within
  // retry_attempt_seconds before marking it failed (1-25). Required
  // when automatic.
  int32 maximum_automatic_attempts = 6 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 25
    }
  ];

  // The retry window in seconds (1-2678000). Required when automatic.
  int64 retry_attempt_seconds = 7 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).int64 = {
      gte: 1
      lte: 2678000
    }
  ];

  // Throttle: what percentage of non-compliant resources remediate
  // concurrently (1-100). Unset = the AWS default.
  int32 concurrent_execution_rate_percentage = 8 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 100
    }
  ];

  // Circuit breaker: stop remediating when this percentage of
  // executions fail (1-100). Unset = the AWS default.
  int32 error_percentage = 9 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 100
    }
  ];

  // AWS requires the retry contract for hands-off remediation.
  option (buf.validate.message).cel = {
    id: "automatic_needs_retry_contract"
    message: "automatic remediation requires maximum_automatic_attempts and retry_attempt_seconds"
    expression: "!this.automatic || (this.maximum_automatic_attempts > 0 && this.retry_attempt_seconds > 0)"
  };
}

// AwsConfigRuleRemediationParameter is one SSM document parameter:
// exactly one value form.
message AwsConfigRuleRemediationParameter {
  // The SSM document parameter name.
  string name = 1 [(buf.validate.field).string.min_len = 1];

  // Pass the non-compliant resource's ID. The only value AWS accepts
  // today is "RESOURCE_ID".
  string resource_value = 2 [(buf.validate.field).string = {
    in: [
      "",
      "RESOURCE_ID"
    ]
  }];

  // One fixed value.
  string static_value = 3;

  // Multiple fixed values (for list-typed document parameters).
  repeated string static_values = 4;

  // AWS keeps one value form per parameter; the provider silently
  // drops static_value when static_values is also set - fail instead.
  option (buf.validate.message).cel = {
    id: "one_value_form"
    message: "set exactly one of resource_value, static_value, static_values"
    expression: "[this.resource_value != '', this.static_value != '', size(this.static_values) > 0].filter(x, x).size() == 1"
  };
}
