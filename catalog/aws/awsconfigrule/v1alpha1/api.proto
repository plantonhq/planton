syntax = "proto3";

package dev.planton.aws.awsconfigrule.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsconfigrule/v1alpha1/outputs.proto";
import "catalog/aws/awsconfigrule/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsConfigRule {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsConfigRule'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsConfigRuleSpec spec = 4 [(buf.validate.field).required = true];
  AwsConfigRuleStatus status = 5;
}

message AwsConfigRuleStatus {
  AwsConfigRuleOutputs outputs = 1;
}
