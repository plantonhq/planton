# Fixture AwsFsxLustreFileSystem consumed by data-repository-association
# scenarios. PERSISTENT_2 (the generation whose ONLY S3 integration is the
# association kind) at the smallest capacity and lowest throughput tier, on
# the shared subnet + security-group fixtures. Fixed name so name-aware
# resolution and orphan sweeps stay stable.
# The e2e-prerequisites annotation composes the security-group fixture this
# manifest references (security_group_ids is optional on the kind, so it is
# deliberately NOT a registry prerequisite).
apiVersion: aws.planton.dev/v1alpha1
kind: AwsFsxLustreFileSystem
metadata:
  name: planton-oss-e2e-awsfxl-prereq
  id: planton-oss-e2e-awsfxl-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsfsxlustrefilesystem
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsSecurityGroup"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  deploymentType: PERSISTENT_2
  storageCapacityGib: 1200
  perUnitStorageThroughput: 125
  subnetId:
    valueFrom:
      kind: AwsSubnet
      name: planton-oss-e2e-awssubnet-prereq-a
      fieldPath: status.outputs.subnet_id
  securityGroupIds:
    - valueFrom:
        kind: AwsSecurityGroup
        name: planton-oss-e2e-awssg-prereq
        fieldPath: status.outputs.security_group_id
