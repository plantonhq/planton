syntax = "proto3";

package dev.planton.aws.awsfsxlustrefilesystem.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsfsxlustrefilesystem/v1alpha1/outputs.proto";
import "catalog/aws/awsfsxlustrefilesystem/v1alpha1/spec.proto";
import "shared/metadata.proto";

// aws-fsx-lustre-file-system
message AwsFsxLustreFileSystem {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsFsxLustreFileSystem'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsFsxLustreFileSystemSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsFsxLustreFileSystemStatus status = 5;
}

// aws-fsx-lustre-file-system status
message AwsFsxLustreFileSystemStatus {
  //outputs
  AwsFsxLustreFileSystemOutputs outputs = 1;
}
