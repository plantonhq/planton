syntax = "proto3";

package dev.planton.aws.awsfsxontapfilesystem.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsfsxontapfilesystem/v1alpha1/outputs.proto";
import "catalog/aws/awsfsxontapfilesystem/v1alpha1/spec.proto";
import "shared/metadata.proto";

// aws-fsx-ontap-file-system
message AwsFsxOntapFileSystem {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsFsxOntapFileSystem'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsFsxOntapFileSystemSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsFsxOntapFileSystemStatus status = 5;
}

// aws-fsx-ontap-file-system status
message AwsFsxOntapFileSystemStatus {
  //outputs
  AwsFsxOntapFileSystemOutputs outputs = 1;
}
