syntax = "proto3";

package dev.planton.aws.awsfsxontapfilesystem.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// AwsFsxOntapFileSystemSpec defines the desired configuration for an Amazon FSx
// for NetApp ONTAP file system — an enterprise-grade, fully managed shared
// storage built on NetApp's ONTAP file system. It provides multi-protocol access
// (NFS, SMB, iSCSI) with features like instant snapshots, cloning, replication,
// data tiering, compression, and deduplication.
//
// FSx for ONTAP supports scale-out deployments with up to 12 HA pairs for
// petabyte-scale single-AZ configurations, and multi-AZ deployments with
// automatic failover for high availability. It is the most feature-rich FSx
// type, suitable for enterprise workloads, VMware Cloud on AWS, database
// storage, and hybrid cloud scenarios via NetApp SnapMirror.
//
// Choosing a shape:
// - SINGLE_AZ_2: the current single-AZ generation and the only deployment type
//   with scale-out HA pairs (1-12) — up to 1 PiB and tens of GB/s in one
//   namespace. The default and the recommended starting point.
// - MULTI_AZ_2: the current multi-AZ generation — a standby file server in a
//   second AZ takes over automatically on failure. For production workloads
//   that must survive an AZ outage.
// - SINGLE_AZ_1 / MULTI_AZ_1: the first generation. Choose these only to match
//   an existing estate; they cap at 192 TiB, a single HA pair, and lower
//   throughput tiers.
//
// Key design notes:
// - This component manages the ONTAP **file system** only. Storage Virtual
//   Machines (SVMs) and volumes are independent lifecycle resources managed
//   by AwsFsxOntapStorageVirtualMachine and AwsFsxOntapVolume respectively.
//   Backups (automatic and final) are configured on volumes, not here — the
//   file system itself has no backup settings.
// - `deployment_type`, `subnet_ids`, `preferred_subnet_id`, `security_group_ids`,
//   `kms_key_id`, `storage_type`, and `endpoint_ip_address_range` are ForceNew —
//   changing them replaces the file system.
// - On the first generation the scaling knobs are also effectively frozen:
//   increasing `throughput_capacity_per_ha_pair` on SINGLE_AZ_1/MULTI_AZ_1, or
//   `ha_pairs` on SINGLE_AZ_1, replaces the file system. Only SINGLE_AZ_2 and
//   MULTI_AZ_2 scale these in place.
// - The `fsx_admin_password` provides access to the ONTAP CLI (SSH) and REST API
//   for advanced administration (e.g., LIF management, SnapMirror configuration).
// - Endpoints are computed outputs: management (ONTAP CLI/API) and intercluster
//   (SnapMirror replication between file systems). Data access endpoints (NFS/
//   SMB/iSCSI DNS names) live on the SVM, not the file system.
// - Credentials, region, and deployment workflow live outside this spec in IaC inputs.
message AwsFsxOntapFileSystemSpec {
  // The AWS region where the resource will be created.
  // Example: "us-west-2", "eu-west-1"
  string region = 1 [(buf.validate.field).string.min_len = 1];

  // ---------------------------------------------------------------------------
  // File system core
  // ---------------------------------------------------------------------------

  // Deployment type controlling availability, performance, and scale-out
  // characteristics. ForceNew — cannot be changed after creation.
  //
  // - "SINGLE_AZ_1": first-generation single-AZ. Single HA pair only; adding
  //   HA pairs or increasing per-pair throughput replaces the file system.
  // - "SINGLE_AZ_2": current single-AZ generation with scale-out HA pairs
  //   (1-12) that can be added in place. Recommended for most workloads.
  // - "MULTI_AZ_1": first-generation multi-AZ with automatic failover across
  //   two AZs. Fixed at 1 HA pair. Requires two subnets and preferred_subnet_id.
  // - "MULTI_AZ_2": current multi-AZ generation with automatic failover.
  //   Fixed at 1 HA pair. Recommended for high-availability workloads.
  //
  // Default: SINGLE_AZ_2
  optional string deployment_type = 2 [(dev.planton.shared.options.default) = "SINGLE_AZ_2"];

  // Storage capacity in GiB. Required.
  //
  // The valid range scales with HA pairs: minimum 1024 GiB per HA pair,
  // maximum 524288 GiB (512 TiB) per HA pair, up to the 1048576 GiB (1 PiB)
  // absolute ceiling on SINGLE_AZ_2 scale-out deployments. First-generation
  // deployments (SINGLE_AZ_1 / MULTI_AZ_1) cap at 196608 GiB (192 TiB).
  //
  // Storage can be increased after creation but never decreased. Choose based
  // on data size; ONTAP's built-in compression and deduplication typically
  // achieve 2-5x data reduction, and volume tiering to capacity-pool storage
  // stretches the SSD tier further.
  int32 storage_capacity_gib = 3 [
    (buf.validate.field).int32.gte = 1024,
    (buf.validate.field).int32.lte = 1048576
  ];

  // Storage media type. ForceNew — cannot be changed after creation.
  //
  // ONTAP file systems support only "SSD" (sub-millisecond-latency solid-state
  // primary storage). The other FSx storage classes do not apply here: HDD is
  // a Windows/Lustre option and INTELLIGENT_TIERING an OpenZFS/Lustre option —
  // AWS rejects both for ONTAP at create time. Cost tiering on ONTAP is
  // instead achieved per volume via `tiering_policy` on AwsFsxOntapVolume,
  // which moves cold data to the built-in elastic capacity pool.
  //
  // Default: SSD
  optional string storage_type = 4 [(dev.planton.shared.options.default) = "SSD"];

  // Total throughput capacity for the whole file system in MB/s — the
  // first-generation sizing arm. Exactly one of `throughput_capacity` and
  // `throughput_capacity_per_ha_pair` must be set.
  //
  // Valid values: 128, 256, 512, 1024, 2048, 4096.
  //
  // Use this arm for SINGLE_AZ_1 / MULTI_AZ_1 file systems (single HA pair,
  // so whole-system and per-pair sizing coincide). For the current generation
  // (SINGLE_AZ_2 / MULTI_AZ_2), prefer `throughput_capacity_per_ha_pair`,
  // which carries the second generation's throughput tiers.
  optional int32 throughput_capacity = 5;

  // Throughput capacity per HA pair in MB/s — the per-pair sizing arm.
  // Exactly one of `throughput_capacity` and `throughput_capacity_per_ha_pair`
  // must be set. Total file system throughput = this value × ha_pairs.
  //
  // Valid values by deployment type:
  // - SINGLE_AZ_1 / MULTI_AZ_1: 128, 256, 512, 1024, 2048, 4096.
  // - SINGLE_AZ_2 / MULTI_AZ_2 with 1 HA pair: 384, 768, 1536, 3072, 6144.
  // - SINGLE_AZ_2 with multiple HA pairs: 1536, 3072, 6144 per pair.
  //
  // Scales in place on SINGLE_AZ_2 and MULTI_AZ_2. On SINGLE_AZ_1 and
  // MULTI_AZ_1, increasing this value replaces the file system.
  optional int32 throughput_capacity_per_ha_pair = 6;

  // Number of high-availability pairs in the file system. Each HA pair adds
  // an independent pair of file servers contributing throughput, IOPS, and
  // up to 512 TiB of storage capacity.
  //
  // Only SINGLE_AZ_2 supports scale-out (1-12 HA pairs, added in place).
  // SINGLE_AZ_1, MULTI_AZ_1, and MULTI_AZ_2 are fixed at 1 HA pair.
  //
  // Default: 1
  optional int32 ha_pairs = 7 [
    (dev.planton.shared.options.default) = "1",
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 12
  ];

  // ---------------------------------------------------------------------------
  // Networking (ForceNew)
  // ---------------------------------------------------------------------------

  // Subnet IDs for the file system's network interfaces. Required. ForceNew.
  //
  // - SINGLE_AZ_1 / SINGLE_AZ_2: exactly one subnet.
  // - MULTI_AZ_1 / MULTI_AZ_2: exactly two subnets in different availability
  //   zones (the active and standby file servers).
  //
  // All compute resources accessing this file system (via NFS, SMB, or iSCSI)
  // must have network connectivity to these subnets.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef subnet_ids = 8 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 2,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSubnet,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.subnet_id"
  ];

  // Preferred subnet for the active file server in a multi-AZ deployment.
  // ForceNew. Required when deployment_type is MULTI_AZ_1 or MULTI_AZ_2 (and
  // invalid otherwise — single-AZ file systems have only one subnet). Must be
  // one of the subnets specified in subnet_ids.
  //
  // In a failover event, the standby file server in the other subnet takes
  // over automatically. Place the active server in the same AZ as the bulk of
  // your clients to avoid cross-AZ data charges during normal operation.
  dev.planton.shared.foreignkey.v1.StringValueOrRef preferred_subnet_id = 9 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSubnet,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.subnet_id"
  ];

  // Security groups for the file system's network interfaces. ForceNew.
  // Up to 50. When empty, AWS attaches the VPC's default security group.
  //
  // Must allow traffic between the file system and its clients:
  // - TCP port 111 (portmapper)
  // - TCP port 635 (mountd)
  // - TCP port 2049 (NFS)
  // - TCP ports 4045-4046 (NFS lock/status)
  // - TCP port 445 (SMB)
  // - TCP port 3260 (iSCSI)
  // - TCP port 443 (ONTAP REST API)
  // - TCP port 22 (SSH to the ONTAP CLI, if fsx_admin_password is used)
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef security_group_ids = 10 [
    (buf.validate.field).repeated.max_items = 50,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSecurityGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.security_group_id"
  ];

  // IP address range for the file system endpoints in a multi-AZ deployment,
  // in CIDR notation (e.g., "198.19.0.0/24"). ForceNew. AWS assigns floating
  // IPs from this range so the management, intercluster, and SVM data
  // endpoints survive failover with unchanged addresses.
  //
  // Must NOT overlap with any subnet in the VPC (AWS recommends a range
  // outside the VPC CIDR, such as the 198.19.0.0/16 block); clients reach it
  // through the route tables in route_table_ids. When omitted, AWS picks an
  // unused range automatically. Only valid for MULTI_AZ_1 / MULTI_AZ_2.
  string endpoint_ip_address_range = 11 [(buf.validate.field).cel = {
    id: "endpoint_ip_range_cidr_format"
    message: "endpoint_ip_address_range must be an IPv4 CIDR block (e.g., '198.19.0.0/24')"
    expression: "this == '' || this.matches('^([0-9]{1,3}\\\\.){3}[0-9]{1,3}/[0-9]{1,2}$')"
  }];

  // Route tables in which AWS creates and manages routes to the floating
  // endpoint IP range of a multi-AZ deployment. Specify every route table
  // associated with the subnets your clients live in; AWS repoints the routes
  // automatically on failover. Up to 50 route tables. When omitted, AWS uses
  // the VPC's main route table. Only valid for MULTI_AZ_1 / MULTI_AZ_2.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef route_table_ids = 12 [
    (buf.validate.field).repeated.max_items = 50,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSubnet,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.route_table_id"
  ];

  // ---------------------------------------------------------------------------
  // Encryption
  // ---------------------------------------------------------------------------

  // Customer-managed KMS key ARN for encryption at rest. ForceNew — the KMS key
  // cannot be changed after creation. When omitted, the file system uses the
  // AWS-managed FSx key. All ONTAP file systems are encrypted at rest by
  // default; this field upgrades to a customer-managed key.
  dev.planton.shared.foreignkey.v1.StringValueOrRef kms_key_id = 13 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsKmsKey,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_arn"
  ];

  // ---------------------------------------------------------------------------
  // ONTAP administration
  // ---------------------------------------------------------------------------

  // Password for the ONTAP administrative user ("fsxadmin"). Enables SSH and
  // REST API access to the file system for advanced administration such as LIF
  // management, SnapMirror configuration, and aggregate monitoring. Can be
  // changed after creation.
  //
  // Length: 8-50 characters. Optional — omit if ONTAP CLI access is not needed.
  // This value is sensitive and will not be returned in read operations.
  string fsx_admin_password = 14 [(dev.planton.shared.options.sensitive) = true];

  // ---------------------------------------------------------------------------
  // Disk IOPS configuration
  // ---------------------------------------------------------------------------

  // SSD IOPS configuration for the file system. Controls the total provisioned
  // IOPS. When omitted, AWS uses AUTOMATIC mode which provisions 3 IOPS per GiB
  // of storage capacity. Use USER_PROVISIONED mode for workloads requiring IOPS
  // beyond what AUTOMATIC provides. Can be changed after creation.
  AwsFsxOntapFileSystemDiskIopsConfiguration disk_iops_configuration = 15;

  // ---------------------------------------------------------------------------
  // Backup
  // ---------------------------------------------------------------------------

  // Number of days to retain automatic backups. Range: 0-90. Set to 0 to
  // disable automatic backups. ONTAP's built-in snapshots provide point-in-time
  // recovery independently of FSx backups, and volume-level backup settings
  // live on AwsFsxOntapVolume.
  //
  // Default: 0 (no automatic backups)
  optional int32 automatic_backup_retention_days = 16 [
    (dev.planton.shared.options.default) = "0",
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 90
  ];

  // Daily UTC time to start automatic backups, in "HH:MM" format (e.g.,
  // "05:00"). Only meaningful when automatic backups are enabled; when
  // omitted AWS chooses a window.
  string daily_automatic_backup_start_time = 17 [(buf.validate.field).cel = {
    id: "daily_backup_time_format"
    message: "daily_automatic_backup_start_time must be in 24-hour HH:MM format (e.g., '05:00')"
    expression: "this == '' || this.matches('^([01][0-9]|2[0-3]):[0-5][0-9]$')"
  }];

  // ---------------------------------------------------------------------------
  // Maintenance
  // ---------------------------------------------------------------------------

  // Weekly UTC maintenance window in "d:HH:MM" format where d is the day of
  // the week (1=Monday, 7=Sunday). Example: "7:02:00" for Sunday at 02:00 UTC.
  // If not specified, AWS chooses a default window.
  string weekly_maintenance_start_time = 18 [(buf.validate.field).cel = {
    id: "weekly_maintenance_time_format"
    message: "weekly_maintenance_start_time must be in d:HH:MM format where d is 1 (Monday) through 7 (Sunday), e.g., '7:02:00'"
    expression: "this == '' || this.matches('^[1-7]:([01][0-9]|2[0-3]):[0-5][0-9]$')"
  }];

  // ---------------------------------------------------------------------------
  // Spec-level CEL validations
  // ---------------------------------------------------------------------------

  // deployment_type valid values.
  option (buf.validate.message).cel = {
    id: "deployment_type_valid"
    message: "deployment_type must be 'SINGLE_AZ_1', 'SINGLE_AZ_2', 'MULTI_AZ_1', or 'MULTI_AZ_2'"
    expression: "!has(this.deployment_type) || this.deployment_type in ['SINGLE_AZ_1', 'SINGLE_AZ_2', 'MULTI_AZ_1', 'MULTI_AZ_2']"
  };

  // ONTAP file systems support only SSD primary storage — HDD and
  // INTELLIGENT_TIERING are other FSx types' storage classes and AWS rejects
  // them for ONTAP at create time. Volume-level tiering_policy is the ONTAP
  // cost-tiering mechanism.
  option (buf.validate.message).cel = {
    id: "storage_type_valid"
    message: "storage_type must be 'SSD' — ONTAP file systems support only SSD primary storage (use volume tiering policies for cost tiering)"
    expression: "!has(this.storage_type) || this.storage_type == 'SSD'"
  };

  // Throughput is sized through exactly one arm: whole-file-system
  // throughput_capacity (first generation) XOR per-HA-pair
  // throughput_capacity_per_ha_pair.
  option (buf.validate.message).cel = {
    id: "throughput_exactly_one_arm"
    message: "exactly one of throughput_capacity and throughput_capacity_per_ha_pair must be set"
    expression: "has(this.throughput_capacity) != has(this.throughput_capacity_per_ha_pair)"
  };

  // throughput_capacity valid values (the whole-file-system arm).
  option (buf.validate.message).cel = {
    id: "throughput_capacity_values"
    message: "throughput_capacity must be one of: 128, 256, 512, 1024, 2048, 4096"
    expression: "!has(this.throughput_capacity) || this.throughput_capacity in [128, 256, 512, 1024, 2048, 4096]"
  };

  // Per-HA-pair throughput values for the first generation.
  option (buf.validate.message).cel = {
    id: "throughput_per_ha_pair_gen1_values"
    message: "throughput_capacity_per_ha_pair must be one of 128, 256, 512, 1024, 2048, 4096 for SINGLE_AZ_1 / MULTI_AZ_1"
    expression: "!has(this.throughput_capacity_per_ha_pair) || !(has(this.deployment_type) && this.deployment_type in ['SINGLE_AZ_1', 'MULTI_AZ_1']) || this.throughput_capacity_per_ha_pair in [128, 256, 512, 1024, 2048, 4096]"
  };

  // Per-HA-pair throughput values for the current generation with a single
  // HA pair.
  option (buf.validate.message).cel = {
    id: "throughput_per_ha_pair_gen2_values"
    message: "throughput_capacity_per_ha_pair must be one of 384, 768, 1536, 3072, 6144 for SINGLE_AZ_2 / MULTI_AZ_2 with 1 HA pair"
    expression: "!has(this.throughput_capacity_per_ha_pair) || !((has(this.deployment_type) ? this.deployment_type : 'SINGLE_AZ_2') in ['SINGLE_AZ_2', 'MULTI_AZ_2'] && (has(this.ha_pairs) ? this.ha_pairs : 1) == 1) || this.throughput_capacity_per_ha_pair in [384, 768, 1536, 3072, 6144]"
  };

  // Per-HA-pair throughput values for SINGLE_AZ_2 scale-out (multiple HA
  // pairs).
  option (buf.validate.message).cel = {
    id: "throughput_per_ha_pair_scale_out_values"
    message: "throughput_capacity_per_ha_pair must be one of 1536, 3072, 6144 when ha_pairs > 1"
    expression: "!has(this.throughput_capacity_per_ha_pair) || (has(this.ha_pairs) ? this.ha_pairs : 1) == 1 || this.throughput_capacity_per_ha_pair in [1536, 3072, 6144]"
  };

  // Scale-out (ha_pairs > 1) is a SINGLE_AZ_2 capability only.
  option (buf.validate.message).cel = {
    id: "ha_pairs_scale_out_single_az_2_only"
    message: "ha_pairs > 1 is only supported for the SINGLE_AZ_2 deployment type (all other deployment types are fixed at 1 HA pair)"
    expression: "(has(this.ha_pairs) ? this.ha_pairs : 1) <= 1 || (has(this.deployment_type) ? this.deployment_type : 'SINGLE_AZ_2') == 'SINGLE_AZ_2'"
  };

  // Storage capacity scales with HA pairs: at least 1024 GiB per pair.
  option (buf.validate.message).cel = {
    id: "storage_capacity_min_per_ha_pair"
    message: "storage_capacity_gib must be at least 1024 GiB per HA pair"
    expression: "this.storage_capacity_gib >= 1024 * (has(this.ha_pairs) ? this.ha_pairs : 1)"
  };

  // Storage capacity scales with HA pairs: at most 524288 GiB (512 TiB) per
  // pair.
  option (buf.validate.message).cel = {
    id: "storage_capacity_max_per_ha_pair"
    message: "storage_capacity_gib must be at most 524288 GiB (512 TiB) per HA pair"
    expression: "this.storage_capacity_gib <= 524288 * (has(this.ha_pairs) ? this.ha_pairs : 1)"
  };

  // First-generation deployments cap at 192 TiB.
  option (buf.validate.message).cel = {
    id: "storage_capacity_gen1_ceiling"
    message: "storage_capacity_gib must be at most 196608 GiB (192 TiB) for SINGLE_AZ_1 / MULTI_AZ_1"
    expression: "!(has(this.deployment_type) && this.deployment_type in ['SINGLE_AZ_1', 'MULTI_AZ_1']) || this.storage_capacity_gib <= 196608"
  };

  // Single-AZ deployments take exactly one subnet.
  option (buf.validate.message).cel = {
    id: "single_az_exactly_one_subnet"
    message: "SINGLE_AZ deployment types require exactly one subnet in subnet_ids"
    expression: "!((has(this.deployment_type) ? this.deployment_type : 'SINGLE_AZ_2') in ['SINGLE_AZ_1', 'SINGLE_AZ_2']) || size(this.subnet_ids) == 1"
  };

  // Multi-AZ deployments take exactly two subnets (active + standby).
  option (buf.validate.message).cel = {
    id: "multi_az_exactly_two_subnets"
    message: "MULTI_AZ deployment types require exactly two subnets in subnet_ids (active and standby availability zones)"
    expression: "!((has(this.deployment_type) ? this.deployment_type : 'SINGLE_AZ_2') in ['MULTI_AZ_1', 'MULTI_AZ_2']) || size(this.subnet_ids) == 2"
  };

  // preferred_subnet_id is required for multi-AZ (the active file server's
  // placement is a real decision) and invalid for single-AZ (there is only
  // one subnet).
  option (buf.validate.message).cel = {
    id: "preferred_subnet_multi_az_contract"
    message: "preferred_subnet_id is required for MULTI_AZ_1 / MULTI_AZ_2 deployment types and invalid for single-AZ deployment types"
    expression: "((has(this.deployment_type) ? this.deployment_type : 'SINGLE_AZ_2') in ['MULTI_AZ_1', 'MULTI_AZ_2']) == has(this.preferred_subnet_id)"
  };

  // endpoint_ip_address_range requires a multi-AZ deployment type.
  option (buf.validate.message).cel = {
    id: "endpoint_ip_range_requires_multi_az"
    message: "endpoint_ip_address_range can only be set for MULTI_AZ_1 or MULTI_AZ_2 deployment types"
    expression: "this.endpoint_ip_address_range == '' || (has(this.deployment_type) && this.deployment_type in ['MULTI_AZ_1', 'MULTI_AZ_2'])"
  };

  // route_table_ids requires a multi-AZ deployment type.
  option (buf.validate.message).cel = {
    id: "route_tables_require_multi_az"
    message: "route_table_ids can only be set for MULTI_AZ_1 or MULTI_AZ_2 deployment types"
    expression: "size(this.route_table_ids) == 0 || (has(this.deployment_type) && this.deployment_type in ['MULTI_AZ_1', 'MULTI_AZ_2'])"
  };

  // fsx_admin_password length validation (8-50 when provided).
  option (buf.validate.message).cel = {
    id: "admin_password_length"
    message: "fsx_admin_password must be 8-50 characters when provided"
    expression: "this.fsx_admin_password == '' || (size(this.fsx_admin_password) >= 8 && size(this.fsx_admin_password) <= 50)"
  };

  // daily_automatic_backup_start_time requires backups enabled.
  option (buf.validate.message).cel = {
    id: "backup_time_requires_retention"
    message: "daily_automatic_backup_start_time requires automatic_backup_retention_days > 0"
    expression: "this.daily_automatic_backup_start_time == '' || (has(this.automatic_backup_retention_days) && this.automatic_backup_retention_days > 0)"
  };
}

// AwsFsxOntapFileSystemDiskIopsConfiguration controls the SSD IOPS provisioned
// for the file system. In AUTOMATIC mode, IOPS scale with storage capacity
// (3 IOPS per GiB). In USER_PROVISIONED mode, you specify the exact IOPS
// independently of storage, up to 2,400,000 IOPS for scale-out configurations.
message AwsFsxOntapFileSystemDiskIopsConfiguration {
  // IOPS provisioning mode.
  //
  // - "AUTOMATIC": IOPS scale automatically based on storage capacity.
  //   Provides 3 IOPS per GiB of storage.
  // - "USER_PROVISIONED": you specify the exact IOPS via the `iops` field.
  //   Allows higher performance independent of storage size but at extra cost.
  //
  // Default: AUTOMATIC
  optional string mode = 1 [(dev.planton.shared.options.default) = "AUTOMATIC"];

  // Total SSD IOPS provisioned. Only valid when mode is "USER_PROVISIONED".
  //
  // Valid range: 0–2,400,000. The maximum achievable IOPS depends on the number
  // of HA pairs and their throughput capacity tier.
  int32 iops = 2 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 2400000
  ];

  // mode valid values.
  option (buf.validate.message).cel = {
    id: "iops_mode_valid"
    message: "mode must be 'AUTOMATIC' or 'USER_PROVISIONED'"
    expression: "!has(this.mode) || this.mode in ['AUTOMATIC', 'USER_PROVISIONED']"
  };

  // iops requires USER_PROVISIONED mode.
  option (buf.validate.message).cel = {
    id: "iops_requires_user_provisioned"
    message: "iops can only be set when mode is 'USER_PROVISIONED'"
    expression: "this.iops == 0 || (has(this.mode) && this.mode == 'USER_PROVISIONED')"
  };
}
