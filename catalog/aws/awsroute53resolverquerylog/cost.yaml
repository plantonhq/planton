# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. This component deliberately ships no
# estimate model: Route 53 charges nothing for the configuration, and
# the spend that does start rides the referenced destination's meters
# at rates researched on THAT kind -- this manifest names the
# destination and the VPCs, never the query volume, so a dollar figure
# here would be a guess wearing a dollar sign.
# Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: awsroute53resolverquerylog
spec:
  billing_model: hybrid
  baseline_charges:
    - service_name: AmazonCloudWatch
      sku_meter: vended log delivery
      pricing_unit: GB
      description: The standing charge is delegated -- from the first log byte, every delivery pays CloudWatch Vended Logs rates and the referenced destination adds its own storage/ingestion meters, all billed on that component. Route 53's own side is permanently free, so a VPC with resolver traffic makes this pipeline's spend continuous without any meter appearing here.
  cost_drivers:
    - field_path: destination_arn
      sku_meter: vended log delivery
      pricing_unit: GB
      impact: The only rate lever this manifest holds -- WHOSE meters the pipeline feeds. Every destination type pays CloudWatch Vended Logs delivery charges (AWS's own docs say these apply even when logs publish directly to S3), and then the destination adds its own -- a log group's ingestion and storage, a bucket's storage and requests, a Firehose stream's ingestion -- all billed on the referenced destination component, never here.
    - field_path: vpc_ids
      sku_meter: vended log delivery
      pricing_unit: GB
      impact: Each associated VPC pours its resolver query volume into the destination -- the association itself is free, but every VPC added multiplies the log data the destination bills. The resolver's cache is a built-in damper; only unique queries are logged, so cache hits within TTL never become billable log bytes.
  free_tier: "Route 53's side is permanently free -- the pricing page's Resolver Query Logs section says it outright: 'Route 53 does not charge for VPC Resolver query logs.' The configuration object, its VPC associations, and the logging itself carry no Route 53 meter, whether one VPC is associated or fifty. The charges that DO start are the destination's, from the first log byte delivered."
  estimate_exclusions:
    - log volume is entirely query-driven and cache-filtered -- the same manifest costs nothing in a quiet VPC and real destination-side money in a chatty one, and this manifest never sees the query rate, which is why no estimate document exists for this component
    - CloudWatch Vended Logs delivery charges apply for every destination type -- even direct-to-S3 delivery, per the Route 53 developer guide -- at the rates on the CloudWatch pricing page's Vended Logs section
    - a CloudWatch log group destination bills its own ingestion, storage, and retention on the referenced AwsCloudwatchLogGroup
    - an S3 bucket destination bills storage and requests on the referenced AwsS3Bucket, plus KMS key use on the bucket's key when the archive is SSE-KMS encrypted
    - a Firehose delivery stream destination bills ingestion on that stream and whatever its downstream targets (OpenSearch, Redshift) bill on their own kinds
  notes: "The honest estimate lives at composition time: the logging pipeline from this manifest, the query volume from the workloads, the rates from the destination kind's price research. Each piece is verified data -- only their join is deferred, to the surface that sees both components together. The census's committed-idle check holds: both presets (a CloudWatch log group destination and an S3 archive destination, one VPC each) commit exactly zero dollars on existence."
