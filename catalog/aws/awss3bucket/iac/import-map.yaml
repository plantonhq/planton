apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awss3bucket
spec:
  # The module names the bucket after the Planton resource (locals.tf:
  # bucket_name = var.metadata.name), so every S3 import ID derives with
  # zero user input.
  values:
    - name: bucket
      derivations:
        - from_metadata_name: true
        - from_arn_part: resource_id
      where_to_find: >-
        S3 console -> Buckets (the bucket name), or `aws s3 ls`.
    - name: intelligent_tiering_name
      derivations:
        # The module keys each configuration's for_each instance by its name,
        # so the enumerated address carries the exact value the ID needs.
        - from_address_key: true
      where_to_find: >-
        S3 console -> bucket -> Management -> Intelligent-Tiering
        configurations (each configuration's name), or
        `aws s3api list-bucket-intelligent-tiering-configurations
        --bucket <bucket>`.
    - name: analytics_name
      derivations:
        # Same name-keyed for_each convention as intelligent tiering.
        - from_address_key: true
      where_to_find: >-
        S3 console -> bucket -> Metrics -> Storage Class Analysis (each
        configuration's name), or
        `aws s3api list-bucket-analytics-configurations --bucket <bucket>`.
    - name: inventory_name
      derivations:
        # Same name-keyed for_each convention as intelligent tiering.
        - from_address_key: true
      where_to_find: >-
        S3 console -> bucket -> Management -> Inventory configurations
        (each configuration's name), or
        `aws s3api list-bucket-inventory-configurations --bucket <bucket>`.
    - name: metric_name
      derivations:
        # Same name-keyed for_each convention as intelligent tiering.
        - from_address_key: true
      where_to_find: >-
        S3 console -> bucket -> Metrics -> Request metrics (each
        configuration's name), or
        `aws s3api list-bucket-metrics-configurations --bucket <bucket>`.
