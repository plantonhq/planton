# Full-surface AwsS3Bucket scenario: versioning, KMS encryption with a bucket
# key (the AWS-managed aws/s3 key, so no KMS prerequisite is needed), a
# TLS-only bucket policy (private-safe -- no public grant, so the default
# all-on public-access block accepts it), a lifecycle rule whose filter
# carries TWO predicates (prefix + size bound) to exercise the `and`
# document shaping, noncurrent-version pruning, website hosting with a
# routing rule (populates the website_endpoint/website_domain outputs),
# EventBridge notifications (the one notification arm needing no delivery
# permission on a target -- SQS/SNS/Lambda arms require the target's policy
# to grant S3 first, so they are proven by spec tests and documented), and
# an Intelligent-Tiering archive configuration.
#
# Deliberately not composed here: replication (needs a second versioned
# bucket + an IAM role with replicate permissions -- a cross-region cost
# with no additional module surface beyond what the offline gate proves),
# Object Lock (irreversible bucket mode; retention windows outlive the
# lane), and the S3 Metadata configuration (the provider schema's own
# create timeout is 30 minutes against this profile's 15-minute lane
# budget -- proven offline via the canonical manifest and the
# 04-governed-data-lake preset, never silently skipped). forceDestroy
# lets teardown remove versioned objects cleanly.
#
# Free arms added by the depth closure: ABAC, a storage-class-analysis
# configuration, a self-delivered inventory configuration (bucket ARNs are
# name-derived literals), a request-metrics configuration, a blocked
# SSE-C posture, and a day-zero INTELLIGENT_TIERING transition.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsS3Bucket
metadata:
  # Run-scoped name: S3 bucket names live in the GLOBAL namespace -- a
  # committed fixed name can be squatted by any AWS account, and a
  # recently-deleted name can sit in a propagation window that 409s
  # CreateBucket while HeadBucket answers 404 (live-hit 2026-08-11 on this
  # scenario's previous fixed name). Recorded exception to the
  # names-stay-stable guidance: S3's cloud identifier IS the metadata name,
  # and nothing references this scenario by name.
  name: planton-oss-e2e-s3-full-${E2E_RUN_ID}
  id: planton-oss-e2e-s3-full-${E2E_RUN_ID}
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awss3bucket
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  forceDestroy: true
  versioningStatus: Enabled
  encryption:
    sseAlgorithm: aws:kms
    bucketKeyEnabled: true
    # Free arm: refuse customer-provided-key uploads (states the March-2026
    # AWS default posture explicitly).
    blockedEncryptionTypes:
      - SSE-C
  policy:
    Version: "2012-10-17"
    Statement:
      - Sid: DenyInsecureTransport
        Effect: Deny
        Principal: "*"
        Action: "s3:*"
        Resource:
          - arn:aws:s3:::planton-oss-e2e-s3-full-${E2E_RUN_ID}
          - arn:aws:s3:::planton-oss-e2e-s3-full-${E2E_RUN_ID}/*
        Condition:
          Bool:
            aws:SecureTransport: "false"
  transitionDefaultMinimumObjectSize: all_storage_classes_128K
  lifecycleRules:
    # AWS forbids AbortIncompleteMultipartUpload on rules whose filter uses
    # tags or object size (enforced by the spec CEL this lane surfaced), so
    # the size-filtered rule carries transitions only and the unfiltered
    # prune rule carries the multipart cleanup.
    - id: tier-large-logs
      filter:
        prefix: logs/
        objectSizeGreaterThan: 131072
      transitions:
        - days: 30
          storageClass: STANDARD_IA
        - days: 90
          storageClass: GLACIER
    - id: prune-noncurrent
      noncurrentVersionExpiration:
        noncurrentDays: 30
        newerNoncurrentVersions: 2
      abortIncompleteMultipartUploadDays: 7
    # Free arm: day-zero transition -- objects under ingest/ enter
    # INTELLIGENT_TIERING on the day they are uploaded (the presence-typed
    # days field's explicit 0).
    - id: tier-at-ingest
      filter:
        prefix: ingest/
      transitions:
        - days: 0
          storageClass: INTELLIGENT_TIERING
  website:
    indexDocumentSuffix: index.html
    errorDocumentKey: error.html
    routingRules:
      - condition:
          keyPrefixEquals: docs/
        redirect:
          replaceKeyPrefixWith: documents/
  notification:
    eventbridge: true
  intelligentTieringConfigurations:
    - name: archive-cold-objects
      filterPrefix: archive/
      tiers:
        - accessTier: ARCHIVE_ACCESS
          days: 90
  # Free arm: attribute-based access control (tag-based authorization).
  abacStatus: Enabled
  # Free arm: storage-class analysis observing the logs/ prefix (no export
  # -- findings in the console only; the export arm is proven offline via
  # the canonical manifest and preset).
  analyticsConfigurations:
    - name: log-access-analysis
      filterPrefix: logs/
  # Free arm: self-delivered inventory (the bucket's own ARN is a
  # name-derived literal; delivery needs a bucket policy in production,
  # but the configuration itself creates and verifies without one).
  inventoryConfigurations:
    - name: weekly-audit
      includedObjectVersions: All
      frequency: Weekly
      optionalFields:
        - Size
        - EncryptionStatus
      destination:
        bucketArn:
          value: arn:aws:s3:::planton-oss-e2e-s3-full-${E2E_RUN_ID}
        format: CSV
        prefix: inventory/
  # Free arm: CloudWatch request metrics scoped to the logs/ prefix.
  metricsConfigurations:
    - name: log-requests
      filterPrefix: logs/
