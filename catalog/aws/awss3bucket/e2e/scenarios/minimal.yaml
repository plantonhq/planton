# Minimal AwsS3Bucket scenario -- the AWS harness walking skeleton.
# The bucket name is the resource metadata.name (S3 module derives the bucket
# from it) and lives in S3's GLOBAL namespace: a committed fixed name can be
# squatted by any AWS account (this repo is public) and a recently-deleted
# name can sit in a propagation window that 409s CreateBucket while
# HeadBucket answers 404 (live-hit 2026-08-11 on the full-surface sibling).
# The run-id token keeps every run's name globally fresh. The token in
# metadata.name is a recorded exception to the names-stay-stable guidance:
# S3 is the class where the CLOUD identifier IS the metadata name, and no
# prerequisite chain references this scenario by name.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsS3Bucket
metadata:
  name: planton-oss-e2e-s3-smoke-${E2E_RUN_ID}
  id: planton-oss-e2e-s3-smoke-${E2E_RUN_ID}
  org: planton-oss
  env: e2e
  # Full metadata is supplied so the bucket carries complete identity tags;
  # the managed-by label also tags the bucket for orphan cleanup.
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awss3bucket
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  forceDestroy: true
