# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. This kind deliberately ships no
# estimate: with semantic search enabled -- and BOTH catalog presets
# enable it -- the gateway commits real spend (Tool Indexing bills $0.02
# per 100 tools indexed per month while the index exists, at zero
# traffic), but the committed QUANTITY is the number of tools the
# targets register, and that count lives in the referenced OpenAPI
# document in S3, the remote MCP server's live tool listing, or the API
# Gateway stage's routes -- never in this manifest -- so a dollar figure
# here would be a guess wearing a dollar sign.
# Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: awsbedrockagentcoregateway
spec:
  billing_model: hybrid
  baseline_charges:
    - service_name: Amazon Bedrock AgentCore
      sku_meter: tool indexing
      pricing_unit: tool-months
      description: "With mcp.enable_semantic_search on (the field defaults off, but both catalog presets ship it on), every tool the gateway's targets register joins a semantic index that bills $0.02 per 100 tools indexed per month -- a standing monthly line item the pricing page's own example computes independent of traffic (200 tools bill $0.04/month whether agents call them or not). The rate is published; the quantity is not manifest-visible, because targets register tools dynamically from their referenced schema documents and servers."
  cost_drivers:
    - field_path: mcp.enable_semantic_search
      sku_meter: tool indexing
      pricing_unit: tool-months
      impact: "The committed-spend switch. Off (the default) leaves the gateway free at rest; on starts the monthly indexing meter over every registered tool AND prices agent tool discovery on its own meter -- Search API calls bill $0.025 per 1,000 invocations, five times the plain invocation rate. Turning it off is the kill switch for the standing charge."
    - field_path: targets
      sku_meter: gateway API invocations
      pricing_unit: invocations
      impact: Tools exist to be called -- every operation agents make against the gateway (ListTools, InvokeTool, Ping) bills $0.005 per 1,000 invocations, and each target's tools also join the indexed count that bills monthly while semantic search is on. Target COUNT never meters; call volume and indexed-tool count do.
    - field_path: policy_engine
      sku_meter: authorization requests
      pricing_unit: requests
      impact: Attaching a Cedar engine makes the gateway evaluate every tool call against it -- $0.000025 per authorization request on the AgentCore Policy meter, in LOG_ONLY as in ENFORCE mode. The bill scales with tool-call volume, and the engine itself lives (and estimates) on the referenced AwsBedrockAgentCoreIdentity.
    - field_path: interceptors
      sku_meter: Lambda invocations
      pricing_unit: requests
      impact: AgentCore publishes no meter for interception itself -- what bills is the referenced AwsLambda, invoked once per configured interception point on every request and/or response that flows through the gateway.
    - field_path: targets.private_endpoint
      sku_meter: VPC data processing
      pricing_unit: GB
      impact: "Reaching private backends through your VPC bills a data processing rate -- $0.006 per GB of data egress to customer-owned VPCs in commercial AWS Regions -- on top of standard EC2 network transfer. The same meter applies to the JWT authorizer's private OIDC path (custom_jwt_authorizer.private_endpoint)."
    - field_path: kms_key_arn
      sku_meter: KMS requests
      pricing_unit: requests
      impact: A customer-managed key bills its per-request meter on the referenced AwsKmsKey for the gateway's encrypt/decrypt traffic; unset means the service-managed key at no charge.
  free_tier: "No permanent free allotment exists on any Gateway meter -- API invocations bill from the first call, Search API from the first query, and tool indexing from the first indexed tool-month. The up-to-$200 AWS Free Tier credit for new customers is a one-time trial credit, not a permanent tier. Customer-defined rate limiting carries no extra charge."
  estimate_exclusions:
    - the committed tool-indexing quantity is not manifest-visible -- targets register tools from referenced OpenAPI/Smithy documents, Lambda tool schemas, API Gateway routes, or live MCP server listings, which is why no estimate document exists for this component
    - gateway API invocations bill $0.005 per 1,000 (ListTools, InvokeTool, Ping) and Search API calls $0.025 per 1,000 -- volume is entirely agent-driven
    - policy authorization bills $0.000025 per evaluated tool call when a Cedar engine is attached
    - interceptor Lambda invocations bill on the referenced AwsLambda; backend charges (Lambda invokes, API Gateway requests, agent-runtime sessions) bill on their own components
    - data egress to customer-owned VPCs bills $0.006 per GB data processing in commercial regions; network transfer bills at standard EC2 rates
    - Web Search called through the gateway bills $7.00 per 1,000 queries, and Bedrock Managed Knowledge Base bills per the Amazon Bedrock pricing page
    - customer-managed-key requests bill on the referenced AwsKmsKey
  notes: "The gateway object is free to create -- what moves this kind to hybrid is a switch, not the object: semantic search (on in both catalog presets) starts a standing monthly Tool Indexing charge that bills while the index exists, at zero traffic. The magnitude is cents per hundred tools per month; the honesty is the point -- committed spend with an unknowable manifest-side quantity gets a stated meter, not a fabricated estimate. The honest estimate lives at composition time: the switch from this manifest, the tool count from the referenced schema documents and servers, and the published rate from the pricing page. The usage arm is where real money moves: $0.005 per 1,000 invocations and $0.025 per 1,000 searches follow agent traffic, and the pricing page's own gateway example lands at $2,250.04/month of which four cents is the committed index."
