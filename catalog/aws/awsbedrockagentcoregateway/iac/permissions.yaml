# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awsbedrockagentcoregateway
spec:
  aws:
    statements:
      - sid: CreateGateway
        actions:
          - bedrock-agentcore:CreateGateway
        resources:
          - "*"
        provenance: derived
        notes: Covers aws_bedrockagentcore_gateway / bedrock.AgentcoreGateway at create. NON-SCOPABLE -- the service reference lists no resource types for CreateGateway (the gateway id does not exist until the call returns), so an ARN-scoped grant would be a runtime DENY; the wildcard is the narrowest possible scope for this one action.
      - sid: ManageGateway
        actions:
          - bedrock-agentcore:GetGateway
          - bedrock-agentcore:UpdateGateway
          - bedrock-agentcore:DeleteGateway
        resources:
          - arn:aws:bedrock-agentcore:*:*:gateway/*
        provenance: derived
        notes: Covers the rest of aws_bedrockagentcore_gateway / bedrock.AgentcoreGateway. GetGateway runs on every plan/refresh; UpdateGateway reconciles description, role, MCP tuning, interceptors, and the policy-engine attachment in place; changing authorizer_type replaces the gateway. All three scope to the gateway ARN per the service reference.
      - sid: ManageGatewayTargets
        actions:
          - bedrock-agentcore:CreateGatewayTarget
          - bedrock-agentcore:GetGatewayTarget
          - bedrock-agentcore:UpdateGatewayTarget
          - bedrock-agentcore:DeleteGatewayTarget
        resources:
          - arn:aws:bedrock-agentcore:*:*:gateway/*
        provenance: derived
        notes: Covers aws_bedrockagentcore_gateway_target / bedrock.AgentcoreGatewayTarget -- one per targets entry. Targets have no ARN format of their own; the service reference scopes all four actions (including CreateGatewayTarget, unlike the gateway's own create) to the parent gateway ARN. AWS reads schema documents and reaches backends through the gateway's execution role, not the runner -- the referenced AwsIamRole's contract carries the s3/lambda/execute-api grants, so the runner needs none of them.
      - sid: TagGateway
        actions:
          - bedrock-agentcore:TagResource
          - bedrock-agentcore:UntagResource
          - bedrock-agentcore:ListTagsForResource
        resources:
          - arn:aws:bedrock-agentcore:*:*:gateway/*
        provenance: derived
        notes: Tag-on-create plus later tag reconciliation and the tag read on every refresh. The modules tag the gateway resource only (targets carry no tags argument), so the grant scopes to the gateway ARN format alone.
      - sid: PassGatewayExecutionRole
        actions:
          - iam:PassRole
        resources:
          - arn:aws:iam::*:role/*
        provenance: derived
        notes: "The runner passes the spec's required role_arn to the service at gateway create and on role changes. Tightening path: pin the resource to the specific role ARN and add the condition iam:PassedToService = bedrock-agentcore.amazonaws.com so the grant cannot leak the role to any other service."
