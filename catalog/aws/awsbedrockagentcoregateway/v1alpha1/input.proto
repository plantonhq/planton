syntax = "proto3";

package dev.planton.aws.awsbedrockagentcoregateway.v1alpha1;

import "catalog/aws/awsbedrockagentcoregateway/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsBedrockAgentCoreGatewayIacInput is the input for the IaC modules
// that deploy the AgentCore gateway.
message AwsBedrockAgentCoreGatewayIacInput {
  // target is the AwsBedrockAgentCoreGateway resource to deploy.
  AwsBedrockAgentCoreGateway target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
