# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsbedrockagentcoregateway
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: With kms_key_arn unset, AWS encrypts the gateway's stored data -- target configurations, derived tool schemas, the semantic tool index -- under a service-managed key; an unencrypted gateway is not representable.
    - control_id: enc-at-rest-cmk
      status: configurable
      field_path: kms_key_arn
      evidence:
        type: spec_default
        reference: Unset means the service-managed key; referencing a KMS key puts the gateway's data at rest under a customer-managed key you own and can revoke.
      notes: Revoking the key's grant makes the gateway's stored configuration unreadable to the service, which is the point of holding the key.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "The gateway's MCP front door is an HTTPS-only URL, management rides the SigV4 bedrock-agentcore endpoints, and the spec holds outbound to TLS too: mcp_server targets must match ^https:// and AWS rejects an OpenAPI target whose servers array is not HTTPS at create (live-caught 2026-08-14). No plaintext hop exists on either side of the gateway."
    - control_id: no-public-access
      status: configurable
      field_path: authorizer_type
      evidence:
        type: spec_default
        reference: The front door is an AWS-hosted URL, and the REQUIRED authorizer choice decides who gets through it -- AWS_IAM (SigV4) and CUSTOM_JWT keep every call authenticated, AUTHENTICATE_ONLY validates identity without authorization, and NONE deliberately opens the endpoint to anyone holding the URL. Changing the choice replaces the gateway.
      notes: Both catalog presets choose authenticated modes (AWS_IAM, CUSTOM_JWT); NONE is the explicit opt-in to an open tool surface.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The MCP endpoint is a public AWS-managed URL -- this kind exposes no network-source restriction (no security groups, no VPC endpoint policy) on the inbound path. Caller restriction is identity-shaped (authorizer_type, custom_jwt_authorizer.allowed_workloads and custom claims); the private_endpoint arms in the spec are OUTBOUND paths to private backends and IdPs, not inbound controls.
    - control_id: edge-protection
      status: not_applicable
      notes: The service reference publishes WebACL association actions for gateways (GatewayAssociateWebACL and kin), but neither this spec nor the official modules expose an attachment surface yet. In-manifest request filtering is limited to JWT claim checks and Lambda REQUEST interceptors, which rewrite rather than block at the edge.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every management operation -- gateway and target create, update, delete -- is IAM-authorized and scoped to the gateway ARN per the service reference; inbound tool calls are authorized by the configured authorizer, and per-tool-call authorization arrives with the attached Cedar policy_engine on top.
    - control_id: workload-identity
      status: enforced_by_default
      evidence:
        type: spec_default
        reference: role_arn is REQUIRED -- every gateway runs under an explicit IAM role that must trust bedrock-agentcore.amazonaws.com, and outbound target calls sign with its short-lived assumed credentials. Per-target credential providers (vaulted API keys, OAuth clients, caller-credential forwarding) refine the outbound identity without ever placing a long-lived secret in this manifest.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: Inbound paths are SigV4 or OIDC-validated JWT -- no legacy or weaker protocol exists to disable. The NONE authorizer choice is not a legacy protocol but an explicit no-auth posture, examined under no-public-access.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: All bedrock-agentcore control-plane operations on the gateway and its targets -- create, update, authorizer changes, delete -- are management events CloudTrail records unconditionally in the account's event history.
    - control_id: monitoring-integration
      status: not_applicable
      notes: This kind exposes no telemetry hook of its own -- gateway spans, tool-call metrics, and logs ride AgentCore Observability into Amazon CloudWatch as an account-side enablement, configured and billed outside this manifest.
    - control_id: backup-recovery
      status: not_applicable
      notes: The gateway and its targets are configuration recreatable from the manifest -- nothing lives here that a backup would preserve. Schema documents live in the referenced S3 bucket, whose durability posture is that component's; the semantic index rebuilds from the registered targets.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: Nothing here retains data over time -- there is no retention window to police. MCP sessions expire on session_timeout_seconds, which is protocol plumbing, not data retention.
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: AgentCore Gateway is a regional managed service AWS operates across availability zones -- the manifest has no zonal footprint to configure.
    - control_id: deletion-protection
      status: not_applicable
      notes: The gateway carries no deletion-protection flag. AWS deletes a gateway's targets automatically before the gateway itself at destroy; everything is recreatable from the manifest, and agents lose the tool surface the moment the URL dies -- which is also the emergency kill switch.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- AWS operates and patches the MCP protocol layer, the semantic index, and the target adapters; the gateway exposes no runtime, version, or maintenance surface beyond the MCP supported_versions list.
