# A self-activating ROOT CA in SHORT_LIVED_CERTIFICATE mode (USD
# 50/month prorated hourly - the cheap mode; revocation is forbidden
# there, matching the lane's no-CRL posture), with the ACM renewal
# permission granted, a 7-day restore window (frees the deleted CA's
# slot fastest), and one end-entity client certificate issued from a
# committed CSR. The CSR's private key was discarded at authoring -
# the certificate authenticates nothing; it proves the issue path.
# Lane cost: ~USD 0.07/hour of CA lifetime plus USD 0.75 for the one
# issued certificate.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsPrivateCa
metadata:
  name: planton-oss-e2e-awspca-root
  id: planton-oss-e2e-awspca-root
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsprivateca
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  type: ROOT
  keyAlgorithm: RSA_2048
  signingAlgorithm: SHA256WITHRSA
  subject:
    commonName: Planton OSS E2E Root CA
    organization: Planton OSS E2E
    country: US
  usageMode: SHORT_LIVED_CERTIFICATE
  rootCaValidity:
    type: YEARS
    value: "10"
  acmRenewalPermission: true
  permanentDeletionTimeInDays: 7
  issuedCertificates:
    - name: mtls-client
      signingAlgorithm: SHA256WITHRSA
      # Short-lived mode caps end-entity validity at 7 days.
      validity:
        type: DAYS
        value: "7"
      templateArn: arn:aws:acm-pca:::template/EndEntityClientAuthCertificate/V1
      csr: |
