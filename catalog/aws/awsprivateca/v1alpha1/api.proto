syntax = "proto3";

package dev.planton.aws.awsprivateca.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsprivateca/v1alpha1/outputs.proto";
import "catalog/aws/awsprivateca/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsPrivateCa {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsPrivateCa'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsPrivateCaSpec spec = 4 [(buf.validate.field).required = true];
  AwsPrivateCaStatus status = 5;
}

message AwsPrivateCaStatus {
  AwsPrivateCaOutputs outputs = 1;
}
