syntax = "proto3";

package dev.planton.aws.awsprivateca.v1alpha1;

import "catalog/aws/awsprivateca/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsPrivateCaIacInput is the input for the IaC modules that manage
// a private certificate authority with its activation, issued
// certificates, permission, and policy.
message AwsPrivateCaIacInput {
  // target is the AwsPrivateCa resource to deploy.
  AwsPrivateCa target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
