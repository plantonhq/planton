apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awsprivateca
spec:
  aws:
    statements:
      - sid: CreateCertificateAuthority
        actions:
          - acm-pca:CreateCertificateAuthority
        resources:
          - "*"
        provenance: derived
        notes: NON-SCOPABLE per the service reference (the CA's ARN does not exist until the call returns), so the wildcard is the narrowest possible scope. One aws_acmpca_certificate_authority per manifest.
      - sid: ManageCertificateAuthority
        actions:
          - acm-pca:DescribeCertificateAuthority
          - acm-pca:UpdateCertificateAuthority
          - acm-pca:DeleteCertificateAuthority
          - acm-pca:TagCertificateAuthority
          - acm-pca:UntagCertificateAuthority
          - acm-pca:ListTags
        resources:
          - arn:aws:acm-pca:*:*:certificate-authority/*
        provenance: derived
        notes: DescribeCertificateAuthority serves every plan/refresh; UpdateCertificateAuthority applies revocation-configuration and enabled/disabled changes; DeleteCertificateAuthority tears down (setting the permanent_deletion_time_in_days restore window). The CA is tagged (tags = local.aws_tags), so all three tag actions ride the same ARN scope.
      - sid: ActivateAndIssue
        actions:
          - acm-pca:GetCertificateAuthorityCsr
          - acm-pca:IssueCertificate
          - acm-pca:GetCertificate
          - acm-pca:ImportCertificateAuthorityCertificate
          - acm-pca:GetCertificateAuthorityCertificate
        resources:
          - arn:aws:acm-pca:*:*:certificate-authority/*
        provenance: derived
        notes: The composed activation dance -- a ROOT CA self-signs (CSR from the CA, IssueCertificate with the root template against the SAME CA, GetCertificate, ImportCertificateAuthorityCertificate); a SUBORDINATE issues from the PARENT CA named in subordinate_activation, which is why the scope stays at certificate-authority/* rather than a single CA. The same actions serve issued_certificates entries (aws_acmpca_certificate for_each).
      - sid: AcmRenewalPermission
        actions:
          - acm-pca:CreatePermission
          - acm-pca:DeletePermission
          - acm-pca:ListPermissions
        resources:
          - arn:aws:acm-pca:*:*:certificate-authority/*
        provenance: derived
        notes: Exercised only when acm_renewal_permission is true -- aws_acmpca_permission grants acm.amazonaws.com the IssueCertificate/GetCertificate/ListPermissions set so ACM-requested certificates auto-renew.
      - sid: ResourcePolicy
        actions:
          - acm-pca:PutPolicy
          - acm-pca:GetPolicy
          - acm-pca:DeletePolicy
        resources:
          - arn:aws:acm-pca:*:*:certificate-authority/*
        provenance: derived
        notes: Exercised only when the policy field is set -- aws_acmpca_policy manages the CA's resource policy for cross-account/organization issuance grants.
