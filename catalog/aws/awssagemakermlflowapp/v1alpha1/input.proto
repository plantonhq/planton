syntax = "proto3";

package dev.planton.aws.awssagemakermlflowapp.v1alpha1;

import "catalog/aws/awssagemakermlflowapp/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsSagemakerMlflowAppIacInput is the input for the IaC modules that
// deploy the MLflow app.
message AwsSagemakerMlflowAppIacInput {
  // target is the AwsSagemakerMlflowApp resource to deploy.
  AwsSagemakerMlflowApp target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
