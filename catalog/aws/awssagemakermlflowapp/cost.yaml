# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: awssagemakermlflowapp
spec:
  billing_model: free
  free_tier: "AWS prices the serverless MLflow app at nothing, in its own words -- the launch announcement (AWS News Blog, 'Accelerate AI development using Amazon SageMaker AI with serverless MLflow') states: 'The new serverless MLflow capability is offered at no additional cost. Note there are service limits that apply.' The SageMaker AI pricing page agrees by omission: its MLflow section meters only the hourly-billed TRACKING SERVERS (compute hours by size, plus metadata stored on the server) -- the predecessor shape this serverless app replaces -- and carries no meter for the app. The service limits AWS mentions are capacity bounds on the free capability, not meters: hitting one throttles or rejects requests, it never starts a charge."
  notes: "No field of this spec buys anything on this component -- but the app is the front door to spend that bills elsewhere, and the routing is precise. MLflow artifacts (model files, run outputs, traces) land in the S3 location behind artifact_store_uri -- a raw URI, not a managed reference -- so storage and request charges accrue on whatever component owns that bucket. The compute that GENERATES the experiments bills on its own kinds: training and processing jobs, AwsSagemakerPipeline executions' step compute, and Studio notebook apps through the associated AwsSagemakerDomain. Models auto-registered by model_registration_mode go to the SageMaker Model Registry, which is free. And the hourly MLflow meters that DO exist on the price sheet belong to the covered sibling AwsSagemakerMlflowServer -- the dedicated tracking server whose Small/Medium/Large hourly rates this serverless app exists to make unnecessary. Nothing about the app itself ever appears on an invoice."
