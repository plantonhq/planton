apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awssagemakermlflowapp
spec:
  # The app imports by its ARN (the app's AWS identity - names are
  # mutable).
  values:
    - name: app_arn
      derivations:
        - from_output: app_arn
      where_to_find: >-
        `aws sagemaker list-mlflow-apps` shows Arn per app (shape
        "arn:aws:sagemaker:<region>:<account>:mlflow-app/app-...").
