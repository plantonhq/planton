apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsebsvolume
spec:
  # One scenario: an encrypted gp3 volume with explicit performance
  # dials attached to the fixture instance (shared subnet chain +
  # one t3.micro path prerequisite) - pennies for minutes of
  # instance + 10 GiB.
  #
  # Deliberately not exercised live:
  #   - the COPY arm (copy_from) -- its source is another
  #     AwsEbsVolume, the same kind under test, which the harness's
  #     self-kind-prerequisite guard blocks. Unblock: same-kind
  #     path-prerequisite support in the harness.
  #   - io1/io2 multi-attach -- needs two instances and a
  #     cluster-aware filesystem to mean anything; the spec's
  #     multi-attach CELs are the load-bearing guards. Unblock: a
  #     second instance prerequisite when demand shows.
  #   - final_snapshot -- config-only at AWS (never read back);
  #     asserting it means observing an untracked snapshot appear on
  #     destroy. Unblock: a post-destroy DescribeSnapshots probe in
  #     the verifier.
  #
  # PROVEN live 2026-08-26 (Q46): both engines through the full
  # six-phase runner + the Terraform blind import round-trip under the
  # armed apply-idempotency gate. Clean first-pass - the us-west-2a
  # AZ-pinned attachment to the t3.micro path fixture deployed,
  # detached stop-free, and the attachment's
  # {device}:{volume}:{instance} composite re-imported blind at zero
  # diff (~4 min per engine including the VPC/subnet/instance chain).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
