syntax = "proto3";

package dev.planton.aws.awsebsvolume.v1alpha1;

import "catalog/aws/awsebsvolume/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsEbsVolumeIacInput is the input for the IaC modules that manage
// a standalone EBS volume.
message AwsEbsVolumeIacInput {
  // target is the AwsEbsVolume resource to deploy.
  AwsEbsVolume target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
