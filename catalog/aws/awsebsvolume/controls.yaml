# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsebsvolume
spec:
  controls:
    - control_id: enc-at-rest
      status: configurable
      field_path: encrypted
      evidence:
        type: spec_default
        reference: Unset means the volume is created unencrypted unless the ACCOUNT has EBS encryption-by-default enabled (an account-region setting outside this manifest); encrypted=true encrypts the volume, its snapshots, and volumes restored from them under the AWS-managed aws/ebs key. Fixed for life -- encrypting an existing volume means snapshot, copy-encrypted, restore.
      notes: The copy arm (copy_from) cannot set this -- a copy inherits the source volume's encryption posture, which is why the spec forbids encrypted alongside copy_from.
    - control_id: enc-at-rest-cmk
      status: configurable
      field_path: kms_key_id
      evidence:
        type: spec_default
        reference: Unset with encrypted=true means the AWS-managed aws/ebs key; referencing an AwsKmsKey switches the volume to a customer-managed key you own and can revoke -- revoking the key's grants makes the volume's data unreadable at next detach/attach, which is the point of holding the key.
    - control_id: enc-in-transit
      status: configurable
      field_path: encrypted
      evidence:
        type: provider_default
        reference: For an encrypted volume, AWS encrypts data moving between the attached instance and the volume -- in-transit protection rides the same encrypted=true switch. An unencrypted volume's block traffic crosses AWS's isolated storage network without that guarantee.
    - control_id: no-public-access
      status: not_applicable
      notes: A block device has no network endpoint -- it is reachable only as a disk on the instance it is attached to. There is nothing to expose or make public; data-path access control is the attached instance's posture.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network ingress exists to restrict (see no-public-access).
    - control_id: edge-protection
      status: not_applicable
      notes: No request-serving surface exists; there is no WAF attachment point on a block device.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every volume operation -- create, modify, attach, detach, snapshot, delete -- is IAM-authorized on the volume ARN, and attach/detach additionally require rights on the instance ARN, so wiring a volume to a workload takes explicit grants on both sides.
    - control_id: workload-identity
      status: not_applicable
      notes: A volume runs no workload and holds no credentials -- it is storage the attached instance's workloads use under that instance's identity posture.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The only management path is the SigV4-signed EC2 API; the data path is the hypervisor's block interface to the attached instance. No legacy or weaker protocol exists to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: The volume has no logging configuration of its own. Control-plane operations (create, attach, delete) are captured by account-level AWS CloudTrail -- a service behavior, not a manifest choice. Block-level data access is not loggable on any EBS volume.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every EBS volume automatically emits CloudWatch metrics (VolumeReadOps, VolumeWriteBytes, VolumeQueueLength, BurstBalance where applicable) at no charge and with nothing to enable -- alarms on them are the owner's to add on their own component.
    - control_id: backup-recovery
      status: configurable
      field_path: final_snapshot
      evidence:
        type: spec_default
        reference: Unset means destroy deletes the data with the volume; final_snapshot=true snapshots the volume before destroy -- the teardown safety net. Restore is first-class on the create arm via snapshot_id, so manifest plus snapshot recreates the volume's data in any zone.
      notes: This flag covers teardown only. Ongoing scheduled backups are snapshot-lifecycle territory (the AwsEbsSnapshot kind or Data Lifecycle Manager), not a field of this manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: The volume carries no retention field -- snapshots it spawns (including the final_snapshot one, which this resource does not track) persist until someone deletes them, and retention policy lives with the snapshot tooling that owns them.
    - control_id: multi-zone-ha
      status: not_applicable
      notes: EBS volumes are zonal by design -- a volume lives its whole life in exactly one availability zone (availability_zone is fixed for life; a copy lands in its source's zone). Cross-zone durability is snapshot-and-restore or application-level replication; even io2 multi-attach binds instances within the same zone.
    - control_id: deletion-protection
      status: not_applicable
      notes: EBS volumes carry no provider deletion-protection flag. The attachment's skip_destroy is an IaC-behavior lever, not a protection feature -- it leaves the volume attached (and hence undeletable at AWS) when the attachment leaves management. AWS refuses to delete any attached volume, and final_snapshot is the data safety net for deliberate teardown.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed storage service -- AWS operates and patches the storage infrastructure beneath every volume; the volume exposes no runtime, version, or maintenance surface.
