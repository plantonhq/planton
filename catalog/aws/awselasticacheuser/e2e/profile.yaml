apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awselasticacheuser
spec:
  # An ElastiCache RBAC user under live E2E: the harness runs deploy ->
  # DescribeUsers verify -> destroy -> verify-destroyed on both provisioners.
  # The scenario is a locked-down "default" user (no-password-required,
  # access string "off") — no credential material in CI, and the shape every
  # user group must include. ElastiCache users are regional, free, and
  # provision in seconds.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 10
