syntax = "proto3";

package dev.planton.aws.awsmemcachedelasticache.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsmemcachedelasticache/v1alpha1/outputs.proto";
import "catalog/aws/awsmemcachedelasticache/v1alpha1/spec.proto";
import "shared/metadata.proto";

// aws-memcached-elasticache
message AwsMemcachedElasticache {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsMemcachedElasticache'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsMemcachedElasticacheSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsMemcachedElasticacheStatus status = 5;
}

// aws-memcached-elasticache status
message AwsMemcachedElasticacheStatus {
  //outputs
  AwsMemcachedElasticacheOutputs outputs = 1;
}
