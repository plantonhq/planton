syntax = "proto3";

package dev.planton.aws.awsrdsproxy.v1alpha1;

import "catalog/aws/awsrdsproxy/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsRdsProxyIacInput is the input for the IaC modules that manage
// an RDS Proxy with its connection pool, endpoints, and database
// target.
message AwsRdsProxyIacInput {
  // target is the AwsRdsProxy resource to deploy.
  AwsRdsProxy target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
