syntax = "proto3";

package dev.planton.aws.awsrdsproxy.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsrdsproxy/v1alpha1/outputs.proto";
import "catalog/aws/awsrdsproxy/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsRdsProxy {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsRdsProxy'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsRdsProxySpec spec = 4 [(buf.validate.field).required = true];
  AwsRdsProxyStatus status = 5;
}

message AwsRdsProxyStatus {
  AwsRdsProxyOutputs outputs = 1;
}
