apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsrdsproxy
spec:
  # One scenario: a PostgreSQL proxy fronting the RDS-instance fixture
  # with IAM auth, pool tuning, a read-only endpoint, and the target
  # registered. Cost: the RDS instance fixture's hours (cents) plus
  # proxy per-vCPU pricing on the target (cents for lane minutes).
  # Wall clock is the dominator: the instance fixture takes ~10
  # minutes each way and the proxy itself ~3-5 minutes to AVAILABLE.
  # Watch: the target registration's CREATING retry window against the
  # fresh instance; whether a READ_ONLY endpoint on a non-Aurora
  # instance target reaches AVAILABLE (AWS documents reader endpoints
  # for Aurora - the lane settles the instance-target contract);
  # the four-part target import composite's first live round-trip.
  #
  # Deliberately not exercised live:
  #   - a TRACKED_CLUSTER (Aurora) target -- the instance target
  #     proves the registration machinery; the Aurora arm rides the
  #     same RegisterDBProxyTargets call. Unblock: compose the
  #     AwsRdsCluster fixture into a second scenario.
  #   - IPV6/DUAL network types (the chain's subnets are IPv4-only).
  #   - SQLSERVER/MYSQL engine families (one family proves the render;
  #     the family is a pass-through vocabulary).
  #
  # PROVEN 2026-08-26: both engines green through the full lifecycle
  # plus the TF blind round-trip - 4 resources re-imported blind at
  # ZERO tolerances, including the four-part
  # {proxy}/{tg}/{type}/{resource_id} target composite (the catalog's
  # deepest). DescribeDBProxies echoed available with IAMAuth REQUIRED
  # and RequireTLS true per engine window; the READ_ONLY endpoint on a
  # plain INSTANCE target DID reach available (settled live - reader
  # endpoints are not Aurora-only), taking ~9-11 min to provision per
  # engine (the lane's second wall-clock driver after the RDS
  # instance fixture; TF DEPLOY 16m35s total, DESTROY ~6m). Zero
  # catches.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 60
