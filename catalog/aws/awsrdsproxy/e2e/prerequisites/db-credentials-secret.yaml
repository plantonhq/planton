# Consumer-scoped credentials fixture: the Secrets Manager secret the
# proxy's auth entry reads. The standard RDS credential JSON shape;
# the password never signs in anywhere (the lane proves proxy
# plumbing, not database auth). zero-day recovery window so destroy
# frees the name immediately.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsSecretsManagerSecret
metadata:
  name: planton-oss-e2e-rdsproxy-creds
  id: planton-oss-e2e-rdsproxy-creds
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awssecretsmanagersecret
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E database credentials for the RDS proxy lane
  stringValue: '{"username":"e2eadmin","password":"planton-e2e-not-a-real-password"}'
  recoveryWindowInDays: 0
