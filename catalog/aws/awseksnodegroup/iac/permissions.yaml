# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awseksnodegroup
spec:
  aws:
    statements:
      - sid: ManageNodeGroup
        actions:
          - eks:CreateNodegroup
          - eks:DeleteNodegroup
          - eks:DescribeNodegroup
          - eks:UpdateNodegroupConfig
          - eks:UpdateNodegroupVersion
          - eks:TagResource
          - eks:UntagResource
        resources:
          - arn:aws:eks:*:*:nodegroup/*/*/*
          - arn:aws:eks:*:*:cluster/*
        provenance: derived
        notes: Covers aws_eks_node_group -- the module's only resource. CreateNodegroup authorizes against the cluster ARN; config updates carry scaling, labels, taints, repair, and update settings; version updates roll AMIs.
      - sid: PassNodeRole
        actions:
          - iam:PassRole
          - iam:GetRole
        resources:
          - arn:aws:iam::*:role/*
        provenance: derived
        notes: EKS attaches the referenced node role (node_role_arn) to the group's instances; creating the group passes it, and the provider reads it back. Narrow to the actual role ARN in a hardened deployment.
      - sid: DescribeCapacityContext
        actions:
          - ec2:DescribeSubnets
          - ec2:DescribeSecurityGroups
          - ec2:DescribeLaunchTemplates
          - ec2:DescribeLaunchTemplateVersions
          - ec2:DescribeKeyPairs
        resources:
          - "*"
        provenance: derived
        notes: Validates the referenced subnets, the optional launch template (id and version), and the optional SSH key pair. EC2 Describe APIs support no resource-level scoping, so the wildcard is the narrowest possible scope.
      - sid: ReadManagedAutoScalingGroup
        actions:
          - autoscaling:DescribeAutoScalingGroups
        resources:
          - "*"
        provenance: derived
        notes: The managed group's underlying Auto Scaling group (including its warm pool) is service-managed; the provider reads it to expose the group resources in state. Auto Scaling Describe APIs support no resource-level scoping.
      - sid: CreateEksNodegroupServiceLinkedRole
        actions:
          - iam:CreateServiceLinkedRole
        resources:
          - arn:aws:iam::*:role/aws-service-role/eks-nodegroup.amazonaws.com/*
        provenance: derived
        notes: The first managed node group in an account creates the EKS nodegroup service-linked role automatically; scoped to exactly that role path.
