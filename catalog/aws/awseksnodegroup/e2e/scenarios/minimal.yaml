# Minimal AwsEksNodeGroup scenario: a zero-capacity managed pool on the
# EKS control-plane prerequisite, assuming the worker role from the IAM
# prerequisite profile (which carries the three worker policies itself).
# min=0/desired=0 means AWS validates the full cluster/role/subnet wiring
# and creates the backing Auto Scaling group without launching a single
# instance -- the same zero-instance proof the AwsAutoScalingGroup E2E
# uses. Full metadata is supplied for tagging/orphan cleanup.
#
# warm_pool_config is DELIBERATELY absent: a warm pool prepares real
# instances (they launch, then stop), so even a STOPPED pool bills EBS --
# that arm is proven by offline plan/preview against the canonical
# manifest, never by this live lane.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsEksNodeGroup
metadata:
  name: planton-oss-e2e-eksng-smoke
  id: planton-oss-e2e-eksng-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awseksnodegroup
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  clusterName:
    valueFrom:
      kind: AwsEksCluster
      name: planton-oss-e2e-eks-cluster-prereq
      fieldPath: status.outputs.name
  nodeRoleArn:
    valueFrom:
      kind: AwsIamRole
      name: planton-oss-e2e-eks-node-role
      fieldPath: status.outputs.role_arn
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-b
        fieldPath: status.outputs.subnet_id
  instanceTypes:
    - t3.medium
  amiType: AL2023_x86_64_STANDARD
  scaling:
    minSize: 0
    maxSize: 1
    desiredSize: 0
  labels:
    pool: e2e-smoke
