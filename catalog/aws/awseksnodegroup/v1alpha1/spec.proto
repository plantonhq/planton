syntax = "proto3";

package dev.planton.aws.awseksnodegroup.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// AwsEksNodeGroupSpec defines a MANAGED EKS node group: an EC2 fleet that
// AWS provisions, health-checks, and rolls for you, registered as workers
// of an AwsEksCluster.
//
// The node group composes onto its neighbors instead of embedding them:
// the cluster attaches by reference (status.outputs.name), the node IAM
// role is a referenced AwsIamRole that carries its own worker policies
// (AmazonEKSWorkerNodePolicy, AmazonEC2ContainerRegistryReadOnly,
// AmazonEKS_CNI_Policy), and launch mechanics can come from a referenced
// AwsLaunchTemplate -- custom AMI, IMDSv2 posture, encrypted volumes,
// extra tags -- rather than from the flat inline knobs.
//
// Two configuration styles, honestly separated:
// - INLINE: instance_types + disk_size_gb (+ optional remote_access).
//   Simple fleets; AWS builds the launch mechanics.
// - LAUNCH TEMPLATE: launch_template references an AwsLaunchTemplate.
//   AWS then forbids disk_size_gb, instance_types, and remote_access here
//   (they live in the template); those conflicts are enforced below.
//
// The node group name comes from metadata.name (AWS limit: 63 characters).
// Most instance-shaping fields are create-only in AWS (they replace the
// group); labels/taints/scaling/update/repair settings update in place, and
// version changes roll the group node by node.
message AwsEksNodeGroupSpec {
  // The AWS region the node group is created in. Must match the cluster's
  // region. Example: "us-west-2", "eu-west-1".
  string region = 1 [(buf.validate.field).string.min_len = 1];

  // The EKS cluster the nodes register with. Reference an AwsEksCluster's
  // name output or pass a literal cluster name for a cluster managed
  // outside Planton. Create-only in AWS.
  dev.planton.shared.foreignkey.v1.StringValueOrRef cluster_name = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsEksCluster,
    (dev.planton.shared.options.diagram_label) = "joins cluster",
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.name"
  ];

  // The IAM role every node assumes. It must trust ec2.amazonaws.com and
  // carry the worker policies (AmazonEKSWorkerNodePolicy,
  // AmazonEC2ContainerRegistryReadOnly, AmazonEKS_CNI_Policy) -- attach
  // them on the AwsIamRole itself; this component never modifies a role it
  // merely references. AmazonEC2ContainerRegistryReadOnly is what lets the
  // kubelet pull private images from ECR in this account with no pull
  // secret: ECR issues only twelve-hour tokens, so the node's own identity
  // (or IRSA on the pod) is the only way a cluster ever pulls from ECR.
  // Reference an AwsIamRole's role_arn output or pass a literal ARN.
  // Create-only in AWS.
  dev.planton.shared.foreignkey.v1.StringValueOrRef node_role_arn = 3 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsIamRole,
    (dev.planton.shared.options.diagram_label) = "assumes node role",
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.role_arn"
  ];

  // The subnets nodes launch into -- typically the cluster VPC's private
  // subnets. One subnet is a legitimate zonal topology (e.g. a stateful
  // pool pinned to its EBS volumes' zone); use two-plus zones for fleets
  // that should survive a zone impairment. Reference AwsSubnet subnet_id
  // outputs or pass literal subnet IDs. Create-only in AWS. A node group
  // is a member of its cluster and lives there on a diagram; the subnets
  // are where its nodes attach, so the reference is access, not
  // placement -- otherwise a group on subnets its cluster does not name
  // would be drawn outside the cluster it belongs to.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef subnet_ids = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).repeated.min_items = 1,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSubnet,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.options.diagram_label) = "spans subnets",
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.subnet_id"
  ];

  // Launch the nodes from an AwsLaunchTemplate instead of the inline
  // knobs: custom AMI + bootstrap user data, IMDSv2 enforcement, encrypted
  // or provisioned-IOPS volumes, extra ENI/tag configuration. When set,
  // AWS forbids disk_size_gb, instance_types, and remote_access on the
  // node group (enforced below); ami_type stays valid unless the template
  // pins a custom AMI.
  AwsEksNodeGroupLaunchTemplate launch_template = 5;

  // The EC2 instance types AWS may launch (e.g. ["m6i.large"]). Several
  // types is a Spot best practice (pool diversity); On-Demand groups use
  // the first type. Empty keeps the AWS default (t3.medium). Mutually
  // exclusive with launch_template. Create-only in AWS.
  repeated string instance_types = 6;

  // The EKS-optimized AMI family: "AL2023_x86_64_STANDARD" /
  // "AL2023_ARM_64_STANDARD" (current default generation),
  // "AL2023_x86_64_NVIDIA" / "AL2023_ARM_64_NVIDIA" /
  // "AL2023_x86_64_NEURON" (accelerated), the Bottlerocket families
  // (container-optimized, incl. FIPS/NVIDIA variants), the Windows Core/
  // Full families (2019/2022/2025), legacy AL2 ("AL2_x86_64",
  // "AL2_x86_64_GPU", "AL2_ARM_64"), or "CUSTOM" (launch template with
  // your own AMI). Empty lets AWS pick from the instance types. With a
  // launch template that pins a custom AMI, leave this empty. Create-only
  // in AWS.
  string ami_type = 7;

  // Purchase model for the fleet: on_demand (default), spot (interruptible
  // at steep discount -- pair with several instance_types), or
  // capacity_block (pre-purchased ML capacity reservations). Create-only
  // in AWS.
  AwsEksNodeGroupCapacityType capacity_type = 8 [(dev.planton.shared.options.recommended_default) = "on_demand"];

  // Root EBS volume size per node, in GiB. 0 keeps the AWS default (20
  // GiB Linux / 50 GiB Windows); 100 is a comfortable production default
  // for image-heavy workloads. Mutually exclusive with launch_template
  // (size the template's block device instead). Create-only in AWS.
  int32 disk_size_gb = 9 [(dev.planton.shared.options.recommended_default) = "100"];

  // Node counts the group scales between. desired_size is where the group
  // starts (and what AWS holds until an autoscaler moves it); min 0 with
  // desired 0 expresses an intentionally dormant pool.
  AwsEksNodeGroupScalingConfig scaling = 10 [(buf.validate.field).required = true];

  // SSH/security-group access to the nodes. Immutable in AWS -- changing
  // it replaces the group. Mutually exclusive with launch_template (put
  // key and security groups in the template instead).
  AwsEksNodeGroupRemoteAccess remote_access = 11;

  // Kubernetes labels applied to every node (visible to schedulers and
  // nodeSelectors). Updates in place.
  map<string, string> labels = 12 [(buf.validate.field).map = {
    keys: {
      string: {max_len: 63}
    }
    values: {
      string: {max_len: 63}
    }
  }];

  // Kubernetes taints applied to every node -- the reservation mechanism
  // that keeps ordinary pods off dedicated capacity (GPU pools, ingress
  // tiers) until a pod tolerates the taint. Updates in place.
  repeated AwsEksNodeGroupTaint taints = 13 [(buf.validate.field).repeated.max_items = 50];

  // How aggressively version updates roll nodes (surge/unavailability
  // budget). Unset keeps AWS defaults (1 node unavailable, DEFAULT
  // strategy).
  AwsEksNodeGroupUpdateConfig update_config = 14;

  // Automatic replacement/reboot of nodes the cluster reports unhealthy --
  // AWS's managed node auto-repair.
  AwsEksNodeGroupNodeRepairConfig node_repair_config = 15;

  // The Kubernetes version of the nodes, e.g. "1.31". Empty follows the
  // cluster's version at creation. Set it to pin nodes during a control-
  // plane upgrade, then bump to roll them; nodes may trail the control
  // plane by up to two minors during an upgrade window.
  string version = 16;

  // The exact EKS-optimized AMI release to run (e.g.
  // "1.31.3-20241109"), for byte-identical fleets and controlled AMI
  // rollouts. Empty keeps the latest release for `version`. Changing it
  // rolls the group.
  string release_version = 17;

  // Force a version update even if pods cannot be drained within their
  // disruption budgets (otherwise the update fails and rolls back). Only
  // consulted while version/release_version/launch_template change.
  bool force_update_version = 18;

  // A pool of pre-initialized instances that cuts scale-out latency from
  // minutes to seconds -- worth its cost exactly when boot time (AMI +
  // bootstrap + image pulls) dominates how fast new capacity serves
  // pods. Updates in place.
  AwsEksNodeGroupWarmPoolConfig warm_pool_config = 19;

  // ---------------------------------------------------------------------------
  // Spec-level CEL validations
  // ---------------------------------------------------------------------------

  // AWS rejects these inline knobs when a launch template is used -- the
  // template owns them ("...or the node group deployment will fail").
  option (buf.validate.message).cel = {
    id: "launch_template_excludes_instance_types"
    message: "instance_types cannot be set with launch_template; define instance type(s) in the launch template"
    expression: "!has(this.launch_template) || size(this.instance_types) == 0"
  };

  option (buf.validate.message).cel = {
    id: "launch_template_excludes_disk_size"
    message: "disk_size_gb cannot be set with launch_template; size the template's block device instead"
    expression: "!has(this.launch_template) || this.disk_size_gb == 0"
  };

  option (buf.validate.message).cel = {
    id: "launch_template_excludes_remote_access"
    message: "remote_access cannot be set with launch_template; configure key and security groups in the template"
    expression: "!has(this.launch_template) || !has(this.remote_access)"
  };

  option (buf.validate.message).cel = {
    id: "version_format"
    message: "version must be a Kubernetes minor version of 1.24 or later, e.g. '1.31'"
    expression: "this.version == '' || this.version.matches('^1\\\\.(2[4-9]|[3-9][0-9])$')"
  };

  option (buf.validate.message).cel = {
    id: "ami_type_valid"
    message: "ami_type must be a supported EKS AMI family (AL2023_*, BOTTLEROCKET_*, WINDOWS_*, AL2_*, or CUSTOM)"
    expression: "this.ami_type == '' || this.ami_type in ['AL2023_x86_64_STANDARD', 'AL2023_ARM_64_STANDARD', 'AL2023_x86_64_NEURON', 'AL2023_x86_64_NVIDIA', 'AL2023_ARM_64_NVIDIA', 'BOTTLEROCKET_ARM_64', 'BOTTLEROCKET_x86_64', 'BOTTLEROCKET_ARM_64_FIPS', 'BOTTLEROCKET_x86_64_FIPS', 'BOTTLEROCKET_ARM_64_NVIDIA', 'BOTTLEROCKET_x86_64_NVIDIA', 'BOTTLEROCKET_ARM_64_NVIDIA_FIPS', 'BOTTLEROCKET_x86_64_NVIDIA_FIPS', 'WINDOWS_CORE_2019_x86_64', 'WINDOWS_FULL_2019_x86_64', 'WINDOWS_CORE_2022_x86_64', 'WINDOWS_FULL_2022_x86_64', 'WINDOWS_CORE_2025_x86_64', 'WINDOWS_FULL_2025_x86_64', 'AL2_x86_64', 'AL2_x86_64_GPU', 'AL2_ARM_64', 'CUSTOM']"
  };
}

// AwsEksNodeGroupLaunchTemplate points the node group at an
// AwsLaunchTemplate for its launch mechanics.
message AwsEksNodeGroupLaunchTemplate {
  // The launch template. Reference an AwsLaunchTemplate's
  // launch_template_id output or pass a literal template ID ("lt-...").
  dev.planton.shared.foreignkey.v1.StringValueOrRef launch_template_id = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsLaunchTemplate,
    (dev.planton.shared.options.diagram_label) = "launched from template",
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.launch_template_id"
  ];

  // Which template version the nodes launch from: a numeric version for a
  // hard pin, "$Default", or "$Latest". Empty keeps the template's default
  // version. Changing it rolls the group onto the new version -- the
  // template-driven fleet-rollout mechanism.
  string version = 2;
}

// AwsEksNodeGroupCapacityType is the purchase model for the node group's
// EC2 capacity.
enum AwsEksNodeGroupCapacityType {
  // Standard On-Demand instances (default).
  on_demand = 0;
  // Spot instances -- interruptible spare capacity at a steep discount.
  spot = 1;
  // Pre-purchased EC2 Capacity Blocks for ML workloads.
  capacity_block = 2;
}

// AwsEksNodeGroupScalingConfig bounds the node count and sets the target.
message AwsEksNodeGroupScalingConfig {
  // The floor the group never shrinks below. 0 is valid -- a pool that
  // scales to zero when idle.
  int32 min_size = 1 [(buf.validate.field).int32.gte = 0];

  // The ceiling the group never grows above. At least 1.
  int32 max_size = 2 [(buf.validate.field).int32.gte = 1];

  // The node count AWS creates and maintains (until a cluster autoscaler
  // adjusts it). Must sit within [min_size, max_size].
  int32 desired_size = 3 [(buf.validate.field).int32.gte = 0];

  option (buf.validate.message).cel = {
    id: "max_gte_min"
    message: "max_size must be greater than or equal to min_size"
    expression: "this.max_size >= this.min_size"
  };

  option (buf.validate.message).cel = {
    id: "desired_within_bounds"
    message: "desired_size must be between min_size and max_size"
    expression: "this.desired_size >= this.min_size && this.desired_size <= this.max_size"
  };
}

// AwsEksNodeGroupRemoteAccess opens SSH access to the nodes. Immutable in
// AWS: any change here replaces the node group.
message AwsEksNodeGroupRemoteAccess {
  // The name of an existing EC2 key pair enabling SSH to the nodes.
  string ec2_ssh_key = 1 [(buf.validate.field).string.max_len = 255];

  // Security groups allowed to reach the nodes over SSH. Empty with an
  // ec2_ssh_key set means AWS opens port 22 to 0.0.0.0/0 -- always scope
  // this when enabling SSH. Reference AwsSecurityGroup security_group_id
  // outputs or pass literal IDs.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef source_security_group_ids = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSecurityGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.security_group_id"
  ];
}

// AwsEksNodeGroupTaint is one Kubernetes taint applied to every node in
// the group.
message AwsEksNodeGroupTaint {
  // Taint key (e.g. "dedicated"). Required.
  string key = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 63
  ];

  // Taint value (e.g. "gpu"). Optional -- key-only taints are valid.
  string value = 2 [(buf.validate.field).string.max_len = 63];

  // The scheduling effect: "NO_SCHEDULE" (new pods need a toleration),
  // "PREFER_NO_SCHEDULE" (soft), or "NO_EXECUTE" (also evicts running
  // pods without a toleration). Required.
  string effect = 3 [(buf.validate.field).required = true];

  option (buf.validate.message).cel = {
    id: "effect_valid"
    message: "effect must be 'NO_SCHEDULE', 'NO_EXECUTE', or 'PREFER_NO_SCHEDULE'"
    expression: "this.effect in ['NO_SCHEDULE', 'NO_EXECUTE', 'PREFER_NO_SCHEDULE']"
  };
}

// AwsEksNodeGroupUpdateConfig tunes how version updates roll the fleet.
message AwsEksNodeGroupUpdateConfig {
  // Maximum number of nodes updated (unavailable) at once, 1-100.
  // Exactly one of max_unavailable or max_unavailable_percentage must be
  // set.
  int32 max_unavailable = 1;

  // Maximum percentage of nodes updated at once, 1-100. Exactly one of
  // max_unavailable or max_unavailable_percentage must be set.
  int32 max_unavailable_percentage = 2;

  // The rollout strategy: "DEFAULT" (respect the unavailability budget
  // only) or "MINIMAL" (additionally launch replacements before
  // terminating -- the surge, capacity-safe rollout). Empty keeps the AWS
  // default (DEFAULT).
  string update_strategy = 3;

  option (buf.validate.message).cel = {
    id: "exactly_one_unavailability_form"
    message: "set exactly one of max_unavailable or max_unavailable_percentage"
    expression: "(this.max_unavailable > 0) != (this.max_unavailable_percentage > 0)"
  };

  option (buf.validate.message).cel = {
    id: "max_unavailable_range"
    message: "max_unavailable must be between 1 and 100 when set"
    expression: "this.max_unavailable == 0 || (this.max_unavailable >= 1 && this.max_unavailable <= 100)"
  };

  option (buf.validate.message).cel = {
    id: "max_unavailable_percentage_range"
    message: "max_unavailable_percentage must be between 1 and 100 when set"
    expression: "this.max_unavailable_percentage == 0 || (this.max_unavailable_percentage >= 1 && this.max_unavailable_percentage <= 100)"
  };

  option (buf.validate.message).cel = {
    id: "update_strategy_valid"
    message: "update_strategy must be 'DEFAULT' or 'MINIMAL' when set"
    expression: "this.update_strategy == '' || this.update_strategy in ['DEFAULT', 'MINIMAL']"
  };
}

// AwsEksNodeGroupNodeRepairConfig enables managed node auto-repair: EKS
// replaces or reboots nodes the cluster reports unhealthy, within the
// parallelism and threshold bounds below.
message AwsEksNodeGroupNodeRepairConfig {
  // Turn node auto-repair on.
  bool enabled = 1;

  // Maximum number of nodes repaired in parallel. Mutually exclusive with
  // max_parallel_nodes_repaired_percentage. 0 keeps the AWS default.
  int32 max_parallel_nodes_repaired_count = 2 [(buf.validate.field).int32.gte = 0];

  // Maximum percentage of nodes repaired in parallel, 1-100. Mutually
  // exclusive with max_parallel_nodes_repaired_count.
  int32 max_parallel_nodes_repaired_percentage = 3;

  // Repair pauses when more than this many nodes are unhealthy (a signal
  // the problem is systemic, not per-node). Mutually exclusive with
  // max_unhealthy_node_threshold_percentage. 0 keeps the AWS default.
  int32 max_unhealthy_node_threshold_count = 4 [(buf.validate.field).int32.gte = 0];

  // Percentage form of the unhealthy-node pause threshold, 1-100.
  // Mutually exclusive with max_unhealthy_node_threshold_count.
  int32 max_unhealthy_node_threshold_percentage = 5;

  // Per-condition overrides of the repair action and wait time.
  repeated AwsEksNodeGroupNodeRepairOverride overrides = 6;

  option (buf.validate.message).cel = {
    id: "parallel_count_xor_percentage"
    message: "max_parallel_nodes_repaired_count and max_parallel_nodes_repaired_percentage are mutually exclusive"
    expression: "this.max_parallel_nodes_repaired_count == 0 || this.max_parallel_nodes_repaired_percentage == 0"
  };

  option (buf.validate.message).cel = {
    id: "threshold_count_xor_percentage"
    message: "max_unhealthy_node_threshold_count and max_unhealthy_node_threshold_percentage are mutually exclusive"
    expression: "this.max_unhealthy_node_threshold_count == 0 || this.max_unhealthy_node_threshold_percentage == 0"
  };

  option (buf.validate.message).cel = {
    id: "parallel_percentage_range"
    message: "max_parallel_nodes_repaired_percentage must be between 1 and 100 when set"
    expression: "this.max_parallel_nodes_repaired_percentage == 0 || (this.max_parallel_nodes_repaired_percentage >= 1 && this.max_parallel_nodes_repaired_percentage <= 100)"
  };

  option (buf.validate.message).cel = {
    id: "threshold_percentage_range"
    message: "max_unhealthy_node_threshold_percentage must be between 1 and 100 when set"
    expression: "this.max_unhealthy_node_threshold_percentage == 0 || (this.max_unhealthy_node_threshold_percentage >= 1 && this.max_unhealthy_node_threshold_percentage <= 100)"
  };
}

// AwsEksNodeGroupWarmPoolConfig keeps pre-initialized nodes ready so
// scale-out serves pods in seconds instead of minutes (the managed
// node group's own warm pool -- EKS provisions and recycles the pooled
// instances). Pooled instances in the Stopped state cost only their EBS
// storage; Running pools trade full instance cost for instant capacity.
message AwsEksNodeGroupWarmPoolConfig {
  // The state pooled instances wait in: "STOPPED" (AWS default --
  // near-zero compute cost, seconds to start), "RUNNING" (instant but
  // full price), or "HIBERNATED" (RAM restored from disk -- fast
  // JVM/cache warmup without running cost). Empty keeps the AWS default.
  string pool_state = 1;

  // Minimum number of instances always kept in the pool.
  int32 min_size = 2 [(buf.validate.field).int32.gte = 0];

  // Ceiling on pool size. Unset keeps the AWS default: the gap between
  // the group's max_size and its desired capacity (AWS represents that
  // default internally as -1 -- it never appears here). Explicit 0 is
  // meaningful (no prepared capacity beyond min_size), which is why this
  // field is optional.
  optional int32 max_group_prepared_capacity = 3 [(buf.validate.field).int32.gte = 0];

  // Return scaled-in instances to the pool instead of terminating them
  // -- reuse the warm boot instead of paying for it again.
  bool reuse_on_scale_in = 4;

  option (buf.validate.message).cel = {
    id: "pool_state_valid"
    message: "pool_state must be 'STOPPED', 'RUNNING', or 'HIBERNATED' when set"
    expression: "this.pool_state == '' || this.pool_state in ['STOPPED', 'RUNNING', 'HIBERNATED']"
  };
}

// AwsEksNodeGroupNodeRepairOverride customizes the repair action for one
// node-monitoring condition.
message AwsEksNodeGroupNodeRepairOverride {
  // Minutes to wait after the condition is observed before repairing.
  // Required, at least 1.
  int32 min_repair_wait_time_mins = 1 [(buf.validate.field).int32.gte = 1];

  // The node monitoring condition this override applies to (e.g.
  // "AcceleratedHardwareReady"). Required.
  string node_monitoring_condition = 2 [(buf.validate.field).required = true];

  // The unhealthy reason this override applies to. Required.
  string node_unhealthy_reason = 3 [(buf.validate.field).required = true];

  // What to do: "Replace", "Reboot", or "NoAction". Required.
  string repair_action = 4 [(buf.validate.field).required = true];

  option (buf.validate.message).cel = {
    id: "repair_action_valid"
    message: "repair_action must be 'Replace', 'Reboot', or 'NoAction'"
    expression: "this.repair_action in ['Replace', 'Reboot', 'NoAction']"
  };
}
