syntax = "proto3";

package dev.planton.aws.awseksnodegroup.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awseksnodegroup/v1alpha1/outputs.proto";
import "catalog/aws/awseksnodegroup/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsEksNodeGroup represents a managed EKS node group: an EC2 worker fleet
// that AWS provisions, health-checks, and rolls, registered to an
// AwsEksCluster.
message AwsEksNodeGroup {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this managed node group resource.
  string kind = 2 [(buf.validate.field).string.const = "AwsEksNodeGroup"];

  // metadata captures identifying information (name, org, version, etc.)
  // and must pass standard validations for resource naming.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the core configuration data defining how the node group is provisioned.
  AwsEksNodeGroupSpec spec = 4 [(buf.validate.field).required = true];

  // status holds runtime or post-deployment information.
  AwsEksNodeGroupStatus status = 5;
}

// AwsEksNodeGroupStatus describes the status fields for a managed node group resource.
message AwsEksNodeGroupStatus {
  // outputs captures the outputs returned by Pulumi/Terraform after provisioning.
  AwsEksNodeGroupOutputs outputs = 1;
}
