syntax = "proto3";

package dev.planton.aws.awsvpcendpoint.v1alpha1;

// AwsVpcEndpointOutputs describes the values returned after
// provisioning a VPC endpoint.
message AwsVpcEndpointOutputs {
  // vpc_endpoint_id is the endpoint's id (e.g. "vpce-0abc..."), the
  // handle every AWS API and route inspection uses.
  string vpc_endpoint_id = 1;

  // arn is the endpoint's Amazon Resource Name --
  // arn:aws:ec2:<region>:<account>:vpc-endpoint/<vpce-id>.
  string arn = 2;

  // state is the endpoint's lifecycle state after provisioning --
  // "available" on a successful create ("pendingAcceptance" when the
  // PrivateLink service requires manual acceptance).
  string state = 3;

  // prefix_list_id is the service's prefix list (e.g. "pl-68a54001" for
  // S3) -- gateway endpoints only. Reference it in security-group or
  // route rules that must scope traffic to the service's address
  // ranges. Empty for ENI-based endpoint types.
  string prefix_list_id = 4;

  // dns_name is the endpoint's primary private DNS name -- the
  // regional endpoint-specific name clients use when private DNS is
  // off, and the name Route53 aliases target. Interface endpoints only;
  // empty for gateway endpoints (which have no DNS presence).
  string dns_name = 5;

  // hosted_zone_id is the Route53 hosted zone of dns_name, needed
  // alongside it when creating a Route53 alias record to the endpoint.
  // Interface endpoints only.
  string hosted_zone_id = 6;

  // network_interface_ids are the endpoint's ENIs, one per attached
  // subnet -- the objects flow logs, firewall rules, and IP lookups
  // operate on. Empty for gateway endpoints.
  repeated string network_interface_ids = 7;
}
