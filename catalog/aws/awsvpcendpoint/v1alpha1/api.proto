syntax = "proto3";

package dev.planton.aws.awsvpcendpoint.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsvpcendpoint/v1alpha1/outputs.proto";
import "catalog/aws/awsvpcendpoint/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsVpcEndpoint represents a VPC endpoint: a private connection from a
// VPC to an AWS service, a PrivateLink service, or a VPC Lattice
// resource, keeping traffic on the AWS network instead of the internet.
message AwsVpcEndpoint {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this VPC endpoint resource.
  string kind = 2 [(buf.validate.field).string.const = "AwsVpcEndpoint"];

  // metadata captures identifying information (name, org, version, etc.)
  // and must pass standard validations for resource naming.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the core configuration data defining how the endpoint is provisioned.
  AwsVpcEndpointSpec spec = 4 [(buf.validate.field).required = true];

  // status holds runtime or post-deployment information.
  AwsVpcEndpointStatus status = 5;
}

// AwsVpcEndpointStatus describes the status fields for a VPC endpoint resource.
message AwsVpcEndpointStatus {
  // outputs captures the outputs returned by Pulumi/Terraform after provisioning.
  AwsVpcEndpointOutputs outputs = 1;
}
