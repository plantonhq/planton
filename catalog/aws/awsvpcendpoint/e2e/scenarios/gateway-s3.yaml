# Gateway S3 endpoint scenario: the free, route-table-based endpoint type.
# Route-table attachment proves the composed resolution path for gateway
# endpoints: the AwsVpc prerequisite's default_route_table_id output. The
# shared AwsSubnet fixture deliberately carries no inline routes (its
# route_table_id output is empty -- it rides the VPC main table), so the VPC's
# own route-table output is the honest anchor here. The endpoint policy arm
# (structured IAM document, serialized by both engines) rides this free lane:
# a read-only S3 policy proving the Struct render path end to end -- the
# evidence bar is DescribeVpcEndpoints echoing the policy document. Full
# metadata is supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsVpcEndpoint
metadata:
  name: planton-oss-e2e-vpce-gw-s3
  id: planton-oss-e2e-vpce-gw-s3
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsvpcendpoint
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: planton-oss-e2e-awsvpc-prereq
      fieldPath: status.outputs.vpc_id
  endpointType: Gateway
  serviceName: com.amazonaws.us-west-2.s3
  routeTableIds:
    - valueFrom:
        kind: AwsVpc
        name: planton-oss-e2e-awsvpc-prereq
        fieldPath: status.outputs.default_route_table_id
  policy:
    Version: "2012-10-17"
    Statement:
      - Sid: ReadOnlyThroughEndpoint
        Effect: Allow
        Principal: "*"
        Action:
          - s3:GetObject
          - s3:ListBucket
        Resource: "*"
