syntax = "proto3";

package dev.planton.aws.awssagemakerdomain.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awssagemakerdomain/v1alpha1/outputs.proto";
import "catalog/aws/awssagemakerdomain/v1alpha1/spec.proto";
import "shared/metadata.proto";

// aws-sagemaker-domain
message AwsSagemakerDomain {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsSagemakerDomain'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsSagemakerDomainSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsSagemakerDomainStatus status = 5;
}

// aws-sagemaker-domain status
message AwsSagemakerDomainStatus {
  //outputs
  AwsSagemakerDomainOutputs outputs = 1;
}
