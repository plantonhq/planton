syntax = "proto3";

package dev.planton.aws.awsorganizationpolicy.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsorganizationpolicy/v1alpha1/outputs.proto";
import "catalog/aws/awsorganizationpolicy/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsOrganizationPolicy {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsOrganizationPolicy'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsOrganizationPolicySpec spec = 4 [(buf.validate.field).required = true];
  AwsOrganizationPolicyStatus status = 5;
}

message AwsOrganizationPolicyStatus {
  AwsOrganizationPolicyOutputs outputs = 1;
}
