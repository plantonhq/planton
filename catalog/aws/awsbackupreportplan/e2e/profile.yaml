apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsbackupreportplan
spec:
  # A Backup Audit Manager report plan under live E2E: a
  # BACKUP_JOB_REPORT (framework-free by design) into the
  # consumer-scoped bucket fixture, both formats. Reports run on AWS's
  # daily cadence -- none fires in a lane window (~$0).
  #
  # Deliberately not exercised live:
  #   - the compliance templates (CONTROL/RESOURCE_COMPLIANCE_REPORT)
  #     -- they need a deployed framework; the job template proves the
  #     resource surface. Unblock: chain the awsbackupframework
  #     fixture when the proof lane wants the arm.
  #   - an actual delivered report file -- AWS's daily cadence, hours
  #     away. Unblock: `aws backup start-report-job` as a post-deploy
  #     probe if the proof lane wants delivery evidence.
  #   - report_template replacement (ForceNew inside the block) --
  #     mutation vocabulary. Unblock: the proof lane's mutation phase.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
