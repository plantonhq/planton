syntax = "proto3";

package dev.planton.aws.awscognitoidentityprovider.v1alpha1;

import "catalog/aws/awscognitoidentityprovider/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsCognitoIdentityProviderIacInput provides the inputs required by
// Pulumi/Terraform modules to provision a Cognito Identity Provider.
message AwsCognitoIdentityProviderIacInput {
  // target is the fully-specified AwsCognitoIdentityProvider resource to provision.
  AwsCognitoIdentityProvider target = 1;

  // provider_config supplies AWS credentials and region for the deployment.
  // When nil the module falls back to ambient credentials (environment variables
  // or instance profile).
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
