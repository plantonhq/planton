syntax = "proto3";

package dev.planton.aws.awscognitoidentityprovider.v1alpha1;

// AwsCognitoIdentityProviderOutputs captures observable identifiers from
// a provisioned Cognito Identity Provider.
//
// The primary output is `provider_name`, which downstream User Pool Clients
// reference in their `supported_identity_providers` list to enable federated
// sign-in. Unlike most AWS resources, identity providers do not produce an
// ARN — the provider_name is the sole identifier used for integration.
message AwsCognitoIdentityProviderOutputs {
  // The name of the identity provider as registered in the User Pool.
  // This is the value that must appear in a User Pool Client's
  // `supported_identity_providers` list to enable federated sign-in
  // through this provider.
  string provider_name = 1;

  // The type of the identity provider (e.g., "Google", "OIDC", "SAML").
  // Informational — useful for downstream tooling and display.
  string provider_type = 2;

  // The user pool this identity provider is attached to, resolved from the
  // spec reference. Providers are keyed by (pool id, provider name) in AWS,
  // and a consumer holding only this resource gets both halves of that key
  // from its outputs.
  string user_pool_id = 3;
}
