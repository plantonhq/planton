apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awscognitoidentityprovider
spec:
  # An identity provider under live E2E: the registry-declared
  # AwsCognitoUserPool prerequisite deploys first (seconds), then the Google
  # provider proves create (AWS accepts placeholder credentials -- it never
  # calls Google at create time), verify (DescribeIdentityProvider on the
  # composite pool-id/provider-name identity), destroy, and verify-destroyed
  # on both provisioners. The OIDC arm is excluded from the live lane (AWS
  # performs live discovery against oidc_issuer at create, which needs a real
  # issuer); its wiring is proven by the offline gate and the SAML/OIDC CEL
  # spec tests.
  #
  # Proven live 2026-08-12, both engines. The Google lane's provider_name
  # also exercises the new social-name CEL, and the Pulumi ignoreChanges
  # map-key option ran its first live pass cleanly — which proves the option
  # does not break the engine, NOT the SAML drift guard itself (the Google
  # lane never populates ActiveEncryptionCertificate; the guard stays
  # offline-observed until a SAML lane exists).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
