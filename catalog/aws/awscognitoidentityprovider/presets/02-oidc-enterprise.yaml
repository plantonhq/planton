apiVersion: aws.planton.dev/v1alpha1
kind: AwsCognitoIdentityProvider
metadata:
  name: ${name}
  org: '${org}'
  env: ${env}
  id: ${id}
  annotations:
    planton.dev/provisioner: pulumi
    pulumi.planton.dev/stack.name: ${env}.AwsCognitoIdentityProvider.${name}
spec:
  region: <aws-region>
  userPoolId:
    valueFrom:
      kind: AwsCognitoUserPool
      name: <user-pool-name>
      fieldPath: status.outputs.user_pool_id
  providerName: CorpSSO
  providerType: OIDC
  oidc:
    clientId: <oidc-client-id>
    # The client secret is sensitive: reference a managed secret
    # ($secret/<slug>) -- never a plaintext value.
    clientSecret: $secret/oidc-client-secret
    oidcIssuer: https://sso.example.com
    authorizeScopes: "openid email profile"
  attributeMapping:
    email: email
    username: sub
    given_name: given_name
    family_name: family_name
