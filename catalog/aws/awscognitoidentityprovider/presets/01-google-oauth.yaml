apiVersion: aws.planton.dev/v1alpha1
kind: AwsCognitoIdentityProvider
metadata:
  name: ${name}
  org: '${org}'
  env: ${env}
  id: ${id}
  annotations:
    planton.dev/provisioner: pulumi
    pulumi.planton.dev/stack.name: ${env}.AwsCognitoIdentityProvider.${name}
spec:
  region: <aws-region>
  userPoolId:
    valueFrom:
      kind: AwsCognitoUserPool
      name: <user-pool-name>
      fieldPath: status.outputs.user_pool_id
  providerName: Google
  providerType: Google
  google:
    clientId: <google-oauth-client-id>
    # The client secret is sensitive: reference a managed secret
    # ($secret/<slug>) -- never a plaintext value.
    clientSecret: $secret/google-oauth-client-secret
    authorizeScopes: "email profile openid"
  attributeMapping:
    email: email
    username: sub
