# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsrestapidomain
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The domain stores no data of its own. An ACM-referenced certificate's private key rests encrypted in ACM (the AwsCertManagerCert component's posture); material supplied through uploaded_certificate is held by the managed API Gateway service, and the spec marks its private_key sensitive so it never echoes back.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest exists at this level (see enc-at-rest), so no key choice arises here.
    - control_id: enc-in-transit
      status: configurable
      field_path: security_policy
      evidence:
        type: spec_default
        reference: The domain IS the TLS termination point for every request through it, and security_policy sets its minimum TLS version and cipher family -- from the legacy TLS_1_0 policy through TLS_1_2 and the newer TLS 1.3 policy families. Omitted, AWS applies its default policy for the endpoint type; pinning a modern policy is this component's own transport-encryption decision.
      notes: The optional mutual_tls block upgrades termination to mutually-authenticated TLS anchored in an S3 truststore. TLS always terminates here regardless of policy choice -- the lever selects how strong the floor is, not whether encryption happens.
    - control_id: no-public-access
      status: configurable
      field_path: endpoint_configuration
      evidence:
        type: spec_default
        reference: Omitted defaults to a REGIONAL endpoint, publicly reachable like EDGE. Setting endpoint_configuration.type to PRIVATE makes the domain reachable only through interface VPC endpoints inside chosen VPCs -- the custom hostname stops existing on the public internet.
      notes: PRIVATE domains pair with access_associations (which VPC endpoints may reach the domain) and policy (which principals may invoke through it). This is the REST-only capability the v2 HTTP API domain surface lacks.
    - control_id: restricted-ingress
      status: configurable
      field_path: access_associations
      evidence:
        type: spec_default
        reference: For a PRIVATE domain, only VPC endpoints granted an access association may reach the hostname at all -- an empty list means no source is admitted. Each entry names a vpc_endpoint_id, making the admitted network sources an explicit, declarative list.
      notes: Applies to PRIVATE domains; on REGIONAL and EDGE domains there is no network-source filter at the domain itself -- IP restrictions live in the APIs' resource policies or a WAF web ACL on their stages. Associations are add/remove only (no in-place update), matching the modules' replace semantics.
    - control_id: edge-protection
      status: not_applicable
      notes: AWS WAF attaches to REST API stages, not to custom domains -- and the CloudFront distribution behind an EDGE domain is AWS-managed, with no customer web ACL surface. The lever lives on the AwsRestApiGateway kind's stages.
    - control_id: rbac
      status: configurable
      field_path: policy
      evidence:
        type: spec_default
        reference: Unset, the domain adds no principal gate of its own and caller authorization is entirely the mapped APIs' concern. Set, the IAM resource policy on a PRIVATE domain governs which principals, source VPCs, and VPC endpoints may invoke through the hostname -- principal-based access control enforced before any API-level authorizer runs.
      notes: Requesters' identities still map to API-level permissions via each API's authorizers and resource policies; this policy is the domain-level outer gate.
    - control_id: workload-identity
      status: not_applicable
      notes: The domain runs no workloads and holds no cloud credentials -- it references or stores certificate material and serves with it.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The domain authenticates callers only via optional mutual TLS; there is no legacy authentication path here to disable. The legacy-protocol concern on this surface is the TLS_1_0 security policy, covered as the enc-in-transit lever.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: The domain emits no logs of its own; execution and access logging are stage-level settings on the mapped API components. Control-plane changes to the domain, mappings, and associations land in CloudTrail as account-level posture.
    - control_id: monitoring-integration
      status: not_applicable
      notes: API Gateway publishes metrics per API and stage; a custom domain has no metric dimension of its own -- its traffic appears under the mapped APIs' metrics.
    - control_id: backup-recovery
      status: not_applicable
      notes: The domain and its mappings are declarative configuration re-creatable from the manifest. The one operator-held input is uploaded certificate material -- retained outside AWS by whoever issued it, as with any bring-your-own certificate.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist at this level to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Availability is the API Gateway service's own managed posture -- regional endpoint fleet for REGIONAL/PRIVATE, the global CloudFront network for EDGE. The domain has no zonal configuration to choose.
    - control_id: deletion-protection
      status: not_applicable
      notes: No deletion-protection flag exists for custom domains. Deleting one removes the hostname binding and its mappings; the mapped APIs keep serving on their default execute-api endpoints (if enabled).
    - control_id: managed-patching
      status: not_applicable
      notes: Fully managed service surface with no customer-visible software to patch.
