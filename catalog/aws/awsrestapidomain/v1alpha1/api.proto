syntax = "proto3";

package dev.planton.aws.awsrestapidomain.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsrestapidomain/v1alpha1/outputs.proto";
import "catalog/aws/awsrestapidomain/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsRestApiDomain {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsRestApiDomain'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsRestApiDomainSpec spec = 4 [(buf.validate.field).required = true];
  AwsRestApiDomainStatus status = 5;
}

message AwsRestApiDomainStatus {
  AwsRestApiDomainOutputs outputs = 1;
}
