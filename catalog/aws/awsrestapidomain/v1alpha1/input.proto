syntax = "proto3";

package dev.planton.aws.awsrestapidomain.v1alpha1;

import "catalog/aws/awsrestapidomain/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsRestApiDomainIacInput is the input for the IaC modules that
// deploy the custom domain.
message AwsRestApiDomainIacInput {
  // target is the AwsRestApiDomain resource to deploy.
  AwsRestApiDomain target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
