apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsecscluster
spec:
  # An ECS cluster under live E2E, two scenarios per engine. The Fargate
  # scenario is a true leaf (no prerequisites): enhanced Container
  # Insights, an exec-audit configuration, and the built-in provider
  # association, running in ~2-3 minutes at zero cost (a cluster bills
  # nothing until tasks run). The EC2-capacity scenario composes the
  # VPC -> subnets -> launch template -> zero-capacity auto-scaling
  # group chain (declared by its e2e-prerequisites annotation -- the
  # kind itself honestly requires nothing) and proves the folded
  # capacity provider materializes as its own resource plus the
  # single association PUT, with no instance ever launched.
  # The managed-instances scenario proves the ECS Managed Instances
  # capacity provider live: ECS launches nothing at zero demand, the
  # infrastructure-role and instance-profile fixtures resolve by
  # reference, and the verifier asserts the provider itself is ACTIVE
  # via DescribeCapacityProviders, not just the cluster.
  # Deliberately not in the live scenarios: Fargate managed-storage
  # KMS (needs a key-policy-prepared KMS fixture) and Service Connect
  # defaults (needs a Cloud Map namespace) -- both proven by CEL spec
  # tests and the offline gate. Within managed instances, the SPOT/
  # RESERVED purchase models and capacity-reservation targeting stay
  # offline-proven (reservations bill while held).
  #
  # pending_proof: the spec surface deepened (the managed-instances
  # capacity provider family) after the prior green run, so that proof no
  # longer covers the current surface. Offline plans and previews passed
  # on both engines, including the managed-instances arm; the live lanes
  # re-earn the badge.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 25
