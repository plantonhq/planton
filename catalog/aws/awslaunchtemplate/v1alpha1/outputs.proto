syntax = "proto3";

package dev.planton.aws.awslaunchtemplate.v1alpha1;

// AwsLaunchTemplateOutputs captures the observable outputs of a
// provisioned launch template, for auto-scaling groups, EKS node groups,
// and Batch compute environments to reference.
message AwsLaunchTemplateOutputs {
  // The launch template ID (e.g. "lt-0123456789abcdef0"). The primary
  // handle other resources reference via
  // status.outputs.launch_template_id -- auto-scaling groups, EKS managed
  // node groups, and Batch compute environments all take this value.
  string launch_template_id = 1;

  // The ARN of the launch template, for IAM policies that scope
  // ec2:RunInstances to approved templates.
  string launch_template_arn = 2;

  // The latest version number of the template. Every spec change creates a
  // new immutable version; this tracks the newest one.
  int64 latest_version = 3;

  // The default version number -- what consumers referencing "$Default"
  // launch from. The modules promote each new version to default, so this
  // normally equals latest_version.
  int64 default_version = 4;
}
