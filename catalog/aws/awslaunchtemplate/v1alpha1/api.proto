syntax = "proto3";

package dev.planton.aws.awslaunchtemplate.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awslaunchtemplate/v1alpha1/outputs.proto";
import "catalog/aws/awslaunchtemplate/v1alpha1/spec.proto";
import "shared/metadata.proto";

//aws-launch-template
message AwsLaunchTemplate {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsLaunchTemplate'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsLaunchTemplateSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsLaunchTemplateStatus status = 5;
}

//aws-launch-template status
message AwsLaunchTemplateStatus {
  //outputs
  AwsLaunchTemplateOutputs outputs = 1;
}
