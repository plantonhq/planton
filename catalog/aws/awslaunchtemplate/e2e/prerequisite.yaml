# AwsLaunchTemplate install profile used as a prerequisite by composed
# kinds (an auto-scaling group's launch_template reference). The
# template is a leaf -- no VPC-dependent fields -- so the harness deploys it
# directly and captures launch_template_id for the dependent's references.
#
# The AMI is a pinned Amazon Linux 2023 image for us-west-2 (resolved from
# the public SSM parameter al2023-ami-kernel-default-x86_64). AWS validates
# that an ASG's launch template is "fully formed" (image present) at group
# creation even with zero desired capacity, so the template must carry an
# AMI -- but the E2E never launches an instance, so a deregistered AMI only
# ever requires bumping this pin, never a code change.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsLaunchTemplate
metadata:
  name: planton-oss-e2e-lt-prereq
  id: planton-oss-e2e-lt-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awslaunchtemplate
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  imageId: ami-0b0b27dd5c039480f
  instanceType: t3.micro
