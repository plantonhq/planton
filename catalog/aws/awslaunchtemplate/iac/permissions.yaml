# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awslaunchtemplate
spec:
  aws:
    statements:
      - sid: ManageLaunchTemplate
        actions:
          - ec2:CreateLaunchTemplate
          - ec2:CreateLaunchTemplateVersion
          - ec2:ModifyLaunchTemplate
          - ec2:DeleteLaunchTemplate
          - ec2:CreateTags
          - ec2:DeleteTags
        resources:
          - arn:aws:ec2:*:*:launch-template/*
        provenance: derived
        notes: Covers aws_launch_template with update_default_version = true -- creation of the template and its first version; every spec change producing a new immutable version (CreateLaunchTemplateVersion) which ModifyLaunchTemplate promotes to $Default; tagging of the template resource; and deletion. All five template actions authorize on the launch-template ARN format in the EC2 service reference, so one resource pattern covers the full lifecycle. CreateTags/DeleteTags are scoped to the same format (EC2 tag actions authorize on the tagged resource's ARN).
      - sid: DescribeLaunchTemplates
        actions:
          - ec2:DescribeLaunchTemplates
          - ec2:DescribeLaunchTemplateVersions
          - ec2:DescribeTags
        resources:
          - "*"
        provenance: derived
        notes: Read-side of aws_launch_template during plan/refresh (the provider reads the template, its default version's full data, and tags). EC2 Describe APIs support no resource-level scoping (empty Resources lists in the service reference), so the wildcard is the narrowest possible scope.
