apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awseventbridgeapidestination
spec:
  # Both arms in one instance: api-key connection + destination with a
  # static invocation header and rate limit, against a never-invoked
  # reserved-domain endpoint. The connection's auth state machine
  # (CREATING/AUTHORIZING -> AUTHORIZED) gates the create - budget
  # minutes, not seconds. ~$0 (the AWS-owned secret bills prorated
  # cents).
  #
  # Deliberately not exercised live:
  #   - basic and oauth auth -- the same CreateConnection state machine
  #     with different credential shapes; oauth would demand a real
  #     token endpoint. Unblock: an OAuth-server fixture.
  #   - private endpoints (VPC Lattice resource configurations) -- no
  #     Lattice fixture kind exists yet. Unblock: an
  #     AwsVpcLatticeResourceConfiguration fixture.
  #   - the credential non-round-trip is declared write-normalized in
  #     the import catalog (AWS never returns secret values) -- the
  #     blind import round-trip tolerates exactly auth_parameters.
  #
  # PROVEN live 2026-08-25 (Q45): both engines through the full
  # six-phase runner + the Terraform blind import round-trip under
  # the armed apply-idempotency gate.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
