syntax = "proto3";

package dev.planton.aws.awsappsyncapi.v1alpha1;

import "catalog/aws/awsappsyncapi/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsAppSyncApiIacInput is the input for the IaC modules that
// manage an AppSync API with its data sources, resolvers, functions,
// types, caching, API keys, channel namespaces, and custom domain.
message AwsAppSyncApiIacInput {
  // target is the AwsAppSyncApi resource to deploy.
  AwsAppSyncApi target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
