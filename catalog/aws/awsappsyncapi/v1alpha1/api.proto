syntax = "proto3";

package dev.planton.aws.awsappsyncapi.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsappsyncapi/v1alpha1/outputs.proto";
import "catalog/aws/awsappsyncapi/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsAppSyncApi {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsAppSyncApi'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsAppSyncApiSpec spec = 4 [(buf.validate.field).required = true];
  AwsAppSyncApiStatus status = 5;
}

message AwsAppSyncApiStatus {
  AwsAppSyncApiOutputs outputs = 1;
}
