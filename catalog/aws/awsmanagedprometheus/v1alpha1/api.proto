syntax = "proto3";

package dev.planton.aws.awsmanagedprometheus.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsmanagedprometheus/v1alpha1/outputs.proto";
import "catalog/aws/awsmanagedprometheus/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsManagedPrometheus {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsManagedPrometheus'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsManagedPrometheusSpec spec = 4 [(buf.validate.field).required = true];
  AwsManagedPrometheusStatus status = 5;
}

message AwsManagedPrometheusStatus {
  AwsManagedPrometheusOutputs outputs = 1;
}
