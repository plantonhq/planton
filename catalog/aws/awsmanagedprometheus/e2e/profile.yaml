apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsmanagedprometheus
spec:
  # One full-surface lane: workspace + all seven folded satellite arms
  # (configuration, workspace logging, alert manager, rule namespace,
  # query logging, resource policy, anomaly detector). Idle workspaces
  # bill nothing (~$0). The verifier asserts the configuration's
  # NO-OP-delete contract is irrelevant post-destroy (the workspace
  # itself is gone).
  #
  # Deliberately not exercised live:
  #   - kms_key_arn -- a create-time encryption pin (replaces the
  #     workspace); the default AWS-owned encryption proves the
  #     lifecycle. Unblock: an AwsKmsKey fixture via scenario
  #     annotations.
  #   - alias-unset (the once-set-never-unset replace contract) -- a
  #     deliberate replace is destroy evidence the normal teardown
  #     already provides. The contract is taught on the spec field and
  #     both modules.
  #
  # PROVEN live 2026-08-25 (Q44): both engines through the full
  # six-phase runner + the Terraform blind import round-trip under the
  # armed apply-idempotency gate. Three catches fixed at the bar: the
  # resource policy's Resource must be exactly the workspace's own ARN
  # (both modules compose it - authors never write Resource), AMP's
  # stored form collapses single-element Action arrays to the scalar
  # (author the string form), and the stored document's member order
  # can never byte-match jsonencode (policy_document declared
  # write-normalized in the import catalog - the order-only re-plan
  # after import is the declared tolerance).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
