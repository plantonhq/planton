syntax = "proto3";

package dev.planton.aws.awsconfigaggregator.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsconfigaggregator/v1alpha1/outputs.proto";
import "catalog/aws/awsconfigaggregator/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsConfigAggregator {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsConfigAggregator'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsConfigAggregatorSpec spec = 4 [(buf.validate.field).required = true];
  AwsConfigAggregatorStatus status = 5;
}

message AwsConfigAggregatorStatus {
  AwsConfigAggregatorOutputs outputs = 1;
}
