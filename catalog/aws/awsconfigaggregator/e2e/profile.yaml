apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsconfigaggregator
spec:
  # Config aggregation under live E2E: one deployment exercises BOTH
  # arms -- the aggregator (account source naming a documentation
  # account; the source shows as pending-authorization, which is the
  # honest cross-account truth) and one reciprocal grant (a standalone
  # permission record whose grantee never has to exist). Verifies both
  # Describe surfaces echo the arms, then destroys -- a REAL delete of
  # both. Cost: aggregators and grants are free; no Config data flows.
  #
  # Deliberately not exercised live:
  #   - organization_source -- the single-account wall (needs an AWS
  #     Organization management account and the
  #     AWSConfigRoleForOrganizations role). Unblock: an
  #     organization-enabled test account pair.
  #   - a live cross-account data flow (a REAL source account
  #     authorizing THIS aggregator and its recorder data arriving) --
  #     needs a second live account. Unblock: the same account pair.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
