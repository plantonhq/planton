# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awswafregexpatternset
spec:
  aws:
    statements:
      - sid: ManageRegexPatternSet
        actions:
          - wafv2:CreateRegexPatternSet
          - wafv2:UpdateRegexPatternSet
          - wafv2:DeleteRegexPatternSet
          - wafv2:GetRegexPatternSet
          - wafv2:TagResource
          - wafv2:UntagResource
          - wafv2:ListTagsForResource
        resources:
          - arn:aws:wafv2:*:*:regional/regexpatternset/*/*
          - arn:aws:wafv2:*:*:global/regexpatternset/*/*
        provenance: derived
        notes: Covers aws_wafv2_regex_pattern_set -- creation with tags, in-place expression updates (UpdateRegexPatternSet), reads during plan/refresh (GetRegexPatternSet and ListTagsForResource -- WAFv2 Get and tag-read actions ARE resource-scoped to the regexpatternset ARN format, unlike most services' Describe APIs), tagging, and deletion. Both scope segments are included because the spec supports REGIONAL sets (any region) and CLOUDFRONT sets (the global scope segment, created in us-east-1); the service reference's regexpatternset ARN format parameterizes that first path segment as the scope.
