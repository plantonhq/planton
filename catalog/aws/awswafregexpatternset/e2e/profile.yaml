apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awswafregexpatternset
spec:
  # A WAFv2 regex pattern set under live E2E: the harness runs deploy ->
  # GetRegexPatternSet verify (id/name/scope parsed from the ARN output) ->
  # destroy -> verify-destroyed on both provisioners. A true leaf that
  # creates in seconds. Deliberately not in the live scenario: CLOUDFRONT
  # scope (same API surface, pinned to us-east-1 while the shared fixtures
  # live in us-west-2 -- the REGIONAL lane exercises the identical resource
  # shape). Proven by CEL spec tests and the offline gate.
  # Live dual-engine run 2026-07-08: Pulumi 26s / Terraform 37s.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 10
