apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awssqsqueue
spec:
  # An SQS queue under E2E: the harness runs deploy -> GetQueueAttributes
  # verify -> destroy -> verify-destroyed on both provisioners. Two
  # scenarios: the FIFO queue with content-based deduplication,
  # per-message-group deduplication scope, high-throughput FIFO settings,
  # and explicit-true SSE-SQS; and the standard queue with the explicit
  # encryption OPT-OUT (sqsManagedSseEnabled: false -- the presence-typed
  # field's explicit-false send path; verify GetQueueAttributes reports
  # SqsManagedSseEnabled false, not apply success alone). The shared
  # prerequisite fixture leaves the field unset, proving the omit path
  # live via consumer chains (AWS's default-on encryption stands there).
  # Deliberately not in the live scenarios: a dead-letter queue (the
  # harness forbids same-kind e2e-prerequisites, and a FIFO DLQ must
  # itself be FIFO), customer-managed KMS keys, redrive-allow byQueue
  # lists, and resource policies -- all proven by CEL spec tests and the
  # offline gate; SQS-as-DLQ wiring is exercised live by the
  # AwsEventBridgeBus lane.
  tier: 1
  # Proven live 2026-08-12, both engines, both scenarios, plus the blind
  # import round-trip on the Terraform lane (queue_url re-imported, plan
  # zero-diff, both scenarios). The SSE tri-state was API-evidenced per
  # engine via GetQueueAttributes: the opt-out scenario echoed
  # SqsManagedSseEnabled=false (the explicit-false send path), the FIFO
  # scenario echoed true (explicit-true), and the shared prerequisite
  # fixture echoed true on the omit path in every consumer lane window
  # (AWS's default-on encryption stands when the field is unset).
  # Re-proven live 2026-08-13, both engines, both scenarios, after the
  # tag-convergence sweep: per-engine ListQueueTags echoed the canonical
  # six-key identity map INCLUDING Name on the Pulumi lane (the sweep's
  # Name-addition class proof), and the blind import round-trip re-ran
  # green on BOTH scenarios' Terraform lanes (queue_url re-imported,
  # zero-diff plan) over the changed send surface.
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
