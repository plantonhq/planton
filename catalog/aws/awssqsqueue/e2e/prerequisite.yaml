# AwsSqsQueue install profile used as a prerequisite by composed kinds
# (declared via the scenario's e2e-prerequisites annotation). A standard
# queue with AWS defaults -- enough for Lambda event-source mapping scenarios
# that wire SQS into compute. Full metadata is supplied for tagging/orphan
# cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsSqsQueue
metadata:
  name: planton-oss-e2e-awssqsqueue-prereq
  id: planton-oss-e2e-awssqsqueue-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awssqsqueue
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
