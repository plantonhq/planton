syntax = "proto3";

package dev.planton.aws.awssqsqueue.v1alpha1;

import "catalog/aws/awssqsqueue/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsSqsQueueIacInput is the input envelope passed to IaC modules for provisioning.
message AwsSqsQueueIacInput {
  // target is the fully-specified AwsSqsQueue resource to provision.
  AwsSqsQueue target = 1;

  // provider_config supplies AWS credentials and region for the deployment.
  // When nil the module falls back to ambient credentials (environment variables
  // or instance profile).
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
