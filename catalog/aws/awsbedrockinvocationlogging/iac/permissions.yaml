# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awsbedrockinvocationlogging
spec:
  aws:
    statements:
      - sid: ManageInvocationLoggingConfiguration
        actions:
          - bedrock:PutModelInvocationLoggingConfiguration
          - bedrock:GetModelInvocationLoggingConfiguration
          - bedrock:DeleteModelInvocationLoggingConfiguration
        resources:
          - "*"
        provenance: derived
        notes: Covers aws_bedrock_model_invocation_logging_configuration / bedrock.ModelInvocationLoggingConfiguration -- the module's single resource, an account+region settings singleton with no ARN of its own. All three actions are NON-SCOPABLE (the bedrock service reference lists no resource types for any of them), so the wildcard is the narrowest possible scope -- an ARN-scoped grant here would be a runtime DENY. Put serves create AND update (same API), Get serves every plan/refresh, Delete reverts the region to no logging on destroy.
      - sid: PassLogDeliveryRole
        actions:
          - iam:PassRole
        resources:
          - arn:aws:iam::*:role/*
        provenance: derived
        notes: PutModelInvocationLoggingConfiguration passes the referenced cloudwatch.role_arn (required whenever the CloudWatch arm is configured) to Bedrock, which assumes it to write log streams into the referenced log group -- AWS validates the whole permission chain at apply time ("Failed to validate permissions for log group"). Add an iam:PassedToService=bedrock.amazonaws.com condition and narrow to the actual role ARN in a hardened deployment. The S3 arm needs no PassRole -- Bedrock writes as its own bedrock.amazonaws.com service principal against the bucket policy, which is the referenced AwsS3Bucket's contract, so the runner needs no s3 grants here.
