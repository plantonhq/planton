# AwsIamRole install profile used as a prerequisite by composed components
# (declared via prerequisites: [AwsIamRole] in the kind registry). The E2E
# harness deploys every document below (via the role's Pulumi module),
# captures each instance's outputs under its manifest name, and resolves
# the dependent's role references by name -- so each consumer picks exactly
# the role shape it needs. Roles carry their own managed policies here on
# purpose: a component never attaches policies to a role it merely
# references, so the fixture must provision what the consumer requires.
# Full metadata is supplied and the managed-by label tags resources for
# orphan cleanup.
#
# Instance-profile composition role (ec2 trust, no policies).
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  name: planton-oss-e2e-awsiamrole-prereq
  id: planton-oss-e2e-awsiamrole-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsiamrole
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E prerequisite role for instance-profile composition
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: ec2.amazonaws.com
        Action: sts:AssumeRole
---
# EKS cluster (control plane) role: trusts eks.amazonaws.com and carries
# AmazonEKSClusterPolicy itself -- the cluster module never modifies the
# role it references.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  name: planton-oss-e2e-eks-cluster-role
  id: planton-oss-e2e-eks-cluster-role
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsiamrole
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E prerequisite role for the EKS control plane
  managedPolicyArns:
    - value: arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: eks.amazonaws.com
        Action: sts:AssumeRole
---
# EKS worker-node role: trusts ec2.amazonaws.com and carries the three
# worker policies every managed node group requires.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  name: planton-oss-e2e-eks-node-role
  id: planton-oss-e2e-eks-node-role
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsiamrole
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E prerequisite role for EKS worker nodes
  managedPolicyArns:
    - value: arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
    - value: arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
    - value: arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: ec2.amazonaws.com
        Action: sts:AssumeRole
---
# ECS task-execution role: trusts ecs-tasks.amazonaws.com and carries
# AmazonECSTaskExecutionRolePolicy itself -- Fargate task definitions
# using the awslogs logging default require it at registration time, and
# the task-definition module never modifies the role it references.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  name: planton-oss-e2e-ecs-execution-role
  id: planton-oss-e2e-ecs-execution-role
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsiamrole
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E prerequisite role for ECS task execution
  managedPolicyArns:
    - value: arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: ecs-tasks.amazonaws.com
        Action: sts:AssumeRole
---
# Fargate pod-execution role: trusts eks-fargate-pods.amazonaws.com and
# carries AmazonEKSFargatePodExecutionRolePolicy itself -- the Fargate
# profile module never modifies the role it references.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  name: planton-oss-e2e-eks-fargate-pod-role
  id: planton-oss-e2e-eks-fargate-pod-role
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsiamrole
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E prerequisite role for EKS Fargate pod execution
  managedPolicyArns:
    - value: arn:aws:iam::aws:policy/AmazonEKSFargatePodExecutionRolePolicy
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: eks-fargate-pods.amazonaws.com
        Action: sts:AssumeRole
---
# MWAA execution role: trusts airflow.amazonaws.com AND
# airflow-env.amazonaws.com (MWAA assumes it through both service
# principals). AWS publishes no managed policy for MWAA execution roles,
# so the fixture carries broad read/write managed policies over the
# services MWAA touches (S3 DAG source, CloudWatch Logs, SQS Celery
# backend) -- acceptable breadth for an ephemeral test account, and the
# environment module never modifies the role it references.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  name: planton-oss-e2e-mwaa-execution-role
  id: planton-oss-e2e-mwaa-execution-role
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsiamrole
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E prerequisite role for MWAA environment execution
  managedPolicyArns:
    - value: arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
    - value: arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
    - value: arn:aws:iam::aws:policy/AmazonSQSFullAccess
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service:
            - airflow.amazonaws.com
            - airflow-env.amazonaws.com
        Action: sts:AssumeRole
---
# Lambda execution role: trusts lambda.amazonaws.com and carries
# AWSLambdaBasicExecutionRole itself -- zip and container functions
# require CloudWatch Logs write access at creation time, and the
# Lambda module never modifies the role it references.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  name: planton-oss-e2e-lambda-execution-role
  id: planton-oss-e2e-lambda-execution-role
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsiamrole
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E prerequisite role for Lambda function execution
  managedPolicyArns:
    - value: arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  inlinePolicies:
    sqsWorkerE2E:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource: "*"
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: lambda.amazonaws.com
        Action: sts:AssumeRole
---
# Firehose delivery role: trusts firehose.amazonaws.com and carries the S3
# write permissions every Firehose destination needs (extended_s3 targets
# and the failed/all-document backup for the other destinations). Scoped to
# the shared bucket fixture, which firehose scenarios compose as their
# destination.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  name: planton-oss-e2e-firehose-delivery-role
  id: planton-oss-e2e-firehose-delivery-role
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsiamrole
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E prerequisite role for Firehose S3 delivery
  inlinePolicies:
    firehoseS3DeliveryE2E:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Action:
            - s3:AbortMultipartUpload
            - s3:GetBucketLocation
            - s3:GetObject
            - s3:ListBucket
            - s3:ListBucketMultipartUploads
            - s3:PutObject
          Resource:
            - arn:aws:s3:::planton-oss-e2e-awss3bucket-prereq
            - arn:aws:s3:::planton-oss-e2e-awss3bucket-prereq/*
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: firehose.amazonaws.com
        Action: sts:AssumeRole
---
# CloudWatch Logs delivery role: trusts logs.amazonaws.com and carries the
# Kinesis put permissions a log group's subscription filter needs to stream
# matching events into the shared Kinesis stream fixture.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  name: planton-oss-e2e-cwl-delivery-role
  id: planton-oss-e2e-cwl-delivery-role
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsiamrole
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E prerequisite role for CloudWatch Logs subscription delivery
  inlinePolicies:
    cwlKinesisDeliveryE2E:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Action:
            - kinesis:PutRecord
            - kinesis:PutRecords
          Resource: "*"
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: logs.amazonaws.com
        Action: sts:AssumeRole
---
# Step Functions execution role: trusts states.amazonaws.com. Carries no
# permission policies -- the E2E state machine is a Pass-state workflow that
# invokes no services, so an empty-permission role is the honest minimal
# fixture.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  name: planton-oss-e2e-sfn-execution-role
  id: planton-oss-e2e-sfn-execution-role
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsiamrole
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E prerequisite role for Step Functions execution
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: states.amazonaws.com
        Action: sts:AssumeRole
---
# CodeBuild service role: trusts codebuild.amazonaws.com and carries the
# CloudWatch Logs permissions builds need to stream output. The E2E project
# never starts a build, but AWS validates the role's assumability at
# CreateProject, so the trust policy is the load-bearing part.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  name: planton-oss-e2e-codebuild-service-role
  id: planton-oss-e2e-codebuild-service-role
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsiamrole
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E prerequisite role for the CodeBuild service
  inlinePolicies:
    codebuildLogsE2E:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: codebuild.amazonaws.com
        Action: sts:AssumeRole
---
# CodePipeline role: trusts codepipeline.amazonaws.com. Carries the S3
# artifact-store access and CodeBuild start/poll permissions the E2E
# pipeline's two stages declare -- CreatePipeline validates the role can be
# assumed, and the first (automatic) execution exercises these permissions.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  name: planton-oss-e2e-codepipeline-role
  id: planton-oss-e2e-codepipeline-role
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsiamrole
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E prerequisite role for CodePipeline orchestration
  inlinePolicies:
    codepipelineE2E:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:GetObjectVersion
            - s3:GetBucketVersioning
            - s3:PutObject
          Resource: "*"
        - Effect: Allow
          Action:
            - codebuild:BatchGetBuilds
            - codebuild:StartBuild
          Resource: "*"
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: codepipeline.amazonaws.com
        Action: sts:AssumeRole
---
# SageMaker execution role: trusts sagemaker.amazonaws.com. The domain's
# One execution role serves the whole SageMaker family's lanes (domain,
# model, notebook, feature group, pipeline, image, MLflow) - the
# one-role-per-family shape. Trust is the load-bearing part everywhere
# (CreateDomain/CreateModel/CreateNotebookInstance validate
# assumability); the S3 statement covers the data-plane writes the
# feature group's offline store and the MLflow artifact stores perform
# against the shared bucket fixture, and the ECR pulls image versions
# would need. The two ACL verbs are load-bearing for the feature group:
# CreateFeatureGroup validates the offline store by calling
# s3:GetBucketAcl on the bucket AS this role at create time (live-caught
# 2026-08-25, Q36), and s3:PutObjectAcl is the companion verb AWS's own
# AmazonSageMakerFeatureStoreAccess managed policy grants - without them
# the create fails with "Invalid S3Uri" wrapping the S3 AccessDenied.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  name: planton-oss-e2e-sagemaker-execution-role
  id: planton-oss-e2e-sagemaker-execution-role
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsiamrole
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E prerequisite role for SageMaker execution (the family's shared role)
  inlinePolicies:
    sagemakerDataPlaneE2E:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Action:
            - s3:AbortMultipartUpload
            - s3:GetBucketAcl
            - s3:GetBucketLocation
            - s3:GetObject
            - s3:ListBucket
            - s3:ListBucketMultipartUploads
            - s3:PutObject
            - s3:PutObjectAcl
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::planton-oss-e2e-awss3bucket-prereq
            - arn:aws:s3:::planton-oss-e2e-awss3bucket-prereq/*
        - Effect: Allow
          Action:
            - ecr:BatchGetImage
            - ecr:GetDownloadUrlForLayer
            - ecr:GetAuthorizationToken
          Resource: "*"
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: sagemaker.amazonaws.com
        Action: sts:AssumeRole
---
# Bedrock agents-family role: trusts bedrock.amazonaws.com and carries the
# permission set the upstream provider's own agent/knowledge-base
# acceptance fixtures grant -- model invocation (agent serving and
# embedding), S3 read (knowledge-base data sources), and the S3 Vectors
# data-plane verbs (the standing vector-store fixture). One role serves
# the agent, knowledge base, and flow consumers; each references it by
# name.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  name: planton-oss-e2e-bedrock-agents-role
  id: planton-oss-e2e-bedrock-agents-role
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsiamrole
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E prerequisite role for the Bedrock agents family
  inlinePolicies:
    bedrockAgentsE2E:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
          Resource: "*"
        - Effect: Allow
          Action:
            - s3:ListBucket
            - s3:GetObject
          Resource: "*"
        - Effect: Allow
          Action:
            - s3vectors:GetIndex
            - s3vectors:QueryVectors
            - s3vectors:PutVectors
            - s3vectors:GetVectors
            - s3vectors:DeleteVectors
          Resource: "*"
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: bedrock.amazonaws.com
        Action: sts:AssumeRole
---
# ECS Managed Instances infrastructure role: trusts ecs.amazonaws.com and
# carries AmazonECSInfrastructureRolePolicyForManagedInstances -- the role
# ECS assumes to launch, patch, and retire managed instances. The caller
# applying a manifest that references it needs iam:PassRole on it; the
# capacity-provider association is where a missing PassRole surfaces.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  name: planton-oss-e2e-ecs-mi-infra-role
  id: planton-oss-e2e-ecs-mi-infra-role
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsiamrole
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E prerequisite role for ECS Managed Instances infrastructure
  managedPolicyArns:
    - value: arn:aws:iam::aws:policy/AmazonECSInfrastructureRolePolicyForManagedInstances
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: ecs.amazonaws.com
        Action: sts:AssumeRole
---
# Bedrock AgentCore family role: trusts bedrock-agentcore.amazonaws.com and
# carries the permission set the upstream provider's own AgentCore
# acceptance fixtures grant -- ECR image pull (container runtimes), S3 read
# (code bundles, browser enterprise policies), S3 write (browser session
# recordings), and CloudWatch Logs. One role serves the runtime, gateway,
# memory, and tools consumers; each references it by name.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  name: planton-oss-e2e-agentcore-role
  id: planton-oss-e2e-agentcore-role
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsiamrole
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E prerequisite role for the Bedrock AgentCore family
  inlinePolicies:
    agentCoreE2E:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Action:
            - ecr:GetAuthorizationToken
            - ecr:BatchGetImage
            - ecr:GetDownloadUrlForLayer
          Resource: "*"
        - Effect: Allow
          Action:
            - s3:ListBucket
            - s3:GetObject
            - s3:PutObject
          Resource: "*"
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
          Resource: "*"
        # Code-based evaluators (AwsBedrockAgentCoreEvaluation) invoke a
        # Lambda at evaluation-run time. Create of the evaluator does
        # not invoke it; the grant is here so a later live run against
        # this role succeeds without a second IAM change.
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource: "*"
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: bedrock-agentcore.amazonaws.com
        Action: sts:AssumeRole
