# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awsiamrole
spec:
  aws:
    statements:
      - sid: ManageRole
        actions:
          - iam:CreateRole
          - iam:GetRole
          - iam:UpdateRole
          - iam:UpdateRoleDescription
          - iam:UpdateAssumeRolePolicy
          - iam:DeleteRole
          - iam:PutRolePermissionsBoundary
          - iam:DeleteRolePermissionsBoundary
          - iam:TagRole
          - iam:UntagRole
          - iam:ListRoleTags
        resources:
          - arn:aws:iam::*:role/*
        provenance: derived
        notes: Covers aws_iam_role / iam.Role -- creation with name, path, trust document (free-form or composed OIDC form), description, session-duration ceiling, and boundary; in-place updates of every mutable argument; tagging; and deletion. IAM ARNs carry no region, and role/* spans custom paths because '*' matches path separators. All role APIs authorize on the role ARN alone.
      - sid: ManageRolePolicyWiring
        actions:
          - iam:AttachRolePolicy
          - iam:DetachRolePolicy
          - iam:ListAttachedRolePolicies
          - iam:PutRolePolicy
          - iam:GetRolePolicy
          - iam:DeleteRolePolicy
          - iam:ListRolePolicies
        resources:
          - arn:aws:iam::*:role/*
        provenance: derived
        notes: Covers aws_iam_role_policy_attachment / iam.RolePolicyAttachment (managed-policy attach and detach, reconciled per entry) and aws_iam_role_policy / iam.RolePolicy (inline policies embedded in the role). The List actions are the read-side during plan/refresh, and force_detach_policies deletion sweeps attachments and inline policies through the same List/Detach/Delete calls. Every action here authorizes on the ROLE ARN, not the policy ARN -- attaching an AWS-managed or foreign policy needs no grant on the policy itself.
