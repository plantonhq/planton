# AwsKinesisStreamConsumer chain scenario: register one enhanced fan-out
# consumer against the shared stream fixture. AwsKinesisStream is the kind's
# registry prerequisite (a consumer cannot exist without its stream), so the
# harness installs the stream first and the streamArn reference resolves
# against its captured outputs. The consumer registers in seconds and holds
# no data, so the lane cost is the stream fixture alone.
#
# Deliberately not composed here: the folded resource_policy. Kinesis
# requires a resource policy's Resource element to equal the target ARN
# exactly (no wildcards), and a consumer ARN embeds its registration
# timestamp -- it cannot be written statically before the consumer exists.
# The policy fold is proven by CEL spec tests, the offline gate, and the
# stream lane (the same aws_kinesis_resource_policy satellite against the
# stream's deterministic ARN).
apiVersion: aws.planton.dev/v1alpha1
kind: AwsKinesisStreamConsumer
metadata:
  name: planton-oss-e2e-awskincon-chain
  id: planton-oss-e2e-awskincon-chain
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awskinesisstreamconsumer
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  streamArn:
    valueFrom:
      kind: AwsKinesisStream
      name: planton-oss-e2e-awskinesisstream-prereq
      fieldPath: status.outputs.stream_arn
