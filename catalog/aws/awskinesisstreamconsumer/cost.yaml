# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. This kind deliberately ships no
# estimate model: a registered consumer commits real spend (a dedicated
# read pipe billed per shard per hour), but the shard count lives on the
# referenced AwsKinesisStream -- invisible in this manifest, so a dollar
# figure here would be a guess wearing a dollar sign.
# Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: awskinesisstreamconsumer
spec:
  billing_model: hybrid
  baseline_charges:
    - service_name: Amazon Kinesis
      sku_meter: enhanced fan-out consumer-shard hours
      pricing_unit: consumer-shard-hours
      description: Every registered consumer bills one consumer-shard hour per shard in the referenced stream, every hour, from registration to deregistration -- the referenced stream's shard count times 730 is the bill's core, and that count lives on the other component.
  cost_drivers:
    - field_path: stream_arn
      sku_meter: enhanced fan-out consumer-shard hours
      pricing_unit: consumer-shard-hours
      impact: The only lever this manifest holds -- which stream the consumer registers with decides how many shards multiply the hourly fee. A 10-shard stream makes this consumer five times the committed cost of a 2-shard one.
  estimate_exclusions:
    - the consumer-shard-hour quantity is the referenced AwsKinesisStream's shard count times the hours in the month -- this manifest names the stream, never its size, which is why no estimate document exists for this kind
    - enhanced fan-out data retrieval bills per GB delivered through SubscribeToShard and follows read traffic
    - the referenced stream's own shard-hours, retention, and data charges bill on its AwsKinesisStream component
  notes: "The honest estimate lives at composition time: the consumer registration from this manifest, the shard count from the referenced stream, the rate from the price book. Each piece is verified data -- only their join is deferred, to the surface that sees both components together."
