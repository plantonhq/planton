syntax = "proto3";

package dev.planton.aws.awskinesisstreamconsumer.v1alpha1;

import "catalog/aws/awskinesisstreamconsumer/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsKinesisStreamConsumerIacInput is the input envelope passed to IaC
// modules for provisioning.
message AwsKinesisStreamConsumerIacInput {
  // target is the fully-specified AwsKinesisStreamConsumer resource to provision.
  AwsKinesisStreamConsumer target = 1;

  // provider_config supplies AWS credentials and region for the deployment.
  // When nil the module falls back to ambient credentials (environment variables
  // or instance profile).
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
