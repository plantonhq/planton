# VPC connector across the shared subnet fixture's two-AZ pair with the
# shared security-group fixture attached -- the production shape (multi-AZ
# egress reach + an explicit egress group). Subnets and the security group
# both come from the registry prerequisites (both are required on this
# kind).
apiVersion: aws.planton.dev/v1alpha1
kind: AwsAppRunnerVpcConnector
metadata:
  name: planton-oss-e2e-awsarvc
  id: planton-oss-e2e-awsarvc
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsapprunnervpcconnector
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-b
        fieldPath: status.outputs.subnet_id
  securityGroupIds:
    - valueFrom:
        kind: AwsSecurityGroup
        name: planton-oss-e2e-awssg-prereq
        fieldPath: status.outputs.security_group_id
