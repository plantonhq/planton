apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsapprunnervpcconnector
spec:
  # A VPC connector under live E2E: the registry-declared AwsSubnet +
  # AwsSecurityGroup prerequisite chains (VPC -> two-AZ subnets; VPC -> SG)
  # deploy first, then the connector proves create (AWS provisions the
  # managed ENIs, typically 1-2 minutes), verify (DescribeVpcConnector),
  # destroy (deletion flips the connector to INACTIVE -- treated as
  # absent), and verify-destroyed on both provisioners.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
