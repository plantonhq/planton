syntax = "proto3";

package dev.planton.aws.awsapprunnervpcconnector.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsapprunnervpcconnector/v1alpha1/outputs.proto";
import "catalog/aws/awsapprunnervpcconnector/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsAppRunnerVpcConnector is the API envelope for an App Runner VPC
// connector -- the shared network attachment that lets App Runner services
// reach private VPC resources (databases, caches, internal APIs) for their
// outbound traffic.
message AwsAppRunnerVpcConnector {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this resource, must be "AwsAppRunnerVpcConnector".
  string kind = 2 [(buf.validate.field).string.const = "AwsAppRunnerVpcConnector"];

  // metadata captures identifying information (name, org, environment,
  // labels) and must pass standard validations for resource naming.
  // The connector's AWS name is metadata.name; AWS requires connector names
  // to be 4-40 characters.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the desired configuration of the VPC connector.
  AwsAppRunnerVpcConnectorSpec spec = 4 [(buf.validate.field).required = true];

  // status holds post-deployment information.
  AwsAppRunnerVpcConnectorStatus status = 5;
}

// AwsAppRunnerVpcConnectorStatus describes the status of an App Runner VPC
// connector resource.
message AwsAppRunnerVpcConnectorStatus {
  // outputs captures the observable values returned by Pulumi/Terraform
  // after provisioning.
  AwsAppRunnerVpcConnectorOutputs outputs = 1;
}
