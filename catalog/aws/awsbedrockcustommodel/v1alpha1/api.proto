syntax = "proto3";

package dev.planton.aws.awsbedrockcustommodel.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsbedrockcustommodel/v1alpha1/outputs.proto";
import "catalog/aws/awsbedrockcustommodel/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsBedrockCustomModel is a component for creating and managing Amazon
// Bedrock custom models - foundation models customized with your training
// data through a model-customization job (fine-tuning, continued
// pre-training, or distillation).
message AwsBedrockCustomModel {
  // api_version specifies the API version for this resource.
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  // kind identifies this resource type.
  string kind = 2 [(buf.validate.field).string.const = 'AwsBedrockCustomModel'];

  // metadata contains standard resource metadata including name, labels, and annotations.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec defines the desired state of the custom model.
  AwsBedrockCustomModelSpec spec = 4 [(buf.validate.field).required = true];

  // status contains the observed state and outputs from the deployment.
  AwsBedrockCustomModelStatus status = 5;
}

// AwsBedrockCustomModelStatus contains the status and outputs for the
// custom model.
message AwsBedrockCustomModelStatus {
  // outputs contains the values exported from the IaC stack after deployment.
  AwsBedrockCustomModelOutputs outputs = 1;
}
