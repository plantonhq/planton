syntax = "proto3";

package dev.planton.aws.awsbatchjobqueue.v1alpha1;

// AwsBatchJobQueueOutputs captures the observable identifiers of the
// AWS Batch job queue.
message AwsBatchJobQueueOutputs {
  // The Amazon Resource Name (ARN) of the job queue -- the handle jobs are
  // submitted against (SubmitJob) and the target EventBridge Batch targets
  // point at.
  string job_queue_arn = 1;

  // The job queue's name (derived from metadata.name). SubmitJob accepts
  // the name or the ARN interchangeably within the same account/region.
  string job_queue_name = 2;
}
