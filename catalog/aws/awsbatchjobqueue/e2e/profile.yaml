apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsbatchjobqueue
spec:
  # A Batch job queue under live E2E, mapped onto the registry-declared
  # compute-environment prerequisite (which itself composes the VPC ->
  # subnet -> security-group fixture chain). The scenario exercises the
  # compute-environment-order mapping and a stuck-job time-limit action
  # (CANCEL on MISCONFIGURATION:JOB_RESOURCE_REQUIREMENT). Deletion is
  # disable-then-delete like the compute environment; the verifier treats
  # DELETING/DELETED lifecycle states as absent. Deliberately not in the
  # live lane: fair-share scheduling-policy attachment (a one-ARN field
  # proven by the offline gate; attaching it live would force the
  # scheduling-policy kind into this lane's fixture chain for no new
  # provider surface) and multi-environment overflow ordering (same
  # repeated block, second entry).
  # Live dual-engine run 2026-07-08 (incl. the compute-environment
  # prerequisite chain): Pulumi 5m11s / Terraform 5m51s -- the destroy
  # phase carries the disable-then-delete drain of queue + environment.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
