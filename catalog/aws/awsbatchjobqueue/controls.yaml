# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsbatchjobqueue
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A job queue stores no customer data -- the queued jobs it holds are Batch control-plane records (definition reference, parameters, state) inside AWS's own service infrastructure, not a data store this component owns. Whatever data jobs process encrypts where it lives.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: There is no data at rest here to key (see enc-at-rest); Batch exposes no KMS surface on job queues.
    - control_id: enc-in-transit
      status: not_applicable
      notes: A queue terminates no connections of its own. The only wire traffic involving it -- SubmitJob calls and queue management -- happens on AWS API endpoints, which serve exclusively over TLS as account-wide provider behavior, not per-queue configuration.
    - control_id: no-public-access
      status: not_applicable
      notes: A queue has no network endpoint to expose -- it is a routing object between submissions and compute environments. Network exposure belongs to the mapped compute environments' subnets and the jobs' own configuration.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network surface exists to filter; inbound rules live on the mapped compute environments' security groups.
    - control_id: edge-protection
      status: not_applicable
      notes: A queue receives no HTTP requests -- web ACLs and request filters have nothing to attach to.
    - control_id: rbac
      status: not_applicable
      notes: The spec carries no principal or access surface of its own -- who may submit jobs to the queue or manage it is governed by IAM permissions on the Batch API (SubmitJob authorizes on the job-queue ARN, so per-queue submission control is possible), but that policy authoring is account-level posture outside this spec and the modules.
    - control_id: workload-identity
      status: not_applicable
      notes: The queue runs no workloads and holds no credentials. The identities jobs run with (job role, execution role, EKS service account) are declared on the AwsBatchJobDefinition, not here.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The queue exposes no authentication path at all -- there is no protocol, credential, or client negotiation to harden.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: The spec exposes no audit surface. Queue management calls and every SubmitJob against it are recorded by AWS CloudTrail as account-level posture, not per-queue settings.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The spec exposes no monitoring surface. Batch emits job state-change events to EventBridge as service behavior, and job logs flow per the job definition's log configuration -- neither is a setting of the queue. job_state_time_limit_actions is an operational fuse (cancel jobs stuck in RUNNABLE), not signal export.
    - control_id: backup-recovery
      status: not_applicable
      notes: A queue holds no data to back up -- it is declarative configuration fully re-creatable from the manifest; queued-but-unstarted jobs are transient runtime state no backup mechanism covers.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The queue is a regional control-plane object with no zonal placement of its own; zone spread for the jobs it routes comes from the mapped compute environments' subnet layout. Mapping up to three environments in preference order is capacity failover, not zone replication.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither AWS nor the modules expose a deletion-protection flag for job queues. AWS does refuse to delete an ENABLED queue -- the provider's disable-then-drain-then-delete sequence satisfies that lifecycle rule automatically, so it is a deletion ORDER guard, not a configurable protection.
    - control_id: managed-patching
      status: not_applicable
      notes: A queue is a pure configuration object with no software to patch.
