syntax = "proto3";

package dev.planton.aws.awsrestapivpclink.v1alpha1;

import "catalog/aws/awsrestapivpclink/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsRestApiVpcLinkIacInput is the input for the IaC modules that
// deploy the VPC link.
message AwsRestApiVpcLinkIacInput {
  // target is the AwsRestApiVpcLink resource to deploy.
  AwsRestApiVpcLink target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
