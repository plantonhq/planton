syntax = "proto3";

package dev.planton.aws.awsrestapivpclink.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsrestapivpclink/v1alpha1/outputs.proto";
import "catalog/aws/awsrestapivpclink/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsRestApiVpcLink {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsRestApiVpcLink'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsRestApiVpcLinkSpec spec = 4 [(buf.validate.field).required = true];
  AwsRestApiVpcLinkStatus status = 5;
}

message AwsRestApiVpcLinkStatus {
  AwsRestApiVpcLinkOutputs outputs = 1;
}
