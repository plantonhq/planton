apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsrestapivpclink
spec:
  # A REST API VPC link under live E2E: the registry-declared AwsNlb
  # prerequisite chain (VPC -> two-AZ subnets -> NLB) deploys first,
  # then the link proves create (AWS waits for AVAILABLE while building
  # the network attachment, typically several minutes), GetVpcLink
  # verification, destroy (DELETING is treated as absent), and
  # verify-destroyed on both provisioners. Creating the link is free;
  # NLB charges apply to the balancer it fronts.
  #
  # Proven live 2026-08-25: nlb-link green on both engines first pass
  # (~12 min each -- the NLB chain + AVAILABLE wait) with the blind
  # round-trip (name-passthrough re-import at no real change).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 25
