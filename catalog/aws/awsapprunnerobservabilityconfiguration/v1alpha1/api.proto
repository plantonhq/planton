syntax = "proto3";

package dev.planton.aws.awsapprunnerobservabilityconfiguration.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsapprunnerobservabilityconfiguration/v1alpha1/outputs.proto";
import "catalog/aws/awsapprunnerobservabilityconfiguration/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsAppRunnerObservabilityConfiguration is the API envelope for an App
// Runner observability configuration -- the reusable, versioned tracing
// policy that App Runner services reference to enable distributed request
// tracing.
message AwsAppRunnerObservabilityConfiguration {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this resource, must be
  // "AwsAppRunnerObservabilityConfiguration".
  string kind = 2 [(buf.validate.field).string.const = "AwsAppRunnerObservabilityConfiguration"];

  // metadata captures identifying information (name, org, environment,
  // labels) and must pass standard validations for resource naming.
  // The configuration's AWS name is metadata.name; revisions register under
  // this name.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the desired configuration of the observability configuration.
  AwsAppRunnerObservabilityConfigurationSpec spec = 4 [(buf.validate.field).required = true];

  // status holds post-deployment information.
  AwsAppRunnerObservabilityConfigurationStatus status = 5;
}

// AwsAppRunnerObservabilityConfigurationStatus describes the status of an
// App Runner observability configuration resource.
message AwsAppRunnerObservabilityConfigurationStatus {
  // outputs captures the observable values returned by Pulumi/Terraform
  // after provisioning.
  AwsAppRunnerObservabilityConfigurationOutputs outputs = 1;
}
