apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsapprunnerobservabilityconfiguration
spec:
  # A dependency-free leaf: the scenario registers an X-Ray tracing
  # configuration revision, verifies it is active
  # (DescribeObservabilityConfiguration), destroys it, and verifies the
  # revision flipped to inactive -- on both provisioners. Registration is
  # near-instant (the provider waiter caps it at 2 minutes).
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
