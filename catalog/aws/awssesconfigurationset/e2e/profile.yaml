apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awssesconfigurationset
spec:
  # An SES configuration set under live E2E: a dependency-free leaf that
  # creates and deletes in seconds. The minimal scenario proves the set
  # resource itself (TLS REQUIRE, suppression reasons, reputation
  # metrics); the event-destinations scenario proves the folded
  # per-name satellites live (CloudWatch metrics + an SNS feedback
  # destination composed via the e2e-prerequisites annotation).
  # Deletion is synchronous.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 10
