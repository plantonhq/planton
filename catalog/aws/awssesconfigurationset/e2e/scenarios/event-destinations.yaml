# Event-publishing AwsSesConfigurationSet: proves the folded per-name
# event-destination satellites live — a CloudWatch metrics destination
# (dimension sourced from a message tag) and an SNS feedback destination
# wired to the shared AwsSnsTopic fixture. AwsSnsTopic is OPTIONAL
# composition for this kind, so the scenario (not the registry) declares
# it via the e2e-prerequisites annotation.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsSesConfigurationSet
metadata:
  name: planton-oss-e2e-awssesconfigset-events
  id: planton-oss-e2e-awssesconfigset-events
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awssesconfigurationset
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsSnsTopic"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  reputationMetricsEnabled: true
  deliveryOptions:
    tlsPolicy: REQUIRE
  eventDestinations:
    - name: bounce-metrics
      matchingEventTypes:
        - SEND
        - BOUNCE
        - COMPLAINT
        - DELIVERY
      cloudWatch:
        dimensions:
          - name: campaign
            valueSource: MESSAGE_TAG
            defaultValue: none
    - name: feedback-loop
      matchingEventTypes:
        - BOUNCE
        - COMPLAINT
      snsTopic:
        valueFrom:
          kind: AwsSnsTopic
          name: planton-oss-e2e-awssnstopic-prereq
          fieldPath: status.outputs.topic_arn
