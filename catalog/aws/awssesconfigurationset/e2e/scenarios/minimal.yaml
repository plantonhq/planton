# Minimal transactional AwsSesConfigurationSet: TLS REQUIRE, suppression
# for BOUNCE+COMPLAINT, and reputation metrics enabled. A dependency-free
# leaf that creates and deletes in seconds.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsSesConfigurationSet
metadata:
  name: planton-oss-e2e-awssesconfigset
  id: planton-oss-e2e-awssesconfigset
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awssesconfigurationset
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  reputationMetricsEnabled: true
  deliveryOptions:
    tlsPolicy: REQUIRE
  suppressedReasons:
    - BOUNCE
    - COMPLAINT
