# AwsSesConfigurationSet install profile used as a prerequisite by composed
# components (declared via the scenario's e2e-prerequisites annotation).
apiVersion: aws.planton.dev/v1alpha1
kind: AwsSesConfigurationSet
metadata:
  name: planton-oss-e2e-awssesconfigset-prereq
  id: planton-oss-e2e-awssesconfigset-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awssesconfigurationset
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  deliveryOptions:
    tlsPolicy: REQUIRE
  suppressedReasons:
    - BOUNCE
    - COMPLAINT
