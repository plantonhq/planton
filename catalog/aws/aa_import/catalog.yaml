    # --- SSM ---------------------------------------------------------------------
    - terraform_type: aws_ssm_parameter
      pulumi_type: aws:ssm/parameter:Parameter
      id_format: "{parameter_name}"
      # overwrite is deploy-side first-create behavior, never returned by
      # AWS or set during the provider's Read -- a freshly imported
      # parameter always shows it false.
      config_only_attributes:
        - overwrite
      # The provider's import populates the sensitive `value` attribute
      # only, never its plaintext twin `insecure_value` -- a config
      # authored on the insecure_value render path re-sends the same
      # content on the first post-import plan (a server-side no-op;
      # live-caught by the blind round-trip). `value` itself stays
      # undeclared so real content drift still fails the gate.
      write_normalized_attributes:
        - insecure_value
      notes: >-
        The parameter's name including any hierarchical path (`aws ssm
        describe-parameters` shows Name); a full parameter ARN imports
        too.
    - terraform_type: aws_ssm_document
      pulumi_type: aws:ssm/document:Document
      id_format: "{document_name}"
      # No SSM API returns attachment metadata -- a freshly imported
      # document shows no attachments_source and the first apply
      # re-asserts it (the provider's own import test ignores it).
      config_only_attributes:
        - attachments_source
      notes: >-
        The document's name (`aws ssm list-documents` shows Name).
    - terraform_type: aws_ssm_association
      pulumi_type: aws:ssm/association:Association
      id_format: "{association_id}"
      # wait_for_success_timeout_seconds is a create-time wait never read
      # back. AWS materializes the document's declared parameter defaults
      # into the stored parameters map, so a faithful import plans a
      # semantically identical parameters reconcile (the provider's own
      # import test ignores both).
      config_only_attributes:
        - wait_for_success_timeout_seconds
      write_normalized_attributes:
        - parameters
      notes: >-
        The association's AWS-generated UUID (`aws ssm
        list-associations` shows AssociationId) -- the document name is
        NOT the identity.
