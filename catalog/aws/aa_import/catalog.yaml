      # node inference floats as float32, so a value that is not
      # float32-exact (0.2, 0.9) reads back widened and a blind import
      # plans a one-time in-place update on exactly these leaves
      # (live-caught 2026-08-14: knowledge-base node temperature 0.2).
      # Post-APPLY state keeps the config value (idempotency holds).
      write_normalized_attributes:
        - definition.node.configuration.prompt.source_configuration.inline.inference_configuration.text.temperature
        - definition.node.configuration.prompt.source_configuration.inline.inference_configuration.text.top_p
