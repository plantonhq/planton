apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsautoscalinggroup
spec:
  # An auto-scaling group under live E2E: the harness deploys the VPC,
  # two-AZ subnet pair, and launch-template prerequisites, then runs
  # deploy -> DescribeAutoScalingGroups verify -> destroy ->
  # verify-destroyed on both provisioners. The scenario runs min=0/
  # desired=0, so the group itself is free and no instance ever launches;
  # the prerequisite chain dominates the runtime.
  #
  # pending_proof: the depth closure added Capacity Reservation targeting,
  # VPC Lattice traffic sources, the terminate-hook retention policy,
  # creation-time lifecycle hooks, the policy pause button, and the split/
  # customized predictive metric forms -- the prior green predates this
  # surface, so the badge is revoked until the proof lane re-earns it.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 25
