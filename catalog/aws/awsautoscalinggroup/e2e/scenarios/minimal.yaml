# Minimal AwsAutoScalingGroup scenario: a zero-capacity group across the
# two-AZ subnet pair, launching from the launch-template prerequisite --
# proving the full VPC -> subnets -> launch template -> group chain with no
# instance ever launched (min=0, desired unset). AWS still validates that
# the referenced template is fully formed (image present) at creation, so
# the chain is a real composition proof, not a stub. Full metadata is
# supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsAutoScalingGroup
metadata:
  name: planton-oss-e2e-asg-smoke
  id: planton-oss-e2e-asg-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsautoscalinggroup
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  subnets:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-b
        fieldPath: status.outputs.subnet_id
  launchTemplate:
    launchTemplateId:
      valueFrom:
        kind: AwsLaunchTemplate
        name: planton-oss-e2e-lt-prereq
        fieldPath: status.outputs.launch_template_id
  minSize: 0
  maxSize: 1
  terminationPolicies:
    - OldestLaunchTemplate
    - Default
  # New-surface arms that bill nothing on a zero-capacity group: the
  # creation-time launch hook (attached atomically with the group -- the
  # arm that proves initial hook wiring), and the terminate-hook retention
  # policy.
  instanceLifecyclePolicy:
    terminateHookAbandon: retain
  lifecycleHooks:
    - name: warm-cache
      lifecycleTransition: autoscaling:EC2_INSTANCE_LAUNCHING
      defaultResult: CONTINUE
      heartbeatTimeoutSeconds: 120
      applyAtLaunch: true
  enabledMetrics:
    - GroupMinSize
    - GroupMaxSize
    - GroupDesiredCapacity
