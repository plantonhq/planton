# Composed AwsFsxDataRepositoryAssociation scenario: links the PERSISTENT_2
# Lustre fixture (the kind's registry prerequisite) to the shared S3 bucket
# fixture (declared via the e2e-prerequisites annotation) with full
# bidirectional sync policies and a batch metadata import. The
# data_repository_path is a literal because the field is a plain string —
# it names the bucket fixture's fixed name directly.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsFsxDataRepositoryAssociation
metadata:
  name: planton-oss-e2e-awsfxdra-link
  id: planton-oss-e2e-awsfxdra-link
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsfsxdatarepositoryassociation
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsS3Bucket"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  fileSystemId:
    valueFrom:
      kind: AwsFsxLustreFileSystem
      name: planton-oss-e2e-awsfxl-prereq
      fieldPath: status.outputs.file_system_id
  fileSystemPath: /e2e-datasets
  dataRepositoryPath: s3://planton-oss-e2e-awss3bucket-prereq/e2e-datasets/
  autoImportEvents:
    - NEW
    - CHANGED
    - DELETED
  autoExportEvents:
    - NEW
    - CHANGED
  importedFileChunkSize: 1024
  batchImportMetaDataOnCreate: true
