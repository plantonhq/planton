syntax = "proto3";

package dev.planton.aws.awsfsxdatarepositoryassociation.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsfsxdatarepositoryassociation/v1alpha1/outputs.proto";
import "catalog/aws/awsfsxdatarepositoryassociation/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsFsxDataRepositoryAssociation is the API envelope for an Amazon FSx data
// repository association — the composable link between a directory on an FSx
// for Lustre file system and an S3 bucket or prefix, with bidirectional
// auto-import/auto-export sync policies.
message AwsFsxDataRepositoryAssociation {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this resource, must be "AwsFsxDataRepositoryAssociation".
  string kind = 2 [(buf.validate.field).string.const = "AwsFsxDataRepositoryAssociation"];

  // metadata captures identifying information (name, org, environment,
  // labels) and must pass standard validations for resource naming.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the desired configuration of the association.
  AwsFsxDataRepositoryAssociationSpec spec = 4 [(buf.validate.field).required = true];

  // status holds post-deployment information.
  AwsFsxDataRepositoryAssociationStatus status = 5;
}

// AwsFsxDataRepositoryAssociationStatus describes the status of a data
// repository association resource.
message AwsFsxDataRepositoryAssociationStatus {
  // outputs captures the observable values returned by Pulumi/Terraform
  // after provisioning.
  AwsFsxDataRepositoryAssociationOutputs outputs = 1;
}
