# Install fixture consumed by kinds/scenarios that declare AwsMemorydbAcl
# through the e2e-prerequisites annotation (the cluster's composed lane).
# Deliberately EMPTY: MemoryDB accepts an ACL with no members (unlike
# ElastiCache there is no mandatory "default" user), which keeps this
# fixture dependency-free -- a cluster attaching it simply accepts no
# authenticated connections, which is irrelevant to a create-and-destroy
# lane. The membership shape is proven by the ACL's own composed scenario.
# Full metadata is supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsMemorydbAcl
metadata:
  name: planton-oss-e2e-awsmdbacl-prereq
  id: planton-oss-e2e-awsmdbacl-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsmemorydbacl
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
