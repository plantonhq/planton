apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsmemorydbacl
spec:
  # A MemoryDB ACL under live E2E: the composed lane deploys a user fixture
  # (via the e2e-prerequisites annotation) and proves the membership-by-
  # reference seam live. ACL create/update settle in minutes (the provider
  # waits up to 5). Verification is DescribeACLs keyed on the ACL name,
  # state-aware (deleting counts as absent).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
