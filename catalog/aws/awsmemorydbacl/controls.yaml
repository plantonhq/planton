# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsmemorydbacl
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: An ACL stores no database data -- it is a membership list held by the MemoryDB control plane. At-rest encryption of cluster data is the attached cluster's posture.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data store here means no key decision (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: An ACL terminates no connections -- TLS is the attached cluster's setting (and a prerequisite for any member using 'iam' authentication).
    - control_id: no-public-access
      status: not_applicable
      notes: An ACL is not addressable -- it has no endpoint, only a management API governed by IAM. Network exposure belongs to the attached cluster.
    - control_id: restricted-ingress
      status: not_applicable
      notes: Network-level ingress to a cluster is its security groups' job; this ACL restricts which IDENTITIES a cluster authenticates, not where connections come from (see rbac).
    - control_id: edge-protection
      status: not_applicable
      notes: AWS WAF attaches to Layer-7 HTTP entry points; the access-control list of a Redis/Valkey database has no edge surface.
    - control_id: rbac
      status: configurable
      field_path: user_names
      evidence:
        type: spec_default
        reference: Being the attachment point of MemoryDB's access-control system IS this component -- users define WHO and WHAT (identity plus ACL access string), this list defines WHERE by attaching them, as one object, to clusters that each accept exactly one ACL. Membership updates in place, making user_names the single place an application's cluster access is granted or revoked without the cluster ever changing.
      notes: An empty list is valid and fails closed -- a cluster attached to an empty ACL accepts no authenticated connections at all. The ACL only accepts users from its own region.
    - control_id: workload-identity
      status: not_applicable
      notes: Credential mechanisms live on the member users (an AwsMemorydbUser with 'iam' authentication is the keyless path); the ACL carries membership, not credentials.
    - control_id: no-legacy-auth
      status: configurable
      field_path: user_names
      evidence:
        type: spec_default
        reference: Attaching a managed ACL is what keeps a cluster off MemoryDB's one anonymous path -- the built-in "open-access" ACL, which grants every command on every key with no authentication and always exists in the account (referenced by name, deliberately never modeled as a resource here). A cluster attached to THIS ACL authenticates only the listed users, each holding a real credential -- MemoryDB users have no passwordless type, so there is no weak member to smuggle in.
      notes: Unlike ElastiCache there is no mandatory "default" member -- the fail-safe is stronger, because an empty ACL accepts no authenticated connections rather than admitting anonymous ones.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Membership changes (who granted an application cluster access) land in CloudTrail as account-level posture; connection and command logging belong to the attached cluster's configuration.
    - control_id: monitoring-integration
      status: not_applicable
      notes: MemoryDB publishes CloudWatch metrics on cluster and node dimensions; an ACL has no metric dimension and no export knob.
    - control_id: backup-recovery
      status: not_applicable
      notes: An ACL holds no data to back up -- it is a declarative membership list re-creatable from the manifest (deleted users are removed from it server-side automatically, which the provider reconciles).
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist at the ACL level to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: An ACL is a regional control-plane object with no zonal footprint -- zone redundancy is the attached cluster's shard and replica placement.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither AWS nor the modules expose a deletion-protection flag for ACLs. AWS does refuse to delete an ACL still attached to a cluster -- a dependency guard, not a configurable protection.
    - control_id: managed-patching
      status: not_applicable
      notes: An ACL is configuration on a fully managed service -- there is no software of its own to patch.
