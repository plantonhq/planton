syntax = "proto3";

package dev.planton.aws.awsmemorydbacl.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsmemorydbacl/v1alpha1/outputs.proto";
import "catalog/aws/awsmemorydbacl/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsMemorydbAcl represents a MemoryDB Access Control List: the named set of
// users (AwsMemorydbUser) that a MemoryDB cluster authenticates against.
// Grouping identities here — instead of on the cluster — lets one ACL govern
// many clusters and lets access changes apply in place.
message AwsMemorydbAcl {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this MemoryDB ACL resource.
  string kind = 2 [(buf.validate.field).string.const = "AwsMemorydbAcl"];

  // metadata captures identifying information (name, org, version, etc.)
  // and must pass standard validations for resource naming. The name IS the
  // AWS ACL name (max 40 characters) and is create-time immutable.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the core configuration data defining how the ACL is provisioned.
  AwsMemorydbAclSpec spec = 4 [(buf.validate.field).required = true];

  // status holds runtime or post-deployment information.
  AwsMemorydbAclStatus status = 5;
}

// AwsMemorydbAclStatus describes the status fields for a MemoryDB ACL resource.
message AwsMemorydbAclStatus {
  // outputs captures the outputs returned by Pulumi/Terraform after provisioning.
  AwsMemorydbAclOutputs outputs = 1;
}
