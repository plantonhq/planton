apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awss3objectset
spec:
  # An S3 object set under live E2E: two lanes, both riding the shared
  # versioned S3 bucket fixture (the registry-declared AwsS3Bucket
  # prerequisite). The minimal lane proves the single-object lifecycle with
  # every optional dial at its default. The full-surface lane proves three
  # objects at once — metadata/header breadth, a SHA256 upload checksum, an
  # SSE-S3 override, STANDARD_IA placement, a website redirect, tag-merge
  # precedence, a ${...} template introducer in inline content, and the
  # all-versions destroy on the versioned fixture. Excluded arms recorded
  # in the scenarios: acl (the fixture bucket's BucketOwnerEnforced ownership
  # disables ACLs), Object Lock + force_destroy (both need a lock-enabled
  # bucket — S3 rejects the governance-bypass flag on regular buckets,
  # proven live), SSE-KMS (plan/preview-proven via the hack manifest),
  # special-infrastructure storage classes. Verification is the
  # OutputsVerifier path: HeadObject per key in object_etags against
  # bucket_id, absent after destroy.
  # Live dual-engine run 2026-07-10: Pulumi full-surface 58.7s (deploy 13.3s /
  # destroy 6.7s), minimal 50.6s (deploy 12.8s / destroy 6.6s); Terraform
  # full-surface 59.7s (deploy 9.3s / destroy 11.8s), minimal 56.9s (deploy
  # 9.2s / destroy 11.8s) — each incl. the ~24s bucket-fixture chain; all
  # verify stages green; zero-orphan sweep clean. The first Pulumi run caught
  # the force_destroy misuse live (S3 400 "x-amz-bypass-governance-retention
  # is only applicable to Object Lock enabled buckets") — the flag is the
  # governance bypass, not a versioned-cleanup knob.
  tier: 1
  # Re-proven live 2026-08-13, both engines, both scenarios, through the
  # copy_from fold: the default-COPY backup object echoed the SOURCE's
  # content-type AND metadata pairs while GetObjectTagging still carried
  # the set's identity+scenario tags (the always-REPLACE tagging
  # directive); the replace_metadata copy echoed ITS OWN headers and
  # STANDARD_IA placement — identical in both engine windows; all
  # versions gone with the set on the versioned fixture.
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
