syntax = "proto3";

package dev.planton.aws.awss3tablebucket.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awss3tablebucket/v1alpha1/outputs.proto";
import "catalog/aws/awss3tablebucket/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsS3TableBucket {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsS3TableBucket'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsS3TableBucketSpec spec = 4 [(buf.validate.field).required = true];
  AwsS3TableBucketStatus status = 5;
}

message AwsS3TableBucketStatus {
  AwsS3TableBucketOutputs outputs = 1;
}
