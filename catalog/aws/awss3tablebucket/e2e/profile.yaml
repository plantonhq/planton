apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awss3tablebucket
spec:
  # One scenario: bucket + maintenance dials + one namespace + one
  # schema-bearing table with per-table maintenance. Empty storage is
  # free at rest; no fixtures; seconds per lifecycle phase.
  #
  # Deliberately not exercised live:
  #   - bucket-level and table-level replication -- the destination
  #     is another AwsS3TableBucket, the same kind under test, which
  #     the harness's self-kind-prerequisite guard blocks (and the
  #     replication role needs s3tables replication trust). Unblock:
  #     same-kind path-prerequisite support + a replication-trust
  #     role fixture.
  #   - bucket and table resource policies -- a valid policy needs
  #     the harness account id in the principal. Unblock: the
  #     PLANTON_E2E_AWS_ACCOUNT_ID token in the scenario vocabulary.
  #   - KMS encryption -- needs the maintenance-service key grant to
  #     keep compaction alive; the pairing CEL is the load-bearing
  #     guard. Unblock: an AwsKmsKey fixture with the documented
  #     maintenance grant.
  #
  # PROVEN live 2026-08-26 (Q46): both engines through the full
  # six-phase runner + the Terraform blind import round-trip under the
  # armed apply-idempotency gate (~35-55s per engine). TWO catches
  # fixed at the bar: (1) S3 Tables holds a deleted bucket's name in a
  # "transitional state" window (CreateTableBucket 409 across
  # back-to-back engine lanes) - the scenario name is now run-scoped;
  # (2) the create-only Iceberg schema (metadata) is never read back
  # and forces replacement, so a blind import planned a DESTRUCTIVE
  # delete+create - both modules now ignore post-create schema changes
  # (the birth-certificate contract; upstream's own import tests
  # ignore the block).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
