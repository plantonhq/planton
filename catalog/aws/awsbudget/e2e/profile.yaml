apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsbudget
spec:
  # A Budgets budget under live E2E: one lane proves the fixed-limit
  # funding shape, the modern metric + filter-expression generation, a
  # forecast notification, and one folded action (MANUAL approval - the
  # guardrail is staged, never executed, so the shared account's IAM is
  # never actually restricted; the execution role is the consumer-scoped
  # budgets-trusting fixture). Budgets is free (~$0).
  #
  # Deliberately not exercised live:
  #   - planned_limits / auto_adjust funding shapes -- one budget
  #     carries exactly one shape per AWS; the fixed limit is the
  #     canonical form and the other two are render-proven offline.
  #     Unblock: a second scenario when the proof queue wants the
  #     shape datapoints.
  #   - the legacy cost_filter/cost_types generation -- mutually
  #     exclusive with the modern pair the lane proves; render-proven
  #     offline. Unblock: same as above.
  #   - APPLY_SCP_POLICY / RUN_SSM_DOCUMENTS action arms -- SCP needs
  #     an organization (the org-wall class) and SSM stops need a
  #     running instance. Unblock: the org posture reversal / an
  #     AwsEc2Instance fixture.
  #
  # PROVEN live 2026-08-25 (Q43): both engines through the full
  # six-phase runner + the Terraform blind import round-trip under
  # the armed apply-idempotency gate.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
