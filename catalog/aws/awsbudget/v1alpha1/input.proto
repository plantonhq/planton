syntax = "proto3";

package dev.planton.aws.awsbudget.v1alpha1;

import "catalog/aws/awsbudget/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsBudgetIacInput is the input for the IaC modules that manage a
// Budgets budget and its folded actions.
message AwsBudgetIacInput {
  // target is the AwsBudget resource to deploy.
  AwsBudget target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
