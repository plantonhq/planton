# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsbudget
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The budget stores no customer data -- it is a threshold definition over billing data AWS already holds. Its configuration is control-plane metadata in AWS's billing service.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to key (see enc-at-rest); the Budgets API offers no KMS surface.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The budget exposes no network endpoint; it is managed exclusively through the HTTPS-only Budgets API, and notification delivery rides AWS's mail and SNS channels. No plaintext transport option exists to harden.
    - control_id: no-public-access
      status: not_applicable
      notes: Nothing here can be made public -- a budget is reachable only through IAM-authorized Budgets API calls in its own account.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network ingress exists to restrict (see no-public-access).
    - control_id: edge-protection
      status: not_applicable
      notes: No request-serving surface exists; there is no WAF attachment point on a billing threshold.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every operation is IAM-authorized on the budget ARN (and each action's ARN beneath it), and a fired action changes nothing under its own authority -- it executes strictly through the execution role the spec names, so the blast radius of enforcement is exactly that role's policy.
    - control_id: workload-identity
      status: enforced_by_default
      evidence:
        type: spec_validation
        reference: Every actions entry requires execution_role_arn -- budget actions always act as an explicit IAM role with short-lived assumed credentials; no static credential is representable in the spec.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The only access path is the SigV4-signed Budgets API; no legacy or weaker protocol exists to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: The budget has no logging configuration of its own. Management operations and every ExecuteBudgetAction are captured by account-level AWS CloudTrail, and each action keeps its own execution history in the Budgets service -- service behaviors, not manifest choices.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The budget IS spend monitoring -- AWS evaluates it continuously against actual and forecasted cost with nothing to enable, and notifications/actions make breaches actionable at the thresholds the spec pins.
    - control_id: backup-recovery
      status: not_applicable
      notes: Fully declarative -- the budget is re-creatable from the manifest, and the billing data it evaluates lives in AWS's billing service independently of it. Nothing to back up.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Budgets is an account-global service AWS serves from its own infrastructure -- no zonal or regional placement exists anywhere in the spec (region is only the provider's API endpoint).
    - control_id: deletion-protection
      status: not_applicable
      notes: The Budgets API offers no deletion-protection flag. Deleting the budget removes only the guardrail definition -- no data is lost, and the spend it watched is untouched.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- AWS operates and patches the Budgets evaluation and enforcement infrastructure; no customer-visible patch surface exists.
