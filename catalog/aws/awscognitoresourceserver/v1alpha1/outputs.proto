syntax = "proto3";

package dev.planton.aws.awscognitoresourceserver.v1alpha1;

// AwsCognitoResourceServerOutputs captures observable identifiers from a
// provisioned Cognito resource server.
message AwsCognitoResourceServerOutputs {
  // The resource server's identifier within its pool -- the scope prefix
  // access tokens carry (e.g. "https://api.example.com").
  string resource_server_identifier = 1;

  // The fully-qualified scope identifiers this resource server mints, in
  // "{identifier}/{scope_name}" form (e.g. "https://api.example.com/read").
  // These are the exact strings app clients list in allowed_oauth_scopes.
  repeated string scope_identifiers = 2;

  // The user pool this resource server belongs to, resolved from the spec
  // reference. Resource servers are keyed by (pool id, identifier) in AWS,
  // and a consumer holding only this resource gets both halves of that key
  // from its outputs.
  string user_pool_id = 3;
}
