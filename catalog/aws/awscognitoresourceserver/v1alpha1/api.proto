syntax = "proto3";

package dev.planton.aws.awscognitoresourceserver.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awscognitoresourceserver/v1alpha1/outputs.proto";
import "catalog/aws/awscognitoresourceserver/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsCognitoResourceServer is the API envelope for a Cognito resource server
// -- the OAuth 2.0 resource a user pool mints custom access-token scopes for.
message AwsCognitoResourceServer {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this resource, must be "AwsCognitoResourceServer".
  string kind = 2 [(buf.validate.field).string.const = "AwsCognitoResourceServer"];

  // metadata captures identifying information (name, org, environment,
  // labels) and must pass standard validations for resource naming.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the desired configuration of the resource server.
  AwsCognitoResourceServerSpec spec = 4 [(buf.validate.field).required = true];

  // status holds post-deployment information.
  AwsCognitoResourceServerStatus status = 5;
}

// AwsCognitoResourceServerStatus describes the status of a Cognito resource
// server resource.
message AwsCognitoResourceServerStatus {
  // outputs captures the observable values returned by Pulumi/Terraform
  // after provisioning.
  AwsCognitoResourceServerOutputs outputs = 1;
}
