apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awscognitoresourceserver
spec:
  # A resource server under live E2E: the registry-declared AwsCognitoUserPool
  # prerequisite deploys first (seconds), then the resource server proves
  # create, verify (DescribeResourceServer on the composite
  # pool-id/identifier identity), destroy, and verify-destroyed on both
  # provisioners -- every phase is seconds; the scope_identifiers output is
  # covered by the outputs conformance case.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
