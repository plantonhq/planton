# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awscognitoresourceserver
spec:
  aws:
    statements:
      - sid: ManageResourceServer
        actions:
          - cognito-idp:CreateResourceServer
          - cognito-idp:UpdateResourceServer
          - cognito-idp:DeleteResourceServer
          - cognito-idp:DescribeResourceServer
        resources:
          - arn:aws:cognito-idp:*:*:userpool/*
        provenance: derived
        notes: Covers aws_cognito_resource_server, the only resource either module registers (the Pulumi module drives the same provider through the pulumi-aws bridge). Create attaches the resource server to the referenced pool; Update handles in-place scope and name changes (identifier and pool binding are ForceNew and replace via Delete+Create); Describe serves plan/refresh. Cognito resource servers are sub-resources of the pool with no ARN of their own -- the service reference authorizes all four actions on the userpool ARN format, so the pool pattern is the exact scope. The resource carries no tags, so no tagging actions are needed.
