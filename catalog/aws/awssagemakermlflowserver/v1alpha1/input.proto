syntax = "proto3";

package dev.planton.aws.awssagemakermlflowserver.v1alpha1;

import "catalog/aws/awssagemakermlflowserver/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsSagemakerMlflowServerIacInput is the input for the IaC modules
// that deploy the MLflow tracking server.
message AwsSagemakerMlflowServerIacInput {
  // target is the AwsSagemakerMlflowServer resource to deploy.
  AwsSagemakerMlflowServer target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
