# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: awsmanagedprefixlist
spec:
  billing_model: free
  free_tier: A customer-managed prefix list carries no meter -- the VPC pricing page enumerates every charge the VPC service bills (NAT Gateway, IPAM, Network Analysis, Public IPv4 addresses, contiguous IPv4 blocks, VPC Route Server, VPC Peering data, ODB Peering, Encryption Controls) and prefix lists appear in none of them. The list object, its entries, its versions, and its references from security-group rules, NACL rules, and route tables are all free VPC configuration, whether the list holds one CIDR or a thousand.
  notes: "No field of this spec buys anything: address_family, max_entries, and the entries set are pure control-plane configuration. The one cost-adjacent behavior is a QUOTA, not a dollar -- a security-group rule referencing this list consumes max_entries rule-quota slots in that group regardless of how many entries actually exist, so an oversized capacity crowds out other rules without ever billing. The real spend lives on the resources whose rules reference the list -- the instances, load balancers, and endpoints those rules protect bill as their own components, and the traffic the referencing rules admit bills on THEIR data-transfer meters."
