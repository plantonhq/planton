# An IPv4 prefix list with three described entries and capacity
# headroom - standalone (no fixtures), free at AWS, seconds to create.
# Exercises the in-line entry set, max_entries capacity, and the
# version token output.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsManagedPrefixList
metadata:
  name: planton-oss-e2e-awsmpl-min
  id: planton-oss-e2e-awsmpl-min
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsmanagedprefixlist
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  addressFamily: IPv4
  maxEntries: 5
  entries:
    - cidr: 203.0.113.0/24
      description: hq office
    - cidr: 198.51.100.0/24
      description: branch office
    - cidr: 192.0.2.0/24
      description: vpn egress
