# Where each placeholder in this kind's import-ID formats comes
# from (the formats themselves live in aa_import/catalog.yaml).
apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awsmanagedprefixlist
spec:
  values:
    - name: prefix_list_id
      derivations:
        - from_output: prefix_list_id
        - from_arn_part: resource_id
      where_to_find: >-
        VPC console -> Managed prefix lists (the pl-... ID column), or
        `aws ec2 describe-managed-prefix-lists` (PrefixListId).
