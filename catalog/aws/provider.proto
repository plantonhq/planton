syntax = "proto3";

package dev.planton.aws;

import "buf/validate/validate.proto";

// AwsProviderConfig message represents the specification required to connect an AWS Account.
// This message consolidates all necessary input parameters to establish a connection with an AWS Account, ensuring
// accurate configuration and validation of credentials.
// Fields include details like AWS account ID, access credentials, and the region, providing a complete set of
// information for securely connecting to AWS.
// Detailed validation rules have been applied to these fields to ensure input correctness and adherence to
// security protocols.
message AwsProviderConfig {
  // The AWS Account ID, which uniquely identifies the AWS account.
  // This is a mandatory field and must be a numeric string.
  // The value cannot be empty and must only contain numbers (0-9).
  // For more information do refer this link https://docs.aws.amazon.com/accounts/latest/reference/manage-acct-identifiers.html
  string account_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "spec.aws.account_id"
      message: "Only numbers (0-9) are allowed"
      expression: "this.matches('^[0-9]+$')"
    }
  ];

  // The AWS Access Key ID, which is used to authenticate API requests to AWS services.
  // Required for static-credential auth; left empty for keyless web-identity auth
  // (see web_identity below). When present, it must start with either 'AKIA'
  // (long-term credentials) or 'ASIA' (temporary security credentials) followed by
  // 16 alphanumeric characters, for a total of 20 characters. The format rules are
  // skipped when the field is empty (IGNORE_IF_ZERO_VALUE) so keyless configs validate.
  // For more information do refer this link https://docs.aws.amazon.com/IAM/latest/UserGuide/access-keys-admin-managed.html
  string access_key_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.len = 20,
    (buf.validate.field).cel = {
      id: "spec.access_key_id.prefix"
      message: "Must start with 'AKIA' (long-term) or 'ASIA' (temporary)"
      // https://regex101.com/r/QgVmCf/1
      expression: "this.matches('^A(K|S)IA.*')"
    },
    (buf.validate.field).cel = {
      id: "spec.access_key_id.format"
      message: "Must start with 'AKIA' or 'ASIA' followed by 16 alphanumeric characters"
      // https://regex101.com/r/LybhZA/1
      expression: "this.matches('^.{4}[a-zA-Z0-9]{16}$')"
    }
  ];

  // The AWS Secret Access Key, used together with the access key ID to authenticate API requests to AWS services.
  // Required for static-credential auth; left empty for keyless web-identity auth
  // (see web_identity below). When present, the value must be exactly 40 characters
  // consisting of numbers, lowercase and uppercase letters, slashes (/), and plus
  // signs (+). The format rule is skipped when the field is empty (IGNORE_IF_ZERO_VALUE).
  // For more information do refer this link https://docs.aws.amazon.com/IAM/latest/UserGuide/access-keys-admin-managed.html
  string secret_access_key = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.len = 40,
    (buf.validate.field).cel = {
      id: "spec.aws.secret_access_key"
      message: "The provided AWS Secret Access Key is invalid. It must contain exactly 40 characters consisting of numbers, lowercase and uppercase letters, slashes (/), and plus signs (+). Please double-check your input and try again."
      //https://regex101.com/r/YlvVRM/1
      expression: "this.matches('^[0-9a-zA-Z/+]{40}$')"
    }
  ];

  // The AWS region to be used when configuring this AWS credential.
  // This optional field allows specifying the region in which resources will be created or managed.
  // For more information do refer this link https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.RegionsAndAvailabilityZones.html
  string region = 4 [(buf.validate.field).required = true];

  // The AWS Session Token, required when using temporary security credentials.
  // This field is optional and only needed when using temporary credentials obtained through
  // AWS STS operations (e.g., AssumeRole, GetSessionToken).
  // Temporary credentials have Access Key IDs starting with 'ASIA'.
  // For more information refer to https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_temp.html
  string session_token = 5;

  // Keyless web-identity (OIDC) authentication. When set, the provider authenticates
  // via STS AssumeRoleWithWebIdentity instead of static access keys -- so access_key_id
  // and secret_access_key are left empty in this mode. Exactly one of {static keys,
  // web_identity} is populated; if neither is set the provider is built with region only.
  AwsWebIdentityProviderConfig web_identity = 6;

  // Ordered STS role-assumption chain applied AFTER the base credentials resolve
  // (static keys, web-identity exchange, or the ambient chain) -- each hop assumes
  // the next role using the previous hop's credentials, mirroring the Terraform AWS
  // provider's repeated assume_role blocks (chained evaluation, provider >= 5.0).
  // Composes with every base-credential mode: an enterprise whose deploy role is
  // reachable only through an intermediate role expresses the full path here.
  // On OpenTofu this rides the generated provider-override file (assume_role has no
  // environment-variable form); on Pulumi it maps to the classic provider's
  // assumeRoles list. The pulumi-aws-native provider supports at most ONE hop and
  // fails loudly on longer chains rather than silently truncating the identity path.
  repeated AwsAssumeRole assume_role_chain = 7;

  // Provider-level default tags applied to every taggable resource the module
  // creates (merged with, and overridden by, each resource's own tags). Maps to the
  // Terraform provider's default_tags block and the Pulumi providers' defaultTags.
  // The enterprise tagging-policy answer: cost-center/ownership tags land on every
  // resource without any module or spec cooperation.
  AwsDefaultTags default_tags = 8;

  // Per-service endpoint overrides keyed by the Terraform provider's endpoints-block
  // attribute name (e.g. "sts", "s3", "dynamodb"), each value a base URL. Used for
  // private interface endpoints, FIPS endpoints, and API-compatible substitutes.
  // An unknown service key fails loudly at provider configuration on both engines --
  // never silently ignored, since a mis-keyed endpoint override would silently send
  // traffic to the public endpoint instead.
  map<string, string> endpoints = 9;

  // Maximum number of retries for AWS API calls. Explicit presence: unset means the
  // provider default (25); zero is a meaningful value disabling retries entirely.
  optional int32 max_retries = 10;

  // Retry mode for AWS API calls: "standard" or "adaptive" (empty = provider
  // default). Maps to the Terraform provider's retry_mode / AWS_RETRY_MODE. The
  // pulumi-aws-native provider has no retry-mode surface and fails loudly when this
  // is set rather than deploying with silently different retry semantics.
  string retry_mode = 11 [(buf.validate.field).cel = {
    id: "spec.aws.retry_mode"
    message: "retry_mode must be 'standard' or 'adaptive' (or empty for the provider default)"
    expression: "this == '' || this == 'standard' || this == 'adaptive'"
  }];
}

// AwsAssumeRole models one hop of an STS role-assumption chain -- the full
// configurable surface of the Terraform AWS provider's assume_role block at the
// pinned provider version. Hops are evaluated in declaration order; each assumes
// its role with the credentials produced by the previous hop (the first hop uses
// the provider's base credentials).
message AwsAssumeRole {
  // ARN of the IAM role to assume. Required on every hop.
  string role_arn = 1 [(buf.validate.field).required = true];

  // Session name recorded on the STS session (visible in CloudTrail). Provider
  // default applies when empty.
  string session_name = 2;

  // External ID required by the role's trust policy (the confused-deputy guard
  // third parties commonly mandate). Omitted when empty.
  string external_id = 3;

  // Session duration string (e.g. "1h", "30m"). Provider default applies when empty.
  string duration = 4;

  // IAM policy JSON further restricting the session's permissions (session policy).
  string policy = 5;

  // ARNs of managed policies to attach as session policies.
  repeated string policy_arns = 6;

  // Session tags passed to STS AssumeRole.
  map<string, string> tags = 7;

  // Keys of session tags that persist across subsequent hops in the chain
  // (transitive session tags).
  repeated string transitive_tag_keys = 8;

  // Source identity recorded on the session (sts:SourceIdentity), for tracing the
  // original caller through the chain.
  string source_identity = 9;
}

// AwsDefaultTags mirrors the Terraform AWS provider's default_tags block: tags the
// provider applies to every taggable resource, merged beneath each resource's own
// tags (resource tags win on key conflicts).
message AwsDefaultTags {
  // The tags applied to every taggable resource.
  map<string, string> tags = 1;
}

// AwsWebIdentityProviderConfig holds the inputs for keyless OIDC federation: the caller mints
// a short-lived OIDC JWT from an issuer it controls, and the AWS provider exchanges it for
// credentials via STS AssumeRoleWithWebIdentity into the target role. The token is opaque to
// Planton, which is agnostic to the issuer (a platform-owned issuer, GitHub Actions, GitLab
// CI, etc.).
//
// The token is carried in memory (web_identity_token) and never written to disk: each pulumi
// operation re-mints a fresh JWT before it runs, so an Infra Job's runtime is never bound by a
// single token's TTL and no file-based provider refresh is needed.
//
// These provider-config fields are constructed by the caller (e.g. the Planton runner) at deploy
// time, not supplied as user input in a resource spec, so they are intentionally outside the spec
// secret-coverage surface and carry no `sensitive` annotation.
//
// Exchange site differs by provider: the pulumi-aws "classic" provider performs the exchange
// itself from web_identity_token, whereas pulumi-aws-native has no web-identity support
// (upstream pulumi/pulumi-aws-native#1042) so its builder performs the STS exchange and injects
// the resulting temporary credentials.
message AwsWebIdentityProviderConfig {
  // Retired field slot. Reserved so the wire number and name are never reused
  // for a different meaning.
  reserved 5;
  reserved "chained_assume_roles";

  // The minted OIDC JWT presented to STS, supplied inline (in memory). Maps to pulumi-aws
  // ProviderAssumeRoleWithWebIdentity.WebIdentityToken.
  string web_identity_token = 1 [(buf.validate.field).required = true];

  // ARN of the target (customer) role assumed with the web identity.
  string role_arn = 2 [(buf.validate.field).required = true];

  // Optional session name for the web-identity assumption. Provider default applies when empty.
  string session_name = 3;

  // Optional session duration string (e.g. "1h"). Provider default applies when empty.
  string duration = 4;
}
