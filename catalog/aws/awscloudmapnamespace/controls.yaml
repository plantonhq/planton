# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awscloudmapnamespace
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The namespace stores discovery metadata (service names, instance addresses, attributes) -- control-plane registry data AWS holds service-side, not customer data with an encryption dial.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to key (see enc-at-rest); the Cloud Map API offers no KMS surface.
    - control_id: enc-in-transit
      status: not_applicable
      notes: Management and DiscoverInstances ride the HTTPS-only Cloud Map API; DNS discovery is the DNS protocol on the hosted zone. Neither leg has a plaintext option this spec could harden.
    - control_id: no-public-access
      status: configurable
      field_path: type
      evidence:
        type: spec_default
        reference: The type decides visibility -- PRIVATE_DNS publishes records only inside the paired VPC and HTTP namespaces answer only IAM-authorized DiscoverInstances calls, while PUBLIC_DNS deliberately publishes internet-resolvable records. Both catalog presets stay private (PRIVATE_DNS and HTTP).
    - control_id: restricted-ingress
      status: not_applicable
      notes: The namespace exposes no network surface of its own -- reachability of the REGISTERED endpoints is those workloads' security-group posture, decided on their components.
    - control_id: edge-protection
      status: not_applicable
      notes: No request-serving surface exists; there is no WAF attachment point on a service registry.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every namespace, service, and registration operation -- including DiscoverInstances lookups on HTTP namespaces -- is IAM-authorized on the namespace/service ARN, so who can register, deregister, and discover is entirely IAM posture.
    - control_id: workload-identity
      status: not_applicable
      notes: The namespace runs no workload and holds no credentials -- registered instances are addresses and attributes, not identities.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The API path is SigV4-signed; the DNS path is the DNS protocol by design (private to the VPC unless the type is PUBLIC_DNS). No legacy protocol exists to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Management and registration operations are captured by account-level AWS CloudTrail -- a service behavior, not a manifest choice. DNS query logging would live on the hosted zone, outside this spec.
    - control_id: monitoring-integration
      status: configurable
      field_path: services
      evidence:
        type: spec_default
        reference: Health awareness is per service -- health_check_custom_config (any namespace type) gates discovery on a heartbeat the workload pushes, and health_check_config (public DNS only) creates Route 53 health checks that probe registered endpoints. Services without either serve every registration as healthy.
    - control_id: backup-recovery
      status: not_applicable
      notes: The declared surface (namespace, services, static instances) is fully re-creatable from the manifest. Runtime registrations are ephemeral by design -- their owners re-register on restart; there is no state to back up.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The registry is a regional AWS-operated service with no zonal placement in the spec; the availability topology of REGISTERED endpoints belongs to those workloads.
    - control_id: deletion-protection
      status: not_applicable
      notes: No deletion-protection flag exists on namespaces or services -- the spec's force_destroy is the OPPOSITE lever, an escape hatch that force-deregisters everything at destroy; leaving it false keeps AWS's refuse-to-delete-non-empty behavior, the practical guard against accidental teardown.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- AWS operates and patches the registry and discovery infrastructure; no customer-visible patch surface exists.
