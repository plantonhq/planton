# Minimal AwsElasticacheUserGroup scenario: a Redis group whose membership
# references the AwsElasticacheUser prerequisite pair by output — proving
# composed user_ids references end to end. AWS refuses to create a group
# without a member whose user NAME is "default"; the prerequisite publishes
# that user alongside an application user. Full metadata is supplied for
# tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsElasticacheUserGroup
metadata:
  name: planton-oss-e2e-ecug-smoke
  id: planton-oss-e2e-ecug-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awselasticacheusergroup
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  engine: redis
  userIds:
    - valueFrom:
        kind: AwsElasticacheUser
        name: planton-oss-e2e-ecuser-default-prereq
        fieldPath: status.outputs.user_id
    - valueFrom:
        kind: AwsElasticacheUser
        name: planton-oss-e2e-ecuser-app-prereq
        fieldPath: status.outputs.user_id
