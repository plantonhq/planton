# AwsElasticacheUserGroup install profile used as a prerequisite by composed
# kinds (RBAC-enabled replication groups and serverless caches). A Redis
# group whose membership references the AwsElasticacheUser prerequisite pair
# by output — the standard production shape with a locked-down default user
# plus one application user. Full metadata is supplied for tagging/orphan
# cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsElasticacheUserGroup
metadata:
  name: planton-oss-e2e-ecug-prereq
  id: planton-oss-e2e-ecug-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awselasticacheusergroup
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  engine: redis
  userIds:
    - valueFrom:
        kind: AwsElasticacheUser
        name: planton-oss-e2e-ecuser-default-prereq
        fieldPath: status.outputs.user_id
    - valueFrom:
        kind: AwsElasticacheUser
        name: planton-oss-e2e-ecuser-app-prereq
        fieldPath: status.outputs.user_id
