# Consumer-scoped AwsIamRole install profile: the execution role DLM
# assumes to create, tag, and delete snapshots. The trust is
# dlm.amazonaws.com; the inline policy mirrors AWS's managed
# AWSDataLifecycleManagerServiceRole permissions for snapshot
# policies. Scoping the fixture here keeps the dlm-trust shape off
# the shared fixed-name set (the concurrent-session collision class).
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  name: planton-oss-e2e-awsdlm-exec
  id: planton-oss-e2e-awsdlm-exec
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsiamrole
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E execution role for Data Lifecycle Manager
  trustPolicy:
    Version: "2012-10-17"
    Statement:
      - Effect: Allow
        Principal:
          Service: dlm.amazonaws.com
        Action: sts:AssumeRole
  inlinePolicies:
    dlmSnapshotE2E:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Action:
            - ec2:CreateSnapshot
            - ec2:CreateSnapshots
            - ec2:DeleteSnapshot
            - ec2:DescribeInstances
            - ec2:DescribeVolumes
            - ec2:DescribeSnapshots
            - ec2:EnableFastSnapshotRestores
            - ec2:DescribeFastSnapshotRestores
            - ec2:DisableFastSnapshotRestores
            - ec2:CopySnapshot
            - ec2:ModifySnapshotAttribute
            - ec2:DescribeSnapshotAttribute
          Resource: "*"
        - Effect: Allow
          Action:
            - ec2:CreateTags
          Resource: arn:aws:ec2:*::snapshot/*
