# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: awsdlmlifecyclepolicy
spec:
  billing_model: free
  free_tier: "The policy object never bills. AWS's own Data Lifecycle Manager page says the service provides 'a complete lifecycle management and backup solution for Amazon Elastic Compute Cloud (EC2) instances and individual EBS volumes at no additional cost' -- no meter counts policies, schedules, or the automation runs that fire them, in either mode (the simplified default policy or the full custom engine), enabled or disabled. This is a permanent property of the service, not a trial."
  notes: "Free object, expensive consequences -- this is the loud part: a RUNNING schedule is a standing purchase order for EBS snapshots, and every snapshot it creates is ANOTHER object that bills EBS snapshot storage per GB-month for as long as retention holds it. An hourly keep-24 schedule maintains a rolling fleet of 24 snapshots per tagged volume, forever. The spend scales with what the target_tags MATCH, which this manifest cannot see: the same policy costs nothing in an account with no matching tagged volumes and real, recurring money the day a team tags a fleet. Schedule options fan the spend out further, each onto its own referenced object: cross_region_copy_rules add inter-region snapshot-copy data transfer plus destination-region snapshot storage (and KMS requests on the destination cmk_arn when re-encrypting); archive_rule moves aging snapshots to the EBS archive tier (cheaper per GB, with the archive tier's own minimum-retention billing rules); fast_restore_rule is the sharpest edge -- fast snapshot restore bills per snapshot per availability zone for every hour it stays enabled, and a schedule that enables FSR on each new snapshot compounds it; IMAGE_MANAGEMENT policies register AMIs whose backing snapshots bill the same storage meters. All of that lands on the snapshot, AMI, transfer, and KMS line items -- never on this policy -- and deleting the policy stops future creation without deleting a single existing snapshot (with extend_deletion / retain-past-deletion semantics deciding what cleanup ever happens)."
