apiVersion: aws.planton.dev/v1alpha1
kind: AwsRoute53DnsRecord
metadata:
  name: my-a-record
spec:
  region: us-east-1
  zoneId:
    value: "<route53-hosted-zone-id>"
  name: app.example.com  # replace with your record's fully qualified name
  type: A
  ttl: 300  # 5 minutes; a sensible default for most records (0 = never cache; AWS accepts up to 2147483647)
  values:
    - value: 192.0.2.10  # replace with your endpoint's IPv4 address
