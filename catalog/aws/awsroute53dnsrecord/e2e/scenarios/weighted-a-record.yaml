# Weighted AwsRoute53DnsRecord scenario: a multi-value A record in the
# prerequisite zone with a weighted routing policy and its set_identifier —
# the canary-deployment shape. The zone_id resolves from the AwsRoute53Zone
# prerequisite's outputs (the kind's registry prerequisite), and the record
# name lives UNDER the prerequisite zone's domain so Route 53 accepts it.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsRoute53DnsRecord
metadata:
  name: planton-oss-e2e-awsroute53dnsrecord-weighted
  id: planton-oss-e2e-awsroute53dnsrecord-weighted
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsroute53dnsrecord
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  zoneId:
    valueFrom:
      kind: AwsRoute53Zone
      name: planton-oss-e2e-prereq.planton.test
      fieldPath: status.outputs.zone_id
  name: canary.planton-oss-e2e-prereq.planton.test
  type: A
  ttl: 60
  values:
    - value: 192.0.2.10
    - value: 192.0.2.11
  setIdentifier: canary
  routingPolicy:
    weighted:
      weight: 10
