# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: awslblistenerrule
spec:
  billing_model: free
  free_tier: A listener rule is a condition-action routing entry on an ALB listener, and Elastic Load Balancing meters the load balancer, never its rules -- the bill is the load balancer's hourly rate plus its LCU (capacity unit) usage, with no per-rule fee at any rule count.
  notes: "The rule OBJECT is free, but rule EVALUATIONS are one of the four LCU dimensions the parent ALB bills on: each hour AWS charges the highest of new connections, active connections, processed bytes, and rule evaluations, where rule evaluations are the number of rules processed per request times the request rate (the first 10 processed rules per request are ignored). One rule on a quiet listener changes nothing; dozens of rules evaluated ahead of a high-traffic route can make rule evaluations the dominant LCU dimension and raise the ALB's bill -- so deep rule chains have a real cost that lands on the load balancer's meter, never on this object. Everything else here is configuration: conditions, transforms, and priority buy nothing, authenticate actions hand off to Cognito or an external IdP billed on their own terms, and forwarded traffic lands on targets billed as their own components."
