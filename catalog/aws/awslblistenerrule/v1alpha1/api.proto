syntax = "proto3";

package dev.planton.aws.awslblistenerrule.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awslblistenerrule/v1alpha1/outputs.proto";
import "catalog/aws/awslblistenerrule/v1alpha1/spec.proto";
import "shared/metadata.proto";

//aws-lb-listener-rule
message AwsLbListenerRule {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsLbListenerRule'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsLbListenerRuleSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsLbListenerRuleStatus status = 5;
}

//aws-lb-listener-rule status
message AwsLbListenerRuleStatus {
  //outputs
  AwsLbListenerRuleOutputs outputs = 1;
}
