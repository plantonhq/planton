syntax = "proto3";

package dev.planton.aws.awslblistenerrule.v1alpha1;

// AwsLbListenerRuleOutputs captures the observable outputs of a
// provisioned listener rule.
message AwsLbListenerRuleOutputs {
  // The ARN of the rule (e.g. "arn:aws:elasticloadbalancing:us-west-2:
  // 123456789012:listener-rule/app/api/50dc.../f2f7.../9683b2d02a6cabee").
  // The handle audit tooling and imports reference.
  string rule_arn = 1;

  // The priority AWS assigned to the rule -- meaningful when the spec left
  // priority unset and AWS picked the next free slot.
  string priority = 2;
}
