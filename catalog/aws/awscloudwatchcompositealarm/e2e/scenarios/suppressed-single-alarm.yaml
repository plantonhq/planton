# Composite alarm scenario over the AwsCloudwatchAlarm prerequisite fixture:
# the rule references the fixture by its CloudWatch NAME (rule text passes
# through verbatim — the same composition class as metric-math expression
# variables), while the actions suppressor resolves the SAME fixture through
# a valueFrom reference against its alarm_name output — both composition
# paths proven in one lane. actionsEnabled is false (and ForceNew on this
# resource), keeping the lane side-effect free.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsCloudwatchCompositeAlarm
metadata:
  name: planton-oss-e2e-awscwcompositealarm
  id: planton-oss-e2e-awscwcompositealarm
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awscloudwatchcompositealarm
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  alarmRule: 'ALARM("planton-oss-e2e-awscloudwatchalarm-prereq")'
  alarmDescription: "Planton E2E composite over the prerequisite CPU alarm (actions disabled)"
  actionsEnabled: false
  actionsSuppressor:
    alarm:
      valueFrom:
        kind: AwsCloudwatchAlarm
        name: planton-oss-e2e-awscloudwatchalarm-prereq
        fieldPath: status.outputs.alarm_name
    waitPeriod: 60
    extensionPeriod: 60
