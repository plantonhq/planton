apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awscloudwatchcompositealarm
spec:
  # A CloudWatch composite alarm under live E2E: the registry-declared
  # AwsCloudwatchAlarm prerequisite deploys first (the simple-metric CPU
  # fixture), then the composite's rule references it by its CloudWatch name
  # and the actions suppressor resolves the same fixture's alarm_name output
  # — proving both composition paths (rule text by name, suppressor by ref)
  # live. Actions are disabled so the lane is side-effect free. Deploy ->
  # DescribeAlarms (CompositeAlarm type) verify -> destroy ->
  # verify-destroyed on both provisioners; the chain creates in seconds.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 10
  # 2026-08-13 tag-convergence sweep: the Terraform module's metadata.labels
  # merge into cloud tags was dropped (the canonical six-key identity map --
  # user labels are platform metadata). Declared-set equality is now
  # machine-enforced by hack/guards/ensure_cross_engine_tag_keys.sh; the
  # change class is live-re-proven once via Q31 (awscloudwatchloggroup
  # represents it).
