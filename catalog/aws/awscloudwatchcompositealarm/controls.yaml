# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awscloudwatchcompositealarm
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The composite alarm stores no customer data; it is a boolean rule over the states of other alarms. The spec carries configuration only -- the rule text and action ARNs.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to encrypt (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: No network endpoint of its own -- created and read exclusively through the AWS CloudWatch API, evaluated inside the service. There is no plaintext transport option anywhere in the spec or modules to harden.
    - control_id: no-public-access
      status: not_applicable
      notes: No network surface exists -- the composite alarm is reachable only through IAM-authorized CloudWatch API calls, never as an addressable endpoint.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network ingress exists to restrict (see no-public-access).
    - control_id: edge-protection
      status: not_applicable
      notes: No inbound request traffic exists to filter.
    - control_id: rbac
      status: not_applicable
      notes: Management access is AWS-account IAM posture, not a component choice; the composite alarm exposes no authentication plane of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The composite alarm runs no workloads and holds no credentials. Its actions name target ARNs (SNS topics or Systems Manager OpsItems); CloudWatch invokes them as the service.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths of its own -- the only access path is the IAM-authorized CloudWatch API.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: No logging configuration of its own. Administrative changes are captured by account-level AWS CloudTrail, and state transitions are recorded in CloudWatch alarm history -- both service behaviors, not manifest choices. The actions_suppressor withholds actions, never the state record.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: spec_validation
        reference: alarm_rule is a required field -- a composite alarm without a boolean expression over other alarms' states is unrepresentable, so every instance of this component exists to combine and route monitoring signals.
      notes: alarm_actions, ok_actions, and insufficient_data_actions route the combined state to SNS topics or OpsItems. actions_suppressor silences actions (not evaluation) while a designated maintenance alarm is in ALARM -- the deliberate quiet-hours mechanism.
    - control_id: backup-recovery
      status: not_applicable
      notes: Stateless rule -- no data to back up. The configuration is declarative and re-creatable from the manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: A regional CloudWatch construct with no zonal placement anywhere in the spec or modules -- there is no availability topology for a manifest to get right or wrong.
    - control_id: deletion-protection
      status: not_applicable
      notes: The CloudWatch alarm API offers no deletion-protection flag; neither the spec nor the provider resource carries one. Note that actions_enabled is create-time-only on composite alarms (ForceNew) -- changing it replaces the alarm.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- AWS operates and patches the CloudWatch evaluation infrastructure; no customer-visible patch surface exists.
