syntax = "proto3";

package dev.planton.aws.awscloudwatchcompositealarm.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awscloudwatchcompositealarm/v1alpha1/outputs.proto";
import "catalog/aws/awscloudwatchcompositealarm/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsCloudwatchCompositeAlarm is the API envelope for a CloudWatch composite
// alarm — the boolean combination of other alarms' states that pages once
// for a shared-cause outage, expresses alerting dependencies, and gates
// actions behind maintenance suppression.
message AwsCloudwatchCompositeAlarm {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this resource, must be "AwsCloudwatchCompositeAlarm".
  string kind = 2 [(buf.validate.field).string.const = "AwsCloudwatchCompositeAlarm"];

  // metadata captures identifying information (name, org, environment,
  // labels) and must pass standard validations for resource naming.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the desired configuration of the composite alarm.
  AwsCloudwatchCompositeAlarmSpec spec = 4 [(buf.validate.field).required = true];

  // status holds post-deployment information.
  AwsCloudwatchCompositeAlarmStatus status = 5;
}

// AwsCloudwatchCompositeAlarmStatus describes the status of a CloudWatch
// composite alarm resource.
message AwsCloudwatchCompositeAlarmStatus {
  // outputs captures the observable values returned by Pulumi/Terraform
  // after provisioning.
  AwsCloudwatchCompositeAlarmOutputs outputs = 1;
}
