syntax = "proto3";

package dev.planton.aws.awsvpc.v1alpha1;

// AwsVpcOutputs captures the observable outputs of a provisioned VPC, for
// downstream resources (subnets, gateways, security groups, ...) to reference.
message AwsVpcOutputs {
  // The ID of the VPC (e.g. "vpc-0abc123"). The primary handle other resources
  // reference via status.outputs.vpc_id.
  string vpc_id = 1;

  // The ARN of the VPC.
  string vpc_arn = 2;

  // The primary IPv4 CIDR block of the VPC (e.g. "10.0.0.0/16"). Reflects the
  // allocated block even when it was assigned from IPAM.
  string cidr_block = 3;

  // The IPv6 CIDR block associated with the VPC (e.g.
  // "2600:1f18:abcd:1200::/56"), empty when the VPC is IPv4-only.
  string ipv6_cidr_block = 4;

  // The AWS account ID that owns the VPC.
  string owner_id = 5;

  // The ID of the VPC's main route table. Subnets with no explicit route-table
  // association use this table.
  string main_route_table_id = 6;

  // The ID of the default security group created with the VPC.
  string default_security_group_id = 7;

  // The ID of the default network ACL created with the VPC.
  string default_network_acl_id = 8;

  // The ID of the default route table created with the VPC (equal to the main
  // route table).
  string default_route_table_id = 9;

  // The region the VPC was created in (mirrors spec.region, included for
  // convenience).
  string region = 10;

  // The association IDs ("vpc-cidr-assoc-...") of the secondary IPv4 CIDR
  // blocks, keyed exactly as the module keys each association: by the
  // entry's literal CIDR, or "ipam-<index>" for IPAM-sized entries. These
  // are the handles `aws ec2 disassociate-vpc-cidr-block` and state import
  // take; AWS generates them at association time.
  map<string, string> secondary_ipv4_cidr_association_ids = 11;

  // The association IDs of the secondary IPv6 CIDR blocks, keyed exactly as
  // the module keys each association: by the entry's pinned CIDR, or
  // "ipv6-<index>" for Amazon-provided/BYOIP-pool/IPAM entries.
  map<string, string> secondary_ipv6_cidr_association_ids = 12;

  // The ID ("vpcec-...") of the VPC Encryption Control resource, empty when
  // spec.encryption_control is not configured.
  string encryption_control_id = 13;
}
