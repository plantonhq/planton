apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awsvpc
spec:
  # A VPC's identity is the AWS-assigned "vpc-..." id -- discoverable from a
  # prior deploy's outputs or one pasted ARN, never derivable from the spec.
  values:
    - name: vpc_id
      derivations:
        - from_output: vpc_id
        - from_arn_part: resource_id
      where_to_find: >-
        VPC console -> Your VPCs (the VPC ID column), or
        `aws ec2 describe-vpcs` (VpcId).
    - name: cidr_association_id
      derivations:
        # Association IDs are AWS-generated (the CIDR key on the module's
        # for_each is config-time identity, never the ID), so the module
        # exports them keyed by the same key. One placeholder serves both
        # association resources: the ordered lookups cannot collide because
        # the two maps' key spaces are disjoint (IPv4 vs IPv6 CIDR formats;
        # "ipam-" vs "ipv6-" index prefixes).
        - from_output_keyed_by_address: secondary_ipv4_cidr_association_ids
        - from_output_keyed_by_address: secondary_ipv6_cidr_association_ids
      where_to_find: >-
        `aws ec2 describe-vpcs --vpc-ids <vpc-id>` -> CidrBlockAssociationSet
        (IPv4) or Ipv6CidrBlockAssociationSet (IPv6) -> AssociationId
        ("vpc-cidr-assoc-..."), one per secondary CIDR block.
    - name: vpc_encryption_control_id
      derivations:
        # One encryption control per VPC (count-gated singleton), so the
        # plain scalar output serves it.
        - from_output: encryption_control_id
      where_to_find: >-
        `aws ec2 describe-vpc-encryption-controls` -> the control whose
        VpcId matches ("vpcec-...").
