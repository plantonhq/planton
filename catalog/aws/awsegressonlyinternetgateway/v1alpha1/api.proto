syntax = "proto3";

package dev.planton.aws.awsegressonlyinternetgateway.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsegressonlyinternetgateway/v1alpha1/outputs.proto";
import "catalog/aws/awsegressonlyinternetgateway/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsEgressOnlyInternetGateway is the top-level resource representing an
// egress-only (IPv6 outbound-only) internet gateway attached to an AWS Virtual
// Private Cloud (VPC).
message AwsEgressOnlyInternetGateway {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsEgressOnlyInternetGateway'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AwsEgressOnlyInternetGatewaySpec spec = 4 [(buf.validate.field).required = true];

  // status
  AwsEgressOnlyInternetGatewayStatus status = 5;
}

// AwsEgressOnlyInternetGatewayStatus holds the outputs produced by deploying an
// AwsEgressOnlyInternetGateway.
message AwsEgressOnlyInternetGatewayStatus {
  // outputs
  AwsEgressOnlyInternetGatewayOutputs outputs = 1;
}
