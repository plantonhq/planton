# Where each placeholder in this component's import-ID formats comes
# from (the formats themselves live in aa_import/catalog.yaml). The
# canary imports by name, groups by name (the for_each key), and each
# association by "{canary_arn},{group_name}".
apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awscloudwatchsynthetics
spec:
  values:
    - name: canary_name
      derivations:
        - from_metadata_name: true
      where_to_find: >-
        The canary's name (metadata.name) -- CloudWatch console ->
        Synthetics canaries, or `aws synthetics describe-canaries`
        (Name).
    - name: canary_arn
      derivations:
        - from_output: canary_arn
      where_to_find: >-
        The canary's ARN -- `aws synthetics describe-canaries` (Arn).
    - name: group_name
      derivations:
        - from_address_key: true
      where_to_find: >-
        The group's name -- the spec's groups/group_names entry (owned
        groups and joins are keyed by it), or `aws synthetics
        list-groups` (Name).
