apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awscloudwatchsynthetics
spec:
  # A heartbeat canary (created READY, never started - runs are what
  # Synthetics bills, so the lane is ~$0), an owned group, and the
  # canary's join. deleteLambda proves the clean-teardown arm.
  #
  # Deliberately not exercised live:
  #   - startCanary: true -- each run bills (~$0.0012/run) and the READY
  #     canary already proves create/update/delete plus the managed
  #     Lambda lifecycle. Unblock: a costed lane when the proof queue
  #     wants run-artifact evidence.
  #   - vpc_config -- the probe targets nothing private; the arm is
  #     offline-proven. Unblock: compose AwsSubnet/AwsSecurityGroup
  #     fixtures via scenario annotations when a private-endpoint
  #     datapoint is wanted.
  #   - SSE_KMS artifact encryption -- the default SSE_S3 proves the
  #     encryption path. Unblock: an AwsKmsKey fixture via scenario
  #     annotations.
  #
  # PROVEN live 2026-08-25 (Q44): both engines through the full
  # six-phase runner + the Terraform blind import round-trip under the
  # armed apply-idempotency gate. Two catches fixed at the bar: the
  # harness verifier learned GetCanary's untyped not-found (the SDK
  # surfaces it as a generic API error), and the never-read-back
  # code-source family (s3_bucket/s3_key/s3_version/zip_file) +
  # start_canary are declared config-only in the import catalog.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
