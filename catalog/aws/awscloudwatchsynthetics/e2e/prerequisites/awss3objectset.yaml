# Consumer-scoped AwsS3ObjectSet install profile for the canary's code
# bundle: a Synthetics-layout zip (nodejs/node_modules/heartbeat.js -
# the runtime convention, NOT the Lambda layout the shared object-set
# fixture stages) carrying a no-network heartbeat script. Staged into
# the shared versioned bucket fixture.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsS3ObjectSet
metadata:
  name: planton-oss-e2e-awssyn-code
  id: planton-oss-e2e-awssyn-code
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awss3objectset
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  bucket:
    valueFrom:
      kind: AwsS3Bucket
      name: planton-oss-e2e-awss3bucket-prereq
      fieldPath: status.outputs.bucket_id
  objects:
    - key: e2e/canary-heartbeat.zip
      content_base64: 
      content_type: application/zip
