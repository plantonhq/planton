syntax = "proto3";

package dev.planton.aws.awscloudwatchsynthetics.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awscloudwatchsynthetics/v1alpha1/outputs.proto";
import "catalog/aws/awscloudwatchsynthetics/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsCloudwatchSynthetics {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsCloudwatchSynthetics'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsCloudwatchSyntheticsSpec spec = 4 [(buf.validate.field).required = true];
  AwsCloudwatchSyntheticsStatus status = 5;
}

message AwsCloudwatchSyntheticsStatus {
  AwsCloudwatchSyntheticsOutputs outputs = 1;
}
