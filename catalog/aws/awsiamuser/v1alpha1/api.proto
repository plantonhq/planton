syntax = "proto3";

package dev.planton.aws.awsiamuser.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsiamuser/v1alpha1/outputs.proto";
import "catalog/aws/awsiamuser/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsIamUser represents an AWS IAM User resource for programmatic access.
// IAM users provide long-lived credentials for CI/CD pipelines, third-party integrations,
// and service accounts that require AWS API access.
message AwsIamUser {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this IAM user resource, typically "AwsIamUser".
  string kind = 2 [(buf.validate.field).string.const = 'AwsIamUser'];

  // metadata captures identifying information (name, org, version, etc.)
  // and must pass standard validations for resource naming.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the core configuration data defining the IAM user's permissions and access keys.
  AwsIamUserSpec spec = 4 [(buf.validate.field).required = true];

  // status holds runtime or post-deployment information.
  AwsIamUserStatus status = 5;
}

// AwsIamUserStatus describes the status fields for an IAM user resource.
message AwsIamUserStatus {
  // outputs captures the outputs returned by Pulumi/Terraform after provisioning.
  AwsIamUserOutputs outputs = 1;
}
