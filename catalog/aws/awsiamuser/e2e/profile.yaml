apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsiamuser
spec:
  # An IAM user under live E2E: the harness runs deploy -> GetUser verify ->
  # destroy -> verify-destroyed on both provisioners against the AWS test
  # account via keyless SSO/OIDC credentials. The scenario creates the access
  # key explicitly Inactive (proving the non-default rotation-lever arm at
  # zero cost), attaches one AWS-managed policy by literal ARN and one
  # Planton-managed policy by reference (the e2e-prerequisites annotation
  # composes the AwsIamPolicy install profile -- the first live proof of the
  # policy_arn reference edge), and force_destroy guarantees teardown
  # succeeds. IAM is global and free.
  #
  # Proven 2026-08-11 (both engines): the composed policy-fixture chain
  # resolved and tore down cleanly, and the verifier asserts the access key
  # exists AND its status matches the access_key_status output against
  # ListAccessKeys (the Inactive rotation-lever arm's API evidence).
  tier: 1
  # Re-proven live 2026-08-13, both engines ×2 runs (4 green lanes — the
  # first pair re-ran for watcher evidence, doubling as a repeatability
  # proof), after the tag-convergence sweep: ListAttachedUserPolicies
  # echoed BOTH attachment paths (the referenced Planton policy + the
  # literal AWS-managed ARN) per engine through the re-keyed sanitized-ARN
  # Pulumi addresses, and the user's tag set carried the six-key identity
  # map including Name per engine (distinct CreateDates/key IDs attribute
  # the windows).
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
