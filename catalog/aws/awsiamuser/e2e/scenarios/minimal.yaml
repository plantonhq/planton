# Minimal standalone AwsIamUser scenario: a CI-shaped user with one
# AWS-managed policy attached by literal ARN, one Planton-managed policy
# attached by reference (the e2e-prerequisites annotation composes the
# AwsIamPolicy install profile -- the first live proof of the policy_arn
# reference edge), an access key created explicitly Inactive (the
# key-rotation lever: proves the non-default status arm at zero cost --
# nothing in the lane signs requests with it), and force_destroy so teardown
# always succeeds even if out-of-band credentials appear. Full metadata is
# supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamUser
metadata:
  name: planton-oss-e2e-awsiamuser-smoke
  id: planton-oss-e2e-awsiamuser-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsiamuser
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsIamPolicy"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  userName: planton-oss-e2e-user-smoke
  path: /planton-e2e/
  forceDestroy: true
  managedPolicyArns:
    - value: arn:aws:iam::aws:policy/ReadOnlyAccess
    - valueFrom:
        kind: AwsIamPolicy
        name: planton-oss-e2e-awsiampolicy-prereq
        fieldPath: status.outputs.policy_arn
  accessKeyStatus: Inactive
