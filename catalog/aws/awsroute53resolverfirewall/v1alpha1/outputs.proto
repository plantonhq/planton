syntax = "proto3";

package dev.planton.aws.awsroute53resolverfirewall.v1alpha1;

// AwsRoute53ResolverFirewallOutputs captures the observable state
// of the DNS Firewall rule group after apply.
message AwsRoute53ResolverFirewallOutputs {
  // The rule group's id (rslvr-frg-...) - the provider's import ID and
  // half of each rule's composite import ID.
  string rule_group_id = 1;

  // The rule group's ARN.
  string rule_group_arn = 2;

  // Whether the group is shared via RAM (NOT_SHARED / SHARED_BY_ME /
  // SHARED_WITH_ME).
  string share_status = 3;

  // AWS-generated domain list IDs (rslvr-fdl-...) keyed by list name -
  // what rules and imports reference.
  map<string, string> domain_list_ids = 4;

  // AWS-generated VPC association IDs (rslvr-frgassoc-...) keyed by
  // association name.
  map<string, string> association_ids = 5;

  // Each rule's match identity keyed by rule name - the domain list
  // ID for standard rules, the threat-protection ID (rslvr-ftp-...)
  // for advanced rules. The second half of the rule's composite
  // import ID.
  map<string, string> rule_match_ids = 6;
}
