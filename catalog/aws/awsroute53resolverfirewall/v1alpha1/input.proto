syntax = "proto3";

package dev.planton.aws.awsroute53resolverfirewall.v1alpha1;

import "catalog/aws/awsroute53resolverfirewall/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsRoute53ResolverFirewallIacInput is the input for the IaC
// modules that manage a DNS Firewall rule group with its domain
// lists, rules, and VPC associations.
message AwsRoute53ResolverFirewallIacInput {
  // target is the AwsRoute53ResolverFirewall resource to deploy.
  AwsRoute53ResolverFirewall target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
