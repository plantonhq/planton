apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsroute53resolverfirewall
spec:
  # One full-surface scenario: owned domain lists, all three rule
  # shapes (OVERRIDE sinkhole, NXDOMAIN with q_type, ALERT on
  # DNS-tunneling detection), and the chain-VPC association. DNS
  # Firewall bills per domain per month prorated - minutes cost ~$0.
  #
  # Deliberately not exercised live:
  #   - a rule against an AWS-MANAGED domain list -- managed list IDs
  #     are account/region-specific and the pin offers no data source
  #     to resolve them declaratively. Unblock: resolve the id via SDK
  #     in a fixture and pass it as a literal.
  #   - mutation_protection ENABLED -- it refuses the association's
  #     own destroy; the lane would strand the group. The arm is
  #     config-verified offline only.
  #
  # PROVEN live 2026-08-26 (Q47): both engines through the full
  # six-phase runner + the Terraform blind import round-trip (the
  # threat rule's {group}:{match_id} composite re-imported blind
  # through the rule_match_ids map). TWO catches fixed at the bar:
  # (1) AWS stores every firewall domain as a trailing-dot FQDN and
  # echoes it - a bare-authored block_override_domain re-planned
  # forever; both modules now compose the canonical form; (2) the TF
  # rule_match_ids output picked the SDKv2 empty-string
  # firewall_domain_list_id over the real threat-protection id (""
  # is not null) - coalesce() now feeds the composite.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
