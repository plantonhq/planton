# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: awsroute53resolverfirewall
spec:
  billing_model: hybrid
  baseline_charges:
    - service_name: AmazonRoute53
      sku_meter: firewall domain storage
      pricing_unit: domain-months
      description: Every domain stored across the owned lists bills $0.0005 per domain-month (us-east-1) from the moment the lists exist -- deliberately cheap, but committed.
    - service_name: AmazonRoute53
      sku_meter: advanced threat protection hours
      pricing_unit: hours
      description: When ANY rule matches by dns_threat_protection, every VPC association bills $0.16 per hour (~$116.80 a month per VPC, us-east-1) from association to disassociation -- the expensive committed switch; domain-list-only rule groups never trip it.
  cost_drivers:
    - field_path: domain_lists
      sku_meter: firewall domain storage
      pricing_unit: domain-months
      impact: Every domain stored across the owned lists bills $0.0005 per domain-month (us-east-1, from the AmazonRoute53 offer) -- deliberately cheap ($0.50 a month for a thousand domains), but it is the committed meter that starts the moment the lists exist.
    - field_path: rules
      sku_meter: advanced threat protection hours
      pricing_unit: hours
      impact: "The expensive switch hides here: ANY rule matching by dns_threat_protection (DGA, DICTIONARY_DGA, DNS_TUNNELING) makes the group a DNS Firewall Advanced group, and EVERY VPC association then bills $0.16 per hour -- about $116.80 a month per associated VPC (us-east-1). Rules matching by domain list add no hourly fee."
    - field_path: vpc_associations
      sku_meter: advanced threat protection hours
      pricing_unit: hours
      impact: The multiplier on both halves of the bill -- each associated VPC contributes its DNS query volume to the per-query inspection meter, and when the group carries Advanced rules, each association is its own $0.16/hour meter. Standard-rules-only associations are free to exist.
    - field_path: region
      sku_meter: firewall domain storage
      pricing_unit: domain-months
      impact: Domain storage, query inspection, and the Advanced hourly rate are all published per region (the Advanced rate is $0.16 in every commercial region on the current offer).
  free_tier: "None. Every stored domain and every inspected query bills from the first; the Advanced hourly meter has no free band."
  estimate_exclusions:
    - queries inspected by domain-list rules bill $0.60 per million for the first billion each month and $0.40 per million beyond (us-east-1) -- query volume is the associated VPCs' workload DNS behavior, unknowable to this manifest
    - AWS-managed domain lists referenced by domain_list_id bill no storage on this account -- only domains in OWNED lists meter here
    - ALERT and BLOCK visibility rides Resolver Query Logging, a separate VPC-level resource whose log destinations bill their own components
  notes: "The price structure pivots on WHAT rules match by, not what they do: ALLOW, ALERT, and BLOCK all cost the same, but list-based matching bills per stored domain plus per inspected query while threat-class matching (Advanced) bills a flat hourly fee per associated VPC. The committed quantities live inside nested repeated fields -- total domains across domain_lists, and whether any rules entry carries dns_threat_protection -- which the derivation grammar cannot traverse, so this kind is hand-modeled per preset."
