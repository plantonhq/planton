# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awsiamoidcprovider
spec:
  aws:
    statements:
      - sid: ManageOidcProvider
        actions:
          - iam:CreateOpenIDConnectProvider
          - iam:GetOpenIDConnectProvider
          - iam:UpdateOpenIDConnectProviderThumbprint
          - iam:AddClientIDToOpenIDConnectProvider
          - iam:RemoveClientIDFromOpenIDConnectProvider
          - iam:DeleteOpenIDConnectProvider
          - iam:TagOpenIDConnectProvider
          - iam:UntagOpenIDConnectProvider
          - iam:ListOpenIDConnectProviderTags
        resources:
          - arn:aws:iam::*:oidc-provider/*
        provenance: derived
        notes: Covers aws_iam_openid_connect_provider / iam.OpenIdConnectProvider, the only resource either module manages -- creation with issuer URL, client-id list, and optional thumbprints; the in-place updates the provider supports (thumbprint replacement, client-id add/remove); tagging; and deletion. The URL is create-only, so a URL change is delete-plus-create under the same grants. IAM ARNs carry no region; the oidc-provider ARN embeds the issuer host and path, which the wildcard spans. All OIDC-provider APIs authorize on this single ARN format.
