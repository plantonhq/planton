syntax = "proto3";

package dev.planton.aws.awsec2instance.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsec2instance/v1alpha1/outputs.proto";
import "catalog/aws/awsec2instance/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsEc2Instance represents a single EC2 virtual machine instance on AWS.
// This resource provisions one EC2 instance with networking, IAM, storage,
// and access configuration.
message AwsEc2Instance {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this resource, always "AwsEc2Instance".
  string kind = 2 [(buf.validate.field).string.const = 'AwsEc2Instance'];

  // metadata captures identifying information (name, org, version, etc.)
  // and must pass standard validations for resource naming.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the core configuration data defining how the EC2 instance is deployed.
  AwsEc2InstanceSpec spec = 4 [(buf.validate.field).required = true];

  // status holds runtime or post-deployment information.
  AwsEc2InstanceStatus status = 5;
}

// AwsEc2InstanceStatus describes the status fields for an EC2 instance resource.
message AwsEc2InstanceStatus {
  // outputs captures the outputs returned by Pulumi/Terraform after provisioning.
  AwsEc2InstanceOutputs outputs = 1;
}
