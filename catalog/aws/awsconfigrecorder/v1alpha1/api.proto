syntax = "proto3";

package dev.planton.aws.awsconfigrecorder.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsconfigrecorder/v1alpha1/outputs.proto";
import "catalog/aws/awsconfigrecorder/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsConfigRecorder {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsConfigRecorder'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsConfigRecorderSpec spec = 4 [(buf.validate.field).required = true];
  AwsConfigRecorderStatus status = 5;
}

message AwsConfigRecorderStatus {
  AwsConfigRecorderOutputs outputs = 1;
}
