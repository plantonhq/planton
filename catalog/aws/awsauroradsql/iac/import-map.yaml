# Where each placeholder in this component's import-ID formats comes
# from (the formats themselves live in aa_import/catalog.yaml).
apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awsauroradsql
spec:
  # Both the cluster and its peering (state ON the cluster) import by
  # the AWS-generated cluster identifier.
  values:
    - name: dsql_cluster_identifier
      derivations:
        - from_output: identifier
      where_to_find: >-
        Aurora DSQL console -> Clusters (the identifier column), or
        `aws dsql list-clusters` (identifier - the ARN's tail).
