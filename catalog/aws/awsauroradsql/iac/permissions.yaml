# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awsauroradsql
spec:
  aws:
    statements:
      - sid: ManageCluster
        actions:
          - dsql:CreateCluster
          - dsql:GetCluster
          - dsql:UpdateCluster
          - dsql:DeleteCluster
        resources:
          - arn:aws:dsql:*:*:cluster/*
        provenance: derived
        notes: Covers aws_dsql_cluster / dsql.Cluster. GetCluster serves every plan/refresh (it also feeds the encryption_type and multi-region outputs); UpdateCluster reconciles deletion_protection_enabled and kms_encryption_key in place (a key change re-encrypts without replacement), and force_destroy makes the provider call UpdateCluster to drop deletion protection before DeleteCluster. All four actions scope to the Cluster ARN per the dsql service reference -- DSQL is new but its reference is fully published, so no inventory-lag fallback is needed.
      - sid: TagCluster
        actions:
          - dsql:TagResource
          - dsql:UntagResource
          - dsql:ListTagsForResource
        resources:
          - arn:aws:dsql:*:*:cluster/*
        provenance: derived
        notes: Tag-on-create (metadata.name rides in as the Name tag -- DSQL generates the cluster identifier itself) plus tag reconciliation and the tag read on every refresh. All three actions scope to the Cluster ARN per the service reference.
      - sid: ManageMultiRegionPeering
        actions:
          - dsql:PutMultiRegionProperties
          - dsql:PutWitnessRegion
          - dsql:AddPeerCluster
          - dsql:RemovePeerCluster
        resources:
          - arn:aws:dsql:*:*:cluster/*
        provenance: derived
        notes: Covers aws_dsql_cluster_peering / dsql.ClusterPeering -- created only when multi_region is set. The peering is a disguised UpdateCluster that AWS authorizes with these finer-grained permission checks (witness region at create, peer list while the cluster is still PENDING_SETUP). The grant must also cover the PEER clusters' ARNs in their regions -- the region wildcard here does that. RemovePeerCluster is included for the destroy path of a paired cluster; the peering resource itself has a no-op delete. All four actions scope to the Cluster ARN per the service reference.
