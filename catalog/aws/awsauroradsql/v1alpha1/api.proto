syntax = "proto3";

package dev.planton.aws.awsauroradsql.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsauroradsql/v1alpha1/outputs.proto";
import "catalog/aws/awsauroradsql/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsAuroraDsql {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsAuroraDsql'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsAuroraDsqlSpec spec = 4 [(buf.validate.field).required = true];
  AwsAuroraDsqlStatus status = 5;
}

message AwsAuroraDsqlStatus {
  AwsAuroraDsqlOutputs outputs = 1;
}
