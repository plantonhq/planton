apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsgluecatalogdatabase
spec:
  # A Glue Data Catalog database under live E2E: one full-surface lane for
  # the regular-database shape -- description, a default table location under
  # the shared S3 bucket fixture, catalog metadata parameters, and a Lake
  # Formation create-table default grant (ALL to IAM_ALLOWED_PRINCIPALS, the
  # IAM-compatibility mode AWS itself defaults to).
  #
  # Excluded from live lanes with reasons (proven by spec tests + the
  # offline plan gate against e2e/manifest.yaml):
  # - target_database (resource link): needs a database shared from another
  #   account/region via AWS RAM -- external infrastructure the e2e account
  #   does not have (the cross-account handshake class).
  # - federated_database: needs a Redshift datashare and its federation
  #   connection (external infrastructure).
  # - catalog_id: cross-account catalog writes need a second account with a
  #   matching catalog resource policy.
  #
  # Verification is GetDatabase keyed on database_name (typed
  # EntityNotFoundException when absent; deletion is synchronous). Databases
  # are free metadata objects; the lane is the create/verify/destroy cycle
  # alone.
  # Live dual-engine run 2026-07-09: full-surface Pulumi 6m03s (first lane,
  # incl. plugin warm-up; deploy itself 16s) / Terraform 58s incl. the S3
  # fixture chain; zero-orphan sweep clean.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
