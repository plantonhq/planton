# Minimal AwsCertManagerCert scenario: imported self-signed certificate.
# Requested DNS/EMAIL validation on unowned domains fails at the AWS API layer
# (ValidationStatus FAILED, no DVO records) and blocks the TF/Pulumi provider
# create waiter -- so the live leaf uses the imported arm instead. No
# prerequisites, deploys in seconds, deletion is immediate. The key material is
# a throwaway self-signed pair generated for this scenario only (10-year
# validity so the lane never expires under CI); it secures nothing. Full
# metadata is supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsCertManagerCert
metadata:
  name: planton-oss-e2e-acm-smoke
  id: planton-oss-e2e-acm-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awscertmanagercert
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
