# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awscertmanagercert
spec:
  aws:
    statements:
      - sid: RequestCertificate
        actions:
          - acm:RequestCertificate
        resources:
          - "*"
        provenance: derived
        notes: Creation call of aws_acm_certificate (tf) / acm.Certificate (pulumi) for both public and private (certificate_authority_arn) issuance. The service reference lists no resource types for RequestCertificate, so the wildcard is the narrowest possible scope.
      - sid: ManageCertificateLifecycle
        actions:
          - acm:DescribeCertificate
          - acm:ListTagsForCertificate
          - acm:AddTagsToCertificate
          - acm:RemoveTagsFromCertificate
          - acm:ImportCertificate
          - acm:RenewCertificate
          - acm:DeleteCertificate
        resources:
          - arn:aws:acm:*:*:certificate/*
        provenance: derived
        notes: Everything after creation authorizes on the certificate ARN per the service reference. DescribeCertificate and ListTagsForCertificate serve plan/refresh (and wait_for_validation polling); ImportCertificate serves the imported block, both first import and re-import rotations; RenewCertificate serves early_renewal_duration on eligible certificates; DeleteCertificate destroys (AWS rejects it while the certificate is still associated with an integrated service).
      - sid: ManageValidationRecords
        actions:
          - route53:ChangeResourceRecordSets
          - route53:ListResourceRecordSets
        resources:
          - arn:aws:route53:::hostedzone/*
        provenance: derived
        notes: Only when route53_hosted_zone_id is set -- the modules then create and delete the DNS validation CNAME records in that zone (aws_route53_record with allow_overwrite in tf, route53.Record in pulumi). Hardened deployments should scope this to the specific hosted zone's ARN. Hosted-zone ARNs carry no region or account segment.
      - sid: PollValidationRecordChanges
        actions:
          - route53:GetChange
        resources:
          - arn:aws:route53:::change/*
        provenance: derived
        notes: The Route 53 record resources wait for their change batches to reach INSYNC by polling GetChange, which authorizes on the change ARN only.
