syntax = "proto3";

package dev.planton.aws.awscertmanagercert.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awscertmanagercert/v1alpha1/outputs.proto";
import "catalog/aws/awscertmanagercert/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsCertManagerCert represents an AWS Certificate Manager (ACM)
// certificate -- requested from Amazon, imported from an external CA,
// or issued by a private CA -- that TLS-fronting AWS services
// (load balancers, CloudFront, API Gateway, Cognito, OpenSearch)
// consume by ARN.
message AwsCertManagerCert {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this ACM certificate resource.
  string kind = 2 [(buf.validate.field).string.const = "AwsCertManagerCert"];

  // metadata captures identifying information (name, org, version, etc.)
  // and must pass standard validations for resource naming.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the certificate's creation mode, domains, validation,
  // and options.
  AwsCertManagerCertSpec spec = 4 [(buf.validate.field).required = true];

  // status holds runtime or post-deployment information.
  AwsCertManagerCertStatus status = 5;
}

// AwsCertManagerCertStatus describes the status fields for an ACM
// certificate resource.
message AwsCertManagerCertStatus {
  // outputs captures the outputs returned by Pulumi/Terraform after provisioning.
  AwsCertManagerCertOutputs outputs = 1;
}
