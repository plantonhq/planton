syntax = "proto3";

package dev.planton.aws.awscertmanagercert.v1alpha1;

// AwsCertManagerCertOutputs captures the observable identifiers
// of a deployed ACM certificate -- the join keys TLS-fronting
// resources reference, plus the validation records external DNS needs
// when the module does not manage them.
message AwsCertManagerCertOutputs {
  // The certificate ARN -- the join key every TLS consumer references
  // (load-balancer listeners, CloudFront, Cognito custom domains,
  // OpenSearch custom endpoints, Client VPN, ...).
  string cert_arn = 1;

  // The certificate status at the end of the deployment:
  // "PENDING_VALIDATION" (created, waiting for domain validation --
  // the resting state when validation records are managed externally),
  // "ISSUED" (ready to serve traffic), or a failure state
  // ("VALIDATION_TIMED_OUT", "FAILED", "REVOKED", "EXPIRED").
  string status = 2;

  // The DNS records that prove domain ownership, one per domain --
  // create these in your DNS when route53_hosted_zone_id is not set,
  // and keep them in place afterwards so ACM can renew automatically.
  // Empty for imported and private certificates (no public
  // validation).
  repeated AwsCertManagerCertDomainValidationRecord domain_validation_records = 3;

  // Start of the certificate's validity window (RFC3339). Empty until
  // the certificate is issued.
  string not_before = 4;

  // End of the certificate's validity window (RFC3339) -- when an
  // imported certificate must be re-imported by. Empty until the
  // certificate is issued.
  string not_after = 5;

  // How the certificate came to be: "AMAZON_ISSUED" (requested),
  // "IMPORTED", or "PRIVATE" (ACM-PCA).
  string certificate_type = 6;
}

// One DNS validation record proving ownership of one certificate
// domain. A domain and its wildcard (e.g. "app.example.com" and
// "*.app.example.com") share the same record.
message AwsCertManagerCertDomainValidationRecord {
  // The certificate domain this record validates.
  string domain_name = 1;

  // The DNS record name to create (a "_<hash>.<domain>." CNAME).
  string record_name = 2;

  // The DNS record type (always "CNAME" today).
  string record_type = 3;

  // The DNS record value ACM expects the name to resolve to.
  string record_value = 4;
}
