# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awsnatgateway
spec:
  aws:
    statements:
      - sid: ManageNatGateway
        actions:
          - ec2:CreateNatGateway
          - ec2:DeleteNatGateway
          - ec2:CreateTags
          - ec2:DeleteTags
        resources:
          - arn:aws:ec2:*:*:natgateway/*
          - arn:aws:ec2:*:*:elastic-ip/*
        provenance: derived
        notes: Covers aws_nat_gateway -- the module's only resource. Elastic IP association happens inside CreateNatGateway (no separate AssociateAddress call), so the create also needs the referenced allocation's elastic-ip ARN in scope.
      - sid: DescribeNatGateways
        actions:
          - ec2:DescribeNatGateways
          - ec2:DescribeAvailabilityZones
        resources:
          - "*"
        provenance: derived
        notes: Read-side of aws_nat_gateway during plan/refresh, plus DescribeAvailabilityZones for regional availability_mode -- the one permission the component's own docs call out explicitly. EC2 Describe APIs support no resource-level scoping, so the wildcard is the narrowest possible scope.
