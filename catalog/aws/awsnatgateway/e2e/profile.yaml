apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsnatgateway
spec:
  # First deep (two-level) composed AWS topology under live E2E: the harness
  # deploys an AwsVpc -> AwsSubnet -> AwsElasticIp prerequisite chain (the subnet
  # resolves its own vpc_id from the VPC's outputs), resolves the NAT gateway's
  # subnet_id and allocation_id from the subnet/EIP outputs, then runs deploy ->
  # DescribeNatGateways verify -> destroy -> verify-destroyed on both provisioners
  # against the AWS test account via keyless SSO/OIDC credentials.
  # pending_proof: the spec surface deepened (the regional NAT gateway family
  # -- availability_mode, vpc_id, availability_zone_addresses -- with a new
  # regional scenario that has never run live) after the prior green run, so
  # that proof no longer covers the current surface. Offline plans and
  # previews passed on both engines for the zonal AND regional arms; the live
  # lanes re-earn the badge. The regional lane additionally needs
  # ec2:DescribeAvailabilityZones on the harness role.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  # NAT gateways are slow to create and especially to delete (the AWS provider
  # uses a 30-minute delete timeout), so the per-scenario budget is generous.
  timeout_minutes: 20
  # 2026-08-13 tag-convergence sweep: the Pulumi identity-tag map gained the
  # canonical Name key, converging on the key set the Terraform module (and
  # this badge's live proof) already sends. Declared-set equality is now
  # machine-enforced by hack/guards/ensure_cross_engine_tag_keys.sh; the
  # change class is live-re-proven once via Q31 (awssqsqueue represents it).
