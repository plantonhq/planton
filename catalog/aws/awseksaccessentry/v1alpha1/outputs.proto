syntax = "proto3";

package dev.planton.aws.awseksaccessentry.v1alpha1;

// AwsEksAccessEntryOutputs describes the values returned after
// provisioning an EKS access entry.
message AwsEksAccessEntryOutputs {
  // access_entry_arn is the Amazon Resource Name of the entry --
  // arn:aws:eks:<region>:<account>:access-entry/<cluster>/<principal
  // type>/<account>/<principal name>/<uuid>.
  string access_entry_arn = 1;

  // principal_arn is the IAM principal the entry grants access to, as
  // resolved at provisioning time.
  string principal_arn = 2;
}
