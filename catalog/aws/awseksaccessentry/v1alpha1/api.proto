syntax = "proto3";

package dev.planton.aws.awseksaccessentry.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awseksaccessentry/v1alpha1/outputs.proto";
import "catalog/aws/awseksaccessentry/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsEksAccessEntry represents an EKS access entry: the grant that lets
// one IAM principal reach an AwsEksCluster's Kubernetes API, with
// authorization from AWS-managed access policies and/or Kubernetes RBAC
// group mappings.
message AwsEksAccessEntry {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this access entry resource.
  string kind = 2 [(buf.validate.field).string.const = "AwsEksAccessEntry"];

  // metadata captures identifying information (name, org, version, etc.)
  // and must pass standard validations for resource naming.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the core configuration data defining the access grant.
  AwsEksAccessEntrySpec spec = 4 [(buf.validate.field).required = true];

  // status holds runtime or post-deployment information.
  AwsEksAccessEntryStatus status = 5;
}

// AwsEksAccessEntryStatus describes the status fields for an access entry resource.
message AwsEksAccessEntryStatus {
  // outputs captures the outputs returned by Pulumi/Terraform after provisioning.
  AwsEksAccessEntryOutputs outputs = 1;
}
