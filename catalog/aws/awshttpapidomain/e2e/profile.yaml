apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awshttpapidomain
spec:
  # A custom domain under live E2E: the registry-declared AwsCertManagerCert
  # prerequisite deploys first (the imported self-signed certificate fixture
  # -- its CN is what the domain name must match), the scenario composes the
  # dependency-free HTTP API prerequisite fixture via the e2e-prerequisites
  # annotation, then the domain proves create (TLS binding + REGIONAL
  # endpoint), the root API mapping, GetDomainName verification, destroy,
  # and verify-destroyed on both provisioners. example.com is IANA-reserved,
  # so the region-unique custom-domain namespace cannot collide with a real
  # tenant. Deliberately not in the lane: the ROUTING-RULE surface -- API
  # Gateway routing rules invoke ONLY REST-protocol APIs (live-caught 400
  # "Only the REST protocol type is supported" at CreateRoutingRule on both
  # engines). AwsRestApiGateway now exists; composing a REST fixture into
  # this HTTP-domain lane is a follow-on (the rule arms stay offline-proven
  # until a lane budget covers it). The verifier already asserts the routing
  # posture (GetDomainName mode + ListRoutingRules). Also not in the
  # lane: mutual TLS (needs an S3-hosted truststore fixture), DNS records
  # (the domain exists independently of any record pointing at it), and the
  # ownership-verification certificate (AWS only accepts it alongside a
  # Private-CA or imported+mTLS certificate setup the fixture chain cannot
  # honestly exercise) -- all proven by spec tests and the offline gate.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
