# Custom domain over the ACM imported self-signed certificate fixture (the
# registry prerequisite falls back to the ACM minimal scenario, whose CN is
# e2e-smoke.planton-oss-e2e.example.com -- the domain name must match what
# the certificate covers), with one API mapping composing the HTTP API
# fixture chain at the domain root. example.com is IANA-reserved, so the
# region-unique custom-domain namespace cannot collide with a real tenant.
# DNS is deliberately not part of the lane -- the domain resource exists and
# maps independently of any record pointing at it.
#
# Deliberately NO routing arm here: AWS rejects HTTP-API mappings on
# rule-mode domains (live-verified 400 at CreateApiMapping; the spec CEL
# now forbids the combination), so the routing-rule surface lives in the
# routed-domain scenario instead.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsHttpApiDomain
metadata:
  name: planton-oss-e2e-awshttpdom
  id: planton-oss-e2e-awshttpdom
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awshttpapidomain
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsHttpApiGateway"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  domainName: e2e-smoke.planton-oss-e2e.example.com
  certificateArn:
    valueFrom:
      kind: AwsCertManagerCert
      name: planton-oss-e2e-acm-smoke
      fieldPath: status.outputs.cert_arn
  apiMappings:
    - apiId:
        valueFrom:
          kind: AwsHttpApiGateway
          name: planton-oss-e2e-awshttpapigw-prereq
          fieldPath: status.outputs.api_id
      stage: $default
