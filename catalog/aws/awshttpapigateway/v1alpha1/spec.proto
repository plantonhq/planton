syntax = "proto3";

package dev.planton.aws.awshttpapigateway.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";

// AwsHttpApiGatewaySpec defines the desired configuration for an AWS API Gateway HTTP API.
//
// HTTP APIs (API Gateway v2) are optimized for building low-latency, cost-effective
// REST APIs and HTTP proxy APIs. They support Lambda proxy integration, HTTP proxy
// integration, first-class AWS service integrations (SQS, EventBridge, Step Functions,
// Kinesis, AppConfig), private integrations through VPC links, automatic deployments,
// native CORS, and JWT/IAM/Lambda authorization.
//
// This component bundles the API, a single stage, routes with inline integrations,
// and optional authorizers into one declarative resource. The IaC modules create the
// underlying API Gateway resources (api, stage, integrations, routes, authorizers)
// and wire them together automatically.
//
// Key design choices:
// - HTTP APIs only (WebSocket APIs are a separate protocol surface with their own
//   route/response model and would be their own component).
// - Routes carry inline integration config; the module deduplicates shared backends.
// - A single stage (defaults to "$default" with auto-deploy) since Planton resources
//   are already environment-scoped.
// - Authorizers are named and referenced by routes for clean separation.
// - Custom domains are the AwsHttpApiDomain component (a domain outlives any one API
//   and maps many APIs); VPC links are the AwsHttpApiVpcLink component (one link is
//   shared by many APIs and owns its own network attachment).
// - API keys and usage plans are a REST API feature (the AwsRestApiUsagePlan
//   component); HTTP APIs do not support them -- use JWT/IAM/Lambda authorizers.
//
// Credentials, region, and deployment workflow live outside this spec in IaC inputs.
message AwsHttpApiGatewaySpec {
  // The AWS region where the resource will be created.
  // Example: "us-west-2", "eu-west-1"
  string region = 1 [(buf.validate.field).string.min_len = 1];

  // ---------------------------------------------------------------------------
  // API configuration
  // ---------------------------------------------------------------------------

  // Human-readable description of the API (max 1024 characters).
  string description = 2 [(buf.validate.field).string.max_len = 1024];

  // A version identifier for the API (max 64 characters). Purely informational
  // metadata surfaced in the AWS console and exports -- it does not create
  // stages or affect routing.
  string api_version = 3 [(buf.validate.field).string.max_len = 64];

  // CORS configuration for cross-origin requests. When not set, no CORS
  // headers are returned by the API.
  AwsHttpApiGatewayCorsConfig cors_configuration = 4;

  // Disable the default execute-api endpoint. Set to true when a custom domain
  // (AwsHttpApiDomain) fronts this API to prevent callers from bypassing the
  // domain (and its TLS policy / WAF) via the default endpoint.
  bool disable_execute_api_endpoint = 5;

  // IP address type for the API's default endpoint.
  // - "ipv4": Resolve the endpoint to IPv4 addresses only.
  // - "dualstack": Resolve to both IPv4 and IPv6.
  // When omitted, AWS defaults new APIs to dualstack. Changing the value
  // updates the endpoint in place.
  string ip_address_type = 6;

  // ---------------------------------------------------------------------------
  // Stage configuration
  // ---------------------------------------------------------------------------

  // Stage configuration for the deployed API. When not set, a "$default" stage
  // with auto_deploy=true is created automatically, which is the recommended
  // configuration for most HTTP APIs.
  AwsHttpApiGatewayStageConfig stage = 7;

  // ---------------------------------------------------------------------------
  // Routes and integrations
  // ---------------------------------------------------------------------------

  // API routes mapping request patterns to backend integrations. Each route
  // specifies a route key (e.g., "GET /users", "$default") and an inline
  // integration that defines the backend target.
  //
  // When multiple routes share the same integration configuration (same type,
  // URI, and payload format), the IaC modules automatically deduplicate and
  // create a single integration resource.
  //
  // At least one route is required -- an API without routes has no function.
  repeated AwsHttpApiGatewayRoute routes = 8 [(buf.validate.field).repeated.min_items = 1];

  // ---------------------------------------------------------------------------
  // Authorizers
  // ---------------------------------------------------------------------------

  // Named authorizers that can be referenced by routes. Define JWT authorizers
  // for Cognito/Auth0/OIDC integration, or Lambda (REQUEST) authorizers for
  // custom authorization logic. Routes reference authorizers by name.
  repeated AwsHttpApiGatewayAuthorizer authorizers = 9;

  // ---------------------------------------------------------------------------
  // CEL validations
  // ---------------------------------------------------------------------------

  // IP address type must be valid when set.
  option (buf.validate.message).cel = {
    id: "ip_address_type_valid"
    message: "ip_address_type must be 'ipv4' or 'dualstack' when set"
    expression: "this.ip_address_type == '' || this.ip_address_type in ['ipv4', 'dualstack']"
  };

  // Route keys must be unique -- AWS rejects a second route with the same key,
  // and a duplicate in the spec would mean one silently wins.
  option (buf.validate.message).cel = {
    id: "route_keys_unique"
    message: "route_key values must be unique across routes -- two routes with the same key would conflict in API Gateway"
    expression: "this.routes.all(r1, this.routes.filter(r2, r2.route_key == r1.route_key).size() == 1)"
  };

  // Route authorization_type must be valid when set.
  option (buf.validate.message).cel = {
    id: "route_authorization_type_valid"
    message: "route authorization_type must be 'NONE', 'JWT', 'AWS_IAM', or 'CUSTOM' when set"
    expression: "this.routes.all(r, r.authorization_type == '' || r.authorization_type in ['NONE', 'JWT', 'AWS_IAM', 'CUSTOM'])"
  };

  // Routes using an authorizer-backed type must say which authorizer.
  option (buf.validate.message).cel = {
    id: "authorized_route_requires_authorizer_name"
    message: "routes with authorization_type 'JWT' or 'CUSTOM' must specify an authorizer_name"
    expression: "this.routes.all(r, !(r.authorization_type in ['JWT', 'CUSTOM']) || r.authorizer_name != '')"
  };

  // Route authorizer_name must reference a defined authorizer.
  option (buf.validate.message).cel = {
    id: "route_authorizer_name_must_exist"
    message: "route authorizer_name must match a defined authorizer name"
    expression: "this.routes.all(r, r.authorizer_name == '' || this.authorizers.exists(a, a.name == r.authorizer_name))"
  };

  // The route's authorization type must agree with the referenced
  // authorizer's kind: JWT routes bind JWT authorizers, CUSTOM routes bind
  // REQUEST (Lambda) authorizers. AWS rejects mismatched pairs at deploy
  // time; catching it here saves a failed apply.
  option (buf.validate.message).cel = {
    id: "route_authorizer_type_matches"
    message: "a route's authorization_type must match its authorizer: 'JWT' routes reference JWT authorizers, 'CUSTOM' routes reference REQUEST (Lambda) authorizers"
    expression: "this.routes.all(r, r.authorizer_name == '' || this.authorizers.all(a, a.name != r.authorizer_name || (r.authorization_type == 'JWT' && a.authorizer_type == 'JWT') || (r.authorization_type == 'CUSTOM' && a.authorizer_type == 'REQUEST')))"
  };

  // Authorizer names must be unique so route references are unambiguous.
  option (buf.validate.message).cel = {
    id: "authorizer_names_unique"
    message: "authorizer names must be unique -- routes reference authorizers by name"
    expression: "this.authorizers.all(a1, this.authorizers.filter(a2, a2.name == a1.name).size() == 1)"
  };

  // Authorizer type must be valid.
  option (buf.validate.message).cel = {
    id: "authorizer_type_valid"
    message: "authorizer authorizer_type must be 'JWT' or 'REQUEST'"
    expression: "this.authorizers.all(a, a.authorizer_type in ['JWT', 'REQUEST'])"
  };

  // JWT authorizer requires jwt_configuration with issuer and at least one
  // audience -- HTTP APIs validate both the "iss" and "aud" claims.
  option (buf.validate.message).cel = {
    id: "jwt_authorizer_requires_config"
    message: "JWT authorizers must have jwt_configuration with an issuer and at least one audience"
    expression: "this.authorizers.all(a, a.authorizer_type != 'JWT' || (has(a.jwt_configuration) && has(a.jwt_configuration.issuer) && a.jwt_configuration.audiences.size() > 0))"
  };

  // REQUEST authorizer requires authorizer_uri.
  option (buf.validate.message).cel = {
    id: "request_authorizer_requires_uri"
    message: "REQUEST authorizers must have authorizer_uri set"
    expression: "this.authorizers.all(a, a.authorizer_type != 'REQUEST' || has(a.authorizer_uri))"
  };

  // Integration type must be valid. HTTP APIs support exactly two integration
  // types: AWS_PROXY (Lambda or, with integration_subtype, an AWS service
  // action) and HTTP_PROXY (any HTTP endpoint, public or private).
  option (buf.validate.message).cel = {
    id: "integration_type_valid"
    message: "route integration integration_type must be 'AWS_PROXY' or 'HTTP_PROXY'"
    expression: "this.routes.all(r, r.integration.integration_type in ['AWS_PROXY', 'HTTP_PROXY'])"
  };

  // The integration target is per-mode: proxy integrations (Lambda or HTTP)
  // take their target in integration_uri, while AWS service integrations
  // (integration_subtype set) take their target in request_parameters and
  // must not set integration_uri -- AWS rejects the combination.
  option (buf.validate.message).cel = {
    id: "integration_uri_per_mode"
    message: "integration_uri is required for Lambda and HTTP proxy integrations, and must be omitted when integration_subtype selects an AWS service action (the action's parameters go in request_parameters instead)"
    expression: "this.routes.all(r, (r.integration.integration_subtype == '' && has(r.integration.integration_uri)) || (r.integration.integration_subtype != '' && !has(r.integration.integration_uri)))"
  };

  // AWS service integrations ride the AWS_PROXY type.
  option (buf.validate.message).cel = {
    id: "integration_subtype_requires_aws_proxy"
    message: "integration_subtype (AWS service integrations like SQS-SendMessage or StepFunctions-StartExecution) requires integration_type 'AWS_PROXY'"
    expression: "this.routes.all(r, r.integration.integration_subtype == '' || r.integration.integration_type == 'AWS_PROXY')"
  };

  // AWS service integrations need an IAM role API Gateway can assume to call
  // the target service -- unlike Lambda proxy integrations, which authorize
  // through the function's resource policy.
  option (buf.validate.message).cel = {
    id: "integration_subtype_requires_credentials"
    message: "AWS service integrations (integration_subtype set) require credentials_arn -- an IAM role API Gateway assumes to call the service"
    expression: "this.routes.all(r, r.integration.integration_subtype == '' || has(r.integration.credentials_arn))"
  };

  // Connection type must be valid when set.
  option (buf.validate.message).cel = {
    id: "integration_connection_type_valid"
    message: "integration connection_type must be 'INTERNET' or 'VPC_LINK' when set"
    expression: "this.routes.all(r, r.integration.connection_type == '' || r.integration.connection_type in ['INTERNET', 'VPC_LINK'])"
  };

  // VPC_LINK and connection_id go together: a private integration needs the
  // link that reaches into the VPC, and a connection_id is meaningless
  // without VPC_LINK.
  option (buf.validate.message).cel = {
    id: "integration_vpc_link_coupling"
    message: "integrations with connection_type 'VPC_LINK' must set connection_id (the VPC link to route through), and connection_id must not be set otherwise"
    expression: "this.routes.all(r, (r.integration.connection_type == 'VPC_LINK') == has(r.integration.connection_id))"
  };

  // Private integrations are HTTP_PROXY: a VPC link fronts an ALB/NLB or
  // Cloud Map service, which API Gateway reaches over HTTP.
  option (buf.validate.message).cel = {
    id: "integration_vpc_link_requires_http_proxy"
    message: "integrations with connection_type 'VPC_LINK' must use integration_type 'HTTP_PROXY' -- private integrations proxy HTTP traffic to an ALB, NLB, or Cloud Map service inside the VPC"
    expression: "this.routes.all(r, r.integration.connection_type != 'VPC_LINK' || r.integration.integration_type == 'HTTP_PROXY')"
  };

  // Payload format version must be valid when set.
  option (buf.validate.message).cel = {
    id: "payload_format_version_valid"
    message: "route integration payload_format_version must be '1.0' or '2.0' when set"
    expression: "this.routes.all(r, r.integration.payload_format_version == '' || r.integration.payload_format_version in ['1.0', '2.0'])"
  };

  // Only Lambda proxy integrations support the 2.0 event format -- HTTP
  // proxy and AWS service integrations are fixed at 1.0 by AWS, and sending
  // 2.0 fails the CreateIntegration call.
  option (buf.validate.message).cel = {
    id: "payload_format_version_lambda_only"
    message: "payload_format_version '2.0' applies only to Lambda proxy integrations -- HTTP_PROXY and AWS service integrations (integration_subtype) are fixed at '1.0' by AWS"
    expression: "this.routes.all(r, r.integration.payload_format_version != '2.0' || (r.integration.integration_type == 'AWS_PROXY' && r.integration.integration_subtype == ''))"
  };

  // Integration timeout range validation.
  option (buf.validate.message).cel = {
    id: "integration_timeout_range"
    message: "route integration timeout_milliseconds must be between 50 and 30000 when set"
    expression: "this.routes.all(r, r.integration.timeout_milliseconds == 0 || (r.integration.timeout_milliseconds >= 50 && r.integration.timeout_milliseconds <= 30000))"
  };

  // Integration method must be a real HTTP method when set -- API Gateway
  // rejects anything outside this set at deploy time; catching the typo
  // here saves a failed apply.
  option (buf.validate.message).cel = {
    id: "integration_method_valid"
    message: "route integration integration_method must be one of 'ANY', 'DELETE', 'GET', 'HEAD', 'OPTIONS', 'PATCH', 'POST', 'PUT' when set"
    expression: "this.routes.all(r, r.integration.integration_method == '' || r.integration.integration_method in ['ANY', 'DELETE', 'GET', 'HEAD', 'OPTIONS', 'PATCH', 'POST', 'PUT'])"
  };

  // Authorizer result_ttl_seconds range validation.
  option (buf.validate.message).cel = {
    id: "authorizer_ttl_range"
    message: "authorizer result_ttl_seconds must be between 0 and 3600 when set"
    expression: "this.authorizers.all(a, a.result_ttl_seconds >= 0 && a.result_ttl_seconds <= 3600)"
  };

  // Authorizer payload format version must be valid when set.
  option (buf.validate.message).cel = {
    id: "authorizer_payload_format_version_valid"
    message: "authorizer authorizer_payload_format_version must be '1.0' or '2.0' when set"
    expression: "this.authorizers.all(a, a.authorizer_payload_format_version == '' || a.authorizer_payload_format_version in ['1.0', '2.0'])"
  };

  // Per-route stage settings must target a route that exists in this spec --
  // AWS rejects route settings for unknown route keys at deploy time; catching
  // the typo here saves a failed apply.
  option (buf.validate.message).cel = {
    id: "stage_route_settings_target_defined_routes"
    message: "stage.route_settings route_key values must match a route defined in routes"
    expression: "!has(this.stage) || this.stage.route_settings.all(rs, this.routes.exists(r, r.route_key == rs.route_key))"
  };
}

// AwsHttpApiGatewayCorsConfig configures cross-origin resource sharing (CORS) for the API.
// CORS allows web browsers to make requests to the API from a different domain.
// When not configured, the API returns no CORS headers and browsers block
// cross-origin requests.
message AwsHttpApiGatewayCorsConfig {
  // Origins allowed to make cross-origin requests (e.g., "https://example.com", "*").
  repeated string allow_origins = 1;

  // HTTP methods allowed for cross-origin requests (e.g., "GET", "POST", "OPTIONS").
  repeated string allow_methods = 2;

  // Request headers allowed in cross-origin requests (e.g., "Content-Type", "Authorization").
  repeated string allow_headers = 3;

  // Response headers exposed to the browser in cross-origin responses.
  repeated string expose_headers = 4;

  // Maximum time in seconds that browsers can cache CORS preflight results.
  // Reduces the number of preflight OPTIONS requests. Range: 0-86400.
  int32 max_age_seconds = 5 [(buf.validate.field).int32 = {
    gte: 0
    lte: 86400
  }];

  // Whether the API supports credentials (cookies, authorization headers)
  // in cross-origin requests.
  bool allow_credentials = 6;
}

// AwsHttpApiGatewayStageConfig configures the deployment stage for the API.
// Most HTTP APIs use a single "$default" stage with auto-deploy enabled.
message AwsHttpApiGatewayStageConfig {
  // Stage name. Defaults to "$default" when empty, which is the recommended
  // configuration for HTTP APIs. Named stages (e.g., "prod", "dev") append
  // the stage name to the invoke URL path.
  string name = 1;

  // Enable automatic deployment when routes, integrations, or authorizers
  // change. When omitted, the modules default to true -- the configuration
  // that makes a declarative spec self-applying. Set explicitly to false to
  // require deployments to be created outside this resource (an advanced
  // pattern; changes to routes then have no effect until a deployment is
  // published).
  optional bool auto_deploy = 2;

  // Human-readable description of the stage (max 1024 characters).
  string description = 3 [(buf.validate.field).string.max_len = 1024];

  // Access logging configuration. When set, API Gateway streams access logs
  // to the specified CloudWatch Log Group.
  AwsHttpApiGatewayAccessLogConfig access_log = 4;

  // Default throttling settings applied to all routes unless overridden
  // per route in route_settings.
  AwsHttpApiGatewayThrottleConfig default_throttle = 5;

  // Emit detailed CloudWatch metrics for all routes (per-route dimensions for
  // count, latency, and errors). Applies as the stage default; can be
  // overridden per route in route_settings. Detailed metrics carry additional
  // CloudWatch cost.
  bool detailed_metrics_enabled = 6;

  // Per-route overrides of throttling and detailed metrics. Each entry targets
  // one route (by its route_key) and overrides the stage defaults for that
  // route only -- e.g. a lower rate limit on an expensive search route, or
  // detailed metrics on just the checkout path.
  repeated AwsHttpApiGatewayRouteSettings route_settings = 7;

  // Stage variables passed to integrations. These act as environment-specific
  // configuration values accessible in integration request parameters.
  map<string, string> stage_variables = 8;
}

// AwsHttpApiGatewayAccessLogConfig configures access logging for the API stage.
message AwsHttpApiGatewayAccessLogConfig {
  // CloudWatch Log Group ARN for access log delivery. Accepts a direct ARN
  // or a reference to an AwsCloudwatchLogGroup resource.
  dev.planton.shared.foreignkey.v1.StringValueOrRef destination_arn = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsCloudwatchLogGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.log_group_arn"
  ];

  // Log format template. Uses API Gateway access log variables (e.g.,
  // $context.requestId, $context.identity.sourceIp, $context.httpMethod).
  //
  // Common JSON format:
  //   {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
  //    "method":"$context.httpMethod","path":"$context.routeKey",
  //    "status":"$context.status","latency":"$context.responseLatency"}
  string format = 2 [(buf.validate.field).string.min_len = 1];
}

// AwsHttpApiGatewayThrottleConfig configures request throttling for the API stage.
message AwsHttpApiGatewayThrottleConfig {
  // Maximum number of concurrent requests allowed (burst). API Gateway uses
  // the token bucket algorithm where burst_limit is the bucket size.
  int32 burst_limit = 1 [(buf.validate.field).int32.gte = 0];

  // Steady-state request rate limit (requests per second). API Gateway uses
  // this as the token refill rate.
  double rate_limit = 2;
}

// AwsHttpApiGatewayRouteSettings overrides stage-level defaults for a single
// route. Only the fields that are set override the defaults; a zero burst or
// rate limit means "inherit the stage default".
message AwsHttpApiGatewayRouteSettings {
  // The route to override, addressed by its route_key exactly as defined in
  // routes (e.g. "GET /search", "$default").
  string route_key = 1 [(buf.validate.field).string.min_len = 1];

  // Maximum number of concurrent requests for this route (token bucket size).
  // Zero inherits the stage default.
  int32 throttling_burst_limit = 2 [(buf.validate.field).int32.gte = 0];

  // Steady-state request rate limit for this route (requests per second).
  // Zero inherits the stage default.
  double throttling_rate_limit = 3;

  // Emit detailed CloudWatch metrics for this route regardless of the stage
  // default.
  bool detailed_metrics_enabled = 4;
}

// AwsHttpApiGatewayRoute maps a request pattern to a backend integration.
// Each route defines a route key (HTTP method + path or "$default") and the
// integration configuration that processes matching requests.
message AwsHttpApiGatewayRoute {
  // Route key defining the request pattern to match. Format: "{METHOD} {PATH}"
  // for specific routes (e.g., "GET /users", "POST /orders/{id}") or "$default"
  // for a catch-all route that handles unmatched requests.
  string route_key = 1 [(buf.validate.field).string.min_len = 1];

  // Backend integration that processes requests matching this route.
  AwsHttpApiGatewayIntegration integration = 2 [(buf.validate.field).required = true];

  // Authorization type for this route. Valid values:
  // - "NONE" (default): No authorization required.
  // - "JWT": JSON Web Token authorization using a JWT authorizer.
  // - "AWS_IAM": AWS IAM authorization using SigV4 signatures.
  // - "CUSTOM": Lambda authorization using a REQUEST authorizer.
  string authorization_type = 3;

  // Name of the authorizer to use for this route. Must match the name of an
  // authorizer defined in the `authorizers` field. Required when
  // `authorization_type` is "JWT" (bind a JWT authorizer) or "CUSTOM" (bind
  // a REQUEST authorizer).
  string authorizer_name = 4;

  // OAuth 2.0 scopes required for JWT authorization. The request must include
  // all specified scopes to be authorized. Only applicable when
  // `authorization_type` is "JWT".
  repeated string authorization_scopes = 5;

  // Operation name for this route (max 64 characters). Surfaced in OpenAPI
  // exports as the operationId -- useful when generated client SDKs need
  // stable method names.
  string operation_name = 6 [(buf.validate.field).string.max_len = 64];
}

// AwsHttpApiGatewayIntegration defines the backend target for a route.
// HTTP APIs support three backend shapes:
// - Lambda proxy (integration_type AWS_PROXY, integration_uri = function ARN)
// - HTTP proxy (integration_type HTTP_PROXY, integration_uri = URL), publicly
//   or -- through a VPC link -- privately to an ALB/NLB/Cloud Map service
// - AWS service actions (integration_type AWS_PROXY + integration_subtype,
//   e.g. "SQS-SendMessage"), where API Gateway calls the service directly
//   with no Lambda in between
message AwsHttpApiGatewayIntegration {
  // Integration type. Valid values:
  // - "AWS_PROXY": Lambda proxy integration or (with integration_subtype)
  //   a first-class AWS service integration.
  // - "HTTP_PROXY": HTTP proxy integration -- API Gateway forwards the
  //   request to an upstream HTTP endpoint.
  string integration_type = 1 [(buf.validate.field).string.min_len = 1];

  // Integration URI for proxy integrations. For AWS_PROXY (Lambda) this is
  // the Lambda function ARN; for HTTP_PROXY this is the upstream URL (for
  // private integrations through a VPC link, the ALB/NLB listener ARN or
  // Cloud Map service ARN). Accepts a direct value or a reference to another
  // resource's output. Must be omitted for AWS service integrations
  // (integration_subtype set) -- their target is expressed in
  // request_parameters instead.
  dev.planton.shared.foreignkey.v1.StringValueOrRef integration_uri = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsLambda,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.function_arn"
  ];

  // AWS service integration subtype. Selects a first-class service action
  // that API Gateway invokes directly -- no Lambda glue required. Known
  // subtypes include: "EventBridge-PutEvents", "SQS-SendMessage",
  // "SQS-ReceiveMessage", "SQS-DeleteMessage", "SQS-PurgeQueue",
  // "Kinesis-PutRecord", "StepFunctions-StartExecution",
  // "StepFunctions-StartSyncExecution", "StepFunctions-StopExecution",
  // "AppConfig-GetConfiguration". The action's parameters (e.g. QueueUrl and
  // MessageBody for SQS-SendMessage, StateMachineArn and Input for
  // StepFunctions-StartExecution) are supplied via request_parameters, and
  // credentials_arn must grant API Gateway permission to call the action.
  string integration_subtype = 3 [(buf.validate.field).string.max_len = 128];

  // Payload format version for Lambda integrations. Controls the format of the
  // event sent to the Lambda function.
  // - "2.0" (recommended): Simplified event structure with direct body access.
  // - "1.0": Legacy format with multi-value headers and base64 encoding.
  // Defaults to "2.0" when empty. Only applicable to AWS_PROXY integrations.
  // AWS service integrations (integration_subtype) always use "1.0".
  string payload_format_version = 4;

  // HTTP method used for the integration request. Valid values: "ANY",
  // "DELETE", "GET", "HEAD", "OPTIONS", "PATCH", "POST", "PUT" (uppercase).
  // Defaults to the route's HTTP method for HTTP_PROXY integrations. For
  // AWS_PROXY (Lambda) integrations, this is always POST regardless of the
  // value set here.
  string integration_method = 5;

  // Integration timeout in milliseconds. If the backend does not respond within
  // this duration, API Gateway returns a 504 Gateway Timeout.
  // Range: 50-30000 (50ms to 30s). AWS default: 30000 (30s).
  // Leave at 0 to use the AWS default.
  int32 timeout_milliseconds = 6;

  // Connection type for the integration.
  // - "INTERNET" (default): Route to the target over the public internet.
  // - "VPC_LINK": Route through a VPC link to a private ALB, NLB, or Cloud
  //   Map service inside a VPC. Requires connection_id and integration_type
  //   HTTP_PROXY.
  string connection_type = 7;

  // The VPC link to route through for private integrations. Accepts a direct
  // VPC link ID or a reference to an AwsHttpApiVpcLink resource. Required
  // when connection_type is "VPC_LINK"; must be omitted otherwise.
  dev.planton.shared.foreignkey.v1.StringValueOrRef connection_id = 8 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsHttpApiVpcLink,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.vpc_link_id"
  ];

  // IAM role that API Gateway assumes to invoke the integration target.
  // Required for AWS service integrations (integration_subtype set) -- the
  // role must trust apigateway.amazonaws.com and grant the service action
  // (e.g. sqs:SendMessage on the target queue). Optional for Lambda proxy
  // integrations, which normally authorize through the function's resource
  // policy instead.
  dev.planton.shared.foreignkey.v1.StringValueOrRef credentials_arn = 9 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsIamRole,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.role_arn"
  ];

  // Parameter mappings applied to the integration request.
  //
  // For proxy integrations (Lambda / HTTP), keys are mapping instructions of
  // the form "append:header.<name>", "overwrite:header.<name>",
  // "remove:querystring.<name>", "overwrite:path", etc., and values are
  // static strings or context expressions (e.g. "$context.requestId",
  // "$request.header.Authorization").
  //
  // For AWS service integrations (integration_subtype set), keys are the
  // service action's parameter names (e.g. "QueueUrl", "MessageBody" for
  // SQS-SendMessage; "StateMachineArn", "Input" for
  // StepFunctions-StartExecution) and values are static strings or request
  // expressions like "$request.body".
  map<string, string> request_parameters = 10;

  // Response parameter mappings, keyed by the backend status code they apply
  // to. Each entry transforms the response API Gateway returns to the caller
  // for that status code -- e.g. overwriting the status code or injecting a
  // header. Supported by proxy and service integrations on HTTP APIs.
  repeated AwsHttpApiGatewayResponseParameters response_parameters = 11;

  // Server name TLS verification for private HTTP_PROXY integrations. When
  // set, API Gateway verifies the target's certificate against this server
  // name (SNI) instead of the resolved address -- required when a private
  // ALB terminates TLS with a certificate issued for the public domain name.
  // Maps to the integration's tls_config block.
  string tls_server_name_to_verify = 12;

  // Human-readable description of the integration (max 1024 characters).
  string description = 13 [(buf.validate.field).string.max_len = 1024];
}

// AwsHttpApiGatewayResponseParameters transforms the response API Gateway
// returns to the caller for one backend status code.
message AwsHttpApiGatewayResponseParameters {
  // The backend response status code these mappings apply to (e.g. "403",
  // "500"). API Gateway accepts 200-599 -- informational (1xx) codes cannot
  // carry response overrides.
  string status_code = 1 [(buf.validate.field).string.pattern = "^[2-5][0-9][0-9]$"];

  // Mapping instructions applied to the response. Keys are instructions such
  // as "overwrite:statuscode", "append:header.<name>",
  // "overwrite:header.<name>", "remove:header.<name>"; values are static
  // strings or context expressions (e.g. "$context.requestId").
  map<string, string> mappings = 2 [(buf.validate.field).map.min_pairs = 1];
}

// AwsHttpApiGatewayAuthorizer defines a named authorizer that can be referenced
// by routes. HTTP APIs support two authorizer types:
// - JWT: Validates JSON Web Tokens from Cognito, Auth0, or any OIDC provider.
// - REQUEST: Invokes a Lambda function for custom authorization logic.
message AwsHttpApiGatewayAuthorizer {
  // Unique name for this authorizer. Routes reference authorizers by this name.
  // Must be unique across all authorizers in the spec.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];

  // Authorizer type. Valid values:
  // - "JWT": Validates a JSON Web Token using the configured issuer and audiences.
  // - "REQUEST": Invokes a Lambda function that returns an authorization decision.
  string authorizer_type = 2 [(buf.validate.field).string.min_len = 1];

  // JWT configuration. Required when authorizer_type is "JWT".
  // Configures the token issuer and expected audiences for JWT validation.
  AwsHttpApiGatewayJwtConfig jwt_configuration = 3;

  // Lambda function URI for REQUEST authorizers. This is the Lambda function
  // invoke ARN. Required when authorizer_type is "REQUEST".
  dev.planton.shared.foreignkey.v1.StringValueOrRef authorizer_uri = 4 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsLambda,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.function_arn"
  ];

  // IAM role ARN that API Gateway assumes to invoke the Lambda authorizer.
  // Only applicable to REQUEST authorizers.
  dev.planton.shared.foreignkey.v1.StringValueOrRef authorizer_credentials_arn = 5 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsIamRole,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.role_arn"
  ];

  // Identity sources used to extract the authorization token or context.
  // For JWT authorizers: "$request.header.Authorization" (typical).
  // For REQUEST authorizers: varies by implementation.
  repeated string identity_sources = 6;

  // Time in seconds that API Gateway caches the authorizer result.
  // Range: 0-3600. Set to 0 to disable caching.
  // AWS default: 300 for REQUEST authorizers with identity sources.
  int32 result_ttl_seconds = 7;

  // Enable simple boolean responses from Lambda authorizers.
  // When true, the Lambda returns {"isAuthorized": true/false} instead of an
  // IAM policy document. Simpler to implement for most use cases.
  // Only applicable to REQUEST authorizers.
  bool enable_simple_responses = 8;

  // Payload format version for the Lambda authorizer event.
  // - "2.0" (recommended): Simplified event with direct access to headers/query params.
  // - "1.0": Legacy format.
  // Only applicable to REQUEST authorizers.
  string authorizer_payload_format_version = 9;
}

// AwsHttpApiGatewayJwtConfig configures JWT validation for a JWT authorizer.
message AwsHttpApiGatewayJwtConfig {
  // Token issuer URL. API Gateway validates that the JWT's "iss" claim matches
  // this value. Accepts a direct issuer URL -- for Cognito,
  // "https://cognito-idp.{region}.amazonaws.com/{userPoolId}"; for Auth0,
  // "https://{domain}/" -- or a reference to an AwsCognitoUserPool resource
  // (its issuer output carries exactly this URL).
  dev.planton.shared.foreignkey.v1.StringValueOrRef issuer = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsCognitoUserPool,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.issuer"
  ];

  // Expected audiences. API Gateway validates that the JWT's "aud" claim matches
  // one of these values. Each entry accepts a direct value -- for Cognito, an
  // app client ID -- or a reference to an AwsCognitoUserPoolClient resource;
  // literals and references can be mixed.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef audiences = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsCognitoUserPoolClient,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.client_id"
  ];
}
