apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awshttpapigateway
spec:
  # An HTTP API under live E2E: the scenario composes the Lambda fixture
  # chain via the e2e-prerequisites annotation (the Lambda minimal fixture
  # pulls its execution role, code bucket, and object set through its own
  # registry graph), then proves the API + stage (throttling, detailed
  # metrics, per-route overrides) + deduplicated integrations (Lambda proxy
  # AND public HTTP proxy) + routes, GetApi verification, destroy, and
  # verify-destroyed on both provisioners. Deliberately excluded from the
  # live lane (recorded reasons in the scenario header): authorizers, access
  # logging, VPC-link integrations (covered by the AwsHttpApiVpcLink lane),
  # and AWS service-integration subtypes.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
