# Install fixture consumed by kinds that declare AwsHttpApiGateway as a
# prerequisite (the custom domain's api_mappings). Deliberately dependency-
# free: a single HTTP_PROXY route to a public endpoint needs no Lambda chain,
# so consumers pay the minimum fixture cost. The kind's own richer lane
# lives in scenarios/lambda-and-proxy-routes.yaml.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsHttpApiGateway
metadata:
  name: planton-oss-e2e-awshttpapigw-prereq
  id: planton-oss-e2e-awshttpapigw-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awshttpapigateway
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E prerequisite HTTP API (proxy-only, dependency-free)
  routes:
    - routeKey: "$default"
      integration:
        integrationType: HTTP_PROXY
        integrationUri:
          value: https://checkip.amazonaws.com/
        integrationMethod: GET
