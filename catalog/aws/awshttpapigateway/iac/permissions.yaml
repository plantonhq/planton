# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awshttpapigateway
spec:
  aws:
    statements:
      - sid: ManageApiResources
        actions:
          - apigateway:GET
          - apigateway:POST
          - apigateway:PUT
          - apigateway:PATCH
          - apigateway:DELETE
        resources:
          - arn:aws:apigateway:*::/apis
          - arn:aws:apigateway:*::/apis/*
          - arn:aws:apigateway:*::/tags/*
        provenance: derived
        notes: API Gateway v2 authorizes by HTTP verb against resource paths, not per-entity action names -- these five verbs cover every module resource (aws_apigatewayv2_api, stage, integration, authorizer, route) and tagging. The /apis collection path is required for creation; the /apis/* subtree covers all child entities.
      - sid: PassIntegrationCredentials
        actions:
          - iam:PassRole
        resources:
          - arn:aws:iam::*:role/*
        provenance: derived
        notes: Required only when an integration's credentials_arn or a REQUEST authorizer's authorizer_credentials_arn references a role -- configuring the integration passes it to API Gateway. Scope to the actual role ARNs in a hardened deployment.
