# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awsalb
spec:
  aws:
    statements:
      - sid: ManageLoadBalancer
        actions:
          - elasticloadbalancing:CreateLoadBalancer
          - elasticloadbalancing:DeleteLoadBalancer
          - elasticloadbalancing:ModifyLoadBalancerAttributes
          - elasticloadbalancing:SetSecurityGroups
          - elasticloadbalancing:SetSubnets
          - elasticloadbalancing:SetIpAddressType
          - elasticloadbalancing:ModifyCapacityReservation
          - elasticloadbalancing:AddTags
          - elasticloadbalancing:RemoveTags
        resources:
          - arn:aws:elasticloadbalancing:*:*:loadbalancer/app/*
        provenance: derived
        notes: Covers aws_lb -- creation, attribute updates (idle timeout, desync mitigation, logging attributes, deletion protection), capacity reservation, and tagging.
      - sid: DescribeLoadBalancers
        actions:
          - elasticloadbalancing:DescribeLoadBalancers
          - elasticloadbalancing:DescribeLoadBalancerAttributes
          - elasticloadbalancing:DescribeCapacityReservation
          - elasticloadbalancing:DescribeTags
        resources:
          - "*"
        provenance: derived
        notes: Read-side of aws_lb during plan/refresh. Elastic Load Balancing Describe APIs support no resource-level scoping, so the wildcard is the narrowest possible scope.
      - sid: ManageDnsAliases
        actions:
          - route53:ChangeResourceRecordSets
          - route53:ListResourceRecordSets
          - route53:GetChange
        resources:
          - arn:aws:route53:::hostedzone/*
          - arn:aws:route53:::change/*
        provenance: derived
        notes: Covers aws_route53_record -- the optional alias records created when spec.dns is enabled. GetChange polls propagation status on the change id.
      - sid: AssociateWebAcl
        actions:
          - wafv2:AssociateWebACL
          - wafv2:DisassociateWebACL
          - wafv2:GetWebACLForResource
        resources:
          - arn:aws:wafv2:*:*:regional/webacl/*/*
          - arn:aws:elasticloadbalancing:*:*:loadbalancer/app/*
        provenance: derived
        notes: Covers aws_wafv2_web_acl_association -- created only when spec.web_acl_arn is set. The wafv2 association actions scope to the web ACL and load balancer ARNs; the companion elasticloadbalancing:SetWebAcl grant lives in its own statement because it cannot be resource-scoped.
      - sid: SetWebAclOnLoadBalancer
        actions:
          - elasticloadbalancing:SetWebAcl
        resources:
          - "*"
        provenance: derived
        notes: WAFv2 association with an ALB additionally requires elasticloadbalancing:SetWebAcl. The service reference lists NO resource types for it (unlike the Describe and lifecycle actions, which scope), so IAM evaluates it against Resource "*" -- an ARN-scoped grant never matches and would deny the association at runtime. The wildcard is the narrowest possible scope.
