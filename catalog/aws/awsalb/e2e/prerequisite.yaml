# AwsAlb install profile used as a prerequisite by composed kinds (a
# listener attaches to it by ARN). The harness deploys it after the AwsVpc
# and two-AZ AwsSubnet prerequisites, resolving each subnets entry against
# the specific subnet instance it names, and captures load_balancer_arn for
# the dependent's references. Internal on purpose: an internet-facing ALB
# requires an internet gateway the harness VPC does not carry. Full metadata
# is supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsAlb
metadata:
  name: planton-oss-e2e-awsalb-prereq
  id: planton-oss-e2e-awsalb-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsalb
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  internal: true
  subnets:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-b
        fieldPath: status.outputs.subnet_id
