# Minimal AwsAlb scenario: an INTERNAL ALB across the two-AZ subnet
# prerequisite pair. Each subnets entry is a value_from reference addressing
# one specific subnet instance by name (the install profile publishes two,
# in different availability zones -- an AWS requirement for ALBs). Internal
# on purpose: an internet-facing ALB requires the VPC to carry an internet
# gateway, which the harness VPC does not -- the internal scheme proves the
# ALB lifecycle without dragging the gateway chain into every run. No
# security groups: AWS attaches the VPC default group, which is enough for a
# create-and-destroy existence check. The web_acl_arn reference (resolved
# against the fixture web ACL the e2e-prerequisites annotation deploys)
# proves the WAF association the module creates alongside the load
# balancer. Full metadata is supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsAlb
metadata:
  name: planton-oss-e2e-awsalb-smoke
  id: planton-oss-e2e-awsalb-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsalb
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsWafWebAcl"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  internal: true
  subnets:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-b
        fieldPath: status.outputs.subnet_id
  idleTimeoutSeconds: 60
  desyncMitigationMode: defensive
  wafFailOpenEnabled: true
  webAclArn:
    valueFrom:
      kind: AwsWafWebAcl
      name: planton-oss-e2e-awswafwebacl-prereq
      fieldPath: status.outputs.web_acl_arn
