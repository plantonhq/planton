apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsalb
spec:
  # An Application Load Balancer under live E2E: the harness deploys the
  # AwsVpc prerequisite and the two-AZ AwsSubnet prerequisite pair (an ALB
  # requires subnets in at least two availability zones), then runs deploy ->
  # DescribeLoadBalancers verify -> destroy -> verify-destroyed on both
  # provisioners. ALB creation takes 2-3 minutes and deletion similar; the
  # timeout budgets for both plus the prerequisite chain. The scenario also
  # declares an AwsWafWebAcl prerequisite (the e2e-prerequisites annotation)
  # and attaches it via web_acl_arn, proving the wafv2 web-ACL association
  # live on both engines (run 2026-07-08: Pulumi 5m35s / Terraform 5m41s).
  #
  # Deliberately not in the live lane, each proven by CEL spec tests and
  # the offline plan/preview gate: the LCU capacity reservation (BILLS for
  # the reserved units while set; unblock: an owner-budgeted event window)
  # and IPAM-pool addressing (no IPAM pool fixture exists; unblock: an
  # IPAM-pool fixture if a VPC IPAM kind ever ships) -- both render in the
  # canonical e2e/manifest.yaml and the 03-reserved-capacity preset on
  # both engines.
  #
  # Re-proven 2026-08-12 after the depth close (both engines, all eight
  # phases): Pulumi 6m32s / Terraform 6m44s. Mid-lane evidence on BOTH
  # lanes' balancers: state provisioning -> active in
  # DescribeLoadBalancers, and GetWebACLForResource returning the fixture
  # web ACL by name/ARN once active (the association attaches as the ALB
  # becomes ready -- a null answer during "provisioning" is timing, not a
  # missing association).
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
  # 2026-08-13 tag-convergence sweep: the Pulumi identity-tag map gained the
  # canonical Name key, converging on the key set the Terraform module (and
  # this badge's live proof) already sends. Declared-set equality is now
  # machine-enforced by hack/guards/ensure_cross_engine_tag_keys.sh; the
  # change class is live-re-proven once via Q31 (awssqsqueue represents it).
