# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awssagemakermodelregistry
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The group stores no customer data -- it is registry metadata (names, descriptions, approval states) held in SageMaker's control plane. The model artifacts its registered versions point at rest in S3, encrypted per the owning buckets' posture.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: There is no data at rest to key (see enc-at-rest); the group exposes no KMS surface. Customer-key choices live on the artifact buckets.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The group terminates no connections of its own. All traffic involving it -- registration, approval, describe calls -- rides the SageMaker API, which serves exclusively over TLS as provider behavior, not per-group configuration.
    - control_id: no-public-access
      status: not_applicable
      notes: "A model package group has no network endpoint to expose. Its real exposure surface is identity, not network: WHO can register or read packages is exactly what IAM and the optional resource_policy govern (see rbac)."
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network surface exists to filter; the registry is a catalog object with no addresses or ports.
    - control_id: edge-protection
      status: not_applicable
      notes: The group receives no HTTP requests -- web ACLs and request filters have nothing to attach to.
    - control_id: rbac
      status: configurable
      field_path: resource_policy
      evidence:
        type: spec_default
        reference: Absent, the group is reachable only through its own account's IAM -- every operation authorizes against the model-package-group ARN. Setting resource_policy attaches an IAM resource policy that grants declared external principals specific actions (the cross-account sharing pattern -- DescribeModelPackage and CreateModelPackage for a partner account), and removing it from the spec deletes the policy, closing the group to its own account again.
      notes: The policy is the group's one in-place-updatable surface; the modules upsert it idempotently. Its quality is the operator's -- a policy principal of "*" would open the registry to everyone, so the control is configurable rather than enforced.
    - control_id: workload-identity
      status: not_applicable
      notes: The group runs no workload and carries no role -- registration and approval calls are made by pipelines and users under their OWN identities, which is precisely what makes the registry's audit trail attributable.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The single access path is SigV4-signed HTTPS through the SageMaker API; no legacy or weaker authentication path exists to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every registry operation -- group lifecycle, policy changes, and the model package registrations and approval-status transitions that flow through it -- is a SageMaker control-plane API call recorded by CloudTrail by default, so who registered and who approved each version is always attributable.
    - control_id: monitoring-integration
      status: not_applicable
      notes: SageMaker publishes no CloudWatch metrics for model package groups -- there is no runtime to measure. Deployment-time signals belong to the endpoints serving registered versions.
    - control_id: backup-recovery
      status: not_applicable
      notes: "The group is a named shell fully re-creatable from the manifest. The registered versions inside it are imperative records created by pipelines, and their durable substance -- the model artifacts -- lives in S3 with that bucket's durability; re-registering pointers is a pipeline re-run, not a restore."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery); the registry keeps versions until they are explicitly deleted, with no retention window to configure.
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The group is regional control-plane metadata AWS stores in its own multi-AZ service infrastructure; there is no zonal placement to configure.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither AWS nor the modules expose a deletion-protection flag for model package groups -- deletion succeeds whenever IAM allows it. The registered model packages are separate resources with their own lifecycle, and the S3 artifacts they point at are never touched by registry deletion.
    - control_id: managed-patching
      status: not_applicable
      notes: A registry group is a pure configuration object with no software to patch.
