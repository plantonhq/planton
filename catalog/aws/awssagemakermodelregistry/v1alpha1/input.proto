syntax = "proto3";

package dev.planton.aws.awssagemakermodelregistry.v1alpha1;

import "catalog/aws/awssagemakermodelregistry/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsSagemakerModelRegistryIacInput is the input for the IaC modules
// that deploy the model package group.
message AwsSagemakerModelRegistryIacInput {
  // target is the AwsSagemakerModelRegistry resource to deploy.
  AwsSagemakerModelRegistry target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
