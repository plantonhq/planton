# AwsCloudwatchAlarm install profile used as a prerequisite by composed
# kinds (the composite alarm's registry prerequisite). A simple-metric
# CPU alarm with actions disabled: a true leaf that creates in seconds, costs
# ~$0.10/month prorated for the minutes it lives, and never acts. Its
# CloudWatch name doubles as the join key composite rules reference, so the
# fixture name is stable by design. Full metadata is supplied for
# tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsCloudwatchAlarm
metadata:
  name: planton-oss-e2e-awscloudwatchalarm-prereq
  id: planton-oss-e2e-awscloudwatchalarm-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awscloudwatchalarm
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  comparisonOperator: GreaterThanThreshold
  evaluationPeriods: 1
  threshold: 99.0
  metricName: CPUUtilization
  namespace: AWS/EC2
  period: 300
  statistic: Average
  treatMissingData: notBreaching
  actionsEnabled: false
  alarmDescription: "Planton E2E prerequisite alarm (simple metric mode; actions disabled)"
