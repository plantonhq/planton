syntax = "proto3";

package dev.planton.aws.awscloudwatchalarm.v1alpha1;

import "catalog/aws/awscloudwatchalarm/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsCloudwatchAlarmIacInput provides the inputs required by Pulumi/Terraform
// modules to provision a CloudWatch metric alarm.
message AwsCloudwatchAlarmIacInput {
  // target infra-component
  AwsCloudwatchAlarm target = 1;
  // provider-config
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
