syntax = "proto3";

package dev.planton.aws.awscostanomalymonitor.v1alpha1;

// AwsCostAnomalyMonitorOutputs captures the observable state of
// the anomaly monitor after apply.
message AwsCostAnomalyMonitorOutputs {
  // The monitor's ARN (also the provider's import ID).
  string monitor_arn = 1;

  // Subscription ARNs keyed by subscription name (each subscription
  // imports by its ARN).
  map<string, string> subscription_arns = 2;
}
