# Minimal AwsEksFargateProfile scenario: one namespace selector on the
# EKS control-plane prerequisite, running as the Fargate pod-execution
# role from the IAM prerequisite profile (which carries
# AmazonEKSFargatePodExecutionRolePolicy itself). The harness subnets
# qualify as Fargate subnets because the E2E VPC has no internet
# gateway -- AWS rejects subnets with an IGW route. No pods are ever
# scheduled: creating the profile validates the full
# cluster/role/subnet/selector wiring without launching anything. Full
# metadata is supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsEksFargateProfile
metadata:
  name: planton-oss-e2e-eksfp-smoke
  id: planton-oss-e2e-eksfp-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awseksfargateprofile
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  clusterName:
    valueFrom:
      kind: AwsEksCluster
      name: planton-oss-e2e-eks-cluster-prereq
      fieldPath: status.outputs.name
  podExecutionRoleArn:
    valueFrom:
      kind: AwsIamRole
      name: planton-oss-e2e-eks-fargate-pod-role
      fieldPath: status.outputs.role_arn
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-b
        fieldPath: status.outputs.subnet_id
  selectors:
    - namespace: planton-e2e-serverless
