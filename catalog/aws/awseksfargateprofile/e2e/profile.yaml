apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awseksfargateprofile
spec:
  # An EKS Fargate profile under live E2E: deploy ->
  # DescribeFargateProfile verify -> destroy -> verify-destroyed on both
  # provisioners. Profile creation takes a few minutes (AWS serializes
  # profile operations per cluster), and every run rides the full
  # VPC -> subnets -> roles -> cluster prerequisite chain (~15 minutes to
  # stand up, ~10 to tear down), so the timeout is sized for the chain.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 60
  # 2026-08-13 tag-convergence sweep: the Pulumi identity-tag map gained the
  # canonical Name key, converging on the key set the Terraform module (and
  # this badge's live proof) already sends. Declared-set equality is now
  # machine-enforced by hack/guards/ensure_cross_engine_tag_keys.sh; the
  # change class is live-re-proven once via Q31 (awssqsqueue represents it).
