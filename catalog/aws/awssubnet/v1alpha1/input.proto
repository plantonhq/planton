syntax = "proto3";

package dev.planton.aws.awssubnet.v1alpha1;

import "catalog/aws/awssubnet/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsSubnetIacInput is the input to the IaC modules (Pulumi / Terraform) that
// deploy an AwsSubnet resource.
message AwsSubnetIacInput {
  // target infra-component
  AwsSubnet target = 1;
  // provider-config
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
