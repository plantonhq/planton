apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsiaminstanceprofile
spec:
  # An instance profile under live E2E: the harness first deploys the
  # AwsIamRole prerequisite (declared in the kind registry), resolves the
  # profile's role reference against its outputs, then runs deploy ->
  # GetInstanceProfile verify -> destroy -> verify-destroyed on both
  # provisioners. This is the composed identity chain (role -> profile)
  # exercised live. IAM is global and free.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
  # 2026-08-13 tag-convergence sweep: the Pulumi identity-tag map gained the
  # canonical Name key, converging on the key set the Terraform module (and
  # this badge's live proof) already sends. Declared-set equality is now
  # machine-enforced by hack/guards/ensure_cross_engine_tag_keys.sh; the
  # change class is live-re-proven once via Q31 (awssqsqueue represents it).
