# AwsIamInstanceProfile install profile used as a prerequisite by composed
# components (declared via the planton.dev/e2e-prerequisites annotation or
# prerequisites: [AwsIamInstanceProfile] in the kind registry). The profile
# wraps the shared ec2-trust role fixture -- the instance-side identity a
# launched instance assumes (the ECS Managed Instances launch template's
# ec2_instance_profile_arn is the first consumer). Full metadata is
# supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamInstanceProfile
metadata:
  name: planton-oss-e2e-awsiaminstanceprofile-prereq
  id: planton-oss-e2e-awsiaminstanceprofile-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsiaminstanceprofile
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  path: /planton-e2e/
  role:
    valueFrom:
      kind: AwsIamRole
      name: planton-oss-e2e-awsiamrole-prereq
      fieldPath: status.outputs.role_name
