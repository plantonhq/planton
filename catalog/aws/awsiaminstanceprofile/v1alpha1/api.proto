syntax = "proto3";

package dev.planton.aws.awsiaminstanceprofile.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsiaminstanceprofile/v1alpha1/outputs.proto";
import "catalog/aws/awsiaminstanceprofile/v1alpha1/spec.proto";
import "shared/metadata.proto";

//aws-iam-instance-profile
message AwsIamInstanceProfile {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsIamInstanceProfile'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsIamInstanceProfileSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsIamInstanceProfileStatus status = 5;
}

//aws-iam-instance-profile status
message AwsIamInstanceProfileStatus {
  //outputs
  AwsIamInstanceProfileOutputs outputs = 1;
}
