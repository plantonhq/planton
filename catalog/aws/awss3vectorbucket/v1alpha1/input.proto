syntax = "proto3";

package dev.planton.aws.awss3vectorbucket.v1alpha1;

import "catalog/aws/awss3vectorbucket/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsS3VectorBucketIacInput is the input for the IaC modules that
// manage an S3 vector bucket and its indexes.
message AwsS3VectorBucketIacInput {
  // target is the AwsS3VectorBucket resource to deploy.
  AwsS3VectorBucket target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
