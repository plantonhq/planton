apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awss3vectorbucket
spec:
  # One scenario: bucket + one Titan-sized index (1024/cosine) with
  # non-filterable keys. Free at rest (billing is per stored vector
  # and per query - the lane never puts one); no fixtures; seconds
  # per lifecycle phase.
  #
  # Deliberately not exercised live:
  #   - the bucket policy -- a valid policy needs the harness account
  #     id in the principal. Unblock: the PLANTON_E2E_AWS_ACCOUNT_ID
  #     token in the scenario vocabulary.
  #   - KMS encryption -- fixed for life of the bucket, so a second
  #     scenario, not an update path; the pairing CEL is the
  #     load-bearing guard. Unblock: an AwsKmsKey fixture scenario
  #     when demand shows.
  #
  # PROVEN live 2026-08-26 (Q46): both engines through the full
  # six-phase runner + the Terraform blind import round-trip under the
  # armed apply-idempotency gate (~65s per engine). Clean first-pass -
  # the 1024/cosine index with non-filterable keys reached ACTIVE and
  # the bucket + address-keyed index ARNs re-imported blind at zero
  # diff.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
