# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awss3vectorbucket
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Vector data is always server-side encrypted -- an unset encryption block means S3-managed keys (SSE-S3), per the spec contract and AWS's default; unencrypted vector storage is not representable.
    - control_id: enc-at-rest-cmk
      status: configurable
      field_path: encryption.kms_key_arn
      evidence:
        type: spec_default
        reference: Setting sse_type aws:kms with a referenced AwsKmsKey puts the bucket (and, via each index's own encryption block, individual indexes) under a customer managed key; the spec's CEL keeps the key-and-type pairing honest.
      notes: Encryption is fixed for the life of the bucket and of each index -- choose the key posture BEFORE the first vector lands, because changing it later is a replacement.
    - control_id: enc-in-transit
      status: configurable
      field_path: policy
      evidence:
        type: spec_default
        reference: The bucket resource policy is a full policy surface -- a deny on insecure transport (the standard aws:SecureTransport condition pattern) makes TLS mandatory for every put and query caller.
      notes: Absent such a statement, transport security rides clients using the HTTPS endpoints -- the API accepts no unauthenticated path either way.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A vector bucket has no public-access surface -- no ACLs, no website hosting, no anonymous path; every request is IAM-authorized, and cross-account access (a Bedrock knowledge base in another account, say) exists only where the resource policy explicitly grants it.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No listener or port surface exists to restrict -- reachability is the S3 Vectors API endpoints, request-authorized per principal. Network-conditioned access is a policy statement, assessed under the policy-bearing controls.
    - control_id: edge-protection
      status: not_applicable
      notes: Vector storage fronts no web application -- RAG stacks and Bedrock knowledge bases call it through the AWS API; there is no WAF attachment point.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Access is deny-by-default IAM at two grains -- the bucket (arn:...:bucket/name) and each index (arn:...:bucket/name/index/name) -- and the data-plane verbs (PutVectors, QueryVectors, GetVectors) are real per-index IAM actions, so a grant can let one application query a single index without touching its neighbors. The policy field layers explicit cross-account grants on top."
    - control_id: workload-identity
      status: not_applicable
      notes: The bucket runs no workloads and holds no credentials -- callers (embedding pipelines, Bedrock knowledge bases) bring their own IAM principals.
    - control_id: no-legacy-auth
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every request is SigV4-signed IAM against the S3 Vectors API -- no anonymous, ACL-based, or legacy authentication path exists for vector buckets.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: The spec exposes no audit dial. Control-plane operations (bucket, index, policy lifecycle) land in AWS CloudTrail as account-level management events; capturing put/query activity is account CloudTrail territory -- none of it configurable on this component.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The spec exposes no monitoring surface, and unlike its table-bucket sibling the s3vectors action inventory currently publishes no metrics-configuration surface either -- a genuinely new service; observability today is CloudTrail and the caller's own instrumentation.
    - control_id: backup-recovery
      status: not_applicable
      notes: "No replication, versioning, or export surface exists on this spec. The honest recovery story is re-embedding: vectors are derived data, recomputable from the source documents (which live in their own stores with their own recovery posture). Plan for it -- every index property is create-only, so recovery means a replacement index refilled by the pipeline."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to schedule retention for (see backup-recovery); nothing on the spec ages data out -- vectors persist until overwritten or deleted.
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A regional managed storage service sold as elastic, durable S3 vector storage -- AWS operates the redundancy; the spec has no zonal placement or redundancy dial to get wrong, in deliberate contrast to the single-zone directory bucket.
    - control_id: deletion-protection
      status: configurable
      field_path: force_destroy
      evidence:
        type: spec_default
        reference: Off by default -- destroying a bucket that still holds indexes FAILS until they are removed. Setting force_destroy true removes the guard by deleting every index and vector first; the spec's own comment says destroying embeddings that took real money to compute should hurt.
      notes: force_destroy is config-only at AWS (never read back), so an imported bucket does not round-trip it.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed storage service -- AWS operates and patches the storage and query infrastructure; the bucket exposes no runtime, version, or maintenance surface.
