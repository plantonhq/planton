apiVersion: aws.planton.dev/v1alpha1
kind: AwsCognitoUserPoolClient
metadata:
  name: ${name}
  org: '${org}'
  env: ${env}
  id: ${id}
  annotations:
    planton.dev/provisioner: pulumi
    pulumi.planton.dev/stack.name: ${env}.AwsCognitoUserPoolClient.${name}
spec:
  region: <aws-region>
  userPoolId:
    valueFrom:
      kind: AwsCognitoUserPool
      name: <user-pool-name>
      fieldPath: status.outputs.user_pool_id
  generateSecret: true
  allowedOauthFlowsUserPoolClient: true
  allowedOauthFlows:
    - client_credentials
  allowedOauthScopes:
    - <resource-server-identifier>/read
    - <resource-server-identifier>/write
  accessTokenValidity: 30
  tokenValidityUnits:
    accessToken: minutes
