# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awscognitouserpoolclient
spec:
  aws:
    statements:
      - sid: ManageUserPoolClient
        actions:
          - cognito-idp:CreateUserPoolClient
          - cognito-idp:UpdateUserPoolClient
          - cognito-idp:DeleteUserPoolClient
          - cognito-idp:DescribeUserPoolClient
        resources:
          - arn:aws:cognito-idp:*:*:userpool/*
        provenance: derived
        notes: Covers aws_cognito_user_pool_client across both source arms (the Pulumi module drives the same provider through the pulumi-aws bridge). Create registers the client with its OAuth contract, auth flows, token lifetimes, and optional analytics wiring; Update handles every in-place change (user_pool_id and generate_secret are ForceNew and replace via Delete+Create); Describe serves plan/refresh. App clients are sub-resources of the pool with no ARN of their own -- the service reference authorizes all four actions on the userpool ARN format, so the pool pattern is the exact scope. The resource carries no tags, so no tagging actions are needed.
      - sid: ManageRiskConfiguration
        actions:
          - cognito-idp:SetRiskConfiguration
          - cognito-idp:DescribeRiskConfiguration
        resources:
          - arn:aws:cognito-idp:*:*:userpool/*
        provenance: derived
        notes: Exercised only when spec.risk_configuration is set -- both modules then register aws_cognito_risk_configuration scoped to this client's ID. SetRiskConfiguration writes the configuration (and clears it on destroy); DescribeRiskConfiguration serves plan/refresh. Both actions authorize on the userpool ARN per the service reference.
      - sid: PassAnalyticsRoleToCognito
        actions:
          - iam:PassRole
        resources:
          - arn:aws:iam::*:role/*
        provenance: derived
        notes: Exercised only when spec.analytics_configuration uses the application_id arm -- both modules then submit analytics_configuration.role_arn, the role Cognito assumes (service principal cognito-idp.amazonaws.com, guarded by the external_id) to publish sign-in/sign-up events to Pinpoint, and Create/UpdateUserPoolClient validate the caller may pass it. The application_arn arm derives the publish role AWS-side and passes nothing. Narrow the resource to the deployment's analytics role ARN (or naming convention) once fixed, and add an iam:PassedToService=cognito-idp.amazonaws.com condition.
