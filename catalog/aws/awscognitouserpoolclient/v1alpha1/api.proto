syntax = "proto3";

package dev.planton.aws.awscognitouserpoolclient.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awscognitouserpoolclient/v1alpha1/outputs.proto";
import "catalog/aws/awscognitouserpoolclient/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsCognitoUserPoolClient is the API envelope for a Cognito User Pool app
// client -- the per-application OAuth 2.0 / OIDC contract against a user pool.
message AwsCognitoUserPoolClient {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this resource, must be "AwsCognitoUserPoolClient".
  string kind = 2 [(buf.validate.field).string.const = "AwsCognitoUserPoolClient"];

  // metadata captures identifying information (name, org, environment,
  // labels) and must pass standard validations for resource naming.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the desired configuration of the app client.
  AwsCognitoUserPoolClientSpec spec = 4 [(buf.validate.field).required = true];

  // status holds post-deployment information.
  AwsCognitoUserPoolClientStatus status = 5;
}

// AwsCognitoUserPoolClientStatus describes the status of a Cognito User Pool
// app client resource.
message AwsCognitoUserPoolClientStatus {
  // outputs captures the observable values returned by Pulumi/Terraform
  // after provisioning.
  AwsCognitoUserPoolClientOutputs outputs = 1;
}
