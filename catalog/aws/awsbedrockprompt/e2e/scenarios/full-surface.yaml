# AwsBedrockPrompt full-surface scenario: two variants -- a text variant
# and a chat variant with system context, a tool catalog with auto
# choice, inference settings, and metadata -- with default_variant
# pinning the chat variant. Proves the derived TEXT/CHAT discriminators,
# the tool tree, and the variant fan-out both engines share.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsBedrockPrompt
metadata:
  name: planton-oss-e2e-awsbrpmt-full
  id: planton-oss-e2e-awsbrpmt-full
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsbedrockprompt
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Full-surface two-variant prompt
  defaultVariant: chat
  variants:
    - name: text
      modelId: amazon.nova-micro-v1:0
      text:
        text: "Answer the customer question concisely: {{question}}"
        inputVariables:
          - question
      inferenceConfiguration:
        maxTokens: 512
        temperature: 0
        topP: 0.9
      metadata:
        team: support
    - name: chat
      modelId: amazon.nova-lite-v1:0
      chat:
        system:
          - text: You are a concise support assistant.
        messages:
          - role: user
            text: "Answer the question: {{question}}"
          - role: assistant
            text: "Certainly:"
        inputVariables:
          - question
        toolConfiguration:
          tools:
            - spec:
                name: lookup_order
                description: Look up an order by its ID.
                inputSchema:
                  type: object
                  properties:
                    order_id:
                      type: string
                  required:
                    - order_id
          toolChoice:
            auto: true
