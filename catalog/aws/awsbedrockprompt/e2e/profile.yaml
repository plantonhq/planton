apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsbedrockprompt
spec:
  # A Bedrock prompt under live E2E: two free, seconds-scale lanes
  # (prompts bill per model invocation at runtime -- create/delete is
  # $0). The minimal lane proves the TEXT template lifecycle. The
  # full-surface lane proves two variants (text + chat with system
  # context, a tool catalog with auto choice, inference settings,
  # metadata) and default_variant pinning. Verification is GetPrompt
  # keyed on prompt_id (exists with variants).
  #
  # Deliberately not exercised live: the agent execution target (needs
  # the agent prerequisite's alias -- offline-proven; unblock: extend the
  # full-surface scenario once the agents family is PROVEN), prompt
  # caching checkpoints (model-support-gated; the render is
  # offline-proven via e2e/manifest.yaml), and
  # additional_model_request_fields (model-specific passthrough --
  # offline-proven).
  #
  # Live dual-engine run 2026-08-14 (session 056): Pulumi both
  # scenarios ~85s; Terraform both scenarios ~91s after the catalog
  # declared variant inference floats write-normalized (Bedrock stores
  # them as float32; 0.9 reads back 0.8999999761581421 on blind import).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
