apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awsbedrockprompt
spec:
  # The prompt imports by its bare id.
  values:
    - name: prompt_id
      derivations:
        - from_output: prompt_id
      where_to_find: >-
        Bedrock console -> Prompt management -> <prompt> (the ID), or
        `aws bedrock-agent list-prompts` (id).
