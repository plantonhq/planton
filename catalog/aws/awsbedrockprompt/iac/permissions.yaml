# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awsbedrockprompt
spec:
  aws:
    statements:
      - sid: CreatePrompt
        actions:
          - bedrock:CreatePrompt
        resources:
          - "*"
        provenance: derived
        notes: Covers aws_bedrockagent_prompt / bedrock.AgentPrompt creation -- the module's single resource (the mutable DRAFT). CreatePrompt is NON-SCOPABLE -- the bedrock service reference lists no resource types for it (the prompt ID does not exist until the call returns) -- so the wildcard is the narrowest possible scope; an ARN-scoped grant would be a runtime DENY.
      - sid: ManagePrompt
        actions:
          - bedrock:GetPrompt
          - bedrock:UpdatePrompt
          - bedrock:DeletePrompt
        resources:
          - arn:aws:bedrock:*:*:prompt/*
        provenance: derived
        notes: Read-back, in-place DRAFT updates (description, variants, default variant), and destroy. Get runs on every plan/refresh. All three actions take the prompt resource type per the service reference (Get and Delete also accept prompt-version, which this module never touches -- it manages the DRAFT only); narrow the region and account segments in a hardened deployment.
      - sid: TagPrompt
        actions:
          - bedrock:TagResource
          - bedrock:UntagResource
          - bedrock:ListTagsForResource
        resources:
          - arn:aws:bedrock:*:*:prompt/*
        provenance: derived
        notes: The module applies the platform tag set to the prompt (tags = local.aws_tags); ListTagsForResource is read back on every refresh. Tagging actions cover the prompt resource type per the service reference. No iam:PassRole is needed anywhere -- the spec carries no execution role.
