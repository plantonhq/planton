# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsbedrockprompt
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Bedrock encrypts stored prompts at rest with a Bedrock-managed key when no customer key is supplied -- the spec contract states the default plainly ("Without it, AWS uses a Bedrock-managed key"). Prompt bodies can carry sensitive instruction material, so this default matters more than the object's size suggests.
    - control_id: enc-at-rest-cmk
      status: configurable
      field_path: customer_encryption_key_arn
      evidence:
        type: spec_default
        reference: Unset by default (Bedrock-managed key); setting a customer-managed KMS key ARN re-keys the prompt to a key whose rotation, policy, and revocation the account controls. Revoking the key renders the stored template unreadable -- the standard CMK kill switch.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: All Prompt Management APIs (create, update, render, version) are HTTPS-only SigV4 endpoints; template bodies never travel in plaintext.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A prompt is reachable only through IAM-authorized Bedrock APIs in its own account -- no anonymous endpoint, no resource policy, no public-exposure switch exists.
    - control_id: restricted-ingress
      status: not_applicable
      notes: Nothing listens on a stored template -- there is no network surface to restrict.
    - control_id: edge-protection
      status: not_applicable
      notes: No request-serving surface exists to front with a WAF; executions enter through AWS's own API endpoints.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every operation authorizes through IAM against the prompt ARN -- GetPrompt, UpdatePrompt, DeletePrompt, RenderPrompt, and CreatePromptVersion all take the prompt resource type per the bedrock service reference, so per-prompt least privilege (who may read templates vs who may change them) is expressible directly in policy.
    - control_id: workload-identity
      status: not_applicable
      notes: A prompt carries no execution role and runs nothing itself -- the invoking workload brings its own identity, and a variant routed through an agent alias executes under the referenced agent's service role, governed on that component.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: SigV4-signed IAM requests are the only authentication path; no legacy protocol exists to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Prompt lifecycle operations -- creation, template edits, version snapshots, deletion -- are control-plane calls CloudTrail records unconditionally as management events, so who changed the production prompt text and when is always answerable.
      notes: Runtime capture of executions (which inputs hit which model) is model-invocation-logging territory on the AwsBedrockInvocationLogging component.
    - control_id: monitoring-integration
      status: not_applicable
      notes: Bedrock's monitoring documentation enumerates metric namespaces for model invocations (AWS/Bedrock) and agents (AWS/Bedrock/Agents) -- none covers Prompt Management, and the spec carries no metrics surface. Execution metrics appear under the invoked model's or agent's namespaces, attributed to the caller rather than to the template.
    - control_id: backup-recovery
      status: not_applicable
      notes: The prompt's content IS this manifest -- the component manages the mutable DRAFT, fully re-creatable by re-deploying. Immutable versions snapshotted in AWS (outside this spec) are themselves the service's point-in-time protection for production references.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery); versions persist until explicitly deleted and carry no retention schedule.
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Bedrock is a regional managed service operated across availability zones; a stored template has no zonal placement surface the manifest could configure.
    - control_id: deletion-protection
      status: not_applicable
      notes: No deletion-protection flag exists on a prompt. Deleting it removes the DRAFT and its versions -- anything invoking the prompt by ARN starts failing -- but the template is one re-deploy away from restoration since this manifest is the source of truth.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- AWS operates Prompt Management's storage and rendering; the object exposes no runtime, version, or maintenance surface.
