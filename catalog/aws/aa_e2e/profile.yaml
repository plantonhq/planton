apiVersion: qa.planton.dev/v1
kind: ProviderE2EProfile
metadata:
  name: aws
spec:
  credential_approach: oidc
  test_substrate: real_cloud
  default_cost_class: paid_ephemeral
  default_schedule_lane: weekly
  required_tools:
    - pulumi
    - tofu
    - aws-cli
  github_environment: e2e-aws
  max_concurrent_tests: 4
  # Every lane re-plans after apply and fails on any pending change (the
  # IDEMPOTENCY phase): the AWS depth waves burned down the perpetual-diff
  # classes (presence-typed sends, always-send explicit-false heals), and
  # this gate holds that re-apply-is-a-no-op contract mechanically for the
  # kind under test. It is also the standing guard for plan-time
  # replacement churn (e.g. re-minted marketplace offer tokens must ride an
  # ignore-changes guard or every re-apply replaces the agreement).
  assert_apply_idempotency: true
