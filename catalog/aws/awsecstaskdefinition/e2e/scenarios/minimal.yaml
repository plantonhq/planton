# Minimal AwsEcsTaskDefinition scenario: one Fargate container from a
# public image, composed onto the shared execution-role fixture -- AWS
# requires an execution role at registration time because the default
# logging wiring uses the awslogs driver. This same manifest doubles as
# the install profile when the task definition is a prerequisite of the
# ECS service chain. Full metadata is supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsEcsTaskDefinition
metadata:
  name: planton-oss-e2e-ecs-taskdef
  id: planton-oss-e2e-ecs-taskdef
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsecstaskdefinition
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  cpu: 256
  memory: 512
  executionRole:
    valueFrom:
      kind: AwsIamRole
      name: planton-oss-e2e-ecs-execution-role
      fieldPath: status.outputs.role_arn
  containers:
    - name: app
      image: public.ecr.aws/nginx/nginx:stable
      portMappings:
        - containerPort: 80
          name: http
