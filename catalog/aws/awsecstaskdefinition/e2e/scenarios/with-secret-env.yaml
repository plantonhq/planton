# AwsEcsTaskDefinition secret-environment scenario: the minimal Fargate
# task plus one plain variable and one secret_environment entry. The module
# must create the Secrets Manager secret
# planton-oss-e2e-ecs-taskdef-secret-env/app/E2E_TOKEN with a resource policy
# naming the shared execution-role fixture, store the value, and register a
# revision whose container carries the secret's ARN pinned to that version in
# secrets -- never the value in environment. Destroy deletes the secret with
# no recovery window. The value is a literal because this lane runs without a
# platform; on Planton the field takes only a $secret/ reference.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsEcsTaskDefinition
metadata:
  name: planton-oss-e2e-ecs-taskdef-secret-env
  id: planton-oss-e2e-ecs-taskdef-secret-env
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: awsecstaskdefinition
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  cpu: 256
  memory: 512
  executionRole:
    valueFrom:
      kind: AwsIamRole
      name: planton-oss-e2e-ecs-execution-role
      fieldPath: status.outputs.role_arn
  containers:
    - name: app
      image: public.ecr.aws/nginx/nginx:stable
      portMappings:
        - containerPort: 80
          name: http
      environment:
        LOG_LEVEL: info
      secretEnvironment:
        E2E_TOKEN: e2e-not-a-real-secret
