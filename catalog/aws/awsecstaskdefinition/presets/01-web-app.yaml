apiVersion: aws.planton.dev/v1alpha1
kind: AwsEcsTaskDefinition
metadata:
  name: <service-name>
spec:
  region: <aws-region>
  cpu: 512
  memory: 1024
  executionRole:
    valueFrom:
      kind: AwsIamRole
      name: <execution-role-resource-name>
      fieldPath: status.outputs.role_arn
  taskRole:
    valueFrom:
      kind: AwsIamRole
      name: <task-role-resource-name>
      fieldPath: status.outputs.role_arn
  containers:
    - name: app
      image: <account-id>.dkr.ecr.<aws-region>.amazonaws.com/<repository>:<tag>
      portMappings:
        - containerPort: 8080
          name: http
          appProtocol: http
      environment:
        APP_ENV: production
      # A secret another owner manages, by ARN.
      secrets:
        DATABASE_URL: arn:aws:secretsmanager:<aws-region>:<account-id>:secret:<secret-name>
      # A secret held in Planton: the component stores it in Secrets Manager,
      # readable only by the execution role -- never in `environment`.
      secretEnvironment:
        PAYMENTS_API_KEY: $secret/<payments-api-key-slug>
      healthCheck:
        command: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
        startPeriodSeconds: 30
      readonlyRootFilesystem: true
