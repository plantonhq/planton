syntax = "proto3";

package dev.planton.aws.awselasticfilesystem.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awselasticfilesystem/v1alpha1/outputs.proto";
import "catalog/aws/awselasticfilesystem/v1alpha1/spec.proto";
import "shared/metadata.proto";

// aws-elastic-file-system
message AwsElasticFileSystem {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsElasticFileSystem'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsElasticFileSystemSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsElasticFileSystemStatus status = 5;
}

// aws-elastic-file-system status
message AwsElasticFileSystemStatus {
  //outputs
  AwsElasticFileSystemOutputs outputs = 1;
}
