apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsrdscluster
spec:
  # An RDS cluster under live E2E: the harness deploys the AwsVpc + two-AZ
  # AwsSubnet prerequisites (a DB subnet group must span two AZs), runs
  # deploy -> DescribeDBClusters verify -> destroy -> verify-destroyed on both
  # provisioners. The scenario is an Aurora PostgreSQL Serverless v2 cluster
  # with one db.serverless instance scaling 0-1 ACU: it proves the folded
  # per-name instance materialization AND the AWS-managed master password on
  # the cheapest possible footprint (min 0 ACU auto-pauses; the run is billed
  # minutes of sub-ACU compute), plus the free depth arms -- one feature-
  # scoped role association (composed AwsIamRole fixture), one custom READER
  # endpoint, and per-instance window/tag overrides. Aurora instance
  # provisioning dominates the runtime at roughly ten minutes each way per
  # engine.
  #
  # PROVEN LIVE 2026-08-12: both engines all eight phases green (Pulumi
  # 25m23s, Terraform 25m44s), with per-engine RDS-API evidence -- each
  # engine's cluster (distinct DbClusterResourceId) echoed the role
  # association ACTIVE with FeatureName s3Export, the custom READER
  # endpoint fronting the folded instance's mapped identifier, cluster
  # auto_minor_version_upgrade true, the 0-ACU Serverless v2 floor
  # (engine default 17.7 accepted it; no version pin needed), the active
  # managed master secret, and the per-instance maintenance-window +
  # copy-tags arms. Live-caught on first contact: the association role's
  # trust policy must allow rds.amazonaws.com (server-side
  # AddRoleToDBCluster contract; the ec2-trusting shared fixture role
  # 400'd) -- healed with the consumer-scoped e2e/prerequisites override
  # and taught on the spec, both modules, and catalog.md.
  #
  # Offline-proven arms with recorded deferrals (never silent skips):
  # the Kerberos domain pair (needs an AWS Managed Microsoft AD fixture
  # -- owner budget decision), s3_import (needs a seeded XtraBackup
  # bucket + ingestion-role fixture; proven via the 04/05 migration
  # presets), and the activity stream (needs a KMS fixture and bills
  # Kinesis minutes; all-ForceNew with AWS-side start/stop waiters;
  # proven via the canonical manifest). Each unblocks when its fixture
  # ships or the owner budgets a window.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 60
