# Aurora PostgreSQL Serverless v2 scenario: the modern default cluster shape.
# Exercises the folded instances list (one db.serverless instance materialized
# as its own provider resource), the 0-ACU auto-pause scaling floor, and the
# AWS-managed master password (no secret in the manifest or state; the secret
# ARN surfaces as an output). engine_version is deliberately unpinned so the
# scenario rides the engine's current AWS default and never goes stale. The
# subnet pair prerequisite satisfies the two-AZ DB subnet group requirement;
# no security groups are given, so AWS attaches the VPC's default group (the
# documented default this kind preserves). skipFinalSnapshot keeps the
# destroy phase unconditional. Full metadata is supplied for tagging/orphan
# cleanup.
#
# Free arms proven live on this lane: one engine feature role attached BY
# REFERENCE (the e2e-prerequisites annotation composes the consumer-scoped
# AwsIamRole fixture -- the role MUST trust rds.amazonaws.com, a
# server-side AddRoleToDBCluster contract; verify the association via the
# RDS API, not apply success alone), one custom READER endpoint over the
# folded instance (verify its
# DNS name in the outputs), explicit cluster-level auto-minor-upgrade, and
# per-instance maintenance-window + snapshot-tag arms. The Kerberos,
# S3-import, and activity-stream arms are offline-proven (directory,
# seeded bucket, and KMS+Kinesis costs) -- see e2e/manifest.yaml and the
# 04 preset.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsRdsCluster
metadata:
  name: planton-oss-e2e-rdsclu-sv2
  id: planton-oss-e2e-rdsclu-sv2
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsrdscluster
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsIamRole"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  engine: aurora-postgresql
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-b
        fieldPath: status.outputs.subnet_id
  masterUsername: e2eadmin
  manageMasterUserPassword: true
  storageEncrypted: true
  autoMinorVersionUpgrade: true
  serverlessV2Scaling:
    minCapacity: 0
    maxCapacity: 1
  instances:
    - name: one
      instanceClass: db.serverless
      copyTagsToSnapshot: true
      preferredMaintenanceWindow: sun:05:00-sun:06:00
  iamRoles:
    - role:
        valueFrom:
          kind: AwsIamRole
          name: planton-oss-e2e-rds-feature-role
          fieldPath: status.outputs.role_arn
      featureName: s3Export
  customEndpoints:
    - name: analytics
      type: READER
      staticMembers:
        - one
  skipFinalSnapshot: true
