syntax = "proto3";

package dev.planton.aws.awsrdscluster.v1alpha1;

// AwsRdsClusterOutputs captures the observable identifiers and
// connection endpoints of the RDS cluster after deployment.
message AwsRdsClusterOutputs {
  // The cluster identifier (e.g. "orders-db").
  string cluster_identifier = 1;

  // The Amazon Resource Name of the cluster.
  string arn = 2;

  // The immutable cluster resource ID (cluster-...). Survives
  // identifier renames -- the durable handle for point-in-time restores
  // and CloudWatch dimensions.
  string cluster_resource_id = 3;

  // The writer endpoint -- connect here for reads and writes.
  string endpoint = 4;

  // The reader endpoint -- load-balances connections across the
  // cluster's reader instances.
  string reader_endpoint = 5;

  // The port the cluster accepts connections on.
  int32 port = 6;

  // The Route53 hosted zone ID of the cluster endpoints, for DNS alias
  // records.
  string hosted_zone_id = 7;

  // The resolved engine version actually running (meaningful when the
  // spec leaves engine_version to the AWS default).
  string engine_version_actual = 8;

  // The ARN of the AWS-managed master-user secret in Secrets Manager.
  // Populated only when manage_master_user_password is true -- the
  // handle applications use to fetch credentials at runtime.
  string master_user_secret_arn = 9;

  // The name of the DB subnet group the cluster runs in.
  string db_subnet_group_name = 10;

  // The name of the cluster parameter group in use (module-managed or
  // the referenced existing group).
  string db_cluster_parameter_group_name = 11;

  // Per-instance endpoints of the cluster's folded instances, ordered
  // as declared in spec.instances. Empty for Aurora Serverless v1 and
  // Multi-AZ RDS clusters, where AWS owns the compute.
  repeated string instance_endpoints = 12;

  // The custom cluster endpoints declared in spec.custom_endpoints --
  // one entry per endpoint, carrying its DNS name for charts to wire
  // into consumers.
  repeated AwsRdsClusterCustomEndpointOutput custom_endpoints = 13;

  // The name of the Kinesis stream receiving the Database Activity
  // Stream (aws-rds-das-...). Populated only when spec.activity_stream
  // is set -- the handle audit consumers attach to.
  string activity_stream_kinesis_stream_name = 14;
}

// AwsRdsClusterCustomEndpointOutput is one custom endpoint's observable
// identity: the spec entry name and the DNS endpoint AWS assigned it.
message AwsRdsClusterCustomEndpointOutput {
  // The endpoint's spec.custom_endpoints entry name.
  string name = 1;

  // The DNS name of the custom endpoint -- connect here to reach the
  // endpoint's member subset.
  string endpoint = 2;
}
