syntax = "proto3";

package dev.planton.aws.awsrdscluster.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsrdscluster/v1alpha1/outputs.proto";
import "catalog/aws/awsrdscluster/v1alpha1/spec.proto";
import "shared/metadata.proto";

// aws-rds-cluster
message AwsRdsCluster {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsRdsCluster'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsRdsClusterSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsRdsClusterStatus status = 5;
}

// aws-rds-cluster status
message AwsRdsClusterStatus {
  //outputs
  AwsRdsClusterOutputs outputs = 1;
}
