# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsrdscluster
spec:
  controls:
    - control_id: enc-at-rest
      status: configurable
      field_path: storage_encrypted
      evidence:
        type: spec_default
        reference: Carries recommended_default=true; a create-time-only decision -- an unencrypted cluster can never be encrypted in place, and every preset sets it true.
      notes: Encryption covers the shared cluster volume, automated backups, snapshots, and every instance serving the cluster.
    - control_id: enc-at-rest-cmk
      status: configurable
      field_path: kms_key_id
      evidence:
        type: spec_default
        reference: Unset means the AWS-managed aws/rds key; setting kms_key_id encrypts cluster storage under the referenced customer-managed key, with separate keys available for the managed master secret, Performance Insights, and the activity stream.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every cluster endpoint presents TLS with AWS-managed certificates; clients can always connect encrypted, and ca_certificate_identifier picks the CA bundle.
      notes: Requiring TLS (rejecting plaintext clients) is an engine-side setting (rds.force_ssl for PostgreSQL-family, require_secure_transport for MySQL-family) carried through the parameters field when wanted.
    - control_id: no-public-access
      status: configurable
      field_path: instances.publicly_accessible
      evidence:
        type: spec_default
        reference: Defaults to false on every instances entry -- instances get no public IP and resolve only inside the VPC; true attaches a public address to that instance.
      notes: All four presets leave it false on every instance; the spec doc says keep it that way for anything production-shaped.
    - control_id: restricted-ingress
      status: configurable
      field_path: security_group_ids
      evidence:
        type: spec_default
        reference: The attached security groups are the complete inbound surface -- database ports open only to the sources those groups declare; empty falls back to the VPC default group.
      notes: Every preset attaches an explicit database security group placeholder.
    - control_id: edge-protection
      status: not_applicable
      notes: A database endpoint has no WAF attachment point; request filtering belongs to the application tier in front of it.
    - control_id: rbac
      status: configurable
      field_path: iam_database_authentication_enabled
      evidence:
        type: spec_default
        reference: Defaults to false (password-based database accounts only); true lets database users authenticate with short-lived IAM tokens, putting database access under IAM policy control.
      notes: Engine-side users and grants remain the fine-grained layer either way; no preset enables it.
    - control_id: workload-identity
      status: configurable
      field_path: manage_master_user_password
      evidence:
        type: spec_default
        reference: Carries recommended_default=true -- AWS generates, stores, and rotates the master password in Secrets Manager, so no human ever handles it; the alternative master_password field is marked sensitive and mutually exclusive.
      notes: Every preset sets it true. Combined with IAM database authentication, applications can reach the database without any long-lived secret of their own.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The engines' authentication surfaces (password policies, legacy cipher handshakes) are engine-internal settings carried through parameters, not a first-class spec control.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: configurable
      field_path: enabled_cloudwatch_logs_exports
      evidence:
        type: spec_default
        reference: Empty exports nothing; listing engine log types (audit, error, slowquery, postgresql...) streams them to CloudWatch Logs for retention and alerting.
      notes: Presets export postgresql and error/slowquery respectively; activity_stream is the compliance-grade feed -- every audited event to a KMS-encrypted Kinesis stream (Aurora engines only).
    - control_id: monitoring-integration
      status: configurable
      field_path: performance_insights_enabled
      evidence:
        type: spec_default
        reference: Defaults to off; true enables Performance Insights (free at 7-day retention) cluster-wide with per-instance overrides, and monitoring_interval adds OS-level Enhanced Monitoring streams.
      notes: Basic CloudWatch cluster and instance metrics flow automatically either way; the aurora-postgresql and aurora-mysql presets enable Performance Insights.
    - control_id: backup-recovery
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Cluster backups are continuous and cannot be disabled -- backup_retention_period is bounded 1-35 days (0 keeps the AWS default of 1), so point-in-time recovery always exists.
      notes: Presets extend retention to 7 days; skip_final_snapshot=false with a named final snapshot additionally protects teardown (CEL forces the name when not skipping), and backtrack_window_seconds adds in-place rewind on Aurora MySQL.
    - control_id: backup-retention-policy
      status: configurable
      field_path: backup_retention_period
      evidence:
        type: spec_validation
        reference: The retention window is a first-class dial validated to 0-35 days, so organizational retention policy is expressed directly in the manifest.
      notes: delete_automated_backups and final snapshots govern what survives cluster deletion.
    - control_id: multi-zone-ha
      status: configurable
      field_path: instances
      evidence:
        type: spec_default
        reference: Each instances entry is its own DB instance; AWS spreads them across the cluster's zones automatically, so a writer plus at least one reader survives an AZ loss with automatic failover by promotion_tier.
      notes: Cluster storage is always replicated across three AZs regardless of instance count. The aurora-postgresql and aurora-mysql presets run writer plus reader; the serverless and migration presets run a single instance.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_protection
      evidence:
        type: spec_default
        reference: Defaults to false; when true, AWS refuses to delete the cluster until protection is explicitly lifted.
      notes: The aurora-postgresql and aurora-mysql presets enable it alongside final-snapshot protection.
    - control_id: managed-patching
      status: configurable
      field_path: auto_minor_version_upgrade
      evidence:
        type: spec_default
        reference: Carries default=true (mirroring AWS) -- minor engine versions patch automatically in the maintenance window; major upgrades remain deliberate manifest changes gated by allow_major_version_upgrade.
      notes: Per-instance auto_minor_version_upgrade overrides the cluster setting; engine_lifecycle_support bounds how long an unupgraded major version may live before paid extended support begins.
