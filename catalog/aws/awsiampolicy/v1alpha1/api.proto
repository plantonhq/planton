syntax = "proto3";

package dev.planton.aws.awsiampolicy.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsiampolicy/v1alpha1/outputs.proto";
import "catalog/aws/awsiampolicy/v1alpha1/spec.proto";
import "shared/metadata.proto";

//aws-iam-policy
message AwsIamPolicy {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsIamPolicy'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsIamPolicySpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsIamPolicyStatus status = 5;
}

//aws-iam-policy status
message AwsIamPolicyStatus {
  //outputs
  AwsIamPolicyOutputs outputs = 1;
}
