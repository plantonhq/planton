# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awsiampolicy
spec:
  aws:
    statements:
      - sid: ManagePolicy
        actions:
          - iam:CreatePolicy
          - iam:GetPolicy
          - iam:GetPolicyVersion
          - iam:ListPolicyVersions
          - iam:CreatePolicyVersion
          - iam:DeletePolicyVersion
          - iam:DeletePolicy
          - iam:TagPolicy
          - iam:UntagPolicy
          - iam:ListPolicyTags
        resources:
          - arn:aws:iam::*:policy/*
        provenance: derived
        notes: Covers aws_iam_policy / iam.Policy, the only resource either module manages. Creation carries name, path, description, document, and tags; document updates run CreatePolicyVersion (set-as-default) with ListPolicyVersions + DeletePolicyVersion pruning the oldest non-default version against AWS's five-version cap; deletion sweeps remaining non-default versions before DeletePolicy. Get/List actions are the read-side during plan/refresh. Every policy API authorizes on the policy ARN alone -- IAM ARNs carry no region, and policy/* spans custom paths because '*' matches path separators.
