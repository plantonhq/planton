# AwsIamPolicy install profile used as a prerequisite by composed components
# (e.g. AwsIamUser scenarios that attach a Planton-managed policy by
# reference). The E2E harness deploys this policy first, captures its
# outputs, and resolves the dependent's policy_arn reference against them.
# Full metadata is supplied and the managed-by label tags resources for
# orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamPolicy
metadata:
  name: planton-oss-e2e-awsiampolicy-prereq
  id: planton-oss-e2e-awsiampolicy-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsiampolicy
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  description: Planton E2E prerequisite policy (read-only on a nonexistent demo bucket)
  path: /planton-e2e/
  policyDocument:
    Version: "2012-10-17"
    Statement:
      - Sid: DemoBucketReadOnly
        Effect: Allow
        Action:
          - s3:GetObject
          - s3:ListBucket
        Resource:
          - arn:aws:s3:::planton-oss-e2e-nonexistent-bucket
          - arn:aws:s3:::planton-oss-e2e-nonexistent-bucket/*
