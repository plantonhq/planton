# Neptune Serverless scenario: the cheapest live footprint (1 NCU floor --
# Neptune Serverless does not pause to zero). Exercises the folded
# instances list (one db.serverless instance materialized as its own
# provider resource), the serverless scaling block, a folded custom
# endpoint pinned to that instance (the custom_endpoint_addresses
# output's live proof), and the cluster's port pinned on the instance
# resource. engine_version is deliberately unpinned so the scenario rides
# the current AWS default and never goes stale. The subnet pair
# prerequisite satisfies the two-AZ Neptune subnet group requirement; no
# security groups are given, so AWS attaches the VPC's default group.
# skipFinalSnapshot keeps the destroy phase unconditional. Full metadata
# is supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsNeptuneCluster
metadata:
  name: planton-oss-e2e-awsnep-srvls
  id: planton-oss-e2e-awsnep-srvls
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsneptunecluster
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-b
        fieldPath: status.outputs.subnet_id
  storageEncrypted: true
  serverlessV2Scaling:
    minCapacity: 1
    maxCapacity: 2
  instances:
    - name: one
      instanceClass: db.serverless
  customEndpoints:
    - name: analytics
      endpointType: ANY
      staticMembers:
        - one
  skipFinalSnapshot: true
