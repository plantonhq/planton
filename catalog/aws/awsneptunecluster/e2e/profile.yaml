apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsneptunecluster
spec:
  # A Neptune cluster under live E2E: the harness deploys the AwsVpc +
  # two-AZ AwsSubnet prerequisites (a Neptune subnet group must span two
  # AZs), runs deploy -> Neptune DescribeDBClusters verify -> destroy ->
  # verify-destroyed on both provisioners. The scenario is Neptune
  # Serverless with one db.serverless instance scaling 1-2 NCUs (1 NCU is
  # Neptune's floor -- it does not pause to zero): the cheapest possible
  # footprint, proving the folded per-name instance materialization and the
  # serverless scaling block. Instance provisioning dominates the runtime:
  # observed live 2026-08-13 at 15-18 minutes per direction per engine (a
  # full dual-engine run is ~70-75 minutes) -- budget on that.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 60
