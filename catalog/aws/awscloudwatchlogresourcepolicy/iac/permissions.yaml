# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awscloudwatchlogresourcepolicy
spec:
  aws:
    statements:
      - sid: ManageResourcePolicy
        actions:
          - logs:PutResourcePolicy
          - logs:DeleteResourcePolicy
          - logs:DescribeResourcePolicies
        resources:
          - "*"
        provenance: derived
        notes: Covers aws_cloudwatch_log_resource_policy / cloudwatch.LogResourcePolicy -- the module's only resource, serving BOTH scopes (account-wide by policy_name and log-group-pinned by resource_arn). PutResourcePolicy creates and updates (passing AWS's tracked revision ID so concurrent out-of-band edits fail loudly); DescribeResourcePolicies serves every plan/refresh (the provider reads the policy back by listing the region's policies at the matching scope); DeleteResourcePolicy destroys (resource-scoped deletes also require the tracked revision ID). None of the three actions takes resource-level scoping -- the CloudWatch Logs service reference lists no resource types for any of them, so "*" is the narrowest possible grant; an ARN-scoped grant here would be a runtime DENY. No tagging actions exist to grant -- resource policies are untaggable at AWS (the provider resource has no tags argument).
