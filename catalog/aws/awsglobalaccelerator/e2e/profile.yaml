apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsglobalaccelerator
spec:
  # A Global Accelerator under live E2E: two lanes. The minimal lane is
  # dependency-free (an endpoint group with no endpoints is a valid AWS
  # shape) and proves the accelerator -> listener -> endpoint group
  # lifecycle including the deploy waiter and the disable-before-delete
  # destroy path. The composed lane resolves an Elastic IP fixture into a
  # polymorphic endpoint reference and exercises the non-default dial
  # surface (SOURCE_IP affinity, 10-second health-check interval, explicit
  # weight/dial, port override). Excluded arms recorded in the scenarios:
  # flow logs (policy-bearing S3 fixture), BYOIP (registered pool),
  # DUAL_STACK, attachment_arn (second AWS account). Verification is
  # DescribeAccelerator keyed on the accelerator ARN against the us-west-2
  # global control plane; deleted accelerators return the typed
  # AcceleratorNotFoundException.
  # Live dual-engine run 2026-07-10: Pulumi composed 2m59s deploy / 1m19s
  # destroy (EIP fixture 20s up / 7s down), minimal 2m37s / 2m11s; Terraform
  # composed 3m02s / 1m16s, minimal 3m13s / 1m26s; all verify stages green;
  # zero-orphan sweep clean.
  #
  # Re-proven live 2026-08-13, both engines, both scenarios, after the
  # weight zero-drain heal: the composed scenario's endpoint (authored
  # WITHOUT weight) echoed Weight=128 from the endpoint group on BOTH
  # engines' instances (distinct EIP allocation IDs attribute the
  # windows), with SOURCE_IP affinity, the 10s health-check interval,
  # dial 100, and the 443->8443 port override all echoed as authored.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 40
