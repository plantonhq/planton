# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: awscostcategory
spec:
  billing_model: free
  free_tier: "Cost categories never bill. The AWS Cost Categories FAQ answers the pricing question directly: 'This service is provided free of charge' -- and AWS's Cloud Financial Management blogs repeat it ('Cost Categories are a free feature and do not generate any AWS charges'). No meter counts categories, rules, split-charge rules, the categorization runs that re-bucket every line of spend, or retroactive re-application to prior months. Permanent, not a trial."
  notes: "This component is a lens on the bill, never a line of it -- it changes how spend is REPORTED, not what is billed. That includes split_charge_rules, the shape most likely to be misread: 'splitting charges' moves dollars BETWEEN CATEGORY VALUES in Cost Explorer and CUR reporting (chargeback of a shared 'platform' value across product teams, as the 02 preset does) while the actual invoice is untouched -- not one cent moves between AWS and you. There is no real spend to route anywhere: unlike automation components, a cost category triggers nothing, creates nothing, and stores nothing billable; the spend it buckets is accruing on other components for its own reasons. Two operational facts worth the space anyway: unmatched spend lands in default_value (or AWS's literal 'Uncategorized'), so a silent rule gap shows up as a swollen default bucket rather than an error; and deletion is IRREVERSIBLE -- AWS states historical cost data associated with a deleted category is no longer available for reporting (it lingers only in reports covering months it was active), so deleting a category discards a reporting dimension your finance trail may depend on. Cost Explorer is account-global; the spec's region field is only the provider's API endpoint."
