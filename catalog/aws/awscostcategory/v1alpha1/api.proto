syntax = "proto3";

package dev.planton.aws.awscostcategory.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awscostcategory/v1alpha1/outputs.proto";
import "catalog/aws/awscostcategory/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsCostCategory {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsCostCategory'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsCostCategorySpec spec = 4 [(buf.validate.field).required = true];
  AwsCostCategoryStatus status = 5;
}

message AwsCostCategoryStatus {
  AwsCostCategoryOutputs outputs = 1;
}
