apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awscostcategory
spec:
  # A Cost Explorer cost category under live E2E: one lane proves an
  # expression rule (or-composed dimension + tag), a tag-inherited
  # rule, the default value, and a proportional split-charge rule.
  # Categories are free (~$0). The verifier treats an END-DATED
  # definition as absent -- AWS keeps answering Describe until month
  # end after a delete, with effective_end set.
  #
  # Deliberately not exercised live:
  #   - FIXED/EVEN split methods and deeper and/or/not nesting --
  #     render-proven offline; the proportional split and the two-level
  #     tree are the canonical forms. Unblock: a second scenario when
  #     the proof queue wants the datapoints.
  #
  # PROVEN live 2026-08-25 (Q43): both engines through the full
  # six-phase runner + the Terraform blind import round-trip under
  # the armed apply-idempotency gate.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
