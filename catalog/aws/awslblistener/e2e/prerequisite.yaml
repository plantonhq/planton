# AwsLbListener install profile used as a prerequisite by composed kinds
# (a listener rule attaches to it by ARN). An HTTP listener with a
# fixed-response default action: no certificate dependency, and no forward
# target needed just to give a rule something to attach to. The harness
# deploys it after the AwsAlb (and its subnet/VPC) prerequisites. Full
# metadata is supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsLbListener
metadata:
  name: planton-oss-e2e-lbl-prereq
  id: planton-oss-e2e-lbl-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awslblistener
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  loadBalancerArn:
    valueFrom:
      kind: AwsAlb
      name: planton-oss-e2e-awsalb-prereq
      fieldPath: status.outputs.load_balancer_arn
  port: 80
  protocol: HTTP
  defaultActions:
    - type: fixed-response
      fixedResponse:
        contentType: text/plain
        statusCode: "404"
        messageBody: not found
