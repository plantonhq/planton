apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awslblistener
spec:
  # A listener under live E2E rides the deepest chain in the family: the
  # harness deploys AwsVpc -> two AwsSubnets -> AwsAlb -> AwsLbTargetGroup,
  # then runs deploy -> DescribeListeners verify -> destroy ->
  # verify-destroyed on both provisioners. The live scenario is a plain-HTTP
  # forward listener: an HTTPS listener needs an ACM certificate, and
  # certificate issuance requires domain validation the test account cannot
  # complete -- the TLS surface is proven by spec tests and offline plans
  # instead.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 40
  # 2026-08-13 tag-convergence sweep: the Pulumi identity-tag map gained the
  # canonical Name key, converging on the key set the Terraform module (and
  # this badge's live proof) already sends. Declared-set equality is now
  # machine-enforced by hack/guards/ensure_cross_engine_tag_keys.sh; the
  # change class is live-re-proven once via Q31 (awssqsqueue represents it).
