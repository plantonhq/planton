syntax = "proto3";

package dev.planton.aws.awslblistener.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// AwsLbListenerSpec defines an ELBv2 listener: the port/protocol entry point
// on a load balancer, with the default action taken when no listener rule
// matches a request.
//
// A listener is a first-class node in the routing graph. One load balancer
// carries many listeners (80 and 443 at minimum on most ALBs), each listener
// owns its own TLS material and default behavior, and listener rules attach to
// a specific listener as services deploy -- so the listener is the anchor both
// certificates and per-service routing hang off.
//
// The same kind serves both load balancer families, exactly as AWS models it:
// - ALB listeners ("HTTP", "HTTPS") take the full action set -- forward,
//   redirect, fixed-response, authenticate-cognito, authenticate-oidc,
//   jwt-validation -- plus mutual TLS and HTTP header controls.
// - NLB listeners ("TCP", "UDP", "TCP_UDP", "TLS") only forward; AWS rejects
//   every other action type at the API.
// Field comments call out the scope of every family-specific field.
//
// The load balancer is create-only: moving a listener replaces it. Port,
// protocol, certificates, and actions all update in place.
message AwsLbListenerSpec {
  // The AWS region where the listener is created. Must match the load
  // balancer's region. Example: "us-west-2", "eu-west-1".
  string region = 1 [(buf.validate.field).string.min_len = 1];

  // The load balancer this listener attaches to. Defaults to referencing an
  // AwsAlb's ARN; attach to an AwsNlb with a valueFrom naming that kind (both
  // are declared candidates, so the ARN output fills in), or to an external
  // load balancer with a literal ARN. Immutable: changing the load
  // balancer replaces the listener.
  dev.planton.shared.foreignkey.v1.StringValueOrRef load_balancer_arn = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsAlb,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.load_balancer_arn",
    (dev.planton.shared.foreignkey.v1.candidate) = {
      kind: AwsAlb
      field_path: "status.outputs.load_balancer_arn"
    },
    (dev.planton.shared.foreignkey.v1.candidate) = {
      kind: AwsNlb
      field_path: "status.outputs.load_balancer_arn"
    }
  ];

  // Port the listener accepts traffic on, 1-65535. The classic pairs are 80
  // (HTTP, usually a redirect listener) and 443 (HTTPS/TLS).
  int32 port = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 65535
    }
  ];

  // Protocol the listener speaks. Decides the load balancer family and the
  // allowed actions:
  // - ALB: "HTTP", "HTTPS" (full action set).
  // - NLB: "TCP", "UDP", "TCP_UDP", "TLS", "QUIC", "TCP_QUIC" (forward
  //   only). "QUIC" accepts QUIC connections natively; "TCP_QUIC" serves
  //   TCP and QUIC on one port (the HTTP/3 pattern with TCP fallback) and
  //   forwards to a matching QUIC-family target group.
  string protocol = 4 [(buf.validate.field).required = true];

  // -----------------------------------------------------------------------
  // TLS ("HTTPS" and "TLS" protocols)
  // -----------------------------------------------------------------------

  // The default server certificate presented to clients that do not match an
  // SNI certificate. Required for "HTTPS" and "TLS" listeners; not valid
  // otherwise.
  //
  // Requiredness is enforced by the IaC modules rather than a proto rule:
  // message-level CEL cannot inspect StringValueOrRef fields without breaking
  // protovalidate-java, so both engines fail fast with a clear error when a
  // TLS-protocol listener has no certificate.
  dev.planton.shared.foreignkey.v1.StringValueOrRef certificate_arn = 5 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsCertManagerCert,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.cert_arn"
  ];

  // Additional SNI certificates for serving several domains from one
  // listener: the client's SNI hostname picks the matching certificate, and
  // certificate_arn serves clients that match none. Folded into the listener
  // (AWS models each as a separate listener-certificate attachment) because
  // an attachment is pure glue with no referenceable identity of its own.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef additional_certificate_arns = 6 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsCertManagerCert,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.cert_arn"
  ];

  // The TLS security policy naming the protocol versions and cipher suites
  // the listener negotiates. Only for "HTTPS" and "TLS" listeners; AWS
  // defaults it when omitted.
  // Recommended: "ELBSecurityPolicy-TLS13-1-2-2021-06" (TLS 1.3 + 1.2).
  string ssl_policy = 7;

  // ALPN policy for NLB "TLS" listeners: which application protocols are
  // advertised during the TLS handshake. Valid values: "HTTP1Only",
  // "HTTP2Only", "HTTP2Optional", "HTTP2Preferred", "None".
  string alpn_policy = 8;

  // Mutual TLS: require or accept client certificates on an ALB "HTTPS"
  // listener. When omitted, mTLS is off.
  AwsLbListenerMutualAuthentication mutual_authentication = 9;

  // -----------------------------------------------------------------------
  // Behavior
  // -----------------------------------------------------------------------

  // Seconds an idle TCP connection stays open on an NLB "TCP" listener
  // before the NLB closes it. Range 60-6000. AWS default: 350. Raise it for
  // protocols with long quiet periods (database wire protocols, MQTT).
  int32 tcp_idle_timeout_seconds = 10;

  // What happens to a request no listener rule matches. Required, at least
  // one action. With several actions (an authenticate action chained before
  // its forward), order follows the list; every chain ends in exactly one of
  // forward, redirect, or fixed-response.
  //
  // NLB-protocol listeners must use exactly one "forward" action -- AWS
  // rejects everything else at Layer 4.
  repeated AwsLbListenerAction default_actions = 11 [
    (buf.validate.field).required = true,
    (buf.validate.field).repeated.min_items = 1
  ];

  // HTTP header handling on ALB listeners: inject TLS/mTLS details as
  // request headers, and set response headers (CORS, security headers).
  // When omitted, no headers are injected or overridden.
  AwsLbListenerHttpHeaders http_headers = 12;

  // ---------------------------------------------------------------------------
  // Spec-level CEL validations
  // ---------------------------------------------------------------------------

  // GENEVE is deliberately absent from this domain: the provider admits it
  // for Gateway Load Balancer listeners, which this catalog does not model.
  option (buf.validate.message).cel = {
    id: "protocol_valid"
    message: "protocol must be one of: HTTP, HTTPS, TCP, UDP, TCP_UDP, TLS, QUIC, TCP_QUIC"
    expression: "this.protocol in ['HTTP', 'HTTPS', 'TCP', 'UDP', 'TCP_UDP', 'TLS', 'QUIC', 'TCP_QUIC']"
  };

  option (buf.validate.message).cel = {
    id: "ssl_policy_only_for_tls_protocols"
    message: "ssl_policy only applies when protocol is 'HTTPS' or 'TLS'"
    expression: "this.ssl_policy == '' || this.protocol in ['HTTPS', 'TLS']"
  };

  option (buf.validate.message).cel = {
    id: "alpn_policy_only_for_nlb_tls"
    message: "alpn_policy only applies when protocol is 'TLS'"
    expression: "this.alpn_policy == '' || this.protocol == 'TLS'"
  };

  option (buf.validate.message).cel = {
    id: "alpn_policy_valid"
    message: "alpn_policy must be one of: HTTP1Only, HTTP2Only, HTTP2Optional, HTTP2Preferred, None"
    expression: "this.alpn_policy == '' || this.alpn_policy in ['HTTP1Only', 'HTTP2Only', 'HTTP2Optional', 'HTTP2Preferred', 'None']"
  };

  option (buf.validate.message).cel = {
    id: "mutual_authentication_only_for_https"
    message: "mutual_authentication only applies when protocol is 'HTTPS'"
    expression: "!has(this.mutual_authentication) || this.protocol == 'HTTPS'"
  };

  option (buf.validate.message).cel = {
    id: "tcp_idle_timeout_only_for_tcp"
    message: "tcp_idle_timeout_seconds only applies when protocol is 'TCP'"
    expression: "this.tcp_idle_timeout_seconds == 0 || this.protocol == 'TCP'"
  };

  option (buf.validate.message).cel = {
    id: "tcp_idle_timeout_range"
    message: "tcp_idle_timeout_seconds must be between 60 and 6000 when set"
    expression: "this.tcp_idle_timeout_seconds == 0 || (this.tcp_idle_timeout_seconds >= 60 && this.tcp_idle_timeout_seconds <= 6000)"
  };

  option (buf.validate.message).cel = {
    id: "http_headers_only_for_alb_protocols"
    message: "http_headers only applies when protocol is 'HTTP' or 'HTTPS'"
    expression: "!has(this.http_headers) || this.protocol in ['HTTP', 'HTTPS']"
  };
}

// AwsLbListenerAction is one step of a listener's default-action chain.
//
// Exactly one configuration message is set, and it must match type -- the
// same discriminated-union shape the AWS API uses.
message AwsLbListenerAction {
  // The action type. Valid values: "forward", "redirect", "fixed-response",
  // "authenticate-cognito", "authenticate-oidc", "jwt-validation".
  // NLB-protocol listeners accept only "forward".
  string type = 1 [(buf.validate.field).required = true];

  // Explicit evaluation order within the chain, 1-50000 (lower runs first).
  // When omitted, list position decides -- which is almost always enough.
  int32 order = 2;

  // Forward the request to one or more weighted target groups.
  AwsLbListenerActionForward forward = 3;

  // Reply with an HTTP redirect. ALB only.
  AwsLbListenerActionRedirect redirect = 4;

  // Reply with a canned HTTP response, never touching a target. ALB only.
  // The classic default action for a listener whose real traffic all flows
  // through listener rules: unmatched requests get an explicit 404.
  AwsLbListenerActionFixedResponse fixed_response = 5;

  // Authenticate the client against an Amazon Cognito user pool before the
  // terminal action runs. ALB HTTPS only.
  AwsLbListenerActionAuthenticateCognito authenticate_cognito = 6;

  // Authenticate the client against any OpenID Connect provider before the
  // terminal action runs. ALB HTTPS only.
  AwsLbListenerActionAuthenticateOidc authenticate_oidc = 7;

  // Validate a JWT bearer token on the request before the terminal action
  // runs -- API-style auth with no session cookies or login redirects.
  // ALB HTTPS only.
  AwsLbListenerActionJwtValidation jwt_validation = 8;

  option (buf.validate.message).cel = {
    id: "action_type_valid"
    message: "type must be one of: forward, redirect, fixed-response, authenticate-cognito, authenticate-oidc, jwt-validation"
    expression: "this.type in ['forward', 'redirect', 'fixed-response', 'authenticate-cognito', 'authenticate-oidc', 'jwt-validation']"
  };

  option (buf.validate.message).cel = {
    id: "order_range"
    message: "order must be between 1 and 50000 when set"
    expression: "this.order == 0 || (this.order >= 1 && this.order <= 50000)"
  };

  option (buf.validate.message).cel = {
    id: "forward_config_matches_type"
    message: "forward configuration must be set when (and only when) type is 'forward'"
    expression: "(this.type == 'forward') == has(this.forward)"
  };

  option (buf.validate.message).cel = {
    id: "redirect_config_matches_type"
    message: "redirect configuration must be set when (and only when) type is 'redirect'"
    expression: "(this.type == 'redirect') == has(this.redirect)"
  };

  option (buf.validate.message).cel = {
    id: "fixed_response_config_matches_type"
    message: "fixed_response configuration must be set when (and only when) type is 'fixed-response'"
    expression: "(this.type == 'fixed-response') == has(this.fixed_response)"
  };

  option (buf.validate.message).cel = {
    id: "authenticate_cognito_config_matches_type"
    message: "authenticate_cognito configuration must be set when (and only when) type is 'authenticate-cognito'"
    expression: "(this.type == 'authenticate-cognito') == has(this.authenticate_cognito)"
  };

  option (buf.validate.message).cel = {
    id: "authenticate_oidc_config_matches_type"
    message: "authenticate_oidc configuration must be set when (and only when) type is 'authenticate-oidc'"
    expression: "(this.type == 'authenticate-oidc') == has(this.authenticate_oidc)"
  };

  option (buf.validate.message).cel = {
    id: "jwt_validation_config_matches_type"
    message: "jwt_validation configuration must be set when (and only when) type is 'jwt-validation'"
    expression: "(this.type == 'jwt-validation') == has(this.jwt_validation)"
  };
}

// AwsLbListenerActionForward sends traffic to one or more target groups.
//
// A single target group is the common case. Several weighted groups enable
// blue/green and canary patterns: shift weight from the old group to the new
// one without touching the listener's port or certificates.
message AwsLbListenerActionForward {
  // The destination target groups, 1-5, each with an optional weight.
  repeated AwsLbListenerActionForwardTargetGroup target_groups = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 5
    }
  ];

  // Target-group stickiness for multi-group forwards: pins a client to the
  // group (not the individual target) that served its first request, so a
  // session does not flap between blue and green mid-canary.
  AwsLbListenerActionForwardStickiness stickiness = 2;
}

// AwsLbListenerActionForwardTargetGroup is one weighted destination of a
// forward action.
message AwsLbListenerActionForwardTargetGroup {
  // The target group receiving the traffic.
  dev.planton.shared.foreignkey.v1.StringValueOrRef arn = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsLbTargetGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.target_group_arn"
  ];

  // Relative traffic share, 0-999 (proportional to the sum across groups;
  // 0 drains the group). AWS default: 1, so equal weights need no
  // configuration.
  int32 weight = 2;

  option (buf.validate.message).cel = {
    id: "weight_range"
    message: "weight must be between 0 and 999"
    expression: "this.weight >= 0 && this.weight <= 999"
  };
}

// AwsLbListenerActionForwardStickiness pins clients to the target group that
// served their first request in a weighted forward.
message AwsLbListenerActionForwardStickiness {
  // Whether group-level stickiness is active.
  bool enabled = 1;

  // Seconds the group association lasts, 1-604800 (7 days). Required when
  // enabled.
  int32 duration_seconds = 2;

  option (buf.validate.message).cel = {
    id: "duration_required_when_enabled"
    message: "duration_seconds is required when stickiness is enabled"
    expression: "!this.enabled || this.duration_seconds != 0"
  };

  option (buf.validate.message).cel = {
    id: "duration_range"
    message: "duration_seconds must be between 1 and 604800 when set"
    expression: "this.duration_seconds == 0 || (this.duration_seconds >= 1 && this.duration_seconds <= 604800)"
  };
}

// AwsLbListenerActionRedirect replies with an HTTP redirect built from the
// original request, with any component overridden.
//
// The untouched components default to pass-through placeholders
// ("#{protocol}", "#{host}", "#{port}", "#{path}", "#{query}"), so the
// canonical HTTP->HTTPS redirect only overrides protocol and port.
message AwsLbListenerActionRedirect {
  // The redirect status code. Required. Valid values: "HTTP_301" (permanent
  // -- browsers cache it) or "HTTP_302" (temporary).
  string status_code = 1 [(buf.validate.field).required = true];

  // Target protocol: "HTTPS", "HTTP", or "#{protocol}" (keep the original).
  string protocol = 2;

  // Target port: a port number as a string, or "#{port}" (keep the
  // original).
  string port = 3;

  // Target hostname, 1-128 characters; supports placeholders (e.g.
  // "#{host}").
  string host = 4;

  // Target absolute path, starting with "/"; supports placeholders (e.g.
  // "/#{path}" or "/new/#{path}").
  string path = 5;

  // Target query string, without the leading "?"; supports placeholders.
  string query = 6;

  option (buf.validate.message).cel = {
    id: "redirect_status_code_valid"
    message: "status_code must be 'HTTP_301' or 'HTTP_302'"
    expression: "this.status_code in ['HTTP_301', 'HTTP_302']"
  };

  option (buf.validate.message).cel = {
    id: "redirect_protocol_valid"
    message: "protocol must be 'HTTP', 'HTTPS', or '#{protocol}' when set"
    expression: "this.protocol == '' || this.protocol in ['HTTP', 'HTTPS', '#{protocol}']"
  };
}

// AwsLbListenerActionFixedResponse serves a canned HTTP response directly
// from the load balancer.
message AwsLbListenerActionFixedResponse {
  // The Content-Type of the response. Required. Valid values: "text/plain",
  // "text/css", "text/html", "application/javascript", "application/json".
  string content_type = 1 [(buf.validate.field).required = true];

  // The HTTP status code, as a string: 2xx, 4xx, or 5xx (e.g. "404").
  // AWS default: "503".
  string status_code = 2;

  // The response body, up to 1024 characters.
  string message_body = 3 [(buf.validate.field).string.max_len = 1024];

  option (buf.validate.message).cel = {
    id: "fixed_response_content_type_valid"
    message: "content_type must be one of: text/plain, text/css, text/html, application/javascript, application/json"
    expression: "this.content_type in ['text/plain', 'text/css', 'text/html', 'application/javascript', 'application/json']"
  };

  option (buf.validate.message).cel = {
    id: "fixed_response_status_code_valid"
    message: "status_code must be a 2xx, 4xx, or 5xx code when set"
    expression: "this.status_code == '' || this.status_code.matches('^[245][0-9][0-9]$')"
  };
}

// AwsLbListenerActionAuthenticateCognito fronts the terminal action with an
// Amazon Cognito hosted-UI login. Unauthenticated browsers are redirected to
// Cognito; the ALB manages the session cookie afterward.
message AwsLbListenerActionAuthenticateCognito {
  // The Cognito user pool performing authentication.
  dev.planton.shared.foreignkey.v1.StringValueOrRef user_pool_arn = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsCognitoUserPool,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.user_pool_arn"
  ];

  // The app client ID within the user pool. Accepts a direct client ID or a
  // reference to an AwsCognitoUserPoolClient resource.
  dev.planton.shared.foreignkey.v1.StringValueOrRef user_pool_client_id = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsCognitoUserPoolClient,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.client_id"
  ];

  // The user pool's hosted-UI domain: the prefix of a Cognito domain (e.g.
  // "my-app" for my-app.auth.us-west-2.amazoncognito.com) or a full custom
  // domain. Accepts a direct domain string or a reference to the pool's
  // user_pool_domain output.
  dev.planton.shared.foreignkey.v1.StringValueOrRef user_pool_domain = 3 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsCognitoUserPool,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.user_pool_domain"
  ];

  // Extra query parameters appended to the authorization-endpoint request.
  map<string, string> authentication_request_extra_params = 4;

  // What happens to an unauthenticated request: "authenticate" (AWS default
  // -- redirect to login), "deny" (401), or "allow" (pass through; the app
  // sees the request without identity headers).
  string on_unauthenticated_request = 5;

  // Space-separated OAuth scopes to request. AWS default: "openid".
  string scope = 6;

  // The session cookie name. AWS default: "AWSELBAuthSessionCookie".
  string session_cookie_name = 7;

  // Seconds the authentication session stays valid. AWS default: 604800
  // (7 days).
  int32 session_timeout_seconds = 8;

  option (buf.validate.message).cel = {
    id: "cognito_on_unauthenticated_request_valid"
    message: "on_unauthenticated_request must be 'deny', 'allow', or 'authenticate' when set"
    expression: "this.on_unauthenticated_request == '' || this.on_unauthenticated_request in ['deny', 'allow', 'authenticate']"
  };
}

// AwsLbListenerActionAuthenticateOidc fronts the terminal action with any
// OpenID Connect provider (Okta, Auth0, Entra ID, Google, ...) -- the
// bring-your-own-IdP counterpart of authenticate-cognito.
message AwsLbListenerActionAuthenticateOidc {
  // The OIDC issuer identifier (e.g. "https://accounts.google.com").
  string issuer = 1 [(buf.validate.field).required = true];

  // The provider's authorization endpoint URL.
  string authorization_endpoint = 2 [(buf.validate.field).required = true];

  // The provider's token endpoint URL.
  string token_endpoint = 3 [(buf.validate.field).required = true];

  // The provider's UserInfo endpoint URL.
  string user_info_endpoint = 4 [(buf.validate.field).required = true];

  // The OAuth client ID registered with the provider.
  string client_id = 5 [(buf.validate.field).required = true];

  // The OAuth client secret. Handled as a secret end to end -- never exposed
  // in plans, logs, or the console.
  string client_secret = 6 [
    (buf.validate.field).required = true,
    (dev.planton.shared.options.sensitive) = true
  ];

  // Extra query parameters appended to the authorization-endpoint request.
  map<string, string> authentication_request_extra_params = 7;

  // What happens to an unauthenticated request: "authenticate" (AWS default
  // -- redirect to login), "deny" (401), or "allow" (pass through).
  string on_unauthenticated_request = 8;

  // Space-separated OAuth scopes to request. AWS default: "openid".
  string scope = 9;

  // The session cookie name. AWS default: "AWSELBAuthSessionCookie".
  string session_cookie_name = 10;

  // Seconds the authentication session stays valid. AWS default: 604800
  // (7 days).
  int32 session_timeout_seconds = 11;

  option (buf.validate.message).cel = {
    id: "oidc_on_unauthenticated_request_valid"
    message: "on_unauthenticated_request must be 'deny', 'allow', or 'authenticate' when set"
    expression: "this.on_unauthenticated_request == '' || this.on_unauthenticated_request in ['deny', 'allow', 'authenticate']"
  };
}

// AwsLbListenerActionJwtValidation validates a JWT bearer token on each
// request against a JWKS endpoint -- stateless API authentication with no
// login redirect or session cookie. Requests with a missing or invalid token
// are rejected at the load balancer.
message AwsLbListenerActionJwtValidation {
  // The expected token issuer (the "iss" claim), 1-256 characters.
  string issuer = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 256
  ];

  // The JWKS endpoint URL serving the signing keys tokens are verified
  // against, 1-256 characters.
  string jwks_endpoint = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 256
  ];

  // Extra claims the token must carry, beyond issuer and signature. Up to 10.
  repeated AwsLbListenerActionJwtClaim additional_claims = 3 [(buf.validate.field).repeated.max_items = 10];
}

// AwsLbListenerActionJwtClaim is one required claim of a jwt-validation
// action.
message AwsLbListenerActionJwtClaim {
  // The claim name in the token payload (e.g. "aud", "scope").
  string name = 1 [(buf.validate.field).required = true];

  // How the claim value is encoded in the token. Valid values:
  // "single-string", "string-array", "space-separated-values" (how OAuth
  // "scope" claims are typically encoded).
  string format = 2 [(buf.validate.field).required = true];

  // Accepted values for the claim, 1-10 entries of up to 256 characters.
  // The claim satisfies validation when any listed value matches.
  repeated string values = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).repeated = {
      min_items: 1
      max_items: 10
      items: {
        string: {max_len: 256}
      }
    }
  ];

  option (buf.validate.message).cel = {
    id: "jwt_claim_format_valid"
    message: "format must be 'single-string', 'string-array', or 'space-separated-values'"
    expression: "this.format in ['single-string', 'string-array', 'space-separated-values']"
  };
}

// AwsLbListenerMutualAuthentication configures client-certificate handling
// (mTLS) on an ALB HTTPS listener.
message AwsLbListenerMutualAuthentication {
  // The mTLS mode. Required.
  // - "off": no client certificates (the AWS default without this block).
  // - "passthrough": the ALB forwards the whole client certificate to the
  //   target in the X-Amzn-Mtls-Clientcert header and does no verification
  //   itself.
  // - "verify": the ALB verifies client certificates against the trust
  //   store before forwarding.
  string mode = 1 [(buf.validate.field).required = true];

  // The ELBv2 trust store holding the CA bundle used for verification.
  // Required when mode is "verify"; not valid otherwise. Accepts a literal
  // trust store ARN or a reference (no default kind -- trust stores are not
  // modeled as a Planton kind).
  dev.planton.shared.foreignkey.v1.StringValueOrRef trust_store_arn = 2;

  // "verify" mode only: accept client certificates that are past their
  // expiry date. For controlled rollouts of certificate rotation, not
  // steady-state use.
  bool ignore_client_certificate_expiry = 3;

  // "verify" mode only: whether the ALB advertises the trust store's CA
  // subject names during the TLS handshake, helping clients pick the right
  // certificate. Valid values: "on", "off".
  string advertise_trust_store_ca_names = 4;

  option (buf.validate.message).cel = {
    id: "mtls_mode_valid"
    message: "mode must be 'off', 'verify', or 'passthrough'"
    expression: "this.mode in ['off', 'verify', 'passthrough']"
  };

  option (buf.validate.message).cel = {
    id: "mtls_expiry_only_for_verify"
    message: "ignore_client_certificate_expiry only applies when mode is 'verify'"
    expression: "!this.ignore_client_certificate_expiry || this.mode == 'verify'"
  };

  option (buf.validate.message).cel = {
    id: "mtls_advertise_ca_names_valid"
    message: "advertise_trust_store_ca_names must be 'on' or 'off' when set"
    expression: "this.advertise_trust_store_ca_names == '' || this.advertise_trust_store_ca_names in ['on', 'off']"
  };

  // Mirrors the provider's plan-time diagnostic: the advertise knob only
  // exists in "verify" mode (like ignore_client_certificate_expiry above).
  // The matching rule for trust_store_arn (required when "verify") stays
  // module-enforced -- message-level CEL cannot inspect StringValueOrRef
  // fields without breaking protovalidate-java.
  option (buf.validate.message).cel = {
    id: "mtls_advertise_ca_names_only_for_verify"
    message: "advertise_trust_store_ca_names only applies when mode is 'verify'"
    expression: "this.advertise_trust_store_ca_names == '' || this.mode == 'verify'"
  };
}

// AwsLbListenerHttpHeaders groups the ALB listener's HTTP header attributes:
// TLS/mTLS request-header injection and response-header overrides.
message AwsLbListenerHttpHeaders {
  // Request headers the ALB injects toward targets (HTTPS listeners only).
  AwsLbListenerHttpRequestHeaders request = 1;

  // Response headers the ALB sets toward clients (HTTP and HTTPS).
  AwsLbListenerHttpResponseHeaders response = 2;
}

// AwsLbListenerHttpRequestHeaders names the headers the ALB injects into
// requests toward targets, carrying TLS and mTLS connection details. Each
// field sets the HEADER NAME to inject; unset fields inject nothing.
//
// The mTLS certificate headers only carry data when mutual_authentication is
// configured; the TLS version/cipher headers work on any HTTPS listener.
message AwsLbListenerHttpRequestHeaders {
  // Header carrying the full client certificate (URL-encoded PEM).
  string mtls_clientcert_header_name = 1;

  // Header carrying the client certificate's issuer DN.
  string mtls_clientcert_issuer_header_name = 2;

  // Header carrying the leaf client certificate (URL-encoded PEM).
  string mtls_clientcert_leaf_header_name = 3;

  // Header carrying the client certificate's serial number.
  string mtls_clientcert_serial_number_header_name = 4;

  // Header carrying the client certificate's subject DN.
  string mtls_clientcert_subject_header_name = 5;

  // Header carrying the client certificate's validity period.
  string mtls_clientcert_validity_header_name = 6;

  // Header carrying the negotiated TLS cipher suite.
  string tls_cipher_suite_header_name = 7;

  // Header carrying the negotiated TLS protocol version.
  string tls_version_header_name = 8;
}

// AwsLbListenerHttpResponseHeaders sets response HEADER VALUES the ALB sends
// to clients -- CORS and browser security headers served uniformly at the
// edge instead of per-application. Unset fields leave the application's own
// headers untouched.
message AwsLbListenerHttpResponseHeaders {
  // Access-Control-Allow-Credentials header value.
  string access_control_allow_credentials = 1 [(dev.planton.shared.options.sensitive_exempt_reason) = "the literal CORS response-header value the ALB sends to browsers (effectively 'true' or 'false'), not credential material"];

  // Access-Control-Allow-Headers header value.
  string access_control_allow_headers = 2;

  // Access-Control-Allow-Methods header value.
  string access_control_allow_methods = 3;

  // Access-Control-Allow-Origin header value.
  string access_control_allow_origin = 4;

  // Access-Control-Expose-Headers header value.
  string access_control_expose_headers = 5;

  // Access-Control-Max-Age header value (seconds, as a string).
  string access_control_max_age = 6;

  // Content-Security-Policy header value.
  string content_security_policy = 7;

  // Whether the ALB includes its "Server" header in responses. AWS default:
  // true. Optional rather than plain bool so that false ("strip the
  // header") is distinguishable from unset ("keep the AWS default").
  optional bool server_enabled = 8;

  // Strict-Transport-Security header value (e.g. "max-age=31536000;
  // includeSubDomains").
  string strict_transport_security = 9;

  // X-Content-Type-Options header value (typically "nosniff").
  string x_content_type_options = 10;

  // X-Frame-Options header value (e.g. "DENY", "SAMEORIGIN").
  string x_frame_options = 11;
}
