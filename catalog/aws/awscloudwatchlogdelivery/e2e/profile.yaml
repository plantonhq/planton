apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awscloudwatchlogdelivery
spec:
  # Two lanes: the vended pipeline (KB-fixture source -> owned S3
  # destination -> delivery, the full modern arm) and the legacy
  # cross-account Kinesis destination with its access policy. Both ~$0.
  #
  # Deliberately not exercised live:
  #   - the destination POLICY on the vended arm -- a cross-account
  #     grant needs a second account to prove anything real; the
  #     document render is offline-proven and the same Put path carries
  #     it. Unblock: a second-account fixture (none exists today).
  #   - XRAY / CWL / Firehose destination types -- S3 proves the
  #     destination lifecycle; the types differ by ARN service (AWS
  #     derives the type). Unblock: dedicated lanes when the proof
  #     queue wants per-type evidence.
  #   - record_fields / field_delimiter -- source-type-specific wire
  #     tuning the provider does not round-trip for every source;
  #     offline-proven. Unblock: a CloudFront-source lane (its field
  #     set is documented).
  #
  # PROVEN live 2026-08-25 (Q44): both engines, both scenarios,
  # through the full six-phase runner + the Terraform blind import
  # round-trips under the armed apply-idempotency gate. Live catches
  # fixed at the bar: PutDestinationPolicy requires AWS principals as
  # BARE account ids (the root-ARN form is rejected server-side) AND
  # the id must stay a quoted STRING in YAML (an unquoted id parses as
  # a number and IAM's grammar rejects it). The vended arm's MANAGED-KB
  # fixture chain ran clean (~40s DEPENDENCIES-UP per lane).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 45
