syntax = "proto3";

package dev.planton.aws.awscloudwatchlogdelivery.v1alpha1;

import "catalog/aws/awscloudwatchlogdelivery/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsCloudwatchLogDeliveryIacInput is the input for the IaC modules
// that manage CloudWatch Logs deliveries.
message AwsCloudwatchLogDeliveryIacInput {
  // target is the AwsCloudwatchLogDelivery resource to deploy.
  AwsCloudwatchLogDelivery target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
