syntax = "proto3";

package dev.planton.aws.awscloudwatchlogdelivery.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awscloudwatchlogdelivery/v1alpha1/outputs.proto";
import "catalog/aws/awscloudwatchlogdelivery/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsCloudwatchLogDelivery {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsCloudwatchLogDelivery'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsCloudwatchLogDeliverySpec spec = 4 [(buf.validate.field).required = true];
  AwsCloudwatchLogDeliveryStatus status = 5;
}

message AwsCloudwatchLogDeliveryStatus {
  AwsCloudwatchLogDeliveryOutputs outputs = 1;
}
