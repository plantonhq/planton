# AwsMemorydbCluster composed scenario: the smallest billable cluster
# (db.t4g.small, one shard, zero replicas -- durability still holds through
# the Multi-AZ transaction log) proving the three composition seams live:
# the required ACL reference (against the empty ACL fixture, via the
# e2e-prerequisites annotation), the folded module-managed subnet group
# (two AZs from the shared subnet fixture -- the registry prerequisite),
# and the folded module-managed parameter group. Valkey is the engine
# (cheapest per node, the modern default); windows and a 1-day retention
# exercise the maintenance surface.
#
# Deliberately not exercised live: dual-stack networking (the VPC fixture
# is IPv4-only), data tiering (requires the r6gd family -- cost), the
# snapshot restore arms and multi-region join (need pre-existing
# snapshots / a multi-region cluster), KMS/SNS refs (pass-through
# arguments) -- see the profile. Cluster create/delete dominate the lane
# (~15-25 min create; deletes poll after a 5-minute floor).
apiVersion: aws.planton.dev/v1alpha1
kind: AwsMemorydbCluster
metadata:
  name: planton-oss-e2e-awsmdb-min
  id: planton-oss-e2e-awsmdb-min
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsmemorydbcluster
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsMemorydbAcl"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  engine: valkey
  description: Planton E2E MemoryDB minimal composed cluster
  nodeType: db.t4g.small
  numShards: 1
  numReplicasPerShard: 0
  aclName:
    valueFrom:
      kind: AwsMemorydbAcl
      name: planton-oss-e2e-awsmdbacl-prereq
      fieldPath: status.outputs.acl_name
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-b
        fieldPath: status.outputs.subnet_id
  tlsEnabled: true
  maintenanceWindow: sun:05:00-sun:06:00
  snapshotRetentionLimit: 1
  snapshotWindow: "03:00-04:00"
  parameterGroupFamily: memorydb_valkey7
  parameters:
    - name: activedefrag
      value: "yes"
