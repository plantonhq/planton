# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsorganization
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The organization stores no customer data -- its structure, trusted-access list, policy-type switches, and resource policy are Organizations control-plane metadata held inside AWS's own service infrastructure, not a data store this component owns.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: There is no data at rest to key (see enc-at-rest); Organizations exposes no KMS surface.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The organization terminates no connections of its own. The only wire traffic involving it -- Organizations management API calls -- happens on AWS API endpoints, which serve exclusively over TLS as account-wide provider behavior, not per-organization configuration.
    - control_id: no-public-access
      status: not_applicable
      notes: An organization has no network endpoint to expose. Its real exposure surface is identity -- which principals may call Organizations APIs is IAM territory, and which MEMBER ACCOUNTS may call them is exactly what the resource_policy arm governs (see rbac).
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network surface exists to filter; the organization is a governance object with no addresses or ports.
    - control_id: edge-protection
      status: not_applicable
      notes: The organization receives no HTTP requests -- web ACLs and request filters have nothing to attach to.
    - control_id: rbac
      status: configurable
      field_path: resource_policy
      evidence:
        type: spec_default
        reference: Every Organizations operation is IAM-authorized, and by default only the management account's principals can manage the organization. The resource_policy arm is the organization's own resource-based access control -- the singleton delegation document that names which member accounts may perform which Organizations actions (AWS keeps exactly one per organization; the arm IS that singleton). delegated_administrators extends the model per service, registering a member account as the org-wide administrator for one AWS service.
      notes: Unset means no delegation -- the tightest posture, everything locked to the management account. A delegation document is only as good as its statements; scoping delegated actions narrowly is the operator's job.
    - control_id: workload-identity
      status: not_applicable
      notes: The organization runs no user workload. Trusted services granted access through aws_service_access_principals operate through AWS-managed service-linked roles in member accounts -- plumbing fixed by AWS's design, not a workload-identity choice this manifest carries.
    - control_id: no-legacy-auth
      status: configurable
      field_path: root_access_management
      evidence:
        type: spec_default
        reference: The root_access_management arm enables IAM's centralized root-access features across every member account. RootCredentialsManagement lets the management account (or delegated admin) centrally remove member-account root passwords and access keys -- the longest-lived, least-auditable credential path an AWS account has -- replacing standing root access with short-lived privileged RootSessions for the rare tasks that genuinely need root. Requires iam.amazonaws.com trusted access, which a spec CEL front-loads.
      notes: Unset leaves each member account's root credentials locally managed -- the AWS default. Destroying the arm disables every enabled feature, so member-account root credentials become locally manageable again.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: The spec exposes no audit surface of its own. Organizations management calls are recorded by AWS CloudTrail as account-level posture -- and granting cloudtrail.amazonaws.com trusted access here is the prerequisite for an ORGANIZATION trail capturing every member account, which lives on the AwsCloudtrail component.
    - control_id: monitoring-integration
      status: not_applicable
      notes: Organizations publishes no CloudWatch metrics for the organization object; change signals (account joins, policy attachments) surface through CloudTrail events, an account-level integration outside this spec and the modules.
    - control_id: backup-recovery
      status: not_applicable
      notes: The organization holds no data to back up -- it is declarative governance configuration re-creatable from the manifest. The member accounts themselves are not "restored" through this component; they are their own AwsOrganizationAccount objects.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Organizations is a global control-plane service -- AWS replicates the organization's state across its own infrastructure, the same organization is visible from every region, and there is no zonal placement to configure.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither AWS nor the modules expose a deletion-protection flag. AWS does refuse DeleteOrganization while any member account, OU, or policy still exists -- a structural dependency guard that makes accidental whole-organization deletion practically impossible, but not a configurable protection.
    - control_id: managed-patching
      status: not_applicable
      notes: The organization is a pure configuration object with no software to patch.
