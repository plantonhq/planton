# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: awsorganization
spec:
  billing_model: free
  free_tier: "The AWS Organizations pricing page says it plainly: 'AWS Organizations is offered at no additional charge. You are charged only for AWS resources that users and roles in your member accounts use.' No meter counts the organization object, its feature set, trusted service access, enabled policy types, delegated administrator registrations, the resource policy, or root-access management -- every arm of this spec is governance configuration AWS provides for free."
  notes: "What the organization changes is not how much is spent but WHO PAYS: under consolidated billing the management account -- the account this manifest is deployed into -- is responsible for every member account's usage, so creating the organization makes this account the payer for the whole tree. The spend itself lives on the workloads inside member accounts, each billing as its own catalog kind. Two arms deserve a routing note. aws_service_access_principals bills nothing, but it is the doorway through which other services build org-WIDE (and therefore org-sized) resources -- trusted access for cloudtrail.amazonaws.com is what lets an organization trail on AwsCloudtrail multiply its event meters by every member account's activity, and config.amazonaws.com does the same for org-wide AWS Config recording; those meters bill on those components, not here. And enabled_policy_types plus the SCP/RCP documents attached through AwsOrganizationPolicy restrict spend rather than create it. Nothing about this object ever appears as its own line on an invoice."
