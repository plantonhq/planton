syntax = "proto3";

package dev.planton.aws.awssecuritygroup.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awssecuritygroup/v1alpha1/outputs.proto";
import "catalog/aws/awssecuritygroup/v1alpha1/spec.proto";
import "shared/metadata.proto";

//aws-security-group
message AwsSecurityGroup {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsSecurityGroup'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsSecurityGroupSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsSecurityGroupStatus status = 5;
}

//aws-security-group status
message AwsSecurityGroupStatus {
  //outputs
  AwsSecurityGroupOutputs outputs = 1;
}
