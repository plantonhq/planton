syntax = "proto3";

package dev.planton.aws.awssecuritygroup.v1alpha1;

//aws-security-group outputs
message AwsSecurityGroupOutputs {
  // the unique ID of the security group (sg-...). The join key other
  // resources reference to attach this group.
  string security_group_id = 1;

  // the ARN of the security group -- the form IAM policy conditions and
  // resource-level permissions expect.
  string security_group_arn = 2;

  // the AWS account ID that owns the security group. Needed when another
  // account references this group in a cross-account rule
  // ("<owner_id>/<group_id>").
  string owner_id = 3;

  // association IDs of the group's shares into other VPCs, keyed by the
  // resolved VPC id from spec.additional_vpc_ids (import id form
  // "<group_id>,<vpc_id>"); empty when the group lives in one VPC.
  map<string, string> additional_vpc_association_ids = 4;
}
