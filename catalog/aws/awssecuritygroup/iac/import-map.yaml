apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awssecuritygroup
spec:
  # The module names the group after the Planton resource, but a security
  # group imports by its AWS-assigned "sg-..." id -- discoverable from a
  # prior deploy's outputs or one pasted ARN.
  values:
    - name: security_group_id
      derivations:
        - from_output: security_group_id
        - from_arn_part: resource_id
      where_to_find: >-
        VPC console -> Security groups (the Security group ID column), or
        `aws ec2 describe-security-groups
        --filters Name=group-name,Values=<name>` (GroupId).
    - name: vpc_id
      derivations:
        # The association imports by "<group_id>,<vpc_id>" -- both halves are
        # config-time identity: the module keys each for_each instance by the
        # resolved VPC id, so the enumerated address carries it (the module
        # also exports the composed import ids as the
        # additional_vpc_association_ids map keyed the same way).
        - from_address_key: true
      where_to_find: >-
        `aws ec2 describe-security-group-vpc-associations
        --filters Name=group-id,Values=<group_id>` (each association's
        VpcId; the import id is "<group_id>,<vpc_id>").
