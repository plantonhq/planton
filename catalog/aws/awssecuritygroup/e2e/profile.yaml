apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awssecuritygroup
spec:
  # A security group under live E2E: the harness deploys the AwsVpc
  # prerequisite (the registry graph), then runs deploy ->
  # DescribeSecurityGroups verify -> destroy -> verify-destroyed on both
  # provisioners. The scenario is deliberately rules-rich -- a
  # self-referencing ingress rule (the same UserIdGroupPairs API surface
  # as cross-group references), an ICMP rule using the type/code port
  # overloading with the -1 all-codes sentinel, IPv4 + IPv6 CIDR sources,
  # a managed-prefix-list egress rule (the region-stable S3 gateway list),
  # and revoke_rules_on_delete -- so one fast lane proves the whole rule
  # vocabulary live at zero resource cost (a group provisions in
  # seconds). The depth close added the multi-VPC share arm
  # (spec.additional_vpc_ids -- one association into a second VPC fixture
  # composed via the path-form e2e-prerequisites seam); the evidence bar
  # is DescribeSecurityGroupVpcAssociations echoing the second VPC with
  # state associated per engine. Deliberately not in the live scenario:
  # cross-group references to a SECOND group (mechanically identical to
  # the self-reference; avoiding a self-kind prerequisite keeps the chain
  # acyclic) -- proven by CEL spec tests and every consumer chain that
  # attaches the shared SG fixtures.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
