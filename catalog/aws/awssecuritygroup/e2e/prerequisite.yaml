# AwsSecurityGroup install profile used as a prerequisite by composed
# components. Publishes one named document per consumer-specific fixture
# shape; consumers select the instance they need by name.
#
# Document 1 -- Kafka broker group (AwsMskCluster): brokers must attach at
# least one security group at creation (the embedded shadow-group shape was
# retired, so ingress lives here on the first-class node). The group opens
# the Kafka listener ports (9092 plaintext, 9094 TLS, 9096 SASL/SCRAM, 9098
# SASL/IAM) and ZooKeeper (2181-2182) to the VPC prerequisite's 10.0.0.0/16
# only -- nothing is internet-reachable. vpc_id resolves against the AwsVpc
# prerequisite. Full metadata is supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsSecurityGroup
metadata:
  name: planton-oss-e2e-awssg-prereq
  id: planton-oss-e2e-awssg-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awssecuritygroup
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: planton-oss-e2e-awsvpc-prereq
      fieldPath: status.outputs.vpc_id
  description: Planton E2E prerequisite group; opens Kafka and ZooKeeper ports to the VPC
  ingress:
    - protocol: tcp
      fromPort: 9092
      toPort: 9098
      ipv4Cidrs:
        - 10.0.0.0/16
      description: Kafka listeners (plaintext/TLS/SASL) from the E2E VPC
    - protocol: tcp
      fromPort: 2181
      toPort: 2182
      ipv4Cidrs:
        - 10.0.0.0/16
      description: ZooKeeper from the E2E VPC
---
# Document 2 -- generic instance group (AwsEc2Instance and similar
# compute consumers): no ingress at all (deny all inbound) and an
# egress-only posture wide enough for SSM/package traffic -- the locked-
# down default an instance fixture should carry. Consumers that need
# inbound reach add their own group beside it.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsSecurityGroup
metadata:
  name: planton-oss-e2e-awssg-instance-prereq
  id: planton-oss-e2e-awssg-instance-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awssecuritygroup
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: planton-oss-e2e-awsvpc-prereq
      fieldPath: status.outputs.vpc_id
  description: Planton E2E instance prerequisite group; no inbound, all outbound
  egress:
    - protocol: "-1"
      fromPort: 0
      toPort: 0
      ipv4Cidrs:
        - 0.0.0.0/0
      description: All outbound (SSM, package mirrors)
---
# Document 3 -- MWAA environment group (AwsMwaaEnvironment): the
# AWS-recommended MWAA pattern -- a self-referencing all-traffic ingress
# rule (the scheduler, workers, webserver, and metadata DB communicate
# through it; without it the environment never reaches AVAILABLE), HTTPS
# (443) from the VPC for Airflow UI access, and full egress. Consumers
# select this instance by name.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsSecurityGroup
metadata:
  name: planton-oss-e2e-awssg-mwaa-prereq
  id: planton-oss-e2e-awssg-mwaa-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awssecuritygroup
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: planton-oss-e2e-awsvpc-prereq
      fieldPath: status.outputs.vpc_id
  description: Planton E2E MWAA prerequisite group; self-referencing + HTTPS from the VPC
  ingress:
    - protocol: "-1"
      fromPort: 0
      toPort: 0
      selfReference: true
      description: MWAA component intercommunication (self-referencing, all traffic)
    - protocol: tcp
      fromPort: 443
      toPort: 443
      ipv4Cidrs:
        - 10.0.0.0/16
      description: Airflow UI access from the E2E VPC
  egress:
    - protocol: "-1"
      fromPort: 0
      toPort: 0
      ipv4Cidrs:
        - 0.0.0.0/0
      description: All outbound (AWS APIs, package installs)
---
# Document 4 -- resolver DNS group (AwsRoute53ResolverEndpoint): DNS on
# TCP+UDP 53 from the VPC prerequisite's CIDR (inbound endpoints answer
# queries on it; outbound endpoints originate from it and need the
# egress), nothing internet-reachable. Consumers select this instance
# by name.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsSecurityGroup
metadata:
  name: planton-oss-e2e-awssg-resolver-dns
  id: planton-oss-e2e-awssg-resolver-dns
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awssecuritygroup
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  vpcId:
    valueFrom:
      kind: AwsVpc
      name: planton-oss-e2e-awsvpc-prereq
      fieldPath: status.outputs.vpc_id
  description: Planton E2E resolver DNS group; DNS (TCP+UDP 53) within the VPC
  ingress:
    - protocol: tcp
      fromPort: 53
      toPort: 53
      ipv4Cidrs:
        - 10.0.0.0/16
      description: DNS over TCP from the E2E VPC
    - protocol: udp
      fromPort: 53
      toPort: 53
      ipv4Cidrs:
        - 10.0.0.0/16
      description: DNS over UDP from the E2E VPC
  egress:
    - protocol: tcp
      fromPort: 53
      toPort: 53
      ipv4Cidrs:
        - 10.0.0.0/16
      description: Forwarded DNS over TCP to targets in the VPC CIDR
    - protocol: udp
      fromPort: 53
      toPort: 53
      ipv4Cidrs:
        - 10.0.0.0/16
      description: Forwarded DNS over UDP to targets in the VPC CIDR
