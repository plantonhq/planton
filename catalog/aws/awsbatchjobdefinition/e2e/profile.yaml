apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsbatchjobdefinition
spec:
  # A Batch job definition under live E2E: registration-only (no compute is
  # ever provisioned to register a definition), so the lane is a
  # dependency-free leaf. The EC2 scenario exercises the rich container
  # surface with no IAM role requirement: parameterized command,
  # environment, ulimits, Linux parameters, retry discrimination
  # (RETRY on Spot-reclaim status reasons vs EXIT on real failures),
  # timeout, and fair-share scheduling priority. Deregistration flips the
  # revision to INACTIVE (Batch never hard-deletes job definitions), so
  # verify-absent asserts "no ACTIVE revision". Deliberately not in the
  # live lane: the Fargate arm (needs an execution-role fixture; the
  # Fargate-only fields are proven by CEL spec tests and the serializer
  # unit tests), secrets/EFS volumes (need Secrets Manager / EFS
  # fixtures; serialization locked by the container-properties unit
  # tests), and the Batch-on-EKS pod arm -- registration itself is free,
  # but honest live proof of an EKS job needs the cluster to schedule it
  # on, and a live EKS cluster is the catalog's most expensive fixture
  # (the same recorded deferral as the compute environment's
  # eks_configuration arm; unblock: a shared EKS fixture chain). The EKS
  # arm is offline-proven: spec/CEL suites, both engines' renderings
  # plan/preview arm-for-arm identical on the 03-eks-pod-job preset
  # shape.
  # Prior live dual-engine run 2026-07-08: Terraform 36s; both lanes
  # green (the combined scheduling-policy + job-definition four-lane run
  # took 2m01s).
  #
  # Proven 2026-08-12, both engines, all phases (Pulumi 32s / Terraform
  # 32s) — the container arm re-earned its badge through the NEW
  # arm-conditional rendering path. DescribeJobDefinitions (status
  # filter) showed exactly ONE ACTIVE revision per engine's window with
  # DISTINCT revision numbers (Batch continues numbering across
  # same-name recreates — 6 then 7), type "container"; verify-absent
  # confirmed no ACTIVE revision after each destroy
  # (deregister_on_new_revision platform-default behavior verified).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
