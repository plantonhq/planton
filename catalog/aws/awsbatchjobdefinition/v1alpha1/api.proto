syntax = "proto3";

package dev.planton.aws.awsbatchjobdefinition.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsbatchjobdefinition/v1alpha1/outputs.proto";
import "catalog/aws/awsbatchjobdefinition/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsBatchJobDefinition is the API envelope for an AWS Batch job definition
// -- the versioned container blueprint jobs are submitted from (image,
// command, sizing, IAM identities, retries, timeout).
message AwsBatchJobDefinition {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this resource, must be "AwsBatchJobDefinition".
  string kind = 2 [(buf.validate.field).string.const = "AwsBatchJobDefinition"];

  // metadata captures identifying information (name, org, environment,
  // labels) and must pass standard validations for resource naming.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the desired configuration of the job definition.
  AwsBatchJobDefinitionSpec spec = 4 [(buf.validate.field).required = true];

  // status holds post-deployment information.
  AwsBatchJobDefinitionStatus status = 5;
}

// AwsBatchJobDefinitionStatus describes the status of an AWS Batch job
// definition.
message AwsBatchJobDefinitionStatus {
  // outputs captures the observable values returned by Pulumi/Terraform
  // after provisioning.
  AwsBatchJobDefinitionOutputs outputs = 1;
}
