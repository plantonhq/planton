syntax = "proto3";

package dev.planton.aws.awsinternetgateway.v1alpha1;

import "catalog/aws/awsinternetgateway/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsInternetGatewayIacInput is the input to the IaC modules (Pulumi /
// Terraform) that deploy an AwsInternetGateway resource.
message AwsInternetGatewayIacInput {
  // the catalog object to deploy
  AwsInternetGateway target = 1;
  // provider-config
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
