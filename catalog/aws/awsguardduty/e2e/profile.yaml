apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsguardduty
spec:
  # The region's GuardDuty posture under live E2E: the scenario
  # composes one bucket (list files + findings export, with the
  # guardduty.amazonaws.com policy arms), a KMS key (export
  # encryption; the key policy's root statement expands
  # ${E2E_ENV:PLANTON_E2E_AWS_ACCOUNT_ID} -- the lane exports it
  # first), and the TEST-NET list files; applies the detector with two
  # protection plans (one sub-toggle sent false), a noise filter, an
  # ACTIVE trusted + threat list, and findings export; verifies
  # GetDetector/GetFilter/GetIPSet/GetThreatIntelSet/
  # DescribePublishingDestination echo the posture, then destroys.
  # Destroy is a REAL delete (the detector removes findings and every
  # satellite). Cost: ~zero (idle account event volume; new detectors
  # ride the 30-day free trial).
  #
  # SINGLETON COLLISION CLASS: ONE detector per account per region --
  # a pre-existing detector (hand-enabled or Organizations
  # auto-enabled) fails create (the watch-list flags it).
  #
  # Deliberately not exercised live:
  #   - organization / members / accept_invitation_from_account_id --
  #     the single-account wall (org admin delegation, member
  #     invitations, and the member-side accepter all need a second
  #     account or an AWS Organization). Renders proven arm-for-arm
  #     offline. Unblock: an organization-enabled test account pair,
  #     then the admin and member postures prove as a two-account
  #     lane pair.
  #   - enable: false -- the suspended posture is a plain
  #     UpdateDetector the running lane's arms already exercise.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 25
