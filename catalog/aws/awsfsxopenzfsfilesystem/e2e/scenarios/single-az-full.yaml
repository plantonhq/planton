# Full-surface SINGLE_AZ_2 AwsFsxOpenzfsFileSystem scenario at the smallest
# shape (64 GiB / 160 MB/s): root volume with ZSTD compression, an NFS
# export scoped to the fixture VPC's CIDR, per-user and per-group quotas,
# user-provisioned disk IOPS, backups with an explicit take-a-final-backup
# decision, and the cascading-delete opt-in (harmless here — the lane
# creates no child volumes — but proves the argument wiring). Excluded arms
# are recorded in profile.yaml (MULTI_AZ_1, the HA variants,
# INTELLIGENT_TIERING, backup restore).
# The e2e-prerequisites annotation composes the security-group fixture this
# manifest references (security_group_ids is optional on the kind, so it is
# deliberately NOT a registry prerequisite).
apiVersion: aws.planton.dev/v1alpha1
kind: AwsFsxOpenzfsFileSystem
metadata:
  name: planton-oss-e2e-awsfxz-full
  id: planton-oss-e2e-awsfxz-full
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsfsxopenzfsfilesystem
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsSecurityGroup"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  deploymentType: SINGLE_AZ_2
  storageCapacityGib: 64
  throughputCapacity: 160
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
  securityGroupIds:
    - valueFrom:
        kind: AwsSecurityGroup
        name: planton-oss-e2e-awssg-prereq
        fieldPath: status.outputs.security_group_id
  diskIopsConfiguration:
    mode: USER_PROVISIONED
    iops: 300
  rootVolumeConfiguration:
    dataCompressionType: ZSTD
    recordSizeKib: 128
    copyTagsToSnapshots: true
    nfsExports:
      clientConfigurations:
        - clients: 10.0.0.0/16
          options:
            - rw
            - crossmnt
    userAndGroupQuotas:
      - id: 1000
        storageCapacityQuotaGib: 32
        type: USER
      - id: 2000
        storageCapacityQuotaGib: 48
        type: GROUP
  automaticBackupRetentionDays: 1
  dailyAutomaticBackupStartTime: "04:00"
  copyTagsToBackups: true
  copyTagsToVolumes: true
  # Explicit false proves the presence-honest final-backup path end to end;
  # the final backup is removed by the zero-orphan sweep after the lane.
  skipFinalBackup: false
  finalBackupTags:
    planton-e2e: "true"
  deleteOptions:
    - DELETE_CHILD_VOLUMES_AND_SNAPSHOTS
  weeklyMaintenanceStartTime: "7:03:00"
