# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awsfsxopenzfsfilesystem
spec:
  aws:
    statements:
      - sid: ManageFileSystem
        actions:
          - fsx:CreateFileSystem
          - fsx:CreateFileSystemFromBackup
          - fsx:UpdateFileSystem
          - fsx:DeleteFileSystem
          - fsx:TagResource
          - fsx:UntagResource
          - fsx:ListTagsForResource
        resources:
          - arn:aws:fsx:*:*:file-system/*
          - arn:aws:fsx:*:*:backup/*
        provenance: derived
        notes: Covers aws_fsx_openzfs_file_system -- creation (including the root volume configuration, read cache, disk IOPS, and MULTI_AZ_1 networking arms), in-place updates (storage growth, throughput scaling, backup settings, maintenance window), tagging, and deletion. The backup ARN format is required alongside file-system by the service reference for CreateFileSystemFromBackup (the spec's backup_id restore arm) and for DeleteFileSystem (the final backup taken when skip_final_backup is false, including its final_backup_tags).
      - sid: DescribeFileSystems
        actions:
          - fsx:DescribeFileSystems
        resources:
          - "*"
        provenance: derived
        notes: Read-side of aws_fsx_openzfs_file_system during plan/refresh. FSx Describe APIs support no resource-level scoping (empty Resources lists in the service reference), so the wildcard is the narrowest possible scope.
      - sid: ReadVpcNetworking
        actions:
          - ec2:DescribeSubnets
          - ec2:DescribeVpcs
          - ec2:DescribeSecurityGroups
          - ec2:DescribeRouteTables
        resources:
          - "*"
        provenance: derived
        notes: FSx invokes these with the caller's credentials (forward-access sessions via fsx.amazonaws.com, mirrored in the AmazonFSxFullAccess policy) to validate subnet_ids and security_group_ids and to resolve route_table_ids for MULTI_AZ_1 endpoint routing. EC2 Describe APIs support no resource-level scoping, so the wildcard is the narrowest possible scope.
      - sid: TagManagedRouteTables
        actions:
          - ec2:CreateTags
        resources:
          - arn:aws:ec2:*:*:route-table/*
        provenance: derived
        notes: Required only for MULTI_AZ_1 (spec.route_table_ids) -- FSx tags the managed route tables AmazonFSx=ManagedByAmazonFSx through the caller's credentials when it installs the floating-endpoint routes.
      - sid: UseCustomerManagedKey
        actions:
          - kms:DescribeKey
          - kms:CreateGrant
        resources:
          - arn:aws:kms:*:*:key/*
        provenance: derived
        notes: Required only when spec.kms_key_id selects a customer-managed at-rest key -- FSx validates the key and creates a grant against it during file-system creation. Both actions authorize on the key ARN per the KMS service reference.
      - sid: ManageServiceLinkedRole
        actions:
          - iam:CreateServiceLinkedRole
        resources:
          - arn:aws:iam::*:role/aws-service-role/fsx.amazonaws.com/*
        provenance: derived
        notes: The first FSx file system in an account creates the AWSServiceRoleForAmazonFSx service-linked role, which FSx uses to place network interfaces and manage MULTI_AZ_1 route entries. Scoped to the FSx service-linked role path.
