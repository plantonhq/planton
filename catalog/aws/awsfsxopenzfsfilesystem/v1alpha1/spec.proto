syntax = "proto3";

package dev.planton.aws.awsfsxopenzfsfilesystem.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// AwsFsxOpenzfsFileSystemSpec defines the desired configuration for an Amazon FSx
// for OpenZFS file system — a fully managed NFS file system built on the OpenZFS
// file system, providing sub-millisecond latency, snapshots, cloning, and data
// compression with support for NFSv3, NFSv4.0, NFSv4.1, and NFSv4.2 protocols.
//
// FSx for OpenZFS delivers up to 10 GB/s throughput and over 1 million IOPS,
// making it suitable for general-purpose NFS workloads including web serving,
// content management, analytics, DevOps, CI/CD, and application data stores.
//
// Deployment generations:
// - SINGLE_AZ_1: first generation, lower throughput ceiling (64-4096 MB/s).
// - SINGLE_AZ_2: current generation (160-10240 MB/s). Recommended default.
// - SINGLE_AZ_HA_1 / SINGLE_AZ_HA_2: the HA variants of each generation — an
//   active/standby file-server pair inside ONE availability zone (failover
//   without cross-AZ data transfer costs).
// - MULTI_AZ_1: active/standby across TWO availability zones — the highest
//   availability tier. Requires two subnets, a preferred_subnet_id, and
//   (typically) route_table_ids; supports the INTELLIGENT_TIERING storage
//   class.
//
// Key design notes:
// - `deployment_type`, `subnet_ids`, `security_group_ids`, `kms_key_id`,
//   `storage_type`, `backup_id`, `preferred_subnet_id`, and
//   `endpoint_ip_address_range` are ForceNew — changing them replaces the
//   file system.
// - The root volume is created with the file system; its NFS exports,
//   compression, and quotas are configured via `root_volume_configuration`
//   (note: `copy_tags_to_snapshots` inside it is ForceNew).
// - Child volumes are independent lifecycle resources and are NOT managed by
//   this component. Use the root_volume_id output to create child volumes.
// - Credentials, region, and deployment workflow live outside this spec in
//   IaC inputs.
message AwsFsxOpenzfsFileSystemSpec {
  // The AWS region where the resource will be created.
  // Example: "us-west-2", "eu-west-1"
  string region = 1 [(buf.validate.field).string.min_len = 1];

  // ---------------------------------------------------------------------------
  // File system core
  // ---------------------------------------------------------------------------

  // Deployment type controlling availability and performance characteristics.
  // ForceNew — cannot be changed after creation.
  //
  // - "SINGLE_AZ_1": first-generation single-AZ. Throughput 64-4096 MB/s.
  // - "SINGLE_AZ_2": current-generation single-AZ. Throughput 160-10240 MB/s.
  //   Recommended for most workloads.
  // - "SINGLE_AZ_HA_1" / "SINGLE_AZ_HA_2": HA (active/standby) variants of the
  //   two generations within one AZ — automatic failover without cross-AZ
  //   data transfer charges.
  // - "MULTI_AZ_1": active/standby across two AZs. Requires two subnets in
  //   different AZs plus preferred_subnet_id; the only type supporting the
  //   INTELLIGENT_TIERING storage class.
  //
  // Default: SINGLE_AZ_2
  optional string deployment_type = 2 [(dev.planton.shared.options.default) = "SINGLE_AZ_2"];

  // Storage capacity in GiB for provisioned (SSD) storage. Range: 64-524288.
  // Can be increased after creation but never decreased.
  //
  // Leave unset in exactly two cases: the INTELLIGENT_TIERING storage class
  // (capacity is elastic and never provisioned) or a backup restore
  // (`backup_id` — capacity comes from the backup).
  optional int32 storage_capacity_gib = 3 [(buf.validate.field).int32 = {
    gte: 64
    lte: 524288
  }];

  // Storage class backing the file system. ForceNew.
  //
  // - "SSD": provisioned solid-state storage (default; all deployment types).
  // - "INTELLIGENT_TIERING": elastic, pay-for-what-you-store capacity with a
  //   provisioned SSD read cache. MULTI_AZ_1 only; forbids
  //   storage_capacity_gib and requires read_cache_configuration.
  //
  // Default: SSD
  optional string storage_type = 4 [(dev.planton.shared.options.default) = "SSD"];

  // Throughput capacity in MB/s. Required.
  //
  // Valid values by deployment generation (the values AWS accepts):
  // - SINGLE_AZ_1: 64, 128, 256, 512, 1024, 2048, 3072, 4096
  // - SINGLE_AZ_2 / MULTI_AZ_1: 160, 320, 640, 1280, 2560, 3840, 5120,
  //   7680, 10240
  // - The HA variants follow their generation's value set (validated by AWS
  //   at create time).
  //
  // Can be changed after creation to scale performance up or down.
  int32 throughput_capacity = 5 [(buf.validate.field).int32.gt = 0];

  // Provisioned SSD read cache for the INTELLIGENT_TIERING storage class.
  // Required when storage_type is INTELLIGENT_TIERING; invalid otherwise.
  AwsFsxOpenzfsFileSystemReadCacheConfiguration read_cache_configuration = 6;

  // ---------------------------------------------------------------------------
  // Networking (ForceNew)
  // ---------------------------------------------------------------------------

  // Subnet IDs for the file system's network interfaces. Required. ForceNew.
  //
  // - Single-AZ types (incl. the HA variants): exactly one subnet.
  // - MULTI_AZ_1: exactly two subnets in different availability zones.
  //
  // All compute resources mounting this file system must have network
  // connectivity to these subnets.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef subnet_ids = 7 [
    (buf.validate.field).repeated.min_items = 1,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSubnet,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.subnet_id"
  ];

  // Security groups for the file system's network interfaces. ForceNew.
  // Up to 50. When empty, AWS attaches the VPC's default security group.
  //
  // Must allow NFS traffic between the file system and its clients:
  // - TCP port 111 (portmapper)
  // - TCP port 2049 (NFS)
  // - TCP ports 20001-20003 (NFS mount)
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef security_group_ids = 8 [
    (buf.validate.field).repeated.max_items = 50,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSecurityGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.security_group_id"
  ];

  // Preferred subnet for the active file server in a MULTI_AZ_1 deployment.
  // ForceNew. REQUIRED for MULTI_AZ_1 (AWS's contract) and invalid for the
  // single-AZ types. Must be one of the subnets in subnet_ids.
  //
  // In a failover event, the standby file server in the other subnet takes
  // over.
  dev.planton.shared.foreignkey.v1.StringValueOrRef preferred_subnet_id = 9 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSubnet,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.subnet_id"
  ];

  // IP address range for the file system endpoints in a MULTI_AZ_1
  // deployment. ForceNew. Must be a CIDR block within the VPC's CIDR range
  // that does not overlap with any existing subnets; AWS assigns floating IPs
  // from this range for seamless failover. When omitted, AWS picks a range.
  //
  // The provider does not validate this field's format for OpenZFS (unlike its
  // ONTAP sibling) — the CEL below mirrors the ONTAP kind so a malformed range
  // fails at validate instead of at the AWS API.
  string endpoint_ip_address_range = 10 [(buf.validate.field).cel = {
    id: "endpoint_ip_range_cidr_format"
    message: "endpoint_ip_address_range must be an IPv4 CIDR block (e.g., '198.19.0.0/24')"
    expression: "this == '' || this.matches('^([0-9]{1,3}\\\\.){3}[0-9]{1,3}/[0-9]{1,2}$')"
  }];

  // Route tables in which AWS manages routes to the floating file-system
  // endpoints of a MULTI_AZ_1 deployment. Specify every VPC route table
  // associated with the subnets your NFS clients live in; when omitted, AWS
  // uses the VPC's default route table. Up to 50.
  //
  // Reference an AwsSubnet's route_table_id output when the subnet owns its
  // table, or the AwsVpc's main/default route-table outputs when subnets ride
  // the VPC main table; literals also work.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef route_table_ids = 11 [
    (buf.validate.field).repeated.max_items = 50,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSubnet,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.route_table_id"
  ];

  // ---------------------------------------------------------------------------
  // Encryption
  // ---------------------------------------------------------------------------

  // Customer-managed KMS key ARN for encryption at rest. ForceNew — the KMS
  // key cannot be changed after creation. When omitted, the file system uses
  // the AWS-managed FSx key. All OpenZFS file systems are encrypted at rest
  // by default; this field upgrades to a customer-managed key.
  dev.planton.shared.foreignkey.v1.StringValueOrRef kms_key_id = 12 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsKmsKey,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_arn"
  ];

  // ---------------------------------------------------------------------------
  // Restore
  // ---------------------------------------------------------------------------

  // ID of an FSx backup to restore this file system from ("backup-...").
  // ForceNew. When set, capacity and most settings come from the backup;
  // leave storage_capacity_gib unset.
  string backup_id = 13;

  // ---------------------------------------------------------------------------
  // Disk IOPS configuration
  // ---------------------------------------------------------------------------

  // SSD IOPS configuration for the file system. Controls the total
  // provisioned IOPS. When omitted, AWS uses AUTOMATIC mode which scales IOPS
  // with storage (3 IOPS per GiB).
  AwsFsxOpenzfsFileSystemDiskIopsConfiguration disk_iops_configuration = 14;

  // ---------------------------------------------------------------------------
  // Root volume configuration
  // ---------------------------------------------------------------------------

  // Configuration for the file system's root volume. The root volume is
  // automatically created with the file system and serves as the default NFS
  // mount target. Settings here control compression, NFS access, quotas, and
  // record size.
  //
  // When omitted, the root volume uses defaults: no compression, no NFS
  // access restrictions, 128 KiB record size.
  AwsFsxOpenzfsFileSystemRootVolumeConfiguration root_volume_configuration = 15;

  // ---------------------------------------------------------------------------
  // Backup
  // ---------------------------------------------------------------------------

  // Number of days to retain automatic backups. Range: 0-90; 0 disables
  // automatic backups.
  //
  // Default: 0 (no automatic backups)
  optional int32 automatic_backup_retention_days = 16 [
    (dev.planton.shared.options.default) = "0",
    (buf.validate.field).int32 = {
      gte: 0
      lte: 90
    }
  ];

  // Daily UTC time to start automatic backups, in "HH:MM" format (e.g.,
  // "05:00"). If not specified and backups are enabled, AWS chooses a window.
  string daily_automatic_backup_start_time = 17 [(buf.validate.field).cel = {
    id: "daily_backup_time_format"
    message: "daily_automatic_backup_start_time must be in 24-hour HH:MM format (e.g., '05:00')"
    expression: "this == '' || this.matches('^([01][0-9]|2[0-3]):[0-5][0-9]$')"
  }];

  // Copy tags from the file system to backups.
  bool copy_tags_to_backups = 18;

  // Copy tags from the file system to volumes. When true, tags are propagated
  // to the root volume and any child volumes created on this file system.
  bool copy_tags_to_volumes = 19;

  // Skip creating a final backup when the file system is deleted.
  //
  // Default: true — deletion is clean by default; set to false to keep a
  // last-resort restore point (the final backup outlives the file system and
  // keeps billing until deleted).
  optional bool skip_final_backup = 20 [(dev.planton.shared.options.default) = "true"];

  // Tags applied to the final backup taken on deletion. Only meaningful when
  // skip_final_backup is false.
  map<string, string> final_backup_tags = 21;

  // Options applied when the file system is deleted.
  // The single supported value, "DELETE_CHILD_VOLUMES_AND_SNAPSHOTS", deletes
  // all child volumes and snapshots along with the file system — without it,
  // deletion fails while children exist. Use deliberately: it turns a
  // guard-railed delete into a cascading one.
  repeated string delete_options = 22;

  // ---------------------------------------------------------------------------
  // Maintenance
  // ---------------------------------------------------------------------------

  // Weekly UTC maintenance window in the format "d:HH:MM" where d is the day
  // of the week (1=Monday, 7=Sunday). Example: "1:05:00" for Monday at 05:00
  // UTC. If not specified, AWS chooses a default window.
  string weekly_maintenance_start_time = 23 [(buf.validate.field).cel = {
    id: "weekly_maintenance_time_format"
    message: "weekly_maintenance_start_time must be in d:HH:MM format where d is 1 (Monday) through 7 (Sunday), e.g., '1:05:00'"
    expression: "this == '' || this.matches('^[1-7]:([01][0-9]|2[0-3]):[0-5][0-9]$')"
  }];

  // ---------------------------------------------------------------------------
  // Spec-level CEL validations
  // ---------------------------------------------------------------------------

  // deployment_type valid values.
  option (buf.validate.message).cel = {
    id: "deployment_type_valid"
    message: "deployment_type must be 'SINGLE_AZ_1', 'SINGLE_AZ_2', 'SINGLE_AZ_HA_1', 'SINGLE_AZ_HA_2', or 'MULTI_AZ_1'"
    expression: "!has(this.deployment_type) || this.deployment_type in ['SINGLE_AZ_1', 'SINGLE_AZ_2', 'SINGLE_AZ_HA_1', 'SINGLE_AZ_HA_2', 'MULTI_AZ_1']"
  };

  // storage_type valid values.
  option (buf.validate.message).cel = {
    id: "storage_type_valid"
    message: "storage_type must be 'SSD' or 'INTELLIGENT_TIERING'"
    expression: "!has(this.storage_type) || this.storage_type in ['SSD', 'INTELLIGENT_TIERING']"
  };

  // Provisioned capacity is required for SSD storage unless it comes from a
  // backup restore; INTELLIGENT_TIERING never provisions capacity.
  option (buf.validate.message).cel = {
    id: "storage_capacity_ssd_contract"
    message: "storage_capacity_gib is required for SSD storage (leave it unset only when restoring from backup_id) and must not be set for 'INTELLIGENT_TIERING'"
    expression: "(has(this.storage_type) && this.storage_type == 'INTELLIGENT_TIERING') ? !has(this.storage_capacity_gib) : (has(this.storage_capacity_gib) || this.backup_id != '')"
  };

  // INTELLIGENT_TIERING requires MULTI_AZ_1 and a read-cache decision.
  option (buf.validate.message).cel = {
    id: "intelligent_tiering_contract"
    message: "storage_type 'INTELLIGENT_TIERING' requires deployment_type 'MULTI_AZ_1' and read_cache_configuration"
    expression: "!has(this.storage_type) || this.storage_type != 'INTELLIGENT_TIERING' || (this.deployment_type == 'MULTI_AZ_1' && has(this.read_cache_configuration))"
  };

  // read_cache_configuration accompanies INTELLIGENT_TIERING only.
  option (buf.validate.message).cel = {
    id: "read_cache_requires_intelligent_tiering"
    message: "read_cache_configuration is only supported when storage_type is 'INTELLIGENT_TIERING'"
    expression: "!has(this.read_cache_configuration) || (has(this.storage_type) && this.storage_type == 'INTELLIGENT_TIERING')"
  };

  // throughput_capacity valid value sets for the generations AWS documents;
  // the HA variants are validated by AWS at create time (their sets follow
  // the parent generation).
  option (buf.validate.message).cel = {
    id: "throughput_capacity_single_az_1"
    message: "throughput_capacity for SINGLE_AZ_1 must be one of: 64, 128, 256, 512, 1024, 2048, 3072, 4096"
    expression: "this.deployment_type != 'SINGLE_AZ_1' || this.throughput_capacity in [64, 128, 256, 512, 1024, 2048, 3072, 4096]"
  };
  option (buf.validate.message).cel = {
    id: "throughput_capacity_gen2"
    message: "throughput_capacity for SINGLE_AZ_2 / MULTI_AZ_1 must be one of: 160, 320, 640, 1280, 2560, 3840, 5120, 7680, 10240"
    expression: "!(this.deployment_type in ['SINGLE_AZ_2', 'MULTI_AZ_1']) || this.throughput_capacity in [160, 320, 640, 1280, 2560, 3840, 5120, 7680, 10240]"
  };

  // The default deployment type (SINGLE_AZ_2) also carries its value set when
  // the field is omitted.
  option (buf.validate.message).cel = {
    id: "throughput_capacity_default_gen2"
    message: "throughput_capacity must be one of: 160, 320, 640, 1280, 2560, 3840, 5120, 7680, 10240 (the SINGLE_AZ_2 default deployment type)"
    expression: "has(this.deployment_type) || this.throughput_capacity in [160, 320, 640, 1280, 2560, 3840, 5120, 7680, 10240]"
  };

  // preferred_subnet_id is the MULTI_AZ_1 active-server pin: required there,
  // invalid elsewhere.
  option (buf.validate.message).cel = {
    id: "preferred_subnet_multi_az_contract"
    message: "preferred_subnet_id is required for MULTI_AZ_1 and can only be set for MULTI_AZ_1"
    expression: "this.deployment_type == 'MULTI_AZ_1' ? has(this.preferred_subnet_id) : !has(this.preferred_subnet_id)"
  };

  // MULTI_AZ_1 spans exactly two subnets; single-AZ types take exactly one.
  option (buf.validate.message).cel = {
    id: "subnet_count_matches_deployment"
    message: "MULTI_AZ_1 requires exactly two subnets; single-AZ deployment types require exactly one"
    expression: "this.deployment_type == 'MULTI_AZ_1' ? size(this.subnet_ids) == 2 : size(this.subnet_ids) == 1"
  };

  // endpoint_ip_address_range only valid for MULTI_AZ_1.
  option (buf.validate.message).cel = {
    id: "endpoint_ip_range_requires_multi_az"
    message: "endpoint_ip_address_range can only be set for MULTI_AZ_1 deployment type"
    expression: "this.endpoint_ip_address_range == '' || this.deployment_type == 'MULTI_AZ_1'"
  };

  // route_table_ids only valid for MULTI_AZ_1.
  option (buf.validate.message).cel = {
    id: "route_tables_require_multi_az"
    message: "route_table_ids can only be set for MULTI_AZ_1 deployment type"
    expression: "size(this.route_table_ids) == 0 || this.deployment_type == 'MULTI_AZ_1'"
  };

  // Restoring from a backup and provisioning fresh capacity are mutually
  // exclusive create shapes.
  option (buf.validate.message).cel = {
    id: "backup_restore_excludes_capacity"
    message: "storage_capacity_gib cannot be set when restoring from backup_id (capacity comes from the backup)"
    expression: "this.backup_id == '' || !has(this.storage_capacity_gib)"
  };

  // delete_options valid values.
  option (buf.validate.message).cel = {
    id: "delete_options_valid"
    message: "delete_options entries must be 'DELETE_CHILD_VOLUMES_AND_SNAPSHOTS'"
    expression: "this.delete_options.all(o, o == 'DELETE_CHILD_VOLUMES_AND_SNAPSHOTS')"
  };

  // Disk IOPS ceilings the provider enforces per generation (MULTI_AZ_1 and
  // the HA variants are validated by AWS at create time).
  option (buf.validate.message).cel = {
    id: "disk_iops_ceiling_single_az_1"
    message: "disk_iops_configuration.iops for SINGLE_AZ_1 must be at most 160000"
    expression: "this.deployment_type != 'SINGLE_AZ_1' || !has(this.disk_iops_configuration) || !has(this.disk_iops_configuration.iops) || this.disk_iops_configuration.iops <= 160000"
  };
  option (buf.validate.message).cel = {
    id: "disk_iops_ceiling_single_az_2"
    message: "disk_iops_configuration.iops for SINGLE_AZ_2 must be at most 400000"
    expression: "!(this.deployment_type == 'SINGLE_AZ_2' || !has(this.deployment_type)) || !has(this.disk_iops_configuration) || !has(this.disk_iops_configuration.iops) || this.disk_iops_configuration.iops <= 400000"
  };
}

// AwsFsxOpenzfsFileSystemReadCacheConfiguration provisions the SSD read cache
// that serves hot data for INTELLIGENT_TIERING file systems.
message AwsFsxOpenzfsFileSystemReadCacheConfiguration {
  // How the read cache is sized.
  //
  // - "PROPORTIONAL_TO_THROUGHPUT_CAPACITY": AWS sizes the cache from the
  //   provisioned throughput (the recommended hands-off mode).
  // - "USER_PROVISIONED": you set the exact cache size via `size_gib`.
  // - "NO_CACHE": no SSD read cache (every read pays the tiered-storage
  //   latency; only for purely archival access patterns).
  string sizing_mode = 1 [(buf.validate.field).required = true];

  // Read cache size in GiB when sizing_mode is "USER_PROVISIONED".
  optional int32 size_gib = 2 [(buf.validate.field).int32.gte = 32];

  // sizing_mode valid values.
  option (buf.validate.message).cel = {
    id: "sizing_mode_valid"
    message: "sizing_mode must be 'NO_CACHE', 'USER_PROVISIONED', or 'PROPORTIONAL_TO_THROUGHPUT_CAPACITY'"
    expression: "this.sizing_mode in ['NO_CACHE', 'USER_PROVISIONED', 'PROPORTIONAL_TO_THROUGHPUT_CAPACITY']"
  };

  // size_gib pairs exclusively with USER_PROVISIONED.
  option (buf.validate.message).cel = {
    id: "size_requires_user_provisioned"
    message: "size_gib can only be set when sizing_mode is 'USER_PROVISIONED'"
    expression: "!has(this.size_gib) || this.sizing_mode == 'USER_PROVISIONED'"
  };
}

// AwsFsxOpenzfsFileSystemDiskIopsConfiguration controls the SSD IOPS provisioned
// for the file system. In AUTOMATIC mode, IOPS scale with storage capacity. In
// USER_PROVISIONED mode, you specify the exact IOPS independently of storage.
message AwsFsxOpenzfsFileSystemDiskIopsConfiguration {
  // IOPS provisioning mode.
  //
  // - "AUTOMATIC": IOPS scale automatically based on storage capacity.
  //   Provides 3 IOPS per GiB of storage, up to the deployment type limit.
  // - "USER_PROVISIONED": you specify the exact IOPS via the `iops` field.
  //   Allows higher performance independent of storage size but at extra cost.
  //
  // Default: AUTOMATIC
  optional string mode = 1 [(dev.planton.shared.options.default) = "AUTOMATIC"];

  // Total SSD IOPS provisioned. Only valid when mode is "USER_PROVISIONED".
  //
  // Ceilings by deployment generation: 160,000 (SINGLE_AZ_1) and 400,000
  // (SINGLE_AZ_2); MULTI_AZ_1 and the HA variants are validated by AWS at
  // create time.
  optional int32 iops = 2 [(buf.validate.field).int32.gte = 0];

  // mode valid values.
  option (buf.validate.message).cel = {
    id: "iops_mode_valid"
    message: "mode must be 'AUTOMATIC' or 'USER_PROVISIONED'"
    expression: "!has(this.mode) || this.mode in ['AUTOMATIC', 'USER_PROVISIONED']"
  };

  // iops requires USER_PROVISIONED mode.
  option (buf.validate.message).cel = {
    id: "iops_requires_user_provisioned"
    message: "iops can only be set when mode is 'USER_PROVISIONED'"
    expression: "!has(this.iops) || (has(this.mode) && this.mode == 'USER_PROVISIONED')"
  };
}

// AwsFsxOpenzfsFileSystemRootVolumeConfiguration defines the configuration for
// the file system's root volume. The root volume is the default NFS mount target
// and is always created with the file system. These settings control data
// compression, NFS exports, access control, and storage quotas.
message AwsFsxOpenzfsFileSystemRootVolumeConfiguration {
  // Data compression type applied to all data on the root volume. Reduces
  // storage consumption and can improve throughput for compressible data.
  //
  // - "NONE": no compression (default).
  // - "ZSTD": Zstandard compression. Best compression ratio.
  // - "LZ4": LZ4 compression. Faster with lower CPU overhead.
  //
  // Default: NONE
  optional string data_compression_type = 1 [(dev.planton.shared.options.default) = "NONE"];

  // NFS export configuration for the root volume. Controls which clients can
  // mount the volume and with what permissions. When omitted, the volume uses
  // default NFS settings (accessible from within the VPC).
  AwsFsxOpenzfsFileSystemNfsExports nfs_exports = 2;

  // Whether the root volume is read-only. When true, clients can mount the
  // volume but cannot write to it. Useful for shared reference data.
  bool read_only = 3;

  // ZFS record size in KiB. Affects read/write performance characteristics.
  // Larger record sizes are better for sequential I/O (analytics, streaming).
  // Smaller record sizes are better for random I/O (databases, OLTP).
  //
  // Valid values: 4, 8, 16, 32, 64, 128, 256, 512, 1024.
  //
  // Default: 128
  optional int32 record_size_kib = 4 [(dev.planton.shared.options.default) = "128"];

  // Per-user and per-group storage quotas for the root volume. Limits how
  // much storage individual users or groups can consume.
  repeated AwsFsxOpenzfsFileSystemUserAndGroupQuota user_and_group_quotas = 5;

  // Copy tags from the root volume to snapshots created from it. ForceNew —
  // changing this replaces the whole FILE SYSTEM (a subtle provider trap:
  // this is the one root-volume setting that cannot change in place).
  bool copy_tags_to_snapshots = 6;

  // data_compression_type valid values.
  option (buf.validate.message).cel = {
    id: "data_compression_type_valid"
    message: "data_compression_type must be 'NONE', 'ZSTD', or 'LZ4'"
    expression: "!has(this.data_compression_type) || this.data_compression_type in ['NONE', 'ZSTD', 'LZ4']"
  };

  // record_size_kib valid values.
  option (buf.validate.message).cel = {
    id: "record_size_kib_valid"
    message: "record_size_kib must be one of: 4, 8, 16, 32, 64, 128, 256, 512, 1024"
    expression: "!has(this.record_size_kib) || this.record_size_kib in [4, 8, 16, 32, 64, 128, 256, 512, 1024]"
  };
}

// AwsFsxOpenzfsFileSystemNfsExports defines the NFS export configuration for a
// volume. Each client configuration specifies an IP range and the NFS mount
// options for that range.
message AwsFsxOpenzfsFileSystemNfsExports {
  // NFS client configurations. Each entry defines which clients can access the
  // volume and with what mount options. Up to 25 client configurations.
  repeated AwsFsxOpenzfsFileSystemNfsClientConfiguration client_configurations = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 25
  }];
}

// AwsFsxOpenzfsFileSystemNfsClientConfiguration defines NFS access control for
// a specific set of clients identified by IP address, CIDR range, or wildcard.
message AwsFsxOpenzfsFileSystemNfsClientConfiguration {
  // Client specification: an IP address, CIDR block, or wildcard (*).
  // 1-128 characters.
  //
  // Examples: "*" (all clients), "10.0.0.0/16", "192.168.1.100"
  string clients = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];

  // NFS mount options for the specified clients. At least one option is
  // required; each option is 1-128 characters.
  //
  // Common options:
  // - "rw" (read-write) or "ro" (read-only)
  // - "crossmnt" (allow traversal into child volumes)
  // - "root_squash" (map root to anonymous) or "no_root_squash"
  // - "sync" or "async"
  //
  // Up to 20 options.
  repeated string options = 2 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 20,
    (buf.validate.field).repeated.items = {
      string: {
        min_len: 1
        max_len: 128
      }
    }
  ];
}

// AwsFsxOpenzfsFileSystemUserAndGroupQuota defines a storage quota for a
// specific user or group on the volume. Quotas limit how much storage
// individual users or groups can consume.
message AwsFsxOpenzfsFileSystemUserAndGroupQuota {
  // The numeric user ID (UID) or group ID (GID). Range: 0-2147483647.
  //
  // Common values: 0 (root), 1000+ (regular users/groups).
  int32 id = 1 [(buf.validate.field).int32.gte = 0];

  // Storage capacity quota in GiB. The maximum amount of storage this user or
  // group can consume on the volume. Range: 0-2147483647.
  //
  // Set to 0 to remove quota restrictions for this user/group.
  int32 storage_capacity_quota_gib = 2 [(buf.validate.field).int32.gte = 0];

  // Quota type: "USER" for per-user quota, "GROUP" for per-group quota.
  string type = 3 [(buf.validate.field).string.min_len = 1];

  // type valid values.
  option (buf.validate.message).cel = {
    id: "quota_type_valid"
    message: "type must be 'USER' or 'GROUP'"
    expression: "this.type in ['USER', 'GROUP']"
  };
}
