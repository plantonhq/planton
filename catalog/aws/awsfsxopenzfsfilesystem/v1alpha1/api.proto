syntax = "proto3";

package dev.planton.aws.awsfsxopenzfsfilesystem.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsfsxopenzfsfilesystem/v1alpha1/outputs.proto";
import "catalog/aws/awsfsxopenzfsfilesystem/v1alpha1/spec.proto";
import "shared/metadata.proto";

// aws-fsx-openzfs-file-system
message AwsFsxOpenzfsFileSystem {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsFsxOpenzfsFileSystem'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsFsxOpenzfsFileSystemSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsFsxOpenzfsFileSystemStatus status = 5;
}

// aws-fsx-openzfs-file-system status
message AwsFsxOpenzfsFileSystemStatus {
  //outputs
  AwsFsxOpenzfsFileSystemOutputs outputs = 1;
}
