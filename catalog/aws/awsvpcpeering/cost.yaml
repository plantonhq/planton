# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: awsvpcpeering
spec:
  billing_model: free
  free_tier: The peering connection itself carries no meter -- the VPC pricing page's VPC Peering section bills no hourly fee, no existence fee, and no per-connection fee; an active peering that moves no traffic costs exactly zero. What the section DOES bill is data sent over the connection, and only when it crosses a boundary -- traffic staying inside one availability zone over the peering appears in no meter on the page.
  notes: "The conditional charges are data-transfer meters, precisely three: (1) data sent over the peering that crosses an availability zone within the same region bills at $0.01/GB in BOTH the In and Out direction -- each side's owner pays its own direction; (2) data between a Local Zone and an availability zone in the same region bills at per-Local-Zone rates ($0.01/GB for most US zones, up to $0.137/GB for Nigeria (Lagos) -- the page carries the full table); (3) cross-region peering data bills at EC2 inter-region data-transfer rates, which the VPC page routes to the EC2 pricing page rather than publishing itself. None of these is the peering object's own meter -- they follow the workloads that talk across it, and those workloads bill as their own catalog kinds. No field of this spec moves a byte: the request/accept arms, auto_accept, and the DNS-resolution flags are all free control-plane configuration, and the routes and security-group rules that actually open traffic paths live on their own components."
