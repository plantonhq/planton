syntax = "proto3";

package dev.planton.aws.awsvpcpeering.v1alpha1;

// AwsVpcPeeringOutputs captures the observable state of the
// peering connection after apply.
message AwsVpcPeeringOutputs {
  // The peering connection's id (pcx-...) - what route tables and
  // accept-arm instances reference, and the provider's import ID.
  string peering_connection_id = 1;

  // The connection's acceptance status after this side's deploy:
  // "active" for auto-accepted or accepted connections,
  // "pending-acceptance" for a cross-account/cross-region request
  // still waiting on its accepter.
  string accept_status = 2;
}
