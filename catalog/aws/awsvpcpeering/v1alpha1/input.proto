syntax = "proto3";

package dev.planton.aws.awsvpcpeering.v1alpha1;

import "catalog/aws/awsvpcpeering/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsVpcPeeringIacInput is the input for the IaC modules that manage
// one side of a VPC peering connection.
message AwsVpcPeeringIacInput {
  // target is the AwsVpcPeering resource to deploy.
  AwsVpcPeering target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
