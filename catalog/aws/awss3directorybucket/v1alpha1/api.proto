syntax = "proto3";

package dev.planton.aws.awss3directorybucket.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awss3directorybucket/v1alpha1/outputs.proto";
import "catalog/aws/awss3directorybucket/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsS3DirectoryBucket {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsS3DirectoryBucket'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsS3DirectoryBucketSpec spec = 4 [(buf.validate.field).required = true];
  AwsS3DirectoryBucketStatus status = 5;
}

message AwsS3DirectoryBucketStatus {
  AwsS3DirectoryBucketOutputs outputs = 1;
}
