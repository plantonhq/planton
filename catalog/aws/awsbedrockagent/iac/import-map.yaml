apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awsbedrockagent
spec:
  # The agent imports by its bare id. Every satellite composes the agent
  # id with the literal DRAFT version (satellites attach to the draft) and
  # its own id, derived blind from the per-satellite output maps keyed
  # exactly like the module's for_each entries.
  values:
    - name: agent_id
      derivations:
        - from_output: agent_id
      where_to_find: >-
        Bedrock console -> Agents -> <agent> (the ID), or
        `aws bedrock-agent list-agents` (agentId).
    - name: agent_version
      derivations:
        - literal: DRAFT
    - name: action_group_id
      derivations:
        - from_output_keyed_by_address: action_group_ids
      where_to_find: >-
        `aws bedrock-agent list-agent-action-groups --agent-id <id>
        --agent-version DRAFT` lists actionGroupId per group; match each
        to its spec.action_groups entry by name.
    - name: agent_alias_id
      derivations:
        - from_output_keyed_by_address: alias_ids
      where_to_find: >-
        `aws bedrock-agent list-agent-aliases --agent-id <id>` lists
        agentAliasId per alias; match each to its spec.aliases entry by
        name.
    - name: collaborator_id
      derivations:
        - from_output_keyed_by_address: collaborator_ids
      where_to_find: >-
        `aws bedrock-agent list-agent-collaborators --agent-id <id>
        --agent-version DRAFT` lists collaboratorId per collaborator;
        match each to its spec.collaborators entry by name.
    - name: knowledge_base_id
      derivations:
        - from_output_keyed_by_address: associated_knowledge_base_ids
      where_to_find: >-
        `aws bedrock-agent list-agent-knowledge-bases --agent-id <id>
        --agent-version DRAFT` lists knowledgeBaseId per association;
        match each to its spec.knowledge_base_associations entry by name.
