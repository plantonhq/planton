# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsbedrockagent
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Bedrock encrypts agent resources -- instructions, prompt overrides, session data, and memory summaries -- at rest by default; with customer_encryption_key_arn unset the data rests under a Bedrock-managed key, and an unencrypted agent is not representable.
    - control_id: enc-at-rest-cmk
      status: configurable
      field_path: customer_encryption_key_arn
      evidence:
        type: spec_default
        reference: Unset means the Bedrock-managed key; referencing a KMS key moves the agent's resources under a customer-managed key you own and can revoke. The key policy must grant the Bedrock service use of the key -- AWS rejects the agent without it.
      notes: Revoking the key's grant makes the agent's stored resources unreadable to the service, which is the point of holding the key.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Both API surfaces -- the bedrock-agent control plane (create, prepare, satellites) and the bedrock-agent-runtime data plane (InvokeAgent) -- are HTTPS-only SigV4 endpoints; no plaintext path to or from an agent exists.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Every surface requires authentication: invoking the agent is an IAM-authorized InvokeAgent call scoped to the alias ARN, and all management operations are IAM-authorized on the agent ARN. No anonymous or internet-open endpoint is representable."
    - control_id: restricted-ingress
      status: not_applicable
      notes: Nothing listens in your network -- the agent is a managed-service endpoint AWS operates. Reaching resources inside your VPC happens only through action-group Lambdas, whose network posture lives on each referenced AwsLambda.
    - control_id: edge-protection
      status: not_applicable
      notes: The agent exposes no request-serving surface a WAF could front -- callers reach it through AWS's own SigV4 API endpoints. The guardrail attachment is content-level safety (prompt-attack and content filtering), a different layer than edge filtering.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every operation -- create, update, prepare, delete, satellite changes, alias management, invocation -- is IAM-authorized, and the bedrock service reference scopes them to the agent and agent-alias ARN formats, so per-agent grants (including who may InvokeAgent on which alias) are enforceable.
    - control_id: workload-identity
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The agent runs under the required agent_resource_role_arn -- an IAM role trusting bedrock.amazonaws.com that the service assumes with short-lived credentials to invoke the model, call action-group Lambdas, and query knowledge bases. No static-credential path exists, and the spec cannot omit the role.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The service has a single authentication generation -- SigV4-signed IAM requests on both control and data planes; no legacy or weaker protocol exists to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: All bedrock-agent control-plane operations -- who created, re-prepared, re-pointed an alias, or deleted the agent -- are management events CloudTrail records unconditionally in the account's event history.
      notes: Runtime capture is separate -- InvokeAgent is a data-plane call, and full model input/output recording is the account-level AwsBedrockInvocationLogging component's job, not a field on this manifest.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Agents publish runtime metrics to the AWS/Bedrock/Agents CloudWatch namespace automatically -- invocation counts, model latency, time-to-first-token, throttles, client/server errors, and input/output token counts, dimensioned by operation, model ID, and agent alias ARN -- with no field to enable.
    - control_id: backup-recovery
      status: not_applicable
      notes: The agent stores no unrecoverable state -- it is declarative configuration recreated from this manifest, and each alias snapshot is an immutable numbered version AWS keeps alongside the draft. Conversation memory is ephemeral session context by design, not data to back up.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backup retention field exists by design -- there are no backups to retain. memory.storage_days (1-365) governs how long AWS keeps conversation summaries, which is context retention for the model, not a backup policy.
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Bedrock is a regional managed service AWS operates across availability zones -- the agent has no zonal footprint the manifest could configure.
    - control_id: deletion-protection
      status: not_applicable
      notes: Agents carry no deletion-protection flag. AWS does refuse to delete an agent that is actively serving unless the caller sets skip_resource_in_use_check -- the modules keep the in-use check ON -- but that is a delete-time guard, not a configurable protection. Deleting the agent removes its versions and aliases; referenced roles, Lambdas, and knowledge bases survive on their own components.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- AWS operates and patches the orchestration engine and serving infrastructure; the agent exposes no runtime, version, or maintenance surface beyond the model choice itself.
