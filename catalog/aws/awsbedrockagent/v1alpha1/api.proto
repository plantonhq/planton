syntax = "proto3";

package dev.planton.aws.awsbedrockagent.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsbedrockagent/v1alpha1/outputs.proto";
import "catalog/aws/awsbedrockagent/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsBedrockAgent {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsBedrockAgent'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsBedrockAgentSpec spec = 4 [(buf.validate.field).required = true];
  AwsBedrockAgentStatus status = 5;
}

message AwsBedrockAgentStatus {
  AwsBedrockAgentOutputs outputs = 1;
}
