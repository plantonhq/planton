syntax = "proto3";

package dev.planton.aws.awsbedrockagent.v1alpha1;

import "catalog/aws/awsbedrockagent/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsBedrockAgentIacInput is the input for the IaC modules that deploy
// the Bedrock agent.
message AwsBedrockAgentIacInput {
  // target is the AwsBedrockAgent resource to deploy.
  AwsBedrockAgent target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
