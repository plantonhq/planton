# An account-wide field-index policy live. AWS accepts selection
# criteria ONLY on subscription-filter policies (probed live - every
# criteria grammar 400s on FIELD_INDEX), so this policy applies
# account-wide BY DESIGN: a field index only declares which field
# names Logs Insights indexes, changes no log group's behavior, and
# is free. The account allows one policy per type, so this lane must
# never run concurrently with another FIELD_INDEX_POLICY lane in the
# region.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsCloudwatchLogAccountPolicy
metadata:
  name: planton-oss-e2e-awscwlap-fi
  id: planton-oss-e2e-awscwlap-fi
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awscloudwatchlogaccountpolicy
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  policyName: planton-oss-e2e-awscwlap-fi
  policyType: FIELD_INDEX_POLICY
  policyDocument:
    Fields:
      - requestId
      - sourceIp
