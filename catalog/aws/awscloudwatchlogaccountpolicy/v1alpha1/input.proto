syntax = "proto3";

package dev.planton.aws.awscloudwatchlogaccountpolicy.v1alpha1;

import "catalog/aws/awscloudwatchlogaccountpolicy/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsCloudwatchLogAccountPolicyIacInput is the input for the IaC
// modules that manage a CloudWatch Logs account policy.
message AwsCloudwatchLogAccountPolicyIacInput {
  // target is the AwsCloudwatchLogAccountPolicy resource to deploy.
  AwsCloudwatchLogAccountPolicy target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
