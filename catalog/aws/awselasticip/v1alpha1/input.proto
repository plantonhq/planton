syntax = "proto3";

package dev.planton.aws.awselasticip.v1alpha1;

import "catalog/aws/awselasticip/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsElasticIpIacInput provides the inputs required by Pulumi/Terraform modules
// to provision an Elastic IP.
message AwsElasticIpIacInput {
  // target infra-component
  AwsElasticIp target = 1;
  // provider-config
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
