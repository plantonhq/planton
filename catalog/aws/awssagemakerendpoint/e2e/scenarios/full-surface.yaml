# AwsSagemakerEndpoint full-surface scenario: a TWO-instance variant
# (2 x ml.t2.medium, ~$0.11/hour for the minutes the lane runs) with an
# explicit name and weight, least-outstanding-requests routing, raised
# startup/download timeouts, data capture to the shared bucket fixture,
# and a rolling deployment policy - the update-choreography claim
# UpdateEndpoint would follow. TWO instances deliberately: AWS rejects
# a RollingUpdatePolicy on a single-instance fleet at CreateEndpoint
# ("Cannot update endpoint with single instance using
# RollingUpdatePolicy", live-caught 2026-08-25 - the spec CEL now
# front-loads it). ml.t2.medium deliberately: it is the x86 family
# whose "for endpoint usage" Service Quota defaults to 2 on EVERY
# account (most instance endpoint quotas - ml.m5.large, ml.c6i.large
# included - default to ZERO and need a granted increase), so this
# lane's two instances fit a fresh account's default exactly.
# Deliberately not live: async
# inference (a distinct endpoint mode - unblock: a third scenario with
# SNS topics), managed instance scaling and core dumps
# (inference-component/crash surfaces), shadow variants (doubles the
# fleet), KMS volumes (nitro families reject them), and blue/green
# canary sizing - all offline-proven via e2e/manifest.yaml.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsSagemakerEndpoint
metadata:
  name: planton-oss-e2e-awssgmep-full
  id: planton-oss-e2e-awssgmep-full
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awssagemakerendpoint
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsSagemakerModel,AwsS3Bucket"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  productionVariants:
    - variantName: primary
      model:
        valueFrom:
          kind: AwsSagemakerModel
          name: planton-oss-e2e-awssgmmd-prereq
          fieldPath: status.outputs.model_name
      instanceType: ml.t2.medium
      initialInstanceCount: 2
      initialVariantWeight: 1
      routingStrategy: LEAST_OUTSTANDING_REQUESTS
      containerStartupHealthCheckTimeoutSeconds: 600
      modelDataDownloadTimeoutSeconds: 600
  dataCapture:
    destinationS3Uri: s3://planton-oss-e2e-awss3bucket-prereq/sagemaker-capture/
    initialSamplingPercentage: 100
    captureModes:
      - Input
      - Output
    enableCapture: true
    jsonContentTypes:
      - application/json
  deployment:
    rolling:
      maximumBatchSize:
        type: CAPACITY_PERCENT
        value: 50
      waitIntervalSeconds: 60
