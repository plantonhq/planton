apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awssagemakerendpoint
spec:
  # A SageMaker endpoint under live E2E: two lanes through the
  # config-rolling fold (immutable configuration + repointable
  # endpoint). The minimal lane is a SERVERLESS variant ($0 idle -
  # bills per inference, never invoked; InService in ~2-5 min). The
  # full-surface lane is ONE instance-backed ml.t2.medium variant
  # (~$0.056/hour for the lane's minutes; InService ~5-10 min) with
  # routing, capture to the shared bucket fixture, and a rolling
  # deployment policy. ml.t2.medium deliberately: the only x86 family
  # whose endpoint quota defaults above zero on fresh accounts
  # (default 2 - most types, ml.m5.large included, default to 0).
  # Verification is DescribeEndpoint keyed on
  # endpoint_name (status InService) plus the configuration echo.
  #
  # Deliberately not exercised live: async inference (a distinct
  # endpoint mode - unblock: a third scenario with SNS topic fixtures),
  # shadow variants (doubles the fleet cost), managed instance scaling
  # and core dumps, KMS-encrypted volumes (nitro instance families
  # reject custom keys), and blue/green canary/linear sizing (needs a
  # real UpdateEndpoint crossing - unblock: a proof-lane two-apply
  # choreography) - all offline-proven via e2e/manifest.yaml.
  #
  # pending_proof: forged this session to the full offline bar -- Q36
  # proves it live.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 45
