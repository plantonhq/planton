# Consumer-scoped AwsS3ObjectSet install profile staging the endpoint
# lanes' SERVABLE model artifact: a ~650-byte XGBoost booster (trained
# on four points, saved with xgboost 1.7.6 - the same line the
# sagemaker-xgboost:1.7-1 container serves) tarred as model.tar.gz.
# The artifact exists because an artifact-less framework container can
# NEVER pass an endpoint's ping health checks - CreateModel accepts it,
# but the endpoint parks at Failed ("Unable to successfully stand up
# your model within the allotted 180 second timeout", live-caught
# 2026-08-25). Any other kind composing the AwsSagemakerModel install
# profile needs its own copy of this override (transitive prerequisites
# resolve against the kind under test).
apiVersion: aws.planton.dev/v1alpha1
kind: AwsS3ObjectSet
metadata:
  name: planton-oss-e2e-awssgmep-model-artifact
  id: planton-oss-e2e-awssgmep-model-artifact
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awss3objectset
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  bucket:
    valueFrom:
      kind: AwsS3Bucket
      name: planton-oss-e2e-awss3bucket-prereq
      fieldPath: status.outputs.bucket_id
  objects:
    - key: e2e/sagemaker-xgboost-model.tar.gz
      content_base64: 
      content_type: application/gzip
