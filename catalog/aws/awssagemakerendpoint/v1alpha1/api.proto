syntax = "proto3";

package dev.planton.aws.awssagemakerendpoint.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awssagemakerendpoint/v1alpha1/outputs.proto";
import "catalog/aws/awssagemakerendpoint/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsSagemakerEndpoint {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsSagemakerEndpoint'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsSagemakerEndpointSpec spec = 4 [(buf.validate.field).required = true];
  AwsSagemakerEndpointStatus status = 5;
}

message AwsSagemakerEndpointStatus {
  AwsSagemakerEndpointOutputs outputs = 1;
}
