syntax = "proto3";

package dev.planton.aws.awssagemakerendpoint.v1alpha1;

// AwsSagemakerEndpointOutputs captures observable identifiers from
// a provisioned SageMaker endpoint. Clients invoke by `endpoint_name`;
// autoscaling policies and inference components wire via the ARNs.
message AwsSagemakerEndpointOutputs {
  // The endpoint name (the AWS identity clients invoke).
  string endpoint_name = 1;

  // The Amazon Resource Name of the endpoint.
  string endpoint_arn = 2;

  // The name of the endpoint configuration currently in service (the
  // modules roll a new suffixed configuration on capacity changes).
  string endpoint_config_name = 3;

  // The Amazon Resource Name of that endpoint configuration.
  string endpoint_config_arn = 4;
}
