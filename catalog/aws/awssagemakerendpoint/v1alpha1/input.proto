syntax = "proto3";

package dev.planton.aws.awssagemakerendpoint.v1alpha1;

import "catalog/aws/awssagemakerendpoint/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsSagemakerEndpointIacInput is the input for the IaC modules that
// deploy the SageMaker endpoint and its configuration.
message AwsSagemakerEndpointIacInput {
  // target is the AwsSagemakerEndpoint resource to deploy.
  AwsSagemakerEndpoint target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
