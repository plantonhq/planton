syntax = "proto3";

package dev.planton.aws.awssagemakerimage.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awssagemakerimage/v1alpha1/outputs.proto";
import "catalog/aws/awssagemakerimage/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsSagemakerImage {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsSagemakerImage'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsSagemakerImageSpec spec = 4 [(buf.validate.field).required = true];
  AwsSagemakerImageStatus status = 5;
}

message AwsSagemakerImageStatus {
  AwsSagemakerImageOutputs outputs = 1;
}
