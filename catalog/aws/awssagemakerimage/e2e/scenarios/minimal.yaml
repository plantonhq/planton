# AwsSagemakerImage minimal scenario: the bare registry entry (free
# metadata; the provider sleeps ~1 minute before create for IAM
# propagation - budget it). No versions: registering one needs a real
# same-account ECR image (the recorded deferral).
apiVersion: aws.planton.dev/v1alpha1
kind: AwsSagemakerImage
metadata:
  name: planton-oss-e2e-awssgmim-min
  id: planton-oss-e2e-awssgmim-min
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awssagemakerimage
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsIamRole"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  roleArn:
    valueFrom:
      kind: AwsIamRole
      name: planton-oss-e2e-sagemaker-execution-role
      fieldPath: status.outputs.role_arn
