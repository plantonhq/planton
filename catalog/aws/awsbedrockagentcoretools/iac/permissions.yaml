# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awsbedrockagentcoretools
spec:
  aws:
    statements:
      - sid: CreateTools
        actions:
          - bedrock-agentcore:CreateBrowser
          - bedrock-agentcore:CreateBrowserProfile
          - bedrock-agentcore:CreateCodeInterpreter
        resources:
          - "*"
        provenance: derived
        notes: Covers the create side of aws_bedrockagentcore_browser / bedrock.AgentcoreBrowser, aws_bedrockagentcore_browser_profile / bedrock.AgentcoreBrowserProfile, and aws_bedrockagentcore_code_interpreter / bedrock.AgentcoreCodeInterpreter. All three Create actions are NON-SCOPABLE -- the bedrock-agentcore service reference lists no resource types for them, so an ARN-scoped grant would be a runtime DENY; the wildcard is the narrowest possible scope. Because AWS exposes NO update for these resources, every spec change is a delete-and-create -- the Create grants stay load-bearing for the whole lifecycle, not just day one.
      - sid: ManageBrowsers
        actions:
          - bedrock-agentcore:GetBrowser
          - bedrock-agentcore:DeleteBrowser
        resources:
          - arn:aws:bedrock-agentcore:*:*:browser-custom/*
        provenance: derived
        notes: Covers aws_bedrockagentcore_browser / bedrock.AgentcoreBrowser for spec.browsers entries. GetBrowser serves every plan/refresh; Delete is both destroy and the delete half of every recreate. Both scope to the browser-custom ARN format (customer-created browsers; the aws-owned aws.browser.v1 default tool lives under a different, AWS-account ARN this component never manages).
      - sid: ManageBrowserProfiles
        actions:
          - bedrock-agentcore:GetBrowserProfile
          - bedrock-agentcore:DeleteBrowserProfile
        resources:
          - arn:aws:bedrock-agentcore:*:*:browser-profile/*
        provenance: derived
        notes: Covers aws_bedrockagentcore_browser_profile / bedrock.AgentcoreBrowserProfile for spec.browser_profiles entries -- read on every refresh, delete on destroy/recreate. Both scope to the browser-profile ARN.
      - sid: ManageCodeInterpreters
        actions:
          - bedrock-agentcore:GetCodeInterpreter
          - bedrock-agentcore:DeleteCodeInterpreter
        resources:
          - arn:aws:bedrock-agentcore:*:*:code-interpreter-custom/*
        provenance: derived
        notes: Covers aws_bedrockagentcore_code_interpreter / bedrock.AgentcoreCodeInterpreter for spec.code_interpreters entries -- read on every refresh, delete on destroy/recreate. Both scope to the code-interpreter-custom ARN format (the aws-owned aws.codeinterpreter.v1 default tool is not this component's).
      - sid: TagTools
        actions:
          - bedrock-agentcore:TagResource
          - bedrock-agentcore:UntagResource
          - bedrock-agentcore:ListTagsForResource
        resources:
          - arn:aws:bedrock-agentcore:*:*:browser-custom/*
          - arn:aws:bedrock-agentcore:*:*:browser-profile/*
          - arn:aws:bedrock-agentcore:*:*:code-interpreter-custom/*
        provenance: derived
        notes: Both modules tag all three resource types with the Planton identity tags (local.aws_tags / the shared tags map) -- tag-on-create plus the tag read on every refresh. The service reference scopes all three tagging actions to these ARN formats (they also accept the other AgentCore resource families this component never touches).
      - sid: PassExecutionRoles
        actions:
          - iam:PassRole
        resources:
          - arn:aws:iam::*:role/*
        provenance: derived
        notes: CreateBrowser passes the browser's optional execution_role_arn (required in practice for recording, enterprise_policies, and certificates) and CreateCodeInterpreter passes the interpreter's optional execution_role_arn -- both to bedrock-agentcore, which assumes them at session time. Only exercised when a spec entry sets a role. Add an iam:PassedToService=bedrock-agentcore.amazonaws.com condition and narrow to the actual role ARNs in a hardened deployment. S3 write access for recordings and Secrets Manager read access for certificates belong to those EXECUTION roles, not the runner.
