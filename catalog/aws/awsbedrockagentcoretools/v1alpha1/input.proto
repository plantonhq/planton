syntax = "proto3";

package dev.planton.aws.awsbedrockagentcoretools.v1alpha1;

import "catalog/aws/awsbedrockagentcoretools/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsBedrockAgentCoreToolsIacInput is the input for the IaC modules
// that deploy the AgentCore tools bundle.
message AwsBedrockAgentCoreToolsIacInput {
  // target is the AwsBedrockAgentCoreTools resource to deploy.
  AwsBedrockAgentCoreTools target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
