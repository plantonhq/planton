apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsbedrockagentcoretools
spec:
  # An AgentCore tools bundle under live E2E: two free lanes (tools are
  # configuration shells; AWS bills per session at runtime and the lanes
  # never start sessions). The minimal lane proves one SANDBOX code
  # interpreter. The full-surface lane proves a signed PUBLIC browser, a
  # saved browser profile, and SANDBOX + PUBLIC interpreters with the
  # shared AgentCore role fixture. AWS exposes NO update for any of these
  # resources -- every field change recreates the tool -- so the lanes'
  # create/destroy cycles ARE the lifecycle proof. Verification is the
  # per-arm Get echoes (browser/interpreter READY) keyed on the output
  # maps.
  #
  # Deliberately not exercised live: browser session recording (needs an
  # S3 destination the execution role can write plus recording playback
  # to verify -- unblock: compose the AwsS3Bucket install profile via the
  # e2e-prerequisites annotation and assert the recording configuration
  # echo), enterprise policies (need a Chrome policy JSON object seeded
  # in S3 -- the create validates the object exists), mTLS certificates
  # (need a certificate in Secrets Manager; the AwsSecretsManagerSecret
  # kind is QUEUED for live proof, so its fixture cannot land yet --
  # unblock: after it is PROVEN, seed a cert secret and extend the
  # browser entry), and the VPC arms for both tools (need the VPC fixture
  # chain; the PUBLIC/SANDBOX arms prove the mode unions -- all
  # offline-proven arm-for-arm via e2e/manifest.yaml).
  #
  # PROVEN live 2026-08-14 (Q35 proof session): minimal + full-surface
  # green on BOTH engines under the armed apply-idempotency gate; the
  # Terraform blind round-trip re-imported all four full-surface tools
  # (browser, profile, both interpreters) blind through the id-keyed
  # output maps at zero real change, zero tolerances. ONE live catch
  # fixed at the full bar: browser NAMES forbid hyphens -- CreateBrowser
  # enforces [a-zA-Z][a-zA-Z0-9_]{0,47} server-side, and the spec's
  # browser name field was missing the pattern its profile/interpreter
  # siblings carried (now added, with the hyphen case CEL-tested and
  # every example swept to underscores). The bundle verifies through the
  # OutputsVerifier path (map-shaped ID key -- the harness dispatch fix
  # this session). Lanes ride the consumer-scoped one-role IAM override.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
