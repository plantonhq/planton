import "catalog/aws/awsssmmaintenancewindow/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsSsmMaintenanceWindow {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsSsmMaintenanceWindow'];
