# A DISABLED window live (the presence-typed explicit-false enabled -
# the tri-state heal's live proof) with one tag-based target matching
# nothing and two tasks: a run-command task bound to the registered
# target BY NAME (RUN_COMMAND tasks require targets server-side -
# live-caught 400; the module resolves the name to the cloud-generated
# registration ID) with rate controls (legal on targeted tasks), and an
# untargeted automation runbook (untargeted stays legal for Automation
# tasks). Disabled window + no matching instances = nothing ever
# executes; windows, targets, and tasks are free. ~$0.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsSsmMaintenanceWindow
metadata:
  name: planton-oss-e2e-awsssmmw
  id: planton-oss-e2e-awsssmmw
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsssmmaintenancewindow
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  schedule: cron(0 2 ? * SUN *)
  duration: 3
  cutoff: 1
  description: Planton E2E window (disabled by design)
  enabled: false
  scheduleTimezone: Etc/UTC
  targets:
    - name: e2e-never-matches
      resourceType: INSTANCE
      targets:
        - key: tag:planton-e2e-ssm
          values:
            - never-matches
      description: E2E tag target matching nothing
  tasks:
    - name: patch-scan
      taskType: RUN_COMMAND
      taskArn:
        value: AWS-RunPatchBaseline
      priority: 1
      cutoffBehavior: CANCEL_TASK
      # The in-spec target's NAME - the module resolves it to the
      # cloud-generated registration ID (the name-based join).
      targets:
        - key: WindowTargetIds
          values:
            - e2e-never-matches
      maxConcurrency: "2"
      maxErrors: "1"
      invocation:
        runCommand:
          comment: E2E patch scan (never executes - window disabled)
          timeoutSeconds: 600
          parameters:
            - name: Operation
              values:
                - Scan
    - name: restart-runbook
      taskType: AUTOMATION
      taskArn:
        value: AWS-RestartEC2Instance
      priority: 2
      invocation:
        automation:
          documentVersion: $DEFAULT
