apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awsssmmaintenancewindow
spec:
  # The window imports by its AWS-generated "mw-..." id. The folded
  # targets and tasks compose it with their own AWS-generated
  # registration ids, derived blind from the target_ids/task_ids output
  # maps keyed exactly like the modules' for_each entries.
  values:
    - name: window_id
      derivations:
        - from_output: window_id
      where_to_find: >-
        Systems Manager console -> Maintenance Windows (the Window ID
        column), or `aws ssm describe-maintenance-windows` (WindowId).
    - name: target_id
      derivations:
        - from_output_keyed_by_address: target_ids
      where_to_find: >-
        `aws ssm describe-maintenance-window-targets --window-id <id>`
        lists registrations with WindowTargetId; match each to its
        spec.targets entry by Name.
    - name: task_id
      derivations:
        - from_output_keyed_by_address: task_ids
      where_to_find: >-
        `aws ssm describe-maintenance-window-tasks --window-id <id>`
        lists tasks with WindowTaskId; match each to its spec.tasks
        entry by Name.
