syntax = "proto3";

package dev.planton.aws.awsiamsamlprovider.v1alpha1;

import "catalog/aws/awsiamsamlprovider/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsIamSamlProviderIacInput is the input for the IaC modules that
// manage an IAM SAML identity provider.
message AwsIamSamlProviderIacInput {
  // target is the AwsIamSamlProvider resource to deploy.
  AwsIamSamlProvider target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
