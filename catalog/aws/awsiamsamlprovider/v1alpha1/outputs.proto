syntax = "proto3";

package dev.planton.aws.awsiamsamlprovider.v1alpha1;

// AwsIamSamlProviderOutputs captures the observable state of the
// SAML provider after apply.
message AwsIamSamlProviderOutputs {
  // The provider's ARN (also the provider's import ID, and the value
  // role trust policies reference via the SAML principal).
  string provider_arn = 1;

  // The provider's AWS-assigned UUID.
  string saml_provider_uuid = 2;

  // When the metadata document's certificates expire - rotate the
  // document before this date or federation breaks.
  string valid_until = 3;
}
