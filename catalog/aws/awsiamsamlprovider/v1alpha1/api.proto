syntax = "proto3";

package dev.planton.aws.awsiamsamlprovider.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsiamsamlprovider/v1alpha1/outputs.proto";
import "catalog/aws/awsiamsamlprovider/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsIamSamlProvider {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsIamSamlProvider'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsIamSamlProviderSpec spec = 4 [(buf.validate.field).required = true];
  AwsIamSamlProviderStatus status = 5;
}

message AwsIamSamlProviderStatus {
  AwsIamSamlProviderOutputs outputs = 1;
}
