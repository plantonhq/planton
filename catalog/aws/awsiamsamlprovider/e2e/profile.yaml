apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsiamsamlprovider
spec:
  # An IAM SAML provider under live E2E: one lane proves the trust
  # anchor from a structurally realistic metadata stand-in (IAM
  # validates the XML structure, not the certificate chain -- the
  # stand-in is over the 1000-character floor). IAM is free (~$0) and
  # global; provider names are account-unique, so lanes run serially.
  #
  # Deliberately not exercised live:
  #   - a real IdP round-trip (metadata from a live Okta/Entra tenant
  #     and an sts:AssumeRoleWithSAML sign-in) -- federation needs an
  #     external tenant only a human can arrange. Unblock: the
  #     e2e-required-env pattern with an owner-arranged IdP metadata
  #     URL.
  #
  # PROVEN live 2026-08-25 (Q43): both engines through the full
  # six-phase runner + the Terraform blind import round-trip under
  # the armed apply-idempotency gate.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
