# The full provider surface live: a SAML trust anchor created from a
# structurally REAL metadata stand-in. IAM parses the document for
# real - including base64-decoding the X509Certificate into a valid
# DER certificate - so the embedded certificate is a genuine
# throwaway self-signed cert for idp.example.com (key discarded at
# generation; a public certificate is not a secret). A fake base64
# blob fails CreateSAMLProvider with "InvalidInput: Could not parse
# metadata" (live-caught 2026-08-25). What IAM does NOT validate is
# trust: no chain, no CA, no reachability. IAM is free and global;
# provider names free immediately on delete, so the name is fixed. ~$0.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamSamlProvider
metadata:
  name: planton-oss-e2e-awssaml
  id: planton-oss-e2e-awssaml
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsiamsamlprovider
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-east-1
  samlMetadataDocument: |
    <?xml version="1.0" encoding="UTF-8"?>
    <md:EntityDescriptor xmlns:md="urn:oasis:names:tc:SAML:2.0:metadata" entityID="https://idp.example.com/saml/metadata" validUntil="2030-01-01T00:00:00Z">
      <md:IDPSSODescriptor WantAuthnRequestsSigned="false" protocolSupportEnumeration="urn:oasis:names:tc:SAML:2.0:protocol">
        <md:KeyDescriptor use="signing">
          <ds:KeyInfo xmlns:ds="http://www.w3.org/2000/09/xmldsig#">
            <ds:X509Data>
              <ds:X509Certificate></ds:X509Certificate>
            </ds:X509Data>
          </ds:KeyInfo>
        </md:KeyDescriptor>
        <md:SingleSignOnService Binding="urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect" Location="https://idp.example.com/saml/sso"/>
        <md:SingleSignOnService Binding="urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST" Location="https://idp.example.com/saml/sso"/>
      </md:IDPSSODescriptor>
    </md:EntityDescriptor>
