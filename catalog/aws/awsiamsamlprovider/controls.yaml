# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsiamsamlprovider
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: "The provider stores no customer data -- the metadata XML is a PUBLIC trust document (IdPs serve it unauthenticated: issuer, endpoints, and public signing certificates), held as IAM control-plane metadata inside AWS's own infrastructure."
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: There is no confidential data at rest to key (see enc-at-rest); IAM exposes no KMS surface for SAML providers.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The trust anchor terminates no connections of its own. IAM management calls and the SAML assertion exchange (browser to IdP, then sts:AssumeRoleWithSAML to AWS) ride TLS-only AWS and IdP endpoints -- provider behavior, not per-anchor configuration.
    - control_id: no-public-access
      status: not_applicable
      notes: The provider has no network endpoint to expose. Its content is public by design; what matters is WHO can federate through it, which the trusting roles govern (see rbac).
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network surface exists to filter; the anchor is an identity object with no addresses or ports.
    - control_id: edge-protection
      status: not_applicable
      notes: The anchor receives no HTTP requests -- web ACLs and request filters have nothing to attach to.
    - control_id: rbac
      status: not_applicable
      notes: The SAML provider grants nothing by itself -- it only proves assertions came from the declared IdP. WHO may federate and WHAT they may do is declared on the IAM roles whose trust policies name this provider's ARN in sts:AssumeRoleWithSAML statements -- the AwsIamRole kind's territory. Managing the anchor itself is IAM-authorized on its ARN.
    - control_id: workload-identity
      status: not_applicable
      notes: SAML federation is WORKFORCE federation -- humans signing in through an IdP -- not workload identity. Keyless workload identity (EKS IRSA, GitHub Actions OIDC) is the AwsIamOidcProvider/AwsIamRole territory.
    - control_id: no-legacy-auth
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The provider carries no long-lived credential path at all -- the ONLY way to use it is an sts:AssumeRoleWithSAML call presenting an IdP-signed assertion, which mints temporary session credentials that expire. Federating the workforce through it is precisely how accounts retire IAM-user passwords and static keys.
      notes: The trust is only as fresh as the metadata -- the valid_until output is the date by which the IdP's rotated certificates must be re-applied (an in-place update of saml_metadata_document).
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: The spec exposes no audit surface. Management calls on the provider and every sts:AssumeRoleWithSAML federation through it are recorded by AWS CloudTrail as account-level posture, not per-anchor configuration.
    - control_id: monitoring-integration
      status: not_applicable
      notes: IAM publishes no CloudWatch metrics for SAML providers; the one operational signal -- metadata expiry -- surfaces as the valid_until output, not a metrics integration.
    - control_id: backup-recovery
      status: not_applicable
      notes: The anchor holds no data to back up -- the metadata XML lives in the manifest and the provider is fully re-creatable from it. Note the name is write-once, so a recreate under a new name requires updating every role trust policy naming the old ARN.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: IAM is a global control-plane service -- the provider exists account-wide with no zonal placement to configure, usable from every region.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither AWS nor the modules expose a deletion-protection flag. Deleting the anchor silently breaks federation for every role trusting its ARN -- sign-ins fail until it is recreated and trust policies are updated -- so treat deletion as a coordinated change, not a casual one.
    - control_id: managed-patching
      status: not_applicable
      notes: The anchor is a pure configuration object with no software to patch; keeping its certificates current is a metadata update, not a patch channel.
