syntax = "proto3";

package dev.planton.aws.awscloudtrail.v1alpha1;

import "catalog/aws/awscloudtrail/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsCloudTrailIacInput is the input for the IaC modules that
// manage a CloudTrail trail.
message AwsCloudTrailIacInput {
  // target is the AwsCloudTrail resource to deploy.
  AwsCloudTrail target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
