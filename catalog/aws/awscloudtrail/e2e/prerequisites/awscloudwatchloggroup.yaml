# Consumer-scoped AwsCloudwatchLogGroup install profile for the trail's
# CloudWatch Logs mirroring arm.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsCloudwatchLogGroup
metadata:
  name: planton-oss-e2e-awstrail-lg
  id: planton-oss-e2e-awstrail-lg
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awscloudwatchloggroup
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  retentionInDays: 1
