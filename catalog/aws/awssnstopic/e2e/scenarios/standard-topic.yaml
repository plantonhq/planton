# Standard AwsSnsTopic scenario with tracing and an explicit access policy
# struct. Full metadata is supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsSnsTopic
metadata:
  name: planton-oss-e2e-awssnstopic-standard-topic
  id: planton-oss-e2e-awssnstopic-standard-topic
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awssnstopic
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  displayName: Planton E2E standard SNS topic
  signatureVersion: 2
  tracingConfig: Active
  policy:
    Version: "2012-10-17"
    Statement:
      - Sid: AllowEventBridgePublish
        Effect: Allow
        Principal:
          Service: events.amazonaws.com
        Action: sns:Publish
        Resource: "*"
