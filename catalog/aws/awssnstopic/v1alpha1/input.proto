syntax = "proto3";

package dev.planton.aws.awssnstopic.v1alpha1;

import "catalog/aws/awssnstopic/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsSnsTopicIacInput is the input envelope passed to IaC modules for provisioning.
message AwsSnsTopicIacInput {
  // target is the fully-specified AwsSnsTopic resource to provision.
  AwsSnsTopic target = 1;

  // provider_config supplies AWS credentials and region for the deployment.
  // When nil the module falls back to ambient credentials (environment variables
  // or instance profile).
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
