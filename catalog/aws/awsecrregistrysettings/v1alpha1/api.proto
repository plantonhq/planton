syntax = "proto3";

package dev.planton.aws.awsecrregistrysettings.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsecrregistrysettings/v1alpha1/outputs.proto";
import "catalog/aws/awsecrregistrysettings/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsEcrRegistrySettings {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsEcrRegistrySettings'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsEcrRegistrySettingsSpec spec = 4 [(buf.validate.field).required = true];
  AwsEcrRegistrySettingsStatus status = 5;
}

message AwsEcrRegistrySettingsStatus {
  AwsEcrRegistrySettingsOutputs outputs = 1;
}
