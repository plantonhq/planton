# MSK SASL/IAM scenario: the recommended default streaming shape on the
# smallest footprint. Two kafka.t3.small brokers over the first two subnet
# prerequisites (broker count must be a multiple of the subnet count), the
# security-group prerequisite attached directly (ingress lives on that
# first-class node, never on a module-managed shadow group), SASL/IAM
# client authentication, a folded server_properties configuration that
# materializes the module-managed aws_msk_configuration satellite, and one
# declared topic (a FREE arm -- topics ride the cluster through the MSK
# topic API; replication factor 2 matches the broker count).
# Deliberately not in the scenario: SCRAM secret associations and the
# cluster policy (both need externally provisioned ARNs), public access,
# and PrivateLink connectivity -- those paths are proven by CEL spec tests
# and the offline gate. Full metadata is supplied for tagging/orphan
# cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsMskCluster
metadata:
  name: planton-oss-e2e-msk-iam
  id: planton-oss-e2e-msk-iam
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsmskcluster
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  kafkaVersion: "3.6.0"
  numberOfBrokerNodes: 2
  instanceType: kafka.t3.small
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-b
        fieldPath: status.outputs.subnet_id
  securityGroupIds:
    - valueFrom:
        kind: AwsSecurityGroup
        name: planton-oss-e2e-awssg-prereq
        fieldPath: status.outputs.security_group_id
  ebsVolumeSizeGib: 10
  authentication:
    saslIamEnabled: true
  serverProperties:
    auto.create.topics.enable: "false"
    default.replication.factor: "2"
    min.insync.replicas: "1"
  topics:
    - name: e2e.orders
      partitionCount: 2
      replicationFactor: 2
      configs:
        retention.ms: "86400000"
