syntax = "proto3";

package dev.planton.aws.awsmskcluster.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsmskcluster/v1alpha1/outputs.proto";
import "catalog/aws/awsmskcluster/v1alpha1/spec.proto";
import "shared/metadata.proto";

// aws-msk-cluster
message AwsMskCluster {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsMskCluster'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsMskClusterSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsMskClusterStatus status = 5;
}

// aws-msk-cluster status
message AwsMskClusterStatus {
  //outputs
  AwsMskClusterOutputs outputs = 1;
}
