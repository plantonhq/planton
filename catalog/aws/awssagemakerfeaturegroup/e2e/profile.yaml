apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awssagemakerfeaturegroup
spec:
  # A feature group under live E2E: two lanes (create waits Created
  # ~1-5 min; delete ~minutes). The minimal lane is online-only; the
  # full-surface lane runs BOTH stores - online with the 30-day TTL
  # echo, offline against the shared bucket fixture with the
  # auto-created Glue table. Verification is DescribeFeatureGroup keyed
  # on feature_group_name (status Created) plus the TTL and offline
  # config echoes.
  #
  # Deliberately not exercised live: InMemory storage with vector
  # collections (an at-rest billing floor - unblock: owner-approved
  # spend window), the KMS arms (ForceNew, compose the AwsKmsKey
  # fixture on demand), Iceberg table format and provisioned throughput
  # (billing) - all offline-proven via e2e/manifest.yaml. The offline
  # store's S3 objects survive group deletion by AWS design (the lane
  # writes none; the sweep tolerates the fixture-bucket prefix), and so
  # does the auto-created Glue table in the sagemaker_featurestore
  # database (live-verified 2026-08-25) - the sweep deletes those
  # tables (and the database when empty) by hand.
  #
  # Proven live 2026-08-25 (session 074, Q36): both engines, both
  # scenarios, blind import round-trips green. One live catch fixed at
  # the full bar: CreateFeatureGroup assumes the execution role and
  # calls s3:GetBucketAcl on the offline-store bucket at create (writes
  # carry s3:PutObjectAcl) - the shared execution-role fixture gained
  # both ACL verbs; spec role_arn comment, GUIDE, and the harness
  # manual teach the class.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
