apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awssagemakerfeaturegroup
spec:
  # The feature group imports by its bare name.
  values:
    - name: feature_group_name
      derivations:
        - from_output: feature_group_name
      where_to_find: >-
        SageMaker console -> Feature Store (the name), or
        `aws sagemaker list-feature-groups` (FeatureGroupName).
