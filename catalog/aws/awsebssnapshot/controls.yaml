# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsebssnapshot
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A snapshot inherits its encryption from its source and cannot weaken it -- snapshots of encrypted volumes are always encrypted, copies of encrypted snapshots stay encrypted, and the copy arm's encrypted=true is the documented way to ADD encryption to an unencrypted lineage (snapshots never re-encrypt in place). A snapshot of an unencrypted volume is unencrypted because its source was -- the posture is decided on the volume, not here.
      notes: The copy and import arms carry their own encrypted flag; the volume arm cannot set one by design.
    - control_id: enc-at-rest-cmk
      status: configurable
      field_path: copy_from.kms_key_id
      evidence:
        type: spec_default
        reference: Unset with encrypted=true means the AWS-managed aws/ebs key; referencing an AwsKmsKey puts the copy (import_from.kms_key_id likewise for imports) under a customer-managed key you own and can revoke. Copying under a new key is also AWS's only key-rotation path for snapshot data.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The snapshot exposes no network endpoint; management rides the HTTPS-only EC2 API, and snapshot data moves inside AWS's storage backbone (or from S3 for the import arm) over service channels. No plaintext transport option exists anywhere in the spec or modules to harden.
    - control_id: no-public-access
      status: configurable
      field_path: share_with_account_ids
      evidence:
        type: spec_default
        reference: Empty means the snapshot is private to its owner account. Each listed account id gets createVolumePermission -- the spec's pattern accepts only 12-digit account ids, so the modules can grant specific accounts but never the "all" group that makes a snapshot public at AWS.
      notes: Sharing an encrypted snapshot also requires sharing its KMS key with the same accounts -- an out-of-band grant on the key, deliberately not automated here.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network ingress exists to restrict -- a snapshot is stored data reachable only through IAM-authorized EC2 API calls.
    - control_id: edge-protection
      status: not_applicable
      notes: No request-serving surface exists; there is no WAF attachment point on stored snapshot data.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every snapshot operation -- create, copy, tier change, restore, attribute grant, delete -- is IAM-authorized on the snapshot ARN, and creating volumes from a shared snapshot requires the explicit createVolumePermission grant this spec manages per account.
    - control_id: workload-identity
      status: not_applicable
      notes: A snapshot runs no workload and holds no credentials. The import arm's role_name names the VM Import/Export SERVICE role (AWS's vmimport convention) that the service -- not a workload -- assumes to read the staged image.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The only access path is the SigV4-signed EC2 API; no legacy or weaker protocol exists to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: The snapshot has no logging configuration of its own. Control-plane operations (create, copy, share, delete) are captured by account-level AWS CloudTrail -- a service behavior, not a manifest choice.
    - control_id: monitoring-integration
      status: not_applicable
      notes: Snapshots emit no runtime metrics -- they are cold stored data with no health to watch. Snapshot-completion visibility is an EventBridge/CloudTrail concern at the account level, outside this manifest.
    - control_id: backup-recovery
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: This component IS the backup -- a durable point-in-time copy stored independently of its source volume, restorable to a new volume in any zone of the region. The copy arm extends recovery across regions (the 02 preset's DR pattern), and fast_restore_availability_zones buys full-performance restores where enabled.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: A snapshot persists until explicitly deleted -- no retention field exists on the resource by design. Scheduled retention lives with lifecycle tooling (Data Lifecycle Manager or AWS Backup), not on an individual snapshot manifest; the archive tier's 90-day minimum is a billing floor, not a retention policy.
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Snapshot data is stored regionally on Amazon S3 infrastructure with multi-AZ durability -- no zonal placement exists on a snapshot, and a volume can be restored from it into any availability zone of the region.
    - control_id: deletion-protection
      status: not_applicable
      notes: Snapshots carry no deletion-protection flag -- neither the spec nor the provider resources have one. AWS does refuse to delete a snapshot that backs a registered AMI, but that is a service-side referential guard, not a manifest choice.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed storage service -- AWS operates and patches the snapshot storage and copy infrastructure; the snapshot exposes no runtime, version, or maintenance surface.
