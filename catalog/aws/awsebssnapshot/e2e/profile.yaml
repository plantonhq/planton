apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsebssnapshot
spec:
  # One scenario: snapshot the fixture volume with fast snapshot
  # restore in one zone (FSR bills per zone-hour; the lane's minutes
  # cost cents).
  #
  # Deliberately not exercised live:
  #   - the COPY arm (copy_from) -- its source is another
  #     AwsEbsSnapshot, the same kind under test, which the harness's
  #     self-kind-prerequisite guard blocks. Unblock: same-kind
  #     path-prerequisite support in the harness.
  #   - the IMPORT arm (import_from) -- needs the vmimport service
  #     role (documented trust + S3 policy) and a disk image staged
  #     in S3: a real fixture build. Unblock: a shared vmimport role
  #     + tiny RAW image fixture in the harness account.
  #   - share_with_account_ids -- grants need a second AWS account
  #     (the peering-accept class). Unblock: a second harness account
  #     or an owner-supplied account id export.
  #   - storage_tier archive + restore dials -- archival has a
  #     90-day minimum-storage billing commitment per snapshot.
  #     Unblock: an owner-approved cost waiver.
  #
  # PROVEN live 2026-08-26 (Q46): both engines through the full
  # six-phase runner + the Terraform blind import round-trip under the
  # armed apply-idempotency gate. Clean first-pass - the volume-arm
  # snapshot completed with FSR enabled in us-west-2a and disabled on
  # destroy, and the FSR {zone},{snapshot} composite re-imported blind
  # at zero diff (~3.5 min per engine including the source-volume
  # fixture).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
