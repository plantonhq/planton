syntax = "proto3";

package dev.planton.aws.awsebssnapshot.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsebssnapshot/v1alpha1/outputs.proto";
import "catalog/aws/awsebssnapshot/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsEbsSnapshot {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsEbsSnapshot'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsEbsSnapshotSpec spec = 4 [(buf.validate.field).required = true];
  AwsEbsSnapshotStatus status = 5;
}

message AwsEbsSnapshotStatus {
  AwsEbsSnapshotOutputs outputs = 1;
}
