syntax = "proto3";

package dev.planton.aws.awsebssnapshot.v1alpha1;

// AwsEbsSnapshotOutputs captures the observable state of the
// snapshot after apply.
message AwsEbsSnapshotOutputs {
  // The snapshot's id (snap-...) - what volume restores, copies, and
  // permission grants reference, and the provider's import ID (volume
  // arm only; copies and imports are create-only at the provider).
  string snapshot_id = 1;

  // The snapshot's ARN.
  string snapshot_arn = 2;

  // The AWS account that owns the snapshot.
  string owner_id = 3;

  // The size (GiB) of the volume the snapshot captures - for imports,
  // the size AWS derived from the disk image.
  string volume_size_gb = 4;
}
