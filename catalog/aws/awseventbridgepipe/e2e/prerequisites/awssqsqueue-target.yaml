# The pipe scenario's TARGET queue - an extra instance beyond the
# chain's SQS install profile (the source), via the harness's
# manifest-path prerequisites seam. Standard queue, AWS defaults, ~$0.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsSqsQueue
metadata:
  name: planton-oss-e2e-awsebp-target
  id: planton-oss-e2e-awsebp-target
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awssqsqueue
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
