# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awseventbridgepipe
spec:
  aws:
    statements:
      - sid: ManagePipe
        actions:
          - pipes:CreatePipe
          - pipes:UpdatePipe
          - pipes:DeletePipe
          - pipes:DescribePipe
        resources:
          - arn:aws:pipes:*:*:pipe/*
        provenance: derived
        notes: Covers aws_pipes_pipe / pipes.Pipe -- the module's single resource. UpdatePipe carries every in-place change INCLUDING desired_state flips (RUNNING/STOPPED ride the field, so no StartPipe/StopPipe grant is needed), and DescribePipe is both the plan/refresh read and the poll the provider runs while creates, updates, and deletes walk their state machines (up to 30 minutes). All four actions scope to the pipe ARN per the service reference.
      - sid: TagPipe
        actions:
          - pipes:TagResource
          - pipes:UntagResource
          - pipes:ListTagsForResource
        resources:
          - arn:aws:pipes:*:*:pipe/*
        provenance: derived
        notes: The module tags the pipe with the platform's standard tag set -- tag-on-create plus later reconciliation and the tag read on every refresh. All three tagging actions scope to the pipe ARN per the service reference.
      - sid: PassExecutionRoleToPipes
        actions:
          - iam:PassRole
        resources:
          - arn:aws:iam::*:role/*
        provenance: derived
        notes: "CreatePipe and UpdatePipe hand the pipe its REQUIRED execution role (role_arn) -- and, for ECS targets, optionally the task-override execution/task roles -- so the configuring principal must hold iam:PassRole on those roles (IAM's platform-wide pass-role rule). Tighten the resource to the specific role ARNs the manifests reference. What the EXECUTION ROLE itself may do (read the source, call the enrichment, write the target) is that AwsIamRole's policy -- subject-matter content, never a runner grant here."
