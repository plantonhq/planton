syntax = "proto3";

package dev.planton.aws.awseventbridgepipe.v1alpha1;

import "catalog/aws/awseventbridgepipe/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsEventBridgePipeIacInput is the input for the IaC modules that
// manage an EventBridge Pipe.
message AwsEventBridgePipeIacInput {
  // target is the AwsEventBridgePipe resource to deploy.
  AwsEventBridgePipe target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
