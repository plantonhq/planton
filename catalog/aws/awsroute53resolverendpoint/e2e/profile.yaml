apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsroute53resolverendpoint
spec:
  # Two scenarios: a minimal inbound endpoint (the on-prem-forwards-in
  # shape) and a full-surface outbound endpoint with a FORWARD rule to
  # TEST-NET targets, a SYSTEM override, and VPC associations. Endpoint
  # ENIs bill ~$0.125/hour each (two per endpoint) - minutes cost
  # cents. Creation waits on ENI provisioning (~2-5 min per endpoint).
  #
  # Deliberately not exercised live:
  #   - the DELEGATE rule type + INBOUND_DELEGATION direction -- the
  #     2025 delegation feature's server-side pairing contract is not
  #     verifiable offline and the provider's own tests do not cover
  #     it. Unblock: verify the pairing against the API once, then add
  #     a delegation scenario.
  #   - associating a RAM-shared rule from another account -- the
  #     shared test account is deliberately standalone. Unblock: a
  #     second account.
  #
  # PROVEN live 2026-08-26 (Q47): both scenarios on both engines
  # through the full six-phase runner + the Terraform blind import
  # round-trips under the armed apply-idempotency gate. Clean
  # first-pass; ENI provisioning ran ~3 min per endpoint create and
  # ~4 min per destroy (inside the documented 2-5 min class -
  # inbound-min ~8.5 min/engine, outbound-forward-full ~11-15
  # min/engine end-to-end with rules and associations).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 40
