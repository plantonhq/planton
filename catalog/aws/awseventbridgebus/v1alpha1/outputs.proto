syntax = "proto3";

package dev.planton.aws.awseventbridgebus.v1alpha1;

// AwsEventBridgeBusOutputs captures observable identifiers from a
// provisioned EventBridge custom event bus. These outputs are used by
// downstream resources — primarily AwsEventBridgeRule — to wire
// dependencies via StringValueOrRef.
message AwsEventBridgeBusOutputs {
  // The name of the event bus. This is the primary identifier used in
  // EventBridge API calls and in rule configurations that target this bus.
  string bus_name = 1;

  // The Amazon Resource Name (ARN) of the event bus. Used for IAM policies,
  // cross-account event delivery, and as a reference in other resources.
  string bus_arn = 2;

  // The archives declared in spec.archives — one entry per archive, exposing
  // the identifiers replay operations (EventBridge StartReplay) and IAM
  // policies need.
  repeated AwsEventBridgeBusArchiveOutput archives = 3;
}

// AwsEventBridgeBusArchiveOutput is one archive's observable identity.
message AwsEventBridgeBusArchiveOutput {
  // The archive's spec.archives entry name.
  string name = 1;

  // The Amazon Resource Name (ARN) of the archive. StartReplay calls and
  // IAM policies reference the archive by this ARN.
  string arn = 2;
}
