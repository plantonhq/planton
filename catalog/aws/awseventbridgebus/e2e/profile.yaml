apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awseventbridgebus
spec:
  # A custom EventBridge bus under E2E: the scenario composes an SQS queue
  # fixture as the bus-level dead-letter target via the e2e-prerequisites
  # annotation, then runs deploy -> DescribeEventBus verify -> destroy ->
  # verify-destroyed on both provisioners. The scenario enables error-level
  # logging, a bus-level DLQ, and one pattern-scoped event archive (free at
  # zero traffic; verify via DescribeArchive, not apply success alone) --
  # the production posture without customer-managed KMS encryption.
  # Deliberately not in the live scenario: partner event sources, KMS
  # encryption (bus-level and per-archive), and resource policies -- all
  # proven by CEL spec tests and the offline gate (the canonical manifest
  # renders both archive shapes incl. the KMS arm).
  tier: 1
  # Proven live 2026-08-12, both engines -- the archives fold's first live
  # proof. DescribeArchive echoed the arm per engine (state ENABLED,
  # retention 1 day, the pattern-scoped source, EventSourceArn = the bus's
  # own ARN), and the destroy removed the archive BEFORE the bus
  # (explicit in the Terraform destroy log; structural on Pulumi via the
  # archive's pulumi.Parent(bus)).
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
  # 2026-08-13 tag-convergence sweep: the Pulumi identity-tag map gained the
  # canonical Name key, converging on the key set the Terraform module (and
  # this badge's live proof) already sends. Declared-set equality is now
  # machine-enforced by hack/guards/ensure_cross_engine_tag_keys.sh; the
  # change class is live-re-proven once via Q31 (awssqsqueue represents it).
