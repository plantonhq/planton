syntax = "proto3";

package dev.planton.aws.awsbedrockagentcorememory.v1alpha1;

import "catalog/aws/awsbedrockagentcorememory/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsBedrockAgentCoreMemoryIacInput is the input for the IaC modules
// that deploy the AgentCore memory.
message AwsBedrockAgentCoreMemoryIacInput {
  // target is the AwsBedrockAgentCoreMemory resource to deploy.
  AwsBedrockAgentCoreMemory target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
