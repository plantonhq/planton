apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awssnssubscription
spec:
  # An SNS subscription under E2E: the harness deploys the AwsSnsTopic registry
  # prerequisite, composes the SQS queue fixture via the scenario's
  # e2e-prerequisites annotation, then runs deploy ->
  # GetSubscriptionAttributes verify -> destroy -> verify-destroyed on both
  # provisioners. The scenario wires one standard topic into the shared
  # standard queue with raw delivery and a message-attribute filter policy --
  # the smallest honest SQS fan-out surface. Deliberately not in the live
  # scenario: Lambda, HTTP/S, email, Firehose, and cross-account topics --
  # all proven by CEL spec tests and the offline gate.
  tier: 1
  # Proven live 2026-08-12, both engines -- the re-proof after the Pulumi
  # raw_message_delivery and endpoint_auto_confirms sends converged to
  # state-pinned. (The first attempt hit an orphaned fixed-name topic
  # prerequisite from an earlier interrupted teardown; cleared by CLI and
  # re-run green -- see the e2e README's fixed-name-fixture guidance.)
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
