syntax = "proto3";

package dev.planton.aws.awssnssubscription.v1alpha1;

// AwsSnsSubscriptionOutputs captures observable identifiers from a
// provisioned SNS subscription.
message AwsSnsSubscriptionOutputs {
  // The Amazon Resource Name (ARN) of the subscription. The identifier used
  // for sns:Unsubscribe/SetSubscriptionAttributes permissions and for
  // auditing which subscriptions exist on a topic.
  string subscription_arn = 1;

  // The AWS account ID that owns the subscription. Useful when subscribing
  // an owned endpoint to a cross-account topic.
  string owner_id = 2;

  // True while the subscription is awaiting endpoint confirmation (HTTP/S
  // endpoints that have not completed the handshake, or email recipients who
  // have not clicked the confirmation link). Deliveries do not start until
  // confirmation completes.
  bool pending_confirmation = 3;

  // True when the confirmation request was authenticated (signed). Always
  // true for protocols that confirm automatically (SQS, Lambda, Firehose).
  bool confirmation_was_authenticated = 4;
}
