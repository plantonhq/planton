# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awssnssubscription
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A subscription is a routing rule, not a store -- messages rest on the topic (whose kms_key_id governs server-side encryption on the AwsSnsTopic kind) and on the endpoints they land in; nothing rests here.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: With no stored data there is no key surface; customer-managed keying belongs to the topic and endpoint components.
    - control_id: enc-in-transit
      status: configurable
      field_path: protocol
      evidence:
        type: spec_default
        reference: The "https" protocol delivers over TLS while plain "http" delivers over cleartext -- the one field that decides whether this component's traffic is encrypted in transit. SQS, Lambda, Firehose, and application deliveries ride AWS's TLS APIs regardless.
      notes: Choosing http is the only unencrypted path this manifest can create; email transport security is the receiving mail system's affair.
    - control_id: no-public-access
      status: not_applicable
      notes: A subscription exposes nothing -- it pushes messages outward to the declared endpoint. Whether that endpoint is publicly reachable is the endpoint's own posture, decided on its component (or, for HTTP/S URLs, outside the platform entirely).
    - control_id: restricted-ingress
      status: not_applicable
      notes: No inbound surface exists; who may publish into the pipeline is the topic's access policy on the AwsSnsTopic kind, and who may create subscriptions is IAM on sns:Subscribe.
    - control_id: edge-protection
      status: not_applicable
      notes: There is no listener to put a WAF in front of; request filtering for an HTTP/S endpoint belongs to whatever serves that endpoint.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Subscribe, Unsubscribe, and attribute changes are IAM-authorized against the topic's ARN unconditionally; cross-account subscriptions additionally require the topic's resource policy to grant sns:Subscribe to the subscribing account.
    - control_id: workload-identity
      status: configurable
      field_path: subscription_role_arn
      evidence:
        type: spec_default
        reference: Firehose delivery assumes the referenced role (required by spec validation when protocol is "firehose") -- short-lived credentials for SNS's writes into the stream. SQS and Lambda deliveries authenticate through resource policies on the endpoint components instead, and no static-credential path exists anywhere.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: Management calls are SigV4-only; the HTTP/S confirmation handshake (endpoint_auto_confirms) verifies endpoint-owner intent, not caller identity, and has no weaker alternative to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Subscribe/Unsubscribe and attribute changes land in CloudTrail by default. Per-delivery status logging is a topic-side opt-in (delivery_feedback on the AwsSnsTopic kind) -- this spec deliberately carries no logging surface of its own.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Delivery outcomes (NumberOfNotificationsDelivered, NumberOfNotificationsFailed, and protocol-specific failure metrics) flow to CloudWatch automatically as part of the topic's metrics; no configuration on the subscription is needed or possible.
    - control_id: backup-recovery
      status: configurable
      field_path: dead_letter_config.dead_letter_target_arn
      evidence:
        type: spec_default
        reference: Unset means messages that exhaust SNS's delivery retries are dropped; a dead-letter queue captures them in the referenced SQS queue for later inspection or redrive -- recovery for the messages in flight, which are the only data this component handles.
      notes: replay_policy adds the complementary backfill arm -- a subscription to a FIFO topic with an archive can replay retained messages from a chosen starting point.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: Retention of dead-lettered messages is governed on the referenced AwsSqsQueue; archive retention is the topic's archive_policy. Nothing here holds data long enough to retain.
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: SNS delivery infrastructure is regional and multi-AZ; no single-zone mode exists for a subscription.
    - control_id: deletion-protection
      status: not_applicable
      notes: No deletion-protection flag exists; a deleted subscription simply stops delivery. Recreating an HTTP/S or email subscription re-runs the confirmation handshake -- the one recreate cost to know about.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- AWS operates and patches the delivery fleet; no customer-visible patch surface exists.
