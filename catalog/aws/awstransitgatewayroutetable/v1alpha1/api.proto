syntax = "proto3";

package dev.planton.aws.awstransitgatewayroutetable.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awstransitgatewayroutetable/v1alpha1/outputs.proto";
import "catalog/aws/awstransitgatewayroutetable/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsTransitGatewayRouteTable represents a managed AWS Transit Gateway route
// table deployed via Planton. This resource defines one isolated routing
// domain inside a Transit Gateway hub -- which attachments use it, which
// attachments advertise into it, and its static and prefix-list routes.
message AwsTransitGatewayRouteTable {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this Transit Gateway route table resource.
  string kind = 2 [(buf.validate.field).string.const = "AwsTransitGatewayRouteTable"];

  // metadata captures identifying information (name, org, version, etc.)
  // and must pass standard validations for resource naming.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the core configuration defining how the route table and its
  // routing domain are provisioned.
  AwsTransitGatewayRouteTableSpec spec = 4 [(buf.validate.field).required = true];

  // status holds runtime or post-deployment information.
  AwsTransitGatewayRouteTableStatus status = 5;
}

// AwsTransitGatewayRouteTableStatus describes the status fields for a
// Transit Gateway route table resource.
message AwsTransitGatewayRouteTableStatus {
  // outputs captures the outputs returned by Pulumi/Terraform after
  // provisioning.
  AwsTransitGatewayRouteTableOutputs outputs = 1;
}
