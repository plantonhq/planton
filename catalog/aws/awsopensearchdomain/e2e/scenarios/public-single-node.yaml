# OpenSearch public single-node scenario: the smallest orderable footprint.
# One t3.small.search data node outside any VPC (no vpcOptions -> a public
# endpoint, which keeps the component a true leaf with no prerequisites),
# gp3 EBS storage, encryption at rest, node-to-node TLS, and HTTPS-only
# access. No access policy is attached, so the data plane denies all
# requests -- verification is control-plane DescribeDomain, which needs
# none. Deliberately not in the scenario: Auto-Tune (unsupported on t3),
# dedicated masters, zone awareness, FGAC, Cognito, and the VPC shape --
# those paths are proven by CEL spec tests and the offline gate. Full
# metadata is supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsOpenSearchDomain
metadata:
  name: planton-oss-e2e-os-public
  id: planton-oss-e2e-os-public
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsopensearchdomain
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  engineVersion: "OpenSearch_2.17"
  clusterConfig:
    instanceType: t3.small.search
    instanceCount: 1
  ebsOptions:
    ebsEnabled: true
    volumeType: gp3
    volumeSize: 10
  encryptAtRestEnabled: true
  nodeToNodeEncryptionEnabled: true
  domainEndpointOptions:
    enforceHttps: true
    tlsSecurityPolicy: "Policy-Min-TLS-1-2-PFS-2023-10"
