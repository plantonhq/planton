apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsopensearchdomain
spec:
  # An OpenSearch domain under E2E: a true leaf (no prerequisites -- the
  # scenario is a public single-node t3.small.search domain outside any
  # VPC), so the harness runs the lifecycle directly. Verification is
  # DescribeDomain keyed on the domain name. Auto-Tune is excluded from
  # the scenario because t3 instance types do not support it.
  #
  # The one-time offline-only deferral (domain creation runs 15-25
  # minutes each way per engine) was REOPENED by owner decision -- cost
  # is trivial (t3.small.search pennies per hour, ~$0.20 per lane pair),
  # only the wall clock is heavy. The SAML and VPC-endpoint-grant
  # satellites remain offline-proven: SAML needs a real IdP metadata
  # document and the endpoint grant a second-account consumer fixture --
  # recorded deferrals with those unblocks.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 90
