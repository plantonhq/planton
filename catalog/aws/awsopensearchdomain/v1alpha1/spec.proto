syntax = "proto3";

package dev.planton.aws.awsopensearchdomain.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// AwsOpenSearchDomainSpec defines the desired configuration for an Amazon
// OpenSearch Service domain (successor to Amazon Elasticsearch Service).
//
// OpenSearch provides managed search, analytics, and observability capabilities.
// A domain consists of data nodes (required), optional dedicated master nodes for
// cluster management, optional coordinator node pools for request fan-out, optional
// UltraWarm nodes for infrequently accessed data, and optional cold storage backed by S3.
//
// Deployment models:
// - **Public** (no vpc_options) — accessible over the internet, secured via access
//   policies and optionally fine-grained access control (FGAC).
// - **VPC** (vpc_options set) — deployed into VPC subnets, secured via security
//   groups and access policies. VPC configuration is ForceNew — changing it
//   destroys and recreates the domain.
//
// Notes:
// - `encrypt_at_rest` KMS key is ForceNew — choose the encryption key carefully upfront.
// - `advanced_security_options.enabled` cannot be disabled once turned on (ForceNew).
// - Domain name must match `^[a-z][0-9a-z\-]{2,27}$` (3-28 chars, lowercase, hyphens).
// - Engine version format: "OpenSearch_X.Y" or "Elasticsearch_X.Y".
// - Credentials, region, and deployment workflow live outside this spec in IaC inputs.
message AwsOpenSearchDomainSpec {
  // The AWS region where the resource will be created.
  // Example: "us-west-2", "eu-west-1"
  string region = 1 [(buf.validate.field).string.min_len = 1];

  // ---------------------------------------------------------------------------
  // Engine
  // ---------------------------------------------------------------------------

  // OpenSearch or Elasticsearch engine version. Format: "OpenSearch_X.Y" (e.g.,
  // "OpenSearch_2.11") or "Elasticsearch_X.Y" (e.g., "Elasticsearch_7.10").
  // Upgrades are applied in place; a version DOWNGRADE (or a change to an
  // incompatible version) forces domain recreation.
  string engine_version = 2 [(buf.validate.field).required = true];

  // ---------------------------------------------------------------------------
  // Cluster configuration
  // ---------------------------------------------------------------------------

  // Cluster topology: data nodes, dedicated masters, coordinator node pools,
  // zone awareness, warm/cold storage.
  AwsOpenSearchDomainClusterConfig cluster_config = 3 [(buf.validate.field).required = true];

  // ---------------------------------------------------------------------------
  // EBS storage
  // ---------------------------------------------------------------------------

  // EBS volume configuration for data node storage. Required for most instance types
  // (all except certain storage-optimized types that use instance storage).
  AwsOpenSearchDomainEbsOptions ebs_options = 4 [(buf.validate.field).required = true];

  // ---------------------------------------------------------------------------
  // Encryption
  // ---------------------------------------------------------------------------

  // Enable encryption at rest for indices and automated snapshots. Uses the
  // AWS-managed `aws/es` key unless `kms_key_id` is provided. Defaults to
  // TRUE (secure by default); set an explicit false only for legacy engine
  // versions that cannot encrypt.
  // One-way: encryption cannot be disabled once enabled (disabling forces
  // domain recreation), and enabling it on very old Elasticsearch versions
  // (< 6.7) also forces recreation.
  optional bool encrypt_at_rest_enabled = 5 [(dev.planton.shared.options.default) = "true"];

  // Customer-managed KMS key ARN or ID for at-rest encryption. ForceNew — the
  // KMS key cannot be changed after domain creation.
  dev.planton.shared.foreignkey.v1.StringValueOrRef kms_key_id = 6 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsKmsKey,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_arn"
  ];

  // Enable TLS encryption for all traffic between nodes in the cluster.
  // Defaults to TRUE (secure by default). One-way: cannot be disabled once
  // enabled (disabling forces domain recreation).
  optional bool node_to_node_encryption_enabled = 7 [(dev.planton.shared.options.default) = "true"];

  // ---------------------------------------------------------------------------
  // Networking (VPC)
  // ---------------------------------------------------------------------------

  // VPC placement configuration. When provided, the domain is deployed into VPC
  // subnets and is not publicly accessible. ForceNew — adding or removing VPC
  // options destroys and recreates the domain.
  AwsOpenSearchDomainVpcOptions vpc_options = 8;

  // ---------------------------------------------------------------------------
  // Domain endpoint
  // ---------------------------------------------------------------------------

  // HTTPS enforcement, TLS policy, and custom endpoint configuration.
  AwsOpenSearchDomainEndpointOptions domain_endpoint_options = 9;

  // ---------------------------------------------------------------------------
  // Fine-grained access control (FGAC)
  // ---------------------------------------------------------------------------

  // Advanced security options enable fine-grained access control: internal user
  // database, IAM-based authentication, JWT bearer authentication, and role-based
  // index-level permissions. Once enabled, FGAC cannot be disabled (ForceNew).
  AwsOpenSearchDomainAdvancedSecurityOptions advanced_security_options = 10;

  // ---------------------------------------------------------------------------
  // Cognito authentication for Dashboards
  // ---------------------------------------------------------------------------

  // Amazon Cognito authentication for OpenSearch Dashboards: users sign in
  // through a Cognito user pool and are authorized through a Cognito identity
  // pool. An alternative to FGAC's internal user database for the Dashboards
  // UI (the two can also be combined -- Cognito authenticates, FGAC authorizes).
  AwsOpenSearchDomainCognitoOptions cognito_options = 11;

  // ---------------------------------------------------------------------------
  // Log publishing
  // ---------------------------------------------------------------------------

  // Publish domain logs to CloudWatch Logs for monitoring and troubleshooting.
  // Up to 4 configurations — one per log type (INDEX_SLOW_LOGS, SEARCH_SLOW_LOGS,
  // ES_APPLICATION_LOGS, AUDIT_LOGS).
  repeated AwsOpenSearchDomainLogPublishingOption log_publishing_options = 12;

  // ---------------------------------------------------------------------------
  // Access policies
  // ---------------------------------------------------------------------------

  // IAM-based access policy for the domain. Serialized to JSON by the IaC modules.
  // Controls who can perform actions on the domain and its indices.
  // For VPC domains, this works in conjunction with security groups.
  // For public domains, this is the primary access control mechanism (unless FGAC is enabled).
  google.protobuf.Struct access_policies = 13;

  // ---------------------------------------------------------------------------
  // Auto-Tune and maintenance
  // ---------------------------------------------------------------------------

  // AWS Auto-Tune automatically optimizes JVM heap size, disk I/O, and other
  // performance settings based on cluster metrics. Configure maintenance windows
  // for changes that require a blue/green deployment. Not supported on t2/t3
  // (burstable) instance types.
  AwsOpenSearchDomainAutoTuneOptions auto_tune_options = 14;

  // Hour of day (0-23, UTC) when the service takes an automated daily snapshot
  // of the domain's indices. Only relevant for domains running Elasticsearch
  // versions below 5.3 — newer versions snapshot hourly regardless — but the
  // setting remains configurable on all domains.
  optional int32 automated_snapshot_start_hour = 15 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 23
  ];

  // Daily 10-hour low-traffic window during which AWS schedules service software
  // updates and Auto-Tune blue/green optimizations. AWS defaults the window to
  // 10:00 PM local time when not configured.
  AwsOpenSearchDomainOffPeakWindowOptions off_peak_window_options = 16;

  // Enable automatic service software updates. When true, AWS applies mandatory
  // and optional service software updates during the off-peak window. Both
  // engines always send this setting explicitly, so false actively turns
  // auto-updates OFF (including on domains where they were previously on).
  bool auto_software_update_enabled = 17;

  // Blue/green deployment strategy for configuration changes that require one.
  // "Default": AWS picks the standard strategy. "CapacityOptimized": AWS
  // provisions additional capacity more conservatively to reduce the performance
  // impact of the migration on capacity-sensitive clusters.
  string deployment_strategy = 18 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "Default",
        "CapacityOptimized"
      ]
    }
  ];

  // ---------------------------------------------------------------------------
  // IP and advanced options
  // ---------------------------------------------------------------------------

  // IP address type for the domain. "ipv4" (default) or "dualstack" (IPv4 + IPv6).
  // One-way: changing from "dualstack" back to "ipv4" forces domain recreation.
  string ip_address_type = 19;

  // Low-level key-value configuration options. Common options:
  // - "rest.action.multi.allow_explicit_index": "true" (default)
  // - "indices.fielddata.cache.size": percentage of heap
  // - "indices.query.bool.max_clause_count": max boolean clauses
  // Values must be strings.
  map<string, string> advanced_options = 20;

  // ---------------------------------------------------------------------------
  // AI/ML capabilities
  // ---------------------------------------------------------------------------

  // AI/ML capabilities on the domain: natural-language query generation in
  // Dashboards, the S3 vectors engine, and GPU-accelerated vector search.
  AwsOpenSearchDomainAimlOptions aiml_options = 21;

  // ---------------------------------------------------------------------------
  // IAM Identity Center
  // ---------------------------------------------------------------------------

  // AWS IAM Identity Center (successor to AWS SSO) integration for OpenSearch
  // Dashboards and API access — workforce users sign in with their Identity
  // Center identity instead of IAM credentials.
  AwsOpenSearchDomainIdentityCenterOptions identity_center_options = 22;

  // ---------------------------------------------------------------------------
  // SAML authentication for Dashboards
  // ---------------------------------------------------------------------------

  // SAML authentication for OpenSearch Dashboards: users sign in through an
  // external SAML 2.0 identity provider (Okta, Entra ID, ...). Managed as its
  // own provider resource alongside the domain; removing the block disables
  // SAML. Requires fine-grained access control (advanced_security_options).
  AwsOpenSearchDomainSamlOptions saml_options = 23;

  // ---------------------------------------------------------------------------
  // VPC endpoint access grants
  // ---------------------------------------------------------------------------

  // AWS account IDs authorized to create OpenSearch-managed VPC endpoints
  // against this domain (the grantor side of cross-account private access).
  // Each entry is managed as its own provider resource keyed by account ID.
  repeated string authorized_vpc_endpoint_access_accounts = 24 [(buf.validate.field).repeated.unique = true];

  // ---------------------------------------------------------------------------
  // CEL validations (cross-field)
  // ---------------------------------------------------------------------------

  // Engine version format: must match OpenSearch_X.Y or Elasticsearch_X.Y
  option (buf.validate.message).cel = {
    id: "engine_version_format"
    message: "engine_version must match 'OpenSearch_X.Y' or 'Elasticsearch_X.Y' format (e.g., 'OpenSearch_2.11', 'Elasticsearch_7.10')"
    expression: "this.engine_version.matches('^(OpenSearch|Elasticsearch)_[0-9]+\\\\.[0-9]+$')"
  };

  // kms_key_id requires encrypt_at_rest_enabled.
  option (buf.validate.message).cel = {
    id: "kms_requires_encryption"
    message: "kms_key_id requires encrypt_at_rest_enabled to be true"
    expression: "!has(this.kms_key_id) || this.encrypt_at_rest_enabled"
  };

  // ip_address_type valid values.
  option (buf.validate.message).cel = {
    id: "ip_address_type_valid"
    message: "ip_address_type must be 'ipv4' or 'dualstack' when set"
    expression: "this.ip_address_type == '' || this.ip_address_type in ['ipv4', 'dualstack']"
  };

  // log_publishing_options: at most 4 entries.
  option (buf.validate.message).cel = {
    id: "log_options_max_four"
    message: "at most 4 log publishing options are allowed (one per log_type)"
    expression: "this.log_publishing_options.size() <= 4"
  };

  // AUDIT_LOGS requires advanced_security_options.enabled.
  option (buf.validate.message).cel = {
    id: "audit_logs_require_fgac"
    message: "AUDIT_LOGS log type requires advanced_security_options to be enabled"
    expression: "!this.log_publishing_options.exists(l, l.log_type == 'AUDIT_LOGS') || (has(this.advanced_security_options) && this.advanced_security_options.enabled)"
  };

  // SAML sign-in rides on fine-grained access control's role mapping.
  option (buf.validate.message).cel = {
    id: "saml_requires_fgac"
    message: "saml_options requires advanced_security_options to be enabled (SAML roles map through fine-grained access control)"
    expression: "!has(this.saml_options) || (has(this.advanced_security_options) && this.advanced_security_options.enabled)"
  };

  // Mirrors AWS's engine gate on JWT authentication: OpenSearch 2.11+ only
  // (the provider rejects it at plan time on Elasticsearch engines and on
  // older OpenSearch versions).
  option (buf.validate.message).cel = {
    id: "jwt_requires_opensearch_2_11"
    message: "advanced_security_options.jwt_options requires engine_version OpenSearch_2.11 or newer (not available on Elasticsearch engines)"
    expression: "!has(this.advanced_security_options) || !has(this.advanced_security_options.jwt_options) || this.engine_version.matches('^OpenSearch_(2\\\\.(1[1-9]|[2-9][0-9])|[3-9]\\\\.[0-9]+|[1-9][0-9]+\\\\.[0-9]+)$')"
  };

  // Twelve-digit AWS account IDs on the endpoint-access grant list.
  option (buf.validate.message).cel = {
    id: "authorized_accounts_format"
    message: "authorized_vpc_endpoint_access_accounts entries must be 12-digit AWS account IDs"
    expression: "this.authorized_vpc_endpoint_access_accounts.all(a, a.matches('^[0-9]{12}$'))"
  };
}

// AwsOpenSearchDomainClusterConfig defines the cluster topology including data
// nodes, dedicated master nodes, coordinator node pools, zone awareness, and
// UltraWarm/cold storage tiers.
message AwsOpenSearchDomainClusterConfig {
  // ---------------------------------------------------------------------------
  // Data nodes
  // ---------------------------------------------------------------------------

  // Instance type for data nodes. Uses the `.search` suffix.
  // Examples: "t3.small.search" (dev), "r6g.large.search" (production),
  // "r6g.2xlarge.search" (high-memory workloads).
  string instance_type = 1 [(buf.validate.field).required = true];

  // Number of data node instances. Default: 1.
  // For zone-aware deployments, use a multiple of the availability zone count.
  optional int32 instance_count = 2 [(dev.planton.shared.options.default) = "1"];

  // ---------------------------------------------------------------------------
  // Dedicated master nodes
  // ---------------------------------------------------------------------------

  // Enable dedicated master nodes for cluster stability. Dedicated masters handle
  // cluster management tasks (shard allocation, index state management) without
  // competing with data node workloads. Recommended for production.
  bool dedicated_master_enabled = 3;

  // Instance type for dedicated master nodes. Does not need EBS storage.
  // Example: "r6g.large.search". Only used when `dedicated_master_enabled` is true.
  string dedicated_master_type = 4;

  // Number of dedicated master nodes. AWS recommends 3 for production (provides
  // quorum for split-brain protection). Only used when `dedicated_master_enabled` is true.
  int32 dedicated_master_count = 5;

  // ---------------------------------------------------------------------------
  // Coordinator node pools
  // ---------------------------------------------------------------------------

  // Additional node pools beyond data and master nodes. Today AWS supports one
  // pool type: "coordinator" nodes, which take over request routing, query
  // fan-out, and response aggregation so data nodes spend their capacity on
  // indexing and searching. Valuable for high-concurrency dashboards and
  // aggregation-heavy workloads.
  repeated AwsOpenSearchDomainNodeOption node_options = 6;

  // ---------------------------------------------------------------------------
  // Zone awareness
  // ---------------------------------------------------------------------------

  // Enable zone awareness to distribute data nodes and replicas across multiple
  // Availability Zones for resilience against AZ-level failures.
  bool zone_awareness_enabled = 7;

  // Number of Availability Zones. Must be 2 or 3.
  // Only used when `zone_awareness_enabled` is true.
  int32 availability_zone_count = 8;

  // ---------------------------------------------------------------------------
  // UltraWarm storage
  // ---------------------------------------------------------------------------

  // Enable UltraWarm storage tier for infrequently accessed, read-only data.
  // UltraWarm uses S3-backed storage at lower cost per GB than hot storage.
  // Requires warm_type and warm_count.
  bool warm_enabled = 9;

  // Instance type for UltraWarm nodes: "ultrawarm1.medium.search",
  // "ultrawarm1.large.search", or "ultrawarm1.xlarge.search". Required when
  // `warm_enabled` is true.
  string warm_type = 10 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "ultrawarm1.medium.search",
        "ultrawarm1.large.search",
        "ultrawarm1.xlarge.search"
      ]
    }
  ];

  // Number of UltraWarm nodes. Range: 2-150. Required when `warm_enabled`
  // is true.
  int32 warm_count = 11;

  // ---------------------------------------------------------------------------
  // Cold storage
  // ---------------------------------------------------------------------------

  // Enable cold storage backed by S3. Requires UltraWarm to be enabled.
  // Cold storage provides the lowest-cost tier for data that is rarely queried.
  bool cold_storage_enabled = 12;

  // ---------------------------------------------------------------------------
  // Multi-AZ with standby
  // ---------------------------------------------------------------------------

  // Enable Multi-AZ with Standby for 99.99% availability SLA. Deploys standby
  // nodes in a different AZ that take over automatically during AZ failures.
  // Requires 3 AZs and at least 3 data nodes.
  bool multi_az_with_standby_enabled = 13;

  // ---------------------------------------------------------------------------
  // CEL validations
  // ---------------------------------------------------------------------------

  // dedicated_master_type requires dedicated_master_enabled.
  option (buf.validate.message).cel = {
    id: "master_type_requires_enabled"
    message: "dedicated_master_type requires dedicated_master_enabled to be true"
    expression: "this.dedicated_master_type == '' || this.dedicated_master_enabled"
  };

  // dedicated_master_count requires dedicated_master_enabled.
  option (buf.validate.message).cel = {
    id: "master_count_requires_enabled"
    message: "dedicated_master_count requires dedicated_master_enabled to be true"
    expression: "this.dedicated_master_count == 0 || this.dedicated_master_enabled"
  };

  // zone_awareness_config requires zone_awareness_enabled.
  option (buf.validate.message).cel = {
    id: "az_count_requires_zone_awareness"
    message: "availability_zone_count requires zone_awareness_enabled to be true"
    expression: "this.availability_zone_count == 0 || this.zone_awareness_enabled"
  };

  // availability_zone_count must be 2 or 3.
  option (buf.validate.message).cel = {
    id: "az_count_valid_values"
    message: "availability_zone_count must be 2 or 3 when set"
    expression: "this.availability_zone_count == 0 || this.availability_zone_count in [2, 3]"
  };

  // warm_type requires warm_enabled.
  option (buf.validate.message).cel = {
    id: "warm_type_requires_enabled"
    message: "warm_type requires warm_enabled to be true"
    expression: "this.warm_type == '' || this.warm_enabled"
  };

  // warm_count requires warm_enabled.
  option (buf.validate.message).cel = {
    id: "warm_count_requires_enabled"
    message: "warm_count requires warm_enabled to be true"
    expression: "this.warm_count == 0 || this.warm_enabled"
  };

  // warm_count range 2-150.
  option (buf.validate.message).cel = {
    id: "warm_count_range"
    message: "warm_count must be between 2 and 150 when set"
    expression: "this.warm_count == 0 || (this.warm_count >= 2 && this.warm_count <= 150)"
  };

  // Enabling UltraWarm requires the node shape -- without both values the
  // engines would send an incomplete warm configuration that the provider
  // rejects.
  option (buf.validate.message).cel = {
    id: "warm_enabled_requires_shape"
    message: "warm_enabled requires warm_type and warm_count"
    expression: "!this.warm_enabled || (this.warm_type != '' && this.warm_count > 0)"
  };

  // cold_storage requires warm_enabled.
  option (buf.validate.message).cel = {
    id: "cold_requires_warm"
    message: "cold_storage_enabled requires warm_enabled to be true (cold storage depends on UltraWarm)"
    expression: "!this.cold_storage_enabled || this.warm_enabled"
  };
}

// AwsOpenSearchDomainNodeOption configures one additional node pool. Maps to the
// provider's node_options entry (node_type + nested node_config), flattened to
// one honest object per pool.
message AwsOpenSearchDomainNodeOption {
  // The pool type. AWS currently supports "coordinator".
  string node_type = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: ["coordinator"]
    }
  ];

  // Whether the pool is active. Set false to keep the pool definition while
  // removing its nodes.
  bool enabled = 2;

  // Instance type for nodes in this pool (`.search` suffix).
  // Example: "m7g.large.search". Required when the pool is enabled.
  string instance_type = 3;

  // Number of nodes in the pool (at least 1). Required when the pool is
  // enabled.
  int32 count = 4;

  option (buf.validate.message).cel = {
    id: "enabled_pool_requires_shape"
    message: "an enabled node pool requires instance_type and count (at least 1)"
    expression: "!this.enabled || (this.instance_type != '' && this.count > 0)"
  };
}

// AwsOpenSearchDomainEbsOptions defines EBS volume configuration for data node storage.
message AwsOpenSearchDomainEbsOptions {
  // Whether EBS volumes are attached to data nodes. Required for most instance
  // types. Only storage-optimized instances (e.g., i3) use instance storage.
  bool ebs_enabled = 1;

  // EBS volume type. "gp3" (recommended), "gp2", "io1", or "standard".
  // gp3 provides predictable performance with configurable IOPS and throughput.
  string volume_type = 2;

  // Size of each EBS volume in GB. The total storage is volume_size * instance_count.
  int32 volume_size = 3;

  // Provisioned IOPS for the volume. Only valid for "gp3" and "io1" volume types.
  // gp3 baseline: 3000 IOPS. io1: specify based on workload.
  int32 iops = 4;

  // Provisioned throughput in MiB/s. Only valid for "gp3" volume type.
  // Minimum: 125 MiB/s. gp3 baseline: 125 MiB/s.
  int32 throughput = 5;

  // ---------------------------------------------------------------------------
  // CEL validations
  // ---------------------------------------------------------------------------

  // volume_type, volume_size require ebs_enabled.
  option (buf.validate.message).cel = {
    id: "ebs_fields_require_enabled"
    message: "volume_type, volume_size, iops, and throughput require ebs_enabled to be true"
    expression: "(this.volume_type == '' && this.volume_size == 0 && this.iops == 0 && this.throughput == 0) || this.ebs_enabled"
  };

  // volume_type valid values.
  option (buf.validate.message).cel = {
    id: "volume_type_valid"
    message: "volume_type must be 'gp3', 'gp2', 'io1', or 'standard' when set"
    expression: "this.volume_type == '' || this.volume_type in ['gp3', 'gp2', 'io1', 'standard']"
  };

  // iops requires gp3 or io1.
  option (buf.validate.message).cel = {
    id: "iops_requires_volume_type"
    message: "iops is only valid for 'gp3' or 'io1' volume types"
    expression: "this.iops == 0 || this.volume_type in ['gp3', 'io1']"
  };

  // throughput requires gp3.
  option (buf.validate.message).cel = {
    id: "throughput_requires_gp3"
    message: "throughput is only valid for 'gp3' volume type"
    expression: "this.throughput == 0 || this.volume_type == 'gp3'"
  };

  // throughput minimum 125.
  option (buf.validate.message).cel = {
    id: "throughput_minimum"
    message: "throughput must be at least 125 MiB/s when set"
    expression: "this.throughput == 0 || this.throughput >= 125"
  };
}

// AwsOpenSearchDomainVpcOptions defines VPC placement for the domain.
// When configured, the domain is not publicly accessible and instead uses
// VPC endpoints for traffic. VPC configuration is ForceNew.
message AwsOpenSearchDomainVpcOptions {
  // Subnet IDs where OpenSearch deploys ENIs. For zone-aware domains, provide
  // subnets in 2 or 3 AZs matching the cluster's availability_zone_count.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef subnet_ids = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSubnet,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.subnet_id"
  ];

  // Security group IDs controlling inbound/outbound traffic to the domain.
  // Must allow HTTPS (port 443) from clients that need to access OpenSearch.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef security_group_ids = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSecurityGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.security_group_id"
  ];

  // A VPC domain must land in at least one subnet -- an empty block would
  // diverge between engines (one omits the VPC configuration entirely, the
  // other sends an empty one).
  option (buf.validate.message).cel = {
    id: "vpc_requires_subnets"
    message: "vpc_options requires at least one subnet_id"
    expression: "this.subnet_ids.size() > 0"
  };
}

// AwsOpenSearchDomainEndpointOptions configures the domain's HTTPS behavior,
// TLS policy, and optional custom endpoint.
message AwsOpenSearchDomainEndpointOptions {
  // Require HTTPS for all traffic to the domain endpoint. Default: true.
  // Strongly recommended for all environments.
  optional bool enforce_https = 1 [(dev.planton.shared.options.default) = "true"];

  // TLS security policy for the HTTPS endpoint. Controls the minimum TLS version
  // and cipher suites. "Policy-Min-TLS-1-2-PFS-2023-10" is the recommended
  // baseline; the FIPS policy serves regulated workloads. Leave empty for the
  // provider default.
  string tls_security_policy = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "Policy-Min-TLS-1-0-2019-07",
        "Policy-Min-TLS-1-2-2019-07",
        "Policy-Min-TLS-1-2-PFS-2023-10",
        "Policy-Min-TLS-1-2-RFC9151-FIPS-2024-08"
      ]
    }
  ];

  // Enable a custom domain endpoint (e.g., "search.example.com") instead of the
  // AWS-generated endpoint.
  bool custom_endpoint_enabled = 3;

  // The fully qualified domain name for the custom endpoint.
  // Only used when `custom_endpoint_enabled` is true.
  string custom_endpoint = 4;

  // ACM certificate ARN for the custom endpoint. Must be a valid certificate
  // covering the custom_endpoint FQDN.
  // Only used when `custom_endpoint_enabled` is true.
  dev.planton.shared.foreignkey.v1.StringValueOrRef custom_endpoint_certificate_arn = 5 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsCertManagerCert,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.cert_arn"
  ];

  // ---------------------------------------------------------------------------
  // CEL validations
  // ---------------------------------------------------------------------------

  // custom_endpoint requires custom_endpoint_enabled.
  option (buf.validate.message).cel = {
    id: "custom_endpoint_requires_enabled"
    message: "custom_endpoint requires custom_endpoint_enabled to be true"
    expression: "this.custom_endpoint == '' || this.custom_endpoint_enabled"
  };

  // certificate_arn requires custom_endpoint_enabled.
  option (buf.validate.message).cel = {
    id: "cert_requires_custom_enabled"
    message: "custom_endpoint_certificate_arn requires custom_endpoint_enabled to be true"
    expression: "!has(this.custom_endpoint_certificate_arn) || this.custom_endpoint_enabled"
  };

  // Literal values must be certificate ARNs (the provider validates ValidARN
  // at plan time); references resolve at deploy time and are exempt.
  option (buf.validate.message).cel = {
    id: "cert_arn_format"
    message: "custom_endpoint_certificate_arn literal value must be an ACM certificate ARN (arn:...)"
    expression: "!has(this.custom_endpoint_certificate_arn) || this.custom_endpoint_certificate_arn.value == '' || this.custom_endpoint_certificate_arn.value.startsWith('arn:')"
  };
}

// AwsOpenSearchDomainAdvancedSecurityOptions configures fine-grained access control
// (FGAC) for the domain. FGAC enables internal user database authentication,
// IAM-based authentication, JWT bearer authentication, and role-based index-level
// permissions.
//
// Once enabled, FGAC cannot be disabled without recreating the domain.
message AwsOpenSearchDomainAdvancedSecurityOptions {
  // Enable fine-grained access control. ForceNew if disabling (cannot disable
  // once enabled without domain recreation).
  bool enabled = 1;

  // Enable the internal user database. When true, you can create users and roles
  // directly in OpenSearch Dashboards. When false, use IAM or SAML for authentication.
  bool internal_user_database_enabled = 2;

  // Allow anonymous (unauthenticated) requests while FGAC is enabled -- roles
  // mapped to the anonymous backend decide what such requests may do. Can only
  // be enabled at the moment FGAC itself is first enabled on the domain.
  bool anonymous_auth_enabled = 3;

  // IAM entity ARN (user or role) designated as the master user. The master user
  // has full access to the cluster, indices, and OpenSearch Dashboards.
  // Mutually exclusive with master_user_name/master_user_password.
  dev.planton.shared.foreignkey.v1.StringValueOrRef master_user_arn = 4 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsIamRole,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.role_arn"
  ];

  // Username for the internal user database master user.
  // Mutually exclusive with master_user_arn.
  string master_user_name = 5;

  // Password for the internal user database master user. Must be at least 8
  // characters with uppercase, lowercase, digit, and special character.
  // Mutually exclusive with master_user_arn.
  dev.planton.shared.foreignkey.v1.StringValueOrRef master_user_password = 6 [(dev.planton.shared.options.sensitive) = true];

  // JWT bearer-token authentication: clients present tokens signed by an
  // external identity provider (validated against jwks_url or public_key).
  // Requires OpenSearch 2.11+.
  AwsOpenSearchDomainJwtOptions jwt_options = 7;

  // ---------------------------------------------------------------------------
  // CEL validations
  // ---------------------------------------------------------------------------

  // internal_user_database_enabled requires enabled.
  option (buf.validate.message).cel = {
    id: "internal_db_requires_fgac"
    message: "internal_user_database_enabled requires advanced security (enabled) to be true"
    expression: "!this.internal_user_database_enabled || this.enabled"
  };

  // anonymous_auth_enabled requires enabled.
  option (buf.validate.message).cel = {
    id: "anonymous_auth_requires_fgac"
    message: "anonymous_auth_enabled requires advanced security (enabled) to be true"
    expression: "!this.anonymous_auth_enabled || this.enabled"
  };

  // master_user_arn and master_user_name are mutually exclusive.
  option (buf.validate.message).cel = {
    id: "master_user_mutual_exclusion"
    message: "master_user_arn and master_user_name/master_user_password are mutually exclusive; use IAM-based OR internal user database authentication, not both"
    expression: "!(has(this.master_user_arn) && this.master_user_name != '')"
  };

  // When enabled, at least one master user method must be configured.
  option (buf.validate.message).cel = {
    id: "master_user_required_when_enabled"
    message: "when advanced security is enabled, provide either master_user_arn (IAM) or master_user_name + master_user_password (internal user database)"
    expression: "!this.enabled || has(this.master_user_arn) || this.master_user_name != ''"
  };

  // master_user_password requires master_user_name.
  option (buf.validate.message).cel = {
    id: "password_requires_username"
    message: "master_user_password requires master_user_name to be set"
    expression: "!has(this.master_user_password) || this.master_user_name != ''"
  };

  // master_user_name requires enabled.
  option (buf.validate.message).cel = {
    id: "master_user_name_requires_fgac"
    message: "master_user_name requires advanced security (enabled) to be true"
    expression: "this.master_user_name == '' || this.enabled"
  };

  // jwt_options requires enabled.
  option (buf.validate.message).cel = {
    id: "jwt_requires_fgac"
    message: "jwt_options requires advanced security (enabled) to be true"
    expression: "!has(this.jwt_options) || this.enabled"
  };

  // Literal values must be IAM ARNs (the provider validates ValidARN at
  // plan time); references resolve at deploy time and are exempt.
  option (buf.validate.message).cel = {
    id: "master_user_arn_format"
    message: "master_user_arn literal value must be an IAM user or role ARN (arn:...)"
    expression: "!has(this.master_user_arn) || this.master_user_arn.value == '' || this.master_user_arn.value.startsWith('arn:')"
  };
}

// AwsOpenSearchDomainJwtOptions configures JWT bearer-token authentication under
// fine-grained access control. Tokens are validated against a JWKS endpoint or a
// static public key -- provide at least one when enabling.
message AwsOpenSearchDomainJwtOptions {
  // Whether JWT authentication is active.
  bool enabled = 1;

  // URL of the identity provider's JSON Web Key Set used to validate token
  // signatures (e.g., "https://idp.example.com/.well-known/jwks.json").
  // Provide jwks_url or public_key (or both).
  string jwks_url = 2 [(buf.validate.field).string.max_len = 2048];

  // PEM-encoded public key used to validate token signatures. An alternative to
  // jwks_url for providers without a JWKS endpoint. The key material is public
  // by definition -- it verifies signatures, it cannot create them.
  string public_key = 3;

  // The token claim that carries the user's roles/groups. Example: "roles".
  // Up to 64 characters.
  string roles_key = 4 [(buf.validate.field).string.max_len = 64];

  // The token claim that identifies the user. Example: "sub", "email".
  // Up to 64 characters.
  string subject_key = 5 [(buf.validate.field).string.max_len = 64];

  // ---------------------------------------------------------------------------
  // CEL validations
  // ---------------------------------------------------------------------------

  // A validation source is required whenever the block is configured (not
  // just when enabled) -- the provider enforces at-least-one-of on the block
  // itself, and both engines send the block whenever it is present.
  option (buf.validate.message).cel = {
    id: "jwt_validation_source_required"
    message: "provide jwks_url or public_key when jwt_options is configured"
    expression: "this.jwks_url != '' || this.public_key != ''"
  };
}

// AwsOpenSearchDomainCognitoOptions configures Amazon Cognito authentication for
// OpenSearch Dashboards. Requires an existing Cognito user pool (sign-in), a
// Cognito identity pool (AWS credentials for authenticated users), and an IAM
// role that grants the service permission to configure both.
message AwsOpenSearchDomainCognitoOptions {
  // Whether Cognito authentication for Dashboards is active.
  bool enabled = 1;

  // The Cognito user pool users sign in through.
  dev.planton.shared.foreignkey.v1.StringValueOrRef user_pool_id = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsCognitoUserPool,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.user_pool_id"
  ];

  // The Cognito identity pool that exchanges user-pool sign-ins for AWS
  // credentials. Identity pools have no Planton kind; provide the raw ID
  // (format: "<region>:<uuid>").
  string identity_pool_id = 3;

  // IAM role that allows OpenSearch Service to configure the user and identity
  // pools (typically carrying the AmazonOpenSearchServiceCognitoAccess policy).
  dev.planton.shared.foreignkey.v1.StringValueOrRef role_arn = 4 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsIamRole,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.role_arn"
  ];

  // ---------------------------------------------------------------------------
  // CEL validations
  // ---------------------------------------------------------------------------

  // When enabled, all three integration inputs are required.
  option (buf.validate.message).cel = {
    id: "cognito_inputs_required_when_enabled"
    message: "user_pool_id, identity_pool_id, and role_arn are required when Cognito authentication is enabled"
    expression: "!this.enabled || (has(this.user_pool_id) && this.identity_pool_id != '' && has(this.role_arn))"
  };
}

// AwsOpenSearchDomainAutoTuneOptions configures AWS Auto-Tune. Auto-Tune applies
// two classes of change: non-disruptive JVM tuning applied immediately, and
// blue/green optimizations applied during a maintenance window or the domain's
// off-peak window.
message AwsOpenSearchDomainAutoTuneOptions {
  // Auto-Tune state. "ENABLED" or "DISABLED".
  string desired_state = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "ENABLED",
        "DISABLED"
      ]
    }
  ];

  // Recurring windows during which Auto-Tune may apply blue/green optimizations.
  // Ignored when use_off_peak_window is true (the off-peak window is used
  // instead).
  repeated AwsOpenSearchDomainAutoTuneMaintenanceSchedule maintenance_schedules = 2;

  // What happens to Auto-Tune's applied changes when Auto-Tune is later
  // disabled: "NO_ROLLBACK" (keep the tuned settings) or "DEFAULT_ROLLBACK"
  // (revert to defaults -- requires a maintenance schedule to perform the
  // rollback in).
  string rollback_on_disable = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "NO_ROLLBACK",
        "DEFAULT_ROLLBACK"
      ]
    }
  ];

  // Schedule blue/green optimizations inside the domain's off-peak window
  // instead of explicit maintenance schedules.
  bool use_off_peak_window = 4;

  // ---------------------------------------------------------------------------
  // CEL validations
  // ---------------------------------------------------------------------------

  // Explicit schedules and the off-peak window are alternative mechanisms.
  option (buf.validate.message).cel = {
    id: "schedules_xor_off_peak"
    message: "maintenance_schedules and use_off_peak_window are mutually exclusive scheduling mechanisms"
    expression: "!(this.maintenance_schedules.size() > 0 && this.use_off_peak_window)"
  };
}

// AwsOpenSearchDomainAutoTuneMaintenanceSchedule defines one recurring Auto-Tune
// maintenance window.
message AwsOpenSearchDomainAutoTuneMaintenanceSchedule {
  // When the first window opens, as an RFC3339 timestamp.
  // Example: "2026-08-01T03:00:00Z".
  string start_at = 1 [(buf.validate.field).required = true];

  // Length of each window, in hours (AWS's only supported duration unit).
  int32 duration_hours = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32.gte = 1
  ];

  // Recurrence as a cron expression. Example: "cron(0 3 ? * SUN *)" for
  // Sundays at 03:00 UTC.
  string cron_expression_for_recurrence = 3 [(buf.validate.field).required = true];
}

// AwsOpenSearchDomainOffPeakWindowOptions configures the domain's daily 10-hour
// low-traffic window used for service software updates and (optionally)
// Auto-Tune blue/green optimizations.
message AwsOpenSearchDomainOffPeakWindowOptions {
  // Whether the off-peak window feature is active. Defaults to TRUE -- AWS
  // enables the window on every new domain and requires it enabled at create
  // time; false is only meaningful as a later update (AWS may still reject
  // disabling it while features depend on the window).
  optional bool enabled = 1 [(dev.planton.shared.options.default) = "true"];

  // Hour (0-23, local time) when the 10-hour window opens. AWS defaults to
  // 22 (10:00 PM) when not configured.
  optional int32 window_start_hour = 2 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 23
  ];

  // Minute (0-59) past the hour when the window opens.
  optional int32 window_start_minute = 3 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 59
  ];
}

// AwsOpenSearchDomainAimlOptions configures the domain's AI/ML capabilities.
// Maps to the provider's aiml_options block with each single-field wrapper
// flattened.
message AwsOpenSearchDomainAimlOptions {
  // Natural-language query generation in OpenSearch Dashboards ("ENABLED" or
  // "DISABLED"): users describe a query in plain language and Dashboards
  // generates the DSL. Requires OpenSearch 2.13+.
  string natural_language_query_generation_desired_state = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "ENABLED",
        "DISABLED"
      ]
    }
  ];

  // Enable the S3 vectors engine: vector indexes stored on S3-backed storage
  // for large, cost-efficient vector search corpora.
  bool s3_vectors_engine_enabled = 2;

  // Enable GPU-accelerated (serverless) vector search acceleration on the
  // domain.
  bool serverless_vector_acceleration_enabled = 3;
}

// AwsOpenSearchDomainIdentityCenterOptions configures AWS IAM Identity Center
// integration: workforce users access Dashboards and the domain APIs with their
// Identity Center identity.
message AwsOpenSearchDomainIdentityCenterOptions {
  // Whether Identity Center API access is active.
  bool enabled_api_access = 1;

  // ARN of the IAM Identity Center instance to integrate with.
  string identity_center_instance_arn = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^arn:"
  ];

  // The Identity Center attribute that carries a user's groups for role
  // mapping: "GroupName" or "GroupId".
  string roles_key = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "GroupName",
        "GroupId"
      ]
    }
  ];

  // The Identity Center attribute that identifies a user: "UserName", "UserId",
  // or "Email".
  string subject_key = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      in: [
        "UserName",
        "UserId",
        "Email"
      ]
    }
  ];

  // ---------------------------------------------------------------------------
  // CEL validations
  // ---------------------------------------------------------------------------

  // The instance ARN is required when API access is enabled.
  option (buf.validate.message).cel = {
    id: "instance_arn_required_when_enabled"
    message: "identity_center_instance_arn is required when enabled_api_access is true"
    expression: "!this.enabled_api_access || this.identity_center_instance_arn != ''"
  };
}

// AwsOpenSearchDomainLogPublishingOption configures delivery of a specific log type
// to a CloudWatch Logs log group for monitoring, troubleshooting, and auditing.
message AwsOpenSearchDomainLogPublishingOption {
  // Type of log to publish. Values:
  // - "INDEX_SLOW_LOGS" — indexing operations exceeding the slow log threshold
  // - "SEARCH_SLOW_LOGS" — search queries exceeding the slow log threshold
  // - "ES_APPLICATION_LOGS" — OpenSearch application and error logs
  // - "AUDIT_LOGS" — fine-grained access control audit trail (requires FGAC enabled)
  string log_type = 1 [(buf.validate.field).required = true];

  // CloudWatch Logs log group ARN where logs are published.
  dev.planton.shared.foreignkey.v1.StringValueOrRef cloudwatch_log_group_arn = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsCloudwatchLogGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.log_group_arn"
  ];

  // Literal values must be log group ARNs (the provider validates ValidARN
  // at plan time); references resolve at deploy time and are exempt.
  option (buf.validate.message).cel = {
    id: "log_group_arn_format"
    message: "cloudwatch_log_group_arn literal value must be a CloudWatch log group ARN (arn:...)"
    expression: "!has(this.cloudwatch_log_group_arn) || this.cloudwatch_log_group_arn.value == '' || this.cloudwatch_log_group_arn.value.startsWith('arn:')"
  };

  // Whether this log publishing option is active. Default: true.
  // Set to false to temporarily disable publishing without removing the configuration.
  optional bool enabled = 3 [(dev.planton.shared.options.default) = "true"];

  // ---------------------------------------------------------------------------
  // CEL validations
  // ---------------------------------------------------------------------------

  // log_type valid values.
  option (buf.validate.message).cel = {
    id: "log_type_valid"
    message: "log_type must be 'INDEX_SLOW_LOGS', 'SEARCH_SLOW_LOGS', 'ES_APPLICATION_LOGS', or 'AUDIT_LOGS'"
    expression: "this.log_type in ['INDEX_SLOW_LOGS', 'SEARCH_SLOW_LOGS', 'ES_APPLICATION_LOGS', 'AUDIT_LOGS']"
  };
}

// AwsOpenSearchDomainSamlOptions configures SAML 2.0 authentication for
// OpenSearch Dashboards under fine-grained access control. Managed as its
// own provider resource alongside the domain -- removing the block turns
// SAML sign-in off without touching the domain.
message AwsOpenSearchDomainSamlOptions {
  // The identity provider's entity ID (from the IdP metadata).
  // Example: "https://idp.example.com/saml/metadata".
  string idp_entity_id = 1 [(buf.validate.field).string.min_len = 1];

  // The IdP's SAML metadata document, as an XML string (typically downloaded
  // from the IdP's metadata endpoint).
  string idp_metadata_content = 2 [(buf.validate.field).string.min_len = 1];

  // The SAML backend role granted master (admin) access in Dashboards --
  // mutually exclusive with master_user_name. Empty grants no SAML
  // principal master access (map roles inside Dashboards instead).
  string master_backend_role = 3;

  // The SAML username granted master (admin) access in Dashboards --
  // mutually exclusive with master_backend_role.
  string master_user_name = 4 [(dev.planton.shared.options.sensitive) = true];

  // The SAML assertion attribute that carries the user's roles/groups.
  // Empty uses the IdP's roles attribute conventions.
  string roles_key = 5;

  // The SAML assertion attribute that identifies the user. Empty uses
  // NameID.
  string subject_key = 6;

  // Dashboards session lifetime in minutes, 1-1440. 0 keeps the AWS
  // default (60).
  int32 session_timeout_minutes = 7 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 1440
  ];

  option (buf.validate.message).cel = {
    id: "one_master_principal"
    message: "master_backend_role and master_user_name are mutually exclusive"
    expression: "this.master_backend_role == '' || this.master_user_name == ''"
  };
}
