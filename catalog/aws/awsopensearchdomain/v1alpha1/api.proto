syntax = "proto3";

package dev.planton.aws.awsopensearchdomain.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsopensearchdomain/v1alpha1/outputs.proto";
import "catalog/aws/awsopensearchdomain/v1alpha1/spec.proto";
import "shared/metadata.proto";

// aws-opensearch-domain
message AwsOpenSearchDomain {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsOpenSearchDomain'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsOpenSearchDomainSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsOpenSearchDomainStatus status = 5;
}

// aws-opensearch-domain status
message AwsOpenSearchDomainStatus {
  //outputs
  AwsOpenSearchDomainOutputs outputs = 1;
}
