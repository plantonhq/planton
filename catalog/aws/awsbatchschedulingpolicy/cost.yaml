# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: awsbatchschedulingpolicy
spec:
  billing_model: free
  free_tier: AWS Batch itself carries no charge -- AWS's own pricing statement is that there is no additional charge for Batch and you pay only for the resources that run your workloads. A fair-share scheduling policy is a rulebook inside that free control plane; creating it, tuning its dials, or attaching it to many queues meters nothing anywhere.
  notes: "No field of this spec buys anything: compute_reservation, share_decay_seconds, and the share_distributions weights only decide WHICH submitter's jobs dispatch first when a queue's capacity is contested -- they reorder consumption of capacity that is already paid for, they never add capacity. The real spend lives on the AwsBatchComputeEnvironment kinds behind the queues that reference this policy (EC2 instances, Fargate vCPU-seconds and GB-seconds, billed on their own meters as their own catalog kinds). One second-order cost note: compute_reservation deliberately holds back a slice of queue capacity for inactive shares, so environments with a nonzero min_vcpus floor can sit partially idle by design -- a fairness-versus-utilization trade the queue's owners make, still billed on the compute environment either way."
