# Full fair-share surface: every dial set -- weighted shares (including a
# wildcard prefix share), usage decay, and new-submitter headroom. The policy
# is a dependency-free leaf that creates and deletes in seconds.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsBatchSchedulingPolicy
metadata:
  name: planton-oss-e2e-awsbatsp
  id: planton-oss-e2e-awsbatsp
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsbatchschedulingpolicy
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  computeReservation: 10
  shareDecaySeconds: 3600
  shareDistributions:
    - shareIdentifier: teamA
      weightFactor: 0.5
    - shareIdentifier: teamB
      weightFactor: 1
    - shareIdentifier: adhoc*
      weightFactor: 2
