syntax = "proto3";

package dev.planton.aws.awsredshiftcluster.v1alpha1;

// AwsRedshiftClusterOutputs captures the observable identifiers and
// connection endpoints of the Redshift cluster after deployment.
message AwsRedshiftClusterOutputs {
  // The cluster identifier (e.g. "analytics-warehouse").
  string cluster_identifier = 1;

  // The Amazon Resource Name of the cluster, for IAM policies and
  // cross-service references.
  string cluster_arn = 2;

  // The namespace ARN of the cluster, used by Redshift data sharing and
  // the Redshift Data API.
  string cluster_namespace_arn = 3;

  // The connection endpoint in "address:port" form, for SQL client
  // connection strings.
  string endpoint = 4;

  // The DNS hostname of the cluster's leader node (without port), for
  // building connection strings and DNS alias records.
  string dns_name = 5;

  // The name of the first database in the cluster. Populated only when
  // the spec set database_name: with it omitted, AWS creates its
  // documented default initial database ("dev") but DescribeClusters
  // echoes no name back, so both engines surface an empty string here
  // (live-verified) -- clients relying on the default should connect to
  // "dev".
  string database_name = 6;

  // The port the cluster accepts connections on.
  int32 port = 7;

  // The name of the Redshift subnet group the cluster runs in
  // (module-managed from subnet_ids or the referenced existing group).
  string subnet_group_name = 8;

  // The name of the cluster parameter group in use (module-managed from
  // inline parameters or the referenced existing group).
  string parameter_group_name = 9;

  // The ARN of the AWS-managed admin-password secret in Secrets
  // Manager. Populated only when manage_master_password is true -- the
  // handle applications use to fetch credentials at runtime.
  string master_password_secret_arn = 10;

  // The private DNS addresses of the cluster's managed VPC endpoints,
  // keyed by endpoint name (spec.endpoint_accesses entries) -- what
  // consumers inside the endpoint's VPC put in connection strings.
  map<string, string> endpoint_access_addresses = 11;

  // The AWS-generated usage-limit IDs, keyed exactly as the module keys
  // each limit: "<feature_type>/<limit_type>/<period>", with an unset
  // period rendered as "monthly" (the AWS default). These are the
  // handles `aws redshift delete-usage-limit` and state import take;
  // AWS generates them at creation time.
  map<string, string> usage_limit_ids = 12;
}
