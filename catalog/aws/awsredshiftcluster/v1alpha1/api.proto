syntax = "proto3";

package dev.planton.aws.awsredshiftcluster.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsredshiftcluster/v1alpha1/outputs.proto";
import "catalog/aws/awsredshiftcluster/v1alpha1/spec.proto";
import "shared/metadata.proto";

// aws-redshift-cluster
message AwsRedshiftCluster {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AwsRedshiftCluster'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AwsRedshiftClusterSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AwsRedshiftClusterStatus status = 5;
}

// aws-redshift-cluster status
message AwsRedshiftClusterStatus {
  //outputs
  AwsRedshiftClusterOutputs outputs = 1;
}
