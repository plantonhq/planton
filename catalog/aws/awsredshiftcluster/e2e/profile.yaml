apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsredshiftcluster
spec:
  # A Redshift cluster under live E2E: the harness deploys the AwsVpc +
  # two-AZ AwsSubnet prerequisites (the Redshift subnet group spans two
  # AZs), runs deploy -> Redshift DescribeClusters verify -> destroy ->
  # verify-destroyed on both provisioners. The scenario is a single
  # ra3.large node (the smallest ORDERABLE class -- the legacy dc2 family
  # is no longer creatable for new clusters) with the AWS-managed admin
  # password: it proves the managed-credential path and the folded
  # subnet-group materialization on the cheapest footprint. Cluster
  # provisioning dominates the runtime at roughly five to ten minutes
  # each way per engine.
  #
  # PROVEN 2026-08-12 (live, both engines, zero defects): all eight
  # phases green per engine (~9-10 min/lane; the ra3.large reached
  # available in ~2 min). The depth-closure arms API-evidenced per
  # engine window with distinct per-instance discriminators --
  # DescribeScheduledActions echoed State=DISABLED (the
  # scheduler.redshift.amazonaws.com trust accepted at create via the
  # consumer-scoped AwsIamRole prerequisite, first try on both
  # engines), DescribeEndpointAccess echoed Active with distinct
  # AWS-generated addresses surfacing in each engine's
  # endpoint_access_addresses output keyed "e2e-self-vpc", and the
  # usage-limit IDs (distinct per engine) surfaced in usage_limit_ids
  # keyed exactly "spectrum/data-scanned/monthly". One truth landed in
  # passing: with database_name omitted, DescribeClusters echoes no
  # name back, so the database_name output is empty on both engines
  # (AWS's actual default database is "dev" -- taught on the outputs
  # contract). Offline-proven arms with named unblocks stand: endpoint
  # AUTHORIZATION (needs a second AWS account) and the schedule
  # ASSOCIATION (needs the future AwsRedshiftSnapshotSchedule kind).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 60
