# Redshift managed-password scenario: the recommended default warehouse
# shape. Exercises the AWS-managed admin password (no secret in the
# manifest or state; the secret ARN surfaces as an output) on a
# single-node ra3.large cluster -- the smallest orderable footprint.
# cluster_version is deliberately unpinned so the scenario rides the AWS
# default and never goes stale. The subnet pair prerequisite satisfies
# the two-AZ subnet group requirement; no security groups are given, so
# AWS attaches the VPC's default group (the documented default this
# kind preserves). skipFinalSnapshot keeps the destroy phase
# unconditional. Full metadata is supplied for tagging/orphan cleanup.
#
# Free governance arms (depth-closure additions):
# - a Spectrum usage limit (a cap is configuration, never a charge);
# - a DISABLED scheduled pause action -- create-time proof of AWS's
#   scheduler trust contract (the consumer-scoped AwsIamRole prerequisite
#   ships the scheduler.redshift.amazonaws.com trust; a disabled action
#   never fires, so nothing pauses mid-lane and nothing bills);
# - a managed VPC endpoint reusing the cluster's own subnet group (the
#   entry omits subnetGroupName -- the documented fallback; its private
#   address must surface in the endpoint_access_addresses output map).
# Offline-proven arms with named unblocks (never silent): endpoint
# AUTHORIZATIONS need a second AWS account; the snapshot-schedule
# association needs the future AwsRedshiftSnapshotSchedule kind.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsRedshiftCluster
metadata:
  name: planton-oss-e2e-redshift-mmp
  id: planton-oss-e2e-redshift-mmp
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsredshiftcluster
  annotations:
    planton.dev/e2e: "true"
    # Composes the consumer-scoped scheduler-trusting role
    # (e2e/prerequisites/awsiamrole.yaml) ahead of this manifest.
    planton.dev/e2e-prerequisites: "AwsIamRole"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-b
        fieldPath: status.outputs.subnet_id
  nodeType: ra3.large
  masterUsername: e2eadmin
  manageMasterPassword: true
  skipFinalSnapshot: true
  usageLimits:
    - featureType: spectrum
      limitType: data-scanned
      amount: 5
  scheduledActions:
    - name: planton-oss-e2e-redshift-mmp-pause
      # Disabled by design: trust validation happens at create; the
      # schedule never fires, so the lane's cluster is never paused.
      disabled: true
      schedule: cron(0 4 * * ? *)
      iamRoleArn:
        valueFrom:
          kind: AwsIamRole
          name: planton-oss-e2e-redshift-scheduler-role
          fieldPath: status.outputs.role_arn
      pauseCluster: true
  endpointAccesses:
    - endpointName: e2e-self-vpc
