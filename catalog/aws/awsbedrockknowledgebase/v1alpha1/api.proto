syntax = "proto3";

package dev.planton.aws.awsbedrockknowledgebase.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsbedrockknowledgebase/v1alpha1/outputs.proto";
import "catalog/aws/awsbedrockknowledgebase/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsBedrockKnowledgeBase {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsBedrockKnowledgeBase'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsBedrockKnowledgeBaseSpec spec = 4 [(buf.validate.field).required = true];
  AwsBedrockKnowledgeBaseStatus status = 5;
}

message AwsBedrockKnowledgeBaseStatus {
  AwsBedrockKnowledgeBaseOutputs outputs = 1;
}
