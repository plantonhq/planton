apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awscodebuildproject
spec:
  # A CodeBuild project under live E2E: one lane, because the project is a
  # metadata-only control-plane resource -- creating it provisions nothing
  # until a build starts, and the lane never starts a build.
  #
  # - full-surface: NO_SOURCE + inline buildspec (standalone -- no
  #   repository, connection, or bucket), environment variables incl. an SSM
  #   Parameter Store reference, the non-default kernel-6 host kernel
  #   (verify BatchGetProjects reports hostKernel back -- if AWS rejects
  #   the explicit selection for this image/region, trim the arm and record
  #   the deferral), governance dials (timeouts, concurrency cap, automatic
  #   retry), and CloudWatch logging via the managed default log group. The
  #   service role resolves from the shared IAM role fixture (registry
  #   prerequisite).
  #
  # Excluded from the live lane with reasons (proven by spec tests + the
  # offline plan gate against e2e/manifest.yaml, which exercises every
  # one of these arms):
  # - webhook (all shapes incl. scope_configuration and
  #   pull_request_build_policy): registering a webhook requires a real
  #   source-provider connection/credential on the account (the ACM
  #   requested-cert class).
  # - source auth / CodeConnections: the connection object needs a manual
  #   console OAuth handshake to become usable.
  # - badge_enabled + project_visibility PUBLIC_READ: repository-source and
  #   public-exposure surfaces; the badge needs a webhook-capable source.
  # - vpc_config / file_system_locations / docker_server: would add
  #   VPC+EFS fixtures to prove pass-through wiring the plan gate covers.
  # - build_batch_config: batch is only observable by starting builds.
  # - resource_policy: AWS validates policy principals at PutResourcePolicy,
  #   and the e2e account has no second account to grant (the SES
  #   identity-policy class).
  #
  # Verification is BatchGetProjects keyed on project_name (a deleted
  # project simply disappears from the response; deletion is synchronous).
  #
  # Observed live timings (2026-07-09): Pulumi 15m59s total (first lane of
  # the run -- 14m12s was IAM-fixture warm-up incl. fresh plugin download;
  # the project deploy itself took 14s) / Terraform 5m20s total (deploy
  # 10s). The project resource is near-instant either way; the fixture
  # chain dominates.
  #
  # Proven 2026-08-12, both engines, all eight phases (Pulumi 7m45s /
  # Terraform 7m34s; the project deploy itself 10s/26s). The host_kernel
  # arm's first live proof: AWS ACCEPTED explicit LINUX_KERNEL_6 on
  # LINUX_CONTAINER/amazonlinux2-standard:5.0 in us-west-2, and
  # BatchGetProjects (pinned Go SDK — the local aws-cli's OUTPUT model
  # drops hostKernel while its input model knows it) echoed it per
  # engine, alongside the governance dials (autoRetryLimit,
  # concurrentBuildLimit). The three converged Pulumi pass-through sends
  # rode the same lane clean.
  #
  # 2026-08-29 (post-proof surface change, offline-proven): s3_logs split
  # its compound "bucket/prefix" location string into a reference-able
  # `bucket` (AwsS3Bucket FK) plus a required `prefix`, with both engines
  # composing the provider's single location argument -- reference-mode
  # had been structurally unable to produce the "bucket/prefix" form AWS
  # requires. Proven offline: spec/CEL suite, both engines' module verify
  # conformance, and a tofu plan rendering the composed
  # "my-log-bucket/build-logs". The s3_logs arm is already excluded from
  # the live lane (bucket fixture class), so the live proof stands; the
  # next lane that touches this kind inherits the new shape.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
