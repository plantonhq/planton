# Minimal CodeBuild project fixture for downstream consumers (the
# CodePipeline chain's Build action references it by name). NO_SOURCE with an
# inline buildspec keeps the fixture standalone: no repository, no
# connection, no artifact bucket. The service role resolves from the shared
# IAM role fixture (AwsCodeBuildProject's registry prerequisite).
apiVersion: aws.planton.dev/v1alpha1
kind: AwsCodeBuildProject
metadata:
  name: planton-oss-e2e-awscodebuild-prereq
  id: planton-oss-e2e-awscodebuild-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awscodebuildproject
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  source:
    type: NO_SOURCE
    buildspec: |
      version: 0.2
      phases:
        build:
          commands:
            - echo "planton e2e fixture build"
  environment:
    type: LINUX_CONTAINER
    computeType: BUILD_GENERAL1_SMALL
    image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
  artifacts:
    type: NO_ARTIFACTS
  serviceRole:
    valueFrom:
      kind: AwsIamRole
      name: planton-oss-e2e-codebuild-service-role
      fieldPath: status.outputs.role_arn
  description: Planton E2E CodeBuild fixture project
