# AwsCodeBuildProject live scenario: the deepest shape the e2e account can
# prove without external dependencies. NO_SOURCE with an inline buildspec
# needs no repository or connection; the environment carries variables, the
# non-default kernel-6 host kernel (free create-time config on
# LINUX_CONTAINER -- verify BatchGetProjects reports it back), and the
# governance dials (timeouts, concurrency cap, automatic retry); logging
# exercises the CloudWatch arm with CodeBuild's managed default log group.
# The project is a metadata-only resource -- no build ever starts, so the
# lane is the create/verify/destroy cycle alone.
#
# Deliberately not exercised live (proven by spec tests + the offline plan
# gate against e2e/manifest.yaml -- see the profile for reasons):
# webhook (needs a real source-provider connection), source auth
# (CodeConnections handshake), badge/public visibility (repository-source
# and public-exposure surfaces), VPC/EFS/batch/docker-server arms, and the
# resource policy (AWS validates cross-account principals at Put time).
apiVersion: aws.planton.dev/v1alpha1
kind: AwsCodeBuildProject
metadata:
  name: planton-oss-e2e-awscodebuild-full
  id: planton-oss-e2e-awscodebuild-full
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awscodebuildproject
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  source:
    type: NO_SOURCE
    buildspec: |
      version: 0.2
      phases:
        build:
          commands:
            - echo "planton e2e build"
  environment:
    type: LINUX_CONTAINER
    computeType: BUILD_GENERAL1_SMALL
    image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
    # The non-default kernel: free at create time; if AWS rejects the
    # explicit kernel-6 selection for this image/region, trim this arm and
    # record the deferral -- a fixture decision, not a module defect.
    hostKernel: LINUX_KERNEL_6
    environmentVariables:
      - name: STAGE
        value: e2e
      - name: SSM_EXAMPLE
        value: /planton/e2e/example
        type: PARAMETER_STORE
  artifacts:
    type: NO_ARTIFACTS
  serviceRole:
    valueFrom:
      kind: AwsIamRole
      name: planton-oss-e2e-codebuild-service-role
      fieldPath: status.outputs.role_arn
  description: Planton E2E CodeBuild project
  buildTimeout: 30
  queuedTimeout: 60
  concurrentBuildLimit: 1
  autoRetryLimit: 1
  logsConfig:
    cloudwatchLogs:
      status: ENABLED
