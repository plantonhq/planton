syntax = "proto3";

package dev.planton.aws.awscodebuildproject.v1alpha1;

import "catalog/aws/awscodebuildproject/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsCodeBuildProjectIacInput is the input for the IaC modules that
// deploy the CodeBuild project and optional webhook.
message AwsCodeBuildProjectIacInput {
  // target is the AwsCodeBuildProject resource to deploy.
  AwsCodeBuildProject target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
