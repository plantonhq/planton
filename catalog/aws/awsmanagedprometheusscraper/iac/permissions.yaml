# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awsmanagedprometheusscraper
spec:
  aws:
    statements:
      - sid: CreateScraper
        actions:
          - aps:CreateScraper
        resources:
          - arn:aws:eks:*:*:cluster/*
          - arn:aws:aps:*:*:workspace/*
        provenance: derived
        notes: CreateScraper authorizes against the SOURCE and DESTINATION, not the scraper (its id does not exist yet) -- the service reference scopes it to the EKS cluster and AMP workspace resource types. VPC sources and CloudWatch-dataset destinations have no scopable ARN on this action, so those arms ride the same grant.
      - sid: ManageScraper
        actions:
          - aps:DescribeScraper
          - aps:UpdateScraper
          - aps:DeleteScraper
        resources:
          - arn:aws:aps:*:*:scraper/*
          - arn:aws:aps:*:*:workspace/*
        provenance: derived
        notes: Covers aws_prometheus_scraper after create -- DescribeScraper on every plan/refresh and as the long create/delete waiter (creates run up to 30 minutes, deletes drain up to 20), UpdateScraper for in-place alias/destination/configuration changes (it also authorizes against the workspace ARN when the destination changes), DeleteScraper on destroy.
      - sid: ManageScraperLogging
        actions:
          - aps:UpdateScraperLoggingConfiguration
          - aps:DescribeScraperLoggingConfiguration
          - aps:DeleteScraperLoggingConfiguration
        resources:
          - arn:aws:aps:*:*:scraper/*
        provenance: derived
        notes: Needed only when logging is set -- covers aws_prometheus_scraper_logging_configuration (create and update both land on UpdateScraperLoggingConfiguration; the service reference lists no separate create action). All three scope to the scraper ARN.
      - sid: ResolveDefaultConfiguration
        actions:
          - aps:GetDefaultScraperConfiguration
        resources:
          - "*"
        provenance: derived
        notes: Needed only for EKS sources with scrape_configuration unset -- the modules resolve AWS's published default configuration at deploy time. NON-SCOPABLE per the service reference, so the wildcard is the narrowest possible scope.
      - sid: TagScraper
        actions:
          - aps:TagResource
          - aps:UntagResource
          - aps:ListTagsForResource
        resources:
          - arn:aws:aps:*:*:scraper/*
        provenance: derived
        notes: Tag-on-create plus later tag reconciliation and the tag read on every refresh, scoped to the scraper ARN per the service reference.
      - sid: CreateScraperServiceLinkedRole
        actions:
          - iam:CreateServiceLinkedRole
        resources:
          - arn:aws:iam::*:role/aws-service-role/scraper.aps.amazonaws.com/*
        provenance: derived
        notes: The account's FIRST scraper triggers automatic creation of the AWSServiceRoleForAmazonPrometheusScraper service-linked role the collector operates under; later scrapers reuse it. Scoped to the SLR path. For EKS sources the service also self-manages the cluster access entry it scrapes through -- that is service-side, not a runner grant.
