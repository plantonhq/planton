syntax = "proto3";

package dev.planton.aws.awsbackupframework.v1alpha1;

import "catalog/aws/awsbackupframework/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsBackupFrameworkIacInput is the input for the IaC modules that
// manage a Backup Audit Manager framework.
message AwsBackupFrameworkIacInput {
  // target is the AwsBackupFramework resource to deploy.
  AwsBackupFramework target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
