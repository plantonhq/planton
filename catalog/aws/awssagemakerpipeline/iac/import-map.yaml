apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awssagemakerpipeline
spec:
  # The pipeline imports by its bare name. NOTE: the S3 definition
  # location is never returned by the describe API (config-only fact in
  # the provider catalog) -- a post-import plan on the S3 form shows
  # only that block.
  values:
    - name: pipeline_name
      derivations:
        - from_output: pipeline_name
      where_to_find: >-
        SageMaker console -> Pipelines (the name), or
        `aws sagemaker list-pipelines` (PipelineName).
