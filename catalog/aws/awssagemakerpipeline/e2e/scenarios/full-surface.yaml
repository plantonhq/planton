# AwsSagemakerPipeline full-surface scenario: display metadata plus the
# pipeline-level parallelism cap on the inline-definition arm.
# Deliberately not live: the S3-location arm (needs a seeded definition
# object - unblock: a seeded-definition fixture in the shared bucket;
# note the arm is also import-invisible upstream: describe returns only
# the resolved definition) - offline-proven via e2e/manifest.yaml.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsSagemakerPipeline
metadata:
  name: planton-oss-e2e-awssgmpl-full
  id: planton-oss-e2e-awssgmpl-full
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awssagemakerpipeline
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsIamRole"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  displayName: planton-e2e-full-pipeline
  description: e2e full-surface pipeline
  roleArn:
    valueFrom:
      kind: AwsIamRole
      name: planton-oss-e2e-sagemaker-execution-role
      fieldPath: status.outputs.role_arn
  definition:
    Version: "2020-12-01"
    Metadata: {}
    Parameters: []
    Steps:
      - Name: NeverRun
        Type: Fail
        Arguments:
          ErrorMessage: e2e placeholder pipeline - executions are never started
  parallelismMaxSteps: 4
