apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awssagemakerpipeline
spec:
  # A pipeline under live E2E: two free, seconds-scale lanes (create
  # and delete are synchronous upstream - no waiters). AWS validates
  # the definition DAG server-side at create, so a green create IS the
  # definition-validity claim. Verification is DescribePipeline keyed
  # on pipeline_name (status Active) plus the display-name/parallelism
  # echoes on the full lane.
  #
  # Deliberately not exercised live: the S3-location definition arm
  # (needs a seeded definition object - unblock: a seeded-definition
  # fixture in the shared bucket; the arm is import-invisible upstream
  # and recorded config-only in the provider catalog) - offline-proven
  # via e2e/manifest.yaml.
  #
  # pending_proof: forged this session to the full offline bar -- Q36
  # proves it live.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
