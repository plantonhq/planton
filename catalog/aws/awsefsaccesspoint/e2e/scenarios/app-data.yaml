# Access point against the registry-prerequisite file system: enforced POSIX
# identity with secondary GIDs and an auto-created root directory (the
# creation_info path -- the directory does not pre-exist on the fresh fixture,
# so a successful create proves EFS materializes it with the declared
# ownership). The file system comes from the kind registry's
# AwsElasticFileSystem prerequisite.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsEfsAccessPoint
metadata:
  name: planton-oss-e2e-awsefsap
  id: planton-oss-e2e-awsefsap
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsefsaccesspoint
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  fileSystemId:
    valueFrom:
      kind: AwsElasticFileSystem
      name: planton-oss-e2e-awsefs-prereq
      fieldPath: status.outputs.file_system_id
  posixUser:
    uid: 1000
    gid: 1000
    secondaryGids:
      - 1001
      - 1002
  rootDirectory:
    path: /app-data
    creationInfo:
      ownerUid: 1000
      ownerGid: 1000
      permissions: "0755"
