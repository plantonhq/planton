# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsefsaccesspoint
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The access point stores no data of its own -- at-rest encryption is the parent AwsElasticFileSystem's create-time decision, and everything reached through the access point rests under that choice.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: The KMS key decision belongs to the parent file system at creation; this spec carries no key surface.
    - control_id: enc-in-transit
      status: not_applicable
      notes: TLS for NFS traffic is chosen at mount time by the client (the EFS mount helper's TLS option) or mandated by the parent file system's policy (its aws:SecureTransport condition) -- no field here can require or forbid encrypted transport.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: An access point is reachable only through the parent file system's mount targets, which are addresses inside VPC subnets -- EFS exposes no public endpoint for NFS traffic at any configuration.
    - control_id: restricted-ingress
      status: not_applicable
      notes: Inbound filtering is owned by the security groups on the parent file system's mount targets; the access point sits behind them with no network surface of its own.
    - control_id: edge-protection
      status: not_applicable
      notes: A file-protocol entry point carries no HTTP request surface -- web ACLs have nothing to attach to.
    - control_id: rbac
      status: configurable
      field_path: posix_user
      evidence:
        type: spec_default
        reference: Omitted, NFS clients keep whatever POSIX identity they claim -- root on the client is root on the share. Set, every file operation through this access point runs as the enforced uid/gid regardless of the client's claim, which is the access point's core least-privilege mechanism.
      notes: root_directory confines the visible tree to one subtree, completing the identity-plus-scope sandbox. Requiring workloads to come through this access point at all (an elasticfilesystem:AccessPointArn condition) is the parent file system's resource-policy surface, paired with IAM on the clients.
    - control_id: workload-identity
      status: not_applicable
      notes: The access point runs no workloads and holds no credentials. Whether NFS clients must authenticate with IAM identities is the parent file system's policy surface.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The client authentication posture -- plain NFS versus TLS-with-IAM -- is decided by the parent file system's policy, not by any field here.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: EFS offers no file-access audit trail at the access-point level; control-plane operations land in CloudTrail as account-level posture.
    - control_id: monitoring-integration
      status: not_applicable
      notes: EFS publishes its CloudWatch metrics per file system with no per-access-point dimension -- traffic through this access point appears in the parent's metrics.
    - control_id: backup-recovery
      status: not_applicable
      notes: The access point holds no data -- data lives on the parent file system, whose AWS Backup coverage is its own posture. The access point itself is declarative configuration re-creatable from the manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist at this level to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Availability follows the parent file system's mount-target layout (Regional or One Zone) -- the access point is a logical entry point with no zonal configuration of its own.
    - control_id: deletion-protection
      status: not_applicable
      notes: No deletion-protection flag exists for access points. Deleting one severs clients mounting through it while leaving every byte on the file system intact.
    - control_id: managed-patching
      status: not_applicable
      notes: A logical NFS entry point with no software of its own; the EFS service is fully managed.
