syntax = "proto3";

package dev.planton.aws.awsefsaccesspoint.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsefsaccesspoint/v1alpha1/outputs.proto";
import "catalog/aws/awsefsaccesspoint/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsEfsAccessPoint is the API envelope for an EFS access point — the
// application-specific entry point into an Elastic File System that enforces
// a POSIX identity and root directory.
message AwsEfsAccessPoint {
  // api-version must be set to "aws.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];

  // resource-kind for this resource, must be "AwsEfsAccessPoint".
  string kind = 2 [(buf.validate.field).string.const = "AwsEfsAccessPoint"];

  // metadata captures identifying information (name, org, environment,
  // labels) and must pass standard validations for resource naming.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec holds the desired configuration of the access point.
  AwsEfsAccessPointSpec spec = 4 [(buf.validate.field).required = true];

  // status holds post-deployment information.
  AwsEfsAccessPointStatus status = 5;
}

// AwsEfsAccessPointStatus describes the status of an EFS access point resource.
message AwsEfsAccessPointStatus {
  // outputs captures the observable values returned by Pulumi/Terraform
  // after provisioning.
  AwsEfsAccessPointOutputs outputs = 1;
}
