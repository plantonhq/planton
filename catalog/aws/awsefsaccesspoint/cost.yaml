# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: awsefsaccesspoint
spec:
  billing_model: free
  free_tier: An EFS access point has no meter -- the AWS price list for EFS (offer AmazonEFS) meters storage classes, throughput, and IA/Archive access, and contains no access-point SKU. Every file system supports up to a thousand access points, and creating them adds nothing to the bill.
  notes: "All spend belongs to the parent file system: the AwsElasticFileSystem component bills its storage classes, provisioned or elastic throughput, and tiering-access charges, and NFS traffic through an access point counts toward those meters exactly as a direct mount does. The posix_user and root_directory blocks are configuration stored in the EFS control plane at no charge -- including the directory EFS auto-creates from creation_info, which is simply a directory whose contents bill as ordinary file-system storage."
