# The production orders table: an uncovered kind with a rich spec (schema,
# GSI, TTL, streams, point-in-time recovery) and the suite's hardest edge
# -- server-side encryption under the customer-managed key, which a mapper
# must express as a reference to the discovered key, not a frozen ARN.
# Deliberately omitted: resourcePolicy and contributorInsights, whose
# satellite resources Cloud Control's table model may not expose -- the
# exam only sets spec fields a scan-driven proposer could reconstruct
# (fields driving scan-invisible state would deflate every proposer's
# ceiling instead of testing judgment).
apiVersion: aws.planton.dev/v1alpha1
kind: AwsDynamodb
metadata:
  name: orders-prod-table
  id: orders-prod-table
  org: planton-oss
  env: prod
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsdynamodb
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  billingMode: PAY_PER_REQUEST
  attributeDefinitions:
    - name: pk
      type: S
    - name: sk
      type: S
    - name: gsi1pk
      type: S
  keySchema:
    - attributeName: pk
      keyType: HASH
    - attributeName: sk
      keyType: RANGE
  globalSecondaryIndexes:
    - name: gsi1
      keySchema:
        - attributeName: gsi1pk
          keyType: HASH
      projection:
        type: KEYS_ONLY
  ttl:
    enabled: true
    attributeName: expiresAt
  streamEnabled: true
  streamViewType: NEW_AND_OLD_IMAGES
  pointInTimeRecovery:
    enabled: true
  serverSideEncryption:
    enabled: true
    kmsKeyArn:
      valueFrom:
        kind: AwsKmsKey
        name: orders-prod-data-key
        fieldPath: status.outputs.key_arn
