# The identity-and-egress suite: the COVERAGE exam. Where network-staples
# proves the measuring instrument and messy-account measures headroom, this
# suite exists so the last two import-recipe kinds -- the IAM role and the
# NAT gateway -- are examined at all. With it, every kind that carries an
# import recipe appears in at least one exam. Difficulty stays the messy
# suite's job; this suite is deliberately small and well-signaled.
#
# What this exam adds that the other two do not:
#   - The NAT gateway as an instance: its subnet_id value_from edge, and a
#     route whose target_type is nat_gateway -- the first
#     non-internet-gateway route target in any exam (the deterministic
#     baseline wires only internet-gateway targets, so both edges are
#     guaranteed headroom).
#   - The first GLOBAL-service member: scanning AWS::IAM::Role lists every
#     role in the account (46 on the shared e2e account, single page --
#     probed 2026-07-11), so this suite proves universe-only scoring holds
#     on a tier where out-of-universe noise is the norm, not the exception.
#   - A second name-derived-identity kind beside S3: the role's import
#     recipe derives its import id from metadata.name, so the manifest
#     name MUST be the real role name and the scorer enforces it.
#
# Composition constraints, verified before authoring (recorded so nobody
# "fixes" them into a broken exam):
#   - The NAT gateway is PRIVATE connectivity by necessity, not thrift. A
#     public gateway requires allocation_id -- an AWS-assigned Elastic IP
#     id unknowable before deploy -- and aws_eip has no catalog scan-side
#     identity, so an AwsElasticIp member would deploy zero scan-visible
#     resources: a ground-truth instance with no claims that no proposer
#     could ever match. Private connectivity needs no Elastic IP
#     (spec-enforced) and exercises the identical mapping surface.
#   - The role attaches an AWS-managed policy by LITERAL arn: an
#     AwsIamPolicy member is ruled out by the same zero-claim analysis
#     (aws_iam_policy has no catalog entry).
#   - Every role field set here is scan-reconstructable (probed live:
#     Cloud Control's role model carries AssumeRolePolicyDocument,
#     ManagedPolicyArns, inline Policies, Description, Path,
#     MaxSessionDuration) -- the exam-fairness rule. The trust and inline
#     policy documents are authored in the decoded-JSON shape the scan
#     returns, so the spec axis compares like with like.
apiVersion: qa.planton.dev/v1
kind: MappingEvalSuite
metadata:
  name: identity-and-egress
spec:
  members:
    - kind_dir: awsvpc
      manifest_path: catalog/aws/aa_eval/suites/identity-and-egress/members/hub-vpc.yaml
    - kind_dir: awssubnet
      manifest_path: catalog/aws/aa_eval/suites/identity-and-egress/members/hub-nat-subnet.yaml
    - kind_dir: awsnatgateway
      manifest_path: catalog/aws/aa_eval/suites/identity-and-egress/members/hub-egress-nat.yaml
    - kind_dir: awssubnet
      manifest_path: catalog/aws/aa_eval/suites/identity-and-egress/members/hub-app-subnet.yaml
    - kind_dir: awsiamrole
      manifest_path: catalog/aws/aa_eval/suites/identity-and-egress/members/hub-ci-deployer.yaml
  scan_scope:
    region: us-west-2
