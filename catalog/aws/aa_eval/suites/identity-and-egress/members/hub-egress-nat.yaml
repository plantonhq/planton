# The egress NAT gateway -- the kind this suite exists to examine. PRIVATE
# connectivity by structural necessity, not thrift: a public gateway
# requires an Elastic IP allocation id that cannot be authored before
# deploy, and an AwsElasticIp member would carry zero scan-visible claims
# (aws_eip has no catalog scan-side identity), so it could never be
# matched. Private connectivity needs no Elastic IP and exercises the
# identical mapping surface: the gateway as its own instance and the
# subnet_id value_from edge no deterministic mapper wires.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsNatGateway
metadata:
  name: hub-egress-nat
  id: hub-egress-nat
  org: planton-oss
  env: ops
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsnatgateway
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  connectivityType: private
  subnetId:
    valueFrom:
      kind: AwsSubnet
      name: hub-nat-subnet
      fieldPath: status.outputs.subnet_id
