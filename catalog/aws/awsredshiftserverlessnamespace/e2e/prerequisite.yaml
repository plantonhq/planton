# AwsRedshiftServerlessNamespace install profile used as a prerequisite
# by composed components (the workgroup attaches to a namespace by name
# at create time). Managed admin password so no credential material
# exists in the fixture. Full metadata is supplied for tagging/orphan
# cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsRedshiftServerlessNamespace
metadata:
  name: planton-oss-e2e-rsns-prereq
  id: planton-oss-e2e-rsns-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsredshiftserverlessnamespace
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  dbName: analytics
  adminUsername: e2eadmin
  manageAdminPassword: true
