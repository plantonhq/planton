apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsredshiftserverlessnamespace
spec:
  # A Redshift Serverless namespace under live E2E: the harness runs
  # deploy -> GetNamespace verify -> destroy -> verify-destroyed on both
  # provisioners. The namespace is account-level (no VPC prerequisite)
  # and carries no compute, so it provisions in minutes and accrues no
  # RPU charges. The scenario proves the recommended managed-password
  # path: no secret in the manifest or state, the secret ARN surfacing
  # as an output.
  #
  # Badge KEPT through the parity depth review (manifest-only): zero
  # spec/module changes -- the parity manifest recorded the write-only
  # password pair as exclusions, and the serverless usage-limit
  # satellite was verified WORKGROUP-scoped (provider tests + docs), so
  # nothing new exists for a live lane to prove.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
