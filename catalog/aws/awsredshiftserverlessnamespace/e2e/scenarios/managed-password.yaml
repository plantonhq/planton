# Redshift Serverless namespace managed-password scenario: the
# recommended default data plane. Exercises the AWS-managed admin
# password (no secret in the manifest or state; the secret ARN surfaces
# as an output) with a named first database. No compute is created --
# workgroups are a separate kind -- so the namespace accrues no RPU
# charges. Full metadata is supplied for tagging/orphan cleanup.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsRedshiftServerlessNamespace
metadata:
  name: planton-oss-e2e-rsns-mmp
  id: planton-oss-e2e-rsns-mmp
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsredshiftserverlessnamespace
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  dbName: analytics
  adminUsername: e2eadmin
  manageAdminPassword: true
