# AwsBedrockAgentCoreEvaluation full-surface scenario: an LLM-judge
# evaluator plus a Bedrock harness on the shared AgentCore role
# fixture. Creating these objects is free; AWS bills per evaluation
# run (the lanes never start a run). Whether create validates Bedrock
# model access rides the Q37 watch-list (the standing model-access
# payment-instrument deferral).
#
# Deliberately not exercised live: the online evaluation config (needs
# a CloudWatch log group that AgentCore observability actually writes
# to -- unblock: compose AwsCloudwatchLogGroup once a lane budget
# allows), Gemini/OpenAI harness vendors (need Secrets Manager API
# keys), and the explicit runtime-environment arm (the omitted path
# proves the computed default) -- all offline-proven via
# e2e/manifest.yaml.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsBedrockAgentCoreEvaluation
metadata:
  name: planton-oss-e2e-awsacev-full
  id: planton-oss-e2e-awsacev-full
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsbedrockagentcoreevaluation
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AwsIamRole"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  evaluators:
    - name: planton_e2e_judge
      description: Planton E2E LLM judge
      level: SESSION
      llmAsAJudge:
        # SESSION-level instructions must embed one of the level's
        # placeholders ({context} here) - CreateEvaluator rejects
        # placeholder-less prompts server-side.
        instructions: Score whether the agent answered the question given the {context}.
        # Judge models resolve through the region's inference set --
        # the profile-id form is what CreateEvaluator accepts (a bare
        # on-demand FM id fails "not available in region").
        model:
          modelId: us.amazon.nova-2-lite-v1:0
          inference:
            temperature: 0
        ratingScale:
          categorical:
            - label: pass
              definition: The agent answered correctly
            - label: fail
              definition: The agent did not answer
  harnesses:
    # Harness names take letters/digits/underscores only (no hyphens).
    - name: planton_e2e_bench
      executionRoleArn:
        valueFrom:
          kind: AwsIamRole
          name: planton-oss-e2e-agentcore-role
          fieldPath: status.outputs.role_arn
      model:
        bedrock:
          modelId: anthropic.claude-3-haiku-20240307-v1:0
          temperature: 0
      systemPrompts:
        - text: You are an agent under evaluation.
