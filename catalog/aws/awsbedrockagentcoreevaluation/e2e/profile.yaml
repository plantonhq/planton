apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: awsbedrockagentcoreevaluation
spec:
  # An AgentCore Evaluations bundle under live E2E: two lanes. The
  # minimal lane proves a code-based evaluator on the AwsLambda smoke
  # fixture (create does not invoke the function). The full-surface
  # lane proves an LLM-judge evaluator plus a Bedrock harness on the
  # shared AgentCore role fixture. Creating evaluation objects is
  # free; AWS bills per evaluation run and the lanes never start a
  # run. Verification walks the id-keyed output maps (GetEvaluator
  # ACTIVE, GetHarness READY).
  #
  # Deliberately not exercised live: the online evaluation config
  # (needs a CloudWatch log group that AgentCore observability writes
  # to -- unblock: compose AwsCloudwatchLogGroup), Gemini/OpenAI
  # harness vendors (need Secrets Manager API keys), and the explicit
  # runtime-environment arm (the omitted path is the computed default)
  # -- all offline-proven via e2e/manifest.yaml.
  #
  # Proven live 2026-08-25: minimal + full-surface green on both
  # engines with blind round-trips (evaluator/harness by bare id at no
  # real change; harness memory/memory_actual declared
  # import-normalized -- AWS auto-provisions a memory). The model-access
  # question SETTLED: CreateEvaluator validates the judge model against
  # the region's INFERENCE set (bare on-demand FM ids fail "not
  # available in region"; the us. profile form creates) -- the
  # payment-instrument wall was never reached, and the Nova judge
  # avoids Marketplace entirely. Three server contracts front-loaded
  # from this proof: harness-name regex, SESSION instruction
  # placeholders, the judge-model teaching.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
