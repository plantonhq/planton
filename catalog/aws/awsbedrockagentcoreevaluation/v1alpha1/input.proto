syntax = "proto3";

package dev.planton.aws.awsbedrockagentcoreevaluation.v1alpha1;

import "catalog/aws/awsbedrockagentcoreevaluation/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsBedrockAgentCoreEvaluationIacInput is the input for the IaC
// modules that deploy the AgentCore Evaluations bundle.
message AwsBedrockAgentCoreEvaluationIacInput {
  // target is the AwsBedrockAgentCoreEvaluation resource to deploy.
  AwsBedrockAgentCoreEvaluation target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
