syntax = "proto3";

package dev.planton.aws.awseventbridgerule.v1alpha1;

import "catalog/aws/awseventbridgerule/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsEventBridgeRuleIacInput is the input envelope passed to IaC modules
// for provisioning.
message AwsEventBridgeRuleIacInput {
  // target is the fully-specified AwsEventBridgeRule resource to provision.
  AwsEventBridgeRule target = 1;

  // provider_config supplies AWS credentials and region for the deployment.
  // When nil the module falls back to ambient credentials (environment variables
  // or instance profile).
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
