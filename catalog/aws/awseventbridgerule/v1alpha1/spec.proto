syntax = "proto3";

package dev.planton.aws.awseventbridgerule.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";
import "shared/foreignkey/v1/foreign_key.proto";

// AwsEventBridgeRuleSpec defines the desired configuration for an AWS
// EventBridge rule with bundled targets.
//
// An EventBridge rule matches incoming events on an event bus and routes them
// to one or more targets for processing. Rules can match events by pattern
// (JSON event matching) or by schedule (cron/rate expressions).
//
// Targets are bundled with the rule because a rule without targets is
// functionally useless — it matches events but does nothing with them.
// Each target can independently configure input transformation, retry
// policies, and dead letter queues.
//
// Notes:
// - The rule name is derived from `metadata.name`.
// - Exactly one of `event_pattern` or `schedule_expression` must be set.
// - Targets are created as separate Terraform/Pulumi resources but are
//   managed as a single unit with the rule.
// - Credentials, region, and deployment workflow live outside this spec in
//   stack inputs.
message AwsEventBridgeRuleSpec {
  // The AWS region where the resource will be created.
  // Example: "us-west-2", "eu-west-1"
  string region = 1 [(buf.validate.field).string.min_len = 1];

  // ---------------------------------------------------------------------------
  // Event bus reference
  // ---------------------------------------------------------------------------

  // Name of the event bus to attach this rule to. Defaults to "default" (the
  // built-in AWS event bus) when not specified. Can reference an
  // AwsEventBridgeBus resource via `valueFrom`.
  //
  // Changing this field forces rule replacement (delete + recreate).
  //
  // Constraint (AWS, not validated here because reference values resolve at
  // deploy time): schedule_expression is only supported on the DEFAULT bus —
  // a scheduled rule on a custom bus is rejected by the AWS API. Custom
  // buses take event-pattern rules only.
  dev.planton.shared.foreignkey.v1.StringValueOrRef event_bus_name = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsEventBridgeBus,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.bus_name"
  ];

  // ---------------------------------------------------------------------------
  // Rule definition
  // ---------------------------------------------------------------------------

  // Human-readable description of the rule. Maximum 512 characters.
  string description = 3 [(buf.validate.field).string.max_len = 512];

  // JSON event pattern that this rule matches against. Events that match the
  // pattern are routed to the rule's targets. Expressed as a structured object
  // in YAML — the IaC module serializes it to JSON. AWS caps the serialized
  // pattern at 4096 characters.
  //
  // Mutually exclusive with `schedule_expression`.
  //
  // Example patterns:
  //   source: ["aws.ec2"]
  //   detail-type: ["EC2 Instance State-change Notification"]
  //   detail:
  //     state: ["running", "stopped"]
  google.protobuf.Struct event_pattern = 4;

  // Schedule expression for time-based rule triggering. Supports cron and rate
  // expressions.
  //
  // Mutually exclusive with `event_pattern`.
  //
  // Examples:
  //   "rate(5 minutes)"        — fire every 5 minutes
  //   "rate(1 hour)"           — fire every hour
  //   "cron(0 12 * * ? *)"     — fire at noon UTC every day
  //   "cron(0/15 * * * ? *)"   — fire every 15 minutes
  string schedule_expression = 5 [(buf.validate.field).string.max_len = 256];

  // Rule state. Controls whether the rule is actively matching events.
  // Valid values:
  // - "ENABLED"  — the rule matches events (IaC default when not set).
  // - "DISABLED" — the rule exists but matches nothing.
  // - "ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS" — additionally matches
  //   read-only CloudTrail management events (AWS API activity like Describe*
  //   calls), which ENABLED rules never receive. Only meaningful for rules
  //   whose pattern matches CloudTrail management events.
  string state = 6;

  // ---------------------------------------------------------------------------
  // Invocation identity and teardown
  // ---------------------------------------------------------------------------

  // IAM role EventBridge assumes when invoking this rule's targets. Used when
  // a single role should govern the whole rule (targets can also carry their
  // own per-target `role_arn`, which takes precedence for that target).
  // Required for schedule rules whose targets need role-based invocation.
  dev.planton.shared.foreignkey.v1.StringValueOrRef role_arn = 7 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsIamRole,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.role_arn"
  ];

  // Force rule deletion even when targets are still attached (AWS refuses to
  // delete a rule that has targets unless forced). Keep the default (false)
  // so an unexpectedly shared rule fails loudly instead of vanishing under
  // an out-of-band consumer; the module manages its own targets' teardown
  // ordering either way.
  bool force_destroy = 8;

  // ---------------------------------------------------------------------------
  // Targets
  // ---------------------------------------------------------------------------

  // Targets to invoke when the rule matches an event. At least one target is
  // required. Each target specifies a destination (Lambda, SQS, SNS, Step
  // Functions, etc.), optional input transformation, retry policy, dead
  // letter queue, and an optional service-typed parameter block (SQS,
  // Kinesis, HTTP/API-destination, Batch, ECS RunTask, Redshift Data API,
  // SSM Run Command, SageMaker Pipelines, AppSync).
  //
  // AWS limits: maximum 5 targets per rule (enforced here so the quota
  // fails at validate time instead of at PutTargets).
  repeated AwsEventBridgeTarget targets = 9 [(buf.validate.field).repeated.max_items = 5];

  // ---------------------------------------------------------------------------
  // CEL validations
  // ---------------------------------------------------------------------------

  // At least one of event_pattern or schedule_expression must be set.
  option (buf.validate.message).cel = {
    id: "event_pattern_or_schedule_required"
    message: "exactly one of event_pattern or schedule_expression must be set"
    expression: "(has(this.event_pattern) && this.schedule_expression == '') || (!has(this.event_pattern) && this.schedule_expression != '')"
  };

  // State must be a valid value when set.
  option (buf.validate.message).cel = {
    id: "state_valid_values"
    message: "state must be 'ENABLED', 'DISABLED', or 'ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS' when set"
    expression: "this.state == '' || this.state in ['ENABLED', 'DISABLED', 'ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS']"
  };

  // At least one target is required.
  option (buf.validate.message).cel = {
    id: "targets_not_empty"
    message: "at least one target is required"
    expression: "size(this.targets) > 0"
  };
}

// AwsEventBridgeTarget defines a target to invoke when the rule matches an
// event. Targets are the downstream consumers of matched events — Lambda
// functions, SQS queues, SNS topics, Step Functions state machines, and more.
//
// Each target can independently configure:
// - Input transformation (constant input, JSONPath extraction, or template)
// - Retry policy (max age and retry attempts)
// - Dead letter queue (for events that fail delivery)
message AwsEventBridgeTarget {
  // User-assigned name for this target. Used as the Pulumi resource name
  // and as the `target_id` in EventBridge. Must be unique within the rule's
  // targets. Maximum 64 characters, alphanumeric plus hyphen, underscore,
  // and period.
  string name = 1 [(buf.validate.field) = {
    required: true
    string: {
      max_len: 64
      pattern: "^[0-9A-Za-z_.-]+$"
    }
  }];

  // ARN of the target resource. This is the AWS resource that processes
  // matched events. Common targets include Lambda functions, SQS queues,
  // SNS topics, Step Functions state machines, and CloudWatch Log Groups.
  //
  // No `default_kind` is set because the target resource type varies
  // (Lambda, SQS, SNS, etc.). Use `valueFrom` to reference specific
  // Planton resources.
  //
  // Containment-exempt: a target is where matched events are DELIVERED,
  // never where the rule lives -- the rule belongs to its event bus. A
  // target that is itself a container (another event bus, for a
  // cross-bus forward) would otherwise pull the rule inside the bus it
  // forwards to; on a diagram the rule stays on its own bus with a line
  // to each target.
  dev.planton.shared.foreignkey.v1.StringValueOrRef arn = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true
  ];

  // IAM role ARN for EventBridge to assume when invoking this target.
  // Required for targets where EventBridge needs to assume a role:
  // Step Functions, ECS, Kinesis, Batch, CodeBuild, CodePipeline, and
  // cross-account event buses.
  //
  // Not needed for targets that use resource-based policies:
  // Lambda (function policy), SQS (queue policy), SNS (topic policy).
  dev.planton.shared.foreignkey.v1.StringValueOrRef role_arn = 3 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsIamRole,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.role_arn"
  ];

  // ---------------------------------------------------------------------------
  // Input transformation (mutually exclusive)
  // ---------------------------------------------------------------------------

  // Constant JSON input to pass to the target instead of the matched event.
  // Maximum 8192 characters. Mutually exclusive with `input_path` and
  // `input_transformer`.
  string input = 4 [(buf.validate.field).string.max_len = 8192];

  // JSONPath expression to extract a portion of the matched event and pass
  // to the target. Maximum 256 characters. Mutually exclusive with `input`
  // and `input_transformer`.
  //
  // Example: "$.detail" extracts the detail object from the event.
  string input_path = 5 [(buf.validate.field).string.max_len = 256];

  // Input transformer to reshape the matched event before passing to the
  // target. Mutually exclusive with `input` and `input_path`.
  AwsEventBridgeInputTransformer input_transformer = 6;

  // ---------------------------------------------------------------------------
  // Reliability
  // ---------------------------------------------------------------------------

  // Dead letter queue for events that fail delivery to this target. When
  // EventBridge cannot deliver an event after all retry attempts, the event
  // is routed to the specified SQS queue for investigation.
  AwsEventBridgeTargetDeadLetterConfig dead_letter_config = 7;

  // Retry policy controlling how EventBridge retries failed deliveries to
  // this target. When not set, EventBridge uses the default policy: retry
  // for 24 hours with up to 185 attempts using exponential backoff.
  AwsEventBridgeTargetRetryPolicy retry_policy = 8;

  // ---------------------------------------------------------------------------
  // Service-typed parameter blocks (set the one matching the target's arn)
  // ---------------------------------------------------------------------------

  // SQS-specific parameters. Required when targeting a FIFO SQS queue
  // to specify the message group ID.
  AwsEventBridgeTargetSqsConfig sqs_target = 9;

  // Kinesis-specific parameters. Controls how events map to stream shards.
  AwsEventBridgeTargetKinesisConfig kinesis_target = 10;

  // HTTP/API-destination parameters. Path, query, and header values applied
  // when the target arn is an EventBridge API destination.
  AwsEventBridgeTargetHttpConfig http_target = 11;

  // AWS Batch parameters. Required when the target arn is a Batch job queue.
  AwsEventBridgeTargetBatchConfig batch_target = 12;

  // ECS RunTask parameters. Required when the target arn is an ECS cluster —
  // the event launches a task from the referenced task definition.
  AwsEventBridgeTargetEcsConfig ecs_target = 13;

  // Redshift Data API parameters. Required when the target arn is a
  // Redshift cluster — each matched event runs a SQL statement against it.
  AwsEventBridgeTargetRedshiftConfig redshift_target = 14;

  // SSM Run Command instance selectors. Required when the target arn is a
  // Systems Manager document — each matched event dispatches the command
  // to the instances the selectors match. Up to 5 selectors, combined
  // with AND.
  repeated AwsEventBridgeTargetRunCommandSelector run_command_targets = 15 [(buf.validate.field).repeated.max_items = 5];

  // SageMaker Pipelines parameters. Set when the target arn is a
  // SageMaker pipeline — each matched event starts a pipeline execution
  // with these parameters.
  AwsEventBridgeTargetSagemakerPipelineConfig sagemaker_pipeline_target = 16;

  // AppSync parameters. Required when the target arn is an AppSync
  // GraphQL API endpoint — each matched event invokes the operation.
  AwsEventBridgeTargetAppsyncConfig appsync_target = 17;

  // ---------------------------------------------------------------------------
  // CEL validations
  // ---------------------------------------------------------------------------

  // input, input_path, and input_transformer are mutually exclusive.
  option (buf.validate.message).cel = {
    id: "input_mutual_exclusion"
    message: "only one of input, input_path, or input_transformer may be set"
    expression: "(this.input == '' ? 0 : 1) + (this.input_path == '' ? 0 : 1) + (has(this.input_transformer) ? 1 : 0) <= 1"
  };

  // A target invokes exactly one AWS service; multiple typed parameter
  // blocks would describe conflicting invocations of the same arn.
  // run_command_targets is a repeated selector list but still ONE typed
  // invocation (its entries jointly select instances for a single Run
  // Command dispatch), so a non-empty list counts as one block.
  option (buf.validate.message).cel = {
    id: "one_typed_target_block"
    message: "at most one of sqs_target, kinesis_target, http_target, batch_target, ecs_target, redshift_target, run_command_targets, sagemaker_pipeline_target, or appsync_target may be set"
    expression: "(has(this.sqs_target) ? 1 : 0) + (has(this.kinesis_target) ? 1 : 0) + (has(this.http_target) ? 1 : 0) + (has(this.batch_target) ? 1 : 0) + (has(this.ecs_target) ? 1 : 0) + (has(this.redshift_target) ? 1 : 0) + (size(this.run_command_targets) > 0 ? 1 : 0) + (has(this.sagemaker_pipeline_target) ? 1 : 0) + (has(this.appsync_target) ? 1 : 0) <= 1"
  };
}

// AwsEventBridgeInputTransformer reshapes event data before delivering it to
// the target. Useful for extracting specific fields, reformatting event data,
// or adding static context.
//
// The transformer works in two steps:
// 1. `input_paths` extracts values from the event using JSONPath expressions
// 2. `input_template` assembles the final input using the extracted values
message AwsEventBridgeInputTransformer {
  // Map of variable names to JSONPath expressions that extract values from
  // the matched event. Keys become variables available in `input_template`.
  // Maximum 100 entries. Keys must not start with "AWS" (reserved).
  //
  // Example:
  //   instance: "$.detail.instance-id"
  //   state: "$.detail.state"
  map<string, string> input_paths = 1 [(buf.validate.field).map.max_pairs = 100];

  // Template that produces the final input for the target. References
  // variables from `input_paths` using angle brackets: <variable>.
  // Maximum 8192 characters.
  //
  // Example: "Instance <instance> transitioned to <state>"
  string input_template = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 8192
  ];

  // AWS reserves the "AWS" variable-name prefix; the API rejects such
  // keys at PutTargets, so reject them at validate time instead.
  option (buf.validate.message).cel = {
    id: "input_path_keys_not_reserved"
    message: "input_paths keys must not start with 'AWS' -- that prefix is reserved by EventBridge"
    expression: "this.input_paths.all(k, !k.startsWith('AWS'))"
  };
}

// AwsEventBridgeTargetDeadLetterConfig configures a dead letter queue for
// events that fail delivery to the target after all retry attempts.
message AwsEventBridgeTargetDeadLetterConfig {
  // ARN of the SQS queue to use as the dead letter queue. The queue must
  // exist in the same AWS account and region as the rule.
  //
  // Accepts a direct ARN or a reference to an AwsSqsQueue resource.
  dev.planton.shared.foreignkey.v1.StringValueOrRef arn = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSqsQueue,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.queue_arn"
  ];
}

// AwsEventBridgeTargetRetryPolicy controls how EventBridge retries failed
// event deliveries to a target. Both fields carry explicit presence because
// zero is a MEANINGFUL value for retry attempts (0 = fail straight to the
// DLQ) — an absent field keeps the AWS default instead.
message AwsEventBridgeTargetRetryPolicy {
  // Maximum time in seconds that EventBridge keeps retrying delivery.
  // Range: 60 to 86400 (1 minute to 24 hours). Absent: AWS default of
  // 86400 (24 hours).
  optional int32 maximum_event_age_in_seconds = 1 [(buf.validate.field).int32 = {
    gte: 60
    lte: 86400
  }];

  // Maximum number of retry attempts. Range: 0 to 185. Absent: AWS default
  // of 185. Set to 0 to disable retries (event goes to the DLQ immediately
  // on failure).
  optional int32 maximum_retry_attempts = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 185
  }];
}

// AwsEventBridgeTargetSqsConfig provides SQS-specific configuration for
// targets pointing to SQS queues.
message AwsEventBridgeTargetSqsConfig {
  // Message group ID for FIFO SQS queues. Required when the target is a
  // FIFO queue to ensure proper message ordering and deduplication.
  // Ignored for standard queues.
  string message_group_id = 1;
}

// AwsEventBridgeTargetKinesisConfig provides Kinesis-specific configuration
// for targets pointing to Kinesis data streams.
message AwsEventBridgeTargetKinesisConfig {
  // JSONPath expression extracting the partition key from the event (e.g.
  // "$.detail.customer_id"), determining which shard receives the record.
  // When unset, EventBridge uses the event ID — an even spread that
  // sacrifices per-entity ordering. Maximum 256 characters.
  string partition_key_path = 1 [(buf.validate.field).string.max_len = 256];
}

// AwsEventBridgeTargetHttpConfig provides parameters for targets pointing to
// EventBridge API destinations (authenticated outbound HTTP endpoints).
message AwsEventBridgeTargetHttpConfig {
  // Values substituted into the API destination's path wildcards ("*"), in
  // order of appearance in the endpoint URL.
  repeated string path_parameter_values = 1;

  // Query string parameters appended to the invocation URL.
  map<string, string> query_string_parameters = 2;

  // HTTP headers added to the request. Keys must be valid header names;
  // AWS reserves headers starting with "X-Amz" and "X-Amzn".
  map<string, string> header_parameters = 3;
}

// AwsEventBridgeTargetBatchConfig provides AWS Batch parameters for targets
// pointing to Batch job queues. The target's `arn` is the JOB QUEUE
// (an AwsBatchJobQueue's job_queue_arn output); the job definition each
// event submits lives here.
message AwsEventBridgeTargetBatchConfig {
  // The Batch job definition each matched event submits. Accepts a
  // reference to an AwsBatchJobDefinition resource (its revision-carrying
  // ARN output, so a new revision rolls the rule's submissions) or a
  // literal value -- a bare name or name:revision literal tracks the
  // name's latest ACTIVE revision on the Batch side instead of pinning
  // one.
  dev.planton.shared.foreignkey.v1.StringValueOrRef job_definition = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsBatchJobDefinition,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.job_definition_arn"
  ];

  // Name assigned to the submitted jobs (visible in the Batch console and
  // APIs). Maximum 128 characters.
  string job_name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 128
  ];

  // Size of an array job. Leave at 0 for a regular (non-array) job.
  // Range when set: 2-10000.
  int32 array_size = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).int32 = {
      gte: 2
      lte: 10000
    }
  ];

  // Retry attempts for the submitted job, 1-10. Leave at 0 to use the job
  // definition's own retry strategy.
  int32 job_attempts = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 10
    }
  ];
}

// AwsEventBridgeTargetEcsConfig launches an ECS task per matched event.
// The target's `arn` is the ECS CLUSTER; the task definition, sizing, and
// placement live here. The target's `role_arn` is required — EventBridge
// assumes it to call ecs:RunTask.
message AwsEventBridgeTargetEcsConfig {
  // The task definition to launch. Accepts a reference to an
  // AwsEcsTaskDefinition resource (its revision-carrying ARN output, so a
  // new revision rolls the rule's launches) or a literal ARN.
  dev.planton.shared.foreignkey.v1.StringValueOrRef task_definition_arn = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsEcsTaskDefinition,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.task_definition_arn"
  ];

  // Number of tasks launched per matched event. Leave at 0 for the AWS
  // default of 1. Maximum 10.
  int32 task_count = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 10
    }
  ];

  // Launch type for the task. Valid values: "EC2", "FARGATE", "EXTERNAL".
  // Leave empty to use the cluster's default capacity provider strategy, or
  // set `capacity_provider_strategy` for an explicit blend — AWS rejects a
  // launch type combined with a capacity provider strategy.
  string launch_type = 3;

  // Fargate platform version (e.g. "LATEST", "1.4.0"). Only valid with the
  // FARGATE launch type.
  string platform_version = 4 [(buf.validate.field).string.max_len = 1600];

  // Task group name used for placement decisions (defaults to the family
  // name of the task definition). Maximum 255 characters.
  string group = 5 [(buf.validate.field).string.max_len = 255];

  // Capacity provider strategy for the launched tasks. Mutually exclusive
  // with `launch_type` (AWS rejects both together).
  repeated AwsEventBridgeEcsCapacityProviderStrategy capacity_provider_strategy = 6;

  // VPC networking for the task. Required for Fargate (awsvpc network mode);
  // used with EC2 launch type only when the task definition uses awsvpc mode.
  AwsEventBridgeEcsNetworkConfiguration network_configuration = 7;

  // Placement strategies ordering candidate instances (EC2 launch type).
  // Evaluated in order; maximum 5 entries.
  repeated AwsEventBridgeEcsPlacementStrategy ordered_placement_strategy = 8 [(buf.validate.field).repeated.max_items = 5];

  // Placement constraints filtering candidate instances (EC2 launch type).
  // Maximum 10 entries.
  repeated AwsEventBridgeEcsPlacementConstraint placement_constraints = 9 [(buf.validate.field).repeated.max_items = 10];

  // Propagate tags from the task definition to the launched tasks.
  // The only accepted value is "TASK_DEFINITION".
  string propagate_tags = 10;

  // Use Amazon ECS managed tags for the launched tasks (the
  // aws:ecs:clusterName / aws:ecs:serviceName tag pair).
  bool enable_ecs_managed_tags = 11;

  // Enable ECS Exec on the launched tasks for interactive debugging.
  bool enable_execute_command = 12;

  // Tags applied to the ECS TASKS each event launches (cost allocation,
  // ownership) — distinct from the rule's own resource tags, which the
  // module manages from metadata. Merged with the task definition's tags
  // when propagate_tags is set.
  map<string, string> tags = 13;

  // launch_type must be a valid value when set.
  option (buf.validate.message).cel = {
    id: "launch_type_valid"
    message: "launch_type must be 'EC2', 'FARGATE', or 'EXTERNAL' when set"
    expression: "this.launch_type == '' || this.launch_type in ['EC2', 'FARGATE', 'EXTERNAL']"
  };

  // AWS rejects an explicit launch type combined with a capacity provider
  // strategy — they are two ways of answering the same placement question.
  option (buf.validate.message).cel = {
    id: "launch_type_xor_capacity_strategy"
    message: "launch_type and capacity_provider_strategy are mutually exclusive; choose one placement mechanism"
    expression: "this.launch_type == '' || size(this.capacity_provider_strategy) == 0"
  };

  // platform_version only applies to Fargate.
  option (buf.validate.message).cel = {
    id: "platform_version_fargate_only"
    message: "platform_version is only valid with launch_type 'FARGATE'"
    expression: "this.platform_version == '' || this.launch_type == 'FARGATE'"
  };

  // propagate_tags accepts a single value.
  option (buf.validate.message).cel = {
    id: "propagate_tags_valid"
    message: "propagate_tags must be 'TASK_DEFINITION' when set"
    expression: "this.propagate_tags == '' || this.propagate_tags == 'TASK_DEFINITION'"
  };
}

// AwsEventBridgeEcsCapacityProviderStrategy is one entry in an ECS capacity
// provider strategy blend for event-launched tasks.
message AwsEventBridgeEcsCapacityProviderStrategy {
  // Capacity provider name ("FARGATE", "FARGATE_SPOT", or a cluster-attached
  // EC2 capacity provider name).
  string capacity_provider = 1 [(buf.validate.field).required = true];

  // Minimum number of tasks guaranteed to this provider before weights
  // apply. Only one strategy entry may carry a non-zero base. Range 0-100000.
  int32 base = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100000
  }];

  // Relative share of tasks placed on this provider once bases are met.
  // Range 0-1000.
  int32 weight = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
}

// AwsEventBridgeEcsNetworkConfiguration provides awsvpc networking for
// event-launched ECS tasks.
message AwsEventBridgeEcsNetworkConfiguration {
  // Subnets the task's elastic network interface is placed in. Accepts
  // direct subnet IDs or references to AwsSubnet resources.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef subnets = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSubnet,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.subnet_id"
  ];

  // Security groups attached to the task's network interface. When empty,
  // AWS uses the VPC's default security group. Accepts direct IDs or
  // references to AwsSecurityGroup resources.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef security_groups = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsSecurityGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.security_group_id"
  ];

  // Assign a public IP to the task's network interface. Only valid for
  // Fargate tasks in public subnets.
  bool assign_public_ip = 3;
}

// AwsEventBridgeEcsPlacementStrategy orders candidate container instances for
// event-launched EC2 tasks.
message AwsEventBridgeEcsPlacementStrategy {
  // Strategy type. Valid values: "random", "spread", "binpack".
  string type = 1 [(buf.validate.field).required = true];

  // Attribute the strategy applies to — e.g. "instanceId" or
  // "attribute:ecs.availability-zone" for spread, "cpu" or "memory" for
  // binpack. Not used by "random".
  string field = 2 [(buf.validate.field).string.max_len = 255];

  option (buf.validate.message).cel = {
    id: "placement_strategy_type_valid"
    message: "type must be 'random', 'spread', or 'binpack'"
    expression: "this.type in ['random', 'spread', 'binpack']"
  };
}

// AwsEventBridgeTargetRedshiftConfig runs a SQL statement through the
// Redshift Data API per matched event. The target's `arn` is the Redshift
// CLUSTER; the statement and its execution identity live here. The
// target's `role_arn` is required — EventBridge assumes it to call the
// Data API.
message AwsEventBridgeTargetRedshiftConfig {
  // The database the statement runs in. Maximum 64 characters.
  string database = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 64
  ];

  // Authenticate as this database user with temporary credentials
  // (GetClusterCredentials). Use this OR secrets_manager_arn — AWS
  // resolves credentials from whichever is provided. Maximum 128
  // characters.
  string db_user = 2 [(buf.validate.field).string.max_len = 128];

  // Authenticate with credentials stored in Secrets Manager — the
  // alternative to db_user temporary credentials. Pass the secret ARN
  // as a literal, e.g.
  // "arn:aws:secretsmanager:us-west-2:123456789012:secret:redshift-...".
  string secrets_manager_arn = 3;

  // The SQL statement each matched event runs. Maximum 100,000
  // characters.
  string sql = 4 [(buf.validate.field).string.max_len = 100000];

  // A name for the statement, visible in the Data API's statement
  // history. Maximum 500 characters.
  string statement_name = 5 [(buf.validate.field).string.max_len = 500];

  // Deliver the matched event to the statement as execution context
  // (the Data API's WithEvent flag).
  bool with_event = 6;
}

// AwsEventBridgeTargetRunCommandSelector selects the EC2 instances an
// SSM Run Command target dispatches to — by instance id or by tag. The
// target's `arn` is the SSM DOCUMENT (e.g.
// "arn:aws:ssm:us-west-2::document/AWS-RunShellScript"); the target's
// `role_arn` is required — EventBridge assumes it to call
// ssm:SendCommand.
message AwsEventBridgeTargetRunCommandSelector {
  // The selector key: "InstanceIds" (select by instance id) or
  // "tag:<tag-key>" (select every instance carrying the tag). Maximum
  // 128 characters.
  string key = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 128
  ];

  // The selector values: instance ids for "InstanceIds", tag values for
  // a "tag:" key. 1-50 entries, each 1-256 characters.
  repeated string values = 2 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 50,
    (buf.validate.field).repeated.items = {
      string: {
        min_len: 1
        max_len: 256
      }
    }
  ];
}

// AwsEventBridgeTargetSagemakerPipelineConfig starts a SageMaker
// pipeline execution per matched event. The target's `arn` is the
// SageMaker PIPELINE; the target's `role_arn` is required — EventBridge
// assumes it to call sagemaker:StartPipelineExecution.
message AwsEventBridgeTargetSagemakerPipelineConfig {
  // Parameters passed to the pipeline execution, up to 200 — each must
  // be a parameter the pipeline declares.
  repeated AwsEventBridgeSagemakerPipelineParameter pipeline_parameter_list = 1 [(buf.validate.field).repeated.max_items = 200];
}

// AwsEventBridgeSagemakerPipelineParameter is one name/value parameter
// for an event-started SageMaker pipeline execution.
message AwsEventBridgeSagemakerPipelineParameter {
  // The parameter name, as declared by the pipeline definition.
  string name = 1 [(buf.validate.field).required = true];

  // The value passed for this execution.
  string value = 2 [(buf.validate.field).required = true];
}

// AwsEventBridgeTargetAppsyncConfig invokes an AppSync GraphQL operation
// per matched event. The target's `arn` is the AppSync API's endpoint
// ARN (the appsync:endpoints ARN form); the target's `role_arn` is
// required — EventBridge assumes it to call the API.
message AwsEventBridgeTargetAppsyncConfig {
  // The GraphQL operation (typically a mutation) to invoke, with its
  // selection set — variables are bound from the (transformed) event
  // input. Maximum 1,048,576 characters.
  string graphql_operation = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 1048576
  ];
}

// AwsEventBridgeEcsPlacementConstraint filters candidate container instances
// for event-launched EC2 tasks.
message AwsEventBridgeEcsPlacementConstraint {
  // Constraint type. Valid values: "distinctInstance", "memberOf".
  string type = 1 [(buf.validate.field).required = true];

  // Cluster query language expression for "memberOf" constraints, e.g.
  // "attribute:ecs.instance-type =~ t2.*". Not used by "distinctInstance".
  string expression = 2 [(buf.validate.field).string.max_len = 2000];

  option (buf.validate.message).cel = {
    id: "placement_constraint_type_valid"
    message: "type must be 'distinctInstance' or 'memberOf'"
    expression: "this.type in ['distinctInstance', 'memberOf']"
  };

  option (buf.validate.message).cel = {
    id: "member_of_requires_expression"
    message: "expression is required for 'memberOf' constraints and must be empty for 'distinctInstance'"
    expression: "this.type == 'memberOf' ? this.expression != '' : this.expression == ''"
  };
}
