# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: awseventbridgerule
spec:
  billing_model: usage_based
  cost_drivers:
    - field_path: event_pattern
      sku_meter: custom events published
      pricing_unit: events
      impact: The pattern decides how many of the bus's events this rule matches and delivers -- but the ingestion meter bills on the bus (per million events, in 64 KB chunks), not on the rule. A broader pattern moves more events to targets and multiplies the downstream compute; the rule itself adds no charge for matching.
    - field_path: schedule_expression
      sku_meter: target invocations
      pricing_unit: invocations
      impact: Every firing invokes every target, and the spend is the targets' own -- Lambda requests and duration, ECS task runtime, Batch job compute. rate(5 minutes) is 8,760 firings a month; rate(1 minute) is 43,800 -- per target. The cadence expression is the direct multiplier on everything downstream.
    - field_path: state
      sku_meter: target invocations
      pricing_unit: invocations
      impact: DISABLED is the kill switch -- the rule exists but matches nothing, so target invocations and their compute stop. ENABLED_WITH_ALL_CLOUDTRAIL_MANAGEMENT_EVENTS widens matching to read-only API-activity events, a volume class that can dwarf application traffic on busy accounts.
    - field_path: targets
      sku_meter: target invocations
      pricing_unit: invocations
      impact: Each matched event invokes EVERY target (up to 5) -- a fan-out multiplier on downstream spend. Each target's compute bills on its own component; the rule pays nothing per delivery to AWS-service targets.
    - field_path: targets.http_target
      sku_meter: API destination invocations
      pricing_unit: invocations
      impact: API destinations are the one target type with an EventBridge-side meter -- each outbound HTTP invocation bills at the per-million API destinations rate, in 64 KB chunks, plus data transfer to the endpoint (standard rates for public endpoints, PrivateLink/VPC Lattice rates for private ones).
    - field_path: targets.dead_letter_config.arn
      sku_meter: SQS requests and storage
      pricing_unit: requests
      impact: Events that exhaust the retry policy land in the referenced queue, billing its per-request and storage meters on the AwsSqsQueue component -- a healthy target sends it nothing.
    - field_path: targets.retry_policy
      sku_meter: target invocations
      pricing_unit: invocations
      impact: The retry window (up to 24 hours, 185 attempts by default) governs how long a failing target keeps being re-invoked before the event dead-letters -- tightening it caps the invoice a broken target can run up on its own compute.
  free_tier: The rule carries no meter, so no free allotment applies to it. On the default bus -- the only bus that accepts schedule_expression -- AWS-service events are ingested free; custom events bill on the bus from the first event, and API destination invocations have no published free tier.
  estimate_exclusions:
    - matched and delivered volume is entirely traffic-driven -- a rule matching nothing costs nothing
    - event ingestion bills on the bus (AwsEventBridgeBus), never on the rule
    - target compute (Lambda, ECS tasks, Batch jobs, Step Functions, Redshift queries) bills on the target components
    - delivering to another event bus or another account bills the bus-side per-million delivery meter
    - API destination invocations add data transfer at standard or PrivateLink rates depending on the endpoint's network path
    - DLQ traffic bills on the referenced SQS queue
  notes: "A rule is free to exist, free to match, and free to deliver to AWS-service targets -- the meters live on either side of it: ingestion on the bus, compute on the targets. Two exceptions deserve attention. API destination targets bill per invocation on EventBridge's own API destinations meter. And scheduled rules make the rule itself the traffic SOURCE: every firing is a target invocation whose cost compounds with the fan-out (a 1-minute schedule with 5 targets is 219,000 invocations a month). The EventBridge Scheduler free tier (14 million invocations a month) belongs to the separate Scheduler service, not to scheduled rules -- do not count it against this component's targets."
