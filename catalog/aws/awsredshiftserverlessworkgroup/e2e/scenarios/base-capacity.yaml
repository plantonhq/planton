# Redshift Serverless workgroup base-capacity scenario: the smallest
# practical compute plane over the namespace prerequisite's data. An
# 8-RPU baseline with a 32-RPU cap on the three-AZ subnet trio -- the
# serverless minimum topology -- proving the namespace join, the VPC
# attachment, and the capacity contract live. No queries run, so RPU
# charges are effectively zero. No security groups are given, so AWS
# attaches the VPC's default group (the documented default this
# component preserves). Full metadata is supplied for tagging/orphan
# cleanup.
#
# Free governance arms (depth-closure additions):
# - a daily serverless-compute usage limit with breachAction deactivate
#   (a cap is configuration, never a charge; the lane runs no queries);
# - a VPC endpoint reusing the workgroup's own subnets (the entry omits
#   subnetIds -- the documented fallback; its private address must
#   surface in the endpoint_access_addresses output map).
# Offline-proven arm with a named unblock (never silent): the custom
# domain needs an owned domain plus a VALIDATED ACM certificate -- no
# fixture kind can mint one.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsRedshiftServerlessWorkgroup
metadata:
  name: planton-oss-e2e-rswg-base
  id: planton-oss-e2e-rswg-base
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: awsredshiftserverlessworkgroup
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-west-2
  namespaceName:
    valueFrom:
      kind: AwsRedshiftServerlessNamespace
      name: planton-oss-e2e-rsns-prereq
      fieldPath: status.outputs.namespace_name
  baseCapacity: 8
  maxCapacity: 32
  subnetIds:
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-a
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-b
        fieldPath: status.outputs.subnet_id
    - valueFrom:
        kind: AwsSubnet
        name: planton-oss-e2e-awssubnet-prereq-c
        fieldPath: status.outputs.subnet_id
  usageLimits:
    - usageType: serverless-compute
      amount: 100
      period: daily
      breachAction: deactivate
  endpointAccesses:
    - endpointName: e2e-self-vpc
