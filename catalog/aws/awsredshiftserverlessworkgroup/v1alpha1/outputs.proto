syntax = "proto3";

package dev.planton.aws.awsredshiftserverlessworkgroup.v1alpha1;

// AwsRedshiftServerlessWorkgroupOutputs captures the observable
// identifiers and connection endpoint of the workgroup after deployment.
message AwsRedshiftServerlessWorkgroupOutputs {
  // The workgroup name -- the handle the Redshift Serverless APIs, the
  // credentials API (GetCredentials), and custom domain associations
  // address the workgroup by.
  string workgroup_name = 1;

  // The unique identifier AWS assigns to the workgroup.
  string workgroup_id = 2;

  // The Amazon Resource Name of the workgroup, for IAM policies and
  // usage limits.
  string arn = 3;

  // The DNS hostname SQL clients connect to.
  string endpoint_address = 4;

  // The port the workgroup accepts connections on.
  int32 port = 5;

  // The private DNS addresses of the workgroup's VPC endpoints, keyed
  // by endpoint name (spec.endpoint_accesses entries) -- what consumers
  // inside the endpoint's VPC put in connection strings.
  map<string, string> endpoint_access_addresses = 6;

  // The AWS-generated usage-limit IDs, keyed exactly as the module keys
  // each limit: "<usage_type>/<period>", with an unset period rendered
  // as "monthly" (the AWS default). These are the handles
  // `aws redshift-serverless delete-usage-limit` and state import take;
  // AWS generates them at creation time.
  map<string, string> usage_limit_ids = 7;

  // When the custom domain's ACM certificate expires (RFC 3339) --
  // empty without a custom domain. Renewals through ACM update it in
  // place.
  string custom_domain_certificate_expiry_time = 8;
}
