syntax = "proto3";

package dev.planton.aws.awsdynamodb.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsdynamodb/v1alpha1/outputs.proto";
import "catalog/aws/awsdynamodb/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AwsDynamodb is the Kubernetes-style resource envelope for a DynamoDB table.
message AwsDynamodb {
  string api_version = 1 [(buf.validate.field).string.const = "aws.planton.dev/v1alpha1"];
  string kind = 2 [(buf.validate.field).string.const = "AwsDynamodb"];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsDynamodbSpec spec = 4 [(buf.validate.field).required = true];
  AwsDynamodbStatus status = 5;
}

// AwsDynamodbStatus captures lifecycle, audit, job linkage, and observable outputs.
message AwsDynamodbStatus {
  //outputs
  AwsDynamodbOutputs outputs = 1;
}
