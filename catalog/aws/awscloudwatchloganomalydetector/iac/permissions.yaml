# Least-privilege permissions the IaC runner's AWS principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: awscloudwatchloganomalydetector
spec:
  aws:
    statements:
      - sid: CreateDetector
        actions:
          - logs:CreateLogAnomalyDetector
        resources:
          - arn:aws:logs:*:*:log-group:*
        provenance: derived
        notes: Covers aws_cloudwatch_log_anomaly_detector / cloudwatch.LogAnomalyDetector at create. The service reference scopes creation to the LOG-GROUP ARNs the detector will train over (not a detector ARN, which does not exist yet), so a hardened deployment can pin the exact groups in log_group_arns. Tag-on-create rides this call (the API accepts tags; aws:RequestTag / aws:TagKeys condition keys apply). When kms_key_id is set the runner only passes the ARN -- CloudWatch Logs uses the key through its own service principal, and the key policy permitting logs.<region>.amazonaws.com is the referenced AwsKmsKey's contract, so no kms grants belong here.
      - sid: OperateDetector
        actions:
          - logs:GetLogAnomalyDetector
          - logs:UpdateLogAnomalyDetector
          - logs:DeleteLogAnomalyDetector
        resources:
          - arn:aws:logs:*:*:anomaly-detector:*
        provenance: derived
        notes: GetLogAnomalyDetector serves every plan/refresh (it carries enabled, frequency, filter, and visibility for drift detection); UpdateLogAnomalyDetector reconciles in-place changes (enabled, evaluation_frequency, filter_pattern, anomaly_visibility_time -- everything except kms_key_id, which replaces); DeleteLogAnomalyDetector destroys. All three take resource-level scoping on the anomaly-detector ARN per the service reference. Caution the profile teaches -- the provider maps an AccessDeniedException on the Get to "detector deleted" and drops it from state, so a permissions regression on this statement masquerades as deletion.
      - sid: TagDetector
        actions:
          - logs:TagResource
          - logs:UntagResource
          - logs:ListTagsForResource
        resources:
          - arn:aws:logs:*:*:anomaly-detector:*
        provenance: derived
        notes: Both modules tag (tags = local.aws_tags / the Pulumi tag map), so tag reconciliation and the tag read on every refresh run against the detector ARN. The service reference scopes all three actions to the anomaly-detector ARN format (they also accept log-group, delivery, and destination ARNs, none of which this component tags).
