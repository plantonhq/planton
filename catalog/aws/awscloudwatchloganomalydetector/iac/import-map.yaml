# Where each placeholder in this component's import-ID formats comes
# from (the formats themselves live in aa_import/catalog.yaml).
apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: awscloudwatchloganomalydetector
spec:
  values:
    - name: anomaly_detector_arn
      derivations:
        - from_output: anomaly_detector_arn
      where_to_find: >-
        The detector's ARN -- `aws logs list-log-anomaly-detectors`
        (anomalyDetectorArn), or CloudWatch console -> Logs -> Log
        anomalies.
