syntax = "proto3";

package dev.planton.aws.awscloudwatchloganomalydetector.v1alpha1;

import "catalog/aws/awscloudwatchloganomalydetector/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsCloudwatchLogAnomalyDetectorIacInput is the input for the IaC
// modules that manage a CloudWatch Logs anomaly detector.
message AwsCloudwatchLogAnomalyDetectorIacInput {
