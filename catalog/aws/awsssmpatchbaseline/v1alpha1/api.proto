syntax = "proto3";

package dev.planton.aws.awsssmpatchbaseline.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awsssmpatchbaseline/v1alpha1/outputs.proto";
import "catalog/aws/awsssmpatchbaseline/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsSsmPatchBaseline {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsSsmPatchBaseline'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsSsmPatchBaselineSpec spec = 4 [(buf.validate.field).required = true];
  AwsSsmPatchBaselineStatus status = 5;
}

message AwsSsmPatchBaselineStatus {
  AwsSsmPatchBaselineOutputs outputs = 1;
}
