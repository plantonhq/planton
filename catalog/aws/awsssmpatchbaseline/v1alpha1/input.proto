syntax = "proto3";

package dev.planton.aws.awsssmpatchbaseline.v1alpha1;

import "catalog/aws/awsssmpatchbaseline/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsSsmPatchBaselineIacInput is the input for the IaC modules that
// manage a patch baseline with its folded patch groups and default
// designation.
message AwsSsmPatchBaselineIacInput {
  // target is the AwsSsmPatchBaseline resource to deploy.
  AwsSsmPatchBaseline target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
