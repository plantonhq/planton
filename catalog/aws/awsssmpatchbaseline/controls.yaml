# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: awsssmpatchbaseline
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A patch baseline stores no data -- approval rules, filters, and patch lists are policy held in Systems Manager's managed control plane. There is no data store on this component for an encryption posture to apply to.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: With no data store there is no key surface -- the patch baseline API exposes no customer-managed-key option.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The Systems Manager API is HTTPS-only, and patching instructions reach nodes through the SSM Agent's TLS channel. Package downloads themselves ride each repository's own transport -- the OS-default repos AWS points at serve over HTTPS.
      notes: Alternative repositories (sources) are the one place plaintext could enter -- an http yum/apt repo line in a source's configuration would fetch packages unencrypted; keep custom repo definitions on https.
    - control_id: no-public-access
      status: not_applicable
      notes: A baseline exposes no endpoint -- it is approval policy consulted by patch operations. Nothing about it is internet-addressable.
    - control_id: restricted-ingress
      status: not_applicable
      notes: Nothing listens on a baseline; there is no inbound network surface to restrict.
    - control_id: edge-protection
      status: not_applicable
      notes: With no request-serving surface there is no WAF attachment point; edge filtering has no meaning for patch policy.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every baseline operation is IAM-authorized. Reads, updates, deletes, patch-group registrations, and the default designation scope to the baseline's own ARN (arn:aws:ssm:region:account:patchbaseline/pb-...); only creation is authorized account-wide (the service reference publishes no resource type for CreatePatchBaseline).
    - control_id: workload-identity
      status: not_applicable
      notes: A baseline runs no workload -- patch operations execute on each node under that instance's IAM instance profile, on the association or window that schedules them.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: "Systems Manager has a single authentication path: SigV4-signed IAM requests; no legacy or weaker protocol exists to disable on a policy object."
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Baseline create/update/delete, every patch-group registration change, and default-baseline claims are management events captured in CloudTrail unconditionally -- who loosened the fleet's patch approval policy, and when, is always on the record.
    - control_id: monitoring-integration
      status: configurable
      field_path: approval_rules.compliance_level
      evidence:
        type: spec_default
        reference: Unset reports missed patches at UNSPECIFIED severity -- technically visible, practically unranked. Setting the level (CRITICAL for security rules) makes every node missing a rule-approved patch surface at that severity in Systems Manager Compliance, where dashboards, AWS Config, and downstream alerting can rank fleet exposure.
      notes: approved_patches_compliance_level and available_security_updates_compliance_status are the companion dials for the explicit-approval list and Windows' not-yet-approved security updates respectively.
    - control_id: backup-recovery
      status: not_applicable
      notes: There is nothing to back up -- the baseline is pure policy, recreatable by re-applying the manifest (AWS regenerates the pb- ID; patch-group registrations and the default designation re-fold with it).
    - control_id: backup-retention-policy
      status: not_applicable
      notes: With no backup facility there is no backup retention to set; no field of this spec governs retention of any stored data.
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Patch Manager is a regional managed service AWS operates across availability zones; a baseline has no zonal footprint the manifest could configure.
    - control_id: deletion-protection
      status: not_applicable
      notes: "No deletion-protection flag exists on a baseline. Destroy has a designed safety net: deleting a baseline that held the default designation RESTORES AWS's own predefined default baseline for the OS (the provider records and reverts to it), so the fleet falls back to AWS's stock policy rather than patching against nothing."
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- AWS operates and patches the Patch Manager machinery and maintains the patch metadata the filters select over; the baseline exposes no runtime of its own. It is also the policy half of the catalog's managed-patching story -- the baseline decides WHAT a fleet may install, and the association or maintenance window running AWS-RunPatchBaseline decides WHEN.
