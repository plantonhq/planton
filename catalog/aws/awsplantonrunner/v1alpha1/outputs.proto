syntax = "proto3";

package dev.planton.aws.awsplantonrunner.v1alpha1;

// AwsPlantonRunnerOutputs captures the observable identifiers of a
// deployed runner appliance -- the handles for day-2 operations: tailing
// the runner's logs, granting its runtime role permissions, and letting
// private targets admit traffic from its security group.
message AwsPlantonRunnerOutputs {
  // The ARN of the compute service keeping the runner running (e.g.
  // "arn:aws:ecs:us-west-2:123456789012:service/<name>/<name>"). The
  // primary handle for inspecting the appliance with AWS tooling.
  string service_arn = 1;

  // The service's name (metadata.name).
  string service_name = 2;

  // The ARN of the dedicated compute cluster the runner runs in.
  string cluster_arn = 3;

  // The full task definition ARN (family:revision) of the running
  // revision -- changes on every configuration or version change.
  string task_definition_arn = 4;

  // The CloudWatch log group carrying the runner's logs -- the audit
  // trail of every operation the runner executed
  // (e.g. "aws logs tail <log_group_name> --follow").
  string log_group_name = 5;

  // The id of the outbound-only security group created for the runner.
  // Private targets that admit traffic by source security group (a
  // cluster API endpoint, a database) reference this id to trust the
  // runner.
  string security_group_id = 6;

  // The ARN of the execution role -- the setup identity that pulls the
  // runner image, writes its logs, and reads its token secret.
  string execution_role_arn = 7;

  // The ARN of the runner's runtime IAM role -- the identity the runner
  // holds while executing work. Grant this role permissions to let
  // keyless cloud operations run through the runner (it is the
  // referenced task_role when one was supplied, else the
  // permissionless role created with the appliance).
  string task_role_arn = 8;

  // The ARN of the Secrets Manager secret holding the runner token. The
  // ECS agent injects it at task start; the token authorizes joining and
  // is never the runner's identity.
  string token_secret_arn = 9;

  // The AWS region the runner was deployed in. Echoed so downstream
  // tooling and verifiers can target the correct region.
  string region = 10;

  // The name the runner registers itself under with the control plane --
  // the value shown by `planton runner list` the moment it joins.
  string runner_name = 11;
}
