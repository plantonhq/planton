syntax = "proto3";

package dev.planton.aws.awslambdaeventsourcemapping.v1alpha1;

import "catalog/aws/awslambdaeventsourcemapping/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsLambdaEventSourceMappingIacInput is the input for the
// aws-lambda-event-source-mapping IaC modules.
message AwsLambdaEventSourceMappingIacInput {
  // the catalog object to deploy
  AwsLambdaEventSourceMapping target = 1;

  // provider-config
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
