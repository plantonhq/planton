syntax = "proto3";

package dev.planton.aws.awscloudtraileventdatastore.v1alpha1;

import "catalog/aws/awscloudtraileventdatastore/v1alpha1/api.proto";
import "catalog/aws/provider.proto";

// AwsCloudTrailEventDataStoreIacInput is the input for the IaC
// modules that manage a CloudTrail Lake event data store.
message AwsCloudTrailEventDataStoreIacInput {
  // target is the AwsCloudTrailEventDataStore resource to deploy.
  AwsCloudTrailEventDataStore target = 1;
  // provider_config contains the AWS provider credentials and configuration.
  dev.planton.aws.AwsProviderConfig provider_config = 2;
}
