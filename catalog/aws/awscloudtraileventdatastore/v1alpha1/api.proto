syntax = "proto3";

package dev.planton.aws.awscloudtraileventdatastore.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/aws/awscloudtraileventdatastore/v1alpha1/outputs.proto";
import "catalog/aws/awscloudtraileventdatastore/v1alpha1/spec.proto";
import "shared/metadata.proto";

message AwsCloudTrailEventDataStore {
  string api_version = 1 [(buf.validate.field).string.const = 'aws.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'AwsCloudTrailEventDataStore'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  AwsCloudTrailEventDataStoreSpec spec = 4 [(buf.validate.field).required = true];
  AwsCloudTrailEventDataStoreStatus status = 5;
}

message AwsCloudTrailEventDataStoreStatus {
  AwsCloudTrailEventDataStoreOutputs outputs = 1;
}
