syntax = "proto3";

package dev.planton.stripe.stripepaymentlink.v1alpha1;

import "catalog/stripe/provider.proto";
import "catalog/stripe/stripepaymentlink/v1alpha1/api.proto";

// StripePaymentLinkIacInput is the input to the StripePaymentLink IaC module.
// It contains the target resource and the Stripe provider configuration.
message StripePaymentLinkIacInput {
  // target is the StripePaymentLink resource to be deployed.
  StripePaymentLink target = 1;

  // provider_config contains the Stripe key, its mode, and optionally the Connect account to act
  // on. The key needs "Payment Links" write.
  dev.planton.stripe.StripeProviderConfig provider_config = 2;
}
