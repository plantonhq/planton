# The second act of minimal: a new quantity. The provider never sends a line
# item's quantity on update, so the module's tracker replaces the link: a new
# address, and the old link deactivated.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripePaymentLink
metadata:
  name: e2e-payment-link
  org: e2e-org
  env: testing
  annotations:
    planton.dev/e2e-second-act: minimal.yaml
    planton.dev/e2e-expect-upgrade: replaced
spec:
  lineItems:
    - price:
        valueFrom:
          kind: StripePrice
          name: e2e-price-prereq
      quantity: 2
  metadata:
    planton_e2e_run: ${E2E_RUN_ID}
