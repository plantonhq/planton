# A subscription page on the monthly price prerequisite: an adjustable
# quantity, a 14-day trial that cancels without a payment method, promotion
# codes, a custom field, custom text, and Stripe's confirmation page with a
# message. The field's text block is present with no bounds (the optional
# scalars inside a present block left out).
apiVersion: stripe.planton.dev/v1alpha1
kind: StripePaymentLink
metadata:
  name: e2e-payment-link-trial
  org: e2e-org
  env: testing
spec:
  lineItems:
    - price:
        valueFrom:
          kind: StripePrice
          name: e2e-price-prereq
      quantity: 1
      adjustableQuantity:
        enabled: true
        maximum: 10
  allowPromotionCodes: true
  subscriptionData:
    description: e2e ${E2E_RUN_ID} trial
    trialPeriodDays: 14
    trialSettings:
      endBehavior:
        missingPaymentMethod: cancel
  paymentMethodCollection: if_required
  customFields:
    - key: company
      label: Company name
      text: {}
      optional: true
  customText:
    submit:
      message: Your trial starts today.
  afterCompletion:
    hostedConfirmation:
      customMessage: Welcome aboard.
  billingAddressCollection: required
  inactiveMessage: e2e ${E2E_RUN_ID} ended
