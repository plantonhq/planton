apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: stripepaymentlink
spec:
  # Lanes run against the dedicated Stripe test sandbox only (STRIPE_API_KEY,
  # refused unless it is a test-mode key).
  # A payment link is deactivated on destroy, and the verifier proves it
  # reads back inactive; every run's link carries the run in its metadata and
  # stays in the sandbox, deactivated. Its registry prerequisite, the
  # run-named monthly StripePrice (with its product), deploys first on
  # OpenTofu and is archived after. The import round trip re-creates only the
  # price tracker, which has no importer by design. Awaiting its first live
  # run, so no provisioner is claimed yet.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 5
