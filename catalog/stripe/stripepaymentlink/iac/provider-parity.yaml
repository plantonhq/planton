      - spec: spec.line_items.adjustable_quantity.minimum
        arg: line_items
      - spec: spec.line_items.price
        arg: line_items
      - spec: spec.line_items.quantity
        arg: line_items
      - spec: spec.managed_payments.enabled
        arg: managed_payments
      - spec: spec.name_collection.business.enabled
