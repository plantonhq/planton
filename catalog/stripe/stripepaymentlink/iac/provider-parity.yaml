      - spec: spec.payment_intent_data.description
        arg: payment_intent_data
      - spec: spec.payment_intent_data.metadata
        arg: payment_intent_data
      - spec: spec.payment_intent_data.setup_future_usage
        arg: payment_intent_data
      - spec: spec.payment_intent_data.statement_descriptor
        arg: payment_intent_data
      - spec: spec.payment_intent_data.statement_descriptor_suffix
        arg: payment_intent_data
      - spec: spec.payment_intent_data.transfer_group
        arg: payment_intent_data
      - spec: spec.payment_method_options.card.restrictions.brands_blocked
