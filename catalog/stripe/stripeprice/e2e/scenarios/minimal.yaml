# A monthly price on a run-named product (the registry prerequisite, deployed
# first on OpenTofu), updated in place (the nickname carries the run), and
# archived on destroy. The recurring block sets only its interval, so every
# optional scalar inside it is left out.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripePrice
metadata:
  name: e2e-price
  org: e2e-org
  env: testing
  annotations:
    planton.dev/e2e-upgrade-manifest: minimal.to.yaml
spec:
  product:
    valueFrom:
      kind: StripeProduct
      name: e2e-product-prereq
  currency: usd
  unitAmount: 1000
  recurring:
    interval: month
  lookupKey: e2e-${E2E_RUN_ID}-${E2E_SCENARIO}
  nickname: e2e ${E2E_RUN_ID}
  metadata:
    planton_e2e_run: ${E2E_RUN_ID}
