# A one-time price whose amount the customer chooses in Checkout, between a
# minimum and a maximum, starting at a preset.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripePrice
metadata:
  name: e2e-price-custom
  org: e2e-org
  env: testing
spec:
  product:
    valueFrom:
      kind: StripeProduct
      name: e2e-product-prereq
  currency: usd
  customUnitAmount:
    minimum: 500
    preset: 2500
    maximum: 50000
  nickname: e2e ${E2E_RUN_ID} customer chooses
