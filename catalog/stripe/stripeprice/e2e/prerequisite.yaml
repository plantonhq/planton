# The install profile a consumer's scenario gets when it names StripePrice as
# a prerequisite: a monthly price on the run-named product (its own registry
# prerequisite, deployed first). A payment link sells it. Archived after the
# consumer's scenario.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripePrice
metadata:
  name: e2e-price-prereq
  org: e2e-org
  env: testing
spec:
  product:
    valueFrom:
      kind: StripeProduct
      name: e2e-product-prereq
  currency: usd
  unitAmount: 1500
  recurring:
    interval: month
  nickname: e2e ${E2E_RUN_ID} prerequisite price
