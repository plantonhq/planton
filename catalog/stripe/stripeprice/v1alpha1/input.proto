syntax = "proto3";

package dev.planton.stripe.stripeprice.v1alpha1;

import "catalog/stripe/provider.proto";
import "catalog/stripe/stripeprice/v1alpha1/api.proto";

// StripePriceIacInput is the input to the StripePrice IaC module.
// It contains the target resource and the Stripe provider configuration.
message StripePriceIacInput {
  // target is the StripePrice resource to be deployed.
  StripePrice target = 1;

  // provider_config contains the Stripe key, its mode, and optionally the Connect account to act
  // on. The key needs "Prices" write.
  dev.planton.stripe.StripeProviderConfig provider_config = 2;
}
