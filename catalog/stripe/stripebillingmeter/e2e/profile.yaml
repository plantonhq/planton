kind: ComponentE2EProfile
metadata:
  name: stripebillingmeter
spec:
  # Lanes run against the dedicated Stripe test sandbox only (STRIPE_API_KEY,
  # refused unless it is a test-mode key).
  # A meter is deactivated on destroy, and the verifier proves its status
