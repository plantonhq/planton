syntax = "proto3";

package dev.planton.stripe.stripepromotioncode.v1alpha1;

// StripePromotionCodeStackOutputs identifies the promotion code.
//
// https://registry.terraform.io/providers/stripe/stripe/latest/docs/resources/promotion_code
message StripePromotionCodeStackOutputs {
  // id is the promotion code's Stripe id (promo_...). It changes when the code is replaced.
  string id = 1;

  // code is what customers type: the declared code, or the one Stripe generated.
  string code = 2;

  // active is false once the code is deactivated (by destroy, by spec.active, or in the
  // Dashboard).
  bool active = 3;
}
