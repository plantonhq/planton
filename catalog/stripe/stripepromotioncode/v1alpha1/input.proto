syntax = "proto3";

package dev.planton.stripe.stripepromotioncode.v1alpha1;

import "catalog/stripe/provider.proto";
import "catalog/stripe/stripepromotioncode/v1alpha1/api.proto";

// StripePromotionCodeIacInput is the input to the StripePromotionCode IaC module.
// It contains the target resource and the Stripe provider configuration.
message StripePromotionCodeIacInput {
  // target is the StripePromotionCode resource to be deployed.
  StripePromotionCode target = 1;

  // provider_config contains the Stripe key, its mode, and optionally the Connect account to act
  // on. The key needs "Promotion Codes" write.
  dev.planton.stripe.StripeProviderConfig provider_config = 2;
}
