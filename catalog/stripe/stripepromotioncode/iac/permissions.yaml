# Least-privilege permissions the IaC runner's Stripe key needs to provision, update, and
# destroy this component with the official module. Stripe authenticates with a restricted API
# key whose permissions are a Read or Write choice per resource on the Dashboard's restricted-key
# form (Write includes Read); the stripe/stripe provider (0.3.0, iac/tf/provider.tf) sends it as
# a bearer token. Resource names are the form's labels. Every group is `derived` (static analysis
# of the module and the provider's calls, cited in notes) until a live run under a key built from
# exactly this file upgrades it to `proven` -- Stripe's refusal names the missing permission, so
# that run also proves each label.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: stripepromotioncode
spec:
  stripe:
    groups:
      - purpose: ManagePromotionCode
        permissions:
          - resource: Promotion Codes
            access: write
        provenance: derived
        notes: The module (iac/tf/main.tf) manages stripe_promotion_code. The provider creates it with POST /v1/promotion_codes, reads it with GET /v1/promotion_codes/{id}, updates it with POST /v1/promotion_codes/{id}, and deactivates it on destroy with POST /v1/promotion_codes/{id} (active=false) (terraform-provider-stripe internal/provider/resources/resource_stripe_promotion_code.go); POST is Write, which includes the Read the refresh needs. The coupon it redeems is only referenced, never read by the module.
