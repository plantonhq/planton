# A run-named code on a run-named coupon (the registry prerequisite, deployed
# first on OpenTofu), updated in place (the metadata carries the run), and
# deactivated on destroy. The code is run-named because a deactivated code
# stays in the sandbox.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripePromotionCode
metadata:
  name: e2e-promotion-code
  org: e2e-org
  env: testing
spec:
  coupon:
    valueFrom:
      kind: StripeCoupon
      name: e2e-coupon-prereq
  code: E2E-${E2E_RUN_ID}-${E2E_SCENARIO}
  metadata:
    planton_e2e_run: ${E2E_RUN_ID}
