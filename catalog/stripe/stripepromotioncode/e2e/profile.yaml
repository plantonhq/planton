apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: stripepromotioncode
spec:
  # Held at pending_proof. The minimal scenario passes live on OpenTofu on
  # a StripeCoupon deployed first. The restricted scenario cannot pass on the
  # pinned provider: Stripe returns a code's minimums in other currencies only
  # when a read expands them, and the provider's create then rejects its own
  # result.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 5
