apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: stripepromotioncode
spec:
  # Proven live on OpenTofu against the test sandbox on a StripeCoupon
  # deployed first: the minimal and restricted scenarios (a one-currency
  # minimum, an expiry from the lane's clock), blind import, and destroy
  # deactivating the code. Minimums in other currencies are refused by
  # validation, because the pinned provider can't hold them.
  tier: 1
  status: green
  validated_provisioners:
    - tofu
  timeout_minutes: 5
