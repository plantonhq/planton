# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: stripepromotioncode
spec:
  billing_model: free
  free_tier: "Stripe publishes no price for promotion codes: every account, sandboxes included, can create them (docs.stripe.com/billing/subscriptions/coupons)."
  notes: "A code redeems a coupon; Stripe's own fees apply to each payment made with it (stripe.com/pricing), never to the code object."
