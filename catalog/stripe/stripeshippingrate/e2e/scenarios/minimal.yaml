# Free shipping with only a name and a currency: the amount is 0 and left out
# of the manifest, and there is no delivery estimate. Updated in place (the
# metadata carries the run) and deactivated on destroy.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripeShippingRate
metadata:
  name: e2e-shipping-rate
  org: e2e-org
  env: testing
spec:
  displayName: e2e ${E2E_RUN_ID} free
  fixedAmount:
    currency: usd
  metadata:
    planton_e2e_run: ${E2E_RUN_ID}
