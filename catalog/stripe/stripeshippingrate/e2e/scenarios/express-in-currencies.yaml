# Express shipping with a euro amount and an open-ended delivery estimate
# (only a minimum), so a present parent block with one child left out is
# exercised.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripeShippingRate
metadata:
  name: e2e-shipping-rate-express
  org: e2e-org
  env: testing
spec:
  displayName: e2e ${E2E_RUN_ID} express
  fixedAmount:
    amount: 1500
    currency: usd
    currencyOptions:
      eur:
        amount: 1400
  deliveryEstimate:
    minimum:
      unit: day
      value: 1
  taxBehavior: inclusive
