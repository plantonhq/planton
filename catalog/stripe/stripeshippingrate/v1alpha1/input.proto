syntax = "proto3";

package dev.planton.stripe.stripeshippingrate.v1alpha1;

import "catalog/stripe/provider.proto";
import "catalog/stripe/stripeshippingrate/v1alpha1/api.proto";

// StripeShippingRateStackInput is the input to the StripeShippingRate IaC module.
// It contains the target resource and the Stripe provider configuration.
message StripeShippingRateStackInput {
  // target is the StripeShippingRate resource to be deployed.
  StripeShippingRate target = 1;

  // provider_config contains the Stripe key, its mode, and optionally the Connect account to act
  // on. The key needs "Shipping Rates" write.
  dev.planton.stripe.StripeProviderConfig provider_config = 2;
}
