# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/componentcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostProfile
metadata:
  name: stripeshippingrate
spec:
  billing_model: free
  free_tier: "Stripe publishes no price for shipping rates: every account, sandboxes included, can create them (docs.stripe.com/payments/during-payment/charge-shipping)."
  notes: "A shipping rate adds to what customers pay; Stripe's own fees apply to each payment (stripe.com/pricing), never to the rate object."
