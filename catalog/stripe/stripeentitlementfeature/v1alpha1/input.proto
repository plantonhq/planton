syntax = "proto3";

package dev.planton.stripe.stripeentitlementfeature.v1alpha1;

import "catalog/stripe/provider.proto";
import "catalog/stripe/stripeentitlementfeature/v1alpha1/api.proto";

// StripeEntitlementFeatureStackInput is the input to the StripeEntitlementFeature IaC module.
// It contains the target resource and the Stripe provider configuration.
message StripeEntitlementFeatureStackInput {
  // target is the StripeEntitlementFeature resource to be deployed.
  StripeEntitlementFeature target = 1;

  // provider_config contains the Stripe key, its mode, and optionally the Connect account to act
  // on. The key needs "Entitlements" write.
  dev.planton.stripe.StripeProviderConfig provider_config = 2;
}
