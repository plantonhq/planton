syntax = "proto3";

package dev.planton.stripe.stripeentitlementfeature.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/stripe/stripeentitlementfeature/v1alpha1/outputs.proto";
import "catalog/stripe/stripeentitlementfeature/v1alpha1/spec.proto";
import "shared/metadata.proto";

// StripeEntitlementFeature is a kind that declares one capability a customer can be entitled
// to in Stripe Entitlements, identified by a lookup key the application checks.
//
// Products grant features (StripeProduct lists them under features), and Stripe reports each
// subscribed customer's active entitlements. Destroy archives the feature; Stripe keeps it.
//
// Use cases:
// - Gate application features on what a customer's subscription grants, not on price ids
// - Keep the same feature names across every environment's Stripe account
//
// Example manifest:
// ```yaml
// apiVersion: stripe.planton.dev/v1alpha1
// kind: StripeEntitlementFeature
// metadata:
//   name: api-access
//   org: my-organization
// spec:
//   lookupKey: api-access
//   name: API access
// ```
message StripeEntitlementFeature {
  // api_version is the version of the Stripe API resource.
  // Must be "stripe.planton.dev/v1alpha1" for this version.
  string api_version = 1 [(buf.validate.field).string.const = 'stripe.planton.dev/v1alpha1'];

  // kind is the Kubernetes Resource Model (KRM) kind.
  // Must be "StripeEntitlementFeature" for this resource type.
  string kind = 2 [(buf.validate.field).string.const = 'StripeEntitlementFeature'];

  // metadata contains standard catalog object metadata.
  // - name: Unique identifier for the resource within Planton
  // - org: Organization that owns it
  // - env: Environment it is deployed from
  // - labels: Key-value pairs for filtering and organization
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec contains the feature's lookup key and name.
  StripeEntitlementFeatureSpec spec = 4 [(buf.validate.field).required = true];

  // status contains the feature as created, populated after deployment.
  StripeEntitlementFeatureStatus status = 5;
}

// StripeEntitlementFeatureStatus represents the current state of a StripeEntitlementFeature
// resource. Populated by the deployment system.
message StripeEntitlementFeatureStatus {
  // outputs contains the outputs: the feature's id, the id products grant it by.
  StripeEntitlementFeatureOutputs outputs = 1;
}
