# A feature created, read back, renamed in place (the name carries the run),
# and archived on destroy. The lookup key carries the run, so an archived
# feature never collides with the next run's.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripeEntitlementFeature
metadata:
  name: e2e-entitlement-feature
  org: e2e-org
  env: testing
spec:
  lookupKey: e2e-${E2E_RUN_ID}-${E2E_SCENARIO}
  name: e2e ${E2E_RUN_ID} feature
  metadata:
    planton_e2e_run: ${E2E_RUN_ID}
