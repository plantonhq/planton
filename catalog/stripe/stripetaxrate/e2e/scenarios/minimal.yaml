# A rate with only a name and a percentage (exclusive, no country), updated
# in place (the description carries the run) and deactivated on destroy.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripeTaxRate
metadata:
  name: e2e-tax-rate
  org: e2e-org
  env: testing
spec:
  displayName: e2e tax
  percentage: 7.5
  description: e2e ${E2E_RUN_ID}
