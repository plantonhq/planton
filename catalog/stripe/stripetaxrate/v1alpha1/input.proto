syntax = "proto3";

package dev.planton.stripe.stripetaxrate.v1alpha1;

import "catalog/stripe/provider.proto";
import "catalog/stripe/stripetaxrate/v1alpha1/api.proto";

// StripeTaxRateIacInput is the input to the StripeTaxRate IaC module.
// It contains the target resource and the Stripe provider configuration.
message StripeTaxRateIacInput {
  // target is the StripeTaxRate resource to be deployed.
  StripeTaxRate target = 1;

  // provider_config contains the Stripe key, its mode, and optionally the Connect account to act
  // on. The key needs "Tax Rates" write.
  dev.planton.stripe.StripeProviderConfig provider_config = 2;
}
