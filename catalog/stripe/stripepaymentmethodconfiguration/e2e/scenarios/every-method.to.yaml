# The second act of every-method: Link turned off. A configuration that names methods the account is
# not offered still updates in place.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripePaymentMethodConfiguration
metadata:
  name: e2e-pmc-every-method
  org: e2e-org
  env: testing
  annotations:
    planton.dev/e2e-second-act: every-method.yaml
    planton.dev/e2e-expect-upgrade: in-place
