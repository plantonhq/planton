# Every method the kind knows named at once, four on and the rest off: the shape a configuration
# takes when it must never drift with Stripe's defaults. Stripe reports no availability for some
# methods in some accounts, and the outputs must read that as not available rather than fail.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripePaymentMethodConfiguration
metadata:
  name: e2e-pmc-every-method
  org: e2e-org
  env: testing
  annotations:
    planton.dev/e2e-upgrade-manifest: every-method.to.yaml
    planton.dev/e2e-import-roundtrip-skip: >-
      Stripe returns no preference for a method the account is not offered, so a blind import holds
      none, and Stripe then refuses the first update that names such a method ("not available to
      this account"). A configuration naming unoffered methods is created and changed by Planton,
      never adopted by import.
spec:
  name: e2e-${E2E_RUN_ID}-${E2E_SCENARIO}
  card:
    preference: "on"
  applePay:
    preference: "on"
  googlePay:
    preference: "on"
  link:
    preference: "on"
  acssDebit:
    preference: "off"
  affirm:
    preference: "off"
  afterpayClearpay:
    preference: "off"
  alipay:
    preference: "off"
  alma:
    preference: "off"
  amazonPay:
    preference: "off"
  applePayLater:
    preference: "off"
  auBecsDebit:
    preference: "off"
  bacsDebit:
    preference: "off"
  bancontact:
    preference: "off"
  billie:
    preference: "off"
