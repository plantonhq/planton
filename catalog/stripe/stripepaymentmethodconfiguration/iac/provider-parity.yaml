# Provider-parity manifest: this kind's recorded judgment against the pinned
# stripe provider (checked by `planton provider-parity --check`; format
# documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# The provider (Terraform Plugin Framework) nests exclusively via nested
# attributes, which distill to single flat args -- so each of the 59 payment
# methods is ONE provider argument whose only settable member is
# display_preference.preference. The spec models each as a typed
# StripePaymentMethodPreference; fan-in mappings record the one spec leaf each
# argument realizes. name, active and parent match by exact name.
resources:
  stripe_payment_method_configuration:
    mappings:
      - spec: spec.acss_debit.preference
        arg: acss_debit
      - spec: spec.affirm.preference
        arg: affirm
      - spec: spec.afterpay_clearpay.preference
        arg: afterpay_clearpay
