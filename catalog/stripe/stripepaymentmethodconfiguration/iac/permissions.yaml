# Least-privilege permissions the IaC runner's Stripe key needs to provision, update, and
# destroy this component with the official module. Stripe authenticates with a restricted API
# key whose permissions are a Read or Write choice per resource on the Dashboard's restricted-key
# form (Write includes Read); the stripe/stripe provider (0.3.0, iac/tf/provider.tf) sends it as
# a bearer token. Resource names are the form's labels. Every group is `derived` (static analysis
# of the module and the provider's calls, cited in notes) until a live run under a key built from
# exactly this file upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: stripepaymentmethodconfiguration
spec:
  stripe:
    groups:
      - purpose: ManagePaymentMethodConfiguration
        permissions:
          - resource: Payment Method Configurations
            access: write
        provenance: proven
        notes: The module (iac/tf/main.tf) manages stripe_payment_method_configuration. The provider creates it with POST /v1/payment_method_configurations, reads it with GET /v1/payment_method_configurations/{id}, and updates and deactivates it with POST /v1/payment_method_configurations/{id} -- there is no delete (terraform-provider-stripe internal/provider/resources/resource_stripe_payment_method_configuration.go). Proven 2026-10-02 by a live install in a test-mode sandbox under a restricted key holding exactly this group and the other two billing kinds' groups (Webhook Endpoints write, Customer portal write) and nothing else -- a configuration naming all 58 methods (four on, the rest off) was created, then refreshed and converged on a second install.
