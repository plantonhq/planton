# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: stripepaymentmethodconfiguration
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The component is a payment-method configuration (a preference per method) inside Stripe's SaaS; its storage is Stripe's provider-managed posture, with no encryption seam in this spec.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: There is no data at rest at this component's level to key (see enc-at-rest); Stripe exposes no customer-managed-key surface on this object.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The object terminates no connections. Checkout collects payment details on Stripe's HTTPS pages and elements, and the API calls that write it travel to Stripe's HTTPS-only API.
    - control_id: no-public-access
      status: not_applicable
      notes: A configuration has no endpoint of its own; it decides which methods Stripe's checkout shows.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No inbound network surface exists to filter (see no-public-access).
    - control_id: edge-protection
      status: not_applicable
      notes: Checkout is served from Stripe's own infrastructure, behind Stripe's provider-managed edge.
    - control_id: rbac
      status: not_applicable
      notes: WHO may change the account's configuration is governed at the Stripe account level -- restricted-key permissions (iac/permissions.yaml) and Dashboard team roles -- with no per-object access-control surface in this spec.
    - control_id: workload-identity
      status: not_applicable
      notes: The object authenticates to nothing; the key the IaC runner presents is the provider connection's concern (iac/permissions.yaml), and its mode is checked against the connection's declared mode on every deploy.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The object carries no credential path of its own.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The object never decides how a person proves who they are; Dashboard sign-in and two-step verification are the Stripe account's settings.
    - control_id: audit-logging
      status: not_applicable
      notes: The spec exposes no audit toggle. Every change is an API request recorded in the account's request logs and events in the Dashboard (Developers -> Logs and Events).
    - control_id: monitoring-integration
      status: not_applicable
      notes: Neither the spec nor the module exposes a metrics surface; Stripe's Dashboard reports on the object's use.
    - control_id: backup-recovery
      status: not_applicable
      notes: The object is declaratively re-creatable from the manifest, so the manifest is the recovery point.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist at this component's level to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The object has no placement to configure; its availability is Stripe's SaaS platform posture.
    - control_id: deletion-protection
      status: not_applicable
      notes: Destroy deletes nothing -- Stripe has no delete for a configuration, so the provider deactivates it and Stripe keeps it forever.
    - control_id: managed-patching
      status: not_applicable
      notes: A pure configuration object with no software of its own to patch; Stripe runs and patches everything behind it.
