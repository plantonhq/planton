syntax = "proto3";

package dev.planton.stripe.stripepaymentmethodconfiguration.v1alpha1;

import "catalog/stripe/provider.proto";
import "catalog/stripe/stripepaymentmethodconfiguration/v1alpha1/api.proto";

// StripePaymentMethodConfigurationStackInput is the input to the StripePaymentMethodConfiguration
// IaC module. It contains the target resource and the Stripe provider configuration.
message StripePaymentMethodConfigurationStackInput {
  // target is the StripePaymentMethodConfiguration resource to be deployed.
  StripePaymentMethodConfiguration target = 1;

  // provider_config contains the Stripe key, its mode, and optionally the Connect account to act
  // on. The key needs "Payment Method Configurations" write.
  dev.planton.stripe.StripeProviderConfig provider_config = 2;
}
