syntax = "proto3";

package dev.planton.stripe.stripeeventdestination.v1alpha1;

import "catalog/stripe/provider.proto";
import "catalog/stripe/stripeeventdestination/v1alpha1/api.proto";

// StripeEventDestinationStackInput is the input to the StripeEventDestination IaC module.
// It contains the target resource and the Stripe provider configuration.
message StripeEventDestinationStackInput {
  // target is the StripeEventDestination resource to be deployed.
  StripeEventDestination target = 1;

  // provider_config contains the Stripe key, its mode, and optionally the Connect account to act
  // on. The key needs "Event Destinations" write.
  dev.planton.stripe.StripeProviderConfig provider_config = 2;
}
