apiVersion: stripe.planton.dev/v1alpha1
kind: StripeEventDestination
metadata:
  name: billing-thin-events
  org: example-org
  env: production
spec:
  name: Billing thin events
  description: Meter errors for the billing service
  eventPayload: thin
  enabledEvents:
    - v1.billing.meter.error_report_triggered
    - v1.billing.meter.no_meter_found
  webhookEndpoint:
    url: https://app.example.com/stripe/thin
