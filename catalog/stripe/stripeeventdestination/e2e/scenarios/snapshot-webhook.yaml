# A snapshot-event webhook destination, the classic webhook shape through
# the v2 API, routed from the account itself.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripeEventDestination
metadata:
  name: e2e-event-destination-snapshot
  org: e2e-org
  env: testing
spec:
  name: e2e-${E2E_RUN_ID}-${E2E_SCENARIO}
  eventPayload: snapshot
  eventsFrom:
    - "@self"
  enabledEvents:
    - invoice.paid
    - customer.subscription.updated
  webhookEndpoint:
    url: https://example.com/stripe/e2e-${E2E_RUN_ID}-snapshot
