# A thin-event webhook destination created (its signing secret captured),
# read back, updated in place (the description carries the run), and deleted
# on destroy.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripeEventDestination
metadata:
  name: e2e-event-destination
  org: e2e-org
  env: testing
spec:
  name: e2e-${E2E_RUN_ID}-${E2E_SCENARIO}
  description: e2e ${E2E_RUN_ID}
  eventPayload: thin
  enabledEvents:
    - v1.billing.meter.error_report_triggered
  webhookEndpoint:
    url: https://example.com/stripe/e2e-${E2E_RUN_ID}
  metadata:
    planton_e2e_run: ${E2E_RUN_ID}
