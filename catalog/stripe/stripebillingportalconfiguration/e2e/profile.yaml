apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: stripebillingportalconfiguration
spec:
  # Held at pending_proof. The minimal scenario passes live on OpenTofu.
  # The plan-switching scenario cannot pass on the pinned provider: Stripe
  # returns a configuration's switchable products only when a read expands
  # them, the provider never does, and its create then rejects its own result.
  # The sandbox's default configuration is one the first lane created; Stripe
  # refuses to deactivate a default, so it stays active.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 5
