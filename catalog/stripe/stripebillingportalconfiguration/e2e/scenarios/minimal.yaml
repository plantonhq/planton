# A configuration created, read back, and deactivated on destroy. Stripe
# keeps it forever, so the name carries the run.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripeBillingPortalConfiguration
metadata:
  name: e2e-portal-minimal
  org: e2e-org
  env: testing
  annotations:
    planton.dev/e2e-upgrade-manifest: minimal.to.yaml
spec:
  name: e2e-${E2E_RUN_ID}-${E2E_SCENARIO}
  features:
    invoiceHistory:
      enabled: true
    subscriptionCancel:
      enabled: true
      mode: at_period_end
      cancellationReason:
        enabled: true
        options:
          - too_expensive
          - other
  metadata:
    planton_e2e_run: ${E2E_RUN_ID}
