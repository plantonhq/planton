# The second act of minimal: a third cancellation reason. A configuration's
# features update in place, so it keeps its id.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripeBillingPortalConfiguration
metadata:
  name: e2e-portal-minimal
  org: e2e-org
  env: testing
  annotations:
    planton.dev/e2e-second-act: minimal.yaml
    planton.dev/e2e-expect-upgrade: in-place
spec:
  name: e2e-${E2E_RUN_ID}-${E2E_SCENARIO}
  features:
    invoiceHistory:
      enabled: true
    subscriptionCancel:
      enabled: true
      mode: at_period_end
      cancellationReason:
        enabled: true
        options:
          - too_expensive
          - missing_features
          - other
  metadata:
    planton_e2e_run: ${E2E_RUN_ID}
