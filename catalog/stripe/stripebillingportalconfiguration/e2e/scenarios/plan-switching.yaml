# Every feature on, including switching between a product's prices. The
# harness deploys a run-named product and a price on it through OpenTofu
# (the price's registry prerequisite brings the product), hands their ids to
# the portal, and archives both after the portal is deactivated.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripeBillingPortalConfiguration
metadata:
  name: e2e-portal-plan-switching
  org: e2e-org
  env: testing
  annotations:
    planton.dev/e2e-prerequisites: StripePrice
spec:
  name: e2e-${E2E_RUN_ID}-${E2E_SCENARIO}
  defaultReturnUrl: https://example.com/billing
  businessProfile:
    headline: e2e ${E2E_RUN_ID}
    privacyPolicyUrl: https://example.com/privacy
    termsOfServiceUrl: https://example.com/terms
  loginPage:
    enabled: true
  features:
    customerUpdate:
      enabled: true
      allowedUpdates:
        - email
        - address
    invoiceHistory:
      enabled: true
    paymentMethodUpdate:
      enabled: true
    subscriptionCancel:
      enabled: true
      mode: immediately
      prorationBehavior: create_prorations
    subscriptionUpdate:
      enabled: true
      defaultAllowedUpdates:
        - price
        - quantity
      prorationBehavior: create_prorations
      products:
        - product:
            valueFrom:
              kind: StripeProduct
              name: e2e-product-prereq
          prices:
            - valueFrom:
                kind: StripePrice
                name: e2e-price-prereq
      scheduleAtPeriodEnd:
        conditions:
          - type: decreasing_item_amount
