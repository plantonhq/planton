# Every feature on, including switching between a real product's prices,
# which must exist in the sandbox. Skips when the two variables are unset.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripeBillingPortalConfiguration
metadata:
  name: e2e-portal-plan-switching
  org: e2e-org
  env: testing
  annotations:
    planton.dev/e2e-required-env: PLANTON_E2E_STRIPE_PRODUCT_ID,PLANTON_E2E_STRIPE_PRICE_ID
spec:
  name: e2e-${E2E_RUN_ID}-${E2E_SCENARIO}
  defaultReturnUrl: https://example.com/billing
  businessProfile:
    headline: e2e ${E2E_RUN_ID}
    privacyPolicyUrl: https://example.com/privacy
    termsOfServiceUrl: https://example.com/terms
  loginPage:
    enabled: true
  features:
    customerUpdate:
      enabled: true
      allowedUpdates:
        - email
        - address
    invoiceHistory:
      enabled: true
    paymentMethodUpdate:
      enabled: true
    subscriptionCancel:
      enabled: true
      mode: immediately
      prorationBehavior: create_prorations
    subscriptionUpdate:
      enabled: true
      defaultAllowedUpdates:
        - price
        - quantity
      prorationBehavior: create_prorations
      products:
        - product: ${E2E_ENV:PLANTON_E2E_STRIPE_PRODUCT_ID}
          prices:
            - ${E2E_ENV:PLANTON_E2E_STRIPE_PRICE_ID}
      scheduleAtPeriodEnd:
        conditions:
          - type: decreasing_item_amount
