# The second act of minimal: a new description and metadata, which update the
# product in place.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripeProduct
metadata:
  name: e2e-product
  org: e2e-org
  env: testing
  annotations:
    planton.dev/e2e-second-act: minimal.yaml
    planton.dev/e2e-expect-upgrade: in-place
spec:
  name: e2e-${E2E_RUN_ID}-${E2E_SCENARIO}
  description: e2e ${E2E_RUN_ID} updated
  unitLabel: seat
  statementDescriptor: PLANTON E2E
  url: https://example.com/pricing
  marketingFeatures:
    - name: e2e marketing line
  metadata:
    planton_e2e_run: ${E2E_RUN_ID}
    planton_e2e_act: second
