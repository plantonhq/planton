syntax = "proto3";

package dev.planton.stripe.stripeproduct.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/stripe/stripeproduct/v1alpha1/outputs.proto";
import "catalog/stripe/stripeproduct/v1alpha1/spec.proto";
import "shared/metadata.proto";

// StripeProduct is a component that declares one thing a Stripe account sells, as customers see
// it, and the entitlement features buying it grants.
//
// Prices are separate resources (StripePrice names its product). Destroy archives the product;
// Stripe keeps it, and existing subscriptions keep billing.
//
// Use cases:
// - Declare a SaaS plan and the capabilities it grants, the same in every environment
// - Keep a catalog of goods in files, reviewed like code
//
// Example manifest:
// ```yaml
// apiVersion: stripe.planton.dev/v1alpha1
// kind: StripeProduct
// metadata:
//   name: pro-plan
//   org: my-organization
// spec:
//   name: Pro
//   description: For growing teams
//   unitLabel: seat
//   features:
//     - valueFrom:
//         name: api-access
// ```
message StripeProduct {
  // api_version is the version of the Stripe API resource.
  // Must be "stripe.planton.dev/v1alpha1" for this version.
  string api_version = 1 [(buf.validate.field).string.const = 'stripe.planton.dev/v1alpha1'];

  // kind is the Kubernetes Resource Model (KRM) kind.
  // Must be "StripeProduct" for this resource type.
  string kind = 2 [(buf.validate.field).string.const = 'StripeProduct'];

  // metadata contains standard catalog object metadata.
  // - name: Unique identifier for the resource within Planton
  // - org: Organization that owns it
  // - env: Environment it is deployed from
  // - labels: Key-value pairs for filtering and organization
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec contains what customers see and the features the product grants.
  StripeProductSpec spec = 4 [(buf.validate.field).required = true];

  // status contains the product as created, populated after deployment.
  StripeProductStatus status = 5;
}

// StripeProductStatus represents the current state of a StripeProduct resource.
// Populated by the deployment system.
message StripeProductStatus {
  // outputs contains the outputs: the product's id and its feature links.
  StripeProductOutputs outputs = 1;
}
