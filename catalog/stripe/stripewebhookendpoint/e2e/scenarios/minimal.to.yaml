# The second act of minimal: a new description and a third event. Both update
# the endpoint in place, so it keeps its id and its signing secret.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripeWebhookEndpoint
metadata:
  name: e2e-webhook-endpoint
  org: e2e-org
  env: testing
  annotations:
    planton.dev/e2e-second-act: minimal.yaml
    planton.dev/e2e-expect-upgrade: in-place
spec:
  url: https://example.com/stripe/e2e-${E2E_RUN_ID}
  description: e2e-${E2E_RUN_ID}-${E2E_SCENARIO}-updated
  enabledEvents:
    - checkout.session.completed
    - invoice.paid
    - charge.refunded
  metadata:
    planton_e2e_run: ${E2E_RUN_ID}
