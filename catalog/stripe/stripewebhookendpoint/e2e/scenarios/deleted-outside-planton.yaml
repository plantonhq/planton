# An endpoint deleted in the Dashboard, behind Planton's back. The provider has no
# handling for an object it cannot read, so the next plan fails; the GUIDE's
# recovery forgets it from state and applies, which creates a new one.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripeWebhookEndpoint
metadata:
  name: e2e-webhookendpoint-oob
  org: e2e-org
  env: testing
  annotations:
    planton.dev/e2e-out-of-band-delete: forget:stripe_webhook_endpoint.this
spec:
  url: https://example.com/stripe/e2e-${E2E_RUN_ID}-oob
  description: e2e-${E2E_RUN_ID}-${E2E_SCENARIO}
  enabledEvents:
    - invoice.paid
  metadata:
    planton_e2e_run: ${E2E_RUN_ID}
