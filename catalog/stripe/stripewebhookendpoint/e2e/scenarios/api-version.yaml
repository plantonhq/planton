# An endpoint pinned to an API version. Its second act moves the pin, which
# REPLACES the endpoint: Stripe renders events in the version the endpoint was
# created with, so a new version is a new endpoint with a new signing secret,
# and the old one is deleted.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripeWebhookEndpoint
metadata:
  name: e2e-webhook-endpoint-versioned
  org: e2e-org
  env: testing
  annotations:
    planton.dev/e2e-upgrade-manifest: api-version.to.yaml
spec:
  url: https://example.com/stripe/e2e-${E2E_RUN_ID}-versioned
  description: e2e-${E2E_RUN_ID}-${E2E_SCENARIO}
  apiVersion: 2025-03-31.basil
  enabledEvents:
    - invoice.paid
  metadata:
    planton_e2e_run: ${E2E_RUN_ID}
