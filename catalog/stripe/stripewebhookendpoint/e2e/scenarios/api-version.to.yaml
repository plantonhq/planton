# The second act of api-version: the pin moves to the provider's own version.
# The endpoint is replaced: a new id, a new signing secret, the old one deleted.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripeWebhookEndpoint
metadata:
  name: e2e-webhook-endpoint-versioned
  org: e2e-org
  env: testing
  annotations:
    planton.dev/e2e-second-act: api-version.yaml
    planton.dev/e2e-expect-upgrade: replaced
spec:
  url: https://example.com/stripe/e2e-${E2E_RUN_ID}-versioned
  description: e2e-${E2E_RUN_ID}-${E2E_SCENARIO}
  apiVersion: 2026-05-27.dahlia
  enabledEvents:
    - invoice.paid
  metadata:
    planton_e2e_run: ${E2E_RUN_ID}
