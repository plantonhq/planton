syntax = "proto3";

package dev.planton.stripe.stripewebhookendpoint.v1alpha1;

import "catalog/stripe/provider.proto";
import "catalog/stripe/stripewebhookendpoint/v1alpha1/api.proto";

// StripeWebhookEndpointIacInput is the input to the StripeWebhookEndpoint IaC module.
// It contains the target resource and the Stripe provider configuration.
message StripeWebhookEndpointIacInput {
  // target is the StripeWebhookEndpoint resource to be deployed.
  StripeWebhookEndpoint target = 1;

  // provider_config contains the Stripe key, its mode, and optionally the Connect account to act
  // on. The key needs "Webhook Endpoints" write.
  dev.planton.stripe.StripeProviderConfig provider_config = 2;
}
