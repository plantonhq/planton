# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/componentcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostProfile
metadata:
  name: stripewebhookendpoint
spec:
  billing_model: free
  free_tier: "Stripe publishes no price for webhook endpoints: every account, sandboxes included, can create them (docs.stripe.com/webhooks)."
  notes: "Stripe bills by payment volume and product usage (stripe.com/pricing), never by the endpoints an account delivers events to. What an endpoint costs is on the receiving side: every delivered event is a request the receiving service must answer."
