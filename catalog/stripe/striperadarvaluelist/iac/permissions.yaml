# Least-privilege permissions the IaC runner's Stripe key needs to provision, update, and
# destroy this component with the official module. Stripe authenticates with a restricted API
# key whose permissions are a Read or Write choice per resource on the Dashboard's restricted-key
# form (Write includes Read); the stripe/stripe provider (0.3.0, iac/tf/provider.tf) sends it as
# a bearer token. Resource names are the form's labels. Every group is `derived` (static analysis
# of the module and the provider's calls, cited in notes) until a live run under a key built from
# exactly this file upgrades it to `proven` -- Stripe's refusal names the missing permission, so
# that run also proves each label.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: striperadarvaluelist
spec:
  stripe:
    groups:
      - purpose: ManageRadarValueList
        permissions:
          - resource: Radar
            access: write
        provenance: derived
        notes: The module (iac/tf/main.tf) manages stripe_radar_value_list and one stripe_radar_value_list_item per item. The provider creates a list with POST /v1/radar/value_lists, reads it with GET /v1/radar/value_lists/{id}, updates it with POST /v1/radar/value_lists/{id}, and deletes it with DELETE /v1/radar/value_lists/{id}; an item is created with POST /v1/radar/value_list_items, read with GET /v1/radar/value_list_items/{id}, and deleted with DELETE /v1/radar/value_list_items/{id} (terraform-provider-stripe internal/provider/resources/resource_stripe_radar_value_list.go, resource_stripe_radar_value_list_item.go). The restricted-key form's exact Radar label is not documented; the least-privilege run proves it.
