syntax = "proto3";

package dev.planton.stripe.striperadarvaluelist.v1alpha1;

import "catalog/stripe/provider.proto";
import "catalog/stripe/striperadarvaluelist/v1alpha1/api.proto";

// StripeRadarValueListIacInput is the input to the StripeRadarValueList IaC module.
// It contains the target resource and the Stripe provider configuration.
message StripeRadarValueListIacInput {
  // target is the StripeRadarValueList resource to be deployed.
  StripeRadarValueList target = 1;

  // provider_config contains the Stripe key, its mode, and optionally the Connect account to act
  // on. The key needs "Radar" write.
  dev.planton.stripe.StripeProviderConfig provider_config = 2;
}
