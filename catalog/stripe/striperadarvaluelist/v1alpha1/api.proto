syntax = "proto3";

package dev.planton.stripe.striperadarvaluelist.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/stripe/striperadarvaluelist/v1alpha1/outputs.proto";
import "catalog/stripe/striperadarvaluelist/v1alpha1/spec.proto";
import "shared/metadata.proto";

// StripeRadarValueList is a component that declares a Stripe Radar list and every item in it,
// for Radar rules to reference by alias.
//
// Items are checked against the list's type before Stripe sees them; adding an item creates it
// and removing one deletes it. Destroy deletes the list and its items.
//
// Use cases:
// - Keep block and allow lists (countries, emails, customers) in files, reviewed like code
// - Give every environment's account the same lists
//
// Example manifest:
// ```yaml
// apiVersion: stripe.planton.dev/v1alpha1
// kind: StripeRadarValueList
// metadata:
//   name: blocked-countries
//   org: my-organization
// spec:
//   alias: blocked_countries
//   name: Blocked countries
//   itemType: country
//   items:
//     - KP
//     - IR
// ```
message StripeRadarValueList {
  // api_version is the version of the Stripe API resource.
  // Must be "stripe.planton.dev/v1alpha1" for this version.
  string api_version = 1 [(buf.validate.field).string.const = 'stripe.planton.dev/v1alpha1'];

  // kind is the Kubernetes Resource Model (KRM) kind.
  // Must be "StripeRadarValueList" for this resource type.
  string kind = 2 [(buf.validate.field).string.const = 'StripeRadarValueList'];

  // metadata contains standard catalog object metadata.
  // - name: Unique identifier for the resource within Planton
  // - org: Organization that owns it
  // - env: Environment it is deployed from
  // - labels: Key-value pairs for filtering and organization
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec contains the list's alias, type and items.
  StripeRadarValueListSpec spec = 4 [(buf.validate.field).required = true];

  // status contains the list as created, populated after deployment.
  StripeRadarValueListStatus status = 5;
}

// StripeRadarValueListStatus represents the current state of a StripeRadarValueList resource.
// Populated by the deployment system.
message StripeRadarValueListStatus {
  // outputs contains the outputs: the list's id and each item's id.
  StripeRadarValueListOutputs outputs = 1;
}
