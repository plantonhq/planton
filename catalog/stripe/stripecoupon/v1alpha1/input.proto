syntax = "proto3";

package dev.planton.stripe.stripecoupon.v1alpha1;

import "catalog/stripe/provider.proto";
import "catalog/stripe/stripecoupon/v1alpha1/api.proto";

// StripeCouponStackInput is the input to the StripeCoupon IaC module.
// It contains the target resource and the Stripe provider configuration.
message StripeCouponStackInput {
  // target is the StripeCoupon resource to be deployed.
  StripeCoupon target = 1;

  // provider_config contains the Stripe key, its mode, and optionally the Connect account to act
  // on. The key needs "Coupons" write.
  dev.planton.stripe.StripeProviderConfig provider_config = 2;
}
