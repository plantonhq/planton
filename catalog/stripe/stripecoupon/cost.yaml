# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/componentcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostProfile
metadata:
  name: stripecoupon
spec:
  billing_model: free
  free_tier: "Stripe publishes no price for coupons: every account, sandboxes included, can create them (docs.stripe.com/billing/subscriptions/coupons)."
  notes: "A coupon lowers what customers pay; Stripe's own fees apply to each payment made with it (stripe.com/pricing), never to the coupon object."
