# The second act of amount-in-currencies: a new euro amount. Stripe refuses a
# new amount for a currency the coupon already has, so the module's tracker
# replaces the coupon: a new id, and the old coupon deleted.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripeCoupon
metadata:
  name: e2e-coupon-amount
  org: e2e-org
  env: testing
  annotations:
    planton.dev/e2e-second-act: amount-in-currencies.yaml
    planton.dev/e2e-expect-upgrade: replaced
spec:
  name: e2e ${E2E_RUN_ID} amount
  amountOff: 1000
  currency: usd
  currencyOptions:
    eur: 800
  duration: once
  maxRedemptions: 5
