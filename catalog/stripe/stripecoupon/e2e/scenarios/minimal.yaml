# A percentage coupon with only its discount: duration is left out (Stripe's
# once), and the name carries the run so an update in place is visible.
# Deleted on destroy.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripeCoupon
metadata:
  name: e2e-coupon
  org: e2e-org
  env: testing
spec:
  name: e2e ${E2E_RUN_ID}
  percentOff: 10
  metadata:
    planton_e2e_run: ${E2E_RUN_ID}
