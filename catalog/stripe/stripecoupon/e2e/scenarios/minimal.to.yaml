# The second act of minimal: a new name and metadata, the two fields a coupon
# updates in place.
apiVersion: stripe.planton.dev/v1alpha1
kind: StripeCoupon
metadata:
  name: e2e-coupon
  org: e2e-org
  env: testing
  annotations:
    planton.dev/e2e-second-act: minimal.yaml
    planton.dev/e2e-expect-upgrade: in-place
spec:
  name: e2e ${E2E_RUN_ID} renamed
  percentOff: 10
  metadata:
    planton_e2e_run: ${E2E_RUN_ID}
    planton_e2e_act: second
