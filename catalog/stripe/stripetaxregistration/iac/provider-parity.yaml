# Provider-parity manifest: this kind's recorded judgment against the pinned
# stripe provider (checked by `planton provider-parity --check`; format
# documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# country_options is a nested attribute holding one block per country, which
# distills to a single provider argument. The spec is flat: fan-in mappings
# record every spec leaf the module writes into the declared country's block.
resources:
  stripe_tax_registration:
    mappings:
      - spec: spec.type
        arg: country_options
      - spec: spec.place_of_supply_scheme
        arg: country_options
      - spec: spec.province
        arg: country_options
      - spec: spec.state
        arg: country_options
      - spec: spec.jurisdiction
        arg: country_options
      - spec: spec.state_sales_tax_elections.type
        arg: country_options
      - spec: spec.state_sales_tax_elections.jurisdiction
        arg: country_options
