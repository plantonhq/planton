syntax = "proto3";

package dev.planton.stripe.stripetaxregistration.v1alpha1;

import "catalog/stripe/provider.proto";
import "catalog/stripe/stripetaxregistration/v1alpha1/api.proto";

// StripeTaxRegistrationIacInput is the input to the StripeTaxRegistration IaC module.
// It contains the target resource and the Stripe provider configuration.
message StripeTaxRegistrationIacInput {
  // target is the StripeTaxRegistration resource to be deployed.
  StripeTaxRegistration target = 1;

  // provider_config contains the Stripe key, its mode, and optionally the Connect account to act
  // on. The key needs "Tax Registrations" write.
  dev.planton.stripe.StripeProviderConfig provider_config = 2;
}
