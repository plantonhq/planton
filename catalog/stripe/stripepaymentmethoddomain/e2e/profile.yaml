apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: stripepaymentmethoddomain
spec:
  # Lanes run against the dedicated Stripe test sandbox only (STRIPE_API_KEY,
  # refused unless it is a test-mode key).
  # Destroy only forgets a registration, and the verifier proves the domain is
  # still in Stripe afterwards. Every run registers a run-named subdomain, so
  # a forgotten domain never collides with the next run. Awaiting its first
  # live run, so no provisioner is claimed yet.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 5
