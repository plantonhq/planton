syntax = "proto3";

package dev.planton.stripe.stripepaymentmethoddomain.v1alpha1;

import "catalog/stripe/provider.proto";
import "catalog/stripe/stripepaymentmethoddomain/v1alpha1/api.proto";

// StripePaymentMethodDomainStackInput is the input to the StripePaymentMethodDomain IaC module.
// It contains the target resource and the Stripe provider configuration.
message StripePaymentMethodDomainStackInput {
  // target is the StripePaymentMethodDomain resource to be deployed.
  StripePaymentMethodDomain target = 1;

  // provider_config contains the Stripe key, its mode, and optionally the Connect account to act
  // on. The key needs "Payment Method Domains" write.
  dev.planton.stripe.StripeProviderConfig provider_config = 2;
}
