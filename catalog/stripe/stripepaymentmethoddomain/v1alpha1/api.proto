syntax = "proto3";

package dev.planton.stripe.stripepaymentmethoddomain.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/stripe/stripepaymentmethoddomain/v1alpha1/outputs.proto";
import "catalog/stripe/stripepaymentmethoddomain/v1alpha1/spec.proto";
import "shared/metadata.proto";

// StripePaymentMethodDomain is a component that registers a domain where the account's own
// checkout pages may show wallet buttons (Apple Pay, Google Pay, Link, PayPal, Amazon Pay, Klarna).
//
// status.outputs reports each wallet's state and Stripe's reason when one is inactive. Destroy
// only forgets the registration: the domain stays registered, and enabled, in Stripe.
//
// Use cases:
// - Show wallet buttons on a checkout page served from your own domain
// - See, per wallet, why a button does not appear
//
// Example manifest:
// ```yaml
// apiVersion: stripe.planton.dev/v1alpha1
// kind: StripePaymentMethodDomain
// metadata:
//   name: checkout-domain
//   org: my-organization
// spec:
//   domainName: pay.example.com
// ```
message StripePaymentMethodDomain {
  // api_version is the version of the Stripe API resource.
  // Must be "stripe.planton.dev/v1alpha1" for this version.
  string api_version = 1 [(buf.validate.field).string.const = 'stripe.planton.dev/v1alpha1'];

  // kind is the Kubernetes Resource Model (KRM) kind.
  // Must be "StripePaymentMethodDomain" for this resource type.
  string kind = 2 [(buf.validate.field).string.const = 'StripePaymentMethodDomain'];

  // metadata contains standard cloud resource metadata.
  // - name: Unique identifier for the resource within Planton
  // - org: Organization that owns it
  // - env: Environment it is deployed from
  // - labels: Key-value pairs for filtering and organization
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec contains the domain and whether wallets may appear on it.
  StripePaymentMethodDomainSpec spec = 4 [(buf.validate.field).required = true];

  // status contains the registration as Stripe reports it, populated after deployment.
  StripePaymentMethodDomainStatus status = 5;
}

// StripePaymentMethodDomainStatus represents the current state of a StripePaymentMethodDomain
// resource. Populated by the deployment system.
message StripePaymentMethodDomainStatus {
  // outputs contains the stack outputs: the registration's id and each wallet's state.
  StripePaymentMethodDomainStackOutputs outputs = 1;
}
