apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetessignoz
spec:
  # SigNoz installs as one Helm release NAMED AFTER metadata.name
  # (fullnameOverride pins the server Service and `<name>-otel-collector`
  # the same way), plus the optional anchor namespace. The component owns
  # NOTHING else: the composed ClickHouse (and its credential Secret) is
  # a separate resource with its own import map, and the connection's
  # password Secret is a REFERENCE this module never owns — it travels
  # with the referenced Secret.
  values:
    - name: release_name
      derivations:
        - from_metadata_name: true
      where_to_find: >-
        `helm list -n <namespace>` (NAME column) — the release shares the
        resource's name.
    - name: release_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `helm list -A` (NAMESPACE column).
    # ── the optional anchor namespace ────────────────────────────────────
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the installation
        namespace itself.
