apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: kubernetessignoz
spec:
  tier: 3
  # Composes the catalog's ClickHouse catalog kinds (registry
  # prerequisites: AltinityOperator → ClickHouse, consumer-scoped
  # fixtures) — nothing ClickHouse-related installs in the release
  # itself. Offline-validated (spec tests, both engines' plan/preview
  # proofs across full + minimal shapes) and live-proven on the kind
  # lanes: the product-grade register→session→OTLP-push→trace-by-ID
  # proof on every lane and the server-pod-replacement state proof
  # (re-login off the SQLite PVC, trace re-queried from the composed
  # ClickHouse).
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  # The schema migrator gates on the composed ClickHouse answering
  # (`migrate ready`) and then runs the full migration set; the budget
  # covers that cold start on the shared cluster.
  timeout_minutes: 30
