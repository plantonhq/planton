syntax = "proto3";

package dev.planton.kubernetes.kubernetessignoz.v1alpha1;

import "catalog/kubernetes/kubernetessignoz/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// signoz-kubernetes iac-input
message KubernetesSignozIacInput {
  // the catalog object to deploy
  KubernetesSignoz target = 1;
  // provider-credential
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
  // kubernetes namespace
  string kubernetes_namespace = 3;
}
