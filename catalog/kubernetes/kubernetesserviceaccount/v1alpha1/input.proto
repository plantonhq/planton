syntax = "proto3";

package dev.planton.kubernetes.kubernetesserviceaccount.v1alpha1;

import "catalog/kubernetes/kubernetesserviceaccount/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

/**
 * **KubernetesServiceAccountIacInput** defines the input structure for deploying a
 * Kubernetes ServiceAccount. It carries the target ServiceAccount specification and the
 * Kubernetes cluster configuration the IaC modules (Pulumi and Terraform) need to reach
 * the cluster.
 */
message KubernetesServiceAccountIacInput {
  /**
   * The target ServiceAccount resource to be created.
   * Contains the complete specification including metadata, image-pull secrets,
   * and workload-identity binding.
   */
  KubernetesServiceAccount target = 1;

  /**
   * Kubernetes cluster configuration.
   * Contains connection details and credentials for the target Kubernetes cluster
   * where the ServiceAccount will be created.
   */
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
