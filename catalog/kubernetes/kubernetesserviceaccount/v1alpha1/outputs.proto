syntax = "proto3";

package dev.planton.kubernetes.kubernetesserviceaccount.v1alpha1;

/**
 * **KubernetesServiceAccountOutputs** captures observable outputs from a Kubernetes
 * ServiceAccount deployment. Downstream resources compose on these handles: workloads set
 * `spec.serviceAccountName`, RBAC grants target the identity, and cloud trust configuration
 * (IAM bindings, trust policies, federated credentials) references the RBAC subject string.
 */
message KubernetesServiceAccountOutputs {
  /**
   * The name of the created ServiceAccount — the value workloads set in
   * `spec.serviceAccountName`.
   */
  string service_account_name = 1;

  /**
   * The namespace in which the ServiceAccount was created.
   */
  string namespace = 2;

  /**
   * The fully-qualified RBAC subject string: "system:serviceaccount:<namespace>:<name>".
   * This is the exact value cloud trust configuration matches on (an AWS IAM trust policy
   * condition, an Azure federated credential subject) and the username the kube-apiserver
   * sees — exported so downstream resources never re-assemble it by hand.
   */
  string rbac_subject = 3;

  /**
   * The cloud identity handle this ServiceAccount is bound to via workload identity:
   * the GCP service account email, AWS IAM role ARN, or Azure client ID — whichever arm
   * was configured. Empty when workload identity is not configured.
   */
  string workload_identity_handle = 4;
}
