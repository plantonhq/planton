apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesserviceaccount
spec:
  # A ServiceAccount's identity is fully carried by its namespace/name pair --
  # derivable from a prior deploy's outputs or from the spec itself.
  values:
    - name: service_account_name
      derivations:
        - from_output: service_account_name
        - from_spec_field: name
      where_to_find: >-
        `kubectl get serviceaccounts -A` (NAME column).
    - name: service_account_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `kubectl get serviceaccounts -A` (NAMESPACE column); "default" when
        the spec omits the namespace.
