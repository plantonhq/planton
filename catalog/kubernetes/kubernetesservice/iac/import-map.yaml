apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesservice
spec:
  # A Service's identity is fully carried by its namespace/name pair --
  # derivable from a prior deploy's outputs or from the spec itself.
  values:
    - name: service_name
      derivations:
        - from_output: service_name
        - from_spec_field: name
      where_to_find: >-
        `kubectl get services -A` (NAME column).
    - name: service_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `kubectl get services -A` (NAMESPACE column); "default" when the
        spec omits the namespace.
