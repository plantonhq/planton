# Install manifest used when OTHER kinds declare KubernetesService as an
# E2E prerequisite (e.g. an Ingress scenario composing a real backend). Kept
# deliberately minimal: a ClusterIP service with a stable name that consumer
# scenarios reference.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesService
metadata:
  name: e2e-svc-fixture
spec:
  namespace:
    value: default
  name: e2e-svc-fixture
  selector:
    app: e2e-fixture-app
  ports:
    - name: http
      port: 80
      target_port: "8080"
