syntax = "proto3";

package dev.planton.kubernetes.kubernetesraycluster.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesraycluster/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesraycluster/v1alpha1/spec.proto";
import "shared/metadata.proto";

//ray-cluster-kubernetes
message KubernetesRayCluster {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesRayCluster'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesRayClusterSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesRayClusterStatus status = 5;
}

//ray-cluster-kubernetes status.
message KubernetesRayClusterStatus {
  //outputs
  KubernetesRayClusterOutputs outputs = 1;
}
