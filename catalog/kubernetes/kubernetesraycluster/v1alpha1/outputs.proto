syntax = "proto3";

package dev.planton.kubernetes.kubernetesraycluster.v1alpha1;

import "catalog/kubernetes/kubernetes.proto";

//ray-cluster-kubernetes outputs
message KubernetesRayClusterOutputs {
  //namespace the cluster runs in.
  string namespace = 1;

  //the head Service name (`<name>-head-svc`) — every endpoint below
  //rides it.
  string head_service = 2;

  //in-cluster CLIENT endpoint (`<head_service>.<namespace>.svc.cluster.
  //local:10001`) — what ray.init("ray://…") dials from notebooks and
  //applications.
  string client_endpoint = 3;

  //in-cluster DASHBOARD/Job-API endpoint (`…:8265`) — the Job
  //Submission API and the web dashboard. Authenticated in token mode.
  string dashboard_endpoint = 4;

  //in-cluster GCS endpoint (`…:6379`) — Ray's own coordination port;
  //what `ray start --address` joins.
  string gcs_endpoint = 5;

  //the bearer-token Secret (key `auth_token`) in token auth mode —
  //the credential handle for the dashboard/job/client APIs. Unset when
  //auth is disabled.
  dev.planton.kubernetes.KubernetesSecretKey auth_token_secret = 6;

  //kubectl port-forward one-liner for reaching the dashboard from a
  //workstation.
  string port_forward_command = 7;
}
