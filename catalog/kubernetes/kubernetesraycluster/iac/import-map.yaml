apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesraycluster
spec:
  # One kubectl_manifest — the RayCluster CR, named after metadata.name —
  # plus the optional anchor namespace. Everything the operator creates
  # from the CR (the head/worker pods, `<name>-head-svc`, the
  # token-auth Secret) is operator-owned and never imported.
  values:
    - name: api_version
      derivations:
        - literal: ray.io/v1
      where_to_find: >-
        Always "ray.io/v1" — the CR's group/version (the operator's
        storage version at the pinned v1.6 release).
    - name: kind
      derivations:
        - literal: RayCluster
      where_to_find: Always "RayCluster" — the CR kind this module applies.
    - name: name
      derivations:
        - from_metadata_name: true
      where_to_find: >-
        The RayCluster CR's metadata.name (equals the Planton resource
        name) — `kubectl get rayclusters.ray.io -A` (NAME column).
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The cluster's namespace — `kubectl get rayclusters.ray.io -A`
        (NAMESPACE column).
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the cluster's
        namespace itself.
