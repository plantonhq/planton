# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetestcproute
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A route stores no data beyond its own definition in the cluster's etcd; there is nothing at rest to encrypt.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Nothing is stored, so no key could apply (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: A TCPRoute forwards raw TCP connections without touching their contents. Whether the listener terminates TLS, passes it through, or carries plaintext is the Gateway listener's protocol, owned by the Gateway.
    - control_id: no-public-access
      status: not_applicable
      notes: A route carries no exposure of its own -- it attaches to a Gateway listener through parent_refs, and whether that listener faces the internet is the Gateway's posture, examined on that component.
    - control_id: restricted-ingress
      status: not_applicable
      notes: A TCPRoute has no matching logic at all -- every connection on the listener's port forwards to the rule's backends. Which routes may attach is the listener's allowed-routes policy, and cross-namespace references are subject to ReferenceGrant rules -- both owned outside this spec.
    - control_id: edge-protection
      status: not_applicable
      notes: A layer-4 route sees connections, not HTTP requests; web application firewalls have nothing to filter here.
    - control_id: rbac
      status: not_applicable
      notes: Who may create or change the route is the target cluster's Kubernetes RBAC on the CR; the object grants nothing itself.
    - control_id: workload-identity
      status: not_applicable
      notes: A route calls no cloud APIs; it is configuration a Gateway controller consumes.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The route performs no authentication; there is no auth path, legacy or otherwise, to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Changes to the route are Kubernetes API operations captured by the target cluster's audit policy; the object emits nothing itself.
    - control_id: monitoring-integration
      status: not_applicable
      notes: Traffic metrics for forwarded connections come from the Gateway's data plane, owned by the Gateway implementation; the route produces no signals.
    - control_id: backup-recovery
      status: not_applicable
      notes: A declarative object the IaC modules recreate from its manifest; there is no data to back up.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: A route has no replicas; availability of the data plane that executes it is the Gateway implementation's, and of the backends the workloads'.
    - control_id: deletion-protection
      status: not_applicable
      notes: Kubernetes offers no deletion-protection flag on the CR. Deleting the route stops forwarding for the listener's traffic -- protection is operational (namespace RBAC, change review).
    - control_id: managed-patching
      status: not_applicable
      notes: No software runs here; the Gateway controller and data plane are patched through their own components.
