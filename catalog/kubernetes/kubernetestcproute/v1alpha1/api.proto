syntax = "proto3";

package dev.planton.kubernetes.kubernetestcproute.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetestcproute/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetestcproute/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesTcpRoute is a Kubernetes Gateway API TCPRoute: a namespaced set of
// rules that attach to a Gateway and forward raw TCP connections to backend
// Services.
message KubernetesTcpRoute {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesTcpRoute'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesTcpRouteSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesTcpRouteStatus status = 5;
}

// KubernetesTcpRouteStatus holds the deployment status and outputs.
message KubernetesTcpRouteStatus {
  // outputs
  KubernetesTcpRouteOutputs outputs = 1;
}
