syntax = "proto3";

package dev.planton.kubernetes.kubernetestcproute.v1alpha1;

import "catalog/kubernetes/kubernetestcproute/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// Input for the KubernetesTcpRoute IaC stack. The platform resolves all
// StringValueOrRef references (namespace) to literal strings before passing this
// to the IaC engine.
message KubernetesTcpRouteIacInput {
  // the catalog object to deploy.
  KubernetesTcpRoute target = 1;
  // Kubernetes provider configuration (cluster credentials).
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
