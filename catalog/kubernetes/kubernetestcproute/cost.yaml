# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: kubernetestcproute
spec:
  billing_model: free
  free_tier: A TCPRoute is Gateway API routing configuration -- rules that forward raw TCP connections from a Gateway listener to backend Services. It is a custom resource a Gateway controller reads; no compute runs for it and no provider meters it.
  notes: "No field of this spec buys anything: parent_refs attach the route to a listener and backend_refs split traffic by weight -- both pure configuration. The spend near a route rides the Gateway's data plane: the Gateway (and any cloud load balancer its controller provisions) is its own catalog kind with its own cost profile, and the backend Services and pods carry their own. A route only tells that data plane where to forward."
