# The smallest config: one gVisor version, upstream's own release (the one
# the control plane ships as gvisor-default), for both architectures. The
# verifier reads it back and has the API server resolve it for a gVisor
# template while refusing it for a microVM one.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAgentSubstrateSandboxConfig
metadata:
  name: e2e-asubsc-min
  annotations:
    planton.dev/e2e-cluster-profile: "pod-certificates"
spec:
  name: e2e-gvisor-pinned
  sandboxClass: gvisor
  defaultVersion: gvisor-2026-10-17
  versions:
    - name: gvisor-2026-10-17
      assets:
        amd64:
          entries:
            gvisor:
              url: gs://gvisor/releases/nightly/2026-10-17/x86_64/gvisor.tar.zstd
              sha256: fa72f0d45756c69a30beec21222c78241b0d330c36f4f2185648617cc23415c8
        arm64:
          entries:
            gvisor:
              url: gs://gvisor/releases/nightly/2026-10-17/aarch64/gvisor.tar.zstd
              sha256: 238634978d99f0dd3e631c4f88eae7b19fb36937065428467f0b6d6b10697689
