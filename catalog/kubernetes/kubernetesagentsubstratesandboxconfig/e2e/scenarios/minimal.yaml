# The smallest config: one gVisor version, upstream's own release (the one
# the control plane ships as gvisor-default), for both architectures. The
# verifier reads it back and has the API server resolve it for a gVisor
# template while refusing it for a microVM one.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAgentSubstrateSandboxConfig
metadata:
  name: e2e-asubsc-min
  annotations:
    planton.dev/e2e-cluster-profile: "pod-certificates"
spec:
  name: e2e-gvisor-pinned
  sandboxClass: gvisor
  defaultVersion: gvisor-20261102-0
  versions:
    - name: gvisor-20261102-0
      assets:
        amd64:
          entries:
            gvisor:
              url: gs://gvisor/releases/release/20261102.0/x86_64/gvisor.tar.zstd
              sha256: a1439ffbba7d212e0fde32ea79fa9bb51cbc4c5f6c16af1f047260290b861d42
        arm64:
          entries:
            gvisor:
              url: gs://gvisor/releases/release/20261102.0/aarch64/gvisor.tar.zstd
              sha256: f702ae92ad7a0c4134be34ca23f52966dbb696db0c0f5b8ec439210ab2cd7c6a
