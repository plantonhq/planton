# Every field: labels and annotations on the object, two versions (the
# default and a retired one kept Disabled, with one architecture only), and
# both architectures on the default. The verifier reads every field back
# (the bare asset maps included, proving the entries wrapper never reaches the
# object) and has the API server resolve the config for a gVisor template.
#
# The config is deliberately NOT annotated as the class default: the
# control plane's gvisor-default stays the default the next lanes on the
# shared cluster rely on.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAgentSubstrateSandboxConfig
metadata:
  name: e2e-asubsc-full
  annotations:
    planton.dev/e2e-cluster-profile: "pod-certificates"
spec:
  name: e2e-gvisor-rollout
  labels:
    team: platform
    runtime: gvisor
  annotations:
    planton.dev/e2e-note: full-surface
  sandboxClass: gvisor
  defaultVersion: gvisor-20261102-0
  versions:
    - name: gvisor-20261102-0
      state: Enabled
      assets:
        amd64:
          entries:
            gvisor:
              url: gs://gvisor/releases/release/20261102.0/x86_64/gvisor.tar.zstd
              sha256: a1439ffbba7d212e0fde32ea79fa9bb51cbc4c5f6c16af1f047260290b861d42
        arm64:
          entries:
            gvisor:
              url: gs://gvisor/releases/release/20261102.0/aarch64/gvisor.tar.zstd
              sha256: f702ae92ad7a0c4134be34ca23f52966dbb696db0c0f5b8ec439210ab2cd7c6a
    # Retired, so no sandbox ever boots it and no node downloads its file:
    # the gVisor release before the one Agent Substrate's workers need.
    - name: gvisor-2026-10-10
      state: Disabled
      assets:
        amd64:
          entries:
            gvisor:
              url: gs://gvisor/releases/nightly/2026-10-10/x86_64/gvisor.tar.zstd
              sha256: 4ae7fab988c3647d2a835d6c3c70c6a99021c562db97827592562b6c51c3e88c
