syntax = "proto3";

package dev.planton.kubernetes.kubernetestlsroute.v1alpha1;

import "catalog/kubernetes/kubernetestlsroute/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// Input for the KubernetesTlsRoute IaC stack. The platform resolves all
// StringValueOrRef references (namespace) to literal strings before passing this
// to the IaC engine.
message KubernetesTlsRouteIacInput {
  // Target infra-component.
  KubernetesTlsRoute target = 1;
  // Kubernetes provider configuration (cluster credentials).
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
