apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesSuperset
metadata:
  name: superset
spec:
  namespace:
    value: superset
  create_namespace: true
  # The one REQUIRED input: the metadata database (dashboards, charts,
  # users and the encrypted datasource credentials live here). This
  # preset composes a KubernetesPostgres named `superset-pg` — declare
  # the `superset` database at its bootstrap (initdb.database). The
  # password never renders: the pods receive it as an environment
  # variable referencing the database's own credential Secret.
  metadata_database:
    host:
      value_from:
        kind: KubernetesPostgres
        name: superset-pg
        field_path: status.outputs.rw_service
    password_secret:
      secret_name:
        value_from:
          kind: KubernetesPostgres
          name: superset-pg
          field_path: status.outputs.password_secret.name
  # Everything else is the kind's defaults — deliberately SECURED:
  # the session-signing SECRET_KEY is module-generated (Superset
  # refuses its insecure default) and the bootstrap admin password is
  # module-generated into `superset-admin-auth` (the chart's
  # documented admin/admin default never ships). Without a cache this
  # is the web-only shape: every query runs synchronously — add
  # spec.cache for async queries, thumbnails and reports.
