syntax = "proto3";

package dev.planton.kubernetes.kubernetessuperset.v1alpha1;

import "catalog/kubernetes/kubernetes.proto";

/**
 * **KubernetesSupersetOutputs** — the composition handles a
 * deployed Superset exports. Exposure kinds route to the service;
 * operators sign in with the exported admin credential.
 */
message KubernetesSupersetOutputs {
  // Namespace Superset runs in.
  string namespace = 1;

  // Name of the Superset web Service — the handle exposure kinds
  // route to (port 8088).
  string service = 2;

  // In-cluster endpoint,
  // `http://<service>.<namespace>.svc.cluster.local:8088` — the
  // URL browsers and API clients reach Superset at (behind
  // composed exposure).
  string endpoint = 3;

  // The bootstrap admin username (`init.admin.username`, default
  // "admin").
  string admin_username = 4;

  // The admin credential: the Secret and key holding the bootstrap
  // admin password (module-generated `<name>-admin-auth` unless an
  // existing Secret was declared).
  dev.planton.kubernetes.KubernetesSecretKey admin_password_secret = 5;

  // Name of the module-owned environment Secret (`<name>-env`) —
  // the chart's runtime-credential contract, composed at apply
  // time; exported for audit and advanced composition.
  string env_secret_name = 6;

  // Name of the Secret holding the session-signing SECRET_KEY
  // (module-generated `<name>-secret-key` unless an existing
  // Secret was declared) — needed for `superset re-encrypt-secrets`
  // rotation procedures.
  string secret_key_secret_name = 7;

  // Port-forward command for reaching the Superset UI from a
  // workstation when no exposure is composed.
  string port_forward_command = 8;
}
