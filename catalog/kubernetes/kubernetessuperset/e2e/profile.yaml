apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: kubernetessuperset
spec:
  tier: 3
  # Forged on the official ASF chart 0.22.4 = Superset 6.1.0 —
  # external-only metadata database (KubernetesPostgres) and cache
  # (KubernetesValkey), the module-composed environment-Secret
  # credential contract (the chart's own env Secret never ships), the
  # generated-and-stable SECRET_KEY, and the env-driven admin
  # bootstrap. Offline-validated (39 spec tests, both engines'
  # plan/preview proofs across minimal and full-surface shapes with
  # rendered-value spot-checks and leak greps).
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  # The ~1GB superset image pulls once per cluster; the init Job's
  # schema migration runs against the composed database INSIDE the
  # Helm wait (a post-install hook), and the CNPG→Postgres + Valkey
  # fixture chain deploys inside the lane budget.
  timeout_minutes: 30
