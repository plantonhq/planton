# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetessuperset
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The component itself stores nothing at rest -- it provisions no volumes; dashboards, charts, users, and the ENCRYPTED datasource credentials live in the metadata database (a separate component), and the query cache lives in the composed Redis-protocol store. Encryption at rest is those components' posture.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data rests here to key (see enc-at-rest); customer-managed keys belong to the metadata database and cache components.
    - control_id: enc-in-transit
      status: configurable
      field_path: metadata_database.ssl
      evidence:
        type: spec_default
        reference: Unset means no SSL on the metadata-database connection (in-cluster traffic); ssl.enabled with mode require/verify-ca/verify-full encrypts it for managed databases over untrusted networks.
      notes: The web application serves plain HTTP on 8088 inside the cluster; TLS for user-facing traffic terminates at the composed exposure layer over the exported service handle.
    - control_id: no-public-access
      status: configurable
      field_path: service.type
      evidence:
        type: spec_default
        reference: Unset means ClusterIP -- nothing is internet-reachable until exposure is composed explicitly; "LoadBalancer" or "NodePort" opts into direct exposure with service.annotations carrying the cloud LB configuration.
      notes: Both presets keep the default ClusterIP posture.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The modules render no NetworkPolicies and the spec has no seam for them -- restricting which sources may reach the Services is the cluster's NetworkPolicy posture (a KubernetesNetworkPolicy composes naturally). That fence matters doubly here because flower, when enabled, ships with NO authentication of its own and shows task payloads including executed SQL.
    - control_id: edge-protection
      status: not_applicable
      notes: The component itself terminates no edge traffic -- exposure happens through separate kinds and a web application firewall belongs to that layer, not to this chart.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: module_default
        reference: Every request authenticates against Superset's Flask-AppBuilder role system -- the init step bootstraps exactly one Admin-role user whose password the module generates, and all further access rides FAB roles (Admin/Alpha/Gamma and custom roles).
      notes: The DASHBOARD_RBAC feature flag (set in the 02-production-bi preset) extends role governance to individual dashboards. OAuth/SSO providers ride config_overrides with secrets via extra_env_from_secret.
    - control_id: workload-identity
      status: not_applicable
      notes: Superset reaches its data sources with credentials stored ENCRYPTED in the metadata database (under the SECRET_KEY), not with platform identities -- this spec models no cloud-identity seam, and cloud API access is not part of the component's own operation.
    - control_id: no-legacy-auth
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The chart's documented admin/admin default never ships -- both modules generate the bootstrap admin password into a Secret (<name>-admin-auth) and create the user from environment variables (the chart's literal-password init path is never used); the session-signing SECRET_KEY is likewise module-generated because Superset refuses to start on its insecure default.
      notes: Flower is the exception surface -- it has no authentication at all, ships off by default, and the spec-level warning says keep it off or fence it.
    - control_id: strong-user-auth
      status: not_applicable
      notes: Superset sign-in strength is Flask-AppBuilder configuration -- password complexity, rate limiting, and OAuth/LDAP/MFA ride config_overrides rather than typed fields; the modules' contribution is the Secret-generated bootstrap admin password (see no-legacy-auth).
    - control_id: audit-logging
      status: not_applicable
      notes: A provider-style audit trail is not modeled in this spec -- component activity streams to stdout for the cluster's log collector, and changes to the release itself are Kubernetes API operations captured by the target cluster's audit policy.
    - control_id: monitoring-integration
      status: not_applicable
      notes: No metrics integration is modeled in this spec or rendered by the modules. Flower (off by default) is a Celery task-monitoring UI, not a metrics exporter; scraping composes via the helm_values overlay and the cluster's monitoring stack.
    - control_id: backup-recovery
      status: not_applicable
      notes: The component holds no durable data of its own -- everything restorable (dashboards, charts, users, saved queries, encrypted datasource credentials) lives in the metadata database, whose backup posture rides that component (KubernetesPostgres backup). The cache is reconstructible by definition.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist on this component to retain (see backup-recovery) -- retention policy belongs to the metadata database's component.
    - control_id: multi-zone-ha
      status: configurable
      field_path: web.replicas
      evidence:
        type: spec_default
        reference: Defaults to 1; the web tier is stateless (state lives in the metadata database and cache), so replicas scale freely -- and workers scale the same way (worker.replicas). Celery beat stays a singleton by design.
      notes: The 02-production-bi preset runs 2 web replicas and 2 workers. Spreading replicas across zones is the cluster scheduler's topology behavior -- this spec models node_selector and tolerations, not anti-affinity.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Kubernetes nor Helm offers a deletion-protection flag on a release; protection is operational (namespace RBAC, change review). Deleting the resource removes the release -- the metadata database, holding everything of value, is a separate resource and survives.
    - control_id: managed-patching
      status: configurable
      field_path: image
      evidence:
        type: spec_default
        reference: The image defaults to the chart's pinned official build (tag "6.1.0") and the modules pin the chart version internally -- version changes are deliberate manifest edits, rolled as atomic Helm upgrades (wait, atomic, cleanup_on_fail) with the schema-migration init Job running inside the same budget.
      notes: The published image is the driver-less "lean" build -- a version bump must keep the metadata-database driver available (the default bootstrap_script installs the exact psycopg2 pin at container start; production images should bake it).
