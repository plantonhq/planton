apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kuberneteskafkaconnector
spec:
  # One kubectl_manifest — the KafkaConnector CR, named after
  # metadata.name in the Connect cluster's own namespace. Everything
  # derives blind.
  values:
    - name: api_version
      derivations:
        - literal: kafka.strimzi.io/v1
      where_to_find: Always "kafka.strimzi.io/v1" — the CR's group/version.
    - name: kind
      derivations:
        - literal: KafkaConnector
      where_to_find: Always "KafkaConnector" — the CR kind this module applies.
    - name: name
      derivations:
        - from_metadata_name: true
        - from_output: connector_name
      where_to_find: >-
        The KafkaConnector CR's metadata.name (equals the Planton
        resource name and the connector's name in Connect) —
        `kubectl get kafkaconnector -A` (NAME column).
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The Connect cluster's namespace (the placement contract) —
        `kubectl get kafkaconnector -A` (NAMESPACE column).
