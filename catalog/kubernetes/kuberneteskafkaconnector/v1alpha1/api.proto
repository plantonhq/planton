syntax = "proto3";

package dev.planton.kubernetes.kuberneteskafkaconnector.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kuberneteskafkaconnector/v1alpha1/outputs.proto";
import "catalog/kubernetes/kuberneteskafkaconnector/v1alpha1/spec.proto";
import "shared/metadata.proto";

//kubernetes-kafka-connector
message KubernetesKafkaConnector {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesKafkaConnector'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesKafkaConnectorSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesKafkaConnectorStatus status = 5;
}

//kubernetes-kafka-connector status
message KubernetesKafkaConnectorStatus {
  //outputs
  KubernetesKafkaConnectorOutputs outputs = 1;
}
