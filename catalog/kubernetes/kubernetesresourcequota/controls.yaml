# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetesresourcequota
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A ResourceQuota (and its companion LimitRange) stores no data -- both are governance objects in etcd, whose encryption is owned by the target cluster.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: With nothing stored (see enc-at-rest), there is no at-rest key to manage.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The quota carries no traffic -- it is evaluated at admission inside the control plane.
    - control_id: no-public-access
      status: not_applicable
      notes: A quota has no network endpoint to expose.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The quota governs resource consumption, not network traffic. Ingress restriction for the governed namespace's pods is NetworkPolicy -- a separate kind.
    - control_id: edge-protection
      status: not_applicable
      notes: The quota serves no requests -- web application firewalls do not apply.
    - control_id: rbac
      status: not_applicable
      notes: Access to the quota and limit range objects is governed by the target cluster's Kubernetes RBAC; the spec defines no access-control surface of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: A quota authenticates to no cloud API -- it is configuration evaluated by the Kubernetes admission machinery.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The quota performs no authentication; there is no legacy authentication path to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Changes to the quota and limit range, and the admissions they reject, are Kubernetes API operations captured by the target cluster's audit policy.
    - control_id: monitoring-integration
      status: not_applicable
      notes: A governance object emits no operational metrics of its own; quota usage-versus-hard status is maintained on the object by the controller and surfaces through the cluster's control-plane metrics.
    - control_id: backup-recovery
      status: not_applicable
      notes: There is no data to back up -- the quota and limit range are fully described by this declarative spec, re-appliable at any time.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: With no backups (see backup-recovery), there is no retention length to configure.
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The quota is an API object with no running replicas; the admission machinery enforces it cluster-wide for the governed namespace.
    - control_id: deletion-protection
      status: not_applicable
      notes: Kubernetes offers no deletion-protection flag on ResourceQuota or LimitRange objects. Deleting them lifts the caps and defaults -- the namespace can then consume without bound -- so protection is operational (namespace RBAC, change review).
    - control_id: managed-patching
      status: not_applicable
      notes: There is no software to patch -- the quota and limit range are configuration evaluated by the API server's admission machinery, patched with the cluster.
