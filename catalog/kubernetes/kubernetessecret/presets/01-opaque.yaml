apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesSecret
metadata:
  name: my-secret
spec:
  name: my-secret
  namespace:
    value: "<your-namespace>"
  opaque:
    # Each value is a reference to an organization secret, never a literal: the runner
    # resolves it inside your infrastructure at deploy time.
    data:
      username: $secret/replace-with-your-username-secret
      password: $secret/replace-with-your-password-secret
      api-key: $secret/replace-with-your-api-key-secret
