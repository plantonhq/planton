apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesSecret
metadata:
  name: my-tls-secret
spec:
  name: my-tls-secret
  namespace:
    value: "<your-namespace>"
  tls:
    tlsCrt: "<your-tls-certificate-pem>"
    # The private key is a reference to an organization secret, never a literal: the
    # runner resolves it inside your infrastructure at deploy time.
    tlsKey: $secret/replace-with-your-tls-private-key-secret
