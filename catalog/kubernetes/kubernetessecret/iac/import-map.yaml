apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetessecret
spec:
  # A Secret's identity is fully carried by its namespace/name pair --
  # derivable from a prior deploy's outputs or from the spec itself.
  values:
    - name: secret_name
      derivations:
        - from_output: secret_name
        - from_spec_field: name
      where_to_find: >-
        `kubectl get secrets -A` (NAME column).
    - name: secret_namespace
      derivations:
        - from_output: secret_namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `kubectl get secrets -A` (NAMESPACE column); "default" when the spec
        omits the namespace.
