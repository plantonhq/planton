# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetespriorityclass
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A PriorityClass stores no data -- it is a cluster-scoped scheduling configuration object in etcd, whose encryption is owned by the target cluster.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: With nothing stored (see enc-at-rest), there is no at-rest key to manage.
    - control_id: enc-in-transit
      status: not_applicable
      notes: A PriorityClass carries no traffic -- it is read by the scheduler inside the control plane.
    - control_id: no-public-access
      status: not_applicable
      notes: A PriorityClass has no network endpoint to expose.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The class governs scheduling order and preemption, not network traffic.
    - control_id: edge-protection
      status: not_applicable
      notes: The class serves no requests -- web application firewalls do not apply.
    - control_id: rbac
      status: not_applicable
      notes: Access to the PriorityClass object is governed by the target cluster's Kubernetes RBAC; the spec defines no access-control surface of its own. Names with the reserved system- prefix are rejected by spec validation, keeping Kubernetes' built-in classes out of reach.
    - control_id: workload-identity
      status: not_applicable
      notes: A PriorityClass authenticates to no cloud API -- it is configuration read by the Kubernetes scheduler.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The class performs no authentication; there is no legacy authentication path to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Changes to the class are Kubernetes API operations, captured by the target cluster's audit policy.
    - control_id: monitoring-integration
      status: not_applicable
      notes: A configuration object emits no operational metrics; scheduling and preemption events surface through the cluster's own control-plane events and metrics.
    - control_id: backup-recovery
      status: not_applicable
      notes: There is no data to back up -- the class is fully described by its declarative spec, re-appliable at any time.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: With no backups (see backup-recovery), there is no retention length to configure.
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The class is a cluster-scoped API object with no running replicas; it influences WHERE pods schedule under pressure but replicates nothing itself.
    - control_id: deletion-protection
      status: not_applicable
      notes: Kubernetes offers no deletion-protection flag on PriorityClass objects. The value field is immutable -- changing it REPLACES the class (delete-then-create, since names are cluster-unique) -- which is a change-safety behavior worth knowing but not deletion protection; protection is operational (cluster RBAC, change review).
    - control_id: managed-patching
      status: not_applicable
      notes: There is no software to patch -- the class is configuration read by the scheduler, which is patched with the cluster.
