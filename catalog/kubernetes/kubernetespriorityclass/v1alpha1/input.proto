syntax = "proto3";

package dev.planton.kubernetes.kubernetespriorityclass.v1alpha1;

import "catalog/kubernetes/kubernetespriorityclass/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

/**
 * **KubernetesPriorityClassIacInput** defines the input structure for
 * deploying a Kubernetes PriorityClass. It carries the target class
 * specification and the Kubernetes cluster configuration the IaC modules
 * (Pulumi and Terraform) need to reach the cluster.
 */
message KubernetesPriorityClassIacInput {
  /**
   * The target PriorityClass resource to be created.
   * Contains the complete specification including metadata, priority value,
   * and preemption policy.
   */
  KubernetesPriorityClass target = 1;

  /**
   * Kubernetes cluster configuration.
   * Contains connection details and credentials for the target Kubernetes
   * cluster where the PriorityClass will be created.
   */
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
