syntax = "proto3";

package dev.planton.kubernetes.kubernetespriorityclass.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetespriorityclass/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetespriorityclass/v1alpha1/spec.proto";
import "shared/metadata.proto";

/**
 * **KubernetesPriorityClass** defines a Kubernetes PriorityClass resource
 * following the Kubernetes Resource Model (KRM). A PriorityClass is one step
 * of the cluster's workload importance ladder: pods referencing it schedule
 * (and optionally preempt) according to its integer value.
 */
message KubernetesPriorityClass {
  // API version for this resource.
  // Always set to "kubernetes.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "kubernetes.planton.dev/v1alpha1"];

  // Resource kind identifier.
  // Always set to "KubernetesPriorityClass".
  string kind = 2 [(buf.validate.field).string.const = "KubernetesPriorityClass"];

  // Metadata for the PriorityClass resource.
  // Includes standard fields like name, organization, environment, etc.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Specification of the desired state for the PriorityClass.
  // Defines the priority value, default flag, and preemption policy.
  KubernetesPriorityClassSpec spec = 4 [(buf.validate.field).required = true];

  // Status of the PriorityClass resource.
  // Contains outputs populated after deployment.
  KubernetesPriorityClassStatus status = 5;
}

/**
 * **KubernetesPriorityClassStatus** captures the runtime status of a
 * PriorityClass deployment, including the outputs generated after the class
 * is created.
 */
message KubernetesPriorityClassStatus {
  // Outputs from the PriorityClass deployment.
  // Contains the class name pods reference.
  KubernetesPriorityClassOutputs outputs = 1;
}
