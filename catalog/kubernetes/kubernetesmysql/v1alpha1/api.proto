syntax = "proto3";

package dev.planton.kubernetes.kubernetesmysql.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesmysql/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesmysql/v1alpha1/spec.proto";
import "shared/metadata.proto";

/**
 * KubernetesMysql declares a production-grade MySQL cluster on
 * Kubernetes: Galera synchronous replication, HAProxy/ProxySQL routing,
 * scheduled XtraBackup backups with point-in-time recovery, TLS, and
 * declarative users — reconciled by the Percona Operator for MySQL
 * (KubernetesPerconaMysqlOperator).
 */
message KubernetesMysql {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesMysql'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesMysqlSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesMysqlStatus status = 5;
}

//KubernetesMysql status.
message KubernetesMysqlStatus {
  //outputs
  KubernetesMysqlOutputs outputs = 1;
}
