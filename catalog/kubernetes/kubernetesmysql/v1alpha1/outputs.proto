syntax = "proto3";

package dev.planton.kubernetes.kubernetesmysql.v1alpha1;

import "catalog/kubernetes/kubernetes.proto";

/**
 * Outputs a KubernetesMysql cluster exports for composition —
 * everything a workload (or an exposure kind) needs to reach the
 * database.
 */
message KubernetesMysqlOutputs {
  /**
   * Namespace the cluster runs in.
   */
  string namespace = 1;

  /**
   * The PerconaXtraDBCluster resource name (`metadata.name`) — every
   * operator-created object derives from it.
   */
  string cluster_name = 2;

  /**
   * The WRITE Service applications connect to: `<name>-haproxy` (port
   * 3306) or `<name>-proxysql` depending on the chosen proxy.
   */
  string primary_service = 3;

  /**
   * The READ Service (`<name>-haproxy-replicas`, port 3307) — HAProxy
   * with the replicas Service enabled; empty otherwise.
   */
  string replicas_service = 4;

  /**
   * In-cluster endpoint of the write path:
   * `<primary_service>.<namespace>.svc.cluster.local:3306`.
   */
  string kube_endpoint = 5;

  /**
   * kubectl port-forward one-liner for reaching the database from a
   * workstation.
   */
  string port_forward_command = 6;

  /**
   * The Kubernetes Secret key holding the root password (the
   * operator-managed `<name>-secrets` system-users Secret, key
   * "root").
   */
  dev.planton.kubernetes.KubernetesSecretKey root_password_secret = 7;
}
