# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetesmysql
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The database's data rests on the PersistentVolumes the target cluster's storage class provisions; encryption at rest is a property of that storage (cloud-managed disks typically encrypt by default), owned by the cluster and its storage classes, not by this component. The operator's Vault keyring data-at-rest encryption is deliberately not modeled in this spec.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Customer-managed keys for the underlying volumes are configured on the cluster's storage class or the cloud disk encryption set (see enc-at-rest); this spec has no seam for them.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: spec_default
        reference: tls.enabled defaults to true -- client and Galera replication traffic is served over TLS with operator-generated certificates without any configuration; tls.issuer swaps in a cert-manager-issued chain for an organization-trusted CA. Disabling TLS is rejected unless unsafe.tls explicitly opts in.
      notes: The 02-production-ha preset issues certificates from a cert-manager ClusterIssuer.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The modules render only in-cluster exposure -- the proxy Services default to ClusterIP, so the database is reachable solely inside the cluster network. LoadBalancer or NodePort exposure is an explicit opt-in through the proxy's expose_primary / expose_replicas service type.
    - control_id: restricted-ingress
      status: configurable
      field_path: users
      evidence:
        type: spec_default
        reference: Each declared user carries MySQL hosts clauses restricting which client addresses may authenticate as it (the upstream default "%" accepts any source); narrowing the hosts list restricts the database's own accept decisions per account.
      notes: Kubernetes NetworkPolicies (separate resources) restrict the network path itself; the hosts clause governs MySQL's authentication-time source checks.
    - control_id: edge-protection
      status: not_applicable
      notes: A database serves no HTTP edge traffic -- web application firewalls do not apply. Client access control is per-user hosts clauses and network policy (see restricted-ingress).
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: module_default
        reference: Database access is governed by MySQL's privilege system -- the operator generates passwords for root and the internal system accounts into the cluster's secrets object, and the users field manages application accounts declaratively with scoped grants (databases, privileges, GRANT OPTION as an explicit flag).
      notes: Management-plane access (the PerconaXtraDBCluster resource itself) is governed by the target cluster's Kubernetes RBAC.
    - control_id: workload-identity
      status: not_applicable
      notes: XtraBackup's S3 uploads authenticate with static access keys (backup.storages s3.access_keys is required by the spec) and Azure with a storage-account key -- the operator exposes no keyless cloud-identity seam for backup storage in this spec.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The spec models no legacy or weaker authentication path to disable -- every account authenticates with an operator-generated or declared password, and the plaintext (non-TLS) wire is rejected unless unsafe.tls explicitly opts in (see enc-in-transit).
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: A provider-style database audit trail (Percona audit log plugin) is not modeled in this spec; mysqld logs stream through the fluent-bit log-collector sidecar for the cluster's log pipeline. Changes to the cluster's own configuration are Kubernetes API operations, captured by the target cluster's audit policy.
    - control_id: monitoring-integration
      status: configurable
      field_path: log_collector
      evidence:
        type: spec_default
        reference: The fluent-bit log-collector sidecar defaults to enabled (the upstream default), shipping mysqld logs from every database node for the cluster's log collector; log_collector.enabled opts out.
      notes: PMM metrics integration is deliberately not modeled in this spec (recorded in the spec's not-modeled list).
    - control_id: backup-recovery
      status: configurable
      field_path: backup
      evidence:
        type: spec_default
        reference: Unset means no backups exist (a deliberate choice, not a default); configuring backup.storages with schedules runs scheduled XtraBackup backups to S3, S3-compatible, or Azure Blob stores (or a PVC), and backup.pitr continuously ships binlogs for point-in-time recovery between backups.
      notes: The 02-production-ha preset backs up daily to S3 with PITR to a dedicated store.
    - control_id: backup-retention-policy
      status: configurable
      field_path: backup.schedules
      evidence:
        type: spec_default
        reference: Each schedule's keep count bounds how many backups are retained (older ones are pruned), and delete_from_storage (upstream default true when retention is set) removes pruned backups from the store itself, not just the cluster's records.
      notes: The 02-production-ha preset keeps 14 daily backups.
    - control_id: multi-zone-ha
      status: configurable
      field_path: scheduling.anti_affinity_topology_key
      evidence:
        type: spec_default
        reference: instances defaults to 3 -- a synchronous Galera quorum with automated failover -- and the operator's anti-affinity spreads the nodes across kubernetes.io/hostname by default; setting the topology key to topology.kubernetes.io/zone spreads the quorum across availability zones.
      notes: The 02-production-ha preset spreads across zones. Fewer than 3 nodes is rejected unless unsafe.cluster_size opts in.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Kubernetes nor the Percona operator offers a deletion-protection flag on the PerconaXtraDBCluster resource; the delete-pxc-pods-in-order finalizer orders teardown, it does not prevent it. Protection is operational (namespace RBAC, change review). The default PodDisruptionBudget (max one node down) guards against voluntary eviction, not deletion.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: spec_default
        reference: update_strategy defaults to SmartUpdate -- the operator orders restarts across the cluster safely when the image or configuration changes -- and the MySQL version is chosen by pinning image_name, making upgrades deliberate rolling operations.
