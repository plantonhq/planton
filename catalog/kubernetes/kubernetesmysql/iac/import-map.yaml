apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesmysql
spec:
  # The module renders one kubectl_manifest (the PerconaXtraDBCluster CR)
  # plus for_each-keyed credential Secrets and the optional anchor
  # namespace. Every satellite name is deterministic (derived from
  # metadata.name), so the whole family imports blind.
  values:
    # ── the PerconaXtraDBCluster CR ────────────────────────────────────
    - name: api_version
      tofu_resource_name: mysql
      derivations:
        - literal: pxc.percona.com/v1
      where_to_find: Always "pxc.percona.com/v1" — the CR's group/version.
    - name: kind
      tofu_resource_name: mysql
      derivations:
        - literal: PerconaXtraDBCluster
      where_to_find: Always "PerconaXtraDBCluster" — the CR kind this module applies.
    - name: name
      tofu_resource_name: mysql
      derivations:
        - from_metadata_name: true
        - from_output: cluster_name
      where_to_find: >-
        The CR's metadata.name (equals the Planton resource name) —
        `kubectl get pxc -A` (NAME column).
    # ── shared namespace segment for every namespaced object ───────────
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The cluster's namespace — `kubectl get pxc -A` (NAMESPACE column).
    # ── declared-credential Secrets ────────────────────────────────────
    # Both for_each families are keyed by the FULL Secret name, so the
    # unscoped from_address_key fallback derives them.
    - name: secret_name
      derivations:
        - from_address_key: true
      where_to_find: >-
        The module keys each Secret's address by the deterministic name
        it renders ("<name>-user-<username>", "<name>-backup-<storage>") —
        `kubectl get secrets -n <namespace>`.
    - name: secret_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same namespace as the cluster — every satellite the module renders
        is namespaced with it.
    # ── the optional anchor namespace ───────────────────────────────────
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the cluster's
        namespace itself.
