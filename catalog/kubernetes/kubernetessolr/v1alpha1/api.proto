syntax = "proto3";

package dev.planton.kubernetes.kubernetessolr.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetessolr/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetessolr/v1alpha1/spec.proto";
import "shared/metadata.proto";

//solr-kubernetes
message KubernetesSolr {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesSolr'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesSolrSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesSolrStatus status = 5;
}

//solr-kubernetes status
message KubernetesSolrStatus {
  //outputs
  KubernetesSolrOutputs outputs = 1;
}
