apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesSolr
metadata:
  name: prod-solr
spec:
  namespace:
    value: solr
  create_namespace: true
  # Three nodes — the floor for real shard/replica placement: a
  # replica of every shard can live away from its leader.
  replicas: 3
  version: 9.10.0
  # Fixed heap (Xms = Xmx) at roughly half the container memory — heap
  # growth causes GC pauses that read as node failures; the remainder
  # is OS page cache Solr leans on.
  java_mem: -Xms2g -Xmx2g
  # A real quorum: three ZooKeeper members tolerate one loss. The
  # ensemble gets its own persistent volumes — losing ZooKeeper state
  # means losing collection topology, so it is protected like data.
  zookeeper:
    provided:
      replicas: 3
      persistence:
        size: 10Gi
        # Literal class name shown; the field also accepts a valueFrom
        # reference to a KubernetesStorageClass resource.
        storage_class:
          value: <fast-ssd-storage-class>
  # PVC-backed indices that survive pod loss. Retain (the operator
  # default, made explicit) keeps the volumes when the SolrCloud is
  # deleted — data outlives the resource unless you decide otherwise.
  storage:
    persistent:
      size: 100Gi
      storage_class:
        value: <fast-ssd-storage-class>
      reclaim_policy: Retain
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 4Gi
  # Basic auth bootstrapped by the operator: security.json plus the
  # admin/solr/k8s-oper users, credentials written to the
  # <name>-solrcloud-basic-auth Secret (see outputs). No
  # credential appears in this manifest. If you later rotate the
  # password through Solr's security API, update that Secret too — the
  # operator locks itself out otherwise.
  security:
    authentication_type: basic
  # Managed updates: the operator restarts pods shard-aware, keeping
  # every shard queryable through the roll. The bounds tighten the
  # default budgets to one pod / one replica per shard at a time.
  update_strategy:
    method: Managed
    max_pods_unavailable: "1"
    max_shard_replicas_unavailable: "1"
  # The cluster-wide PodDisruptionBudget (operator default, made
  # explicit): voluntary disruptions — node drains, upgrades — cannot
  # take the cluster below the operator's availability floor.
  availability:
    pdb_enabled: true
