syntax = "proto3";

package dev.planton.kubernetes.kubernetesagentsandboxwarmpool.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesagentsandboxwarmpool/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesagentsandboxwarmpool/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesAgentSandboxWarmPool is an agent-sandbox SandboxWarmPool: a number
// of sandboxes from one template kept running and ready, so a claim gets one
// in the time it takes to hand it over.
message KubernetesAgentSandboxWarmPool {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesAgentSandboxWarmPool'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesAgentSandboxWarmPoolSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesAgentSandboxWarmPoolStatus status = 5;
}

// KubernetesAgentSandboxWarmPoolStatus holds the deployment status and outputs.
message KubernetesAgentSandboxWarmPoolStatus {
  // outputs
  KubernetesAgentSandboxWarmPoolOutputs outputs = 1;
}
