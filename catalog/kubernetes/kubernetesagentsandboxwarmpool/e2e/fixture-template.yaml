# The template the pool lanes build their members from: one container that
# becomes ready quickly. The scenarios reference it through valueFrom, so the
# lane proves the template reference resolves on both engines.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAgentSandboxTemplate
metadata:
  name: e2e-asbx-wp-tpl
spec:
  namespace:
    value: default
  podTemplate:
    spec:
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8888", "--udp-port=-1"]
          readinessProbe:
            httpGet:
              path: /hostname
              port: "8888"
