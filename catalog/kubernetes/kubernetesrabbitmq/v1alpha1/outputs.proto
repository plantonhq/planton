syntax = "proto3";

package dev.planton.kubernetes.kubernetesrabbitmq.v1alpha1;

//kubernetes-rabbit-mq outputs
message KubernetesRabbitMqOutputs {
  //namespace the cluster runs in.
  string namespace = 1;

  //name of the RabbitmqCluster resource (= metadata.name).
  string cluster_name = 2;

  //name of the client Service (operator naming contract: <name>).
  string service_name = 3;

  //name of the headless inter-node Service (operator naming
  //contract: <name>-nodes).
  string headless_service_name = 4;

  //in-cluster AMQP endpoint for clients, e.g.
  //orders-mq.messaging.svc.cluster.local:5672 (5671 when
  //tls.disable_non_tls_listeners closes the plain listener).
  string amqp_endpoint = 5;

  //in-cluster management API / UI endpoint, e.g.
  //http://orders-mq.messaging.svc.cluster.local:15672 (https on 15671
  //when tls.disable_non_tls_listeners closes the plain listener).
  string management_endpoint = 6;

  //name of the operator-generated Secret holding the administrator
  //credentials (keys: username, password, host, port,
  //connection_string, ...), e.g. <name>-default-user. When
  //secret_backend.vault is set the credentials live in Vault instead
  //and this is empty.
  string default_user_secret_name = 7;

  //command to port-forward the management UI to a developer laptop,
  //e.g. kubectl port-forward svc/orders-mq -n messaging 15672:15672
  string port_forward_command = 8;
}
