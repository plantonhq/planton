syntax = "proto3";

package dev.planton.kubernetes.kubernetesrabbitmq.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesrabbitmq/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesrabbitmq/v1alpha1/spec.proto";
import "shared/metadata.proto";

//kubernetes-rabbit-mq
message KubernetesRabbitMq {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesRabbitMq'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesRabbitMqSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesRabbitMqStatus status = 5;
}

//kubernetes-rabbit-mq status
message KubernetesRabbitMqStatus {
  // outputs
  KubernetesRabbitMqOutputs outputs = 1;
}
