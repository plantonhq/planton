# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetesgharunnerscaleset
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: Runner pods are ephemeral -- one job, then replaced -- and hold no data at rest of their own. The kubernetes-mode work volumes are short-lived PersistentVolumeClaims whose at-rest encryption is the declared StorageClass's posture, owned by the cluster.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Customer-managed keys for the work volumes are configured on the cluster's storage class or the cloud disk encryption set (see enc-at-rest); this spec has no seam for them.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The listener long-polls GitHub and runners fetch jobs and upload results over HTTPS -- github_config_url is the https endpoint, and github_server_tls mounts a private CA for GitHub Enterprise Servers with self-signed certificates.
      notes: proxy routes that traffic through an outbound proxy without changing its encryption.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The modules render no external exposure -- runners and the listener only dial OUT to GitHub; nothing accepts inbound traffic. GitHub never connects into the cluster (the listener polls).
    - control_id: restricted-ingress
      status: not_applicable
      notes: There is no ingress surface to restrict -- the fleet is outbound-only. WHICH repositories may send jobs to it is governed on the GitHub side by runner_group membership.
    - control_id: edge-protection
      status: not_applicable
      notes: The fleet serves no HTTP edge traffic -- web application firewalls do not apply.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The chart runs runner pods under a dedicated no-permission ServiceAccount by default; kubernetes container mode adds a purpose-scoped Role limited to the hook's pod operations in this namespace. Managing the fleet itself (the AutoscalingRunnerSet) is governed by the target cluster's Kubernetes RBAC.
      notes: On the GitHub side, runner_group controls which repositories may target the fleet.
    - control_id: workload-identity
      status: configurable
      field_path: auth.github_app
      evidence:
        type: spec_default
        reference: A GitHub App is the production posture -- fine-grained permissions and short-lived, automatically-expiring installation tokens; a PAT is a long-lived static credential. Either way the material lives only in a Kubernetes Secret (auth.existing_secret_name is the recommended arm -- the credential never rides a manifest).
      notes: The 02-org-docker-builds preset references a GitHub App Secret; 01 and 03 reference PAT Secrets for the quick-start posture.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The fleet exposes no authentication path of its own; every GitHub credential posture is token-based (see workload-identity for the App-vs-PAT strength choice).
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Job and runner activity is captured in GitHub's own audit log (who ran what, on which fleet); changes to the fleet declaration are Kubernetes API operations captured by the target cluster's audit policy.
    - control_id: monitoring-integration
      status: not_applicable
      notes: This spec models no metrics seam -- listener metrics exist in the chart (listenerMetrics) but are reachable only through the helm_values overlay, and the controller's own metrics ride KubernetesGhaRunnerScaleSetController.
    - control_id: backup-recovery
      status: not_applicable
      notes: There is nothing to back up -- runners are ephemeral by design, work volumes are released after each job, and the fleet declaration itself is a Kubernetes object that backs up with the cluster.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The fleet has no availability posture to configure -- runners are demand-driven and disposable, and a zone loss delays queued jobs (they wait in GitHub) rather than losing anything. min_runners is a warmth knob, not a resilience one.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither the chart nor the AutoscalingRunnerSet offers a deletion-protection flag. Deleting the fleet deregisters it from GitHub; queued jobs simply wait for another fleet matching their runs-on -- nothing durable is lost.
    - control_id: managed-patching
      status: configurable
      field_path: chart_version
      evidence:
        type: spec_default
        reference: The chart version is pinned (default "0.14.2") and must EQUAL the controller install's chart_version -- GitHub supports controller and scale-set charts only at matching versions, so upgrades are deliberate, paired pin changes.
      notes: Pin runner.image to a tag on production fleets -- the chart default "ghcr.io/actions/actions-runner:latest" changes under you.
