# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: kubernetesgharunnerscaleset
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubernetes_namespace_v1.gha_runner_scale_set -- created and owned only when spec.create_namespace is true; get is needed for refresh either way. delete applies only to module-owned namespaces.
      - api_groups:
          - ""
        resources:
          - secrets
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers kubernetes_secret_v1.github_auth (Pulumi twin githubAuthSecret) -- the <name>-github-auth Secret materialized BEFORE the release on the declared PAT / GitHub App arms only; the chart receives its NAME, never the material. The existing-Secret arm creates nothing (the user's own Secret is referenced by name).
      - api_groups:
          - ""
        resources:
          - serviceaccounts
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the ServiceAccounts the chart renders through helm_release.gha_runner_scale_set -- the no-permission runner ServiceAccount by default, or the kubernetes-mode ServiceAccount when container_mode.mode is kubernetes.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - roles
          - rolebindings
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: "Covers the chart's namespaced RBAC: the kubernetes-container-mode Role and RoleBinding (pod operations for the container hook, rendered only in that mode) and the manager Role and RoleBinding granting the CONTROLLER's ServiceAccount reconcile authority in this namespace (pods, secrets, and the fleet's runner objects). Kubernetes escalation prevention requires the runner to already hold the permissions those Roles grant, or the escalate verb."
      - api_groups:
          - actions.github.com
        resources:
          - autoscalingrunnersets
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the AutoscalingRunnerSet the chart renders -- the fleet declaration the controller reconciles into a listener and ephemeral runner pods AFTER the release returns (the modules deliberately install with wait=false; the runner pods, listener, and ephemeral PVCs are controller-created at runtime, never runner-applied). The CRDs must already exist -- a KubernetesGhaRunnerScaleSetController install is the prerequisite. The helm_values overlay (spec.helm_values, merged last) can extend the chart's object surface beyond these rules generally; grants for such extensions ride the operator's review of the overlay, not this manifest.
      - api_groups:
          - ""
        resources:
          - secrets
        verbs:
          - list
          - watch
        cluster_scoped: false
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Secret in github_auth_secret.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing. Listing or watching Secrets returns their data, not only their names, so this grants read of every Secret in the namespace. Pulumi's delete wait cannot watch a deleted Secret without it.
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - list
          - watch
        cluster_scoped: true
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Namespace in namespace.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
