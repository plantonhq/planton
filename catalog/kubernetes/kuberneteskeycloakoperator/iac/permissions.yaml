# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: kuberneteskeycloakoperator
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubectl_manifest.namespace -- the module-authored namespace document, applied only when spec.create_namespace is true (it applies FIRST, deletes LAST, and its delete BLOCKS until the namespace is fully gone -- the fixed-name install would otherwise race its own terminating namespace on destroy-then-apply). get is needed for refresh either way.
      - api_groups:
          - ""
        resources:
          - services
          - serviceaccounts
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Bundle documents applied by kubectl_manifest.keycloak_operator -- the keycloak-operator ServiceAccount and the metrics/health Service (ServiceAccount, Service, and Deployment all carry the same fixed upstream name; the module stamps the target namespace onto every namespaced document, the kustomize step upstream expects).
      - api_groups:
          - apps
        resources:
          - deployments
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: The operator Deployment -- the one document the module patches with the spec's typed overrides (resources, images, scheduling) before applying.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - roles
          - rolebindings
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: The bundle's namespaced RBAC in the installation namespace; every binding's ServiceAccount subject namespace is rewritten by the module's stamping to match the install.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - clusterroles
          - clusterrolebindings
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: The bundle's ClusterRoles (both watch-scope variants) and, in the cluster-wide variant (spec.cluster_wide true), the per-controller ClusterRoleBindings that let one operator reconcile Keycloak resources in every namespace.
      - api_groups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: "Covers kubectl_manifest.crds -- the four k8s.keycloak.org CRDs, fetched from the pinned tag and server-side-applied (REQUIRED: the keycloaks CRD document runs ~9,900 lines, past the client-side annotation cap). The delete verb is real and loaded: the CRDs delete with the resource, cascade-deleting every Keycloak CR on the cluster -- the module orders them to delete FIRST, while the operator still runs, so operator-processed finalizers can drain. Destroy KubernetesKeycloak resources before ever destroying the operator."
      - api_groups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - list
          - watch
        cluster_scoped: true
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the CustomResourceDefinition applied by the yaml ConfigGroup in main.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - rolebindings
          - roles
        verbs:
          - list
          - watch
        cluster_scoped: false
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Role applied by the yaml ConfigGroup in main.go and the RoleBinding applied by the yaml ConfigGroup in main.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - clusterrolebindings
          - clusterroles
        verbs:
          - list
          - watch
        cluster_scoped: true
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the ClusterRole applied by the yaml ConfigGroup in main.go and the ClusterRoleBinding applied by the yaml ConfigGroup in main.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
      - api_groups:
          - ""
        resources:
          - serviceaccounts
          - services
        verbs:
          - watch
        cluster_scoped: false
        provenance: derived
        notes: Pulumi only -- watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Service applied by the yaml ConfigGroup in main.go and the ServiceAccount applied by the yaml ConfigGroup in main.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - list
          - watch
        cluster_scoped: true
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Namespace applied by the yaml ConfigGroup in main.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
