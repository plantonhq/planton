apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: kuberneteskeycloakoperator
spec:
  tier: 4
  # Net-new: the official Keycloak Operator installed from its
  # release-manifest bundle at 26.7.0 (16 documents + 4 CRDs; Keycloak
  # ships no Helm chart). The verifier asserts the operator rollout,
  # all four k8s.keycloak.org CRDs established, and THE DESIGN
  # INVARIANT: no Keycloak server exists after installing the operator
  # alone (the KubernetesKeycloak declaration kind owns servers).
  # Destroy asserts workloads AND CRDs gone (the bundle posture).
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
