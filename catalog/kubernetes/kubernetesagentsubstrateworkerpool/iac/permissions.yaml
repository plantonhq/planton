# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: kubernetesagentsubstrateworkerpool
spec:
  kubernetes:
    rules:
      - api_groups:
          - ate.dev
        resources:
          - workerpools
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the kubectl_manifest.worker_pool resource (Terraform) and the apiextensions.CustomResource the manifestcr helper creates (Pulumi) -- each module's only resource, applying one namespaced WorkerPool (ate.dev/v1). The worker Deployment and NetworkPolicy are created by Substrate's controller under its own identity, never by the runner.
      - api_groups:
          - ate.dev
        resources:
          - workerpools
        verbs:
          - list
          - watch
        cluster_scoped: false
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes reads while it waits for a deleted object to be gone (an informer of the object's kind); OpenTofu, polling the one object with get, never needs them. An informer whose list is forbidden never syncs, so the destroy hangs with no error instead of failing.
