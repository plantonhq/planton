apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesagentsubstrateworkerpool
spec:
  # One kubectl_manifest applying the WorkerPool. The composed import ID is
  # apiVersion//kind//name//namespace — apiVersion and kind are constants of
  # this module (it renders exactly one GVK), declared as literals.
  values:
    - name: api_version
      derivations:
        - literal: ate.dev/v1
      where_to_find: >-
        Always "ate.dev/v1" — the module pins the served version.
    - name: kind
      derivations:
        - literal: WorkerPool
      where_to_find: Always "WorkerPool" — the CR kind this module applies.
    - name: name
      derivations:
        - from_metadata_name: true
        - from_output: worker_pool_name
      where_to_find: >-
        The WorkerPool's metadata.name (equals the Planton resource name) —
        `kubectl get workerpools -A` (NAME column).
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The namespace the resource lives in — `kubectl get workerpools -A`
        (NAMESPACE column).
