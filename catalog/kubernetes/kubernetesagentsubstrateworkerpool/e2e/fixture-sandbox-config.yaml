# A gVisor SandboxConfig that is not the class default, which the actor
# lane's pool names through its configRef: the pool must resolve to it (not
# to gvisor-default), and the counter actor lands on the pool and boots this
# config's default version -- the end-to-end proof that a configRef reaches
# the pool and that a config declared through the catalog runs an actor. Upstream's own release, under
# its own name.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAgentSubstrateSandboxConfig
metadata:
  name: e2e-ate-sandbox-config
spec:
  name: e2e-gvisor-workers
  sandboxClass: gvisor
  defaultVersion: gvisor-20261102-0
  versions:
    - name: gvisor-20261102-0
      assets:
        amd64:
          entries:
            gvisor:
              url: gs://gvisor/releases/release/20261102.0/x86_64/gvisor.tar.zstd
              sha256: a1439ffbba7d212e0fde32ea79fa9bb51cbc4c5f6c16af1f047260290b861d42
        arm64:
          entries:
            gvisor:
              url: gs://gvisor/releases/release/20261102.0/aarch64/gvisor.tar.zstd
              sha256: f702ae92ad7a0c4134be34ca23f52966dbb696db0c0f5b8ec439210ab2cd7c6a
