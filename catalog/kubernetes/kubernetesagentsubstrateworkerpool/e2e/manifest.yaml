# The full surface, for offline proofs (tofu plan, pulumi preview, a server
# dry run): every field of the pool, with literal values where the lanes
# reference fixtures (the worker image the control plane publishes for
# v1.0.0, the ServiceAccount, the PriorityClass and a SandboxConfig).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAgentSubstrateWorkerPool
metadata:
  name: e2e-asubwp-full
spec:
  namespace:
    value: e2e-ate-workers
  labels:
    tenant: acme
  annotations:
    planton.dev/e2e-note: full-surface
  replicas: 2
  workerImage:
    value: ghcr.io/agent-substrate/substrate/ateworker-gvisor:v1.0.0@sha256:f8987236c6256f58c4b2625e543b43f4ae4bdded6ee6821c03d966effb7c0f17
  template:
    labels:
      team: platform
    annotations:
      planton.dev/e2e-note: worker
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
      - key: tenant
        operator: Equal
        value: acme
        effect: NoSchedule
    priorityClassName:
      value: e2e-ate-workers
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                  - amd64
                  - arm64
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    serviceAccountName:
      value: e2e-ate-workers
  sandboxClasses:
    - name: gvisor
      configRef:
        name:
          value: e2e-gvisor-workers
