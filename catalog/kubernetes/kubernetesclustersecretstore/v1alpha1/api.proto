syntax = "proto3";

package dev.planton.kubernetes.kubernetesclustersecretstore.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesclustersecretstore/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesclustersecretstore/v1alpha1/spec.proto";
import "shared/metadata.proto";

//kubernetes-cluster-secret-store
message KubernetesClusterSecretStore {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesClusterSecretStore'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesClusterSecretStoreSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesClusterSecretStoreStatus status = 5;
}

//kubernetes-cluster-secret-store status.
message KubernetesClusterSecretStoreStatus {
  //outputs
  KubernetesClusterSecretStoreOutputs outputs = 1;
}
