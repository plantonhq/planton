apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: kubernetesdeployment
spec:
  tier: 1
  # Proven live 2026-10-23, every scenario on both engines (kind v1.37): the
  # image-pull Secret built from pod.image_registries materialized and the
  # pod became Ready; the substrate-client scenario (Pulumi; pod-certificates
  # profile, a real KubernetesAgentSubstrate as prerequisite) rolled out only
  # once the projected token, the ClusterTrustBundle referenced from the
  # substrate's outputs, and the router pod certificate were all mounted; and
  # the OpenTofu engine refused those two projections at plan, naming the
  # mount and the engine that writes them. The replica-ownership lanes
  # (behavioral-hpa-keeps-size, behavioral-hpa-enable-keeps-size,
  # behavioral-external-scaler-keeps-size) proven live 2026-11-19 on both
  # engines with minimal, with-replicas and with-hpa: a size the inline HPA or
  # an external scaler chose survived a re-apply that rolled the pods, and
  # turning the HPA on never dropped the Deployment below its floor.
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
