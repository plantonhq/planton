# Act two of behavioral-hpa-enable-keeps-size: the HPA turns on at floor 3
# and E2E_ACT is added, so the engine updates the Deployment while it still
# owns the replica count; the size must stay at 3 throughout.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesDeployment
metadata:
  name: e2e-dep-hpa-on
  annotations:
    planton.dev/e2e-second-act: behavioral-hpa-enable-keeps-size.yaml
spec:
  namespace:
    value: e2e-dep-hpa-on-ns
  create_namespace: true
  version: main
  container:
    app:
      image:
        repo: nginx
        tag: "1.27-alpine"
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
      ports:
        - name: http
          container_port: 80
          network_protocol: TCP
          app_protocol: http
          service_port: 80
      env:
        variables:
          - name: E2E_ACT
            value: "two"
  availability:
    replicas: 3
    horizontal_pod_autoscaling:
      enabled: true
      max_replicas: 5
      target_cpu_utilization_percent: 70
