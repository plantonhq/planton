# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetesdeployment
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A Deployment is a stateless workload -- it stores no data of its own. Data on mounted volume sources (Secrets and ConfigMaps in etcd, PersistentVolumeClaims on the storage class) rests under the encryption posture of those sources and the cluster, not this component.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: With no data at rest of its own (see enc-at-rest), there is no key to manage; customer-managed keys apply to the cluster's etcd and storage-class encryption, owned outside this spec.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The workload serves whatever protocol the application implements -- the spec models no TLS seam. Transport encryption is the application's own responsibility, a service mesh's, or the composed exposure kind's (which terminates TLS at the edge).
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The modules render only a ClusterIP Service fronting the pods (kubernetes_service_v1, type hardcoded to ClusterIP), so the workload is reachable solely inside the cluster network. External exposure is composed through first-class ingress kinds referencing the exported Service handle -- this module creates no exposure infrastructure.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The workload creates no ingress path to restrict -- pods sit behind a ClusterIP Service. Network-source restriction is owned by Kubernetes NetworkPolicies (the KubernetesNamespace kind's network isolation) and by the exposure kinds composed in front.
    - control_id: edge-protection
      status: not_applicable
      notes: No edge exists on this component -- external traffic only reaches it through separately composed exposure kinds, where request filtering would attach.
    - control_id: rbac
      status: configurable
      field_path: pod.service_account
      evidence:
        type: spec_default
        reference: Unset runs pods as the namespace's default ServiceAccount, which carries no Kubernetes API permissions; setting it binds pods to a dedicated identity whose permissions are granted declaratively through KubernetesRbac resources. The module itself never creates ServiceAccounts or RBAC objects, so identity and permissions stay auditable resources in the graph.
      notes: Management-plane access (the Deployment object itself) is governed by the target cluster's Kubernetes RBAC. The 04-hardened-production preset references a dedicated KubernetesServiceAccount.
    - control_id: workload-identity
      status: configurable
      field_path: pod.service_account
      evidence:
        type: spec_default
        reference: Unset means pods hold no cloud identity; referencing a KubernetesServiceAccount resource attaches an identity whose own workload_identity configuration federates to cloud APIs (EKS IRSA, GKE Workload Identity, AKS Workload Identity) without static credentials.
      notes: The workload-identity binding lives on the referenced KubernetesServiceAccount resource, not in this spec. pod.automount_service_account_token=false additionally hardens pods that never call the Kubernetes API, as the 04-hardened-production preset demonstrates.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The spec models no authentication protocol -- how clients authenticate to the application is the application's own concern.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Changes to the Deployment and its satellite objects are Kubernetes API operations, captured by the target cluster's audit policy. The application's own logs stream to stdout for the cluster's log collector; no separate audit trail is modeled in this spec.
    - control_id: monitoring-integration
      status: configurable
      field_path: pod.annotations
      evidence:
        type: spec_default
        reference: Unset exports nothing; prometheus.io scrape annotations stamped on the pod template are the conventional discovery seam for cluster Prometheus stacks. The application must serve the metrics endpoint itself -- the module wires no exporter.
    - control_id: backup-recovery
      status: not_applicable
      notes: A stateless workload has no data of its own to back up -- its entire state is the declarative manifest, re-creatable by a redeploy. Data on referenced PersistentVolumeClaims is backed up where those volumes are owned.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist for this component (see backup-recovery), so no retention applies.
    - control_id: multi-zone-ha
      status: configurable
      field_path: availability.replicas
      evidence:
        type: spec_default
        reference: replicas defaults to 1 (no redundancy); running 2 or more replicas with pod.scheduling.topology_spread_constraints on the zone topology key spreads them across availability zones, and availability.pod_disruption_budget keeps a floor of pods through voluntary disruptions.
      notes: The 04-hardened-production preset runs 3 replicas zone-spread with a PDB holding 2 available; 02-web-service-with-hpa runs 2 replicas with a PDB holding 1.
    - control_id: deletion-protection
      status: not_applicable
      notes: Kubernetes offers no deletion-protection flag on Deployments; protection is operational (namespace RBAC, change review). The PodDisruptionBudget (availability.pod_disruption_budget) guards pods against voluntary eviction, not the Deployment against deletion.
    - control_id: managed-patching
      status: not_applicable
      notes: The workload runs exactly the image the manifest pins -- there is no managed patch channel. Patch cadence is the image owner's build pipeline (the deploy-target contract injects freshly built artifacts through spec.version and spec.container.app.image), with rollout safety governed by availability.strategy.
