# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the platform modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetesagentsubstrate
spec:
  controls:
    - control_id: enc-at-rest
      status: configurable
      field_path: database
      evidence:
        type: spec_default
        reference: The bundled database's volume is encrypted at rest by its storage class (database.bundled.storage_class); an external or Cloud SQL database by its own provider (Cloud SQL encrypts at rest by default). Agent snapshots live in the bucket storage names, encrypted by its provider.
      notes: Upstream stores snapshots unencrypted by the application itself (its roadmap); the bucket's own server-side encryption is the control.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No key seam exists on this component -- customer-managed keys apply to the database's storage class or Cloud SQL instance and to the snapshot bucket, each configured on its own component.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: module_default
        reference: Every control-plane connection is mutual TLS with certificates the pod-certificate controller issues through Kubernetes' pod-certificate APIs -- the API on TLS 1.3, the bundled database at sslmode verify-full with client certificates, clients to the Envoy router (only the SPIFFE IDs router.allowed_client_spiffe_ids names), the router to agents over mTLS CONNECT tunnels, the egress gateway to the credential provider over mTLS. The certificate authorities are generated by the modules.
      notes: The agentgateway router (router.dataplane agentgateway) still serves plaintext ingress listeners, reachable inside the cluster subject to the network policies; the Envoy router, the default, serves only mutual TLS.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: module_default
        reference: Every Service the modules apply is cluster-internal (upstream's manifests, verified at the release the modules compose). Exposing the router or the identity server is a separate, deliberate Gateway or load balancer in front of it.
    - control_id: restricted-ingress
      status: enforced_by_default
      evidence:
        type: module_default
        reference: Upstream's network policies put every pod in ate-system behind a default-deny ingress policy, with allowances for exactly the paths the components use; the API admits only namespaces labelled ate.dev/api-access=true (the api_access_namespace_label output), and each worker pool's policy admits only the router.
      notes: NetworkPolicy takes effect only on a cluster whose network enforces it.
    - control_id: edge-protection
      status: not_applicable
      notes: The router is a cluster-internal data path; a web application firewall belongs on whatever edge a deployment puts in front of it.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: module_default
        reference: Every component's RBAC comes from upstream's release verbatim. The bundled credential provider can read Secrets cluster-wide, and answers only for the namespaces each atespace is granted (egress.credential_provider.kubernetes_secrets.grants, deny by default).
    - control_id: workload-identity
      status: configurable
      field_path: platform.gke
      evidence:
        type: spec_validation
        reference: GCS storage and Cloud SQL are keyless only -- the spec refuses them off GKE -- through the API server's and node agent's Google service accounts (api_server_service_account, node_agent_service_account) or their Kubernetes service accounts' own Workload Identity principals. Every GCS snapshot moves as the transfer service account (snapshot_transfer_service_account), which the API server impersonates and narrows to one actor per token, so the node agent holds no grant on the bucket. Cloud SQL logs in with IAM as the API server's service account.
      notes: S3-compatible storage uses an access key from a Secret; an external database uses connection strings from a Secret. Neither secret ever enters the spec.
    - control_id: no-legacy-auth
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The API authenticates callers by Kubernetes service-account tokens for its audience or SPIFFE client certificates; the bundled database accepts only client certificates for its two login users and refuses the superuser over the network.
    - control_id: strong-user-auth
      status: enforced_by_default
      evidence:
        type: module_default
        reference: Every API call is authenticated and authorized against Substrate's access policies, always; api_server.authorization.bootstrap_owners names the first owners (upstream's ate-system ate-client service account when empty). The Envoy router carries requests to actors only from the client workloads router.allowed_client_spiffe_ids names.
    - control_id: audit-logging
      status: configurable
      field_path: telemetry.logs_exporters
      evidence:
        type: spec_default
        reference: Every component logs structured events; telemetry.logs_exporters sends the actor events components emit to an OTLP collector or the console. Every Kubernetes mutation the controller makes is captured by the cluster's audit policy.
    - control_id: monitoring-integration
      status: configurable
      field_path: telemetry
      evidence:
        type: spec_default
        reference: Every component serves Prometheus metrics and exports traces and metrics over OTLP -- to GKE's managed collector by default on GKE, to telemetry.otlp_endpoint when set; the router's PodMonitoring feeds Managed Service for Prometheus on GKE.
    - control_id: backup-recovery
      status: configurable
      field_path: database
      evidence:
        type: spec_default
        reference: All Substrate state is in the database and the snapshot bucket. An external or Cloud SQL database carries its provider's backups; the bundled database's volume outlives a destroy while another resource owns the namespace, and is backed up by the cluster's volume snapshots.
      notes: Back up before a minor-version reinstall -- the refusal's next step says so.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: Retention is the database's and the bucket's, configured on their own components.
    - control_id: multi-zone-ha
      status: configurable
      field_path: api_server.replicas
      evidence:
        type: spec_default
        reference: The API server runs two replicas behind a disruption budget by default; router.replicas and egress.replicas scale the data paths; cordon_control_plane pins the control plane to dedicated nodes, spread one per node.
      notes: The bundled database is a single instance; Cloud SQL's high-availability configuration is the path to a zone-redundant database.
    - control_id: deletion-protection
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The resource definitions are kept on destroy (crds.keep_on_uninstall defaults true), so destroying the control plane cannot delete a worker pool; the bundled database's volume outlives a destroy while another resource owns the namespace; and the modules refuse to install over workloads, namespaces or definitions another installation created, and a minor-release move upstream cannot survive.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: module_default
        reference: spec.version picks a release Planton publishes (its digest-pinned build of upstream's release, checked against its checksums), defaulting to the release the modules compose; a patch of that install shape is adopted by setting it, and a release of another shape is refused before anything is applied. Moves are guarded by the upgrade refusal, and the definitions follow the install shape, never lowered.
