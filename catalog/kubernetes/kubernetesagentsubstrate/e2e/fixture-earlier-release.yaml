# AN EARLIER INSTALLATION for the upgrade-refused lane: the API server
# Deployment as this kind leaves it, carrying the kind's ownership label and
# the release stamp of v0.6.0, the last release before 1.0. Upstream squashed
# its migrations up to v0.6.0, so a v0.x installation is a reinstall to reach
# the pinned v1.0.0, and the deploy must refuse at plan with the
# backup, destroy and clear steps, and leave the stamp as it was. The
# fixture owns the namespace, so the control plane runs with
# createNamespace off. A pause container is enough: the refusal reads the
# stamp before anything is applied.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesManifest
metadata:
  name: e2e-ate-earlier-release
spec:
  namespace:
    value: ate-system
  create_namespace: true
  skip_await: true
  manifest_yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ate-api-server
      namespace: ate-system
      labels:
        app: ate-api-server
        planton.ai/kind: KubernetesAgentSubstrate
      annotations:
        planton.ai/agent-substrate-version: v0.6.0
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: ate-api-server
      template:
        metadata:
          labels:
            app: ate-api-server
        spec:
          containers:
            - name: ate-api-server
              image: registry.k8s.io/pause:3.10
