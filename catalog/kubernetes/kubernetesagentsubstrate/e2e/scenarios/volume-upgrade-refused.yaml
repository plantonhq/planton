# THE MINOR-RELEASE REFUSAL, from the database volume: the bundled
# database's volume (the fixture) was written by minor 0.5 and outlived its
# installation. Installing v0.6.0 over it would migrate that data
# irreversibly, so the deploy must be refused at plan, naming the volume
# and how to clear it.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAgentSubstrate
metadata:
  name: e2e-ate-volume-refused
  annotations:
    planton.dev/e2e-cluster-profile: "pod-certificates"
    planton.dev/e2e-prerequisites: "catalog/kubernetes/kubernetesagentsubstrate/e2e/fixture-earlier-volume.yaml"
    planton.dev/e2e-expect-deploy-failure: upgrade-refused
    planton.dev/e2e-expect-installed-version: v0.5
spec:
  namespace:
    value: ate-system
  platform:
    generic:
      serviceAccountIssuer: https://kubernetes.default.svc.cluster.local
  database:
    bundled: {}
  storage:
    s3:
      endpoint:
        value: http://s3.example.invalid:8333
      bucket: substrate-snapshots
      credentials:
        secretName:
          value: substrate-s3
  apiServer:
    authorization:
      bootstrapOwners:
        - system:serviceaccount:e2e-ate-probe:e2e-ate-client
  router:
    allowedClientSpiffeIds:
      - spiffe://cluster.local/ns/e2e-ate-probe/sa/e2e-ate-client
  egress:
    credentialProvider:
      disabled: {}
