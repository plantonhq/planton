# The second act of credential-policy-change.yaml: the research atespace
# granted a second namespace, and a support atespace added. Not a scenario of
# its own (the second-act annotation keeps discovery from running it as a
# lane); it names the first act's fixtures because its store reference
# resolves against them.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAgentSubstrate
metadata:
  name: e2e-ate-creds
  annotations:
    planton.dev/e2e-cluster-profile: "pod-certificates"
    planton.dev/e2e-second-act: credential-policy-change.yaml
    planton.dev/e2e-prerequisites: "catalog/kubernetes/kubernetesagentsubstrate/e2e/fixture-namespace.yaml, catalog/kubernetes/kubernetesagentsubstrate/e2e/fixture-s3-store.yaml, catalog/kubernetes/kubernetesagentsubstrate/e2e/fixture-s3-credentials.yaml"
spec:
  namespace:
    value: ate-system
  crds:
    keepOnUninstall: false
  platform:
    generic:
      serviceAccountIssuer: https://kubernetes.default.svc.cluster.local
  database:
    bundled:
      volumeSize: 2Gi
  storage:
    s3:
      endpoint:
        valueFrom:
          name: e2e-ate-s3
      bucket: substrate-snapshots
      credentials:
        secretName:
          value: substrate-s3
  apiServer:
    authorization:
      bootstrapOwners:
        - system:serviceaccount:e2e-ate-probe:e2e-ate-client
  router:
    allowedClientSpiffeIds:
      - spiffe://cluster.local/ns/e2e-ate-probe/sa/e2e-ate-client
  egress:
    credentialProvider:
      kubernetesSecrets:
        grants:
          - atespace: research
            allowedNamespaces:
              - research-credentials
              - shared-credentials
          - atespace: support
            allowedNamespaces:
              - support-credentials
