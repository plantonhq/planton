# THE CREDENTIAL PROVIDER AND A SETTINGS CHANGE: install upstream's
# Kubernetes Secrets provider with one atespace granted one namespace, then
# redeploy from credential-policy-change.to.yaml with the grants changed.
# After each act the verifier asserts the provider's policy holds exactly
# the declared grants and that the running provider started from it (its
# configuration digest equals the Deployment's), so a grant change reaches
# the running provider without anyone restarting it.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAgentSubstrate
metadata:
  name: e2e-ate-creds
  annotations:
    planton.dev/e2e-cluster-profile: "pod-certificates"
    planton.dev/e2e-upgrade-manifest: credential-policy-change.to.yaml
    planton.dev/e2e-prerequisites: "catalog/kubernetes/kubernetesagentsubstrate/e2e/fixture-namespace.yaml, catalog/kubernetes/kubernetesagentsubstrate/e2e/fixture-s3-store.yaml, catalog/kubernetes/kubernetesagentsubstrate/e2e/fixture-s3-credentials.yaml"
spec:
  namespace:
    value: ate-system
  crds:
    keepOnUninstall: false
  platform:
    generic:
      serviceAccountIssuer: https://kubernetes.default.svc.cluster.local
  database:
    bundled:
      volumeSize: 2Gi
  storage:
    s3:
      endpoint:
        valueFrom:
          name: e2e-ate-s3
      bucket: substrate-snapshots
      credentials:
        secretName:
          value: substrate-s3
  apiServer:
    authorization:
      bootstrapOwners:
        - system:serviceaccount:e2e-ate-probe:e2e-ate-client
  router:
    allowedClientSpiffeIds:
      - spiffe://cluster.local/ns/e2e-ate-probe/sa/e2e-ate-client
  egress:
    credentialProvider:
      kubernetesSecrets:
        grants:
          - atespace: research
            allowedNamespaces:
              - research-credentials
