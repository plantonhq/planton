  optional string drain_grace = 4 [
    (dev.planton.shared.options.default) = "5s",
    (buf.validate.field).cel = {
      id: "identity_server_drain_grace_format"
      message: "drain_grace must be a Go duration such as \"5s\""
      expression: "this.matches('^([0-9]+(\\\\.[0-9]+)?(ns|us|ms|s|m|h))+$')"
    }
  ];
}

/**
 * A minimum log level.
 */
enum LogLevel {
  info = 0;
  debug = 1;
  warn = 2;
  error = 3;
}
