syntax = "proto3";

package dev.planton.kubernetes.kubernetesagentsubstrate.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetes.proto";
import "catalog/kubernetes/workload_pod.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

/**
 * **KubernetesAgentSubstrateSpec** installs the Agent Substrate control plane:
 * the system that runs a large set of mostly idle AI agents ("actors") on a
 * small set of ready worker pods, suspending an idle actor's memory and disk
 * into object storage and resuming it on demand, each actor sandboxed (gVisor
 * or a microVM). One install per cluster serves every product on it.
 *
 * What it installs, all in `ate-system` unless noted:
 *   - the API server (`ate-api-server`), the gRPC API a product creates
 *     atespaces, actor templates, actors and egress policies through, backed by
 *     PostgreSQL (`database`);
 *   - the controller (`ate-controller`), which turns each WorkerPool into
 *     worker pods and registers them with the API server;
 *   - the node agent (`atelet`, a DaemonSet), which runs actors on worker
 *     nodes and moves their snapshots to and from object storage (`storage`);
 *   - the identity server (`ate-idp-server`), which publishes the keys actor
 *     JWTs are verified with at the actor-JWT issuer;
 *   - the ingress router (`atenet-router`), the data path a request reaches an
 *     actor by, and the egress gateway (`atenet-egress`), which enforces each
 *     actor's egress policy and can inject credentials into its outbound calls;
 *   - the pod-certificate controller (in `podcertificate-controller-system`),
 *     which signs the certificates every component's mTLS uses, through
 *     Kubernetes' PodCertificateRequest and ClusterTrustBundle APIs;
 *   - the three resource definitions (WorkerPool, SandboxConfig,
 *     CSIDriverConfig) and the default gVisor runtime (SandboxConfig
 *     `gvisor-default`).
 * Worker pools, extra runtimes and storage drivers are their own catalog
 * resources. Atespaces, actor templates, actors and egress policies are records
 * in Substrate's database, created by the product through the API this kind
 * outputs, never Kubernetes objects.
 *
 * CLUSTER REQUIREMENTS: Kubernetes serving the pod-certificate APIs
 * (certificates.k8s.io PodCertificateRequest and ClusterTrustBundle, with
 * ClusterTrustBundle projection): GKE 1.36 created with those beta APIs
 * enabled (they cannot be added later), Kubernetes 1.37 with the feature
 * gates, or a kind cluster configured as upstream's own. A CNI that enforces
 * NetworkPolicy, because the install's isolation is a default-deny policy.
 * Upstream supports GKE and kind.
 *
 * DISTRIBUTION AND VERSION: Agent Substrate publishes no images and no
 * installable release, so Planton publishes both: each upstream release built
 * by upstream's own publisher, every image digest-pinned, at
 * https://downloads.planton.ai/releases/agent-substrate/<version>/. The
 * modules compose that tree the way upstream's installer does and apply the
 * typed settings below onto it. They compose one install shape, v0.6.0's,
 * and `version` picks any release Planton publishes with that shape: a
 * release whose install differs from it only in its images, which Planton
 * proves before it publishes one. So a new upstream patch reaches this kind
 * by setting `version`, with no catalog update; a release with another shape
 * is refused at plan time, before anything is applied, and arrives with the
 * catalog update that composes it. The resource definitions belong to the
 * shape, so the catalog's Substrate resource kinds mirror them field for
 * field. Before 1.0 every minor release is a reinstall upstream (its database
 * schema migrates irreversibly), so the kind refuses an apply over an older
 * minor's installation or database, and says how to move across; patch
 * releases of one minor move in place, either way.
 *
 * GENERATED SECRETS: the certificate authorities behind every component's
 * mTLS, the actor-identity CA, the egress interception CA and the actor token
 * signing key are generated by the modules in upstream's exact format and
 * kept in the deployment's state. A re-apply never replaces them; a destroy
 * does, exactly like an upstream reinstall.
 *
 * NAMESPACE IS FIXED: `ate-system` is baked into upstream's manifests, the
 * API's server name and its token audience. Who owns it is still a choice
 * (`namespace`, `create_namespace`): Secrets this kind reads (S3 credentials,
 * external database connection strings) must be in it before the deploy.
 *
 * Built for 100% parity with every setting upstream's installer and its
 * components offer; the guide accounts for each one.
 */
message KubernetesAgentSubstrateSpec {
  /**
   * The namespace the control plane installs into. It is always "ate-system":
   * upstream's manifests, the API's server name (api.ate-system.svc) and its
   * token audience name it. Reference a KubernetesNamespace of that name to
   * let it own the namespace (its quotas and policies apply, and the Secrets
   * this kind reads can be placed there first), or set the literal value with
   * create_namespace.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef namespace = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesNamespace,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "spec.name",
    (buf.validate.field).cel = {
      id: "namespace_fixed"
      message: "namespace must be \"ate-system\": upstream's manifests, the API's server name and its token audience name it, so Agent Substrate runs nowhere else"
      expression: "!has(this.value) || this.value == 'ate-system'"
    }
  ];

  /**
   * Create `ate-system` (with the standard Planton governance labels) and
   * delete it with this resource, which deletes everything in it. Leave it
   * false when a KubernetesNamespace owns the namespace; then it must exist
   * before the deploy. `podcertificate-controller-system`, which holds only
   * the pod-certificate controller and its CA pools, is always this
   * resource's.
   */
  bool create_namespace = 2;

  /**
   * The lifecycle of the three resource definitions (WorkerPool,
   * SandboxConfig, CSIDriverConfig). Empty = install them from the pinned
   * release and keep them on destroy.
   */
  KubernetesAgentSubstrateCrds crds = 3;

  /**
   * The cluster this runs on: GKE, or any other conformant cluster. Decides
   * which issuer the API server trusts for Kubernetes tokens, whether the
   * GKE-only pieces stay, and how storage and Cloud SQL authenticate.
   */
  KubernetesAgentSubstratePlatform platform = 4 [(buf.validate.field).required = true];

  /**
   * The PostgreSQL database the API server keeps every atespace, template,
   * actor and policy in: bundled, external, or Cloud SQL.
   */
  KubernetesAgentSubstrateDatabase database = 5 [(buf.validate.field).required = true];

  /**
   * The object store actor snapshots are suspended into and resumed from, and
   * sandbox runtime assets are staged through: GCS or any S3-compatible store.
   */
  KubernetesAgentSubstrateStorage storage = 6 [(buf.validate.field).required = true];

  /**
   * The API server (`ate-api-server`).
   */
  KubernetesAgentSubstrateApiServer api_server = 7;

  /**
   * The controller (`ate-controller`).
   */
  KubernetesAgentSubstrateController controller = 8;

  /**
   * The node agent (`atelet`), one per node, which runs actors on worker
   * nodes.
   */
  KubernetesAgentSubstrateNodeAgent node_agent = 9;

  /**
   * The ingress router (`atenet-router`), the data path a request reaches an
   * actor by.
   */
  KubernetesAgentSubstrateRouter router = 10;

  /**
   * The egress gateway (`atenet-egress`): every actor's outbound traffic,
   * its egress policy, and the credentials it may have injected.
   */
  KubernetesAgentSubstrateEgress egress = 11 [(buf.validate.field).required = true];

  /**
   * The pod-certificate controller, which signs every component's
   * certificates.
   */
  KubernetesAgentSubstratePodCertificates pod_certificates = 12;

  /**
   * Where the components send traces, metrics and logs.
   */
  KubernetesAgentSubstrateTelemetry telemetry = 13;

  /**
   * The cluster-size profile upstream tunes for. size0 is upstream's default;
   * size10 is upstream's profile for large clusters: the pod-certificate
   * controller gets a higher Kubernetes API rate, and the bundled database a
   * dedicated node's sizing (a large-server postgresql.conf, 80 CPUs and
   * 140Gi requested) and wider connection pools. The configuration and the
   * resources are one profile, so a bundled database's own resources cannot
   * be set with size10.
   */
  ClusterSize cluster_size = 14;

  /**
   * Run the control plane on dedicated nodes: every control-plane Deployment
   * gets the node selector and toleration
   * `ate.dev/workloadType=ate-control-plane` (spread one per node), and the
   * bundled database `ate.dev/workloadType=ate-postgres`. Label and taint
   * those nodes first; the deploy is refused when no node carries the
   * database label. Upstream's posture for production clusters, where actor
   * load must not starve the control plane.
   */
  bool cordon_control_plane = 15;

  /**
   * Registry that replaces the registry part of every image the install runs
   * (Planton's Substrate images on ghcr.io, Envoy's among them, PostgreSQL on
   * Docker Hub, the Cloud SQL proxy on gcr.io, agentgateway on
   * cr.agentgateway.dev): the air-gap and private-mirror path.
   * Each image keeps its path, tag and digest, so a mirror must copy images
   * byte for byte. "us-central1-docker.pkg.dev" pulls Planton's own mirror of
   * the Substrate images. Docker Hub names without a registry are read the
   * way container runtimes read them ("postgres:18-alpine" is
   * docker.io/library/postgres:18-alpine). Actor images are your own and
   * never move. Empty = each image's own registry.
   */
  string image_registry = 16 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).cel = {
      id: "image_registry_format"
      message: "image_registry is a registry root such as \"mirror.example.com/substrate\": no scheme and no trailing slash"
      expression: "!this.endsWith('/') && !this.contains('://')"
    }
  ];

  /**
   * Names of image-pull Secrets in `ate-system` for pulling the control
   * plane's images from a private registry.
   */
  repeated string image_pull_secrets = 17 [(dev.planton.shared.options.sensitive_exempt_reason) = "Names of existing Kubernetes Secrets (references), not secret material"];

  /**
   * The Agent Substrate release to install, from those Planton publishes with
   * this kind's install shape (v0.6.0's): v0.6.0, or a later release whose
   * install differs from it only in its images. A release Planton has not
   * published, or one with another shape, is refused before anything is
   * applied. A patch release of the installed minor moves in place, up or
   * down; another minor is a reinstall, refused over an existing
   * installation. Redeploy worker pools after a move, so their workers run
   * the new release's worker image.
   */
  optional string version = 18 [
    (dev.planton.shared.options.default) = "v0.6.0",
    (buf.validate.field).string.pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
  ];

  /**
   * Preview features to turn on in every component: each named gate, or
   * "ALL". A preview is upstream's not-yet-stable behaviour (external volumes
   * for actors, golden egress policies on actor templates, a snapshot
   * location per actor template), and its API can change in a later release.
   * Empty = none.
   */
  repeated string preview_gates = 19 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {
        in: [
          "ALL",
          "ExternalVolumes",
          "GoldenEgressPolicy",
          "PerTemplateSnapshotLocation"
        ]
      }
    }
  }];

  /**
   * The identity server (`ate-idp-server`), which publishes the keys actor
   * JWTs are verified with.
   */
  KubernetesAgentSubstrateIdentityServer identity_server = 20;

  /**
   * A cluster-size profile upstream tunes for.
   */
  enum ClusterSize {
    size0 = 0;
    size10 = 1;
  }

  option (buf.validate.message).cel = {
    id: "size10_sizes_the_bundled_database"
    message: "database.bundled.resources cannot be set with cluster_size size10: size10 sizes the bundled database for a dedicated node, its postgresql.conf tuned for 140Gi, and a smaller container would run out of memory under load; use size10 with its own sizing, or size0 with your resources"
    expression: "this.cluster_size != 1 || !has(this.database.bundled) || !has(this.database.bundled.resources)"
  };
  option (buf.validate.message).cel = {
    id: "gcs_needs_gke"
    message: "storage.gcs authenticates keylessly through GKE Workload Identity, so it needs platform.gke; on another cluster use storage.s3"
    expression: "!has(this.storage.gcs) || has(this.platform.gke)"
  };
  option (buf.validate.message).cel = {
    id: "cloud_sql_needs_gke"
    message: "database.cloud_sql connects through the Cloud SQL Auth Proxy with GKE Workload Identity, so it needs platform.gke"
    expression: "!has(this.database.cloud_sql) || has(this.platform.gke)"
  };
  option (buf.validate.message).cel = {
    id: "cloud_sql_iam_needs_api_server_identity"
    message: "database.cloud_sql logs in as the API server's Google service account, so set platform.gke.api_server_service_account (or turn cloud_sql.iam_authentication off and give a connection string)"
    expression: "!has(this.database.cloud_sql) || (has(this.database.cloud_sql.iam_authentication) && !this.database.cloud_sql.iam_authentication) || (has(this.platform.gke) && has(this.platform.gke.api_server_service_account))"
  };
  option (buf.validate.message).cel = {
    id: "gcs_needs_snapshot_transfer_service_account"
    message: "storage.gcs moves snapshots as a dedicated Google service account the API server impersonates, so set platform.gke.snapshot_transfer_service_account"
    expression: "!has(this.storage.gcs) || (has(this.platform.gke) && has(this.platform.gke.snapshot_transfer_service_account))"
  };
  option (buf.validate.message).cel = {
    id: "envoy_router_needs_allowed_clients"
    message: "router.allowed_client_spiffe_ids needs at least one client: the Envoy router lets only the mutual-TLS callers it names reach actors, and refuses to start with none. Name each workload that calls actors, such as \"spiffe://cluster.local/ns/<namespace>/sa/<service-account>\""
    expression: "has(this.router) && (this.router.dataplane == 1 || size(this.router.allowed_client_spiffe_ids) > 0)"
  };
  option (buf.validate.message).cel = {
    id: "extproc_needs_envoy"
    message: "egress.additional_ext_proc_service splices a filter into Envoy's configuration, so it needs router.dataplane envoy"
    expression: "!has(this.egress.additional_ext_proc_service) || !has(this.router) || this.router.dataplane != 1"
  };
}

/**
 * The lifecycle of the resource definitions. They are applied as kept
 * resources, stamped with their source and release, and checked before every
 * write: a definition someone else applied (another install of Substrate, a
 * kubectl apply) is refused with its owner named, and a release older than
 * the one that wrote the cluster's definitions is refused as a downgrade.
 */
message KubernetesAgentSubstrateCrds {
  /**
   * Apply the definitions from the pinned release. Set false only when
   * another tool manages them (a GitOps repository applying upstream's
   * definitions) and no other installation of Substrate runs on the cluster;
   * the control plane still installs and needs them.
   */
  optional bool install = 1 [(dev.planton.shared.options.default) = "true"];

  /**
   * Leave the definitions on the cluster when this resource is destroyed.
   * Deleting a definition deletes every object of that type, so false deletes
   * every WorkerPool (and its worker pods, with every actor running on them),
   * SandboxConfig and CSIDriverConfig on the cluster. Keep it true outside
   * throwaway clusters.
   */
  optional bool keep_on_uninstall = 2 [(dev.planton.shared.options.default) = "true"];
}

/**
 * The cluster this runs on. Exactly one.
 */
message KubernetesAgentSubstratePlatform {
  oneof kind {
    option (buf.validate.oneof).required = true;

    /**
     * Google Kubernetes Engine.
     */
    KubernetesAgentSubstrateGke gke = 1;

    /**
     * Any other conformant cluster, kind included.
     */
    KubernetesAgentSubstrateGeneric generic = 2;
  }
}

/**
 * GKE. The GKE-only pieces stay: the router's Managed Service for Prometheus
 * PodMonitoring, and the node agent's mount of GKE's image credential
 * provider, which lets actors pull private Artifact Registry images with the
 * node's identity. With GCS storage, every snapshot moves as one Google
 * service account (snapshot_transfer_service_account) that the API server
 * impersonates, handing each node agent a token scoped to the one actor it
 * moves; no node holds a grant on the snapshot bucket.
 */
message KubernetesAgentSubstrateGke {
  /**
   * The cluster's full resource ID,
   * "projects/<project>/locations/<location>/clusters/<name>". The API server
   * trusts Kubernetes service-account tokens issued by
   * "https://container.googleapis.com/v1/<this>", GKE's own issuer.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef cluster_id = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpGkeCluster,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.cluster_id",
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (buf.validate.field).cel = {
      id: "gke_cluster_id_format"
      message: "gke.cluster_id is a cluster's full resource ID: projects/<project>/locations/<location>/clusters/<name>"
      expression: "!has(this.value) || this.value.matches('^projects/[^/]+/locations/[^/]+/clusters/[^/]+$')"
    }
  ];

  /**
   * The Google service account the API server acts as through Workload
   * Identity (the `iam.gke.io/gcp-service-account` annotation on its
   * Kubernetes service account). With GCS storage it needs
   * storage.objectAdmin and storage.bucketViewer on the snapshot bucket, and
   * roles/iam.serviceAccountTokenCreator on the snapshot transfer service
   * account; with Cloud SQL, roles/cloudsql.client and
   * roles/cloudsql.instanceUser, and the database user named after it. Empty
   * = no annotation: grant those roles to the Kubernetes service account's
   * own Workload Identity principal instead.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef api_server_service_account = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpServiceAccount,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.email"
  ];

  /**
   * The Google service account the node agent acts as through Workload
   * Identity. It holds no grant on the snapshot bucket: each snapshot moves
   * with a token the API server mints for that one actor. For actors that
   * pull private images it needs artifactregistry.reader, and for microVM
   * workers storage.objectViewer on the asset bucket that holds their guest
   * kernels and images ("<snapshot-bucket>-assets", by upstream's
   * convention). Empty = no annotation: grant those roles to the Kubernetes
   * service account's own Workload Identity principal instead.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef node_agent_service_account = 3 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpServiceAccount,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.email"
  ];

  /**
   * The Google service account every GCS snapshot transfer runs as. The API
   * server impersonates it and hands each node agent a token narrowed to the
   * one actor's snapshots, so a node can never reach another actor's. It
   * needs storage.objectAdmin and storage.bucketViewer on the snapshot
   * bucket, and the API server's service account needs
   * roles/iam.serviceAccountTokenCreator on it. Required with GCS storage.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef snapshot_transfer_service_account = 4 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpServiceAccount,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.email"
  ];
}

/**
 * Any other conformant cluster. The GKE-only pieces are left out exactly as
 * upstream's kind overlay leaves them out.
 */
message KubernetesAgentSubstrateGeneric {
  /**
   * The issuer of the cluster's service-account tokens, which the API server
   * trusts to authenticate callers. Read it with
   * `kubectl get --raw /.well-known/openid-configuration` (the "issuer"
   * field); kind and kubeadm clusters use
   * "https://kubernetes.default.svc.cluster.local". A wrong issuer refuses
   * every caller, so it has no default. For the two in-cluster forms the API
   * server verifies tokens against the cluster itself, as upstream does.
   */
  string service_account_issuer = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "service_account_issuer_https"
      message: "service_account_issuer is an https URL with a host and no query or fragment, such as \"https://kubernetes.default.svc.cluster.local\""
      expression: "this.matches('^https://[^/?#@]+(/[^?#]*)?$')"
    }
  ];
}

/**
 * The PostgreSQL database. Exactly one of bundled, external or cloud_sql.
 */
message KubernetesAgentSubstrateDatabase {
  oneof kind {
    option (buf.validate.oneof).required = true;

    /**
     * Upstream's bundled PostgreSQL 18, one StatefulSet in `ate-system` with
     * its own volume. The API server reaches it with client certificates
     * from the pod-certificate controller, never a password. Right for
     * evaluation and small installs; its volume outlives a destroy while
     * another resource owns the namespace.
     */
    KubernetesAgentSubstrateBundledDatabase bundled = 1;

    /**
     * A PostgreSQL you run. The API server connects with the connection
     * strings you give; run upstream's setup script (roles and schema) on it
     * once first.
     */
    KubernetesAgentSubstrateExternalDatabase external = 2;

    /**
     * Cloud SQL for PostgreSQL through the Cloud SQL Auth Proxy, with keyless
     * IAM login as the API server's Google service account.
     */
    KubernetesAgentSubstrateCloudSqlDatabase cloud_sql = 3;
  }

  /**
   * Most connections in the API server's shared read/write pool (its
   * OpenFGA store included). Empty = upstream's default, the larger of 4 and
   * the node's CPU count.
   */
  optional int32 pool_max_connections = 4 [(buf.validate.field).int32.gt = 0];
}

/**
 * Upstream's bundled PostgreSQL. Its roles and schema are upstream's
 * defaults, which the API server's setup script creates on every start of
 * the database.
 */
message KubernetesAgentSubstrateBundledDatabase {
  /**
   * StorageClass of the database volume. Empty = the cluster's default.
   */
  string storage_class = 1;

  /**
   * Size of the database volume (a Kubernetes quantity). Fixed at first
   * install: a volume claim template cannot change.
   */
  optional string volume_size = 2 [
    (dev.planton.shared.options.default) = "500Gi",
    (buf.validate.field).cel = {
      id: "bundled_volume_size_quantity"
      message: "volume_size must be a Kubernetes quantity such as \"20Gi\" or \"500Gi\""
      expression: "this.matches('^[0-9]+(\\\\.[0-9]+)?(Ki|Mi|Gi|Ti|Pi|Ei|k|M|G|T|P|E)?$')"
    }
  ];

  /**
   * Resources for the database container. Empty = upstream's (2 CPUs and 1Gi
   * requested; 16 CPUs and 2Gi limits), or size10's. Not settable with
   * cluster_size size10, whose postgresql.conf assumes its own sizing.
   */
  dev.planton.kubernetes.ContainerResources resources = 3;
}

/**
 * A PostgreSQL you run. Two pools connect: the owner pool runs schema
 * migrations at every API server start, the read/write pool serves requests.
 * Each SETs ROLE to a NOLOGIN role, so the login users can be anything that
 * may assume them.
 */
message KubernetesAgentSubstrateExternalDatabase {
  /**
   * The read/write connection string (a libpq DSN or URI), from a Secret in
   * `ate-system` (Kubernetes reads a Secret only from the pod's own
   * namespace).
   */
  KubernetesAgentSubstrateSecretKeyRef read_write_connection_string = 1 [(buf.validate.field).required = true];

  /**
   * The owner connection string, from a Secret in `ate-system`. Empty = the
   * read/write connection string, whose user must then also be able to
   * assume the owner role.
   */
  KubernetesAgentSubstrateSecretKeyRef owner_connection_string = 2;

  /**
   * The roles and schema the pools assume.
   */
  KubernetesAgentSubstrateDatabaseRoles roles = 3;

  /**
   * PEM certificate of the CA that signed the database's server certificate,
   * for connection strings with sslmode=verify-ca or verify-full and
   * sslrootcert=/run/postgres-server-ca/server-ca.pem. A CA certificate is
   * public. Empty = none mounted.
   */
  string server_ca_certificate = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).cel = {
      id: "server_ca_certificate_pem"
      message: "server_ca_certificate must be a PEM certificate (-----BEGIN CERTIFICATE-----)"
      expression: "this.contains('-----BEGIN CERTIFICATE-----')"
    }
  ];
}

/**
 * Cloud SQL for PostgreSQL. Upstream's guide: PostgreSQL 18, database
 * `atepg`, the IAM database flag on, a Cloud SQL IAM user named after the
 * API server's Google service account, and upstream's setup script run once.
 */
message KubernetesAgentSubstrateCloudSqlDatabase {
  /**
   * The instance's connection name, "<project>:<region>:<instance>".
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef instance_connection_name = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpCloudSql,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.connection_name",
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (buf.validate.field).cel = {
      id: "cloud_sql_connection_name_format"
      message: "instance_connection_name is \"<project>:<region>:<instance>\""
      expression: "!has(this.value) || this.value.matches('^[^:]+:[^:]+:[^:]+$')"
    }
  ];

  /**
   * Log in with IAM as the API server's Google service account, keyless. With
   * it off, give read_write_connection_string (a password login through the
   * proxy at 127.0.0.1:5432).
   */
  optional bool iam_authentication = 2 [(dev.planton.shared.options.default) = "true"];

  /**
