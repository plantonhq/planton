syntax = "proto3";

package dev.planton.kubernetes.kubernetesagentsubstrate.v1alpha1;

/**
 * Outputs exported after installing the Agent Substrate control plane:
 * exactly what a product that creates actors on it reads.
 */
message KubernetesAgentSubstrateOutputs {
  /**
   * Namespace the control plane runs in: always `ate-system`.
   */
  string namespace = 1;

  /**
   * The API's gRPC address, "api.ate-system.svc:443". A product dials it
   * with TLS 1.3, verifying the server as api_server_name against the
   * ClusterTrustBundle api_trust_bundle_name, and presents a projected
   * service-account token with audience api_token_audience. Its namespace
   * needs the label api_access_namespace_label, or the API's NetworkPolicy
   * drops the connection.
   */
  string api_address = 2;

  /**
   * The name the API server's certificate is issued for:
   * "api.ate-system.svc".
   */
  string api_server_name = 3;

  /**
   * The audience a caller's projected service-account token must carry:
   * "api.ate-system.svc".
   */
  string api_token_audience = 4;

  /**
   * The ClusterTrustBundle holding the CA that signs the API server's (and
   * every in-cluster Substrate service's) certificate:
   * "servicedns.podcert.ate.dev:identity:primary-bundle". A pod reads it
   * through a clusterTrustBundle projected volume by this name.
   */
  string api_trust_bundle_name = 5;

  /**
   * The signer of that bundle, "servicedns.podcert.ate.dev/identity", for a
   * clusterTrustBundle projection by signer name and label selector.
   */
  string api_trust_bundle_signer = 6;

  /**
   * The label a caller's namespace must carry to reach the API:
   * "ate.dev/api-access=true".
   */
  string api_access_namespace_label = 7;

  /**
   * The agentgateway router's plaintext HTTP endpoint,
   * "http://atenet-router.ate-system.svc:80", which accepts any caller.
   * Empty with the Envoy router, which serves only router_tls_endpoint.
   */
  string router_endpoint = 8;

  /**
   * The router's TLS endpoint, "https://atenet-router.ate-system.svc:443". A
   * request reaches an actor with the header
   * `ate-target-actor: <atespace>/<actor>`; the Envoy router accepts it only
   * from a client presenting a certificate whose SPIFFE ID
   * router.allowed_client_spiffe_ids names (router_client_signer_name).
   */
  string router_tls_endpoint = 9;

  /**
   * Where actor snapshots are stored, "gs://<bucket>" or "s3://<bucket>",
   * followed by storage.snapshot_prefix when set: the API server's snapshot
   * location, which an actor template overrides only with the
   * PerTemplateSnapshotLocation preview.
   */
  string storage_location = 10;

  /**
   * The iss claim of the JWTs the API server mints for actors.
   */
  string actor_jwt_issuer = 11;

  /**
   * The gVisor worker image built for this control plane's version, digest
   * pinned (with image_registry applied): what a WorkerPool of class gvisor
   * runs.
   */
  string gvisor_worker_image = 12;

  /**
   * The microVM worker image built for this control plane's version, digest
   * pinned (with image_registry applied): what a WorkerPool of class microvm
   * runs.
   */
  string microvm_worker_image = 13;

  /**
   * The Agent Substrate release installed, such as "v0.6.0": spec.version,
   * or the kind's default.
   */
  string version = 14;

  /**
   * The signer of the client certificates the router's TLS endpoint accepts,
   * "podidentity.podcert.ate.dev/identity". A workload gets one through a
   * podCertificate projected volume addressed to this signer; the
   * certificate carries the SPIFFE ID
   * spiffe://cluster.local/ns/<namespace>/sa/<service-account>, which
   * router.allowed_client_spiffe_ids must name.
   */
  string router_client_signer_name = 15;
}
