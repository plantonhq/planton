apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAgentSubstrate
metadata:
  name: agent-substrate
spec:
  # The bundled Kubernetes Secrets provider: an agent's outbound https call
  # is intercepted by the egress gateway and gets a credential from a Secret
  # injected, so the agent never holds it. Each atespace resolves Secrets
  # only from the namespaces it is granted.
  namespace:
    value: ate-system
  createNamespace: true
  platform:
    generic:
      serviceAccountIssuer: https://kubernetes.default.svc.cluster.local
  database:
    bundled:
      volumeSize: 20Gi
  storage:
    s3:
      endpoint:
        valueFrom:
          name: agent-snapshots
      bucket: agent-snapshots
      credentials:
        secretName:
          valueFrom:
            name: substrate-s3
  apiServer:
    authorization:
      # The service account your product calls the API as, so it can
      # create atespaces.
      bootstrapOwners:
        - system:serviceaccount:my-product:agent-orchestrator
  router:
    # The workloads that call actors, by the SPIFFE ID of their pod
    # certificate.
    allowedClientSpiffeIds:
      - spiffe://cluster.local/ns/my-product/sa/agent-orchestrator
  egress:
    credentialProvider:
      kubernetesSecrets:
        grants:
          - atespace: team-a
            allowedNamespaces:
              - team-a-credentials
