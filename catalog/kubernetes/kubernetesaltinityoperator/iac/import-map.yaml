apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesaltinityoperator
spec:
  # The module renders one Helm release NAMED AFTER metadata.name and the
  # optional anchor namespace. No CRD entries: the CRDs are chart-owned
  # (they ship in the chart's crds/ directory and are carried by its
  # pre-install/pre-upgrade hook job), so the module holds no CRD state
  # to import.
  values:
    - name: release_name
      derivations:
        - from_output: release_name
        - from_metadata_name: true
      where_to_find: >-
        `helm list -n <namespace>` (NAME column) — the release shares the
        resource's name.
    - name: release_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `helm list -A` (NAMESPACE column); conventionally
        "altinity-operator" or the cluster's operators namespace.
    # ── the optional anchor namespace ────────────────────────────────────
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the installation
        namespace itself.
