syntax = "proto3";

package dev.planton.kubernetes.kubernetesaltinityoperator.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesaltinityoperator/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesaltinityoperator/v1alpha1/spec.proto";
import "shared/metadata.proto";

//kubernetes-altinity-operator
message KubernetesAltinityOperator {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesAltinityOperator'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesAltinityOperatorSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesAltinityOperatorStatus status = 5;
}

//kubernetes-altinity-operator status
message KubernetesAltinityOperatorStatus {
  //outputs
  KubernetesAltinityOperatorOutputs outputs = 1;
}
