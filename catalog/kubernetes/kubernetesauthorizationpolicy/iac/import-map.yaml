apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesauthorizationpolicy
spec:
  # One kubectl_manifest applying the Istio AuthorizationPolicy CR. The composed import ID
  # is apiVersion//kind//name//namespace — apiVersion and kind are constants
  # of this module (it renders exactly one GVK), declared as literals.
  values:
    - name: api_version
      derivations:
        - literal: security.istio.io/v1
      where_to_find: >-
        Always "security.istio.io/v1" — the module pins the served version.
    - name: kind
      derivations:
        - literal: AuthorizationPolicy
      where_to_find: Always "AuthorizationPolicy" — the CR kind this module applies.
    - name: name
      derivations:
        - from_metadata_name: true
        - from_output: authorization_policy_name
      where_to_find: >-
        The AuthorizationPolicy's metadata.name (equals the Planton resource name) —
        `kubectl get authorizationpolicies -A` (NAME column).
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The namespace the resource lives in — `kubectl get authorizationpolicies -A`
        (NAMESPACE column).
