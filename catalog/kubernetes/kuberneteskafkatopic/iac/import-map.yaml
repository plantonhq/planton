apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kuberneteskafkatopic
spec:
  # One kubectl_manifest — the KafkaTopic CR, named after metadata.name in
  # the Kafka cluster's own namespace. Everything derives blind.
  values:
    - name: api_version
      derivations:
        - literal: kafka.strimzi.io/v1
      where_to_find: Always "kafka.strimzi.io/v1" — the CR's group/version.
    - name: kind
      derivations:
        - literal: KafkaTopic
      where_to_find: Always "KafkaTopic" — the CR kind this module applies.
    - name: name
      derivations:
        - from_metadata_name: true
      where_to_find: >-
        The KafkaTopic CR's metadata.name (equals the Planton resource
        name; the KAFKA topic name may differ via spec.topic_name) —
        `kubectl get kafkatopic -A` (NAME column).
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The Kafka cluster's namespace (the placement contract) —
        `kubectl get kafkatopic -A` (NAMESPACE column).
