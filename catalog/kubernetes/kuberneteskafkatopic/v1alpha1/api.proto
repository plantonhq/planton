syntax = "proto3";

package dev.planton.kubernetes.kuberneteskafkatopic.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kuberneteskafkatopic/v1alpha1/outputs.proto";
import "catalog/kubernetes/kuberneteskafkatopic/v1alpha1/spec.proto";
import "shared/metadata.proto";

//kubernetes-kafka-topic
message KubernetesKafkaTopic {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesKafkaTopic'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesKafkaTopicSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesKafkaTopicStatus status = 5;
}

//kubernetes-kafka-topic status
message KubernetesKafkaTopicStatus {
  //outputs
  KubernetesKafkaTopicOutputs outputs = 1;
}
