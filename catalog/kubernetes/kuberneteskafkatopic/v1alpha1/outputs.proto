syntax = "proto3";

package dev.planton.kubernetes.kuberneteskafkatopic.v1alpha1;

/**
 * **KubernetesKafkaTopicOutputs** — the handles a declared Kafka
 * topic exports for composition (producers/consumers configure the
 * topic name; the bootstrap endpoint comes from the KubernetesKafka
 * resource's own outputs).
 */
message KubernetesKafkaTopicOutputs {
  // Namespace the KafkaTopic resource lives in (the Kafka cluster's
  // namespace).
  string namespace = 1;

  // The actual Kafka topic name (spec.topic_name when set, otherwise
  // metadata.name) — what producers and consumers subscribe to.
  string topic_name = 2;
}
