syntax = "proto3";

package dev.planton.kubernetes;

import "buf/validate/validate.proto";

// KubernetesProvider enumerates the platforms whose clusters Planton deploy engines
// can connect to.
//
// A value earns its place here when the platform brings its own credential shape:
// the selected provider determines which sub-message of KubernetesProviderConfig
// holds the connection details. Platforms that authenticate through a plain
// kubeconfig (local development clusters, on-prem, bare metal, and any managed
// platform that simply hands out a kubeconfig) share the
// single self_managed value rather than one value per platform.
enum KubernetesProvider {
  kubernetes_provider_unspecified = 0; // Unspecified Kubernetes provider.
  gcp_gke = 1; // Google Kubernetes Engine (GKE) - A managed Kubernetes service by Google Cloud that provides automated cluster management and scaling.
  aws_eks = 2; // Amazon Elastic Kubernetes Service (EKS) - A managed Kubernetes service by AWS that simplifies the deployment and management of Kubernetes clusters.
  azure_aks = 3; // Azure Kubernetes Service (AKS) - A managed Kubernetes service by Microsoft Azure that provides Kubernetes cluster orchestration and management.
  digital_ocean_doks = 4; // DigitalOcean Kubernetes Service (DOKS) - A managed Kubernetes service by DigitalOcean that simplifies the deployment and management of Kubernetes clusters.
  self_managed = 5; // A cluster on no credential-bearing managed platform: kind/minikube/k3s, on-prem, bare metal, vSphere, and any kubeconfig-only cloud. Connects through a plain kubeconfig.
}

// KubernetesProviderConfig message represents the specification required to create or connect a Kubernetes Cluster.
// This message consolidates all necessary input parameters to establish a connection with a Kubernetes cluster, ensuring accurate configuration and validation of credentials.
// Fields include environment information, Kubernetes provider details, and credentials for GKE clusters.
message KubernetesProviderConfig {
  // The Kubernetes provider, specifying the type of cluster (e.g., gcp_gke, aws_eks, azure_aks).
  // For more detailed information, refer to the official documentation of each provider.
  KubernetesProvider provider = 1 [(buf.validate.field).required = true];

  // Credential specification for GCP GKE provider.
  // This field contains detailed information for connecting to a Google Kubernetes Engine (GKE) cluster.
  KubernetesProviderConfigGcpGke gcp_gke = 2;

  // Credential specification for AWS EKS provider.
  // This field contains detailed information for connecting to a Elastic Kubernetes Engine(EKS) cluster.
  KubernetesProviderConfigAwsEks aws_eks = 3;

  // Credential specification for Azure AKS provider.
  // This field contains detailed information for connecting to a Azure Kubernetes Service(AKS) cluster.
  KubernetesProviderConfigAzureAks azure_aks = 4;

  KubernetesProviderConfigDigitalOceanDoks digital_ocean_doks = 5;

  // Connection specification for self-managed clusters (kind, minikube, k3s, on-prem,
  // bare metal, vSphere, and any kubeconfig-only cloud).
  KubernetesProviderConfigSelfManaged self_managed = 6;
}

// KubernetesProviderConfigGcpGke contains the connection parameters for a Google Kubernetes Engine (GKE) cluster.
//
// A GKE API server accepts short-lived Google OAuth2 access tokens. The config carries the
// cluster identity as plain values plus at most one credential that yields those tokens:
// a service-account key (exchanged for a token whenever one is needed), or a pre-minted
// access token. With neither, tokens come from the ambient Google credential chain.
message KubernetesProviderConfigGcpGke {
  // A key and a pre-minted token are two different identities' credentials; carrying both
  // would leave the effective identity to precedence rules instead of the caller.
  option (buf.validate.message).cel = {
    id: "kubernetes.gcp_gke.one_credential"
    message: "set at most one of service_account_key and access_token"
    expression: "this.service_account_key == '' || this.access_token == ''"
  };

  // The cluster API server endpoint URL.
  string cluster_endpoint = 1 [(buf.validate.field).required = true];

  // Base64-encoded cluster Certificate Authority (CA) certificate.
  // This is the standard kubeconfig CA data format.
  string cluster_ca_data = 2 [(buf.validate.field).required = true];

  // JSON content of a Google Service Account key file used to authenticate to the GKE cluster.
  //
  // This is the raw JSON downloaded from the GCP Console or generated via
  // `gcloud iam service-accounts keys create`.
  //
  // Optional: when both this and access_token are empty, tokens are minted from the
  // ambient Google credential chain of the process -- GOOGLE_OAUTH_ACCESS_TOKEN when
  // present (the token a Planton runner mints for a connection's named gcloud
  // configuration), else Application Default Credentials (GOOGLE_APPLICATION_CREDENTIALS,
  // Workload Identity, GCE metadata, or `gcloud auth application-default login`). Same
  // contract as the EKS static-key fields and the AKS client_secret.
  string service_account_key = 3;

  // A pre-minted, short-lived Google OAuth2 access token for the cluster, supplied inline.
  // It travels exactly where the rendered kubeconfig's exec entry travels, as the
  // service-account key does, and is worthless after its hour. It is the carrier for
  // credentials obtained OUTSIDE this config -- e.g. a Planton runner that
  // exchanges a keyless (OIDC web-identity) GCP connection for the impersonated service
  // account's token before the engine starts. Google access tokens live about an hour
  // and cannot be renewed, so a caller running longer than that re-mints and re-supplies
  // it per operation (the same contract as GcpProviderConfig.access_token).
  string access_token = 4;
}

// KubernetesProviderConfigAwsEks contains the connection parameters for an Amazon Elastic
// Kubernetes Service (EKS) cluster.
//
// EKS has no long-lived bearer credential: API-server tokens are presigned STS
// GetCallerIdentity URLs that expire within ~15 minutes and are validated per request.
// This config therefore carries the cluster identity as plain values plus the AWS
// credentials used to mint those tokens on demand. The caller (a deploy engine or an
// in-process Kubernetes client) exchanges the AWS credentials for a fresh EKS token
// whenever one is needed; the token itself is never stored here.
message KubernetesProviderConfigAwsEks {
  // The EKS cluster name. Bound into every minted token via the x-k8s-aws-id signed
  // header, which is how the cluster's API server ties the token to itself.
  string cluster_name = 1 [(buf.validate.field).required = true];

  // The cluster API server endpoint URL.
  string cluster_endpoint = 2 [(buf.validate.field).required = true];

  // Base64-encoded cluster Certificate Authority (CA) certificate.
  // This is the standard kubeconfig CA data format.
  string cluster_ca_data = 3 [(buf.validate.field).required = true];

  // The AWS region hosting the cluster. Token minting signs against this region's
  // STS endpoint, so it is required even though the endpoint URL implies it.
  string region = 4 [(buf.validate.field).required = true];

  // The AWS Access Key ID used to mint EKS tokens. Optional: when the static key
  // fields are empty, tokens are minted from the ambient AWS credential chain of the
  // process (shared config profile, environment, or instance role). When present, it
  // must start with 'AKIA' (long-term) or 'ASIA' (temporary) followed by 16
  // alphanumeric characters; the format rules are skipped when the field is empty.
  string access_key_id = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.len = 20,
    (buf.validate.field).cel = {
      id: "kubernetes.aws_eks.access_key_id.prefix"
      message: "Must start with 'AKIA' (long-term) or 'ASIA' (temporary)"
      expression: "this.matches('^A(K|S)IA.*')"
    },
    (buf.validate.field).cel = {
      id: "kubernetes.aws_eks.access_key_id.format"
      message: "Must start with 'AKIA' or 'ASIA' followed by 16 alphanumeric characters"
      expression: "this.matches('^.{4}[a-zA-Z0-9]{16}$')"
    }
  ];

  // The AWS Secret Access Key paired with access_key_id. Optional (see access_key_id);
  // when present it must be exactly 40 characters of numbers, letters, slashes (/),
  // and plus signs (+). The format rule is skipped when the field is empty.
  string secret_access_key = 6 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.len = 40,
    (buf.validate.field).cel = {
      id: "kubernetes.aws_eks.secret_access_key"
      message: "Must contain exactly 40 characters consisting of numbers, letters, slashes (/), and plus signs (+)"
      expression: "this.matches('^[0-9a-zA-Z/+]{40}$')"
    }
  ];

  // The AWS Session Token, required when access_key_id carries temporary security
  // credentials (an 'ASIA' key from an STS exchange). Empty for long-term keys.
  string session_token = 7;
}

// KubernetesProviderConfigAzureAks contains the connection parameters for an Azure
// Kubernetes Service (AKS) cluster with Microsoft Entra ID integration.
//
// Like EKS, an Entra-integrated AKS API server has no long-lived bearer credential:
// it honors short-lived Entra access tokens issued for the AKS AAD server application
// (a first-party Azure app whose ID is identical in every environment). This config
// therefore carries the cluster identity as plain values plus at most one credential:
// the Entra service-principal secret, which the caller (a deploy engine or an
// in-process Kubernetes client) exchanges for a fresh token whenever one is needed, or
// a token a caller already minted elsewhere (access_token), used as is.
//
// Clusters WITHOUT Entra integration (local-accounts-only) have no token to mint --
// connect those through the self_managed arm with the kubeconfig AKS hands out.
message KubernetesProviderConfigAzureAks {
  // A client secret only has meaning together with the identity it authenticates.
  option (buf.validate.message).cel = {
    id: "kubernetes.azure_aks.secret_requires_identity"
    message: "tenant_id and client_id are required when client_secret is set"
    expression: "this.client_secret == '' || (this.tenant_id != '' && this.client_id != '')"
  };

  // A client secret and a pre-minted token are two different credentials; carrying both
  // would leave the effective identity to precedence rules instead of the caller.
  option (buf.validate.message).cel = {
    id: "kubernetes.azure_aks.one_credential"
    message: "set at most one of client_secret and access_token"
    expression: "this.client_secret == '' || this.access_token == ''"
  };

  // The cluster API server endpoint URL, from the AKS portal or
  // `az aks show --query fqdn`.
  string cluster_endpoint = 1 [(buf.validate.field).required = true];

  // Base64-encoded cluster Certificate Authority (CA) certificate.
  // This is the standard kubeconfig CA data format.
  string cluster_ca_data = 2 [(buf.validate.field).required = true];

  // The Entra tenant ID the service principal lives in. Required with client_secret;
  // omitted in ambient mode (the process's own Azure credential chain signs instead).
  string tenant_id = 3;

  // The service principal's client ID. Required with client_secret; the principal
  // must hold RBAC on the cluster (e.g. Azure Kubernetes Service RBAC Cluster Admin,
  // or a cluster role bound to its object ID).
  string client_id = 4;

  // The service principal's client secret, used to mint AKS tokens. Optional: when
  // both this and access_token are empty, tokens are minted from the ambient Azure
  // credential chain of the process (environment variables, managed identity, or
  // Azure CLI login).
  string client_secret = 5;

  // A pre-minted, short-lived Entra access token for the AKS API server, supplied inline.
  // It travels exactly where the rendered kubeconfig's exec entry travels, as the client
  // secret does, and is worthless once it expires. It is the carrier for credentials
  // obtained OUTSIDE this config -- e.g. a Planton runner that
  // exchanges a keyless (OIDC web-identity) Azure connection for a token scoped to the
  // AKS server application before the engine starts. Entra access tokens cannot be
  // renewed, so a caller running longer than one token's life re-mints and re-supplies
  // it per operation.
  string access_token = 6;
}

// KubernetesProviderConfigDigitalOceanDoks message represents the specification required to connect to a DigitalOcean Kubernetes Service (DOKS) cluster.
message KubernetesProviderConfigDigitalOceanDoks {
  string kube_config = 1 [(buf.validate.field).required = true];
}

// KubernetesProviderConfigSelfManaged carries the connection for any cluster that
// authenticates through a plain kubeconfig: local development clusters (kind,
// minikube, k3s, Docker Desktop), on-prem and bare-metal clusters, vSphere, and
// any managed platform that simply hands out a kubeconfig. The file
// bundles endpoint, CA data, and credential; there is no token to refresh and
// therefore nothing else to configure.
message KubernetesProviderConfigSelfManaged {
  // The complete kubeconfig YAML for the cluster. If the file contains several
  // contexts, the current-context is used.
  string kube_config = 1 [(buf.validate.field).required = true];
}
