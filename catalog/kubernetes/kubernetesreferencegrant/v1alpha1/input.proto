syntax = "proto3";

package dev.planton.kubernetes.kubernetesreferencegrant.v1alpha1;

import "catalog/kubernetes/kubernetesreferencegrant/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// Input for the KubernetesReferenceGrant IaC stack. The platform resolves all
// StringValueOrRef references (namespace) to literal strings before passing this
// to the IaC engine.
message KubernetesReferenceGrantIacInput {
  // Target infra-component.
  KubernetesReferenceGrant target = 1;
  // Kubernetes provider configuration (cluster credentials).
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
