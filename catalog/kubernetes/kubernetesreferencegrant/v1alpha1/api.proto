syntax = "proto3";

package dev.planton.kubernetes.kubernetesreferencegrant.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesreferencegrant/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesreferencegrant/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesReferenceGrant is a Kubernetes Gateway API ReferenceGrant: a
// namespaced authorization that permits resources in other namespaces to
// reference specified kinds of resources in this grant's namespace.
message KubernetesReferenceGrant {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesReferenceGrant'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesReferenceGrantSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesReferenceGrantStatus status = 5;
}

// KubernetesReferenceGrantStatus holds the deployment status and outputs.
message KubernetesReferenceGrantStatus {
  // outputs
  KubernetesReferenceGrantOutputs outputs = 1;
}
