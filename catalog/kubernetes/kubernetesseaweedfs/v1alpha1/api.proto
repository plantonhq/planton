syntax = "proto3";

package dev.planton.kubernetes.kubernetesseaweedfs.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesseaweedfs/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesseaweedfs/v1alpha1/spec.proto";
import "shared/metadata.proto";

//seaweedfs-kubernetes
message KubernetesSeaweedFs {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesSeaweedFs'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesSeaweedFsSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesSeaweedFsStatus status = 5;
}

//seaweedfs-kubernetes status.
message KubernetesSeaweedFsStatus {
  //outputs
  KubernetesSeaweedFsOutputs outputs = 1;
}
