# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetesseaweedfs
spec:
  controls:
    - control_id: enc-at-rest
      status: configurable
      field_path: filer.encrypt_volume_data
      evidence:
        type: spec_default
        reference: Defaults to false -- object bytes land on the volume-server PVCs as written; true encrypts data on the volume servers as it is written through the filer (ciphertext on disk, keys in filer metadata).
      notes: Underlying PVC encryption additionally rides the StorageClass (declare an encrypted class per tier via data_volume.storage_class).
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: The filer's encryption keys live in its own metadata, not a cloud KMS -- customer-managed keys apply at the StorageClass/disk layer, which is the storage infrastructure's posture, not this component's.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The S3 API and inter-tier traffic are plain HTTP in-cluster by default -- TLS terminates at composed exposure kinds over the exported handles, and cluster-internal mTLS (global.seaweedfs.enableSecurity, requires cert-manager) rides the helm_values overlay only.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: module_default
        reference: Every Service stays ClusterIP with NO service-type seam in this spec -- nothing is internet-reachable until exposure is composed explicitly via first-class kinds over the exported handles.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The modules render no NetworkPolicies and the spec has no seam for them -- restricting which sources may reach the S3 and filer Services is the cluster's NetworkPolicy posture (a KubernetesNetworkPolicy composes naturally).
    - control_id: edge-protection
      status: not_applicable
      notes: The component terminates no edge traffic -- exposure happens through separate kinds and a web application firewall belongs to that layer.
    - control_id: rbac
      status: configurable
      field_path: s3.existing_config_secret
      evidence:
        type: spec_default
        reference: Empty means the chart materializes exactly two identities -- an admin and a read-only credential pair in the <name>-s3-secret Secret; an existing config Secret (the seaweedfs_s3_config JSON identities document) declares every user, credential, and per-bucket action grant yourself.
      notes: Per-bucket anonymous READ opts in explicitly via s3.buckets[].anonymous_read -- writes always require credentials while auth is on.
    - control_id: workload-identity
      status: not_applicable
      notes: SeaweedFS is the STORAGE side of the identity story -- it issues its own S3 credentials to clients and needs no cloud identity of its own; this spec models no cloud-API seam.
    - control_id: no-legacy-auth
      status: enforced_by_default
      evidence:
        type: module_default
        reference: S3 auth is ON by default (s3.enable_auth defaults true) with generated credentials in <name>-s3-secret -- an open endpoint requires an explicit false (dev only, per the spec warning). The admin console is never installed open -- without an existing Secret the modules generate <name>-admin-auth (user "admin", random password).
      notes: s3.enable_auth false is the explicit legacy escape -- flagged in the spec as dev-only.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The packaged admin console admits the generated single admin credential and the S3 gateway admits generated access keys -- administrative and workload access, not end-user sign-in; no user accounts or credential-strength policy exist to govern.
    - control_id: audit-logging
      status: not_applicable
      notes: A provider-style S3 access log is not modeled in this spec -- server activity streams to stdout for the cluster's log collector, and changes to the release are Kubernetes API operations captured by the target cluster's audit policy.
    - control_id: monitoring-integration
      status: configurable
      field_path: service_monitor_enabled
      evidence:
        type: spec_default
        reference: Defaults to false; true renders ServiceMonitors for Prometheus scraping on every enabled tier -- requires the Prometheus Operator CRDs (a KubernetesKubePrometheusStack composes naturally).
    - control_id: backup-recovery
      status: not_applicable
      notes: No backup seam is modeled -- this kind IS the catalog's in-cluster object store; durability inside it comes from the replication placement code (see multi-zone-ha), and off-cluster copies are an operational concern (e.g. weed backup / bucket-to-bucket sync) outside this spec.
    - control_id: backup-retention-policy
      status: configurable
      field_path: s3.buckets
      evidence:
        type: spec_default
        reference: Each bucket carries ttl (SeaweedFS TTL syntax, e.g. "30d" -- objects expire themselves without a cleanup job) and versioning (overwrites preserve prior versions); object_lock adds IRREVERSIBLE WORM retention for compliance workloads.
      notes: The 03-artifact-store preset shows all three policies -- a 30d-TTL CI bucket, a versioned release bucket, and an anonymous-read public bucket.
    - control_id: multi-zone-ha
      status: configurable
      field_path: replication
      evidence:
        type: spec_default
        reference: Empty means no replication ("000") -- losing a volume server loses its objects; the XYZ placement code writes copies across servers/racks/DCs (e.g. "001" survives one volume-server loss, needs >= 2 servers), paired with master.replicas 3 for a Raft quorum.
      notes: The 02-production-ha preset runs 3 masters + 3 volume servers under "001". The filer tier stays at 1 replica until a shared external metadata store is wired via helm_values -- the embedded leveldb is per-pod.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Kubernetes nor Helm offers a deletion-protection flag on a release; protection is operational (namespace RBAC, change review). Two data-safety behaviors are built in -- removing a bucket from s3.buckets never deletes the bucket or its data, and the chart-generated S3 credential Secret is kept on uninstall.
    - control_id: managed-patching
      status: configurable
      field_path: chart_version
      evidence:
        type: spec_default
        reference: Defaults to "4.40.0" (chart versions track SeaweedFS releases; 4.40.0 ships appVersion 4.40) -- version changes are deliberate manifest edits, rolled as atomic Helm upgrades (wait, atomic, cleanup_on_fail).
      notes: The image block overrides registry/repository/tag for air-gapped mirrors without changing the version contract.
