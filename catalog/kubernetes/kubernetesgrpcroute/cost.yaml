# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: kubernetesgrpcroute
spec:
  billing_model: free
  free_tier: The GRPCRoute itself -- a namespaced set of rules matching gRPC requests by hostname, service/method, or header and forwarding them to backend Services -- never bills. It is a Kubernetes API object a Gateway controller reads; nothing meters its existence.
  notes: "No field of this spec buys anything: parent_refs attach the route to a Gateway, hostnames and rules decide which requests it claims, and backend_refs split traffic across Services -- all pure steering. The real spend lives where the traffic lands: the Gateway data plane (its controller pods and any cloud load balancer in front) and the backend workloads the route forwards to, each a separate component with its own cost profile."
