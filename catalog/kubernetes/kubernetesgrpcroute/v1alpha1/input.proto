syntax = "proto3";

package dev.planton.kubernetes.kubernetesgrpcroute.v1alpha1;

import "catalog/kubernetes/kubernetesgrpcroute/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// Input for the KubernetesGrpcRoute IaC stack. The platform resolves all
// StringValueOrRef references (namespace) to literal strings before passing this
// to the IaC engine.
message KubernetesGrpcRouteIacInput {
  // Target infra-component.
  KubernetesGrpcRoute target = 1;
  // Kubernetes provider configuration (cluster credentials).
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
