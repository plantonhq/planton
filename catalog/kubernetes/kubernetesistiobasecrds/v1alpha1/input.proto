syntax = "proto3";

package dev.planton.kubernetes.kubernetesistiobasecrds.v1alpha1;

import "catalog/kubernetes/kubernetesistiobasecrds/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// KubernetesIstioBaseCrdsIacInput provides the inputs for installing the Istio CRDs
// on a Kubernetes cluster.
message KubernetesIstioBaseCrdsIacInput {
  // target infra-component
