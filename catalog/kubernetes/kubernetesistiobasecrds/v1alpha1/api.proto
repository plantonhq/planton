syntax = "proto3";

package dev.planton.kubernetes.kubernetesistiobasecrds.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesistiobasecrds/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesistiobasecrds/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesIstioBaseCrds installs the Istio CRDs (istio/base) on a target Kubernetes
// cluster, without istiod or any controller. It is the lightweight prerequisite for the
// typed Istio API components.
message KubernetesIstioBaseCrds {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesIstioBaseCrds'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesIstioBaseCrdsSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesIstioBaseCrdsStatus status = 5;
}

// KubernetesIstioBaseCrdsStatus represents the status of the Istio CRDs installation.
message KubernetesIstioBaseCrdsStatus {
  // outputs
  KubernetesIstioBaseCrdsOutputs outputs = 1;
}
