syntax = "proto3";

package dev.planton.kubernetes.kubernetesistiobasecrds.v1alpha1;

// KubernetesIstioBaseCrdsOutputs captures observable outputs from the Istio CRDs
// installation.
message KubernetesIstioBaseCrdsOutputs {
  // Istio release the CRDs were installed from (the pinned SDK tag, e.g. "1.30.3").
  string installed_release = 1;

  // Full URL of the istio/base CRD bundle that was applied -- the authoritative record
  // of exactly what landed on the cluster.
  string installed_manifest_url = 2;
}
