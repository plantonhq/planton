syntax = "proto3";

package dev.planton.kubernetes.kubernetesopensearchoperator.v1alpha1;

//kubernetes-open-search-operator outputs
message KubernetesOpenSearchOperatorOutputs {
  //namespace the operator is installed into.
  string namespace = 1;

  //Helm release name of the operator install (= metadata.name).
  string release_name = 2;

  //name of the operator controller-manager Deployment
  //(the chart's fixed component name within the release).
  string deployment_name = 3;
}
