# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetesopensearchoperator
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The operator stores no data of its own -- its state is the custom resources it reconciles, held in the cluster's etcd. Search-cluster data at rest is a property of the volumes the managed clusters provision, owned by KubernetesOpenSearch resources and the cluster's storage classes.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to key (see enc-at-rest); customer-managed keys for cluster volumes are configured on the target cluster's storage classes.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The spec models no TLS seam for the operator itself -- its traffic is the Kubernetes API, TLS by construction. TLS for the managed search clusters is the OPERATOR'S JOB per cluster (managed TLS is a headline feature), declared on KubernetesOpenSearch resources; dns_base matters here indirectly -- a wrong domain produces certificates whose SANs do not match the service names nodes advertise.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The modules render no external exposure -- the chart's only service surface is the in-cluster controller-manager metrics Service, and the spec offers no ingress or LoadBalancer seam.
      notes: pprof_endpoints_enabled (default false) opens Go debug endpoints on the manager -- a debugging aid the spec says never to enable in production.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The operator serves no client-facing traffic to restrict; its only endpoint is the RBAC-shielded metrics port. Network exposure of the managed clusters is declared on KubernetesOpenSearch resources.
    - control_id: edge-protection
      status: not_applicable
      notes: A cluster-internal controller serves no HTTP edge traffic -- web application firewalls do not apply.
    - control_id: rbac
      status: configurable
      field_path: use_role_bindings
      evidence:
        type: spec_default
        reference: False (the chart default) binds the operator's rights with ClusterRoleBindings for the cluster-wide watch; true swaps in namespace-scoped RoleBindings so the install needs NO cluster-wide RBAC -- only valid together with watch_namespace (the spec's CEL rule enforces the pairing).
      notes: The 02-namespace-scoped preset takes the fenced posture so a tenant admin can run the install without cluster-admin sign-off. kube_rbac_proxy_enabled (default true) additionally shields the metrics endpoint behind Kubernetes RBAC.
    - control_id: workload-identity
      status: not_applicable
      notes: The operator calls no cloud APIs -- it authenticates to the Kubernetes API with its ServiceAccount; there is no cloud identity to federate.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The operator exposes no authentication surface of its own -- no credentials, no user-facing endpoint. Search-cluster security bootstrap (admin credentials, security config) is the operator's job per cluster, declared on KubernetesOpenSearch resources.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: The operator's actions are Kubernetes API operations -- creating StatefulSets, Services, Secrets, and ConfigMaps for managed clusters -- captured by the target cluster's audit policy; log_level tunes its diagnostic logging, not an audit trail.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The chart renders the controller-manager metrics Service unconditionally, and the kube-rbac-proxy sidecar (kube_rbac_proxy_enabled, default true) shields the endpoint behind Kubernetes RBAC so only authorized scrapers reach it.
      notes: "The chart's own default kube-rbac-proxy image was deleted upstream and can never be pulled (verified live) -- the modules re-point it at the maintainer's quay.io repository at the chart's pinned tag, so the default posture actually installs."
    - control_id: backup-recovery
      status: not_applicable
      notes: The operator holds no data to back up; its own configuration is this manifest, re-appliable at any time. Snapshot and backup policy for the managed search clusters is declared on KubernetesOpenSearch resources.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist at this layer (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The chart runs the manager as a single-replica controller Deployment and this spec models no replica count. A brief operator outage pauses reconciliation only -- managed search clusters keep serving; Kubernetes reschedules the pod.
    - control_id: deletion-protection
      status: not_applicable
      notes: "Neither Kubernetes nor the chart offers a deletion-protection flag on the release. The blast radius of deletion is bounded BY THE MODULES -- the chart templates its CRDs release-owned with no keep-on-uninstall knob upstream, so the modules own the CRD lifecycle themselves (installCRDs pinned false; CRDs derived from the pinned chart and applied outside the release, kept on destroy by default): uninstalling the operator never cascade-deletes OpenSearchCluster resources and their data unless crds.keep_on_uninstall is explicitly false."
    - control_id: managed-patching
      status: configurable
      field_path: chart_version
      evidence:
        type: spec_default
        reference: Unset installs the pinned default chart (2.8.0 -- the newest STABLE chart/operator pairing; the served 2.8.3+/3.0.x charts default to a PRERELEASE manager image and migrate the CRDs from opensearch.opster.io to opensearch.org). Upgrades are deliberate chart_version changes; the module-owned CRDs are derived from the pinned chart, so a bump moves the schema with the operator, and a version below what the cluster carries is refused.
      notes: The 03-private-mirror preset pins the manager image from a private mirror for air-gapped installs.
