apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: kubernetesopensearchoperator
spec:
  tier: 3
  # Forged on the official opensearch-operator chart 2.8.0 with MODULE-OWNED
  # CRDs derived from the pinned chart at apply time (the chart templates
  # them release-owned with no keep knob — an uninstall would cascade-delete
  # every OpenSearchCluster and its data). The scenarios cover the whole CRD
  # lifecycle: keep and re-adopt on reinstall (minimal), cleanup when keep
  # is off (tuned-full), a chart bump that re-applies the CRDs AND adds one
  # (upgrade, 2.7.0 to 2.8.0 brings OpenSearchSnapshotPolicy), and the two
  # refusals (a version that is not published; a schema downgrade).
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 25
