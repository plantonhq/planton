syntax = "proto3";

package dev.planton.kubernetes.kuberneteskeycloak.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kuberneteskeycloak/v1alpha1/outputs.proto";
import "catalog/kubernetes/kuberneteskeycloak/v1alpha1/spec.proto";
import "shared/metadata.proto";

//keycloak-kubernetes
message KubernetesKeycloak {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesKeycloak'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesKeycloakSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesKeycloakStatus status = 5;
}

//keycloak-kubernetes status.
message KubernetesKeycloakStatus {
  //outputs
  KubernetesKeycloakOutputs outputs = 1;
}
