# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kuberneteskeycloak
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: Every byte of Keycloak state (realms, users, clients, sessions) lives in the REQUIRED external database -- encryption at rest is that database's posture (a KubernetesPostgres rides its cluster's storage class). The dev-file/dev-mem sandbox vendors keep data on ephemeral pod storage, never production.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: The component stores no data of its own (see enc-at-rest); customer-managed keys apply to the database's storage, which this spec has no seam for.
    - control_id: enc-in-transit
      status: configurable
      field_path: http.tls_secret_name
      evidence:
        type: spec_default
        reference: "TLS-or-HTTP is decided up front by a spec validation rule (the server otherwise refuses to start, surfacing only as CrashLoopBackOff): http.tls_secret_name serves HTTPS from a kubernetes.io/tls Secret -- the cert-manager seam and the recommended posture; http.http_enabled opts into plain HTTP, legitimate only behind a TLS-terminating proxy paired with proxy_headers."
      notes: The 01-standard preset serves TLS from a certificate Secret; 02-dev-sandbox runs plain HTTP deliberately. truststore_secret_names extends the server's trust for private-CA databases, LDAP, and identity providers.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The modules ALWAYS render the operator's default Ingress disabled (an absent ingress block would mean enabled -- verified in the operator source), so only in-cluster Services exist (<name>-service and the headless <name>-discovery); external exposure composes from Gateway API kinds referencing the exported service handles.
    - control_id: restricted-ingress
      status: enforced_by_default
      evidence:
        type: spec_default
        reference: network_policy_enabled empty means true -- the operator renders a NetworkPolicy restricting the server pods' network; the modules render the effective value explicitly. Disable it only when the cluster manages policy through first-class KubernetesNetworkPolicy resources.
    - control_id: edge-protection
      status: not_applicable
      notes: A web application firewall rides the composed edge (the Gateway/Ingress kinds fronting the exported service handles), not this component -- the module renders no edge layer.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: module_default
        reference: Keycloak's admin console and API are governed by its own realm role system. The operator seeds ONE bootstrap admin at first start (the create-once <name>-initial-admin Secret, username temp-admin, never rotated -- or a bring-your-own basic-auth Secret via bootstrap_admin_secret_name); real admin users and roles are managed inside Keycloak afterwards.
      notes: Management of the Keycloak CR itself is governed by the target cluster's Kubernetes RBAC.
    - control_id: workload-identity
      status: not_applicable
      notes: Database credentials ride Kubernetes Secret selectors by upstream design (nothing credential-bearing rides the CR) -- there is no cloud API access in this component and no seam for platform-issued cloud identities.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: Keycloak IS the identity provider -- its authentication flows (password policies, MFA, recovery codes, legacy-flow removal) are realm configuration inside the product, not modeled in this deployment spec. The transport-level weak path (plain HTTP) is governed by the TLS-or-HTTP rule (see enc-in-transit).
    - control_id: strong-user-auth
      status: not_applicable
      notes: Keycloak IS the identity provider -- password policies, brute-force lockout, and MFA/WebAuthn enrollment are realm configuration inside the product (see no-legacy-auth), not modeled in this deployment spec.
    - control_id: audit-logging
      status: not_applicable
      notes: Keycloak's admin and login event auditing is realm configuration inside the product; server logs stream to stdout for the cluster's log collector. Changes to the CR are Kubernetes API operations, captured by the target cluster's audit policy.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: spec_default
        reference: service_monitor_enabled empty means true -- the operator creates a ServiceMonitor scraping the management endpoint (health/metrics, port 9000 by default). Without the Prometheus Operator CRDs on the cluster the operator records a warning on the CR and carries on.
    - control_id: backup-recovery
      status: not_applicable
      notes: All state lives in the external database -- backup and recovery ride the database component (KubernetesPostgres models continuous WAL archiving and scheduled base backups). The server pods themselves hold nothing worth backing up.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist on this component to retain (see backup-recovery); retention is the database component's seam.
    - control_id: multi-zone-ha
      status: configurable
      field_path: instances
      evidence:
        type: spec_default
        reference: instances defaults to 1; with a real database vendor, instances scale horizontally (JGroups/Infinispan clusters the caches through the discovery Service). When scheduling is unset the operator injects soft zone/hostname topology-spread constraints on its own.
      notes: The 01-standard preset runs 2 instances against postgres. The dev-file/dev-mem sandbox vendors force a single instance (spec-enforced) -- each pod would hold its own divergent world.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Kubernetes nor the Keycloak Operator offers a deletion-protection flag on the CR; protection is operational (namespace RBAC, change review). Deleting the CR tears down the StatefulSet and Services, but every realm and user survives in the database -- a redeploy against the same database recovers the server.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: spec_default
        reference: "image empty runs the operator's pinned default (quay.io/keycloak/keycloak at the operator release), so server upgrades arrive with operator upgrades; pinning image makes version changes deliberate. KNOW THE ROLLOUT: with the default RecreateOnImageChange update strategy an image change takes a full scale-to-zero recreate -- an outage window by design, because two Keycloak versions cannot share one cache cluster and schema."
