# Consumer-scoped Keycloak Operator fixture for the KubernetesKeycloak
# lanes. NAMESPACED WATCH (the kind's default): the operator watches
# ONLY its own namespace, so every scenario co-locates its Keycloak CR
# in e2e-keycloak beside this fixture. This fixture OWNS the shared
# namespace (create_namespace: true); the PostgreSQL fixture joins it
# (the registry orders the operator first).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKeycloakOperator
metadata:
  name: e2e-kc-operator
spec:
  namespace:
    value: e2e-keycloak
  create_namespace: true
