apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kuberneteskeycloak
spec:
  # One kubectl_manifest — the Keycloak CR, named after metadata.name —
  # plus the optional anchor namespace. Everything the operator creates
  # from the CR (the StatefulSet, the -service/-discovery Services, the
  # NetworkPolicy, the one-time -initial-admin credential Secret) is
  # operator-owned and never imported.
  values:
    - name: api_version
      derivations:
        - literal: k8s.keycloak.org/v2beta1
      where_to_find: >-
        Always "k8s.keycloak.org/v2beta1" — the CR's group/version (the
        operator's storage version at the pinned 26.7 release).
    - name: kind
      derivations:
        - literal: Keycloak
      where_to_find: Always "Keycloak" — the CR kind this module applies.
    - name: name
      derivations:
        - from_metadata_name: true
        - from_output: stateful_set
      where_to_find: >-
        The Keycloak CR's metadata.name (equals the Planton resource
        name; the operator names the StatefulSet identically) —
        `kubectl get keycloaks.k8s.keycloak.org -A` (NAME column).
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The server's namespace — `kubectl get keycloaks.k8s.keycloak.org
        -A` (NAMESPACE column).
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the server's
        namespace itself.
