apiVersion: iac.planton.dev/v1
kind: ComponentImportMap
metadata:
  name: kubernetespodmonitor
spec:
  # One kubectl_manifest applying the PodMonitor. The composed import ID
  # is apiVersion//kind//name//namespace — apiVersion and kind are constants
  # of this module (it renders exactly one GVK), declared as literals.
  values:
    - name: api_version
      derivations:
        - literal: monitoring.coreos.com/v1
      where_to_find: >-
        Always "monitoring.coreos.com/v1" — the module pins the served version.
    - name: kind
      derivations:
        - literal: PodMonitor
      where_to_find: Always "PodMonitor" — the CR kind this module applies.
    - name: name
      derivations:
        - from_metadata_name: true
        - from_stack_output: pod_monitor_name
      where_to_find: >-
        The PodMonitor's metadata.name (equals the Planton resource name) —
        `kubectl get podmonitors -A` (NAME column).
    - name: namespace
      derivations:
        - from_stack_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The namespace the resource lives in — `kubectl get podmonitors -A`
        (NAMESPACE column).
