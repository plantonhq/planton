# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: kubernetesjupyterhub
spec:
  billing_model: cluster_capacity
  cost_drivers:
    - field_path: single_user
      sku_meter: cluster CPU and memory reservations
      impact: The dominant cost. Every user who logs in gets their OWN notebook pod carrying the declared memory/CPU guarantees -- capacity planning multiplies these values by concurrent users, and the hub creates the pods at runtime, not at deploy time.
    - field_path: single_user.storage
      sku_meter: persistent volume storage
      pricing_unit: GB-months
      impact: The default is a dynamically-provisioned 10Gi PVC per user (claim-<username>) that survives server stops AND destruction of this resource -- storage accumulates with the roster until the claim volumes are deleted explicitly.
    - field_path: scheduling.user_placeholder_replicas
      sku_meter: cluster CPU and memory reservations
      impact: Each placeholder pod keeps one default-user slice of capacity warm at standing cost -- a real user evicts one instantly instead of waiting for a node to boot.
    - field_path: culling
      sku_meter: cluster CPU and memory reservations
      impact: The single most important knob for NOT paying for abandoned notebooks -- idle servers stop after timeout_seconds (default one hour), releasing their reservation; disabling culling turns every forgotten notebook into a standing reservation.
    - field_path: hub.active_server_limit
      sku_meter: cluster CPU and memory reservations
      impact: The hard cap on running notebook servers across all users -- the cluster-capacity guard; empty means unlimited.
    - field_path: hub.resources
      sku_meter: cluster CPU and memory reservations
      impact: The hub pod's own reservation (single replica by design; the hub is light -- 512Mi/0.5cpu carries hundreds of users).
    - field_path: proxy.resources
      sku_meter: cluster CPU and memory reservations
      impact: The configurable-http-proxy pod carries EVERY user byte -- its declared reservation is standing cost; size it for busy hubs.
    - field_path: hub.database
      sku_meter: persistent volume storage
      pricing_unit: GB-months
      impact: The default sqlite arm provisions a hub-db PVC (chart default 1Gi); the postgres/mysql arms move hub state to a separate database component with its own footprint.
  estimate_exclusions:
    - the price of reserved CPU, memory, and volume storage is the target cluster's node and storage-class economics, which this catalog cannot know
    - "the dominant reservation is created AT RUNTIME, not at deploy time: one notebook pod (and by default a 10Gi home volume) per active user -- no manifest-time statement can count users, so per-user capacity is deliberately not estimated"
    - user home PVCs (claim-<username>) survive server stops and even destruction of this resource -- accumulated home storage is unbounded by this manifest
    - the catalog presets declare no hub or proxy resource requests and no hub-database volume size, so no capacity derivation ships for this component -- the chart's own defaults (no core requests, a 1Gi hub sqlite PVC) apply undeclared
    - the image-puller DaemonSets run one pod per node -- the node-count multiplication is the cluster's
    - the helm_values overlay merges last and can override any modeled value
  notes: "This component creates no cloud SKU of its own -- its cost is the share of the cluster it reserves, realized on the cluster's bill. The honest manifest-time statement is unusual here: the deploy-time footprint (hub + proxy + placeholders) is small, and the real reservation follows login behavior -- concurrent users x single_user guarantees, bounded by hub.active_server_limit and reclaimed by culling."
