apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesJupyterHub
metadata:
  name: team-notebooks
spec:
  namespace:
    value: notebooks
  create_namespace: true
  # Everything else is the kind's defaults — and the defaults are
  # deliberately SECURED: sign-in requires the module-generated shared
  # password (Secret `team-notebooks-auth`, key `password`), never the
  # chart's own open door (any username, NO password). Hub state lives
  # on a 1Gi sqlite PVC; every user gets a dynamically-provisioned 10Gi
  # home volume mounted at /home/jovyan; idle notebook servers stop
  # after an hour.
  authentication:
    shared_password: {}
    # Grant yourself the admin panel (manage users, access servers).
    admin_users:
      - admin
  single_user:
    # The chart's sample image is evaluation-grade. A docker-stacks
    # image gives users real scientific Python out of the box.
    image:
      repository: quay.io/jupyter/scipy-notebook
      tag: "2026-07-28"
    # A memory LIMIT keeps one runaway notebook from taking the node
    # down; the guarantee (request) is what capacity planning
    # multiplies by concurrent users.
    memory_limit: 2G
