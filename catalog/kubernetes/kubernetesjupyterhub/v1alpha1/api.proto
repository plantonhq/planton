syntax = "proto3";

package dev.planton.kubernetes.kubernetesjupyterhub.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesjupyterhub/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesjupyterhub/v1alpha1/spec.proto";
import "shared/metadata.proto";

//jupyterhub-kubernetes
message KubernetesJupyterHub {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesJupyterHub'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesJupyterHubSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesJupyterHubStatus status = 5;
}

//jupyterhub-kubernetes status.
message KubernetesJupyterHubStatus {
  //outputs
  KubernetesJupyterHubOutputs outputs = 1;
}
