syntax = "proto3";

package dev.planton.kubernetes.kubernetesjupyterhub.v1alpha1;

import "catalog/kubernetes/kubernetes.proto";

/**
 * **KubernetesJupyterHubOutputs** — the composition handles a
 * deployed JupyterHub exports. Users reach the hub through the
 * proxy-public Service (compose exposure kinds over it); the
 * shared-password credential (when that sign-in method is active) is
 * exported as a Secret handle.
 */
message KubernetesJupyterHubOutputs {
  // Namespace JupyterHub runs in.
  string namespace = 1;

  // Name of the proxy-public Service — the instance's front door
  // (all user traffic, login included, enters here). The handle
  // exposure kinds route to. Chart-fixed name: "proxy-public".
  string proxy_public_service = 2;

  // In-cluster endpoint of the front door,
  // `http://proxy-public.<namespace>.svc.cluster.local:80`.
  string endpoint = 3;

  // Name of the hub's own Service ("hub", port 8081) — the hub REST
  // API handle for in-cluster automation (`/hub/api`); user traffic
  // goes through proxy-public instead.
  string hub_service = 4;

  // The shared sign-in password: the Secret and key holding it when
  // the shared-password method is active (module-generated
  // `<name>-auth` unless an existing Secret was declared). Empty for
  // OAuth/OIDC/native sign-in — those identities live with the
  // provider.
  dev.planton.kubernetes.KubernetesSecretKey shared_password_secret = 5;

  // Port-forward command for reaching JupyterHub from a workstation
  // when no exposure is composed
  // (`kubectl port-forward svc/proxy-public -n <namespace> 8080:80`).
  string port_forward_command = 6;
}
