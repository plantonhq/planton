syntax = "proto3";

package dev.planton.kubernetes.kubernetesairflow.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesairflow/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesairflow/v1alpha1/spec.proto";
import "shared/metadata.proto";

//airflow-kubernetes
message KubernetesAirflow {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesAirflow'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesAirflowSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesAirflowStatus status = 5;
}

//airflow-kubernetes status.
message KubernetesAirflowStatus {
  //outputs
  KubernetesAirflowOutputs outputs = 1;
}
