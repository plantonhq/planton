apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAirflow
metadata:
  name: dev-airflow
spec:
  namespace:
    value: airflow
  # Co-located with the composed database below: the module reads the
  # database credential Secret to compose Airflow's connection Secret,
  # and Secrets can only be consumed from the workload's OWN namespace.
  # Deploy the KubernetesPostgres named `airflow-db` into this same
  # namespace, declaring `airflow` as its bootstrap database (owner
  # `airflow`).
  create_namespace: true
  database:
    postgres:
      # The references resolve to the KubernetesPostgres resource's
      # read-write Service (always the current primary) and its
      # operator-maintained application-credential Secret (key
      # `password`) — the reference defaults, no field paths needed.
      host:
        valueFrom:
          name: airflow-db
      password_secret:
        secret_name:
          valueFrom:
            name: airflow-db
  # Everything else is the kind's defaults: the KubernetesExecutor
  # (every task runs as its own ephemeral pod — no broker, no idle
  # workers), the pinned chart, one replica of each component, StatsD
  # metrics on, and module-generated credentials (Fernet key, API/JWT
  # keys, the admin password in `dev-airflow-admin-auth`).
  #
  # DAGs come from the container image in this preset — bake them into
  # a custom image and point `images.airflow_repository` at it, or
  # switch to the git-sync preset for push-to-deploy pipelines.
  components:
    triggerer:
      # The chart's default triggerer volume is 100Gi — size it for a
      # dev cluster.
      persistence_size: 1Gi
