syntax = "proto3";

package dev.planton.kubernetes.kubernetesingressnginx.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesingressnginx/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesingressnginx/v1alpha1/spec.proto";
import "shared/metadata.proto";

//kubernetes-ingress-nginx
message KubernetesIngressNginx {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesIngressNginx'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesIngressNginxSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesIngressNginxStatus status = 5;
}

//kubernetes-ingress-nginx status.
message KubernetesIngressNginxStatus {
  //outputs
  KubernetesIngressNginxOutputs outputs = 1;
}
