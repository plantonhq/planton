# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: kubernetesplantonrunner
spec:
  billing_model: cluster_capacity
  cost_drivers:
    - field_path: resources
      sku_meter: cluster CPU and memory reservations
      impact: The one always-on runner pod holds its CPU and memory reservation around the clock -- the chart pins replicas to 1 with a Recreate strategy, so this is the whole footprint. Unset, the chart's own defaults apply (requests 100m/256Mi, limits 1/1Gi); size limits up for large stacks or high operation concurrency, since IaC operations the runner executes run inside these limits.
  estimate_exclusions:
    - the price of the reserved CPU and memory is the target cluster's node economics, which this catalog cannot know
    - the cluster's own node, control-plane, and logging costs bill on the cluster's components, not here
    - the helm_values overlay merges last and can reshape the pod template -- including resources beyond what the typed field declares
  notes: "This component creates no cloud SKU of its own -- its cost is the cluster capacity one standing runner pod claims, and unlike demand-driven fleets that capacity is fully known at manifest time: exactly one replica by design (a runner's identity is minted for one live instance; scaling execution capacity means more runners, never more copies of this one), so the honest manifest-time statement is the pod's requests held around the clock. The module's satellites -- the optional namespace, the token Secret, and Helm's release Secret -- reserve nothing."
