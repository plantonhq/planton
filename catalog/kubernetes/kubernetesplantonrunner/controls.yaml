# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetesplantonrunner
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The runner's stored state is the token in a Kubernetes Secret (and its minted identity on the pod's ephemeral volume, gone with the pod) -- whether Secrets are encrypted at rest in etcd is the target cluster's encryption posture, owned by the cluster, not this module's choice.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Customer-managed keys for Secret encryption are configured on the cluster's etcd encryption or the cloud provider's KMS integration (see enc-at-rest); this spec has no seam for them.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The runner's channels to the control plane (join, queue polling, the outbound-initiated CloudOps tunnel) are TLS-carried by the platform, and image and chart pulls ride TLS registries. Inside the cluster, the chart's Service exposes only the runner's health port to cluster-internal callers.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The chart renders no Ingress and no externally exposed Service -- the only rendered surface is a cluster-internal Service for the health port. The runner only ever dials OUT to the control plane; nothing outside the cluster can initiate a connection to it.
    - control_id: restricted-ingress
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The only in-cluster surface is the health port on the chart's cluster-internal Service -- no operational or data endpoint is reachable at all.
      notes: Narrowing WHICH in-cluster sources may probe the health port is a NetworkPolicy choice owned by the cluster, outside this spec.
    - control_id: edge-protection
      status: not_applicable
      notes: No inbound request surface exists to filter beyond the cluster-internal health port -- a web application firewall has nothing to sit in front of.
    - control_id: rbac
      status: not_applicable
      notes: The appliance exposes no management or data plane of its own inside the cluster -- work arrives through the Planton control plane, where runner registration and operation dispatch are governed by the platform's own access control; managing the release's rendered objects is governed by the target cluster's Kubernetes RBAC, outside this manifest's choices.
    - control_id: workload-identity
      status: not_applicable
      notes: The pod holds no cloud identity -- neither the spec nor the chart attaches one. The runner's cloud access rides Planton's keyless connections brokered through the control plane, not credentials held by the pod, so there is no workload-identity seam on this component to configure.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No legacy authentication path exists to disable -- the runner introduces itself to the control plane by joining with its runner token (delivered through a module-created Kubernetes Secret, never rendered chart values) and serving on the identity it receives.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: The runner logs every operation it executes to stdout, but whether pod logs are collected and retained is the target cluster's logging stack -- this spec has no seam for it. Changes to the release's objects are Kubernetes API operations captured by the cluster's audit policy.
    - control_id: monitoring-integration
      status: not_applicable
      notes: This spec models no metrics seam -- the runner's pod-level CPU and memory are visible to whatever metrics stack the target cluster runs, and its health endpoints answer cluster-internal probes, but exporting to a monitoring system is the cluster's choice, not this manifest's.
    - control_id: backup-recovery
      status: not_applicable
      notes: The appliance is stateless by design -- the runner token is re-mintable material, the minted identity on the pod's ephemeral volume is recovered by re-joining with the token (pod recreation does exactly that), and everything else is declarative and re-creatable from the manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The chart pins replicas to 1 with a Recreate strategy by design -- a runner's identity is minted for one live instance, and two live pods under one runner name would revoke each other's keys. A node or zone event means the pod reschedules wherever the cluster can place it and re-joins with its token, never a failover to a live replica.
    - control_id: deletion-protection
      status: not_applicable
      notes: No deletion-protection flag exists on the spec or the rendered objects -- deliberate, because orderly teardown is part of the appliance's contract (the runner is destroyed last, after the workloads it deploys), and the token makes it re-mintable standing infrastructure.
    - control_id: managed-patching
      status: configurable
      field_path: runner_version
      evidence:
        type: spec_default
        reference: Defaults to "latest" -- new pods pull the newest runner release on every recreation, so the appliance tracks the patched build by default; pinning a version tag takes the patch cadence into your own hands for change control.
      notes: chart_version defaults to the version this catalog release was validated against (versions below 0.4.0 predate token enrollment and are refused by the modules); the nodes beneath the pod are patched by the cluster's own lifecycle, outside this spec.
