syntax = "proto3";

package dev.planton.kubernetes;

import "buf/validate/validate.proto";
import "catalog/kubernetes/workload_container.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// =============================================================================
// SHARED WORKLOAD POD DEFINITIONS
// =============================================================================
//
// The pod-level half of the shared workload core: everything that applies to
// the pod as a whole rather than to one container. Every workload kind
// (Deployment, StatefulSet, DaemonSet, Job, CronJob) embeds WorkloadPod, so a
// user who learns to schedule, harden, or wire identity on one kind has
// learned it for all five — and future workload-shaped kinds inherit the same
// grain.
//
// Identity is composed, never bundled: `service_account` REFERENCES a
// KubernetesServiceAccount (a first-class kind that owns workload-identity
// annotations and pull-secret attachment), and permissions come from
// KubernetesRbac grants targeting that identity. Workload kinds do not create
// ServiceAccounts or RBAC objects of their own.
//
// Curation note (what is deliberately NOT modeled from core/v1 PodSpec):
// - nodeName / schedulingGates / readinessGates — controller- and operator-facing
//   machinery, not declarative app configuration
// - ephemeralContainers — kubectl-debug sessions, inherently imperative
// - hostUsers / os / overhead / resourceClaims / preemptionPolicy /
//   enableServiceLinks / setHostnameAsFQDN / shareProcessNamespace — niche
//   toggles without established production demand; add when a real use case
//   arrives rather than pre-paying their cognitive cost
// - hostname / subdomain — pod identity is controller-owned on every kind here
//   (StatefulSet derives them; others don't need them)
// =============================================================================

/**
 * **WorkloadPod** is the shared pod-level configuration of a workload: which
 * identity pods run as, where they may schedule, how they are hardened, and how
 * they terminate.
 *
 * Example (YAML — a hardened, spread-out workload):
 * ```yaml
 * serviceAccount:
 *   valueFrom:
 *     kind: KubernetesServiceAccount
 *     name: checkout-identity
 *     fieldPath: status.outputs.service_account_name
 * scheduling:
 *   nodeSelector:
 *     workload-tier: general
 *   topologySpreadConstraints:
 *     - maxSkew: 1
 *       topologyKey: topology.kubernetes.io/zone
 *       whenUnsatisfiable: ScheduleAnyway
 * securityContext:
 *   runAsNonRoot: true
 *   fsGroup: 2000
 * terminationGracePeriodSeconds: 60
 * ```
 */
message WorkloadPod {
  /**
   * The ServiceAccount pods run as. Accepts a literal ServiceAccount name or a
   * reference to a KubernetesServiceAccount resource, so an infra chart deploys the
   * identity (with its workload-identity binding and pull secrets) and the workload
   * in one run. When omitted, pods run as the namespace's `default` ServiceAccount.
   * Permissions attach to this identity through KubernetesRbac grants; cloud access
   * federates through the identity's own workload_identity configuration.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef service_account = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesServiceAccount,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.service_account_name"
  ];

  /**
   * Whether pods receive a projected kube-apiserver token mount. Tri-state like the
   * Kubernetes API: unset defers to the ServiceAccount/cluster default, false hardens
   * pods that never call the Kubernetes API (a security-baseline recommendation for
   * ordinary app workloads), true forces the mount.
   */
  optional bool automount_service_account_token = 2;

  /**
   * Docker-registry Secrets, declared BESIDE this workload, that the kubelet pulls
   * its images with. Each entry is a literal Secret name or a reference: by default a
   * KubernetesSecret (its `docker_config_json` arm) resolved at `spec.name`; a
   * KubernetesExternalSecret fed from a cloud secrets manager is named with an
   * explicit `kind` and `fieldPath: status.outputs.secret_name` (the name the
   * operator materializes).
   *
   * Three ways a private image gets pulled, and when to use each:
   * - Nothing declared — the cluster's own identity reaches the registry (EKS nodes
   *   to ECR, GKE nodes to Artifact Registry, AKS kubelet identity to ACR, DOKS
   *   registry integration). No Secret, no field.
   * - `image_registries` — the login belongs to this workload alone; the module owns
   *   the Secret.
   * - `image_pull_secrets` — the login is a resource beside the workload: share one
   *   Secret across workloads, or attach it once on the KubernetesServiceAccount the
   *   pods run as (then no entry is needed here).
   */
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef image_pull_secrets = 3 [
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesSecret,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "spec.name",
    (dev.planton.shared.options.sensitive_exempt_reason) = "Names of Kubernetes Secret objects to attach, never the secret material itself"
  ];

  /**
   * Image registries this workload pulls from that need a login, with the login,
   * declared on the workload itself. List a registry here ONLY when it needs one: a
   * registry the cluster's own identity reaches (EKS nodes to ECR, GKE nodes to
   * Artifact Registry, AKS kubelet identity to ACR, DOKS registry integration) is not
   * listed at all.
   *
   * The module materializes the logins into ONE docker-registry Secret named
   * `<workload>-image-pull` in the workload's namespace — the twin of the
   * `<workload>-env-secrets` Secret it builds from the containers' `env.secrets` —
   * and attaches it to the pod beside `image_pull_secrets`. The Secret is created,
   * rolled, and destroyed with the workload and follows it into preview
   * environments. Use this when the login belongs to this workload alone; when
   * several workloads share a registry, declare the credential once (a
   * KubernetesSecret or a KubernetesExternalSecret) and name it in
   * `image_pull_secrets` or on the shared KubernetesServiceAccount.
   *
   * Example (YAML):
   * ```yaml
   * imageRegistries:
   *   - server: ghcr.io
   *     username: acme-pull-bot
   *     password: $secret/ghcr-pull-token
   * ```
   */
  repeated WorkloadImageRegistry image_registries = 17 [(buf.validate.field).cel = {
    id: "pod.image_registries.server.unique"
    message: "Two imageRegistries entries name the same registry server — a workload holds one login per registry; merge them into one entry"
    expression: "this.map(r, r.server).unique()"
  }];

  /**
   * Init containers, run to completion in order before app containers start.
   * Standard uses: schema migrations, config templating, waiting on dependencies.
   * A failing init container blocks the pod per its restart policy.
   */
  repeated WorkloadContainer init_containers = 4;

  /**
   * Extra labels stamped on the POD TEMPLATE (and therefore every pod), merged with
   * the workload's own selector and governance labels. This is where cross-cutting
   * markers pods must carry go — e.g. `azure.workload.identity/use: "true"` for AKS
   * workload identity, or mesh sidecar-injection toggles. Keys here must not collide
   * with the selector labels the module derives.
   */
  map<string, string> labels = 5;

  /**
   * Extra annotations stamped on the pod template — e.g. prometheus.io scrape hints
   * or mesh proxy tuning. Changing pod-template annotations rolls pods, which is
   * also the idiomatic config-reload lever.
   */
  map<string, string> annotations = 6;

  /**
   * Where pods may schedule: node selection, taint tolerations, affinity rules, and
   * zone/host spreading. Omit to let the scheduler place pods anywhere.
   */
  WorkloadScheduling scheduling = 7;

  /**
   * Pod-level security context: the user/group identity and filesystem ownership
   * every container inherits unless it overrides them in its own security context.
   */
  WorkloadPodSecurityContext security_context = 8;

  /**
   * Seconds the kubelet waits between SIGTERM and SIGKILL at pod termination.
   * Kubernetes defaults to 30 when unset. Size it to cover pre_stop hooks plus the
   * app's own drain time — the grace clock starts before the hook runs.
   */
  optional int64 termination_grace_period_seconds = 9 [(buf.validate.field).int64.gte = 0];

  /**
   * Pod DNS resolution policy. "ClusterFirst" (the Kubernetes default) resolves
   * cluster services first; "Default" inherits the node's resolver;
   * "ClusterFirstWithHostNet" is what host-network pods need to keep resolving
   * cluster services; "None" hands control entirely to `dns_config`.
   */
  string dns_policy = 10 [(buf.validate.field).cel = {
    id: "pod.dns_policy"
    message: "DNS policy must be one of \"ClusterFirst\", \"ClusterFirstWithHostNet\", \"Default\", or \"None\""
    expression: "this == '' || this in ['ClusterFirst', 'ClusterFirstWithHostNet', 'Default', 'None']"
  }];

  /**
   * Custom DNS parameters merged into (or, with dns_policy "None", replacing) the
   * generated resolv.conf.
   */
  WorkloadPodDnsConfig dns_config = 11;

  /**
   * Static host-file entries injected into every container's /etc/hosts — the
   * escape hatch for names that no reachable DNS serves.
   */
  repeated WorkloadHostAlias host_aliases = 12;

  /**
   * Run pods in the node's network namespace. A DaemonSet agent pattern (node
   * monitoring, CNI components). Host-network pods share the node's port space —
   * combine with `dns_policy: ClusterFirstWithHostNet` if they resolve cluster
   * services.
   */
  bool host_network = 13;

  /**
   * Share the node's PID namespace (process-visibility agents). Requires elevated
   * trust in the workload.
   */
  bool host_pid = 14;

  /**
   * PriorityClass name controlling scheduling and eviction precedence. References a
   * cluster-scoped PriorityClass (e.g. "system-cluster-critical" or one created by a
   * KubernetesPriorityClass resource).
   */
  string priority_class_name = 15;

  /**
   * RuntimeClass selecting an alternate container runtime configuration (e.g. gVisor
   * or Kata sandboxing) installed by the cluster administrator.
   */
  string runtime_class_name = 16;
}

/**
 * **WorkloadImageRegistry** is one image registry a workload pulls from and how it
 * logs in. Every entry lands in the same `<workload>-image-pull` Secret as one
 * docker-config `auths` record, keyed by `server` — which is why a server may appear
 * only once per workload. The kubelet matches an image reference to a login by that
 * server, so a pod may pull from several private registries with several entries.
 */
message WorkloadImageRegistry {
  /**
   * Registry host as it appears in the image reference — "ghcr.io", "quay.io",
   * "123456789012.dkr.ecr.us-east-1.amazonaws.com". Docker Hub's login is keyed by
   * "https://index.docker.io/v1/", the one exception to the bare-host rule.
   */
  string server = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // Registry username — for GitHub Container Registry, the GitHub login of the token's owner.
  string username = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  /**
   * Password or access token for `username`. Never plaintext in a manifest: only a
   * `$secret/<slug>` reference to an organization secret is accepted, and the
   * runner resolves it inside your infrastructure at deploy time before the module
   * writes the Secret. Prefer a scoped read-only token (GHCR `read:packages`) over an
   * account password.
   */
  string password = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (dev.planton.shared.options.sensitive) = true
  ];

  // Optional email some registries record on the login; most ignore it.
  string email = 4;
}

/**
 * **WorkloadScheduling** groups every control over WHERE pods run. The four
 * mechanisms compose: nodeSelector/affinity choose candidate nodes, tolerations
 * unlock tainted ones, and topology spread constraints distribute replicas across
 * the chosen set.
 */
message WorkloadScheduling {
  /**
   * Simple hard node filter: every listed label must match the node. The right tool
   * for "run on the GPU pool" — reach for node_affinity only when you need operators
   * (In/NotIn/Exists) or soft preferences.
   */
  map<string, string> node_selector = 1;

  /**
   * Taint tolerations. A toleration does not attract pods to tainted nodes — it only
   * permits scheduling there; pair with node_selector or affinity to target them.
   */
  repeated WorkloadToleration tolerations = 2;

  /**
   * Expressive node selection: hard requirements and weighted soft preferences over
   * node labels.
   */
  WorkloadNodeAffinity node_affinity = 3;

  /**
   * Attract pods toward nodes/zones already running matching pods (co-location with
   * a cache, for example).
   */
  WorkloadPodAffinity pod_affinity = 4;

  /**
   * Repel pods from nodes/zones already running matching pods — the classic
   * high-availability pattern is anti-affinity on the workload's own labels across
   * `kubernetes.io/hostname`.
   */
  WorkloadPodAffinity pod_anti_affinity = 5;

  /**
   * Even distribution of replicas across topology domains (zones, hosts). Preferred
   * over hostname anti-affinity for large replica counts because skew is bounded
   * rather than binary.
   */
  repeated WorkloadTopologySpreadConstraint topology_spread_constraints = 6;

  /**
   * Hand pods to a non-default scheduler installed in the cluster. Leave empty for
   * the standard scheduler.
   */
  string scheduler_name = 7;
}

/**
 * **WorkloadToleration** permits scheduling onto nodes carrying a matching taint.
 */
message WorkloadToleration {
  /**
   * Taint key to tolerate. Empty key with operator "Exists" tolerates every taint.
   */
  string key = 1;

  /**
   * How key/value match: "Equal" (default — value must match too) or "Exists"
   * (key presence alone matches).
   */
  string operator = 2 [(buf.validate.field).cel = {
    id: "toleration.operator"
    message: "Toleration operator must be either \"Equal\" or \"Exists\""
    expression: "this == '' || this in ['Equal', 'Exists']"
  }];

  // Taint value to match when operator is "Equal".
  string value = 3;

  /**
   * Which taint effect is tolerated: "NoSchedule", "PreferNoSchedule", or
   * "NoExecute". Empty tolerates all effects for the key.
   */
  string effect = 4 [(buf.validate.field).cel = {
    id: "toleration.effect"
    message: "Toleration effect must be one of \"NoSchedule\", \"PreferNoSchedule\", or \"NoExecute\""
    expression: "this == '' || this in ['NoSchedule', 'PreferNoSchedule', 'NoExecute']"
  }];

  /**
   * For "NoExecute" taints only: how many seconds already-running pods stay bound
   * after the taint appears. Unset means tolerate forever.
   */
  optional int64 toleration_seconds = 5;
}

/**
 * **WorkloadNodeAffinity** selects nodes by label expressions: hard requirements
 * (`required` — pod stays Pending until satisfiable) and soft preferences
 * (`preferred` — scheduler maximizes total weight).
 */
message WorkloadNodeAffinity {
  /**
   * Hard requirement. The outer list ORs its terms; expressions within one term AND.
   */
  repeated WorkloadNodeSelectorTerm required = 1;

  // Weighted soft preferences.
  repeated WorkloadPreferredNodeSelectorTerm preferred = 2;
}

/**
 * **WorkloadNodeSelectorTerm** is one AND-group of node label expressions.
 */
message WorkloadNodeSelectorTerm {
  repeated WorkloadNodeSelectorRequirement match_expressions = 1 [(buf.validate.field).repeated.min_items = 1];
}

/**
 * **WorkloadPreferredNodeSelectorTerm** weights a node selector term for soft
 * preference scheduling.
 */
message WorkloadPreferredNodeSelectorTerm {
  // Preference weight, 1–100. Higher weights dominate placement scoring.
  int32 weight = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];

  WorkloadNodeSelectorTerm term = 2 [(buf.validate.field).required = true];
}

/**
 * **WorkloadNodeSelectorRequirement** is a single expression over a node label.
 */
message WorkloadNodeSelectorRequirement {
  // Node label key, e.g. "topology.kubernetes.io/zone".
  string key = 1 [(buf.validate.field).required = true];

  /**
   * Operator: "In"/"NotIn" (value set), "Exists"/"DoesNotExist" (key presence), or
   * "Gt"/"Lt" (single integer value, as strings — the Kubernetes API convention).
   */
  string operator = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "node_selector.operator"
      message: "Operator must be one of \"In\", \"NotIn\", \"Exists\", \"DoesNotExist\", \"Gt\", or \"Lt\""
      expression: "this in ['In', 'NotIn', 'Exists', 'DoesNotExist', 'Gt', 'Lt']"
    }
  ];

  /**
   * Values for the operator: required non-empty for In/NotIn, exactly one integer
   * string for Gt/Lt, and must be empty for Exists/DoesNotExist.
   */
  repeated string values = 3;

  option (buf.validate.message).cel = {
    id: "node_selector.values.consistency"
    message: "In/NotIn require at least one value, Gt/Lt exactly one, Exists/DoesNotExist none"
    expression: "(this.operator in ['In', 'NotIn'] && size(this.values) > 0) || (this.operator in ['Gt', 'Lt'] && size(this.values) == 1) || (this.operator in ['Exists', 'DoesNotExist'] && size(this.values) == 0)"
  };
}

/**
 * **WorkloadPodAffinity** co-locates (affinity) or separates (anti-affinity) pods
 * relative to other pods, matched by label, within a topology domain.
 */
message WorkloadPodAffinity {
  // Hard rules — unschedulable until satisfied. Use sparingly; they can deadlock rollouts.
  repeated WorkloadPodAffinityTerm required = 1;

  // Weighted soft rules — the scheduler's tiebreakers.
  repeated WorkloadWeightedPodAffinityTerm preferred = 2;
}

/**
 * **WorkloadPodAffinityTerm** matches target pods by label within a topology domain.
 */
message WorkloadPodAffinityTerm {
  /**
   * Labels of the pods to match against — for self-anti-affinity, the workload's own
   * selector labels (exported as the `selector_labels` output).
   */
  map<string, string> match_labels = 1 [(buf.validate.field).map.min_pairs = 1];

  /**
   * Node label defining the domain: "kubernetes.io/hostname" separates by node,
   * "topology.kubernetes.io/zone" by zone.
   */
  string topology_key = 2 [(buf.validate.field).required = true];

  /**
   * Namespaces whose pods are considered. Empty means the workload's own namespace.
   */
  repeated string namespaces = 3;
}

/**
 * **WorkloadWeightedPodAffinityTerm** weights a pod affinity term for soft scheduling.
 */
message WorkloadWeightedPodAffinityTerm {
  // Preference weight, 1–100.
  int32 weight = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];

  WorkloadPodAffinityTerm term = 2 [(buf.validate.field).required = true];
}

/**
 * **WorkloadTopologySpreadConstraint** bounds how unevenly replicas may distribute
 * across a topology domain.
 */
message WorkloadTopologySpreadConstraint {
  /**
   * Maximum allowed difference in matching-pod counts between any two domains.
   * 1 is the strictest even spread.
   */
  int32 max_skew = 1 [(buf.validate.field).int32.gte = 1];

  /**
   * Node label defining the domains to spread across (e.g.
   * "topology.kubernetes.io/zone").
   */
  string topology_key = 2 [(buf.validate.field).required = true];

  /**
   * What happens when the constraint cannot be met: "DoNotSchedule" (hard — pod
   * stays Pending) or "ScheduleAnyway" (soft — scheduler minimizes skew).
   */
  string when_unsatisfiable = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "topology_spread.when_unsatisfiable"
      message: "whenUnsatisfiable must be either \"DoNotSchedule\" or \"ScheduleAnyway\""
      expression: "this in ['DoNotSchedule', 'ScheduleAnyway']"
    }
  ];

  /**
   * Labels selecting the pods counted per domain. Omit to have the module default to
   * the workload's own selector labels — self-spreading, the overwhelmingly common
   * intent.
   */
  map<string, string> match_labels = 4;
}

/**
 * **WorkloadPodSecurityContext** is the pod-level security baseline every container
 * inherits (containers override per-field via their own security context). Holds the
 * pod-scoped knobs that have no container-level equivalent: fsGroup, supplemental
 * groups, and sysctls.
 */
message WorkloadPodSecurityContext {
  // UID all container processes run as unless overridden per container.
  optional int64 run_as_user = 1;

  // Primary GID all container processes run as unless overridden per container.
  optional int64 run_as_group = 2;

  // Refuse to start any container whose effective user is root.
  optional bool run_as_non_root = 3;

  /**
   * GID that owns mounted volumes and is added to every container's supplemental
   * groups — the standard fix for "permission denied" on persistent volumes written
   * by non-root apps.
   */
  optional int64 fs_group = 4;

  /**
   * When volume ownership is re-chowned to fs_group: "Always" (default) or
   * "OnRootMismatch" (skip the recursive chown when the root already matches —
   * dramatically faster pod starts on large volumes).
   */
  string fs_group_change_policy = 5 [(buf.validate.field).cel = {
    id: "pod_security.fs_group_change_policy"
    message: "fsGroupChangePolicy must be either \"Always\" or \"OnRootMismatch\""
    expression: "this == '' || this in ['Always', 'OnRootMismatch']"
  }];

  // Additional group IDs applied to all container processes.
  repeated int64 supplemental_groups = 6;

  /**
   * Kernel parameters set for the pod. Only safe sysctls (or those the cluster
   * administrator has allow-listed on the kubelet) are admitted.
   */
  repeated WorkloadSysctl sysctls = 7;

  // Pod-wide seccomp profile; containers may override with their own.
  WorkloadSeccompProfile seccomp_profile = 8;
}

/**
 * **WorkloadSysctl** is one kernel parameter to set in the pod's namespaces.
 */
message WorkloadSysctl {
  // Sysctl name, e.g. "net.core.somaxconn".
  string name = 1 [(buf.validate.field).required = true];

  // Sysctl value, e.g. "1024".
  string value = 2 [(buf.validate.field).required = true];
}

/**
 * **WorkloadPodDnsConfig** injects custom DNS resolution parameters into the pod.
 */
message WorkloadPodDnsConfig {
  // Nameserver IPs (max 3 total after merging with the policy's servers).
  repeated string nameservers = 1 [(buf.validate.field).repeated.max_items = 3];

  // Search domains for hostname lookup.
  repeated string searches = 2;

  // resolv.conf options, e.g. name "ndots" value "2". Value may be empty for flags.
  repeated WorkloadPodDnsConfigOption options = 3;
}

/**
 * **WorkloadPodDnsConfigOption** is one resolv.conf option.
 */
message WorkloadPodDnsConfigOption {
  string name = 1 [(buf.validate.field).required = true];
  string value = 2;
}

/**
 * **WorkloadHostAlias** adds one /etc/hosts entry to every container in the pod.
 */
message WorkloadHostAlias {
  // The IP the hostnames resolve to.
  string ip = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.ip = true
  ];

  // Hostnames mapped to the IP.
  repeated string hostnames = 2 [(buf.validate.field).repeated.min_items = 1];
}
