apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesdestinationrule
spec:
  # One kubectl_manifest applying the Istio DestinationRule CR. The composed import ID
  # is apiVersion//kind//name//namespace — apiVersion and kind are constants
  # of this module (it renders exactly one GVK), declared as literals.
  values:
    - name: api_version
      derivations:
        - literal: networking.istio.io/v1
      where_to_find: >-
        Always "networking.istio.io/v1" — the module pins the served version.
    - name: kind
      derivations:
        - literal: DestinationRule
      where_to_find: Always "DestinationRule" — the CR kind this module applies.
    - name: name
      derivations:
        - from_metadata_name: true
        - from_output: destination_rule_name
      where_to_find: >-
        The DestinationRule's metadata.name (equals the Planton resource name) —
        `kubectl get destinationrules -A` (NAME column).
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The namespace the resource lives in — `kubectl get destinationrules -A`
        (NAMESPACE column).
