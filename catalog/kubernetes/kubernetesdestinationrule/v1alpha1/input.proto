syntax = "proto3";

package dev.planton.kubernetes.kubernetesdestinationrule.v1alpha1;

import "catalog/kubernetes/kubernetesdestinationrule/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// KubernetesDestinationRuleIacInput provides the inputs for creating the DestinationRule on
// a Kubernetes cluster.
message KubernetesDestinationRuleIacInput {
  // the catalog object to deploy
  KubernetesDestinationRule target = 1;
  // provider-config
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
