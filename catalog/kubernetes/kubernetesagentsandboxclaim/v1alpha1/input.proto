syntax = "proto3";

package dev.planton.kubernetes.kubernetesagentsandboxclaim.v1alpha1;

import "catalog/kubernetes/kubernetesagentsandboxclaim/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// KubernetesAgentSandboxClaimIacInput provides the inputs for creating the
// SandboxClaim on a Kubernetes cluster.
message KubernetesAgentSandboxClaimIacInput {
  // the catalog object to deploy
  KubernetesAgentSandboxClaim target = 1;
  // provider-config
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
