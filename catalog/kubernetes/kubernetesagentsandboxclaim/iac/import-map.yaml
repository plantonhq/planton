apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesagentsandboxclaim
spec:
  # One kubectl_manifest applying the SandboxClaim. The composed import ID
  # is apiVersion//kind//name//namespace — apiVersion and kind are constants
  # of this module (it renders exactly one GVK), declared as literals.
  values:
    - name: api_version
      derivations:
        - literal: extensions.agents.x-k8s.io/v1beta1
      where_to_find: >-
        Always "extensions.agents.x-k8s.io/v1beta1" — the module pins the served version.
    - name: kind
      derivations:
        - literal: SandboxClaim
      where_to_find: Always "SandboxClaim" — the CR kind this module applies.
    - name: name
      derivations:
        - from_metadata_name: true
        - from_output: sandbox_claim_name
      where_to_find: >-
        The SandboxClaim's metadata.name (equals the Planton resource name) —
        `kubectl get sandboxclaims -A` (NAME column).
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The namespace the resource lives in — `kubectl get sandboxclaims -A`
        (NAMESPACE column).
