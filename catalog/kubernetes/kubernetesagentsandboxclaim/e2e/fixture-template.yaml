# The template behind the claim lanes' default pool: one container that
# becomes ready quickly, the claim policies left at Disallowed, so a claim
# that sets nothing binds warm and a claim that injects variables is refused.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAgentSandboxTemplate
metadata:
  name: e2e-asbx-cl-tpl
spec:
  namespace:
    value: default
  podTemplate:
    spec:
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8888", "--udp-port=-1"]
          readinessProbe:
            httpGet:
              path: /hostname
              port: "8888"
