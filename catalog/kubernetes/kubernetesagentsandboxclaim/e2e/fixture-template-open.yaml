# The template behind the full-surface claim's pool: claims may add
# environment variables and replace the workspace volume template, so the
# full-surface claim's env and volume claim templates are honored (with a
# cold start, which the verifier asserts).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAgentSandboxTemplate
metadata:
  name: e2e-asbx-cl-tpl-open
spec:
  namespace:
    value: default
  podTemplate:
    spec:
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8888", "--udp-port=-1"]
          readinessProbe:
            httpGet:
              path: /hostname
              port: "8888"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
  envVarsInjectionPolicy: Allowed
  volumeClaimTemplatesPolicy: Overrides
