apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: kuberneteskuberayoperator
spec:
  tier: 4
  # Forged on the official kuberay-operator chart 1.6.2 (= operator
  # v1.6.2). No admission webhook, no cert-manager dependency; the three
  # ray.io CRDs ride the chart's crds/ directory (install-once, KEPT on
  # uninstall — destroy-asserted). The dedicated verifier proves the
  # operator rollout, the CRDs established, and THE INVARIANT: installing
  # the operator alone deploys NO Ray cluster (the KubernetesRayCluster
  # kind owns every cluster — its lanes carry the product proofs).
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
