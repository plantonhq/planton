syntax = "proto3";

package dev.planton.kubernetes.kuberneteskuberayoperator.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kuberneteskuberayoperator/v1alpha1/outputs.proto";
import "catalog/kubernetes/kuberneteskuberayoperator/v1alpha1/spec.proto";
import "shared/metadata.proto";

//kuberay-operator-kubernetes
message KubernetesKubeRayOperator {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesKubeRayOperator'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesKubeRayOperatorSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesKubeRayOperatorStatus status = 5;
}

//kuberay-operator-kubernetes status.
message KubernetesKubeRayOperatorStatus {
  //outputs
  KubernetesKubeRayOperatorOutputs outputs = 1;
}
