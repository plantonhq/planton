syntax = "proto3";

package dev.planton.kubernetes.kuberneteskuberayoperator.v1alpha1;

//kuberay-operator-kubernetes outputs
message KubernetesKubeRayOperatorOutputs {
  //namespace the operator runs in.
  string namespace = 1;

  //Helm release name (= metadata.name). The modules pin the chart's
  //fullname to it, so child names derive from it.
  string release_name = 2;

  //namespaces the operator watches for Ray CRs. Empty means
  //cluster-wide — RayCluster declarations reconcile anywhere.
  repeated string watched_namespaces = 3;
}
