apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kuberneteskuberayoperator
spec:
  # One Helm release named after metadata.name plus the optional anchor
  # namespace. Everything the chart creates inside the release (the
  # operator Deployment, its Service, the re-pinned ServiceAccount and
  # RBAC) travels with the release import. The ray.io CRDs ride the
  # chart's crds/ directory (Helm-owned, install-once) and are never
  # separate state addresses.
  values:
    - name: release_name
      derivations:
        - from_output: release_name
        - from_metadata_name: true
      where_to_find: >-
        `helm list -n <namespace>` (NAME column) — the release shares the
        resource's name.
    - name: release_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `helm list -A` (NAMESPACE column); conventionally "ray-system".
    # ── the optional anchor namespace ────────────────────────────────────
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the installation
        namespace itself.
