# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kuberneteskuberayoperator
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The operator stores no data of its own -- its state is the custom resources it reconciles, held in the cluster's etcd. Ray cluster data at rest is a property of whatever volumes and object stores the Ray workloads use, owned by KubernetesRayCluster resources.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to key (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: The chart ships NO admission webhook and no TLS surface of its own -- the operator validates in its reconcile loop (a bad RayCluster surfaces on the CR's status conditions, not as an admission rejection), and its only traffic is the Kubernetes API, TLS by construction. TLS inside Ray clusters is declared on KubernetesRayCluster resources.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The modules render no external exposure -- the chart's only service surface is the in-cluster metrics endpoint (port 8080, while metrics_enabled, the default), and the spec offers no ingress or LoadBalancer seam.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The operator serves no client-facing traffic to restrict. Network exposure of Ray dashboards and serve endpoints is declared on KubernetesRayCluster resources.
    - control_id: edge-protection
      status: not_applicable
      notes: A cluster-internal controller serves no HTTP edge traffic -- web application firewalls do not apply.
    - control_id: rbac
      status: configurable
      field_path: watch_namespaces
      evidence:
        type: spec_default
        reference: Empty (the default) watches every namespace -- the normal one-operator-per-cluster posture. Naming namespaces fences the watch (Ray declarations outside the list are ignored without an error), and the chart scopes the per-namespace reconcile RBAC to the same list -- the fenced multi-tenant posture.
      notes: leader_election_enabled (default true) needs lease permissions -- disable only in constrained RBAC environments that cannot grant them. Access to the operator's own resources is governed by the target cluster's Kubernetes RBAC.
    - control_id: workload-identity
      status: not_applicable
      notes: The operator calls no cloud APIs -- it authenticates to the Kubernetes API with its ServiceAccount; there is no cloud identity to federate. Cloud credentials for Ray workloads (object stores, GPUs aside) are declared on KubernetesRayCluster resources.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The operator exposes no authentication surface of its own -- no credentials, no user-facing endpoint. Ray dashboard and client authentication are concerns of the Ray clusters, declared on KubernetesRayCluster resources.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: The operator's actions are Kubernetes API operations -- creating head and worker pods, Services, and autoscaling updates for managed Ray clusters -- captured by the target cluster's audit policy; the spec models no separate audit-log seam.
    - control_id: monitoring-integration
      status: configurable
      field_path: service_monitor_enabled
      evidence:
        type: spec_default
        reference: False by default; true renders a ServiceMonitor for Prometheus discovery of the operator's metrics. It requires the monitoring.coreos.com CRDs on the cluster (deploy KubernetesKubePrometheusStack first) -- the install FAILS without them.
      notes: The metrics endpoint itself is on by default (metrics_enabled, port 8080) -- service_monitor_enabled only wires the discovery. The 02-private-mirror preset enables it.
    - control_id: backup-recovery
      status: not_applicable
      notes: The operator holds no data to back up; its own configuration is this manifest, re-appliable at any time. Ray workload state and checkpoints belong to the Ray clusters and the storage they declare.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist at this layer (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The chart runs the operator as a single-replica Deployment and this spec models no replica count (leader election, on by default, is what makes helm_values-added standbys safe). A brief operator outage pauses reconciliation only -- running Ray clusters keep serving; Kubernetes reschedules the pod.
    - control_id: deletion-protection
      status: not_applicable
      notes: "Neither Kubernetes nor the chart offers a deletion-protection flag on the release. The blast radius of deletion is deliberately bounded: the three ray.io CRDs ship in the chart's Helm-native crds/ directory, which Helm never deletes on uninstall -- removing the operator never cascade-deletes RayCluster, RayJob, or RayService declarations."
    - control_id: managed-patching
      status: configurable
      field_path: chart_version
      evidence:
        type: spec_default
        reference: Unset installs the pinned default chart (1.6.2 -- chart 1.6.2 pairs with operator v1.6.2); upgrades are deliberate chart_version changes. KNOW THE CRD LAG -- chart upgrades never upgrade the ray.io CRDs (crds/ directory posture); apply the new release's CRD files manually when a bump changes them.
      notes: feature_gates flips named operator gates against the pinned release's default set -- the modules merge entries over the full defaults (Helm alone would REPLACE the list and silently flip unlisted gates).
