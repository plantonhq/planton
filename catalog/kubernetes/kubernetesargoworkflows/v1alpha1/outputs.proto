syntax = "proto3";

package dev.planton.kubernetes.kubernetesargoworkflows.v1alpha1;

/**
 * Outputs exported after deploying Argo Workflows — the handles
 * downstream resources and humans compose against.
 */
message KubernetesArgoWorkflowsOutputs {
  /**
   * Namespace Argo Workflows is installed in.
   */
  string namespace = 1;

  /**
   * Helm release name (equals metadata.name).
   */
  string release_name = 2;

  /**
   * Name of the Argo server Service (`<name>-server`) — the backend
   * handle exposure kinds (KubernetesIngress, KubernetesHttpRoute)
   * reference. Empty when the server is disabled.
   */
  string server_service = 3;

  /**
   * In-cluster endpoint of the Argo server (e.g.
   * "http://main-server.pipelines.svc.cluster.local:2746"). Plain HTTP
   * by default; HTTPS when `server.secure` is set. Empty when the
   * server is disabled.
   */
  string server_kube_endpoint = 4;

  /**
   * Name of the ServiceAccount workflow pods run as — annotate THIS
   * account for IRSA/Workload-Identity when workflows need cloud
   * access.
   */
  string workflow_service_account = 5;

  /**
   * Command to port-forward the UI to a workstation
   * (http://localhost:2746 unless `server.secure`).
   */
  string port_forward_command = 6;
}
