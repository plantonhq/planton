syntax = "proto3";

package dev.planton.kubernetes.kubernetesargoworkflows.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesargoworkflows/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesargoworkflows/v1alpha1/spec.proto";
import "shared/metadata.proto";

//argo-workflows-kubernetes
message KubernetesArgoWorkflows {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesArgoWorkflows'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesArgoWorkflowsSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesArgoWorkflowsStatus status = 5;
}

//argo-workflows-kubernetes status.
message KubernetesArgoWorkflowsStatus {
  //outputs
  KubernetesArgoWorkflowsOutputs outputs = 1;
}
