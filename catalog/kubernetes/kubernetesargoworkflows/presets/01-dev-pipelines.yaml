apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesArgoWorkflows
metadata:
  name: dev-workflows
spec:
  namespace:
    value: dev-workflows
  create_namespace: true
  # Everything else is the kind's defaults: the pinned chart
  # version, the workflow controller, the Argo server in `client` auth
  # mode (callers present a Kubernetes token and act with ITS
  # permissions), and the runner ServiceAccount `argo-workflow` created
  # in this namespace — the identity workflow pods run as.
  #
  # NO artifact repository and NO archive: steps run fine, but files
  # cannot pass between them and history lives only as Workflow CRs
  # until something prunes them. Declare `artifact_repository` and
  # `archive` before pipelines produce anything worth keeping.
