# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: kubernetesstatefulset
spec:
  billing_model: cluster_capacity
  cost_drivers:
    - field_path: availability.replicas
      sku_meter: cluster CPU and memory reservations
      impact: Every replica is a full pod carrying the declared container resources AND its own persistent volume per claim template -- three replicas reserve three times the compute and three times the storage. Defaults to 1.
    - field_path: container.app.resources
      sku_meter: cluster CPU and memory reservations
      impact: The app container's CPU and memory requests are what the scheduler reserves on the cluster's nodes per replica -- the capacity is claimed whether the application is busy or idle. Limits set the burst ceiling, not the reservation.
    - field_path: container.sidecars
      sku_meter: cluster CPU and memory reservations
      impact: Each declared sidecar runs in every replica and adds its own requests and limits on top of the app container's.
    - field_path: volume_claim_templates
      sku_meter: persistent volume storage
      pricing_unit: GB-months
      impact: Each replica gets its OWN PersistentVolumeClaim stamped from every template through the cluster's storage class -- total storage is replicas x the sum of the template sizes, and sizes can only grow.
    - field_path: pvc_retention_policy
      sku_meter: persistent volume storage
      pricing_unit: GB-months
      impact: Under the default Retain policy the stamped PVCs outlive the workload -- volumes keep occupying (and billing) storage after deletion or scale-down until manually removed; Delete trades that safety for automatic cleanup.
  estimate_exclusions:
    - the price of reserved CPU, memory, and volume storage is the target cluster's node and storage-class economics, which this catalog cannot know
    - declared sidecar containers add their own reservations on top of the app container's
    - under the default Retain retention policy, PVCs stamped from the claim templates stay claimed after workload deletion or scale-down until manually removed
  notes: "This component creates no cloud SKU of its own -- its cost is the share of the cluster it reserves, realized on the cluster's bill. An honest manifest-time statement is the capacity footprint: replicas x (app container requests + per-replica volumes)."
