syntax = "proto3";

package dev.planton.kubernetes.kubernetesstatefulset.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesstatefulset/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesstatefulset/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesStatefulSet is a component for running stateful applications on Kubernetes.
// StatefulSets are used for applications that require stable, unique network identifiers,
// stable persistent storage, ordered graceful deployment and scaling, and ordered automated rolling updates.
message KubernetesStatefulSet {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesStatefulSet'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesStatefulSetSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesStatefulSetStatus status = 5;
}

// KubernetesStatefulSetStatus represents the status of a KubernetesStatefulSet resource.
message KubernetesStatefulSetStatus {
  // outputs
  KubernetesStatefulSetOutputs outputs = 1;
}
