apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetescertmanager
spec:
  # cert-manager installs as ONE Helm release whose name is fixed to
  # "cert-manager" (one installation per cluster is an upstream
  # architectural constraint), in the spec's namespace.
  values:
    - name: release_name
      derivations:
        - from_output: release_name
      where_to_find: >-
        Always "cert-manager" — the module fixes the release name to the
        chart name. Confirm with `helm list -n <namespace>` (NAME column).
    - name: release_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `helm list -A` (NAMESPACE column); conventionally "cert-manager".
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the installation
        namespace itself.
