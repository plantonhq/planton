# The kind defaults on their own: a single ephemeral replica with
# chart-generated admin credentials — the verifier reads the chart-owned
# `<name>` Secret (the lookup-stable generate arm's first live proof),
# asserts /api/health reports a working database and authenticates
# against the API as the admin.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesGrafana
metadata:
  name: e2e-grafana-min
spec:
  namespace:
    value: e2e-grafana-min
  create_namespace: true
