syntax = "proto3";

package dev.planton.kubernetes.kubernetesgrafana.v1alpha1;

import "catalog/kubernetes/kubernetes.proto";

//grafana-kubernetes outputs
message KubernetesGrafanaOutputs {
  //namespace Grafana runs in.
  string namespace = 1;

  //Helm release name (= metadata.name). The modules pin the chart's
  //fullname to it, so the Service and Secret names derive from it.
  string release_name = 2;

  //name of the Grafana Service (port 80 → container 3000).
  string service = 3;

  //in-cluster endpoint for browsers behind composed exposure and for
  //in-cluster API clients,
  //e.g. http://dashboards.observability.svc.cluster.local
  string endpoint = 4;

  //name of the Secret holding the admin credentials — `<name>`, keys
  //`admin-user` / `admin-password` (the chart generates it once and
  //keeps it stable across upgrades; when spec.admin_secret points at an
  //existing Secret, that name is echoed here instead).
  string admin_secret_name = 5;

  //command to port-forward the Grafana UI to a developer laptop,
  //e.g. kubectl port-forward svc/dashboards -n observability 3000:80
  string port_forward_command = 6;

  //the Secret key holding agent teammates' read-only Grafana token —
  //`<name>-agent-reader`, key `token` (a sibling key `generation` names
  //the token's generation). Unset when spec.agent_reader is not declared
  //or is disabled. Read it at each start of Grafana's MCP server
  //(`GRAFANA_SERVICE_ACCOUNT_TOKEN`) rather than copying it anywhere.
  dev.planton.kubernetes.KubernetesSecretKey agent_reader_token_secret = 7;

  //the Job that keeps the agent teammates' account and token
  //(`<name>-agent-reader-<8 hex>`, the hex hashing the declaration and
  //the Job's script) — `kubectl logs job/<this>` is where it explains
  //itself. Empty when spec.agent_reader is not declared.
  string agent_reader_job_name = 8;
}
