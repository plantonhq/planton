syntax = "proto3";

package dev.planton.kubernetes.kubernetesgrafana.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesgrafana/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesgrafana/v1alpha1/spec.proto";
import "shared/metadata.proto";

//grafana-kubernetes
message KubernetesGrafana {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesGrafana'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesGrafanaSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesGrafanaStatus status = 5;
}

//grafana-kubernetes status.
message KubernetesGrafanaStatus {
  //outputs
  KubernetesGrafanaOutputs outputs = 1;
}
