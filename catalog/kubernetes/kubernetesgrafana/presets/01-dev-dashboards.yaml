apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesGrafana
metadata:
  name: dev-grafana
spec:
  namespace:
    value: dev-grafana
  create_namespace: true
  # Everything else is the component's defaults: one replica, the
  # pinned chart version, chart-generated admin credentials in the
  # `dev-grafana` Secret (created once, stable across upgrades; name
  # exported in the outputs), the dashboard-discovery sidecar on.
  #
  # NO storage and NO database: state is EPHEMERAL — dashboards built
  # by hand in this UI vanish on pod restart. Fine for a dev loop
  # where the declared datasource below is the only state that
  # matters; declare `storage` before anyone invests real work here.
  datasources:
    # Literal URL shown; the field is a foreign key — reference a
    # KubernetesKubePrometheusStack resource via value_from to resolve
    # its prometheus_endpoint output instead.
    - name: Prometheus
      url:
        value: http://<stack-name>-prometheus.<stack-namespace>.svc.cluster.local:9090
      is_default: true
