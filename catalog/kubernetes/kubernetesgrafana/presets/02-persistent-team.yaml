apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesGrafana
metadata:
  name: team-grafana
spec:
  namespace:
    value: observability
  create_namespace: true
  # ONE stateful instance: the PVC carries the embedded SQLite
  # database, so hand-built dashboards, users and preferences survive
  # pod restarts. A ReadWriteOnce volume backs exactly one replica —
  # scaling out later means moving state to an external database
  # (the 03 preset), not raising replicas here.
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  datasources:
    # Reference form: resolves to the named stack's Prometheus
    # endpoint (the field's default kind is
    # KubernetesKubePrometheusStack) and orders this Grafana after it.
    - name: Prometheus
      url:
        value_from:
          name: <stack-name>
      is_default: true
  # The public URL exposure will serve (compose a KubernetesIngress
  # or Gateway API route over the exported service handle) — sign-in
  # redirects and links in alert notifications embed it.
  server:
    root_url: https://grafana.<your-domain>
  # The team signs in with its Google Workspace. The OAuth client's
  # redirect URI is <root_url>/login/google; its secret comes from
  # Planton's secrets, never pasted. allowed_domains keeps every other
  # Google account out, and the role path makes the named lead an Admin
  # at every sign-in (everyone else is a Viewer). The login form stays as
  # the break-glass way in while Google is the everyday one.
  auth:
    google:
      client_id: <client-id>.apps.googleusercontent.com
      client_secret:
        value: $secret/grafana-google-signin-client-secret
      allowed_domains:
        - <your-domain>
      hosted_domain: <your-domain>
      role_attribute_path: "email == 'lead@<your-domain>' && 'Admin' || 'Viewer'"
  # The team's coding agents read this Grafana through its MCP server
  # with a Viewer token the module keeps in team-grafana-agent-reader
  # (key token). The volume above is what keeps the account across pod
  # restarts. Raise token_generation to replace the token; set disabled
  # to refuse it at once.
  agent_reader: {}
