apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kuberneteskarapace
spec:
  # Module-owned typed manifests: the registry Deployment/Service named
  # after metadata.name, the optional REST-proxy pair ("<name>-rest"),
  # the optional materialized SASL Secret ("<name>-sasl") and the
  # optional anchor namespace. The registry and REST-proxy pairs carry
  # different name derivations, so their rows are scoped per Terraform
  # logical resource name.
  values:
    # ── the registry Deployment/Service (resources "registry") ──────────
    - name: deployment_name
      tofu_resource_name: registry
      derivations:
        - from_metadata_name: true
      where_to_find: >-
        The registry Deployment shares the resource's name —
        `kubectl get deployments -n <namespace>`.
    - name: service_name
      tofu_resource_name: registry
      derivations:
        - from_metadata_name: true
        - from_output: service_name
      where_to_find: >-
        The registry Service shares the resource's name —
        `kubectl get services -n <namespace>`.
    # ── the optional REST-proxy pair (resources "rest_proxy") ───────────
    - name: deployment_name
      tofu_resource_name: rest_proxy
      derivations:
        - from_metadata_name_suffix: "-rest"
      where_to_find: >-
        Present only when rest_proxy.enabled; always
        "<resource-name>-rest" — `kubectl get deployments -n <namespace>`.
    - name: service_name
      tofu_resource_name: rest_proxy
      derivations:
        - from_metadata_name_suffix: "-rest"
      where_to_find: >-
        Present only when rest_proxy.enabled; always
        "<resource-name>-rest" — `kubectl get services -n <namespace>`.
    # ── the optional materialized SASL Secret ────────────────────────────
    - name: secret_name
      tofu_resource_name: sasl_password
      derivations:
        - from_metadata_name_suffix: "-sasl"
      where_to_find: >-
        Present only when a LITERAL sasl password was declared (a
        referenced password_secret imports nothing); always
        "<resource-name>-sasl" — `kubectl get secrets -n <namespace>`.
    # ── shared namespace segment for every namespaced object ────────────
    - name: deployment_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The registry's namespace — `kubectl get deployments -A`
        (NAMESPACE column).
    - name: service_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same namespace as the registry.
    - name: secret_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same namespace as the registry.
    # ── the optional anchor namespace ────────────────────────────────────
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the registry's
        namespace itself.
