# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources plus the
# pinned 0.8.0 chart's template census, cited in notes) until the live
# capture lane upgrades it to `proven`. Schema: iac/catalogkindpermissions/v1.
#
# NOTE the asymmetry with what the OPERATOR ITSELF needs: the chart grants
# the operator a broad ClusterRole (it deploys entire platforms). The
# runner's principal below only needs to CREATE that grant. Kubernetes
# refuses a principal that grants permissions it does not itself hold
# unless it carries the escalate verb on the role kinds and the bind verb
# on the binding kinds -- the exact verbs Kubernetes defines for a
# permission-granting installer. Declaring them here is what makes this
# file the whole truth: an operator installer is a principal allowed to
# grant, and nothing wider than that (proven by the least-privilege lane,
# which runs the install as exactly this file's identity).
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: kubernetesplantonoperator
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubernetes_namespace_v1 -- the optional installation namespace (create_namespace), created before the release and deleted with the resource. list and watch serve the Pulumi provider's deletion await -- it watches the namespace until it is gone, and without them a destroy under this exact identity hangs until the provider's timeout.
      - api_groups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers the PlantonPlatform and PlantonIdentityProvider definitions, which the chart renders as release resources while crds.install is true (the Planton default). With crds.keep_on_uninstall (default true) Helm keeps them on uninstall, so delete is exercised only when keeping is explicitly disabled.
      - api_groups:
          - ""
        resources:
          - secrets
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: proven
        notes: Helm's own release-state Secret (sh.helm.release.v1.planton-operator.vN) in the installation namespace -- every install, upgrade, and uninstall reads and writes it. The chart renders no Secret of its own. Found by running the least-privilege lane as exactly this file's identity, which the release install refused with "secrets is forbidden" until this rule existed.
      - api_groups:
          - ""
        resources:
          - serviceaccounts
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: The chart's ServiceAccount for the operator pod (serviceaccount.yaml in the 0.8.0 template census; skipped when service_account.create is false).
      - api_groups:
          - apps
        resources:
          - deployments
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: The chart's single manager Deployment (deployment.yaml in the 0.8.0 template census; replicas/leaderElection/resources/scheduling patched from the typed spec).
      - api_groups:
          - apps
        resources:
          - replicasets
        verbs:
          - get
          - list
          - watch
        cluster_scoped: false
        provenance: proven
        notes: Read-only, for the release's readiness wait -- both engines install with wait and atomic, and Helm judges a Deployment ready by reading its ReplicaSets and their Pods. Found by running the least-privilege lane as exactly this file's identity, which the wait refused with "replicasets.apps is forbidden" until this rule existed.
      - api_groups:
          - ""
        resources:
          - pods
        verbs:
          - get
          - list
          - watch
        cluster_scoped: false
        provenance: proven
        notes: Read-only, for the same readiness wait -- the Pods behind the manager Deployment's ReplicaSet are what Helm counts as ready.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - clusterroles
          - clusterrolebindings
        verbs:
          - get
          - create
          - update
          - patch
          - delete
          - escalate
          - bind
        cluster_scoped: true
        provenance: proven
        notes: The chart's manager ClusterRole/ClusterRoleBinding pair (clusterrole.yaml, clusterrolebinding.yaml) — the operator's cluster-wide platform-reconciliation grant. Creating it requires the runner's principal to already hold what it grants (Kubernetes escalation prevention), which is why operator installation is a cluster-admin act. escalate and bind -- the operator's ClusterRole grants far more than the installer holds (it deploys entire platforms), and Kubernetes lets a principal create such a grant only with these verbs -- the exact statement of what an operator installer is.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - roles
          - rolebindings
        verbs:
          - get
          - create
          - update
          - patch
          - delete
          - escalate
          - bind
        cluster_scoped: false
        provenance: proven
        notes: The chart's namespaced leader-election Role/RoleBinding pair (leader-election-role.yaml, leader-election-rolebinding.yaml) in the installation namespace. escalate and bind for the same reason as the cluster-scoped pair -- the Role grants the operator lease and event rights the installer does not hold itself.
