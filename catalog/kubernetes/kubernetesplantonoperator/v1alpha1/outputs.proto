syntax = "proto3";

package dev.planton.kubernetes.kubernetesplantonoperator.v1alpha1;

/**
 * **KubernetesPlantonOperatorOutputs** — the composition handles a
 * deployed Planton operator exports. The operator has no per-platform
 * surface of its own; KubernetesPlantonPlatform resources compose against
 * the CRD it installs, so the handles here identify the installation
 * rather than any platform.
 */
message KubernetesPlantonOperatorOutputs {
  // Namespace the operator runs in.
  string namespace = 1;

  // Helm release name of the operator (fixed: "planton-operator" — one
  // installation per cluster, enforced by the operator's own startup
  // guard).
  string release_name = 2;
}
