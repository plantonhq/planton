apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kuberneteskafkamirrormaker2
spec:
  # One kubectl_manifest for the KafkaMirrorMaker2 CR, plus the optional
  # module-owned metrics ConfigMap (count-indexed singleton) and the
  # optional anchor namespace.
  values:
    - name: api_version
      tofu_resource_name: mirrormaker2
      derivations:
        - literal: kafka.strimzi.io/v1
      where_to_find: Always "kafka.strimzi.io/v1" — the CR's group/version.
    - name: kind
      tofu_resource_name: mirrormaker2
      derivations:
        - literal: KafkaMirrorMaker2
      where_to_find: Always "KafkaMirrorMaker2" — the CR kind this module applies.
    - name: name
      tofu_resource_name: mirrormaker2
      derivations:
        - from_metadata_name: true
        - from_output: mirrormaker_name
      where_to_find: >-
        The KafkaMirrorMaker2 CR's metadata.name (equals the Planton
        resource name) — `kubectl get kafkamirrormaker2 -A` (NAME column).
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The deployment's namespace — `kubectl get kafkamirrormaker2 -A`
        (NAMESPACE column).
    # ── the module-owned metrics ConfigMap (count-indexed singleton) ─────
    - name: config_map_name
      tofu_resource_name: mirrormaker2_metrics
      derivations:
        - from_metadata_name_suffix: "-mm2-metrics"
      where_to_find: >-
        Present only when metrics.enabled; always
        "<resource-name>-mm2-metrics" —
        `kubectl get configmap -n <namespace>`.
    - name: config_map_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same namespace as the deployment.
    # ── the optional anchor namespace ────────────────────────────────────
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the deployment's
        namespace itself.
