apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetessecretstore
spec:
  # One kubectl_manifest applying the external-secrets SecretStore CR
  # (namespaced), plus the conditional "<name>-credentials" Secret the module
  # materializes in the store's own namespace when the backend declares
  # static credentials, for_each-keyed by that Secret name.
  values:
    - name: api_version
      derivations:
        - literal: external-secrets.io/v1
      where_to_find: Always "external-secrets.io/v1" — the CR group/version this module applies.
    - name: kind
      derivations:
        - literal: SecretStore
      where_to_find: Always "SecretStore" — the CR kind this module applies.
    - name: name
      derivations:
        - from_metadata_name: true
        - from_output: store_name
      where_to_find: >-
        The SecretStore's metadata.name (equals the Planton resource name) —
        `kubectl get secretstores -A` (NAME column).
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The namespace the SecretStore lives in — `kubectl get secretstores -A`
        (NAMESPACE column).
    - name: secret_name
      derivations:
        - from_address_key: true
        - from_metadata_name_suffix: "-credentials"
      where_to_find: >-
        Always "<resource-name>-credentials" — the module's deterministic
        credential Secret name; only present when the backend declares
        static credentials.
    - name: secret_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same as the store's namespace — a namespaced store only reads
        credential secrets from its own namespace.
