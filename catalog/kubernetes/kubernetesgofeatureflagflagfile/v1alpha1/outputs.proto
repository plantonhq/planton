syntax = "proto3";

package dev.planton.kubernetes.kubernetesgofeatureflagflagfile.v1alpha1;

/**
 * **KubernetesGoFeatureFlagFlagFileOutputs** - where the rendered flag file
 * lives, for a KubernetesGoFeatureFlag relay's `config_map` retriever.
 */
message KubernetesGoFeatureFlagFlagFileOutputs {
  /**
   * Name of the rendered ConfigMap.
   */
  string config_map_name = 1;

  /**
   * ConfigMap data key holding the flag file.
   */
  string key = 2;

  /**
   * Namespace of the rendered ConfigMap.
   */
  string namespace = 3;
}
