syntax = "proto3";

package dev.planton.kubernetes.kubernetesconfigmap.v1alpha1;

/**
 * **KubernetesConfigMapOutputs** captures observable outputs from a Kubernetes ConfigMap
 * deployment. Downstream resources (workloads mounting the ConfigMap, charts wiring
 * `configMapRef` env sources) compose on these handles.
 */
message KubernetesConfigMapOutputs {
  /**
   * The name of the created ConfigMap — the handle workloads use in `configMapRef`,
   * `configMapKeyRef`, and `configMap` volume definitions.
   */
  string configmap_name = 1;

  /**
   * The namespace in which the ConfigMap was created. Consumers must live in the same
   * namespace — ConfigMap references never cross namespaces in Kubernetes.
   */
  string namespace = 2;
}
