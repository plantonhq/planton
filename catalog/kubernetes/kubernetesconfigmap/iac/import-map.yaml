apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesconfigmap
spec:
  # A ConfigMap's identity is fully carried by its namespace/name pair --
  # derivable from a prior deploy's outputs or from the spec itself.
  values:
    - name: config_map_name
      derivations:
        - from_output: configmap_name
        - from_spec_field: name
      where_to_find: >-
        `kubectl get configmaps -A` (NAME column).
    - name: config_map_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `kubectl get configmaps -A` (NAMESPACE column); "default" when the
        spec omits the namespace.
