# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetesconfigmap
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The ConfigMap's data rests in the cluster's etcd, whose encryption at rest is the target cluster's control-plane posture, owned by the cluster component. By contract this kind holds NON-confidential data -- confidential values belong in KubernetesSecret, the spec's deliberate mirror kind.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Customer-managed keys for etcd belong to the cluster component; this spec has no seam for them.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The ConfigMap serves no connections. Reads and writes travel over the Kubernetes API's TLS, a property of the cluster, not of this object.
    - control_id: no-public-access
      status: not_applicable
      notes: The ConfigMap is not a network endpoint; it is reachable only through the Kubernetes API.
    - control_id: restricted-ingress
      status: not_applicable
      notes: There is no inbound network traffic to restrict on a data object.
    - control_id: edge-protection
      status: not_applicable
      notes: The ConfigMap serves no traffic; web application firewalls have no meaning for a configuration data object.
    - control_id: rbac
      status: not_applicable
      notes: Who may read or change the ConfigMap is the target cluster's Kubernetes RBAC on configmaps in its namespace -- the object itself carries no access-control surface.
    - control_id: workload-identity
      status: not_applicable
      notes: The ConfigMap calls no cloud APIs -- there is nothing for it to authenticate to.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The ConfigMap has no authentication path of any kind.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Changes to the ConfigMap are Kubernetes API operations captured by the target cluster's audit policy; the object produces no events of its own.
    - control_id: monitoring-integration
      status: not_applicable
      notes: A data object emits no operational metrics; consumption behavior surfaces in the consuming workloads' telemetry.
    - control_id: backup-recovery
      status: not_applicable
      notes: The ConfigMap is declarative configuration fully reproducible from its manifest -- there is no runtime state to back up.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The ConfigMap is an API-server record replicated by the cluster's control plane (etcd); there is no per-resource replication or zonal knob.
    - control_id: deletion-protection
      status: not_applicable
      notes: Kubernetes offers no deletion-protection flag on ConfigMap; protection is operational (namespace RBAC, change review). The spec's immutable flag guards against accidental UPDATES -- once true, data changes require delete-and-recreate -- but it does not prevent deletion.
    - control_id: managed-patching
      status: not_applicable
      notes: There is no software here to patch -- the resource is data.
