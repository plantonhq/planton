# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources plus the
# pinned openbao chart 0.28.6, cited in notes) until the live capture lane
# upgrades it to `proven`. Schema: iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: kubernetesopenbao
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubernetes_namespace_v1.openbao (Terraform) and namespace.go (Pulumi) -- created and owned only when spec.create_namespace is true; get is needed for refresh either way.
      - api_groups:
          - ""
        resources:
          - secrets
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers kubernetes_secret_v1.seal_credentials (Terraform) and seal_secret.go (Pulumi) -- rendered only when a declared-credential auto-unseal arm carries material; the chart wires each key to the server as environment variables -- and kubernetes_secret_v1.backup_credentials (backup.go), rendered only when spec.backup's store arm declares keys, delivered to the backup and restore jobs as environment variables. Helm's own release-state Secrets in the target namespace also live here.
      - api_groups:
          - ""
        resources:
          - services
          - configmaps
          - serviceaccounts
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Chart-rendered inside helm_release.openbao (main.tf; main.go in Pulumi) -- the internal, active, standby, and UI Services (publishNotReadyAddresses so sealed pods stay addressable), the server-config ConfigMap synthesized from typed fields, and the server ServiceAccount (annotated from spec.service_account). Module-owned when spec.backup is declared -- kubernetes_service_account_v1.backup (the job's identity, annotated from spec.backup.workload_identity) and kubernetes_config_map_v1.backup_scripts (backup.tf; backup.go in Pulumi).
      - api_groups:
          - apps
        resources:
          - statefulsets
          - deployments
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: The chart renders the server StatefulSet (spec.server.replicas pods, default 1, on either storage engine; one pod in dev mode); the injector Deployment renders only when spec.injector.enabled is true. The per-replica PVCs are created by the StatefulSet controller, never by the runner. The module sets wait=false / non-atomic BY DESIGN (sealed pods are NotReady until operator init/unseal), so no pods read access is needed for rollout tracking.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - clusterroles
          - clusterrolebindings
          - roles
          - rolebindings
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: The chart binds the server ServiceAccount to system:auth-delegator (ClusterRoleBinding) when spec.service_account.auth_delegator_enabled is true (the default) -- required for OpenBao's Kubernetes auth method to verify client tokens via TokenReview. For every server on a storage engine (the chart's HA mode, Raft or PostgreSQL) the chart also renders the namespaced discovery Role and RoleBinding that let the server patch the openbao-active label onto its own pod -- what the active and standby Services select on. The injector's RBAC objects render only when spec.injector.enabled is true.
      - api_groups:
          - admissionregistration.k8s.io
        resources:
          - mutatingwebhookconfigurations
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Rendered only when spec.injector.enabled is true -- the agent injector's cluster-wide MutatingWebhookConfiguration (off by default here, a deliberate divergence from the chart's default; fails open so injector downtime never blocks pod creation).
      - api_groups:
          - policy
        resources:
          - poddisruptionbudgets
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: The chart's server PodDisruptionBudget, rendered for every server on a storage engine (the chart's HA mode) with spec.server.replicas above 1 -- the module disables it at one replica, where the chart would render maxUnavailable 0 and block every node drain while protecting nothing. The injector's own PodDisruptionBudget renders only when spec.injector.enabled is true.
      - api_groups:
          - networking.k8s.io
        resources:
          - networkpolicies
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Rendered only when spec.network_policy_enabled is true -- the chart's NetworkPolicy admitting ingress on 8200/8201.
      - api_groups:
          - monitoring.coreos.com
        resources:
          - servicemonitors
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Rendered only when spec.metrics.service_monitor_enabled is true (CEL requires metrics.enabled alongside) -- requires the Prometheus operator CRDs on the cluster. The spec.helm_values escape hatch can widen the chart's object surface beyond this profile; overlay users own the extra permissions.
      - api_groups:
          - batch
        resources:
          - cronjobs
          - jobs
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Module-owned -- kubernetes_cron_job_v1.backup (backup.tf; backup.go in Pulumi) rendered when spec.backup is declared, the scheduled Raft snapshot to the declared object store; kubernetes_job_v1.restore (backup.tf; restore.go) rendered when spec.restore is declared, the one-shot install of a snapshot into a fresh cluster. The Jobs a CronJob creates are the controller's, not the runner's.
