# THE BACKUP PROOF on a kind cluster, with no cloud account: a single-node
# Raft vault on Shamir seal backing up into the catalog's own in-cluster S3
# store, the `s3` arm wired to the store's endpoint BY REFERENCE (the edge the
# spec declares) with the store's declared key pair. The verifier (switched
# on by this scenario's name) performs the real bootstrap (init, unseal,
# a KV write), then runs the four-command login recipe EXACTLY as the backup
# job prints it, triggers one run from the CronJob, and lists the store from
# inside the cluster with the job's own identity to find the snapshot under
# the prefix; then it seeds a stale object, triggers a second run, and proves
# retention pruned it while the fresh snapshots survived. The schedule stays a
# customer-shaped hourly one — a run may fire mid-proof, and the assertions
# tolerate it.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOpenBao
metadata:
  name: e2e-bao-bk
  annotations:
    planton.dev/e2e-prerequisites: "KubernetesNamespace, catalog/kubernetes/kubernetesopenbao/e2e/fixture-s3-store.yaml"
spec:
  namespace:
    value: e2e-bao-lab
  server:
    ha:
      replicas: 1
    dataStorage:
      size: 1Gi
  backup:
    retentionDays: 1
    objectStore:
      prefix: openbao/${E2E_RUN_ID}/e2e-bao-bk
      s3:
        bucket: openbao-snapshots
        region: us-east-1
        endpointUrl:
          valueFrom:
            name: e2e-bao-s3
        forcePathStyle: true
        accessKeys:
          accessKeyId: e2e-bao-snapshots-admin
          secretAccessKey: e2e-bao-snapshots-admin-secret-not-a-real-secret
