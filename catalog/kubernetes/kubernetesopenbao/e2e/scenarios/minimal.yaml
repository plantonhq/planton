# Component defaults end to end: no mode declared = standalone (the
# chart default) — one instance, file storage on the data PVC, plain
# HTTP in-cluster, UI on. The verifier performs the REAL bootstrap
# every operator faces: asserts the fresh pod is NotReady-by-design
# (sealed), initializes with one key share, unseals, asserts readiness
# FLIPS, then proves a KV v2 write/read round-trip.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOpenBao
metadata:
  name: e2e-bao-min
spec:
  namespace:
    value: e2e-bao-min
  createNamespace: true
  server:
    raft:
      dataStorage:
        size: 1Gi
