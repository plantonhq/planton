# THE RESTORE PROOF on GKE from Google Cloud Storage, keyless end to end: a
# FRESH vault on the batch's Cloud KMS key (the same key as the source,
# fixture-gke-gcs-source.yaml), its backup job bound to the batch's backup
# identity through Workload Identity, declaring the source's store and prefix
# and `restore.latest` — the one-declaration recovery a customer writes when
# the original is gone. `latest` is safe only because a vault in restore mode
# takes no snapshots of its own (the CronJob renders SUSPENDED), so the newest
# object under the prefix is the source's; this lane is that rule's live
# proof. The seed wrote marker A, took the snapshot, then wrote marker B; the
# verifier initializes the target, hands over the root token, watches the Job
# complete, reads A back through the source's token, asserts B absent and the
# target's init token dead, then replaces pod 0 and proves the KMS seal brings
# it back unsealed with no human.
#
# JOINS the fixture-owned namespace. The seed script is the kind lane's: it
# seeds the VAULT, not the store, so one script serves every restore lane.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOpenBao
metadata:
  name: e2e-bao-tgt
  annotations:
    planton.dev/e2e-cluster-profile: "gcp-gke"
    planton.dev/e2e-prerequisites: "KubernetesNamespace, catalog/kubernetes/kubernetesopenbao/e2e/fixture-gke-gcs-source.yaml"
    planton.dev/e2e-setup-script: "catalog/kubernetes/kubernetesopenbao/e2e/scenarios/backup-restore-seed.setup.sh"
spec:
  namespace:
    value: e2e-bao-lab
  server:
    ha:
      replicas: 1
    dataStorage:
      size: 1Gi
  autoUnseal:
    gcpKms:
      project:
        value: ${E2E_ENV:PLANTON_E2E_GCP_PROJECT}
      region: ${E2E_ENV:PLANTON_E2E_GCP_REGION}
      keyRing:
        value: ${E2E_ENV:PLANTON_E2E_GKE_OPENBAO_KEY_RING}
      cryptoKey:
        value: ${E2E_ENV:PLANTON_E2E_GKE_OPENBAO_CRYPTO_KEY}
      workloadIdentityServiceAccount:
        value: ${E2E_ENV:PLANTON_E2E_GKE_OPENBAO_UNSEAL_GSA}
  backup:
    retentionDays: 1
    objectStore:
      prefix: openbao/${E2E_RUN_ID}/e2e-bao-src
      gcs:
        bucket:
          value: ${E2E_ENV:PLANTON_E2E_GKE_BACKUP_BUCKET}
        keyless: true
    workloadIdentity:
      gke:
        serviceAccountEmail:
          value: ${E2E_ENV:PLANTON_E2E_GKE_OPENBAO_BACKUP_GSA}
  restore:
    latest: true
    rootToken:
      name: e2e-bao-tgt-init-root
      key: token
