apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: kubernetesopenbao
spec:
  tier: 2
  # Rebuilt onto the official openbao chart 0.28.6 (OpenBao v2.6.1) with
  # the typed mode oneof (dev/standalone/ha-Raft), module-synthesized
  # server HCL (listener, storage, retry_join, seal, telemetry) and the
  # seal-credential Secret indirection. The old deferred posture
  # ("sealed state on kind — needs dev_mode spec field") died with the
  # rebuild: dev mode is a first-class arm now, and the DEDICATED
  # verifier owns the seal lifecycle on the real modes — sealed pods
  # asserted NotReady-by-design, a real init/unseal bootstrap flipping
  # readiness, then a KV round-trip (never the generic readiness-waiting
  # fallback, which would hang every fresh install by design).
  #
  # The backup and restore surface (scheduled Raft snapshots to an object
  # store, declared restore into a fresh cluster) is authored and offline-
  # proven; its lanes -- a keyed S3 backup onto an in-cluster store, and a
  # restore through the transit seal -- have not yet run live, so the
  # profile waits on that proof.
  status: pending_proof
  validated_provisioners:
    - pulumi
    - terraform
  # First boot pulls the image and provisions per-replica PVCs; the
  # behavioral-raft lane adds a pod replacement + re-unseal cycle.
  timeout_minutes: 25
