# The SOURCE vault of the gcp-gke restore proof on Google Cloud Storage: the
# vault a customer runs in production, sealed by the batch's Cloud KMS key
# through the server's own Workload Identity, backing up KEYLESSLY into the
# batch's GCS bucket — the backup job's ServiceAccount (`e2e-bao-src-backup`)
# is bound to the batch's backup identity by a GcpGkeWorkloadIdentityBinding,
# and the bucket grants that identity `objectAdmin` and `legacyBucketReader`.
# Every batch identifier arrives through the env-file contract (the values the
# GcpKmsKeyRing, GcpKmsKey, GcpServiceAccount, and GcpGcsBucket kinds export;
# carried by value because the GCP side is not part of the lane's own graph).
# The seed script initializes it, runs the login recipe, seeds the markers and
# one snapshot; the restore scenario is the fresh target on the SAME KMS key.
# The prefix carries the run id so no two lanes share a snapshot folder.
#
# Same names as the R2 source so one seed script serves both lanes; the two
# never run at once. JOINS the lane namespace.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOpenBao
metadata:
  name: e2e-bao-src
spec:
  namespace:
    value: e2e-bao-lab
  server:
    ha:
      replicas: 1
    dataStorage:
      size: 1Gi
  autoUnseal:
    gcpKms:
      project:
        value: ${E2E_ENV:PLANTON_E2E_GCP_PROJECT}
      region: ${E2E_ENV:PLANTON_E2E_GCP_REGION}
      keyRing:
        value: ${E2E_ENV:PLANTON_E2E_GKE_OPENBAO_KEY_RING}
      cryptoKey:
        value: ${E2E_ENV:PLANTON_E2E_GKE_OPENBAO_CRYPTO_KEY}
      workloadIdentityServiceAccount:
        value: ${E2E_ENV:PLANTON_E2E_GKE_OPENBAO_UNSEAL_GSA}
  backup:
    retentionDays: 1
    objectStore:
      prefix: openbao/${E2E_RUN_ID}/e2e-bao-src
      gcs:
        bucket:
          value: ${E2E_ENV:PLANTON_E2E_GKE_BACKUP_BUCKET}
        keyless: true
    workloadIdentity:
      gke:
        serviceAccountEmail:
          value: ${E2E_ENV:PLANTON_E2E_GKE_OPENBAO_BACKUP_GSA}
