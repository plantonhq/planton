# Full-surface development manifest — exercises every module-rendered arm
# so the offline plan/preview proofs cover what the kind-cluster lanes
# exclude (HA Raft with synthesized retry_join, TLS listener wiring, a
# declared-credential auto-unseal seal, the injector, metrics +
# ServiceMonitor, audit storage, a keyed S3 backup store).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOpenBao
metadata:
  name: bao-dev
spec:
  namespace:
    value: openbao-dev
  createNamespace: true
  server:
    ha:
      replicas: 3
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi
    dataStorage:
      size: 10Gi
    auditStorage:
      size: 5Gi
    logLevel: info
    logFormat: json
    scheduling:
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: dedicated
          operator: Equal
          value: secrets
          effect: NoSchedule
  tls:
    enabled: true
    certSecretName:
      value: bao-dev-tls
  autoUnseal:
    awsKms:
      region: us-west-2
      kmsKeyId: alias/openbao-unseal
      accessKeyId: AKIAEXAMPLEDEVONLY
      secretAccessKey: dev-only-placeholder-secret-key
  injector:
    enabled: true
    replicas: 1
    failurePolicy: Ignore
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
  uiEnabled: true
  networkPolicyEnabled: true
  metrics:
    enabled: true
    serviceMonitorEnabled: true
  backup:
    schedule: "0 */6 * * *"
    retentionDays: 7
    objectStore:
      prefix: openbao/bao-dev
      s3:
        bucket: bao-dev-snapshots
        region: us-west-2
        accessKeys:
          accessKeyId: AKIAEXAMPLEDEVONLY
          secretAccessKey: dev-only-placeholder-secret-key
    auth:
      mountPath: kubernetes
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/bao-dev-unseal
    authDelegatorEnabled: true
  helmValues: |
    server:
      annotations:
        example.planton.ai/full-surface: "true"
