# Full-surface development manifest — exercises every module-rendered arm
# so the offline plan/preview proofs cover what the kind-cluster lanes
# exclude (three Raft replicas with synthesized retry_join, TLS listener
# wiring, a declared-credential auto-unseal seal, the injector, metrics +
# ServiceMonitor, audit storage, the KEYLESS S3 backup arm through EKS
# IRSA — the one store posture no lane can prove: the kind lanes back up
# with declared keys to an in-cluster store and the GKE lanes prove GCS
# and R2, so the IRSA arm's rendering lives here). The storage engine is
# a oneof, so this manifest carries Raft; the PostgreSQL engine's
# rendering is proven by the module's own render tests and live by the
# behavioral-postgresql lane.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOpenBao
metadata:
  name: bao-dev
spec:
  namespace:
    value: openbao-dev
  createNamespace: true
  server:
    raft:
      dataStorage:
        size: 10Gi
    replicas: 3
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi
    auditStorage:
      size: 5Gi
    logLevel: info
    logFormat: json
    scheduling:
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: dedicated
          operator: Equal
          value: secrets
          effect: NoSchedule
  tls:
    enabled: true
    certSecretName:
      value: bao-dev-tls
  autoUnseal:
    awsKms:
      region: us-west-2
      kmsKeyId: alias/openbao-unseal
      accessKeyId: AKIAEXAMPLEDEVONLY
      secretAccessKey: dev-only-placeholder-secret-key
  injector:
    enabled: true
    replicas: 1
    failurePolicy: Ignore
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 128Mi
  uiEnabled: true
  networkPolicyEnabled: true
  metrics:
    enabled: true
    serviceMonitorEnabled: true
  backup:
    schedule: "0 */6 * * *"
    retentionDays: 7
    objectStore:
      prefix: openbao/bao-dev
      s3:
        bucket: bao-dev-snapshots
        region: us-west-2
        keyless: true
    workloadIdentity:
      eks:
        roleArn:
          value: arn:aws:iam::111122223333:role/bao-dev-backup
    auth:
      mountPath: kubernetes
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/bao-dev-unseal
    authDelegatorEnabled: true
  helmValues: |
    server:
      annotations:
        example.planton.ai/full-surface: "true"
