syntax = "proto3";

package dev.planton.kubernetes.kubernetesopenbao.v1alpha1;

import "catalog/kubernetes/kubernetesopenbao/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// KubernetesOpenBaoIacInput represents the input to the IaC module for deploying OpenBao.
message KubernetesOpenBaoIacInput {
  // The OpenBao catalog object to deploy.
  KubernetesOpenBao target = 1;

  // Kubernetes provider configuration.
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
