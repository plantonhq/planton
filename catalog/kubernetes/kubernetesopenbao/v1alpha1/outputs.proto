syntax = "proto3";

package dev.planton.kubernetes.kubernetesopenbao.v1alpha1;

/**
 * **KubernetesOpenBaoStackOutputs** — the composition handles a
 * deployed OpenBao exports. NOTE deliberately absent: root tokens and
 * unseal/recovery keys are produced by the RUNTIME
 * `bao operator init` call and are never known to (or owned by) the
 * deployment — capture them from the init output and store them
 * outside the cluster.
 */
message KubernetesOpenBaoStackOutputs {
  /**
   * Namespace the server runs in.
   */
  string namespace = 1;

  /**
   * The main client Service name (round-robins ALL server pods,
   * including sealed/not-ready ones — by design, so init/unseal can
   * reach them).
   */
  string service = 2;

  /**
   * The headless Service (`<name>-internal`) used for peer discovery
   * and Raft cluster addresses.
   */
  string internal_service = 3;

  /**
   * The active-leader Service (`<name>-active`) — HA mode only,
   * empty otherwise. Points at exactly the elected leader; the right
   * target for write-heavy clients.
   */
  string active_service = 4;

  /**
   * The UI Service name (`<name>-ui`) when ui_enabled, empty
   * otherwise.
   */
  string ui_service = 5;

  /**
   * In-cluster API endpoint, scheme included
   * (e.g. "http://bao.openbao.svc.cluster.local:8200" — https when
   * TLS is enabled). What secret-consuming addons (external-secrets
   * ClusterSecretStore, cert-manager Vault issuers) should point at.
   */
  string api_endpoint = 6;

  /**
   * API port (8200).
   */
  string port = 7;

  /**
   * The server ServiceAccount name — the identity to bind cloud IAM
   * (auto-unseal KMS access) and OpenBao Kubernetes-auth trust to.
   */
  string service_account_name = 8;

  /**
   * Copy-paste command for reaching the API from a workstation.
   */
  string port_forward_command = 9;

  /**
   * The backup job's ServiceAccount (`<name>-backup`) — the identity to
   * bind the object store's cloud IAM to (a GcpGkeWorkloadIdentityBinding's
   * `ksa_name`, an IRSA trust policy's subject) and the
   * `bound_service_account_names` of the login recipe. Empty when
   * `backup` is not declared.
   */
  string backup_service_account_name = 10;

  /**
   * The OpenBao policy the login recipe writes for the backup job
   * (`<name>-backup`; read on `sys/storage/raft/snapshot`). Empty when
   * `backup` is not declared.
   */
  string backup_policy_name = 11;

  /**
   * The Kubernetes-auth role the backup job logs in with (`<name>-backup`
   * unless `backup.auth.role` names another). Empty when `backup` is not
   * declared.
   */
  string backup_auth_role = 12;

  /**
   * The backup CronJob (`<name>-backup`) — `kubectl create job
   * --from=cronjob/<this> <run-name>` triggers a snapshot on demand.
   * Empty when `backup` is not declared.
   */
  string backup_cron_job_name = 13;

  /**
   * The restore Job (`<name>-restore-<8 hex>`, the hex hashing the
   * declaration) when `restore` is declared — `kubectl logs job/<this>`
   * is where the restore explains itself. Empty otherwise.
   */
  string restore_job_name = 14;
}
