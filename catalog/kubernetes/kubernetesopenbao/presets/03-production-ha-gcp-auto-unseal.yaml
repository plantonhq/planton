apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOpenBao
metadata:
  name: openbao
spec:
  namespace:
    value: openbao
  createNamespace: true
  server:
    raft:
      dataStorage:
        size: 10Gi
    replicas: 3
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    auditStorage:
      size: 10Gi
  autoUnseal:
    gcpKms:
      project:
        value: my-gcp-project
      region: global
      keyRing:
        value: openbao-unseal
      cryptoKey:
        value: openbao-unseal-key
      workloadIdentityServiceAccount:
        value: openbao-unseal@my-gcp-project.iam.gserviceaccount.com
  serviceAccount:
    annotations:
      iam.gke.io/gcp-service-account: openbao-unseal@my-gcp-project.iam.gserviceaccount.com
  uiEnabled: true
  metrics:
    enabled: true
