apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOpenBao
metadata:
  name: openbao
spec:
  namespace:
    value: openbao
  createNamespace: true
  server:
    raft:
      dataStorage:
        size: 10Gi
    replicas: 3
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    auditStorage:
      size: 10Gi
  backup:
    # Hourly snapshots, two weeks of them: the schedule is the recovery-point
    # objective, retention is object age under the prefix.
    schedule: "0 * * * *"
    retentionDays: 14
    objectStore:
      # One prefix per live vault, forever: retention prunes under it, and a
      # restore target declares this same prefix to read the snapshots back.
      prefix: openbao/openbao
      r2:
        # The store in R2's own words — the bucket, the account and
        # jurisdiction it lives in, all by reference to the bucket resource,
        # so the S3 host the module composes always matches where the bucket
        # lives (an eu/fedramp/us bucket is served only through its own host).
        bucket:
          valueFrom:
            kind: CloudflareR2Bucket
            name: openbao-snapshots
            fieldPath: status.outputs.bucket_name
        accountId:
          valueFrom:
            kind: CloudflareR2Bucket
            name: openbao-snapshots
            fieldPath: status.outputs.account_id
        jurisdiction:
          valueFrom:
            kind: CloudflareR2Bucket
            name: openbao-snapshots
            fieldPath: status.outputs.jurisdiction
        # The credential is a CloudflareAccountApiToken carrying `Workers R2
        # Storage Bucket Item Write` on this bucket; the token kind exports
        # itself as the S3 key pair R2 authenticates. No key is typed here,
        # and there is no keyless posture for R2 from any cluster.
        credentials:
          accessKeyId:
            valueFrom:
              kind: CloudflareAccountApiToken
              name: openbao-snapshots-writer
              fieldPath: status.outputs.r2_access_key_id
          secretAccessKey:
            valueFrom:
              kind: CloudflareAccountApiToken
              name: openbao-snapshots-writer
              fieldPath: status.outputs.r2_secret_access_key
  uiEnabled: true
  metrics:
    enabled: true
