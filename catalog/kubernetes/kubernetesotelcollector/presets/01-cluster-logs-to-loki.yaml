apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOtelCollector
metadata:
  name: cluster-logs
spec:
  namespace:
    value: observability
  mode: daemonset
  configYaml: |
    extensions:
      file_storage:
        directory: /var/lib/otelcol-checkpoints
    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        # The collector's own pods (<name>-collector-<hash>); reading them would echo every export
        # error back into the stream it is failing to send.
        exclude:
          - /var/log/pods/observability_cluster-logs-collector-*/*/*.log
        # Resume from the last offset after a restart instead of skipping or re-sending.
        storage: file_storage
        # The container parser reads pod, namespace and container from the file path, which the
        # receiver records only when asked; without it every line fails to parse.
        include_file_path: true
        operators:
          - type: container
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      k8sattributes: {}
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      batch: {}
    exporters:
      otlphttp:
        # Replace the host with your KubernetesLoki gateway service —
        # Loki ingests OTLP at the gateway's /otlp route.
        endpoint: http://loki-gateway.observability.svc.cluster.local:80/otlp
        # Lines read while Loki is away wait on the node's disk and are retried without a deadline.
        sending_queue:
          storage: file_storage
        retry_on_failure:
          max_elapsed_time: 0
    service:
      extensions: [file_storage]
      pipelines:
        logs:
          receivers: [filelog, otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp]
  serviceAccount: otel-logs-collector
  volumes:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
      hostPath:
        path: /var/log/pods
        type: Directory
    - name: checkpoints
      mountPath: /var/lib/otelcol-checkpoints
      hostPath:
        path: /var/lib/otelcol-checkpoints
        type: DirectoryOrCreate
  scheduling:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  # Container runtimes write pod log files readable only by root — the
  # default collector image runs non-root and the filelog receiver
  # would report permission errors instead of shipping logs.
  podSecurityContext:
    runAsUser: 0
