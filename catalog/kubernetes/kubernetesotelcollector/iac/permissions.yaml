# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: kubernetesotelcollector
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubernetes_namespace_v1.namespace -- created and owned only when spec.create_namespace is true; get is needed for refresh either way. delete applies only to module-owned namespaces.
      - api_groups:
          - opentelemetry.io
        resources:
          - opentelemetrycollectors
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers kubectl_manifest.otel_collector (Terraform, server-side apply) and the Pulumi twin's untyped CustomResource in otel_collector_cr.go -- the single opentelemetry.io/v1beta1 OpenTelemetryCollector CR. The workload (Deployment/DaemonSet/StatefulSet per mode), the receiver/headless/monitoring Services, and the rendered config ConfigMap are created by the OPERATOR under its own identity, not by the runner. Deletion cascades in the Background so the operator's ownership references own the teardown. The RBAC a cluster-reading pipeline needs at RUNTIME rides composed KubernetesServiceAccount/KubernetesRbac resources (spec.service_account), not this runner.
      - api_groups:
          - opentelemetry.io
        resources:
          - opentelemetrycollectors
        verbs:
          - list
          - watch
        cluster_scoped: false
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the OpenTelemetryCollector in otel_collector_cr.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - list
          - watch
        cluster_scoped: true
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Namespace in namespace.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
