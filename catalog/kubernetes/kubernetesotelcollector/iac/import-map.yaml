apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesotelcollector
spec:
  # One kubectl_manifest — the OpenTelemetryCollector CR, named after
  # metadata.name — plus the optional anchor namespace. Everything the
  # operator creates from the CR (the workload, the -collector /
  # -collector-headless / -collector-monitoring Services, the rendered
  # config ConfigMap) is operator-owned and never imported.
  values:
    - name: api_version
      derivations:
        - literal: opentelemetry.io/v1beta1
      where_to_find: >-
        Always "opentelemetry.io/v1beta1" — the CR's group/version (the
        operator's storage version at the pinned 0.156 release).
    - name: kind
      derivations:
        - literal: OpenTelemetryCollector
      where_to_find: Always "OpenTelemetryCollector" — the CR kind this module applies.
    - name: name
      derivations:
        - from_metadata_name: true
        - from_output: collector_name
      where_to_find: >-
        The collector CR's metadata.name (equals the Planton resource
        name) — `kubectl get opentelemetrycollectors.opentelemetry.io -A`
        (NAME column).
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The collector's namespace —
        `kubectl get opentelemetrycollectors.opentelemetry.io -A`
        (NAMESPACE column).
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the collector's
        namespace itself.
