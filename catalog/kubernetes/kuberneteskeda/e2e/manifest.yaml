# Full-surface test manifest: exercises every typed arm of the spec so the
# offline plan proofs cover what the live lanes may not. Not a realistic
# production shape — see presets for those.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKeda
metadata:
  name: hack-keda
spec:
  namespace:
    value: hack-keda
  createNamespace: true
  chartVersion: "2.20.1"
  crds:
    install: true
    keepOnUninstall: true
  watchNamespace: hack-keda-apps
  operator:
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 1000Mi
  metricsServer:
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 1000Mi
  webhooks:
    enabled: true
    failurePolicy: Fail
    replicas: 2
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 200Mi
  podIdentity:
    awsIrsa:
      enabled: true
      roleArn: arn:aws:iam::123456789012:role/hack-keda-scalers
  certificates:
    type: cert_manager
    certManagerIssuer:
      clusterIssuer:
        name:
          value: hack-cluster-issuer
  httpTimeoutMs: 5000
  priorityClassName: system-cluster-critical
  nodeSelector:
    kubernetes.io/os: linux
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  prometheus:
    enabled: true
    serviceMonitor: false
  helmValues: |
    asciiArt: false
