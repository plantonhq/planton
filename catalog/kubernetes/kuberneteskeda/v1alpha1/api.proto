syntax = "proto3";

package dev.planton.kubernetes.kuberneteskeda.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kuberneteskeda/v1alpha1/outputs.proto";
import "catalog/kubernetes/kuberneteskeda/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesKeda installs KEDA — Kubernetes Event-Driven Autoscaling — on a
// cluster from the official Helm chart: the operator, the external-metrics
// API server, and the admission webhooks that together scale workloads on
// real-world signals, including scale-to-zero.
message KubernetesKeda {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesKeda'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesKedaSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesKedaStatus status = 5;
}

// KubernetesKedaStatus holds the deployment status and outputs.
message KubernetesKedaStatus {
  // outputs
  KubernetesKedaOutputs outputs = 1;
}
