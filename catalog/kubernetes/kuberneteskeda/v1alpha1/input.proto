syntax = "proto3";

package dev.planton.kubernetes.kuberneteskeda.v1alpha1;

import "catalog/kubernetes/kuberneteskeda/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// Input for the KubernetesKeda IaC stack. The platform resolves all
// StringValueOrRef references (namespace, cert-manager issuer name) to
// literal strings before passing this to the IaC engine.
message KubernetesKedaIacInput {
  // Target infra-component.
  KubernetesKeda target = 1;
  // Kubernetes provider configuration (cluster credentials).
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
