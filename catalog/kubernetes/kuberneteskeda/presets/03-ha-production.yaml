apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKeda
metadata:
  name: keda
spec:
  namespace:
    value: keda # upstream convention
  createNamespace: true # the module creates (and owns) the namespace
  operator:
    # Warm standby (leader-elected) — failover capacity, not horizontal scale.
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  metricsServer:
    # The HPA controller reads external.metrics.k8s.io through this — the
    # standby replica reduces failover downtime for every KEDA-driven HPA.
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  webhooks:
    replicas: 2
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
  # The autoscaling engine should outlive workload evictions — pods that
  # scale on KEDA stop scaling without it.
  priorityClassName: system-cluster-critical
  httpTimeoutMs: 5000 # roomier than the 3000ms chart default for slow metric sources
  certificates:
    # cert-manager issues and renews KEDA's internal TLS (operator ↔
    # metrics server ↔ webhooks) instead of operator-self-generated certs.
    type: cert_manager
    certManagerIssuer:
      clusterIssuer:
        name:
          valueFrom:
            name: platform-ca
  prometheus:
    enabled: true # operator + metrics-server /metrics (scaler latencies, trigger errors)
    # Requires the Prometheus operator CRDs on the cluster — the release
    # FAILS to install without them.
    serviceMonitor: true
