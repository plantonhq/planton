syntax = "proto3";

package dev.planton.kubernetes.kuberneteslocust.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kuberneteslocust/v1alpha1/outputs.proto";
import "catalog/kubernetes/kuberneteslocust/v1alpha1/spec.proto";
import "shared/metadata.proto";

//locust-kubernetes
message KubernetesLocust {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesLocust'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesLocustSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesLocustStatus status = 5;
}

//locust-kubernetes status.
message KubernetesLocustStatus {
  //outputs
  KubernetesLocustOutputs outputs = 1;
}
