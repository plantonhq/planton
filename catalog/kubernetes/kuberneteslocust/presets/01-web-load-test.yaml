apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesLocust
metadata:
  name: load-test
spec:
  namespace:
    value: load-test
  create_namespace: true
  load_test:
    inline:
      locustfile_content: |
        from locust import HttpUser, task, between


        class WebsiteUser(HttpUser):
            wait_time = between(1, 2)

            @task(3)
            def get_index(self):
                self.client.get("/")

            @task
            def get_health(self):
                self.client.get("/healthz")
    # Point at the service you want to load-test — a literal URL or a
    # reference to another resource's exported endpoint.
    target_host:
      value: http://my-app.my-namespace.svc.cluster.local:8080
  workers:
    replicas: 2
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
  # Everything else is the kind's defaults — and the defaults are
  # deliberately SECURED: the web-UI login is ON with a
  # module-generated credential (Secret `load-test-auth`, key
  # `password` — upstream ships the UI OPEN, able to fire load at any
  # reachable host; that never deploys from this kind).
