# EKS batch cluster for Kubernetes real-cluster E2E lanes (aws-eks profile).
#
# One cluster per batch, created by bootstrap.sh, reused across every lane in
# the batch, deleted by teardown.sh. Scenarios reach it through the harness's
# external-cluster lane (PLANTON_E2E_KUBECONFIG) with the profile declaration
# PLANTON_E2E_CLUSTER_PROFILE=aws-eks.
#
# Shape rationale (each element serves specific lanes):
#   - karpenter.sh/discovery cluster tag propagates to the cluster security
#     group; subnets are tagged by bootstrap.sh (eksctl only propagates
#     metadata tags to resources CloudFormation creates directly).
#   - system: fixed two-node group that hosts every kind under test.
#     Deliberately UNTAGGED for cluster-autoscaler discovery so the CA lane
#     can only ever scale the group built for it.
#   - ca-scale: min 0 / max 2 group carrying the CA auto-discovery tags
#     (k8s.io/cluster-autoscaler/enabled + /<cluster-name> — the contract in
#     the pinned autoscaler clone's AWS README). Tainted so nothing schedules
#     onto it except the CA lane's tolerating burst pods: an untainted second
#     group would let ordinary lane workloads wander onto nodes the CA lane
#     scales to zero mid-run.
#   - iamIdentityMappings admits KarpenterNodeRole nodes (created by the
#     vendored karpenter-prerequisites CloudFormation) into the cluster —
#     Karpenter-launched nodes join through it.
#   - addons: EBS CSI (with pod-identity credentials) + snapshot-controller
#     serve the PVC data-source and Velero CSI-snapshot lanes; gp2 (in-tree)
#     is not snapshot-capable, so bootstrap.sh also applies a gp3
#     StorageClass and a VolumeSnapshotClass.
#   - IRSA roles for the kinds under test are created by bootstrap.sh
#     (roleOnly — the Helm charts create the ServiceAccounts; the roles'
#     trust policies bind to each chart's rendered SA name, verified in the
#     modules' vars.go/locals.go derivations).
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: planton-e2e-eks
  region: us-west-2
  # Karpenter 1.14 supports Kubernetes through 1.35 per the pinned clone's
  # compatibility matrix (1.36 is listed against the 1.13 line only).
  version: "1.35"
  tags:
    karpenter.sh/discovery: planton-e2e-eks
    planton.dev/purpose: e2e

iam:
  withOIDC: true

iamIdentityMappings:
  - arn: arn:aws:iam::859666865785:role/KarpenterNodeRole-planton-e2e-eks
    username: system:node:{{EC2PrivateDNSName}}
    groups:
      - system:bootstrappers
      - system:nodes

managedNodeGroups:
  - name: system
    instanceType: t3.large
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 40
    labels:
      planton.dev/e2e-node-role: system
  - name: ca-scale
    instanceType: t3.medium
    desiredCapacity: 0
    minSize: 0
    maxSize: 2
    volumeSize: 20
    labels:
      planton.dev/e2e-node-role: ca-scale
    taints:
      - key: planton.dev/e2e-ca-scale
        value: "true"
        effect: NoSchedule
    tags:
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/planton-e2e-eks: "owned"

addonsConfig:
  autoApplyPodIdentityAssociations: true

addons:
  - name: eks-pod-identity-agent
  - name: aws-ebs-csi-driver
  - name: snapshot-controller
