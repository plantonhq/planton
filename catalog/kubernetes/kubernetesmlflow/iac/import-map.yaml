apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesmlflow
spec:
  # Module-owned typed manifests: the tracking-server Deployment and
  # Service named after metadata.name, the optional anchor namespace,
  # the module-owned Secrets and PVCs, the optional gc CronJob
  # ("<name>-gc") and the optional ServiceMonitor ("<name>-metrics",
  # a composed-ID kubectl_manifest). Conditional resources exist only
  # with their arms: the data PVC + the sqlite paths only on the sqlite
  # backend, the artifacts PVC only on the PVC artifact arm, the
  # backend-URI Secret only on the database arms (its data recomposes
  # identically on the first post-adoption apply — the same referenced
  # credential feeds the same URI composition), the admin Secret + its
  # random companion only when module-generated, the auth-config Secret
  # only with auth enabled, the read-anchor ConfigMap only when a
  # referenced credential is read.
  values:
    - name: deployment_name
      derivations:
        - from_metadata_name: true
      where_to_find: >-
        The tracking-server Deployment shares the resource's name —
        `kubectl get deployments -n <namespace>`.
    - name: deployment_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `kubectl get deployments -A` (NAMESPACE column).
    - name: service_name
      derivations:
        - from_metadata_name: true
        - from_output: service
      where_to_find: >-
        The Service shares the resource's name —
        `kubectl get services -n <namespace>`.
    - name: service_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same namespace as the server.
    # ── the optional anchor namespace ──────────────────────────────────
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the installation
        namespace itself.
    # ── the module-owned PVCs ───────────────────────────────────────────
    - name: pvc_name
      tofu_resource_name: data
      derivations:
        - from_metadata_name_suffix: "-data"
      where_to_find: >-
        "<resource-name>-data" on the sqlite backend arm only (tracking
        db + auth db) — `kubectl get pvc -n <namespace>`.
    - name: pvc_namespace
      tofu_resource_name: data
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same namespace as the server.
    - name: pvc_name
      tofu_resource_name: artifacts
      derivations:
        - from_metadata_name_suffix: "-artifacts"
      where_to_find: >-
        "<resource-name>-artifacts" on the PVC artifact arm only —
        `kubectl get pvc -n <namespace>`.
    - name: pvc_namespace
      tofu_resource_name: artifacts
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same namespace as the server.
    # ── the admin credential + random companion ─────────────────────────
    - name: secret_name
      tofu_resource_name: admin_auth
      derivations:
        - from_metadata_name_suffix: "-admin-auth"
      where_to_find: >-
        "<resource-name>-admin-auth" when the module generated the
        admin password (an existing admin_password_secret reference or
        disabled auth creates nothing) —
        `kubectl get secrets -n <namespace>` (key password).
    - name: secret_namespace
      tofu_resource_name: admin_auth
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same namespace as the server.
    - name: password_value
      tofu_resource_name: admin_password
      derivations:
        - from_cluster_secret_key:
            name_suffix: "-admin-auth"
            key: password
      where_to_find: >-
        SECRET MATERIAL — handle accordingly. kubectl get secret
        <resource-name>-admin-auth -n <namespace>
        -o jsonpath='{.data.password}' | base64 -d
    # ── the composed Secrets (recompose after adoption) ──────────────────
    - name: secret_name
      tofu_resource_name: backend_uri
      derivations:
        - from_output: backend_store_uri_secret_name
        - from_metadata_name_suffix: "-backend-uri"
      where_to_find: >-
        "<resource-name>-backend-uri" on the postgres/mysql backend
        arms only (key uri — the SQLAlchemy URI composed from the
        referenced credential Secret).
    - name: secret_namespace
      tofu_resource_name: backend_uri
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same namespace as the server.
    - name: secret_name
      tofu_resource_name: auth_config
      derivations:
        - from_metadata_name_suffix: "-auth-config"
      where_to_find: >-
        "<resource-name>-auth-config" whenever auth is enabled (keys
        basic_auth.ini — the server's basic-auth configuration — and
        flask_secret_key — the CSRF signing key the auth app requires).
    - name: secret_namespace
      tofu_resource_name: auth_config
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same namespace as the server.
    - name: password_value
      tofu_resource_name: flask_secret_key
      derivations:
        - from_cluster_secret_key:
            name_suffix: "-auth-config"
            key: flask_secret_key
      where_to_find: >-
        SECRET MATERIAL — handle accordingly. kubectl get secret
        <resource-name>-auth-config -n <namespace>
        -o jsonpath='{.data.flask_secret_key}' | base64 -d
    # ── the deferred-read anchor ConfigMap ───────────────────────────────
    - name: config_map_name
      derivations:
        - from_metadata_name_suffix: "-read-anchor"
      where_to_find: >-
        "<resource-name>-read-anchor" whenever a referenced credential
        Secret is read (database arms, bring-your-own admin password) —
        the marker that defers the read to apply time;
        `kubectl get configmaps -n <namespace>`.
    - name: config_map_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same namespace as the server.
    # ── the optional gc CronJob ──────────────────────────────────────────
    - name: cron_job_name
      derivations:
        - from_metadata_name_suffix: "-gc"
      where_to_find: >-
        "<resource-name>-gc" when gc.enabled —
        `kubectl get cronjobs -n <namespace>`.
    - name: cron_job_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same namespace as the server.
    # ── the optional ServiceMonitor (composed-ID kubectl_manifest) ──────
    - name: api_version
      derivations:
        - literal: monitoring.coreos.com/v1
      where_to_find: >-
        Fixed — the Prometheus operator's monitoring API group.
    - name: kind
      derivations:
        - literal: ServiceMonitor
      where_to_find: >-
        Fixed.
    - name: name
      derivations:
        - from_metadata_name_suffix: "-metrics"
      where_to_find: >-
        "<resource-name>-metrics" when metrics.service_monitor_enabled —
        `kubectl get servicemonitors -n <namespace>`.
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same namespace as the server.
