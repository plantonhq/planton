# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: kubernetesmlflow
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubernetes_namespace_v1.mlflow -- created and owned only when spec.create_namespace is true; get is needed for refresh either way. delete applies only to module-owned namespaces.
      - api_groups:
          - ""
        resources:
          - secrets
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the module-owned Secrets -- kubernetes_secret_v1.admin_auth (the generated admin password, unless a BYO Secret is referenced), backend_uri (the composed connection URI on the postgres/mysql arms), and auth_config (the basic-auth ini plus the Flask CSRF signing key, rendered while auth is enabled) -- plus read access for the referenced credentials (data.kubernetes_secret_v1.db_password on external backends, byo_admin_password when auth uses an existing Secret).
      - api_groups:
          - ""
        resources:
          - configmaps
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers kubernetes_config_map_v1.read_anchor -- the module's marker ConfigMap deferring credential data-source reads to apply time; rendered only on external backend arms or BYO admin Secrets.
      - api_groups:
          - ""
        resources:
          - persistentvolumeclaims
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers kubernetes_persistent_volume_claim_v1.data (the sqlite backend PVC, rendered when the backend store is absent or on the sqlite_pvc arm) and kubernetes_persistent_volume_claim_v1.artifacts (the local artifact PVC, rendered when the artifact store is absent or on the pvc arm). Both ReadWriteOnce.
      - api_groups:
          - ""
        resources:
          - services
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers kubernetes_service_v1.mlflow -- the front-door Service, ClusterIP unless spec.service.type opts into LoadBalancer/NodePort.
      - api_groups:
          - apps
        resources:
          - deployments
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers kubernetes_deployment_v1.mlflow -- the tracking-server Deployment (Recreate strategy whenever an RWO PVC binds; rollout waiting stays on, so read access supports the wait).
      - api_groups:
          - batch
        resources:
          - cronjobs
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers kubernetes_cron_job_v1.gc -- the mlflow gc CronJob, rendered only when spec.gc.enabled is true.
      - api_groups:
          - monitoring.coreos.com
        resources:
          - servicemonitors
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers kubectl_manifest.service_monitor -- the ServiceMonitor rendered only when spec.metrics.service_monitor_enabled is true (requires the Prometheus operator CRDs on the cluster; deploying without them fails loudly by design).
      - api_groups:
          - apps
        resources:
          - replicasets
        verbs:
          - list
          - watch
        cluster_scoped: false
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. The readiness wait on the Deployment in deployment.go reads replicasets at deployment.go:174-175 before it starts its timeout. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
      - api_groups:
          - batch
        resources:
          - cronjobs
        verbs:
          - list
          - watch
        cluster_scoped: false
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the CronJob in satellites.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
      - api_groups:
          - monitoring.coreos.com
        resources:
          - servicemonitors
        verbs:
          - list
          - watch
        cluster_scoped: false
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the ServiceMonitor in satellites.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
      - api_groups:
          - storage.k8s.io
        resources:
          - storageclasses
        verbs:
          - get
        cluster_scoped: true
        provenance: derived
        notes: Pulumi only -- get on the claim's StorageClass, which pulumi-kubernetes v4.33.0 reads while it awaits the PersistentVolumeClaim in satellites.go to learn the class's binding mode, at provider/pkg/await/awaiters.go:288-349. Without it the provider cannot tell that a claim under a WaitForFirstConsumer class is correctly Pending until a pod uses it, awaits Bound instead, and fails the deploy after five minutes. OpenTofu's provider never reads the class. StorageClasses are cluster-scoped.
      - api_groups:
          - ""
        resources:
          - endpoints
          - events
          - persistentvolumeclaims
          - pods
          - secrets
          - services
        verbs:
          - list
          - watch
        cluster_scoped: false
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the PersistentVolumeClaim in satellites.go, the Secret in secrets.go, and the Service in satellites.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. The readiness wait on the Deployment in deployment.go and the Service in satellites.go reads endpoints at service.go:147-148, persistentvolumeclaims at deployment.go:194-195, pods at deployment.go:184-185, and services at service.go:137-138 before it starts its timeout. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing. Events are read differently. While it waits on the Deployment in deployment.go, the PersistentVolumeClaim in satellites.go, and the Service in satellites.go, the provider also watches the object's events, at await.go:352 and watchers.go:202-241, for the Warning events a person watching the deploy sees, such as FailedScheduling or an image pull back-off. That informer runs beside the wait, so without events the warnings go silent rather than the deploy hanging. Listing or watching Secrets returns their data, not only their names, so this grants read of every Secret in the namespace. Pulumi's delete wait cannot watch a deleted Secret without it.
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - list
          - watch
        cluster_scoped: true
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Namespace in namespace.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
