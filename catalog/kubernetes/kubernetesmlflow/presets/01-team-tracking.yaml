apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesMlflow
metadata:
  name: mlflow
spec:
  namespace:
    value: mlflow
  create_namespace: true
  # Everything else is the kind's defaults — and the defaults are
  # deliberately SECURED and self-contained: basic authentication ON
  # with a module-generated admin password (Secret `mlflow-admin-auth`,
  # key `password` — upstream's open server and its admin/password1234
  # example never ship), tracking state on a 5Gi sqlite PVC, artifacts
  # on a 10Gi PVC served through the tracking server (clients never
  # need storage credentials).
