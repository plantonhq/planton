syntax = "proto3";

package dev.planton.kubernetes.kubernetesmlflow.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesmlflow/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesmlflow/v1alpha1/spec.proto";
import "shared/metadata.proto";

//mlflow-kubernetes
message KubernetesMlflow {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesMlflow'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesMlflowSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesMlflowStatus status = 5;
}

//mlflow-kubernetes status.
message KubernetesMlflowStatus {
  //outputs
  KubernetesMlflowOutputs outputs = 1;
}
