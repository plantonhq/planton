# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetesmetricsserver
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: metrics-server stores nothing -- live CPU/memory samples are held in memory and served on demand; nothing rests on disk beyond its configuration in etcd, whose encryption is the cluster control plane's property.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Customer-managed keys apply to the cluster's etcd encryption (see enc-at-rest); this spec has no seam for them.
    - control_id: enc-in-transit
      status: configurable
      field_path: tls.type
      evidence:
        type: spec_default
        reference: Every path is encrypted, but verification is the choice. The default self_signed serving certificate pairs with api_service.insecure_skip_tls_verify (default true) -- the API server encrypts but does not verify; tls type helm or cert_manager gives a verifiable chain with the APIService caBundle wired automatically, and insecure_skip_tls_verify false then enforces it.
      notes: The scrape path has its own twin -- kubelet_insecure_tls skips kubelet certificate verification, REQUIRED on kind/k3s/kubeadm-style clusters whose kubelets serve self-signed certificates, and rightly false on managed clouds. The 03-ha-verified-tls preset takes the fully verified posture.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The chart renders no external exposure -- the metrics Service is ClusterIP only, and the metrics.k8s.io API is consumed through the Kubernetes API aggregation layer, never from outside the cluster.
      notes: host_network moves the pod onto the node network for clusters whose API server cannot reach pod IPs; it remains cluster-internal.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The only inbound traffic is the Kubernetes API server proxying metrics.k8s.io reads through the aggregation layer; there is no user-facing ingress surface to restrict.
    - control_id: edge-protection
      status: not_applicable
      notes: metrics-server serves no HTTP edge traffic -- web application firewalls do not apply.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The chart creates a dedicated ServiceAccount bound to chart-rendered roles scoped to the function -- reading node and pod metadata plus the kubelets' metrics endpoints, and the aggregation-layer auth-delegation bindings; nothing broader.
    - control_id: workload-identity
      status: not_applicable
      notes: The spec carries no cloud credential seam -- metrics-server talks only to kubelets and the Kubernetes API with its in-cluster ServiceAccount identity.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: metrics-server exposes no authentication surface of its own -- API access rides the cluster's aggregation layer authentication, and its kubelet scrapes authenticate with its ServiceAccount token. There is no weaker path to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: metrics-server performs no administrative actions -- it reads kubelet metrics and serves them; administrative changes to the component are Kubernetes API operations, captured by the target cluster's audit policy.
    - control_id: monitoring-integration
      status: configurable
      field_path: prometheus.enabled
      evidence:
        type: spec_default
        reference: Chart default false -- metrics-server's OWN /metrics endpoint (scrape performance, request latencies) is not exposed; prometheus.enabled opens it and prometheus.service_monitor adds scrape discovery, with validation tying the ServiceMonitor to the endpoint existing.
      notes: This is telemetry ABOUT metrics-server -- unrelated to the resource metrics it serves to kubectl top and HPAs.
    - control_id: backup-recovery
      status: not_applicable
      notes: metrics-server holds no data to back up -- its samples are ephemeral in-memory state rebuilt within one scrape cycle, and its configuration lives in etcd under the cluster's own state backup.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backup surface exists (see backup-recovery), so retention does not apply.
    - control_id: multi-zone-ha
      status: configurable
      field_path: replicas
      evidence:
        type: spec_default
        reference: replicas defaults to 1; running 2 with pod_disruption_budget keeps the metrics API failing over between healthy replicas (the spec warns a PDB with a single replica would wedge node drains). priority_class_name defaults to system-cluster-critical so the pipeline outlives workload evictions.
      notes: The 03-ha-verified-tls preset runs 2 replicas with the PDB. During an outage HPAs stop reacting and kubectl top goes dark -- workloads keep their current scale.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither the chart nor the modules offer a deletion-protection flag, and metrics-server holds no data to lose -- uninstalling removes the metrics API (HPAs stop scaling until reinstalled). Protection is operational (namespace RBAC, change review).
    - control_id: managed-patching
      status: configurable
      field_path: chart_version
      evidence:
        type: spec_default
        reference: chart_version pins the installed release (default 3.13.1, shipping metrics-server 0.8.1 -- chart and app versions are numbered independently); changing it re-runs the Helm release deliberately. image.tag can decouple the binary from the chart's tested pair -- the spec steers to bumping chart_version instead.
