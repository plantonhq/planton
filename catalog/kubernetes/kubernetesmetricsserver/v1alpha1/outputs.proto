syntax = "proto3";

package dev.planton.kubernetes.kubernetesmetricsserver.v1alpha1;

// KubernetesMetricsServerOutputs captures observable outputs after the
// metrics-server installation.
message KubernetesMetricsServerOutputs {
  // Kubernetes namespace metrics-server was installed into.
  string namespace = 1;

  // Helm release name (fixed "metrics-server" — one installation per
  // cluster).
  string release_name = 2;

  // Name of the metrics-server Service the APIService routes to.
  string service_name = 3;

  // Name of the registered APIService ("v1beta1.metrics.k8s.io") — the
  // cluster-wide resource-metrics API kubectl top and HPAs consume. Empty
  // when spec.api_service.create is false.
  string api_service_name = 4;
}
