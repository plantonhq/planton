apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesmetricsserver
spec:
  # metrics-server installs as ONE Helm release whose name is fixed to
  # "metrics-server" (the cluster-wide v1beta1.metrics.k8s.io APIService is
  # a singleton — one installation per cluster is an upstream constraint),
  # in the spec's namespace.
  values:
    - name: release_name
      derivations:
        - from_output: release_name
      where_to_find: >-
        Always "metrics-server" — the module fixes the release name.
        Confirm with `helm list -n <namespace>` (NAME column).
    - name: release_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `helm list -A` (NAMESPACE column); conventionally "kube-system".
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the installation
        namespace itself (kube-system installs never import a namespace).
