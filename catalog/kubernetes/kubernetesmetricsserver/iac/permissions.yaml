# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: kubernetesmetricsserver
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubernetes_namespace_v1.metrics_server -- created and owned only when spec.create_namespace is true (kube-system installs, the upstream convention, leave it false); get is needed for refresh either way. delete applies only to module-owned namespaces.
      - api_groups:
          - ""
        resources:
          - services
          - serviceaccounts
          - secrets
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Chart-rendered objects applied by helm_release.metrics_server -- the metrics ClusterIP Service and the metrics-server ServiceAccount. Secrets cover Helm's own release-state Secret plus the Helm-generated serving-certificate Secret on tls type helm; the default self_signed certificate is generated by metrics-server at startup (no Secret), and existing_secret reuses a Secret the operator manages outside this component.
      - api_groups:
          - apps
        resources:
          - deployments
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: The metrics-server Deployment -- the single pod class this component runs (spec.replicas, default 1).
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - clusterroles
          - clusterrolebindings
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: The chart's ClusterRoles and bindings -- the metrics-reader role (node and pod metadata plus the kubelets' metrics endpoints) and the aggregation-layer auth-delegator binding.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - roles
          - rolebindings
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: The extension-apiserver-authentication auth-reader RoleBinding the chart renders in kube-system -- the runner touches THAT namespace even when installing elsewhere.
      - api_groups:
          - apiregistration.k8s.io
        resources:
          - apiservices
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: The v1beta1.metrics.k8s.io APIService -- the cluster-wide singleton that makes this the cluster's resource-metrics provider (the reason one installation per cluster). Rendered while api_service.create is true, the chart default.
      - api_groups:
          - policy
        resources:
          - poddisruptionbudgets
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: The metrics-server PodDisruptionBudget (minAvailable 1) -- rendered only when spec.pod_disruption_budget is true.
      - api_groups:
          - cert-manager.io
        resources:
          - certificates
          - issuers
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Rendered only when tls.type is cert_manager -- the serving Certificate, plus the chart's own self-signed Issuer + root Certificate chain in the installation namespace when no cert_manager_issuer is referenced. Requires cert-manager (KubernetesCertManager) on the cluster.
      - api_groups:
          - monitoring.coreos.com
        resources:
          - servicemonitors
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Rendered only when spec.prometheus.service_monitor is true -- requires the Prometheus operator CRDs on the cluster (the release fails to install without them).
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - list
          - watch
        cluster_scoped: true
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Namespace in namespace.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
