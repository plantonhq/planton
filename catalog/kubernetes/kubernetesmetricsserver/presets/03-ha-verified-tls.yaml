apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesMetricsServer
metadata:
  name: metrics-server
spec:
  namespace:
    value: kube-system
  createNamespace: false
  replicas: 2
  podDisruptionBudget: true
  apiService:
    insecureSkipTlsVerify: false
  tls:
    type: cert_manager
    certManagerIssuer:
      clusterIssuer:
        name:
          valueFrom:
            name: "<your-cluster-issuer>"
