   */
  bool trust_forwarded_proto = 6;

  /**
   * A SameSite attribute.
   */
  enum SameSite {
    same_site_unspecified = 0;
    lax = 1;
    strict = 2;
    none = 3;
  }

  option (buf.validate.message).cel = {
    id: "cookie.same_site_none_needs_secure"
    message: "cookie.same_site none needs a Secure cookie, so it cannot be combined with cookie.insecure"
    expression: "!(this.same_site == 3 && this.insecure)"
  };
}

/**
 * TLS for the router's proxy listener.
 */
message KubernetesAgentSandboxControllerRouterTls {
  /**
   * Serve the proxy over TLS. False keeps the settings below while serving
   * plain HTTP only.
   */
  optional bool enabled = 1 [(dev.planton.shared.options.default) = "true"];

  /**
   * Secret in `agent-sandbox-system` holding the server certificate as
   * `tls.crt` and `tls.key`, typically written by a cert-manager
   * Certificate.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef certificate_secret = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesCertificate,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.secret_name",
    (dev.planton.shared.options.sensitive_exempt_reason) = "Name of an existing kubernetes.io/tls Secret (a reference), not secret material"
  ];

  /**
