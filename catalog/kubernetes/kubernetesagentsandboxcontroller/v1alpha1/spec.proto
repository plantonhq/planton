  enum MtlsMode {
    mtls_mode_unspecified = 0;
    off = 1;
    optional = 2;
    required = 3;
  }

  option (buf.validate.message).cel = {
    id: "router_tls.mtls_needs_client_ca"
    message: "router.tls.mtls_mode optional or required needs client_ca, the CA bundle that verifies client certificates"
    expression: "(this.mtls_mode != 2 && this.mtls_mode != 3) || has(this.client_ca)"
  };
  option (buf.validate.message).cel = {
    id: "router_tls.no_ciphers_with_tls13"
