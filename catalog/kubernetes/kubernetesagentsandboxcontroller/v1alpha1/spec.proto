  /**
   * Cipher suites the listener offers, by Go name. TLS 1.3 suites are not
   * configurable. Empty = Go's defaults.
   */
  repeated string cipher_suites = 8 [(buf.validate.field).repeated = {
    unique: true
    items: {
      cel: {
        id: "router_cipher_suites_format"
        message: "each cipher suite must be a Go cipher-suite name such as \"TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256\""
        expression: "this.matches('^TLS_[A-Z0-9_]+$')"
      }
    }
  }];

  /**
   * A client-certificate verification policy.
