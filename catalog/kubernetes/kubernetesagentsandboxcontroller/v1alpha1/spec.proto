    (dev.planton.shared.options.default) = "180s",
    (buf.validate.field).cel = {
      id: "proxy_timeout_positive"
      message: "proxy.timeout must be a positive Go duration such as \"180s\" or \"10m\""
      expression: "this.matches('^([0-9]+(\\\\.[0-9]+)?(ns|us|ms|s|m|h))+$') && !this.matches('^(0+(\\\\.0+)?(ns|us|ms|s|m|h))+$')"
    }
  ];

  /**
   * Longest wait for a sandbox's response headers (Go duration).
   */
  optional string response_header_timeout = 2 [
    (dev.planton.shared.options.default) = "30s",
    (buf.validate.field).cel = {
      id: "proxy_response_header_timeout_positive"
      message: "proxy.response_header_timeout must be a positive Go duration such as \"30s\""
      expression: "this.matches('^([0-9]+(\\\\.[0-9]+)?(ns|us|ms|s|m|h))+$') && !this.matches('^(0+(\\\\.0+)?(ns|us|ms|s|m|h))+$')"
