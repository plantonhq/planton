   */
  enum StacktraceLevel {
    stacktrace_level_unspecified = 0;
    info = 1;
    error = 2;
    panic = 3;
  }

  /**
   * A timestamp encoding.
   */
  enum TimeEncoding {
    time_encoding_unspecified = 0;
    epoch = 1;
    millis = 2;
    nano = 3;
    iso8601 = 4;
    rfc3339 = 5;
    rfc3339nano = 6;
  }
}

/**
 * The router: an HTTP proxy that forwards a request to the sandbox it names.
 * A caller sets `X-Sandbox-ID` (and `X-Sandbox-Namespace`, `X-Sandbox-Port`),
 * or uses the path form when path_routing_prefix is set. The router keeps
 * upstream's `app: sandbox-router` label, which is what the default
 * SandboxTemplate network policy admits.
 */
message KubernetesAgentSandboxControllerRouter {
  /**
   * Install the router. False keeps the settings below while removing it.
   */
  optional bool enabled = 1 [(dev.planton.shared.options.default) = "true"];

  /**
   * Override the router image. Empty =
   * registry.k8s.io/agent-sandbox/sandbox-router-go at the pinned release
   * (moved to image_registry when that is set).
   */
  dev.planton.kubernetes.ContainerImage image = 2;

  /**
   * Router pods, spread across zones and nodes. Two is the minimum for
   * availability, not a capacity figure; the router is CPU-bound at high
   * request rates.
   */
  optional int32 replicas = 3 [
    (dev.planton.shared.options.default) = "2",
    (buf.validate.field).int32.gte = 1
  ];

  /**
   * Resources for the router container. Empty = upstream's: requests 250m
   * CPU and 256Mi memory, limits 2 CPU and 1Gi.
   */
  dev.planton.kubernetes.ContainerResources resources = 4;

  /**
   * Node selector for the router pods.
   */
  map<string, string> node_selector = 5;

  /**
   * Tolerations for the router pods.
   */
  repeated dev.planton.kubernetes.WorkloadToleration tolerations = 6;

  /**
   * Router pods that must stay up during voluntary disruptions such as node
   * drains (the router's PodDisruptionBudget). It must be lower than
   * replicas, or a drain waits forever. 0 removes the budget.
   */
  optional int32 min_available = 7 [
    (dev.planton.shared.options.default) = "1",
    (buf.validate.field).int32.gte = 0
  ];

  /**
   * Who may reach a sandbox through the router. Required: upstream's default
   * lets every request through, so an open router is chosen, never
   * inherited.
   */
  KubernetesAgentSandboxControllerRouterAuthorization authorization = 8 [(buf.validate.field).required = true];

  /**
   * Serve the proxy over TLS. Absent = plain HTTP only.
   */
  KubernetesAgentSandboxControllerRouterTls tls = 9;

  /**
   * How requests are forwarded to sandboxes.
   */
  KubernetesAgentSandboxControllerRouterProxy proxy = 10;

  /**
   * The router's pod-IP cache.
   */
  KubernetesAgentSandboxControllerRouterCache cache = 11;

  /**
   * Send traces and metrics to an OpenTelemetry collector over OTLP gRPC.
   * Absent = none (the Prometheus /metrics endpoint is always served).
   */
  KubernetesAgentSandboxControllerRouterTelemetry telemetry = 12;

  /**
   * Log one structured line per proxied request (health and metrics
   * requests are skipped).
   */
  optional bool access_log_enabled = 13 [(dev.planton.shared.options.default) = "true"];

  /**
   * The router's plain-HTTP, metrics and health ports.
   */
  KubernetesAgentSandboxControllerRouterPorts ports = 14;

  /**
   * The router's NetworkPolicy.
   */
  KubernetesAgentSandboxControllerRouterNetworkPolicy network_policy = 15;

  // The platform fills replicas (2) and min_available (1) into every
  // manifest before validation.
  option (buf.validate.message).cel = {
    id: "router.budget_below_replicas"
    message: "router.min_available must be lower than router.replicas, or no router pod can ever be drained; lower it, raise replicas, or set it to 0 to remove the budget"
    expression: "!has(this.min_available) || this.min_available == 0 || this.min_available < (has(this.replicas) ? this.replicas : 2)"
  };
  option (buf.validate.message).cel = {
    id: "router.cookie_needs_path_routing"
    message: "router.authorization.cookie needs router.proxy.path_routing_prefix: a browser reaches a sandbox only by path, so without a prefix there is no route for the cookie to protect"
    expression: "!has(this.authorization) || !has(this.authorization.cookie) || (has(this.proxy) && this.proxy.path_routing_prefix != '')"
  };
  option (buf.validate.message).cel = {
    id: "router.verification_keys_need_cache"
    message: "scoped_token.verification_keys need the pod-IP cache: v2 tokens are bound to a sandbox's UID, which only the cache can route; leave router.cache.enabled on"
    expression: "!has(this.authorization) || !has(this.authorization.scoped_token) || !has(this.authorization.scoped_token.verification_keys) || !has(this.cache) || !has(this.cache.enabled) || this.cache.enabled"
  };
  option (buf.validate.message).cel = {
    id: "router.listener_required"
    message: "the router needs a listener: keep router.tls.http_enabled true, or the router serves nothing without TLS"
    expression: "!has(this.tls) || !has(this.tls.http_enabled) || this.tls.http_enabled || !has(this.tls.enabled) || this.tls.enabled"
  };
  option (buf.validate.message).cel = {
    id: "router.distinct_ports"
    message: "the router's HTTP, HTTPS, metrics and health ports must all differ"
    expression: "[has(this.ports) && has(this.ports.http) ? this.ports.http : 8080, has(this.ports) && has(this.ports.metrics) ? this.ports.metrics : 9090, has(this.ports) && has(this.ports.health_probe) ? this.ports.health_probe : 8081, has(this.tls) && has(this.tls.port) ? this.tls.port : 8443].all(p, [has(this.ports) && has(this.ports.http) ? this.ports.http : 8080, has(this.ports) && has(this.ports.metrics) ? this.ports.metrics : 9090, has(this.ports) && has(this.ports.health_probe) ? this.ports.health_probe : 8081, has(this.tls) && has(this.tls.port) ? this.tls.port : 8443].filter(q, q == p).size() == 1)"
  };
}

/**
 * Who may reach a sandbox through the router. Exactly one mode.
 */
message KubernetesAgentSandboxControllerRouterAuthorization {
  oneof mode {
    option (buf.validate.oneof).required = true;

    /**
     * Every request is let through. Anything that can reach the router can
     * reach every sandbox, so pair it with a NetworkPolicy, a Gateway that
     * authenticates, or a cluster you fully trust.
     */
    KubernetesAgentSandboxControllerRouterAllowAll allow_all = 1;

    /**
     * Each request carries a Kubernetes bearer token
     * (`Authorization: Bearer ...`), checked through the TokenReview API.
     * Fits callers that run in the cluster with a ServiceAccount.
     */
    KubernetesAgentSandboxControllerRouterTokenReview token_review = 2;

    /**
     * Each request carries a token scoped to one sandbox, minted out of band
     * by the product that created it: v1 tokens are HMAC-signed with a
     * shared secret, v2 tokens are Ed25519-signed and bound to the sandbox's
     * UID.
     */
    KubernetesAgentSandboxControllerRouterScopedToken scoped_token = 3;
  }

  /**
   * Also accept the credential from a cookie, the one channel a browser
   * attaches to every request, a WebSocket handshake included. Needs
   * token_review or scoped_token, and proxy.path_routing_prefix.
   */
  KubernetesAgentSandboxControllerRouterCookie cookie = 4;

  option (buf.validate.message).cel = {
    id: "authorization.cookie_needs_a_credential"
    message: "authorization.cookie has no effect with allow_all, which authorizes every request regardless; choose token_review or scoped_token, or remove the cookie"
    expression: "!has(this.cookie) || !has(this.allow_all)"
  };
}

/**
 * The open mode, chosen explicitly.
 */
message KubernetesAgentSandboxControllerRouterAllowAll {}

/**
 * Bearer tokens checked through the Kubernetes TokenReview API. The router's
 * ServiceAccount is bound to `system:auth-delegator`, which the deploying
 * identity must be allowed to grant.
 */
message KubernetesAgentSandboxControllerRouterTokenReview {
  /**
   * How long a review's answer is cached (Go duration). Shorter catches a
   * revoked token sooner at the cost of more API server load.
   */
  optional string ttl = 1 [
    (dev.planton.shared.options.default) = "30s",
    (buf.validate.field).cel = {
      id: "token_review_ttl_positive"
      message: "token_review.ttl must be a positive Go duration such as \"30s\" or \"2m\""
      expression: "this.matches('^([0-9]+(\\\\.[0-9]+)?(ns|us|ms|s|m|h))+$') && !this.matches('^(0+(\\\\.0+)?(ns|us|ms|s|m|h))+$')"
    }
  ];

  /**
   * Cached review answers kept before the oldest is evicted.
   */
  optional int32 cache_size = 2 [
    (dev.planton.shared.options.default) = "2048",
    (buf.validate.field).int32.gt = 0
  ];

  /**
   * Refuse requests without a bearer token (401). Off lets tokenless
   * requests through, which only suits a rollout while callers start
   * sending tokens.
   */
  bool require_token = 3;

  /**
   * Audiences a token's `aud` claim must include. Required for projected
   * ServiceAccount tokens minted with an audience. Empty = no audience
   * check.
   */
  repeated string audiences = 4 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {min_len: 1}
    }
  }];
}

/**
 * Per-sandbox tokens minted out of band. Set the v1 secret, the v2 keys, or
 * both while moving from v1 to v2.
 */
message KubernetesAgentSandboxControllerRouterScopedToken {
  /**
   * The shared HMAC-SHA256 secret that verifies v1 tokens, as a key of a
   * Secret in `agent-sandbox-system`.
   */
  KubernetesAgentSandboxControllerSecretKey v1_secret = 1;

  /**
   * The JSON key set of Ed25519 public keys that verifies v2 tokens, as a
   * key of a Secret in `agent-sandbox-system`. Needs the pod-IP cache.
   */
  KubernetesAgentSandboxControllerSecretKey verification_keys = 2;

  /**
   * The moment v1 tokens stop being accepted while v1 and v2 run side by
   * side (RFC 3339, for example "2026-12-31T00:00:00Z", exclusive).
   * Required when both are set.
   */
  string v1_accept_until = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).cel = {
      id: "v1_accept_until_format"
      message: "scoped_token.v1_accept_until must be an RFC 3339 time such as \"2026-12-31T00:00:00Z\""
      expression: "this.matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$')"
    }
  ];

  option (buf.validate.message).cel = {
    id: "scoped_token.verifier_required"
    message: "scoped_token needs v1_secret, verification_keys, or both: otherwise no token can ever be verified"
    expression: "has(this.v1_secret) || has(this.verification_keys)"
  };
  option (buf.validate.message).cel = {
    id: "scoped_token.cutoff_with_both"
    message: "scoped_token.v1_accept_until is required while v1_secret and verification_keys are both set: it is when v1 tokens stop being accepted"
    expression: "!has(this.v1_secret) || !has(this.verification_keys) || this.v1_accept_until != ''"
  };
  option (buf.validate.message).cel = {
    id: "scoped_token.cutoff_needs_v1"
    message: "scoped_token.v1_accept_until applies only to v1 tokens; set v1_secret or remove the cutoff"
    expression: "this.v1_accept_until == '' || has(this.v1_secret)"
  };
}

/**
 * A key of a Secret in `agent-sandbox-system`, mounted into the router as a
 * file.
 */
message KubernetesAgentSandboxControllerSecretKey {
  /**
   * The Secret's name.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef secret = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesSecret,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.secret_name",
    (dev.planton.shared.options.sensitive_exempt_reason) = "Name of an existing Kubernetes Secret (a reference), not secret material"
  ];

  /**
   * The key within the Secret.
   */
  string key = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "secret_key_format"
      message: "key must be a Secret key: letters, digits, \"-\", \"_\" and \".\""
      expression: "this.matches('^[-._a-zA-Z0-9]+$')"
    }
  ];
}

/**
 * A credential carried in a browser cookie.
 */
message KubernetesAgentSandboxControllerRouterCookie {
  /**
   * The cookie's name: letters, digits, "-", "_", "." and "~".
   */
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "cookie_name_format"
      message: "cookie.name must be a cookie-name token: letters, digits, \"-\", \"_\", \".\" and \"~\""
      expression: "this.matches('^[A-Za-z0-9._~-]+$')"
    }
  ];

  /**
   * A URL query parameter that sets the cookie: a GET or HEAD request that
   * presents a valid credential here gets the cookie, scoped to exactly the
   * sandbox it authorized, and is redirected to the same URL without the
   * parameter, so the credential spends the least time in URLs, history and
   * Referer headers. Empty = the cookie must be set some other way.
   */
  string query_param = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).cel = {
      id: "cookie_query_param_format"
      message: "cookie.query_param must be a token: letters, digits, \"-\", \"_\", \".\" and \"~\""
      expression: "this.matches('^[A-Za-z0-9._~-]+$')"
    }
  ];

  /**
