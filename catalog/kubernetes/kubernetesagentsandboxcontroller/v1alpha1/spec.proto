    }
  ];

  /**
   * Largest request body accepted, in bytes. 0 = no limit.
   */
  int64 max_request_body_bytes = 4 [(buf.validate.field).int64.gte = 0];

  /**
   * Accept a loopback address (127.0.0.0/8, ::1) in X-Sandbox-Pod-IP. Only
   * for a router running as a sidecar beside its sandbox, or tests against
   * localhost; link-local, multicast and unspecified addresses stay refused.
   */
  bool allow_loopback_pod_ip = 5;

  /**
   * A path prefix that also lets a caller address a sandbox by URL:
   * <prefix>/<namespace>/<id>/<port>/<rest>. Browsers need it: a WebSocket
   * handshake cannot carry custom headers, so a web IDE's terminal or a dev
   * server's live reload inside a sandbox is reachable only by path. Every
   * path under the prefix is claimed for routing, so pick one no sandbox
   * route uses. Empty = headers only.
   */
  string path_routing_prefix = 6 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).cel = {
      id: "path_routing_prefix_format"
      message: "proxy.path_routing_prefix must start with \"/\", must not end with \"/\", and must not contain spaces, such as \"/sandboxes\""
      expression: "this.matches('^/[^\\\\s]*[^/\\\\s]$')"
    }
  ];

  /**
   * Extra connection attempts when a sandbox cannot be dialed (DNS failure,
   * connection refused) before the router answers 502. Smooths requests to
   * a sandbox that is still starting. 0 = no retries.
   */
  optional int32 upstream_max_retries = 7 [
    (dev.planton.shared.options.default) = "3",
    (buf.validate.field).int32.gte = 0
  ];

  /**
   * Wait before the first retry; each later wait doubles, up to
   * upstream_retry_max_delay (Go duration).
   */
  optional string upstream_retry_initial_delay = 8 [
    (dev.planton.shared.options.default) = "200ms",
    (buf.validate.field).cel = {
      id: "upstream_retry_initial_delay_format"
      message: "proxy.upstream_retry_initial_delay must be a Go duration such as \"200ms\""
      expression: "this.matches('^([0-9]+(\\\\.[0-9]+)?(ns|us|ms|s|m|h))+$')"
    }
  ];

  /**
   * Longest wait between retries (Go duration).
   */
  optional string upstream_retry_max_delay = 9 [
    (dev.planton.shared.options.default) = "800ms",
    (buf.validate.field).cel = {
      id: "upstream_retry_max_delay_format"
      message: "proxy.upstream_retry_max_delay must be a Go duration such as \"800ms\" or \"2s\""
      expression: "this.matches('^([0-9]+(\\\\.[0-9]+)?(ns|us|ms|s|m|h))+$')"
    }
  ];
}

/**
 * The router's pod-IP cache.
 */
message KubernetesAgentSandboxControllerRouterCache {
  /**
   * Watch sandbox pods and dial a cached pod IP for requests that carry
   * X-Sandbox-UID, skipping DNS. Needs read access to pods, which the router
   * gets cluster-wide (it filters system pods out itself). Off = DNS-only
   * routing, and no pod read access.
   */
  optional bool enabled = 1 [(dev.planton.shared.options.default) = "true"];

  /**
   * Watch only this namespace's pods. Empty = every namespace.
   */
  string namespace = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.max_len = 63,
    (buf.validate.field).cel = {
      id: "router_cache_namespace_format"
      message: "router.cache.namespace must be a Kubernetes namespace name: lowercase letters, digits and hyphens, starting and ending with a letter or digit"
      expression: "this.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')"
    }
  ];
}

/**
 * OpenTelemetry export from the router over OTLP gRPC.
 */
message KubernetesAgentSandboxControllerRouterTelemetry {
  /**
   * The collector's OTLP gRPC endpoint, for example
   * "http://otel-collector.observability.svc.cluster.local:4317".
   */
  string otlp_endpoint = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "router_telemetry_otlp_endpoint_format"
      message: "router.telemetry.otlp_endpoint must be a URL such as \"http://otel-collector.observability:4317\""
      expression: "this.matches('^https?://[^/?#\\\\s]+(/[^?#\\\\s]*)?$')"
    }
  ];

  /**
   * Connect to the collector without TLS.
   */
  bool insecure = 2;

  /**
   * Send traces.
   */
  optional bool traces_enabled = 3 [(dev.planton.shared.options.default) = "true"];

  /**
   * Also push metrics (the Prometheus /metrics endpoint stays served).
   */
  optional bool metrics_enabled = 4 [(dev.planton.shared.options.default) = "true"];

  /**
   * Headers sent with every export, read from a key of a Secret in
   * `agent-sandbox-system` in OpenTelemetry's form
   * ("name1=value1,name2=value2"), for example a hosted collector's API key.
   */
  KubernetesAgentSandboxControllerSecretKey headers = 5;
}

/**
 * The router's listener ports.
 */
message KubernetesAgentSandboxControllerRouterPorts {
  /**
   * Port of the plain-HTTP proxy listener, and of the `sandbox-router-svc`
   * Service's `proxy` port that upstream's SDKs dial.
   */
  optional int32 http = 1 [
    (dev.planton.shared.options.default) = "8080",
    (buf.validate.field).int32 = {
      gte: 1
      lte: 65535
    }
  ];

  /**
   * Port of the Prometheus /metrics endpoint.
   */
  optional int32 metrics = 2 [
    (dev.planton.shared.options.default) = "9090",
    (buf.validate.field).int32 = {
      gte: 1
      lte: 65535
    }
  ];

  /**
   * Port of the /healthz and /readyz endpoints the pod's probes use.
   */
  optional int32 health_probe = 3 [
    (dev.planton.shared.options.default) = "8081",
    (buf.validate.field).int32 = {
      gte: 1
      lte: 65535
    }
  ];
}

/**
 * The router's NetworkPolicy, which only takes effect on a cluster whose
 * network enforces NetworkPolicy.
 */
message KubernetesAgentSandboxControllerRouterNetworkPolicy {
  /**
   * Install the router's NetworkPolicy. False leaves the router's traffic
   * unrestricted.
   */
  optional bool enabled = 1 [(dev.planton.shared.options.default) = "true"];

  /**
   * Labels of the namespaces whose pods may send requests to the router,
   * for example {"kubernetes.io/metadata.name": "gateway"} for a Gateway's
   * namespace. Empty = every namespace, which is upstream's starting point;
   * narrow it to your callers.
   */
  map<string, string> client_namespace_labels = 2;

  /**
   * Namespace whose pods may scrape the router's metrics.
   */
  optional string metrics_namespace = 3 [
    (dev.planton.shared.options.default) = "monitoring",
    (buf.validate.field).string.max_len = 63,
    (buf.validate.field).cel = {
      id: "router_metrics_namespace_format"
      message: "router.network_policy.metrics_namespace must be a Kubernetes namespace name: lowercase letters, digits and hyphens, starting and ending with a letter or digit"
      expression: "this.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')"
    }
  ];

  /**
   * Ports the router may open to sandboxes. A sandbox serving on any other
   * port is unreachable through the router behind this policy, so list every
   * port your sandboxes serve. Empty = 8888, upstream's default sandbox
   * port.
   */
  repeated int32 sandbox_ports = 4 [(buf.validate.field).repeated = {
    unique: true
    items: {
      int32: {
        gte: 1
        lte: 65535
      }
    }
  }];
}
