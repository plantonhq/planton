syntax = "proto3";

package dev.planton.kubernetes.kubernetesagentsandboxcontroller.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesagentsandboxcontroller/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesagentsandboxcontroller/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesAgentSandboxController installs agent-sandbox, the Kubernetes SIG
// Apps controller for isolated, stateful AI-agent sandboxes, with its optional
// extensions (templates, warm pools, claims) and its optional router. One
// install per cluster.
message KubernetesAgentSandboxController {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesAgentSandboxController'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesAgentSandboxControllerSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesAgentSandboxControllerStatus status = 5;
}

// KubernetesAgentSandboxControllerStatus describes the observed state of KubernetesAgentSandboxController.
message KubernetesAgentSandboxControllerStatus {
  // outputs
  KubernetesAgentSandboxControllerOutputs outputs = 1;
}
