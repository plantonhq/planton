syntax = "proto3";

package dev.planton.kubernetes.kuberneteskyverno.v1alpha1;

import "catalog/kubernetes/kuberneteskyverno/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// KubernetesKyvernoIacInput defines the inputs required for the IaC modules.
