syntax = "proto3";

package dev.planton.kubernetes.kuberneteskyverno.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kuberneteskyverno/v1alpha1/outputs.proto";
import "catalog/kubernetes/kuberneteskyverno/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesKyverno is a component that installs Kyverno, the
// Kubernetes-native policy engine, on a Kubernetes cluster. Kyverno
// validates, mutates, generates, and cleans up resources using policies
// declared as Kubernetes resources — no new policy language.
//
// This component installs the engine (four controllers + the policy
// CRDs). Policies themselves are separate resources applied once the
// engine runs.
message KubernetesKyverno {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesKyverno'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesKyvernoSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesKyvernoStatus status = 5;
}

// KubernetesKyvernoStatus describes the observed state of the engine.
message KubernetesKyvernoStatus {
  // outputs
  KubernetesKyvernoOutputs outputs = 1;
}
