apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kuberneteskyverno
spec:
  # Kyverno installs as one Helm release NAMED AFTER metadata.name
  # (fullnameOverride pins every chart-derived child name — controllers,
  # the webhook Service, the runtime ConfigMap — the same way), plus the
  # module-owned webhook-GC sentinel ConfigMap and the optional anchor
  # namespace. The module materializes no Secrets: the engine's webhook
  # certificates are RUNTIME-generated by Kyverno itself (or
  # cert-manager-issued in that arm) and travel with the release import.
  values:
    - name: release_name
      derivations:
        - from_output: release_name
        - from_metadata_name: true
      where_to_find: >-
        `helm list -n <namespace>` (NAME column) — the release shares the
        resource's name.
    - name: release_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `helm list -A` (NAMESPACE column); conventionally "kyverno".
    # ── module-owned webhook-GC sentinel ConfigMap ──────────────────────
    # Destroy-ordered belt-and-suspenders for the chart's broken
    # delete-webhooks helper (validating configs survive helm uninstall).
    - name: config_map_name
      tofu_resource_name: webhook_gc
      derivations:
        - from_metadata_name_suffix: "-webhook-gc"
      where_to_find: >-
        Always "<resource-name>-webhook-gc" in the install namespace —
        `kubectl get configmap -n <namespace>`.
    - name: config_map_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same namespace as the Kyverno install.
    # ── the optional anchor namespace ────────────────────────────────────
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the installation
        namespace itself.
