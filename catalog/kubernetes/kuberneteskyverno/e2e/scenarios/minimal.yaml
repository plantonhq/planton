# Kind defaults end to end: all four controllers single-replica,
# runtime-generated webhook certificates, chart-default config. The
# verifier proves the ENGINE on every lane: controllers rolled out, the
# runtime-registered webhook configurations present, then a
# verifier-owned Enforce ClusterPolicy REJECTS a violating Pod and
# ADMITS a compliant one (in a verifier-owned target namespace, swept
# after). Destroy asserts the webhook configurations are GONE — the
# pre-delete cleanup hook is the designed uninstall path.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKyverno
metadata:
  name: e2e-kyv-min
spec:
  namespace:
    value: e2e-kyv-min
  create_namespace: true
