# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: kuberneteskyverno
spec:
  billing_model: cluster_capacity
  cost_drivers:
    - field_path: admission_controller.replicas
      sku_meter: cluster CPU and memory reservations
      impact: The admission controller sits on the cluster's write path (chart default 1 replica; run 3 in production); each replica carries admission_controller.resources.
    - field_path: admission_controller.resources
      sku_meter: cluster CPU and memory reservations
      impact: The admission container's requests are reserved per replica. Empty means the CHART's own defaults apply -- a real reservation the manifest does not state.
    - field_path: admission_controller.autoscaling
      sku_meter: cluster CPU and memory reservations
      impact: When declared, the HPA owns the admission replica count between min_replicas and max_replicas -- the reservation floats with admission load instead of standing fixed.
    - field_path: background_controller
      sku_meter: cluster CPU and memory reservations
      impact: The background controller (mutate-existing and generate rules) runs its own Deployment -- enabled with 1 replica by default; its replicas and resources size it.
    - field_path: cleanup_controller
      sku_meter: cluster CPU and memory reservations
      impact: The cleanup controller (CleanupPolicy reconciliation, with its own webhook) runs its own Deployment -- enabled with 1 replica by default.
    - field_path: reports_controller
      sku_meter: cluster CPU and memory reservations
      impact: The reports controller (PolicyReport aggregation) runs its own Deployment -- enabled with 1 replica by default; disable it on very large clusters using an external report store.
    - field_path: features.policy_reports
      sku_meter: cluster etcd storage
      impact: Policy reports (wgpolicyk8s.io) grow etcd with the cluster's resource and violation counts -- report generation is on by default engine-wide.
  estimate_exclusions:
    - the price of reserved CPU and memory is the target cluster's node economics, which this catalog cannot know
    - when a controller's resources are left empty the chart applies its own default requests and limits -- a reservation the manifest-value footprint cannot state
    - the chart's hook Jobs (pre-delete webhook cleanup, post-upgrade CRD migration) are ephemeral -- capacity only while running
    - the helm_values overlay merges LAST over the typed rendering and can override modeled values, including resources and replicas -- this profile describes the spec's declaration
  notes: "This component creates no cloud SKU of its own -- its footprint is the policy engine's four controllers. The policies it enforces (ClusterPolicy, Policy, CleanupPolicy) are separate resources; evaluating more policies costs the engine's own CPU and memory, never new pods."
