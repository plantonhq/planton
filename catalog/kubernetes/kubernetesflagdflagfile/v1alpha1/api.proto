syntax = "proto3";

package dev.planton.kubernetes.kubernetesflagdflagfile.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesflagdflagfile/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesflagdflagfile/v1alpha1/spec.proto";
import "shared/metadata.proto";

//flagd-flag-file-kubernetes
message KubernetesFlagdFlagFile {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesFlagdFlagFile'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesFlagdFlagFileSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesFlagdFlagFileStatus status = 5;
}

//flagd-flag-file-kubernetes status.
message KubernetesFlagdFlagFileStatus {
  //outputs
  KubernetesFlagdFlagFileOutputs outputs = 1;
}
