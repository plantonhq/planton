# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: kubernetesflagdflagfile
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - configmaps
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers kubernetes_config_map_v1.flag_file (Terraform main.tf; module/main.go in Pulumi) -- the one ConfigMap named after the resource. list and watch are Pulumi only -- pulumi-kubernetes waits on an informer of a deleted ConfigMap until it is gone.
