apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesflagdflagfile
spec:
  # One ConfigMap named after metadata.name, in the spec's namespace.
  values:
    - name: config_map_name
      derivations:
        - from_output: config_map_name
        - from_metadata_name: true
      where_to_find: The resource name -- `kubectl get configmaps -n <namespace>`.
    - name: config_map_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: The namespace the flag file was rendered into.
