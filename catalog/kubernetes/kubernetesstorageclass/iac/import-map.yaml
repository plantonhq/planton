apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesstorageclass
spec:
  # A StorageClass is cluster-scoped: its identity is just its name --
  # derivable from a prior deploy's outputs or from the spec itself.
  values:
    - name: storage_class_name
      derivations:
        - from_output: storage_class_name
        - from_spec_field: name
      where_to_find: >-
        `kubectl get storageclasses` (NAME column).
