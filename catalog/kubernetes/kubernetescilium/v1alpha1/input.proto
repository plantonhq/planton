syntax = "proto3";

package dev.planton.kubernetes.kubernetescilium.v1alpha1;

import "catalog/kubernetes/kubernetescilium/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// Input for the KubernetesCilium IaC stack. The platform resolves all
// StringValueOrRef references (the namespace) to literal strings before
// passing this to the IaC engine.
message KubernetesCiliumIacInput {
  // the catalog object to deploy.
  KubernetesCilium target = 1;
  // Kubernetes provider configuration (cluster credentials).
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
