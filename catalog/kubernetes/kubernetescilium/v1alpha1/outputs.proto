syntax = "proto3";

package dev.planton.kubernetes.kubernetescilium.v1alpha1;

// KubernetesCiliumOutputs captures observable outputs after Cilium is
// installed on the target cluster.
message KubernetesCiliumOutputs {
  // Namespace Cilium was installed into (the resolved spec.namespace).
  string namespace = 1;

  // Helm release name — fixed "cilium" (one dataplane per cluster).
  string release_name = 2;

  // Cluster identity Cilium runs under (the resolved spec.cluster_name) —
  // the name this cluster is known by in Hubble flows and any future
  // Cluster Mesh.
  string cluster_name = 3;

  // Name of the hubble-relay Service (fixed "hubble-relay" by the chart)
  // when hubble.relay is enabled; empty otherwise. The address the hubble
  // CLI and UI read flows from.
  string hubble_relay_service_name = 4;

  // Name of the hubble-ui Service (fixed "hubble-ui" by the chart) when
  // hubble.ui is enabled; empty otherwise — port-forward it to open the
  // service map.
  string hubble_ui_service_name = 5;

  // Name of the GatewayClass Cilium's Gateway API implementation registers
  // (fixed "cilium" by the chart) when gateway_api is enabled; empty
  // otherwise. KubernetesGateway resources reference it via
  // gateway_class_name.
  string gateway_class_name = 6;
}
