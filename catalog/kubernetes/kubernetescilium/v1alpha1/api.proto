syntax = "proto3";

package dev.planton.kubernetes.kubernetescilium.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetescilium/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetescilium/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesCilium installs Cilium — the eBPF-based CNI, network-security,
// and observability engine — on a Kubernetes cluster from the official Helm
// chart, as the primary CNI or chained on top of an existing one.
message KubernetesCilium {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesCilium'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesCiliumSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesCiliumStatus status = 5;
}

// KubernetesCiliumStatus holds the deployment status and outputs.
message KubernetesCiliumStatus {
  // outputs
  KubernetesCiliumOutputs outputs = 1;
}
