# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetescilium
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: Cilium stores no data of its own beyond configuration in Kubernetes objects (etcd) and node-local eBPF maps in kernel memory; encryption at rest for etcd is the cluster control plane's property, not this component's.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Customer-managed keys apply to the cluster's etcd encryption (see enc-at-rest); this spec has no seam for them.
    - control_id: enc-in-transit
      status: configurable
      field_path: encryption
      evidence:
        type: spec_default
        reference: Unset means pod-to-pod traffic crosses the node network in plaintext (the upstream default); encryption.enabled turns on transparent encryption of all pod traffic -- WireGuard (automatic key management, the spec default type) or IPsec -- and encryption.node_encryption extends it to pure node-to-node traffic.
      notes: The 04-production-observability preset enables WireGuard. Cilium's own agent-to-API-server traffic rides the cluster's TLS regardless.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The chart renders no external exposure -- the Hubble relay, UI, and metrics Services are ClusterIP only, reachable solely inside the cluster network.
      notes: gateway_api creates the "cilium" GatewayClass for north-south routing; actual exposure then rides Gateway resources declared separately, never this component.
    - control_id: restricted-ingress
      status: configurable
      field_path: policy_enforcement_mode
      evidence:
        type: spec_default
        reference: Cilium IS the cluster's NetworkPolicy engine. The default mode enforces only where policies select pods; "always" denies everything not explicitly allowed cluster-wide; "never" disables enforcement (observability only).
      notes: The policies themselves (Kubernetes NetworkPolicy and Cilium's L7-aware policies) are separate resources this component enforces.
    - control_id: edge-protection
      status: not_applicable
      notes: Cilium is the cluster dataplane, not an edge request filter -- a web application firewall is not modeled here. Its L7-aware policies are network policy enforcement, a different control (see restricted-ingress).
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The chart creates dedicated ServiceAccounts for the agent, operator, and Hubble components, each bound to purpose-scoped ClusterRoles the chart renders -- the dataplane's broad node/pod watch access is confined to its own identities.
      notes: Management-plane access (the release and Cilium's custom resources) is governed by the target cluster's Kubernetes RBAC.
    - control_id: workload-identity
      status: not_applicable
      notes: The spec carries no cloud credential seam. In the AWS ENI datapath the agent uses the node instance role (or an IRSA binding configured outside this spec) for EC2 ENI calls -- ambient node identity, not a per-workload identity this component manages.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: Cilium exposes no authentication surface of its own -- every interaction is a Kubernetes API operation authenticated by the cluster. There is no weaker path to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Administrative changes to Cilium and its custom resources are Kubernetes API operations, captured by the target cluster's audit policy. Hubble flow data is network observability, not an administrative audit trail.
    - control_id: monitoring-integration
      status: configurable
      field_path: prometheus.enabled
      evidence:
        type: spec_default
        reference: Unset means no metrics endpoints are exposed; prometheus.enabled opens the agent and operator /metrics endpoints and prometheus.service_monitor adds ServiceMonitors for scrape discovery. hubble.metrics separately exports flow-derived metric families (dns, drop, tcp, flow, http, ...).
      notes: The 04-production-observability preset enables both plus five Hubble metric families.
    - control_id: backup-recovery
      status: not_applicable
      notes: Cilium holds no data to back up -- its entire state is the declarative configuration in this manifest and runtime state it rebuilds on every node; the objects live in etcd, protected by the cluster's own state backup.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backup surface exists (see backup-recovery), so retention does not apply.
    - control_id: multi-zone-ha
      status: configurable
      field_path: operator.replicas
      evidence:
        type: spec_default
        reference: The operator defaults to 2 leader-elected replicas spread by pod anti-affinity (run 1 only on single-node clusters); the agent is per-node by design -- a node's dataplane fails only with the node itself.
      notes: The 01-kind-dev-cluster preset deliberately drops the operator to 1 replica for its single node; 04-production-observability keeps the HA default of 2.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither the chart nor the modules offer a deletion-protection flag, and uninstalling the dataplane is maximally destructive -- pods lose networking cluster-wide. Protection is operational (namespace RBAC, change review on the manifest).
    - control_id: managed-patching
      status: configurable
      field_path: chart_version
      evidence:
        type: spec_default
        reference: chart_version pins the installed Cilium release (default 1.19.6); changing it re-runs the Helm release with the new chart, rolling the agent DaemonSet across every node and the operator deliberately through the module.
