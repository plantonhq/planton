syntax = "proto3";

package dev.planton.kubernetes.kubernetesflinkdeployment.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesflinkdeployment/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesflinkdeployment/v1alpha1/spec.proto";
import "shared/metadata.proto";

//flink-deployment-kubernetes
message KubernetesFlinkDeployment {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesFlinkDeployment'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesFlinkDeploymentSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesFlinkDeploymentStatus status = 5;
}

//flink-deployment-kubernetes status.
message KubernetesFlinkDeploymentStatus {
  //outputs
  KubernetesFlinkDeploymentOutputs outputs = 1;
}
