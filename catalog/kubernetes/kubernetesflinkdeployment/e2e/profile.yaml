apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: kubernetesflinkdeployment
spec:
  tier: 3
  # The Flink cluster declaration (flinkdeployments.flink.apache.org/
  # v1beta1) against the registry-prerequisite Flink operator
  # (transitively cert-manager — the operator's fail-closed webhook).
  # The application lane carries THE STREAM PROOF: the in-image
  # StateMachine example (no internet) reaches RUNNING and answers
  # through the JobManager's own REST API. The behavioral lane composes
  # a KubernetesSeaweedFs and proves THE RECOVERY PROOF: checkpoints
  # land in S3 (completed count observed via REST), the JobManager pod
  # is deleted (UID-verified replacement), and the job returns to
  # RUNNING through Kubernetes HA metadata + checkpoint restore — state
  # survived outside the pods.
  status: green
  validated_provisioners: [pulumi, terraform]
  # The flink image pulls once per cluster; the behavioral lane also
  # pays the SeaweedFS fixture chain and two checkpoint intervals.
  timeout_minutes: 30
