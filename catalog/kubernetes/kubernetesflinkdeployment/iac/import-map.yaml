apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesflinkdeployment
spec:
  # One kubectl_manifest — the FlinkDeployment CR, named after
  # metadata.name — plus the optional anchor namespace. Everything the
  # operator creates from the CR (the JobManager Deployment, the
  # TaskManagers, `<name>-rest`, the HA ConfigMaps) is operator-owned
  # and never imported.
  values:
    - name: api_version
      derivations:
        - literal: flink.apache.org/v1beta1
      where_to_find: >-
        Always "flink.apache.org/v1beta1" — the CR's group/version (the
        operator's storage version at the pinned 1.15 release).
    - name: kind
      derivations:
        - literal: FlinkDeployment
      where_to_find: Always "FlinkDeployment" — the CR kind this module applies.
    - name: name
      derivations:
        - from_metadata_name: true
      where_to_find: >-
        The FlinkDeployment CR's metadata.name (equals the Planton
        resource name) — `kubectl get flinkdeployments.flink.apache.org
        -A` (NAME column).
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The deployment's namespace — `kubectl get
        flinkdeployments.flink.apache.org -A` (NAMESPACE column).
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the deployment's
        namespace itself.
