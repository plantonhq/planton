# Install manifest used when OTHER kinds declare KubernetesGatewayClass
# as an E2E prerequisite (a Gateway scenario composing a real class). The
# controller name is syntactically valid but no controller runs on the kind
# cluster -- deploys never block on controller reconciliation by design.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesGatewayClass
metadata:
  name: e2e-gwc-fixture
spec:
  controller_name: fixture.planton.dev/e2e-controller
