syntax = "proto3";

package dev.planton.kubernetes.kubernetesgatewayclass.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesgatewayclass/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesgatewayclass/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesGatewayClass is a Kubernetes Gateway API GatewayClass: a
// cluster-scoped template identifying the controller that manages Gateways of
// this class.
message KubernetesGatewayClass {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesGatewayClass'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesGatewayClassSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesGatewayClassStatus status = 5;
}

// KubernetesGatewayClassStatus holds the deployment status and outputs.
message KubernetesGatewayClassStatus {
  // outputs
  KubernetesGatewayClassOutputs outputs = 1;
}
