message KubernetesCoreV1ApiToleration {
  option (buf.validate.message).cel = {
    id: "toleration.exists_takes_no_value"
    message: "A toleration with operator Exists matches any value, so it takes no value"
    expression: "this.operator != 'Exists' || this.value == ''"
