syntax = "proto3";

package dev.planton.kubernetes;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// Kubernetes core/v1 API types, faithful to upstream, for the Planton kinds that
// mirror a custom resource embedding a pod: the pod specification and
// everything it reaches (containers, probes, lifecycle hooks, security
// contexts, scheduling, every volume source and projection), and the
// PersistentVolumeClaim specification. It also carries apimachinery's
// LabelSelector, which the pod's affinity terms, topology spread constraints
// and claims embed. Translated from k8s.io/api v0.37.1 (Kubernetes 1.37),
// field for field, as the custom resources that embed it serve it -- first
// agent-sandbox v1.0.7's Sandbox and SandboxTemplate, whose pinned definitions
// under pkg/kubernetes/manifestprojection/testdata/schemas hold every key here
// to the served schema (the mirror test).
//
// This is not the curated workload model (`workload_pod.proto` and its
// siblings), which renames keys and abstracts for Planton's own workload
// kinds. Every message here is named for its upstream type, prefixed
// `KubernetesCoreV1Api*`, and its JSON is upstream's, so a projected custom
// resource carries the pod exactly as a person would write it by hand.
//
// Modeling conventions:
//   - Field JSON names are the upstream keys; a `json_name` pin marks every key
//     protojson would spell differently (`hostIPC`, `diskURI`, `volumeID`).
//   - Upstream pointers are proto `optional`, so an explicit false, zero or ""
//     reaches the object. Integers keep upstream's width (`int32`, `int64`);
//     the projection writes 64-bit integers as JSON numbers.
//   - Closed sets are `string` with a closed rule taken from the Pod API's
//     constants, never proto enums. The served definitions carry no enums
//     (controller-gen drops core's), but the cluster refuses any other value
//     when it creates the pod, so a typo fails here instead of as a pod that
//     never starts.
//   - Every key the served schema requires carries a presence rule; a scalar
//     whose zero value is valid (an iSCSI LUN of 0) is `optional` and required.
//   - Quantities ("500m", "2Gi") are strings held to Kubernetes' quantity
//     grammar, singular or as map values. Ports that take a number or a name
//     are strings marked `kubernetes_int_or_string`, written as a number when
//     all digits.
//   - Fields behind a feature gate are modeled and say which gate; a cluster
//     without the gate silently drops the field from the pod it creates.
//   - No field carries a Planton default: where the server defaults one, the
//     comment says what it writes. An unset field is left to the server and to
//     any other controller that owns it.
//   - A name that points at an object Planton models is a reference: Secrets
//     and ConfigMaps (key selectors, env sources, volumes, projections, image
//     pull secrets, every volume driver's secretRef), the ServiceAccount, the
//     PriorityClass, a PersistentVolumeClaim and a StorageClass. The resource
//     graph draws the dependency and deploys it first; the projection writes
//     the resolved name, so the object is upstream's exactly.
//   - Environment variable values are plain configuration and land in the
//     custom resource as written. Put anything secret in a Secret and read it
//     with `valueFrom.secretKeyRef`.
//   - Pod-level rules upstream enforces only when it creates the pod (one
//     volume source per volume, one handler per hook, a selector operator's
//     value count) are validation rules here.
//   - Status types are excluded.

// KubernetesCoreV1ApiPodSpec is a description of a pod.
//
// Faithful to upstream core/v1 PodSpec.
message KubernetesCoreV1ApiPodSpec {
  // List of volumes that can be mounted by containers belonging to the pod.
  // More info: https://kubernetes.io/docs/concepts/storage/volumes
  repeated KubernetesCoreV1ApiVolume volumes = 1;

  // List of initialization containers belonging to the pod. Init containers are
  // executed in order prior to containers being started. If any init container
  // fails, the pod is considered to have failed and is handled according to its
  // restartPolicy. The name for an init container or normal container must be
  // unique among all containers. Init containers may not have Lifecycle
  // actions, Readiness probes, Liveness probes, or Startup probes. The
  // resourceRequirements of an init container are taken into account during
  // scheduling by finding the highest request/limit for each resource type, and
  // then using the max of that value or the sum of the normal containers.
  // Limits are applied to init containers in a similar fashion. Init containers
  // cannot currently be added or removed. Cannot be updated. More info:
  // https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
  repeated KubernetesCoreV1ApiContainer init_containers = 2;

  // List of containers belonging to the pod. Containers cannot currently be
  // added or removed. There must be at least one container in a Pod. Cannot be
  // updated.
  repeated KubernetesCoreV1ApiContainer containers = 3 [(buf.validate.field).repeated.min_items = 1];

  // List of ephemeral containers run in this pod. Ephemeral containers may be
  // run in an existing pod to perform user-initiated actions such as debugging.
  // This list cannot be specified when creating a pod, and it cannot be
  // modified by updating the pod spec. In order to add an ephemeral container
  // to an existing pod, use the pod's ephemeralcontainers subresource.
  repeated KubernetesCoreV1ApiEphemeralContainer ephemeral_containers = 4;

  // Restart policy for all containers within the pod. One of Always, OnFailure,
  // Never. In some contexts, only a subset of those values may be permitted.
  // Default to Always. More info:
  // https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#restart-policy
  optional string restart_policy = 5 [(buf.validate.field).string = {
    in: [
      "Always",
      "OnFailure",
      "Never"
    ]
  }];

  // Optional duration in seconds the pod needs to terminate gracefully. May be
  // decreased in delete request. Value must be non-negative integer. The value
  // zero indicates stop immediately via the kill signal (no opportunity to shut
  // down). If this value is nil, the default grace period will be used instead.
  // The grace period is the duration in seconds after the processes running in
  // the pod are sent a termination signal and the time when the processes are
  // forcibly halted with a kill signal. Set this value longer than the expected
  // cleanup time for your process. Defaults to 30 seconds.
  optional int64 termination_grace_period_seconds = 6;

  // Optional duration in seconds the pod may be active on the node relative to
  // StartTime before the system will actively try to mark it failed and kill
  // associated containers. Value must be a positive integer.
  optional int64 active_deadline_seconds = 7;

  // Set DNS policy for the pod. Defaults to "ClusterFirst". Valid values are
  // 'ClusterFirstWithHostNet', 'ClusterFirst', 'Default' or 'None'. DNS
  // parameters given in DNSConfig will be merged with the policy selected with
  // DNSPolicy. To have DNS options set along with hostNetwork, you have to
  // specify DNS policy explicitly to 'ClusterFirstWithHostNet'.
  optional string dns_policy = 8 [(buf.validate.field).string = {
    in: [
      "ClusterFirstWithHostNet",
      "ClusterFirst",
      "Default",
      "None"
    ]
  }];

  // `nodeSelector` is a selector which must be true for the pod to fit on a
  // node. Selector which must match a node's labels for the pod to be scheduled
  // on that node. More info:
  // https://kubernetes.io/docs/concepts/configuration/assign-pod-node/
  map<string, string> node_selector = 9;

  // `serviceAccountName` is the name of the ServiceAccount to use to run this
  // pod. More info:
  // https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
  //
  // Defaults to a KubernetesServiceAccount reference (its service_account_name
  // output); pass the literal name with `value:` for one Planton does not
  // manage.
  dev.planton.shared.foreignkey.v1.StringValueOrRef service_account_name = 10 [
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesServiceAccount,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.service_account_name"
  ];

  // `serviceAccount` is a deprecated alias for ServiceAccountName. Deprecated:
  // Use serviceAccountName instead.
  string service_account = 11;

  // `automountServiceAccountToken` indicates whether a service account token
  // should be automatically mounted.
  optional bool automount_service_account_token = 12;

  // `nodeName` indicates in which node this pod is scheduled. If empty, this
  // pod is a candidate for scheduling by the scheduler defined in
  // schedulerName. Once this field is set, the kubelet for this node becomes
  // responsible for the lifecycle of this pod. This field should not be used to
  // express a desire for the pod to be scheduled on a specific node.
  // https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodename
  string node_name = 13;

  // Host networking requested for this pod. Use the host's network namespace.
  // When using HostNetwork you should specify ports so the scheduler is aware.
  // When `hostNetwork` is true, specified `hostPort` fields in port definitions
  // must match `containerPort`, and unspecified `hostPort` fields in port
  // definitions are defaulted to match `containerPort`. Default to false.
  bool host_network = 14;

  // Use the host's pid namespace. Optional: Default to false.
  bool host_pid = 15 [json_name = "hostPID"];

  // Use the host's ipc namespace. Optional: Default to false.
  bool host_ipc = 16 [json_name = "hostIPC"];

  // Share a single process namespace between all of the containers in a pod.
  // When this is set containers will be able to view and signal processes from
  // other containers in the same pod, and the first process in each container
  // will not be assigned PID 1. HostPID and ShareProcessNamespace cannot both
  // be set. Optional: Default to false.
  optional bool share_process_namespace = 17;

  // `securityContext` holds pod-level security attributes and common container
  // settings. Optional: Defaults to empty.  See type description for default
  // values of each field.
  KubernetesCoreV1ApiPodSecurityContext security_context = 18;

  // `imagePullSecrets` is an optional list of references to secrets in the same
  // namespace to use for pulling any of the images used by this PodSpec. If
  // specified, these secrets will be passed to individual puller
  // implementations for them to use. More info:
  // https://kubernetes.io/docs/concepts/containers/images#specifying-imagepullsecrets-on-a-pod
  repeated KubernetesCoreV1ApiLocalObjectReference image_pull_secrets = 19;

  // Specifies the hostname of the Pod If not specified, the pod's hostname will
  // be set to a system-defined value.
  string hostname = 20;

  // If specified, the fully qualified Pod hostname will be
  // "<hostname>.<subdomain>.<pod namespace>.svc.<cluster domain>". If not
  // specified, the pod will not have a domainname at all.
  string subdomain = 21;

  // If specified, the pod's scheduling constraints.
  KubernetesCoreV1ApiAffinity affinity = 22;

  // If specified, the pod will be dispatched by specified scheduler. If not
  // specified, the pod will be dispatched by default scheduler.
  string scheduler_name = 23;

  // If specified, the pod's tolerations.
  repeated KubernetesCoreV1ApiToleration tolerations = 24;

  // `hostAliases` is an optional list of hosts and IPs that will be injected
  // into the pod's hosts file if specified.
  repeated KubernetesCoreV1ApiHostAlias host_aliases = 25;

  // If specified, indicates the pod's priority. "system-node-critical" and
  // "system-cluster-critical" are two special keywords which indicate the
  // highest priorities with the former being the highest priority. Any other
  // name must be defined by creating a PriorityClass object with that name. If
  // not specified, the pod priority will be default or zero if there is no
  // default.
  //
  // Defaults to a KubernetesPriorityClass reference (its priority_class_name
  // output); pass the literal name with `value:` for one Planton does not
  // manage.
  dev.planton.shared.foreignkey.v1.StringValueOrRef priority_class_name = 26 [
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesPriorityClass,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.priority_class_name"
  ];

  // The priority value. Various system components use this field to find the
  // priority of the pod. When Priority Admission Controller is enabled, it
  // prevents users from setting this field. The admission controller populates
  // this field from PriorityClassName. The higher the value, the higher the
  // priority.
  optional int32 priority = 27;

  // Specifies the DNS parameters of a pod. Parameters specified here will be
  // merged to the generated DNS configuration based on DNSPolicy.
  KubernetesCoreV1ApiPodDNSConfig dns_config = 28;

  // If specified, all readiness gates will be evaluated for pod readiness. A
  // pod is ready when all its containers are ready AND all conditions specified
  // in the readiness gates have status equal to "True" More info:
  // https://git.k8s.io/enhancements/keps/sig-network/580-pod-readiness-gates
  repeated KubernetesCoreV1ApiPodReadinessGate readiness_gates = 29;

  // `runtimeClassName` refers to a RuntimeClass object in the node.k8s.io
  // group, which should be used to run this pod.  If no RuntimeClass resource
  // matches the named class, the pod will not be run. If unset or empty, the
  // "legacy" RuntimeClass will be used, which is an implicit class with an
  // empty definition that uses the default runtime handler. More info:
  // https://git.k8s.io/enhancements/keps/sig-node/585-runtime-class
  optional string runtime_class_name = 30;

  // `enableServiceLinks` indicates whether information about services should be
  // injected into pod's environment variables, matching the syntax of Docker
  // links. Optional: Defaults to true.
  optional bool enable_service_links = 31;

  // `preemptionPolicy` is the Policy for preempting pods with lower priority.
  // One of Never, PreemptLowerPriority. When Priority Admission Controller is
  // enabled, it prevents users from setting this field. The admission
  // controller populates this field from PriorityClassName. Defaults to
  // PreemptLowerPriority if unset.
  optional string preemption_policy = 32 [(buf.validate.field).string = {
    in: [
      "PreemptLowerPriority",
      "Never"
    ]
  }];

  // `overhead` represents the resource overhead associated with running a pod
  // for a given RuntimeClass. This field will be autopopulated at admission
  // time by the RuntimeClass admission controller. If the RuntimeClass
  // admission controller is enabled, overhead must not be set in Pod create
  // requests. The RuntimeClass admission controller will reject Pod create
  // requests which have the overhead already set. If RuntimeClass is configured
  // and selected in the PodSpec, Overhead will be set to the value defined in
  // the corresponding RuntimeClass, otherwise it will remain unset and treated
  // as zero. More info:
  // https://git.k8s.io/enhancements/keps/sig-node/688-pod-overhead/README.md
  map<string, string> overhead = 33 [(buf.validate.field).map.values.string.pattern = "^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$"];

  // `topologySpreadConstraints` describes how a group of pods ought to spread
  // across topology domains. Scheduler will schedule pods in a way which abides
  // by the constraints. All topologySpreadConstraints are ANDed.
  repeated KubernetesCoreV1ApiTopologySpreadConstraint topology_spread_constraints = 34;

  // If true the pod's hostname will be configured as the pod's FQDN, rather
  // than the leaf name (the default). In Linux containers, this means setting
  // the FQDN in the hostname field of the kernel (the nodename field of struct
  // utsname). In Windows containers, this means setting the registry value of
  // hostname for the registry key
  // HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Services\\Tcpip\\Parameters
  // to FQDN. If a pod does not have FQDN, this has no effect. Default to false.
  optional bool set_hostname_as_fqdn = 35 [json_name = "setHostnameAsFQDN"];

  // Specifies the OS of the containers in the pod. Some pod and container
  // fields are restricted if this is set.
  //
  // If the OS field is set to linux, the following fields must be unset:
  // -securityContext.windowsOptions.
  //
  // If the OS field is set to windows, following fields must be unset: -
  // spec.hostPID - spec.hostIPC - spec.hostUsers - spec.resources -
  // spec.securityContext.appArmorProfile - spec.securityContext.seLinuxOptions
  // - spec.securityContext.seccompProfile - spec.securityContext.fsGroup -
  // spec.securityContext.fsGroupChangePolicy - spec.securityContext.sysctls -
  // spec.shareProcessNamespace - spec.securityContext.runAsUser -
  // spec.securityContext.runAsGroup - spec.securityContext.supplementalGroups -
  // spec.securityContext.supplementalGroupsPolicy -
  // spec.containers[*].securityContext.appArmorProfile -
  // spec.containers[*].securityContext.seLinuxOptions -
  // spec.containers[*].securityContext.seccompProfile -
  // spec.containers[*].securityContext.capabilities -
  // spec.containers[*].securityContext.readOnlyRootFilesystem -
  // spec.containers[*].securityContext.privileged -
  // spec.containers[*].securityContext.allowPrivilegeEscalation -
  // spec.containers[*].securityContext.procMount -
  // spec.containers[*].securityContext.runAsUser -
  // spec.containers[*].securityContext.runAsGroup.
  KubernetesCoreV1ApiPodOS os = 36;

  // Use the host's user namespace. Optional: Default to true. If set to true or
  // not present, the pod will be run in the host user namespace, useful for
  // when the pod needs a feature only available to the host user namespace,
  // such as loading a kernel module with CAP_SYS_MODULE. When set to false, a
  // new userns is created for the pod. Setting false is useful for mitigating
  // container breakout vulnerabilities even allowing users to run their
  // containers as root without actually having root privileges on the host.
  optional bool host_users = 37;

  // `schedulingGates` is an opaque list of values that if specified will block
  // scheduling the pod. If schedulingGates is not empty, the pod will stay in
  // the SchedulingGated state and the scheduler will not attempt to schedule
  // the pod.
  //
  // SchedulingGates can only be set at pod creation time, and be removed only
  // afterwards.
  repeated KubernetesCoreV1ApiPodSchedulingGate scheduling_gates = 38;

  // `resourceClaims` defines which ResourceClaims must be allocated and
  // reserved before the Pod is allowed to start. The resources will be made
  // available to those containers which consume them by name.
  //
  // This is a stable field but requires that the DynamicResourceAllocation
  // feature gate is enabled.
  //
  // This field is immutable.
  repeated KubernetesCoreV1ApiPodResourceClaim resource_claims = 39;

  // `resources` is the total amount of CPU and Memory resources required by all
  // containers in the pod. It supports specifying Requests and Limits for
  // "cpu", "memory" and "hugepages-" resource names only. ResourceClaims are
  // not supported.
  //
  // This field enables fine-grained control over resource allocation for the
  // entire pod, allowing resource sharing among containers in a pod.
  //
  // This is an alpha field and requires enabling the PodLevelResources feature
  // gate.
  KubernetesCoreV1ApiResourceRequirements resources = 40;

  // `hostnameOverride` specifies an explicit override for the pod's hostname as
  // perceived by the pod. This field only specifies the pod's hostname and does
  // not affect its DNS records. When this field is set to a non-empty string: -
  // It takes precedence over the values set in `hostname` and `subdomain`. -
  // The Pod's hostname will be set to this value. - `setHostnameAsFQDN` must be
  // nil or set to false. - `hostNetwork` must be set to false.
  //
  // This field must be a valid DNS subdomain as defined in RFC 1123 and contain
  // at most 64 characters.
  //
  // Requires the HostnameOverride feature gate on the cluster; a cluster
  // without it drops this field from the pod.
  optional string hostname_override = 41;

  // `schedulingGroup` provides a reference to the immediate scheduling runtime
  // grouping object that this Pod belongs to. This field is used by the
  // scheduler to identify the group and apply the correct group scheduling
  // policies. The association with a group also impacts other lifecycle aspects
  // of a Pod that are relevant in a wider context of scheduling like
  // preemption, resource attachment, etc. If not specified, the Pod is treated
  // as a single unit in all of these aspects. The group object referenced by
  // this field may not exist at the time the Pod is created. This field is
  // immutable, but a group object with the same name may be recreated with
  // different policies. Doing this during pod scheduling may result in the
  // placement not conforming to the expected policies.
  //
  // Requires the GenericWorkload feature gate on the cluster; a cluster without
  // it drops this field from the pod.
  KubernetesCoreV1ApiPodSchedulingGroup scheduling_group = 42;

  // evictionResponders reference responders that react to Evictions based on
  // EvictionRequests. Responders should observe and communicate through the
  // Eviction Resource API to help with the graceful termination of a pod. The
  // responders are selected sequentially, according to their specified
  // priority.
  //
  // Responders should periodically report on an eviction progress by updating
  // the .status.responders[].heartbeatTime field of the Eviction object. If
  // this field is not updated within the heartbeat deadline defined by the
  // Eviction API (currently 20 minutes), the eviction is passed over to the
  // next responder with a lower priority. If there is no other responder, the
  // last default imperative-eviction.k8s.io/evictor responder with a priority
  // of 100 will evict the pod using the imperative Eviction API
  // (pods/<name>/eviction subresource).
  //
  // The maximum length of the responders list is 10. Responders are not
  // supported when the pod is part of a PodGroup (.spec.schedulingGroup is
  // set). This field can only be set on creation and is immutable afterwards.
  //
  // Requires the EvictionRequestAPI feature gate on the cluster; a cluster
  // without it drops this field from the pod.
  repeated KubernetesCoreV1ApiEvictionResponder eviction_responders = 43;
}

// KubernetesCoreV1ApiVolume represents a named volume in a pod that may be
// accessed by any container in the pod.
//
// Faithful to upstream core/v1 Volume.
message KubernetesCoreV1ApiVolume {
  option (buf.validate.message).cel = {
    id: "volume.one_source"
    message: "Set at most one of awsElasticBlockStore, azureDisk, azureFile, cephfs, cinder, configMap, csi, downwardAPI, emptyDir, ephemeral, fc, flexVolume, flocker, gcePersistentDisk, gitRepo, glusterfs, hostPath, image, iscsi, nfs, persistentVolumeClaim, photonPersistentDisk, portworxVolume, projected, quobyte, rbd, scaleIO, secret, storageos, vsphereVolume"
    expression: "[has(this.aws_elastic_block_store), has(this.azure_disk), has(this.azure_file), has(this.cephfs), has(this.cinder), has(this.config_map), has(this.csi), has(this.downward_api), has(this.empty_dir), has(this.ephemeral), has(this.fc), has(this.flex_volume), has(this.flocker), has(this.gce_persistent_disk), has(this.git_repo), has(this.glusterfs), has(this.host_path), has(this.image), has(this.iscsi), has(this.nfs), has(this.persistent_volume_claim), has(this.photon_persistent_disk), has(this.portworx_volume), has(this.projected), has(this.quobyte), has(this.rbd), has(this.scale_io), has(this.secret), has(this.storageos), has(this.vsphere_volume)].filter(x, x).size() <= 1"
  };

  // name of the volume. Must be a DNS_LABEL and unique within the pod. More
  // info:
  // https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
  string name = 1 [(buf.validate.field).string.min_len = 1];

  // hostPath represents a pre-existing file or directory on the host machine
  // that is directly exposed to the container. This is generally used for
  // system agents or other privileged things that are allowed to see the host
  // machine. Most containers will NOT need this. More info:
  // https://kubernetes.io/docs/concepts/storage/volumes#hostpath mount host
  // directories as read/write.
  KubernetesCoreV1ApiHostPathVolumeSource host_path = 2;

  // emptyDir represents a temporary directory that shares a pod's lifetime.
  // More info: https://kubernetes.io/docs/concepts/storage/volumes#emptydir
  KubernetesCoreV1ApiEmptyDirVolumeSource empty_dir = 3;

  // gcePersistentDisk represents a GCE Disk resource that is attached to a
  // kubelet's host machine and then exposed to the pod. Deprecated:
  // GCEPersistentDisk is deprecated. All operations for the in-tree
  // gcePersistentDisk type are redirected to the pd.csi.storage.gke.io CSI
  // driver. More info:
  // https://kubernetes.io/docs/concepts/storage/volumes#gcepersistentdisk
  KubernetesCoreV1ApiGCEPersistentDiskVolumeSource gce_persistent_disk = 4;

  // awsElasticBlockStore represents an AWS Disk resource that is attached to a
  // kubelet's host machine and then exposed to the pod. Deprecated:
  // AWSElasticBlockStore is deprecated. All operations for the in-tree
  // awsElasticBlockStore type are redirected to the ebs.csi.aws.com CSI driver.
  // More info:
  // https://kubernetes.io/docs/concepts/storage/volumes#awselasticblockstore
  KubernetesCoreV1ApiAWSElasticBlockStoreVolumeSource aws_elastic_block_store = 5;

  // gitRepo represents a git repository at a particular revision. Deprecated:
  // GitRepo is deprecated. To provision a container with a git repo, mount an
  // EmptyDir into an InitContainer that clones the repo using git, then mount
  // the EmptyDir into the Pod's container.
  KubernetesCoreV1ApiGitRepoVolumeSource git_repo = 6;

  // secret represents a secret that should populate this volume. More info:
  // https://kubernetes.io/docs/concepts/storage/volumes#secret
  KubernetesCoreV1ApiSecretVolumeSource secret = 7;

  // nfs represents an NFS mount on the host that shares a pod's lifetime More
  // info: https://kubernetes.io/docs/concepts/storage/volumes#nfs
  KubernetesCoreV1ApiNFSVolumeSource nfs = 8;

  // iscsi represents an ISCSI Disk resource that is attached to a kubelet's
  // host machine and then exposed to the pod. More info:
  // https://kubernetes.io/docs/concepts/storage/volumes/#iscsi
  KubernetesCoreV1ApiISCSIVolumeSource iscsi = 9;

  // glusterfs represents a Glusterfs mount on the host that shares a pod's
  // lifetime. Deprecated: Glusterfs is deprecated and the in-tree glusterfs
  // type is no longer supported.
  KubernetesCoreV1ApiGlusterfsVolumeSource glusterfs = 10;

  // persistentVolumeClaimVolumeSource represents a reference to a
  // PersistentVolumeClaim in the same namespace. More info:
  // https://kubernetes.io/docs/concepts/storage/persistent-volumes#persistentvolumeclaims
  KubernetesCoreV1ApiPersistentVolumeClaimVolumeSource persistent_volume_claim = 11;

  // rbd represents a Rados Block Device mount on the host that shares a pod's
  // lifetime. Deprecated: RBD is deprecated and the in-tree rbd type is no
  // longer supported.
  KubernetesCoreV1ApiRBDVolumeSource rbd = 12;

  // flexVolume represents a generic volume resource that is
  // provisioned/attached using an exec based plugin. Deprecated: FlexVolume is
  // deprecated. Consider using a CSIDriver instead.
  KubernetesCoreV1ApiFlexVolumeSource flex_volume = 13;

  // cinder represents a cinder volume attached and mounted on kubelets host
  // machine. Deprecated: Cinder is deprecated. All operations for the in-tree
  // cinder type are redirected to the cinder.csi.openstack.org CSI driver. More
  // info: https://examples.k8s.io/mysql-cinder-pd/README.md
  KubernetesCoreV1ApiCinderVolumeSource cinder = 14;

  // cephFS represents a Ceph FS mount on the host that shares a pod's lifetime.
