    id: "node_selector_requirement.values_by_operator"
    message: "In and NotIn need at least one value, Gt and Lt exactly one integer, and Exists and DoesNotExist none"
    expression: "this.operator in ['In', 'NotIn'] ? size(this.values) > 0 : (this.operator in ['Gt', 'Lt'] ? (size(this.values) == 1 && this.values[0].matches('^-?[0-9]+$')) : size(this.values) == 0)"
