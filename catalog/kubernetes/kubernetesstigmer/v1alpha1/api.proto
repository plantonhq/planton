syntax = "proto3";

package dev.planton.kubernetes.kubernetesstigmer.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesstigmer/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesstigmer/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesStigmer installs Stigmer, the open-source AI agent platform, on
// a Kubernetes cluster: the Stigmer operator and the one Stigmer resource it
// reconciles into a running install. One per cluster.
message KubernetesStigmer {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesStigmer'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesStigmerSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesStigmerStatus status = 5;
}

// KubernetesStigmerStatus describes the observed state of KubernetesStigmer.
message KubernetesStigmerStatus {
  // outputs
  KubernetesStigmerOutputs outputs = 1;
}
