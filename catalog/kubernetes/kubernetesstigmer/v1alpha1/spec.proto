   * operator sets itself is refused; `env_from` is not accepted.
   */
  dev.planton.kubernetes.ContainerEnv extra_env = 4 [
    (buf.validate.field).cel = {
      id: "runner.extra_env.no_env_from"
      message: "runner.extra_env.env_from is not accepted: Stigmer takes single settings, so list each one under variables or secrets"
      expression: "size(this.env_from) == 0"
    },
    (buf.validate.field).cel = {
      id: "runner.extra_env.unique_names"
      message: "a setting may be declared in runner.extra_env.variables or runner.extra_env.secrets, not both"
      expression: "!this.variables.exists(v, this.secrets.exists(s, s.name == v.name))"
    },
    (buf.validate.field).cel = {
      id: "runner.extra_env.not_operator_owned"
      message: "runner.extra_env names a setting Stigmer's operator sets from the declaration, and a second value would silently replace it: set it through its own field, or remove the entry. The operator sets ANTHROPIC_*, OPENAI_API_KEY, AWS_BEARER_TOKEN_BEDROCK, ARTIFACT_STORAGE_TYPE, LOCAL_ARTIFACT_PATH, MODE, TEMPORAL_NAMESPACE, TEMPORAL_SERVICE_ADDRESS, WORKSPACE_ROOT_DIR and the runner's STIGMER_* settings"
      expression: "!this.variables.exists(v, v.name in ['ANTHROPIC_API_KEY','ANTHROPIC_BASE_URL','ANTHROPIC_FOUNDRY_API_KEY','ARTIFACT_STORAGE_TYPE','AWS_BEARER_TOKEN_BEDROCK','LOCAL_ARTIFACT_PATH','MODE','OPENAI_API_KEY','STIGMER_AGENT_HOME','STIGMER_ARTIFACT_PROXY_ENDPOINT','STIGMER_BACKEND_ENDPOINT','STIGMER_MCP_PUBLIC_ENDPOINT','STIGMER_TASK_QUEUE','STIGMER_TEMPORAL_API_KEY','STIGMER_TEMPORAL_TLS','STIGMER_TEMPORAL_TLS_CLIENT_CERT_DATA','STIGMER_TEMPORAL_TLS_CLIENT_KEY_DATA','STIGMER_TEMPORAL_TLS_SERVER_CA_CERT_DATA','STIGMER_TEMPORAL_TLS_SERVER_NAME','STIGMER_TOKEN','STIGMER_WEB_FETCH_ALLOW_PRIVATE','TEMPORAL_NAMESPACE','TEMPORAL_SERVICE_ADDRESS','WORKSPACE_ROOT_DIR']) && !this.secrets.exists(s, s.name in ['ANTHROPIC_API_KEY','ANTHROPIC_BASE_URL','ANTHROPIC_FOUNDRY_API_KEY','ARTIFACT_STORAGE_TYPE','AWS_BEARER_TOKEN_BEDROCK','LOCAL_ARTIFACT_PATH','MODE','OPENAI_API_KEY','STIGMER_AGENT_HOME','STIGMER_ARTIFACT_PROXY_ENDPOINT','STIGMER_BACKEND_ENDPOINT','STIGMER_MCP_PUBLIC_ENDPOINT','STIGMER_TASK_QUEUE','STIGMER_TEMPORAL_API_KEY','STIGMER_TEMPORAL_TLS','STIGMER_TEMPORAL_TLS_CLIENT_CERT_DATA','STIGMER_TEMPORAL_TLS_CLIENT_KEY_DATA','STIGMER_TEMPORAL_TLS_SERVER_CA_CERT_DATA','STIGMER_TEMPORAL_TLS_SERVER_NAME','STIGMER_TOKEN','STIGMER_WEB_FETCH_ALLOW_PRIVATE','TEMPORAL_NAMESPACE','TEMPORAL_SERVICE_ADDRESS','WORKSPACE_ROOT_DIR'])"
    }
  ];
}

/**
 * The model key agents use: given here (this resource writes it into a
 * Secret under the names Stigmer's runner reads), or an existing Secret you
 * keep that already holds them.
 */
message KubernetesStigmerModel {
  oneof source {
    option (buf.validate.oneof).required = true;

    /**
     * The model provider's key, and optionally a gateway address.
     */
    KubernetesStigmerModelKeys keys = 1;

    /**
     * A Secret in the Stigmer's namespace holding the keys by Stigmer's own
     * names: ANTHROPIC_API_KEY, ANTHROPIC_BASE_URL, OPENAI_API_KEY,
     * ANTHROPIC_FOUNDRY_API_KEY or AWS_BEARER_TOKEN_BEDROCK.
     */
    dev.planton.shared.foreignkey.v1.StringValueOrRef existing_secret_name = 2 [
      (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesSecret,
      (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.secret_name"
    ];
  }
}

/**
 * The model provider's key. Give at least one key; the runner uses the one
 * its provider needs.
 */
message KubernetesStigmerModelKeys {
  /**
   * An Anthropic API key (ANTHROPIC_API_KEY).
   */
  string anthropic_api_key = 1 [(dev.planton.shared.options.sensitive) = true];

  /**
   * A model gateway's address (ANTHROPIC_BASE_URL), for a proxy or gateway
   * that speaks Anthropic's API, such as http://models.ai.svc.cluster.local:8080.
   * It needs a key beside it.
   */
  string anthropic_base_url = 2 [(buf.validate.field).cel = {
    id: "model.anthropic_base_url.format"
    message: "anthropic_base_url must be an http or https URL"
    expression: "this == '' || this.startsWith('https://') || this.startsWith('http://')"
  }];

  /**
   * An OpenAI API key (OPENAI_API_KEY).
   */
  string openai_api_key = 3 [(dev.planton.shared.options.sensitive) = true];

  /**
   * An Anthropic-on-Microsoft-Foundry key (ANTHROPIC_FOUNDRY_API_KEY).
   */
  string anthropic_foundry_api_key = 4 [(dev.planton.shared.options.sensitive) = true];

  /**
   * An Amazon Bedrock bearer token (AWS_BEARER_TOKEN_BEDROCK).
   */
  string aws_bearer_token_bedrock = 5 [(dev.planton.shared.options.sensitive) = true];

  option (buf.validate.message).cel = {
    id: "model.keys.at_least_one"
    message: "runner.model.keys needs a key: anthropic_api_key, openai_api_key, anthropic_foundry_api_key or aws_bearer_token_bedrock (a gateway address alone signs no request)"
    expression: "this.anthropic_api_key != '' || this.openai_api_key != '' || this.anthropic_foundry_api_key != '' || this.aws_bearer_token_bedrock != ''"
  };
}

/**
 * Where Stigmer keeps its records: the Postgres the operator runs, or yours.
 */
message KubernetesStigmerDatabase {
  oneof postgresql {
    option (buf.validate.oneof).required = true;

    /**
     * The Postgres the operator runs, through CloudNativePG.
     */
    KubernetesStigmerBundledPostgres bundled = 1;

    /**
     * A Postgres you run. It needs your own Temporal (temporal.external) and
     * your own sign-in issuer when the install has a front door.
     */
    KubernetesStigmerExternalPostgres external = 2;
  }
}

/**
 * The bundled Postgres.
 */
message KubernetesStigmerBundledPostgres {
  /**
   * Postgres instances: one primary, the rest standbys.
   */
  optional int32 instances = 1 [
    (dev.planton.shared.options.default) = "1",
    (buf.validate.field).int32 = {
      gte: 1
      lte: 5
    }
  ];

  /**
   * Each instance's volume. Empty = 10Gi.
   */
  KubernetesStigmerVolume storage = 2;

  /**
   * Each instance's requests and limits. Empty = the operator's defaults.
   */
  dev.planton.kubernetes.KubernetesCoreV1ApiResourceRequirements resources = 3;

  /**
   * Backups. With object_store declared, the database archives every change
   * to the bucket from its first minute and takes a full backup on this
   * schedule; these settings tune that. Needs object_store, and cert-manager
   * on the cluster (the backup plugin needs it; nothing here installs it).
   */
  KubernetesStigmerPostgresBackup backup = 4;

  /**
   * Creates the database from an archive in the bucket instead of empty.
   * Honored only when the database is created; on a running install it
   * changes nothing. A restore also needs the source install's keys Secret
   * in this namespace (see keys_export_command): without it the encryption
   * key would be minted fresh and the restored records unreadable, so this
   * resource refuses to declare the Stigmer until the keys are there.
   */
  KubernetesStigmerRecoverFrom recover_from = 5;
}

/**
 * The bundled database's backup schedule and retention.
 */
message KubernetesStigmerPostgresBackup {
  /**
   * When a full backup is taken: a six-field cron with seconds first, in
   * UTC. Empty = daily at 02:00 ("0 0 2 * * *").
   */
  string schedule = 1 [(buf.validate.field).cel = {
    id: "backup.schedule.six_fields"
    message: "backup.schedule is a six-field cron with seconds first, such as \"0 0 2 * * *\""
    expression: "this == '' || this.matches('^\\\\S+( \\\\S+){5}$')"
  }];

  /**
   * How long backups and the archive are kept: a number and d, w or m.
   * Empty = 30d.
   */
  string retention = 2 [(buf.validate.field).cel = {
    id: "backup.retention.format"
    message: "backup.retention is a number and d, w or m, such as 30d"
    expression: "this == '' || this.matches('^[1-9][0-9]*[dwm]$')"
  }];
}

/**
 * The archive a database is restored from.
 */
message KubernetesStigmerRecoverFrom {
  /**
   * The archive's name in the bucket: the source install's backup server
   * name (its status.backup.serverName).
   */
  string server_name = 1 [(buf.validate.field).required = true];

  /**
   * The moment to restore to, in RFC 3339 (2026-11-20T08:00:00Z). Empty =
   * the newest moment the archive holds.
   */
  string target_time = 2 [(buf.validate.field).cel = {
    id: "recover_from.target_time.rfc3339"
    message: "recover_from.target_time must be an RFC 3339 time such as 2026-11-20T08:00:00Z"
    expression: "this == '' || this.matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$')"
  }];
}

/**
 * A Postgres you run.
 */
message KubernetesStigmerExternalPostgres {
  /**
   * The server's address. Composes a KubernetesPostgres's read-write
   * Service; any reachable Postgres works as a literal.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef host = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesPostgres,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.rw_service"
  ];

  /**
   * The server's port.
   */
  optional int32 port = 2 [
    (dev.planton.shared.options.default) = "5432",
    (buf.validate.field).int32 = {
      gte: 1
      lte: 65535
    }
  ];

  /**
   * The role Stigmer signs in as. It must own `database`, where Stigmer
   * creates its schemas.
   */
  string user = 3 [(buf.validate.field).required = true];

  /**
   * The database Stigmer uses.
   */
  optional string database = 4 [(dev.planton.shared.options.default) = "stigmer"];

  /**
   * The role's password: given here (this resource writes it into a Secret),
   * or read from a Secret in the Stigmer's namespace.
   */
  KubernetesStigmerPassword password = 5 [(buf.validate.field).required = true];

  /**
   * libpq's sslmode for the connection. Empty = libpq's default (prefer).
   */
  string ssl_mode = 6 [(buf.validate.field).string = {
    in: [
      "",
      "disable",
      "allow",
      "prefer",
      "require",
      "verify-ca",
      "verify-full"
    ]
  }];
}

/**
 * A password, given or read from a Secret.
 */
message KubernetesStigmerPassword {
  oneof source {
    option (buf.validate.oneof).required = true;

    /**
     * The password. This resource writes it into a Secret in the Stigmer's
     * namespace.
     */
    string value = 1 [(dev.planton.shared.options.sensitive) = true];

    /**
     * A Secret in the Stigmer's namespace that holds it. Composes a
     * KubernetesPostgres's application credential Secret when the database
     * runs in the same namespace.
     */
    KubernetesStigmerPostgresPasswordSecret existing_secret = 2;
  }
}

/**
 * The Secret holding a Postgres password.
 */
message KubernetesStigmerPostgresPasswordSecret {
  /**
   * The Secret's name.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef name = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesPostgres,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.password_secret.name"
  ];

  /**
   * The key holding the password.
   */
  optional string key = 2 [(dev.planton.shared.options.default) = "password"];
}

/**
 * A key in an existing Secret in the Stigmer's namespace.
 */
message KubernetesStigmerSecretKeyRef {
  /**
   * The Secret's name.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef name = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesSecret,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.secret_name"
  ];

  /**
   * The key within the Secret.
   */
  string key = 2 [(buf.validate.field).required = true];
}

/**
 * The workflow engine: the Temporal the operator runs, or yours.
 */
message KubernetesStigmerTemporal {
  oneof mode {
    option (buf.validate.oneof).required = true;

    /**
     * The Temporal the operator runs on the bundled database.
     */
    KubernetesStigmerBundledTemporal bundled = 1;

    /**
     * A Temporal frontend you run.
     */
    KubernetesStigmerExternalTemporal external = 2;
  }
}

/**
 * The bundled Temporal.
 */
message KubernetesStigmerBundledTemporal {
  /**
   * Requests and limits for each Temporal service (frontend, history,
   * matching, worker). Empty = the operator's defaults.
   */
  dev.planton.kubernetes.KubernetesCoreV1ApiResourceRequirements resources = 1;
}

/**
 * A Temporal frontend you run.
 */
message KubernetesStigmerExternalTemporal {
  /**
   * The frontend's gRPC address, host:port (an IPv6 address in brackets).
   * Composes a KubernetesTemporal's frontend endpoint.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef host_port = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesTemporal,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.frontend_endpoint"
  ];

  /**
   * The Temporal namespace Stigmer's runs use.
   */
  optional string namespace = 2 [(dev.planton.shared.options.default) = "default"];

  /**
   * TLS to the frontend. Without certificates named, the frontend's
   * certificate is checked against the system's trusted roots.
   */
  KubernetesStigmerTemporalTls tls = 3;

  /**
   * The frontend's API key (Temporal Cloud, or a frontend with a JWT
   * authorizer). An API key implies TLS.
   */
  KubernetesStigmerSecretValue api_key = 4;
}

/**
 * TLS to an external Temporal frontend.
 */
message KubernetesStigmerTemporalTls {
  /**
   * The name the frontend's certificate is checked against, when it differs
   * from the host.
   */
  string server_name = 1;

  oneof certificates {
    /**
     * The certificates, given here as PEM. This resource writes them into a
     * Secret in the Stigmer's namespace.
     */
    KubernetesStigmerTemporalTlsPem pem = 2;

    /**
     * A Secret in the Stigmer's namespace holding the certificates as PEM,
     * read by key.
     */
    KubernetesStigmerTemporalTlsSecret existing_secret = 3;
  }
}

/**
 * Temporal TLS material as PEM.
 */
message KubernetesStigmerTemporalTlsPem {
  /**
   * The CA that signed the frontend's certificate. Empty = the system's
   * trusted roots.
   */
  string ca_certificate = 1;

  /**
   * The client certificate, for mutual TLS.
   */
  string client_certificate = 2;

  /**
   * The client certificate's private key.
   */
  string client_private_key = 3 [(dev.planton.shared.options.sensitive) = true];

  option (buf.validate.message).cel = {
    id: "temporal.tls.pem.client_pair"
    message: "temporal.external.tls.pem: client_certificate and client_private_key go together; mutual TLS needs the certificate and its key"
    expression: "(this.client_certificate == '') == (this.client_private_key == '')"
  };
}

/**
 * A Secret holding Temporal TLS material, read by key.
 */
message KubernetesStigmerTemporalTlsSecret {
  /**
   * The Secret's name.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef name = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesSecret,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.secret_name"
  ];

  /**
   * The key of the CA that signed the frontend's certificate.
   */
  string ca_key = 2;

  /**
   * The key of the client certificate, for mutual TLS.
   */
  string certificate_key = 3;

  /**
   * The key of the client certificate's private key.
   */
  string private_key_key = 4 [(dev.planton.shared.options.sensitive_exempt_reason) = "Key NAME within an existing Secret (a reference), not secret material"];

  option (buf.validate.message).cel = {
    id: "temporal.tls.existing_secret.client_pair"
    message: "temporal.external.tls.existing_secret: certificate_key and private_key_key go together; mutual TLS needs the certificate and its key"
    expression: "(this.certificate_key == '') == (this.private_key_key == '')"
  };
}

/**
 * A secret value: given here (this resource writes it into a Secret in the
 * Stigmer's namespace), or a key in a Secret you keep there.
 */
message KubernetesStigmerSecretValue {
  oneof source {
    option (buf.validate.oneof).required = true;

    /**
     * The value.
     */
    string value = 1 [(dev.planton.shared.options.sensitive) = true];

    /**
     * A key in an existing Secret in the Stigmer's namespace.
     */
    KubernetesStigmerSecretKeyRef existing_secret = 2;
  }
}

/**
 * The bucket Stigmer keeps its files in.
 */
message KubernetesStigmerObjectStore {
  /**
   * Any S3-compatible bucket: AWS S3, Cloudflare R2, SeaweedFS, MinIO, or
   * Google Cloud Storage through its S3 API (Agent Substrate's snapshots
   * need a store other than Cloud Storage, whose S3 API refuses them).
   */
  KubernetesStigmerS3 s3 = 1 [(buf.validate.field).required = true];
}

/**
 * One S3-compatible bucket.
 */
message KubernetesStigmerS3 {
  /**
   * The bucket's name (3 to 63 characters). Composes an AwsS3Bucket.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef bucket = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsS3Bucket,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.bucket_id"
  ];

  /**
   * The bucket's region; R2 also accepts us-east-1.
   */
  optional string region = 2 [(dev.planton.shared.options.default) = "us-east-1"];

  /**
   * The store's URL, such as https://<account>.r2.cloudflarestorage.com or
   * http://seaweedfs-s3.storage.svc.cluster.local:8333. Empty = AWS S3
   * itself. Composes a KubernetesSeaweedFs's S3 endpoint.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef endpoint = 3 [
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesSeaweedFs,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.s3_endpoint"
  ];

  /**
   * The bucket's access key, which the server and the database's backups
   * use; no runner ever holds it.
   */
  KubernetesStigmerS3Credentials credentials = 4 [(buf.validate.field).required = true];

  /**
   * The address runners reach the store at, when it is not `endpoint`: URLs
   * handed to runners are signed for it, since a signed URL's host is part
   * of its signature.
   */
  string runner_endpoint = 5 [(buf.validate.field).cel = {
    id: "s3.runner_endpoint.format"
    message: "object_store.s3.runner_endpoint must be an http or https URL"
    expression: "this == '' || this.startsWith('https://') || this.startsWith('http://')"
  }];
}

/**
 * The bucket's access key: given here, or an existing Secret.
 */
message KubernetesStigmerS3Credentials {
  oneof source {
    option (buf.validate.oneof).required = true;

    /**
     * The key pair. This resource writes it into a Secret under the names
     * Stigmer reads (ACCESS_KEY_ID, SECRET_ACCESS_KEY).
     */
    KubernetesStigmerS3AccessKey access_key = 1;

    /**
     * A Secret in the Stigmer's namespace that already holds the pair as
     * ACCESS_KEY_ID and SECRET_ACCESS_KEY.
     */
    dev.planton.shared.foreignkey.v1.StringValueOrRef existing_secret_name = 2 [
      (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesSecret,
      (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.secret_name"
    ];
  }
}

/**
 * An S3 key pair.
 */
message KubernetesStigmerS3AccessKey {
  /**
   * The access key id.
   */
  string access_key_id = 1 [(buf.validate.field).required = true];

  /**
   * The secret access key.
   */
  string secret_access_key = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.options.sensitive) = true
  ];
}

/**
 * The front door.
 */
message KubernetesStigmerIngress {
  /**
   * The one name people reach Stigmer at, on port 443 (the CLI and the
   * desktop app speak TLS to a server on 443).
   */
  string hostname = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$"
  ];

  oneof route {
    option (buf.validate.oneof).required = true;

    /**
     * An Ingress the cluster's controller serves, with its certificate.
     */
    KubernetesStigmerIngressTls tls = 2;

    /**
     * Routes on a Gateway the cluster runs, whose HTTPS listener for the
     * hostname holds the certificate. Stigmer never edits the Gateway.
     */
    KubernetesStigmerGatewayRef gateway = 3;
  }

  /**
   * The IngressClass that serves the front door (with `tls`).
   */
  string class_name = 4;

  /**
   * Annotations on the Ingress, for a controller that needs a hint to speak
   * gRPC to the server.
   */
  map<string, string> annotations = 5;

  /**
   * Annotations on the server's Service, for a controller that reads its
   * gRPC hint there (Traefik's
   * traefik.ingress.kubernetes.io/service.serversscheme: h2c).
   */
  map<string, string> service_annotations = 6;
}

/**
 * The front door's certificate.
 */
message KubernetesStigmerIngressTls {
  oneof certificate {
    option (buf.validate.oneof).required = true;

    /**
     * A TLS Secret in the Stigmer's namespace that you keep current.
     */
    string secret_name = 1;

    /**
     * A cert-manager issuer that issues the certificate. cert-manager must
     * run on the cluster.
     */
    KubernetesStigmerIssuerRef issuer = 2;
  }
}

/**
 * A cert-manager issuer.
 */
message KubernetesStigmerIssuerRef {
  /**
   * The issuer's name. Composes a KubernetesClusterIssuer.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef name = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesClusterIssuer,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.cluster_issuer_name"
  ];

  /**
   * ClusterIssuer (the default) or Issuer (in the Stigmer's namespace).
   */
  string kind = 2 [(buf.validate.field).string = {
    in: [
      "",
      "ClusterIssuer",
      "Issuer"
    ]
  }];
}

/**
 * A Gateway API Gateway and, optionally, its listener.
 */
message KubernetesStigmerGatewayRef {
  /**
   * The Gateway's name. Composes a KubernetesGateway.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef name = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesGateway,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.gateway_name"
  ];

  /**
   * The Gateway's namespace. Empty = the Stigmer's namespace.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef namespace = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesGateway,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.namespace"
  ];

  /**
   * The listener the routes attach to.
   */
  string section_name = 3;
}

/**
 * How people sign in.
 */
message KubernetesStigmerIdentity {
  oneof provider {
    option (buf.validate.oneof).required = true;

    /**
     * The sign-in the operator runs beside Stigmer, at <hostname>/idp. The
     * owner's account is created with a one-time password
     * (`owner_password_command`).
     */
    KubernetesStigmerBundledIdentity bundled = 1;

    /**
     * Your own OpenID Connect issuer. Its realm or tenant, the console and
     * native clients, the audience, the owner's account and sign-up are
     * yours to set up.
     */
    KubernetesStigmerOidc oidc = 2;
  }
}

/**
 * The bundled sign-in.
 */
message KubernetesStigmerBundledIdentity {
  /**
   * The domains whose addresses may sign up once the owner has signed in,
   * such as acme.dev. Empty = only the owner signs in. Needs smtp, because
   * without a verification email anyone could claim an address.
   */
  repeated string sign_up_email_domains = 1 [(buf.validate.field).repeated.items.string.pattern = "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$"];

  /**
   * The mail server the sign-in sends verification and password mail
   * through.
   */
  KubernetesStigmerSmtp smtp = 2;

  option (buf.validate.message).cel = {
    id: "identity.bundled.sign_up_needs_smtp"
    message: "sign-up for your email domains needs mail: without a verification email anyone could claim an address in the domain. Set identity.bundled.smtp"
    expression: "size(this.sign_up_email_domains) == 0 || has(this.smtp)"
  };
}

/**
 * A mail server.
 */
message KubernetesStigmerSmtp {
  /**
   * The mail server's address.
   */
  string host = 1 [(buf.validate.field).required = true];

  /**
   * The mail server's port.
   */
  optional int32 port = 2 [
    (dev.planton.shared.options.default) = "587",
    (buf.validate.field).int32 = {
      gte: 1
      lte: 65535
    }
  ];

  /**
   * The address mail is sent from.
   */
  string from = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "smtp.from.format"
      message: "identity.bundled.smtp.from must be an email address"
      expression: "this.contains('@')"
    }
  ];

  /**
   * Upgrade the connection to TLS.
   */
  bool starttls = 4;

  /**
   * The user name and password, when the mail server asks for them.
   */
  KubernetesStigmerSmtpCredentials credentials = 5;
}

/**
 * SMTP sign-in: given here, or an existing Secret.
 */
message KubernetesStigmerSmtpCredentials {
  oneof source {
    option (buf.validate.oneof).required = true;

    /**
     * The user name and password. This resource writes them into a Secret
     * under the names Stigmer reads (username, password).
     */
    KubernetesStigmerSmtpLogin login = 1;

    /**
     * A Secret in the Stigmer's namespace with the keys username and
     * password.
     */
    dev.planton.shared.foreignkey.v1.StringValueOrRef existing_secret_name = 2 [
      (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesSecret,
      (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.secret_name"
    ];
  }
}

/**
 * An SMTP user name and password.
 */
message KubernetesStigmerSmtpLogin {
  /**
   * The user name.
   */
  string username = 1 [(buf.validate.field).required = true];

  /**
   * The password.
   */
  string password = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.options.sensitive) = true
  ];
}

/**
 * An OpenID Connect issuer and the clients Stigmer is registered as.
 */
message KubernetesStigmerOidc {
  /**
   * The issuer's URL, exactly as its discovery document names it: https, or
   * plain http only for a loopback issuer.
   */
  string issuer = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "oidc.issuer.format"
      message: "identity.oidc.issuer must be an https URL (plain http is allowed only for a loopback issuer)"
      expression: "this.startsWith('https://') || this.matches('^http://(localhost|127[.]0[.]0[.]1)(:[0-9]+)?(/.*)?$')"
    }
  ];

  /**
   * The audience the issuer puts in Stigmer's tokens.
   */
  string audience = 2 [(buf.validate.field).required = true];

  /**
   * The web console's client.
   */
  string console_client_id = 3;

  /**
   * The desktop app's and the CLI's client.
   */
  string native_client_id = 4;

  /**
   * Where the server fetches the issuer's discovery document when it cannot
   * reach the issuer's public name from inside the cluster. The document
   * must still name `issuer`.
   */
  string discovery_url = 5;
}

/**
 * Stigmer Enterprise.
 */
message KubernetesStigmerEnterprise {
  /**
   * The license key you were sent. The server runs the Enterprise image and
   * verifies it at boot.
   */
  KubernetesStigmerSecretValue license = 1 [(buf.validate.field).required = true];

  /**
   * The account ids (ida_ and 26 characters, as `stigmer auth whoami`
   * prints them) who may create an organization. Empty = anyone signed in.
   */
  repeated string organization_creators = 2;

  /**
   * How long the access history is kept, in days. Empty = every entry is
   * kept.
   */
  optional int32 access_history_retention_days = 3 [(buf.validate.field).int32.gte = 1];

  /**
   * Which addresses the server dials when it reaches a URL a person wrote.
   * Empty = strict.
   */
  string outbound_egress = 4 [(buf.validate.field).string = {
    in: [
      "",
      "strict",
      "relaxed"
    ]
  }];
}

/**
 * Where engineers' agents run.
 */
message KubernetesStigmerSandboxes {
  /**
   * Where each session runs: shared (every session on the shared runner
   * beside the server, one pod and one disk), agentSandbox (each session in a
   * pod of its own through agent-sandbox, agents.x-k8s.io) or substrate (each
   * session in an Agent Substrate actor, a gVisor sandbox on a pool of
   * workers, snapshotted to the bucket while it sleeps). Empty = shared. Both
   * per-session drivers need object_store, and the operator installs what
   * they run on.
   */
  string driver = 1 [(buf.validate.field).string = {
    in: [
      "",
      "shared",
      "agentSandbox",
      "substrate"
    ]
  }];

  /**
   * How long a quiet sandbox stays awake before it sleeps; it wakes with its
   * files on the session's next message. Empty = the driver's own default.
   */
  optional int32 idle_seconds = 2 [(buf.validate.field).int32.gte = 30];

  /**
   * Tunes the agentSandbox driver.
   */
  KubernetesStigmerAgentSandbox agent_sandbox = 3;

  /**
   * Tunes the substrate driver.
   */
  KubernetesStigmerSubstrate substrate = 4;

  option (buf.validate.message).cel = {
    id: "sandboxes.agent_sandbox_needs_driver"
    message: "sandboxes.agent_sandbox tunes the agentSandbox driver: set sandboxes.driver to agentSandbox, or remove it"
    expression: "!has(this.agent_sandbox) || this.driver == 'agentSandbox'"
  };

  option (buf.validate.message).cel = {
    id: "sandboxes.substrate_needs_driver"
    message: "sandboxes.substrate tunes the substrate driver: set sandboxes.driver to substrate, or remove it"
    expression: "!has(this.substrate) || this.driver == 'substrate'"
  };
}

/**
 * The agentSandbox driver.
 */
message KubernetesStigmerAgentSandbox {
  /**
   * Private ranges a sandbox may reach besides the server and the bucket,
   * such as a model gateway or an MCP server on your network. Sandboxes
   * always reach the server, the bucket, DNS and the public internet.
   */
  repeated string egress_allow_cidrs = 1 [
    (buf.validate.field).repeated.max_items = 64,
    (buf.validate.field).repeated.items.string.max_len = 43,
    (buf.validate.field).repeated.items.string.ip_prefix = true
  ];
}

/**
 * The substrate driver.
 */
message KubernetesStigmerSubstrate {
  /**
   * How many gVisor workers the pool keeps. Sessions beyond what they hold
   * wait for a free seat.
   */
  optional int32 workers = 1 [
    (dev.planton.shared.options.default) = "1",
    (buf.validate.field).int32.gte = 1
  ];

  /**
   * Each worker pod's requests and limits; the limits are the room every
   * sandbox on it shares.
   */
  dev.planton.kubernetes.KubernetesCoreV1ApiResourceRequirements worker_resources = 2;

  /**
   * Places the workers on matching nodes.
   */
  map<string, string> worker_node_selector = 3;

  /**
   * Lets the workers run on tainted nodes.
   */
  repeated dev.planton.kubernetes.KubernetesCoreV1ApiToleration worker_tolerations = 4;

  /**
   * Each sandbox's processor ceiling, in millicores. Empty = 2000.
   */
  optional int32 sandbox_cpu_millicores = 5 [(buf.validate.field).int32 = {
    gte: 1
    lte: 999999
  }];

  /**
   * Each sandbox's memory ceiling, in MiB. Empty = 2048.
   */
  optional int32 sandbox_memory_mib = 6 [(buf.validate.field).int32.gte = 1];

  /**
   * host:port addresses a sandbox may reach over plain HTTP, such as an
   * in-cluster model gateway (models.ai.svc.cluster.local:8080). Each host is
   * a DNS name of two or more labels, never an address. The server and the
   * bucket are added by the operator.
   */
  repeated string egress_http = 7 [
    (buf.validate.field).repeated.max_items = 64,
    (buf.validate.field).repeated.items.string.max_len = 259,
    (buf.validate.field).cel = {
      id: "substrate.egress_http.format"
      message: "sandboxes.substrate.egress_http holds host:port addresses whose host is a DNS name of two or more labels, such as models.ai.svc.cluster.local:8080"
      expression: "this.all(h, h.matches('^[a-z0-9]([a-z0-9-]*[a-z0-9])?([.][a-z0-9]([a-z0-9-]*[a-z0-9])?)+:[0-9]{1,5}$') && !h.matches('^[0-9.]+:[0-9]+$'))"
    }
  ];
}

/**
 * Which cluster-level operators Stigmer's operator may install. Each is
 * auto (install when missing, leave someone else's copy alone) or skip
 * (trust that it is installed; a missing one is refused in the status).
 * Empty = auto.
 */
message KubernetesStigmerPrerequisites {
  /**
   * CloudNativePG, which runs the bundled Postgres.
   */
  string postgres_operator = 1 [(buf.validate.field).string = {
    in: [
      "",
      "auto",
      "skip"
    ]
  }];

  /**
   * CloudNativePG's Barman Cloud plugin, which backs the bundled Postgres up
   * to the bucket. It needs cert-manager, which nothing here installs.
   */
  string postgres_backup_plugin = 2 [(buf.validate.field).string = {
    in: [
      "",
      "auto",
      "skip"
    ]
  }];

  /**
   * agent-sandbox's controller, which runs the agentSandbox driver's pods.
   */
  string agent_sandbox = 3 [(buf.validate.field).string = {
    in: [
      "",
      "auto",
      "skip"
    ]
  }];

  /**
   * Agent Substrate's control plane, which runs the substrate driver's
   * actors.
   */
  string substrate = 4 [(buf.validate.field).string = {
    in: [
      "",
      "auto",
      "skip"
    ]
  }];
}
