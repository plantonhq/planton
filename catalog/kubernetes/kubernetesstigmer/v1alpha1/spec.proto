syntax = "proto3";

package dev.planton.kubernetes.kubernetesstigmer.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/container_env.proto";
import "catalog/kubernetes/core_v1_api.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

/**
 * **KubernetesStigmerSpec** installs Stigmer, the open-source AI agent
 * platform, on a Kubernetes cluster: the Stigmer operator (the
 * `stigmer-operator` Helm chart, oci://ghcr.io/stigmer/charts) and the one
 * `stigmer.ai/v1 Stigmer` resource it reconciles into a running install (the
 * server, the shared runner, Postgres through CloudNativePG, Temporal, the
 * front door, sign-in and per-session sandboxes, each only when declared).
 *
 * WHY ONE KIND: Stigmer allows one operator and one Stigmer per cluster, and
 * the operator's version IS Stigmer's version (the resource has no version
 * field of its own). So the version is declared, upgraded and removed in the
 * one place the install is declared. A cluster already running Stigmer's
 * operator, or a Stigmer this kind did not declare, is refused before
 * anything is applied.
 *
 * WHAT THE MODULES DO, in order: create the operator's namespace when asked;
 * install the chart; write the Secrets this spec gives values for (the model
 * key, the bucket's key pair, the database password, SMTP credentials, the
 * license, Temporal's key and certificates, extra secret settings) under the
 * exact key names the operator reads, and only the keys declared; check that
 * a restore has the encryption keys it needs; declare the Stigmer. Keys this
 * spec leaves unset are not rendered, so the operator's own defaults stay
 * authoritative.
 *
 * DESTROY removes the Stigmer first, then waits, bounded, for the operator's
 * own cleanup (the bundled database and its volumes, the sandbox namespace,
 * and the prerequisites it installed: Agent Substrate, agent-sandbox, the
 * Barman Cloud plugin, CloudNativePG), then removes the Secrets and the
 * chart. If the operator cannot finish (no ready replica, or the wait runs
 * out), the destroy continues and prints what stays on the cluster and the
 * commands that remove it. The operator keeps three things on purpose: the
 * keys Secret `stigmer-keys` (so a backup stays restorable), the bucket's
 * archive, and an issued certificate. The chart keeps the `stigmers.stigmer.ai`
 * definition (`helm.sh/resource-policy: keep`).
 *
 * KEEP THE KEYS: `stigmer-keys` holds the encryption key every stored secret
 * and every backup is sealed with. Deleting the Stigmer's namespace deletes
 * it, and with it the ability to read any backup. Save it outside the
 * cluster with `keys_export_command` (an output) before you delete the
 * namespace or the cluster.
 *
 * Validated against Stigmer 0.3.2.
 */
message KubernetesStigmerSpec {
  /**
   * The namespace the Stigmer lives in: its server, runner, database,
   * Temporal and Secrets, and the keys Secret the operator keeps. It must
   * already exist; this kind never creates or deletes it, because deleting it
   * would delete the encryption keys and make every backup unreadable. Give it
   * a KubernetesNamespace of its own, or name one you keep.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef namespace = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesNamespace,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "spec.name"
  ];

  /**
   * The Stigmer version: the chart version, which is also the operator's and
   * the server's version (chart 0.3.2 runs Stigmer v0.3.2). Exact semver, at
   * 0.3.1 or later: 0.3.0 was never published as a chart. There is no default
   * on purpose: a default that moved with catalog updates would upgrade a
   * running install on an ordinary re-apply. Moving it below the version the
   * server runs is refused before anything is applied, because Stigmer's
   * server refuses to start on a database a newer version migrated; go back by
   * restoring a backup instead. Released versions:
   * https://github.com/stigmer/stigmer/releases
   */
  string version = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "version.semver"
      message: "version must be an exact Stigmer release such as \"0.3.2\": the chart, the operator and the server share it, and a range or a leading \"v\" names no chart"
      expression: "this.matches('^[0-9]+\\\\.[0-9]+\\\\.[0-9]+$')"
    },
    (buf.validate.field).cel = {
      id: "version.minimum"
      message: "version must be 0.3.1 or later: Stigmer's operator chart starts at 0.3.1"
      expression: "!this.matches('^0\\\\.([0-2]\\\\.[0-9]+|3\\\\.0)$')"
    }
  ];

  /**
   * The operator: where it runs and how its chart is tuned.
   */
  KubernetesStigmerOperator operator = 3 [(buf.validate.field).required = true];

  /**
   * Where Stigmer's own images (server, runner, sandboxes) are pulled from.
   * The tag is always `version`.
   */
  KubernetesStigmerImage image = 4;

  /**
   * The person who runs this install. With sign-in on, they own the
   * organization (the bundled sign-in creates their account first); with it
   * off, every action is attributed to them. Required whenever the bundled
   * sign-in is on.
   */
  KubernetesStigmerOwner owner = 5;

  /**
   * The Stigmer server.
   */
  KubernetesStigmerServer server = 6;

  /**
   * The shared runner: the worker that runs agents beside the server, and
   * the model key agents call their model with.
   */
  KubernetesStigmerRunner runner = 7;

  /**
   * Where Stigmer keeps its records. Unset: the operator runs Postgres for
   * you (through CloudNativePG, which it installs when missing).
   */
  KubernetesStigmerDatabase database = 8;

  /**
   * The workflow engine Stigmer's runs execute on. Unset: the operator runs
   * Temporal for you on the bundled database.
   */
  KubernetesStigmerTemporal temporal = 9;

  /**
   * The bucket Stigmer keeps its files in: what a run stores beside its
   * record, Skills, and the database's archive. Declared, the server and the
   * runner share no disk, runners read and write files through short-lived
   * URLs without ever holding the bucket's keys, and the bundled database
   * archives to the bucket from its first minute. Unset: files live on a
   * volume the server and the shared runner share. Backups, restores and
   * per-session sandboxes all need it.
   */
  KubernetesStigmerObjectStore object_store = 10;

  /**
   * The front door: the one hostname people reach Stigmer at, for the
   * console, the API, sign-in and files. Unset: the install is reached by
   * port-forward (`port_forward_command`).
   */
  KubernetesStigmerIngress ingress = 11;

  /**
   * How people sign in. Unset on an install with a front door: the operator
   * runs the bundled sign-in. Unset on one without: the server signs nobody
   * in and every caller acts as the owner, which is safe only while the
   * install is reachable from inside the cluster.
   */
  KubernetesStigmerIdentity identity = 12;

  /**
   * Stigmer Enterprise, under a license.
   */
  KubernetesStigmerEnterprise enterprise = 13;

  /**
   * Where engineers' agents run: on the shared runner beside the server, or
   * each session in a sandbox of its own.
   */
  KubernetesStigmerSandboxes sandboxes = 14;

  /**
   * Which cluster-level operators Stigmer's operator may install when they
   * are missing. A copy someone else installed is always left alone.
   */
  KubernetesStigmerPrerequisites prerequisites = 15;

  /**
   * Lets one upgrade proceed without the backup the operator takes first.
   * With backups on, the operator backs the database up before it rolls the
   * server to a new version, and holds the upgrade while that backup fails.
   * Set this to the same value as `version` to release that one held upgrade
   * without a backup (it becomes the `stigmer.ai/upgrade-without-backup`
   * annotation). It must equal `version`: remove it after the upgrade, so the
   * next upgrade is backed up again.
   */
  string upgrade_without_backup_to = 16 [(buf.validate.field).cel = {
    id: "upgrade_without_backup_to.format"
    message: "upgrade_without_backup_to must be an exact Stigmer release such as \"0.3.2\""
    expression: "this == '' || this.matches('^[0-9]+\\\\.[0-9]+\\\\.[0-9]+$')"
  }];

  option (buf.validate.message).cel = {
    id: "spec.upgrade_without_backup_to.matches_version"
    message: "upgrade_without_backup_to releases the upgrade to version without a backup, so it must equal version; remove it once the upgrade is done, so the next one is backed up"
    expression: "this.upgrade_without_backup_to == '' || this.upgrade_without_backup_to == this.version"
  };

  option (buf.validate.message).cel = {
    id: "spec.operator_namespace.not_created_in_stigmer_namespace"
    message: "operator.create_namespace creates operator.namespace and deletes it on destroy, and namespace names the same namespace, where the encryption keys live: deleting it would make every backup unreadable. Install the operator in a namespace of its own (stigmer-system by convention), or turn operator.create_namespace off"
    expression: "!has(this.operator) || !this.operator.create_namespace || !has(this.operator.namespace) || !has(this.namespace) || this.operator.namespace.value == '' || this.operator.namespace.value != this.namespace.value"
  };

  option (buf.validate.message).cel = {
    id: "spec.database.external_needs_temporal_external"
    message: "database.external names your own Postgres, and Stigmer's operator does not create Temporal's databases on a Postgres it does not run: bring your own Temporal too (temporal.external), or let the operator run the database"
    expression: "!has(this.database) || !has(this.database.external) || (has(this.temporal) && has(this.temporal.external))"
  };

  option (buf.validate.message).cel = {
    id: "spec.enterprise.needs_oidc"
    message: "Stigmer Enterprise signs every caller in, and a licensed server refuses to boot without sign-in: set identity.oidc"
    expression: "!has(this.enterprise) || (has(this.identity) && has(this.identity.oidc))"
  };

  option (buf.validate.message).cel = {
    id: "spec.enterprise.temporal_must_authenticate"
    message: "under a Stigmer Enterprise license, temporal.external must authenticate: whoever reaches a plaintext Temporal can start work on the runner's queue, and a licensed install serves many organizations. Set temporal.external.tls or temporal.external.api_key"
    expression: "!has(this.enterprise) || !has(this.temporal) || !has(this.temporal.external) || has(this.temporal.external.tls) || has(this.temporal.external.api_key)"
  };

  option (buf.validate.message).cel = {
    id: "spec.enterprise.needs_per_session_sandboxes"
    message: "a licensed Stigmer runs each session in a sandbox of its own, and refuses to run sessions side by side on the shared runner: set sandboxes.driver to agentSandbox or substrate"
    expression: "!has(this.enterprise) || (has(this.sandboxes) && (this.sandboxes.driver == 'agentSandbox' || this.sandboxes.driver == 'substrate'))"
  };

  option (buf.validate.message).cel = {
    id: "spec.database.backup_needs_object_store"
    message: "the database's backups and restores live in the bucket: declare object_store to use database.bundled.backup or database.bundled.recover_from"
    expression: "has(this.object_store) || !has(this.database) || !has(this.database.bundled) || (!has(this.database.bundled.backup) && !has(this.database.bundled.recover_from))"
  };

  option (buf.validate.message).cel = {
    id: "spec.server.artifacts_without_object_store"
    message: "server.artifacts sizes the artifacts volume, and an install with object_store keeps its artifacts in the bucket instead: remove server.artifacts"
    expression: "!has(this.object_store) || !has(this.server) || !has(this.server.artifacts)"
  };

  option (buf.validate.message).cel = {
    id: "spec.identity.bundled_needs_ingress"
    message: "the bundled sign-in serves people's browsers at the front door: declare ingress with the hostname they reach Stigmer at"
    expression: "!has(this.identity) || !has(this.identity.bundled) || has(this.ingress)"
  };

  option (buf.validate.message).cel = {
    id: "spec.owner.required_with_bundled_sign_in"
    message: "the bundled sign-in creates the owner's account first, so an exposed install needs owner.email; or name your own issuer in identity.oidc"
    expression: "!(has(this.identity) ? has(this.identity.bundled) : (has(this.ingress) && !(has(this.server) && this.server.allow_unauthenticated_exposure))) || has(this.owner)"
  };

  option (buf.validate.message).cel = {
    id: "spec.database.external_without_bundled_sign_in"
    message: "the bundled sign-in keeps its accounts on the bundled database, and database.external names your own: sign people in with your own issuer (identity.oidc), or let the operator run the database"
    expression: "!(has(this.identity) ? has(this.identity.bundled) : (has(this.ingress) && !(has(this.server) && this.server.allow_unauthenticated_exposure))) || !has(this.database) || !has(this.database.external)"
  };

  option (buf.validate.message).cel = {
    id: "spec.server.unauthenticated_exposure_without_identity"
    message: "server.allow_unauthenticated_exposure exposes the install with sign-in off, and identity turns sign-in on: keep one"
    expression: "!(has(this.server) && this.server.allow_unauthenticated_exposure) || !has(this.identity)"
  };

  option (buf.validate.message).cel = {
    id: "spec.sandboxes.per_session_needs_object_store"
    message: "a sandbox on any node reads and writes a run's files through the bucket, never through a shared disk: declare object_store to run agents in per-session sandboxes"
    expression: "!has(this.sandboxes) || this.sandboxes.driver == '' || this.sandboxes.driver == 'shared' || has(this.object_store)"
  };
}

/**
 * The Stigmer operator: its namespace and its chart's settings. The Helm
 * release is always named `stigmer-operator`, as Stigmer's own guide
 * installs it, because its cluster-wide role and the definition it owns are
 * named after the release. One operator runs per cluster; Stigmer's operator
 * stops at startup beside a second copy, and a running copy anywhere else is
 * refused before anything is applied.
 */
message KubernetesStigmerOperator {
  /**
   * The namespace the operator runs in ("stigmer-system" by convention).
   * Only the controller lives here; the Stigmer lives in `namespace`. To move
   * the operator to another namespace, destroy and re-create: an in-place
   * move is refused, because the release's cluster-wide objects and the kept
   * definition belong to the old one.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef namespace = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesNamespace,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "spec.name",
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true
  ];

  /**
   * When true, the operator's namespace is created before the chart is
   * installed and deleted with this resource. When false, it must already
   * exist (a KubernetesNamespace of its own, or one you keep for its quotas
   * and policies).
   */
  bool create_namespace = 2;

  /**
   * The operator image repository, for a registry mirror. Empty = the
   * chart's own (ghcr.io/stigmer/stigmer-operator). The tag is always
   * `version`: the chart has no setting this kind exposes for it, because a
   * different tag would run a different Stigmer from the one declared.
   */
  string image_repository = 3;

  /**
   * When the kubelet pulls the operator image. Empty = the chart's own
   * (IfNotPresent).
   */
  string image_pull_policy = 4 [(buf.validate.field).string = {
    in: [
      "",
      "Always",
      "IfNotPresent",
      "Never"
    ]
  }];

  /**
   * Names of image-pull Secrets in the operator's namespace, for a private
   * mirror.
   */
  repeated string image_pull_secrets = 5 [
    (dev.planton.shared.options.sensitive_exempt_reason) = "Names of existing Kubernetes Secrets (references), not secret material",
    (buf.validate.field).repeated.items.string.min_len = 1
  ];

  /**
   * Operator replicas. Empty = the chart's own (1). More replicas are
   * leader-elected warm standbys that shorten the operator's own failover.
   */
  optional int32 replicas = 6 [(buf.validate.field).int32.gte = 1];

  /**
   * The operator container's requests and limits: cpu, memory and
   * ephemeral-storage. Empty = the chart's own (requests 50m and 128Mi,
   * memory limit 512Mi).
   */
  KubernetesStigmerOperatorResources resources = 7;

  /**
   * The operator's log level. Empty = the chart's own (info).
   */
  string log_level = 8 [(buf.validate.field).string = {
    in: [
      "",
      "info",
      "debug"
    ]
  }];

  /**
   * Node selector for the operator pod.
   */
  map<string, string> node_selector = 9;

  /**
   * Tolerations for the operator pod.
   */
  repeated dev.planton.kubernetes.KubernetesCoreV1ApiToleration tolerations = 10;
}

/**
 * The operator container's resources, in the chart's own shape: only cpu,
 * memory and ephemeral-storage are accepted.
 */
message KubernetesStigmerOperatorResources {
  /**
   * Requests, keyed by cpu, memory or ephemeral-storage.
   */
  map<string, string> requests = 1 [
    (buf.validate.field).map.keys.string = {
      in: [
        "cpu",
        "memory",
        "ephemeral-storage"
      ]
    },
    (buf.validate.field).map.values.string.pattern = "^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$"
  ];

  /**
   * Limits, keyed by cpu, memory or ephemeral-storage.
   */
  map<string, string> limits = 2 [
    (buf.validate.field).map.keys.string = {
      in: [
        "cpu",
        "memory",
        "ephemeral-storage"
      ]
    },
    (buf.validate.field).map.values.string.pattern = "^(\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\\+|-)?(([0-9]+(\\.[0-9]*)?)|(\\.[0-9]+))))?$"
  ];
}

/**
 * Where Stigmer's images are pulled from, for a mirror or a private registry.
 */
message KubernetesStigmerImage {
  /**
   * The registry that holds every Stigmer image under its usual name.
   * Empty = Stigmer's own (ghcr.io/stigmer).
   */
  string registry = 1;

  /**
   * When the kubelet pulls Stigmer's images. Empty = IfNotPresent.
   */
  string pull_policy = 2 [(buf.validate.field).string = {
    in: [
      "",
      "Always",
      "IfNotPresent",
      "Never"
    ]
  }];

  /**
   * Names of image-pull Secrets in the Stigmer's namespace.
   */
  repeated string pull_secrets = 3 [
    (dev.planton.shared.options.sensitive_exempt_reason) = "Names of existing Kubernetes Secrets (references), not secret material",
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
}

/**
 * The person who runs the install.
 */
message KubernetesStigmerOwner {
  /**
   * The owner's sign-in address.
   */
  string email = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "owner.email.format"
      message: "owner.email must be an email address"
      expression: "this.contains('@')"
    }
  ];

  /**
   * How the owner is shown.
   */
  string name = 2;
}

/**
 * The Stigmer server.
 */
message KubernetesStigmerServer {
  /**
   * The server container's requests and limits. Empty = the operator's
   * defaults. A request above its limit, or memory below what the server
   * needs, is refused by the operator in the install's status.
   */
  dev.planton.kubernetes.KubernetesCoreV1ApiResourceRequirements resources = 1;

  /**
   * The server's own volume: the skill store and everything under its home
   * except artifacts. Empty = 5Gi on the cluster's default storage class.
   */
  KubernetesStigmerVolume storage = 2;

  /**
   * The volume the server writes artifacts to and the shared runner reads
   * them from, when no object_store is declared. Empty = 20Gi.
   */
  KubernetesStigmerVolume artifacts = 3;

  /**
   * Where your people ask for help, shown in the console.
   */
  KubernetesStigmerHelp help = 4;

  /**
   * Your own team's sign-in addresses, each exact (sam@example.com) or with
   * one * (*@example.com), left out of the onboarding count.
   */
  repeated string internal_accounts = 5;

  /**
   * Says, on purpose, that an install with a front door signs nobody in:
   * everyone who reaches the hostname acts as the owner. Without it, a front
   * door brings the bundled sign-in.
   */
  bool allow_unauthenticated_exposure = 6;

  /**
   * Fences the server's own outbound calls. Off by default: a server reaches
   * an issuer or an MCP server on your private network, which a fence would
   * cut.
   */
  KubernetesStigmerServerEgress egress = 7;

  /**
   * Extra settings for the server container. `variables` are written into
   * the server's spec; `secrets` are kept in a Secret this resource writes
   * (or read from your own) and reach the container by reference. A name the
   * operator sets itself is refused, so nothing here can silently undo the
   * declaration; `env_from` is not accepted, because Stigmer takes single
   * settings only.
   */
  dev.planton.kubernetes.ContainerEnv extra_env = 8 [
    (buf.validate.field).cel = {
      id: "server.extra_env.no_env_from"
      message: "server.extra_env.env_from is not accepted: Stigmer takes single settings, so list each one under variables or secrets"
      expression: "size(this.env_from) == 0"
    },
    (buf.validate.field).cel = {
      id: "server.extra_env.unique_names"
      message: "a setting may be declared in server.extra_env.variables or server.extra_env.secrets, not both"
      expression: "!this.variables.exists(v, this.secrets.exists(s, s.name == v.name))"
    },
    (buf.validate.field).cel = {
      id: "server.extra_env.not_operator_owned"
      message: "server.extra_env names a setting Stigmer's operator sets from the declaration, and a second value would silently replace it: set it through its own field, or remove the entry. The operator sets ANTHROPIC_*, OPENAI_API_KEY, AWS_BEARER_TOKEN_BEDROCK, DATABASE_URL, PG*, S3_*, TEMPORAL_*, GRPC_PORT, ARTIFACT_*, SANDBOX_PROVISIONER_TYPE, SKILL_* and most STIGMER_* settings"
      expression: "!this.variables.exists(v, v.name in ['ANTHROPIC_API_KEY','ANTHROPIC_BASE_URL','ANTHROPIC_FOUNDRY_API_KEY','ARTIFACT_LOCAL_BASE_PATH','ARTIFACT_LOCAL_SERVE_URL','ARTIFACT_STORAGE_TYPE','AWS_BEARER_TOKEN_BEDROCK','DATABASE_URL','GRPC_PORT','OPENAI_API_KEY','PGDATABASE','PGPASSWORD','PGSSLMODE','S3_ACCESS_KEY_ID','S3_BUCKET','S3_ENDPOINT','S3_REGION','S3_RUNNER_ENDPOINT','S3_SECRET_ACCESS_KEY','SANDBOX_PROVISIONER_TYPE','SKILL_ARTIFACT_STORAGE_TYPE','SKILL_TRANSFER_BASE_URL','STIGMER_ACCESS_HISTORY_RETENTION_DAYS','STIGMER_ACTIVITY_ROUTING','STIGMER_DEFAULT_EXECUTION_TARGET','STIGMER_ENCRYPTION_KEY','STIGMER_HELP_LABEL','STIGMER_HELP_URL','STIGMER_INTERNAL_ACCOUNTS','STIGMER_LICENSE_KEY','STIGMER_OIDC_AUDIENCE','STIGMER_OIDC_CONSOLE_CLIENT_ID','STIGMER_OIDC_DISCOVERY_URL','STIGMER_OIDC_ISSUER','STIGMER_OIDC_NATIVE_CLIENT_ID','STIGMER_OPERATOR_EMAIL','STIGMER_OPERATOR_NAME','STIGMER_ORGANIZATION_CREATORS','STIGMER_OUTBOUND_EGRESS','STIGMER_PLATFORM_TOKEN_KEY','STIGMER_RUNNER_API_KEY','STIGMER_RUNNER_TOKEN_KEY','STIGMER_SANDBOX_AGENT_SANDBOX_SUSPEND_AFTER_SECONDS','STIGMER_SANDBOX_BACKEND_ENDPOINT','STIGMER_SANDBOX_K8S_NAMESPACE','STIGMER_SANDBOX_MCP_PUBLIC_ENDPOINT','STIGMER_SANDBOX_RUNNER_ENV','STIGMER_SANDBOX_RUNNER_IMAGE','STIGMER_SANDBOX_RUNNER_SECRETS','STIGMER_SANDBOX_SUBSTRATE_API_CA_FILE','STIGMER_SANDBOX_SUBSTRATE_API_ENDPOINT','STIGMER_SANDBOX_SUBSTRATE_API_SERVER_NAME','STIGMER_SANDBOX_SUBSTRATE_API_TOKEN_FILE','STIGMER_SANDBOX_SUBSTRATE_ATESPACE','STIGMER_SANDBOX_SUBSTRATE_CPU_MILLICORES','STIGMER_SANDBOX_SUBSTRATE_EGRESS_HTTP','STIGMER_SANDBOX_SUBSTRATE_EGRESS_HTTPS_PLATFORM','STIGMER_SANDBOX_SUBSTRATE_MEMORY_MIB','STIGMER_SANDBOX_SUBSTRATE_ROUTER_CA_FILE','STIGMER_SANDBOX_SUBSTRATE_ROUTER_CLIENT_CERT_FILE','STIGMER_SANDBOX_SUBSTRATE_ROUTER_SERVER_NAME','STIGMER_SANDBOX_SUBSTRATE_ROUTER_URL','STIGMER_SANDBOX_SUBSTRATE_SUSPEND_AFTER_SECONDS','STIGMER_SANDBOX_SUBSTRATE_WORKER_SELECTOR','STIGMER_TEMPORAL_API_KEY','STIGMER_TEMPORAL_TLS','STIG