  string size = 1 [(buf.validate.field).cel = {
    id: "volume.size.quantity"
    message: "size must be a Kubernetes quantity such as 10Gi"
    expression: "this == '' || this.matches('^([0-9]+(\\\\.[0-9]*)?|\\\\.[0-9]+)([KMGTPE]i|[numkMGTPE])?$')"
  }];

  /**
   * The storage class the claim binds with. Empty = the cluster's default
   * class (some clusters, GKE 1.37 among them, have none: name one).
   */
  string storage_class_name = 2;
}

/**
