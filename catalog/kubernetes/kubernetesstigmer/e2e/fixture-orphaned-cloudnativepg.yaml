# What a cluster looks like after the catalog's CloudNativePG operator was
# destroyed: its definitions stay (the chart keeps them), stamped by a Helm
# release that no longer runs anything. A stub definition with the real
# name and a gone release's Helm annotations stands in for it; the fixture
# chain deletes it at teardown, so it never outlives the lane.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesManifest
metadata:
  name: e2e-stigmer-orphaned-cnpg
spec:
  skip_await: true
  manifest_yaml: |
    apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    metadata:
      name: clusters.postgresql.cnpg.io
      labels:
        app.kubernetes.io/managed-by: Helm
      annotations:
        meta.helm.sh/release-name: cnpg-e2e-removed
        meta.helm.sh/release-namespace: cnpg-system
    spec:
      group: postgresql.cnpg.io
      scope: Namespaced
      names:
        kind: Cluster
        listKind: ClusterList
        plural: clusters
        singular: cluster
      versions:
        - name: v1
          served: true
          storage: true
          schema:
            openAPIV3Schema:
              type: object
              x-kubernetes-preserve-unknown-fields: true
