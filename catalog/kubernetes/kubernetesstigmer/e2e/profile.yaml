apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: kubernetesstigmer
spec:
  tier: 4
  # Stigmer v0.3.2 from its published operator chart, and the one Stigmer
  # resource the operator reconciles. Every lane proves what a platform
  # engineer is promised: the install reaches Ready at the declared version,
  # and an agent answers a message, driven through Stigmer's own Go SDK
  # against the fake Anthropic model the entrypoints serve
  # (catalog/kubernetes/aa_e2e/fakemodel), so no key is needed and nothing
  # is spent. Destroy keeps the namespace's encryption keys and the Stigmer
  # definition and removes what the operator installed.
  #
  # Stigmer runs one operator and one install per cluster, so every lane
  # uses the same fixed names (the namespace stigmer, the operator in
  # stigmer-system), which also makes the framework run this kind alone:
  # no other kind's CloudNativePG can come and go under a running lane.
  # Each lane first clears definitions an earlier lane on the shared
  # cluster left with no controller running them
  # (scenarios/clean-slate.setup.sh).
  #
  # Green on both engines: minimal (with the import round trip),
  # bring-your-own, prerequisite-orphaned, operator-namespace-moved,
  # downgrade-refused, keys-missing, upgrade, bucket-and-restore,
  # composed-prerequisites, agent-sandbox, exposed and substrate. Substrate's
  # destroy is held to the kind's accepted limit (README, "What a destroy
  # leaves"): Stigmer's operator does not end a live session's Substrate
  # actor, so its cleanup cannot finish inside the destroy's wait.
  #
  # timeout_minutes: one engine's twelve scenarios take about 150 minutes on
  # a laptop kind cluster (substrate's destroy alone waits its full ten
  # minutes); 180 leaves headroom.
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 180
