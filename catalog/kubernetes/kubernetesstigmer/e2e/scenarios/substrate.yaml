# Each session as an Agent Substrate actor, in a gVisor sandbox on a pool of
# workers, which the operator installs (the pod-certificates cluster profile
# gives it the Kubernetes APIs it needs). Substrate's egress takes DNS names,
# so the fake model is reached by the in-cluster name the model-service
# fixture gives it, named as a sandbox egress address. Per-session sandboxes
# move a run's files through the bucket, with cert-manager for the backup
# plugin the bucket turns on. The agent's run must complete; destroy
# removes Substrate with the rest.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesStigmer
metadata:
  name: stigmer
  annotations:
    planton.dev/e2e-cluster-profile: "pod-certificates"
    planton.dev/e2e-prerequisites: "KubernetesCertManager, catalog/kubernetes/kubernetesstigmer/e2e/fixture-namespace.yaml, catalog/kubernetes/kubernetesstigmer/e2e/fixture-s3-store.yaml, catalog/kubernetes/kubernetesstigmer/e2e/fixture-model-service.yaml"
    planton.dev/e2e-setup-script: "catalog/kubernetes/kubernetesstigmer/e2e/scenarios/clean-slate.setup.sh"
    planton.dev/e2e-required-env: "PLANTON_E2E_FAKE_MODEL_URL, PLANTON_E2E_FAKE_MODEL_IP, PLANTON_E2E_FAKE_MODEL_PORT"
spec:
  namespace:
    value: stigmer
  version: 0.3.2
  operator:
    namespace:
      value: stigmer-system
    create_namespace: true
  runner:
    model:
      keys:
        anthropic_api_key: sk-ant-e2e-fake
        anthropic_base_url: http://fake-model.e2e-stigmer-model.svc.cluster.local:8080
  object_store:
    s3:
      bucket:
        value: stigmer
      endpoint:
        valueFrom:
          kind: KubernetesSeaweedFs
          name: e2e-stigmer-s3
          fieldPath: status.outputs.s3_endpoint
      credentials:
        access_key:
          access_key_id: e2e-stigmer-admin
          secret_access_key: e2e-stigmer-admin-secret-not-a-real-secret
  sandboxes:
    driver: substrate
    substrate:
      workers: 1
      egress_http:
        - fake-model.e2e-stigmer-model.svc.cluster.local:8080
