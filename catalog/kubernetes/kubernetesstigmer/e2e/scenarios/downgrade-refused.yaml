# Stigmer 0.3.2, then a second act that moves version back to 0.3.1
# (downgrade-refused.to.yaml). Stigmer's server refuses to start on a database
# a newer release migrated, so the kind refuses the move before anything
# changes, in the same words on both engines; the first install is then
# destroyed as built.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesStigmer
metadata:
  name: stigmer
  annotations:
    planton.dev/e2e-prerequisites: "catalog/kubernetes/kubernetesstigmer/e2e/fixture-namespace.yaml"
    planton.dev/e2e-setup-script: "catalog/kubernetes/kubernetesstigmer/e2e/scenarios/clean-slate.setup.sh"
    planton.dev/e2e-required-env: "PLANTON_E2E_FAKE_MODEL_URL"
    planton.dev/e2e-upgrade-manifest: downgrade-refused.to.yaml
    planton.dev/e2e-expect-upgrade-failure: stigmer-downgrade
spec:
  namespace:
    value: stigmer
  version: 0.3.2
  operator:
    namespace:
      value: stigmer-system
    create_namespace: true
  runner:
    model:
      keys:
        anthropic_api_key: sk-ant-e2e-fake
        anthropic_base_url: ${E2E_ENV:PLANTON_E2E_FAKE_MODEL_URL}
