# A restore into a namespace that does not hold the source install's
# encryption keys: the archive is sealed with them, and without them the
# operator would mint new keys and the restored records could not be read.
# The kind refuses before the Stigmer is declared, naming the saved keys
# file to apply.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesStigmer
metadata:
  name: stigmer
  annotations:
    planton.dev/e2e-prerequisites: "KubernetesCertManager, catalog/kubernetes/kubernetesstigmer/e2e/fixture-namespace.yaml, catalog/kubernetes/kubernetesstigmer/e2e/fixture-s3-store.yaml"
    planton.dev/e2e-setup-script: "catalog/kubernetes/kubernetesstigmer/e2e/scenarios/clean-slate.setup.sh"
    planton.dev/e2e-expect-deploy-failure: stigmer-keys-missing
spec:
  namespace:
    value: stigmer
  version: 0.3.2
  operator:
    namespace:
      value: stigmer-system
    create_namespace: true
  runner:
    model:
      keys:
        anthropic_api_key: sk-ant-e2e-fake
  object_store:
    s3:
      bucket:
        value: stigmer
      endpoint:
        valueFrom:
          kind: KubernetesSeaweedFs
          name: e2e-stigmer-s3
          fieldPath: status.outputs.s3_endpoint
      credentials:
        access_key:
          access_key_id: e2e-stigmer-admin
          secret_access_key: e2e-stigmer-admin-secret-not-a-real-secret
  database:
    bundled:
      recover_from:
        server_name: stigmer-postgres
