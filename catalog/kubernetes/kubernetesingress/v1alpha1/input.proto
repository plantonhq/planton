syntax = "proto3";

package dev.planton.kubernetes.kubernetesingress.v1alpha1;

import "catalog/kubernetes/kubernetesingress/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

/**
 * **KubernetesIngressIacInput** defines the input structure for deploying a
 * Kubernetes Ingress. It carries the target Ingress specification and the
 * Kubernetes cluster configuration the IaC modules (Pulumi and Terraform) need
 * to reach the cluster.
 */
message KubernetesIngressIacInput {
  /**
   * The target Ingress resource to be created.
   * Contains the complete specification including metadata, host rules, and TLS.
   */
  KubernetesIngress target = 1;

  /**
   * Kubernetes cluster configuration.
   * Contains connection details and credentials for the target Kubernetes
   * cluster where the Ingress will be created.
   */
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
