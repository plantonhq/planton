apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesingress
spec:
  # An Ingress's identity is fully carried by its namespace/name pair --
  # derivable from a prior deploy's outputs or from the spec itself.
  values:
    - name: ingress_name
      derivations:
        - from_output: ingress_name
        - from_spec_field: name
      where_to_find: >-
        `kubectl get ingresses -A` (NAME column).
    - name: ingress_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `kubectl get ingresses -A` (NAMESPACE column); "default" when the
        spec omits the namespace.
