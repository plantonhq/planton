syntax = "proto3";

package dev.planton.kubernetes.kubernetesgatekeeper.v1alpha1;

/**
 * Outputs exported after installing OPA Gatekeeper.
 */
message KubernetesGatekeeperOutputs {
  /**
   * Namespace the engine runs in.
   */
  string namespace = 1;

  /**
   * Helm release name (equals metadata.name).
   */
  string release_name = 2;

  /**
   * Name of the webhook Service the ValidatingWebhookConfiguration /
   * MutatingWebhookConfiguration point at
   * (`gatekeeper-webhook-service`).
   */
  string webhook_service_name = 3;

  /**
   * Name of the Secret carrying the webhook server certificate
   * (`gatekeeper-webhook-server-cert`) — chart-fixed; rotated by the
   * embedded cert-controller unless an external certificate is
   * injected.
   */
  string webhook_cert_secret_name = 4;
}
