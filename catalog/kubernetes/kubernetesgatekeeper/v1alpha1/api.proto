syntax = "proto3";

package dev.planton.kubernetes.kubernetesgatekeeper.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesgatekeeper/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesgatekeeper/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesGatekeeper is a kind that installs OPA
// Gatekeeper, the Open Policy Agent's admission controller for
// Kubernetes, on a cluster. Gatekeeper enforces policies declared as
// ConstraintTemplates (Rego or CEL) instantiated by Constraint
// resources, and audits existing resources against them.
//
// This component installs the engine (webhook controller manager,
// audit controller, constraint-framework CRDs). ConstraintTemplates
// and Constraints are separate resources applied once the engine runs.
message KubernetesGatekeeper {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesGatekeeper'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesGatekeeperSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesGatekeeperStatus status = 5;
}

// KubernetesGatekeeperStatus describes the observed state of the engine.
message KubernetesGatekeeperStatus {
  // outputs
  KubernetesGatekeeperOutputs outputs = 1;
}
