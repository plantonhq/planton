apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesgatekeeper
spec:
  # Gatekeeper installs as one Helm release NAMED AFTER metadata.name,
  # plus the optional anchor namespace. The chart HARDCODES its resource
  # names (gatekeeper-webhook-service, gatekeeper-webhook-server-cert,
  # ...) so nothing else derives from the release name. The module
  # materializes no Secrets: the webhook certificate is generated and
  # rotated by the engine's embedded cert-controller (or
  # cert-manager-issued in the external-cert arm) and travels with the
  # release import.
  values:
    - name: release_name
      derivations:
        - from_output: release_name
        - from_metadata_name: true
      where_to_find: >-
        `helm list -n <namespace>` (NAME column) — the release shares the
        resource's name.
    - name: release_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `helm list -A` (NAMESPACE column); conventionally
        "gatekeeper-system".
    # ── the optional anchor namespace ────────────────────────────────────
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the installation
        namespace itself.
