# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: kubernetesflinkoperator
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubernetes_namespace_v1.flink_operator (rendered only when spec.create_namespace is true) AND kubernetes_namespace_v1.watch -- the modules create every namespace listed in spec.watch_namespaces before the release, because the chart plants job RBAC into them without creating them. get is needed for refresh either way; delete applies only to module-owned namespaces.
      - api_groups:
          - ""
        resources:
          - secrets
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers kubernetes_secret_v1.webhook_keystore -- the module-generated webhook keystore password Secret that replaces the chart's hardcoded-public-password default. Rendered only when spec.webhook_enabled is true (the default).
      - api_groups:
          - ""
        resources:
          - services
          - serviceaccounts
          - configmaps
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Chart-rendered objects applied by helm_release.flink_operator -- the webhook Service (ClusterIP), the operator ServiceAccount, the job ServiceAccount (planted into the operator namespace and each watched namespace; marked helm.sh/resource-policy keep), and the flink-conf ConfigMap when spec.operator_config is set.
      - api_groups:
          - apps
        resources:
          - deployments
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: The chart's operator Deployment, applied by helm_release.flink_operator.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - clusterroles
          - clusterrolebindings
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: With spec.watch_namespaces empty (watch everything, the default), the chart grants the operator's reconcile access cluster-wide through ClusterRole/ClusterRoleBinding.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - roles
          - rolebindings
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Namespaced RBAC the chart renders -- the operator's own Role/RoleBinding, and with spec.watch_namespaces set, the job ServiceAccount's Role/RoleBinding planted into each watched namespace (templates/flink/*).
      - api_groups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - get
          - list
          - create
        cluster_scoped: true
        provenance: derived
        notes: Helm installs the chart's four flink.apache.org CRDs from its crds/ directory on first install -- it never upgrades them on chart bumps and leaves them on uninstall (no update/delete needed by design; CRD changes are applied manually per the upstream release notes).
      - api_groups:
          - admissionregistration.k8s.io
        resources:
          - validatingwebhookconfigurations
          - mutatingwebhookconfigurations
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: The chart's two fail-closed webhook configurations (validation and defaulting of Flink CRs at admission). Rendered only when spec.webhook_enabled is true (the default).
      - api_groups:
          - cert-manager.io
        resources:
          - issuers
          - certificates
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: The chart renders a cert-manager Issuer and Certificate UNCONDITIONALLY on the webhook arm (spec.webhook_enabled true, the default) -- there is no self-signed fallback, which is why KubernetesCertManager is this component's prerequisite. webhook_enabled=false removes both.
      - api_groups:
          - ""
        resources:
          - secrets
        verbs:
          - list
          - watch
        cluster_scoped: false
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Secret in keystore_secret.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing. Listing or watching Secrets returns their data, not only their names, so this grants read of every Secret in the namespace. Pulumi's delete wait cannot watch a deleted Secret without it.
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - list
          - watch
        cluster_scoped: true
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Namespace in namespace.go and the Namespace in watch_namespaces.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
