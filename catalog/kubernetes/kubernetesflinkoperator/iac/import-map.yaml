apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesflinkoperator
spec:
  # One Helm release named after metadata.name, the optional anchor
  # namespace, the module-owned watch namespaces (for_each when
  # watch_namespaces is set), and — webhook-enabled installs only — the
  # module-owned keystore-password Secret with its random_password
  # companion (imported by VALUE: the random provider keeps no cloud
  # state). Everything the chart creates inside the release (the
  # operator Deployment, the webhook Service/configurations, the
  # cert-manager Certificate/Issuer, the kept job ServiceAccount)
  # travels with the release import. The flink.apache.org CRDs ride the
  # chart's crds/ directory (Helm-owned, install-once) and are never
  # separate state addresses.
  values:
    - name: release_name
      derivations:
        - from_output: release_name
        - from_metadata_name: true
      where_to_find: >-
        `helm list -n <namespace>` (NAME column) — the release shares the
        resource's name.
    - name: release_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `helm list -A` (NAMESPACE column); conventionally "flink-system".
    # ── the optional anchor namespace ────────────────────────────────────
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the installation
        namespace itself.
    # ── module-owned watch namespaces (for_each resource "watch") ───────
    # Keyed by the namespace name itself (a spec.watch_namespaces entry),
    # so the import ID derives blind from the state address key. Absent
    # entirely when watch_namespaces is empty.
    - name: namespace_name
      tofu_resource_name: watch
      derivations:
        - from_address_key: true
      where_to_find: >-
        Each watch namespace's metadata.name is the for_each key (a
        `spec.watch_namespaces` entry) — `kubectl get ns` (NAME column).
    # ── the module-owned webhook keystore Secret ─────────────────────────
    # Deterministic name "<metadata.name>-webhook-keystore"; count-indexed
    # (webhook-enabled installs only), so from_address_key cannot serve it
    # — the scoped suffix derivation does. Absent entirely when
    # webhook_enabled is false.
    - name: secret_name
      tofu_resource_name: webhook_keystore
      derivations:
        - from_metadata_name_suffix: "-webhook-keystore"
      where_to_find: >-
        Always "<resource-name>-webhook-keystore" on webhook-enabled
        installs — `kubectl get secrets -n <namespace>` (key `password`;
        the module-generated replacement for the chart's hardcoded
        default).
    - name: secret_namespace
      tofu_resource_name: webhook_keystore
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same namespace as the installation.
    # ── the keystore password's random_password companion ────────────────
    - name: password_value
      tofu_resource_name: webhook_keystore
      derivations:
        - from_cluster_secret_key:
            name_suffix: "-webhook-keystore"
            key: password
      where_to_find: >-
        The live password VALUE, read from the module-owned Secret's
        `password` key (the random provider keeps no cloud state — the
        import adopts the credential as it runs).
