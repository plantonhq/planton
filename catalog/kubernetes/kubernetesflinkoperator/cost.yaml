# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: kubernetesflinkoperator
spec:
  billing_model: cluster_capacity
  cost_drivers:
    - field_path: replicas
      sku_meter: cluster CPU and memory reservations
      impact: Each replica is a full operator pod (a JVM) carrying the declared resource requests. More than 1 pairs with module-rendered leader election -- one active reconciler, warm standbys -- so extra replicas buy failover, each reserving its own capacity.
    - field_path: resources
      sku_meter: cluster CPU and memory reservations
      impact: The CPU and memory requests are what the scheduler reserves per replica. Empty means the chart defaults, and this chart ships NO default requests or limits -- the operator pods schedule unbounded and the cluster reserves nothing for them.
    - field_path: operator_config
      sku_meter: cluster CPU and memory reservations
      impact: Entries become cluster-wide defaults for every FlinkDeployment this operator manages (reconcile intervals, autoscaler defaults) -- they shape the OPERANDS' capacity behavior, not this pod's reservation.
  estimate_exclusions:
    - no capacity derivation is published for this kind -- neither committed preset declares resources and the chart ships no default requests or limits for the operator container, so a manifest-time footprint would state zero reservation, which is the truth but not a useful capacity statement; set resources to reserve capacity deliberately
    - the Flink clusters this operator creates are the real capacity story -- each rides its own KubernetesFlinkDeployment (or directly authored flink.apache.org CR), never this component's footprint
    - "helm_values merges LAST over the typed rendering and can override modeled values, including resources and replicas -- this profile describes the spec's declaration"
    - the price of reserved CPU and memory is the target cluster's node economics, which this catalog cannot know
  notes: "This component creates no cloud SKU of its own -- its cost is the share of the cluster its operator pods reserve, realized on the cluster's bill. The operator is the control plane, not the workload: JobManagers and TaskManagers belong to the KubernetesFlinkDeployment resources it reconciles, and their capacity is stated there."
