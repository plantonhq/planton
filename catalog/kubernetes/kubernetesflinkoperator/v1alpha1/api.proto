syntax = "proto3";

package dev.planton.kubernetes.kubernetesflinkoperator.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesflinkoperator/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesflinkoperator/v1alpha1/spec.proto";
import "shared/metadata.proto";

//flink-operator-kubernetes
message KubernetesFlinkOperator {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesFlinkOperator'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesFlinkOperatorSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesFlinkOperatorStatus status = 5;
}

//flink-operator-kubernetes status.
message KubernetesFlinkOperatorStatus {
  //outputs
  KubernetesFlinkOperatorOutputs outputs = 1;
}
