apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesopensearch
spec:
  # One kubectl_manifest — the OpenSearchCluster CR, named after
  # metadata.name — plus the optional anchor namespace. Everything the
  # operator creates from the CR (StatefulSets, Services, Secrets,
  # certificates) is operator-owned and never imported.
  values:
    - name: api_version
      derivations:
        - literal: opensearch.opster.io/v1
      where_to_find: >-
        Always "opensearch.opster.io/v1" — the CR's group/version at the
        pinned stable operator (the 3.x line migrates to opensearch.org).
    - name: kind
      derivations:
        - literal: OpenSearchCluster
      where_to_find: Always "OpenSearchCluster" — the CR kind this module applies.
    - name: name
      derivations:
        - from_metadata_name: true
        - from_output: cluster_name
      where_to_find: >-
        The OpenSearchCluster CR's metadata.name (equals the Planton
        resource name) — `kubectl get opensearchcluster -A` (NAME column).
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The cluster's namespace — `kubectl get opensearchcluster -A`
        (NAMESPACE column).
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the cluster's
        namespace itself.
