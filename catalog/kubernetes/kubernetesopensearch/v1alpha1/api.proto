syntax = "proto3";

package dev.planton.kubernetes.kubernetesopensearch.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesopensearch/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesopensearch/v1alpha1/spec.proto";
import "shared/metadata.proto";

//elasticsearch-kubernetes
message KubernetesOpenSearch {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesOpenSearch'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesOpenSearchSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesOpenSearchStatus status = 5;
}

//elasticsearch-kubernetes status.
message KubernetesOpenSearchStatus {
  //outputs
  KubernetesOpenSearchOutputs outputs = 1;
}
