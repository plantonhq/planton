# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: kubernetesprometheusrule
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The object stores no data of its own -- it is a Kubernetes API object persisted in the cluster's etcd, whose encryption at rest is a property of the target cluster's control plane. The series recording rules write live in the evaluating Prometheus's storage, configured on that component.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: There is no data at rest to key (see enc-at-rest); customer-managed keys for etcd belong to the cluster component, and for metric storage to the Prometheus component.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The object opens no connection. Alerts travel from Prometheus to Alertmanager and recorded series to remote storage over connections configured on those components.
    - control_id: no-public-access
      status: not_applicable
      notes: A PrometheusRule is configuration a Prometheus loads, not a network endpoint.
    - control_id: restricted-ingress
      status: not_applicable
      notes: There is no endpoint to restrict ingress to (see no-public-access).
    - control_id: edge-protection
      status: not_applicable
      notes: There is no endpoint to protect at the edge (see no-public-access).
    - control_id: rbac
      status: not_applicable
      notes: Who may create, change or delete the object is governed by the target cluster's Kubernetes RBAC. Which Prometheus loads the rules is governed by that Prometheus's rule selector and namespace selector, outside this spec.
    - control_id: workload-identity
      status: not_applicable
      notes: The object runs nothing and holds no credentials, so it has no identity to federate.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The object performs no authentication.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The object has no users.
    - control_id: audit-logging
      status: not_applicable
      notes: Changes to the object are recorded by the cluster's API server audit log, a property of the cluster component. Rule evaluation outcomes are visible in the evaluating Prometheus's own metrics (prometheus_rule_evaluation_failures_total).
    - control_id: monitoring-integration
      status: configurable
      field_path: groups
      evidence:
        type: spec_default
        reference: The component IS monitoring configuration -- each alerting rule turns a PromQL condition into an alert Alertmanager routes by the rule's labels, and each recording rule precomputes a series dashboards and other rules read.
      notes: The 01-error-budget-burn-alerts preset declares multi-window error-budget burn alerts with severity labels and runbook annotations; 02-recording-rules declares the recording rules those alerts read.
    - control_id: backup-recovery
      status: not_applicable
      notes: The object is declared from a manifest, so its recovery is re-applying the manifest; it holds no state that a backup could preserve and a manifest could not.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: There is nothing to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The object has no replicas. Availability of rule evaluation is a property of the Prometheus replicas that load it.
    - control_id: deletion-protection
      status: not_applicable
      notes: The object carries no deletion protection of its own; Kubernetes objects are protected through RBAC and admission policy on the cluster.
    - control_id: managed-patching
      status: not_applicable
      notes: The object runs no software to patch; the prometheus-operator and Prometheus that read it are patched through their own component.
