apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesPrometheusRule
metadata:
  name: <service>-slo-recording
spec:
  namespace:
    value: <namespace>
  groups:
    - name: <service>-slo-recording
      interval: 30s
      rules:
        - record: job:slo_errors_per_request:ratio_rate5m
          expr: sum by (job) (rate(<requests_metric>{job="<job>",<error_selector>}[5m])) / sum by (job) (rate(<requests_metric>{job="<job>"}[5m]))
        - record: job:slo_errors_per_request:ratio_rate30m
          expr: sum by (job) (rate(<requests_metric>{job="<job>",<error_selector>}[30m])) / sum by (job) (rate(<requests_metric>{job="<job>"}[30m]))
        - record: job:slo_errors_per_request:ratio_rate1h
          expr: sum by (job) (rate(<requests_metric>{job="<job>",<error_selector>}[1h])) / sum by (job) (rate(<requests_metric>{job="<job>"}[1h]))
        - record: job:slo_errors_per_request:ratio_rate6h
          expr: sum by (job) (rate(<requests_metric>{job="<job>",<error_selector>}[6h])) / sum by (job) (rate(<requests_metric>{job="<job>"}[6h]))
