syntax = "proto3";

package dev.planton.kubernetes.kubernetesprometheusrule.v1alpha1;

import "catalog/kubernetes/kubernetesprometheusrule/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// KubernetesPrometheusRuleStackInput provides the inputs for creating the
// PrometheusRule on a Kubernetes cluster.
message KubernetesPrometheusRuleStackInput {
  // target cloud-resource
  KubernetesPrometheusRule target = 1;
  // provider-config
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
