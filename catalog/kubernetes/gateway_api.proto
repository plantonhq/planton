syntax = "proto3";

package dev.planton.kubernetes;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// Shared Gateway API types used across multiple Planton Gateway API kinds.
// Translated from kubernetes-sigs/gateway-api v1.6.1:
//   - apis/v1/shared_types.go
//   - apis/v1/object_reference_types.go
//   - apis/v1/gateway_types.go (listener building blocks shared with ListenerSet)
//   - apis/v1/gatewayclass_types.go (ParametersReference only)
//   - apis/v1/listenerset_types.go (ParentGatewayReference)
//
// Status types (RouteStatus, RouteParentStatus, GatewayStatus, etc.) are
// intentionally excluded — Planton captures deployment outputs via
// outputs.proto, not CRD status subresources.
//
// Note on reference field validation: every object-reference message below
// repeats the same group/kind (and, where present, section_name) buf.validate
// rules. This duplication is intentional — it mirrors upstream's per-field
// type aliases (Group, Kind, ObjectName, SectionName), each carrying its own
// kubebuilder markers. buf.validate predefined-rules are deliberately NOT used
// to DRY this up: there is no precedent for them anywhere in this repo, and a
// shared wrapper message would distort the flat upstream shape. Keep each
// message self-contained and faithful to its upstream type.
//
// Note on `name` fields: where a reference's default target is a resource kind
// Planton models as a first-class kind (Gateway, Service, Secret,
// ConfigMap), the name is a StringValueOrRef foreign key so infra charts can
// wire it with valueFrom and the resource graph gets a real dependency edge.
// The upstream length/format constraints on those names are enforced by the
// Kubernetes API server at apply time; the referenced object's own creation
// already validated them. When the reference targets something other than the
// default kind (set via group/kind), pass the literal name with `value:`.

// KubernetesGatewayApiParentReference identifies an API object (usually a
// Gateway) that can be considered a parent of a route resource.
//
// Upstream: ParentReference in apis/v1/shared_types.go
message KubernetesGatewayApiParentReference {
  // Group of the referent.
  // When unspecified, "gateway.networking.k8s.io" is inferred.
  // Set to "" (empty string) for the core API group.
  //
  // Upstream default: "gateway.networking.k8s.io"
  // Group pattern: empty or an RFC 1123 subdomain (max 253).
  optional string group = 1 [(buf.validate.field).string = {
    max_len: 253
    pattern: "^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
  }];

  // Kind of the referent.
  // Core parent kinds: Gateway (Gateway conformance), Service (Mesh conformance).
  //
  // Upstream default: "Gateway"
  // Kind pattern: 1-63 chars, ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
  optional string kind = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$"
  }];

  // Namespace of the referent. When unspecified, refers to the local
  // namespace of the Route. Cross-namespace references require a
  // ReferenceGrant in the target namespace.
  optional string namespace = 3;

  // Name of the referent. Defaults to a KubernetesGateway foreign key: in an
  // infra chart, wire it with valueFrom against the Gateway resource and the
  // route deploys after (and follows renames of) its Gateway. When the parent
  // is not a Planton-managed Gateway (a ListenerSet, a mesh Service, or an
  // externally created Gateway), pass the literal name with `value:`.
  dev.planton.shared.foreignkey.v1.StringValueOrRef name = 4 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesGateway,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.gateway_name",
    (dev.planton.shared.options.diagram_label) = "attached to"
  ];

  // Name of a section within the target resource (e.g., a Gateway Listener
  // name). When unspecified, references the entire resource.
  //
  // SectionName pattern: 1-253 chars, RFC 1123 subdomain
  // ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
  optional string section_name = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 253
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
  }];

  // Network port this Route targets on the parent resource.
  optional int32 port = 6 [(buf.validate.field).int32 = {
    gte: 1
    lte: 65535
  }];
}

// KubernetesGatewayApiParentGatewayReference identifies the Gateway a
// ListenerSet attaches its listeners to. Unlike the route-side
// ParentReference it has no section_name or port — a ListenerSet always
// attaches to the Gateway as a whole.
//
// Upstream: ParentGatewayReference in apis/v1/listenerset_types.go
message KubernetesGatewayApiParentGatewayReference {
  // Group of the referent.
  //
  // Upstream default: "gateway.networking.k8s.io"
  // Group pattern: empty or an RFC 1123 subdomain (max 253).
  optional string group = 1 [(buf.validate.field).string = {
    max_len: 253
    pattern: "^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
  }];

  // Kind of the referent.
  //
  // Upstream default: "Gateway"
  // Kind pattern: 1-63 chars, ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
  optional string kind = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$"
  }];

  // Namespace of the referent. When unspecified, the ListenerSet's own
  // namespace is assumed. The parent Gateway must allow attachment from the
  // ListenerSet's namespace via its allowed_listeners configuration.
  optional string namespace = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
  }];

  // Name of the parent Gateway. Defaults to a KubernetesGateway foreign key:
  // in an infra chart, wire it with valueFrom against the Gateway resource so
  // the ListenerSet deploys after its Gateway. Pass the literal name with
  // `value:` when the Gateway is not Planton-managed.
  dev.planton.shared.foreignkey.v1.StringValueOrRef name = 4 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesGateway,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.gateway_name",
    (dev.planton.shared.options.diagram_label) = "extends gateway"
  ];
}

// KubernetesGatewayApiBackendObjectReference defines a reference to a backend
// Kubernetes object (usually a Service).
//
// Upstream: BackendObjectReference in apis/v1/object_reference_types.go
//
// When the referent is a core Service, port is required.
message KubernetesGatewayApiBackendObjectReference {
  option (buf.validate.message).cel = {
    id: "backend_object_ref.port_required_for_service"
    message: "port must be specified when referencing a core API Service (group is empty and kind is 'Service')"
    expression: "(!has(this.group) || this.group == '') && (!has(this.kind) || this.kind == 'Service') ? has(this.port) : true"
  };

  // Group of the referent. Empty string infers the core API group.
  //
  // Upstream default: "" (core API group)
  // Group pattern: empty or an RFC 1123 subdomain (max 253).
  optional string group = 1 [(buf.validate.field).string = {
    max_len: 253
    pattern: "^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
  }];

  // Kind of the referent.
  //
  // Upstream default: "Service"
  // Kind pattern: 1-63 chars, ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
  optional string kind = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$"
  }];

  // Name of the referent. Defaults to a KubernetesService foreign key: in an
  // infra chart, wire it with valueFrom against the backend Service and the
  // route deploys after its backend. When the backend is not a
  // Planton-managed Service (a custom backend kind, or a Service created
  // outside Planton), pass the literal name with `value:`.
  dev.planton.shared.foreignkey.v1.StringValueOrRef name = 3 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesService,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.service_name"
  ];

  // Namespace of the backend. When unspecified, the local namespace is inferred.
  // Cross-namespace references require a ReferenceGrant.
  optional string namespace = 4;

  // Destination port number. Required when the referent is a core Service.
  optional int32 port = 5 [(buf.validate.field).int32 = {
    gte: 1
    lte: 65535
  }];
}

// KubernetesGatewayApiBackendRef defines how a Route should forward a request
// to a Kubernetes resource. Flattens BackendObjectReference fields plus weight.
//
// Upstream: BackendRef in apis/v1/shared_types.go (embeds BackendObjectReference).
// This is the canonical shared backend reference reused directly by the
// filter-less route kinds (KubernetesTcpRoute, KubernetesTlsRoute). The
// filter-carrying routes (HttpRoute, GrpcRoute) instead flatten their own
// per-route backend ref because each backend additionally carries filters.
//
// Field validations mirror the upstream kubebuilder markers on
// BackendObjectReference (group/kind patterns + bounds). Every shared
// reference type in this file carries these same group/kind rules, so the
// family is uniform. namespace is intentionally left unconstrained across all
// of them — a deliberate family-wide convention, not a per-type gap.
message KubernetesGatewayApiBackendRef {
  // Group of the referent. Empty string infers the core API group.
  //
  // Upstream default: "" (core API group).
  // Group pattern: empty or an RFC 1123 subdomain (max 253).
  optional string group = 1 [(buf.validate.field).string = {
    max_len: 253
    pattern: "^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
  }];

  // Kind of the referent.
  //
  // Upstream default: "Service".
  // Kind pattern: 1-63 chars, ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
  optional string kind = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$"
  }];

  // Name of the referent. Defaults to a KubernetesService foreign key: in an
  // infra chart, wire it with valueFrom against the backend Service and the
  // route deploys after its backend. When the backend is not a
  // Planton-managed Service (a custom backend kind, or a Service created
  // outside Planton), pass the literal name with `value:`.
  dev.planton.shared.foreignkey.v1.StringValueOrRef name = 3 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesService,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.service_name"
  ];

  // Namespace of the backend. When unspecified, the local namespace is inferred.
  // Cross-namespace references require a ReferenceGrant.
  optional string namespace = 4;

  // Destination port number. Required when the referent is a core Service.
  optional int32 port = 5 [(buf.validate.field).int32 = {
    gte: 1
    lte: 65535
  }];

  // Proportion of requests forwarded to this backend, computed as
  // weight/(sum of all weights). Unspecified defaults to 1.
  //
  // Upstream default: 1
  optional int32 weight = 6 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000000
  }];
}

// KubernetesGatewayApiLocalObjectReference identifies an API object within the
// namespace of the referrer. All fields are required.
//
// Upstream: LocalObjectReference in apis/v1/object_reference_types.go
message KubernetesGatewayApiLocalObjectReference {
  // Group of the referent (e.g., "gateway.networking.k8s.io").
  // Empty string infers the core API group.
  //
  // Upstream requires the KEY to be present, but its Group type explicitly
  // allows the empty value -- so this is a proto3 `optional` string with a
  // presence `required` rule: it must be SET (and is therefore emitted to
  // the rendered CR, whose CRD rejects a missing key) but may be empty.
  // The `optional` is what keeps the projection faithful: protojson omits
  // unset proto3 scalars, so a non-optional empty-string group would be
  // dropped from the manifest and rejected by the API server.
  //
  // Group pattern: empty or an RFC 1123 subdomain (max 253).
  optional string group = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 253
      pattern: "^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
    }
  ];

  // Kind of the referent (e.g., "HTTPRoute" or "Service").
  //
  // Upstream models Kind as a required value type.
  // Kind pattern: 1-63 chars, ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
  string kind = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 63
      pattern: "^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$"
    }
  ];

  // Name of the referent.
  string name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 253
    }
  ];
}

// KubernetesGatewayApiSecretObjectReference identifies a Secret-like API
// object including its namespace.
//
// Upstream: SecretObjectReference in apis/v1/object_reference_types.go
message KubernetesGatewayApiSecretObjectReference {
  // Group of the referent. Empty string infers the core API group.
  //
  // Upstream default: "" (core API group)
  // Group pattern: empty or an RFC 1123 subdomain (max 253).
  optional string group = 1 [(buf.validate.field).string = {
    max_len: 253
    pattern: "^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
  }];

  // Kind of the referent.
  //
  // Upstream default: "Secret"
  // Kind pattern: 1-63 chars, ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
  optional string kind = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 63
    pattern: "^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$"
  }];

  // Name of the referent. Defaults to a KubernetesSecret foreign key. The
  // Secret is typically produced by cert-manager: reference a
  // KubernetesCertificate's status.outputs.secret_name with valueFrom to wire
  // a certificate the moment it is issued, or a KubernetesSecret directly for
  // externally provisioned material. Pass the literal name with `value:` when
  // the Secret is not Planton-managed.
  dev.planton.shared.foreignkey.v1.StringValueOrRef name = 3 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesSecret,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.secret_name"
  ];

  // Namespace of the referenced object. When unspecified, the local namespace
  // is inferred. Cross-namespace references require a ReferenceGrant.
  optional string namespace = 4;
}

// KubernetesGatewayApiObjectReference identifies an API object including its
// namespace. Group and Kind are required (value types, not pointers upstream).
//
// Upstream: ObjectReference in apis/v1/object_reference_types.go
message KubernetesGatewayApiObjectReference {
  // Group of the referent. Empty string infers the core API group
  // (e.g. for ConfigMap CA bundles).
  //
  // Upstream requires the KEY to be present, but its Group type explicitly
  // allows the empty value -- so this is a proto3 `optional` string with a
  // presence `required` rule: it must be SET (and is therefore emitted to
  // the rendered CR, whose CRD rejects a missing key) but may be empty.
  // The `optional` is what keeps the projection faithful: protojson omits
  // unset proto3 scalars, so a non-optional empty-string group would be
  // dropped from the manifest and rejected by the API server.
  //
  // Group pattern: empty or an RFC 1123 subdomain (max 253).
  optional string group = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      max_len: 253
      pattern: "^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
    }
  ];

  // Kind of the referent (e.g., "ConfigMap" or "Service").
  //
  // Upstream models Kind as a required value type.
  // Kind pattern: 1-63 chars, ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
  string kind = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 63
      pattern: "^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$"
    }
  ];

  // Name of the referent. Defaults to a KubernetesConfigMap foreign key (this
  // reference's primary use is CA-bundle ConfigMaps for client-certificate
  // validation): wire it with valueFrom against the ConfigMap resource, or
  // pass the literal name with `value:` when the object is a different kind
  // or not Planton-managed.
  dev.planton.shared.foreignkey.v1.StringValueOrRef name = 3 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesConfigMap,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.configmap_name"
  ];

  // Namespace of the referenced object. When unspecified, the local namespace
  // is inferred. Cross-namespace references require a ReferenceGrant.
  optional string namespace = 4;
}

