// KubernetesGatewayApiListenerTlsConfig describes the TLS behavior of a
// listener. Shared by KubernetesGateway listeners and KubernetesListenerSet
// listener entries — upstream uses one ListenerTLSConfig type for both, so
// sharing the message here makes drift between the two kinds structurally
// impossible.
//
// Upstream: ListenerTLSConfig in apis/v1/gateway_types.go
message KubernetesGatewayApiListenerTlsConfig {
  // when terminating TLS, the listener must have somewhere to source its
  // certificate from (an explicit certificate reference or an
  // implementation-specific option). Mode left unset defaults to Terminate.
  option (buf.validate.message).cel = {
    id: "listener_tls.terminate_requires_cert_or_options"
    message: "certificate_refs or options must be provided when tls mode is Terminate (the default)"
    expression: "(!has(this.mode) || this.mode == '' || this.mode == 'Terminate') ? (size(this.certificate_refs) > 0 || size(this.options) > 0) : true"
  };

  // How the listener handles the client's TLS session. "Terminate" (default)
  // decrypts at the Gateway and requires a certificate. "Passthrough" forwards
  // the encrypted stream untouched (TLSRoute only) and ignores certificate_refs.
  //
  // Upstream default: "Terminate". Closed enum: Terminate | Passthrough.
  optional string mode = 1 [(buf.validate.field).cel = {
    id: "listener_tls.mode_enum"
    message: "tls mode must be either 'Terminate' or 'Passthrough'"
    expression: "this == '' || this in ['Terminate', 'Passthrough']"
  }];

  // References to Kubernetes Secrets holding the TLS certificate/key used to
  // terminate the listener. A single reference to a kubernetes.io/tls Secret
  // has Core support; multiple references are implementation-specific.
  //
  // Each reference's name is a KubernetesSecret foreign key; the Secret is
  // typically produced by a KubernetesCertificate (cert-manager) — wire
  // valueFrom against the Certificate's status.outputs.secret_name so the
  // listener terminates with the issued certificate. See
  // KubernetesGatewayApiSecretObjectReference.
  repeated KubernetesGatewayApiSecretObjectReference certificate_refs = 2 [(buf.validate.field).repeated.max_items = 64];

  // Implementation-specific TLS options (for example minimum TLS version or
  // cipher suites). Keys should be domain-prefixed to avoid ambiguity.
  //
  // Upstream key/value: Gateway API AnnotationKey (1-253) / AnnotationValue
  // (0-4096).
  map<string, string> options = 3 [(buf.validate.field).map = {
    max_pairs: 16
    keys: {
      string: {
        min_len: 1
        max_len: 253
        pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?([A-Za-z0-9][-A-Za-z0-9_.]{0,61})?[A-Za-z0-9]$"
      }
    }
    values: {
      string: {max_len: 4096}
    }
  }];
}

// KubernetesGatewayApiAllowedRoutes defines which Routes may attach to a
// listener. Shared by KubernetesGateway listeners and KubernetesListenerSet
// listener entries (one upstream AllowedRoutes type serves both).
//
// Upstream: AllowedRoutes in apis/v1/gateway_types.go
message KubernetesGatewayApiAllowedRoutes {
  // Namespaces from which Routes may attach. Defaults to the Gateway's own
  // namespace.
  KubernetesGatewayApiRouteNamespaces namespaces = 1;

  // Route kinds allowed to bind to this listener. When empty, allowed kinds
  // are inferred from the listener protocol.
  repeated KubernetesGatewayApiRouteGroupKind kinds = 2 [(buf.validate.field).repeated.max_items = 8];
}

// KubernetesGatewayApiRouteNamespaces indicates the namespaces Routes are
// selected from.
//
// Upstream: RouteNamespaces in apis/v1/gateway_types.go
message KubernetesGatewayApiRouteNamespaces {
  // Where Routes are selected from: "All" (any namespace), "Selector"
  // (namespaces matching the selector), or "Same" (the Gateway's namespace).
  //
  // Upstream default: "Same". Closed enum: All | Selector | Same.
  optional string from = 1 [(buf.validate.field).cel = {
    id: "route_namespaces.from_enum"
    message: "from must be one of 'All', 'Selector', or 'Same'"
    expression: "this == '' || this in ['All', 'Selector', 'Same']"
  }];

  // Namespace label selector. Required (and only honored) when `from` is
  // "Selector".
  KubernetesGatewayApiLabelSelector selector = 2;
}

// KubernetesGatewayApiRouteGroupKind identifies a Route group and kind allowed
// on a listener.
//
// Upstream: RouteGroupKind in apis/v1/gateway_types.go
message KubernetesGatewayApiRouteGroupKind {
  // API group of the Route. Empty string selects the core API group.
  //
  // Upstream default: "gateway.networking.k8s.io".
  // Group pattern: empty or an RFC 1123 subdomain (max 253).
  optional string group = 1 [(buf.validate.field).string = {
    max_len: 253
    pattern: "^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
  }];

  // Kind of the Route (for example "HTTPRoute", "GRPCRoute", "TLSRoute").
  //
  // Kind pattern: 1-63 chars, ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
  string kind = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 63
      pattern: "^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$"
    }
  ];
}

// KubernetesGatewayApiLabelSelector is a Kubernetes label selector used to
// choose namespaces (mirrors metav1.LabelSelector). Reused for AllowedRoutes
// and the Gateway's AllowedListeners namespace selection.
message KubernetesGatewayApiLabelSelector {
  // Map of {key,value} pairs. A namespace matches if it carries all of these
  // labels.
  map<string, string> match_labels = 1;

  // List of label selector requirements, ANDed together with match_labels.
  repeated KubernetesGatewayApiLabelSelectorRequirement match_expressions = 2;
}

// KubernetesGatewayApiLabelSelectorRequirement is a single label selector
// requirement (mirrors metav1.LabelSelectorRequirement).
message KubernetesGatewayApiLabelSelectorRequirement {
  // Label key the requirement applies to.
  string key = 1 [(buf.validate.field).required = true];

  // Relationship between the key and values: "In", "NotIn", "Exists", or
  // "DoesNotExist". For "Exists"/"DoesNotExist", values must be empty.
  string operator = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "label_selector.operator_enum"
      message: "operator must be one of 'In', 'NotIn', 'Exists', or 'DoesNotExist'"
      expression: "this in ['In', 'NotIn', 'Exists', 'DoesNotExist']"
    }
  ];

  // Values for the requirement. Must be non-empty for "In"/"NotIn" and empty
  // for "Exists"/"DoesNotExist".
  repeated string values = 3;
}

// KubernetesGatewayApiSessionPersistence defines session persistence
// configuration for route rules.
//
// Upstream: SessionPersistence in apis/v1/shared_types.go
message KubernetesGatewayApiSessionPersistence {
  option (buf.validate.message).cel = {
    id: "session_persistence.absolute_timeout_for_permanent_cookie"
    message: "absolute_timeout must be specified when cookie lifetime_type is 'Permanent'"
    expression: "!has(this.cookie_config) || !has(this.cookie_config.lifetime_type) || this.cookie_config.lifetime_type != 'Permanent' || has(this.absolute_timeout)"
  };
  option (buf.validate.message).cel = {
    id: "session_persistence.cookie_config_requires_cookie_type"
    message: "cookie_config can only be set when type is 'Cookie'"
    expression: "!has(this.cookie_config) || (!has(this.type) || this.type == 'Cookie')"
  };

  // Name of the persistent session token, which may be reflected in the
  // cookie or header. Avoid reusing names to prevent unintended behavior.
  optional string session_name = 1 [(buf.validate.field).string.max_len = 128];

  // Absolute timeout of the persistent session. Once elapsed, the session
  // becomes invalid. Format: Gateway API Duration (e.g., "1h", "30m", "10s").
  optional string absolute_timeout = 2;

  // Idle timeout of the persistent session. Once the session has been idle
  // for longer than this duration, it becomes invalid.
  // Format: Gateway API Duration (e.g., "30m", "5m").
  optional string idle_timeout = 3;

  // Type of session persistence. Defaults to cookie-based.
  //
  // Upstream default: "Cookie"
  //
  // external standard exception — matches Gateway API constant
  optional string type = 4;

  // Cookie-specific configuration. Only valid when type is "Cookie".
  KubernetesGatewayApiCookieConfig cookie_config = 5;
}

// KubernetesGatewayApiCookieConfig provides cookie-specific session
// persistence configuration.
//
// Upstream: CookieConfig in apis/v1/shared_types.go
message KubernetesGatewayApiCookieConfig {
  // Specifies whether the cookie has a permanent or session-based lifetime.
  // Permanent cookies persist until their specified expiry time (Expires/Max-Age).
  // Session cookies are deleted when the current session ends.
  //
  // When "Permanent", absolute_timeout in SessionPersistence is required.
  //
  // Upstream default: "Session"
  //
  // external standard exception — matches Gateway API constant
  optional string lifetime_type = 1;
}

// KubernetesGatewayApiFraction represents a fraction used for traffic
// splitting (e.g., mirror percentages).
//
// Upstream: Fraction in apis/v1/shared_types.go
message KubernetesGatewayApiFraction {
  option (buf.validate.message).cel = {
    id: "fraction.numerator_lte_denominator"
    message: "numerator must be less than or equal to denominator"
    expression: "!has(this.denominator) || this.numerator <= this.denominator"
  };

  // Numerator of the fraction. Must be non-negative.
  int32 numerator = 1 [(buf.validate.field).int32.gte = 0];

  // Denominator of the fraction.
  //
  // Upstream default: 100
  optional int32 denominator = 2 [(buf.validate.field).int32.gte = 1];
}

// Note on enums: The upstream Gateway API uses string type aliases with
// kubebuilder Enum validation (e.g., SessionPersistenceType, CookieLifetimeType,
// AddressType). These are represented as `optional string` fields in proto
// because:
//   1. Proto enums change CEL expression semantics (string comparison breaks)
//   2. Upstream defaults are controller-specific and should not be baked in
//   3. Kind-specific enums (ProtocolType, HTTPMethod, etc.) are defined
//      nested inside each kind's spec.proto per forge convention
//
// Valid values are documented in field comments. Where a value set matches an
// external standard's constants (HTTP methods, Gateway API mode names), the
// uppercase spellings are kept verbatim — matching the standard beats matching
// the catalog's lowercase enum convention.
