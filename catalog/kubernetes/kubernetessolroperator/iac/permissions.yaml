# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: kubernetessolroperator
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubernetes_namespace_v1.solr_operator -- created and owned only when spec.create_namespace is true; get is needed for refresh either way. delete applies only to module-owned namespaces. list and watch serve the Pulumi provider's deletion await -- it watches the namespace until it is gone, and without them a destroy under this exact identity hangs until the provider's timeout (found by running a lane as this identity).
      - api_groups:
          - ""
        resources:
          - services
          - serviceaccounts
          - configmaps
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Chart-rendered objects applied by helm_release.solr_operator -- the Solr operator's ServiceAccount and metrics Service (while metrics_enabled, the default), plus the bundled zookeeper-operator subchart's ServiceAccount and ConfigMap when zookeeper_operator.install is true (the default).
      - api_groups:
          - apps
        resources:
          - deployments
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: The Solr operator Deployment (replicas from spec.replicas) and the bundled zookeeper-operator Deployment (when zookeeper_operator.install is true, the default), both applied by helm_release.solr_operator.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - clusterroles
          - clusterrolebindings
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: The chart's default RBAC posture (watch all namespaces) grants the Solr operator rights to reconcile SolrCloud resources and their children (StatefulSets, Services, ConfigMaps, PVCs, Ingresses) cluster-wide, and the bundled zookeeper-operator brings its own FIXED-NAME cluster-scoped RBAC -- the reason a second zookeeper-operator install in one cluster conflicts (spec.zookeeper_operator.install false is the coexistence path). An operator chart's RBAC is among the widest in the catalog.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - roles
          - rolebindings
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Namespaced RBAC the charts render for their ServiceAccounts (leader election and namespace-local rights) in the installation namespace.
      - api_groups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubectl_manifest.helm_crds (Terraform, the generated helm_crds.tf) and the Pulumi twin (keptcrds) -- the MODULE-OWNED CRDs (SolrCloud, SolrBackup, SolrPrometheusExporter on solr.apache.org, plus ZookeeperCluster for the bundled dependency), derived from the pinned chart at apply time and applied via server-side apply OUTSIDE the Helm release (SSA is load-bearing -- the SolrCloud schema exceeds the client-side annotation size limit), re-applied in place on chart bumps. The get and list verbs also serve the by-name read every apply makes first (get in Pulumi, a field-selected list in Terraform) behind the ownership check (a CRD without this module's stamp is refused, its owner named) and the never-downgrade check; the Pulumi twin additionally asks a SelfSubjectAccessReview whether this identity may write CRDs before registering anything, an API open to every authenticated identity. Delete is exercised only when spec.crds.keep_on_uninstall is false; the default keep posture makes destroy a no-op so an operator uninstall never cascade-deletes SolrCloud resources. Skipped entirely when spec.crds.install is false.
      - api_groups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - watch
        cluster_scoped: true
        provenance: derived
        notes: Pulumi only -- watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the CustomResourceDefinition applied by the keptcrds.Apply in main.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
