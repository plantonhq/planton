apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: kubernetessolroperator
spec:
  tier: 3
  # Forged on the official solr-operator chart 0.9.1 with MODULE-OWNED CRDs
  # derived from the pinned chart at apply time: the three solr.apache.org
  # CRDs from the chart's crds/ directory (Helm would install them once and
  # never upgrade them) and the ZookeeperCluster CRD the bundled
  # zookeeper-operator subchart templates (Helm would delete it with the
  # release). The scenarios cover the whole CRD lifecycle: keep and
  # re-adopt on reinstall (minimal), cleanup when keep is off (tuned-full),
  # a chart bump re-applying the CRDs (upgrade, 0.9.0 to 0.9.1), and the
  # two refusals (a version that is not published; a schema downgrade).
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 25
