syntax = "proto3";

package dev.planton.kubernetes.kubernetessolroperator.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetessolroperator/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetessolroperator/v1alpha1/spec.proto";
import "shared/metadata.proto";

//kubernetes-solr-operator
message KubernetesSolrOperator {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesSolrOperator'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesSolrOperatorSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesSolrOperatorStatus status = 5;
}

//kubernetes-solr-operator status.
message KubernetesSolrOperatorStatus {
  //outputs
  KubernetesSolrOperatorOutputs outputs = 1;
}
