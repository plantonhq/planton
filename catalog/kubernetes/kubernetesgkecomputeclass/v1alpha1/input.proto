syntax = "proto3";

package dev.planton.kubernetes.kubernetesgkecomputeclass.v1alpha1;

import "catalog/kubernetes/kubernetesgkecomputeclass/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// KubernetesGkeComputeClassIacInput provides the inputs for creating the
// ComputeClass on a GKE cluster.
message KubernetesGkeComputeClassIacInput {
  // the catalog object to deploy
  KubernetesGkeComputeClass target = 1;
  // provider-config
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
