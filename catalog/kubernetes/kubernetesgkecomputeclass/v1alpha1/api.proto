syntax = "proto3";

package dev.planton.kubernetes.kubernetesgkecomputeclass.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesgkecomputeclass/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesgkecomputeclass/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesGkeComputeClass is a GKE ComputeClass: a cluster-scoped, ordered
// list of the machines GKE may create nodes from, tried in order, so a cluster
// falls back to the next machine family when Google has no capacity for the
// first.
message KubernetesGkeComputeClass {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesGkeComputeClass'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesGkeComputeClassSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesGkeComputeClassStatus status = 5;
}

// KubernetesGkeComputeClassStatus holds the deployment status and outputs.
message KubernetesGkeComputeClassStatus {
  // outputs
  KubernetesGkeComputeClassOutputs outputs = 1;
}
