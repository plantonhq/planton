syntax = "proto3";

package dev.planton.kubernetes.kubernetesgkecomputeclass.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// KubernetesGkeComputeClassSpec defines a GKE ComputeClass: a cluster-scoped,
// ordered list of the machines GKE's cluster autoscaler may create nodes from.
// When pods that select the class are pending, GKE tries the first priority
// rule; when it cannot get that capacity (a stockout, a missing reservation, a
// quota), it tries the next, until one succeeds or the list is exhausted and
// `when_unsatisfiable` decides. A class is how a GKE cluster keeps getting
// nodes when Google runs out of one machine type in a region.
//
// 100% fidelity with the ComputeClass custom resource (cloud.google.com/v1)
// as GKE serves it at 1.36.4-gke.2046002. Every property of the served spec is
// a field here under its upstream key, held to the served definition by the
// mirror test (pkg/kubernetes/manifestprojection, testdata/schemas/
// cloud.google.com_computeclasses.yaml). The definition's own validation rules
// are mirrored below, so a class GKE would refuse fails validation before the
// apply. Fields carry the GKE version that introduced them; an older cluster
// prunes or refuses a field it does not serve.
//
// How a class takes effect:
//   - A pod selects it with the node selector
//     `cloud.google.com/compute-class: <name>` (GKE adds the matching
//     toleration for the class's node taint).
//   - A namespace selects it for every pod that names none with the label
//     `cloud.google.com/default-compute-class: <name>`.
//   - A class named `default` applies to every pod that selects none, once the
//     cluster's default compute class is enabled
//     (GcpGkeCluster.cluster_autoscaling.default_compute_class_enabled).
//
// A class only creates node pools when `node_pool_auto_creation.enabled` is
// true; without it, GKE only places pods on existing node pools that match a
// rule (the `nodepools` rule, or pools labelled for the class). Node pool
// auto-creation needs no cluster-level node auto-provisioning on GKE
// 1.33.3-gke.1136000 or later.
//
// The envelope: `name` is the object's metadata.name (the value pods select),
// and `labels` and `annotations` are the object's own metadata. ComputeClass
// is cluster-scoped, so there is no namespace.
message KubernetesGkeComputeClassSpec {
  option (buf.validate.message).cel = {
    id: "spec.autopilot_forbids_nodepools"
    message: "a nodepools priority rule cannot be used when autopilot is enabled -- Autopilot manages its own node pools"
    expression: "!(has(this.autopilot) && this.autopilot.enabled) || !this.priorities.exists(p, size(p.nodepools) > 0)"
  };
  option (buf.validate.message).cel = {
    id: "spec.autopilot_requires_auto_creation"
    message: "node_pool_auto_creation cannot be disabled when autopilot is enabled"
    expression: "!(has(this.autopilot) && this.autopilot.enabled) || !(has(this.node_pool_auto_creation) && has(this.node_pool_auto_creation.enabled) && !this.node_pool_auto_creation.enabled)"
  };
  option (buf.validate.message).cel = {
    id: "spec.autopilot_image_type"
    message: "only the cos_containerd image type can be used when autopilot is enabled"
    expression: "!(has(this.autopilot) && this.autopilot.enabled) || !has(this.node_pool_config) || !has(this.node_pool_config.image_type) || this.node_pool_config.image_type == 'cos_containerd'"
  };
  option (buf.validate.message).cel = {
    id: "spec.autopilot_logging_variant"
    message: "only the DEFAULT logging variant can be used when autopilot is enabled"
    expression: "!(has(this.autopilot) && this.autopilot.enabled) || !has(this.node_pool_config) || !has(this.node_pool_config.logging_config) || !has(this.node_pool_config.logging_config.logging_variant_config) || !has(this.node_pool_config.logging_config.logging_variant_config.variant) || this.node_pool_config.logging_config.logging_variant_config.variant == 'DEFAULT'"
  };
  option (buf.validate.message).cel = {
    id: "spec.workload_type_requires_node_pool_group"
    message: "without node_pool_group, node_pool_config.workload_type can only be HIGH_AVAILABILITY"
    expression: "!(has(this.node_pool_config) && has(this.node_pool_config.workload_type) && !has(this.node_pool_group)) || this.node_pool_config.workload_type == 'HIGH_AVAILABILITY'"
  };
  option (buf.validate.message).cel = {
    id: "spec.pod_family_requires_autopilot"
    message: "a pod_family priority rule can be used only when autopilot is enabled"
    expression: "!this.priorities.exists(p, has(p.pod_family)) || (has(this.autopilot) && this.autopilot.enabled)"
  };
  option (buf.validate.message).cel = {
    id: "spec.confidential_requires_machine"
    message: "with node_pool_config.confidential_node_type set, every priority rule must set machine_family or machine_type"
    expression: "!(has(this.node_pool_config) && has(this.node_pool_config.confidential_node_type)) || this.priorities.all(p, has(p.machine_family) || has(p.machine_type))"
  };
  option (buf.validate.message).cel = {
    id: "spec.confidential_sev_families"
    message: "confidential_node_type SEV supports only the n2d, c2d, c3d, c4d and g4 families"
    expression: "!(has(this.node_pool_config) && has(this.node_pool_config.confidential_node_type) && this.node_pool_config.confidential_node_type == 'SEV') || this.priorities.all(p, (has(p.machine_family) && p.machine_family in ['n2d', 'c2d', 'c3d', 'c4d', 'g4']) || (has(p.machine_type) && ['n2d', 'c2d', 'c3d', 'c4d', 'g4'].exists(f, p.machine_type.startsWith(f + '-'))))"
  };
  option (buf.validate.message).cel = {
    id: "spec.confidential_sev_g4"
    message: "confidential_node_type SEV on g4 supports only the g4-standard-48 machine type with the nvidia-rtx-pro-6000 GPU"
    expression: "!(has(this.node_pool_config) && has(this.node_pool_config.confidential_node_type) && this.node_pool_config.confidential_node_type == 'SEV') || this.priorities.all(p, (has(p.machine_family) && p.machine_family == 'g4') ? false : ((has(p.machine_type) && p.machine_type.startsWith('g4-')) ? (p.machine_type == 'g4-standard-48' && (!has(p.gpu) || !has(p.gpu.type) || p.gpu.type == 'nvidia-rtx-pro-6000')) : true))"
  };
  option (buf.validate.message).cel = {
    id: "spec.confidential_sev_snp_families"
    message: "confidential_node_type SEV_SNP supports only the n2d family"
    expression: "!(has(this.node_pool_config) && has(this.node_pool_config.confidential_node_type) && this.node_pool_config.confidential_node_type == 'SEV_SNP') || this.priorities.all(p, (has(p.machine_family) && p.machine_family == 'n2d') || (has(p.machine_type) && p.machine_type.startsWith('n2d-')))"
  };
  option (buf.validate.message).cel = {
    id: "spec.confidential_tdx_families"
    message: "confidential_node_type TDX supports only c3 standard, c4 standard, a3-highgpu-1g and a4-highgpu-8g"
    expression: "!(has(this.node_pool_config) && has(this.node_pool_config.confidential_node_type) && this.node_pool_config.confidential_node_type == 'TDX') || this.priorities.all(p, (has(p.machine_family) && p.machine_family in ['c3', 'c4', 'a3', 'a4']) || (has(p.machine_type) && (p.machine_type.startsWith('c3-standard-') || p.machine_type.startsWith('c4-standard-') || p.machine_type == 'a3-highgpu-1g' || p.machine_type == 'a4-highgpu-8g')))"
  };
  option (buf.validate.message).cel = {
    id: "spec.confidential_tdx_gpus"
    message: "confidential_node_type TDX allows only the nvidia-h100-80gb GPU on c3, c4 and a3, and the nvidia-b200 GPU on a4"
    expression: "!(has(this.node_pool_config) && has(this.node_pool_config.confidential_node_type) && this.node_pool_config.confidential_node_type == 'TDX') || this.priorities.all(p, !has(p.gpu) || !has(p.gpu.type) || (((has(p.machine_family) && p.machine_family == 'a4') || (has(p.machine_type) && p.machine_type == 'a4-highgpu-8g')) ? p.gpu.type == 'nvidia-b200' : (((has(p.machine_family) && p.machine_family in ['c3', 'c4', 'a3']) || (has(p.machine_type) && (p.machine_type.startsWith('c3-standard-') || p.machine_type.startsWith('c4-standard-') || p.machine_type == 'a3-highgpu-1g'))) ? p.gpu.type == 'nvidia-h100-80gb' : true)))"
  };
  option (buf.validate.message).cel = {
    id: "spec.priority_score_all_or_none"
    message: "priority_score must be set on every priority rule or on none of them"
    expression: "this.priorities.all(p, has(p.priority_score)) || this.priorities.all(p, !has(p.priority_score))"
  };
  option (buf.validate.message).cel = {
    id: "spec.default_shutdown_grace_requires_spot"
    message: "priority_defaults may set kubelet shutdown_grace_period_seconds only when every priority rule is spot"
    expression: "this.priorities.all(p, has(p.spot) && p.spot) || !has(this.priority_defaults) || !has(this.priority_defaults.node_system_config) || !has(this.priority_defaults.node_system_config.kubelet_config) || !has(this.priority_defaults.node_system_config.kubelet_config.shutdown_grace_period_seconds)"
  };
  option (buf.validate.message).cel = {
    id: "spec.minimum_capacity_requires_machine"
    message: "a class-level minimum_capacity target requires every priority rule to name a machine_type, gpu, tpu, or Specific reservation"
    expression: "!(has(this.minimum_capacity) && has(this.minimum_capacity.target_node_count)) || this.priorities.all(p, has(p.machine_type) || has(p.gpu) || has(p.tpu) || (has(p.reservations) && p.reservations.affinity == 'Specific'))"
  };
  option (buf.validate.message).cel = {
    id: "spec.autopilot_forbids_tcp_congestion_control"
    message: "the net.ipv4.tcp_congestion_control sysctl cannot be set when autopilot is enabled"
    expression: "!(has(this.autopilot) && this.autopilot.enabled) || ((!has(this.priority_defaults) || !has(this.priority_defaults.node_system_config) || !has(this.priority_defaults.node_system_config.linux_node_config) || !has(this.priority_defaults.node_system_config.linux_node_config.sysctls) || !has(this.priority_defaults.node_system_config.linux_node_config.sysctls.net_ipv4_tcp_congestion_control)) && this.priorities.all(p, !has(p.node_system_config) || !has(p.node_system_config.linux_node_config) || !has(p.node_system_config.linux_node_config.sysctls) || !has(p.node_system_config.linux_node_config.sysctls.net_ipv4_tcp_congestion_control)))"
  };

  // The ComputeClass's name in the cluster (its metadata.name): the value a
  // pod selects with `cloud.google.com/compute-class: <name>` and a namespace
  // with `cloud.google.com/default-compute-class: <name>`.
  //
  // `default` is special: it becomes the cluster's default class, applied to
  // every pod that selects none, once the cluster's default compute class is
  // enabled (GcpGkeCluster.cluster_autoscaling.default_compute_class_enabled).
  // Because the name lives here rather than in the resource's own name, every
  // cluster in an environment can carry its own `default` class.
  //
  // A DNS subdomain name. Names beginning with `autopilot` belong to GKE's
  // built-in classes (autopilot, autopilot-spot, autopilot-arm,
  // autopilot-arm-spot) and are refused. Renaming a class creates a new object
  // and deletes the old one; pods that select the old name stop matching.
  string name = 1 [
    (dev.planton.shared.options.kubernetes_object_metadata) = object_name,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 253,
    (buf.validate.field).cel = {
      id: "spec.name.dns_subdomain"
      message: "name must be a valid DNS subdomain (lowercase alphanumeric, hyphens and dots, starting and ending with an alphanumeric)"
      expression: "this.matches('^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$')"
    },
    (buf.validate.field).cel = {
      id: "spec.name.not_builtin"
      message: "names beginning with 'autopilot' belong to GKE's built-in compute classes"
      expression: "this != 'autopilot' && !this.startsWith('autopilot-')"
    }
  ];

  // Labels on the ComputeClass object itself (its metadata.labels), merged
  // under Planton's identity labels (a key in both keeps the identity value).
  // For policy engines and inventory that select classes by label. They do not
  // reach nodes; `node_pool_config.node_labels` and each rule's `node_labels`
  // do.
  map<string, string> labels = 2 [
    (dev.planton.shared.options.kubernetes_object_metadata) = object_labels,
    (buf.validate.field).map = {
      keys: {
        string: {
          min_len: 1
          max_len: 317
          pattern: "^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?[A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?$"
        }
      }
      values: {
        string: {
          max_len: 63
          pattern: "^([A-Za-z0-9]([-A-Za-z0-9_.]{0,61}[A-Za-z0-9])?)?$"
        }
      }
    }
  ];

  // Annotations on the ComputeClass object itself (its metadata.annotations):
  // notes for people and tools reading the object.
  map<string, string> annotations = 3 [(dev.planton.shared.options.kubernetes_object_metadata) = object_annotations];

  // Free text telling workload owners when to select this class ("batch jobs
  // that tolerate Spot", "latency-sensitive services"). Shown by
  // `kubectl describe computeclass`; GKE does not act on it.
  optional string description = 4;

  // The priority rules, tried in order (or by `priority_score` when set):
  // when pods that select the class are pending, GKE creates nodes from the
  // first rule it can satisfy. Each rule names one way to get a node:
  //   - a machine family (`machine_family`, optionally with `min_cores` and
  //     `min_memory_gb`) or an exact `machine_type`;
  //   - existing node pools (`nodepools`), on their own;
  //   - an accelerator (`gpu` or `tpu`);
  //   - a pod family (`pod_family`, Autopilot classes only);
  // and how to pay for it: `spot`, `flex_start`, or `reservations`.
  //
  // Order is the whole design. List the shape you want first, then the
  // families that can run the same pods when the first runs out: the
  // stockout-resilient default is several general-purpose families of the
  // same size (n2d, c3d, n2, t2d at 8 cores). A rule GKE cannot satisfy is
  // skipped, so a reservation or Spot rule first, followed by on-demand
  // rules, spends the cheapest capacity before the dearest.
  //
  // Empty is valid upstream (an Autopilot class, or a class used only for its
  // node pool configuration), and then GKE creates nodes from its default
  // machine series. Up to 1000 rules. Requires GKE 1.30.3-gke.1451000.
  repeated KubernetesGkeComputeClassPriority priorities = 5 [(buf.validate.field).repeated.max_items = 1000];

  // Defaults for the `location` and `node_system_config` of every priority
  // rule that does not set its own. They never apply to a rule that holds only
  // `nodepools`. Requires GKE 1.32.1-gke.1729000.
  KubernetesGkeComputeClassPriorityDefaults priority_defaults = 6;

  // What GKE does when no priority rule can be satisfied:
  //   - DoNotScaleUp (the default): no node is created and the pods stay
  //     pending until a rule can be met. The class never runs pods on a
  //     machine you did not list.
  //   - ScaleUpAnyway: GKE creates a node from its default machine series
  //     (E2 on Standard) so the pods run, on a machine the class never named.
  //
  // Choose ScaleUpAnyway for a cluster-wide `default` class whose job is to
  // keep installs and controllers schedulable through a stockout; keep
  // DoNotScaleUp where the machine is a requirement (GPUs, confidential nodes,
  // licensed families). The default is written explicitly, so the class
  // behaves the same on every GKE version (GKE changed its own default in
  // 1.33).
  optional string when_unsatisfiable = 7 [
    (dev.planton.shared.options.default) = "DoNotScaleUp",
    (buf.validate.field).string = {
      in: [
        "ScaleUpAnyway",
        "DoNotScaleUp"
      ]
    }
  ];

  // Whether GKE may create (and later delete) node pools for this class's
  // rules. Off (the upstream default), the class only places pods on existing
  // node pools that match a rule, so a family fallback needs it on.
  KubernetesGkeComputeClassNodePoolAutoCreation node_pool_auto_creation = 8;

  // Node pool configuration every node of the class carries: image, identity,
  // labels, taints, metadata server, sandbox, confidential computing. Pools
  // GKE auto-creates are built with it; an existing pool is used for the class
  // only when its configuration matches. Requires GKE 1.31.4-gke.1072000.
  KubernetesGkeComputeClassNodePoolConfig node_pool_config = 9;

  // Groups the class's node pools into one collection that shares a
  // configuration, such as a workload SLO for multi-host TPU or GPU slices
  // (`node_pool_config.workload_type`). Requires GKE 1.32.2-gke.1359000.
  KubernetesGkeComputeClassNodePoolGroup node_pool_group = 10;

  // Whether GKE moves running pods back to nodes from a higher-priority rule
  // once that capacity is available again: the way a class that fell back to
  // its third family during a stockout returns to its first.
  KubernetesGkeComputeClassActiveMigration active_migration = 11;

  // How quickly GKE removes nodes of the class that are no longer needed.
  KubernetesGkeComputeClassAutoscalingPolicy autoscaling_policy = 12;

  // The allocation strategy each provisioning model uses when a rule sets
  // none. Requires GKE 1.36.4-gke.1082000 or 1.35.8-gke.1439000.
  KubernetesGkeComputeClassAllocationStrategyDefaults allocation_strategy_defaults = 13;

  // Nodes GKE keeps for the class even with no pods pending: the one setting
  // here that commits spend before any workload asks for it. A target
  // requires every rule to name a machine_type, gpu, tpu or Specific
  // reservation. Requires GKE 1.36.3-gke.1253000.
  KubernetesGkeComputeClassMinimumCapacity minimum_capacity = 14;

  // Makes the class's nodes Autopilot-managed, on a Standard cluster too.
  // Fixed at creation: GKE refuses a change to it, or removing it, once set
  // (replace the class to change it). Requires GKE 1.34.1-gke.1829001.
  KubernetesGkeComputeClassAutopilot autopilot = 15;
}

// KubernetesGkeComputeClassPriority is one priority rule: one way GKE may get
// a node for the class.
message KubernetesGkeComputeClassPriority {
  option (buf.validate.message).cel = {
    id: "priority.nodepools_alone"
    message: "a nodepools rule may carry only allocation_strategy and priority_score beside it -- the pools' own configuration decides the node"
    expression: "size(this.nodepools) == 0 || !(has(this.machine_family) || has(this.machine_type) || has(this.min_cores) || has(this.min_memory_gb) || has(this.min_cpu_platform) || has(this.spot) || has(this.flex_start) || has(this.pod_family) || has(this.gpu) || has(this.gpu_direct) || has(this.tpu) || has(this.reservations) || has(this.location) || has(this.storage) || has(this.placement) || size(this.node_labels) > 0 || size(this.taints) > 0 || has(this.node_system_config) || size(this.instance_metadata) > 0 || has(this.max_pods_per_node) || has(this.max_run_duration_seconds) || has(this.capacity_check_wait_time_seconds) || has(this.minimum_capacity) || has(this.accelerator_network_profile))"
  };
  option (buf.validate.message).cel = {
    id: "priority.family_xor_type"
    message: "machine_family and machine_type cannot be set together"
    expression: "!(has(this.machine_family) && has(this.machine_type))"
  };
  option (buf.validate.message).cel = {
    id: "priority.type_excludes_minimums"
    message: "machine_type cannot be set together with min_cores or min_memory_gb -- the machine type fixes both"
    expression: "!(has(this.machine_type) && (has(this.min_cores) || has(this.min_memory_gb)))"
  };
  option (buf.validate.message).cel = {
    id: "priority.no_ek_family"
    message: "the ek machine family is reserved for Autopilot and cannot be named in a rule"
    expression: "!(has(this.machine_family) && this.machine_family == 'ek') && !(has(this.machine_type) && this.machine_type.startsWith('ek'))"
  };
  option (buf.validate.message).cel = {
    id: "priority.flex_start_excludes_spot"
    message: "the flex-start provisioning model is incompatible with spot"
    expression: "!(has(this.flex_start) && has(this.spot) && this.spot && this.flex_start.enabled)"
  };
  option (buf.validate.message).cel = {
    id: "priority.capacity_wait_scope"
    message: "capacity_check_wait_time_seconds is supported only with flex_start enabled or a tpu"
    expression: "!has(this.capacity_check_wait_time_seconds) || has(this.tpu) || (has(this.flex_start) && this.flex_start.enabled)"
  };
  option (buf.validate.message).cel = {
    id: "priority.shutdown_grace_requires_spot"
    message: "kubelet shutdown_grace_period_seconds is supported only on a spot rule"
    expression: "(has(this.spot) && this.spot) || !has(this.node_system_config) || !has(this.node_system_config.kubelet_config) || !has(this.node_system_config.kubelet_config.shutdown_grace_period_seconds)"
  };
  option (buf.validate.message).cel = {
    id: "priority.rdma_requires_network_profile"
    message: "accelerator_network_profile must be set when gpu_direct is rdma"
    expression: "!(has(this.gpu_direct) && this.gpu_direct == 'rdma') || has(this.accelerator_network_profile)"
  };
  option (buf.validate.message).cel = {
    id: "priority.minimum_capacity_requires_machine"
    message: "a rule-level minimum_capacity target requires a machine_type, gpu, tpu, or Specific reservation"
    expression: "!(has(this.minimum_capacity) && has(this.minimum_capacity.target_node_count)) || has(this.machine_type) || has(this.gpu) || has(this.tpu) || (has(this.reservations) && this.reservations.affinity == 'Specific')"
  };

  // The Compute Engine machine family the node comes from (n2d, c3d, n2, t2d,
  // c4, n4, e2, ...), with GKE choosing the size from the pending pods'
  // requests, bounded by `min_cores` and `min_memory_gb`. Families differ in
  // the disks they take: C4, C4D, N4 and other fourth-generation families use
  // Hyperdisk only, so pair them with `storage.boot_disk_type`
  // hyperdisk-balanced. Cannot be set with `machine_type`. Up to 10
  // characters. Requires GKE 1.30.3-gke.1451000.
  optional string machine_family = 1 [(buf.validate.field).string.max_len = 10];

  // An exact machine type (n2d-standard-8, a3-highgpu-1g). Use it when the
  // shape is a requirement; prefer `machine_family` plus minimums when any
  // size that fits will do, because a family has more capacity to fall back
  // on. Cannot be set with `machine_family`, `min_cores` or `min_memory_gb`.
  // Up to 100 characters. Requires GKE 1.30.3-gke.1451000.
  optional string machine_type = 2 [(buf.validate.field).string.max_len = 100];

  // The fewest vCPUs a node from this rule may have. With `machine_family`,
  // keeps GKE from choosing a smaller machine than the workloads were sized
  // for (the stockout default uses 8 on every rule so each fallback is the
  // same size). More than any machine of the family offers marks the class
  // CrdMisconfigured (NoSuitableMachineExists). Requires GKE
  // 1.30.3-gke.1451000.
  optional int32 min_cores = 3 [(buf.validate.field).int32.gte = 0];

  // The least memory, in GB, a node from this rule may have. Requires GKE
  // 1.30.3-gke.1451000.
  optional int32 min_memory_gb = 4 [(buf.validate.field).int32.gte = 0];

  // The oldest CPU platform the node may run on, for workloads that need an
  // instruction set or a performance floor. Requires GKE 1.34.1-gke.2541000.
  optional string min_cpu_platform = 5 [(buf.validate.field).string = {
    in: [
      "Intel Sandy Bridge",
      "Intel Ivy Bridge",
      "Intel Haswell",
      "Intel Broadwell",
      "Intel Skylake",
      "Intel Cascade Lake",
      "Intel Ice Lake",
      "Intel Sapphire Rapids",
      "Intel Emerald Rapids",
      "Intel Granite Rapids",
      "AMD Rome",
      "AMD Milan",
      "AMD Genoa",
      "AMD Turin",
      "Ampere Altra",
      "Google Axion",
      "Nvidia Grace"
    ]
  }];

  // Spot VMs: the same machines at a deep discount, reclaimed by Google with
  // 30 seconds' notice. A Spot rule followed by the same shape on demand is
  // the cheap-first pattern; Spot capacity also runs out, so the on-demand
  // rule is the fallback, not an extra. Incompatible with `flex_start`.
