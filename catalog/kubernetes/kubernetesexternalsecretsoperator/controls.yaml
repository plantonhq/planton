# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetesexternalsecretsoperator
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The operator's product -- synced Kubernetes Secrets -- rests in etcd, whose encryption at rest is the cluster control plane's property; the source secrets rest in the external stores under those stores' own encryption. This component stores nothing else.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Customer-managed keys apply to the cluster's etcd encryption and to the external stores' own key configuration (see enc-at-rest); this spec has no seam for them.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: module_default
        reference: Every path is TLS -- the operator fetches from the external stores over their HTTPS APIs, talks to the Kubernetes API over TLS, and the admission webhook serves the API server over TLS with a certificate the cert-controller bootstraps and rotates.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The chart renders no external exposure -- the webhook and metrics Services are ClusterIP only, reachable solely inside the cluster network.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The only inbound traffic is the Kubernetes API server calling the admission webhook over the cluster network; there is no user-facing ingress surface to restrict.
    - control_id: edge-protection
      status: not_applicable
      notes: The operator serves no HTTP edge traffic -- web application firewalls do not apply.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The chart creates dedicated ServiceAccounts for the controller, webhook, and cert-controller, each bound to purpose-scoped RBAC the chart renders. The controller's Secret write access is its function -- scoped_namespace plus scoped_rbac narrow it to a single namespace Role for the fully-scoped multi-tenant posture.
      notes: controller_class additionally shards which stores an installation reconciles when several isolated operators share a cluster.
    - control_id: workload-identity
      status: configurable
      field_path: workload_identity
      evidence:
        type: spec_default
        reference: Unset means stores authenticate per their own auth blocks (per-store identities or declared credentials); workload_identity annotates the controller ServiceAccount for keyless store access -- AWS via EKS IRSA, GCP via GKE Workload Identity, Azure via AKS Workload Identity -- covering stores that leave their auth block empty.
      notes: The 02-eks-ambient-identity preset binds IRSA; per-store identities (finer-grained, recommended for multi-team clusters) ride each store's own auth block instead and need nothing here.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The operator exposes no authentication surface of its own -- every interaction is a Kubernetes API operation authenticated by the cluster, and store credentials are the stores' concern (declared on KubernetesSecretStore / KubernetesClusterSecretStore resources, not here).
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Reconcile activity streams to stdout for the cluster's log collector and sync milestones land as Kubernetes Events; administrative changes are Kubernetes API operations captured by the target cluster's audit policy, and the external stores' own audit trails record every secret read.
    - control_id: monitoring-integration
      status: configurable
      field_path: prometheus.service_monitor
      evidence:
        type: spec_default
        reference: The operator always serves Prometheus metrics (sync results, reconcile latencies); unset means no scrape discovery, and service_monitor creates ServiceMonitors -- requiring the Prometheus operator CRDs on the cluster.
    - control_id: backup-recovery
      status: not_applicable
      notes: The operator holds no primary data -- synced Secrets are re-derived from the external stores on every reconcile, and the store/secret definitions live in etcd under the cluster's own state backup. The external stores own the durability of the secrets themselves.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backup surface exists (see backup-recovery), so retention does not apply.
    - control_id: multi-zone-ha
      status: configurable
      field_path: replicas
      evidence:
        type: spec_default
        reference: replicas defaults to 1; more replicas with leader_elect run standbys that take over reconciliation on failure (validation enforces the pairing), webhook.replicas scales the admission path, and pod_disruption_budget guards the controller against voluntary eviction.
      notes: The 03-tuned-multi-team preset runs 2 webhook replicas for admission-path redundancy.
    - control_id: deletion-protection
      status: enforced_by_default
      evidence:
        type: spec_default
        reference: crds.keep_on_uninstall defaults to true -- rendered as the helm.sh/resource-policy=keep annotation on the CRDs (the chart itself has no keep knob and would delete them), so uninstalling keeps every ExternalSecret and SecretStore object cluster-wide; destroying that data requires an explicit false.
      notes: The release itself carries no deletion lock -- what the default protects is the cluster-wide ESO object data, the destructive blast radius of this component.
    - control_id: managed-patching
      status: configurable
      field_path: chart_version
      evidence:
        type: spec_default
        reference: chart_version pins the installed operator release (default 2.8.0; chart and operator versions are aligned upstream); changing it re-runs the Helm release, rolling all three components deliberately through the module.
