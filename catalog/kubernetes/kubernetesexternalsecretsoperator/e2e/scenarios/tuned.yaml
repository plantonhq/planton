# Controller/webhook/cert-controller tuning surface: reconcile concurrency,
# log level, per-component replicas and sizing — everything rendered into
# chart values and proven by a live install. ServiceMonitor stays off (the
# kind cluster has no Prometheus operator CRDs, and the chart fails the
# install without them — exactly what the spec comment warns about).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesExternalSecretsOperator
metadata:
  name: e2e-eso-tuned
spec:
  namespace:
    value: external-secrets
  createNamespace: true
  concurrent: 3
  logLevel: debug
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi
  webhook:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
  certController:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
