apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetespersistentvolumeclaim
spec:
  # A claim's identity is fully carried by its namespace/name pair --
  # derivable from a prior deploy's outputs or from the spec itself.
  values:
    - name: pvc_name
      derivations:
        - from_output: pvc_name
        - from_spec_field: name
      where_to_find: >-
        `kubectl get pvc -A` (NAME column).
    - name: pvc_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `kubectl get pvc -A` (NAMESPACE column); "default" when the spec
        omits the namespace.
