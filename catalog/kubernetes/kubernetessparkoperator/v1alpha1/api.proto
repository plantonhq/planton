syntax = "proto3";

package dev.planton.kubernetes.kubernetessparkoperator.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetessparkoperator/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetessparkoperator/v1alpha1/spec.proto";
import "shared/metadata.proto";

//spark-operator-kubernetes
message KubernetesSparkOperator {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesSparkOperator'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesSparkOperatorSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesSparkOperatorStatus status = 5;
}

//spark-operator-kubernetes status.
message KubernetesSparkOperatorStatus {
  //outputs
  KubernetesSparkOperatorOutputs outputs = 1;
}
