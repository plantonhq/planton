apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesjob
spec:
  # Every object this module creates keys off the workload's namespace/name
  # pair. The Job shares metadata.name; the satellite Secrets carry fixed
  # suffixes ("-env-secrets", "-image-pull") that the schema cannot derive
  # mechanically, so those fall back to guided entry.
  values:
    - name: job_name
      derivations:
        - from_output: job_name
        - from_metadata_name: true
      where_to_find: >-
        `kubectl get jobs -A` (NAME column).
    - name: job_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `kubectl get jobs -A` (NAMESPACE column).
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the workload's namespace.
    - name: secret_name
      where_to_find: >-
        `kubectl get secrets -n <namespace>` — named
        "<metadata.name>-env-secrets" (literal secret env values) or
        "<metadata.name>-image-pull" (docker-registry credentials); each is
        only present when the corresponding spec arm is used.
    - name: secret_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same namespace as the workload.
