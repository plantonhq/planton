# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: kubernetesjob
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubernetes_namespace.this (Terraform) and namespace.go (Pulumi) -- created and owned only when spec.create_namespace is true; get is needed for refresh either way. delete applies only to module-owned namespaces.
      - api_groups:
          - batch
        resources:
          - jobs
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers kubernetes_job_v1.this (Terraform) and job.go (Pulumi) -- the batch/v1 Job itself, created unconditionally. The Job's pods are created by the cluster's Job controller, never by the runner, so no pods verbs are needed. The modules create no ServiceAccounts, RBAC objects, or ConfigMaps -- identity composes through KubernetesServiceAccount and KubernetesRbac resources, configuration through KubernetesConfigMap.
      - api_groups:
          - ""
        resources:
          - secrets
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers kubernetes_secret_v1.env_secrets (rendered only when containers declare literal secret env values, materialized into one Opaque Secret) and kubernetes_secret_v1.image_pull (rendered only when the pod declares registry logins on pod.image_registries, materialized into one dockerconfigjson Secret); secret.go and image_pull_secret.go in the Pulumi module.
      - api_groups:
          - batch
        resources:
          - jobs
        verbs:
          - list
          - watch
        cluster_scoped: false
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Job in job.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. The readiness wait on the Job in job.go reads jobs at job.go:102-103 before it starts its timeout. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
      - api_groups:
          - ""
        resources:
          - events
          - pods
          - secrets
        verbs:
          - list
          - watch
        cluster_scoped: false
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Secret in image_pull_secret.go and the Secret in secret.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. The readiness wait on the Job in job.go reads pods at job.go:113-114 before it starts its timeout. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing. Events are read differently. While it waits on the Job in job.go, the provider also watches the object's events, at await.go:352 and watchers.go:202-241, for the Warning events a person watching the deploy sees, such as FailedScheduling or an image pull back-off. That informer runs beside the wait, so without events the warnings go silent rather than the deploy hanging. Listing or watching Secrets returns their data, not only their names, so this grants read of every Secret in the namespace. Pulumi's delete wait cannot watch a deleted Secret without it.
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - list
          - watch
        cluster_scoped: true
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Namespace in namespace.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
