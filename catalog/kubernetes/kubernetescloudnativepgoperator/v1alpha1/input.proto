syntax = "proto3";

package dev.planton.kubernetes.kubernetescloudnativepgoperator.v1alpha1;

import "catalog/kubernetes/kubernetescloudnativepgoperator/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// KubernetesCloudNativePgOperatorIacInput is the input for both IaC
// modules (Pulumi and Terraform) of the kubernetes-cloud-native-pg-operator
// kind.
message KubernetesCloudNativePgOperatorIacInput {
  // the kubernetes-cloud-native-pg-operator resource to deploy
  KubernetesCloudNativePgOperator target = 1;

  // kubernetes provider configuration
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
