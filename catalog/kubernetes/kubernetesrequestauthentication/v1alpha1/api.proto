syntax = "proto3";

package dev.planton.kubernetes.kubernetesrequestauthentication.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesrequestauthentication/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesrequestauthentication/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesRequestAuthentication is an Istio RequestAuthentication: a namespaced
// policy that defines which JSON Web Tokens (JWTs) are accepted on the workloads it
// selects.
message KubernetesRequestAuthentication {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesRequestAuthentication'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesRequestAuthenticationSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesRequestAuthenticationStatus status = 5;
}

// KubernetesRequestAuthenticationStatus holds the deployment status and outputs.
message KubernetesRequestAuthenticationStatus {
  // outputs
  KubernetesRequestAuthenticationOutputs outputs = 1;
}
