apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesRequestAuthentication
metadata:
  name: door-jwt
spec:
  namespace:
    value: <namespace>
  target_refs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name:
        valueFrom:
          name: <gateway>
  jwt_rules:
    - issuer: <issuer>
      audiences:
        - <issuer>
      jwks: '{"keys":[{"kty":"RSA","kid":"<sender>","use":"sig","alg":"RS256","n":"<modulus>","e":"AQAB"}]}'
