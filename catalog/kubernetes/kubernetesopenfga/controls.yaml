# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetesopenfga
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The engine is stateless -- every store, model, and tuple lives in the external PostgreSQL or MySQL datastore, and encryption at rest is that composed resource's property. The memory arm persists nothing at all.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: With no data at rest of its own (see enc-at-rest), key management belongs to the composed datastore.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The spec models no first-class TLS seam -- the server speaks HTTP (8080) and gRPC (8081) inside the cluster. TLS file wiring is possible only through the helm_values escape hatch (extraEnvVars against the chart's closed values schema), and the datastore connection's TLS posture rides the composed database's connection parameters.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The chart renders ClusterIP Services only and the module creates no ingress resources -- exposure beyond the cluster composes from Gateway API kinds referencing the exported endpoints. The chart's demo playground is ALWAYS disabled by the module (upstream turned it off for security; the server refuses to start when it is combined with any authn method).
    - control_id: restricted-ingress
      status: not_applicable
      notes: The spec models no NetworkPolicy seam -- in-cluster reachability is governed by first-class KubernetesNetworkPolicy resources composed alongside.
    - control_id: edge-protection
      status: not_applicable
      notes: An in-cluster authorization API serves no edge traffic -- web application firewalls compose at the gateway layer if the API is ever exposed.
    - control_id: rbac
      status: configurable
      field_path: authn
      evidence:
        type: spec_default
        reference: Unset means NO authentication -- anyone who can reach the Service can read and write every store. Preshared keys gate the API but are COARSE (any valid key holds full access to every store); OIDC identifies callers per client. Finer authorization over OpenFGA's own API is not modeled by the server -- scope by network reach and key custody.
    - control_id: workload-identity
      status: configurable
      field_path: service_account_annotations
      evidence:
        type: spec_default
        reference: Unset means the server pods hold no cloud identity; annotating the server ServiceAccount (EKS IRSA, GKE Workload Identity, AKS Workload Identity) federates it to cloud APIs without static credentials -- the proto names this map as the cloud workload-identity seam.
    - control_id: no-legacy-auth
      status: configurable
      field_path: authn
      evidence:
        type: spec_default
        reference: Unset serves the API UNAUTHENTICATED -- fine on a lab cluster, never in production. Declaring an authn method (preshared keys, exercised by the 01 preset via an existing keys Secret, or OIDC) eliminates anonymous access.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Changes to the release's objects are Kubernetes API operations captured by the cluster's audit policy; the server's own request logging (spec.log) streams to stdout as operational logs, not an audit trail. Authorization DATA changes are API operations against OpenFGA, logged the same way.
    - control_id: monitoring-integration
      status: configurable
      field_path: metrics
      evidence:
        type: spec_default
        reference: The chart exports Prometheus metrics on port 2112 by default; metrics.service_monitor_enabled additionally renders a ServiceMonitor for the Prometheus operator. Tracing exports separately through spec.tracing (OpenTelemetry).
    - control_id: backup-recovery
      status: not_applicable
      notes: The engine holds no state to back up -- stores, models, and tuples live in the composed datastore, whose own backup posture governs. Rerunning the engine's schema migration (an init container in every pod) is idempotent.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist on this component (see backup-recovery); retention belongs to the datastore's backup configuration.
    - control_id: multi-zone-ha
      status: configurable
      field_path: replicas
      evidence:
        type: spec_default
        reference: Stateless replicas (default 3) scale reads and checks linearly and tolerate pod loss; spread across zones follows the cluster's scheduler and node topology -- the spec models no zone constraints directly. Forced to 1 on the memory datastore, where each replica would hold its own divergent world.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Helm releases nor the chart's objects carry a deletion-protection flag; protection is operational (cluster RBAC, change review). Deleting the engine loses nothing durable -- authorization data survives in the datastore.
    - control_id: managed-patching
      status: not_applicable
      notes: The release runs exactly the chart_version the manifest pins (default 0.3.10 = OpenFGA v1.18.1) -- there is no managed patch channel; upgrades are deliberate manifest changes.
