syntax = "proto3";

package dev.planton.kubernetes.kubernetesopenfga.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesopenfga/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesopenfga/v1alpha1/spec.proto";
import "shared/metadata.proto";

//open-fga-kubernetes
message KubernetesOpenFga {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesOpenFga'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesOpenFgaSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesOpenFgaStatus status = 5;
}

//open-fga-kubernetes status.
message KubernetesOpenFgaStatus {
  //outputs
  KubernetesOpenFgaOutputs outputs = 1;
}
