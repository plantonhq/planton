# The kind defaults on their own: one controller replica watching
# all namespaces. The verifier proves the ENGINE on every lane: the
# controller Deployment rolled out and the actions.github.com CRDs
# (AutoscalingRunnerSet, AutoscalingListener, EphemeralRunnerSet,
# EphemeralRunner) established. Destroy removes everything INCLUDING the
# CRDs (the chart-owned CRD posture).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesGhaRunnerScaleSetController
metadata:
  name: e2e-arc-min
spec:
  namespace:
    value: e2e-arc-min
  createNamespace: true
