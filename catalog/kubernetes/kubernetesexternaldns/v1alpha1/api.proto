syntax = "proto3";

package dev.planton.kubernetes.kubernetesexternaldns.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesexternaldns/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesexternaldns/v1alpha1/spec.proto";
import "shared/metadata.proto";

//kubernetes-external-dns
message KubernetesExternalDns {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesExternalDns'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesExternalDnsSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesExternalDnsStatus status = 5;
}

//kubernetes-external-dns status.
message KubernetesExternalDnsStatus {
  //outputs
  KubernetesExternalDnsOutputs outputs = 1;
}
