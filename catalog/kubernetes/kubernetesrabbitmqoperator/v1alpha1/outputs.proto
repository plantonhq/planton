syntax = "proto3";

package dev.planton.kubernetes.kubernetesrabbitmqoperator.v1alpha1;

//kubernetes-rabbit-mq-operator outputs
message KubernetesRabbitMqOperatorOutputs {
  //namespace the operator is installed into (always rabbitmq-system —
  //the release manifest's fixed namespace).
  string namespace = 1;

  //name of the operator Deployment (rabbitmq-cluster-operator — the
  //release manifest's fixed name).
  string deployment_name = 2;

  //in-cluster metrics endpoint of the operator (Prometheus format),
  //e.g. http://rabbitmq-cluster-operator-metrics-service.rabbitmq-system.svc.cluster.local:8080/metrics.
  string metrics_endpoint = 3;

  //name of the RabbitmqCluster CustomResourceDefinition the operator
  //serves (rabbitmqclusters.rabbitmq.com). Deleted with this resource
  //— see the CRD-lifecycle note on the spec.
  string crd_name = 4;
}
