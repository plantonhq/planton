syntax = "proto3";

package dev.planton.kubernetes.kubernetesrabbitmqoperator.v1alpha1;

import "catalog/kubernetes/kubernetesrabbitmqoperator/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// kubernetes-rabbit-mq-operator iac-input
message KubernetesRabbitMqOperatorIacInput {
  // the catalog object to deploy
  KubernetesRabbitMqOperator target = 1;
  // provider-credential
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
  // kubernetes namespace
  string kubernetes_namespace = 3;
}
