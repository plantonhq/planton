syntax = "proto3";

package dev.planton.kubernetes;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";

// Shared workload-identity types used by every Kubernetes kind that binds a
// Kubernetes ServiceAccount to a cloud identity for keyless (credential-free)
// authentication to cloud APIs. Kubernetes is a dual provider: a component runs IN a
// host environment (EKS, GKE, AKS, ...) and often talks TO a cloud API (DNS, secret
// stores, KMS, object storage). Workload identity is the mechanism that makes the
// second half keyless — the cluster's OIDC issuer vouches for the ServiceAccount and
// the cloud exchanges that token for cloud credentials.
//
// One shape, every kind: any kind whose pods need cloud access embeds
// `KubernetesWorkloadIdentity` instead of redefining a per-cloud message. The IaC
// modules translate the selected arm into the ServiceAccount annotations each cloud's
// webhook/agent expects:
//
//   | Cloud | ServiceAccount annotation                       | Mechanism |
//   |-------|--------------------------------------------------|-----------|
//   | GKE   | iam.gke.io/gcp-service-account: <email>          | GKE Workload Identity |
//   | EKS   | eks.amazonaws.com/role-arn: <role-arn>           | IRSA (IAM Roles for Service Accounts) |
//   | AKS   | azure.workload.identity/client-id: <client-id>   | Azure AD Workload Identity |
//
// The cloud-side half (IAM binding / trust policy / federated credential) is owned by
// the referenced cloud identity resource, which is why every arm is a StringValueOrRef:
// in an infra chart the cluster, the cloud identity, and the Kubernetes kind
// deploy in one run, with the identity handle flowing in as a reference.
message KubernetesWorkloadIdentity {
  // Exactly which cloud the ServiceAccount federates with. A ServiceAccount can be
  // bound to at most one cloud identity — the annotation sets are mutually exclusive
  // by construction, so this is a oneof rather than repeated arms.
  oneof provider {
    // GKE Workload Identity: annotate the ServiceAccount with a GCP service account email.
    KubernetesWorkloadIdentityGke gke = 1;

    // EKS IRSA: annotate the ServiceAccount with an AWS IAM role ARN.
    KubernetesWorkloadIdentityEksIrsa eks = 2;

    // Azure AD Workload Identity: annotate the ServiceAccount with an Entra application
    // (or user-assigned managed identity) client ID.
    KubernetesWorkloadIdentityAks aks = 3;
  }
}

// KubernetesWorkloadIdentityGke binds a Kubernetes ServiceAccount to a GCP service
// account via GKE Workload Identity. The GCP side must carry a
// roles/iam.workloadIdentityUser binding for member
// "serviceAccount:<project>.svc.id.goog[<namespace>/<ksa-name>]".
message KubernetesWorkloadIdentityGke {
  // GCP service account email, e.g. "dns-manager@my-project.iam.gserviceaccount.com".
  // Applied as the `iam.gke.io/gcp-service-account` annotation. Accepts a literal
  // email or a reference to a GcpServiceAccount resource's output.
  dev.planton.shared.foreignkey.v1.StringValueOrRef service_account_email = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpServiceAccount,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.email"
  ];
}

// KubernetesWorkloadIdentityEksIrsa binds a Kubernetes ServiceAccount to an AWS IAM
// role via IRSA. The IAM role's trust policy must trust the cluster's OIDC provider
// with a condition on "system:serviceaccount:<namespace>:<ksa-name>".
message KubernetesWorkloadIdentityEksIrsa {
  // AWS IAM role ARN, e.g. "arn:aws:iam::123456789012:role/dns-manager".
  // Applied as the `eks.amazonaws.com/role-arn` annotation. Accepts a literal ARN
  // or a reference to an AwsIamRole resource's output.
  dev.planton.shared.foreignkey.v1.StringValueOrRef role_arn = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AwsIamRole,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.role_arn"
  ];
}

// KubernetesWorkloadIdentityAks binds a Kubernetes ServiceAccount to an Azure
// user-assigned managed identity (or Entra app registration) via Azure AD Workload
// Identity. The Azure side must carry a federated identity credential for subject
// "system:serviceaccount:<namespace>:<ksa-name>" against the cluster's OIDC issuer.
// Note: pods that use the identity must ALSO carry the
// `azure.workload.identity/use: "true"` pod label — that half lives on the workload,
// not the ServiceAccount, and is documented per kind.
message KubernetesWorkloadIdentityAks {
  // Client ID (GUID) of the user-assigned managed identity or Entra application.
  // Applied as the `azure.workload.identity/client-id` annotation. Accepts a literal
  // GUID or a reference to an AzureUserAssignedIdentity resource's output.
  dev.planton.shared.foreignkey.v1.StringValueOrRef client_id = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureUserAssignedIdentity,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.client_id"
  ];

  // Entra tenant ID (GUID). Optional: only needed for cross-tenant scenarios; when
  // omitted the azure-workload-identity webhook uses its default tenant. Applied as
  // the `azure.workload.identity/tenant-id` annotation when set.
  optional string tenant_id = 2 [(buf.validate.field).string.uuid = true];
}
