syntax = "proto3";

package dev.planton.kubernetes.kubernetesvelero.v1alpha1;

import "catalog/kubernetes/kubernetesvelero/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// Input for the KubernetesVelero IaC stack. The platform resolves all
// StringValueOrRef references (namespace) to literal strings before passing
// this to the IaC engine.
message KubernetesVeleroIacInput {
  // the catalog object to deploy.
  KubernetesVelero target = 1;
  // Kubernetes provider configuration (cluster credentials).
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
