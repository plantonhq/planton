syntax = "proto3";

package dev.planton.kubernetes.kubernetesvelero.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesvelero/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesvelero/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesVelero installs Velero — cluster backup and disaster recovery —
// on a cluster from the official Helm chart: resource (and optionally
// volume-data) backups to S3/GCS/Azure-Blob/S3-compatible object stores,
// on-demand restores, and scheduled backups.
message KubernetesVelero {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesVelero'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesVeleroSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesVeleroStatus status = 5;
}

// KubernetesVeleroStatus holds the deployment status and outputs.
message KubernetesVeleroStatus {
  // outputs
  KubernetesVeleroOutputs outputs = 1;
}
