apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesvelero
spec:
  # Velero installs as ONE Helm release whose name is fixed to "velero"
  # (one server owns the cluster's backup records and CRDs), in the spec's
  # namespace ("velero" by upstream convention, usually module-created).
  values:
    - name: release_name
      derivations:
        - from_output: release_name
      where_to_find: >-
        Always "velero" — the module fixes the release name.
        Confirm with `helm list -n <namespace>` (NAME column).
    - name: release_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `helm list -A` (NAMESPACE column); conventionally "velero".
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the installation
        namespace itself.
