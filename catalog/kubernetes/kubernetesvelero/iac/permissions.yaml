# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: kubernetesvelero
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubernetes_namespace_v1.velero -- created and owned only when spec.create_namespace is true; get is needed for refresh either way. delete applies only to module-owned namespaces.
      - api_groups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: The chart installs the Velero CRDs (Backup, Restore, Schedule, BackupStorageLocation, ...) from its crds/ directory through helm_release.velero, and the crds.upgrade_on_install job (chart default true) re-applies them on every upgrade. Helm never deletes crds/-directory CRDs on uninstall; delete matters only for the destructive crds.cleanup_on_uninstall opt-in.
      - api_groups:
          - ""
        resources:
          - serviceaccounts
          - secrets
          - services
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the release-owned core objects -- the velero-server ServiceAccount (serviceAccount.server.create stays true; keyless identity annotations ride it), the credentials Secret rendered from credentials.secretContents when a static-credential arm is set (the modules' isolated sensitive values document), and the in-cluster metrics Service.
      - api_groups:
          - apps
        resources:
          - deployments
          - daemonsets
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the Velero server Deployment (always) and the node-agent DaemonSet -- rendered only when spec.fs_backup.deploy_node_agent is true (the modules map it to the chart's deployNodeAgent). The node-agent pods run privileged host-path mounts of the kubelet pod directory; admitting them is the target cluster's pod-security posture, not a runner permission.
      - api_groups:
          - batch
        resources:
          - jobs
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the chart's CRD-upgrade Job (crds.upgrade_on_install, chart default true -- the modules set wait_for_jobs so the apply blocks on it) and the CRD-cleanup Job rendered only for the destructive crds.cleanup_on_uninstall opt-in.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - clusterrolebindings
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: "The chart binds the velero-server ServiceAccount to the built-in cluster-admin ClusterRole by default (Velero must read and restore every resource type in the cluster). Kubernetes escalation prevention makes this the manifest's largest grant: the runner must itself hold cluster-admin-equivalent permissions or carry the bind verb on that ClusterRole to create the binding."
      - api_groups:
          - velero.io
        resources:
          - backupstoragelocations
          - volumesnapshotlocations
          - schedules
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the chart-rendered Velero configuration objects -- the default BackupStorageLocation (from the backup_storage backend arm), the default VolumeSnapshotLocation (volume_snapshots.enabled, chart default true), and one Schedule per spec.schedules entry. All land in the install namespace.
      - api_groups:
          - monitoring.coreos.com
        resources:
          - servicemonitors
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the ServiceMonitor rendered only when spec.prometheus.service_monitor is true (the release FAILS without the Prometheus operator CRDs on the cluster). The helm_values overlay (spec.helm_values, merged last) can extend the chart's object surface beyond these rules generally; grants for such extensions ride the operator's review of the overlay, not this manifest.
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - list
          - watch
        cluster_scoped: true
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Namespace in namespace.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
