# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. This kind is
# the catalog's bring-your-own-manifest escape hatch, so least-privilege has
# a hard honest limit here: the runner applies WHATEVER THE DECLARED YAML
# CONTAINS, exactly as written. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: kubernetesmanifest
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubernetes_namespace_v1.manifest_namespace -- the anchor namespace, created and owned only when spec.create_namespace is true; get is needed for refresh either way. delete applies only to module-owned namespaces.
      - api_groups:
          - "*"
        resources:
          - "*"
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: "THE BRING-YOUR-OWN-MANIFEST REALITY, stated plainly: kubectl_manifest.documents (and the Pulumi twin) applies every document in spec.manifest_yaml exactly as written -- core kinds, CRDs, custom resources, cluster-scoped objects, anything -- so the runner's true requirement is the union of whatever the YAML declares, and no manifest-time enumeration exists in this catalog's data. In practice (migrated from the kind's catalog.md): cluster-scoped documents (CRDs, ClusterRoles, ...) require cluster-admin-level access, while manifests of purely namespace-scoped documents need only the matching permissions in their target namespaces -- operators who know what a given manifest contains should scope the runner to that actual object surface instead of granting this wildcard. Kubernetes escalation prevention still applies to any RBAC the manifest contains: the runner must already hold what the declared roles grant, or the escalate verb."
