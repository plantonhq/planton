syntax = "proto3";

package dev.planton.kubernetes.kuberneteskafkaui.v1alpha1;

/**
 * **KubernetesKafkaUiOutputs** — the handles the console exports
 * for composition (exposure kinds attach Ingress/Gateway routes to
 * the service).
 */
message KubernetesKafkaUiOutputs {
  // Namespace the console runs in.
  string namespace = 1;

  // Name of the console Service.
  string service_name = 2;

  // In-cluster console endpoint
  // (`http://<service>.<namespace>.svc.cluster.local:<port>`).
  string endpoint = 3;

  // Command to port-forward the console to localhost for quick
  // access without any exposure.
  string port_forward_command = 4;
}
