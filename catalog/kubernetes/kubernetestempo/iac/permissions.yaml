# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: kubernetestempo
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubernetes_namespace_v1.tempo (Pulumi kubernetescorev1.NewNamespace) -- created and owned only when spec.create_namespace is true; get is needed for refresh either way. delete applies only to module-owned namespaces.
      - api_groups:
          - ""
        resources:
          - secrets
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: The modules create exactly one Secret of their own, kubernetes_secret_v1.r2_credentials (`<name>-r2-credentials`, the r2 arm's key pair, only when storage.r2 is declared); the other arms' object-store credentials are read from EXISTING Secrets the manifest references. The Helm release also stores its state in namespace-scoped release Secrets the runner must manage.
      - api_groups:
          - ""
        resources:
          - services
          - configmaps
          - serviceaccounts
          - pods
          - persistentvolumeclaims
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers helm_release.tempo (Pulumi helmv3.NewRelease) -- the tempo chart renders the client and headless Services, the Tempo config ConfigMap, a ServiceAccount, and per-replica PVCs through the StatefulSet's volumeClaimTemplates (this component's persistent-by-default posture; none when spec.ephemeral is true). The release installs with wait, so the runner also reads pods to confirm readiness. The chart's full object surface is the chart's to evolve; these are the families the pinned chart (2.2.3) manages.
      - api_groups:
          - apps
        resources:
          - statefulsets
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the chart's workload -- one StatefulSet whose replica count is spec.replicas (single-binary Tempo; the tempo-query sidecar joins the same pods when spec.tempo_query_enabled is true).
      - api_groups:
          - monitoring.coreos.com
        resources:
          - servicemonitors
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the chart's ServiceMonitor -- rendered only when spec.service_monitor_enabled is true (requires the Prometheus Operator CRDs on the cluster).
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - list
          - watch
        cluster_scoped: true
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Namespace in namespace.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
