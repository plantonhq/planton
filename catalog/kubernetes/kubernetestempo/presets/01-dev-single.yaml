apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesTempo
metadata:
  name: dev-tempo
spec:
  namespace:
    value: dev-tempo
  create_namespace: true
  # The kind's defaults: a single monolithic replica on a persistent
  # volume (traces survive restarts — the chart's own emptyDir default
  # would not), OTLP receivers on 4317/4318, single-tenant. Send spans
  # with a KubernetesOtelCollector traces pipeline pointed at the exported
  # otlp_grpc_endpoint; read them in Grafana with a tempo datasource at
  # the exported http_endpoint.
