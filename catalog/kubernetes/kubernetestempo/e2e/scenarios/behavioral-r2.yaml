# THE r2 proof: Tempo stores its trace blocks in a real Cloudflare R2
# bucket through the r2 arm. The verifier (switched on by this scenario's
# name) pushes a span, asks Tempo to flush every block to the backend, and
# lists the bucket over R2's S3 API for block objects this run wrote; then
# it deletes the Tempo pod and retrieves the trace by ID. The arm's whole
# promise is proven on the thing itself: the composed endpoint host, region
# and addressing, and the key pair travelling from the manifest through the
# module-owned `<name>-r2-credentials` Secret into Tempo's environment.
#
# The bucket and key pair are the owner-arranged fixture in the planton-e2e
# Cloudflare test account (a bucket, and an R2 token scoped to it with
# Object Read & Write). Without them the lane skips. Literal values stand
# in for the references a real composition uses (`valueFrom` on a
# CloudflareR2Bucket, `$secret/` for the pair).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesTempo
metadata:
  name: e2e-tempo-r2
  annotations:
    planton.dev/e2e-required-env: PLANTON_E2E_CLOUDFLARE_ACCOUNT_ID,PLANTON_E2E_CLOUDFLARE_R2_BUCKET,PLANTON_E2E_CLOUDFLARE_R2_ACCESS_KEY_ID,PLANTON_E2E_CLOUDFLARE_R2_SECRET_ACCESS_KEY
spec:
  namespace:
    value: e2e-tempo-r2
  create_namespace: true
  replicas: 1
  disk_size: 2Gi
  storage:
    r2:
      account_id:
        value: ${E2E_ENV:PLANTON_E2E_CLOUDFLARE_ACCOUNT_ID}
      bucket:
        value: ${E2E_ENV:PLANTON_E2E_CLOUDFLARE_R2_BUCKET}
      credentials:
        access_key_id:
          value: ${E2E_ENV:PLANTON_E2E_CLOUDFLARE_R2_ACCESS_KEY_ID}
        secret_access_key:
          value: ${E2E_ENV:PLANTON_E2E_CLOUDFLARE_R2_SECRET_ACCESS_KEY}
