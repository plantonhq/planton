# The kind defaults on their own: a single-replica monolithic Tempo on
# a persistent volume (the component provisions a PVC by default — the
# chart's own emptyDir default would lose traces on restart). The verifier
# proves the pipeline live — push a span over OTLP, then retrieve the trace
# by ID through the query API.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesTempo
metadata:
  name: e2e-tempo-min
spec:
  namespace:
    value: e2e-tempo-min
  create_namespace: true
