# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: kubernetesplantonplatform
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The platform's data lives on Kubernetes persistent volumes whose encryption is the STORAGE CLASS's posture (spec.storage.storage_class_name selects it; e.g. gp3 volumes encrypt when the class says so) — the platform neither adds nor removes volume encryption.
    - control_id: enc-at-rest-cmk
      status: configurable
      field_path: bootstrap.secret_backend.aws_secrets_manager.kms_key_arn
      evidence:
        type: spec_default
        reference: The managed-secret store is the one surface with a first-class CMK seam — the awsSecretsManager backend requires a KMS key ARN. Volume-level CMKs ride the chosen StorageClass.
    - control_id: enc-in-transit
      status: configurable
      field_path: ingress.tls
      evidence:
        type: spec_default
        reference: External traffic is HTTPS when ingress.tls is set (brought certificate or cert-manager issuer; TLS-at-the-edge postures like ACM ride ingress.annotations) or, on the Gateway API door (ingress.gateway_ref), when the Gateway's listener serving the hostname terminates TLS. The zero-config port-forward door is a kubectl tunnel — encrypted by the Kubernetes API server's TLS end to end. Outbound email rides email.smtp.security — starttls (a required upgrade, never a silent fallback; the default) or tls (implicit TLS); none is plaintext for credential-free internal relays only, and the spec refuses credentials over it.
      notes: In-cluster traffic between platform components rides ClusterIP services in one namespace.
    - control_id: no-public-access
      status: enforced_by_default
      field_path: ingress.reachability
      evidence:
        type: module_default
        reference: Ingress is OFF by default — a zero-config platform is reachable only through kubectl port-forward (cluster-credential holders). Exposure is a deliberate ingress.enabled=true, and ingress.reachability declares whether the public internet reaches the door (auto reads a hostname over HTTPS as public; private keeps every door that needs an inbound path from the internet closed even on an HTTPS address).
    - control_id: restricted-ingress
      status: configurable
      field_path: ingress.reachability
      evidence:
        type: spec_default
        reference: When exposed, the platform rides the cluster's front door — an Ingress controller (class selection and controller-specific fencing such as internal schemes and allow-lists ride ingress.ingress_class_name and ingress.annotations) or a Gateway API Gateway (ingress.gateway_ref, where the Gateway's listeners and allowedRoutes do the fencing and the platform never edits them) — and ingress.reachability records the resulting posture (public or private) so the platform offers only the doors that posture can honor.
    - control_id: edge-protection
      status: not_applicable
      notes: Web application firewalls live on the cluster's edge (the ingress controller or the cloud load balancer in front of it), outside this spec — ingress.annotations carries controller-specific wiring where the edge supports it.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The module creates the CR and (optionally) its namespace; every platform workload runs with namespace-scoped identities the operator creates per platform. The platform's own user-facing access control is its identity server (Keycloak) for sign-in and its policy engine (OpenFGA) for fine-grained relationship authorization on every request.
    - control_id: workload-identity
      status: configurable
      field_path: runner.service_account_annotations
      evidence:
        type: spec_default
        reference: The runner's cloud identity is keyless workload identity (EKS role-arn / GKE service-account / AKS client-id annotations) or a customer-owned credentials Secret — the platform stores no cloud credentials either way. The control plane's OWN cloud identity (for cloud secret backends and KMS) is the sibling control_plane.service_account_annotations.
    - control_id: no-legacy-auth
      status: enforced_by_default
      evidence:
        type: module_default
        reference: Sign-in is OIDC against the platform's own identity server — there is no native-password API path. The first-run door is a one-time setup code (read from a Secret by a cluster-credential holder) that self-disables after the first admin exists.
    - control_id: strong-user-auth
      status: not_applicable
      notes: Sign-in rides the platform's operator-deployed identity server (identity) — password policies, brute-force lockout, and MFA are realm configuration inside that product and its configured identity providers, a product surface versioned with spec.version rather than installation configuration.
    - control_id: audit-logging
      status: not_applicable
      notes: Platform-level audit surfaces belong to the deployed product (its own activity/audit records), versioned with spec.version — not modeled as installation configuration. Operator mutations are Kubernetes API operations captured by the cluster's audit policy.
    - control_id: monitoring-integration
      status: not_applicable
      notes: No monitoring seam is modeled on this spec — the operator publishes per-component health in the CR's status (phase, per-component messages, the Ready condition), which cluster monitoring can watch; metrics endpoints are a product surface versioned with spec.version.
    - control_id: backup-recovery
      status: configurable
      field_path: database.postgresql.backup
      evidence:
        type: spec_default
        reference: Unset means no backup — the platform's database lives on one volume in the cluster and nothing copies it anywhere (the BACKUP column reads NotConfigured). Declaring database.postgresql.backup.object_store turns on continuous WAL archiving plus scheduled base backups (the first one immediately) into an S3, GCS, Azure Blob, or Cloudflare R2 bucket you own, with the credential declared by reference and materialized as a Secret by the module; database.postgresql.recover_from declares a new platform restored from such an archive, honored when its database is first created.
      notes: Only the platform's PostgreSQL is covered — every record the control plane keeps and the identity realm. The secrets manager (OpenBAO) keeps its data on its own volume outside this archive, so a restored platform runs with an empty secrets manager until connection credentials are re-entered; the GUIDE names the boundary. The 06-backups-to-r2 preset backs up nightly with 30d retention; the other presets deliberately have none.
    - control_id: backup-retention-policy
      status: configurable
      field_path: database.postgresql.backup.retention_policy
      evidence:
        type: spec_default
        reference: 30d by default; retention_policy ("30d", "8w", "6m") is how long the store keeps base backups and the WAL that goes with them, enforced by the backup plugin after each backup.
      notes: The 06-backups-to-r2 preset keeps 30 days.
    - control_id: multi-zone-ha
      status: configurable
      field_path: database.postgresql.replicas
      evidence:
        type: spec_default
        reference: replicas 2+ grows the platform's database into a streaming-replication pair with automatic failover (a LIVE edit); control_plane.replicas and console.replicas add stateless copies. Zone spread follows the cluster's scheduler defaults.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Kubernetes nor the operator offers a deletion-protection flag; protection is operational (namespace RBAC, change review). Deleting the resource tears the whole platform down — databases included — through Kubernetes garbage collection of the owner-referenced objects.
    - control_id: managed-patching
      status: configurable
      field_path: version
      evidence:
        type: spec_default
        reference: version is REQUIRED and never defaulted — the platform version is always a deliberate pin, and upgrades are a deliberate one-line edit the operator rolls out. Nothing in the module or catalog can silently move a running platform's version.
