syntax = "proto3";

package dev.planton.kubernetes.kubernetesplantonplatform.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

/**
 * **KubernetesPlantonPlatformSpec** declares a self-hosted Planton
 * platform — control plane, web console, identity server (Keycloak),
 * PostgreSQL (CloudNativePG), cache, workflow engine (Temporal), secrets
 * manager (OpenBAO), and an in-cluster deployment runner — as a
 * `PlantonPlatform` custom resource that the Planton operator reconciles.
 *
 * PREREQUISITE: the Planton operator must be installed first (declare a
 * KubernetesPlantonOperator resource). One operator serves EVERY platform
 * on the cluster; each platform lives in its own namespace with its own
 * URL, identity server, and databases.
 *
 * ZERO-CONFIG BY DESIGN: `version` is the only required choice. A
 * version-only platform serves console, API, and sign-in on one origin
 * through a built-in gateway reachable with a single `kubectl
 * port-forward` (the exact command is this resource's
 * `port_forward_command` output), and the console's first visitor becomes
 * the admin using a setup code read from a Secret (the
 * `setup_code_command` output). Everything else — a real hostname and
 * TLS, storage classes and sizes, workload identity for the runner —
 * is opt-in refinement of a working platform.
 *
 * VERSION IS A DELIBERATE CHOICE, ALWAYS: the field is required and never
 * defaulted, because a default that moved with catalog updates would
 * silently upgrade a running platform — databases and all — on an
 * ordinary re-apply. Upgrades are a one-line edit of this field.
 *
 * SPEC SURFACE AND OPERATOR VERSION: this spec models the PlantonPlatform
 * schema as of the catalog release. A newer operator may accept fields
 * this catalog does not model yet — reach them by updating the catalog,
 * or through the `planton` umbrella Helm chart, whose values pass the
 * platform spec through verbatim.
 *
 * DESTROY BEHAVIOR: deleting the resource deletes the platform — every
 * workload, Service, Secret, and volume the operator created is
 * owner-referenced to this declaration and garbage-collected by
 * Kubernetes (so teardown completes even when the operator itself is
 * already gone), and the database layer removes its volumes and
 * credentials together — no orphaned volume holds a password a reinstall
 * cannot match. Two residues are known: build caches and workflow
 * volumes can survive in the namespace (deleting the namespace, automatic
 * when this resource owned it via create_namespace, sweeps them), and the
 * platform's namespace-qualified token-review ClusterRole/Binding
 * lingers inert (its subject ServiceAccount is deleted with the
 * platform) until an operator release adds the janitor. Cluster-shared
 * sub-operators (CloudNativePG, Tekton) deliberately stay — sibling
 * platforms may ride them.
 */
message KubernetesPlantonPlatformSpec {
  /**
   * The namespace the platform lives in. Accepts a literal namespace name
   * or a reference to a KubernetesNamespace resource. Every platform
   * workload, Service, Secret, and volume is created here, named from
   * this resource's metadata.name.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef namespace = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesNamespace,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "spec.name"
  ];

  /**
   * When true, the namespace is created (with the standard Planton
   * governance labels) before the platform is declared, and deleted with
   * the resource. When false, the namespace must already exist.
   */
  bool create_namespace = 2;

  /**
   * The Planton platform version to deploy (e.g.
   * "v0.0.45") — pins the control plane, console, and
   * runner images as one coherent line. REQUIRED, never defaulted:
   * changing it is how a platform upgrades, and upgrades of a system
   * holding your data must always be a deliberate act.
   */
  string version = 3 [(buf.validate.field).string.min_len = 1];

  /**
   * License activation. Without one the platform runs the Community
   * feature set. Set AT MOST one of key or secret_key_ref.
   */
  KubernetesPlantonPlatformLicense license = 4;

  /**
   * Platform-wide storage defaults: every persistent volume the platform
   * creates (databases, cache, workflow engine, secrets manager, runner
   * state) uses these unless its component overrides them.
   * Unset means the cluster's default StorageClass and each component's
   * built-in size.
   */
  KubernetesPlantonPlatformStorage storage = 5;

  /**
   * The platform's own data stores (PostgreSQL and the Redis-protocol
   * cache). Sizing and placement only — the stores themselves are always
   * deployed; the platform cannot run without them.
   */
  KubernetesPlantonPlatformDatabase database = 6;

  /**
   * Expose the platform at a real URL through the cluster's existing
   * front door — an Ingress controller, or a Gateway API Gateway
   * (`gateway_ref`). Off by default — the built-in gateway plus
   * port-forward is the zero-config door. `hostname` serves your own
   * domain; `tls` adds HTTPS (bring a certificate Secret or name a
   * cert-manager issuer).
   */
  KubernetesPlantonPlatformIngress ingress = 7;

  /**
   * The built-in front-door gateway: console, API, and sign-in on one
   * origin over a single `kubectl port-forward`. Always deployed; the
   * local_port here is baked into the identity server's issuer and the
   * console's callbacks at first boot, so pick it before the first visit.
   */
  KubernetesPlantonPlatformGateway gateway = 8;

  /**
   * The platform's identity server (Keycloak, operator-deployed).
   * Everything defaults: the realm is "planton" and the first console
   * visitor becomes the admin through the setup-code page. Set
   * admin_email only to pre-seed a known admin instead.
   */
  KubernetesPlantonPlatformIdentity identity = 9;

  /**
   * First-boot seeding: the initial organization and environment, extra
   * admins, the IaC provisioner the in-cluster runner uses, and where the
   * platform's managed secrets live.
   */
  KubernetesPlantonPlatformBootstrap bootstrap = 10;

  /**
   * The in-cluster deployment runner — how this platform deploys real
   * infrastructure. ON by default; disabling it leaves a platform that
   * can model but not deploy. Cloud identity comes from workload-identity
   * annotations OR a customer-owned credentials Secret — the platform
   * stores no cloud credentials itself.
   */
  KubernetesPlantonPlatformRunner runner = 11;

  /**
   * Container-image build pipelines (Tekton). ON by default; follows the
   * runner off when the runner is disabled. NOTE: Tekton allows exactly
   * one cluster-wide build-events sink, so builds can feed only ONE
   * build-enabled platform per cluster — disable this on all but one when
   * several platforms share a cluster.
   */
  KubernetesPlantonPlatformBuild build = 12;

  /**
   * The bundled secrets manager (OpenBAO). ON by default — a
   * version-only platform stores connection secrets with zero
   * configuration. Explicit `enabled: false` is the deliberate opt-out
   * (bring a cloud secret backend through bootstrap.secret_backend
   * instead). The vault stores its data in the platform's own PostgreSQL,
   * so `database.postgresql.backup` archives it with the records; what
   * opens the restored vault is declared here — a cloud key (`auto_unseal`)
   * or a keys Secret you own (`init_secret_name`).
   */
  KubernetesPlantonPlatformVault vault = 13;

  /**
   * Opt-in platform components, off by default: the graph explorer
   * (Neo4j).
   */
  KubernetesPlantonPlatformComponents components = 14;

  /**
   * Cluster-shared sub-operators the platform rides (CloudNativePG,
   * Tekton Pipelines). "auto" (the default) installs each one only when
   * no installation exists on the cluster; "skip" declares that something
   * else manages it.
   */
  KubernetesPlantonPlatformPrerequisites prerequisites = 15;

  /**
   * The platform's control-plane deployment (the API monolith). Sizing,
   * image mirrors, extra environment through a Secret, and the
   * platform's OWN cloud identity (for cloud secret backends and KMS) —
   * distinct from the runner's deploy-time identity.
   */
  KubernetesPlantonPlatformControlPlane control_plane = 16;

  /**
   * The web console deployment. Sizing, image mirrors, and extra
   * environment through a Secret.
   */
  KubernetesPlantonPlatformConsole console = 17;

  /**
   * Runners outside this cluster — a developer's laptop deploying with the
   * cloud sign-in already on it, an appliance in another network — pulling
   * this platform's deploy work. OFF by default. Rides the front door:
   * such a runner reaches its work through the control plane on the
   * platform hostname's native gRPC address, so it needs a Gateway API front
   * door (ingress with a gateway_ref); on any other door the capability
   * stays closed and the platform's status says why. The in-cluster runner
   * is unaffected.
   */
  KubernetesPlantonPlatformRemoteRunners remote_runners = 18;

  /**
   * The one mail provider every sender on the install uses: the control
   * plane (invitations, alerts, license mail) and the identity server
   * (password resets) both send through it, so one declaration is the
   * whole configuration. Absent, the install sends no email: invitations
   * are shared as links and the sign-in page offers no "Forgot password?".
   * Exactly one provider arm is set — an SMTP relay or a Resend account.
   * Credentials are never inline: they are Secrets in the platform's
   * namespace, named here, and reach the control plane as mounted files so
   * a rotated password is live on the next send. The operator delivers the
   * declaration and preflights every Secret it names; the control plane
   * checks the relay on demand from the console's Email settings and
   * reports each failure in the relay's own words. Requires a
   * planton-operator chart that knows this field (0.14.1 or newer); an
   * older definition refuses the declaration.
   */
  KubernetesPlantonPlatformEmail email = 19;

  /**
   * The registry root the control plane, console, and runner images are
   * pulled from, as <image_registry>/<image> (control-plane,
   * client-apps/web, runner). Empty = the operator's default,
   * ghcr.io/plantonhq/planton. Every release is also published, byte for
   * byte, to Google Artifact Registry at
   * asia-south1-docker.pkg.dev/plantonhq/planton; set that to pull from
   * Google, or name a mirror of your own. A component's image.repository,
   * when set, wins over this root. Requires a planton-operator chart that
   * knows this field (0.22.0 or newer); an older definition refuses the
   * declaration.
   */
  string image_registry = 20 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).cel = {
      id: "image_registry_format"
      message: "image_registry is a registry root such as \"asia-south1-docker.pkg.dev/plantonhq/planton\": no scheme and no trailing slash"
      expression: "!this.endsWith('/') && !this.contains('://')"
    }
  ];

  option (buf.validate.message).cel = {
    id: "spec.vault.backup_needs_surviving_keys"
    message: "a backup carries the vault's data, but under the built-in seal the vault's keys live in a Secret that is deleted with the platform — set vault.init_secret_name to a Secret you own (and keep a copy outside the cluster), or declare vault.auto_unseal so a restored vault opens from your cloud key"
    expression: "!has(this.database) || !has(this.database.postgresql) || !has(this.database.postgresql.backup) || (has(this.vault) && has(this.vault.enabled) && !this.vault.enabled) || (has(this.vault) && (has(this.vault.auto_unseal) || this.vault.init_secret_name != ''))"
  };
  option (buf.validate.message).cel = {
    id: "spec.vault.disabled_needs_cloud_secret_backend"
    message: "bootstrap.secret_backend.type 'platform' stores secrets in the bundled vault, which vault.enabled: false has opted out of — re-enable the vault or use type awsSecretsManager"
    expression: "!has(this.bootstrap) || !has(this.bootstrap.secret_backend) || this.bootstrap.secret_backend.type != 'platform' || !has(this.vault) || !has(this.vault.enabled) || this.vault.enabled"
  };
}

/**
 * Outbound email through the adopter's own provider — exactly one arm.
 */
message KubernetesPlantonPlatformEmail {
  option (buf.validate.message).cel = {
    id: "spec.email.exactly_one_provider"
    message: "email declares exactly one provider: set spec.email.smtp for a relay or spec.email.resend for a Resend account, never both, never neither"
    expression: "has(this.smtp) != has(this.resend)"
  };

  /**
   * The identity every email carries: the address the install sends as
   * and the display name beside it. The relay must permit sending as this
   * address (a mailbox's own address, or one it has Send As rights to);
   * SPF and DKIM for the domain are the domain owner's job.
   */
  KubernetesPlantonPlatformEmailFrom from = 1 [(buf.validate.field).required = true];

  /**
   * Where a person's reply lands — a help desk or a shared mailbox — when
   * the sending address is a no-reply one. Empty, replies go to
   * from.address.
   */
  string reply_to = 2;

  /**
   * Send through any SMTP relay: a workplace mail system (Exchange Online,
   * Google Workspace, an internal smart host) or a transactional vendor's
   * SMTP endpoint (SES, SendGrid, Postmark, Mailgun, Resend).
   */
  KubernetesPlantonPlatformEmailSmtp smtp = 3;

  /**
   * Send through Resend's API with an API key.
   */
  KubernetesPlantonPlatformEmailResend resend = 4;
}

/**
 * The sender identity on every email the install sends.
 */
message KubernetesPlantonPlatformEmailFrom {
  /**
   * The address the install sends as, e.g. no-reply@planton.acme.com.
   * Required whenever email is declared: there is no default address,
   * because a default would name somebody else's domain.
   */
  string address = 1 [(buf.validate.field).string.min_len = 1];

  /**
   * The name shown beside the address in mail clients. Platform default:
   * Planton.
   */
  optional string name = 2 [(dev.planton.shared.options.default) = "Planton"];
}

/**
 * An SMTP relay. Three ways to be let in, matching how mail teams actually
 * run relays: a username and password (a kubernetes.io/basic-auth Secret),
 * an OAuth2 app registration (Exchange Online, whose password submission
 * Microsoft is retiring), or no credential at all (an internal smart host
 * that allow-lists the cluster's egress).
 */
message KubernetesPlantonPlatformEmailSmtp {
  option (buf.validate.message).cel = {
    id: "spec.email.smtp.one_way_in"
    message: "smtp authenticates one way: set credentials_secret_name for a username and password, or oauth2 for a token, not both"
    expression: "!(this.credentials_secret_name != '' && has(this.oauth2))"
  };
  option (buf.validate.message).cel = {
    id: "spec.email.smtp.no_credentials_over_plaintext"
    message: "security: none would send credentials in the clear; keep security at starttls or tls, or drop credentials_secret_name and oauth2 for a relay that admits this cluster's address without them"
    expression: "!has(this.security) || this.security != 'none' || (this.credentials_secret_name == '' && !has(this.oauth2))"
  };

  /**
   * Host of the relay, e.g. smtp.office365.com or
   * smtp-relay.corp.acme.com.
   */
  string host = 1 [(buf.validate.field).string.min_len = 1];

  /**
   * Port the relay listens on. 587 is the submission port most relays use
   * with STARTTLS; implicit-TLS relays (security: tls) usually listen on
   * 465; an internal plaintext relay on 25. Platform default: 587.
   */
  optional int32 port = 2 [
    (dev.planton.shared.options.default) = "587",
    (buf.validate.field).int32 = {
      gte: 1
      lte: 65535
    }
  ];

  /**
   * How the connection to the relay is protected: starttls (connect in the
   * clear and REQUIRE the upgrade before anything is sent — a relay that
   * does not offer it is a failed connection, never a silent fallback; the
   * default), tls (implicit TLS from the first byte), or none (plaintext
   * end to end, for credential-free internal relays only; credentials are
   * refused on it). Platform default: starttls.
   */
  optional string security = 3 [
    (dev.planton.shared.options.default) = "starttls",
    (buf.validate.field).string = {
      in: [
        "",
        "starttls",
        "tls",
        "none"
      ]
    }
  ];

  /**
   * Name of a kubernetes.io/basic-auth Secret in the platform's namespace
   * whose username and password keys sign in to the relay:
   *
   *   kubectl -n <namespace> create secret generic planton-email \
   *     --type=kubernetes.io/basic-auth \
   *     --from-literal=username=... --from-literal=password=...
   *
   * Omit it for a relay that admits this cluster by network address. The
   * values reach the control plane as mounted files, so a rotated password
   * is live on the next send with no restart.
   */
  string credentials_secret_name = 4;

  /**
   * Sign in with a token from an OAuth2 client-credentials grant (SASL
   * XOAUTH2) instead of a password. Exchange Online: token_url
   * https://login.microsoftonline.com/<tenant>/oauth2/v2.0/token, scope
   * https://outlook.office365.com/.default, the app registration's client
   * id and secret, and user = the mailbox the app may send as.
   */
  KubernetesPlantonPlatformEmailSmtpOauth2 oauth2 = 5;

  /**
   * A PEM CA bundle for verifying the relay's TLS certificate — the
   * private-CA case, the classic enterprise blocker. Omit it when the
   * relay's certificate chains to a public root.
   */
  KubernetesPlantonPlatformSecretKeyRef ca_bundle_secret_ref = 6;
}

/**
 * The client-credentials grant that yields the SMTP token: the same four
 * facts the identity server needs, so one declaration powers both senders.
 */
message KubernetesPlantonPlatformEmailSmtpOauth2 {
  /**
   * The mailbox the token sends as — the account the app registration has
   * been permitted to use.
   */
  string user = 1 [(buf.validate.field).string.min_len = 1];

  /**
   * The provider's OAuth2 token endpoint. Must be an https:// URL.
   */
  string token_url = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "email.smtp.oauth2.token_url_https"
      message: "token_url must be an https:// URL"
      expression: "this.startsWith('https://')"
    }
  ];

  /**
   * The scope requested for the token.
   */
  string scope = 3 [(buf.validate.field).string.min_len = 1];

  /**
   * The app registration's client id.
   */
  string client_id = 4 [(buf.validate.field).string.min_len = 1];

  /**
   * The app registration's client secret, by reference: the secret is
   * never inline.
   */
  KubernetesPlantonPlatformSecretKeyRef client_secret_ref = 5 [(buf.validate.field).required = true];
}

/**
 * Resend's HTTP API.
 */
message KubernetesPlantonPlatformEmailResend {
  /**
   * The Resend API key, by reference: the key is never inline. Reaches the
   * control plane as a mounted file, so a rotated key is live on the next
   * send with no restart.
   */
  KubernetesPlantonPlatformSecretKeyRef api_key_secret_ref = 1 [(buf.validate.field).required = true];
}

/**
 * Runners in other networks pulling this platform's deploy work.
 */
message KubernetesPlantonPlatformRemoteRunners {
  /**
   * Admit runners outside the cluster and advertise the front door's address
   * to them. Platform default: false — an install that has not chosen this
   * admits only its in-cluster runner, and a runner asking to enroll from
   * outside is refused with the reason, never handed an address it cannot
   * reach. What is exposed: nothing of the deploy queue itself, which never
   * leaves the cluster. The control plane answers a remote runner's work
   * calls on the queue's behalf, authenticating the runner's own key on
   * every call and admitting it only to its own two queues, the work
   * dispatched to it, and the tasks it polled; any other caller, and any
   * other queue method, is refused with one sentence saying why.
   */
  optional bool enabled = 1 [(dev.planton.shared.options.default) = "false"];
}

/**
 * License activation — at most one delivery form.
 */
message KubernetesPlantonPlatformLicense {
  option (buf.validate.message).cel = {
    id: "spec.license.key_xor_secret_ref"
    message: "set at most one of key or secret_key_ref — one license, one delivery form"
    expression: "this.key == '' || !has(this.secret_key_ref)"
  };

  /**
   * The license key, inline. This is a secret: supply it as a
   * managed-secret reference, never inline plaintext.
   */
  string key = 1 [(dev.planton.shared.options.sensitive) = true];

  /**
   * Read the license key from an existing Kubernetes Secret in the
   * platform's namespace instead.
   */
  KubernetesPlantonPlatformSecretKeyRef secret_key_ref = 2;
}

/**
 * A key in an existing Kubernetes Secret in the platform's namespace — the
 * one shape every by-reference credential on this spec uses (the license
 * key, the relay's CA bundle, the OAuth2 client secret, the Resend API key).
 */
message KubernetesPlantonPlatformSecretKeyRef {
  /**
   * Secret name (in the platform's namespace).
   */
  string name = 1 [(buf.validate.field).string.min_len = 1];

  /**
   * Key within the Secret holding the value.
   */
  string key = 2 [(buf.validate.field).string.min_len = 1];
}

/**
 * Platform-wide storage defaults.
 */
message KubernetesPlantonPlatformStorage {
  /**
   * StorageClass for every platform volume unless a component overrides
   * it. Unset = the cluster's default class (the operator verifies the
   * default class can actually provision before deploying).
   */
  string storage_class_name = 1;

  /**
   * Size for every platform volume unless a component overrides it
   * (e.g. "10Gi"). Useful when the storage backend enforces a minimum
   * volume size — one value lifts every volume above the floor.
   */
  string size = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).cel = {
      id: "storage.size_quantity"
      message: "size must be a Kubernetes quantity like \"10Gi\" or \"800Gi\""
      expression: "this.matches('^[0-9]+(\\\\.[0-9]+)?(Ei|Pi|Ti|Gi|Mi|Ki|E|P|T|G|M|K)?$')"
    }
  ];
}

/**
 * The platform's own data stores.
 */
message KubernetesPlantonPlatformDatabase {
  /**
   * PostgreSQL (CloudNativePG-managed).
   */
  KubernetesPlantonPlatformPostgresql postgresql = 1;

  /**
   * The Redis-protocol cache (Valkey).
   */
  KubernetesPlantonPlatformRedis redis = 2;
}

/**
 * The platform's PostgreSQL.
 */
message KubernetesPlantonPlatformPostgresql {
  /**
   * PostgreSQL instances: 1 is a single primary; 2+ grows the SAME
   * database into a streaming-replication pair with automatic failover —
   * a LIVE edit, no reinstall.
   */
  optional int32 replicas = 1 [
    (dev.planton.shared.options.default) = "1",
    (buf.validate.field).int32.gte = 1
  ];

  /**
   * Volume size per instance (e.g. "10Gi"). Falls back to
   * spec.storage.size, then the platform default.
   */
  string storage_size = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).cel = {
      id: "postgresql.storage_size_quantity"
      message: "storage_size must be a Kubernetes quantity like \"10Gi\""
      expression: "this.matches('^[0-9]+(\\\\.[0-9]+)?(Ei|Pi|Ti|Gi|Mi|Ki|E|P|T|G|M|K)?$')"
    }
  ];

  /**
   * StorageClass override for the database volumes.
   */
  string storage_class_name = 3;

  /**
   * Where the platform's own database is backed up, and how. Declaring it
   * turns on continuous WAL archiving to the store, a base backup on the
   * schedule (the first one the moment backups are declared — WAL alone
   * restores nothing), and a retention the store enforces; the operator
   * installs the Barman Cloud plugin, CloudNativePG's backup engine, if
   * the cluster does not have it yet (see prerequisites.postgres_backup_plugin).
   *
   * Absent means no backup: the database lives on one volume in this
   * cluster and nothing copies it anywhere. The `BACKUP` column of
   * `kubectl get plantonplatform` says which — `NotConfigured`,
   * `Deploying`, `Healthy`, `Failing` (in the plugin's own words), or
   * `Unavailable` — and `status.backup` carries the archive's server name,
   * the first recoverability point, and the last successful base backup.
   * A failing backup never takes a working platform out of Ready.
   *
   * The archive carries the bundled vault too: the secrets manager stores
   * its data in this same database, so every connection credential,
   * managed secret, and signing key rides the WAL stream with the records
   * — `status.backup.vault` says so, and names the Secret whose keys open
   * the restored vault. A backup therefore needs the vault's keys to
   * outlive the platform: `vault.auto_unseal` (a cloud key opens it) or
   * `vault.init_secret_name` (a Secret you own holds the keys); the spec
   * refuses a backup with neither.
   *
   * The module creates the credential Secret this store needs BEFORE the
   * platform resource, in the same apply, so the database is born
   * archiving whichever order the declaration's parts are read in.
   */
  KubernetesPlantonPlatformPostgresqlBackup backup = 4;

  /**
   * Restore this platform's database from another platform's archive
   * instead of creating it empty. Honored only when the database is first
   * created — a running platform keeps its database as it is and the
   * status names the procedure (delete the platform, declare it again
   * with recover_from). Nothing here ever destroys data to honor a
   * declaration.
   *
   * A restored platform archives its OWN backups under a new server name
   * (every platform files its archive under its name plus a unique
   * suffix), so it never writes over the source it restored from; declare
   * `backup` beside `recover_from` and the two can share one bucket and
   * one path.
   *
   * WHAT COMES BACK: every record the control plane keeps — organizations,
   * environments, connections, projects, pipeline history, members, and
   * the identity realm with its users, so existing passwords sign in —
   * AND the secrets manager's contents, because the vault stores in this
   * same database: every connection credential, every managed secret, the
   * license signing key, and the OIDC issuer's signing key, so keyless
   * connections keep verifying against the same key. The restored vault
   * opens itself under a cloud seal (`vault.auto_unseal`, declared the
   * same as the source's), or with the keys Secret the source named in
   * `vault.init_secret_name` — recreate that Secret in the new cluster
   * before declaring the restore. WHAT DOES NOT: the root token and
   * recovery keys of an init Secret that was lost with the old cluster
   * (the vault's break-glass), unless you kept a copy; the platform runs
   * without them.
   */
  KubernetesPlantonPlatformPostgresqlRecoverFrom recover_from = 5;
}

/**
 * Continuous backup of the platform's database through the Barman Cloud
 * plugin: WAL archiving plus scheduled base backups into one object store.
 */
message KubernetesPlantonPlatformPostgresqlBackup {
  /**
   * The object store the backups go to and how the database's pods
   * authenticate to it. WAL archiving into it starts as soon as the
   * database is healthy; the schedule adds the base backups a
   * point-in-time recovery replays WAL onto.
   */
  KubernetesPlantonPlatformObjectStore object_store = 1 [(buf.validate.field).required = true];

  /**
   * How long the store keeps base backups and the WAL that goes with
   * them, as `<n>d|w|m` (days, weeks, months). Enforced by the plugin
   * after each backup.
   */
  optional string retention_policy = 2 [
    (dev.planton.shared.options.default) = "30d",
    (buf.validate.field).cel = {
      id: "postgresql.backup.retention_format"
      message: "retention_policy must be a positive number of days, weeks, or months — e.g. '30d', '8w', or '6m'"
      expression: "this == '' || this.matches('^[1-9][0-9]*[dwm]$')"
    }
  ];

  /**
   * When base backups run: a cron expression WITH SECONDS — six fields,
   * not the five Kubernetes CronJobs use ("0 0 2 * * *" is daily at
   * 02:00 UTC, the default). The first base backup always runs the moment
   * backups are declared, whatever this says.
   */
  optional string schedule = 3 [
    (dev.planton.shared.options.default) = "0 0 2 * * *",
    (buf.validate.field).cel = {
      id: "postgresql.backup.schedule_cron_six_fields"
      message: "schedule is a SIX-field cron expression (seconds first) — e.g. '0 0 2 * * *' for daily at 02:00; the five-field Kubernetes form is missing the seconds field"
      expression: "this == '' || this.matches('^ *[^ ]+( +[^ ]+){5} *$')"
    }
  ];

  /**
   * Annotations for the ServiceAccount the database's own pods run as
   * (CloudNativePG names it after the database: `<platform>-postgres`).
   * This is where a keyless posture binds a cloud identity: EKS IRSA
   * (`eks.amazonaws.com/role-arn`), GKE Workload Identity
   * (`iam.gke.io/gcp-service-account`), AKS Workload Identity
   * (`azure.workload.identity/client-id`). Distinct from
   * runner.service_account_annotations — the runner deploys infrastructure
   * with its identity; the database's identity only writes backups. R2 has
   * no keyless posture and never needs this.
   */
  map<string, string> service_account_annotations = 4;
}

/**
 * The source archive a platform's database is restored from.
 */
message KubernetesPlantonPlatformPostgresqlRecoverFrom {
  /**
   * The store the source platform archived to. Recovery only READS from
   * it; this platform's own backups go to `backup`. The same bucket and
   * path as the source's `backup` are fine — server names keep the two
   * archives apart.
   */
  KubernetesPlantonPlatformObjectStore object_store = 1 [(buf.validate.field).required = true];

  /**
   * The name the source's archive is filed under: `status.backup.serverName`
   * on the source platform, or the folder name in the bucket's own listing
   * under the destination path when the source is gone. Every platform
   * archives under its own name plus a unique suffix, so this names one
   * archive exactly.
   */
  string server_name = 2 [(buf.validate.field).required = true];

  /**
   * Recover to a point in time, as an RFC 3339 timestamp
   * ("2026-09-13T20:30:00Z"). Empty recovers to the end of the archive —
   * every WAL segment the source shipped.
   */
  string target_time = 3 [(buf.validate.field).cel = {
    id: "postgresql.recover_from.target_time_rfc3339"
    message: "target_time is an RFC 3339 timestamp — e.g. '2026-09-13T20:30:00Z' or '2026-09-13T20:30:00+05:30'"
    expression: "this == '' || this.matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$')"
  }];
}

/**
 * A bucket and the way the database's pods authenticate to it. Exactly one
 * backend, and the destination path carries that backend's scheme — the
 * same vocabulary the catalog's KubernetesPostgres kind speaks, so a
 * platform's backup and a database's backup read alike.
 */
message KubernetesPlantonPlatformObjectStore {
  /**
   * Where in the store the archive lives — the backend's native URI form:
   * `s3://bucket/path` for S3, Cloudflare R2, and every S3-compatible
   * store, `gs://bucket/path` for GCS, and
   * `https://<account>.blob.core.windows.net/<container>/<path>` for
   * Azure Blob. Base backups and WAL are filed beneath it under this
   * platform's server name, so several platforms can share one path
   * without ever touching each other's archive.
   */
  string destination_path = 1 [(buf.validate.field).required = true];

  /**
   * Object-store backend. Exactly one arm; the arm's credential posture is
   * keyless (the database pods' own cloud identity, bound through
   * backup.service_account_annotations) or a declared credential —
   * declared credentials materialize as a Kubernetes Secret the operator
   * hands to the plugin, never plaintext in the rendered resource.
   */
  oneof backend {
    option (buf.validate.oneof).required = true;

    /**
     * AWS S3 — or ANY S3-compatible store (MinIO, Ceph RGW, DigitalOcean
     * Spaces, ...) via the endpoint_url override. Cloudflare R2 has its own
     * arm (`r2`) that composes the catalog's Cloudflare kinds.
     */
    KubernetesPlantonPlatformS3ObjectStore s3 = 2;

    /**
     * Google Cloud Storage.
     */
    KubernetesPlantonPlatformGcsObjectStore gcs = 3;

    /**
     * Azure Blob Storage.
     */
    KubernetesPlantonPlatformAzureBlobObjectStore azure_blob = 4;

    /**
     * Cloudflare R2, in R2's own vocabulary: the owning account, the
     * bucket's jurisdiction, and a Cloudflare credential — each a reference
     * onto the catalog's CloudflareR2Bucket and CloudflareAccountApiToken by
     * default. The operator performs the S3 translation R2 needs (the
     * jurisdiction's endpoint host, region `auto`); nothing S3-shaped is
     * typed here.
     */
    KubernetesPlantonPlatformR2ObjectStore r2 = 5;
  }

  option (buf.validate.message).cel = {
    id: "postgresql.object_store.s3_path_scheme"
    message: "the s3 backend stores at an s3:// destination path (also for S3-compatible stores like MinIO)"
    expression: "!has(this.s3) || this.destination_path.startsWith('s3://')"
  };
  option (buf.validate.message).cel = {
    id: "postgresql.object_store.gcs_path_scheme"
    message: "the gcs backend stores at a gs:// destination path"
    expression: "!has(this.gcs) || this.destination_path.startsWith('gs://')"
  };
  option (buf.validate.message).cel = {
    id: "postgresql.object_store.azure_path_scheme"
    message: "the azure_blob backend stores at an https:// destination path (https://<account>.blob.core.windows.net/<container>/<path>)"
    expression: "!has(this.azure_blob) || this.destination_path.startsWith('https://')"
  };
  option (buf.validate.message).cel = {
    id: "postgresql.object_store.r2_path_scheme"
    message: "the r2 backend stores at an s3:// destination path (s3://<bucket>/<path> — R2 is addressed through its S3 API; the bucket name is the CloudflareR2Bucket's bucket_name)"
    expression: "!has(this.r2) || this.destination_path.startsWith('s3://')"
  };
}

/**
 * S3 / S3-compatible object-store backend.
 */
message KubernetesPlantonPlatformS3ObjectStore {
  /**
   * AWS region of the bucket. Required for real S3; for S3-compatible
   * stores use the store's expected value (MinIO accepts any).
   */
  string region = 1;

  /**
   * S3-COMPATIBLE ARM: endpoint URL of the store (e.g.
   * http://minio.minio-system.svc:9000 for in-cluster MinIO). Empty = real
   * AWS S3. For Cloudflare R2 prefer the `r2` arm, which composes the
   * endpoint from the bucket's account and jurisdiction.
   */
  string endpoint_url = 2 [(buf.validate.field).cel = {
    id: "postgresql.object_store.s3.endpoint_format"
    message: "endpoint_url must be an http(s) URL (e.g. http://minio.minio-system.svc:9000)"
    expression: "this == '' || this.startsWith('http://') || this.startsWith('https://')"
  }];

  /**
   * PEM CA bundle for verifying a self-signed endpoint_url TLS certificate
   * (materialized as a Secret the plugin reads).
   */
  string endpoint_ca_pem = 3;

  /**
   * Keyless posture: the database pods' AWS identity (IRSA through
   * backup.service_account_annotations, EKS Pod Identity, or the node's
   * instance profile) authenticates to S3 — no stored keys. Mutually
   * exclusive with access_keys.
   */
  bool keyless = 4;

  /**
   * Static access keys, materialized as a Kubernetes Secret the plugin
   * reads. The declared-credential arm — for S3-compatible stores and
   * clusters without IRSA.
   */
  KubernetesPlantonPlatformS3AccessKeys access_keys = 5;

  option (buf.validate.message).cel = {
    id: "postgresql.object_store.s3.keyless_xor_keys"
    message: "keyless and access_keys are alternative credential postures — set exactly one"
    expression: "(this.keyless && !has(this.access_keys)) || (!this.keyless && has(this.access_keys))"
  };
  option (buf.validate.message).cel = {
    id: "postgresql.object_store.s3.compatible_needs_keys"
    message: "an S3-compatible endpoint (endpoint_url) authenticates with access_keys — the keyless posture only mints AWS credentials"
    expression: "this.endpoint_url == '' || !this.keyless"
  };
}

/**
 * Static S3 access keys.
 */
message KubernetesPlantonPlatformS3AccessKeys {
  /**
   * Access key ID — the public identifier of the key pair, not a secret;
   * only the paired secret access key is a credential. For MinIO this is
   * the access key / username.
   */
  string access_key_id = 1 [(buf.validate.field).required = true];

  /**
   * Secret access key (for MinIO: the secret key / password).
   */
  string secret_access_key = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.options.sensitive) = true
  ];
}

/**
 * Google Cloud Storage backend.
 */
message KubernetesPlantonPlatformGcsObjectStore {
  /**
   * Keyless posture: the database pods' GCP identity (GKE Workload
   * Identity through backup.service_account_annotations) authenticates to
   * GCS — no stored key. Mutually exclusive with service_account_key_json.
   *
   * THE IDENTITY NEEDS TWO ROLES ON THE BUCKET, not one: Barman Cloud
   * verifies the archive destination with a bucket-level read
   * (`storage.buckets.get`) before every WAL archive, and
   * `roles/storage.objectAdmin` does not carry it — an identity granted
   * objectAdmin alone fails every archive with "does not have
   * storage.buckets.get access" while the database reports healthy. Grant
   * `roles/storage.objectAdmin` AND `roles/storage.legacyBucketReader` (a
   * GcpGcsBucket's `iam_members`, one entry each).
   */
  bool keyless = 1;

  /**
   * GCP service-account key (the JSON key file's content), materialized as
   * a Kubernetes Secret the plugin reads. The declared-credential arm for
   * non-GKE clusters backing up to GCS.
   */
  string service_account_key_json = 2 [(dev.planton.shared.options.sensitive) = true];

  option (buf.validate.message).cel = {
    id: "postgresql.object_store.gcs.keyless_xor_key"
    message: "keyless and service_account_key_json are alternative credential postures — set exactly one"
    expression: "(this.keyless && this.service_account_key_json == '') || (!this.keyless && this.service_account_key_json != '')"
  };
}

/**
 * Azure Blob Storage backend. Two postures — a storage-account connection
 * string, or the database pods' Azure identity — the two the operator
 * honors.
 */
message KubernetesPlantonPlatformAzureBlobObjectStore {
  /**
   * Storage-account name. Always required: it identifies the storage
   * endpoint under either posture.
   */
  string storage_account = 1 [(buf.validate.field).required = true];

  /**
   * Keyless posture: the database pods' Azure identity (AKS Workload
   * Identity through backup.service_account_annotations, or a managed
   * identity) authenticates to Blob Storage — no stored secret. Mutually
   * exclusive with connection_string.
   */
  bool keyless = 2;

  /**
   * Storage-account connection string — the all-in-one declared
   * credential, materialized as a Kubernetes Secret the plugin reads.
   */
  string connection_string = 3 [(dev.planton.shared.options.sensitive) = true];

  option (buf.validate.message).cel = {
    id: "postgresql.object_store.azure.keyless_xor_connection_string"
    message: "keyless and connection_string are alternative credential postures — set exactly one"
    expression: "(this.keyless && this.connection_string == '') || (!this.keyless && this.connection_string != '')"
  };
}

/**
 * Cloudflare R2 backend, composed from the catalog's Cloudflare kinds.
 *
 * R2 speaks S3, so Barman Cloud reaches it through its S3 code path — but
 * nothing S3-shaped is declared here. The operator composes the endpoint
 * from the account and the bucket's jurisdiction
 * (`https://<account>.r2.cloudflarestorage.com`, or
 * `https://<account>.<jurisdiction>.r2.cloudflarestorage.com` for an eu,
 * fedramp, or us bucket — a jurisdictional bucket is served ONLY through its
 * own host; the default host fails rather than redirects) and pins the
 * region to `auto` (the only region R2 accepts). There is NO keyless posture
 * for R2 from any cluster: R2 has no equivalent of IRSA or Workload
 * Identity, so a credential is always declared — by reference to a
 * CloudflareAccountApiToken by default, and the module materializes it as
 * the Secret the operator hands to the plugin.
 *
 * The bucket itself is named in `destination_path` (`s3://<bucket>/<path>`),
 * exactly as the gcs and azure_blob arms name theirs. Emptying the bucket
 * is not the module's job — R2 refuses to delete a non-empty bucket, so a
 * CloudflareR2Bucket that has ever held an archive must be emptied over the
 * S3 API before it can be destroyed.
 */
message KubernetesPlantonPlatformR2ObjectStore {
  /**
   * The Cloudflare account that owns the bucket (32 hex characters). By
   * reference to the bucket resource's `account_id` output, so the arm
   * follows the bucket; a literal names an account outside the catalog.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef account_id = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = CloudflareR2Bucket,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.account_id",
    (buf.validate.field).cel = {
      id: "postgresql.object_store.r2.account_id_format"
      message: "account_id is the 32-hex-character Cloudflare account id"
      expression: "!has(this.value) || this.value.matches('^[0-9a-fA-F]{32}$')"
    }
  ];

  /**
   * The bucket's data-residency jurisdiction: `default` (or empty), `eu`,
   * `fedramp`, or `us`. It selects the S3 host the operator composes — a
   * bucket created in a jurisdiction is unreachable through any other
   * host — so it must match the bucket exactly; by reference to the bucket
   * resource's `jurisdiction` output it cannot drift.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef jurisdiction = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = CloudflareR2Bucket,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.jurisdiction",
    (buf.validate.field).cel = {
      id: "postgresql.object_store.r2.jurisdiction_valid"
      message: "jurisdiction must be one of \"default\", \"eu\", \"fedramp\", \"us\" (or empty for default)"
      expression: "!has(this.value) || this.value == '' || this.value in ['default', 'eu', 'fedramp', 'us']"
    }
  ];

  /**
   * The Cloudflare credential, as the S3 key pair R2's S3 API
   * authenticates. Materialized as a Kubernetes Secret the plugin reads;
   * never plaintext in the rendered resource.
   */
  KubernetesPlantonPlatformR2Credentials credentials = 3 [(buf.validate.field).required = true];
}

/**
 * The S3 key pair for Cloudflare R2. Cloudflare defines it from an account
 * API token: the access key id is the token's id and the secret access key
 * is the SHA-256 of the token's value — the two values a
 * CloudflareAccountApiToken exports as `r2_access_key_id` and
 * `r2_secret_access_key`, and the two the dashboard shows as "Access Key
 * ID" / "Secret Access Key" when the same token is created there.
 * Reference the catalog token (the default kind) or paste a
 * dashboard-minted pair as literals; both are the same shape.
 *
 * The token needs an R2 permission group: `Workers R2 Storage Bucket Item
 * Write` scoped to this bucket (least privilege — read, write, list
 * objects) or `Workers R2 Storage Write` on the account. A token without
 * one authenticates and then fails every archive with AccessDenied.
 */
message KubernetesPlantonPlatformR2Credentials {
  /**
   * The S3 access key id: the API token's id. By reference to the token
   * resource's `r2_access_key_id` output.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef access_key_id = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = CloudflareAccountApiToken,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.r2_access_key_id"
  ];

  /**
   * The S3 secret access key: the SHA-256 of the API token's value. By
   * reference to the token resource's `r2_secret_access_key` output.
   * Rotates with the token: a rotated token is a new key pair, and the
   * Secret this arm materializes follows the reference on the next apply.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef secret_access_key = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.options.sensitive) = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = CloudflareAccountApiToken,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.r2_secret_access_key"
  ];
}

/**
 * The platform's cache.
 */
message KubernetesPlantonPlatformRedis {
  /**
   * Volume size (e.g. "1Gi"). Falls back to spec.storage.size, then the
   * platform default.
   */
  string storage_size = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).cel = {
      id: "redis.storage_size_quantity"
      message: "storage_size must be a Kubernetes quantity like \"1Gi\""
      expression: "this.matches('^[0-9]+(\\\\.[0-9]+)?(Ei|Pi|Ti|Gi|Mi|Ki|E|P|T|G|M|K)?$')"
    }
  ];

  /**
   * StorageClass override for the cache volume.
   */
  string storage_class_name = 2;
}

/**
 * Exposure through the cluster's existing front door. One hostname serves
 * the web console, the API the browser calls, and sign-in.
 *
 * Which front door serves the platform is the one fork: ingress_class_name
 * (or the cluster's default IngressClass) renders an Ingress object;
 * gateway_ref renders an HTTPRoute attached to the named Gateway API
 * Gateway. Both carry the same routes.
 */
message KubernetesPlantonPlatformIngress {
  option (buf.validate.message).cel = {
    id: "spec.ingress.tls_requires_hostname"
    message: "tls requires hostname: a certificate cannot be brought or issued for an auto-derived hostname"
    expression: "!has(this.tls) || this.hostname != ''"
  };
  option (buf.validate.message).cel = {
    id: "spec.ingress.gateway_ref_xor_ingress_class"
    message: "gateway_ref and ingress_class_name name two different front doors; set one — gateway_ref attaches to a Gateway API Gateway, ingress_class_name renders an Ingress"
    expression: "!has(this.gateway_ref) || this.ingress_class_name == ''"
  };
  option (buf.validate.message).cel = {
    id: "spec.ingress.gateway_ref_owns_certificate"
    message: "with gateway_ref the Gateway's HTTPS listener owns the certificate: attach to a listener that already serves the hostname, or set tls.issuer to have a certificate issued for the listener to reference"
    expression: "!has(this.gateway_ref) || !has(this.tls) || this.tls.secret_name == ''"
  };
  option (buf.validate.message).cel = {
    id: "spec.ingress.public_requires_enabled"
    message: "reachability: public declares an address the internet reaches, but with enabled: false the platform is reached only through kubectl port-forward from the machine running it; set enabled: true, or leave reachability at auto"
    expression: "!has(this.reachability) || this.reachability != 'public' || this.enabled"
  };

  /**
   * Expose the platform through the cluster's front door. With no
   * hostname, the operator derives a working URL from the front door's
   * published address (magic DNS) — the Ingress controller's, or the
   * Gateway's.
   */
  bool enabled = 1;

  /**
   * The platform's hostname (e.g. "planton.example.com"). One hostname
   * serves console AND API. The identity server bakes this URL into its
   * realm at first boot — set it before the first sign-in.
   */
  string hostname = 2;

  /**
   * IngressClass to use. Unset = the cluster's default. Names one front
   * door; never combined with gateway_ref.
   */
  string ingress_class_name = 3;

  /**
   * Extra annotations on the Ingress (controller-specific tuning —
   * ALB schemes, proxy budgets). Ignored with gateway_ref: the Gateway
   * API expresses behavior in typed fields, not annotations.
   */
  map<string, string> annotations = 4;

  /**
   * HTTPS. Requires hostname. Exactly one of secret_name (bring your own
   * certificate) or issuer (cert-manager issues one) — except with
   * gateway_ref, where the route attaches to whichever listener matches
   * the hostname and HTTPS is inferred from that listener; only issuer
   * applies there.
   */
  KubernetesPlantonPlatformIngressTls tls = 5;

  /**
   * Serve Planton through a Gateway API Gateway the cluster already runs
   * (Istio, Envoy Gateway, Cilium, a cloud Gateway) instead of an Ingress
   * controller: the operator attaches an HTTPRoute for the hostname to
   * that Gateway. The Gateway is the cluster team's object and is never
   * modified — its listeners decide which hostnames are admitted, which
   * namespaces may attach routes, and how HTTPS is terminated; the
   * operator reads those facts and explains any mismatch in the
   * platform's status. Requires a planton-operator chart that knows this
   * field (0.9.0 or newer); an older definition refuses the declaration.
   */
  KubernetesPlantonPlatformGatewayRef gateway_ref = 6;

  /**
   * Whether the public internet can reach this front door — the one fact
   * about the door the operator cannot observe from inside the cluster.
   * The capabilities that need an inbound path from the internet (keyless
   * cloud connections, where the cloud fetches the issuer's discovery
   * document; GitHub webhook delivery) are offered only where the door is
   * public. `auto` (default) resolves from the door's shape: a hostname
   * served over HTTPS is public, anything else private. Declare `private`
   * for an HTTPS door only your network reaches (split DNS, a corporate
   * CA, an internal load balancer); declare `public` to affirm it. Only
   * `public` is refused when enabled is false — a port-forward door is
   * never reached from the internet — while `private` there is simply
   * true. Requires a planton-operator chart that knows this field (0.11.0
   * or newer); an older definition refuses the declaration.
   */
  optional string reachability = 7 [
    (dev.planton.shared.options.default) = "auto",
    (buf.validate.field).string = {
      in: [
        "",
        "auto",
        "public",
        "private"
      ]
    }
  ];
}

/**
 * The Gateway API Gateway the platform's HTTPRoute attaches to. `name` and
 * `namespace` are foreign keys to KubernetesGateway: in an infra chart that
 * also declares the Gateway, wire both with `valueFrom` against that resource
 * and the platform deploys after (and follows renames of) its Gateway, with
 * the dependency drawn in the resource graph. For a Gateway created outside
 * Planton (a cluster team's Istio or Envoy Gateway), pass the literal names
 * with `value:`. The rendered PlantonPlatform resource carries the resolved
 * plain strings either way.
 */
message KubernetesPlantonPlatformGatewayRef {
  /**
   * Name of the Gateway. Defaults to a KubernetesGateway foreign key
   * (`status.outputs.gateway_name`): `valueFrom` for a Planton-managed
   * Gateway, `value:` for one created outside Planton.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef name = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesGateway,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.gateway_name",
    (dev.planton.shared.options.diagram_label) = "attached to"
  ];

  /**
   * Namespace of the Gateway. Defaults to the platform's own namespace when
   * omitted. A Gateway in another namespace must allow routes from this one
   * (spec.listeners[].allowedRoutes.namespaces). Defaults to the same
   * KubernetesGateway foreign key as `name` (`status.outputs.namespace`), so
   * one resource wires both; a Gateway created outside Planton takes the
   * literal namespace with `value:`.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef namespace = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesGateway,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.namespace"
  ];

  /**
   * Pins the route to one named listener of the Gateway. When empty, the
   * route attaches to every listener whose hostname admits the
   * platform's hostname.
   */
  string section_name = 3;
}

/**
 * TLS for the hostname — bring a certificate or have cert-manager issue
 * one. With gateway_ref, only issuer applies: the operator asks
 * cert-manager for the certificate in the platform's namespace and grants
 * the Gateway's namespace permission to reference the resulting Secret (a
 * ReferenceGrant); the Gateway's HTTPS listener names that Secret in its
 * certificateRefs. A certificate the listener already serves needs no tls
 * block at all.
 */
message KubernetesPlantonPlatformIngressTls {
  option (buf.validate.message).cel = {
    id: "spec.ingress.tls.secret_xor_issuer"
    message: "exactly one of secret_name or issuer must be set — bring a certificate or have cert-manager issue one, never both"
    expression: "(this.secret_name != '') != has(this.issuer)"
  };

  /**
   * An existing kubernetes.io/tls Secret in the platform's namespace.
   */
  string secret_name = 1;

  /**
   * A cert-manager issuer to obtain the certificate from. Requires
   * cert-manager on the cluster.
   */
  KubernetesPlantonPlatformCertManagerIssuer issuer = 2;
}

/**
 * A cert-manager issuer reference.
 */
message KubernetesPlantonPlatformCertManagerIssuer {
  /**
   * Issuer name.
   */
  string name = 1 [(buf.validate.field).string.min_len = 1];

  /**
   * Issuer kind.
   */
  optional string kind = 2 [
    (dev.planton.shared.options.default) = "Issuer",
    (buf.validate.field).string = {
      in: [
        "",
        "Issuer",
        "ClusterIssuer"
      ]
    }
  ];
}

/**
 * The built-in front-door gateway.
 */
message KubernetesPlantonPlatformGateway {
  /**
   * The local port the port-forward door advertises
   * (`kubectl port-forward ... {local_port}:80`). Baked into the identity
   * server's issuer and the console's callbacks at first boot — pick it
   * before the first visit; two port-forward platforms on one machine
   * need distinct ports.
   */
  optional int32 local_port = 1 [
    (dev.planton.shared.options.default) = "8080",
    (buf.validate.field).int32 = {
      gte: 1
      lte: 65535
    }
  ];
}

/**
 * The identity server.
 */
message KubernetesPlantonPlatformIdentity {
  /**
   * The Keycloak realm name.
   */
  optional string realm = 1 [(dev.planton.shared.options.default) = "planton"];

  /**
   * Pre-seed a known admin account instead of the first-visitor setup
   * page: the operator creates this user and writes a one-time password
   * into the platform's admin-user Secret. Unset (the default) leaves
   * the setup-code flow — the first console visitor becomes the admin.
   */
  string admin_email = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).cel = {
      id: "identity.admin_email_format"
      message: "admin_email must be an email address like \"admin@example.com\""
      expression: "this.matches('^[^@ ]+@[^@ ]+\\\\.[^@ ]+$')"
    }
  ];
}

/**
 * First-boot seeding.
 */
message KubernetesPlantonPlatformBootstrap {
  /**
   * The initial organization.
   */
  KubernetesPlantonPlatformBootstrapOrg organization = 1;

  /**
   * The initial environment.
   */
  KubernetesPlantonPlatformBootstrapEnv environment = 2;

  /**
   * Additional admin emails granted org ownership and platform-operator
   * rights at boot (the identity.admin_email, when set, is always
   * included).
   */
  repeated string admins = 3;

  /**
   * The IaC provisioner the in-cluster runner deploys with.
   */
  optional string iac_provisioner = 4 [
    (dev.planton.shared.options.default) = "tofu",
    (buf.validate.field).string = {
      in: [
        "",
        "tofu",
        "terraform"
      ]
    }
  ];

  /**
   * Where the platform's managed secrets live: the bundled secrets
   * manager ("platform", the default) or a cloud backend.
   */
  KubernetesPlantonPlatformSecretBackend secret_backend = 5;
}

/**
 * The initial organization.
 */
message KubernetesPlantonPlatformBootstrapOrg {
  /**
   * Organization slug.
   */
  optional string slug = 1 [(dev.planton.shared.options.default) = "default"];

  /**
   * Display name. Defaults to the slug.
   */
  string name = 2;
}

/**
 * The initial environment.
 */
message KubernetesPlantonPlatformBootstrapEnv {
  /**
   * Environment slug.
   */
  optional string slug = 1 [(dev.planton.shared.options.default) = "default"];

  /**
   * Display name. Defaults to the slug.
   */
  string name = 2;
}

/**
 * The platform's managed-secret backend.
 */
message KubernetesPlantonPlatformSecretBackend {
  option (buf.validate.message).cel = {
    id: "spec.bootstrap.secret_backend.aws_requires_config"
    message: "awsSecretsManager needs its configuration block: aws_secrets_manager.region and aws_secrets_manager.kms_key_arn are required"
    expression: "this.type != 'awsSecretsManager' || (has(this.aws_secrets_manager) && this.aws_secrets_manager.region != '' && this.aws_secrets_manager.kms_key_arn != '')"
  };

  /**
   * Backend type: "platform" (the bundled OpenBAO) or
   * "awsSecretsManager".
   */
  string type = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "platform",
        "awsSecretsManager"
      ]
    }
  ];

  /**
   * AWS Secrets Manager configuration (required when type is
   * awsSecretsManager). The control plane reaches AWS through its own
   * workload identity — see control_plane.service_account_annotations.
   */
  KubernetesPlantonPlatformAwsSecretsManager aws_secrets_manager = 2;
}

/**
 * AWS Secrets Manager backend configuration.
 */
message KubernetesPlantonPlatformAwsSecretsManager {
  /**
   * AWS region (e.g. "us-east-1").
   */
  string region = 1 [(buf.validate.field).string.min_len = 1];

  /**
   * KMS key ARN encrypting the secrets.
   */
  string kms_key_arn = 2 [(buf.validate.field).string.min_len = 1];
}

/**
 * The in-cluster deployment runner.
 */
message KubernetesPlantonPlatformRunner {
  /**
   * Deploy the runner. Platform default: true. Explicit false leaves a
   * platform that can model infrastructure but not deploy it.
   */
  optional bool enabled = 1 [(dev.planton.shared.options.default) = "true"];

  /**
   * Runner state volume size (e.g. "2Gi"). Falls back to
   * spec.storage.size, then the platform default.
   */
  string storage_size = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).cel = {
      id: "runner.storage_size_quantity"
      message: "storage_size must be a Kubernetes quantity like \"2Gi\""
      expression: "this.matches('^[0-9]+(\\\\.[0-9]+)?(Ei|Pi|Ti|Gi|Mi|Ki|E|P|T|G|M|K)?$')"
    }
  ];

  /**
   * StorageClass override for the runner state volume.
   */
  string storage_class_name = 3;

  /**
   * Workload-identity annotations on the runner's ServiceAccount — the
   * keyless way the runner reaches your cloud (EKS:
   * "eks.amazonaws.com/role-arn"; GKE: "iam.gke.io/gcp-service-account";
   * AKS: "azure.workload.identity/client-id").
   */
  map<string, string> service_account_annotations = 4;

  /**
   * Name of a customer-owned Secret (in the platform's namespace) whose
   * keys are injected into the runner as environment variables — the
   * static-credentials way the runner reaches your cloud. The platform
   * stores nothing: rotate by updating YOUR Secret.
   */
  string cloud_credentials_secret_name = 5;

  /**
   * Runner image override (registry mirrors, custom builds). Empty = the
   * image under spec.image_registry at spec.version.
   */
  KubernetesPlantonPlatformImage image = 6;
}

/**
 * Container-image build pipelines.
 */
message KubernetesPlantonPlatformBuild {
  /**
   * Enable Tekton-backed build pipelines. Platform default: true
   * (follows the runner off when the runner is disabled). One
   * build-enabled platform per cluster — Tekton's build-events sink is
   * cluster-wide.
   */
  optional bool enabled = 1 [(dev.planton.shared.options.default) = "true"];
}

/**
 * The bundled secrets manager (OpenBAO): the store behind every pasted
 * connection credential, every managed secret on the platform backend, the
 * license signing key, and the OIDC issuer's signing key. It keeps its data
 * in the platform's own PostgreSQL, so `database.postgresql.backup` archives
 * it with the records and `database.postgresql.recover_from` brings it back
 * to the same instant. Two things decide whether the restored vault OPENS:
 * the seal (`auto_unseal` — a cloud key the vault reaches at start — or the
 * built-in key shares) and where its keys live (`init_secret_name`).
 */
message KubernetesPlantonPlatformVault {
  // Retired fields. The vault has no volume of its own — its data lives in
  // the platform's database, which the backup already carries — so a size
  // and a class have nothing to size; and it has one initialization path —
  // the operator initializes it and writes the keys where init_secret_name
  // says — so a mode had nothing to choose. Their numbers and names must
  // never be reused with a different meaning.
  reserved 2, 3, 4;
  reserved "init_mode", "storage_size", "storage_class_name";

  /**
   * Deploy the bundled secrets manager (OpenBAO). Platform default:
   * true. Explicit false is the deliberate opt-out — pair it with a
   * cloud backend in bootstrap.secret_backend or connection secrets have
   * nowhere to live.
   */
  optional bool enabled = 1 [(dev.planton.shared.options.default) = "true"];

  /**
   * Auto-unseal: delegate master-key protection to a key in your cloud
   * (or a central OpenBao/Vault's transit engine) so the vault unseals
   * itself on every start — including the start after a restore, on a
   * cluster that has never seen it. Unset, the vault uses the built-in
   * key shares and the operator unseals it with the shares it wrote to
   * the init Secret; a restore then needs that Secret present (see
   * init_secret_name). Exactly one seal backend may be declared, and its
   * key and grants must exist BEFORE the platform: the seal is checked at
   * server start, not at init, so a missing key or role crash-loops the
   * vault before anything else can happen.
   *
   * VERSION HORIZON (verified at OpenBao v2.6.1): the cloud KMS seal
   * mechanisms (awskms, gcpckms, azurekeyvault) are built in but
   * DEPRECATED — upstream moves them to external KMS plugins in v2.7.0.
   * The operator renders the seal stanza for the pinned 2.6.x line;
   * expect the rendering to gain a plugin declaration when its chart pin
   * crosses 2.7.
   */
  KubernetesPlantonPlatformVaultAutoUnseal auto_unseal = 5;

  /**
   * Name of a Secret YOU own, in the platform's namespace, where the
   * operator writes the vault's keys at initialization: the unseal keys
   * (recovery keys under auto_unseal) and the root token. The operator
   * creates it WITHOUT an owner reference and never deletes it, so deleting
   * the PlantonPlatform leaves it standing -- but a namespace this resource
   * owns (create_namespace: true) is deleted with the resource and takes
   * every Secret in it, so a destroy through Planton does not. On a restore
   * the operator reads the shares from it to unseal a built-in-seal vault,
   * and under any seal it is the vault's break-glass (the root token; the
   * recovery quorum). Keep a copy of it outside the cluster, or place the
   * platform in a namespace you own — it is the one object a lost cluster
   * takes with it that no archive brings back. Unset, the operator keeps the
   * keys in a Secret it owns (`<platform>-openbao-init`), deleted with the
   * platform.
   */
  string init_secret_name = 6;

  /**
   * Annotations for the ServiceAccount the vault's pods run as (the
   * operator names it `<platform>-openbao`). This is where a keyless seal
   * identity binds: EKS IRSA (`eks.amazonaws.com/role-arn`) for an AWS KMS
   * seal, AKS Workload Identity (`azure.workload.identity/client-id`) for
   * a Key Vault seal, GKE Workload Identity
   * (`iam.gke.io/gcp-service-account`) for a Cloud KMS seal — the GCP
   * arm's `workload_identity_service_account` writes that last annotation
   * for you by reference; an explicit entry here wins on conflict.
   * Distinct from the runner's, the control plane's, and the database
   * backup's identities: this one only reaches the seal key.
   */
  map<string, string> service_account_annotations = 7;

  option (buf.validate.message).cel = {
    id: "vault.disabled_takes_nothing"
    message: "vault.enabled: false opts out of the bundled secrets manager — remove auto_unseal, init_secret_name, and service_account_annotations, or re-enable the vault"
    expression: "!has(this.enabled) || this.enabled || (!has(this.auto_unseal) && this.init_secret_name == '' && size(this.service_account_annotations) == 0)"
  };
}

/**
 * Auto-unseal seal backends. Exactly one may be set. Credentials
 * follow the keyless-first doctrine: on EKS/GKE/AKS prefer the
 * ambient workload identity (annotate the ServiceAccount via
 * vault.service_account_annotations) and leave the credential fields
 * empty.
 *
 * THE SEAL IS CHECKED AT SERVER START, NOT AT INIT: every seal backend
 * reaches for its key while the server configures itself (the KMS seals
 * describe the key, the transit seal test-encrypts through it), and a key
 * that is missing, unreachable, or not readable by the server's identity
 * makes the server exit with "Error configuring seal" — the pod
 * crash-loops until it is fixed. Create the key (or the transit engine
 * and key) and grant the identity BEFORE this resource, in the same
 * dependency-ordered set; the pods never reach Running otherwise.
 */
message KubernetesPlantonPlatformVaultAutoUnseal {
  oneof seal {
    option (buf.validate.oneof).required = true;

    /** AWS KMS. Natural on EKS (IRSA for keyless auth). */
    KubernetesPlantonPlatformVaultAwsKmsSeal aws_kms = 1;

    /** GCP Cloud KMS. Natural on GKE (Workload Identity). */
    KubernetesPlantonPlatformVaultGcpKmsSeal gcp_kms = 2;

    /** Azure Key Vault. Natural on AKS (Workload Identity / MSI). */
    KubernetesPlantonPlatformVaultAzureKeyVaultSeal azure_key_vault = 3;

    /** Transit engine of another OpenBao/Vault instance. */
    KubernetesPlantonPlatformVaultTransitSeal transit = 4;
  }
}

/** AWS KMS auto-unseal. */
message KubernetesPlantonPlatformVaultAwsKmsSeal {
  /**
   * AWS region of the KMS key (e.g. "us-west-2").
   */
  string region = 1 [(buf.validate.field).string.min_len = 1];

  /**
   * KMS key ID or full ARN of a SYMMETRIC encrypt/decrypt key.
   */
  string kms_key_id = 2 [(buf.validate.field).string.min_len = 1];

  /**
   * Static credentials — only when keyless (IRSA / instance profile)
   * is unavailable. The module materializes them into a Secret
   * (`<platform>-openbao-seal-creds`) delivered as environment variables;
   * nothing credential-bearing lands in the config ConfigMap.
   */
  string access_key_id = 3;

  /**
   * The secret access key paired with access_key_id.
   */
  string secret_access_key = 4 [(dev.planton.shared.options.sensitive) = true];
}

/** GCP Cloud KMS auto-unseal. */
message KubernetesPlantonPlatformVaultGcpKmsSeal {
  /**
   * GCP project containing the KMS key ring.
   *
   * containment_exempt: names where the unseal key lives — the server
   * runs in the cluster, not the project.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef project = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id",
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true
  ];

  /**
   * KMS key ring region (e.g. "global", "us-central1").
   */
  string region = 2 [(buf.validate.field).string.min_len = 1];

  /**
   * Key ring name.
   *
   * containment_exempt: an unseal-key source the server calls out to —
   * access, never placement.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef key_ring = 3 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpKmsKeyRing,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_ring_name",
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.options.diagram_label) = "unseal key ring"
  ];

  /**
   * Crypto key (symmetric encrypt/decrypt) used to wrap the master
   * key. The identity running OpenBao needs TWO roles on it:
   * roles/cloudkms.cryptoKeyEncrypterDecrypter to wrap on init and
   * unwrap on every unseal, AND roles/cloudkms.viewer — the server reads
   * the key's metadata when it configures the seal at start (a
   * key-existence check), and the encrypter-decrypter role does not
   * carry cloudkms.cryptoKeys.get. With only the first role the pod
   * crash-loops with "Error configuring seal \"gcpckms\": ... Permission
   * 'cloudkms.cryptoKeys.get' denied" and init never opens. Two
   * GcpKmsKeyIamMember resources, one per role, scoped to the key.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef crypto_key = 4 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpKmsKey,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_name",
    (dev.planton.shared.options.diagram_label) = "unseal key"
  ];

  /**
   * GKE Workload Identity: the GCP service account email to annotate
   * the vault's ServiceAccount with (iam.gke.io/gcp-service-account) —
   * by reference to the GcpServiceAccount the seal grants were written
   * for, so the annotation follows the identity. Leave empty to rely on
   * node/ambient credentials. The cluster-side half is a
   * GcpGkeWorkloadIdentityBinding for `<platform>-openbao` in the
   * platform's namespace.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef workload_identity_service_account = 5 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpServiceAccount,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.email"
  ];
}

/** Azure Key Vault auto-unseal. */
message KubernetesPlantonPlatformVaultAzureKeyVaultSeal {
  /**
   * Key Vault name (the vault, not the key).
   */
  string vault_name = 1 [(buf.validate.field).string.min_len = 1];

  /**
   * Name of the key inside the vault.
   */
  string key_name = 2 [(buf.validate.field).string.min_len = 1];

  /**
   * Entra (Azure AD) tenant ID.
   */
  string tenant_id = 3 [(buf.validate.field).string.min_len = 1];

  /**
   * Service-principal client ID — only when keyless (AKS Workload
   * Identity / Managed Identity) is unavailable.
   */
  string client_id = 4;

  /**
   * Service-principal client secret paired with client_id. Delivered
   * as environment variables from a module-owned Secret; never lands
   * in the config ConfigMap.
   */
  string client_secret = 5 [(dev.planton.shared.options.sensitive) = true];
}

/** Transit auto-unseal via a central OpenBao/Vault. */
message KubernetesPlantonPlatformVaultTransitSeal {
  /**
   * Address of the central instance (e.g. "https://bao.example.com:8200").
   * The satellite depends on the central instance being reachable
   * and unsealed at every startup.
   */
  string address = 1 [(buf.validate.field).string.min_len = 1];

  /**
   * Transit key name used to wrap the master key. The key need not exist
   * beforehand: the transit engine creates a key on its first encrypt
   * (the server's own startup test-encrypt does it) — the ENGINE must
   * exist, the key may be born there.
   */
  string key_name = 2 [(buf.validate.field).string.min_len = 1];

  /**
   * Transit engine mount path. The engine must be enabled on the central
   * instance before this satellite starts (`bao secrets enable
   * -path=transit transit` there); a satellite whose seal finds no engine
   * exits at startup with "Error configuring seal" and crash-loops until
   * the engine exists.
   */
  optional string mount_path = 3 [(dev.planton.shared.options.default) = "transit/"];

  /**
   * Token authorized for encrypt/decrypt on the transit key.
   * Delivered as environment variables from a module-owned Secret;
   * never lands in the config ConfigMap.
   */
  string token = 4 [(dev.planton.shared.options.sensitive) = true];
}

/**
 * Opt-in platform components (all off by default).
 */
message KubernetesPlantonPlatformComponents {
  /**
   * The graph explorer (Neo4j).
   */
  KubernetesPlantonPlatformGraph graph = 3;
}

/**
 * The graph explorer (Neo4j).
 */
message KubernetesPlantonPlatformGraph {
  /**
   * Enable the graph explorer.
   */
  bool enabled = 1;

  /**
   * Volume size (e.g. "10Gi"). Falls back to spec.storage.size, then the
   * platform default.
   */
  string storage_size = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).cel = {
      id: "graph.storage_size_quantity"
      message: "storage_size must be a Kubernetes quantity like \"10Gi\""
      expression: "this.matches('^[0-9]+(\\\\.[0-9]+)?(Ei|Pi|Ti|Gi|Mi|Ki|E|P|T|G|M|K)?$')"
    }
  ];

  /**
   * StorageClass override for the graph volume.
   */
  string storage_class_name = 3;
}

/**
 * Cluster-shared sub-operator handling.
 */
message KubernetesPlantonPlatformPrerequisites {
  /**
   * CloudNativePG: "auto" installs it only when absent; "skip" declares
   * it externally managed (a helm/GitOps CloudNativePG is respected
   * automatically either way).
   */
  optional string postgres_operator = 1 [
    (dev.planton.shared.options.default) = "auto",
    (buf.validate.field).string = {
      in: [
        "",
        "auto",
        "skip"
      ]
    }
  ];

  /**
   * Tekton Pipelines (build pipelines). The build-events sink is wired
   * even on "skip".
   */
  optional string tekton_pipelines = 3 [
    (dev.planton.shared.options.default) = "auto",
    (buf.validate.field).string = {
      in: [
        "",
        "auto",
        "skip"
      ]
    }
  ];

  /**
   * The Barman Cloud plugin, CloudNativePG's backup engine, which serves
   * every PostgreSQL on the cluster — the platform's own database and any
   * database deployed through Planton. "auto" installs it whenever the
   * operator installed CloudNativePG itself and cert-manager is on the
   * cluster (the plugin needs it for the TLS between operator and plugin),
   * or whenever database.postgresql.backup is declared; a plugin installed
   * by any other means is detected and respected. "skip" declares it
   * externally managed (or unwanted) and installs nothing.
   */
  optional string postgres_backup_plugin = 4 [
    (dev.planton.shared.options.default) = "auto",
    (buf.validate.field).string = {
      in: [
        "",
        "auto",
        "skip"
      ]
    }
  ];
}

/**
 * The control-plane deployment.
 */
message KubernetesPlantonPlatformControlPlane {
  /**
   * Image override (air-gapped mirrors of the SAME version).
   */
  KubernetesPlantonPlatformImage image = 1;

  /**
   * Control-plane replicas.
   */
  optional int32 replicas = 2 [
    (dev.planton.shared.options.default) = "1",
    (buf.validate.field).int32.gte = 1
  ];

  /**
   * Name of a Secret (in the platform's namespace) whose keys are all
   * injected into the control plane as environment variables — the
   * escape hatch for configuration the spec does not model.
   */
  string external_config_secret_name = 3;

  /**
   * Workload-identity annotations on the control plane's ServiceAccount
   * — the platform's OWN cloud identity (cloud secret backends, KMS).
   * Distinct from runner.service_account_annotations, which is the
   * DEPLOY-TIME identity.
   */
  map<string, string> service_account_annotations = 4;

  /**
   * Override of the release the platform downloads official IaC module
   * artifacts from (vX.Y.Z; both engines ride one tag). Leave it unset:
   * the platform resolves modules at its own catalog release — the same
   * pin its schemas and chart bundle come from — so a kind it accepts
   * always has its module published. Set it only to route around a
   * retracted artifact set; it selects among published releases and
   * controls nothing else (not the platform version, not the charts).
   */
  string iac_modules_version = 5 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^v\\d+\\.\\d+\\.\\d+$"
  ];
}

/**
 * The console deployment.
 */
message KubernetesPlantonPlatformConsole {
  /**
   * Image override (air-gapped mirrors of the SAME version).
   */
  KubernetesPlantonPlatformImage image = 1;

  /**
   * Console replicas.
   */
  optional int32 replicas = 2 [
    (dev.planton.shared.options.default) = "1",
    (buf.validate.field).int32.gte = 1
  ];

  /**
   * Name of a Secret (in the platform's namespace) whose keys are all
   * injected into the console as environment variables.
   */
  string external_config_secret_name = 3;
}

/**
 * A platform image override (repository and/or tag).
 */
message KubernetesPlantonPlatformImage {
  /**
   * Full image repository (e.g.
   * "my-mirror.example.com/planton/control-plane").
   */
