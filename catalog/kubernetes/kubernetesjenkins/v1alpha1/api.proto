syntax = "proto3";

package dev.planton.kubernetes.kubernetesjenkins.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesjenkins/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesjenkins/v1alpha1/spec.proto";
import "shared/metadata.proto";

//jenkins-kubernetes
message KubernetesJenkins {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesJenkins'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesJenkinsSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesJenkinsStatus status = 5;
}

//jenkins-kubernetes status.
message KubernetesJenkinsStatus {
  //outputs
  KubernetesJenkinsOutputs outputs = 1;
}
