syntax = "proto3";

package dev.planton.kubernetes.kubernetesneo4j.v1alpha1;

import "catalog/kubernetes/kubernetes.proto";

//kubernetes-neo4j stack outputs
message KubernetesNeo4jStackOutputs {
  //namespace the server runs in.
  string namespace = 1;

  //Helm release name (= metadata.name).
  string release_name = 2;

  //name of the main Neo4j Service (bolt/http/https ports).
  string service_name = 3;

  //in-cluster bolt endpoint drivers connect to,
  //e.g. neo4j://main.graph.svc.cluster.local:7687
  string bolt_endpoint = 4;

  //in-cluster HTTP API endpoint,
  //e.g. http://main.graph.svc.cluster.local:7474
  string http_endpoint = 5;

  //name of the Secret holding the admin credentials in the chart's
  //contract (key NEO4J_AUTH, value "neo4j/<password>"): the
  //module-materialized `<name>-auth` — whether the password was
  //declared or generated by the module — or the referenced existing
  //Secret. Always set.
  string auth_secret_name = 6;

  //command to port-forward bolt to a developer laptop, e.g.
  //kubectl port-forward svc/main -n graph 7687:7687
  string port_forward_command = 7;

  //the Secret key holding the `neo4j` admin user's BARE password
  //(the module-materialized `<name>-auth` Secret's `password` key), for
  //workloads that take a password rather than the chart's
  //"neo4j/<password>" pair. Unset when auth.existing_secret is
  //declared: that Secret's layout is the owner's, and the module never
  //assumes it carries a bare-password key.
  dev.planton.kubernetes.KubernetesSecretKey password_secret = 8;
}
