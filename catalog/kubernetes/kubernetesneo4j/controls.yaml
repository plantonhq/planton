# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: kubernetesneo4j
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The graph data rests on the PersistentVolume the target cluster's storage class provisions; encryption at rest is a property of that storage, owned by the cluster and its storage classes, not by this component.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Customer-managed keys for the underlying volume are configured on the cluster's storage class or the cloud disk encryption set (see enc-at-rest); this spec has no seam for them.
    - control_id: enc-in-transit
      status: configurable
      field_path: ssl
      evidence:
        type: spec_default
        reference: Empty serves plaintext in-cluster; ssl.bolt and ssl.https each take an existing certificate Secret (the cert-manager seam -- reference a KubernetesCertificate) to serve the bolt (7687) and https (7473) listeners over TLS.
      notes: Alternatively, TLS composes at the exposure layer (KubernetesIngress, Gateway API kinds) in front of the ClusterIP service.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The chart's own default exposure Service is a LoadBalancer -- this component deliberately overrides it to ClusterIP, so the database is reachable solely inside the cluster network. LoadBalancer or NodePort exposure is an explicit opt-in through service.type.
      notes: The 02-production preset restates ClusterIP for the record and documents the LoadBalancer recipe as the deliberate alternative.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The spec has no seam restricting which network sources may connect; access control is the admin credential (see rbac) and Kubernetes NetworkPolicies composed as separate resources.
    - control_id: edge-protection
      status: not_applicable
      notes: A database serves no HTTP edge traffic of its own -- the browser console and bolt endpoints are exposed only through composed exposure kinds, where request filtering lives.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: module_default
        reference: Authentication is always on -- the admin credential lands in the <name>-auth Secret (the chart's NEO4J_AUTH contract plus a bare password key, never in rendered values), generated by the module when auth is left empty and carrying the declared value otherwise; there is no unauthenticated posture and no credential the chart mints unseen.
      notes: Further database users and roles are managed in-database through Neo4j's own user management, not by this spec. The 02-production preset references an existing Secret instead of declaring the password in a manifest that lives in git.
    - control_id: workload-identity
      status: not_applicable
      notes: The component reaches no cloud APIs -- there is no object-store or other cloud surface to authenticate, so there is nothing to federate a workload identity for.
    - control_id: no-legacy-auth
      status: enforced_by_default
      evidence:
        type: module_default
        reference: There is no unauthenticated or weaker path to disable -- the chart requires the neo4j admin credential on every install, and the module materializes one (generated when none is declared) before every install (see rbac).
    - control_id: strong-user-auth
      status: not_applicable
      notes: The packaged Neo4j Browser signs in with database credentials -- the chart-required neo4j admin password (module-generated when none is declared, read from the <name>-auth Secret); password policy and lockout are server configuration inside the product, not modeled in this deployment spec.
    - control_id: audit-logging
      status: not_applicable
      notes: No database audit trail is modeled -- Neo4j's query and security logging is enterprise surface reachable through the config map or helm_values, not a typed seam. Changes to the release itself are Kubernetes API operations, captured by the target cluster's audit policy.
    - control_id: monitoring-integration
      status: configurable
      field_path: service_monitor_enabled
      evidence:
        type: spec_default
        reference: False by default (the chart default); true creates a ServiceMonitor so a Prometheus Operator scrapes the server's metrics (requires the Prometheus Operator CRDs on the cluster).
    - control_id: backup-recovery
      status: not_applicable
      notes: No backup mechanism is modeled -- neo4j-admin dump/backup is an operational procedure outside this spec, and the chart's backup tooling rides the helm_values escape hatch. Volume snapshots are the cluster's storage-class concern.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: configurable
      field_path: cluster_name
      evidence:
        type: spec_default
        reference: Empty runs standalone -- and community edition is single-instance by license. Enterprise members that share a cluster_name form one cluster, each member its own KubernetesNeo4j resource; scheduling.pod_anti_affinity (chart default true) spreads members apart.
      notes: Community deployments (all three presets) have no high-availability path; the durability story is the persistent volume.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Kubernetes nor the chart offers a deletion-protection flag on the release; protection is operational (namespace RBAC, change review).
    - control_id: managed-patching
      status: configurable
      field_path: chart_version
      evidence:
        type: spec_default
        reference: chart_version defaults to the module's pin (2026.6.0 -- chart versions track Neo4j calendar releases); upgrading is a deliberate act of changing the pin, which re-runs the release with the new chart. Neo4j recovers and upgrades store files on startup.
