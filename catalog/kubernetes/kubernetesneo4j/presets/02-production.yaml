apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesNeo4j
metadata:
  name: prod-neo4j
spec:
  namespace:
    value: neo4j
  create_namespace: true
  edition: community
  # Production credential hygiene: reference an existing Secret
  # carrying the chart's NEO4J_AUTH key ("neo4j/<password>") instead
  # of declaring the password in a manifest that lives in git. The
  # Secret must exist BEFORE the install — the chart reads it at
  # template time.
  auth:
    existing_secret: neo4j-auth
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 8Gi
  # Explicit memory split instead of Neo4j's auto-compute — the right
  # call on shared or memory-tight nodes where auto-detection reads
  # the node, not the container. Keep initial = max heap (growth
  # causes GC pauses), and give the page cache what remains after heap
  # and OS overhead: heap 3G + page cache 3G + ~2G overhead = the 8Gi
  # container.
  memory:
    heap_initial: 3G
    heap_max: 3G
    page_cache: 3G
  data_volume:
    size: 100Gi
    # Literal class name shown; the field also accepts a valueFrom
    # reference to a KubernetesStorageClass resource.
    storage_class:
      value: <fast-ssd-storage-class>
  # Extra neo4j.conf entries, exactly as neo4j.conf expects them.
  # Memory keys belong in `memory` above; auth/TLS keys are
  # chart-owned.
  config:
    db.transaction.timeout: 60s
    dbms.usage_report.enabled: "false"
  # Pin the database to storage-appropriate nodes. pod_anti_affinity
  # is the chart default (true) — meaningful for enterprise cluster
  # members, harmless standalone.
  scheduling:
    node_selector:
      workload-class: database
  # ClusterIP (the kind's default, restated for the record — NOTE
  # the chart's own default is LoadBalancer; this component overrides
  # it by design). Exposure composes from first-class kinds
  # (KubernetesIngress, Gateway API) over the exported service handle.
  #
  # For a direct cloud load balancer instead, set type: LoadBalancer
  # and ride the provider recipe on annotations, e.g. an internal AWS
  # NLB:
  #   type: LoadBalancer
  #   annotations:
  #     service.beta.kubernetes.io/aws-load-balancer-type: external
  #     service.beta.kubernetes.io/aws-load-balancer-scheme: internal
  service:
    type: ClusterIP
