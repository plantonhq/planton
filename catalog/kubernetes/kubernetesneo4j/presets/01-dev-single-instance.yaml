apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesNeo4j
metadata:
  name: dev-neo4j
spec:
  namespace:
    value: dev-neo4j
  create_namespace: true
  # Community edition: free (GPLv3), single-instance by license — the
  # chart's grain is one server per release either way.
  edition: community
  # No auth declared: the module mints the admin password and
  # materializes it as the <name>-auth Secret (the chart's NEO4J_AUTH
  # contract plus a bare `password` key) — it never lands in rendered
  # Helm values, and nobody escrows a value the module can generate.
  # Declare auth.password (a managed-secret reference) only to bring
  # your own.
  # THE CHART'S FLOOR: 500m CPU / 2Gi memory — the chart REJECTS
  # installs below it, so this is as small as Neo4j gets.
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 2Gi
  data_volume:
    size: 10Gi
