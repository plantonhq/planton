# The dev shape: community edition, NO auth declared — the module mints
# the admin password and materializes it as the <name>-auth Secret — and
# the chart's resource floor (it REJECTS installs below 500m/2Gi). The
# verifier reads the minted credential from that Secret and proves a live
# Cypher write/read round-trip with it, so the smallest honest shape is
# also the proof of generation.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesNeo4j
metadata:
  name: e2e-neo-min
spec:
  namespace:
    value: e2e-neo-min
  create_namespace: true
  edition: community
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 2Gi
  data_volume:
    size: 4Gi
