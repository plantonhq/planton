syntax = "proto3";

package dev.planton.kubernetes.kuberneteskafkaconnect.v1alpha1;

/**
 * **KubernetesKafkaConnectOutputs** — the handles a Connect
 * cluster exports for composition. KubernetesKafkaConnector resources
 * bind through `connect_name`; operational tooling reaches the
 * Connect REST API through the service endpoint (declarative
 * management stays with KubernetesKafkaConnector — the operator owns
 * connectors on this cluster).
 */
message KubernetesKafkaConnectOutputs {
  // Namespace the Connect cluster runs in.
  string namespace = 1;

  // The Connect cluster's name (metadata.name) — the value
  // KubernetesKafkaConnector resources bind to via their
  // connect_cluster field (rendered as the strimzi.io/cluster label).
  string connect_name = 2;

  // Name of the Connect REST API Service
  // (`<name>-connect-api`).
  string rest_api_service_name = 3;

  // In-cluster Connect REST API endpoint
  // (`http://<name>-connect-api.<namespace>.svc.cluster.local:8083`)
  // — read-only inspection (connector status, plugin listing);
  // connector management is declarative through
  // KubernetesKafkaConnector.
  string rest_api_endpoint = 4;
}
