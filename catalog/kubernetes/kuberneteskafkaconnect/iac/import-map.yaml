apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kuberneteskafkaconnect
spec:
  # One kubectl_manifest for the KafkaConnect CR, plus the optional
  # module-owned metrics ConfigMap (count-indexed singleton) and the
  # optional anchor namespace.
  values:
    - name: api_version
      tofu_resource_name: connect
      derivations:
        - literal: kafka.strimzi.io/v1
      where_to_find: Always "kafka.strimzi.io/v1" — the CR's group/version.
    - name: kind
      tofu_resource_name: connect
      derivations:
        - literal: KafkaConnect
      where_to_find: Always "KafkaConnect" — the CR kind this module applies.
    - name: name
      tofu_resource_name: connect
      derivations:
        - from_metadata_name: true
        - from_output: connect_name
      where_to_find: >-
        The KafkaConnect CR's metadata.name (equals the Planton resource
        name) — `kubectl get kafkaconnect -A` (NAME column).
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The Connect cluster's namespace — `kubectl get kafkaconnect -A`
        (NAMESPACE column).
    # ── the module-owned metrics ConfigMap (count-indexed singleton) ─────
    - name: config_map_name
      tofu_resource_name: connect_metrics
      derivations:
        - from_metadata_name_suffix: "-connect-metrics"
      where_to_find: >-
        Present only when metrics.enabled; always
        "<resource-name>-connect-metrics" —
        `kubectl get configmap -n <namespace>`.
    - name: config_map_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same namespace as the Connect cluster.
    # ── the optional anchor namespace ────────────────────────────────────
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the Connect
        cluster's namespace itself.
