apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: kubernetesnats
spec:
  tier: 2
  # Rebuilt from the pre-program shell onto the official nats chart
  # 2.14.2 (the embedded NACK operator + stream declarations removed —
  # the bundled-operator-and-CR class; JetStream persistent by default;
  # module-generated user credentials wired through env-var config
  # references) and offline-validated (spec tests, both engines'
  # plan/preview proofs across full, minimal and accounts shapes) and
  # live-proven on the kind lanes: the nats.go pub/sub + JetStream
  # store/read proofs and the auth gate (unauthenticated connection
  # REJECTED) on every authenticated lane — the full-surface lane runs
  # JetStream AS a publish-allowlisted user through the granted
  # $JS.API.>/$JS.ACK.> subjects — and the behavioral-durability proof:
  # the stored marker survives a UID-verified server pod replacement
  # through the JetStream PVC.
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
