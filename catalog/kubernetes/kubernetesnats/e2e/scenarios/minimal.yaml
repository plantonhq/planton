# The kind defaults: a single server with JetStream persistence ON
# (the kind's posture — the chart's raw default is off), no auth, the
# nats-box utility pod. The verifier proves MESSAGING on every lane: the
# StatefulSet rolled out → a real nats.go client completes a pub/sub
# round-trip → a file-backed stream stores a marker a consumer reads
# back.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesNats
metadata:
  name: e2e-nats-min
spec:
  namespace:
    value: e2e-nats-min
  createNamespace: true
