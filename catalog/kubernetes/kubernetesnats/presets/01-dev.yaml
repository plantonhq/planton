apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesNats
metadata:
  name: dev-nats
spec:
  namespace:
    value: nats
  create_namespace: true
  # Everything else is the kind's defaults: ONE server with
  # JetStream on (a 10Gi file-store volume — published messages survive
  # pod restarts), the nats-box utility pod for the `nats` CLI, and NO
  # authentication — any client that can reach the ClusterIP Service
  # connects with full access. Fine inside a trusted cluster network;
  # declare `auth` before anything else can reach it.
