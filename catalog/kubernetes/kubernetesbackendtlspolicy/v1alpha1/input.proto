syntax = "proto3";

package dev.planton.kubernetes.kubernetesbackendtlspolicy.v1alpha1;

import "catalog/kubernetes/kubernetesbackendtlspolicy/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// Input for the KubernetesBackendTlsPolicy IaC stack. The platform resolves
// all StringValueOrRef references (namespace, target Service names, CA
// ConfigMap names) to literal strings before passing this to the IaC engine.
message KubernetesBackendTlsPolicyIacInput {
  // Target infra-component.
  KubernetesBackendTlsPolicy target = 1;
  // Kubernetes provider configuration (cluster credentials).
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
