syntax = "proto3";

package dev.planton.kubernetes.kubernetesbackendtlspolicy.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesbackendtlspolicy/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesbackendtlspolicy/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesBackendTlsPolicy is a Kubernetes Gateway API BackendTLSPolicy: a
// namespaced Direct policy that tells the Gateway implementation to originate
// TLS to the targeted backend Services and how to verify the certificate they
// present.
message KubernetesBackendTlsPolicy {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesBackendTlsPolicy'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesBackendTlsPolicySpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesBackendTlsPolicyStatus status = 5;
}

// KubernetesBackendTlsPolicyStatus holds the deployment status and outputs.
message KubernetesBackendTlsPolicyStatus {
  // outputs
  KubernetesBackendTlsPolicyOutputs outputs = 1;
}
