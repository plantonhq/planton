apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesbackendtlspolicy
spec:
  # One kubectl_manifest applying the Gateway API BackendTLSPolicy CR. The
  # composed import ID is apiVersion//kind//name//namespace — apiVersion and
  # kind are constants of this module (it renders exactly one GVK), declared
  # as literals.
  values:
    - name: api_version
      derivations:
        - literal: gateway.networking.k8s.io/v1
      where_to_find: >-
        Always "gateway.networking.k8s.io/v1" — the module pins the served
        standard-channel version.
    - name: kind
      derivations:
        - literal: BackendTLSPolicy
      where_to_find: Always "BackendTLSPolicy" — the CR kind this module applies.
    - name: name
      derivations:
        - from_metadata_name: true
        - from_output: policy_name
      where_to_find: >-
        The BackendTLSPolicy's metadata.name (equals the Planton resource
        name) — `kubectl get backendtlspolicies -A` (NAME column).
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The namespace the resource lives in — `kubectl get backendtlspolicies
        -A` (NAMESPACE column).
