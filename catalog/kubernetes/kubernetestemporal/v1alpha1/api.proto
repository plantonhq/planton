syntax = "proto3";

package dev.planton.kubernetes.kubernetestemporal.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetestemporal/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetestemporal/v1alpha1/spec.proto";
import "shared/metadata.proto";

//temporal-kubernetes
message KubernetesTemporal {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesTemporal'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesTemporalSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesTemporalStatus status = 5;
}

//temporal-kubernetes status.
message KubernetesTemporalStatus {
  //outputs
  KubernetesTemporalOutputs outputs = 1;
}
