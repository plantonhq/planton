apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesTemporal
metadata:
  name: dev-temporal
spec:
  namespace:
    value: temporal
  # Co-located with the composed database below: the password is read
  # through a secretKeyRef, and a secretKeyRef can only read Secrets in
  # the workload's OWN namespace. Deploy the KubernetesPostgres named
  # `temporal-db` into this same namespace.
  create_namespace: true
  database:
    postgres:
      # The references resolve to the KubernetesPostgres resource's
      # read-write Service (always the current primary) and its
      # operator-maintained application-credential Secret (key
      # `password`) — the reference defaults, no field paths needed.
      host:
        valueFrom:
          name: temporal-db
      username: temporal
      password_secret:
        secret_name:
          valueFrom:
            name: temporal-db
  # Both databases must exist before install: declare `temporal` as the
  # KubernetesPostgres bootstrap database (owner `temporal`) and create
  # `temporal_visibility` with one line of post_init_sql —
  #   CREATE DATABASE temporal_visibility OWNER temporal;
  #
  # Everything else is the kind's defaults: the pinned chart, one
  # replica of each server service, the Web UI and admin-tools pod on,
  # 512 history shards, and the schema Jobs preparing both databases
  # before the server starts.
  temporal_namespaces:
    - name: default
