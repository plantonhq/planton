apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesenvoyfilter
spec:
  # One kubectl_manifest applying the Istio EnvoyFilter CR. The composed import ID
  # is apiVersion//kind//name//namespace — apiVersion and kind are constants
  # of this module (it renders exactly one GVK), declared as literals.
  values:
    - name: api_version
      derivations:
        - literal: networking.istio.io/v1alpha3
      where_to_find: >-
        Always "networking.istio.io/v1alpha3" — the module pins the served version.
    - name: kind
      derivations:
        - literal: EnvoyFilter
      where_to_find: Always "EnvoyFilter" — the CR kind this module applies.
    - name: name
      derivations:
        - from_metadata_name: true
        - from_output: envoy_filter_name
      where_to_find: >-
        The EnvoyFilter's metadata.name (equals the Planton resource name) —
        `kubectl get envoyfilters -A` (NAME column).
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The namespace the resource lives in — `kubectl get envoyfilters -A`
        (NAMESPACE column).
