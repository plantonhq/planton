syntax = "proto3";

package dev.planton.kubernetes.kubernetesenvoyfilter.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesenvoyfilter/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesenvoyfilter/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesEnvoyFilter is an Istio EnvoyFilter: a namespaced, expert-only escape hatch that
// applies low-level patches to the Envoy proxy configuration istiod generates for selected
// workloads.
message KubernetesEnvoyFilter {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesEnvoyFilter'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesEnvoyFilterSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesEnvoyFilterStatus status = 5;
}

// KubernetesEnvoyFilterStatus holds the deployment status and outputs.
message KubernetesEnvoyFilterStatus {
  // outputs
  KubernetesEnvoyFilterOutputs outputs = 1;
}
