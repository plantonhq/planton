# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. This kind is
# the catalog's sole intentional passthrough, so least-privilege has a hard
# honest limit here: the release renders WHATEVER THE DECLARED CHART
# CONTAINS, and the runner must be able to apply all of it. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: kuberneteshelmrelease
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubernetes_namespace_v1.helm_release_namespace -- created and owned only when spec.create_namespace is true; get is needed for refresh either way. delete applies only to module-owned namespaces. list and watch serve the Pulumi provider's deletion await -- it watches the namespace until it is gone, and without them a destroy under this exact identity hangs until the provider's timeout (found by running a lane as this identity).
      - api_groups:
          - ""
        resources:
          - secrets
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers Helm's own release-record Secrets (sh.helm.release.v1.<name>.vN) in the release namespace -- both engines perform a REAL helm install, so release state is written as Secrets, one per revision, bounded by spec.max_history (default 10).
      - api_groups:
          - "*"
        resources:
          - "*"
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: "THE PASS-THROUGH REALITY, stated plainly: helm_release.helm_release installs an ARBITRARY upstream chart (spec.repo + spec.chart + spec.version), so the runner's true requirement is the union of every object that chart renders -- workloads, RBAC, CRDs the chart templates as release resources, webhooks, cluster-scoped objects, anything. The CRDs in the chart's crds/ directory are the module's, not Helm's: kubectl_manifest.helm_crds (Terraform, the generated helm_crds.tf) and the Pulumi twin (keptcrds) derive them from the pinned chart and apply them via server-side apply outside the release, read each one by name before writing it (the ownership check refuses a CRD another owner put there; the never-downgrade check refuses a lower version), and delete them only when spec.crds.keep_on_uninstall is false -- the wildcard covers those verbs too. No manifest-time enumeration exists; this wildcard is the honest statement, not a convenience. Operators who know WHICH chart a release deploys should scope the runner to that chart's actual object surface instead of granting this wildcard -- the typed catalog kinds' permission manifests show what such scoping looks like. Kubernetes escalation prevention still applies to any RBAC the chart contains: the runner must already hold what the chart's roles grant, or the escalate verb."
