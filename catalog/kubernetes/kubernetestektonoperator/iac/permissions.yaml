# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources plus the
# pinned v0.80.0 release manifest's document census, cited in notes) until
# the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: kubernetestektonoperator
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubectl_manifest.namespace -- the release manifest's FIXED tekton-operator namespace (its name is baked into the manifest's own cross-references), applied first and deleted last, with the delete blocking until the namespace is fully gone so re-installs never race the terminating namespace.
      - api_groups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubectl_manifest.crds -- the manifest's 14 operator.tekton.dev CRDs. Unlike the Helm-based operator kinds, these ARE documents of the applied bundle and DELETE with the resource; the modules delete them FIRST, while the operator Deployments still run, so the operator can process the TektonInstallerSet finalizers the drain triggers (verified live -- deleting both in one pass wedges tektoninstallersets in Terminating).
      - api_groups:
          - ""
        resources:
          - serviceaccounts
          - configmaps
          - secrets
          - services
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Manifest documents applied by kubectl_manifest.tekton_operator -- 1 ServiceAccount, 6 ConfigMaps (plus the module's own tekton-operator-readiness ConfigMap, kubectl_manifest.readiness_gate, the stand-in whose creation waits for the operator to serve) (tekton-config-defaults applied PATCHED with AUTOINSTALL_COMPONENTS=false so the KubernetesTekton declaration stays the single owner of the cluster's TektonConfig), the webhook certificate Secret (populated and rotated by the webhook itself at runtime), and 2 ClusterIP Services (per the v0.80.0 document census).
      - api_groups:
          - apps
        resources:
          - deployments
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: The manifest's two Deployments -- the operator (both containers patched with spec.operator_image/operator_resources) and the webhook (patched with spec.webhook_image/webhook_resources); node_selector, tolerations, and image_pull_secrets patch both pod specs. watch is the readiness gate's `kubectl rollout status` on both.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - clusterroles
          - clusterrolebindings
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: The manifest's six ClusterRole/ClusterRoleBinding pairs -- the lifecycle manager's cluster-wide component-management RBAC, applied verbatim (v0.80.0 document census).
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - roles
          - rolebindings
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: The manifest's single namespaced Role/RoleBinding pair in the tekton-operator namespace (v0.80.0 document census). The webhook's admission registrations are NOT manifest documents -- the knative-style webhook creates and maintains them at RUNTIME under the operator's own identity, so the runner needs no admissionregistration permissions.
      - api_groups:
          - operator.tekton.dev
        resources:
          - tektonconfigs
        verbs:
          - create
        cluster_scoped: true
        provenance: derived
        notes: The readiness gate's server-side DRY RUN of a TektonConfig (kubectl create --dry-run=server), which asks whether the operator's webhook admits and defaults one; a dry run is authorized as the verb it simulates and writes nothing, so no TektonConfig ever exists from this module (the KubernetesTekton declaration stays its single owner).
      - api_groups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - watch
        cluster_scoped: true
        provenance: derived
        notes: Pulumi only -- watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the CustomResourceDefinition applied by the yaml ConfigGroup in main.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
      - api_groups:
          - operator.tekton.dev
        resources:
          - tektonconfigs
        verbs:
          - get
          - list
          - watch
        cluster_scoped: true
        provenance: derived
        notes: Pulumi only -- get, list, and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the tektonconfigs objects applied by the yaml ConfigGroup in main.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - rolebindings
          - roles
        verbs:
          - list
          - watch
        cluster_scoped: false
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Role applied by the yaml ConfigGroup in main.go and the RoleBinding applied by the yaml ConfigGroup in main.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - clusterrolebindings
          - clusterroles
        verbs:
          - list
          - watch
        cluster_scoped: true
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the ClusterRole applied by the yaml ConfigGroup in main.go and the ClusterRoleBinding applied by the yaml ConfigGroup in main.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
      - api_groups:
          - ""
        resources:
          - configmaps
          - secrets
          - serviceaccounts
          - services
        verbs:
          - watch
        cluster_scoped: false
        provenance: derived
        notes: Pulumi only -- watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the ConfigMap applied by the yaml ConfigGroup in main.go, the ConfigMap in readiness_gate.go, the Secret applied by the yaml ConfigGroup in main.go, the Service applied by the yaml ConfigGroup in main.go, and the ServiceAccount applied by the yaml ConfigGroup in main.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing. Listing or watching Secrets returns their data, not only their names, so this grants read of every Secret in the namespace. Pulumi's delete wait cannot watch a deleted Secret without it.
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - list
          - watch
        cluster_scoped: true
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Namespace applied by the yaml ConfigGroup in main.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
