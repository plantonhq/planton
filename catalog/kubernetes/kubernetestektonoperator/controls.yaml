# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetestektonoperator
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The operator stores no data of its own -- its desired state is the operator.tekton.dev custom resources in the cluster's etcd, whose encryption at rest is the target cluster's control-plane posture.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No storage seam exists on this component (see enc-at-rest); customer-managed keys apply to the cluster's etcd encryption, owned by the cluster.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The webhook serves the API server's admission calls over TLS -- its serving certificate rides the release manifest's webhook certificate Secret, maintained by the webhook itself (knative-style, no cert-manager dependency). The operator's own calls to the Kubernetes API ride the API server's TLS.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The release manifest's two Services declare no external type -- both are ClusterIP (verified in the pinned v0.80.0 manifest), reachable only inside the cluster network; nothing the modules apply is externally exposed.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The operator's only inbound surface is API-server webhook calls, and the upstream contract is exactly one install per cluster in the fixed tekton-operator namespace -- there is no ingress or fencing seam to configure.
    - control_id: edge-protection
      status: not_applicable
      notes: The operator serves no HTTP edge traffic. Web application firewalls do not apply.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The release manifest ships the operator's RBAC as fixed documents -- six ClusterRole/ClusterRoleBinding pairs for the lifecycle manager's cluster-wide component management plus a namespaced Role/RoleBinding, applied verbatim by the modules. Management-plane access to this resource is the target cluster's Kubernetes RBAC.
      notes: The operator's RBAC is necessarily broad -- it installs and removes entire Tekton components across namespaces by design.
    - control_id: workload-identity
      status: not_applicable
      notes: The operator authenticates to the Kubernetes API through its ServiceAccount token -- it holds no cloud API credentials. Cloud identity for pipeline workloads is configured on the pipelines themselves, not here.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The operator ships no credentials and exposes no authentication surface of its own -- the webhook certificate is self-managed and rotated by the webhook. There is no legacy path to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Every mutation the operator performs is a Kubernetes API operation, captured by the target cluster's audit policy. The operator emits reconcile logs to stdout for the cluster's log collector; a dedicated audit trail is not modeled in this spec.
    - control_id: monitoring-integration
      status: not_applicable
      notes: No monitoring seam is modeled on this spec -- the operator's knative-style observability configuration is a release-manifest ConfigMap outside this contract, and the operator's health is typically watched through the cluster's workload monitoring.
    - control_id: backup-recovery
      status: not_applicable
      notes: The operator holds no data to back up -- desired state is the operator.tekton.dev CRs (the cluster's etcd backup posture). CAUTION on destroy -- the CRDs are documents of the applied manifest and DELETE with this resource, cascade-deleting any TektonConfig; always destroy the KubernetesTekton resource FIRST while the operator still runs (TektonInstallerSet finalizers are operator-processed).
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist on this component (see backup-recovery), so no retention policy applies.
    - control_id: multi-zone-ha
      status: not_applicable
      notes: No replica seam is modeled -- the operator and webhook Deployments run at the release manifest's baked-in replica counts. Placement rides node_selector and tolerations; the operator's loss degrades Tekton lifecycle management, not running pipelines.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Kubernetes nor the manifest offers a deletion-protection flag; protection is operational (namespace RBAC, change review). Destroying this component removes the operator.tekton.dev CRDs and everything declared through them -- the modules order the teardown (CRDs drain first, while the operator still runs) so it wedges nothing, but the deletion itself is total by upstream design.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The modules pin the operator to release v0.80.0 with the manifest's digest-pinned images, and the spec deliberately has NO version field -- a manifest cannot drift the installed operator away from the TektonConfig surface the catalog models. Upgrades arrive as catalog module updates, never as per-manifest choices.
      notes: operator_image and webhook_image exist for air-gapped mirrors of the SAME release, not for version selection.
