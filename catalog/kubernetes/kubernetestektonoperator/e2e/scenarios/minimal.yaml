# The kind defaults on their own: the operator + webhook Deployments
# in the fixed tekton-operator namespace, the 14 operator.tekton.dev CRDs
# — and NO Tekton components. The verifier proves the DESIGN INVARIANT on
# every lane: auto-install is disabled, so no TektonConfig exists after
# install (the KubernetesTekton declaration kind is the single owner of
# the cluster's Tekton configuration).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesTektonOperator
metadata:
  name: e2e-tektonop-min
spec: {}
