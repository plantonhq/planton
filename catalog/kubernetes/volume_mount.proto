syntax = "proto3";

package dev.planton.kubernetes;

import "buf/validate/validate.proto";
import "catalog/kubernetes/core_v1_api.proto";
import "shared/foreignkey/v1/foreign_key.proto";

// =============================================================================
// SHARED VOLUME MOUNT DEFINITIONS
// =============================================================================
//
// This file contains shared protobuf messages for volume mounts that are used
// across multiple Kubernetes workload kinds: the app, sidecar and init
// containers of KubernetesDeployment, KubernetesStatefulSet,
// KubernetesDaemonSet, KubernetesJob and KubernetesCronJob, plus the extra
// volumes of KubernetesOtelCollector and KubernetesLangfuse.
//
// By centralizing these definitions, we ensure consistency and reduce duplication.
// =============================================================================

/**
 * VolumeMount defines how to mount a volume into a container.
 * Supports multiple volume types: ConfigMap, Secret, HostPath, EmptyDir, PVC,
 * and three projected sources: a ServiceAccount token, a ClusterTrustBundle's
 * CA certificates, and a pod certificate (a kubelet-managed key and X.509
 * certificate).
 * At most one volume source per mount. A mount with no source names a volume
 * defined elsewhere -- a StatefulSet volumeClaimTemplate, or another mount of
 * the same name that carries the source.
 *
 * Example usage:
 *   volumeMounts:
 *     - name: config
 *       mountPath: /etc/app/config.yaml
 *       configMap:
 *         name: app-config
 *         key: config.yaml
 *     - name: logs
 *       mountPath: /var/log
 *       hostPath:
 *         path: /var/log
 *         type: Directory
 */
message VolumeMount {
  option (buf.validate.message).cel = {
    id: "volume_mount.at_most_one_source"
    message: "a volume mount takes at most one source (configMap, secret, hostPath, emptyDir, pvc, serviceAccountToken, clusterTrustBundle or podCertificate)"
    expression: "[has(this.config_map), has(this.secret), has(this.host_path), has(this.empty_dir), has(this.pvc), has(this.service_account_token), has(this.cluster_trust_bundle), has(this.pod_certificate)].filter(x, x).size() <= 1"
  };

  // Name of the volume mount. Must be unique within the container.
  // Used to correlate with the volume definition.
  string name = 1 [(buf.validate.field).required = true];

  // Path within the container at which the volume should be mounted.
  // Must be an absolute path.
  string mount_path = 2 [(buf.validate.field).required = true];

  // Whether the volume should be mounted read-only.
  // Default is false.
  bool read_only = 3;

  // Path within the volume from which the container's volume should be mounted.
  // Defaults to "" (volume's root).
  // Useful for mounting a subdirectory of a volume.
  string sub_path = 4;

  // ConfigMap volume source.
  // Use this to mount a ConfigMap as a file or directory.
  ConfigMapVolumeSource config_map = 5;

  // Secret volume source.
  // Use this to mount a Secret as a file or directory.
  SecretVolumeSource secret = 6;

  // HostPath volume source.
  // Use this to mount a file or directory from the host node's filesystem.
  // Common for DaemonSets that need access to node-level resources.
  HostPathVolumeSource host_path = 7;

  // EmptyDir volume source.
  // Use this for temporary storage that is erased when the pod is removed.
  // Useful for scratch space, caching, or sharing data between containers.
  EmptyDirVolumeSource empty_dir = 8;

  // PersistentVolumeClaim volume source.
  // Use this to mount an existing PVC.
  // For StatefulSets, this can reference a volumeClaimTemplate.
  PvcVolumeSource pvc = 9;

  // Projected ServiceAccount token volume source.
  // Use this to mount a short-lived, audience-bound identity token that the
  // kubelet issues for the pod's ServiceAccount and rotates automatically.
  ServiceAccountTokenVolumeSource service_account_token = 10;

  // Projected ClusterTrustBundle volume source.
  // Use this to mount the CA certificates of a ClusterTrustBundle, so the
  // container can verify servers whose certificates a cluster signer issues
  // (the Agent Substrate API's, for one). The kubelet keeps the file current
  // as the bundle rotates, which a hand-copied ConfigMap never does.
  // Requires the cluster's ClusterTrustBundle and ClusterTrustBundleProjection
  // features (certificates.k8s.io/v1beta1).
  // OpenTofu engine: not supported -- the hashicorp/kubernetes provider has
  // no clusterTrustBundle projection; deploy the workload with the Pulumi
  // engine (set planton.dev/provisioner to pulumi).
  ClusterTrustBundleVolumeSource cluster_trust_bundle = 11;

  // Projected pod certificate volume source.
  // Use this to give the container a private key and an X.509 certificate the
  // kubelet requests from a signer for the pod and rotates before expiry --
  // the client certificate a workload presents to an mTLS endpoint (the Agent
  // Substrate router's TLS listener, for one).
  // Requires the cluster's PodCertificateRequest feature
  // (certificates.k8s.io/v1beta1) and a signer controller for signer_name.
  // OpenTofu engine: not supported -- the hashicorp/kubernetes provider has
  // no podCertificate projection; deploy the workload with the Pulumi engine
  // (set planton.dev/provisioner to pulumi).
  PodCertificateVolumeSource pod_certificate = 12;
}

/**
 * ConfigMapVolumeSource mounts a ConfigMap as a volume.
 * The ConfigMap can be one defined in spec.config_maps or an existing ConfigMap in the namespace.
 *
 * When 'key' is specified, only that key is mounted as a single file.
 * When 'key' is not specified, all keys are mounted as files in the directory.
 *
 * Example - Mount entire ConfigMap as directory:
 *   configMap:
 *     name: app-config
 *
 * Example - Mount single key as file:
 *   configMap:
 *     name: app-config
 *     key: database.yaml
 *     path: db-config.yaml
 */
message ConfigMapVolumeSource {
  // Name of the ConfigMap to mount.
  // Can reference a ConfigMap defined in spec.config_maps or an existing one in the namespace.
  string name = 1 [(buf.validate.field).required = true];

  // Specific key from the ConfigMap to mount as a single file.
  // If not specified, all keys are mounted as files in the directory.
  string key = 2;

  // If key is specified, this is the filename to use for the mounted file.
  // Defaults to the key name if not specified.
  // Example: key="config" path="app.yaml" mounts the "config" key as "app.yaml"
  string path = 3;

  // Mode bits to use on created files. Must be a value between 0 and 0777.
  // Defaults to 0644.
  // Use 0755 (493 in decimal) for executable scripts.
  int32 default_mode = 4;
}

/**
 * SecretVolumeSource mounts a Secret as a volume.
 * Works similarly to ConfigMapVolumeSource but for sensitive data.
 *
 * Example:
 *   secret:
 *     name: tls-certs
 *     key: tls.crt
 *     path: server.crt
 */
message SecretVolumeSource {
  // Name of the Secret to mount.
  string name = 1 [(buf.validate.field).required = true];

  // Specific key from the Secret to mount as a single file.
  // If not specified, all keys are mounted as files in the directory.
  string key = 2;

  // If key is specified, this is the filename to use for the mounted file.
  // Defaults to the key name if not specified.
  string path = 3;

  // Mode bits to use on created files. Must be a value between 0 and 0777.
  // Defaults to 0644.
  int32 default_mode = 4;
}

/**
 * HostPathVolumeSource mounts a file or directory from the host node's filesystem.
 * Use with caution as it ties pods to specific nodes.
 *
 * Common use cases:
 * - Log collection DaemonSets mounting /var/log
 * - Node monitoring agents mounting /sys or /proc
 * - Container runtime sockets (e.g., /var/run/docker.sock)
 *
 * Example:
 *   hostPath:
 *     path: /var/log
 *     type: Directory
 */
message HostPathVolumeSource {
  // Path on the host to mount.
  string path = 1 [(buf.validate.field).required = true];

  // Type of the host path.
  // Valid values:
  //   "" - Empty string (default) means no check is performed before mounting
  //   "DirectoryOrCreate" - Create directory if it doesn't exist
  //   "Directory" - Directory must exist
  //   "FileOrCreate" - Create file if it doesn't exist
  //   "File" - File must exist
  //   "Socket" - UNIX socket must exist
  //   "CharDevice" - Character device must exist
  //   "BlockDevice" - Block device must exist
  string type = 2 [(buf.validate.field).cel = {
    id: "host_path.type"
    message: 'Type must be one of: "", "DirectoryOrCreate", "Directory", "FileOrCreate", "File", "Socket", "CharDevice", "BlockDevice"'
    expression: 'size(this) == 0 || this in ["", "DirectoryOrCreate", "Directory", "FileOrCreate", "File", "Socket", "CharDevice", "BlockDevice"]'
  }];
}

/**
 * EmptyDirVolumeSource creates an empty directory for temporary storage.
 * The directory is created when a pod is assigned to a node and exists as long as the pod runs.
 * Data is deleted when the pod is removed.
 *
 * Use cases:
 * - Scratch space for computations
 * - Checkpoint storage for crash recovery
 * - Shared space between containers in a pod
 *
 * Example - Default (disk-backed):
 *   emptyDir: {}
 *
 * Example - Memory-backed (faster, but uses RAM):
 *   emptyDir:
 *     medium: Memory
 *     sizeLimit: 256Mi
 */
message EmptyDirVolumeSource {
  // Medium for the empty directory.
  // "" (default) uses the node's default medium (typically disk).
  // "Memory" uses a tmpfs (RAM-backed filesystem).
  //
  // Memory-backed volumes are faster but:
  // - Count against container memory limits
  // - Are lost on node restart
  // - Should have sizeLimit set to prevent OOM
  string medium = 1 [(buf.validate.field).cel = {
    id: "empty_dir.medium"
    message: 'Medium must be either "" or "Memory"'
    expression: 'size(this) == 0 || this in ["", "Memory"]'
  }];

  // Size limit for the empty directory.
  // Format: Kubernetes quantity (e.g., "1Gi", "500Mi").
  // Only strictly enforced when medium is "Memory".
  // For disk-backed volumes, this is a best-effort limit.
  string size_limit = 2;
}

/**
 * PvcVolumeSource mounts an existing PersistentVolumeClaim.
 *
 * For StatefulSets: The claimName can reference a volumeClaimTemplate name,
 * and the StatefulSet controller will automatically handle per-pod PVC binding.
 *
 * Example:
 *   pvc:
 *     claimName: data-volume
 *     readOnly: false
 */
message PvcVolumeSource {
  // Name of the PersistentVolumeClaim to mount.
  // For StatefulSets, this can be the name of a volumeClaimTemplate.
  string claim_name = 1 [(buf.validate.field).required = true];

  // Whether the PVC should be mounted read-only.
  // Default is false.
  bool read_only = 2;
}

/**
 * ServiceAccountTokenVolumeSource mounts a projected ServiceAccount token.
 * The kubelet requests a token for the pod's ServiceAccount, bound to the
 * requested audience, writes it into the volume, and rotates it automatically
 * before expiry. The token also becomes invalid when the pod or the
 * ServiceAccount is deleted.
 *
 * This is the standard way to give a workload a short-lived, audience-scoped
 * identity credential without storing any secret: the receiving service
 * verifies the token with the cluster (TokenReview) or against the cluster's
 * OIDC discovery documents.
 *
 * The token is projected through the Kubernetes "projected" volume type and
 * is always mounted read-only.
 *
 * Example:
 *   volumeMounts:
 *     - name: control-plane-identity
 *       mountPath: /var/run/secrets/tokens
 *       readOnly: true
 *       serviceAccountToken:
 *         audience: my-control-plane
 *         expirationSeconds: 3600
 *         path: token
 */
message ServiceAccountTokenVolumeSource {
  // Intended audience of the token. The receiving service must identify
  // itself with this audience when verifying the token; a token minted for a
  // different audience is rejected. Required: an audience-less token would be
  // replayable against any service in the cluster.
  string audience = 1 [(buf.validate.field).required = true];

  // Requested lifetime of the token in seconds. The kubelet starts rotating
  // the token when it passes 80% of its lifetime or 24 hours, whichever is
  // shorter. Defaults to 3600 (1 hour). The Kubernetes API enforces a
  // minimum of 600 (10 minutes).
  int64 expiration_seconds = 2 [(buf.validate.field).cel = {
    id: "service_account_token.expiration_seconds"
    message: "Expiration must be at least 600 seconds (the Kubernetes API minimum)"
    expression: "this == 0 || this >= 600"
  }];

  // Filename for the token relative to the mount path.
  // Defaults to "token".
  string path = 3;
}

/**
 * ClusterTrustBundleVolumeSource projects the CA certificates of one or more
 * ClusterTrustBundles into the container as a single PEM file. The volume is
 * always mounted read-only.
 *
 * Select every bundle of a signer by signer_name and a label selector, or
 * one bundle by name; exactly one of name or signer_name. Prefer the signer:
 * a kubelet keeps serving a by-name projection the first content it read, so
 * when the bundle is replaced (a reinstall of what publishes it) a pod
 * mounting it by name keeps the old roots, while a signer projection follows
 * at once.
 *
 * Example - the Agent Substrate API's trust bundle, by its signer (the
 * KubernetesAgentSubstrate api_trust_bundle_signer output) and the label
 * upstream's controller puts on the bundle it serves:
 *   volumeMounts:
 *     - name: substrate-ca
 *       mountPath: /var/run/substrate
 *       readOnly: true
 *       clusterTrustBundle:
 *         signerName: servicedns.podcert.ate.dev/identity
 *         labelSelector:
 *           matchLabels:
 *             podcert.ate.dev/canarying: live
 *         path: ca.crt
 */
message ClusterTrustBundleVolumeSource {
  option (buf.validate.message).cel = {
    id: "cluster_trust_bundle.name_xor_signer"
    message: "set exactly one of name or signerName"
    expression: "has(this.name) != (this.signer_name != '')"
  };
  option (buf.validate.message).cel = {
    id: "cluster_trust_bundle.label_selector_needs_signer"
    message: "labelSelector applies only with signerName"
    expression: "!has(this.label_selector) || this.signer_name != ''"
  };

  // The ClusterTrustBundle to project, by object name. A literal name, or a
  // reference to the KubernetesAgentSubstrate whose API trust bundle this is
  // (status.outputs.api_trust_bundle_name). Mutually exclusive with
  // signer_name. A by-name projection keeps the content the kubelet first
  // read, so for a bundle that a reinstall replaces, use signer_name.
  dev.planton.shared.foreignkey.v1.StringValueOrRef name = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesAgentSubstrate,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.api_trust_bundle_name"
  ];

  // Project every ClusterTrustBundle of this signer, deduplicated into one
  // file (e.g. "servicedns.podcert.ate.dev/identity"). Mutually exclusive
  // with name.
  string signer_name = 2;

  // Narrows the signer's bundles to those matching the selector. Applies only
  // with signer_name. Unset matches NOTHING; set but empty matches every
  // bundle of the signer -- upstream's own semantics.
  KubernetesCoreV1ApiLabelSelector label_selector = 3;

  // When true, the pod starts even if no bundle matches (the file is then
  // absent); when false the pod waits for the bundle.
  bool optional = 4;

  // File name for the PEM bundle relative to the mount path.
  // Defaults to "ca.crt".
  string path = 5;
}

/**
 * PodCertificateVolumeSource has the kubelet generate a private key, request a
 * certificate for the pod from a signer, and project both into the container,
 * rotating them before the certificate expires. The volume is always mounted
 * read-only.
 *
 * Example - the Agent Substrate router's client certificate:
 *   volumeMounts:
 *     - name: workload-identity
 *       mountPath: /var/run/podidentity
 *       readOnly: true
 *       podCertificate:
 *         signerName: podidentity.podcert.ate.dev/identity
 *         keyType: ECDSAP256
 *         credentialBundlePath: credential-bundle.pem
 */
message PodCertificateVolumeSource {
  option (buf.validate.message).cel = {
    id: "pod_certificate.key_and_chain_paths_together"
    message: "keyPath and certificateChainPath are set together"
    expression: "(this.key_path != '') == (this.certificate_chain_path != '')"
  };

  // The signer the kubelet's certificate requests are addressed to. A
  // controller for this signer must run in the cluster, or the pod never
  // starts. The Agent Substrate router's client certificates come from
  // "podidentity.podcert.ate.dev/identity" (the substrate's
  // status.outputs.router_client_signer_name).
  string signer_name = 1 [(buf.validate.field).required = true];

  // The key pair the kubelet generates: RSA3072, RSA4096, ECDSAP256,
  // ECDSAP384, ECDSAP521 or ED25519. The signer decides which it accepts.
  string key_type = 2 [(buf.validate.field).cel = {
    id: "pod_certificate.key_type.values"
    message: "keyType must be one of RSA3072, RSA4096, ECDSAP256, ECDSAP384, ECDSAP521, ED25519"
    expression: "this in ['RSA3072', 'RSA4096', 'ECDSAP256', 'ECDSAP384', 'ECDSAP521', 'ED25519']"
  }];

  // The longest lifetime the certificate may have, in seconds (3600 to
  // 7862400). Unset lets the API server choose 86400 (24 hours); the signer
  // may issue a shorter one, and kubernetes.io signers never exceed 24 hours.
  optional int32 max_expiration_seconds = 3 [
    (buf.validate.field).int32.gte = 3600,
    (buf.validate.field).int32.lte = 7862400
  ];

  // File name for the credential bundle -- one file holding the PKCS#8
  // private key followed by the certificate chain, so the application reads a
  // consistent pair in one atomic read. Defaults to "credential-bundle.pem"
  // when no path below is set.
  string credential_bundle_path = 4;

  // File name for the private key alone. Set together with
  // certificate_chain_path; the application must then check the key matches
  // the leaf certificate, because the two files can be read mid-rotation.
  string key_path = 5;

  // File name for the certificate chain alone (leaf first). Set together
  // with key_path.
  string certificate_chain_path = 6;

  // Extra information for the signer, copied into the certificate requests
  // the kubelet creates. Keys must be domain-prefixed; signers refuse keys
  // they do not recognize.
  map<string, string> user_annotations = 7;
}
