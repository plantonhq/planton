apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesClickHouse
metadata:
  name: prod-clickhouse
spec:
  namespace:
    value: clickhouse
  create_namespace: true
  version: "25.3"
  # One shard, three full copies of the data kept in sync through
  # ReplicatedMergeTree. Scale `shards` only when a single shard can no
  # longer carry the dataset or the write rate — replicas buy
  # durability, shards buy capacity.
  replicas: 3
  disk_size: 200Gi
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 16Gi
  # A production Keeper quorum: three nodes survive one loss. Keeper
  # stores coordination metadata only — it stays small.
  coordination:
    type: managed_keeper
    keeper:
      replicas: 3
      disk_size: 10Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi
  # Replicas of the same shard never share a Kubernetes node —
  # co-located replicas make replication pointless against node loss.
  spread_replicas_across_nodes: true
  # Volumes survive resource deletion; re-creating the cluster with the
  # same name re-attaches the data. Deleting retained PVCs becomes a
  # deliberate manual act.
  retain_volumes_on_delete: true
  pdb_max_unavailable: 1
  # Neither user below can create tables — schema DDL belongs to a
  # migration identity. A user intended to run schema DDL on a
  # replicated cluster needs CREATE on the database AND
  # "GRANT CLUSTER ON *.*" (ON CLUSTER statements are rejected with
  # ACCESS_DENIED otherwise). A user declared with NO grants gets
  # ClickHouse's unrestricted default access — always declare grants.
  # Neither user declares a password: the module generates each one into
  # the auth Secret, keyed by user name.
  users:
    - name: analyst
      profile: readonly
      quota: default
    - name: ingest
      grants:
        - GRANT SELECT, INSERT ON analytics.*
  profiles:
    - name: readonly
      settings:
        readonly: "2"
        max_memory_usage: "8000000000"
  quotas:
    - name: default
      settings:
        interval/duration: "3600"
        interval/queries: "50000"
  settings:
    max_concurrent_queries: "200"
