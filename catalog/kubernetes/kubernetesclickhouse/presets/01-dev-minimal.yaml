apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesClickHouse
metadata:
  name: dev-clickhouse
spec:
  namespace:
    value: dev-clickhouse
  create_namespace: true
  # Pin the server line your clients test against — never rely on the
  # operator's implicit `latest`.
  version: "25.3"
  disk_size: 20Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # One shard, one replica (the defaults): no Keeper is deployed, no
  # replication — a lost volume loses the data. The built-in `default`
  # user stays operator-managed and pod-network-restricted; every real
  # client gets a named user. No password is declared, so the module
  # generates one into the auth Secret (key `dev`).
  users:
    - name: dev
      grants:
        - GRANT SELECT, INSERT, CREATE, DROP ON *.*
