apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesClickHouse
metadata:
  name: warehouse
spec:
  namespace:
    value: clickhouse
  create_namespace: true
  version: "25.3"
  cluster_name: warehouse
  # Capacity through shards: four disjoint slices of the data, each
  # held by two replicas. Distributed-engine tables fan queries across
  # all shards in parallel; `ON CLUSTER 'warehouse'` DDL reaches every
  # host through the Keeper.
  shards: 4
  replicas: 2
  disk_size: 500Gi
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 32Gi
  coordination:
    type: managed_keeper
    keeper:
      replicas: 3
      disk_size: 10Gi
  spread_replicas_across_nodes: true
  retain_volumes_on_delete: true
  # Distributed queries between hosts authenticate with an
  # operator-generated shared secret (on by default; stated here
  # because sharded clusters are exactly what it protects).
  auto_inter_node_secret: true
  pdb_max_unavailable: 1
  users:
    # No password declared: the module generates it into the auth Secret
    # (key `etl`).
    - name: etl
      # ON CLUSTER DDL (how schema reaches every shard) requires the
      # CLUSTER grant on top of the database-scoped rights — without it
      # ClickHouse rejects distributed statements with ACCESS_DENIED.
      grants:
        - GRANT SELECT, INSERT, CREATE, ALTER ON warehouse.*
        - GRANT CLUSTER ON *.*
  settings:
    max_concurrent_queries: "300"
    # Keep merges from starving queries on write-heavy shards.
    background_pool_size: "24"
