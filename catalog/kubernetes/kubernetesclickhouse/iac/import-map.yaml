apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesclickhouse
spec:
  # The module renders up to TWO kubectl_manifest resource types with
  # different GVKs — the ClickHouseInstallation and the conditional managed
  # ClickHouseKeeperInstallation — so the composed-ID placeholders
  # {api_version}/{kind}/{name} are declared PER Terraform logical resource
  # via tofu_resource_name scoping. The auth Secret and the optional anchor
  # namespace ride their own rows. Every name is deterministic (derived
  # from metadata.name), so the whole family imports blind. Everything the
  # operator creates from the CRs (StatefulSets, Services, ConfigMaps, the
  # PDB) is operator-owned and never imported.
  values:
    # ── the ClickHouseInstallation CR ────────────────────────────────────
    - name: api_version
      tofu_resource_name: clickhouse_installation
      derivations:
        - literal: clickhouse.altinity.com/v1
      where_to_find: >-
        Always "clickhouse.altinity.com/v1" — the CHI's group/version at
        the pinned operator release.
    - name: kind
      tofu_resource_name: clickhouse_installation
      derivations:
        - literal: ClickHouseInstallation
      where_to_find: Always "ClickHouseInstallation" — the CR kind this module applies.
    - name: name
      tofu_resource_name: clickhouse_installation
      derivations:
        - from_metadata_name: true
        - from_output: chi_name
      where_to_find: >-
        The ClickHouseInstallation's metadata.name (equals the Planton
        resource name) — `kubectl get chi -A` (NAME column).
    # ── the managed ClickHouseKeeperInstallation CR ──────────────────────
    - name: api_version
      tofu_resource_name: keeper
      derivations:
        - literal: clickhouse-keeper.altinity.com/v1
      where_to_find: >-
        Always "clickhouse-keeper.altinity.com/v1" — the CHK's
        group/version at the pinned operator release.
    - name: kind
      tofu_resource_name: keeper
      derivations:
        - literal: ClickHouseKeeperInstallation
      where_to_find: Always "ClickHouseKeeperInstallation" — the CR kind this module applies.
    - name: name
      tofu_resource_name: keeper
      derivations:
        - from_output: keeper_name
        - from_metadata_name_suffix: "-keeper"
      where_to_find: >-
        Present only when coordination resolves to a managed Keeper;
        always "<resource-name>-keeper" — `kubectl get chk -n <namespace>`.
    # ── shared namespace segment for both CRs ────────────────────────────
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The cluster's namespace — `kubectl get chi -A` (NAMESPACE column).
    # ── the auth Secret ──────────────────────────────────────────────────
    - name: secret_name
      tofu_resource_name: auth
      derivations:
        - from_output: auth_secret_name
        - from_metadata_name_suffix: "-clickhouse-auth"
      where_to_find: >-
        Present only when users are declared; always
        "<resource-name>-clickhouse-auth" —
        `kubectl get secrets -n <namespace>`.
    - name: secret_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same namespace as the cluster — every object the module renders is
        namespaced with it.
    # ── the optional anchor namespace ────────────────────────────────────
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the cluster's
        namespace itself.
