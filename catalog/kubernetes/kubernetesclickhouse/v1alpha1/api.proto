syntax = "proto3";

package dev.planton.kubernetes.kubernetesclickhouse.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesclickhouse/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesclickhouse/v1alpha1/spec.proto";
import "shared/metadata.proto";

//kubernetes-click-house
message KubernetesClickHouse {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesClickHouse'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesClickHouseSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesClickHouseStatus status = 5;
}

//kubernetes-click-house status
message KubernetesClickHouseStatus {
  // outputs
  KubernetesClickHouseOutputs outputs = 1;
}
