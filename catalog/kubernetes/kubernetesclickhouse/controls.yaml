# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetesclickhouse
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: Table data rests on the PersistentVolumes the target cluster's storage class provisions (one per host, plus Keeper volumes); encryption at rest is a property of that storage (cloud-managed disks typically encrypt by default), owned by the cluster and its storage classes, not by this component.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Customer-managed keys for the underlying volumes are configured on the cluster's storage class or the cloud disk encryption set (see enc-at-rest); this spec has no seam for them.
    - control_id: enc-in-transit
      status: configurable
      field_path: files
      evidence:
        type: spec_default
        reference: The modules render plaintext ClickHouse interfaces on the fixed native (9000) and HTTP (8123) ports behind ClusterIP Services -- in-cluster traffic only. TLS is ClickHouse server configuration (certificates plus tcp_port_secure/https_port), deliverable through the raw config-file drop-ins in files and server settings in settings; the modules issue no certificates themselves.
      notes: auto_inter_node_secret (default true) authenticates distributed queries between the cluster's own hosts with an operator-generated shared secret -- authentication, not encryption. Mesh-level mTLS is a common alternative to in-server TLS for ClusterIP-only workloads.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The modules render no ingress or LoadBalancer resources -- every operator-generated Service (cluster-wide client, per-cluster, per-host headless) is ClusterIP, so the database is reachable solely inside the cluster network. External exposure composes from first-class kinds over the exported service_name.
    - control_id: restricted-ingress
      status: configurable
      field_path: users
      evidence:
        type: spec_default
        reference: Each user's networks list restricts the IPs/CIDRs it may connect from; a user declared without networks is normalized by the operator to a restrictive fence (the cluster's own pods by host_regexp, plus localhost), and the built-in default user stays passwordless but pod-network-restricted the same way.
      notes: Kubernetes NetworkPolicies (separate resources) restrict the network path itself; user networks govern ClickHouse's own accept/reject decisions.
    - control_id: edge-protection
      status: not_applicable
      notes: An OLAP database serves no public HTTP edge traffic -- the modules create no ingress and every Service is ClusterIP. Client access control is user networks and network policy (see restricted-ingress).
    - control_id: rbac
      status: configurable
      field_path: users
      evidence:
        type: spec_default
        reference: Access is governed by ClickHouse's SQL grant system, declared per user through grants, profiles, and quotas; access_management (runtime user/grant administration) is off unless explicitly reserved for an admin user. A user declared with NO grants receives ClickHouse's unrestricted config-file default -- grants must be declared to constrain a user, never to widen one.
      notes: The 02-production-replicated preset demonstrates the split -- a readonly analyst under a profile and quota, and an ingest user granted only SELECT/INSERT on its schema. Management-plane access (the ClickHouseInstallation itself) is governed by the target cluster's Kubernetes RBAC.
    - control_id: workload-identity
      status: not_applicable
      notes: This spec models no cloud-API access -- no backup object store, no external credential to federate. The only secrets in play are the provisioned users' passwords, delivered through a module-managed Kubernetes Secret.
    - control_id: no-legacy-auth
      status: enforced_by_default
      evidence:
        type: spec_default
        reference: Every provisioned user requires a password (a required spec field), delivered through a Kubernetes Secret and injected via valueFrom.secretKeyRef -- never plaintext in the CHI. The built-in default user stays passwordless but is operator-fenced to the cluster's own pods; passwordless named users are not provisioned by this kind.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The spec's user passwords are database credentials for clients on the native and HTTP query interfaces (including the bundled play console) -- workload access, not end-user sign-in; ClickHouse models no credential-strength policy for them.
    - control_id: audit-logging
      status: not_applicable
      notes: Server activity logs stream to the container filesystem (or the optional log_disk_size volume) for the cluster's log collector; a provider-style audit trail is not modeled in this spec. Changes to the cluster's own configuration are Kubernetes API operations, captured by the target cluster's audit policy.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The Altinity operator (a registry prerequisite of this kind) runs a metrics-exporter sidecar by default (its metrics.enabled defaults true) that serves Prometheus metrics for every managed cluster at the operator's metrics Service.
      notes: ClickHouse's own embedded Prometheus endpoint can additionally be configured per host through the settings map.
    - control_id: backup-recovery
      status: not_applicable
      notes: This spec models no backup mechanism. Replicas protect against volume and node loss but are not backups, and retain_volumes_on_delete preserves the live volumes through resource deletion rather than producing restorable copies. Backup tooling composes outside this kind.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups are modeled (see backup-recovery), so there is no retention to configure.
    - control_id: multi-zone-ha
      status: configurable
      field_path: replicas
      evidence:
        type: spec_default
        reference: replicas defaults to 1 (no redundancy -- a lost volume loses that shard's data); 2-3 keeps full copies of each shard in sync through ReplicatedMergeTree, and spread_replicas_across_nodes forces replicas of the same shard onto distinct Kubernetes nodes (the operator's ShardAntiAffinity).
      notes: The 02-production-replicated preset runs 3 replicas and the 03-sharded-analytics preset 2 replicas per shard, both with spread_replicas_across_nodes. The anti-affinity is node-scoped -- zone spreading is the cluster's node-pool topology.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Kubernetes nor the Altinity operator offers a deletion-protection flag on the ClickHouseInstallation; protection is operational (namespace RBAC, change review). retain_volumes_on_delete keeps the data volumes through deletion so a re-created same-name cluster re-attaches its data, and the operator-managed PodDisruptionBudget (pdb_max_unavailable, default 1) guards against voluntary eviction, not deletion.
    - control_id: managed-patching
      status: configurable
      field_path: version
      evidence:
        type: spec_default
        reference: version is required and pinned -- upgrades are deliberate spec changes, never implicit. Changing it makes the operator roll the new image through every host StatefulSet; the managed Keeper's image follows the same version line.
      notes: Pinning is the point -- the operator's own fallback is the floating latest tag, which the spec contract refuses.
