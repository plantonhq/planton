apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesdaemonset
spec:
  # A DaemonSet creates no Service, HPA, or PDB — the importable surface is
  # the DaemonSet itself, the optional namespace, and the env Secret. The
  # Secret carries a fixed suffix ("-env-secrets") that the schema cannot
  # derive mechanically, so it falls back to guided entry.
  values:
    - name: daemon_set_name
      derivations:
        - from_output: daemon_set_name
        - from_metadata_name: true
      where_to_find: >-
        `kubectl get daemonsets -A` (NAME column).
    - name: daemon_set_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `kubectl get daemonsets -A` (NAMESPACE column).
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the workload's namespace.
    - name: secret_name
      where_to_find: >-
        `kubectl get secrets -n <namespace>` — named
        "<metadata.name>-env-secrets"; only present when the spec carries
        literal secret env values.
    - name: secret_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same namespace as the workload.
