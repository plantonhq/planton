syntax = "proto3";

package dev.planton.kubernetes.kubernetesclusterautoscaler.v1alpha1;

// KubernetesClusterAutoscalerOutputs captures observable outputs after
// the Cluster Autoscaler is installed on the target cluster.
message KubernetesClusterAutoscalerOutputs {
  // Namespace the autoscaler was installed into (the resolved
  // spec.namespace).
  string namespace = 1;

  // Helm release name — fixed "cluster-autoscaler" (one installation per
  // cluster; the leader-elected autoscaler owns the cluster-wide scaling
  // decision).
  string release_name = 2;

  // Name of the autoscaler's Kubernetes service account — the subject
  // cloud-side keyless bindings (IRSA trust policies, GCP WI bindings,
  // Azure federated credentials) are written against.
  string service_account_name = 3;
}
