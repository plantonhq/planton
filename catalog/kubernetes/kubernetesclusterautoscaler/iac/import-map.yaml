apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesclusterautoscaler
spec:
  # The Cluster Autoscaler installs as ONE Helm release whose name is fixed
  # to "cluster-autoscaler" (the leader-elected autoscaler owns the
  # cluster-wide scaling decision — one installation per cluster), in the
  # spec's namespace (kube-system by upstream convention, or a dedicated
  # module-created namespace).
  values:
    - name: release_name
      derivations:
        - from_output: release_name
      where_to_find: >-
        Always "cluster-autoscaler" — the module fixes the release name.
        Confirm with `helm list -n <namespace>` (NAME column).
    - name: release_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `helm list -A` (NAMESPACE column).
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the installation
        namespace itself.
