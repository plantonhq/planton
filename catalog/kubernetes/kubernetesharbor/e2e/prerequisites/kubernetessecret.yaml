# Consumer-scoped S3-identity Secret fixture for the KubernetesHarbor
# composed-storage lane — the declared-identity contract of the
# KubernetesSeaweedFs fixture's `s3.existing_config_secret`:
# - JOINS the fixture-owned namespace (the CNPG fixture deploys first
#   with create_namespace and owns e2e-harbor).
# - The key set MIRRORS the chart-generated `<name>-s3-secret` shape at
#   the pin (chart 4.40.0 renders BOTH the flat credential keys and the
#   `seaweedfs_s3_config` identities JSON): the gateway consumes ONLY
#   `seaweedfs_s3_config` (`-s3.config=/etc/sw/seaweedfs_s3_config`),
#   while the flat keys keep the Secret drop-in compatible with every
#   consumer of the generated shape — the output's documented key
#   contract and the S3 verifier's admin-credential read included.
# - The identities carry KNOWN credentials so the Harbor scenario can
#   declare the SAME admin key pair on its storage arm — the
#   declare-on-both-sides recipe for composing against a store whose
#   identities are user-owned.
# - Letters-only credential values BY DESIGN (the env-parsed credential
#   class: structural characters crash config parsers intermittently).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesSecret
metadata:
  name: e2e-harbor-s3cfg
spec:
  name: e2e-harbor-s3cfg
  namespace:
    value: e2e-harbor
  opaque:
    data:
      admin_access_key_id: "e2eharboraccesskeyid"
      admin_secret_access_key: "e2eharborsecretaccesskeyfortheobjectlane"
      read_access_key_id: "e2eharborreadaccesskeyy"
      read_secret_access_key: "e2eharborreadsecretaccesskeyforthislanee"
      seaweedfs_s3_config: '{"identities":[{"name":"e2eAdmin","credentials":[{"accessKey":"e2eharboraccesskeyid","secretKey":"e2eharborsecretaccesskeyfortheobjectlane"}],"actions":["Admin","Read","List","Tagging","Write"]},{"name":"e2eReadOnly","credentials":[{"accessKey":"e2eharborreadaccesskeyy","secretKey":"e2eharborreadsecretaccesskeyforthislanee"}],"actions":["Read","List"]}]}'
