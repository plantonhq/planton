syntax = "proto3";

package dev.planton.kubernetes.kubernetesharbor.v1alpha1;

import "catalog/kubernetes/kubernetesharbor/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// harbor-kubernetes iac-input
message KubernetesHarborIacInput {
  // target infra-component
  KubernetesHarbor target = 1;
  // provider-credential
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
  // kubernetes namespace
  string kubernetes_namespace = 3;
}
