syntax = "proto3";

package dev.planton.kubernetes.kubernetesharbor.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesharbor/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesharbor/v1alpha1/spec.proto";
import "shared/metadata.proto";

/**
 * **KubernetesHarbor** deploys Harbor — the CNCF-graduated container
 * registry with policy-driven artifact management, vulnerability
 * scanning, and content signing — from the official Helm chart.
 */
message KubernetesHarbor {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesHarbor'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesHarborSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesHarborStatus status = 5;
}

// harbor-kubernetes status
message KubernetesHarborStatus {
  // outputs
  KubernetesHarborOutputs outputs = 1;
}
