# One ConfigMap source mounted as a directory from the flag-file fixture,
# plus the PodDisruptionBudget the verifier proves selects flagd's pods.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesFlagd
metadata:
  name: e2e-flagd-min
  annotations:
    planton.dev/e2e-prerequisites: KubernetesFlagdFlagFile
spec:
  namespace:
    value: e2e-flagd
  createNamespace: false
  pdb:
    enabled: true
  sources:
    - configMap:
        configMapName:
          valueFrom:
            kind: KubernetesFlagdFlagFile
            name: e2e-flagd-flags
            fieldPath: status.outputs.config_map_name
        key:
          valueFrom:
            kind: KubernetesFlagdFlagFile
            name: e2e-flagd-flags
            fieldPath: status.outputs.key
