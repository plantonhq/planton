syntax = "proto3";

package dev.planton.kubernetes.kubernetesflagd.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesflagd/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesflagd/v1alpha1/spec.proto";
import "shared/metadata.proto";

//flagd-kubernetes
message KubernetesFlagd {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesFlagd'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesFlagdSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesFlagdStatus status = 5;
}

//flagd-kubernetes status.
message KubernetesFlagdStatus {
  //outputs
  KubernetesFlagdOutputs outputs = 1;
}
