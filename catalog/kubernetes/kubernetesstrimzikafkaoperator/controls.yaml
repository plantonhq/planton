# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetesstrimzikafkaoperator
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The operator stores no data of its own -- its state is the custom resources it reconciles, held in the cluster's etcd. Kafka data at rest is a property of the volumes the managed clusters provision, owned by KubernetesKafka resources and the cluster's storage classes.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to key (see enc-at-rest); customer-managed keys for broker volumes are configured on the target cluster's storage classes.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The spec models no TLS seam for the operator itself -- its traffic is the Kubernetes API, TLS by construction. Listener TLS for the managed Kafka clusters (which the operator provisions from its generated cluster CAs) is declared per cluster on KubernetesKafka resources. kubernetes_service_dns_domain matters here indirectly -- a wrong domain produces broker certificates whose SANs do not match the advertised service names.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The modules render no external exposure -- the chart creates no Service, ingress, or LoadBalancer for the operator (its only workload is the controller Deployment), and the spec offers no exposure seam.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The operator serves no inbound traffic to restrict. It generates NetworkPolicy resources FOR the Kafka clusters it manages (generate_network_policy, default true) -- that posture rides the operand clusters.
    - control_id: edge-protection
      status: not_applicable
      notes: A cluster-internal controller serves no HTTP edge traffic -- web application firewalls do not apply.
    - control_id: rbac
      status: configurable
      field_path: watch.any_namespace
      evidence:
        type: spec_default
        reference: False (the chart default) keeps the operator's rights namespace-scoped -- it watches its own namespace, or the explicit watch.namespaces fence, with RoleBindings templated into each watched namespace; true grants cluster-wide RBAC so one operator manages Kafka clusters in every namespace.
      notes: The 02-cluster-wide preset takes the cluster-wide posture from a dedicated control-plane namespace; 03-fenced-teams fences the operator to two team namespaces. create_global_resources (default true) governs the fixed-name ClusterRoles a second install would conflict on.
    - control_id: workload-identity
      status: not_applicable
      notes: The operator calls no cloud APIs -- it authenticates to the Kubernetes API with its ServiceAccount; there is no cloud identity to federate.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The operator exposes no authentication surface of its own -- no credentials, no user-facing endpoint. Kafka client authentication (TLS, SCRAM) is declared on KubernetesKafka listeners and KubernetesKafkaUser resources.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: The operator's actions are Kubernetes API operations -- creating StatefulSets, Services, Secrets, and ConfigMaps for managed clusters -- captured by the target cluster's audit policy; log_level tunes its own diagnostic logging, not an audit trail.
    - control_id: monitoring-integration
      status: not_applicable
      notes: This spec models no metrics seam for the operator -- scrape wiring for the operator's own metrics rides the helm_values chart surface, and metrics for managed Kafka clusters (exporters, Cruise Control) are declared on KubernetesKafka resources.
    - control_id: backup-recovery
      status: not_applicable
      notes: The operator holds no data to back up; its own configuration is this manifest, re-appliable at any time. Kafka data protection (replication, tiered storage, mirroring) is declared on the operand resources.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist at this layer (see backup-recovery).
    - control_id: multi-zone-ha
      status: configurable
      field_path: replicas
      evidence:
        type: spec_default
        reference: replicas defaults to 1; extra replicas are leader-elected warm standbys (leader_election_enabled, default true -- exactly one replica reconciles at a time) that shorten failover of the operator itself.
      notes: An operator outage pauses reconciliation only -- managed Kafka clusters keep serving. All three presets run one replica.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Kubernetes nor the chart offers a deletion-protection flag on the release. The blast radius of deletion is deliberately bounded upstream -- the Strimzi CRDs ship in the chart's Helm-native crds/ directory, which Helm never deletes on uninstall, so removing the operator never cascade-deletes Kafka clusters. The operator registers no admission webhooks and creates no cluster-scoped singletons at runtime (verified in the operator source, per the module).
    - control_id: managed-patching
      status: configurable
      field_path: chart_version
      evidence:
        type: spec_default
        reference: Unset installs the pinned default chart (1.1.0 -- chart and operator versions move together); upgrades are deliberate chart_version changes. KNOW THE CRD LAG -- Helm's crds/ posture leaves CRDs at their installed versions across upgrades, so new operator code runs against existing CRDs; apply the new release's CRDs manually when its release notes call for it (Strimzi minor upgrades regularly add CRD fields).
