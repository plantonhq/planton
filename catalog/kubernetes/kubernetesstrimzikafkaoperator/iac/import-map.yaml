apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesstrimzikafkaoperator
spec:
  # The Strimzi cluster operator installs as one Helm release NAMED AFTER
  # metadata.name, plus the optional anchor namespace. A second operator
  # in one cluster is the fenced-watch shape (create_global_resources
  # false); the release name is never a fixed chart name.
  values:
    - name: release_name
      derivations:
        - from_output: release_name
        - from_metadata_name: true
      where_to_find: >-
        `helm list -n <namespace>` (NAME column) — the release shares the
        resource's name.
    - name: release_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `helm list -A` (NAMESPACE column); conventionally "strimzi-system".
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the installation
        namespace itself.
