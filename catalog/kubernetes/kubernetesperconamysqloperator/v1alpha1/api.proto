syntax = "proto3";

package dev.planton.kubernetes.kubernetesperconamysqloperator.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesperconamysqloperator/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesperconamysqloperator/v1alpha1/spec.proto";
import "shared/metadata.proto";

//kubernetes-percona-mysql-operator-kubernetes
message KubernetesPerconaMysqlOperator {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesPerconaMysqlOperator'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesPerconaMysqlOperatorSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesPerconaMysqlOperatorStatus status = 5;
}

//kubernetes-percona-mysql-operator-kubernetes status
message KubernetesPerconaMysqlOperatorStatus {
  //outputs
  KubernetesPerconaMysqlOperatorOutputs outputs = 1;
}
