apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesargocd
spec:
  # Argo CD installs as one Helm release NAMED AFTER metadata.name
  # (fullnameOverride pins every child name the same way), plus the
  # optional anchor namespace. The initial admin password Secret is
  # APPLICATION-owned — Argo CD itself creates `argocd-initial-admin-
  # secret` at first start; it never enters either engine's state, so it
  # travels with the running install and needs NO import row.
  values:
    - name: release_name
      derivations:
        - from_output: release_name
        - from_metadata_name: true
      where_to_find: >-
        `helm list -n <namespace>` (NAME column) — the release shares the
        resource's name.
    - name: release_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `helm list -A` (NAMESPACE column).
    # ── the optional anchor namespace ────────────────────────────────────
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the installation
        namespace itself.
