syntax = "proto3";

package dev.planton.kubernetes.kubernetesargocd.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesargocd/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesargocd/v1alpha1/spec.proto";
import "shared/metadata.proto";

//argocd-kubernetes
message KubernetesArgocd {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesArgocd'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesArgocdSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesArgocdStatus status = 5;
}

//argocd-kubernetes status.
message KubernetesArgocdStatus {
  //outputs
  // argocd-kubernetes outputs
  KubernetesArgocdOutputs outputs = 1;
}
