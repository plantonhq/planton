# The kind defaults on their own: a single node on a PVC,
# unauthenticated (the upstream default posture) — the verifier proves the
# live vector round-trip (collection create → upsert → similarity search).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesQdrant
metadata:
  name: e2e-qdrant-min
spec:
  namespace:
    value: e2e-qdrant-min
  create_namespace: true
