# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetesqdrant
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: Vectors, payloads, and the write-ahead log rest on the PersistentVolumes the target cluster's storage class provisions; encryption at rest is a property of that storage, owned by the cluster and its storage classes, not by this component.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Customer-managed keys for the underlying volumes are configured on the cluster's storage class or the cloud disk encryption set (see enc-at-rest); this spec has no seam for them.
    - control_id: enc-in-transit
      status: configurable
      field_path: tls
      evidence:
        type: spec_default
        reference: Empty serves plaintext in-cluster; tls.secret serves the REST (6333) and gRPC (6334) listeners over TLS from an existing kubernetes.io/tls Secret -- the cert-manager seam (reference a KubernetesCertificate).
      notes: Inter-node p2p TLS is a separate upstream surface (config.cluster.p2p) and rides the helm_values escape hatch. TLS can also compose at the exposure layer.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The service stays ClusterIP -- the spec has no service-type field at all; external exposure composes from first-class kinds (KubernetesIngress, Gateway API) over the exported service handle, never from this component.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The spec has no seam restricting which network sources may connect; access control is API-key authentication (see rbac) and Kubernetes NetworkPolicies composed as separate resources.
    - control_id: edge-protection
      status: not_applicable
      notes: A vector database serves no HTTP edge traffic of its own -- its REST listener is exposed only through composed exposure kinds, where request filtering lives.
    - control_id: rbac
      status: configurable
      field_path: api_key
      evidence:
        type: spec_default
        reference: Empty means the listeners accept unauthenticated requests (the upstream default -- private dev clusters only). Declaring api_key requires a read-write key, and read_only_api_key adds a second key for query-only consumers -- a leaked retrieval credential then cannot mutate collections. Keys are generated by the chart or read from existing Secrets; key material never lands in rendered Helm values.
      notes: This is two-tier key access, not per-user role management. The 02-production-cluster preset generates both keys; 01-dev-single-node deliberately runs unauthenticated.
    - control_id: workload-identity
      status: not_applicable
      notes: The component reaches no cloud APIs -- there is no object-store or other cloud surface to authenticate, so there is nothing to federate a workload identity for.
    - control_id: no-legacy-auth
      status: configurable
      field_path: api_key
      evidence:
        type: spec_default
        reference: Unset leaves the upstream unauthenticated posture; declaring api_key closes it. The spec's own validation rejects a read_only_api_key without api_key -- an unauthenticated cluster with a read-only key would protect nothing, since writes would stay open.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The packaged web dashboard and API admit holders of the spec-modeled api_key -- a service credential presented by clients, not end-user sign-in; Qdrant has no user accounts or credential-strength policy to enforce.
    - control_id: audit-logging
      status: not_applicable
      notes: No audit trail is modeled -- server logs stream to stdout for the cluster's log collector. Changes to the release itself are Kubernetes API operations, captured by the target cluster's audit policy.
    - control_id: monitoring-integration
      status: configurable
      field_path: service_monitor_enabled
      evidence:
        type: spec_default
        reference: False by default (the chart default); true creates a ServiceMonitor so a Prometheus Operator scrapes /metrics (requires the Prometheus Operator CRDs on the cluster).
      notes: The 02-production-cluster preset enables it.
    - control_id: backup-recovery
      status: not_applicable
      notes: No automated backup is modeled -- the snapshots volume only provisions dedicated space for Qdrant's snapshot files; creating and restoring snapshots are data-plane operations through the Qdrant API, not scheduled by this spec. Volume snapshots are the cluster's storage-class concern.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No automated backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: configurable
      field_path: replicas
      evidence:
        type: spec_default
        reference: 1 by default (a one-member cluster -- distributed mode is always on, so growing later is only a replicas change); 3 forms a Raft quorum that survives one member loss, and scheduling.pod_anti_affinity spreads members across hostnames so a node loss takes one member, not the quorum.
      notes: Zone-level spreading needs the chart's topology fields through helm_values -- the typed anti-affinity spreads across hostnames. Collections additionally replicate per their own replication_factor, a data operation.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Kubernetes nor the chart offers a deletion-protection flag on the release; protection is operational (namespace RBAC, change review).
    - control_id: managed-patching
      status: configurable
      field_path: chart_version
      evidence:
        type: spec_default
        reference: chart_version defaults to the module's pin (1.18.2 -- the chart version tracks the Qdrant release it ships); upgrading is a deliberate act of changing the pin, which re-runs the release with the new chart.
