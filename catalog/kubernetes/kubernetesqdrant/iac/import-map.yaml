apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesqdrant
spec:
  # Qdrant installs as one Helm release NAMED AFTER metadata.name
  # (fullnameOverride pins the Service, `-headless`, the ConfigMap, and
  # the chart-owned `<name>-apikey` Secret the same way), plus the
  # optional anchor namespace. API-key material is CHART-owned (its Secret
  # travels with the release import) — the module materializes no Secrets
  # of its own.
  values:
    - name: release_name
      derivations:
        - from_output: release_name
        - from_metadata_name: true
      where_to_find: >-
        `helm list -n <namespace>` (NAME column) — the release shares the
        resource's name.
    - name: release_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `helm list -A` (NAMESPACE column).
    # ── the optional anchor namespace ────────────────────────────────────
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the installation
        namespace itself.
