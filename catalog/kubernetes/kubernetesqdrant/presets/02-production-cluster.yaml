apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesQdrant
metadata:
  name: prod-qdrant
spec:
  namespace:
    value: qdrant
  create_namespace: true
  # 3 nodes: the quorum posture — Raft survives one member loss.
  # Pod 0 bootstraps consensus; the others join over p2p (6335).
  # Collections still replicate per their own replication_factor
  # (declared through the Qdrant API when the collection is created)
  # — 3 pods make room for replicas, they do not create them.
  replicas: 3
  # Generated keys: the chart creates each key ONCE at first install
  # (stable across upgrades) and keeps it in its own
  # <name>-apikey Secret — key `api-key` (read-write) /
  # `read-only-api-key`. Key material never lands in rendered Helm
  # values; the Secret name is in the outputs. Hand the
  # read-only key to query-side consumers so a leaked retrieval
  # credential cannot mutate collections.
  api_key:
    generate: true
  read_only_api_key:
    generate: true
  # Memory is the capacity bound: Qdrant keeps hot segments and HNSW
  # indexes in RAM. Size requests for the vectors you plan to hold
  # PER NODE (collection replicas spread the corpus, they do not
  # shrink it).
  resources:
    requests:
      cpu: "1"
      memory: 8Gi
    limits:
      cpu: "2"
      memory: 8Gi
  # PER-POD data volume: vectors, payloads, write-ahead log.
  storage:
    size: 50Gi
    # Literal class name shown; the field also accepts a valueFrom
    # reference to a KubernetesStorageClass resource.
    storage_class:
      value: <fast-ssd-storage-class>
  # Separate snapshots volume, sized like storage — upstream's
  # recommendation: snapshots (backups, snapshot shard transfers)
  # written onto the data volume can fill it and crash the node. The
  # default StorageClass applies here; cold storage is a good fit if
  # the cluster offers one.
  snapshots:
    size: 50Gi
  # Required anti-affinity across hostnames: every member on a
  # different node, so one node loss takes one member — not the
  # quorum. Chart default is none; from 2 replicas up this is the
  # production posture.
  scheduling:
    pod_anti_affinity: true
  # ServiceMonitor for /metrics — requires the Prometheus Operator
  # CRDs in the cluster.
  service_monitor_enabled: true
