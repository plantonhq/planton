apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesQdrant
metadata:
  name: dev-qdrant
spec:
  namespace:
    value: dev-qdrant
  create_namespace: true
  # Everything else is the kind's defaults: replicas 1 (still a
  # one-member cluster — distributed mode is always on, so growing
  # later is only a replicas change), the pinned chart version, the
  # official image at the chart's appVersion.
  #
  # NO api_key: the listeners accept unauthenticated requests — the
  # upstream default, acceptable ONLY on a private dev cluster inside
  # a namespace boundary. Declare a key before anything real depends
  # on this instance.
  #
  # Small volume for a dev corpus; the spec default is 10Gi. The
  # cluster's default StorageClass applies (no storage_class set).
  storage:
    size: 5Gi
