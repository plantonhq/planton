syntax = "proto3";

package dev.planton.kubernetes.kuberneteskarpenterec2nodeclass.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kuberneteskarpenterec2nodeclass/v1alpha1/outputs.proto";
import "catalog/kubernetes/kuberneteskarpenterec2nodeclass/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesKarpenterEc2NodeClass declares a Karpenter EC2NodeClass — the
// AWS machine template (AMIs, subnets, security groups, IAM identity, disk
// layout, kubelet and IMDS posture) that KubernetesKarpenterNodePool
// resources launch instances from. Requires a Karpenter installation
// (KubernetesKarpenter) on the cluster.
message KubernetesKarpenterEc2NodeClass {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesKarpenterEc2NodeClass'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesKarpenterEc2NodeClassSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesKarpenterEc2NodeClassStatus status = 5;
}

// KubernetesKarpenterEc2NodeClassStatus holds the deployment status and
// outputs.
message KubernetesKarpenterEc2NodeClassStatus {
  // outputs
  KubernetesKarpenterEc2NodeClassOutputs outputs = 1;
}
