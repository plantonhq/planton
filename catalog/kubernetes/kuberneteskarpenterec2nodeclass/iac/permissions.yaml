# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: kuberneteskarpenterec2nodeclass
spec:
  kubernetes:
    rules:
      - api_groups:
          - karpenter.k8s.aws
        resources:
          - ec2nodeclasses
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubectl_manifest.ec2_node_class -- the module's only resource, applying one EC2NodeClass (karpenter.k8s.aws/v1, cluster-scoped) via server-side apply. The AWS-side permissions to launch instances belong to the Karpenter controller's own identity, not to the IaC runner.
      - api_groups:
          - karpenter.k8s.aws
        resources:
          - ec2nodeclasses
        verbs:
          - list
          - watch
        cluster_scoped: true
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the EC2NodeClass in main.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
