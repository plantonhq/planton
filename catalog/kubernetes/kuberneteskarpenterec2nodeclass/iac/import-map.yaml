apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kuberneteskarpenterec2nodeclass
spec:
  # One kubectl_manifest applying the Karpenter EC2NodeClass CR. The
  # composed import ID is apiVersion//kind//name — apiVersion and kind are
  # constants of this module (it renders exactly one GVK), declared as
  # literals. EC2NodeClass is cluster-scoped, so the optional namespace
  # segment drops.
  values:
    - name: api_version
      derivations:
        - literal: karpenter.k8s.aws/v1
      where_to_find: >-
        Always "karpenter.k8s.aws/v1" — the module pins the served
        EC2NodeClass version.
    - name: kind
      derivations:
        - literal: EC2NodeClass
      where_to_find: Always "EC2NodeClass" — the CR kind this module applies.
    - name: name
      derivations:
        - from_metadata_name: true
        - from_output: node_class_name
      where_to_find: >-
        The EC2NodeClass's metadata.name (equals the Planton resource name)
        — `kubectl get ec2nodeclasses` (NAME column).
    - name: namespace
      where_to_find: >-
        Not applicable — EC2NodeClass is cluster-scoped, so the composed
        import ID has no namespace segment (the optional [//{namespace}]
        group drops).
