syntax = "proto3";

package dev.planton.kubernetes.kubernetestelemetry.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetestelemetry/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetestelemetry/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesTelemetry is an Istio Telemetry resource: a namespaced configuration of
// how traces, metrics, and access logs are generated for the workloads it selects.
message KubernetesTelemetry {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesTelemetry'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesTelemetrySpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesTelemetryStatus status = 5;
}

// KubernetesTelemetryStatus holds the deployment status and outputs.
message KubernetesTelemetryStatus {
  // outputs
  KubernetesTelemetryOutputs outputs = 1;
}
