apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetestelemetry
spec:
  # One kubectl_manifest applying the Istio Telemetry CR. The composed import ID
  # is apiVersion//kind//name//namespace — apiVersion and kind are constants
  # of this module (it renders exactly one GVK), declared as literals.
  values:
    - name: api_version
      derivations:
        - literal: telemetry.istio.io/v1
      where_to_find: >-
        Always "telemetry.istio.io/v1" — the module pins the served version.
    - name: kind
      derivations:
        - literal: Telemetry
      where_to_find: Always "Telemetry" — the CR kind this module applies.
    - name: name
      derivations:
        - from_metadata_name: true
        - from_output: telemetry_name
      where_to_find: >-
        The Telemetry's metadata.name (equals the Planton resource name) —
        `kubectl get telemetries -A` (NAME column).
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The namespace the resource lives in — `kubectl get telemetries -A`
        (NAMESPACE column).
