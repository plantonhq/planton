# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetestelemetry
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A telemetry configuration stores no data beyond its own definition in the cluster's etcd; the signals it configures land in observability backends whose storage posture is owned there.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Nothing is stored here, so no key could apply (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: The object serves no traffic; how the proxies ship spans, metrics, and logs to providers is defined by the mesh's provider configuration (MeshConfig extension providers), outside this spec.
    - control_id: no-public-access
      status: not_applicable
      notes: A configuration object is not a network endpoint; it exists only at the Kubernetes API.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No inbound network path exists to restrict.
    - control_id: edge-protection
      status: not_applicable
      notes: No HTTP traffic is served; there is nothing for a request filter to protect.
    - control_id: rbac
      status: not_applicable
      notes: Who may create or change the Telemetry resource is the target cluster's Kubernetes RBAC on the CR; the object grants nothing itself. Worth a reviewer's eye -- a resource in the mesh root namespace with no selector or target_refs configures the WHOLE mesh.
    - control_id: workload-identity
      status: not_applicable
      notes: The object calls no cloud APIs; providers are named references resolved by istiod against MeshConfig.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The object performs no authentication; there is no auth path, legacy or otherwise, to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: configurable
      field_path: access_logging
      evidence:
        type: spec_default
        reference: access_logging entries choose providers, enable or disable log generation for the selected workloads, and attach a CEL filter selecting which requests and connections are logged; unset defers to the mesh default logging provider and parent-scope configuration.
      notes: This is data-plane ACCESS logging -- who connected to the selected workloads -- generated by the proxies, not a management-plane audit trail; changes to the Telemetry resource itself are Kubernetes API operations under the target cluster's audit policy. A disabled=true entry can silence access logs, so review disablement like any logging change.
    - control_id: monitoring-integration
      status: configurable
      field_path: metrics
      evidence:
        type: spec_default
        reference: metrics entries choose providers and apply ordered overrides (enable or disable a metric, add or remove tag dimensions) to what the proxies generate for the selected workloads; unset defers to the mesh default metrics provider.
      notes: tracing and access_logging are the sibling signal arms -- the 01-mesh-tracing-sampling preset sets a tracing sampling rate, and 02-prometheus-metric-dimensions tunes metric dimensions. Overrides can also DISABLE metrics, so the same field that integrates monitoring can reduce it -- review disablement deliberately.
    - control_id: backup-recovery
      status: not_applicable
      notes: A declarative object the IaC modules recreate from its manifest; there is no data to back up.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: A configuration object has no replicas or failure domains; the proxies applying it run with their workloads.
    - control_id: deletion-protection
      status: not_applicable
      notes: Kubernetes offers no deletion-protection flag on the CR. Deleting it reverts the selected workloads to parent-scope or mesh-default telemetry behavior -- protection is operational (namespace RBAC, change review).
    - control_id: managed-patching
      status: not_applicable
      notes: No software runs here; istiod and the proxies that consume this configuration are patched through their own components.
