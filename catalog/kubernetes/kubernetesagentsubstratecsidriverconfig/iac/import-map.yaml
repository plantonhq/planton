apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesagentsubstratecsidriverconfig
spec:
  # One kubectl_manifest applying the CSIDriverConfig. The composed import ID
  # is apiVersion//kind//name — apiVersion and kind are constants of this
  # module (it renders exactly one GVK), declared as literals.
  # CSIDriverConfig is cluster-scoped, so the optional namespace segment
  # drops.
  values:
    - name: api_version
      derivations:
        - literal: ate.dev/v1
      where_to_find: >-
        Always "ate.dev/v1" — the module pins the served CSIDriverConfig
        version.
    - name: kind
      derivations:
        - literal: CSIDriverConfig
      where_to_find: Always "CSIDriverConfig" — the CR kind this module applies.
    - name: name
      derivations:
        - from_output: driver_name
        - from_spec_field: name
      where_to_find: >-
        The CSIDriverConfig's metadata.name, which equals the driver's name —
        `kubectl get csidriverconfigs` (NAME column).
    - name: namespace
      where_to_find: >-
        Not applicable — CSIDriverConfig is cluster-scoped, so the composed
        import ID has no namespace segment (the optional [//{namespace}] group
        drops).
