# Every field: the object's labels and annotations, a Controller endpoint,
# a node socket override and TLS through Substrate's pod identity -- upstream's
# own hostpath driver registration (cmd/ate-setup/internal/steps/csi.go at
# v0.6.0). The verifier reads every field back from the live object.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAgentSubstrateCsiDriverConfig
metadata:
  name: e2e-asubcsi-full
  annotations:
    planton.dev/e2e-cluster-profile: "pod-certificates"
spec:
  name: hostpath.csi.k8s.io
  labels:
    team: storage
  annotations:
    planton.dev/e2e-note: full-surface
  driverName: hostpath.csi.k8s.io
  controllerEndpoint: tcp://csi-hostpath-controller.default.svc.cluster.local:50051
  nodeSocketOverride: unix:///var/lib/kubelet/plugins/csi-hostpath/csi.sock
  tls:
    enabled: true
    usePodIdentity: true
    serverName: csi-hostpath-controller.default.svc
