# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetespoddisruptionbudget
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A PodDisruptionBudget stores no data -- it is a policy object in etcd, whose encryption is owned by the target cluster.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: With nothing stored (see enc-at-rest), there is no at-rest key to manage.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The budget carries no traffic -- it is consulted by the eviction API inside the control plane. Transit encryption belongs to the protected workloads.
    - control_id: no-public-access
      status: not_applicable
      notes: A budget has no network endpoint to expose; it constrains eviction decisions, not reachability.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The budget governs voluntary evictions, not network traffic. Ingress restriction for the protected pods is NetworkPolicy -- a separate kind.
    - control_id: edge-protection
      status: not_applicable
      notes: The budget serves no requests -- web application firewalls do not apply.
    - control_id: rbac
      status: not_applicable
      notes: Access to the budget object is governed by the target cluster's Kubernetes RBAC; the spec defines no access-control surface of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: A budget authenticates to no cloud API -- it is configuration consulted by the Kubernetes eviction API.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The budget performs no authentication; there is no legacy authentication path to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Changes to the budget, and the evictions it blocks or admits, are Kubernetes API operations captured by the target cluster's audit policy.
    - control_id: monitoring-integration
      status: not_applicable
      notes: A policy object emits no operational metrics of its own; disruption status is reported on the object by the controller and scraped, where desired, from the cluster's control-plane metrics.
    - control_id: backup-recovery
      status: not_applicable
      notes: There is no data to back up -- the budget is fully described by its declarative spec, re-appliable at any time.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: With no backups (see backup-recovery), there is no retention length to configure.
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The budget runs nothing and replicates nothing -- it preserves a floor of pods during VOLUNTARY disruptions (drains, upgrades, autoscaler consolidation) but cannot create replicas or spread them across zones; replication and zone spread belong to the protected workload's own spec. Involuntary failures are not governed at all.
    - control_id: deletion-protection
      status: not_applicable
      notes: Kubernetes offers no deletion-protection flag on PodDisruptionBudget objects. Deleting the budget removes the eviction floor -- drains then proceed unconstrained -- so protection is operational (namespace RBAC, change review).
    - control_id: managed-patching
      status: not_applicable
      notes: There is no software to patch -- the budget is configuration consulted by the cluster's eviction API, patched with the cluster.
