syntax = "proto3";

package dev.planton.kubernetes.kubernetespoddisruptionbudget.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetespoddisruptionbudget/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetespoddisruptionbudget/v1alpha1/spec.proto";
import "shared/metadata.proto";

/**
 * **KubernetesPodDisruptionBudget** defines a Kubernetes PodDisruptionBudget
 * resource following the Kubernetes Resource Model (KRM). A budget limits how
 * many of the selected pods may be voluntarily disrupted at once (node
 * drains, upgrades, autoscaler consolidation), protecting availability during
 * cluster maintenance.
 */
message KubernetesPodDisruptionBudget {
  // API version for this resource.
  // Always set to "kubernetes.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "kubernetes.planton.dev/v1alpha1"];

  // Resource kind identifier.
  // Always set to "KubernetesPodDisruptionBudget".
  string kind = 2 [(buf.validate.field).string.const = "KubernetesPodDisruptionBudget"];

  // Metadata for the PodDisruptionBudget resource.
  // Includes standard fields like name, organization, environment, etc.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Specification of the desired state for the PodDisruptionBudget.
  // Defines the protected pod selection and the availability bound.
  KubernetesPodDisruptionBudgetSpec spec = 4 [(buf.validate.field).required = true];

  // Status of the PodDisruptionBudget resource.
  // Contains outputs populated after deployment.
  KubernetesPodDisruptionBudgetStatus status = 5;
}

/**
 * **KubernetesPodDisruptionBudgetStatus** captures the runtime status of a
 * PodDisruptionBudget deployment, including the outputs generated after the
 * budget is created.
 */
message KubernetesPodDisruptionBudgetStatus {
  // Outputs from the PodDisruptionBudget deployment.
  // Contains the budget name and namespace.
  KubernetesPodDisruptionBudgetOutputs outputs = 1;
}
