# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: kubernetesmongodb
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubernetes_namespace_v1.namespace -- created and owned only when spec.create_namespace is true; get is needed for refresh either way. delete applies only to module-owned namespaces.
      - api_groups:
          - ""
        resources:
          - secrets
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers kubernetes_secret_v1.user_password_secret (`<name>-user-<username>`, one per declared user password) and kubernetes_secret_v1.backup_credentials_secret (`<name>-backup-<storage>`, one per backup storage with declared static credentials -- keyless arms create no Secret). All namespace-scoped to the database's namespace.
      - api_groups:
          - psmdb.percona.com
        resources:
          - perconaservermongodbs
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers kubectl_manifest.mongodb -- the PerconaServerMongoDB CR (psmdb.percona.com/v1) applied via server-side apply. The member StatefulSets, Services, system-users Secret, mongos deployment, and PBM agents are created by the Percona operator reconciling this CR, under the operator's own RBAC -- the runner touches only the CR.
      - api_groups:
          - psmdb.percona.com
        resources:
          - perconaservermongodbrestores
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        condition:
          spec_field_set: restore
        notes: Covers kubectl_manifest.restore (Terraform) and createRestore in restore.go (Pulumi) -- the PerconaServerMongoDBRestore run (psmdb.percona.com/v1), rendered only when spec.restore is set and applied after the cluster reports ready. list and watch serve the Pulumi provider's delete wait -- pulumi-kubernetes v4.33.0 watches a deleted object's kind until it is gone (provider/pkg/await/await.go:984-1006, condition/deleted.go:69-96), and without them a destroy hangs.
      - api_groups:
          - psmdb.percona.com
        resources:
          - perconaservermongodbs
        verbs:
          - list
          - watch
        cluster_scoped: false
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the PerconaServerMongoDB in cluster.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. The readiness wait on the PerconaServerMongoDB in cluster.go reads perconaservermongodbs at metadata/overrides.go:112-160, condition/jsonpath.go:26-34 before it starts its timeout. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
      - api_groups:
          - ""
        resources:
          - events
          - secrets
        verbs:
          - list
          - watch
        cluster_scoped: false
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Secret in secrets.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing. Events are read differently. While it waits on the PerconaServerMongoDB in cluster.go, the provider also watches the object's events, at await.go:352 and watchers.go:202-241, for the Warning events a person watching the deploy sees, such as FailedScheduling or an image pull back-off. That informer runs beside the wait, so without events the warnings go silent rather than the deploy hanging. Listing or watching Secrets returns their data, not only their names, so this grants read of every Secret in the namespace. Pulumi's delete wait cannot watch a deleted Secret without it.
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - list
          - watch
        cluster_scoped: true
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Namespace in namespace.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
