syntax = "proto3";

package dev.planton.kubernetes.kubernetesmongodb.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesmongodb/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesmongodb/v1alpha1/spec.proto";
import "shared/metadata.proto";

/**
 * KubernetesMongodb declares a production-grade MongoDB cluster on
 * Kubernetes: replica sets with automated failover, optional sharding,
 * scheduled backups with point-in-time recovery, TLS, and declarative
 * users — reconciled by the Percona Operator for MongoDB
 * (KubernetesPerconaMongoOperator).
 */
message KubernetesMongodb {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesMongodb'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesMongodbSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesMongodbStatus status = 5;
}

//KubernetesMongodb status.
message KubernetesMongodbStatus {
  //outputs
  KubernetesMongodbOutputs outputs = 1;
}
