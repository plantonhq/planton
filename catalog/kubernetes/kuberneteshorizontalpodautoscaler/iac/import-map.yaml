apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kuberneteshorizontalpodautoscaler
spec:
  # An autoscaler's identity is fully carried by its namespace/name pair --
  # derivable from a prior deploy's outputs or from the spec itself.
  values:
    - name: hpa_name
      derivations:
        - from_output: horizontal_pod_autoscaler_name
        - from_spec_field: name
      where_to_find: >-
        `kubectl get hpa -A` (NAME column).
    - name: hpa_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `kubectl get hpa -A` (NAMESPACE column); "default" when the spec
        omits the namespace.
