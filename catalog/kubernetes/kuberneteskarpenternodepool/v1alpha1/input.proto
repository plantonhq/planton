syntax = "proto3";

package dev.planton.kubernetes.kuberneteskarpenternodepool.v1alpha1;

import "catalog/kubernetes/kuberneteskarpenternodepool/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// Input for the KubernetesKarpenterNodePool IaC stack. The platform
// resolves all StringValueOrRef references (the NodeClass name) to literal
// strings before passing this to the IaC engine.
message KubernetesKarpenterNodePoolIacInput {
  // Target infra-component.
  KubernetesKarpenterNodePool target = 1;
  // Kubernetes provider configuration (cluster credentials).
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
