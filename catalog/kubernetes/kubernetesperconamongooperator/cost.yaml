# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: kubernetesperconamongooperator
spec:
  billing_model: cluster_capacity
  cost_drivers:
    - field_path: replicas
      sku_meter: cluster CPU and memory reservations
      impact: Each operator replica carries the declared resources. Extra replicas are leader-elected warm standbys for the OPERATOR itself -- they add no reconciliation throughput, just standby capacity.
    - field_path: resources
      sku_meter: cluster CPU and memory reservations
      impact: The CPU and memory requests are what the scheduler reserves per operator replica. The chart ships no default requests or limits -- empty means the operator schedules unbounded.
  estimate_exclusions:
    - the price of reserved CPU and memory is the target cluster's node economics, which this catalog cannot know
    - "the MongoDB clusters this operator reconciles -- replica sets, mongos routers, config servers, backup agents -- reserve their own capacity on their KubernetesMongodb resources, never this footprint"
    - the helm_values overlay merges last and can override the modeled values, including resources
  notes: "This component installs the ENGINE, not the databases: its footprint is the operator pod(s) alone. MongoDB clusters are declared through KubernetesMongodb resources, each carrying its own capacity footprint -- including the object storage its Percona Backup for MongoDB backups consume."
