syntax = "proto3";

package dev.planton.kubernetes.kubernetesperconamongooperator.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesperconamongooperator/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesperconamongooperator/v1alpha1/spec.proto";
import "shared/metadata.proto";

//percona-operator-kubernetes
message KubernetesPerconaMongoOperator {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesPerconaMongoOperator'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesPerconaMongoOperatorSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesPerconaMongoOperatorStatus status = 5;
}

//percona-operator-kubernetes status
message KubernetesPerconaMongoOperatorStatus {
  //outputs
  KubernetesPerconaMongoOperatorOutputs outputs = 1;
}
