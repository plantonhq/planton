# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetesrbac
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: An RBAC grant stores no data -- roles and bindings are authorization objects in etcd, whose encryption is owned by the target cluster.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: With nothing stored (see enc-at-rest), there is no at-rest key to manage.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The grant carries no traffic -- it is evaluated by the API server's authorizer. API server TLS is the cluster's.
    - control_id: no-public-access
      status: not_applicable
      notes: A grant has no network endpoint to expose; it decides who may call the Kubernetes API, not where the API is reachable from.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The grant governs API authorization, not network traffic. Network-source restriction is NetworkPolicy -- a separate kind.
    - control_id: edge-protection
      status: not_applicable
      notes: The grant serves no requests -- web application firewalls do not apply.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: spec_validation
        reference: This component's entire output IS role-based access control -- spec validation rules scope_required and role_required force every grant to declare exactly one scope (Role/RoleBinding or ClusterRole/ClusterRoleBinding) and one role source, every policy rule must carry at least one verb and name resources or non-resource URLs, and grants are purely additive against Kubernetes' deny-by-default authorizer (there are no deny rules to misorder).
      notes: "Least privilege remains the author's responsibility: wildcard verbs and resources (\"*\") are expressible, and binding built-in roles like cluster-admin is a one-liner. The presets model restraint -- 01-namespace-app-reader grants get/list/watch on pods/services/configmaps to one ServiceAccount; 02-grant-builtin-view binds the read-only view role. Kubernetes' RBAC escalation check additionally constrains the deploying principal (see this component's permissions.yaml)."
    - control_id: workload-identity
      status: not_applicable
      notes: The grant authenticates to no cloud API. Its ServiceAccount subjects are in-cluster identities; keyless CLOUD identity for workloads is configured on the workloads' own kinds.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The grant performs no authentication -- user and group subjects are matched against identities the cluster's authenticator asserts (OIDC claims, certificate CNs). Which authentication methods exist is the cluster's configuration, not this spec's.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Creation and modification of roles and bindings -- and every authorization decision they feed -- are Kubernetes API operations captured by the target cluster's audit policy. The grant emits no log of its own.
    - control_id: monitoring-integration
      status: not_applicable
      notes: Authorization objects emit no operational metrics; API server authorization metrics belong to the cluster.
    - control_id: backup-recovery
      status: not_applicable
      notes: There is no data to back up -- the grant is fully described by its declarative spec, re-appliable at any time.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: With no backups (see backup-recovery), there is no retention length to configure.
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Roles and bindings are API objects with no running replicas; the API server evaluates them cluster-wide by nature.
    - control_id: deletion-protection
      status: not_applicable
      notes: Kubernetes offers no deletion-protection flag on RBAC objects. Deleting a grant FAILS CLOSED -- the subjects lose the permissions, since Kubernetes authorization denies by default -- so accidental deletion is an availability risk to the subjects, not a security hole. Protection is operational (cluster RBAC, change review).
    - control_id: managed-patching
      status: not_applicable
      notes: There is no software to patch -- roles and bindings are configuration evaluated by the API server, which is patched with the cluster.
