syntax = "proto3";

package dev.planton.kubernetes.kubernetesrbac.v1alpha1;

import "catalog/kubernetes/kubernetesrbac/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

/**
 * **KubernetesRbacIacInput** defines the input structure for deploying a Kubernetes RBAC
 * grant. It carries the target grant specification and the Kubernetes cluster configuration
 * the IaC modules (Pulumi and Terraform) need to reach the cluster.
 */
message KubernetesRbacIacInput {
  /**
   * The target RBAC grant resource to be created.
   * Contains the complete specification: scope, role, and subjects.
   */
  KubernetesRbac target = 1;

  /**
   * Kubernetes cluster configuration.
   * Contains connection details and credentials for the target Kubernetes cluster
   * where the RBAC objects will be created.
   */
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
