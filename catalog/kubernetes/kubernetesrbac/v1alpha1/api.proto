syntax = "proto3";

package dev.planton.kubernetes.kubernetesrbac.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesrbac/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesrbac/v1alpha1/spec.proto";
import "shared/metadata.proto";

/**
 * **KubernetesRbac** defines a complete Kubernetes RBAC grant following the Kubernetes
 * Resource Model (KRM): a role (created or existing, namespaced or cluster-wide) together
 * with the binding that attaches it to ServiceAccounts, users, or groups. One resource
 * expresses "give these subjects these permissions in this scope".
 */
message KubernetesRbac {
  // API version for this resource.
  // Always set to "kubernetes.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = "kubernetes.planton.dev/v1alpha1"];

  // Resource kind identifier.
  // Always set to "KubernetesRbac".
  string kind = 2 [(buf.validate.field).string.const = "KubernetesRbac"];

  // Metadata for the RBAC grant resource.
  // Includes standard fields like name, organization, environment, etc.
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Specification of the desired state for the RBAC grant.
  // Defines the scope, the role (created or existing), and the subjects.
  KubernetesRbacSpec spec = 4 [(buf.validate.field).required = true];

  // Status of the RBAC grant resource.
  // Contains outputs populated after deployment.
  KubernetesRbacStatus status = 5;
}

/**
 * **KubernetesRbacStatus** captures the runtime status of an RBAC grant deployment,
 * including the outputs generated after the objects are created.
 */
message KubernetesRbacStatus {
  // Outputs from the RBAC grant deployment.
  // Contains the created object names and kinds for downstream composition.
  KubernetesRbacOutputs outputs = 1;
}
