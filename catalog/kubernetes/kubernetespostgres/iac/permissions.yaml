# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: kubernetespostgres
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubernetes_namespace_v1 -- created and owned only when spec.create_namespace is true; get is needed for refresh either way. delete applies only to module-owned namespaces.
      - api_groups:
          - ""
        resources:
          - secrets
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the ten kubernetes_secret_v1 resources -- application and superuser credentials, declarative role passwords, external-cluster passwords, and backup/recovery object-store credentials, regions, and endpoint CAs. All are namespace-scoped to the database's namespace.
      - api_groups:
          - postgresql.cnpg.io
        resources:
          - clusters
          - scheduledbackups
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the kubectl_manifest resources applying the CloudNativePG Cluster and its ScheduledBackups (postgresql.cnpg.io/v1) via server-side apply.
      - api_groups:
          - barmancloud.cnpg.io
        resources:
          - objectstores
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the kubectl_manifest resources applying the Barman Cloud plugin's backup and recovery-source ObjectStores (barmancloud.cnpg.io/v1) via server-side apply -- created only when backup or recovery is configured.
      - api_groups:
          - postgresql.cnpg.io
        resources:
          - backups
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        condition:
          spec_field_set: backup
        notes: Covers kubectl_manifest.series_start_backup (Terraform, local.series_start_backup_manifest) and the Backup in backup.go (Pulumi) -- the series-start base backup (postgresql.cnpg.io/v1 Backup), rendered only when spec.backup is set and replaced whenever the backup series changes. list and watch serve the Pulumi provider's delete wait -- pulumi-kubernetes v4.33.0 watches a deleted object's kind until it is gone (provider/pkg/await/await.go:984-1006, condition/deleted.go:69-96), and without them a replace or destroy hangs.
      - api_groups:
          - barmancloud.cnpg.io
        resources:
          - objectstores
        verbs:
          - list
          - watch
        cluster_scoped: false
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the ObjectStore in backup.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
      - api_groups:
          - postgresql.cnpg.io
        resources:
          - clusters
          - scheduledbackups
        verbs:
          - list
          - watch
        cluster_scoped: false
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Cluster in cluster.go and the ScheduledBackup in backup.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
      - api_groups:
          - ""
        resources:
          - secrets
        verbs:
          - list
          - watch
        cluster_scoped: false
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Secret in backup.go and the Secret in secrets.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing. Listing or watching Secrets returns their data, not only their names, so this grants read of every Secret in the namespace. Pulumi's delete wait cannot watch a deleted Secret without it.
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - list
          - watch
        cluster_scoped: true
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Namespace in namespace.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
