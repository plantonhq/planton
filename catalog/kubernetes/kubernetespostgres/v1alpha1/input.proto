syntax = "proto3";

package dev.planton.kubernetes.kubernetespostgres.v1alpha1;

import "catalog/kubernetes/kubernetespostgres/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// Input for the KubernetesPostgres IaC stack. The platform resolves all
// StringValueOrRef references (namespace, storage class, TLS secret) to
// literal strings before passing this to the IaC engine.
message KubernetesPostgresIacInput {
  // the catalog object to deploy.
  KubernetesPostgres target = 1;
  // Kubernetes provider configuration (cluster credentials).
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
