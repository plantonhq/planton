syntax = "proto3";

package dev.planton.kubernetes.kubernetescertificate.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetescertificate/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetescertificate/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesCertificate is a cert-manager Certificate for requesting signed TLS certificates.
message KubernetesCertificate {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesCertificate'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesCertificateSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesCertificateStatus status = 5;
}

// KubernetesCertificateStatus holds the deployment status and outputs.
message KubernetesCertificateStatus {
  //outputs
  KubernetesCertificateOutputs outputs = 1;
}
