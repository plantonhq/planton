# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: kubernetescertificate
spec:
  billing_model: free
  free_tier: A cert-manager Certificate is a request record in the Kubernetes API server -- the names, lifetime, key parameters, and output formats of one X.509 certificate that cert-manager keeps issued and renewed. No provider bills for the object, and the signed material lands in a Kubernetes Secret, which is likewise just an API object.
  notes: "No field of this spec buys anything: dns_names, duration, private_key, and keystores describe WHAT is requested -- the issuance and renewal work runs inside the cert-manager controller, whose compute lives on the KubernetesCertManager kind. Public ACME CAs like Let's Encrypt sign for free; a commercial or external CA selected through issuer_ref bills on its own account entirely outside the cluster. The consumers that present the certificate (gateways, ingresses, workloads) carry their own cost profiles."
