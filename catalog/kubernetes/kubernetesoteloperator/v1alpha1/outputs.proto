syntax = "proto3";

package dev.planton.kubernetes.kubernetesoteloperator.v1alpha1;

//otel-operator-kubernetes outputs
message KubernetesOtelOperatorOutputs {
  //namespace the operator runs in.
  string namespace = 1;

  //Helm release name (= metadata.name). The modules pin the chart's
  //fullname to it, so the child names below derive from it.
  string release_name = 2;

  //name of the operator's webhook Service (`<name>-webhook`, port 443)
  //— where the API server sends admission reviews for collector CRs.
  string webhook_service = 3;

  //name of the Secret holding the webhook serving certificate
  //(`<name>-controller-manager-service-cert`).
  string webhook_cert_secret_name = 4;
}
