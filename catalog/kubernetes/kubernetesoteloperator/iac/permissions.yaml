# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: kubernetesoteloperator
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubernetes_namespace_v1.otel_operator -- created and owned only when spec.create_namespace is true; get is needed for refresh either way. delete applies only to module-owned namespaces. list and watch serve the Pulumi provider's deletion await -- it watches the namespace until it is gone, and without them a destroy under this exact identity hangs until the provider's timeout (found by running a lane as this identity).
      - api_groups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubectl_manifest.helm_crds (Terraform, the generated helm_crds.tf) and the Pulumi twin (keptcrds) -- the module-owned opentelemetry.io CRDs, derived from the pinned chart at apply time and applied via server-side apply OUTSIDE the Helm release, re-applied in place on chart bumps. The get and list verbs also serve the by-name read every apply makes first (get in Pulumi, a field-selected list in Terraform) behind the ownership check (a CRD without this module's stamp is refused, its owner named) and the never-downgrade check; the Pulumi twin additionally asks a SelfSubjectAccessReview whether this identity may write CRDs before registering anything, an API open to every authenticated identity. Delete is exercised only when spec.crds.keep_on_uninstall is false; the default keep posture makes destroy a no-op so an operator uninstall never cascade-deletes collector declarations. Skipped entirely when spec.crds.install is false.
      - api_groups:
          - ""
        resources:
          - services
          - serviceaccounts
          - configmaps
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Chart-rendered objects applied by helm_release.otel_operator -- the webhook Service (where the API server sends admission reviews and CRD conversion calls), the operator metrics Service, the manager ServiceAccount, and chart configuration objects.
      - api_groups:
          - apps
        resources:
          - deployments
        verbs:
          - get
          - list
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: The chart's controller-manager Deployment, applied by helm_release.otel_operator.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - clusterroles
          - clusterrolebindings
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: The chart grants the operator the cluster-scoped access it needs to reconcile collector fleets across every namespace (it watches cluster-wide by design) -- a broad ClusterRole by upstream construction; the runner creates and owns it through the release.
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - roles
          - rolebindings
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Namespaced RBAC the chart renders in the install namespace (leader election and manager housekeeping).
      - api_groups:
          - admissionregistration.k8s.io
        resources:
          - validatingwebhookconfigurations
          - mutatingwebhookconfigurations
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: The chart's fail-closed admission webhooks that default and validate collector CRs, applied by helm_release.otel_operator.
      - api_groups:
          - cert-manager.io
        resources:
          - issuers
          - certificates
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: The chart's self-signed Issuer (or the spec.webhook.issuer_ref reference) and the webhook serving Certificate -- always rendered, because the modules re-pin admissionWebhooks.certManager.enabled=true after the helm_values merge (the retained CRDs' conversion trust rides cert-manager's CA injection). The issued cert Secret is created by cert-manager itself, not the runner.
      - api_groups:
          - monitoring.coreos.com
        resources:
          - servicemonitors
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Rendered only when spec.service_monitor_enabled is true -- Prometheus discovery of the operator's own metrics (requires the monitoring.coreos.com CRDs on the cluster). Chart features enabled only through spec.helm_values (network policy, PDB, kube-rbac-proxy) render additional objects needing their own permissions -- said plainly, that surface is not covered here.
      - api_groups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - watch
        cluster_scoped: true
        provenance: derived
        notes: Pulumi only -- watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the CustomResourceDefinition applied by the keptcrds.Apply in main.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
