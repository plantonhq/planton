syntax = "proto3";

package dev.planton.kubernetes.kuberneteslistenerset.v1alpha1;

import "catalog/kubernetes/kuberneteslistenerset/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// Input for the KubernetesListenerSet IaC stack. The platform resolves all
// StringValueOrRef references (namespace, the parent Gateway name, TLS Secret
// names) to literal strings before passing this to the IaC engine.
message KubernetesListenerSetIacInput {
  // Target infra-component.
  KubernetesListenerSet target = 1;
  // Kubernetes provider configuration (cluster credentials).
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
