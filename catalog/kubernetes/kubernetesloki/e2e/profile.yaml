apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: kubernetesloki
spec:
  tier: 2
  # Forged onto the official loki chart 18.5.4. The lanes prove the
  # monolithic push→LogQL round-trip (single- and multi-tenant) and the
  # volume-loss durability proof.
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  # The chart is the heaviest tier-2 release (Loki + gateway + two
  # memcached caches + canary); the operator/StatefulSet reconciliation
  # after Helm returns needs headroom on the shared cluster.
  timeout_minutes: 30
