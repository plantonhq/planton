apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesLoki
metadata:
  name: dev-loki
spec:
  namespace:
    value: dev-loki
  create_namespace: true
  # The caches MUST be sized down on a dev cluster: unset, the chart's
  # chunks cache allocates 8192MB and requests memory at 1.2× — a 9830Mi
  # pod that never schedules on a small node, and because the install is
  # atomic the WHOLE release rolls back (verified live). 256MB is plenty
  # for a dev loop's query acceleration.
  caching:
    chunks_cache_memory_mb: 256
    results_cache_memory_mb: 128
  # Everything else is the kind's defaults: a single-replica
  # monolithic Loki on a filesystem PersistentVolume with the nginx
  # gateway front door, single-tenant (no X-Scope-OrgID header needed),
  # the canary and both memcached caches on. Right for a dev loop or a
  # small single-node cluster. Ship logs to it with a
  # KubernetesOtelCollector in daemonset mode (its cluster-logs preset)
  # pointed at the exported gateway_endpoint; read them in Grafana with a
  # loki datasource at the same endpoint.
