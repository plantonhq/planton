syntax = "proto3";

package dev.planton.kubernetes.kubernetesloki.v1alpha1;

//loki-kubernetes outputs
message KubernetesLokiOutputs {
  //namespace Loki runs in.
  string namespace = 1;

  //Helm release name (= metadata.name). The modules pin the chart's
  //fullname to it, so every child name below derives from it.
  string release_name = 2;

  //name of the gateway Service (`<name>-gateway`, port 80) — the one
  //front door for pushes and queries in every mode. Empty when the
  //gateway is disabled.
  string gateway_service = 3;

  //in-cluster endpoint of the gateway — the URL log shippers push to
  //and Grafana `loki` datasources read from,
  //e.g. http://logs-gateway.observability.svc.cluster.local
  string gateway_endpoint = 4;

  //in-cluster OTLP log-ingest endpoint (the gateway's `/otlp` route) —
  //point a KubernetesOtelCollector otlphttp exporter here,
  //e.g. http://logs-gateway.observability.svc.cluster.local/otlp
  string otlp_push_endpoint = 5;

  //name of the Loki HTTP Service (`<name>`, port 3100) — the direct
  //internal API behind the gateway (monolithic) or the read tier's
  //entry (simple_scalable).
  string loki_service = 6;

  //command to port-forward the gateway to a developer laptop,
  //e.g. kubectl port-forward svc/logs-gateway -n observability 3100:80
  string port_forward_command = 7;
}
