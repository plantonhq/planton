apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesloki
spec:
  # Loki installs as one Helm release NAMED AFTER metadata.name
  # (fullnameOverride pins the gateway Service, the Loki Services and the
  # memberlist name the same way), plus the optional anchor namespace and,
  # when storage.r2 is declared, the module-materialized
  # `<name>-r2-credentials` key-pair Secret (count-indexed). The other
  # arms' object-store credentials and gateway tenant material are
  # REFERENCES to existing Secrets — they travel with those Secrets.
  values:
    - name: release_name
      derivations:
        - from_output: release_name
        - from_metadata_name: true
      where_to_find: >-
        `helm list -n <namespace>` (NAME column) — the release shares the
        resource's name.
    - name: release_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `helm list -A` (NAMESPACE column).
    # ── the module-materialized r2 credentials Secret ────────────────────
    # Deterministic name "<metadata.name>-r2-credentials"; count-indexed
    # (present only when storage.r2 is declared), so the scoped suffix
    # derivation serves it.
    - name: secret_name
      tofu_resource_name: r2_credentials
      derivations:
        - from_metadata_name_suffix: "-r2-credentials"
      where_to_find: >-
        Always "<resource-name>-r2-credentials" when declared —
        `kubectl get secrets -n <namespace>` (keys access-key-id, secret-access-key).
    - name: secret_namespace
      tofu_resource_name: r2_credentials
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same namespace as the installation.
    # ── the optional anchor namespace ────────────────────────────────────
    - name: namespace_name
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Only imported when create_namespace is true; the installation
        namespace itself.
