# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/componentcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostProfile
metadata:
  name: kubernetesservicemonitor
spec:
  billing_model: free
  free_tier: A ServiceMonitor is a record in the Kubernetes API server -- scrape configuration the prometheus-operator renders into every Prometheus that selects the object. No provider bills for the object, and it reserves no cluster capacity of its own.
  notes: "The spend is in the Prometheus that scrapes, not in this object. Every series a target exposes is stored at every scrape, so the cost is series count times scrape frequency: a short interval, a target with high-cardinality labels, or many replicas multiply the Prometheus's memory, disk and (with remote write or a managed collection) its bill. metric_relabelings that drop unused series, a longer interval, and sample_limit (which fails a scrape that suddenly returns too many samples) are the levers."
