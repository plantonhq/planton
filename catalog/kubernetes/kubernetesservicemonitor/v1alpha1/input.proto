syntax = "proto3";

package dev.planton.kubernetes.kubernetesservicemonitor.v1alpha1;

import "catalog/kubernetes/kubernetesservicemonitor/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// KubernetesServiceMonitorIacInput provides the inputs for creating the
// ServiceMonitor on a Kubernetes cluster.
message KubernetesServiceMonitorIacInput {
  // the catalog object to deploy
  KubernetesServiceMonitor target = 1;
  // provider-config
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
