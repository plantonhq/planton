syntax = "proto3";

package dev.planton.kubernetes.kubernetesservicemonitor.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesservicemonitor/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesservicemonitor/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesServiceMonitor is a prometheus-operator ServiceMonitor: a
// namespaced object telling every Prometheus that selects it which Services'
// endpoints to scrape for metrics, and how.
message KubernetesServiceMonitor {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesServiceMonitor'];

  // metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesServiceMonitorSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesServiceMonitorStatus status = 5;
}

// KubernetesServiceMonitorStatus holds the deployment status and outputs.
message KubernetesServiceMonitorStatus {
  // stack-outputs
  KubernetesServiceMonitorStackOutputs outputs = 1;
}
