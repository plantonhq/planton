syntax = "proto3";

package dev.planton.kubernetes.kubernetescronjob.v1alpha1;

import "catalog/kubernetes/kubernetescronjob/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

//cron-job-kubernetes iac-input. The image-pull Secret for a private registry is
//derived from the target's own spec (`spec.job_template.pod.image_registries`),
//never from an input filled on the cron job's behalf.
message KubernetesCronJobIacInput {
  // the catalog object to deploy
  KubernetesCronJob target = 1;
  //provider-config
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
  //kubernetes namespace
  string kubernetes_namespace = 3;
}
