syntax = "proto3";

package dev.planton.kubernetes.kubernetescronjob.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetescronjob/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetescronjob/v1alpha1/spec.proto";
import "shared/metadata.proto";

//cron-job-kubernetes
message KubernetesCronJob {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesCronJob'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesCronJobSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesCronJobStatus status = 5;
}

//cron-job-kubernetes-status
message KubernetesCronJobStatus {
  //outputs
  KubernetesCronJobOutputs outputs = 1;
}
