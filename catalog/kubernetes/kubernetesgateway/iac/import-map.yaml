apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesgateway
spec:
  # One kubectl_manifest applying the Gateway API Gateway CR. The composed
  # import ID is apiVersion//kind//name//namespace — apiVersion and kind are
  # constants of this module (it renders exactly one GVK), declared as
  # literals.
  values:
    - name: api_version
      derivations:
        - literal: gateway.networking.k8s.io/v1
      where_to_find: >-
        Always "gateway.networking.k8s.io/v1" — the module pins the served
        standard-channel version.
    - name: kind
      derivations:
        - literal: Gateway
      where_to_find: Always "Gateway" — the CR kind this module applies.
    - name: name
      derivations:
        - from_metadata_name: true
        - from_output: gateway_name
      where_to_find: >-
        The Gateway's metadata.name (equals the Planton resource name) —
        `kubectl get gateways -A` (NAME column).
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The namespace the resource lives in — `kubectl get gateways -A`
        (NAMESPACE column).
