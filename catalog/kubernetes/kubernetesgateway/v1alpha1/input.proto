syntax = "proto3";

package dev.planton.kubernetes.kubernetesgateway.v1alpha1;

import "catalog/kubernetes/kubernetesgateway/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// Input for the KubernetesGateway IaC stack. The platform resolves all
// StringValueOrRef references (namespace, gateway_class_name) to literal
// strings before passing this to the IaC engine.
message KubernetesGatewayIacInput {
  // the catalog object to deploy.
  KubernetesGateway target = 1;
  // Kubernetes provider configuration (cluster credentials).
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
