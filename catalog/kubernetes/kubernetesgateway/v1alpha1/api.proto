syntax = "proto3";

package dev.planton.kubernetes.kubernetesgateway.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesgateway/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesgateway/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesGateway is a Kubernetes Gateway API Gateway: a namespaced instance
// of traffic-handling infrastructure that binds Listeners to addresses,
// programmed by the controller behind its GatewayClass.
message KubernetesGateway {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesGateway'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesGatewaySpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesGatewayStatus status = 5;
}

// KubernetesGatewayStatus holds the deployment status and outputs.
message KubernetesGatewayStatus {
  // outputs
  KubernetesGatewayOutputs outputs = 1;
}
