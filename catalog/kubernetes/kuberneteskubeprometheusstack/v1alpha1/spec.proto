syntax = "proto3";

package dev.planton.kubernetes.kuberneteskubeprometheusstack.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetes.proto";
import "catalog/kubernetes/workload_pod.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

/**
 * **KubernetesKubePrometheusStackSpec** deploys the kube-prometheus-stack —
 * the industry-standard cluster monitoring bundle — from the official
 * `kube-prometheus-stack` Helm chart
 * (https://prometheus-community.github.io/helm-charts). One install gives
 * the Prometheus Operator, a Prometheus server declared through it, an
 * Alertmanager, the kube-state-metrics and node-exporter metric sources,
 * a curated set of Kubernetes alerting/recording rules, and a bundled
 * Grafana pre-loaded with the matching dashboards.
 *
 * GRAIN: one stack per cluster is the norm. The chart installs the
 * monitoring.coreos.com CRDs (ServiceMonitor, PodMonitor, PrometheusRule,
 * Prometheus, Alertmanager, ...) which are cluster-scoped singletons — a
 * second stack on the same cluster must set `skip_crds` and scope its
 * monitor discovery, which is an advanced posture, not the default.
 *
 * NAMING: keep the resource name at 26 characters or fewer. The chart
 * SILENTLY truncates its fullname at 26 characters (its own headroom for
 * the longest child name it derives), and the modules pin the fullname to
 * the resource name so service names like `<name>-prometheus` and
 * `<name>-grafana` are predictable — a longer name would be truncated and
 * break that naming contract. Both modules fail loudly instead of letting
 * the chart truncate.
 *
 * CRD LIFECYCLE: the CRDs ship in a subchart whose `crds/` directory Helm
 * installs ONCE and never touches again — chart upgrades do NOT upgrade
 * CRDs, and uninstall KEEPS them (ServiceMonitors and rules across the
 * cluster survive removal of the stack). When bumping `chart_version`
 * across operator minors, enable `crd_upgrade_job` for that upgrade (a
 * pre-upgrade hook that server-side-applies the new CRD bundle) or apply
 * the new CRDs manually before upgrading.
 *
 * DISCOVERY: by default this component discovers EVERY ServiceMonitor,
 * PodMonitor, PrometheusRule, Probe and ScrapeConfig in the cluster —
 * deliberately wider than the chart's own default (which only discovers
 * objects labeled by its release, upstream's most-tripped-over behavior).
 * Cluster-wide discovery is what makes every catalog component's
 * `service_monitor_enabled` toggle and any user-authored monitor light up
 * without extra wiring. Set `discovery` to `release_managed_only` to get
 * the chart's fenced default back.
 *
 * MANAGED CLOUDS: on EKS/GKE/AKS the control plane is invisible to the
 * cluster — the controller-manager, scheduler, etcd and (on some
 * distributions) kube-proxy scrape targets can never be reached, leaving
 * permanently-down targets and firing alerts. Disable those scrapers via
 * `control_plane_scrapers` (the per-cloud presets show the exact set).
 *
 * EXPOSURE: every UI/API stays ClusterIP; expose Grafana or Prometheus
 * via first-class kinds (KubernetesIngress, Gateway API kinds) over the
 * exported service handles.
 *
 * The typed fields below cover the chart's meaningful configuration
 * surface; `helm_values` remains as the escape hatch for chart values
 * beyond them (merged last, Helm `-f` semantics, identical on both
 * engines) — Thanos sidecar/ruler scale-out, windows monitoring, per-arm
 * webhook tuning, additional alertmanager templates — a safety valve,
 * never the primary interface.
 */
message KubernetesKubePrometheusStackSpec {
  /**
   * Namespace to install into. Accepts a literal namespace name or a
   * reference to a KubernetesNamespace resource.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef namespace = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesNamespace,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "spec.name"
  ];

  /**
   * When true, the namespace is created (with the standard Planton
   * governance labels) before installing and deleted with the resource.
   * When false, the namespace must already exist.
   */
  bool create_namespace = 2;

  /**
   * Helm chart version to install (e.g. "91.8.2" — chart 91.8.2 pairs
   * with Prometheus Operator v0.94.1 and Alertmanager v0.34.1; typed
   * Discord delivery needs operator v0.93 or later, chart 88 or later,
   * because older operators refuse Discord's webhook_url_file). Versions
   * must exist as SERVED
   * charts in the repository index
   * (https://prometheus-community.github.io/helm-charts). KNOW THIS:
   * bumping the chart version does NOT upgrade the CRDs (see the CRD
   * LIFECYCLE note above) — pair upgrades across operator minors with
   * `crd_upgrade_job`.
   */
  optional string chart_version = 3 [(dev.planton.shared.options.default) = "91.8.2"];

  /**
   * Skip installing the monitoring.coreos.com CRDs. Set ONLY when the
   * CRDs are owned elsewhere (a second stack on the cluster, or a
   * GitOps-managed CRD bundle). With the CRDs absent the install fails —
   * this is a bring-your-own-CRDs arm, not a lighter install.
   */
  bool skip_crds = 4;

  /**
   * Run the chart's CRD upgrade hook (a pre-install/pre-upgrade Job that
   * server-side-applies the chart's CRD bundle). Chart default: off.
   * Enable for chart upgrades that cross operator versions — Helm never
   * upgrades the `crds/`-directory CRDs on its own. The hook runs kubectl
   * from `registry.k8s.io/kubectl` (tag = the cluster's Kubernetes
   * version); override its images via `helm_values` for air-gapped
   * registries.
   */
  bool crd_upgrade_job = 5;

  /**
   * The Prometheus server (rendered as a Prometheus CR the operator
   * reconciles into a StatefulSet). Empty = single replica, 10-day
   * retention, a 50Gi persistent volume and cluster-wide discovery.
   */
  KubernetesKubePrometheusStackPrometheus prometheus = 6;

  /**
   * Alertmanager (rendered as an Alertmanager CR). Deployed by default —
   * disable only when alerts are routed to an external Alertmanager.
   */
  KubernetesKubePrometheusStackAlertmanager alertmanager = 7;

  /**
   * The bundled Grafana, pre-provisioned with the stack's dashboards and
   * a datasource pointing at this Prometheus. Deployed by default. For a
   * standalone Grafana composed with multiple datasources, disable this
   * and deploy KubernetesGrafana instead.
   */
  KubernetesKubePrometheusStackGrafana grafana = 8;

  /**
   * The Prometheus Operator itself (the controller that reconciles the
   * Prometheus/Alertmanager CRs and admission-validates rules).
   */
  KubernetesKubePrometheusStackOperator operator = 9;

  /**
   * The bundled metric sources: kube-state-metrics (object-state metrics)
   * and node-exporter (per-node host metrics, a DaemonSet). Both on by
   * default — the stack's own dashboards and rules assume them.
   */
  KubernetesKubePrometheusStackExporters exporters = 10;

  /**
   * Scrape toggles for the Kubernetes control-plane components. All on by
   * default — the right shape for self-managed clusters (kubeadm, kind,
   * datacenter). On managed clouds disable the unreachable ones (see the
   * MANAGED CLOUDS note above; the per-cloud presets carry the exact set).
   */
  KubernetesKubePrometheusStackControlPlaneScrapers control_plane_scrapers = 11;

  /**
   * The chart's curated Kubernetes alerting/recording rules (rendered as
   * PrometheusRule objects).
   */
  KubernetesKubePrometheusStackDefaultRules default_rules = 12;

  /**
   * Registry that replaces the registry part of EVERY image the stack
   * pulls (operator, prometheus, alertmanager, exporters, grafana,
   * webhook-certgen sidecars) — the air-gap/private-mirror path. Empty =
   * each image's upstream registry (quay.io, registry.k8s.io, docker.io,
   * ghcr.io).
   */
  string image_registry = 13;

  /**
   * Names of existing image-pull Secrets applied to every workload the
   * stack creates (chart `global.imagePullSecrets`). The Secrets must
   * already exist in the namespace.
   */
  repeated string image_pull_secrets = 14 [(dev.planton.shared.options.sensitive_exempt_reason) = "Names of existing image-pull Secrets (references), not secret material"];

  /**
   * Escape hatch: additional chart values as a YAML document, merged LAST
   * over everything the typed fields render (Helm `-f` semantics,
   * identical on both engines). For the chart surface beyond the typed
   * fields (Thanos sidecar/ruler, windows monitoring, ingress-per-replica,
   * scrape classes, additional alertmanager template files, per-component
   * securityContexts, ...) — never the substitute for them. Do not put
   * secrets here; secret material belongs in the typed secret references.
   */
  string helm_values = 15;
}

/**
 * The Prometheus server configuration.
 */
message KubernetesKubePrometheusStackPrometheus {
  /**
   * Number of Prometheus replicas. Each replica scrapes and stores the
   * FULL target set independently (this is HA duplication, not sharding)
   * — queries against the Service may see either replica. 2 is the HA
   * pair; deduplicated long-term storage across replicas is the Thanos
   * surface (`helm_values`).
   */
  optional int32 replicas = 1 [
    (dev.planton.shared.options.default) = "1",
    (buf.validate.field).int32.gte = 1
  ];

  /**
   * How long samples are kept, as a Prometheus duration (e.g. "10d",
   * "36h", "2w"). Retention ends when EITHER this or `retention_size` is
   * reached.
   */
  optional string retention = 2 [
    (dev.planton.shared.options.default) = "10d",
    (buf.validate.field).string.pattern = "^[0-9]+(ms|s|m|h|d|w|y)$"
  ];

  /**
   * Maximum on-disk size of the TSDB, as a Prometheus byte size (e.g.
   * "45GiB", "500MB"). Size it BELOW the volume's `disk_size` — when the
   * volume itself fills up, Prometheus crash-loops instead of trimming.
   * Empty = no size-based trimming.
   */
  string retention_size = 3 [(buf.validate.field).cel = {
    id: "spec.prometheus.retention_size"
    message: "retention_size must be a Prometheus byte size like '45GiB' or '500MB' (units B, KB, MB, GB, TB, PB, EB, KiB, MiB, GiB, TiB, PiB, EiB)"
    expression: "this == '' || this.matches('^[0-9]+(\\\\.[0-9]+)?(B|KB|MB|GB|TB|PB|EB|KiB|MiB|GiB|TiB|PiB|EiB)$')"
  }];

  /**
   * Size of the persistent TSDB volume PER replica (e.g. "50Gi").
   * KNOW THIS: the chart's own default is an emptyDir — every metric
   * vanishes on pod restart — so this component provisions a
   * PersistentVolumeClaim by default instead. Kubernetes cannot shrink
   * PVCs; plan for growth. Ignored when `ephemeral` is true.
   */
  optional string disk_size = 4 [
    (dev.planton.shared.options.default) = "50Gi",
    (buf.validate.field).string.pattern = "^\\d+(\\.\\d+)?\\s?(Ki|Mi|Gi|Ti|Pi|Ei|K|M|G|T|P|E)$"
  ];

  /**
   * Storage class for the TSDB volumes. Accepts a literal name or a
   * reference to a KubernetesStorageClass resource. Empty = the cluster's
   * default storage class. Ignored when `ephemeral` is true.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef storage_class = 5 [
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesStorageClass,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.storage_class_name"
  ];

  /**
   * Run WITHOUT persistent storage (the chart's own emptyDir default):
   * all metrics vanish with each pod restart. Throwaway dev/test
   * clusters only.
   */
  bool ephemeral = 6;

  /**
   * CPU and memory for the Prometheus container. Memory scales with
   * active series count — undersized limits are the most common cause of
   * a crash-looping Prometheus on busy clusters. Empty = no
   * requests/limits (the chart default).
   */
  dev.planton.kubernetes.ContainerResources resources = 7;

  /**
   * Labels attached to every sample and alert leaving this Prometheus
   * (federation, remote write, Alertmanager). Convention: a `cluster`
   * label naming the cluster — multi-cluster backends key on it.
   */
  map<string, string> external_labels = 8;

  /**
   * Default interval between scrapes, as a Prometheus duration (e.g.
   * "30s"). Empty = the Prometheus default (30s). Individual monitors
   * may override per target.
   */
  string scrape_interval = 9 [(buf.validate.field).cel = {
    id: "spec.prometheus.scrape_interval"
    message: "scrape_interval must be a Prometheus duration like '30s' or '1m'"
    expression: "this == '' || this.matches('^[0-9]+(ms|s|m|h|d|w|y)$')"
  }];

  /**
   * Default interval between rule evaluations, as a Prometheus duration.
   * Empty = the operator default (30s).
   */
  string evaluation_interval = 10 [(buf.validate.field).cel = {
    id: "spec.prometheus.evaluation_interval"
    message: "evaluation_interval must be a Prometheus duration like '30s' or '1m'"
    expression: "this == '' || this.matches('^[0-9]+(ms|s|m|h|d|w|y)$')"
  }];

  /**
   * Which ServiceMonitor/PodMonitor/PrometheusRule/Probe/ScrapeConfig
   * objects this Prometheus discovers. Default `all_monitors` — see the
   * DISCOVERY note on the spec.
   */
  optional KubernetesKubePrometheusStackMonitorDiscovery discovery = 11 [
    (dev.planton.shared.options.default) = "all_monitors",
    (buf.validate.field).enum.defined_only = true
  ];

  /**
   * Ship samples to remote/long-term backends as they are scraped —
   * Grafana Cloud/Mimir, Amazon Managed Prometheus (SigV4), Azure
   * Monitor, Thanos Receive, VictoriaMetrics.
   */
  repeated KubernetesKubePrometheusStackRemoteWrite remote_write = 12;

  /**
   * Accept remote-write pushes from OTHER Prometheus servers or agents on
   * this server's `/api/v1/write` (turns this Prometheus into an
   * aggregation point).
   */
  bool enable_remote_write_receiver = 13;

  /**
   * Raw Prometheus scrape_config entries (YAML list) appended to the
   * generated configuration — the seam for exotic SD mechanisms no
   * monitor object models. Entries here are outside the operator's
   * validation: a syntax error stalls config reload. Prefer ScrapeConfig
   * objects (discovered per `discovery`) when they can express the job.
   */
  string additional_scrape_configs = 14;

  /**
   * Scheduling for the Prometheus pods.
   */
  KubernetesKubePrometheusStackScheduling scheduling = 15;

  option (buf.validate.message).cel = {
    id: "spec.prometheus.ephemeral.excludes_storage"
    message: "ephemeral: true runs on emptyDir — a non-default disk_size or a storage_class must not be set with it"
    // The default-value tolerance is deliberate: the platform's
    // defaulting middleware stamps disk_size "50Gi" onto every manifest,
    // so an ephemeral manifest that never declared a disk size would
    // otherwise become unexpressible. The module ignores the defaulted
    // value when ephemeral is true.
    expression: "!this.ephemeral || ((!has(this.disk_size) || this.disk_size == '50Gi') && !has(this.storage_class))"
  };
}

/**
 * **KubernetesKubePrometheusStackMonitorDiscovery** is the discovery
 * fence for monitor/rule objects.
 */
enum KubernetesKubePrometheusStackMonitorDiscovery {
  // Unspecified. Defaults to all_monitors.
  kubernetes_kube_prometheus_stack_monitor_discovery_unspecified = 0;

  // Discover every ServiceMonitor/PodMonitor/PrometheusRule/Probe/
  // ScrapeConfig in the cluster, whoever created it — what makes other
  // components' service_monitor toggles and user-authored monitors work
  // with zero extra wiring. The component default.
  all_monitors = 1;

  // The chart's own fenced default: discover only objects carrying this
  // release's label. For multi-tenant clusters running several
  // Prometheus servers with deliberate ownership boundaries.
  release_managed_only = 2;
}

/**
 * One remote-write destination.
 */
message KubernetesKubePrometheusStackRemoteWrite {
  /**
   * The remote write URL (e.g.
   * "https://aps-workspaces.us-east-1.amazonaws.com/workspaces/ws-.../api/v1/remote_write").
   */
  string url = 1 [(buf.validate.field).required = true];

  /**
   * Name for this remote-write queue — shows up in Prometheus'
   * queue metrics; required when declaring more than one destination.
   */
  string name = 2;

  /**
   * Authentication for the destination. Empty = unauthenticated (or
   * ambient — SigV4 with no keys uses the pod's IRSA/instance identity).
   */
  oneof auth {
    /**
     * HTTP basic auth. The password is read from an existing Secret.
     */
    KubernetesKubePrometheusStackRemoteWriteBasicAuth basic_auth = 3;

    /**
     * Bearer-token auth (e.g. Grafana Cloud API tokens). The token is
     * read from an existing Secret.
     */
    KubernetesKubePrometheusStackSecretKeyRef bearer_token_secret = 4;

    /**
     * AWS SigV4 signing — Amazon Managed Prometheus. With no keys
     * declared the pod's ambient identity signs (IRSA on EKS — the
     * keyless posture).
     */
    KubernetesKubePrometheusStackRemoteWriteSigv4 sigv4 = 5;

    /**
     * Azure AD managed-identity auth — Azure Monitor managed Prometheus.
     */
    KubernetesKubePrometheusStackRemoteWriteAzureAd azure_ad = 6;
  }
}

/**
 * Basic auth for a remote-write destination.
 */
message KubernetesKubePrometheusStackRemoteWriteBasicAuth {
  /**
   * Username (e.g. the Grafana Cloud metrics instance ID).
   */
  string username = 1 [(buf.validate.field).required = true];

  /**
   * Existing Secret holding the password.
   */
  KubernetesKubePrometheusStackSecretKeyRef password_secret = 2 [(buf.validate.field).required = true];
}

/**
 * AWS SigV4 signing for a remote-write destination.
 */
message KubernetesKubePrometheusStackRemoteWriteSigv4 {
  /**
   * AWS region of the destination workspace (e.g. "us-east-1").
   */
  string region = 1 [(buf.validate.field).required = true];

  /**
   * IAM role to assume before signing. Empty = sign as the pod's own
   * identity (IRSA — the recommended keyless posture on EKS).
   */
  string role_arn = 2;

  /**
   * Existing Secret holding a static access key ID. Declare together
   * with `secret_key_secret` only when ambient identity is unavailable —
   * prefer keyless.
   */
  KubernetesKubePrometheusStackSecretKeyRef access_key_secret = 3;

  /**
   * Existing Secret holding the static secret access key.
   */
  KubernetesKubePrometheusStackSecretKeyRef secret_key_secret = 4;

  option (buf.validate.message).cel = {
    id: "spec.remote_write.sigv4.keys_pair"
    message: "declare both access_key_secret and secret_key_secret, or neither (keyless)"
    expression: "has(this.access_key_secret) == has(this.secret_key_secret)"
  };
}

/**
 * Azure AD auth for a remote-write destination.
 */
message KubernetesKubePrometheusStackRemoteWriteAzureAd {
  /**
   * Client ID of the managed identity that writes to the Azure Monitor
   * workspace (workload identity on AKS).
   */
  string managed_identity_client_id = 1 [(buf.validate.field).required = true];

  /**
   * Azure cloud. Empty = "AzurePublic" (others: "AzureChina",
   * "AzureGovernment").
   */
  string cloud = 2;
}

/**
 * A reference to one key of an existing Secret (a reference, never
 * secret material).
 */
message KubernetesKubePrometheusStackSecretKeyRef {
  /**
   * Secret name. The Secret must live in the stack's namespace —
   * Prometheus mounts it from there.
   */
  string name = 1 [(buf.validate.field).required = true];

  /**
   * Key within the Secret.
   */
  string key = 2 [(buf.validate.field).required = true];
}

/**
 * Alertmanager configuration.
 */
message KubernetesKubePrometheusStackAlertmanager {
  /**
   * Deploy Alertmanager. Default true. Disable only when this
   * Prometheus sends alerts to an Alertmanager it does not own
   * (declare the external endpoints via `helm_values`).
   */
  optional bool enabled = 1 [(dev.planton.shared.options.default) = "true"];

  /**
   * Number of Alertmanager replicas. Multiple replicas gossip into one
   * notification cluster (deduplicated alerts); 3 is the quorum-safe HA
   * count.
   */
  optional int32 replicas = 2 [
    (dev.planton.shared.options.default) = "1",
    (buf.validate.field).int32.gte = 1
  ];

  /**
   * How long Alertmanager keeps its notification state, as a Prometheus
   * duration (silences and dedup state survive restarts through the data
   * volume).
   */
  optional string retention = 3 [
    (dev.planton.shared.options.default) = "120h",
    (buf.validate.field).string.pattern = "^[0-9]+(ms|s|m|h|d|w|y)$"
  ];

  /**
   * Size of the persistent state volume PER replica (silences,
   * notification log). The chart's own default is an emptyDir — silences
   * vanish on restart — so this component provisions a small PVC by
   * default. Ignored when `ephemeral` is true.
   */
  optional string disk_size = 4 [
    (dev.planton.shared.options.default) = "2Gi",
    (buf.validate.field).string.pattern = "^\\d+(\\.\\d+)?\\s?(Ki|Mi|Gi|Ti|Pi|Ei|K|M|G|T|P|E)$"
  ];

  /**
   * Storage class for the state volumes. Empty = the cluster's default
   * class. Ignored when `ephemeral` is true.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef storage_class = 5 [
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesStorageClass,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.storage_class_name"
  ];

  /**
   * Run WITHOUT persistent state (the chart's own emptyDir default):
   * silences and the notification log vanish with each pod restart.
   */
  bool ephemeral = 6;

  /**
   * CPU and memory for the Alertmanager container. Empty = no
   * requests/limits (the chart default). Alertmanager is light — small
   * requests suffice.
   */
  dev.planton.kubernetes.ContainerResources resources = 7;

  /**
   * The Alertmanager configuration document (route/receivers/
   * inhibit_rules) as raw YAML, for integrations `notifications` does not
   * type yet (Slack, PagerDuty, email, Opsgenie, ...). Empty = the chart's
   * default: everything routes to a "null" receiver (alerts are visible
   * in the UIs and APIs but notify nobody), with the always-firing
   * Watchdog alert routed separately as the dead-man's-switch hook.
   * Prefer `notifications` whenever it covers the destination: its
   * credentials are managed-secret references the platform enforces, while
   * this document is plain text. Never inline a webhook URL or API key
   * here — use Alertmanager's `_file` fields over a Secret you mount
   * yourself. Mutually exclusive with `notifications`.
   */
  string config_yaml = 8;

  /**
   * Scheduling for the Alertmanager pods.
   */
  KubernetesKubePrometheusStackScheduling scheduling = 9;

  /**
   * Typed alert delivery: who hears about which alert, through Discord,
   * Pushover or a webhook, plus a heartbeat to an outside dead-man's-switch
   * monitor. Every credential is a managed-secret reference; the module
   * writes them into one Secret it owns (`<name>-alertmanager-notifications`),
   * mounts it into Alertmanager, and renders the configuration with
   * Alertmanager's `_file` fields, so no credential ever sits in chart
   * values or in the rendered configuration. Mutually exclusive with
   * `config_yaml`.
   */
  KubernetesKubePrometheusStackAlertNotifications notifications = 10;

  option (buf.validate.message).cel = {
    id: "spec.alertmanager.ephemeral.excludes_storage"
    message: "ephemeral: true runs on emptyDir — a non-default disk_size or a storage_class must not be set with it"
    // Default-value tolerance: the defaulting middleware stamps
    // disk_size "2Gi" onto every manifest (see the Prometheus block's
    // twin rule).
    expression: "!this.ephemeral || ((!has(this.disk_size) || this.disk_size == '2Gi') && !has(this.storage_class))"
  };

  option (buf.validate.message).cel = {
    id: "spec.alertmanager.notifications.excludes_config_yaml"
    message: "declare alert delivery once: either the typed notifications block or the raw config_yaml document, not both"
    expression: "!has(this.notifications) || this.config_yaml == ''"
  };
}

/**
 * **KubernetesKubePrometheusStackAlertNotifications** is the typed
 * Alertmanager configuration: named receivers, one routing tree, an
 * optional heartbeat, and the message shape.
 *
 * WHAT THE MODULE OWNS: two routes are always placed before any route
 * declared here — the always-firing `Watchdog` alert goes to the heartbeat
 * (or is dropped when no heartbeat is declared), and the chart's
 * `InfoInhibitor` helper alert is dropped — so declared routes never see
 * either. Without that, a declared default receiver would get the Watchdog
 * forever. The chart's standard inhibit rules (critical silences warning
 * and info for the same alert in the same namespace) are kept.
 *
 * THE MESSAGE: every Discord and Pushover notification carries the title
 * `[<environment>] <component>: <alertname>` and, per alert, its
 * `customer_impact` annotation (else its `summary`) and `runbook_url`. Only
 * those labels and annotations are rendered — never `description`,
 * `namespace` or `pod`, because on a shared cluster a namespace can name a
 * customer and upstream rule descriptions interpolate it.
 */
message KubernetesKubePrometheusStackAlertNotifications {
  /**
   * The destinations. Each has a name the routes refer to and any number
   * of integrations; a receiver with none drops what it receives.
   */
  repeated KubernetesKubePrometheusStackAlertReceiver receivers = 1 [(buf.validate.field).repeated.min_items = 1];

  /**
   * The routing tree: the receiver every alert reaches unless a child
   * route claims it first.
   */
  KubernetesKubePrometheusStackAlertRoute route = 2 [(buf.validate.field).required = true];

  /**
   * A dead-man's switch: the always-firing Watchdog alert is posted to an
   * outside monitor every `interval`, so when Alertmanager (or the whole
   * cluster) dies, the monitor notices the silence and pages. Empty = the
   * Watchdog is dropped.
   */
  KubernetesKubePrometheusStackAlertHeartbeat heartbeat = 3;

  /**
   * Which alert labels name the environment and the component in every
   * message title.
   */
  KubernetesKubePrometheusStackAlertMessage message = 4;

  option (buf.validate.message).cel = {
    id: "spec.alertmanager.notifications.receivers.unique_names"
    message: "every receiver needs its own name — routes pick receivers by name"
    expression: "this.receivers.all(r, this.receivers.filter(s, s.name == r.name).size() == 1)"
  };

  option (buf.validate.message).cel = {
    id: "spec.alertmanager.notifications.receivers.reserved_names"
    message: "the receiver names 'heartbeat' and 'discard' belong to the module (the Watchdog heartbeat and the drop route) — pick another name"
    expression: "this.receivers.all(r, r.name != 'heartbeat' && r.name != 'discard')"
  };

  option (buf.validate.message).cel = {
    id: "spec.alertmanager.notifications.route.receiver_declared"
    message: "route.receiver must name one of the declared receivers"
    expression: "!has(this.route) || this.receivers.exists(r, r.name == this.route.receiver)"
  };

  option (buf.validate.message).cel = {
    id: "spec.alertmanager.notifications.route.routes.receiver_declared"
    message: "every child route's receiver must name one of the declared receivers"
    expression: "!has(this.route) || this.route.routes.all(c, this.receivers.exists(r, r.name == c.receiver))"
  };
}

/**
 * One named destination and its integrations.
 */
message KubernetesKubePrometheusStackAlertReceiver {
  /**
   * The name routes refer to (lowercase letters, digits and hyphens). It
   * also keys this receiver's entries in the module-owned credentials
   * Secret, so renaming a receiver rewrites its keys.
   */
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "spec.alertmanager.notifications.receivers.name"
      message: "a receiver name is lowercase letters, digits and hyphens, starting and ending with a letter or digit, at most 63 characters"
      expression: "this.matches('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')"
    }
  ];

  /**
   * Discord channels, each through one channel webhook.
   */
  repeated KubernetesKubePrometheusStackAlertDiscord discord = 2;

  /**
   * Pushover recipients (a user or a delivery group). The paging
   * integration: emergency priority breaks through a phone's silent mode
   * where the recipient allows it.
   */
  repeated KubernetesKubePrometheusStackAlertPushover pushover = 3;

  /**
   * Generic webhooks: Alertmanager's JSON payload POSTed to a URL, with an
   * optional bearer token.
   */
  repeated KubernetesKubePrometheusStackAlertWebhook webhook = 4;
}

/**
 * One Discord channel webhook.
 */
message KubernetesKubePrometheusStackAlertDiscord {
  /**
   * The channel webhook URL (Channel settings, Integrations, Webhooks).
   * Anyone holding it can post to the channel, so it is a credential: a
   * managed-secret reference, never plain text.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef webhook_url = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.options.sensitive) = true
  ];
}

/**
 * One Pushover recipient.
 */
message KubernetesKubePrometheusStackAlertPushover {
  /**
   * The Pushover application's API token.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef token = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.options.sensitive) = true
  ];

  /**
   * The recipient's user key or delivery-group key.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef user_key = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.options.sensitive) = true
  ];

  /**
   * How hard a FIRING alert pushes; the resolved follow-up is always
   * normal priority. Default emergency (Alertmanager's own default):
   * repeats every minute for up to an hour until someone acknowledges it
   * in the Pushover app. KNOW THIS: Alertmanager cannot cancel an
   * emergency notification, so it keeps repeating after the alert
   * resolves until it is acknowledged or the hour runs out.
   */
  optional KubernetesKubePrometheusStackPushoverPriority priority = 3 [
    (dev.planton.shared.options.default) = "emergency",
    (buf.validate.field).enum.defined_only = true
  ];
}

/**
 * **KubernetesKubePrometheusStackPushoverPriority** is Pushover's priority
 * for a firing alert.
 */
enum KubernetesKubePrometheusStackPushoverPriority {
  // Unspecified. Defaults to emergency.
  kubernetes_kube_prometheus_stack_pushover_priority_unspecified = 0;

  // Pushover priority 0: a notification with the device's usual sound.
  normal = 1;

  // Pushover priority 1: bypasses the recipient's quiet hours.
  high = 2;

  // Pushover priority 2: repeats every minute for up to an hour until
  // acknowledged, and can break through silent mode.
  emergency = 3;
}

/**
 * One generic webhook.
 */
message KubernetesKubePrometheusStackAlertWebhook {
  /**
   * Where Alertmanager POSTs its JSON payload. Put credentials in
   * `bearer_token`, never in the URL: the URL is plain text.
   */
  string url = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "spec.alertmanager.notifications.webhook.url"
      message: "a webhook url starts with http:// or https://"
      expression: "this.startsWith('https://') || this.startsWith('http://')"
    }
  ];

  /**
   * Sent as `Authorization: Bearer <token>`. Empty = no Authorization
   * header.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef bearer_token = 2 [(dev.planton.shared.options.sensitive) = true];
}

/**
 * The routing tree's root.
 */
message KubernetesKubePrometheusStackAlertRoute {
  /**
   * The receiver every alert reaches unless a child route claims it.
   */
  string receiver = 1 [(buf.validate.field).required = true];

  /**
   * Labels that group alerts into one notification. Empty = alertname plus
   * the environment and component labels (`message`), so one notification
   * is one problem in one place.
   */
  repeated string group_by = 2;

  /**
   * How long a new group waits for more alerts before its first
   * notification. Empty = the chart's 30s.
   */
  string group_wait = 3 [(buf.validate.field).cel = {
    id: "spec.alertmanager.notifications.route.group_wait"
    message: "group_wait must be a Prometheus duration like '30s' or '1m'"
    expression: "this == '' || this.matches('^[0-9]+(ms|s|m|h|d|w|y)$')"
  }];

  /**
   * How long a group waits before notifying about new alerts added to it.
   * Empty = the chart's 5m.
   */
  string group_interval = 4 [(buf.validate.field).cel = {
    id: "spec.alertmanager.notifications.route.group_interval"
    message: "group_interval must be a Prometheus duration like '5m'"
    expression: "this == '' || this.matches('^[0-9]+(ms|s|m|h|d|w|y)$')"
  }];

  /**
   * How long before a still-firing group is notified again. Empty = the
   * chart's 12h.
   */
  string repeat_interval = 5 [(buf.validate.field).cel = {
    id: "spec.alertmanager.notifications.route.repeat_interval"
    message: "repeat_interval must be a Prometheus duration like '4h'"
    expression: "this == '' || this.matches('^[0-9]+(ms|s|m|h|d|w|y)$')"
  }];

  /**
   * Child routes, evaluated in order; the first that matches claims the
   * alert unless it sets `continue_matching`. An alert no child claims goes
   * to `receiver`.
   */
  repeated KubernetesKubePrometheusStackAlertChildRoute routes = 6;
}

/**
 * One child route.
 */
message KubernetesKubePrometheusStackAlertChildRoute {
  /**
   * Every matcher must hold for the route to claim an alert.
   */
  repeated KubernetesKubePrometheusStackAlertMatcher matchers = 1 [(buf.validate.field).repeated.min_items = 1];

  /**
   * The receiver for the alerts this route claims.
   */
  string receiver = 2 [(buf.validate.field).required = true];

  /**
   * Keep evaluating the FOLLOWING sibling routes after this one matches
   * (Alertmanager's `continue`). KNOW THIS: the root receiver only takes
   * alerts no child route claims, so a continuing route with nothing after
   * it delivers to its own receiver alone. To reach a pager and a channel,
   * either give one receiver both integrations, or follow the continuing
   * route with a route for the channel.
   */
  bool continue_matching = 3;

  /**
   * How long before a still-firing alert on this route is notified again.
   * Empty = the root route's.
   */
  string repeat_interval = 4 [(buf.validate.field).cel = {
    id: "spec.alertmanager.notifications.routes.repeat_interval"
    message: "repeat_interval must be a Prometheus duration like '4h'"
    expression: "this == '' || this.matches('^[0-9]+(ms|s|m|h|d|w|y)$')"
  }];
}

/**
 * One label matcher.
 */
message KubernetesKubePrometheusStackAlertMatcher {
  /**
   * The label name.
   */
  string label = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "spec.alertmanager.notifications.matchers.label"
      message: "a label name is letters, digits and underscores, not starting with a digit"
      expression: "this.matches('^[a-zA-Z_][a-zA-Z0-9_]*$')"
    }
  ];

  /**
   * How the label's value is compared. Default equals.
   */
  optional KubernetesKubePrometheusStackAlertMatchOperator operator = 2 [
    (dev.planton.shared.options.default) = "equals",
    (buf.validate.field).enum.defined_only = true
  ];

  /**
   * The value, or the regular expression (RE2, anchored at both ends) for
   * the regex operators.
   */
  string value = 3 [(buf.validate.field).cel = {
    id: "spec.alertmanager.notifications.matchers.value"
    message: "a matcher value is one line"
    expression: "!this.contains('\\n')"
  }];
}

/**
 * **KubernetesKubePrometheusStackAlertMatchOperator** is a label
 * matcher's comparison.
 */
enum KubernetesKubePrometheusStackAlertMatchOperator {
  // Unspecified. Defaults to equals.
  kubernetes_kube_prometheus_stack_alert_match_operator_unspecified = 0;

  // The label equals the value (`=`).
  equals = 1;

  // The label differs from the value (`!=`).
  not_equals = 2;

  // The label matches the regular expression (`=~`).
  matches_regex = 3;

  // The label does not match the regular expression (`!~`).
  not_matches_regex = 4;
}

/**
 * The heartbeat to an outside dead-man's-switch monitor.
 */
message KubernetesKubePrometheusStackAlertHeartbeat {
  /**
   * Where the Watchdog is POSTed. Put credentials in `bearer_token`, never
   * in the URL: the URL is plain text.
   */
  string url = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "spec.alertmanager.notifications.heartbeat.url"
      message: "a heartbeat url starts with http:// or https://"
      expression: "this.startsWith('https://') || this.startsWith('http://')"
    }
  ];

  /**
   * Sent as `Authorization: Bearer <token>`. Empty = no Authorization
   * header.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef bearer_token = 2 [(dev.planton.shared.options.sensitive) = true];

  /**
   * How often the heartbeat is sent. Keep it well under the monitor's
   * staleness window (a monitor that pages after 5 minutes of silence
   * wants 1m). Default 1m.
   */
  optional string interval = 3 [
    (dev.planton.shared.options.default) = "1m",
    (buf.validate.field).string.pattern = "^[0-9]+(s|m|h)$"
  ];
}

/**
 * Which alert labels name the environment and the component in every
 * message title.
 */
message KubernetesKubePrometheusStackAlertMessage {
  /**
   * The label that names the environment. Default `environment`.
   */
  optional string environment_label = 1 [
    (dev.planton.shared.options.default) = "environment",
    (buf.validate.field).string.pattern = "^[a-zA-Z_][a-zA-Z0-9_]*$"
  ];

  /**
   * The label that names the component. Default `component`; an alert
   * without it is titled by its scrape `job` instead.
   */
  optional string component_label = 2 [
    (dev.planton.shared.options.default) = "component",
    (buf.validate.field).string.pattern = "^[a-zA-Z_][a-zA-Z0-9_]*$"
  ];
}

/**
 * The bundled Grafana.
 */
message KubernetesKubePrometheusStackGrafana {
  /**
   * Deploy the bundled Grafana. Default true — it arrives pre-wired
   * with a datasource for this Prometheus and the stack's dashboard set.
   */
  optional bool enabled = 1 [(dev.planton.shared.options.default) = "true"];

  /**
   * Read the admin credentials from an existing Secret. Empty = the
   * chart generates a random admin password ONCE at first install
   * (stable across upgrades) and keeps it in its own
   * `<name>-grafana` Secret — keys `admin-user` / `admin-password`;
   * the Secret name lands in the stack outputs.
   */
  KubernetesKubePrometheusStackGrafanaAdminSecret admin_secret = 2;

  /**
   * Provision the stack's curated dashboard set (Kubernetes cluster,
   * node, workload, Prometheus and Alertmanager dashboards). Default
   * true.
   */
  optional bool default_dashboards_enabled = 3 [(dev.planton.shared.options.default) = "true"];

  /**
   * Persistent storage for Grafana's own state (UI-authored dashboards,
   * users, preferences). Empty = ephemeral (the chart default) — safe
   * when everything is provisioned as code, wrong if people build
   * dashboards in this UI by hand.
   */
  KubernetesKubePrometheusStackGrafanaStorage storage = 4;

  /**
   * CPU and memory for the Grafana container. Empty = no requests/limits
   * (the chart default).
   */
  dev.planton.kubernetes.ContainerResources resources = 5;
}

/**
 * Existing admin-credentials Secret for the bundled Grafana.
 */
message KubernetesKubePrometheusStackGrafanaAdminSecret {
  /**
   * Secret name (a reference to an existing Kubernetes Secret, never
   * secret material). Must exist BEFORE the install.
   */
  string name = 1 [(buf.validate.field).required = true];

  /**
   * Key holding the admin username. Empty = "admin-user".
   */
  optional string user_key = 2 [(dev.planton.shared.options.default) = "admin-user"];

  /**
   * Key holding the admin password. Empty = "admin-password".
   */
  optional string password_key = 3 [
    (dev.planton.shared.options.default) = "admin-password",
    (dev.planton.shared.options.sensitive_exempt_reason) = "Name of a key within an existing Secret, not secret material"
  ];
}

/**
 * Persistent storage for the bundled Grafana.
 */
message KubernetesKubePrometheusStackGrafanaStorage {
  /**
   * Volume size as a Kubernetes quantity (e.g. "10Gi").
   */
  optional string size = 1 [
    (dev.planton.shared.options.default) = "10Gi",
    (buf.validate.field).string.pattern = "^\\d+(\\.\\d+)?\\s?(Ki|Mi|Gi|Ti|Pi|Ei|K|M|G|T|P|E)$"
  ];

  /**
   * Storage class for the PVC. Empty = the cluster's default class.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef storage_class = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesStorageClass,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.storage_class_name"
  ];
}

/**
 * The Prometheus Operator controller.
 */
message KubernetesKubePrometheusStackOperator {
  /**
   * CPU and memory for the operator container. Empty = no
   * requests/limits (the chart default).
   */
  dev.planton.kubernetes.ContainerResources resources = 1;

  /**
   * The operator's admission webhooks — they validate PrometheusRule and
   * AlertmanagerConfig objects at admission so a malformed rule can never
   * stall Prometheus' config reload.
   */
  KubernetesKubePrometheusStackAdmissionWebhooks admission_webhooks = 2;

  /**
   * Scheduling for the operator pod.
   */
  KubernetesKubePrometheusStackScheduling scheduling = 3;
}

/**
 * Admission-webhook posture for the operator.
 */
message KubernetesKubePrometheusStackAdmissionWebhooks {
  /**
   * Turn the admission webhooks OFF entirely. Rules then fail at
   * Prometheus config-reload time instead of at kubectl-apply time —
   * accept only where the webhook's certificate machinery cannot run.
   */
  bool disabled = 1;

  /**
   * Let cert-manager issue and inject the webhook's serving certificate
   * (an Issuer + Certificates rendered by the chart) instead of the
   * default self-contained certgen hook Job. Requires
   * KubernetesCertManager on the cluster.
   */
  bool cert_manager = 2;

  option (buf.validate.message).cel = {
    id: "spec.operator.admission_webhooks.arms"
    message: "cert_manager configures the webhooks' certificate — it cannot be combined with disabled: true"
    expression: "!(this.disabled && this.cert_manager)"
  };
}

/**
 * The bundled metric sources.
 */
message KubernetesKubePrometheusStackExporters {
  /**
   * Deploy kube-state-metrics (Deployment) — turns Kubernetes object
   * state (deployments, pods, PVCs, jobs, ...) into metrics. The
   * kubernetes-apps rules and dashboards are built on it. Default true.
   */
  optional bool kube_state_metrics_enabled = 1 [(dev.planton.shared.options.default) = "true"];

  /**
   * CPU and memory for kube-state-metrics. Empty = chart defaults.
   */
  dev.planton.kubernetes.ContainerResources kube_state_metrics_resources = 2;

  /**
   * Deploy node-exporter (DaemonSet on every node) — host-level CPU,
   * memory, disk, filesystem and network metrics. The node rules and
   * dashboards are built on it. Default true.
   */
  optional bool node_exporter_enabled = 3 [(dev.planton.shared.options.default) = "true"];

  /**
   * CPU and memory for each node-exporter pod. Empty = chart defaults.
   */
  dev.planton.kubernetes.ContainerResources node_exporter_resources = 4;
}

/**
 * Control-plane scrape toggles. On managed clouds the components marked
 * "managed clouds: disable" run on provider-internal machines the
 * cluster network can never reach — leaving them on produces
 * permanently-down targets and firing alerts (see the spec's MANAGED
 * CLOUDS note; per-cloud presets carry the exact set).
 */
message KubernetesKubePrometheusStackControlPlaneScrapers {
  /**
   * Scrape the API server (reachable everywhere — managed clouds expose
   * it through the kubernetes Service). Default true.
   */
  optional bool kube_api_server = 1 [(dev.planton.shared.options.default) = "true"];

  /**
   * Scrape the kubelets (reachable everywhere — kubelets run on YOUR
   * nodes). Default true.
   */
  optional bool kubelet = 2 [(dev.planton.shared.options.default) = "true"];

  /**
   * Scrape kube-controller-manager. Managed clouds (EKS/GKE/AKS):
   * disable — it is provider-internal and unreachable. Default true.
   */
  optional bool kube_controller_manager = 3 [(dev.planton.shared.options.default) = "true"];

  /**
   * Scrape CoreDNS (runs as pods in kube-system — reachable everywhere).
   * Default true.
   */
  optional bool core_dns = 4 [(dev.planton.shared.options.default) = "true"];

  /**
   * Scrape etcd. Managed clouds: disable — etcd is provider-internal.
   * Default true.
   */
  optional bool kube_etcd = 5 [(dev.planton.shared.options.default) = "true"];

  /**
   * Scrape kube-scheduler. Managed clouds: disable — provider-internal.
   * Default true.
   */
  optional bool kube_scheduler = 6 [(dev.planton.shared.options.default) = "true"];

  /**
   * Scrape kube-proxy. Reachable on most distributions (it runs on your
   * nodes) BUT its metrics port binds to localhost by default on several
   * managed platforms and on clusters whose CNI replaces kube-proxy
   * entirely (Cilium kube-proxy-replacement) there is nothing to scrape
   * — disable in those postures. Default true.
   */
  optional bool kube_proxy = 7 [(dev.planton.shared.options.default) = "true"];
}

/**
 * The chart's curated rule set.
 */
message KubernetesKubePrometheusStackDefaultRules {
  /**
   * Render the curated PrometheusRule set (Kubernetes alerts +
   * recording rules the dashboards depend on). Default true.
   */
  optional bool enabled = 1 [(dev.planton.shared.options.default) = "true"];

  /**
   * Names of rule GROUPS to leave out, from the chart's defaultRules.rules
   * map (e.g. "etcd", "kubeProxy", "kubeControllerManager",
   * "kubeSchedulerAlerting", "windows"). Pair with the
   * control_plane_scrapers you disable — a scraper without its rule
   * group silences the alerts that could never fire truthfully.
   */
  repeated string disabled_groups = 2;
}

/**
 * Pod scheduling for one stack component.
 */
message KubernetesKubePrometheusStackScheduling {
  /**
   * Node selector for the component's pods.
   */
  map<string, string> node_selector = 1;

  /**
   * Tolerations for the component's pods.
   */
  repeated dev.planton.kubernetes.WorkloadToleration tolerations = 2;

  /**
   * Priority class name for the component's pods.
   */
  string priority_class_name = 3;
}
