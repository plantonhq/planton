# The kind defaults on their own: a single persistent Prometheus,
# Alertmanager and the bundled Grafana on, cluster-wide monitor discovery,
# both exporters — the verifier proves LIVE metric flow (a healthy
# kube-state-metrics scrape target + a PromQL query answering with data).
# Sizing is kind-honest: small volumes; the chart's own resource defaults
# (none) keep the footprint schedulable.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKubePrometheusStack
metadata:
  name: e2e-kps-min
spec:
  namespace:
    value: e2e-kps-min
  create_namespace: true
  prometheus:
    disk_size: 5Gi
  alertmanager:
    disk_size: 1Gi
