apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKubePrometheusStack
metadata:
  name: prod-metrics
spec:
  namespace:
    value: monitoring
  create_namespace: true
  prometheus:
    replicas: 2
    disk_size: 100Gi
    retention: 30d
    retention_size: 80GiB
    scrape_interval: 30s
    evaluation_interval: 30s
    external_labels:
      cluster: <cluster-name>
      env: production
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
  alertmanager:
    replicas: 2
    disk_size: 10Gi
    retention: 120h
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # Every alert posts to the team channel; severity=page also rings the
    # on-call phone. The pager receiver carries the channel too, because
    # the root receiver only takes alerts no child route claims. The
    # heartbeat lets an outside monitor page when this cluster goes quiet.
    notifications:
      receivers:
        - name: channel
          discord:
            - webhook_url:
                value: $secret/<discord-alerts-webhook-url>
        - name: pager
          pushover:
            - token:
                value: $secret/<pushover-app-token>
              user_key:
                value: $secret/<pushover-on-call-user-key>
          discord:
            - webhook_url:
                value: $secret/<discord-alerts-webhook-url>
      route:
        receiver: channel
        repeat_interval: 4h
        routes:
          - matchers:
              - label: severity
                value: page
            receiver: pager
      heartbeat:
        url: https://<dead-mans-switch-monitor>/heartbeat/<cluster-name>
        bearer_token:
          value: $secret/<heartbeat-token>
  grafana:
    storage:
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  operator:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
  # Same managed-cloud scraper posture — most production clusters are
  # managed. Drop these blocks on a self-hosted control plane where
  # the scrapers actually reach their targets.
  control_plane_scrapers:
    kube_controller_manager: false
    kube_etcd: false
    kube_scheduler: false
    kube_proxy: false
  default_rules:
    disabled_groups:
      - etcd
      - kubeControllerManager
      - kubeSchedulerAlerting
      - kubeSchedulerRecording
      - kubeProxy
    # The node pools autoscale (the managed default): the overcommit alerts
    # count today's nodes and fire on every burst the autoscaler absorbs.
    # Drop these two lines on fixed-size pools, where they are true.
    disabled_alerts:
      - KubeCPUOvercommit
      - KubeMemoryOvercommit
