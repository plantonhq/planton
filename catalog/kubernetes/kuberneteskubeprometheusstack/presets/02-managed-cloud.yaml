apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKubePrometheusStack
metadata:
  name: cluster-metrics
spec:
  namespace:
    value: monitoring
  create_namespace: true
  # EKS / GKE / AKS (and most managed Kubernetes): the API server and
  # the kubelets are reachable; the controller-manager, scheduler and
  # etcd live inside the provider's control plane and are NOT. Leaving
  # those scrapers on produces permanently-down targets and firing
  # alerts that can never recover. kube-proxy's metrics port is often
  # localhost-bound on managed platforms too — disable it unless you
  # have verified the scrape works on YOUR distribution.
  prometheus:
    disk_size: 50Gi
    retention: 15d
    external_labels:
      cluster: <cluster-name>
  alertmanager:
    disk_size: 5Gi
  grafana:
    storage:
      size: 5Gi
  control_plane_scrapers:
    kube_controller_manager: false
    kube_etcd: false
    kube_scheduler: false
    kube_proxy: false
  default_rules:
    disabled_groups:
      - etcd
      - kubeControllerManager
      - kubeSchedulerAlerting
      - kubeSchedulerRecording
      - kubeProxy
    # The node pools autoscale (the managed default): the overcommit alerts
    # count today's nodes and fire on every burst the autoscaler absorbs.
    # Drop these two lines on fixed-size pools, where they are true.
    disabled_alerts:
      - KubeCPUOvercommit
      - KubeMemoryOvercommit
