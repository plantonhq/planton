apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesNetworkPolicy
metadata:
  name: allow-same-namespace
spec:
  name: allow-same-namespace
  namespace:
    value: "<your-namespace>"
  pod_selector: { match_all: true }
  policy_types:
    - ingress
  ingress_rules:
    - from:
        - pod_selector: { match_all: true }
