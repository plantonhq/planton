# Allow all same-namespace traffic while isolating from other namespaces:
# an empty pod_selector peer matches every pod in the policy's own namespace.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesNetworkPolicy
metadata:
  name: e2e-np-same-ns
spec:
  namespace:
    value: default
  name: e2e-np-same-ns
  policy_types:
    - ingress
  ingress_rules:
    - from:
        - pod_selector: { match_all: true }
