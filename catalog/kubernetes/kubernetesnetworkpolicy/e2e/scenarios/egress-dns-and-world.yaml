# Egress-only policy (explicit policy_types — inference would wrongly add
# ingress isolation): allow DNS to any namespace plus the world minus the
# cloud metadata endpoint, with a port range.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesNetworkPolicy
metadata:
  name: e2e-np-egress
spec:
  namespace:
    value: default
  name: e2e-np-egress
  pod_selector:
    match_labels:
      app: test-app
  policy_types:
    - egress
  egress_rules:
    - to:
        - namespace_selector: { match_all: true }
      ports:
        - protocol: UDP
          port: "53"
        - protocol: TCP
          port: "53"
    - to:
        - ip_block:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: "443"
        - protocol: TCP
          port: "30000"
          end_port: 32767
