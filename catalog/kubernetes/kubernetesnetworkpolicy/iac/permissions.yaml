# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: kubernetesnetworkpolicy
spec:
  kubernetes:
    rules:
      - api_groups:
          - networking.k8s.io
        resources:
          - networkpolicies
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers kubernetes_network_policy_v1.network_policy -- the module's only resource, one NetworkPolicy in the spec's namespace.
      - api_groups:
          - networking.k8s.io
        resources:
          - networkpolicies
        verbs:
          - list
          - watch
        cluster_scoped: false
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the NetworkPolicy in networkpolicy.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
