apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesnetworkpolicy
spec:
  # A NetworkPolicy's identity is fully carried by its namespace/name pair --
  # derivable from a prior deploy's outputs or from the spec itself.
  values:
    - name: network_policy_name
      derivations:
        - from_output: network_policy_name
        - from_spec_field: name
      where_to_find: >-
        `kubectl get networkpolicies -A` (NAME column).
    - name: network_policy_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        `kubectl get networkpolicies -A` (NAMESPACE column); "default" when
        the spec omits the namespace.
