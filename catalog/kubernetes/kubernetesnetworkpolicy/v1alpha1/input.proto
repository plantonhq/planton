syntax = "proto3";

package dev.planton.kubernetes.kubernetesnetworkpolicy.v1alpha1;

import "catalog/kubernetes/kubernetesnetworkpolicy/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

/**
 * **KubernetesNetworkPolicyIacInput** defines the input structure for deploying
 * a Kubernetes NetworkPolicy. It carries the target NetworkPolicy specification
 * and the Kubernetes cluster configuration the IaC modules (Pulumi and Terraform)
 * need to reach the cluster.
 */
message KubernetesNetworkPolicyIacInput {
  /**
   * The target NetworkPolicy resource to be created.
   * Contains the complete specification including metadata, pod selection, and
   * allow rules.
   */
  KubernetesNetworkPolicy target = 1;

  /**
   * Kubernetes cluster configuration.
   * Contains connection details and credentials for the target Kubernetes
   * cluster where the NetworkPolicy will be created.
   */
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
