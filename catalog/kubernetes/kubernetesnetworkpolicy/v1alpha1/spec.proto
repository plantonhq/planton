syntax = "proto3";

package dev.planton.kubernetes.kubernetesnetworkpolicy.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";

/**
 * **KubernetesNetworkPolicySpec** declares which network traffic is allowed to and
 * from a set of pods — the in-cluster firewall. A NetworkPolicy selects pods with
 * `pod_selector` and then ALLOWS the traffic its rules describe; everything not
 * allowed by some policy is denied once the pod is selected by any policy in that
 * direction. Policies are additive: multiple policies selecting the same pods
 * combine by union, and there is no "deny" rule — isolation comes from selecting
 * pods while allowing little.
 *
 * The two canonical shapes fall out of this model:
 * - Default-deny: an empty `pod_selector` (all pods in the namespace) with
 *   `policy_types: [ingress, egress]` and no rules — everything is denied.
 * - Targeted allow: select specific pods and enumerate the peers/ports allowed.
 *
 * Selectors compose with Planton workloads through the documented label contract:
 * every workload kind stamps the `app` label (set to the workload's
 * `metadata.name`) on its pods as immutable selection identity and exports the
 * full set as its `selector_labels` output — so `match_labels: {app: <name>}`
 * targets one workload's pods.
 *
 * IMPORTANT: NetworkPolicy objects are only ENFORCED by a CNI that implements
 * them (Calico, Cilium, and cloud CNIs with policy enforcement enabled). On a
 * cluster whose CNI ignores them (including default kind/kindnet clusters), the
 * object exists but all traffic still flows.
 *
 * The spec covers the complete networking/v1 NetworkPolicySpec surface.
 */
message KubernetesNetworkPolicySpec {
  /**
   * The namespace the policy lives in — a NetworkPolicy governs only pods in its
   * own namespace. Accepts a literal namespace name or a reference to a
   * KubernetesNamespace resource. When omitted, the policy lands in the
   * cluster's `default` namespace.
   */
  dev.planton.shared.foreignkey.v1.StringValueOrRef namespace = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesNamespace,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "spec.name"
  ];

  /**
   * The name of the NetworkPolicy (its `metadata.name` in the cluster).
   * Must be a valid DNS subdomain: lowercase alphanumeric characters, hyphens,
   * and dots, at most 253 characters.
   */
  string name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 253,
    (buf.validate.field).cel = {
      id: "name.dns_subdomain"
      message: "Name must be a valid DNS subdomain (lowercase alphanumeric, hyphens, and dots, no leading/trailing dots or hyphens)"
      expression: "this.matches('^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$')"
    }
  ];

  /**
   * Additional labels to apply to the NetworkPolicy object.
   * Merged with the standard Planton governance labels.
   */
  map<string, string> labels = 3;

  /**
   * Annotations to apply to the NetworkPolicy object.
   */
  map<string, string> annotations = 4;

  /**
   * Selects the pods this policy applies to, within the policy's namespace.
   * Omitting the selector, or writing `match_all: true`, selects ALL pods in
   * the namespace — the default-deny building block. To target one Planton
   * workload, match on its `app` label: `match_labels: {app: <workload-name>}`.
   */
  KubernetesNetworkPolicyLabelSelector pod_selector = 5;

  /**
   * **KubernetesNetworkPolicyType** is one traffic direction a policy governs.
   */
  enum KubernetesNetworkPolicyType {
    // Unspecified.
    kubernetes_network_policy_type_unspecified = 0;

    // Ingress: the policy governs traffic INTO the selected pods.
    ingress = 1;

    // Egress: the policy governs traffic OUT OF the selected pods.
    egress = 2;
  }

  /**
   * Which directions this policy governs. When omitted, Kubernetes infers:
   * ingress is always included, and egress is included only when egress rules
   * are present. Set explicitly whenever the intent is isolation — an
   * egress-only policy MUST say `[egress]` (or it also isolates ingress), and a
   * deny-all-egress policy MUST say `[egress]` with no egress rules (there is
   * no rule to infer the direction from).
   */
  repeated KubernetesNetworkPolicyType policy_types = 6 [
    (buf.validate.field).repeated.max_items = 2,
    (buf.validate.field).repeated.items.enum = {
      defined_only: true
      not_in: [0]
    }
  ];

  /**
   * The ingress allow rules. Each rule is an independent OR: traffic is allowed
   * into the selected pods if it matches ANY rule's sources AND ports. An empty
   * list (with ingress in policy_types) denies all inbound traffic to the
   * selected pods. A rule with empty `from` allows from ALL sources; a rule
   * with empty `ports` allows on ALL ports.
   */
  repeated KubernetesNetworkPolicyIngressRule ingress_rules = 7;

  /**
   * The egress allow rules. Each rule is an independent OR: traffic is allowed
   * out of the selected pods if it matches ANY rule's destinations AND ports.
   * An empty list (with egress in policy_types) denies all outbound traffic
   * from the selected pods — including DNS, which is why deny-all-egress
   * policies are usually paired with an allow-DNS rule (UDP+TCP port 53 to the
   * cluster DNS pods).
   */
  repeated KubernetesNetworkPolicyEgressRule egress_rules = 8;

  // Directions must not repeat.
  option (buf.validate.message).cel = {
    id: "policy_types_distinct"
    message: "policy_types entries must be distinct"
    expression: "this.policy_types.size() < 2 || this.policy_types[0] != this.policy_types[1]"
  };

  // Rules in an ungoverned direction silently do nothing — reject the mismatch.
  option (buf.validate.message).cel = {
    id: "ingress_rules_require_ingress_type"
    message: "ingress rules are present but policy_types does not include ingress — the rules would be ignored"
    expression: "this.ingress_rules.size() == 0 || this.policy_types.size() == 0 || this.policy_types.exists(t, t == 1)"
  };
  option (buf.validate.message).cel = {
    id: "egress_rules_require_egress_type"
    message: "egress rules are present but policy_types does not include egress — the rules would be ignored"
    expression: "this.egress_rules.size() == 0 || this.policy_types.size() == 0 || this.policy_types.exists(t, t == 2)"
  };
}

/**
 * **KubernetesNetworkPolicyIngressRule** allows one set of inbound traffic:
 * sources (OR'd) on ports (OR'd). Sources AND ports must both match.
 */
message KubernetesNetworkPolicyIngressRule {
  /**
   * The allowed sources. Empty means ALL sources (traffic not restricted by
   * origin — the rule then only restricts by port).
   */
  repeated KubernetesNetworkPolicyPeer from = 1;

  /**
   * The allowed destination ports on the selected pods. Empty means ALL ports.
   */
  repeated KubernetesNetworkPolicyPort ports = 2;
}

/**
 * **KubernetesNetworkPolicyEgressRule** allows one set of outbound traffic:
 * destinations (OR'd) on ports (OR'd). Destinations AND ports must both match.
 */
message KubernetesNetworkPolicyEgressRule {
  /**
   * The allowed destinations. Empty means ALL destinations.
   */
  repeated KubernetesNetworkPolicyPeer to = 1;

  /**
   * The allowed destination ports. Empty means ALL ports.
   */
  repeated KubernetesNetworkPolicyPort ports = 2;
}

/**
 * **KubernetesNetworkPolicyPeer** is one allowed traffic source/destination.
 * Three forms, with precise combination semantics:
 * - `pod_selector` alone: pods matching the selector in the policy's OWN namespace.
 * - `namespace_selector` alone: ALL pods in namespaces matching the selector.
 * - both together: pods matching `pod_selector` in namespaces matching
 *   `namespace_selector` (a single AND'd peer — different from two peers).
 * - `ip_block`: a CIDR outside the cluster's pod network. Mutually exclusive
 *   with the selector forms.
 */
message KubernetesNetworkPolicyPeer {
  /**
   * Selects pods by label. `match_all: true` selects ALL pods (in the policy's
   * namespace, or in the namespaces selected by namespace_selector when both
   * are set).
   */
  KubernetesNetworkPolicyLabelSelector pod_selector = 1;

  /**
   * Selects namespaces by label (e.g. the automatic
   * `kubernetes.io/metadata.name: <name>` label every namespace carries).
   * `match_all: true` selects ALL namespaces — the cluster-wide-allow building
   * block.
   */
  KubernetesNetworkPolicyLabelSelector namespace_selector = 2;

  /**
   * Allows a CIDR range, with optional carve-outs. For traffic to/from
   * addresses OUTSIDE the cluster (external services, VPC ranges, the internet)
   * — cluster-internal pod IPs are ephemeral and should be matched with
   * selectors, never CIDRs.
   */
  KubernetesNetworkPolicyIpBlock ip_block = 3;

  // The API requires ip_block to stand alone in a peer.
  option (buf.validate.message).cel = {
    id: "ip_block_mutually_exclusive"
    message: "ip_block cannot be combined with pod_selector or namespace_selector in the same peer — use separate peers"
    expression: "!has(this.ip_block) || (!has(this.pod_selector) && !has(this.namespace_selector))"
  };

  // An empty peer matches nothing and is always a mistake.
  option (buf.validate.message).cel = {
    id: "peer_not_empty"
    message: "a peer must specify at least one of pod_selector, namespace_selector, or ip_block"
    expression: "has(this.pod_selector) || has(this.namespace_selector) || has(this.ip_block)"
  };
}

/**
 * **KubernetesNetworkPolicyIpBlock** is a CIDR allow with exceptions.
 */
message KubernetesNetworkPolicyIpBlock {
  /**
   * The allowed CIDR, e.g. "10.100.0.0/16" or "2001:db8::/64". "0.0.0.0/0"
   * allows all IPv4 — pair it with `except` to allow "everything but".
   */
  string cidr = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "cidr.format"
      message: "cidr must be a valid CIDR (e.g. \"10.100.0.0/16\", \"2001:db8::/64\")"
      expression: "this.isIpPrefix()"
    }
  ];

  /**
   * CIDRs carved OUT of the allow — each must be a sub-range of `cidr` (the API
   * rejects out-of-range exceptions). E.g. allow "0.0.0.0/0" except
   * "169.254.169.254/32" (the cloud metadata endpoint).
   */
  repeated string except = 2 [(buf.validate.field).repeated.items.cel = {
    id: "except.format"
    message: "each except entry must be a valid CIDR inside the allowed cidr range"
    expression: "this.isIpPrefix()"
  }];
}

/**
 * **KubernetesNetworkPolicyPort** allows one destination port, named port, or
 * contiguous port range.
 */
message KubernetesNetworkPolicyPort {
  /**
   * **KubernetesNetworkPolicyProtocol** is the L4 protocol a port rule matches.
   */
  enum KubernetesNetworkPolicyProtocol {
    // Unspecified. Defaults to TCP.
    kubernetes_network_policy_protocol_unspecified = 0;

    // TCP — the default.
    TCP = 1;

    // UDP — required for DNS allow rules (port 53).
    UDP = 2;

    // SCTP — requires cluster SCTP support.
    SCTP = 3;
  }

  /**
   * The protocol this rule matches.
   * Default: TCP
   */
  optional KubernetesNetworkPolicyProtocol protocol = 1 [(buf.validate.field).enum.defined_only = true];

  /**
   * The destination port: a number ("5432") or a named container port
   * ("metrics") as declared on the target pods. Omit to match ALL ports for
   * the protocol.
   */
  string port = 2 [(buf.validate.field).cel = {
    id: "port.int_or_name"
    message: "port must be a port number (\"5432\") or a named container port (\"metrics\" — a valid IANA service name)"
    expression: "this == '' || this.matches('^[0-9]+$') || (this.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') && this.size() <= 15 && this.matches('.*[a-z].*'))"
  }];

  /**
   * The inclusive upper bound of a port RANGE starting at `port`. Requires
   * `port` to be numeric (a named port cannot anchor a range) and must be >=
   * that number. E.g. port "30000" + end_port 32767 allows the whole node-port
   * range.
   */
  int32 end_port = 3 [(buf.validate.field).cel = {
    id: "end_port.range"
    message: "end_port must be 0 (single port) or in the range 1-65535"
    expression: "this == 0 || (this >= 1 && this <= 65535)"
  }];

  // A numeric port must itself be a valid port number.
  option (buf.validate.message).cel = {
    id: "port.numeric_range"
    message: "a numeric port must be in the range 1-65535"
    expression: "this.port == '' || !this.port.matches('^[0-9]+$') || (int(this.port) >= 1 && int(this.port) <= 65535)"
  };

  // end_port needs a numeric anchor and a sane ordering — both are live API rejections.
  option (buf.validate.message).cel = {
    id: "end_port.requires_numeric_port"
    message: "end_port requires port to be set to a NUMERIC port (a named port cannot anchor a range)"
    expression: "this.end_port == 0 || this.port.matches('^[0-9]+$')"
  };
  option (buf.validate.message).cel = {
    id: "end_port.gte_port"
    message: "end_port must be greater than or equal to port"
    expression: "this.end_port == 0 || !this.port.matches('^[0-9]+$') || this.end_port >= int(this.port)"
  };
}

/**
 * **KubernetesNetworkPolicyLabelSelector** is a standard Kubernetes label
 * selector: exact-match labels and/or set-based expressions. Both parts must
 * match (they AND together). A selector says what it selects: labels and
 * expressions narrow the set, and `match_all: true` selects everything (the
 * empty selector on the Kubernetes wire); a selector that names neither is
 * refused, so "select everything" is always a written choice and never an
 * accident of an empty block.
 */
message KubernetesNetworkPolicyLabelSelector {
  // match_all and label criteria are alternatives: everything, or by label.
  option (buf.validate.message).cel = {
    id: "match_all_excludes_criteria"
    message: "match_all: true selects everything — drop match_labels and match_expressions, or drop match_all to select by label"
    expression: "!(has(this.match_all) && this.match_all) || (this.match_labels.size() == 0 && this.match_expressions.size() == 0)"
  };

  // A selector that selects nothing is always a mistake; selecting everything
  // must be written down.
  option (buf.validate.message).cel = {
    id: "selector_says_what_it_selects"
    message: "a selector must say what it selects — set match_all: true to select every pod (or namespace), or name match_labels / match_expressions"
    expression: "(has(this.match_all) && this.match_all) || this.match_labels.size() > 0 || this.match_expressions.size() > 0"
  };

  /**
   * Exact-match label requirements: every key/value pair listed must be present,
   * e.g. {"app": "checkout"}.
   */
  map<string, string> match_labels = 1;

  /**
   * Set-based label requirements, for selections exact-match cannot express
   * (key existence, value-in-set).
   */
  repeated KubernetesNetworkPolicyLabelSelectorRequirement match_expressions = 2;

  /**
   * Select everything: every pod in scope for a pod selector, every namespace
   * for a namespace selector. Renders as the empty selector on the wire.
   * Cannot be combined with match_labels or match_expressions.
   */
  optional bool match_all = 3;
}

/**
 * **KubernetesNetworkPolicyLabelSelectorRequirement** is one set-based label
 * requirement.
 */
message KubernetesNetworkPolicyLabelSelectorRequirement {
  /**
   * The label key the requirement applies to.
   */
  string key = 1 [(buf.validate.field).string.min_len = 1];

  /**
   * The relationship between the key and the values: "In" (value must be one of
   * `values`), "NotIn" (must not be), "Exists" (key present, `values` must be
   * empty), or "DoesNotExist" (key absent, `values` must be empty).
   */
  string operator = 2 [(buf.validate.field).string = {
    in: [
      "In",
      "NotIn",
      "Exists",
      "DoesNotExist"
    ]
  }];

  /**
   * The values compared against the label's value. Required (non-empty) for
   * In/NotIn; must be empty for Exists/DoesNotExist.
   */
  repeated string values = 3;

  // Enforce the values-vs-operator contract the Kubernetes API applies at admission.
  option (buf.validate.message).cel = {
    id: "operator_values_contract"
    message: "values must be non-empty for In/NotIn and empty for Exists/DoesNotExist"
    expression: "((this.operator == 'In' || this.operator == 'NotIn') && this.values.size() > 0) || ((this.operator == 'Exists' || this.operator == 'DoesNotExist') && this.values.size() == 0)"
  };
}
