apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesValkey
metadata:
  name: my-valkey
spec:
  namespace:
    value: "<your-namespace>"
  create_namespace: false
  # One primary + two replicas: writes through "<name>", reads
  # load-balanced across every pod through "<name>-read". This is read
  # scaling, NOT automated failover — the chart ships no Sentinel;
  # durability through a primary restart comes from persistence.
  replication:
    replicas: 2
    # Required in replication mode: an ephemeral primary would
    # replicate an empty dataset after every restart.
    persistence:
      size: 5Gi
    # Write safety: the primary refuses writes unless at least one
    # replica is connected and in sync, so a partitioned primary cannot
    # accept writes the replicas would never see.
    min_replicas_to_write: 1
  config:
    append_only: true
    max_memory: 1gb
  # The default user with no declared password: the module mints one into
  # the "<name>-auth" Secret; replicas authenticate to the primary with the
  # same ACL machinery.
  auth:
    users:
      - name: default
  # Node drains take at most one pod down at a time.
  pod_disruption_budget:
    enabled: true
    max_unavailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 2Gi
