# Consumer-scoped flag-file fixture for the KubernetesGoFeatureFlag lanes:
# the boolean flag `assistant`, ON for org "planton" and OFF for everyone
# else. The verifier evaluates it both ways, then edits this ConfigMap so
# everyone is ON and waits for the relay to serve the change.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesGoFeatureFlagFlagFile
metadata:
  name: e2e-goff-flags
  annotations:
    planton.dev/e2e-prerequisites: KubernetesNamespace
spec:
  namespace:
    value: e2e-goff
  flags:
    assistant:
      variations:
        enabled:
          boolValue: true
        disabled:
          boolValue: false
      targeting:
        - name: first-organizations
          query: org in ["planton"]
          variation: enabled
      defaultRule:
        variation: disabled
