# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetesgofeatureflag
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The relay holds flags only in memory -- the flag files live in the retrievers the spec names (a ConfigMap, a repository, a bucket, a database), and encryption at rest is each of those stores' property. The module-owned env Secret carrying the relay's credentials rests in the cluster's etcd, whose encryption at rest is the cluster's control-plane posture.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: With no data at rest of its own (see enc-at-rest), key management belongs to the flag sources and export destinations.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The relay serves plain HTTP inside the cluster (evaluation on server.port, monitoring on server.monitoring_port); the spec models no TLS listener. Outbound retriever and exporter connections use each destination's own TLS (https URLs, the Redis tls_enabled switch, the Kafka config's net.tls block).
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The Service defaults to ClusterIP (server.service_type) and the module creates no ingress -- external exposure composes from Gateway API kinds against the exported service.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The spec models no NetworkPolicy seam -- in-cluster reachability is governed by first-class KubernetesNetworkPolicy resources composed alongside.
    - control_id: edge-protection
      status: not_applicable
      notes: An in-cluster flag evaluation API serves no edge traffic -- web application firewalls compose at the gateway layer if the relay is ever exposed.
    - control_id: rbac
      status: configurable
      field_path: authorized_keys
      evidence:
        type: spec_default
        reference: Unset means NO authentication -- anyone who can reach the Service can evaluate every flag and read the full flag configuration. authorized_keys.evaluation gates evaluation and authorized_keys.admin the admin endpoints; in flag_sets mode each flag set's api_keys select and confine a caller to that set. Key values reach the relay as environment variables from the module-owned Secret and never render into the configuration ConfigMap. The relay's own Kubernetes access is a Role granting only get on the ConfigMaps its retrievers name.
    - control_id: workload-identity
      status: configurable
      field_path: service_account
      evidence:
        type: spec_default
        reference: service_account.annotations federate the relay's ServiceAccount to cloud APIs (EKS IRSA, GKE Workload Identity, AKS Workload Identity) for the S3, GCS, Azure, SQS, Kinesis, Pub/Sub and BigQuery integrations without static credentials; service_account.existing_name runs the relay as an account you manage.
    - control_id: no-legacy-auth
      status: configurable
      field_path: authorized_keys
      evidence:
        type: spec_default
        reference: Unset serves the API UNAUTHENTICATED -- fine on a lab cluster, never in production. Declaring authorized keys (or flag sets, which always carry keys) eliminates anonymous access; the 01 and 02 presets declare them.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component enforces no end-user sign-in -- it packages no human sign-in surface; its API keys are workload credentials, whose posture rbac carries.
    - control_id: audit-logging
      status: not_applicable
      notes: Changes to the release's objects and to a ConfigMap-held flag file are Kubernetes API operations captured by the cluster's audit policy; the relay's own logs stream to stdout as operational logs. Flag changes can additionally be announced through notifiers.
    - control_id: monitoring-integration
      status: configurable
      field_path: metrics
      evidence:
        type: spec_default
        reference: The relay always serves Prometheus metrics on the monitoring port; metrics.service_monitor_enabled renders a ServiceMonitor for the Prometheus operator. Traces export through telemetry (OpenTelemetry), and evaluation events through exporters.
    - control_id: backup-recovery
      status: not_applicable
      notes: The relay holds no state to back up -- the flags live in their retrievers (a KubernetesGoFeatureFlagFlagFile, a repository, a bucket), whose own backup posture governs.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist on this component (see backup-recovery).
    - control_id: multi-zone-ha
      status: configurable
      field_path: replicas
      evidence:
        type: spec_default
        reference: Stateless replicas (default 1) tolerate pod loss once raised; pdb keeps a minimum available through voluntary disruptions, and scheduling.pod_anti_affinity spreads replicas across nodes or zones.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Helm releases nor the chart's objects carry a deletion-protection flag; protection is operational (cluster RBAC, change review). Deleting the relay loses nothing durable -- the flags survive in their retrievers.
    - control_id: managed-patching
      status: not_applicable
      notes: The release runs exactly the chart_version the manifest pins (default 1.56.0 = GO Feature Flag v1.56.0) -- there is no managed patch channel; upgrades are deliberate manifest changes.
