# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetespeerauthentication
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A PeerAuthentication stores no data -- it is an Istio policy object in etcd, whose encryption is owned by the target cluster.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: With nothing stored (see enc-at-rest), there is no at-rest key to manage. The mesh's mTLS certificates are issued and rotated by istiod, outside this spec.
    - control_id: enc-in-transit
      status: configurable
      field_path: mtls.mode
      evidence:
        type: spec_default
        reference: Omitting mtls inherits the parent (namespace-level, then mesh-level) policy, treated as PERMISSIVE when none exists -- plaintext and mTLS both accepted; mode STRICT requires every inbound connection to the selected workloads to be a mutual-TLS tunnel with a client certificate, and DISABLE turns tunneling off.
      notes: "This kind IS the mesh's transit-encryption requirement. Presets: 01-namespace-strict-mtls sets STRICT for a whole namespace; 02-workload-strict-with-plaintext-port sets STRICT on one workload with a port_level_mtls DISABLE carve-out for a single port. Scope caveats: enforcement reaches only workloads with Istio sidecars, and port_level_mtls overrides take effect only when a selector is present (spec validation enforces this)."
    - control_id: no-public-access
      status: not_applicable
      notes: The policy is not an endpoint -- it has nothing to expose. It governs how the selected workloads' inbound connections authenticate, not where they are reachable from.
    - control_id: restricted-ingress
      status: not_applicable
      notes: PeerAuthentication decides HOW peers must authenticate (mTLS mode), not WHICH network sources may connect. Source restriction is NetworkPolicy or Istio AuthorizationPolicy -- separate kinds.
    - control_id: edge-protection
      status: not_applicable
      notes: The policy inspects no requests -- it sets transport authentication requirements. WAF-style filtering belongs to edge components.
    - control_id: rbac
      status: not_applicable
      notes: Access to the PeerAuthentication object is governed by the target cluster's Kubernetes RBAC; the policy itself grants no permissions.
    - control_id: workload-identity
      status: not_applicable
      notes: The control concerns workloads authenticating to CLOUD APIs with platform-issued identities. PeerAuthentication governs in-mesh peer authentication between workloads, not cloud API credentials.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The plaintext-vs-mTLS choice IS the mtls mode covered under enc-in-transit (STRICT disables the plaintext path); there is no separate legacy protocol toggle in this spec.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Changes to the policy are Kubernetes API operations, captured by the target cluster's audit policy. Connection-level authentication logs, where they exist, come from the sidecars and istiod.
    - control_id: monitoring-integration
      status: not_applicable
      notes: A policy object emits no operational metrics. mTLS adoption and traffic metrics come from the Istio sidecars and control plane.
    - control_id: backup-recovery
      status: not_applicable
      notes: There is no data to back up -- the policy is fully described by its declarative spec, re-appliable at any time.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: With no backups (see backup-recovery), there is no retention length to configure.
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The policy is an API object with no running replicas; istiod distributes it to sidecars wherever the selected workloads run.
    - control_id: deletion-protection
      status: not_applicable
      notes: Kubernetes offers no deletion-protection flag on Istio policy objects. Deleting a STRICT policy relaxes the workloads back to the inherited (or PERMISSIVE) mode -- a silent weakening -- so protection is operational (namespace RBAC, change review).
    - control_id: managed-patching
      status: not_applicable
      notes: There is no software to patch -- the policy is configuration consumed by istiod; mesh version lifecycle belongs to the Istio installation.
