syntax = "proto3";

package dev.planton.kubernetes.kubernetespeerauthentication.v1alpha1;

import "catalog/kubernetes/kubernetespeerauthentication/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// KubernetesPeerAuthenticationIacInput provides the inputs for creating the
