syntax = "proto3";

package dev.planton.kubernetes.kubernetespeerauthentication.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetespeerauthentication/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetespeerauthentication/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesPeerAuthentication is an Istio PeerAuthentication: a namespaced policy
// that sets the mutual TLS (mTLS) requirements for incoming connections to the
// workloads it selects.
message KubernetesPeerAuthentication {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesPeerAuthentication'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesPeerAuthenticationSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesPeerAuthenticationStatus status = 5;
}

// KubernetesPeerAuthenticationStatus holds the deployment status and outputs.
message KubernetesPeerAuthenticationStatus {
  // outputs
  KubernetesPeerAuthenticationOutputs outputs = 1;
}
