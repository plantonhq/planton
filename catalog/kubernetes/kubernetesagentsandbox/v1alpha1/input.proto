syntax = "proto3";

package dev.planton.kubernetes.kubernetesagentsandbox.v1alpha1;

import "catalog/kubernetes/kubernetesagentsandbox/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// KubernetesAgentSandboxIacInput provides the inputs for creating the
// Sandbox on a Kubernetes cluster.
message KubernetesAgentSandboxIacInput {
  // the catalog object to deploy
  KubernetesAgentSandbox target = 1;
  // provider-config
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
