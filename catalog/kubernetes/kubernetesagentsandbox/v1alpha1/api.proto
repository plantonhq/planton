syntax = "proto3";

package dev.planton.kubernetes.kubernetesagentsandbox.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesagentsandbox/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesagentsandbox/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesAgentSandbox is an agent-sandbox Sandbox: one isolated, stateful
// pod with a stable name and its own volumes, run by the agent-sandbox
// controller, for an AI agent, a notebook or a dev environment.
message KubernetesAgentSandbox {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesAgentSandbox'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesAgentSandboxSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesAgentSandboxStatus status = 5;
}

// KubernetesAgentSandboxStatus holds the deployment status and outputs.
message KubernetesAgentSandboxStatus {
  // outputs
  KubernetesAgentSandboxOutputs outputs = 1;
}
