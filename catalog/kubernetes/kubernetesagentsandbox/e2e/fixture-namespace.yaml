# The namespace the full-surface sandbox lives in, referenced through
# valueFrom so the lane proves the namespace reference resolves on both
# engines. Its teardown removes the namespace after the sandbox.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesNamespace
metadata:
  name: e2e-asbx-sbx-ns
spec:
  name: e2e-asbx-sbx-full
