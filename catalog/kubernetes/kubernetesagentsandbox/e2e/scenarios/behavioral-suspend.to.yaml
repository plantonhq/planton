# The second act of behavioral-suspend.yaml: the same sandbox, Suspended. Not
# a scenario of its own (the second-act annotation keeps discovery from
# running it as a lane).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAgentSandbox
metadata:
  name: e2e-asbx-sbx-suspend
  annotations:
    planton.dev/e2e-second-act: behavioral-suspend.yaml
spec:
  namespace:
    value: default
  podTemplate:
    spec:
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8888", "--udp-port=-1"]
          readinessProbe:
            httpGet:
              path: /hostname
              port: "8888"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
  operatingMode: Suspended
