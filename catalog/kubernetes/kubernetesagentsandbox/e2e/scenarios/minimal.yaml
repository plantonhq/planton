# The smallest useful sandbox: one container answering HTTP. The verifier
# proves every field reads back from the live object, the Sandbox becomes
# Ready (the controller created and runs its pod), and destroy removes the
# Sandbox and its pod.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAgentSandbox
metadata:
  name: e2e-asbx-sbx-min
spec:
  namespace:
    value: default
  podTemplate:
    spec:
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8888", "--udp-port=-1"]
          ports:
            - containerPort: 8888
          readinessProbe:
            httpGet:
              path: /hostname
              port: "8888"
