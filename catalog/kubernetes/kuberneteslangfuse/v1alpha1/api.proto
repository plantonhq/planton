syntax = "proto3";

package dev.planton.kubernetes.kuberneteslangfuse.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kuberneteslangfuse/v1alpha1/outputs.proto";
import "catalog/kubernetes/kuberneteslangfuse/v1alpha1/spec.proto";
import "shared/metadata.proto";

//langfuse-kubernetes
message KubernetesLangfuse {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesLangfuse'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesLangfuseSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesLangfuseStatus status = 5;
}

//langfuse-kubernetes status.
message KubernetesLangfuseStatus {
  //outputs
  KubernetesLangfuseOutputs outputs = 1;
}
