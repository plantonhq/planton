    (buf.validate.field).int64.gt = 0
  ];

  /**
   * Lifetime of presigned download URLs in seconds.
   */
  optional int32 download_url_expiry_seconds = 5 [
    (dev.planton.shared.options.default) = "3600",
    (buf.validate.field).int32.gt = 0
  ];

  /**
   * Server-side encryption (S3 targets).
   */
  KubernetesLangfuseServerSideEncryption sse = 6;
}

/**
 * Batch export settings. People download exports through presigned URLs,
 * so the export endpoint must be reachable from their browsers.
 */
message KubernetesLangfuseBatchExport {
  /**
   * Offer batch exports.
   */
  optional bool enabled = 1 [(dev.planton.shared.options.default) = "true"];

  /**
   * A target of its own. Unset = the blob storage target.
   */
  KubernetesLangfuseBlobTarget target = 2;

  /**
   * Key prefix for exports (must end with "/"). Exports are disposable:
   * an expiry lifecycle rule here is safe.
   */
  optional string prefix = 3 [
    (dev.planton.shared.options.default) = "exports/",
    (buf.validate.field).cel = {
      id: "spec.blob_storage.batch_export.prefix"
      message: "A blob storage prefix must be empty or end with \"/\", such as exports/."
      expression: "this == '' || this.endsWith('/')"
    }
  ];

  /**
   * The endpoint download links point at, when the target's endpoint is
   * cluster-internal (`LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT`). Empty
   * = the target's endpoint.
   */
  string public_endpoint = 4 [(buf.validate.field).cel = {
    id: "spec.blob_storage.batch_export.public_endpoint"
    message: "public_endpoint must be an http(s) URL, such as https://s3.langfuse.example.com."
    expression: "this == '' || this.matches('^https?://[^\\\\s]+$')"
  }];

  /**
   * Rows streamed per page while exporting (`BATCH_EXPORT_PAGE_SIZE`).
   * Empty = Langfuse's default (500). Lower it if exports exhaust worker
   * memory.
   */
  optional int32 page_size = 5 [(buf.validate.field).int32.gt = 0];

  /**
   * Most rows one export may contain (`BATCH_EXPORT_ROW_LIMIT`). Empty =
   * Langfuse's default (1500000).
   */
  optional int32 row_limit = 6 [(buf.validate.field).int32.gt = 0];

  /**
   * Hours a download link stays valid
   * (`BATCH_EXPORT_DOWNLOAD_LINK_EXPIRATION_HOURS`). Empty = Langfuse's
   * default (24).
   */
  optional int32 download_link_expiration_hours = 7 [(buf.validate.field).int32.gt = 0];

  /**
   * Server-side encryption (S3 targets).
   */
  KubernetesLangfuseServerSideEncryption sse = 8;
}

/**
 * The instance's own secrets. Each is generated once when not declared
 * and kept in the instance Secret across applies.
 *
 * KNOW THIS: the salt and the encryption key are bound to the Postgres
 * data, not to this resource. Langfuse hashes API keys with the salt and
 * encrypts stored LLM credentials with the key, and both results live in
 * Postgres. Deleting and recreating this resource against a surviving
 * database generates NEW values unless they are declared - and every
 * existing API key and stored credential stops working, unrecoverably.
 * For durable installs, declare both as managed secrets from the start,
 * or read the generated values from the instance Secret and declare them
 * before any recreate.
 */
message KubernetesLangfuseInstanceSecrets {
  /**
   * Salt for hashing API keys (`SALT`), at least 256 bits of entropy
   * (`openssl rand -base64 32`). Empty = generated.
   */
  string salt = 1 [(dev.planton.shared.options.sensitive) = true];

  /**
   * Key for encrypting stored credentials (`ENCRYPTION_KEY`): exactly 64
   * hex characters, 256 bits (`openssl rand -hex 32`). Langfuse refuses to
   * start on any other shape. Empty = generated.
   */
  string encryption_key = 2 [(dev.planton.shared.options.sensitive) = true];

  /**
   * Secret for signing session cookies (`NEXTAUTH_SECRET`). Empty =
   * generated. Changing it signs everyone out, nothing more.
   */
  string nextauth_secret = 3 [(dev.planton.shared.options.sensitive) = true];
}

/**
 * Headless initialization: what Langfuse creates at first start. Langfuse
 * creates each object only if it does not exist yet - changing a name or a
 * password here later changes nothing in Langfuse; a changed key pair adds
 * a new key without revoking the old one.
 */
message KubernetesLangfuseInit {
  /**
   * Seed the organization and project at first start. Turn off to start
   * with an empty instance where the first sign-up creates everything.
   */
  optional bool enabled = 1 [(dev.planton.shared.options.default) = "true"];

  /**
   * The seeded organization.
   */
  KubernetesLangfuseInitOrganization organization = 2;

  /**
   * The seeded project and its API key pair.
   */
  KubernetesLangfuseInitProject project = 3;

  /**
   * The seeded admin user, owner of the organization. Unset = no user is
   * seeded (sign up, or sign in with single sign-on, instead).
   */
  KubernetesLangfuseInitAdmin admin = 4;
}

/**
 * The seeded organization.
 */
message KubernetesLangfuseInitOrganization {
  /**
   * Organization ID. Empty = metadata.name. Fixed at first start.
   */
  string id = 1 [(buf.validate.field).cel = {
    id: "spec.init.organization.id"
    message: "Organization IDs use letters, digits, hyphens and underscores, up to 64 characters."
    expression: "this == '' || this.matches('^[A-Za-z0-9_-]{1,64}$')"
  }];

  /**
   * Organization display name.
   */
  optional string name = 2 [(dev.planton.shared.options.default) = "Default Organization"];
}

/**
 * The seeded project.
 */
message KubernetesLangfuseInitProject {
  /**
   * Project ID. Empty = "<metadata.name>-project". Fixed at first start.
   */
  string id = 1 [(buf.validate.field).cel = {
    id: "spec.init.project.id"
    message: "Project IDs use letters, digits, hyphens and underscores, up to 64 characters."
    expression: "this == '' || this.matches('^[A-Za-z0-9_-]{1,64}$')"
  }];

  /**
   * Project display name.
   */
  optional string name = 2 [(dev.planton.shared.options.default) = "Default Project"];

  /**
   * Data retention in days (3 or more). Applied only with an Enterprise
   * Edition license that includes data retention; otherwise data is kept
   * indefinitely. Empty = keep indefinitely.
   */
  optional int32 retention_days = 3 [(buf.validate.field).int32.gte = 3];

  /**
   * Public key of the project's API key pair ("pk-lf-..."). Empty =
   * generated ("pk-lf-" + 32 random letters and digits).
   */
  string public_key = 4 [(buf.validate.field).cel = {
    id: "spec.init.project.public_key"
    message: "public_key must start with pk-lf-."
    expression: "this == '' || this.startsWith('pk-lf-')"
  }];

  /**
   * Secret key of the project's API key pair. It must start with
   * "sk-lf-", the prefix Langfuse's SDKs expect. Empty = generated
   * ("sk-lf-" + 32 random letters and digits).
   */
  string secret_key = 5 [(dev.planton.shared.options.sensitive) = true];

  option (buf.validate.message).cel = {
    id: "spec.init.project.key_pair"
    message: "Declare both public_key and secret_key, or neither (both are then generated)."
    expression: "(this.public_key == '') == (this.secret_key == '')"
  };
}

/**
 * The seeded admin user.
 */
message KubernetesLangfuseInitAdmin {
  /**
   * Email address, the sign-in name.
   */
  string email = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.email = true
  ];

  /**
   * Display name.
   */
  optional string name = 2 [(dev.planton.shared.options.default) = "Admin"];

  /**
   * Password. Empty = generated (32 letters and digits) and readable from
   * the `admin_password_secret` output.
   */
  string password = 3 [(dev.planton.shared.options.sensitive) = true];
}

/**
 * Sign-in settings.
 */
message KubernetesLangfuseAuth {
  /**
   * Disable email and password sign-in (`AUTH_DISABLE_USERNAME_PASSWORD`)
   * - single sign-on only. Keep at least one SSO provider configured.
   */
  bool disable_password_sign_in = 1;

  /**
   * Disable sign-up for new users, invited ones included
   * (`AUTH_DISABLE_SIGNUP`). Recommended for any exposed instance once
   * the admin exists.
   */
  bool disable_sign_up = 2;

  /**
   * Require new email-and-password users to verify their address
   * (`AUTH_EMAIL_VERIFICATION_REQUIRED`). Needs `smtp`.
   */
  bool email_verification_required = 3;

  /**
   * Session lifetime in minutes (`AUTH_SESSION_MAX_AGE`). Empty =
   * Langfuse's default (20160, fourteen days). Must exceed 5: sessions
   * refresh every five minutes.
   */
  optional int32 session_max_age_minutes = 4 [(buf.validate.field).int32.gt = 5];

  /**
   * Email domains that may only sign in through single sign-on
   * (`AUTH_DOMAINS_WITH_SSO_ENFORCEMENT`), e.g. "example.com".
   */
  repeated string sso_enforced_domains = 5;

  /**
   * Account fields to ignore from the identity provider when creating an
   * account (`AUTH_IGNORE_ACCOUNT_FIELDS`) - a fix for providers that
   * return fields Langfuse cannot store.
   */
  repeated string ignore_account_fields = 6;

  /**
   * Proxy for requests to identity providers (`AUTH_HTTPS_PROXY`).
   */
  string https_proxy = 7;

  /**
   * Proxy for plain-HTTP requests to identity providers (`AUTH_HTTP_PROXY`).
   */
  string http_proxy = 8;

  /**
   * Organization and project memberships every new user receives.
   */
  KubernetesLangfuseNewUserAccess new_user_access = 9;

  /**
   * Single sign-on providers. Each one configured becomes a sign-in
   * button; its redirect URI is `<external_url>/api/auth/callback/<id>`.
   */
  KubernetesLangfuseSsoProviders sso = 10;

  /**
   * Requests to identity providers time out after this many milliseconds
   * (`AUTH_SSO_TIMEOUT`). Empty = the auth library's default.
   */
  optional int32 sso_timeout_ms = 11 [(buf.validate.field).int32.gt = 0];
}

/**
 * Memberships granted to every new user (automated access provisioning).
 */
message KubernetesLangfuseNewUserAccess {
  /**
   * Organization every new user joins (`LANGFUSE_DEFAULT_ORG_ID`) - the
   * seeded organization's ID, for example.
   */
  string organization_id = 1;

  /**
   * Their role there (`LANGFUSE_DEFAULT_ORG_ROLE`). Unspecified =
   * Langfuse's default, VIEWER.
   */
  Role organization_role = 2;

  /**
   * Projects every new user joins (`LANGFUSE_DEFAULT_PROJECT_ID`).
   */
  repeated string project_ids = 3;

  /**
   * Their role there (`LANGFUSE_DEFAULT_PROJECT_ROLE`). Unspecified =
   * Langfuse's default, VIEWER. NONE is not a project role.
   */
  Role project_role = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [5]
  }];

  /**
   * Langfuse roles.
   */
  enum Role {
    // Langfuse's default for the context.
    unspecified = 0;
    // Full control, including billing and deletion.
    OWNER = 1;
    // Manages members and settings.
    ADMIN = 2;
    // Works with the data.
    MEMBER = 3;
    // Read-only.
    VIEWER = 4;
    // Organization membership without access to any project.
    NONE = 5;
  }
}

/**
 * Single sign-on providers.
 */
message KubernetesLangfuseSsoProviders {
  /**
   * Google.
   */
  KubernetesLangfuseGoogleSso google = 1;

  /**
   * GitHub.
   */
  KubernetesLangfuseGitHubSso github = 2;

  /**
   * GitHub Enterprise Server.
   */
  KubernetesLangfuseGitHubEnterpriseSso github_enterprise = 3;

  /**
   * GitLab (gitlab.com or self-managed).
   */
  KubernetesLangfuseGitLabSso gitlab = 4;

  /**
   * Microsoft Entra ID (Azure AD).
   */
  KubernetesLangfuseAzureAdSso azure_ad = 5;

  /**
   * Okta.
   */
  KubernetesLangfuseIssuerSso okta = 6;

  /**
   * Authentik.
   */
  KubernetesLangfuseAuthentikSso authentik = 7;

  /**
   * OneLogin.
   */
  KubernetesLangfuseIssuerSso onelogin = 8;

  /**
   * Auth0.
   */
  KubernetesLangfuseIssuerSso auth0 = 9;

  /**
   * Amazon Cognito.
   */
  KubernetesLangfuseIssuerSso cognito = 10;

  /**
   * Keycloak.
   */
  KubernetesLangfuseKeycloakSso keycloak = 11;

  /**
   * JumpCloud.
   */
  KubernetesLangfuseJumpCloudSso jumpcloud = 12;

  /**
   * Any OpenID Connect provider.
   */
  KubernetesLangfuseCustomSso custom = 13;

  /**
   * WorkOS.
   */
  KubernetesLangfuseWorkOsSso workos = 14;

  /**
   * WordPress.com.
   */
  KubernetesLangfuseOAuthClient wordpress = 15;
}

/**
 * An OAuth client registered with an identity provider - the part every
 * provider shares.
 */
message KubernetesLangfuseOAuthClient {
  /**
   * Client ID.
   */
  string client_id = 1 [(buf.validate.field).required = true];

  /**
   * Client secret.
   */
  string client_secret = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.options.sensitive) = true
  ];

  /**
   * Merge a sign-in with an existing account of the same email address
   * (`ALLOW_ACCOUNT_LINKING`) - how an instance moves from email and
   * password to SSO. Safe only when the provider verifies emails.
   */
  bool allow_account_linking = 3;

  /**
   * Token endpoint authentication method (`CLIENT_AUTH_METHOD`).
   * Unspecified = client_secret_basic. Use `none` for PKCE.
   */
  ClientAuthMethod client_auth_method = 4;

  /**
   * Authentication checks (`CHECKS`), e.g. pkce and state for Okta.
   * Empty = the provider's defaults.
   */
  repeated Check checks = 5 [(buf.validate.field).repeated = {
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];

  /**
   * Algorithm the provider signs ID tokens with
   * (`ID_TOKEN_SIGNED_RESPONSE_ALG`). Unspecified = RS256.
   */
  IdTokenAlgorithm id_token_signed_response_alg = 6;

  /**
   * OAuth token endpoint authentication methods.
   */
  enum ClientAuthMethod {
    // client_secret_basic.
    client_auth_method_unspecified = 0;
    // HTTP Basic auth with the client secret.
    client_secret_basic = 1;
    // Client secret in the request body.
    client_secret_post = 2;
    // A JWT signed with the client secret.
    client_secret_jwt = 3;
    // A JWT signed with a private key.
    private_key_jwt = 4;
    // Mutual TLS with a CA-issued certificate.
    tls_client_auth = 5;
    // Mutual TLS with a self-signed certificate.
    self_signed_tls_client_auth = 6;
    // No client authentication (PKCE).
    none = 7;
  }

  /**
   * OAuth authentication checks.
   */
  enum Check {
    // Unset.
    check_unspecified = 0;
    // Nonce check.
    nonce = 1;
    // No checks.
    no_checks = 2;
    // PKCE.
    pkce = 3;
    // State parameter.
    state = 4;
  }

  /**
   * ID token signing algorithms.
   */
  enum IdTokenAlgorithm {
    // RS256.
    id_token_algorithm_unspecified = 0;
    // RSASSA-PKCS1-v1_5 with SHA-256.
    RS256 = 1;
    // RSASSA-PKCS1-v1_5 with SHA-384.
    RS384 = 2;
    // RSASSA-PKCS1-v1_5 with SHA-512.
    RS512 = 3;
    // ECDSA P-256 with SHA-256.
    ES256 = 4;
    // ECDSA P-384 with SHA-384.
    ES384 = 5;
    // ECDSA P-521 with SHA-512.
    ES512 = 6;
    // RSASSA-PSS with SHA-256.
    PS256 = 7;
    // RSASSA-PSS with SHA-384.
    PS384 = 8;
    // RSASSA-PSS with SHA-512.
    PS512 = 9;
    // HMAC with SHA-256.
    HS256 = 10;
    // HMAC with SHA-384.
    HS384 = 11;
    // HMAC with SHA-512.
    HS512 = 12;
  }
}

/**
 * Google sign-in.
 */
message KubernetesLangfuseGoogleSso {
  /**
   * The OAuth client.
   */
  KubernetesLangfuseOAuthClient client = 1 [(buf.validate.field).required = true];

  /**
   * Google Workspace domains allowed to sign in (`AUTH_GOOGLE_ALLOWED_DOMAINS`).
   * Empty = any Google account.
   */
  repeated string allowed_domains = 2;
}

/**
 * GitHub sign-in. GitHub ignores the ID token algorithm.
 */
message KubernetesLangfuseGitHubSso {
  /**
   * The OAuth app.
   */
  KubernetesLangfuseOAuthClient client = 1 [(buf.validate.field).required = true];

  option (buf.validate.message).cel = {
    id: "spec.auth.sso.github.no_id_token_alg"
    message: "GitHub issues no ID token: leave id_token_signed_response_alg unset."
    expression: "!has(this.client) || this.client.id_token_signed_response_alg == 0"
  };
}

/**
 * GitHub Enterprise Server sign-in.
 */
message KubernetesLangfuseGitHubEnterpriseSso {
  /**
   * The OAuth app.
   */
  KubernetesLangfuseOAuthClient client = 1 [(buf.validate.field).required = true];

  /**
   * Base URL of the server (`AUTH_GITHUB_ENTERPRISE_BASE_URL`), e.g.
   * "https://github.example.com".
   */
  string base_url = 2 [(buf.validate.field).string.uri = true];

  option (buf.validate.message).cel = {
    id: "spec.auth.sso.github_enterprise.no_id_token_alg"
    message: "GitHub Enterprise issues no ID token: leave id_token_signed_response_alg unset."
    expression: "!has(this.client) || this.client.id_token_signed_response_alg == 0"
  };

  option (buf.validate.message).cel = {
    id: "spec.auth.sso.github_enterprise.base_url"
    message: "GitHub Enterprise needs base_url, the server's address (e.g. https://github.example.com)."
    expression: "this.base_url != ''"
  };
}

/**
 * GitLab sign-in.
 */
message KubernetesLangfuseGitLabSso {
  /**
   * The OAuth application.
   */
  KubernetesLangfuseOAuthClient client = 1 [(buf.validate.field).required = true];

  /**
   * Base URL of a self-managed GitLab (`AUTH_GITLAB_URL`). Empty =
   * https://gitlab.com.
   */
  string url = 2;

  /**
   * OIDC issuer, when it differs from `url` (`AUTH_GITLAB_ISSUER`).
   */
  string issuer = 3;
}

/**
 * Microsoft Entra ID sign-in.
 */
message KubernetesLangfuseAzureAdSso {
  /**
   * The app registration.
   */
  KubernetesLangfuseOAuthClient client = 1 [(buf.validate.field).required = true];

  /**
   * Directory (tenant) ID (`AUTH_AZURE_AD_TENANT_ID`).
   */
  string tenant_id = 2 [(buf.validate.field).required = true];
}

/**
 * Sign-in through an OpenID Connect issuer (Okta, OneLogin, Auth0,
 * Cognito).
 */
message KubernetesLangfuseIssuerSso {
  /**
   * The OAuth client.
   */
  KubernetesLangfuseOAuthClient client = 1 [(buf.validate.field).required = true];

  /**
   * Issuer URL, e.g. "https://example.okta.com" or, for Cognito,
   * "https://cognito-idp.<region>.amazonaws.com/<user-pool-id>".
   */
  string issuer = 2 [(buf.validate.field).required = true];
}

/**
 * Authentik sign-in.
 */
message KubernetesLangfuseAuthentikSso {
  /**
   * The OAuth provider.
   */
  KubernetesLangfuseOAuthClient client = 1 [(buf.validate.field).required = true];

  /**
   * Issuer, "https://<domain>/application/o/<slug>" (no trailing path
   * beyond the slug).
   */
  string issuer = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^https://.+/application/o/[^/]+/?$"
  ];

  /**
   * Authorization URL, when it differs from the issuer's
   * (`AUTH_AUTHENTIK_AUTHORIZATION_URL`).
   */
  string authorization_url = 3;
}

/**
 * Keycloak sign-in.
 */
message KubernetesLangfuseKeycloakSso {
  /**
   * The client.
   */
  KubernetesLangfuseOAuthClient client = 1 [(buf.validate.field).required = true];

  /**
   * Realm issuer, e.g. "https://keycloak.example.com/realms/langfuse".
   */
  string issuer = 2 [(buf.validate.field).required = true];

  /**
   * Button label (`AUTH_KEYCLOAK_NAME`). Empty = "Keycloak".
   */
  string name = 3;

  /**
   * OAuth scopes (`AUTH_KEYCLOAK_SCOPE`). Empty = "openid email profile".
   */
  string scope = 4;

  /**
   * Read the user from the ID token (`AUTH_KEYCLOAK_ID_TOKEN`). Empty =
   * true; false fetches the userinfo endpoint instead.
   */
  optional bool use_id_token = 5;
}

/**
 * JumpCloud sign-in.
 */
message KubernetesLangfuseJumpCloudSso {
  /**
   * The SSO application.
   */
  KubernetesLangfuseOAuthClient client = 1 [(buf.validate.field).required = true];

  /**
   * Issuer URL.
   */
  string issuer = 2 [(buf.validate.field).required = true];

  /**
   * OAuth scopes (`AUTH_JUMPCLOUD_SCOPE`).
   */
  string scope = 3;
}

/**
 * Sign-in through any OpenID Connect provider.
 */
message KubernetesLangfuseCustomSso {
  /**
   * The OAuth client.
   */
  KubernetesLangfuseOAuthClient client = 1 [(buf.validate.field).required = true];

  /**
   * Issuer URL (its /.well-known/openid-configuration is discovered).
   */
  string issuer = 2 [(buf.validate.field).required = true];

  /**
   * Button label (`AUTH_CUSTOM_NAME`), e.g. "Company SSO".
   */
  string name = 3 [(buf.validate.field).required = true];

  /**
   * OAuth scopes (`AUTH_CUSTOM_SCOPE`). Empty = "openid email profile".
   */
  string scope = 4;

  /**
   * Read the user from the ID token (`AUTH_CUSTOM_ID_TOKEN`). Empty =
   * true.
   */
  optional bool use_id_token = 5;

  /**
   * Also fetch the userinfo endpoint (`AUTH_CUSTOM_FETCH_USERINFO`).
   */
  bool fetch_userinfo = 6;

  /**
   * Claim names, when the provider's differ from the standard ones.
   */
  KubernetesLangfuseSsoClaims claims = 7;
}

/**
 * Claim names a custom provider uses.
 */
message KubernetesLangfuseSsoClaims {
  /**
   * Email claim (`LANGFUSE_CUSTOM_SSO_EMAIL_CLAIM`). Empty = "email".
   */
  string email = 1;

  /**
   * Name claim (`LANGFUSE_CUSTOM_SSO_NAME_CLAIM`). Empty = "name".
   */
  string name = 2;

  /**
   * Subject claim (`LANGFUSE_CUSTOM_SSO_SUB_CLAIM`). Empty = "sub".
   */
  string subject = 3;

  /**
   * Picture claim (`LANGFUSE_CUSTOM_SSO_IMAGE_CLAIM`). Empty = "picture".
   */
  string image = 4;
}

/**
 * WorkOS sign-in. WorkOS takes only the client and account linking.
 */
message KubernetesLangfuseWorkOsSso {
  /**
   * The WorkOS client.
   */
  KubernetesLangfuseOAuthClient client = 1 [(buf.validate.field).required = true];

  /**
   * Route sign-in to this organization's connection
   * (`AUTH_WORKOS_ORGANIZATION_ID`).
   */
  string organization_id = 2;

  /**
   * Route sign-in to this connection (`AUTH_WORKOS_CONNECTION_ID`).
   */
  string connection_id = 3;

  option (buf.validate.message).cel = {
    id: "spec.auth.sso.workos.client_options"
    message: "WorkOS takes only client_id, client_secret and allow_account_linking; leave client_auth_method, checks and id_token_signed_response_alg unset."
    expression: "!has(this.client) || (this.client.client_auth_method == 0 && size(this.client.checks) == 0 && this.client.id_token_signed_response_alg == 0)"
  };
}

/**
 * Transactional email.
 */
message KubernetesLangfuseSmtp {
  /**
   * Connection URL (`SMTP_CONNECTION_URL`):
   * "smtp://user:password@host:587", "smtps://user:password@host:465",
   * or "ses://<region>" to send through Amazon SES with the AWS credential
   * chain (an IAM role through workload identity).
   */
  string connection_url = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.options.sensitive) = true
  ];

  /**
   * Sender address (`EMAIL_FROM_ADDRESS`).
   */
  string from_address = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.email = true
  ];
}

/**
 * Product switches.
 */
message KubernetesLangfuseFeatures {
  /**
   * Send anonymous usage statistics to Langfuse (`TELEMETRY_ENABLED`) -
