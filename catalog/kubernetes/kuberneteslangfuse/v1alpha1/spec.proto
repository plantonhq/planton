message KubernetesLangfuseWorker {
  /**
   * Worker image.
   */
  KubernetesLangfuseImage image = 1;

  /**
   * Replicas. Scale on CPU: a worker above 50% of 2 CPU is saturated.
   * Ignored while an autoscaler owns the count.
   */
  optional int32 replicas = 2 [
    (dev.planton.shared.options.default) = "1",
    (buf.validate.field).int32.gte = 1
  ];

  /**
   * CPU and memory. Langfuse recommends 2 CPU and 4 GiB per worker for
   * production; the defaults suit evaluation.
   */
  dev.planton.kubernetes.ContainerResources resources = 3 [(dev.planton.kubernetes.default_container_resources) = {
    limits: {
      cpu: "2000m"
      memory: "4Gi"
    }
    requests: {
      cpu: "250m"
      memory: "1Gi"
    }
  }];

  /**
   * Autoscaling. One mechanism at most.
   */
  KubernetesLangfuseAutoscaling autoscaling = 4;

  /**
   * PodDisruptionBudget.
   */
  KubernetesLangfusePdb pdb = 5;

  /**
   * Liveness probe on `/api/health`.
   */
  KubernetesLangfuseProbe liveness_probe = 6;

  /**
   * Fail the liveness probe when the worker has consumed no job on any
   * queue for longer than `queue_consumption_stuck_threshold_minutes`, so
   * a wedged worker restarts itself. Scheduled jobs keep a healthy worker
   * busy at least hourly.
   */
  bool fail_liveness_if_queue_consumption_stuck = 7;

  /**
   * Minutes without consumption before the probe above fails
   * (`LANGFUSE_QUEUE_CONSUMPTION_STUCK_THRESHOLD_MINUTES`). Empty =
   * Langfuse's default (60).
   */
  optional int32 queue_consumption_stuck_threshold_minutes = 8 [(buf.validate.field).int32.gte = 1];

  /**
   * Pod placement.
   */
  KubernetesLangfuseScheduling scheduling = 9;

  /**
   * Workload metadata and rollout.
   */
  KubernetesLangfuseWorkloadShape workload = 10;

  /**
   * Extra plain environment variables for the worker only (queue consumer
   * switches such as QUEUE_CONSUMER_BATCH_EXPORT_QUEUE_IS_ENABLED, for
   * example).
   */
  map<string, string> extra_env = 11 [(dev.planton.shared.options.secret_home) = "extra_env_from_secret"];

  /**
   * Extra environment variables for the worker read from existing
   * Secrets, keyed by variable name.
   */
  map<string, dev.planton.kubernetes.KubernetesSecretKey> extra_env_from_secret = 12;

  option (buf.validate.message).cel = {
    id: "spec.worker.extra_env.unique_names"
    expression: "!this.extra_env.exists(k, k in this.extra_env_from_secret)"
    message: "A variable may be declared in extra_env or extra_env_from_secret, not both."
  };
}

/**
 * A container image.
 */
message KubernetesLangfuseImage {
  /**
   * Image repository. Empty = the chart's
   * (docker.langfuse.com/langfuse/langfuse for web,
   * docker.langfuse.com/langfuse/langfuse-worker for the worker).
   */
  string repository = 1;

  /**
   * Image tag. Empty = the chart's appVersion for `chart_version`. Keep
   * web and worker on the same version.
   */
  string tag = 2;

  /**
   * Pull policy: Always, IfNotPresent or Never. Empty = the chart's
   * default, Always.
   */
  string pull_policy = 3 [(buf.validate.field).cel = {
    id: "spec.image.pull_policy"
    message: "Image pull policy must be one of: Always, IfNotPresent, Never."
    expression: "this == '' || this in [\"Always\", \"IfNotPresent\", \"Never\"]"
  }];

  /**
   * Names of existing image pull Secrets in Langfuse's namespace (for a
   * private mirror).
   */
  repeated string pull_secret_names = 4 [(dev.planton.shared.options.sensitive_exempt_reason) = "NAMES of existing image pull Secrets (references), not secret material"];
}

/**
 * Autoscaling. Horizontal (HPA or KEDA) and vertical (VPA); KEDA rules
 * out the other two.
 */
message KubernetesLangfuseAutoscaling {
  /**
   * HorizontalPodAutoscaler on CPU.
   */
  KubernetesLangfuseHpa hpa = 1;

  /**
   * KEDA ScaledObject (needs KEDA on the cluster - a KubernetesKeda).
   */
  KubernetesLangfuseKeda keda = 2;

  /**
   * VerticalPodAutoscaler. The chart renders it only on a cluster that
   * serves the autoscaling.k8s.io/v1 API (the VPA CRDs); elsewhere it is
   * skipped silently.
   */
  KubernetesLangfuseVpa vpa = 3;

  option (buf.validate.message).cel = {
    id: "spec.autoscaling.keda_exclusive"
    message: "KEDA owns the replica count and the resources it scales on: enable KEDA alone, or HPA and VPA without KEDA."
    expression: "!has(this.keda) || (!has(this.hpa) && !has(this.vpa))"
  };
}

/**
 * HorizontalPodAutoscaler.
 */
message KubernetesLangfuseHpa {
  /**
   * Minimum replicas.
   */
  optional int32 min_replicas = 1 [
    (dev.planton.shared.options.default) = "1",
    (buf.validate.field).int32.gte = 1
  ];

  /**
   * Maximum replicas.
   */
  optional int32 max_replicas = 2 [
    (dev.planton.shared.options.default) = "2",
    (buf.validate.field).int32.gte = 1
  ];

  /**
   * Target average CPU utilization percent.
   */
  optional int32 target_cpu_utilization_percent = 3 [
    (dev.planton.shared.options.default) = "50",
    (buf.validate.field).int32 = {
      gte: 1
      lte: 100
    }
  ];

  /**
   * Target average memory utilization percent. Empty = memory does not
   * drive scaling.
   */
  optional int32 target_memory_utilization_percent = 4 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];

  /**
   * Annotations on the HorizontalPodAutoscaler.
   */
  map<string, string> annotations = 5;

  option (buf.validate.message).cel = {
    id: "spec.autoscaling.hpa.replica_bounds"
    expression: "(has(this.min_replicas) ? this.min_replicas : 1) <= (has(this.max_replicas) ? this.max_replicas : 2)"
    message: "The autoscaler's minimum replica count cannot exceed its maximum."
  };
}

/**
 * KEDA ScaledObject.
 */
message KubernetesLangfuseKeda {
  /**
   * Minimum replicas.
   */
  optional int32 min_replicas = 1 [
    (dev.planton.shared.options.default) = "1",
    (buf.validate.field).int32.gte = 0
  ];

  /**
   * Maximum replicas.
   */
  optional int32 max_replicas = 2 [
    (dev.planton.shared.options.default) = "2",
    (buf.validate.field).int32.gte = 1
  ];

  /**
   * Seconds between metric checks.
   */
  optional int32 polling_interval_seconds = 3 [
    (dev.planton.shared.options.default) = "30",
    (buf.validate.field).int32.gte = 1
  ];

  /**
   * Resource the trigger scales on.
   */
  Trigger trigger = 4;

  /**
   * How `target_value` reads: a utilization percent or an absolute
   * average value.
   */
  MetricType metric_type = 5;

  /**
   * Target value, e.g. "50" (percent) or "1500m" (average CPU).
   */
  optional string target_value = 6 [(dev.planton.shared.options.default) = "50"];

  /**
   * Container whose metrics count. Empty = every container in the pod.
   */
  string container_name = 7;

  option (buf.validate.message).cel = {
    id: "spec.autoscaling.keda.replica_bounds"
    expression: "(has(this.min_replicas) ? this.min_replicas : 1) <= (has(this.max_replicas) ? this.max_replicas : 2)"
    message: "The autoscaler's minimum replica count cannot exceed its maximum."
  };

  /**
   * KEDA trigger resources.
   */
  enum Trigger {
    // cpu.
    trigger_unspecified = 0;
    // CPU.
    cpu = 1;
    // Memory.
    memory = 2;
  }

  /**
   * KEDA metric types.
   */
  enum MetricType {
    // Utilization.
    metric_type_unspecified = 0;
    // A percent of the requested resource.
    Utilization = 1;
    // An absolute average per pod.
    AverageValue = 2;
  }
}

/**
 * VerticalPodAutoscaler.
 */
message KubernetesLangfuseVpa {
  /**
   * Resources the VPA controls, e.g. "cpu", "memory". Empty = both.
   */
  repeated string controlled_resources = 1;

  /**
   * Upper bounds for recommendations.
   */
  dev.planton.kubernetes.CpuMemory max_allowed = 2;

  /**
   * Lower bounds for recommendations.
   */
  dev.planton.kubernetes.CpuMemory min_allowed = 3;

  /**
   * How recommendations are applied: Off, Initial, Recreate or Auto.
   */
  optional string update_mode = 4 [
    (dev.planton.shared.options.default) = "Auto",
    (buf.validate.field).cel = {
      id: "spec.autoscaling.vpa.update_mode"
      message: "VPA update_mode must be one of: Off, Initial, Recreate, Auto."
      expression: "this in [\"Off\", \"Initial\", \"Recreate\", \"Auto\"]"
    }
  ];
}

/**
 * PodDisruptionBudget. The chart creates one per workload by default
 * (one pod may be unavailable).
 */
message KubernetesLangfusePdb {
  /**
   * Create the PodDisruptionBudget.
   */
  optional bool enabled = 1 [(dev.planton.shared.options.default) = "true"];

  /**
   * Minimum pods available during a voluntary disruption: an integer or a
   * percentage.
   */
  string min_available = 2 [(buf.validate.field).cel = {
    id: "spec.pdb.min_available"
    message: "min_available must be a non-negative integer or a percentage up to 100%, such as 50%."
    expression: "this == '' || this.matches('^([0-9]+|100%|[0-9]{1,2}%)$')"
  }];

  /**
   * Maximum pods unavailable during a voluntary disruption. Empty with
   * min_available also empty = 1.
   */
  string max_unavailable = 3 [(buf.validate.field).cel = {
    id: "spec.pdb.max_unavailable"
    message: "max_unavailable must be a non-negative integer or a percentage up to 100%, such as 25%."
    expression: "this == '' || this.matches('^([0-9]+|100%|[0-9]{1,2}%)$')"
  }];

  option (buf.validate.message).cel = {
    id: "spec.pdb.one_bound"
    expression: "this.min_available == '' || this.max_unavailable == ''"
    message: "A PodDisruptionBudget takes either min_available or max_unavailable, not both."
  };
}

/**
 * An HTTP probe on the chart's health path. Empty fields keep the
 * chart's defaults.
 */
message KubernetesLangfuseProbe {
  /**
   * Seconds after start before the first probe. Empty = 20 (the chart
   * reads 0 as unset).
   */
  optional int32 initial_delay_seconds = 1 [(buf.validate.field).int32.gte = 1];

  /**
   * Seconds between probes. Empty = 10.
   */
  optional int32 period_seconds = 2 [(buf.validate.field).int32.gte = 1];

  /**
   * Seconds before a probe times out. Empty = 5.
   */
  optional int32 timeout_seconds = 3 [(buf.validate.field).int32.gte = 1];

  /**
   * Consecutive failures before the probe fails. Empty = 3.
   */
  optional int32 failure_threshold = 4 [(buf.validate.field).int32.gte = 1];

  /**
   * Consecutive successes before the probe passes. Empty = 1.
   */
  optional int32 success_threshold = 5 [(buf.validate.field).int32.gte = 1];
}

/**
 * The web Service.
 */
message KubernetesLangfuseWebService {
  /**
   * Service type: ClusterIP, NodePort or LoadBalancer. Keep ClusterIP and
   * compose a route or ingress for external access.
   */
  optional string type = 1 [
    (dev.planton.shared.options.default) = "ClusterIP",
    (buf.validate.field).cel = {
      id: "spec.web.service.type"
      message: "Service type must be one of: ClusterIP, NodePort, LoadBalancer."
      expression: "this in [\"ClusterIP\", \"NodePort\", \"LoadBalancer\"]"
    }
  ];

  /**
   * Port the web server listens on, and the Service's target port.
   */
  optional int32 port = 2 [
    (dev.planton.shared.options.default) = "3000",
    (buf.validate.field).int32.gt = 0,
    (buf.validate.field).int32.lte = 65535
  ];

  /**
   * Port the Service exposes, when it differs from `port`.
   */
  optional int32 external_port = 3 [
    (buf.validate.field).int32.gt = 0,
    (buf.validate.field).int32.lte = 65535
  ];

  /**
   * Node port, for type NodePort.
   */
  optional int32 node_port = 4 [(buf.validate.field).int32 = {
    gte: 30000
    lte: 32767
  }];

  /**
   * Annotations on the Service (internal load balancer recipes, for
   * example).
   */
  map<string, string> annotations = 5;

  /**
   * Extra labels on the Service.
   */
  map<string, string> labels = 6;
}

/**
 * Pod placement.
 */
message KubernetesLangfuseScheduling {
  /**
   * Schedule onto nodes carrying these labels.
   */
  map<string, string> node_selector = 1;

  /**
   * Tolerations for tainted nodes.
   */
  repeated dev.planton.kubernetes.WorkloadToleration tolerations = 2;

  /**
   * Node affinity: hard requirements and weighted preferences.
   */
  dev.planton.kubernetes.WorkloadNodeAffinity node_affinity = 3;

  /**
   * Pod affinity toward pods already running elsewhere.
   */
  dev.planton.kubernetes.WorkloadPodAffinity pod_affinity = 4;

  /**
   * Pod anti-affinity - spread replicas across nodes or zones.
   */
  dev.planton.kubernetes.WorkloadPodAffinity pod_anti_affinity = 5;

  /**
   * Topology spread constraints.
   */
  repeated dev.planton.kubernetes.WorkloadTopologySpreadConstraint topology_spread_constraints = 6;

  /**
   * PriorityClass for the pods.
   */
  string priority_class_name = 7;
}

/**
 * Workload metadata and rollout.
 */
message KubernetesLangfuseWorkloadShape {
  /**
   * Annotations on the pods.
   */
  map<string, string> pod_annotations = 1;

  /**
   * Labels on the pods.
   */
  map<string, string> pod_labels = 2;

  /**
   * Annotations on the Deployment.
   */
  map<string, string> deployment_annotations = 3;

  /**
   * Extra labels on the Deployment.
   */
  map<string, string> deployment_labels = 4;

  /**
   * Rollout strategy.
   */
  KubernetesLangfuseRolloutStrategy strategy = 5;

  /**
   * Old ReplicaSets kept for rollback. Empty = 10.
   */
  optional int32 revision_history_limit = 6 [(buf.validate.field).int32.gte = 0];

  /**
   * Extra /etc/hosts entries.
   */
  repeated dev.planton.kubernetes.WorkloadHostAlias host_aliases = 7;
}

/**
 * Deployment rollout strategy.
 */
message KubernetesLangfuseRolloutStrategy {
  /**
   * Strategy type: RollingUpdate or Recreate. Empty = RollingUpdate.
   */
  string type = 1 [(buf.validate.field).cel = {
    id: "spec.workload.strategy.type"
    message: "Rollout strategy type must be RollingUpdate or Recreate."
    expression: "this == '' || this in [\"RollingUpdate\", \"Recreate\"]"
  }];

  /**
   * Extra pods during a rolling update: an integer or a percentage.
   */
  string max_surge = 2;

  /**
   * Pods unavailable during a rolling update: an integer or a percentage.
   */
  string max_unavailable = 3;

  option (buf.validate.message).cel = {
    id: "spec.workload.strategy.recreate_bounds"
    message: "max_surge and max_unavailable apply only to RollingUpdate."
    expression: "this.type != 'Recreate' || (this.max_surge == '' && this.max_unavailable == '')"
  };
}

/**
 * The ServiceAccount both workloads run as.
 */
message KubernetesLangfuseServiceAccount {
  /**
   * Run as an existing ServiceAccount instead of the one the chart
   * creates (`<metadata.name>`). Its annotations are then yours to
   * manage; `annotations` and `workload_identity` are refused.
   */
  string existing_name = 1;

  /**
   * Annotations on the ServiceAccount the chart creates.
   */
  map<string, string> annotations = 2;

  /**
   * The cloud identity the ServiceAccount federates with - keyless access
   * to S3, GCS, Bedrock, Vertex and SES. Rendered as the ServiceAccount
   * annotation each cloud expects. On AKS, also label the pods
   * `azure.workload.identity/use: "true"` through `workload.pod_labels`.
   */
  dev.planton.kubernetes.KubernetesWorkloadIdentity workload_identity = 3;

  /**
   * Mount the ServiceAccount token into the pods. Workload identity on
   * EKS and GKE needs it.
   */
  optional bool automount_token = 4 [(dev.planton.shared.options.default) = "true"];

  option (buf.validate.message).cel = {
    id: "spec.service_account.existing_owns_annotations"
    message: "An existing ServiceAccount carries its own annotations: leave annotations and workload_identity unset when existing_name is set."
    expression: "this.existing_name == '' || (size(this.annotations) == 0 && !has(this.workload_identity))"
  };
}
