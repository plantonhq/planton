# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetesissuer
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The Issuer's sensitive material -- solver credentials, the ACME account key, CA keypairs -- rests in Kubernetes Secrets in its namespace; encrypting that store is the target cluster control plane's property (etcd encryption), not a seam of this spec.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Customer-managed keys for the cluster's Secret storage are configured on the cluster control plane (see enc-at-rest); this spec has no seam for them.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: spec_default
        reference: The self_signed and ca backends operate entirely in-cluster with no network path of their own; the acme and vault backends reach their signing authority over HTTPS, with server certificate verification on by default (config.acme.skip_tls_verify defaults to false and is emitted only when explicitly set true; config.vault.ca_bundle and server_name pin a private CA).
      notes: The Issuer's whole product is in-transit encryption -- it mints the certificates workloads and Ingresses terminate TLS with. Disabling ACME server verification is an explicit opt-in.
    - control_id: no-public-access
      status: not_applicable
      notes: The Issuer exposes no endpoint. ACME HTTP-01 solving briefly publishes a challenge path through the cluster's own Ingress or Gateway machinery, whose exposure posture belongs to those components.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No inbound traffic reaches this object, so there are no network sources to restrict.
    - control_id: edge-protection
      status: not_applicable
      notes: No requests flow through this object, so a web application firewall does not apply.
    - control_id: rbac
      status: not_applicable
      notes: The object's access plane is the Kubernetes API, governed by the target cluster's RBAC. Note the deliberate scoping property of this kind -- a namespace-scoped Issuer can only sign Certificates in its own namespace, so its CA keypair and DNS credentials never become cluster-wide trust (that is the ClusterIssuer trade-off).
    - control_id: workload-identity
      status: configurable
      field_path: config
      evidence:
        type: spec_default
        reference: Credential-bearing arms default to static secrets materialized as Kubernetes Secrets, but keyless arms exist where the provider supports them -- the ACME Route53 DNS-01 solver's service_account arm renders auth.kubernetes.serviceAccountRef (IRSA-style, no stored access key), and the vault backend's kubernetes_auth authenticates with a platform-issued service-account token instead of a stored Vault token or AppRole secret id.
      notes: The module materializes a credential Secret only for the static arms (Cloudflare/Route53 static keys, Azure client secrets, Vault token/AppRole, and similar); choosing the service-account arms leaves no secret to store or rotate.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The Issuer accepts no client authentication of its own; each backend authenticates outbound with the mechanism its provider defines, chosen in config. No weaker legacy path exists in the contract to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Changes to the Issuer are Kubernetes API operations, captured by the target cluster's audit policy; certificate issuance events are recorded by cert-manager on the Certificate resources, owned by that component.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The Issuer has no runtime of its own to monitor; issuance metrics (including expiry and renewal signals) are exported by cert-manager's controller, owned by the KubernetesCertManager kind.
    - control_id: backup-recovery
      status: not_applicable
      notes: The object is declarative and its material is re-derivable -- certificates are reissued on demand, and the ACME account key is regenerated by cert-manager if absent. A ca backend's CA keypair lives in a separately-owned Secret whose custody is an operational concern outside this spec.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist for this object (see backup-recovery), so retention has nothing to govern.
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The Issuer has no runtime footprint to replicate; availability of issuance is cert-manager's controller availability plus the reachability of the configured backend (ACME server, Vault).
    - control_id: deletion-protection
      status: not_applicable
      notes: Kubernetes offers no deletion-protection flag on cert-manager Issuers; deleting one stops new issuance and renewals through it but leaves already-issued certificate Secrets intact until they expire. Protection is operational (namespace RBAC, change review).
    - control_id: managed-patching
      status: not_applicable
      notes: Nothing runs here to patch. Certificate renewal is cert-manager's automatic behavior, and cert-manager itself is versioned and patched through its own component.
