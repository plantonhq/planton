syntax = "proto3";

package dev.planton.kubernetes.kubernetesissuer.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesissuer/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesissuer/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesIssuer is a namespace-scoped cert-manager Issuer for CA or self-signed certificate signing.
message KubernetesIssuer {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesIssuer'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesIssuerSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesIssuerStatus status = 5;
}

// KubernetesIssuerStatus holds the deployment status and outputs.
message KubernetesIssuerStatus {
  //outputs
  KubernetesIssuerOutputs outputs = 1;
}
