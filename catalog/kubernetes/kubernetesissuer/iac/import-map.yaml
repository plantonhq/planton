apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesissuer
spec:
  # One kubectl_manifest applying the cert-manager Issuer CR (namespaced),
  # plus conditional declared-credential Secrets the module materializes in
  # the Issuer's own namespace, for_each-keyed by the deterministic Secret
  # name.
  values:
    - name: api_version
      derivations:
        - literal: cert-manager.io/v1
      where_to_find: Always "cert-manager.io/v1" — the CR group/version this module applies.
    - name: kind
      derivations:
        - literal: Issuer
      where_to_find: Always "Issuer" — the CR kind this module applies.
    - name: name
      derivations:
        - from_metadata_name: true
        - from_output: issuer_name
      where_to_find: >-
        The Issuer's metadata.name (equals the Planton resource name) —
        `kubectl get issuers -A` (NAME column).
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The namespace the Issuer lives in — `kubectl get issuers -A`
        (NAMESPACE column).
    - name: secret_name
      derivations:
        - from_address_key: true
      where_to_find: >-
        The module keys each declared-credential Secret's address by the
        deterministic Secret name it renders
        ("<name>-acme-account-key", "<name>-solver<N>-<provider>", ...) —
        `kubectl get secrets -n <issuer namespace>`.
    - name: secret_namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        Same as the Issuer's namespace — a namespaced issuer only reads
        secrets from its own namespace.
