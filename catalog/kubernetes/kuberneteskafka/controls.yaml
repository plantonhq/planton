# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kuberneteskafka
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: Log segments rest on the PersistentVolumes the target cluster's storage class provisions (one per node, or one per JBOD volume); encryption at rest is a property of that storage (cloud-managed disks typically encrypt by default), owned by the cluster and its storage classes, not by this component.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Customer-managed keys for the underlying volumes are configured on the cluster's storage class or the cloud disk encryption set (see enc-at-rest); this spec has no seam for them.
    - control_id: enc-in-transit
      status: configurable
      field_path: listeners
      evidence:
        type: spec_default
        reference: Each listener declares its own tls flag -- true serves clients over TLS with certificates signed by the operator-managed cluster CA (renewed automatically; validity and renewal windows ride cluster_ca); false is plaintext and acceptable only for fenced internal listeners. Strimzi's internal replication and control-plane listeners are always mutually-TLS-secured by the operator regardless.
      notes: The 02-production-three-broker, 03-aws-external-loadbalancer, and 04-scram-app-cluster presets serve TLS on every client listener; 01-dev-single-node deliberately runs one plaintext internal listener.
    - control_id: no-public-access
      status: configurable
      field_path: listeners
      evidence:
        type: spec_default
        reference: The listener type defaults to internal -- in-cluster ClusterIP services only, unreachable from outside the cluster network. Exposure is an explicit choice per listener (loadbalancer, nodeport, ingress, route, tlsroute).
      notes: The 03-aws-external-loadbalancer preset is the deliberate exposure shape -- per-broker NLBs with TLS and mutual-TLS authentication; every other preset stays internal.
    - control_id: restricted-ingress
      status: configurable
      field_path: listeners
      evidence:
        type: spec_default
        reference: loadbalancer listeners restrict sources through configuration.load_balancer_source_ranges (rendered as loadBalancerSourceRanges), and every listener can require authentication (tls or scram-sha-512) so unauthenticated clients are refused at the protocol layer.
      notes: Kubernetes NetworkPolicies (separate resources) restrict the in-cluster network path itself.
    - control_id: edge-protection
      status: not_applicable
      notes: Kafka is a raw TCP protocol -- web application firewalls filter HTTP and cannot carry it (the 03 preset's NLB annotations exist precisely because an L7 balancer cannot). Inbound protection is listener TLS, authentication, and source ranges (see restricted-ingress).
    - control_id: rbac
      status: configurable
      field_path: authorization
      evidence:
        type: spec_default
        reference: Omitted means no authorizer -- every authenticated (or anonymous, on a no-auth listener) client can do everything. type simple enables Kafka's built-in ACL authorizer, enforcing the ACLs declared on KubernetesKafkaUser resources; super_users names the principals exempt from ACLs and must be populated BEFORE enabling authorization to avoid locking every client out.
      notes: The 02, 03, and 04 presets all enable simple authorization with a declared super user. Management-plane access (the Kafka and KafkaNodePool CRs) is governed by the target cluster's Kubernetes RBAC.
    - control_id: workload-identity
      status: not_applicable
      notes: The brokers call no cloud APIs -- client authentication is Kafka-native (mutual TLS certificates and SCRAM credentials issued in-cluster by the user operator), and this spec stores no cloud credentials to federate away.
    - control_id: no-legacy-auth
      status: configurable
      field_path: listeners
      evidence:
        type: spec_default
        reference: Listener authentication is omitted-equals-unauthenticated, acceptable only for fenced internal listeners; the modeled mechanisms are mutual TLS and SCRAM-SHA-512 -- no PLAIN or other weak mechanism has a typed surface (anything else must route through the custom authentication escape deliberately).
      notes: The 04-scram-app-cluster preset runs a single SCRAM-SHA-512-over-TLS listener so no anonymous path exists; 01-dev-single-node's unauthenticated plaintext listener is the documented dev exception.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Broker activity logs stream to stdout for the cluster's log collector; Kafka's authorizer logging is not modeled in this spec. Changes to the cluster's own configuration are Kubernetes API operations, captured by the target cluster's audit policy.
    - control_id: monitoring-integration
      status: configurable
      field_path: metrics
      evidence:
        type: spec_default
        reference: Unset renders no metrics surface; metrics.enabled renders the canonical Strimzi JMX exporter rules ConfigMap and enables the Prometheus endpoint (port 9404) on every broker and controller. kafka_exporter adds consumer-lag and topic/partition metrics the JMX exporter cannot see.
      notes: The 02-production-three-broker preset enables both.
    - control_id: backup-recovery
      status: not_applicable
      notes: This spec models no backup mechanism. Replication (RF 3, min ISR 2) protects against broker loss but is not a backup, and delete_claim defaults false so volumes outlive accidental cluster deletion -- survival, not restorability. Cross-cluster replication composes from KubernetesKafkaMirrorMaker2.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups are modeled (see backup-recovery), so there is no retention to configure. Topic data retention is Kafka configuration (retention.ms and friends via config), a data-lifecycle concern rather than backup retention.
    - control_id: multi-zone-ha
      status: configurable
      field_path: rack
      evidence:
        type: spec_default
        reference: Unset means partition replicas place without zone awareness; rack.topology_key (e.g. topology.kubernetes.io/zone) makes the operator inject each broker's zone from its node label so partition replicas spread across zones and consumers fetch from the closest replica. Pool replicas and the replication config entries carry the redundancy itself.
      notes: The 02 and 03 presets set rack with the zone key, run 3 controllers and 3 brokers, and carry the RF-3 / min-ISR-2 durability contract that survives one broker loss without losing acknowledged writes.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Kubernetes nor Strimzi offers a deletion-protection flag on the Kafka CR; protection is operational (namespace RBAC, change review). storage delete_claim defaults false, so the data volumes outlive the cluster and survive accidental deletion.
    - control_id: managed-patching
      status: configurable
      field_path: kafka_version
      evidence:
        type: spec_default
        reference: Empty runs the pinned Strimzi release's newest supported Kafka; pinning makes upgrades deliberate spec changes the operator rolls through the pools. metadata_version guards the KRaft one-way door -- it must stay at the old format until every node runs the new binaries. maintenance_time_windows confine certificate-renewal-triggered rolling updates to declared cron windows.
      notes: The 02-production-three-broker preset pins CA validity/renewal policy and a Sunday-early-morning maintenance window.
