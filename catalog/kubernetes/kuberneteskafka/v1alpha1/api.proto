syntax = "proto3";

package dev.planton.kubernetes.kuberneteskafka.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kuberneteskafka/v1alpha1/outputs.proto";
import "catalog/kubernetes/kuberneteskafka/v1alpha1/spec.proto";
import "shared/metadata.proto";

//kafka-kubernetes
message KubernetesKafka {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesKafka'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesKafkaSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesKafkaStatus status = 5;
}

//kafka-kubernetes status
message KubernetesKafkaStatus {
  //outputs
  KubernetesKafkaOutputs outputs = 1;
}
