syntax = "proto3";

package dev.planton.kubernetes.kubernetesudproute.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesudproute/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesudproute/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesUdpRoute is a Kubernetes Gateway API UDPRoute: a namespaced set of
// rules that attach to a Gateway and forward UDP datagrams to backend
// Services.
message KubernetesUdpRoute {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesUdpRoute'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesUdpRouteSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesUdpRouteStatus status = 5;
}

// KubernetesUdpRouteStatus holds the deployment status and outputs.
message KubernetesUdpRouteStatus {
  // outputs
  KubernetesUdpRouteOutputs outputs = 1;
}
