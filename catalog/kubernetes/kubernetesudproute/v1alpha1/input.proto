syntax = "proto3";

package dev.planton.kubernetes.kubernetesudproute.v1alpha1;

import "catalog/kubernetes/kubernetesudproute/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// Input for the KubernetesUdpRoute IaC stack. The platform resolves all
// StringValueOrRef references (namespace, parent and backend names) to literal
// strings before passing this to the IaC engine.
message KubernetesUdpRouteIacInput {
  // Target infra-component.
  KubernetesUdpRoute target = 1;
  // Kubernetes provider configuration (cluster credentials).
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
