syntax = "proto3";

package dev.planton.kubernetes.kubernetesagentsandboxtemplate.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesagentsandboxtemplate/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesagentsandboxtemplate/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesAgentSandboxTemplate is an agent-sandbox SandboxTemplate: the
// hardened blueprint of a sandbox (its pod, volumes, network fence and what a
// claim may change) from which warm pools keep sandboxes ready and claims hand
// them out.
message KubernetesAgentSandboxTemplate {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesAgentSandboxTemplate'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  KubernetesAgentSandboxTemplateSpec spec = 4 [(buf.validate.field).required = true];

  // status
  KubernetesAgentSandboxTemplateStatus status = 5;
}

// KubernetesAgentSandboxTemplateStatus holds the deployment status and outputs.
message KubernetesAgentSandboxTemplateStatus {
  // outputs
  KubernetesAgentSandboxTemplateOutputs outputs = 1;
}
