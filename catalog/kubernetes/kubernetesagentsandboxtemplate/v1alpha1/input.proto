syntax = "proto3";

package dev.planton.kubernetes.kubernetesagentsandboxtemplate.v1alpha1;

import "catalog/kubernetes/kubernetesagentsandboxtemplate/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// KubernetesAgentSandboxTemplateIacInput provides the inputs for creating the
// SandboxTemplate on a Kubernetes cluster.
message KubernetesAgentSandboxTemplateIacInput {
  // the catalog object to deploy
  KubernetesAgentSandboxTemplate target = 1;
  // provider-config
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
