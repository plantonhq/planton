apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesagentsandboxtemplate
spec:
  # One kubectl_manifest applying the SandboxTemplate. The composed import ID
  # is apiVersion//kind//name//namespace — apiVersion and kind are constants
  # of this module (it renders exactly one GVK), declared as literals.
  values:
    - name: api_version
      derivations:
        - literal: extensions.agents.x-k8s.io/v1beta1
      where_to_find: >-
        Always "extensions.agents.x-k8s.io/v1beta1" — the module pins the served version.
    - name: kind
      derivations:
        - literal: SandboxTemplate
      where_to_find: Always "SandboxTemplate" — the CR kind this module applies.
    - name: name
      derivations:
        - from_metadata_name: true
        - from_output: sandbox_template_name
      where_to_find: >-
        The SandboxTemplate's metadata.name (equals the Planton resource name) —
        `kubectl get sandboxtemplates -A` (NAME column).
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The namespace the resource lives in — `kubectl get sandboxtemplates -A`
        (NAMESPACE column).
