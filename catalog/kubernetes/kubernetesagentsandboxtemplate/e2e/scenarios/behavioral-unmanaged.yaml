# THE UNMANAGED PROMISE: with networkPolicyManagement Unmanaged the controller
# creates no NetworkPolicy and ignores the declared rules, leaving the fence
# to another system. The verifier proves the fields read back and that no
# policy exists for the template.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAgentSandboxTemplate
metadata:
  name: e2e-asbx-tpl-unmanaged
spec:
  namespace:
    value: default
  podTemplate:
    spec:
      containers:
        - name: app
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8888", "--udp-port=-1"]
  networkPolicy:
    ingress:
      - from:
          - podSelector: {}
  networkPolicyManagement: Unmanaged
