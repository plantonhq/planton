# The namespace the full-surface template lives in, referenced through
# valueFrom so the lane proves the namespace reference resolves on both
# engines. Its teardown removes the namespace after the template.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesNamespace
metadata:
  name: e2e-asbx-tpl-ns
spec:
  name: e2e-asbx-tpl-full
