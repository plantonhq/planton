apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesExternalSecret
metadata:
  name: app-config-bundle
spec:
  namespace:
    value: <app-namespace>
  storeRef:
    clusterSecretStore: # a namespaced SecretStore in this namespace instead: secretStore
      name:
        value: <cluster-secret-store-name>
  dataFrom:
    - extract:
        key: <backend-secret-path> # a structured JSON entry; every property becomes a Secret key
      rewrite:
        - source: "^prod/app/(.*)$" # strip the path prefix so Secret keys are bare names
          target: "$1"
