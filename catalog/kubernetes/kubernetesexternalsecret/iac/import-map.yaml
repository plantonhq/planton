apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesexternalsecret
spec:
  # One kubectl_manifest applying the external-secrets ExternalSecret CR
  # (namespaced). The materialized Kubernetes Secret is created by the
  # operator, never by this module, so it has no address to import.
  values:
    - name: api_version
      derivations:
        - literal: external-secrets.io/v1
      where_to_find: Always "external-secrets.io/v1" — the CR group/version this module applies.
    - name: kind
      derivations:
        - literal: ExternalSecret
      where_to_find: Always "ExternalSecret" — the CR kind this module applies.
    - name: name
      derivations:
        - from_metadata_name: true
        - from_output: external_secret_name
      where_to_find: >-
        The ExternalSecret's metadata.name (equals the Planton resource name)
        — `kubectl get externalsecrets -A` (NAME column).
    - name: namespace
      derivations:
        - from_output: namespace
        - from_spec_field: namespace.value
      where_to_find: >-
        The namespace the ExternalSecret lives in —
        `kubectl get externalsecrets -A` (NAMESPACE column).
