syntax = "proto3";

package dev.planton.kubernetes.kubernetesexternalsecret.v1alpha1;

// KubernetesExternalSecretOutputs captures observable outputs after the
// ExternalSecret is created.
message KubernetesExternalSecretOutputs {
  // Name of the created ExternalSecret (equals metadata.name).
  string external_secret_name = 1;

  // Namespace the ExternalSecret and its materialized Secret live in.
  string namespace = 2;

  // Name of the Kubernetes Secret the operator materializes (target.name,
  // defaulting to metadata.name). Workloads consume THIS Secret — wire env
  // valueFrom / volume secretName references to it.
  string secret_name = 3;
}
