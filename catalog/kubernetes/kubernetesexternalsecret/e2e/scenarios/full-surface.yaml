# The full request surface against a CLUSTER-scoped store: explicit
# cross-kind store reference (kind ClusterSecretStore, resolved through the
# cluster-store fixture's output), a dataFrom extraction of a structured
# JSON entry with key rewriting, a templated target Secret with stamped
# metadata and an assembled connection string, and explicit lifecycle
# policies. The verifier asserts Ready + materialized data — proving
# extraction, rewrite, and templating actually ran, not just that the
# object applied.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesExternalSecret
metadata:
  name: e2e-xsec-full
  annotations:
    planton.dev/e2e-prerequisites: "KubernetesClusterSecretStore"
spec:
  namespace:
    value: default
  storeRef:
    clusterSecretStore:
      name:
        valueFrom:
          name: e2e-css-fixture
  refreshInterval: 30s
  refreshPolicy: Periodic
  target:
    name: e2e-xsec-full-materialized
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      mergePolicy: Merge
      labels:
        app: e2e-consumer
      annotations:
        example.org/rendered-by: external-secrets
      data:
        connection-string: "postgres://{{ .cfg_password }}@db.example.internal:5432/app"
  dataFrom:
    - extract:
        key: conn
      rewrite:
        - source: "^(.*)$"
          target: "cfg_$1"
