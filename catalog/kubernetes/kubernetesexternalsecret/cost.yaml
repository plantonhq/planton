# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: kubernetesexternalsecret
spec:
  billing_model: free
  free_tier: An ExternalSecret is a sync declaration in the Kubernetes API server -- which backend entries the External Secrets Operator reads and how it materializes them as a Kubernetes Secret. No provider bills for the declaration or the materialized Secret, and neither reserves cluster capacity.
  notes: "No field of this spec buys anything directly, but the sync it declares drives metered reads on the OTHER side: every refresh (refresh_interval defaults to 1h) is an API read against the store's backend, and cloud secret managers meter exactly that -- AWS Secrets Manager bills per 10k API calls and per secret-month, GCP and Azure meter access operations similarly -- billed on the backend's own account. A tight refresh_interval on a large fleet multiplies those reads. The syncing compute is the KubernetesExternalSecretsOperator component; the store connection is KubernetesSecretStore / KubernetesClusterSecretStore."
