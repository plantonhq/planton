# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kubernetesserviceentry
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A registry entry stores no data beyond its own definition in the cluster's etcd; there is nothing at rest to encrypt.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Nothing is stored, so no key could apply (see enc-at-rest).
    - control_id: enc-in-transit
      status: configurable
      field_path: subject_alt_names
      evidence:
        type: spec_default
        reference: Unset applies no server-certificate pinning; when set, the proxy verifies that the external service's server certificate presents one of the listed subject alternate names when originating TLS to it.
      notes: Whether TLS is originated at all is decided by the calling workload and the mesh's destination-level TLS configuration, outside this spec. Ports declared with the TLS protocol carry already-encrypted traffic the proxy routes by SNI without terminating.
    - control_id: no-public-access
      status: not_applicable
      notes: A ServiceEntry exposes nothing -- it makes outside destinations routable FROM mesh workloads (the egress direction). No inbound exposure passes through it.
    - control_id: restricted-ingress
      status: not_applicable
      notes: There is no inbound path to restrict. The adjacent scoping knob is export_to, which narrows WHICH namespaces can see and route to the entry -- visibility scoping, not network ingress control.
    - control_id: edge-protection
      status: not_applicable
      notes: No inbound HTTP traffic is served; there is nothing for a request filter to protect.
    - control_id: rbac
      status: not_applicable
      notes: Who may create or change the ServiceEntry is the target cluster's Kubernetes RBAC on the CR; the object grants nothing itself.
    - control_id: workload-identity
      status: not_applicable
      notes: A ServiceEntry registers destinations; it authenticates to nothing. The endpoint-level service_account field associates in-mesh identity with an endpoint for the mesh's own purposes, not cloud API access.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The entry performs no authentication; there is no auth path, legacy or otherwise, to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Changes to the CR are Kubernetes API operations captured by the target cluster's audit policy; the object emits nothing itself.
    - control_id: monitoring-integration
      status: not_applicable
      notes: Traffic telemetry for the destinations it registers is generated by the proxies under the mesh's Telemetry configuration -- a separate component; the registry entry produces no signals.
    - control_id: backup-recovery
      status: not_applicable
      notes: A declarative object the IaC modules recreate from its manifest; there is no data to back up.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: A registry entry has no replicas. The endpoint-level locality field feeds locality-aware load balancing across the endpoints it lists -- a routing behavior, not replication of this object.
    - control_id: deletion-protection
      status: not_applicable
      notes: Kubernetes offers no deletion-protection flag on the CR. Deleting the entry removes the destinations from the mesh registry, breaking routes that depended on it -- protection is operational (namespace RBAC, change review).
    - control_id: managed-patching
      status: not_applicable
      notes: No software runs here; istiod and the proxies that consume this configuration are patched through their own components.
