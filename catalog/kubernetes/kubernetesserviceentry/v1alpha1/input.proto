syntax = "proto3";

package dev.planton.kubernetes.kubernetesserviceentry.v1alpha1;

import "catalog/kubernetes/kubernetesserviceentry/v1alpha1/api.proto";
import "catalog/kubernetes/provider.proto";

// KubernetesServiceEntryIacInput provides the inputs for creating the ServiceEntry on a
// Kubernetes cluster.
message KubernetesServiceEntryIacInput {
  // the catalog object to deploy
  KubernetesServiceEntry target = 1;
  // provider-config
  dev.planton.kubernetes.KubernetesProviderConfig provider_config = 2;
}
