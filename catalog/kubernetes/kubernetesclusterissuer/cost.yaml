# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: kubernetesclusterissuer
spec:
  billing_model: free
  free_tier: A cert-manager ClusterIssuer is a record in the Kubernetes API server -- the signing backend (ACME, CA, SelfSigned, or Vault) that Certificates in any namespace request signatures from -- plus the credential Secrets the module materializes alongside it. No provider bills for these objects, and they reserve no cluster capacity.
  notes: "No field of this spec buys anything: config selects WHO signs and how challenges are solved -- the reconciling work runs inside the cert-manager controller, whose compute lives on the KubernetesCertManager kind. External systems the issuer talks to bill on their own accounts through their own components: DNS-01 solvers update zones in Route53/Cloud DNS/Azure DNS/Cloudflare (hosted-zone and query pricing lives there), and a Vault backend runs on whatever hosts Vault. Public ACME CAs like Let's Encrypt sign for free."
