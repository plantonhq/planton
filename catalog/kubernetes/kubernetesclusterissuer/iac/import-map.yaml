apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: kubernetesclusterissuer
spec:
  # One kubectl_manifest applying the cert-manager ClusterIssuer CR
  # (cluster-scoped — the composed ID's namespace segment drops), plus
  # conditional declared-credential Secrets the module materializes in the
  # cert-manager namespace, for_each-keyed by the deterministic Secret name.
  values:
    - name: api_version
      derivations:
        - literal: cert-manager.io/v1
      where_to_find: Always "cert-manager.io/v1" — the CR group/version this module applies.
    - name: kind
      derivations:
        - literal: ClusterIssuer
      where_to_find: Always "ClusterIssuer" — the CR kind this module applies.
    - name: name
      derivations:
        - from_metadata_name: true
        - from_output: cluster_issuer_name
      where_to_find: >-
        The ClusterIssuer's metadata.name (equals the Planton resource name) —
        `kubectl get clusterissuers` (NAME column).
    - name: namespace
      where_to_find: >-
        Not applicable — ClusterIssuer is cluster-scoped, so the composed
        import ID has no namespace segment (the optional [//{namespace}]
        group drops).
    - name: secret_name
      derivations:
        - from_address_key: true
      where_to_find: >-
        The module keys each declared-credential Secret's address by the
        deterministic Secret name it renders
        ("<name>-acme-account-key", "<name>-solver<N>-<provider>", ...) —
        `kubectl get secrets -n <cert-manager namespace>`.
    - name: secret_namespace
      derivations:
        - from_output: secrets_namespace
        - from_spec_field: cert_manager_namespace.value
      where_to_find: >-
        The cert-manager installation namespace (the only namespace
        cert-manager reads cluster-issuer secrets from) — conventionally
        "cert-manager".
