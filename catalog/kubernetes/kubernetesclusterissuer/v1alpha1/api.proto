syntax = "proto3";

package dev.planton.kubernetes.kubernetesclusterissuer.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/kubernetesclusterissuer/v1alpha1/outputs.proto";
import "catalog/kubernetes/kubernetesclusterissuer/v1alpha1/spec.proto";
import "shared/metadata.proto";

// KubernetesClusterIssuer is a cert-manager ClusterIssuer for a single DNS domain.
message KubernetesClusterIssuer {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'kubernetes.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'KubernetesClusterIssuer'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  KubernetesClusterIssuerSpec spec = 4 [(buf.validate.field).required = true];

  //status
  KubernetesClusterIssuerStatus status = 5;
}

// KubernetesClusterIssuerStatus holds the deployment status and outputs.
message KubernetesClusterIssuerStatus {
  //outputs
  KubernetesClusterIssuerOutputs outputs = 1;
}
