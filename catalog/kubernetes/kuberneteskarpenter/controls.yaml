# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: kuberneteskarpenter
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The controller stores no data of its own -- fleet declarations (NodePools, NodeClasses) and NodeClaim records live as Kubernetes objects in the cluster's etcd, whose at-rest encryption is the cluster's posture.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Customer-managed keys for etcd are configured on the target cluster (see enc-at-rest); this spec has no seam for them.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: module_default
        reference: Every connection the controller makes is TLS -- the Kubernetes API over the cluster's TLS endpoint, and the AWS APIs (EC2, EKS, SQS, Pricing) over HTTPS. cluster.ca_bundle carries the CA for provisioned nodes' TLS bootstrap when the controller's own API-server configuration cannot.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The modules render no external exposure -- the controller accepts no inbound traffic beyond its in-cluster metrics endpoint; it only dials OUT to the Kubernetes API and the cloud provider.
    - control_id: restricted-ingress
      status: not_applicable
      notes: There is no ingress surface to restrict -- Karpenter is driven through karpenter.sh custom resources (NodePools, NodeClaims), which are Kubernetes API operations governed by the cluster's RBAC.
    - control_id: edge-protection
      status: not_applicable
      notes: The controller serves no HTTP edge traffic -- web application firewalls do not apply.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: module_default
        reference: Every fleet operation -- declaring a NodePool, inspecting a NodeClaim -- is a karpenter.sh custom-resource operation governed by the target cluster's Kubernetes RBAC, and the chart runs the controller under its own ServiceAccount bound to purpose-scoped roles.
      notes: The controller's cloud-side authority is a separate boundary -- the IAM role it assumes (see workload-identity) bounds what it may launch and terminate.
    - control_id: workload-identity
      status: configurable
      field_path: aws.irsa_role_arn
      evidence:
        type: spec_default
        reference: irsa_role_arn annotates Karpenter's service account so the controller calls EC2, EKS, SQS, and Pricing without stored keys -- the keyless posture on EKS. Unset is correct for EKS Pod Identity, where the association is configured on the AWS side; no arm of this spec ever stores a static cloud key.
      notes: All three presets use IRSA. The role's trust policy must allow the cluster's OIDC provider and the "karpenter" service account.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The controller exposes no authentication path of its own, and its cloud credentials are keyless by design (IRSA or Pod Identity) -- there is no static-key arm to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Fleet changes are karpenter.sh custom-resource operations, captured by the target cluster's Kubernetes audit policy; the cloud-side launch and terminate calls land in the cloud provider's own audit trail (CloudTrail on AWS). The controller's logs stream to stdout (controller.log_level).
    - control_id: monitoring-integration
      status: configurable
      field_path: prometheus.service_monitor
      evidence:
        type: spec_default
        reference: The controller always serves its metrics endpoint (provisioning latencies, disruption decisions, pricing lookups); service_monitor adds operator-based scrape discovery -- and the release FAILS to install without the Prometheus operator CRDs when set.
      notes: The 03-ha-tuned preset enables it.
    - control_id: backup-recovery
      status: not_applicable
      notes: The controller is stateless -- fleet declarations are Kubernetes objects that back up with the cluster, and the machines themselves are deliberately disposable (Karpenter re-provisions to fit pending pods). CRDs kept on uninstall (crds.keep_on_uninstall) protect the declarations from cascade deletion.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: spec_default
        reference: controller.replicas defaults to 2 -- an active leader plus a warm standby, spread across zones by the chart's topology constraints; controller_scheduling.priority_class_name defaults to system-cluster-critical so the provisioner outlives the workloads it provisions for.
      notes: The chart also pins controller pods away from Karpenter-provisioned nodes, so the controller never disrupts its own machine.
    - control_id: deletion-protection
      status: configurable
      field_path: crds.keep_on_uninstall
      evidence:
        type: spec_default
        reference: Default true -- the CRDs carry helm.sh/resource-policy keep, so destroying this resource leaves every NodePool, EC2NodeClass, and NodeClaim declaration in the cluster. false lets a plain uninstall cascade-delete the entire fleet's declarations.
      notes: All three presets keep the default.
    - control_id: managed-patching
      status: configurable
      field_path: chart_version
      evidence:
        type: spec_default
        reference: The chart version is pinned (default "1.14.0"; the karpenter and karpenter-crd charts version together with the controller) -- upgrades are deliberate pin changes that re-run both releases. crds.install (default true) keeps the CRDs on the upgradable companion-chart path, which Helm's bundled-CRD handling alone never provides.
      notes: All three presets pin the default.
