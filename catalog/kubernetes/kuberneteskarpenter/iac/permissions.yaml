# Least-privilege permissions the IaC runner's Kubernetes principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: kuberneteskarpenter
spec:
  kubernetes:
    rules:
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - get
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers kubernetes_namespace_v1.karpenter -- created and owned only when spec.create_namespace is true (always false for kube-system, upstream's recommended home); get is needed for refresh either way. delete applies only to module-owned namespaces.
      - api_groups:
          - apiextensions.k8s.io
        resources:
          - customresourcedefinitions
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: Covers helm_release.crds -- the companion karpenter-crd release (rendered when crds.install, spec default true) templates the NodePool, NodeClaim, and EC2NodeClass CRDs as ordinary chart resources, stamped with helm.sh/resource-policy keep when crds.keep_on_uninstall (default true). The controller release skips its bundled CRD copies unconditionally (skip_crds).
      - api_groups:
          - ""
        resources:
          - serviceaccounts
          - services
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the controller release's core objects -- the "karpenter" ServiceAccount (IRSA annotations from aws.irsa_role_arn ride it) and the controller's in-cluster Service for metrics and status endpoints (helm_release.controller).
      - api_groups:
          - apps
        resources:
          - deployments
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the karpenter controller Deployment (helm_release.controller; release name fixed to "karpenter" -- one installation per cluster is an upstream constraint).
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - clusterroles
          - clusterrolebindings
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: true
        provenance: derived
        notes: "Covers the chart's cluster-scoped RBAC for the controller ServiceAccount. Karpenter's ClusterRoles are broad by the product's nature -- cluster-wide reads of pods, nodes, and workloads to simulate scheduling, plus write authority over nodes and the karpenter.sh resources to manage the fleet's lifecycle. Kubernetes escalation prevention means the runner must already hold every permission those ClusterRoles grant, or carry the escalate verb."
      - api_groups:
          - rbac.authorization.k8s.io
        resources:
          - roles
          - rolebindings
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the chart's namespaced RBAC in the install namespace (leader-election lease access for the active-plus-standby replica pair). The same escalation-prevention caveat as the cluster-scoped rule applies.
      - api_groups:
          - policy
        resources:
          - poddisruptionbudgets
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the controller PodDisruptionBudget the chart renders by default, guarding the leader-plus-standby pair during node drains.
      - api_groups:
          - monitoring.coreos.com
        resources:
          - servicemonitors
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete
        cluster_scoped: false
        provenance: derived
        notes: Covers the ServiceMonitor rendered only when spec.prometheus.service_monitor is true (the release FAILS without the Prometheus operator CRDs on the cluster). The helm_values overlay (spec.helm_values, merged last) can extend the chart's object surface beyond these rules generally; grants for such extensions ride the operator's review of the overlay, not this manifest.
      - api_groups:
          - ""
        resources:
          - namespaces
        verbs:
          - list
          - watch
        cluster_scoped: true
        provenance: derived
        notes: Pulumi only -- list and watch, which pulumi-kubernetes v4.33.0 reads while it waits and OpenTofu, polling the one object with get, never needs. Destroying the Namespace in namespace.go waits on an informer of the deleted object's kind until it is gone, at provider/pkg/await/await.go:984-1006 and condition/deleted.go:69-96. An informer whose list is forbidden never syncs, so the deploy or destroy hangs with no error instead of failing.
