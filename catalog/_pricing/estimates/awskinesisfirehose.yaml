      exclusions:
        - Direct PUT ingestion bills per GB with 5 KB per-record rounding
        - no vpc_config is set, so the per-AZ-hour VPC delivery meter -- the one charge that would run traffic-or-none -- never starts; delivery goes to the domain's public endpoint
        - the OpenSearch domain's instances and storage bill on the referenced AwsOpenSearchDomain kind
        - failed-document backups bill S3 requests and storage on the backup bucket
      notes: Zero committed cost -- log volume drives everything; the heavy money in this pipeline is the OpenSearch domain itself, billing on its own kind.
    - preset: 03-http-endpoint-webhook
