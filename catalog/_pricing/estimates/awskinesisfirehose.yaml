        - data transfer out of AWS to the Datadog intake endpoint bills per GB on top of ingestion
        - failed-data backups bill S3 requests and storage on the backup bucket; Datadog's own ingestion pricing is external to AWS entirely
      notes: Zero committed cost -- an idle stream to a third-party endpoint bills nothing; every meter (ingestion, egress, backup) follows the log volume applications actually send.
    - preset: 04-s3-parquet-analytics
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
