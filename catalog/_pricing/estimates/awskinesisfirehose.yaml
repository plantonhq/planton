        - dynamic partitioning stacks per GB processed PLUS per 1,000 S3 objects delivered -- the 64 MiB buffer ceiling holds the object count down -- plus per-hour JQ processing while the metadata-extraction parser runs
        - delivered Parquet bills S3 requests and storage on the data-lake bucket; the Glue schema registry bills on its own service
