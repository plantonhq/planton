# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Presets with no quantity lines have no committed always-on
# spend and estimate to zero. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: gcpeventarcmessagebus
spec:
  presets:
    - preset: 01-bus-with-topic-pipeline
      region_assumption: us-central1
      currency: USD
      hours_per_month: 730
      exclusions:
        - an idle bus bills nothing -- every event published into it bills $1.00 per million (chunked at 16 KiB), and the route-everything enrollment (celMatch "true") sends 100% of them through the pipeline at $0.50 per million more
        - the pipeline applies no transformation or format conversion, so the $0.40-per-million transformation meter never starts
        - messages landing on the destination Pub/Sub topic bill Pub/Sub's own meters on that component, and INFO-severity platform logs bill Cloud Logging by volume as traffic flows
      notes: Zero committed at creation -- the smallest useful hub costs $1.50 per million events end to end (publish + deliver) once traffic exists, and nothing before that.
    - preset: 02-audit-fan-out
      region_assumption: us-central1
      currency: USD
      hours_per_month: 730
      exclusions:
        - the Google API source turns Google-service event streams (including audit logs) into bus publishers at $1.00 per million events, chunked at 16 KiB -- volume follows project activity, not configuration
        - the two enrollments split the stream without overlap (storage events vs everything else), so each published event bills exactly one $0.50-per-million pipeline delivery; neither pipeline transforms, so the $0.40-per-million meter stays idle
        - workflow-destination deliveries trigger Cloud Workflows executions billed as steps on that component, topic deliveries bill Pub/Sub meters, and INFO platform logs bill Cloud Logging by volume
      notes: Zero committed at creation -- the fan-out's cost tracks how chatty the project's Google-service event stream is, a volume the manifest cannot pin down in advance.
