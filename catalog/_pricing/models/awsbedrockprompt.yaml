# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are zero-committed: Bedrock Prompt Management
# appears nowhere in the pricing page's meter list -- storing a template is
# free, and every dollar arrives per execution at the variant model's token
# rates -- stated in exclusions, never padded into fabricated dollars.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awsbedrockprompt
spec:
  presets:
    - preset: 01-single-text-prompt
      region_assumption: us-west-2
      currency: USD
      hours_per_month: 730
      exclusions:
        - each execution bills amazon.nova-micro-v1:0's per-1M-token input and output rates -- entirely run-driven, with no free allotment on Bedrock on-demand inference
        - the maxTokens 256 cap bounds the expensive output side of every run; input cost tracks the summarized document's length, which only traffic decides
      notes: Zero committed cost -- a stored one-variant template bills nothing at rest; the token meter starts with the first summarization request, and the zero is commitment-absence.
    - preset: 02-chat-with-tools
      region_assumption: us-west-2
      currency: USD
      hours_per_month: 730
      exclusions:
        - the default chat variant bills amazon.nova-lite-v1:0's token rates per run, with the tool catalog and system context counting as input tokens on every invocation; tool-call round trips add turns, and the lookup_order tool's own backend bills wherever it runs
        - the A/B text variant bills amazon.nova-micro-v1:0's cheaper rates when callers select it -- the experiment's cost split follows the traffic split
        - maxTokens 512 caps each run's output side
      notes: Zero committed cost -- both variants are stored templates that bill nothing until invoked; per-run cost differs by variant (nova-lite vs nova-micro rate cards), so the A/B experiment is also a controlled price comparison.
