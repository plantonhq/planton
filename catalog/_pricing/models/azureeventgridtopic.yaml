# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are genuinely zero-committed: an Event Grid
# custom topic is free at rest -- the Basic tier's only meter bills
# operations, the first 100,000 each month are free, and nothing in either
# preset commits any -- stated in exclusions, never padded into fabricated
# dollars. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: azureeventgridtopic
spec:
  presets:
    - preset: 01-cloudevents-topic
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      exclusions:
        - "published events bill 0.60 USD per million operations past the monthly 100,000-operation free grant, counted in 64 KB units (a 256 KB event is four operations) -- the CloudEvents input schema changes the envelope, never the meter"
        - "delivery attempts by the event subscriptions attached to this topic bill the same meter, one operation per attempt including retries"
        - "advanced filtering (data-payload conditions) and subject-ends-with filtering on attached subscriptions bill one operation per evaluation; event-type matching and subject-begins-with are free"
        - "dead-lettered events bill as delivery operations, with blob storage charges on the destination storage account's own component"
      notes: "Zero committed cost -- the topic has no meter for existing, and a workload publishing under 100,000 operations a month (publishes plus deliveries plus billable filters) rides entirely inside the free grant."
    - preset: 02-locked-down-topic
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      exclusions:
        - "published events bill 0.60 USD per million operations past the monthly 100,000-operation free grant, counted in 64 KB units -- Entra-only auth, the IP allowlist, and the system-assigned identity are free posture that moves no meter"
        - "delivery attempts by the event subscriptions attached to this topic bill the same meter, one operation per attempt including retries"
        - "advanced filtering (data-payload conditions) and subject-ends-with filtering on attached subscriptions bill one operation per evaluation; event-type matching and subject-begins-with are free"
        - "dead-lettered events bill as delivery operations, with blob storage charges on the destination storage account's own component"
      notes: "Zero committed cost -- locking the topic down costs exactly as much as leaving it open: security here decides WHO can make operations happen, and the bill stays pure traffic arithmetic."
