# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are genuinely zero-committed: neither enables
# the stage cache cluster (the one meter on this kind that bills
# hourly, traffic or none), so every charge follows request volume --
# stated in exclusions, never padded into fabricated dollars. Schema:
# finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awsrestapigateway
spec:
  presets:
    - preset: 01-mock-health
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - every matched request bills at the REST API per-million rate (about triple the HTTP API rate) -- MOCK integrations answer from mapping templates with no backend, but the request meter runs the same
        - the first 1 million REST calls each month are free for a new account's first year (accounts created after July 15, 2025 receive a credit-based free tier instead)
        - data transfer out bills per GB on responses
      notes: Zero committed cost -- a mock health endpoint is the cheapest possible REST API, but not a free one; each health check probe is a billed request once traffic arrives.
    - preset: 02-lambda-proxy
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - requests bill per million at the tiered REST API rate; api_key_required rejects unkeyed calls but rejected requests still traverse the gateway
        - the proxied function's invocations and duration bill on its AwsLambda kind
        - no cache cluster, detailed metrics, execution logging, or X-Ray tracing is enabled -- none of those meters exists on this preset
        - data transfer out bills per GB
      notes: Zero committed cost -- one keyed route to one function, and the stage cache (the spec's only always-on meter) stays off; nothing bills until orders arrive.
