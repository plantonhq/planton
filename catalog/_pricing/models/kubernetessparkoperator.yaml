# Estimate model: the authored capacity footprints of this cluster-capacity
# kind's presets. A hand model instead of a capacity derivation because
# the chart ships REAL resource defaults (1 CPU / 2Gi, requests = limits --
# the upstream-tested JVM sizing, verified in both modules' sources) that
# stand whenever spec.resources is unset, and neither committed preset sets
# resources -- a mechanical derivation reading only the spec would replay
# both presets to a zero footprint while the pods actually reserve a full
# CPU and 2Gi each. These footprints state the chart-default reservation
# explicitly. Cluster-capacity kinds carry no priced lines -- the
# dollar value of the reservation is the target cluster's node economics.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: kubernetessparkoperator
spec:
  presets:
    - preset: 01-default
      capacity_footprint:
        cpu_requests: "1"
        memory_requests: 2Gi
        cpu_limits: "1"
        memory_limits: 2Gi
        basis: 1 operator pod x (1 CPU / 2Gi, requests = limits -- the chart's default sizing; the preset declares no resources)
      exclusions:
        - Spark driver and executor pods are created per SparkApplication/SparkCluster CR at runtime with sizing declared on those CRs -- their capacity never appears in this footprint
        - the dollar value of this capacity is the target cluster's node economics
    - preset: 02-fenced-team-namespaces
      capacity_footprint:
        cpu_requests: "2"
        memory_requests: 4Gi
        cpu_limits: "2"
        memory_limits: 4Gi
        basis: 2 operator pods (leader election -- one active reconciler, one warm standby) x (1 CPU / 2Gi, requests = limits -- the chart's default sizing; the preset declares no resources)
      exclusions:
        - Spark driver and executor pods are created per SparkApplication/SparkCluster CR at runtime with sizing declared on those CRs -- their capacity never appears in this footprint
        - the dollar value of this capacity is the target cluster's node economics
