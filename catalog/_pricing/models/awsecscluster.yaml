# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. All four presets are genuinely zero-committed: AWS charges
# no ECS cluster fee (unlike EKS), every capacity dollar flows through the
# services and instances the cluster hosts, and Container Insights bills by
# ingested volume -- stated in exclusions, never padded into fabricated
# dollars. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awsecscluster
spec:
  presets:
    - preset: 01-fargate-standard
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - no cluster fee exists -- an empty ECS cluster bills exactly nothing
        - tasks placed by services bill Fargate vCPU and memory rates on their AwsEcsService/AwsEcsTaskDefinition kinds
        - enhanced Container Insights ingests per-container performance events at CloudWatch rates as workloads run
      notes: Zero committed cost -- the free control plane is ECS's structural price advantage over EKS's hourly fee.
    - preset: 02-fargate-cost-optimized
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - the 1:4 FARGATE to FARGATE_SPOT strategy runs about 80% of scaled tasks at Spot's roughly 70% discount, interruptible with two minutes' notice -- rates apply on the services' tasks, not here
        - standard (not enhanced) Container Insights ingests cluster- and service-level events at CloudWatch rates
      notes: Zero committed cost -- the strategy shapes what future tasks cost; it spends nothing itself.
    - preset: 03-ec2-capacity
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - the referenced Auto Scaling Group's instances bill EC2 rates on that kind -- this cluster only decides when they scale
        - managed scaling's 80% target keeps one instance in five as warm headroom -- paid idle capacity on the ASG's bill
        - enhanced Container Insights ingests per-container events at CloudWatch rates
      notes: Zero committed cost on this manifest -- the EC2 capacity's committed spend is the referenced ASG's floor, visible on that kind.
    - preset: 04-managed-instances
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - managed instances launch on demand against the declared requirements (Graviton, >=1 vCPU, >=2 GiB) and bill EC2 rates plus a 30 GiB gp3 volume each while they live -- zero exist until tasks need them
        - idle instances retire after scale_in_after_seconds 300, bounding paid idle time to five minutes
        - enhanced Container Insights ingests per-container events at CloudWatch rates
      notes: Zero committed cost -- ECS launches capacity only when tasks demand it and retires it minutes after they stop.
