# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are genuinely zero-committed: the kind's
# only Cloudflare-side meter (Workers Logpush delivery, $0.05 per million
# past 10 million/month) is dataset-conditional, and neither preset pins a
# metered dataset -- 01 ships http_requests and 02 ships audit_logs_v2, both
# riding the Enterprise plan entitlement with no per-delivery fee -- stated
# in exclusions, never padded into fabricated dollars. Schema:
# finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: cloudflarelogpushjob
spec:
  presets:
    - preset: 01-http-requests-to-r2
      region_assumption: global
      currency: USD
      hours_per_month: 730
      exclusions:
        - the Workers Logpush delivery meter ($0.05 per million requests delivered past 10 million/month, Workers Paid plan) never starts -- this preset pins dataset http_requests, an Enterprise zone dataset that rides the plan entitlement with no per-delivery fee
        - destination-side costs land at the R2 bucket the job ships to -- storage and operations bill on R2's own meters, driven by the zone's traffic volume no manifest can predict
      notes: Zero committed cost -- the job object is free and the http_requests dataset carries no Cloudflare per-delivery fee; the plan entitlement (Enterprise for this dataset) is the gate, and the real spend accrues at the destination.
    - preset: 02-audit-logs-to-siem
      region_assumption: global
      currency: USD
      hours_per_month: 730
      exclusions:
        - the Workers Logpush delivery meter ($0.05 per million requests delivered past 10 million/month, Workers Paid plan) never starts -- this preset pins dataset audit_logs_v2, an account-scoped entitlement dataset, not workers_trace_events or an AI Gateway dataset
        - destination-side costs land at the SIEM the job ships to -- Splunk ingest bills outside Cloudflare entirely
      notes: Zero committed cost -- the job object is free and the audit_logs_v2 dataset carries no Cloudflare per-delivery fee; audit logs are low-volume relative to traffic datasets, and the vendor-side ingest bill is the spend to watch.
