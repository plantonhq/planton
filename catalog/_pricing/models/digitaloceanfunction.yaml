# Estimate model: the authored half of this component's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. The sole preset is genuinely zero-committed: both modules
# create a digitalocean_app containing ONLY a function component (no service,
# no worker, no instance size), so no App Platform instance charge exists and
# the GiB-second meter starts with the first invocation, not with creation --
# stated in exclusions, never padded into fabricated dollars. Schema:
# finops/componentcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostEstimateModel
metadata:
  name: digitaloceanfunction
spec:
  presets:
    - preset: 01-web-api
      region_assumption: nyc
      currency: USD
      hours_per_month: 730
      exclusions:
        - "function compute GiB-seconds bill only when the function runs -- invocation volume x memory limit (set in the repo's project.yml, not the manifest) x execution duration, 100 ms minimum per invocation; the team's first 90,000 GiB-seconds each month are free, and overage bills $0.0000185 per GiB-second ($0.07 per GiB-hour)"
        - "outbound bandwidth from the function's public endpoint follows App Platform pricing on the app and depends entirely on response traffic"
        - "log forwarding, if log_destinations were configured, would bill on the receiving system (external subscription or an OpenSearch cluster's own component) -- this preset configures none"
      notes: "Zero committed cost -- the preset deploys one Node.js hello-world function component from a public git source with a single plaintext env var; nothing in it provisions an instance, and a deployed function that receives no invocations bills nothing. Spend starts with traffic, and only after the team's monthly 90,000 GiB-second free allowance (shared across all functions on the team) is consumed."
