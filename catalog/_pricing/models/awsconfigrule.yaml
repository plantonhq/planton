# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are zero-committed: the rule object is free,
# evaluations bill per resource examined only where a running recorder
# feeds them, and neither preset invokes billed compute -- stated in
# exclusions, never padded into fabricated dollars.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awsconfigrule
spec:
  presets:
    - preset: 01-managed-rule-with-remediation
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - each S3 bucket the change-triggered managed rule examines bills one evaluation on the tiered per-evaluation schedule from the first -- AWS Config publishes no free tier, and the bucket-type scope is the volume trim
        - remediation is configured but not automatic -- each operator-triggered fix runs the SSM automation document (any Systems Manager charges follow that service's pricing) and the fix itself records a configuration item and re-evaluates the rule
        - the configuration items that feed evaluations bill on the region's AwsConfigRecorder component; a rule in a recorder-less region evaluates nothing -- no bill, and no compliance signal either
      notes: Zero committed cost -- the rule waits for bucket changes to judge; keeping remediation manual also keeps the fix-drift-fix evaluation loop from running unattended.
    - preset: 02-guard-policy-rule
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - each in-scope S3 bucket evaluation bills on the same tiered per-evaluation schedule -- but the custom-policy Guard engine carries no compute charge at all, the zero-infrastructure alternative to a custom-lambda rule whose function invocations would bill per evaluation
        - the configuration items feeding evaluations bill on the region's AwsConfigRecorder component
      notes: Zero committed cost -- custom logic without a custom bill; the Guard policy evaluates for the per-evaluation fee alone, and only when buckets change.
