# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets DO commit fires -- ~30/month for the daily
# cron, ~2,880-2,920/month for the 15-minute rate -- but both volumes sit
# thousands of times inside Scheduler's STANDING 14M-invocations-per-month
# free allowance, so the schedules' own line items are $0.00; what the
# fires LAUNCH bills on the referenced targets -- stated in exclusions,
# never padded into fabricated dollars.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awseventbridgescheduler
spec:
  presets:
    - preset: 01-cron-to-lambda
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - "the cron COMMITS ~30 fires per month (one nightly report at 2am Eastern) -- a committed volume, but one sitting ~466,000x inside Scheduler's free allowance of 14,000,000 invocations per month, a STANDING monthly allowance recalculated forever (not a trial; unused amounts do not roll over; $1.00 per million applies only beyond it)"
        - the report generator's execution bills on the referenced AwsLambda -- invocations and duration per nightly run, with up to 3 retries multiplying the function's own invocation count on failure
        - undeliverable fires land in the dead-letter queue, billing SQS requests on the referenced AwsSqsQueue
        - the owned schedule group is a free container -- no meter counts it
      notes: "The zero is free-tier coverage, not idleness: ~30 committed invocations per month cost $0.00 under the permanent 14M-per-month allowance, and they would still round to $0.00 at the paid rate ($1.00 per million). The nightly Lambda run is where real spend lives, on its own component."
    - preset: 02-rate-to-ecs-task
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - "rate(15 minutes) COMMITS ~2,880 fires per 30-day month (~2,920 per 730-hour month) -- a committed volume sitting ~4,800x inside Scheduler's standing free allowance of 14,000,000 invocations per month (permanent, recalculated monthly, never rolling over; $1.00 per million only beyond it), so the schedule's own meter reads $0.00"
        - "EVERY fire launches a REAL Fargate task: ~2,900 monthly RunTask launches of the queue-drainer task definition, whose vCPU-seconds and GB-seconds of runtime bill on the ECS target components (the referenced AwsEcsCluster / AwsEcsTaskDefinition) -- this preset's actual spend lives there, scaling with task size and how long each drain runs"
        - the FLEXIBLE 5-minute window spreads WHEN fires land; it never changes how many fire or bill
        - this instance only JOINS the batch-jobs group by name -- no group resource, no group cost
      notes: "The zero belongs to the SCHEDULER meter alone -- ~2,880 committed fires cost $0.00 under the permanent free tier. The preset's real commitment is downstream: a Fargate task every 15 minutes is ~2,900 task runs a month billed on the ECS side, a spend this model deliberately routes rather than estimates (task duration is unknowable from the manifest)."
