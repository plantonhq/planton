# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. All three presets are genuinely zero-committed: every one
# pins the S0 pay-as-you-go tier, the account object carries no meter of its
# own (the retail price family publishes no account- or endpoint-hour unit),
# and the commitment tiers some kinds sell attach through commitment plans
# -- an ARM surface this spec does not model -- stated in exclusions, never
# padded into fabricated dollars. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: azurecognitiveaccount
spec:
  presets:
    - preset: 01-azure-openai-account
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      exclusions:
        - every model call bills per-token usage meters through the model DEPLOYMENTS hosted on this account -- the AzureCognitiveDeployment component, where any provisioned-throughput (PTU) spend would also live
        - commitment tiers are commitment-plan purchases outside this spec -- nothing a manifest of this kind creates can commit spend
        - a private-endpoint path to the account bills hourly on the private endpoint's own component
      notes: Zero committed cost -- the OpenAI account is the billing container and endpoint holder; S0 has no floor, and an account with no deployments and no calls bills exactly nothing.
    - preset: 02-ai-foundry-account
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      exclusions:
        - the multi-service account's calls bill each service's own usage meters (per-1K transactions, per-token, per-audio-hour by kind and feature), and model deployments bill through the AzureCognitiveDeployment component
        - AI Foundry projects created on the account are free routing/organization objects, but the agents and models they exercise bill usage on this account's meters and the deployments' meters
        - commitment tiers are commitment-plan purchases outside this spec
      notes: Zero committed cost -- project management and the managed identity are free posture; the AIServices account idles at zero until something calls it.
    - preset: 03-private-hardened-account
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      exclusions:
        - the network perimeter (Deny default, IP and VNet rules, trusted-services bypass) and the keys-off posture are free configuration -- hardening moves WHO can call, not what a call costs
        - calls that do get through bill the kind's usage meters exactly as on an open account
        - the outbound FQDN allowlist is free data-loss-prevention posture; a private-endpoint ingress path would bill on its own component
      notes: Zero committed cost -- the locked-down account bills identically to the open one, which is the point; security posture on this kind is free.
