# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. All four presets are genuinely zero-committed: a project's
# existence is free, no preset joins a reserved fleet or enables the
# per-second Docker image server (the two always-billing arms), and every
# meter is build minutes that follow commits -- stated in exclusions,
# never padded into fabricated dollars.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awscodebuildproject
spec:
  presets:
    - preset: 01-github-ci-linux
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - builds bill per minute (rounded up) at the general1.small Linux rate as webhook pushes and pull requests trigger them -- and the first 100 monthly minutes on this exact compute type are a permanent free allotment
        - the webhook's main-branch and PR filters are the volume throttle -- only matching events start billed builds
        - build log ingestion bills on CloudWatch Logs at standard rates
      notes: Zero committed cost -- an idle project bills nothing, and a quiet repo on the smallest compute type can live entirely inside the permanent 100-minute free tier.
    - preset: 02-docker-build-ecr
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - builds bill per minute at the general1.large rate -- the large type costs several times the small one, and the 30-minute timeout caps each build's worst-case spend
        - the LOCAL Docker-layer and source caches live on the build host at no storage charge, repaying themselves in shortened billed minutes -- unlike an S3 cache, nothing bills between builds
        - image pushes to ECR bill data transfer and storage on the ECR repository component; build logs bill CloudWatch ingestion
      notes: Zero committed cost -- privileged mode and BuildKit change what a build can do, not what it costs at rest; the per-minute meter starts with a push to main or a release branch.
    - preset: 03-codepipeline-stage
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - builds bill per minute at the general1.medium rate each time the owning pipeline invokes this stage; the 20-minute timeout and 3-build concurrency cap bound both per-build and burst spend
        - artifacts flow through the pipeline's S3 artifact store, billing on that bucket via the AwsCodePipeline component
        - the pipeline's own action-execution charges bill on the AwsCodePipeline component
      notes: Zero committed cost -- a stage that is never invoked bills nothing; the meter runs exactly as often as the pipeline does.
    - preset: 04-fork-pr-gated-oss-ci
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - builds bill per minute at the arm1 medium rate on pushes and pull requests -- ARM's rate table undercuts x86 at comparable sizes, and the small ARM type shares the 100-minute permanent free allotment (this preset's medium type does not)
        - the fork-PR comment-approval gate is a cost control in security clothing -- fork pull requests bill nothing until a maintainer approves the run
        - autoRetryLimit 1 can double a failing build's billed minutes -- one automatic re-run per failure
      notes: Zero committed cost -- an OSS project's bill follows contributor activity, and the approval gate keeps strangers from spending the account's build minutes.
