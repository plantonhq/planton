# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. A hand model with each preset's additional-instance
# quantity computed and defended in its basis: Bastion's scaling meter is
# excess-over-baseline -- the SKU's base gateway rate INCLUDES the first 2
# instances and only scale units above 2 bill the additional-instance
# meter. The derivation grammar's subtract_baseline factor can now state
# that (scale_units - 2) arithmetic, so this model is due migration to a
# derivation. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: azurebastionhost
spec:
  presets:
    - preset: 01-basic-host
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: gateway hours
          price: bastion-basic-gateway-eastus
          pricing_quantity: "730"
          quantity_basis: one BASIC host bills its flat hourly gateway meter around the clock (x 730); the SKU's fixed 2 instances are part of the base rate, and BASIC has no additional-instance meter to reach
      exclusions:
        - outbound data transfer through sessions bills per GB in volume tiers after the free 5 GB/month
        - the referenced Standard public IP bills hourly on its own kind
      notes: Billing runs from provisioning until deletion, sessions or no sessions -- an idle jump host costs the same as a busy one.
    - preset: 02-standard-tunneling
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: gateway hours
          price: bastion-standard-gateway-eastus
          pricing_quantity: "730"
          quantity_basis: one STANDARD host bills its flat hourly gateway meter around the clock (x 730), with the first 2 scale units included in the base rate
        - sku_meter: additional instance hours
          price: bastion-standard-additional-gateway-eastus
          pricing_quantity: "1460"
          quantity_basis: scale_units 4 means 2 units ride the base rate and 2 bill the additional-instance meter -- 2 x 730 hours
      exclusions:
        - outbound data transfer through sessions bills per GB in volume tiers after the free 5 GB/month
        - the referenced Standard public IP bills hourly on its own kind
      notes: The feature toggles this preset enables (tunneling, file copy, IP connect) gate on the STANDARD SKU but add no meters -- capacity (scale_units) is the only dial beyond the SKU itself, adjustable in place.
    - preset: 03-developer
      region_assumption: eastus2
      currency: USD
      hours_per_month: 730
      exclusions:
        - outbound data transfer through sessions bills per GB in volume tiers after the free 5 GB/month
        - the target virtual machines bill on their own kinds
      notes: "The DEVELOPER SKU is genuinely free: Azure-hosted shared infrastructure with no gateway meter at all (the Retail Prices API carries no Developer meter -- verified), no dedicated subnet, and no public IP. The estimate totals to zero because the committed spend IS zero; the real money lives in outbound data transfer and the VMs being reached. The trade is capability: one connection per user, no feature knobs, limited regions."
