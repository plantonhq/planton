# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. All four presets are genuinely zero-committed: a deployed
# Worker with no traffic costs $0 per the kind's own cost profile --
# requests and CPU meter on invocations, log events on logged invocations,
# binding usage on the bound services -- and none of the presets schedules a
# cron or pins plan spend. Stated in exclusions, never padded into
# fabricated dollars. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: cloudflareworker
spec:
  presets:
    - preset: 01-api-with-custom-domain
      region_assumption: global
      currency: USD
      hours_per_month: 730
      exclusions:
        - the "Workers requests and CPU time" meter (Workers Paid 10 million requests and 30 million CPU-ms included, then $0.30/million requests and $0.02/million CPU-ms; Workers Free 100,000 requests/day) follows traffic on the custom domain -- volume and per-request CPU are unknowable from the manifest
        - the Workers Logs meter starts with observability enabled at full sampling (head_sampling_rate 1) -- one-plus events per invocation against the Paid plan's 20 million/month included, then $0.60/million; zero invocations log zero events
        - KV and D1 usage through the CONFIG and DB bindings meters on the bound CloudflareKvNamespace and CloudflareD1Database components
        - the Workers Trace Events Logpush meter never starts -- this preset leaves logpush off
        - the $5/mo Workers Paid subscription is account-level plan spend -- no field in this spec pins it
      notes: "Zero committed cost -- the bundle deploys from R2, bindings are capability grants, and every meter (requests, CPU, log events, bound-service usage) waits for the first request."
    - preset: 02-minimal
      region_assumption: global
      currency: USD
      hours_per_month: 730
      exclusions:
        - the "Workers requests and CPU time" meter (Workers Free 100,000 requests/day with 10 ms CPU per invocation; Workers Paid 10 million requests and 30 million CPU-ms included, then $0.30/million and $0.02/million) follows workers.dev traffic
        - the Workers Logs and Workers Trace Events Logpush meters never start -- this preset configures neither observability nor logpush
        - no bindings exist, so no downstream component metering starts
        - the $5/mo Workers Paid subscription is account-level plan spend -- no field in this spec pins it
      notes: "Zero committed cost -- a hello-world script on workers.dev rides the Free plan's daily allotment until real traffic outgrows it."
    - preset: 03-static-site
      region_assumption: global
      currency: USD
      hours_per_month: 730
      exclusions:
        - the "Workers requests and CPU time" meter cannot start on asset routes -- Cloudflare states requests to static assets are free and unlimited, and this preset has no script source, so every route is an asset route
        - the Workers Logs and Workers Trace Events Logpush meters never start -- neither observability nor logpush is configured
        - no bindings exist, so no downstream component metering starts
        - the $5/mo Workers Paid subscription is account-level plan spend -- no field in this spec pins it
      notes: "Zero committed cost -- and uniquely in this lane, near-zero USAGE cost too: a pure static site bills no request meter at any traffic level."
    - preset: 04-full-stack-app
      region_assumption: global
      currency: USD
      hours_per_month: 730
      exclusions:
        - the "Workers requests and CPU time" meter (Workers Paid 10 million requests and 30 million CPU-ms included, then $0.30/million and $0.02/million; Workers Free 100,000/day) bills only the /api/* routes the script handles -- all other routes serve as static assets, free and unlimited
        - KV usage through the SESSIONS binding meters on the bound CloudflareKvNamespace component
        - the Workers Logs and Workers Trace Events Logpush meters never start -- neither observability nor logpush is configured
        - the $5/mo Workers Paid subscription is account-level plan spend -- no field in this spec pins it
      notes: "Zero committed cost -- the run-worker-first rule confines billable invocations to API paths; everything else rides the free static-asset lane."
