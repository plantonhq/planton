# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are zero-committed: a workspace has no
# per-workspace fee (verified on AWS's pricing page), and every meter a
# preset configures (ingestion, storage, query samples processed) bills
# only as writers actually send metrics -- stated in exclusions, never
# padded into fabricated dollars.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awsmanagedprometheus
spec:
  presets:
    - preset: 01-eks-metrics-workspace
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - ingestion bills $0.90 per 10 million samples (first 2-billion monthly tier) only when workloads remote-write or a collector feeds the workspace -- this manifest wires no writer, so the count is workload-decided
        - storage accumulates at $0.03 per GB-month, prorated hourly and billed only when metrics arrive; the pinned 90-day retention scales the standing GB once ingestion starts
        - the platform-slos rule namespace (a recording rule and an error-rate alert) evaluates as PromQL on schedule, billing query samples processed at $0.10 per billion -- effectively zero over an empty workspace, small but real once series exist (AWS's own always-on alerting-rule example lands at $0.04 per month)
        - alertmanager notifications ride the SNS topic named in the definition, which bills as its own kind
        - the AWS Free Tier table (40 M samples, 200 B QSP, 10 GB) may absorb early usage where the account is eligible
      notes: Zero committed cost -- the workspace, its rule file, and its alertmanager document carry no existence fee; every dollar waits on the first remote-write. The zero is commitment-absence, not a free service.
    - preset: 02-governed-multi-team
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - ingestion bills $0.90 per 10 million samples as teams write -- and this preset's label-set limits (2,000,000 active series for team=ingest, 200,000 for team=experiments) are governors that CAP that meter per population rather than meters of their own
        - storage accumulates at $0.03 per GB-month against the pinned 30-day retention once samples arrive
        - the ingest-rate anomaly detector re-runs its PromQL query each evaluation interval, billing query samples processed at $0.10 per billion -- near zero until the remote-write stream it watches exists
        - query logging writes expensive-query records (above the 100,000-QSP threshold) into the referenced AwsCloudwatchLogGroup, which bills its own ingestion and storage
        - the AWS Free Tier table (40 M samples, 200 B QSP, 10 GB) may absorb early usage where the account is eligible
      notes: Zero committed cost -- limits, query logging, and the anomaly detector are all configuration, not meters; existence commits nothing until something remote-writes. The zero is commitment-absence, not a free service.
