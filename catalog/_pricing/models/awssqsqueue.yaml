# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are genuinely zero-committed: SQS bills per
# request with no storage or existence charge, so an idle queue costs
# exactly nothing -- stated in exclusions, never padded into fabricated
# dollars. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awssqsqueue
spec:
  presets:
    - preset: 01-standard-queue
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - requests bill per million after the always-free first million; 20-second long polling (receive_wait_time_seconds) minimizes empty receives
        - message retention is free at any length -- the 4-day default changes exposure, never cost
        - data transfer out of the region bills per GB
      notes: Zero committed cost -- an idle standard queue with SSE-SQS encryption bills nothing at rest.
    - preset: 02-fifo-with-deduplication
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - FIFO requests bill about 25% above standard-queue requests; high-throughput mode (perMessageGroupId) raises the ceiling, not the rate
        - the dead-letter queue referenced by dead_letter_config is its own component billing its own requests
        - data transfer out of the region bills per GB
      notes: Zero committed cost -- FIFO ordering and deduplication change the per-request rate, never the (zero) baseline.
