# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are zero-committed: a connection and a
# destination exist for free, and the only EventBridge meter here --
# invocation events at $0.20 per million in 64 KB chunks -- runs exactly
# as fast as the rules, pipes, and schedules pointed at the destination
# fire, which the manifest cannot see -- stated in exclusions, never
# padded into fabricated dollars.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awseventbridgeapidestination
spec:
  presets:
    - preset: 01-api-key-webhook
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - invocations bill $0.20 per million events delivered, counted in 64 KB chunks, from the FIRST event -- API destinations have no free allotment, and this partner-webhook manifest commits zero volume of its own
        - the 50-per-second rate limit is a ceiling protecting the partner API, not a spend commitment -- it queues bursts, and every event eventually delivered still bills once
        - data transfer out to the public HTTPS endpoint bills at standard AWS internet data-transfer rates on top of the invocation meter
        - the invoking side meters separately on its own kind -- custom events ingested by the event bus that fires this destination bill $1.00 per million there
        - the partner API's own ingestion pricing lives entirely outside AWS
      notes: Zero committed cost -- the api-key connection and the webhook destination carry no existence fee; the invocation meter starts only when something fires events at the destination, a volume the manifest cannot see.
    - preset: 02-oauth-saas
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - invocations bill $0.20 per million events delivered, counted in 64 KB chunks, from the FIRST event -- no free allotment exists, and this CRM-events manifest commits zero volume of its own
        - the OAuth token fetches EventBridge performs against the authorization endpoint before invoking are not metered -- OAuth costs nothing extra over api-key auth
        - the 25-per-second rate limit queues bursts without discounting them -- delivered events bill regardless of how long they waited
        - data transfer out to the public HTTPS endpoint bills at standard AWS internet data-transfer rates on top of the invocation meter
        - the invoking side meters separately on its own kind, and the CRM SaaS prices its own API entirely outside AWS
      notes: Zero committed cost -- the OAuth connection and destination bill nothing at rest; every dollar waits on upstream rules, pipes, or schedules actually firing events, which the manifest cannot see.
