# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. A hand model rather than a derivation: the billed quantity
# is the SUM of cpu and memory across the containers list, and derivation
# rules cannot traverse a repeated field -- each preset's sum is computed
# here and defended in its quantity basis. Schema:
# finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: azurecontainerinstance
spec:
  presets:
    - preset: 01-public-web-container
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: vCPU duration
          price: aci-standard-vcpu-eastus
          pricing_quantity: "365"
          quantity_basis: the group allocates 0.5 vCPU (one container, cpu 0.5) and the default Always restart policy keeps it running all month -- 0.5 x 730 hours
        - sku_meter: Memory duration
          price: aci-standard-memory-eastus
          pricing_quantity: "730"
          quantity_basis: the group allocates 1 GB (one container, memory 1) around the clock -- 1 x 730 hours
      exclusions:
        - image pull seconds and registry-side egress precede every start
        - network egress follows traffic and client placement
      notes: Billing is per second of allocated capacity, so the 730-hour figure is exact only for a group that never restarts or stops; the liveness probe restarts the container in place without a billing gap.
    - preset: 02-private-vnet-worker
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: vCPU duration
          price: aci-standard-vcpu-eastus
          pricing_quantity: "730"
          quantity_basis: the group allocates 1 vCPU (one container, cpu 1) and the default Always restart policy keeps the worker running all month -- 1 x 730 hours
        - sku_meter: Memory duration
          price: aci-standard-memory-eastus
          pricing_quantity: "1460"
          quantity_basis: the group allocates 2 GB (one container, memory 2) around the clock -- 2 x 730 hours
      exclusions:
        - the delegated subnet and the user-assigned identity are their own components; the group's private IP is free
        - image pull seconds and registry-side egress precede every start
        - network egress follows traffic and client placement
      notes: Private networking changes posture, not price -- the vCPU and memory meters read the same inside a subnet.
    - preset: 03-run-once-job
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      exclusions:
        - the job's runtime -- the only quantity the meters bill -- is decided by the migration's data, which no manifest can know
        - Spot capacity bills discounted per-second meters (Standard Spot vCPU Duration / Standard Spot Memory Duration) and can be evicted mid-run, so reruns multiply the billed seconds
        - the init container bills its startup seconds on the same meters
        - image pull seconds and registry-side egress precede every start
      notes: "A run-to-completion job (restart policy Never) has no committed always-on spend: it bills 2 vCPU and 4 GB per second only while migrate.py actually runs, at Spot's discounted rates. The estimate totals to zero not because the job is free but because its duration is unknowable from the manifest -- a ten-minute run bills ten minutes."
