# Estimate model: hand-computed capacity footprints for this
# cluster-capacity kind's presets. A derivation cannot state this
# kind honestly: Trivy's sizing (200m / 512Mi requests, 1 CPU / 1Gi
# limits) is the CHART's own default, carried by no spec annotation the
# capacity estimator could read -- a derived footprint would silently
# omit an always-scheduled scanner -- and the internal database/Redis
# arms deploy conditionally on the vendor choices, so their annotated
# defaults cannot be bound without fabricating reservations for pods an
# externally-composed install never runs. Each preset's totals are
# therefore computed by hand: the sum over workload classes of replicas
# x (declared resources, or the spec-declared defaults when omitted),
# plus every volume the manifest binds at its declared or defaulted
# size. Anything only the chart sizes (the registryctl container in the
# registry pods, the harbor-exporter) is excluded. Cluster-capacity
# kinds carry no priced lines -- the dollar value of the
# reservation is the target cluster's node and storage-class economics,
# which this catalog cannot know.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: kubernetesharbor
spec:
  presets:
    - preset: 01-minimal
      capacity_footprint:
        cpu_requests: 850m
        memory_requests: 2176Mi
        cpu_limits: 7500m
        memory_limits: 7680Mi
        persistent_storage: 28Gi
        basis: "5 stateless components (core, portal, registry, jobservice, nginx) x 1 replica x (100m CPU / 256Mi requests, 1 CPU / 1Gi limits) from the spec-declared defaults (the platform applies them when the manifest omits resources), plus Trivy 1 replica x (200m / 512Mi requests, 1 CPU / 1Gi limits -- the chart's own defaults), plus the internal PostgreSQL (100m / 256Mi requests, 1 CPU / 1Gi limits) and internal Redis (50m / 128Mi requests, 500m / 512Mi limits) from their spec-declared defaults; storage = 20Gi declared artifact volume + 1Gi job-log + 5Gi Trivy cache + 1Gi database + 1Gi Redis volumes at their spec-declared defaults"
      exclusions:
        - the dollar value of this capacity is the target cluster's node and storage-class economics
        - "the registryctl container in the registry pods and the harbor-exporter keep chart-default sizing the spec does not declare -- real consumption, no stated reservation"
        - "the internal database and Redis are single-node evaluation-grade arms; their StatefulSet-template volumes are NEVER deleted by uninstall (and the artifact and job-log volumes are kept by default) -- retired installs keep the storage until swept explicitly"
        - artifact blob growth and Trivy's ~12-hourly vulnerability-database downloads are workload-driven and unknowable at manifest time
    - preset: 02-production-composed
      capacity_footprint:
        cpu_requests: 1200m
        memory_requests: 3Gi
        cpu_limits: "11"
        memory_limits: 11Gi
        persistent_storage: 6Gi
        basis: "5 stateless components (core, portal, registry, jobservice, nginx) x 2 replicas x (100m CPU / 256Mi requests, 1 CPU / 1Gi limits) from the spec-declared defaults (the platform applies them when the manifest omits resources), plus Trivy (enabled by default) 1 replica x (200m / 512Mi requests, 1 CPU / 1Gi limits -- the chart's own defaults); storage = 1Gi job-log + 5Gi Trivy cache volumes at their spec-declared defaults -- artifact blobs live in S3, metadata in the external database"
      exclusions:
        - the dollar value of this capacity is the target cluster's node and storage-class economics
        - "the composed state stores carry their own footprints: the KubernetesPostgres database, the KubernetesValkey cache, and the KubernetesSeaweedFs object store holding every artifact blob"
        - the LoadBalancer front door provisions a provider-billed load balancer outside this capacity statement
        - "the registryctl container in the registry pods and the metrics-enabled harbor-exporter keep chart-default sizing the spec does not declare -- real consumption, no stated reservation"
