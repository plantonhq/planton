# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awsroute53zone
spec:
  presets:
    - preset: 01-public-zone
      region_assumption: global
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: hosted zones
          price: route53-hosted-zone
          pricing_quantity: "1"
          quantity_basis: one hosted zone, billed monthly at the first-25-zones tier rate
      exclusions:
        - DNS queries bill per million answered and follow traffic
        - records, health checks, and routing policies are separate components
    - preset: 02-private-vpc-zone
      region_assumption: global
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: hosted zones
          price: route53-hosted-zone
          pricing_quantity: "1"
          quantity_basis: one hosted zone, billed monthly at the first-25-zones tier rate -- private zones pay the same fee
      exclusions:
        - records and resolver-side monitoring are separate components
      notes: In-VPC queries against a private zone are free, so the zone fee is this preset's whole bill.
    - preset: 03-dnssec-signed-zone
      region_assumption: global
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: hosted zones
          price: route53-hosted-zone
          pricing_quantity: "1"
          quantity_basis: one hosted zone, billed monthly at the first-25-zones tier rate -- DNSSEC signing adds no Route 53 charge
      exclusions:
        - DNS queries bill per million answered and follow traffic
        - the DNSSEC signing key bills on its referenced AwsKmsKey component (monthly key fee plus per-request signing)
        - records, health checks, and routing policies are separate components
