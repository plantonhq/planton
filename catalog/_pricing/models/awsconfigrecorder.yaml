# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are zero-committed: the recorder object is
# free and its one meter -- configuration items recorded -- follows the
# fleet's size and change rate, which the manifest scopes but cannot
# count -- stated in exclusions, never padded into fabricated dollars.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awsconfigrecorder
spec:
  presets:
    - preset: 01-scoped-recording
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - every configuration change to an in-scope S3 bucket, security group, or IAM role records one billed item at the continuous per-item rate -- AWS Config publishes no free allotment, and the three-type inclusion list is the volume trim
        - history and daily snapshot files delivered to the referenced bucket bill S3 storage and requests there
        - the 365-day retention of recorded items carries no Config meter of its own
        - rule and conformance-pack evaluations fed by these items bill on their own components
      notes: Zero committed cost -- a recorder over resources that never change records nothing; the inclusion list keeps the meter tied to three deliberate types instead of the whole fleet.
    - preset: 02-full-recording-posture
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - the unrestricted scope records every supported resource type, so the item meter scales with the whole regional fleet's change rate at the continuous per-item rate
        - global resources (IAM users, roles, policies) are recorded here too -- running this posture in more than one region bills the same IAM changes repeatedly, which is why global recording belongs in exactly one region
        - the DAILY override parks EC2 instances and network interfaces at one item per resource per day -- a rate four times the continuous per-item price that wins exactly when those chatty types change more than four times daily
        - snapshot and history files bill S3 storage on the referenced bucket
      notes: Zero committed cost -- full-fleet recording commits nothing at creation, but this is the widest scope the kind offers, and every resource change in the region starts the meter.
