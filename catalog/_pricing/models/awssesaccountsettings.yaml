# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are zero-committed: the SES account object
# exists per account+region whether or not this kind manages it, the
# suppression arm has no meter at all, and the VDM arm's per-email fee has
# no fixed monthly component -- every meter a preset can start bills on the
# account's send volume as it happens, stated in exclusions, never padded
# into fabricated dollars.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awssesaccountsettings
spec:
  presets:
    - preset: 01-reputation-defaults
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - the suppression arm (BOUNCE + COMPLAINT) starts no meter -- no charge counts suppression-list entries or the sends they block; if anything it saves the per-1,000 sending fee on every suppressed recipient
        - the account's outbound sending bills on its own meters ($0.10 per 1,000 emails a la carte plus $0.12 per GB of attachment data) and starts with the first send -- account activity, not this manifest
      notes: Zero committed cost -- pure configuration with no billable arm enabled; the account object it configures exists for free either way.
    - preset: 02-vdm-analytics
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - vdm.enabled starts the VDM per-email fee ($0.07 per 1,000 emails for the first 10M a month, stepping down at higher tiers) on every email the account sends in the region -- proportional to send volume, zero in an idle account, with no fixed monthly component
        - VDM dashboard queries bill $0.0005 per 1,000 beyond the permanent 5,000-free-queries-per-month allotment
        - "VDM Global deliverability ($1,250 per month flat) is a separate console-purchased add-on this API never enables"
        - the account's outbound sending bills on its own meters ($0.10 per 1,000 emails plus $0.12 per GB of attachment data) regardless of VDM
      notes: Zero committed cost is commitment-absence, not "free" -- VDM is a real billing decision whose per-email meter starts with the account's first send; AWS attaches no monthly minimum to enabling it, which is what keeps an idle account at zero.
