# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: gcpredisinstance
spec:
  presets:
    - preset: 01-basic-cache
      region_assumption: us-central1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: provisioned capacity
          price: redis-basic-m1-us-central1
          pricing_quantity: "730"
          quantity_basis: 1 GiB provisioned x 730 hours at the BASIC tier's M1 band rate (1-4 GiB)
      exclusions:
        - network egress follows client placement; in-region VPC traffic is free
      notes: A BASIC instance is a single node -- no replica, no failover -- so the capacity line is the entire bill.
    - preset: 02-ha-production
      region_assumption: us-central1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: provisioned capacity
          price: redis-standard-m2-us-central1
          pricing_quantity: "3650"
          quantity_basis: 5 GiB provisioned x 730 hours at the STANDARD_HA tier's M2 band rate (5-10 GiB) -- the rate already includes the synchronized failover replica
      exclusions:
        - network egress follows client placement
        - RDB snapshot storage is included in the instance price
      notes: STANDARD_HA bills one capacity line at the HA rate (exactly twice the per-node rate) rather than itemizing the failover node.
    - preset: 03-private-services-access
      region_assumption: us-central1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: provisioned capacity
          price: redis-standard-node-m2-us-central1
          pricing_quantity: "21900"
          quantity_basis: read replicas switch billing to per-node -- 3 nodes (1 primary + 2 replicas) x 10 GiB each x 730 hours at the per-node M2 band rate (half the STANDARD_HA rate, which is that same rate twice)
      exclusions:
        - network egress follows client placement
      notes: With READ_REPLICAS_ENABLED every node bills the full provisioned capacity -- read scale is bought in whole copies of the dataset.
