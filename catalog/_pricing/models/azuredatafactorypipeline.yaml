# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. The preset is genuinely zero-committed: a pipeline
# definition carries no standing meter -- every Data Factory charge is
# run-driven and bills against the parent factory when a trigger, manual
# run, or debug run executes it -- stated in exclusions, never padded into
# fabricated dollars. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: azuredatafactorypipeline
spec:
  presets:
    - preset: 01-scheduled-copy
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      exclusions:
        - every triggered execution bills orchestration activity runs per 1,000 (one per activity per run, trigger executions and debug runs included) at the executing integration runtime class's rate, on the factory
        - the copy activity this preset is built to carry bills data movement per DIU-hour (Azure and managed-VNet runtimes) or per hour (self-hosted) while it moves data
        - pipeline activities (Lookup, Get Metadata, Delete) bill execution per hour, external activities (Databricks, stored procedure, HDInsight) bill managed-orchestration per hour, and Execute Data Flow activities bill vCore-hours on an 8-vCore-minimum cluster -- all on the factory
        - Data Factory operations bill read/write per 50,000 entity operations (deploying this pipeline included) and monitoring per 50,000 run records retrieved
        - "a pipeline left a full month with no trigger association and zero runs bills Azure's inactive-pipeline fee, 0.80 USD/month at East US rates -- the one charge idleness itself can accrue; a single run or trigger binding clears it"
        - copies that egress an Azure datacenter add outbound data transfer at bandwidth rates
      notes: "Zero committed cost -- the definition never appears on the invoice; the meters spin per run against the parent AzureDataFactory. The preset's concurrency cap of 1 queues overlapping runs (a throttle on how fast run-driven charges accrue, not a meter), and the placeholder Wait activity bills as a pipeline-activity execution only when actually run."
