# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Presets with no quantity lines have no committed always-on
# spend and estimate to zero. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: gcpspannerbackupschedule
spec:
  presets:
    - preset: 01-daily-full-backups
      region_assumption: us-central1
      currency: USD
      hours_per_month: 730
      exclusions:
        - daily FULL backups kept 31 days settle at roughly 31 database-sized copies billing per GiB-month at the instance configuration's backup rate -- but each copy is only as large as the database, so an empty database backs up to almost nothing
        - the database's storage and the instance's compute bill on their own components
      notes: Zero committed at creation -- the schedule is a free control-plane object; the meter follows the size of the database it copies.
    - preset: 02-incremental-enterprise
      region_assumption: us-central1
      currency: USD
      hours_per_month: 730
      exclusions:
        - twice-daily INCREMENTAL backups kept 14 days store only the changes since the previous backup in each chain -- far less than 28 full copies, in proportion to the database's change rate
        - requires an ENTERPRISE or ENTERPRISE_PLUS instance; the edition premium bills on the GcpSpannerInstance
      notes: Zero committed at creation -- incremental chains make the standing backup bill track the write rate rather than the database size.
    - preset: 03-weekly-long-retention
      region_assumption: us-central1
      currency: USD
      hours_per_month: 730
      exclusions:
        - weekly FULL backups kept 366 days (the maximum) settle at roughly 52 database-sized copies billing per GiB-month -- the largest standing multiple any cadence/retention pair in these presets produces
        - the CMEK key's version storage and per-operation charges bill on the referenced GcpKmsKey component
        - the database's storage and the instance's compute bill on their own components
      notes: Zero committed at creation -- the year of retention is a multiplier armed by the manifest, not a charge; it starts costing when the database holds data worth archiving.
