# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. All three presets are genuinely zero-committed: a Transit
# Gateway with zero attachments bills nothing, every hourly meter in this
# pricing model is an attachment meter living on the spoke kinds, and
# no preset creates an attachment -- stated in exclusions, never padded
# into fabricated dollars. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awstransitgateway
spec:
  presets:
    - preset: 01-full-mesh-hub
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - each VPC that later attaches starts an hourly attachment meter billed to the attaching VPC's owner account, on the AwsTransitGatewayVpcAttachment kind -- never on this hub
        - data processing bills per GB each spoke sends INTO the gateway, charged to the sender's owner; standard inter-AZ and inter-region transfer applies on top
      notes: Zero committed cost -- the hub is free to exist and Transit Gateway has no free allotment to burn; the first attachment, not this manifest, starts the first meter.
    - preset: 02-segmented-hub
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - disabling default route-table association and propagation is pure routing posture -- segmentation shapes reachability, not the bill, and attachment-hours still land on the spoke kinds when they arrive
        - data processing per GB follows each sender's traffic into the gateway
      notes: Zero committed cost -- custom route tables carry no meter of their own; the segmented hub idles as free as the full-mesh one.
    - preset: 03-hybrid-connectivity-hub
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - VPN and Direct Connect attachments, when created, bill their hourly meters to the HUB owner's account (unlike VPC attachments, which bill the spoke) -- on their own attachment kinds, plus Site-to-Site VPN connection pricing for VPN
        - the distinct ASN, ECMP support, and security-group referencing are free configuration; data processing bills per GB on sender traffic
      notes: Zero committed cost -- hybrid readiness is all posture; the meters wait for the VPN or Direct Connect attachments this hub is shaped to receive, and those bill on their own kinds.
