# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are zero-committed: every object this bundle
# creates (evaluators, harnesses) is free at rest, and every meter --
# custom evaluations, built-in evaluator tokens, harness-run runtime
# consumption -- starts only when scoring actually runs. Stated in
# exclusions, never padded into fabricated dollars.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awsbedrockagentcoreevaluation
spec:
  presets:
    - preset: 01-code-evaluator
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - the Lambda-backed evaluator bills $1.50 per 1,000 evaluations as a custom evaluator -- only when evaluation runs execute, at a volume the manifest cannot see
        - the scoring function's invocations and duration bill on the referenced AwsLambda, not on this component
        - "no permanent free allotment exists for evaluation meters -- the meter starts at the first evaluation; the up-to-$200 AWS Free Tier credit for new customers is a one-time trial, not a tier"
      notes: Zero committed cost -- the evaluator object is free to exist and this preset configures no harness and no online config, so nothing can bill until something invokes an evaluation run.
    - preset: 02-llm-judge-harness
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - the LLM-judge evaluator bills $1.50 per 1,000 evaluations as a custom evaluator, and the Claude 3 Haiku judge's inference bills SEPARATELY on Bedrock's own token meters -- both start only when evaluations run
        - each harness run consumes what it drives -- the AWS-managed runtime environment bills AgentCore Runtime microVM meters ($0.0895 per vCPU-hour active CPU, $0.00945 per GB-hour peak memory, per second, scale-to-zero between runs) and the Haiku model under test bills its own Bedrock inference
        - "no permanent free allotment exists for evaluation meters -- the up-to-$200 AWS Free Tier credit for new customers is a one-time trial, not a tier"
      notes: Zero committed cost -- the evaluator and harness objects are free at rest and no online config samples production traffic; the harness pins no runtime environment, so AWS's managed environment scales to zero and every meter is commitment-absence until a run executes.
