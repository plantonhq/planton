# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. All three presets are genuinely zero-committed: a topic's
# existence is free and every meter (publishes, deliveries, archive growth)
# follows traffic -- stated in exclusions, never padded into fabricated
# dollars. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awssnstopic
spec:
  presets:
    - preset: 01-standard-topic
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - publishes bill per million requests after the always-free first million
        - per-protocol delivery cost (HTTP, email, SMS, mobile push) bills on the AwsSnsSubscription components that attach endpoints
        - data transfer out of the region bills per GB
      notes: Zero committed cost -- an idle standard topic bills nothing.
    - preset: 02-fifo-with-deduplication
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - FIFO publishes and deliveries bill per message and per payload GB -- a different pricing shape from standard topics, entirely traffic-driven
        - subscriber-side delivery cost bills on the subscription components
      notes: Zero committed cost -- FIFO ordering changes the usage rates, never the (zero) baseline.
    - preset: 03-fifo-with-archive
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - the 30-day archive (archive_policy MessageRetentionPeriod) bills per GB-month as published messages accrue -- an empty topic archives nothing, and volume is unknowable from the manifest
        - replaying archived messages bills again per GB retrieved
        - FIFO publishes and deliveries bill per message and per payload GB as traffic flows
      notes: Zero committed cost at creation -- the archive meter starts charging with the first published message and grows with traffic times retention.
