# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are zero-committed: a DSQL cluster has no
# instances and no capacity dials, DPUs meter zero while idle (AWS's stated
# behavior), storage meters actual bytes and an empty-on-create cluster
# stores none, and the recurring monthly free tier (100,000 DPUs + 1 GB)
# absorbs residual activity. Stated in exclusions, never padded into
# fabricated dollars. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awsauroradsql
spec:
  presets:
    - preset: 01-single-region
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - "DPUs bill $8.00 per million in us-east-1 as the workload runs -- queries, writes, and background maintenance all meter; AWS's stated behavior for idle is verbatim: usage automatically scales to zero and you incur no DPU charges"
        - storage bills $0.33 per GB-month on actual stored bytes -- an empty-on-create cluster stores nothing, and the first 100,000 DPUs plus 1 GB of storage are free EACH MONTH (a recurring allotment, not a trial)
        - data transfer out to the internet or to other regions bills at standard AWS data transfer rates; inter-AZ replication inside the region is included
        - AWS Backup jobs against the cluster, if configured outside this manifest, bill on AWS Backup's meters
      notes: Zero committed cost -- commitment-absence, not a free service. The preset pins only region and deletion protection; there is nothing on this spec that CAN commit spend, and the meters start with the first query and the first stored byte.
    - preset: 02-multi-region-pair
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - DPUs bill $8.00 per million in us-east-1 as the workload runs, and the pairing doubles the write side -- every write additionally bills MultiRegionWriteDPU equal to the originating write, in this cluster's region
        - storage bills $0.33 per GB-month in EACH region holding a replica -- this manifest's region bills its own copy, the peer cluster (orders-dsql-west) bills its copy on its own manifest, and the witness region (us-east-2) bills nothing by AWS's stated multi-region billing
        - the recurring monthly free tier (first 100,000 DPUs + 1 GB storage each month) applies per management account, not per cluster
        - the customer-managed encryption key bills its rental and requests on the referenced AwsKmsKey (orders-data-key-east)
        - data transfer out bills at standard AWS rates; cross-region replication itself carries no separate transfer charge -- it is priced inside MultiRegionWriteDPU
      notes: Zero committed cost -- commitment-absence, not a free service. Pairing changes the RATE STRUCTURE (doubled write DPUs, per-region storage) but commits nothing on existence; an idle, empty pair meters zero DPUs and stores zero bytes in both regions.
