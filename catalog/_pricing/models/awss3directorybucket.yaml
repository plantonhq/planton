# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are zero-committed: a directory bucket is
# created EMPTY, the bucket object itself carries no fee on the S3 pricing
# page, and every S3 Express One Zone meter (storage GB-month, per-1,000
# requests, per-GB upload and retrieval) starts with the workload's first
# byte -- stated in exclusions, never padded into fabricated dollars.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awss3directorybucket
spec:
  presets:
    - preset: 01-ml-scratch
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - S3 Express One Zone storage bills per GB-month from the first byte of training scratch data -- the manifest pins an empty availability-zone bucket (use1-az4), so nothing meters until the workload writes
        - PUT, COPY, POST, LIST, and RenameObject requests bill per 1,000, GET and other reads per 1,000, plus this class's per-GB data-upload and data-retrieval charges -- all proportional to training I/O the manifest cannot see
        - force_destroy teardown is meter-free -- DELETE and CANCEL requests are free on the S3 pricing page, and deleting the data ends the storage meter
      notes: Zero committed cost -- the zero is commitment-absence on an empty bucket, not a free tier; the Express One Zone class has no permanent free allotment, and every meter starts with the first object the training job writes.
    - preset: 02-local-zone-edge
      region_assumption: us-west-2
      currency: USD
      hours_per_month: 730
      exclusions:
        - S3 Express One Zone storage bills per GB-month from the first cached render byte -- the manifest pins an empty Local Zone bucket (usw2-lax1-az1, SingleLocalZone redundancy), and Local Zone locations carry their own rate rows on the S3 pricing page
        - the same request meter family applies at the edge -- PUT/COPY/POST/LIST/RenameObject and GET per 1,000, plus per-GB data-upload and data-retrieval charges, all driven by render-cache traffic invisible to this manifest
        - without force_destroy, destroy FAILS while objects remain -- emptying the cache first is the operator's step, at zero request cost (DELETE is free)
      notes: Zero committed cost -- commitment-absence on an empty edge bucket, never "free"; the first byte the render fleet caches starts the Local Zone storage meter at that location's published rate.
