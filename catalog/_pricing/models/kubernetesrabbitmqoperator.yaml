# Estimate model: hand-computed capacity footprints for this
# cluster-capacity kind's presets. A derivation cannot state this
# kind honestly: the release manifest ships default operator resources
# (200m CPU / 500Mi memory for BOTH requests and limits), applied
# whenever a manifest omits resources, and the derivation grammar reads
# only explicit manifest values -- a derivation would show a zero
# footprint for every shipped preset (all three ride the manifest
# defaults) while the operator pod actually reserves them. Each
# preset's totals are therefore computed by hand: the single operator
# pod's declared resources, or the manifest defaults when omitted. The
# operator binds no persistent volumes; the RabbitMQ clusters it
# reconciles reserve their own capacity on their KubernetesRabbitMq
# resources. Cluster-capacity kinds carry no priced lines -- the
# dollar value of the reservation is the target cluster's node
# economics, which this catalog cannot know.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: kubernetesrabbitmqoperator
spec:
  presets:
    - preset: 01-standard
      capacity_footprint:
        cpu_requests: 200m
        memory_requests: 500Mi
        cpu_limits: 200m
        memory_limits: 500Mi
        basis: 1 operator pod x (200m CPU / 500Mi memory, requests and limits alike) from the release manifest's defaults (applied whenever the manifest omits resources) -- no persistent volumes
      exclusions:
        - the dollar value of this capacity is the target cluster's node economics
        - "the RabbitMQ clusters this operator reconciles reserve their own capacity -- each rides its KubernetesRabbitMq resource"
    - preset: 02-namespace-fenced
      capacity_footprint:
        cpu_requests: 200m
        memory_requests: 500Mi
        cpu_limits: 200m
        memory_limits: 500Mi
        basis: 1 operator pod x (200m CPU / 500Mi memory, requests and limits alike) from the release manifest's defaults -- the watch fence changes which namespaces the operator reconciles, not its footprint
      exclusions:
        - the dollar value of this capacity is the target cluster's node economics
        - "the RabbitMQ clusters this operator reconciles reserve their own capacity -- each rides its KubernetesRabbitMq resource"
    - preset: 03-air-gapped-mirror
      capacity_footprint:
        cpu_requests: 200m
        memory_requests: 500Mi
        cpu_limits: 200m
        memory_limits: 500Mi
        basis: 1 operator pod x (200m CPU / 500Mi memory, requests and limits alike) from the release manifest's defaults -- mirrored images change where pulls come from, not the reservation
      exclusions:
        - the dollar value of this capacity is the target cluster's node economics
        - "the RabbitMQ clusters this operator reconciles reserve their own capacity -- each rides its KubernetesRabbitMq resource"
