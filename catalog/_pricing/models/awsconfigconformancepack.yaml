# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are zero-committed: the pack object is free,
# and its evaluations bill per resource examined -- a product of rule
# count, fleet size, and change rate the manifest cannot see -- stated in
# exclusions, never padded into fabricated dollars.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awsconfigconformancepack
spec:
  presets:
    - preset: 01-s3-best-practices
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - the template's three managed S3 rules meter the in-scope bucket fleet three times per evaluation cycle, billing per evaluation on the conformance-pack tiered schedule from the first one -- AWS Config publishes no free tier
        - the configuration items that feed these evaluations bill on the region's AwsConfigRecorder kind, and the pack refuses to deploy without a running recorder
        - the pack's rules are created by the pack itself (not standalone AwsConfigRule kinds) -- deleting the pack deletes them and their spend together
      notes: Zero committed cost -- a pack over an empty bucket fleet evaluates nothing; each bucket that exists or changes multiplies the meter by the template's three rules.
    - preset: 02-organization-baseline
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - the organization pack deploys into every member account, and each account's evaluations bill there -- the S3-hosted template's rule count times every member fleet, with the excluded sandbox account subtracting its whole fleet from the volume
        - the template lives in S3 and is opaque to an estimator -- AWS never reports the rule count back after deploy, so the multiplier itself is unknowable from this manifest
        - each member account needs its own running configuration recorder, whose items bill in that account
      notes: Zero committed cost in this manifest -- but the zero is emphatically commitment-absence, since an organization-wide pack's meter runs in every member account the moment their recorders feed it resources to judge.
