# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Presets with no quantity lines have no committed always-on
# spend and estimate to zero. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: azureaksnodepool
spec:
  presets:
    - preset: 01-on-demand-general
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: node compute
          price: vm-standard-d4s-v5-eastus
          pricing_quantity: "1460"
          quantity_basis: 2 Standard_D4s_v5 nodes at the autoscaling floor x 730 hours -- min_count is the pool-wide committed size, spread across the three declared zones
        - sku_meter: node OS disk
          price: managed-disk-p10-eastus
          pricing_quantity: "2"
          quantity_basis: 2 nodes x one managed OS disk each -- os_disk_size_gb is unset, so AKS provisions the 128 GiB default, which lands in the P10 premium tier
      exclusions:
        - autoscaling above the 2-node floor bills each additional node (up to 10) at the same per-node rates while it runs
        - network egress and any data disks the workloads attach follow workload behavior
      notes: Estimated at the autoscaling floor -- the committed always-on spend. The ceiling at max_count=10 is roughly five times every line.
    - preset: 02-spot-cost-optimized
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      exclusions:
        - the pool scales to zero (min_count 0), so the committed always-on spend is exactly zero
        - while scaled up, SPOT Standard_D4s_v5 nodes bill at floating market rates below the on-demand price (spot_max_price unset means capped only at the on-demand rate) -- a market rate is not a list price, so no dollar figure is honest here
        - each running node also bills its default 128 GiB P10 managed OS disk per disk-month
      notes: Scale-to-zero spot capacity is the cheapest honest shape -- zero committed, market-priced when busy, evictable by design.
    - preset: 03-gpu-or-windows
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: node compute
          price: vm-standard-nc4as-t4-v3-eastus
          pricing_quantity: "730"
          quantity_basis: 1 fixed Standard_NC4as_T4_v3 node (nodeCount 1, no autoscaling) x 730 hours -- the Linux on-demand rate, with the T4 GPU embedded in the machine price
        - sku_meter: node OS disk
          price: managed-disk-p10-eastus
          pricing_quantity: "1"
          quantity_basis: 1 node x one managed OS disk -- os_disk_size_gb is unset, so the 128 GiB default lands in the P10 premium tier
      exclusions:
        - network egress and any data disks the workloads attach follow workload behavior
      notes: A fixed single-node GPU pool bills around the clock -- the preset trades elasticity for driver and scheduling simplicity, and the estimate is the whole committed spend.
