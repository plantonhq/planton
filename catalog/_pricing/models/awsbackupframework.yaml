# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are zero-committed: the framework object is
# free, and its evaluation meter runs against the backup fleet in the
# region -- a quantity the manifest names controls for but cannot see the
# size of -- stated in exclusions, never padded into fabricated dollars.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awsbackupframework
spec:
  presets:
    - preset: 01-backup-coverage-audit
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - each of the two coverage controls evaluates every in-scope backup resource on an AWS-managed cadence, and each check bills as one Backup Audit Manager evaluation -- volume is fleet-driven, scaling with the plans, vaults, and recovery points that exist in the region
        - every evaluation also records one AWS Config configuration item, billed separately at Config's per-item rate
        - the ACTIVE AWS Config recorder the framework requires bills its own recording charges on the AwsConfigRecorder component
        - the backup activity being audited (storage, copies, restores) bills on the AwsBackupPlan and vault components
      notes: Zero committed cost -- the framework is free to exist, and with no controls scoped, both meters (evaluations and Config items) follow the size of the backup fleet, which is zero until backup resources exist.
    - preset: 02-immutable-backup-posture
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - each of the three immutability controls evaluates every in-scope recovery point and vault on an AWS-managed cadence, one billed evaluation per check -- three controls is a straight 3x multiplier on the fleet's evaluation volume versus a single-control framework
        - every evaluation records one AWS Config configuration item billed at Config's per-item rate, plus additional items whenever the underlying backup resources change
        - the ACTIVE AWS Config recorder prerequisite bills on the AwsConfigRecorder component
      notes: Zero committed cost -- the zero is commitment-absence, not freeness; the evaluation meter starts the moment recovery points exist for these controls to check, and the cadence itself carries no dial in this spec.
