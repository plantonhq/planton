# Estimate model: the authored capacity footprints of this cluster-capacity
# kind's presets. A hand model instead of a capacity derivation because
# the spec's HPA semantics switch the collector's instance multiplier: when
# otel_collector.autoscaling is enabled the `replicas` field is IGNORED (the
# spec contract says so and the module renders the chart HPA with its
# min_replicas floor), so the steady-state reservation is min_replicas x the
# declared resources, not replicas x resources. The derivation grammar
# cannot express a conditional instance count, and a mechanical
# "replicas x ..." basis understates any preset that autoscales above 1 --
# so each preset's footprint is stated by hand at its true floor, including
# the chart-default requests the grammar could never count (verified at the
# pinned chart 0.133.0: server 100m CPU / 100Mi requests + 1Gi state volume,
# collector 100m CPU / 200Mi requests). Telemetry data itself lives in the
# composed KubernetesClickHouse, whose capacity rides that component's own
# footprint. Cluster-capacity kinds carry no priced lines -- the dollar
# value of the reservation is the target cluster's node economics.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: kubernetessignoz
spec:
  presets:
    - preset: 01-dev
      capacity_footprint:
        cpu_requests: 200m
        memory_requests: 300Mi
        persistent_storage: 1Gi
        basis: "1 server x (100m CPU / 100Mi chart-default requests, 1Gi chart-default state volume) + 1 collector x (100m CPU / 200Mi chart-default requests) -- the preset declares no sizing, so every number is the pinned chart's (0.133.0) own default; no limits apply (the chart ships requests only)"
      exclusions:
        - every trace, metric and log is stored in the composed KubernetesClickHouse -- the telemetry store's capacity, and its growth with telemetry volume and retention, rides that component's own footprint, never this one's
        - the schema migrator runs as Jobs (the chart's default) whose capacity is reserved only while their pods run; their sizing is the chart's, with no typed seam
        - "helm_values merges LAST over the typed rendering and can override modeled values, including resources, replicas and storage -- this footprint describes the spec's declaration plus the pinned chart's defaults"
        - the dollar value of this capacity is the target cluster's node and storage-class economics
    - preset: 02-production
      capacity_footprint:
        cpu_requests: 1500m
        memory_requests: 3Gi
        cpu_limits: "6"
        memory_limits: 8Gi
        persistent_storage: 5Gi
        basis: "1 server x (500m CPU / 1Gi requests, 2 CPU / 4Gi limits, 5Gi state volume) + 2 collector replicas at the HPA floor x (500m CPU / 1Gi requests, 2 CPU / 2Gi limits)"
      exclusions:
        - the collector scales on an HPA -- this footprint states its min_replicas floor (2); runtime scaling can reach 8 replicas, each new replica adding its full declared resources (500m CPU / 1Gi requests, 2 CPU / 2Gi limits)
        - every trace, metric and log is stored in the composed KubernetesClickHouse -- the telemetry store's capacity, and its growth with telemetry volume and retention, rides that component's own footprint, never this one's
        - the schema migrator runs as Jobs (the chart's default) whose capacity is reserved only while their pods run; their sizing is the chart's, with no typed seam
        - "helm_values merges LAST over the typed rendering and can override modeled values, including resources, replicas and storage -- this footprint describes the spec's declaration"
        - the dollar value of this capacity is the target cluster's node and storage-class economics
      notes: the SigNoz server runs exactly one replica by design -- its state store is single-writer SQLite, so the spec deliberately has no server replica knob; horizontal scale lives in the collector tier.
