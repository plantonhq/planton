# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: gcpdnszone
spec:
  presets:
    - preset: 01-public-zone
      region_assumption: global
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: managed zone
          price: dns-managed-zone
          pricing_quantity: "1"
          quantity_basis: one managed zone billed per month at the first-25-zones list rate (the rate steps down from the 26th zone in the project)
      exclusions:
        - query volume bills per million queries answered and follows traffic
      notes: Public and private zones pay the same flat zone fee; queries are the variable the manifest cannot know.
    - preset: 02-private-vpc
      region_assumption: global
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: managed zone
          price: dns-managed-zone
          pricing_quantity: "1"
          quantity_basis: one managed zone billed per month at the first-25-zones list rate; private visibility does not change the fee
      exclusions:
        - query volume from the bound VPC bills per million queries answered
      notes: The private zone resolves only inside the declared VPC; its fee is identical to a public zone's.
    - preset: 03-public-dnssec
      region_assumption: global
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: managed zone
          price: dns-managed-zone
          pricing_quantity: "1"
          quantity_basis: one managed zone billed per month at the first-25-zones list rate; DNSSEC signing adds no charge
      exclusions:
        - query volume bills per million queries answered and follows traffic
        - Cloud Logging ingestion for the enabled per-query logging follows query rate, billed at Logging's per-GiB rates
      notes: DNSSEC is free on Cloud DNS; the enabled query logging is the preset's real variable cost on a busy zone.
