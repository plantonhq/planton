# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are genuinely zero-committed: the system topic
# resource has no meter -- Microsoft's Basic-tier operations meter bills the
# events that flow through it, at volumes only the source's activity
# determines -- stated in exclusions, never padded into fabricated dollars.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: azureeventgridsystemtopic
spec:
  presets:
    - preset: 01-storage-account-events
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      exclusions:
        - "every blob and queue event the bound storage account emits is a billed operation at 0.60 USD per million past the monthly 100,000-operation free grant, counted in 64 KB units -- volume follows the storage account's workload, not this manifest"
        - "every delivery attempt by attached event subscriptions bills the same meter, retries included; advanced filtering and subject-ends-with filtering bill per evaluation (event-type matching and subject-begins-with are free)"
        - "dead-lettered events bill as delivery operations, with blob storage charges on the dead-letter destination's own component"
      notes: "Zero committed cost -- the topic bills nothing for existing; a quiet storage account stays inside the monthly free grant, and a busy one moves the meter through no change here."
    - preset: 02-resource-group-events
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      exclusions:
        - "every resource-lifecycle event in the bound resource group (created, changed, deleted) is a billed operation at 0.60 USD per million past the monthly 100,000-operation free grant -- deployment cadence, not this manifest, sets the volume"
        - "every delivery attempt by attached event subscriptions bills the same meter, retries included; advanced filtering and subject-ends-with filtering bill per evaluation"
        - "dead-lettered events bill as delivery operations, with blob storage charges on the dead-letter destination's own component"
      notes: "Zero committed cost -- the Global region placement is a source-shape requirement, not a pricing choice; lifecycle-event volume in a typical group sits comfortably inside the free grant."
