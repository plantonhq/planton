# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Hand model rather than a derivation: Cloudflare bills only
# the hostnames PAST the zone's 100 included, and that allotment is a
# ZONE-level fact shared across every hostname resource on the zone --
# whether this one falls inside it is invisible in this manifest, so the
# allotment arithmetic lives in basis prose here. Schema:
# finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: cloudflarecustomhostname
spec:
  presets:
    - preset: 01-saas-vanity-domain
      region_assumption: global
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: custom hostnames
          price: cloudflare-custom-hostname-monthly
          pricing_quantity: "1"
          quantity_basis: "one custom hostname held for the month, priced at the past-allotment rate -- Cloudflare includes the zone's first 100 custom hostnames at no charge on the Free, Pro, and Business SaaS plans, so this line prices hostname number 101 and beyond; the same hostname landing within the included 100 bills 0.00"
      exclusions:
        - whether this hostname lands inside or past the zone's 100 included hostnames depends on how many custom hostnames the zone already carries -- no single manifest can know its position in the allotment
        - traffic-dependent charges (requests, WAF, caching) ride the SaaS zone's plan, not this object
      notes: "The hostname counts toward billing from creation until deleted, including while pending validation. The $0.10 rate is identical on Free, Pro, and Business and is priced globally; the estimate assumes the zone's included allotment is already consumed -- the steady state of a SaaS platform at scale."
    - preset: 02-byo-certificate
      region_assumption: global
      currency: USD
      hours_per_month: 730
      exclusions:
        - "this preset uploads its own certificate (ssl.customCertificate), an Enterprise-only SaaS feature -- Enterprise per-hostname pricing is \"Custom pricing\" (contract) with custom allotments per Cloudflare's SaaS plans page, so no publishable committed rate exists for this hostname"
        - traffic-dependent charges (requests, WAF, caching) ride the SaaS zone's plan, not this object
      notes: "Zero publishable committed cost -- the BYO-certificate surface exists only on Enterprise SaaS plans, whose per-hostname rate Cloudflare does not publish. The hostname still bills by existing under that contract; the absence of a number here is the honest refusal, not a claim of free."
