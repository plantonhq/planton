# Estimate model: the authored capacity footprints of this cluster-capacity
# kind's presets. A hand model instead of a capacity derivation because
# the reservation lives in spec.volume_claim_templates -- a repeated list the
# derivation grammar cannot traverse (path resolution refuses to pick an
# element of a repeated field), and a mechanical footprint that dropped the
# very storage the presets declare would be dishonest. Each footprint is
# computed from the preset manifest by hand and defended in its basis
# sentence. Cluster-capacity kinds carry no priced lines -- the dollar
# value of the reservation is the target cluster's node and storage-class
# economics. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: kubernetesstatefulset
spec:
  presets:
    - preset: 01-database
      capacity_footprint:
        cpu_requests: 100m
        memory_requests: 256Mi
        cpu_limits: 1000m
        memory_limits: 1Gi
        persistent_storage: 10Gi
        basis: 1 replica x (100m CPU / 256Mi memory requests, 1000m CPU / 1Gi limits) + 1 x 10Gi data volume
      exclusions:
        - the dollar value of this capacity is the target cluster's node and storage-class economics
        - under the default Retain retention policy the data PVC stays claimed after workload deletion or scale-down until manually removed
    - preset: 02-ha-quorum-cluster
      capacity_footprint:
        cpu_requests: 750m
        memory_requests: 1536Mi
        cpu_limits: "3"
        memory_limits: 6Gi
        persistent_storage: 60Gi
        basis: 3 replicas x (250m CPU / 512Mi memory requests, 1000m CPU / 2Gi limits) + 3 x 20Gi data volumes
      exclusions:
        - the dollar value of this capacity is the target cluster's node and storage-class economics
        - the explicit Retain retention policy keeps each member's data PVC through deletion and scale-down -- storage stays claimed until manually removed
    - preset: 03-hardened-database
      capacity_footprint:
        cpu_requests: 100m
        memory_requests: 256Mi
        cpu_limits: 1000m
        memory_limits: 1Gi
        persistent_storage: 10Gi
        basis: 1 replica x (100m CPU / 256Mi memory requests, 1000m CPU / 1Gi limits) + 1 x 10Gi data volume
      exclusions:
        - the dollar value of this capacity is the target cluster's node and storage-class economics
        - under the default Retain retention policy the data PVC stays claimed after workload deletion or scale-down until manually removed
