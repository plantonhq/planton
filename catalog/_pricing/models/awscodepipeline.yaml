# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. All five presets are genuinely zero-committed: every one
# pins pipeline_type V2, whose only meter is action-execution minutes that
# bill when commits run the pipeline -- an idle pipeline of any shape
# bills nothing -- stated in exclusions, never padded into fabricated
# dollars. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awscodepipeline
spec:
  presets:
    - preset: 01-github-source-codebuild
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - each push to main runs both actions, billing V2 action-execution minutes rounded up per action -- against the account's shared 100 free action minutes each calendar month
        - the CodeBuild project the Build action invokes bills its own build minutes on the AwsCodeBuildProject kind, usually dwarfing the orchestration charge
        - every execution writes artifacts into the referenced bucket, billing S3 storage and requests there
      notes: Zero committed cost -- the pipeline is free scaffolding; the meter turns exactly as often as main receives a push.
    - preset: 02-ecr-ecs-deploy
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - each new latest-tag image runs three actions, each billing its execution minutes rounded up -- the ECS deploy action holds its stage open and bills every minute the rolling deployment takes
        - the deploy-prep CodeBuild project bills build minutes on its own kind, and the ECS service being deployed bills its own compute
        - artifacts bill S3 storage and requests on the referenced bucket
      notes: Zero committed cost -- nothing bills until an image lands in ECR; slow deployments, not pipeline shape, are what stretch the billed minutes.
    - preset: 03-s3-lambda-deploy
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - each new package object runs two actions billing their execution minutes; SUPERSEDED mode cancels an in-progress execution when a newer one arrives, cutting its remaining billed minutes
        - the deployer function's invocation and duration bill on its AwsLambda kind
        - artifacts bill S3 storage and requests on the referenced bucket
      notes: Zero committed cost -- with polling disabled, only a genuine package upload starts the meter, and supersession keeps rapid-fire uploads from stacking billed executions.
    - preset: 04-gated-deploy-with-rollback
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - each push runs the source, build, and deploy actions billing execution minutes rounded up per action -- and the failure handling trades minutes for hands-off recovery, RETRY re-billing the failed build actions fresh and ROLLBACK running a billed rollback execution of its own
        - the deployment-window rule defers production entry outside business hours -- a timing gate, not a meter
        - the CodeBuild project and ECS service invoked bill on their own kinds; artifacts bill on the referenced bucket
      notes: Zero committed cost -- gates and rollback change when and how executions run, not whether an idle pipeline bills; commits remain the only thing that starts the meter.
    - preset: 05-inline-compute-checks
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - each push bills the three actions' execution minutes -- and the Compute (Commands) action additionally runs its shell commands on CodePipeline-managed CodeBuild compute, billed separately at CodeBuild rates (default BUILD_GENERAL1_SMALL) on top of its own action minutes
        - those managed builds count against the account's CodeBuild concurrency limits even though no CodeBuild project exists in the manifest
        - the ECS deploy bills its stage-open minutes here and its service compute on the ECS kind; artifacts bill on the referenced bucket
      notes: Zero committed cost -- inline checks trade a standing CodeBuild project for per-execution managed compute, so the double meter (action minutes plus build minutes) runs only when commits arrive.
