# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Presets with no quantity lines have no committed always-on
# spend and estimate to zero. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: gcpfirestoreindex
spec:
  presets:
    - preset: 01-composite-filter-sort
      region_assumption: us-central1
      currency: USD
      hours_per_month: 730
      exclusions:
        - the index definition is free -- one entry per orders document (customerId + createdAt + document name) accrues as billed stored data on the referenced GcpFirestoreDatabase as orders are written
        - queries using the index bill document reads and per-1,000-entry index-entry batches on the database's meters, following application traffic
      notes: Zero committed at creation -- an index over an empty collection stores nothing; the meters live on the database this resource references.
    - preset: 02-vector-neighbors
      region_assumption: us-central1
      currency: USD
      hours_per_month: 730
      exclusions:
        - each products document adds an index entry carrying its category and a 768-dimension embedding vector -- vector entries are the widest index entries Firestore stores, billed as stored data on the referenced GcpFirestoreDatabase
        - nearest-neighbor queries bill one read per batch of only 100 kNN vector index entries (versus 1,000 for ordinary entries) plus a read per returned document -- the densest read meter Firestore has
      notes: Zero committed at creation -- vector search economics start with the first embedded document, and both the storage and the 10x-denser read meter live on the database.
