# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Presets 01 and 02 run in default (on-demand) polling mode,
# which carries no charge of its own -- genuinely zero-committed. Preset 03
# opts into provisioned mode, the one committed charge this kind can
# carry, priced from AWS's published Event-Poller-Unit rate. Schema:
# finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awslambdaeventsourcemapping
spec:
  presets:
    - preset: 01-sqs-worker
      region_assumption: us-west-2
      currency: USD
      hours_per_month: 730
      exclusions:
        - default-mode polling is free -- the mapping itself carries no charge
        - the wired function's invocations and duration bill on its AwsLambda kind
        - queue receive requests driven by the polling bill on the AwsSqsQueue kind
      notes: Zero committed cost -- free glue between the queue and the function.
    - preset: 02-kinesis-consumer
      region_assumption: us-west-2
      currency: USD
      hours_per_month: 730
      exclusions:
        - default-mode polling is free; parallelization_factor 2 raises concurrent invocations, billed on the function
        - TRIM_HORIZON replays the stream's retained backlog on first enable -- a one-time invocation surge billed on the function
        - stream shard capacity bills on the Kinesis stream kind
      notes: Zero committed cost -- the mapping spends nothing; it decides how fast the function and stream spend.
    - preset: 03-msk-shared-pollers
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: provisioned event pollers
          price: lambda-event-poller-unit-us-east-1
          pricing_quantity: "730"
          quantity_basis: provisioned mode holds minimum_pollers 2 around the clock; Kafka pollers are packed onto Event Poller Units at AWS's default density of 10 pollers per EPU, so the floor allocates 1 EPU x 730 hours -- the committed always-on spend
      exclusions:
        - autoscaling above the floor (maximum_pollers 50, shared across the analytics-pollers group) bills additional EPU-hours only while scaled up
        - under heavy per-poller throughput, enhanced EPU utilization packs fewer pollers per EPU and allocates more EPUs -- workload-dependent
        - the three enabled CloudWatch metrics (EventCount, ErrorCount, KafkaMetrics) each bill as a custom metric per month
        - function invocations bill on the AwsLambda kind; MSK cluster capacity bills on its own kind
      notes: Estimated at the provisioned floor -- the committed spend of holding warm pollers against the MSK topic. The poller group shares EPU capacity across up to 100 mappings, so the floor is also the group's floor, not per-mapping overhead.
