# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Presets with no quantity lines have no committed always-on
# spend and estimate to zero. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: gcprouternat
spec:
  presets:
    - preset: 01-all-subnets-auto
      region_assumption: us-central1
      currency: USD
      hours_per_month: 730
      exclusions:
        - public NAT bills per VM endpoint-hour -- with no VMs behind the gateway yet, the committed spend is zero, and each endpoint adds its per-hour rate up to the 32-endpoint cap
        - auto-allocated external addresses bill per IP-hour as Google scales the pool with endpoint count
        - data processing bills every GiB translated, in both directions
      notes: An idle public NAT gateway with auto-allocated addresses costs exactly zero -- the meters start with the first VM endpoint and the first byte.
    - preset: 02-static-ip-allowlisting
      region_assumption: us-central1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: NAT external IP usage
          price: nat-external-ip-usage
          pricing_quantity: "1460"
          quantity_basis: 2 manually attached static addresses x 730 hours -- each address assigned to the gateway bills per IP-hour for the whole month regardless of traffic
      exclusions:
        - per-VM endpoint-hours and per-GiB data processing follow the workloads scoped by the subnetwork list
        - the GcpAddress reservations themselves bill on their own kinds only while unattached; assigned to this gateway, their cost is the IP-usage line above
        - Cloud Logging volume under the ERRORS_ONLY filter is negligible until errors occur
      notes: The static egress addresses are the preset's committed spend -- the point of the preset is stable IPs third parties can allowlist, and stability bills by the hour.
    - preset: 03-private-nat
      region_assumption: us-central1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: private NAT gateway hours
          price: private-nat-gateway-uptime
          pricing_quantity: "730"
          quantity_basis: one PRIVATE-type gateway billed a flat rate every hour of the month from creation, idle or busy -- unlike public NAT there is no per-endpoint metering
      exclusions:
        - data processing bills every GiB translated between the private networks, in both directions
        - private addresses are free -- no IP-usage charges apply to PRIVATE gateways
      notes: Private NAT inverts the public cost shape -- a flat always-on gateway fee with no address charges, so the committed spend is the certainty and traffic is the variable.
