# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awsekscluster
spec:
  presets:
    - preset: 01-standard
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: cluster management fee
          price: eks-cluster-fee-us-east-1
          pricing_quantity: "730"
          quantity_basis: one cluster, billed every hour of the month at the flat per-cluster rate
      exclusions:
        - node compute -- worker capacity lives on separate AwsEksNodeGroup components with their own estimates
        - CloudWatch ingestion for the enabled audit and authenticator control-plane logs depends on cluster chatter
      notes: upgrade_support_type STANDARD caps the fee -- this preset can never incur the extended-support surcharge.
    - preset: 02-private-endpoint
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: cluster management fee
          price: eks-cluster-fee-us-east-1
          pricing_quantity: "730"
          quantity_basis: one cluster, billed every hour of the month at the flat per-cluster rate
      exclusions:
        - node compute -- separate AwsEksNodeGroup components
        - CloudWatch ingestion for the enabled audit and authenticator logs
        - upgrade_support_type is left at the AWS EXTENDED default -- once the pinned Kubernetes version leaves standard support, the extended-support surcharge raises the hourly fee to six times this estimate
      notes: The private endpoint, KMS secrets encryption, and deletion protection add no charge of their own.
    - preset: 03-auto-mode
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: cluster management fee
          price: eks-cluster-fee-us-east-1
          pricing_quantity: "730"
          quantity_basis: one cluster, billed every hour of the month at the flat per-cluster rate
      exclusions:
        - Auto Mode compute -- EKS provisions EC2 instances, EBS volumes, and load balancers as workloads demand, billed per instance-hour with the Auto Mode management premium; entirely workload-dependent
        - CloudWatch ingestion for the enabled audit and authenticator logs
        - upgrade_support_type is left at the AWS EXTENDED default -- an aged version raises the fee to six times this estimate
      notes: The management fee is this manifest's only certainty; under Auto Mode the real bill follows what pods request.
    - preset: 04-hybrid-nodes
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: cluster management fee
          price: eks-cluster-fee-us-east-1
          pricing_quantity: "730"
          quantity_basis: one cluster, billed every hour of the month at the flat per-cluster rate
      exclusions:
        - hybrid node vCPU-hours -- declaring the on-prem CIDRs is free, and billing starts per vCPU only when hybrid nodes register
        - CloudWatch ingestion for the enabled audit and authenticator logs
        - upgrade_support_type is left at the AWS EXTENDED default -- an aged version raises the fee to six times this estimate
