# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. A hand model rather than a derivation: the committed floor
# multiplies each pool's instance_count summed ACROSS the repeated
# always_ready list by the instance memory converted from MB to GB (the
# derivation grammar's quantities are products of single factors -- it cannot
# sum a field over repeated elements), and the memory factor rides an
# UNSET-defaulted field (2048) the presets never write. Same adjudication
# class as azurecontainerapp. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: azurefunctionappflexconsumption
spec:
  presets:
    - preset: 01-node-http-api
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: always ready baseline
          price: functions-flex-always-ready-baseline-gb-second-eastus
          pricing_quantity: "5256000"
          quantity_basis: "the alwaysReady http pool keeps 1 instance warm; instanceMemoryInMb is unset so each instance is the default 2048 MB = 2 GB, and the committed idle floor is 1 x 2 x 2,628,000 seconds a month (730 hours x 3,600)"
      exclusions:
        - "seconds the warm instance actually executes functions bill the always-ready EXECUTION rate (0.000016 USD/GB-second in eastus, 4x baseline) instead of baseline, and its executions bill 0.40 USD per million from the first one -- no free grant on always-ready meters"
        - "traffic beyond one instance's http_concurrency fans out to on-demand instances up to maximumInstanceCount 100, billing 0.000026 USD/GB-second and 0.40 USD per million executions in eastus past the subscription's monthly on-demand free grant (100,000 GB-seconds, 250,000 executions)"
        - "the deployment storage account and the FC1 plan's other apps bill on their own components"
      notes: "The floor prices the warm instance's idle seconds at baseline; Microsoft's Functions pricing page bills always-ready instances 'for a baseline while each Always Ready instance is idle' and at the execution rate while running. The on-demand free grant is not netted out; estimates price list rates."
    - preset: 02-identity-secured-worker
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      exclusions:
        - "every execution bills on-demand meters: 0.000026 USD/GB-second (each instance is 4096 MB = 4 GB, so one instance-second is 4 GB-seconds) and 0.40 USD per million executions in eastus, past the subscription's monthly free grant (100,000 GB-seconds, 250,000 executions)"
        - "fan-out follows the event source up to maximumInstanceCount 50; the storage account the worker deploys from and any queues or topics it drains bill on their own components"
      notes: "Genuinely zero-committed: no always_ready pool exists, so the app scales to zero between events and Microsoft bills nothing while no instance is executing -- the pricing page's on-demand mode is 'billed only when instances are executing functions'. The cold start the http presets pay to eliminate is accepted here."
    - preset: 03-entra-protected-api
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: always ready baseline
          price: functions-flex-always-ready-baseline-gb-second-eastus
          pricing_quantity: "5256000"
          quantity_basis: "the alwaysReady http pool keeps 1 instance warm at the default 2048 MB = 2 GB: 1 x 2 x 2,628,000 seconds a month -- identical floor to preset 01; Easy Auth changes who gets in, not what a warm instance costs"
      exclusions:
        - "execution seconds and executions on the warm instance bill the always-ready execution meters (0.000016 USD/GB-second, 0.40 USD per million) with no free grant; on-demand fan-out to maximumInstanceCount 100 bills the on-demand meters past the subscription grant"
        - "the Application Insights resource wired by connection string bills its own ingestion on the AzureApplicationInsights component; the Key Vault holding the Entra client secret bills on AzureKeyVault"
      notes: "Easy Auth v2 (platform-layer Entra validation) is a free App Service feature -- rejected 401s still count as executions only if they reach function code, which RETURN_401 requests do not. The floor is the same 2-GB warm instance as preset 01."
