# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are genuinely zero-committed: a DNS record is
# configuration, not infrastructure -- creating one starts no meter, and
# the query spend it shapes bills on the hosted zone at rates this record
# selects. Stated in exclusions, never padded into fabricated dollars.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awsroute53dnsrecord
spec:
  presets:
    - preset: 01-alias-alb
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - alias A queries to an ELB target answer FREE at any volume -- the alias arm is Route 53's zero-cost path for AWS integrations, the reason apex records for load balancers should never be paid-per-query CNAMEs
        - evaluate_target_health rides the health checking AWS provisions for ELB aliases automatically at no charge -- failover awareness without a billed standalone health check
        - the hosted zone's own monthly charge bills on the referenced AwsRoute53Zone component; the load balancer bills on its own component
      notes: Zero committed cost -- and uniquely, near-zero usage cost too, because this preset's queries are the free alias kind; the record shapes traffic without ever starting a query meter.
    - preset: 02-a-record
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - queries against this record bill on the hosted zone at the standard per-million rate as resolver traffic arrives; the 300-second TTL is the cache dial deciding how often resolvers come back
        - queries that MISS also bill -- an AAAA lookup against this A-only name, or a lookup for a nonexistent name, meters at the standard rate
        - the hosted zone's monthly charge bills on its AwsRoute53Zone component; queries against private hosted zones are free at any volume
      notes: Zero committed cost -- the record itself is free within the zone's included 10,000, and the query meter it feeds lives on the zone, running only when the internet actually looks the name up.
