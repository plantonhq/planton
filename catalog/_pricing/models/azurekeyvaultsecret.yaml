# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are genuinely zero-committed: a Key Vault
# secret has no storage meter, no per-object charge, and no per-version
# charge -- the only money it can move is the parent vault's per-operation
# meter, which bills calls, not existence -- stated in exclusions, never
# padded into fabricated dollars. Schema:
# finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: azurekeyvaultsecret
spec:
  presets:
    - preset: 01-basic-secret
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      exclusions:
        - "every data-plane call against the secret (the write that stores it, every consumer read, list operations) bills the parent AzureKeyVault's operations meter at 0.03 USD per 10,000 transactions -- Key Vault publishes no free grant, so the very first call bills, and the rate is identical on both vault tiers"
      notes: "Zero committed cost -- the secret is free to hold: no storage meter, no version charge, no metadata charge. The bill lives entirely on the vault it references and moves only with call volume."
    - preset: 02-expiring-api-key
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      exclusions:
        - "every data-plane call against the secret bills the parent AzureKeyVault's operations meter at 0.03 USD per 10,000 transactions -- and each rotation writes a new version, which is one more billed operation, not a recurring charge"
      notes: "Zero committed cost -- expiry and not-before are free advisory metadata; Key Vault stores and returns them without a meter. Rotation cadence moves the vault's operations bill by one write per rotation, nothing else."
