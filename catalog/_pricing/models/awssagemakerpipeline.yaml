# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are zero-committed: the pipeline layer is
# permanently free (AWS's FAQ -- no per-pipeline, per-execution, or
# per-step fee), and a pipeline at rest launches nothing. What executions
# spend lives INSIDE the definition JSON's per-step instance declarations,
# which no field-level derivation can see -- stated in exclusions, never
# padded into fabricated dollars.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awssagemakerpipeline
spec:
  presets:
    - preset: 01-inline-training-pipeline
      region_assumption: us-west-2
      currency: USD
      hours_per_month: 730
      exclusions:
        - the preset's inline definition is a deliberate single-node Fail-step placeholder that launches no compute even when executed -- once replaced with a real pipeline.definition() output, every training/processing/transform step bills its declared instances per second while it runs
        - execution frequency is the multiplier -- a scheduled DAG bills its full step compute every run
        - step inputs, outputs, and artifacts bill as S3 storage and requests on their buckets; step containers pull from ECR; step logs bill CloudWatch ingestion
      notes: Zero committed cost -- the pipeline object and its orchestration are permanently free, and this placeholder DAG cannot spend; the zero is the service's own pricing for the object at rest, with all real spend inside the future definition's step declarations.
    - preset: 02-s3-definition-pipeline
      region_assumption: us-west-2
      currency: USD
      hours_per_month: 730
      exclusions:
        - "the DAG lives in s3://my-pipeline-definitions/pipelines/nightly-training.json -- its step instance declarations are invisible to this manifest, and they are the entire bill: each training/processing/transform step bills its declared instances per second per execution"
        - the display name ("nightly-training") signals a scheduled cadence -- roughly 30 executions a month, each billing the whole DAG's step compute
        - parallelism_max_steps 4 caps concurrent step spend, never an execution's total instance-hours
        - step data bills as S3 storage and requests on its buckets; step logs bill CloudWatch ingestion; any registered model packages are free registry entries
      notes: Zero committed cost -- commitment-absence, never free-to-run; the pipeline layer itself carries no fee, and everything an execution spends is declared inside the S3 definition object where no field-level estimate can reach it.
