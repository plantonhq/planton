# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Presets with no quantity lines have no committed always-on
# spend and estimate to zero. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: gcpcloudfunction
spec:
  presets:
    - preset: 01-http-api
      region_assumption: us-central1
      currency: USD
      hours_per_month: 730
      exclusions:
        - "the function scales to zero (minInstanceCount: 0) -- active vCPU bills $0.000024 per vCPU-second and active memory $0.0000025 per GiB-second (256M per instance, request-based billing, us-central1) only while requests are in flight"
        - invocations bill $0.40 per million beyond the free 2 million per month
        - Google's monthly free tier (first 180,000 vCPU-seconds and 360,000 GiB-seconds of active time per billing account) absorbs light traffic before the compute meters bill at all
        - each deploy runs a Cloud Build build of the source archive and stores the image in Artifact Registry -- both bill on those services beyond their free tiers
        - network egress follows Google Cloud networking pricing
      notes: Zero committed at creation -- a scale-to-zero HTTP function bills nothing while idle, and every charge follows requests actually served.
    - preset: 02-pubsub-event
      region_assumption: us-central1
      currency: USD
      hours_per_month: 730
      exclusions:
        - "no scaling floor is set, so the function scales to zero -- active vCPU and memory (512M per instance) bill per vCPU-second and GiB-second only while Pub/Sub deliveries are being processed, and invocations bill $0.40 per million beyond the free 2 million"
        - "retryPolicy: RETRY_POLICY_RETRY redelivers failed events with backoff -- each redelivery is a fresh billed invocation and fresh active seconds"
        - Eventarc delivery and Pub/Sub message charges bill on those services; the orders topic is a separate resource with its own estimate
        - each deploy's Cloud Build build and Artifact Registry image storage bill on those services
      notes: Zero committed at creation -- an event-driven function is a rate card waiting for messages; maxInstanceCount 50 bounds the worst-case burst, not a standing cost.
    - preset: 03-private-vpc-egress
      region_assumption: us-central1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: min-instance idle vCPU
          price: cloudrunfunctions-idle-min-instance-vcpu-us-central1
          pricing_quantity: "438876"
          quantity_basis: "1 warm instance (scaling.minInstanceCount: 1) x 0.167 vCPU x 2,628,000 seconds (730 hours x 3,600), assuming the instance idles the whole month. STATED ASSUMPTION: availableCpu is unset, so GCP derives the allocation from memory; Google no longer publishes the derivation table, and its own pricing page (Example 4, read 2026-08-22) pairs the 256 MiB default with 0.167 vCPU -- that pairing is assumed here and labeled, not measured"
        - sku_meter: min-instance idle memory
          price: cloudrunfunctions-idle-min-instance-memory-us-central1
          pricing_quantity: "657000"
          quantity_basis: "1 warm instance x 0.25 GiB x 2,628,000 seconds (730 hours x 3,600), assuming the instance idles the whole month. availableMemory is unset, so the API default applies -- 256 MiB per Google's memory-limits documentation (docs.cloud.google.com/run/docs/configuring/services/memory-limits, read 2026-08-22), exactly 0.25 GiB"
      exclusions:
        - every second the warm instance actually serves swaps the $0.0000025 idle vCPU rate for the $0.000024 active rate (and idle memory for active at the same $0.0000025), so real traffic bills above this floor; instances scaled past the floor (up to maxInstanceCount 20) bill active rates only
        - invocations bill $0.40 per million beyond the free 2 million per month
        - the referenced GcpServerlessVpcConnector bills its own instances around the clock on that component -- the standing cost of the VPC path lives there, not here
        - the referenced GcpServiceAccount is free; Secret Manager access operations for the DATABASE_PASSWORD reference bill on the secret's project
        - each deploy's Cloud Build build and Artifact Registry image storage bill on those services
      notes: "The committed floor is the one warm instance's idle allocation: 438,876 vCPU-seconds x $0.0000025 = $1.09719 plus 657,000 GiB-seconds x $0.0000025 = $1.6425, about $2.74 a month at list before any request arrives. The vCPU half rides the labeled 0.167-vCPU assumption above; the memory half is exact."
