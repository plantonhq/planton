# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are genuinely zero-committed: an idle queue
# performs no operations and costs $0 per the kind's own cost profile,
# and the single Queues meter (standard operations, per 64 KB written, read,
# or deleted) moves only when producers send messages -- stated in
# exclusions, never padded into fabricated dollars. Schema:
# finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: cloudflarequeue
spec:
  presets:
    - preset: 01-worker-consumer
      region_assumption: global
      currency: USD
      hours_per_month: 730
      exclusions:
        - the standard-operations meter (Workers Paid 1,000,000 operations/month included, then $0.40/million; Workers Free 10,000/day) bills about 3 operations per delivered message (write, read, delete, per 64 KB chunk) -- message volume comes from producers this manifest cannot know
        - retries (capped here at 3 per message) each incur a read operation, and messages exhausting retries incur a write operation into the orders-dlq dead-letter queue, billed as that queue's operations
        - the consuming Worker's compute bills as Workers requests and CPU time on the referenced CloudflareWorker component
        - the $5/mo Workers Paid subscription is account-level plan spend -- no field in this spec pins it
      notes: "Zero committed cost -- batching (25 messages, 1s max wait) and concurrency (10) shape delivery timing, not the rate card; every operation waits for the first produced message."
    - preset: 02-http-pull
      region_assumption: global
      currency: USD
      hours_per_month: 730
      exclusions:
        - the standard-operations meter (Workers Paid 1,000,000 operations/month included, then $0.40/million; Workers Free 10,000/day) bills writes by producers, reads by external pull clients, and deletes on acknowledgement -- all traffic-driven
        - retries (capped here at 3 per message) each incur a read operation; with no dead-letter queue configured, messages exhausting retries are dropped (no further operations)
        - the external clients pulling over HTTP run outside Cloudflare and bill nothing here
        - the $5/mo Workers Paid subscription is account-level plan spend -- no field in this spec pins it
      notes: "Zero committed cost -- the pull consumer, its 60-second visibility timeout, and the batch size of 50 govern lease semantics, not price; the queue idles free until messages arrive."
