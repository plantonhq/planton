# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Presets with no quantity lines have no committed always-on
# spend and estimate to zero. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: gcpcloudrun
spec:
  presets:
    - preset: 01-public-api-service
      region_assumption: us-central1
      currency: USD
      hours_per_month: 730
      exclusions:
        - "the service scales to zero (minInstanceCount: 0) -- active vCPU bills $0.000024 per vCPU-second and active memory $0.0000025 per GiB-second (1 vCPU / 512Mi per instance, request-based billing, Tier 1) only while requests are in flight"
        - requests bill $0.40 per million beyond the free 2 million per month, only for requests that pass authentication
        - Google's monthly free tier (first 180,000 vCPU-seconds and 360,000 GiB-seconds of active time per billing account) absorbs light traffic before the compute meters bill at all
        - network egress to the internet follows Google Cloud networking pricing
      notes: Zero committed at creation -- a scale-to-zero public API bills nothing while idle, and every charge follows requests actually served.
    - preset: 02-private-vpc-service
      region_assumption: us-central1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: min-instance idle vCPU
          price: cloudrun-idle-min-instance-vcpu-us-central1
          pricing_quantity: "2628000"
          quantity_basis: "1 warm instance (scaling.minInstanceCount: 1) x 1 vCPU (the container's resources.cpu \"1\") x 2,628,000 seconds (730 hours x 3,600), assuming the instance idles the whole month"
        - sku_meter: min-instance idle memory
          price: cloudrun-idle-min-instance-memory-us-central1
          pricing_quantity: "2628000"
          quantity_basis: "1 warm instance x 1 GiB (the container's resources.memory \"1Gi\") x 2,628,000 seconds (730 hours x 3,600), assuming the instance idles the whole month"
      exclusions:
        - every second the warm instance actually serves swaps the $0.0000025 idle vCPU rate for the $0.000024 active rate (and idle memory for active memory at the same $0.0000025), so real traffic bills above this floor; instances scaled up past the floor (up to maxInstanceCount 50) bill active rates only
        - requests bill $0.40 per million beyond the free 2 million per month
        - the referenced GcpCloudSql instance and GcpServiceAccount are separate resources with their own estimates; Secret Manager access operations for the DATABASE_PASSWORD reference bill on the secret's project
        - direct VPC egress (network_interfaces) has no standing connector cost -- traffic into the VPC bills at VPC data transfer rates as it moves
      notes: "The committed floor is the one warm instance's idle allocation: 2,628,000 vCPU-seconds x $0.0000025 = $6.57 plus 2,628,000 GiB-seconds x $0.0000025 = $6.57, $13.14 a month at list before any request arrives. Google's request-based free tier (180,000 vCPU-seconds / 360,000 GiB-seconds of ACTIVE time) does not name idle time, so the floor is stated at list per list-price semantics."
    - preset: 03-gpu-inference
      region_assumption: us-central1
      currency: USD
      hours_per_month: 730
      exclusions:
        - "the service scales to zero (minInstanceCount: 0), so nothing is committed -- but every running instance bills one NVIDIA L4 without zonal redundancy at $0.0001867 per second (cloud.google.com/run/pricing and Cloud Billing SKU 2EEE-0BBD-C718, read 2026-08-22), about $490.65 per instance-month (730 hours) if kept busy around the clock, the dominant meter whenever traffic flows"
        - "cpuIdle: false selects instance-based billing -- each instance's 4 vCPU bill $0.000018 per vCPU-second and 16Gi bills $0.000002 per GiB-second for the instance's entire lifetime, and no per-request fee applies"
        - Google's instance-based free tier (first 240,000 vCPU-seconds and 450,000 GiB-seconds per billing account) softens light usage; the GPU meter has no free tier
        - model weights and inference inputs/outputs bill on the storage kinds the code reads and writes; network egress follows Google Cloud networking pricing
      notes: Zero committed at creation -- unlike a GPU service pinned warm by min instances, this preset holds no capacity between requests; maxInstanceCount 4 bounds the worst-case GPU spend to 4 concurrent instance lifetimes.
