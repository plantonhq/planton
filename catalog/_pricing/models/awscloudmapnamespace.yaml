# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. A hand model rather than a derivation: the committed
# registration count lives in nested repeated fields (services[].instances[])
# the derivation grammar cannot count, and the hosted-zone charge follows
# the namespace type. Each preset's quantities are read and defended by
# hand. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awscloudmapnamespace
spec:
  presets:
    - preset: 01-private-dns-namespace
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: hosted zone months
          price: route53-hosted-zone
          pricing_quantity: "1"
          quantity_basis: a PRIVATE_DNS namespace creates one Route 53 private hosted zone (corp.internal, visible in the app VPC) that bills every month the namespace exists
        - sku_meter: registered resource months
          price: cloudmap-resource-months-us-east-1
          pricing_quantity: "1"
          quantity_basis: one static registration is pinned -- the db service's "primary" instance (the RDS CNAME); the api service declares no static instances
      exclusions:
        - the api service is registered into at runtime (ECS service discovery style) -- each live task's registration bills its own $0.10 resource-month, following fleet size
        - DNS lookups of api.corp.internal and db.corp.internal bill Route 53 query charges on the hosted zone; DiscoverInstances calls bill $1.00 per million
      notes: "The custom heartbeat on the api service (health_check_custom_config) is free -- only Route 53 health checks (health_check_config, public namespaces only) would bill separately. Committed floor: $0.50 zone + $0.10 static registration = $0.60 a month."
    - preset: 02-http-api-only
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: registered resource months
          price: cloudmap-resource-months-us-east-1
          pricing_quantity: "1"
          quantity_basis: one static registration is pinned -- the workers service's "worker-1" instance with its custom attributes; HTTP namespaces create no hosted zone, so this is the only committed meter
      exclusions:
        - every DiscoverInstances lookup by consuming applications bills $1.00 per million API calls -- discovery traffic is the consumers' behavior
        - additional workers registered at runtime bill their own resource-months, following fleet size
      notes: "An HTTP namespace is API-only -- no DNS records, no hosted zone, no Route 53 charges. The committed floor is the single static registration: $0.10 a month."
