# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are zero-committed: a pipe carries no
# existence fee, and its only EventBridge meter -- requests at $0.40 per
# million after filtering, in 64 KB chunks -- runs exactly as fast as the
# source produces events, which the manifest cannot see -- stated in
# exclusions, never padded into fabricated dollars.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awseventbridgepipe
spec:
  presets:
    - preset: 01-sqs-to-sqs
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - requests bill $0.40 per million AFTER the order-type filter, in 64 KB chunks -- pipes have no free allotment, and this manifest commits zero volume; the filter and the 10-event batch are the two levers that shrink whatever volume arrives
        - both SQS queues meter their own requests on their AwsSqsQueue kinds -- the intake queue's receives and the processing queue's sends are where an active pipeline's spend concentrates
        - an idle pipe on an empty queue bills nothing at rest -- RUNNING state alone starts no meter
      notes: Zero committed cost -- the pipe exists free; every dollar waits on order traffic actually flowing through the intake queue, a volume the manifest cannot see.
    - preset: 02-dynamodb-stream-to-lambda
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - requests bill $0.40 per million table-change batches delivered (unfiltered, batches of 100, 64 KB chunks) -- no free allotment; volume tracks the orders table's write rate, which the manifest cannot see
        - the audit function's invocations and duration bill on the referenced AwsLambda -- REQUEST_RESPONSE waits for results and retries failures (up to 3 attempts with AUTOMATIC_BISECT), so a failing function multiplies ITS OWN invocation count, not the pipe's request count
        - exhausted batches land in the dead-letter queue, billing SQS requests on the referenced AwsSqsQueue
        - the DynamoDB table's own streams, storage, and throughput bill on the referenced AwsDynamodb kind
      notes: Zero committed cost -- the pipe carries no existence fee; the request meter starts with the first table change the stream emits, in proportion to write traffic the manifest cannot see.
