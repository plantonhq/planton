# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. The 03-zone-redundant-v2 preset is deliberately unestimated:
# Azure's price API publishes no gateway-hour meter for the STANDARD_V2 SKU
# yet, and a number without a published list price would be a guess.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: azurenatgateway
spec:
  presets:
    - preset: 01-standard
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: gateway hours
          price: nat-gateway-hours
          pricing_quantity: "730"
          quantity_basis: one STANDARD gateway billed the flat globally priced rate every hour of the month from creation, idle or busy
      exclusions:
        - data processing bills every GB translated, in both directions
        - the one attached public IP bills hourly on its own referenced component
      notes: The gateway-hour line is the whole committed spend; traffic and the referenced address are the variables that live elsewhere.
    - preset: 02-prefix-snat-range
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: gateway hours
          price: nat-gateway-hours
          pricing_quantity: "730"
          quantity_basis: one STANDARD gateway billed the flat globally priced rate every hour of the month
      exclusions:
        - data processing bills every GB translated, in both directions
        - the attached public IP prefix bills every address it contains, hourly, on its own referenced component -- the prefix size lives on that component, not this manifest
      notes: The prefix buys a contiguous, allowlistable SNAT range; its cost follows the prefix component.
