# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. The kind's class is hybrid solely because the
# argo_smart_routing toggle pins the paid Argo Smart Routing add-on (a
# committed monthly base fee plus a per-GB data-transfer meter, dollar
# $5.00/mo entry-tier base fee plus $0.10/GB, per Cloudflare's own
# plans page and billing invoice example, retrieved 2026-08-22). Both are
# nonetheless genuinely zero-committed: every setting they manage (smart
# tiered cache, regional tiered cache, cache variants) is a free feature on
# every plan per the kind's own cost profile, and neither preset
# touches the two paid toggles (argo_smart_routing, cache_reserve) that
# would commit the baseline or start a meter -- stated in exclusions, never
# padded into fabricated dollars. Schema:
# finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: cloudflarecachesettings
spec:
  presets:
    - preset: 01-tiered-caching
      region_assumption: global
      currency: USD
      hours_per_month: 730
      exclusions:
        - the Argo Smart Routing add-on ($5.00/mo entry-tier base fee plus $0.10/GB routed traffic -- the kind's conditional baseline) never starts -- this preset leaves argo_smart_routing unmanaged, and the kind's cost profile warns the add-on keeps billing until explicitly turned off once started
        - the Cache Reserve storage and operations meter (GB-months plus read/write operations) never starts -- this preset leaves cache_reserve unmanaged
      notes: Zero committed cost -- smart tiered cache and regional tiered cache are free features on every Cloudflare plan; this preset manages routing topology, not a paid meter.
    - preset: 02-image-variants
      region_assumption: global
      currency: USD
      hours_per_month: 730
      exclusions:
        - the Argo Smart Routing add-on ($5.00/mo entry-tier base fee plus $0.10/GB routed traffic -- the kind's conditional baseline) never starts -- this preset leaves argo_smart_routing unmanaged
        - the Cache Reserve storage and operations meter (GB-months plus read/write operations) never starts -- this preset leaves cache_reserve unmanaged
      notes: Zero committed cost -- smart tiered cache and per-extension cache variants are free features on every Cloudflare plan; caching alternate image formats changes what the edge stores, not what Cloudflare bills.
