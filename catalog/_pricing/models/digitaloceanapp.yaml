# Estimate model: the authored half of this component's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. A hand model rather than a derivation: an app's cost
# identity lives in REPEATED component trees (services, workers, jobs,
# databases), and the derivation grammar reads scalar spec paths -- it
# cannot walk each service and multiply its own slug by its own count.
# Each preset's quantities are computed here and defended in their bases.
# App Platform pricing carries no region dimension, so every referenced
# entry is pinned "global". Autoscaling floors are priced and ceilings
# named -- honest floors, never averages.
# Schema: finops/componentcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostEstimateModel
metadata:
  name: digitaloceanapp
spec:
  presets:
    - preset: 01-git-source-web
      region_assumption: nyc
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: container instances
          price: do-app-instance-basic-xxs-monthly
          pricing_quantity: "1"
          quantity_basis: "one service (web) with instanceCount 1 on the basic-xxs slug -- a single always-on container billed per second at the slug's 5.00 USD monthly rate"
      exclusions:
        - "outbound transfer beyond the instance's included monthly allowance bills 0.02 USD/GiB"
      notes: "Committed total is one basic-xxs instance-month (5.00 USD). Build minutes, automatic HTTPS, and the platform ingress are included."
    - preset: 02-container-image
      region_assumption: nyc
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: container instances
          price: do-app-instance-professional-xs-monthly
          pricing_quantity: "2"
          quantity_basis: "one service (web) on professional-xs with autoscaling minInstanceCount 2 -- the committed FLOOR is two always-on instances (2 x 12.00 = 24.00 USD/mo); the maxInstanceCount 5 ceiling follows CPU demand and rides the exclusions"
      exclusions:
        - "autoscaling can grow the service above the 2-instance floor up to 5 instances at 80 percent CPU -- each extra instance bills 12.00 USD/mo while it runs"
        - "outbound transfer beyond the pooled per-instance allowance bills 0.02 USD/GiB"
      notes: "Committed total is two professional-xs instance-months (24.00 USD). Both presets pin LEGACY slugs whose rates DigitalOcean still publishes but intends to deprecate (apps-s-*/apps-d-* are the forward path), and the current plan tables mark autoscaling as dedicated-only -- the legacy professional-xs predates that split. Flagged for preset review."
