# Estimate model: the authored capacity footprints of this cluster-capacity
# kind's presets. A hand model instead of a capacity derivation because
# the spec's `mode` field switches the replica semantics: deployment/
# statefulset multiply resources by replicas, daemonset runs one pod PER
# NODE (replicas is rejected there -- node membership is the multiplier and
# only the target cluster knows it), and sidecar creates no standalone
# workload at all. The derivation grammar cannot express mode-conditional
# multipliers, and a mechanical "N instances x ..." basis would misread the
# daemonset preset's reservation -- so each preset's footprint is stated by
# hand, honest about its actual mode. Cluster-capacity kinds carry no
# priced lines -- the dollar value of the reservation is the target
# cluster's node economics. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: kubernetesotelcollector
spec:
  # Presets 01-cluster-logs-to-loki (daemonset mode: one unsized pod per
  # node) and 03-otlp-fanin (autoscaling floor with no declared resources)
  # state no scheduler reservation in their manifests -- they are honestly
  # omitted (the same shape the generator produces for a no-reservation
  # preset). The per-node semantics, the unbounded-when-unsized reality,
  # and the HPA floor are disclosed in the kind's cost profile.
  presets:
    - preset: 02-traces-gateway-to-tempo
      capacity_footprint:
        cpu_requests: 400m
        memory_requests: 1Gi
        memory_limits: 1Gi
        basis: 2 replicas x (200m CPU / 512Mi memory requests, 512Mi memory limit -- no CPU limit declared)
      exclusions:
        - the dollar value of this capacity is the target cluster's node economics
