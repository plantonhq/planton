# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Presets with no quantity lines have no committed always-on
# spend and estimate to zero. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: azurevirtualnetwork
spec:
  presets:
    - preset: 01-standard
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      exclusions:
        - the virtual network, its address space, and its DNS settings bill nothing at any scale
        - the network's real spend lives in separate components deployed into it -- NAT gateways, public IPs, peerings, and gateways
      notes: A virtual network is free Azure infrastructure -- the estimate is zero by the provider's pricing, not by omission.
    - preset: 02-hub-custom-dns
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      exclusions:
        - the network and its custom DNS server settings bill nothing; hub-and-spoke traffic bills per GB on the peerings, separate components
        - the network's real spend lives in separate components deployed into it
      notes: A virtual network is free Azure infrastructure -- the estimate is zero by the provider's pricing, not by omission.
    - preset: 03-ddos-protected
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      exclusions:
        - the attached DDoS Network Protection plan bills a fixed monthly fee on its own referenced resource, shared by every network that joins it -- the cost belongs to that component, not this manifest
        - the network itself bills nothing at any scale
      notes: The DDoS plan is the preset's money decision, and it bills where it lives -- on the plan resource this manifest only references.
