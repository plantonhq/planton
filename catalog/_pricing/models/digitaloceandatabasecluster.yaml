# Estimate model: the authored half of this component's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. A hand model rather than a derivation: the opensearch
# preset's committed additional-storage quantity is storage_gib MINUS the
# size slug's included base (100 - 70 = 30 GiB), and that included base is
# a PER-SLUG fact from DigitalOcean's pricing page, not a constant any
# subtract_baseline rule could state nor a spec field the grammar could
# read. Each preset's quantities are
# computed here and defended in their bases. DigitalOcean prices managed
# databases identically in every region (the pricing page carries one table
# per engine with no region dimension), so every referenced entry is pinned
# "global". Schema: finops/componentcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostEstimateModel
metadata:
  name: digitaloceandatabasecluster
spec:
  presets:
    - preset: 01-postgresql-ha
      region_assumption: nyc3
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: database nodes
          price: do-managed-db-pg-db-s-2vcpu-4gb-node-monthly
          pricing_quantity: "3"
          quantity_basis: "nodeCount 3 -- one primary and two standbys, each a full db-s-2vcpu-4gb PostgreSQL node billed the same monthly rate from creation"
      exclusions:
        - "storage_autoscale is enabled at an 80 percent threshold: each triggered growth step adds additional storage at 0.215 USD/GiB/mo permanently, following actual disk usage no manifest can predict"
        - "read-only replicas, users, logical databases, connection pools, and firewall rules are separate components with their own lifecycles"
      notes: "Daily backups with 7-day point-in-time recovery and the weekly maintenance window are included in the node price. The base storage included with db-s-2vcpu-4gb carries no separate charge until autoscale grows past it."
    - preset: 02-postgresql-dev
      region_assumption: nyc3
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: database nodes
          price: do-managed-db-pg-db-s-1vcpu-1gb-node-monthly
          pricing_quantity: "1"
          quantity_basis: "nodeCount 1 -- a single db-s-1vcpu-1gb PostgreSQL node, no standby"
      exclusions:
        - "growing storage later bills 0.215 USD/GiB/mo above the size's included base"
      notes: "A single-node cluster has no failover -- the committed spend is one node-month."
    - preset: 03-valkey
      region_assumption: nyc3
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: database nodes
          price: do-managed-db-caching-db-s-1vcpu-1gb-node-monthly
          pricing_quantity: "1"
          quantity_basis: "nodeCount 1 -- a single db-s-1vcpu-1gb Valkey node; DigitalOcean's pricing page lists the caching engine under Valkey, and an adopted pre-existing redis cluster bills from the same rate table"
      exclusions:
        - "caching clusters are ephemeral -- no backup meter exists and none is excluded"
      notes: "Priced from the Managed Caching (Valkey) table at 15.00 USD/mo -- 15 cents below the PostgreSQL/MySQL rate for the same shape."
    - preset: 04-kafka
      region_assumption: nyc3
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: database nodes
          price: do-managed-db-kafka-db-s-2vcpu-2gb-broker-monthly
          pricing_quantity: "3"
          quantity_basis: "nodeCount 3 -- the API's own Kafka minimum; DigitalOcean prices Kafka in brokers, publishing 148.80 USD/mo for the 3-broker 2 vCPU / 2 GiB plan, so the per-broker rate is 148.80 / 3 = 49.60 USD/mo and 3 brokers reproduce the page's plan price exactly"
      exclusions:
        - "growing storage past the plan's included base bills 0.215 USD/GiB/mo in 30 GiB increments"
        - "topics and schema registry subjects are separate free components; the brokers carry the whole bill"
      notes: "The pricing page publishes the 3-broker plan total, not a per-broker rate -- the division by three is stated arithmetic on the page's verbatim 148.80 USD figure."
    - preset: 05-opensearch
      region_assumption: nyc3
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: database nodes
          price: do-managed-db-opensearch-db-s-2vcpu-4gb-node-monthly
          pricing_quantity: "1"
          quantity_basis: "nodeCount 1 -- a single 2 vCPU / 4 GiB OpenSearch node"
        - sku_meter: additional storage
          price: do-managed-db-additional-storage-gib-monthly
          pricing_quantity: "30"
          quantity_basis: "storageGib 100 minus the 70 GiB base included with the 2 vCPU / 4 GiB OpenSearch size (the pricing page's storage range for os-s-2-4-70 starts at 70 GiB) = 30 GiB of additional storage"
      exclusions:
        - "growing storage further bills 0.215 USD/GiB/mo in 10 GiB increments"
      notes: "Committed total is one node-month (37.05 USD) plus 30 additional GiB-months (6.45 USD). OpenSearch Dashboards is included in the node price."
