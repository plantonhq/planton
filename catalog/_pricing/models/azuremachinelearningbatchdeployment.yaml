# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are genuinely zero-committed: the deployment
# is a job recipe -- nothing runs or bills at create time, and every dollar
# it shapes lands on the compute pool its jobs run on -- stated in
# exclusions, never padded into fabricated dollars. Schema:
# finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: azuremachinelearningbatchdeployment
spec:
  presets:
    - preset: 01-model-scoring-recipe
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      exclusions:
        - job node-hours bill on the referenced compute cluster kind (its dedicated or low-priority VM meters) for each invocation's duration -- this recipe spreads each job across 4 nodes, so a one-hour scoring run is four node-hours on that pool, and zero invocations is zero node-hours
        - retries extend the billed hours -- up to 3 per failed mini-batch here, capped job-wide by errorThreshold 100
        - job inputs and the AppendRow predictions output rest in workspace datastores, billing storage capacity and transactions on the storage account's own kind
        - network egress follows what jobs move
      notes: Zero committed cost -- the recipe object carries no meter under Azure Machine Learning's no-additional-charge model; an idle deployment on a scale-to-zero pool bills nothing at all.
    - preset: 02-pipeline-kind-recipe
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      exclusions:
        - pipeline jobs' node-hours bill on whatever compute pools the settings name (default_compute here) -- each step's runtime lands on that pool's own kind at plain VM rates, only while the pipeline runs
        - the pipeline's intermediate and final outputs rest in workspace datastores, billing storage on the storage account's own kind
        - network egress follows what pipeline steps move
      notes: Zero committed cost -- a pipeline-kind recipe is a stable trigger address for a whole batch pipeline, and holding the trigger costs nothing; spend materializes per invocation on the pools the pipeline names.
