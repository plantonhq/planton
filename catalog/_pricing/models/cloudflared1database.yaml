# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. The single preset is genuinely zero-committed: a D1 database
# scales to zero per the kind's own cost profile ("You are not billed
# for hours or capacity units"), an empty database consumes about 12 KB
# against every plan's included 5 GB, and the rows-read, rows-written, and
# storage meters move only when queries run and data lands -- stated in
# exclusions, never padded into fabricated dollars. Schema:
# finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: cloudflared1database
spec:
  presets:
    - preset: 01-standard
      region_assumption: global
      currency: USD
      hours_per_month: 730
      exclusions:
        - the rows-read meter (Workers Paid first 25 billion/month included, then $0.001/million rows; Workers Free 5 million/day hard quota) follows query volume and shape -- a full table scan reads every row it scans, and no manifest can know the queries
        - the rows-written meter (Workers Paid first 50 million/month included, then $1.00/million rows; Workers Free 100,000/day hard quota) follows INSERT/UPDATE/DELETE traffic, plus one extra written row per index touched
        - the storage meter (Workers Paid first 5 GB included, then $0.75/GB-mo on the account-wide sum of all D1 databases; Workers Free 5 GB total hard cap) grows with data, tables, and indexes
        - the Worker compute that queries this database bills as Workers requests and CPU time on the querying CloudflareWorker kind
        - the $5/mo Workers Paid subscription is account-level plan spend -- no field in this spec pins it
      notes: "Zero committed cost -- the preset sets only the account, name, and a wnam region hint (placement, not price; D1's pricing table has no region dimension). The database scales to zero and every meter waits for the first query."
