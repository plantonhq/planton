# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. This kind is hand-modeled rather than derived: the
# committed bill is each dedicated variant's instance_type rate times its
# instance count, but variant identity -- which variants are serverless,
# which instance type each one runs, and how many instances -- lives inside
# the repeated production_variants tree, which derivation conditions cannot
# traverse, so per-preset hand verification is the only honest path.
# Both presets pin region us-west-2 and are priced from the us-west-2 offer.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awssagemakerendpoint
spec:
  presets:
    - preset: 01-serverless-endpoint
      region_assumption: us-west-2
      currency: USD
      hours_per_month: 730
      exclusions:
        - invocations bill per second of compute duration at the 2 GB memory tier (memory_size_mb 2048) -- workload-driven, zero when idle
        - endpoint data processing bills per GB in and per GB out of the endpoint, following payload volume
        - CloudWatch ingestion for container logs follows model output volume
        - the referenced SageMaker model and its S3 artifacts bill on their own components
      notes: The single variant is serverless with no provisioned_concurrency -- the committed monthly cost of this endpoint existing is exactly zero. Configuring provisioned concurrency is the one serverless setting that would create a standing per-second charge.
    - preset: 02-production-canary-endpoint
      region_assumption: us-west-2
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: hosting instance hours
          price: sagemaker-host-ml-m5-large-us-west-2
          pricing_quantity: "2190"
          quantity_basis: 3 instances (stable variant ml.m5.large x2 + canary variant ml.m5.large x1, both variants the same instance type) x 730 hours
      exclusions:
        - endpoint data processing bills per GB in and per GB out of the endpoint, following invocation payload volume
        - data capture stores 20% of request and response payloads in the destination S3 bucket, which bills its own storage and requests
        - each blue/green update runs a full parallel fleet through the canary shift, bake, and termination wait -- roughly double the hourly rate for the deployment window
        - endpoint ML storage bills per GB-month at the instance family's AWS-default volume size (the preset sets no volume_size_gb)
        - CloudWatch ingestion for container logs follows model output volume
      notes: Both variants run ml.m5.large, so one hosting rate covers all three instances; the 0.9/0.1 traffic weights split invocations, never the hourly charge. The referenced models bill on their own components.
