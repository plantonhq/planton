# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. A hand model rather than a derivation: the committed
# quantities live inside nested repeated fields -- the total domain count
# across domain_lists[].domains, and whether ANY rules entry matches by
# dns_threat_protection (which flips every VPC association onto the
# Advanced hourly meter) -- conditions and counts the derivation grammar
# cannot traverse. Each preset's quantities are read and defended by
# hand. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awsroute53resolverfirewall
spec:
  presets:
    - preset: 01-blocklist-sinkhole
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: firewall domain storage
          price: route53-firewall-domain-months-us-east-1
          pricing_quantity: "2"
          quantity_basis: the blocked-domains list stores 2 domains (malware.example. and phishing.example.), each billing per domain-month while the list exists
      exclusions:
        - every DNS query from the associated app VPC that the firewall inspects bills $0.60 per million (first billion each month, then $0.40) -- query volume is the VPC's workload behavior
        - the sinkhole OVERRIDE response and the block action itself cost nothing extra; visibility into blocked queries rides Resolver Query Logging, a separate resource
      notes: "All rules match by owned domain list, so the group is a STANDARD firewall -- the VPC association is free to exist and no hourly meter runs. Committed spend is the two stored domains: $0.001 a month; the real bill is the per-query inspection on traffic."
    - preset: 02-advanced-threat-alert
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: advanced threat protection hours
          price: route53-firewall-advanced-association-hours-us-east-1
          pricing_quantity: "730"
          quantity_basis: both rules match by dns_threat_protection (DGA and DNS_TUNNELING), making this a DNS Firewall Advanced group -- its single app-vpc association bills every hour of the month; a second associated VPC would add another 730 hours
      exclusions:
        - the group owns no domain lists and its threat rules carry no per-query inspection meter in the offer -- but adding any list-based rule later would start the per-domain storage and per-query inspection charges
        - ALERT matches surface through Resolver Query Logging, a separate resource whose log destinations bill their own components
      notes: "The Advanced fee follows the ASSOCIATION, not the rule count: one threat rule or ten, each associated VPC bills the same $0.16/hour (~$116.80 a month). Both rules alert at HIGH confidence -- tightening to LOW/MEDIUM changes detection sensitivity, never the price."
