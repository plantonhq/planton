# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Both presets are zero-committed: AWS publishes no meter for
# Bedrock invocation logging (the Bedrock pricing page's complete meter list
# has no logging line), so the configuration commits nothing and every dollar
# it causes bills on the referenced destinations, in proportion to the
# region's model traffic -- stated in exclusions, never padded into
# fabricated dollars. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awsbedrockinvocationlogging
spec:
  presets:
    - preset: 01-full-fidelity-audit
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - every model invocation in the region ingests a log event (metadata plus request/response bodies up to 100 KB) into the referenced AwsCloudwatchLogGroup, which bills ingestion per GB and storage per GB-month under its own retention setting
        - the same events also deliver as gzipped JSON batches to the referenced AwsS3Bucket, which bills PUT requests and accumulating GB-month storage under its own lifecycle rules
        - payloads over CloudWatch's 256 KB event cap spill into the large-data S3 bucket as individual objects -- one PUT per oversized body
        - all four data types are captured at their defaults (text, image, embedding, video); image and video payloads land as individual S3 objects, the heaviest storage class
        - SSE-KMS on a destination bucket adds per-request charges on the referenced AwsKmsKey
      notes: Zero committed cost -- enabling full-fidelity capture bills nothing by itself, and the zero is commitment-absence; every meter above lives on a referenced destination component and starts with the region's first model invocation, scaling with traffic this manifest cannot see.
    - preset: 02-s3-archive-only
      region_assumption: us-east-1
      currency: USD
      hours_per_month: 730
      exclusions:
        - each model invocation delivers a gzipped JSON batch entry to the referenced AwsS3Bucket -- PUT requests plus storage that accumulates month over month under the bucket's lifecycle rules
        - text and image data types stay at their enabled defaults; video and embedding delivery are explicitly disabled in this preset, dropping the heaviest payload classes from the archive
        - with no CloudWatch arm configured there is no ingestion meter and no large-data spillover -- the bucket is the entire cost surface
        - SSE-KMS on the bucket adds per-request charges on the referenced AwsKmsKey
      notes: Zero committed cost -- the archive-only configuration bills nothing at rest; the S3 meters belong to the referenced bucket and start with the first logged invocation, and disabling video/embedding delivery is this preset's built-in cost containment.
