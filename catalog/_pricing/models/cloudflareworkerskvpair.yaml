# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. The single preset is genuinely zero-committed: one seeded
# entry costs one keys-written operation per apply and its bytes of stored
# data -- both deep inside even the Free plan's daily quotas per the
# kind's own cost profile, with runtime reads riding the parent
# namespace's meters. Stated in exclusions, never padded into fabricated
# dollars. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: cloudflareworkerskvpair
spec:
  presets:
    - preset: 01-standard
      region_assumption: global
      currency: USD
      hours_per_month: 730
      exclusions:
        - the keys-written meter (Workers Paid 1 million/month included, then $5.00/million; Workers Free 1,000/day) sees one operation per apply of this manifest and one keys-deleted operation on destroy -- deploy-cadence usage, not committed monthly spend
        - the stored-data meter (Workers Paid 1 GB included, then $0.50/GB-month; Workers Free 1 GB cap) carries the value's bytes (up to 25 MiB) plus up to 1024 bytes of metadata on the account-wide sum
        - the keys-read meter (Workers Paid 10 million/month included, then $0.50/million; Workers Free 100,000/day) bills runtime reads of this key by Workers, driven by application traffic against the parent CloudflareKvNamespace
        - the $5/mo Workers Paid subscription is account-level plan spend -- no field in this spec pins it
      notes: "Zero committed cost -- a single configuration entry's write, storage, and eventual delete sit deep inside every plan's included allotments; recurring spend would require read traffic or fleet-scale seeding, neither knowable from this manifest."
