# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Presets with no quantity lines have no committed always-on
# spend and estimate to zero. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: azurestorageaccount
spec:
  presets:
    - preset: 01-general-purpose-v2
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      exclusions:
        - an empty account bills nothing -- storage accrues per GB-month at the HOT LRS rate as workloads write, and versioning plus the 7-day soft-delete windows keep noncurrent data billing until it ages out
        - operations and network egress follow access patterns
      notes: Creation is free; the estimate is zero because the manifest commits no bytes, not because storage is free.
    - preset: 02-production-locked-down
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      exclusions:
        - stored bytes bill at GZRS rates (roughly double LRS -- zone redundancy plus a geo-secondary) as data arrives, with the lifecycle rule tiering to COOL at 30 days, ARCHIVE at 180, and deleting at 730
        - geo-replication data transfer bills per GB written
        - operations and egress follow access patterns; the 30-day soft-delete windows extend how long deleted data bills
      notes: Zero committed at creation -- the redundancy and lifecycle choices set the rates the first byte will meet.
    - preset: 03-data-lake-gen2
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: SFTP endpoint
          price: storage-sftp-endpoint
          pricing_quantity: "730"
          quantity_basis: the enabled SFTP endpoint bills every hour it stays on, independent of transfer volume
      exclusions:
        - stored bytes bill at ZRS rates as pipelines write; the raw/ lifecycle rule cools at 30 days and deletes at 365
        - operations and egress follow the lake's traffic
      notes: The SFTP endpoint is the preset's one committed line -- hierarchical namespace and the lake layout are free capabilities on the same rate card.
