# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. The 04-global-datastore-secondary preset is deliberately
# unmodeled: its two nodes bill at a node type INHERITED from the global
# datastore's primary, which this manifest cannot know -- an estimate here
# would be a guess wearing a dollar sign, so the preset renders no price.
# Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: awsrediselasticache
spec:
  presets:
    - preset: 01-redis-single-node
      region_assumption: us-west-2
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: cache node hours
          price: elasticache-cache-t3-micro-redis-us-west-2
          pricing_quantity: "730"
          quantity_basis: numCacheClusters 1 -- a single cache.t3.micro node, billed every hour of the month
      exclusions:
        - no snapshots are configured, so no snapshot storage accrues
        - data transfer between AZs does not apply to a single node
      notes: A development cache -- one burstable node, no replicas, no failover.
    - preset: 02-redis-ha-cluster
      region_assumption: us-west-2
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: cache node hours
          price: elasticache-cache-r7g-large-redis-us-west-2
          pricing_quantity: "2190"
          quantity_basis: numCacheClusters 3 -- one primary plus two replicas on cache.r7g.large, 3 nodes x 730 hours
      exclusions:
        - snapshot storage beyond the free allowance across the 7-day retention grows with dataset size
        - cross-AZ replication transfer between the multi-AZ nodes is write-volume-dependent
      notes: Multi-AZ failover carries no fee of its own -- its cost is the two replica nodes.
    - preset: 03-redis-clustered-production
      region_assumption: us-west-2
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: cache node hours
          price: elasticache-cache-r7g-xlarge-redis-us-west-2
          pricing_quantity: "6570"
          quantity_basis: numNodeGroups 3 x (1 primary + replicasPerNodeGroup 2) = 9 cache.r7g.xlarge nodes x 730 hours
      exclusions:
        - snapshot storage beyond the free allowance across the 14-day retention grows with dataset size
        - slow-log delivery bills CloudWatch Logs ingestion with engine activity
        - cross-AZ replication transfer is write-volume-dependent
      notes: The largest committed spend in this kind's presets -- nine memory-optimized nodes around the clock before a single command runs.
