# Estimate model: the authored half of this kind's per-preset cost
# estimates -- quantity assumptions derived from the preset manifests and
# defended in prose. Prices live in the provider's price book (../pricebook/,
# referenced by entry slug); the estimate generator joins the two and emits
# ../estimates/. Schema: finops/catalogkindcostestimatemodel/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostEstimateModel
metadata:
  name: azurepostgresqlflexibleserver
spec:
  presets:
    - preset: 01-dev-burstable
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: server compute
          price: postgres-flexible-b1ms-eastus
          pricing_quantity: "730"
          quantity_basis: one B_Standard_B1ms server x 730 hours -- the Burstable tier's smallest production-capable size
        - sku_meter: server storage
          price: postgres-flexible-storage-eastus
          pricing_quantity: "32"
          quantity_basis: storage_mb is unset, so the 32768 MB (32 GiB) ladder minimum is provisioned
      exclusions:
        - backup storage beyond the free allowance (100% of provisioned storage) follows database churn at the 7-day default retention
        - network egress follows client placement
      notes: The burstable tier accrues CPU credits when idle -- sustained load beyond the baseline is the tier's known trade-off, not a billing surprise.
    - preset: 02-production-private-ha
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: server compute
          price: postgres-flexible-d4ds-v5-eastus
          pricing_quantity: "1460"
          quantity_basis: GP_Standard_D4ds_v5 x 730 hours x 2 -- zone-redundant HA bills the synchronized standby's compute at the primary's rate (Microsoft's pricing FAQ states both replicas bill)
        - sku_meter: server storage
          price: postgres-flexible-storage-eastus
          pricing_quantity: "512"
          quantity_basis: 262144 MB (256 GiB) provisioned x 2 -- the zone-redundant standby provisions its own equal storage, billed like the primary's per Microsoft's pricing FAQ
      exclusions:
        - backup storage beyond the free allowance follows churn at 35-day retention, and geo-redundant backups bill at roughly double the local backup rate
        - auto-grow can step provisioned storage up the ladder under pressure, doubling each step's cost through the HA multiplier
        - network egress follows client placement
      notes: Zone-redundant HA is the deliberate 2x -- both compute and storage double, which is exactly what the 99.99% failover posture buys.
    - preset: 03-hardened-cmk-entra
      region_assumption: eastus
      currency: USD
      hours_per_month: 730
      quantity_lines:
        - sku_meter: server compute
          price: postgres-flexible-d4ds-v5-eastus
          pricing_quantity: "730"
          quantity_basis: GP_Standard_D4ds_v5 x 730 hours, single zone (no HA block)
        - sku_meter: server storage
          price: postgres-flexible-storage-eastus
          pricing_quantity: "128"
          quantity_basis: 131072 MB (128 GiB) provisioned on the storage ladder
      exclusions:
        - backup storage beyond the free allowance follows churn at 35-day retention
        - Key Vault operations for the customer-managed key bill on the referenced vault, a separate kind
        - network egress follows client placement
      notes: The hardening choices (CMK, Entra-only authentication) change the security posture, not the bill -- compute and storage price identically to an unhardened server of the same shape.
