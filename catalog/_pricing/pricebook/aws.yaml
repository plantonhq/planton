# The AWS price book: every AWS unit price the catalog's cost estimates
# cite, pinned with source URL and retrieval date. Entries are referenced
# by slug from the estimate models under ../models/ and selected by
# value-keyed attribute identity from the cost derivations under
# ../derivations/ (the attributes map is hand-authored lookup identity in
# the catalog's own vocabulary; the fetcher preserves it verbatim).
# Entries carrying an aws_selector are refreshed by
# `make generate-price-book` from the public AWS Price List bulk API
# (the price_source pins the exact versioned offer document the price was
# read from). Schema: finops/pricebook/v1.
