# Cost derivation: the machine-executable rules turning any
# GcpGlobalAddress manifest's spec values into metered quantities and
# price choices. Only a static EXTERNAL IPv4 bills -- hourly, at the
# reserved-idle rate, and ONLY while unattached: assigned to a global
# forwarding rule (a global address's one job) it is free. INTERNAL
# ranges (VPC peering, Private Service Connect) and external IPv6 are
# free by Google's pricing and produce zero-line estimates. The spec has
# no region field -- a global address is anycast -- so pricing binds to
# the us-central1 assumption, whose static-IP rate is the standard tier
# shared across regions. The estimate generator replays the catalog
# presets through these rules to emit ../estimates/gcpglobaladdress.yaml.
# Schema: finops/catalogkindcostderivation/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostDerivation
metadata:
  name: gcpglobaladdress
spec:
  currency: USD
  hours_per_month: 730
  region:
    assumption: us-central1
  lines:
    - sku_meter: reserved external IPv4
      applies_when:
        - field_path: address_type
          op: not_equals
          value: INTERNAL
        - field_path: ip_version
          op: not_equals
          value: IPV6
      quantity:
        - constant: "1"
        - hours_in_month: true
      price_slug: static-ip-idle-us-central1
      basis: one static external IPv4 x 730 hours at the reserved-but-unattached rate -- the reservation's committed charge until a global forwarding rule takes it, and its worst case
  exclusions:
    - applies_when:
        - field_path: address_type
          op: not_equals
          value: INTERNAL
        - field_path: ip_version
          op: not_equals
          value: IPV6
      text: the attached state -- assigned to a global forwarding rule the IP is free; the forwarding rule and the load balancer behind it bill on their own resources, outside this manifest
    - applies_when:
        - field_path: address_type
          op: equals
          value: INTERNAL
      text: whatever fills the private range bills elsewhere -- managed-service instances in a VPC_PEERING range and the services behind a PRIVATE_SERVICE_CONNECT endpoint are their own components
  notes:
    - applies_when:
        - field_path: address_type
          op: equals
          value: INTERNAL
      text: An INTERNAL global reservation (VPC peering range, PSC endpoint address) never bills, however wide the prefix -- this estimate is genuinely zero.
    - applies_when:
        - field_path: ip_version
          op: equals
          value: IPV6
      text: External IPv6 addresses are free -- Google's hourly IP charge is a scarcity price on IPv4 only. This estimate is genuinely zero.
    - text: Priced at the reserved-idle rate ($0.01/hr) because that is the only state the manifest itself commits to. A global address exists to front a global load balancer, and in that attached state Google charges nothing for it -- the estimate is the cost of NOT finishing the wiring.
