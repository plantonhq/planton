# Cost derivation: the machine-executable rules turning any
# AwsManagedPrometheusScraper manifest's spec values into metered
# quantities and price choices. The estimate generator replays the
# catalog presets through these rules to emit
# ../estimates/awsmanagedprometheusscraper.yaml; a server-side
# estimator evaluates the same rules against live manifests. Prices
# live in the provider's price book (../pricebook/). Grammar-reachable:
# one scraper is one collector billing every hour of the month, no
# arithmetic beyond hours_in_month. Schema:
# finops/catalogkindcostderivation/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostDerivation
metadata:
  name: awsmanagedprometheusscraper
spec:
  currency: USD
  hours_per_month: 730
  region:
    from_field: region
    assumption: us-east-1
  refusals:
    - when:
        - field_path: cloudwatch_dataset_arn
          op: is_set
      reason: delivering to a CloudWatch dataset moves the committed collector-hour meter to a different usage type (CloudWatch:CollectorHours -- same $0.04 rate in us-east-1, different SKU) that no committed preset exercises, so it is deliberately unpriced (the dead-price rule) rather than silently priced off the AMP meter's entry
  lines:
    - sku_meter: collector hours
      applies_when:
        - field_path: amp_workspace_arn
          op: is_set
      quantity:
        - hours_in_month: true
      price_slug: amp-collector-hours-us-east-1
      basis: one scraper is one agentless collector, billed per hour around the clock from provisioning to deletion -- there is no stop switch
  exclusions:
    - text: metric samples collected bill $0.03 per 10M (us-east-1) on top of collector hours -- volume follows scrape_interval and target count in the scrape configuration and the size of the scraped fleet
    - text: ingestion, storage, and query charges for the delivered metrics bill on the destination AMP workspace, not on this kind (the workspace's first 40M ingested samples per month are free, then tiered from $0.90 per 10M)
    - applies_when:
        - field_path: logging
          op: is_set
      text: scraper kind logs bill ingestion and storage on the referenced CloudWatch log group kind
  notes:
    - text: Creates run long (up to 30 minutes of collector provisioning) and deletes drain (up to 20) -- the meter follows the collector's existence, so the first and last partial hours are billed like any others.
