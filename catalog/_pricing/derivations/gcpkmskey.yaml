# Cost derivation: the machine-executable rules turning any GcpKmsKey
# manifest's spec values into metered quantities and price choices. The
# committed cost is the monthly fee of the key's active versions -- the
# STATED assumption is the single initial version the key is created
# with (rotation grows the count over time; the notes say so). The
# manifest's purpose and protection level select the rate; keys created
# empty (skip_initial_version_creation) honestly total zero. Per-call
# cryptographic operation charges are usage no manifest can know and
# ride the exclusions. The estimate generator replays the catalog
# presets through these rules to emit ../estimates/gcpkmskey.yaml.
# Schema: finops/catalogkindcostderivation/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostDerivation
metadata:
  name: gcpkmskey
spec:
  currency: USD
  hours_per_month: 730
  region:
    assumption: us-central1
  refusals:
    - when:
        - field_path: version_template.protection_level
          op: equals
          value: EXTERNAL
      reason: EXTERNAL key versions bill Google's external-key rate plus whatever the external key manager's own system charges -- the partner side of the bill is invisible to this manifest, so a committed number would be a guess.
    - when:
        - field_path: version_template.protection_level
          op: equals
          value: EXTERNAL_VPC
      reason: EXTERNAL_VPC key versions bill Google's external-key rate plus whatever the external key manager reached over the VPC charges -- the partner side of the bill is invisible to this manifest, so a committed number would be a guess.
  lines:
    - sku_meter: active key version months
      applies_when:
        - field_path: skip_initial_version_creation
          op: equals
          value: "false"
      quantity:
        - constant: "1"
      price_lookup:
        service_name: Cloud Key Management Service (KMS)
        pricing_unit: version-months
        attributes:
          - key: purpose
            from_field: purpose
            assumption_when_unset: ENCRYPT_DECRYPT
          - key: protection_level
            from_field: version_template.protection_level
            assumption_when_unset: SOFTWARE
      basis: "one active key version -- the STATED assumption is the single initial version the key is created with; an unset purpose is assumed ENCRYPT_DECRYPT and an unset protection level SOFTWARE, the documented GCP defaults. Cloud KMS version rates are location-independent, one list price across locations."
  exclusions:
    - text: cryptographic operations -- every encrypt, decrypt, sign, verify, or MAC call bills per 10,000 operations and follows request traffic no manifest can know
    - text: versions created or imported after provisioning -- each one is another active version billing monthly at the key's protection-level rate
  notes:
    - applies_when:
        - field_path: rotation_period
          op: is_set
      text: The estimate prices the single version present at creation. Automatic rotation mints a new active version every rotation period while old versions keep billing until destroyed -- the active-version count, and this line with it, grows by one per period unless old versions are destroyed. Rotation itself is a free administrative operation.
    - applies_when:
        - field_path: skip_initial_version_creation
          op: equals
          value: "true"
      text: "The key is created with no versions, so its committed cost at creation is honestly zero -- not free: every version later created or imported bills monthly at the key's protection-level rate from the moment it exists."
    - text: Version fees are prorated to actual active hours, and a version bills while ENABLED, DISABLED, or DESTROY_SCHEDULED -- only permanent destruction stops the meter. The key object itself is free and can never be deleted.
