# Cost derivation: the machine-executable rules turning any AwsBudget
# manifest's spec values into metered quantities and price choices. The
# estimate generator replays the catalog presets through these rules to
# emit ../estimates/awsbudget.yaml; a server-side estimator evaluates
# the same rules against live manifests. Prices live in the provider's
# price book (../pricebook/). Grammar-reachable: the only paid meter is
# the action-enabled flag, a presence check. Schema:
# finops/catalogkindcostderivation/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostDerivation
metadata:
  name: awsbudget
spec:
  currency: USD
  hours_per_month: 730
  region:
    from_field: region
    assumption: us-east-1
  lines:
    - sku_meter: action-enabled budget days
      applies_when:
        - field_path: actions
          op: is_set
      quantity:
        - constant: "30.42"
      price_slug: budgets-action-enabled-budget-days-global
      basis: a budget with any action attached bills per budget-day it exists, however many actions it carries -- 730 hours / 24 = 30.42 budget-days a month, priced at the full marginal rate past the account's free allowance
  exclusions:
    - text: AWS Budgets Reports bill $0.01 per delivered report -- a console feature outside this spec
    - text: SNS topics subscribed to notifications bill on their own kinds; email subscribers are free
    - applies_when:
        - field_path: actions
          op: is_set
      text: what a fired action DOES (denying IAM groups, attaching SCPs, stopping instances via SSM) changes other kinds' bills, not this one's
  notes:
    - text: "The AWSBudgets offer prices the account's first 62 action-enabled budget-days each month at $0.00 -- two action-enabled budgets running a full month are free. Whether THIS budget falls inside that account-level allowance no single manifest can see, so the estimate prices the full $0.10 rate and states the allowance (the adjudicated treatment, same as the CloudWatch dashboard and alarm allowances)."
    - text: A notifications-only budget (the 01 preset) is genuinely free -- the offer's plain Budget-days meter prices $0.00 flat at any budget count.
    - text: Budgets is account-global; the offer publishes one global rate (location "Any"), so the region assumption only anchors the book lookup.
