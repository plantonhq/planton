# Cost derivation: the machine-executable rules turning any
# AwsBedrockCustomModel manifest's spec values into metered quantities
# and price choices. The estimate generator replays the catalog presets
# through these rules to emit ../estimates/awsbedrockcustommodel.yaml;
# a server-side estimator evaluates the same rules against live
# manifests. Prices live in the provider's price book (../pricebook/).
# Grammar-reachable: the committed meter is one stored custom model per
# manifest at a rate uniform across every customizable family on the
# us-east-1 offer, so a constant-quantity line with one price serves
# every base_model_arn. The one-time training charge is data-sized
# (tokens live in S3) -- excluded with rates stated, never guessed.
# Schema: finops/catalogkindcostderivation/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostDerivation
metadata:
  name: awsbedrockcustommodel
spec:
  currency: USD
  hours_per_month: 730
  region:
    from_field: region
    assumption: us-east-1
  lines:
    - sku_meter: custom model storage months
      quantity:
        - constant: "1"
      price_slug: bedrock-custom-model-storage-months-us-east-1
      basis: the completed customization job leaves one stored custom model billing $1.95 a month until deleted -- the rate is identical across all eleven Customization-Storage SKUs on the us-east-1 offer (Titan text/image/embeddings, Nova families), so one price serves every eligible base_model_arn
  exclusions:
    - text: the ONE-TIME training charge is tokens-processed x epochCount x the base model's per-1K-token rate ($0.0004 Titan Text Lite, $0.008 Titan Text Express in us-east-1) -- the dataset's token count lives in training_data_s3_uri's object, invisible to this manifest
    - text: serving the custom model bills elsewhere -- Provisioned Throughput (hourly per model unit, its own kind) or on-demand custom-model deployment where supported
    - text: the training, validation, and output S3 locations bill storage and requests on their own bucket kinds
    - applies_when:
        - field_path: custom_model_kms_key_arn
          op: is_set
      text: the customer-managed model-encryption key bills its monthly fee and per-request charges on the referenced AwsKmsKey kind
    - applies_when:
        - field_path: vpc_config
          op: is_set
      text: VPC-mode jobs reach S3 through the VPC's own plumbing -- any interface/gateway endpoints or NAT the route needs bill on those kinds
  notes:
    - text: The storage meter starts when the asynchronous job COMPLETES (minutes to many hours after apply), not at apply time -- the estimate treats the model as existing for the full month, the steady-state posture.
    - text: Every spec field is create-time-immutable -- any change re-runs the customization job (a fresh one-time training bill) and replaces the stored model; the monthly commitment stays one model either way.
