# Cost derivation: the machine-executable rules turning any
# DigitalOceanKubernetesNodePool manifest's spec values into metered
# quantities and price choices. A pool is a set of DOKS worker droplets
# billed at droplet rates -- the committed quantity is node_count with
# autoscaling off, or the FLOOR (min_nodes) with autoscaling on (nodes
# above the floor follow demand and ride the exclusions). The size slug
# picks the rate through a value-keyed lookup; sizes the price book does
# not carry refuse through the lookup itself -- zero matches is a refusal,
# never a pick. The spec carries no region field, and DigitalOcean prices
# DOKS identically in every region (entries pinned "global"), so the
# stated region assumption is cosmetic. The estimate generator replays the
# catalog presets through these rules to emit
# ../estimates/digitaloceankubernetesnodepool.yaml.
# Schema: finops/catalogkindcostderivation/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostDerivation
metadata:
  name: digitaloceankubernetesnodepool
spec:
  currency: USD
  hours_per_month: 730
  region:
    assumption: nyc3
  lines:
    - sku_meter: worker nodes
      applies_when:
        - field_path: auto_scale
          op: equals
          value: "false"
      quantity:
        - field_value:
            field_path: node_count
      price_lookup:
        service_name: Kubernetes
        pricing_unit: months
        attributes:
          - key: size_slug
            from_field: size
      basis: "a fixed pool of node_count worker droplets, each billing the size slug's flat monthly droplet rate from creation"
    - sku_meter: worker nodes
      applies_when:
        - field_path: auto_scale
          op: equals
          value: "true"
      quantity:
        - field_value:
            field_path: min_nodes
      price_lookup:
        service_name: Kubernetes
        pricing_unit: months
        attributes:
          - key: size_slug
            from_field: size
      basis: "the autoscaling FLOOR -- min_nodes worker droplets run and bill even at zero load; the ceiling is named in the exclusions, and node_count is only the initial count"
  exclusions:
    - applies_when:
        - field_path: auto_scale
          op: equals
          value: "true"
      text: "the cluster autoscaler grows the pool above the min_nodes floor up to max_nodes with workload demand -- each extra node bills the same monthly rate while it exists"
    - text: "outbound data transfer past the account's pooled free allowance (starting at 2,000 GiB per Basic node per month) bills 0.01 USD/GiB; inbound and node-to-node transfer are free"
    - text: "the owning cluster's control plane, default pool, and workload-created volumes and load balancers bill on their own kinds"
  notes:
    - text: "Worker nodes bill at DigitalOcean's droplet rates -- the DOKS pricing page charges only the underlying droplets; labels, taints, and tags are free metadata."
    - text: "Priced at DigitalOcean's global rates -- the DOKS and droplet pricing pages carry no region dimension, and the pool inherits its cluster's region."
