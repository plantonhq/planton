# Cost derivation: the machine-executable rules turning any
# AwsSecretsManagerSecret manifest's spec values into metered quantities
# and price choices. The estimate generator replays the catalog presets
# through these rules to emit ../estimates/awssecretsmanagersecret.yaml;
# a server-side estimator evaluates the same rules against live
# manifests. Prices live in the provider's price book (../pricebook/).
# Schema: finops/catalogkindcostderivation/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostDerivation
metadata:
  name: awssecretsmanagersecret
spec:
  currency: USD
  hours_per_month: 730
  region:
    from_field: region
    assumption: us-east-1
  lines:
    - sku_meter: secrets
      quantity:
        - constant: "1"
      price_slug: secretsmanager-secret-us-east-1
      basis: one secret, billed the flat per-secret monthly fee from creation (AWS prorates it hourly; a value-less shell secret bills the same); priced at the us-east-1 rate -- assumed when the manifest leaves region as a placeholder
    - sku_meter: secrets
      applies_when:
        - field_path: replica_regions
          op: is_set
      quantity:
        - count_of: replica_regions
      price_slug: secretsmanager-secret-us-east-1
      basis: each replica region holds a full billed secret on the same secrets meter; replicas bill at their own region's per-secret rate, priced here at the us-east-1 rate as the stated assumption
  exclusions:
    - text: API calls bill per 10,000 -- every GetSecretValue read counts, so read frequency (connection-pool refreshes, deploy-time resolution) is the lever
    - applies_when:
        - field_path: rotation
          op: is_set
      text: the rotation Lambda's invocations and runtime bill on its own AwsLambda component, and each rotation run spends Secrets Manager API calls on the createSecret/setSecret/testSecret/finishSecret steps
    - applies_when:
        - field_path: kms_key_id
          op: is_set
      text: the customer-managed KMS key bills its monthly fee and request charges on its own AwsKmsKey component -- the AWS-managed aws/secretsmanager default carries no monthly fee
    - applies_when:
        - field_path: replica_regions
          op: is_set
      text: customer-managed keys referenced per replica bill on their own AwsKmsKey components in their regions
  notes:
    - applies_when:
        - field_path: rotation
          op: is_set
      text: Rotation creates new versions of the secret; versions carry no charge of their own -- AWS's published pricing example states this explicitly.
    - applies_when:
        - field_path: replica_regions
          op: is_set
      text: Per-secret rates can differ by region; the replica lines price every region at the us-east-1 rate as stated in their basis.
