# Cost derivation: the machine-executable rules turning any
# AzureApplicationGateway manifest's spec values into metered quantities
# and price choices -- the v2 fixed gateway-hour meter keyed by SKU, and
# the capacity-unit reservation (10 units per instance of fixed capacity
# or autoscale minimum, billed regardless of load, per Microsoft's own
# pricing guidance). Autoscaling with a zero floor is a refusal: with no
# reserved capacity, every billed capacity unit follows traffic. The
# estimate generator replays the catalog presets through these rules to
# emit ../estimates/azureapplicationgateway.yaml; a server-side estimator
# evaluates the same rules against live manifests.
# Schema: finops/catalogkindcostderivation/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostDerivation
metadata:
  name: azureapplicationgateway
spec:
  currency: USD
  hours_per_month: 730
  region:
    from_field: region
    assumption: eastus
  refusals:
    - when:
        - field_path: sku
          op: equals
          value: BASIC
      reason: the Basic v2 SKU's fixed and capacity-unit meters are not in the price book -- no committed preset deploys the dev/test tier, and a book entry nothing consumes would go stale unverified
    - when:
        - field_path: autoscale
          op: is_set
        - field_path: autoscale.min_capacity
          op: is_unset
      reason: an autoscale floor of zero reserves no capacity units -- every billed capacity unit follows traffic, so a committed figure showing only the fixed meter would present a fraction of any real gateway's bill as its price
  lines:
    - sku_meter: fixed gateway hours
      quantity:
        - hours_in_month: true
      price_lookup:
        service_name: Application Gateway
        pricing_unit: hours
        attributes:
          - key: sku
            from_field: sku
      basis: the v2 fixed meter bills every provisioned hour at the SKU's rate (x 730) -- the same per hour regardless of instance count, even at an autoscale floor of zero
    - sku_meter: capacity units
      applies_when:
        - field_path: capacity
          op: is_set
      quantity:
        - field_value:
            field_path: capacity
        - constant: "10"
        - hours_in_month: true
      price_lookup:
        service_name: Application Gateway
        pricing_unit: capacity-unit-hours
        attributes:
          - key: sku
            from_field: sku
      basis: each manually scaled instance reserves 10 capacity units billed every hour the gateway is active, load or no load -- capacity x 10 x 730 at the SKU's capacity-unit rate
    - sku_meter: capacity units
      applies_when:
        - field_path: autoscale
          op: is_set
        - field_path: autoscale.min_capacity
          op: is_set
      quantity:
        - field_value:
            field_path: autoscale.min_capacity
        - constant: "10"
        - hours_in_month: true
      price_lookup:
        service_name: Application Gateway
        pricing_unit: capacity-unit-hours
        attributes:
          - key: sku
            from_field: sku
      basis: the autoscale minimum is a billing floor -- min_capacity instances reserve 10 capacity units each, billed whether or not traffic arrives; min_capacity x 10 x 730 at the SKU's capacity-unit rate
  exclusions:
    - applies_when:
        - field_path: autoscale
          op: is_set
      text: capacity units consumed above the reserved floor bill on the same meter as traffic demands and cannot be known from the manifest
    - applies_when:
        - field_path: capacity
          op: is_set
      text: traffic pushing an instance past its 10 reserved capacity units bills additional units on the same meter
    - text: outbound data transfer bills per GB at Azure's bandwidth rates
    - text: the referenced Standard public IPs bill hourly on their own components
    - text: Key Vault-sourced certificates bill on the referenced vault's component
  notes:
    - applies_when:
        - field_path: sku
          op: equals
          value: WAF_V2
      text: WAF enforcement is priced into the gateway's own meters -- the WAF_V2 fixed and capacity-unit rates are the premium; the referenced WAF policy document adds no meter of its own.
    - text: A virtual network protected by DDoS Network Protection moves a WAF_V2 gateway onto Microsoft's discounted meters at Standard_V2-equal rates -- a rate change invisible in this manifest.
