# Cost derivation: the machine-executable rules turning any
# GcpSecretManagerSecret manifest's spec values into metered quantities
# and price choices. The committed cost is version storage: the seeded
# initial version billing monthly per replication location -- one
# location for automatic replication and regional secrets, one per
# replica for user-managed replication (count_of counts them). A
# manifest without initial_version creates a free empty container and
# honestly totals zero. Access operations and rotation notifications are
# usage the exclusions name. The estimate generator replays the catalog
# presets through these rules to emit
# ../estimates/gcpsecretmanagersecret.yaml.
# Schema: finops/catalogkindcostderivation/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostDerivation
metadata:
  name: gcpsecretmanagersecret
spec:
  currency: USD
  hours_per_month: 730
  region:
    from_field: region
    assumption: us-central1
  lines:
    - sku_meter: active secret version storage
      applies_when:
        - field_path: initial_version
          op: is_set
        - field_path: replication.user_managed
          op: is_unset
      quantity:
        - constant: "1"
      price_slug: secret-manager-active-version-location-month
      basis: "one active version (the seeded initial version, billing whether ENABLED or DISABLED) x one billed location -- an automatic replication policy bills as a single location, and a regional secret has exactly one location by definition. The per-version-location rate is identical across Secret Manager locations."
    - sku_meter: active secret version storage
      applies_when:
        - field_path: initial_version
          op: is_set
        - field_path: replication.user_managed
          op: is_set
      quantity:
        - constant: "1"
        - count_of: replication.user_managed.replicas
      price_slug: secret-manager-active-version-location-month
      basis: "one active version (the seeded initial version) x one billed location per user-managed replica -- every replica region holds and bills a full copy of each version. The per-version-location rate is identical across Secret Manager locations."
  exclusions:
    - text: access operations -- payload reads bill per 10,000 calls beyond the billing account's 10,000 free per month and follow workload traffic no manifest can know
    - text: versions added after provisioning -- rotation pipelines and manual adds each start another version-location meter
    - applies_when:
        - field_path: rotation
          op: is_set
      text: rotation reminder notifications -- each SECRET_ROTATE message published to the configured topics bills $0.05 beyond the billing account's 3 free per month; the count follows the configured cadence
  notes:
    - applies_when:
        - field_path: initial_version
          op: is_unset
      text: "No initial version is seeded, so the committed cost at creation is honestly zero -- not free: every version later added bills monthly per replication location from the moment it exists."
    - text: The first 6 active secret versions per month are free, aggregated across projects by billing account -- the list total is shown without that allowance. Storage is prorated to actual active hours, and only DESTROYED versions stop billing; version_destroy_ttl keeps destroyed versions DISABLED (still billing) for its window.
