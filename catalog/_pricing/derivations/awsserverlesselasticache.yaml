# Cost derivation: the machine-executable rules turning any
# AwsServerlessElasticache manifest's spec values into metered quantities
# and price choices. The committed floor is storage: every serverless
# cache meters at least 1 GB (Redis/Memcached) or 100 MB (Valkey) of data
# storage every hour, and a configured data_storage_min_gb raises that
# guaranteed-and-billed floor. A configured ecpu_min adds a compute floor
# that bills around the clock; without one, ECPUs meter only per request
# and the committed compute cost is honestly zero. The engine selects
# every rate through the price book's attribute identities. The estimate
# generator replays the catalog presets through these rules to emit
# ../estimates/awsserverlesselasticache.yaml.
# Schema: finops/catalogkindcostderivation/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostDerivation
metadata:
  name: awsserverlesselasticache
spec:
  currency: USD
  hours_per_month: 730
  region:
    from_field: region
    assumption: us-east-1
  lines:
    - sku_meter: cached data storage
      applies_when:
        - field_path: data_storage_min_gb
          op: not_equals
          value: "0"
      quantity:
        - field_value:
            field_path: data_storage_min_gb
        - hours_in_month: true
      price_lookup:
        service_name: Amazon ElastiCache
        pricing_unit: GB-hours
        attributes:
          - key: engine
            from_field: engine
      basis: the configured data_storage_min_gb is guaranteed capacity AWS bills every hour even when the data stored is below it -- minimum GB x 730 hours at the engine's storage rate
    - sku_meter: cached data storage
      applies_when:
        - field_path: data_storage_min_gb
          op: equals
          value: "0"
        - field_path: engine
          op: equals
          value: redis
      quantity:
        - constant: "1"
        - hours_in_month: true
      price_lookup:
        service_name: Amazon ElastiCache
        pricing_unit: GB-hours
        attributes:
          - key: engine
            from_field: engine
      basis: with no configured minimum, every Redis serverless cache is metered for at least 1 GB of data stored -- 1 GB x 730 hours at the Redis storage rate
    - sku_meter: cached data storage
      applies_when:
        - field_path: data_storage_min_gb
          op: equals
          value: "0"
        - field_path: engine
          op: equals
          value: memcached
      quantity:
        - constant: "1"
        - hours_in_month: true
      price_lookup:
        service_name: Amazon ElastiCache
        pricing_unit: GB-hours
        attributes:
          - key: engine
            from_field: engine
      basis: with no configured minimum, every Memcached serverless cache is metered for at least 1 GB of data stored -- 1 GB x 730 hours at the Memcached storage rate
    - sku_meter: cached data storage
      applies_when:
        - field_path: data_storage_min_gb
          op: equals
          value: "0"
        - field_path: engine
          op: equals
          value: valkey
      quantity:
        - constant: "0.1"
        - hours_in_month: true
      price_lookup:
        service_name: Amazon ElastiCache
        pricing_unit: GB-hours
        attributes:
          - key: engine
            from_field: engine
      basis: with no configured minimum, a Valkey serverless cache is metered for at least 100 MB of data stored -- 0.1 GB x 730 hours at the Valkey storage rate
    - sku_meter: ECPU consumption
      quantity:
        - field_value:
            field_path: ecpu_min
        - constant: "3600"
        - hours_in_month: true
      price_lookup:
        service_name: Amazon ElastiCache
        pricing_unit: ECPUs
        attributes:
          - key: engine
            from_field: engine
      basis: a configured ecpu_min bills around the clock even with zero requests -- minimum ECPUs/second x 3600 seconds x 730 hours at the engine's per-ECPU rate; zero (no configured minimum) commits nothing
  exclusions:
    - applies_when:
        - field_path: ecpu_min
          op: equals
          value: "0"
      text: ECPU consumption is entirely request-driven -- reads and writes meter roughly 1 ECPU per KB transferred (more for vCPU-heavy commands), and an idle cache pays none
    - applies_when:
        - field_path: ecpu_min
          op: not_equals
          value: "0"
      text: ECPU consumption above the committed ecpu_min floor is request-driven and bills at the same per-ECPU rate
    - text: data stored above the estimated floor grows with the working set and bills per GB-hour
    - applies_when:
        - field_path: snapshot_retention_limit
          op: not_equals
          value: "0"
      text: daily snapshot backup storage bills per GB-month across the retention window and depends on data size
    - text: cross-AZ data transfer applies only when clients sit in AZs other than the cache's VPC endpoints
  notes:
    - applies_when:
        - field_path: data_storage_min_gb
          op: equals
          value: "0"
      text: Estimated at the engine's minimum metered storage -- the floor an idle cache bills with no configured limits.
    - applies_when:
        - field_path: data_storage_min_gb
          op: not_equals
          value: "0"
      text: Estimated at the configured storage minimum -- guaranteed capacity that bills whether or not data fills it.
    - applies_when:
        - field_path: ecpu_min
          op: not_equals
          value: "0"
      text: The pre-scaled ECPU floor bills even when no requests arrive; lower ecpu_min to zero to return compute to pure pay-per-request.
