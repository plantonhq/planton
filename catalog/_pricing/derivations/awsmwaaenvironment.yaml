# Cost derivation: the machine-executable rules turning any
# AwsMwaaEnvironment manifest's spec values into metered quantities and
# price choices. The committed cost is the environment fee (the class
# rate, every hour) plus the scaling floors: the environment fee already
# includes one worker, two schedulers, and two web servers, so only the
# instances a manifest holds BEYOND those bill as additional-instance
# hours. The derivation schema expresses quantities as products (no
# subtraction), so the "beyond the included" counts are enumerated as
# sibling rules over the spec's validated ranges -- min_workers 2..25
# (AWS's default worker quota), schedulers 3..5, min_webservers 3..5.
# All rates are selected by environment_class through the price book's
# attribute identities. The estimate generator replays the catalog
# presets through these rules to emit ../estimates/awsmwaaenvironment.yaml.
# Schema: finops/catalogkindcostderivation/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostDerivation
metadata:
  name: awsmwaaenvironment
spec:
  currency: USD
  hours_per_month: 730
  region:
    from_field: region
    assumption: us-east-1
  lines:
    - sku_meter: environment instance hours
      quantity:
        - hours_in_month: true
      price_lookup:
        service_name: Amazon Managed Workflows for Apache Airflow
        pricing_unit: hours
        attributes:
          - key: kind
            constant: environment
          - key: environment_class
            from_field: environment_class
            assumption_when_unset: mw1.small
      basis: one environment billed at its class rate every hour of the month -- the fee includes one worker, two schedulers, and two web servers; AWS defaults the class to mw1.small when the manifest does not state it
    - sku_meter: additional worker instance hours
      applies_when:
        - field_path: min_workers
          op: equals
          value: "2"
      quantity:
        - constant: "1"
        - hours_in_month: true
      price_lookup:
        service_name: Amazon Managed Workflows for Apache Airflow
        pricing_unit: hours
        attributes:
          - key: kind
            constant: worker
          - key: environment_class
            from_field: environment_class
            assumption_when_unset: mw1.small
      basis: min_workers holds 2 always-on workers; the environment fee includes one, so 1 additional worker bills every hour of the month at the class rate (class assumed mw1.small when unset)
