# Capacity derivation: the machine-executable rules turning any
# KubernetesArgoWorkflows manifest's spec values into the capacity
# footprint it reserves from its target cluster. The estimate generator
# replays the catalog presets through these rules to emit
# ../estimates/kubernetesargoworkflows.yaml; a server-side estimator can
# evaluate the same rules against live manifests. Two fixed workload
# classes: the workflow controller (extra replicas are HOT STANDBYS
# behind leader election, each reserving the full resources) and the
# Argo server (UI + REST API, on by chart default). The chart ships NO
# default requests or limits for either (the spec contract states
# "Empty = no requests/limits, the chart default"), so unsized
# kinds contribute zero honestly. The workflow pods themselves are
# ephemeral per-run workloads this footprint can never see -- the first
# loud exclusion. Schema: finops/catalogkindcapacityderivation/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCapacityDerivation
metadata:
  name: kubernetesargoworkflows
spec:
  workloads:
    - label: workflow controller
      resources_path: controller.resources
      instances:
        field_value:
          field_path: controller.replicas
          default_when_unset: "1"
    - label: server
      resources_path: server.resources
      instances:
        field_value:
          field_path: server.replicas
          default_when_unset: "1"
  exclusions:
    - text: the workflow pods are the real capacity story -- every Workflow step runs as its own pod, sized by the workflow's declarations plus the argoexec executor, created at run time and gone at completion; no manifest-time statement can see them
    - text: the dollar value of this capacity is the target cluster's node and storage-class economics
    - text: kinds with no declared resources carry the chart defaults, and this chart ships NO default requests or limits for the controller or server -- unsized pods schedule unbounded and reserve nothing, so a zero line is the literal truth, not a free kind
    - text: "helm_values merges LAST over the typed rendering and can override modeled values, including resources, replicas, and the executor's sizing -- this footprint describes the spec's declaration"
    - applies_when:
        - field_path: server.enabled
          op: is_set
        - field_path: server.enabled
          op: equals
          value: "false"
      text: the server is disabled -- this is a controller-only install (workflows submitted purely as CRs) and no server pod runs
    - applies_when:
        - field_path: artifact_repository
          op: is_set
      text: artifact and archived-log bytes grow with pipeline activity on the declared object store -- on a composed KubernetesSeaweedFs that capacity rides the SeaweedFS kind's own footprint; on a cloud bucket it is that provider's storage bill
    - applies_when:
        - field_path: archive
          op: is_set
      text: the workflow archive writes history to the declared relational database -- its capacity rides the composed KubernetesPostgres/KubernetesMysql resource (or the external database), never this footprint
  notes:
    - text: controller replicas beyond 1 are hot standbys behind leader election -- they take over on failure, they do not share the reconcile workload, and each reserves the full controller resources
    - applies_when:
        - field_path: retention_policy
          op: is_unset
      text: no retention policy is declared -- completed Workflow CRs (and their pods' records) accumulate in the cluster until TTLs or humans clean up; declare retention_policy (and archive for history) on production clusters
