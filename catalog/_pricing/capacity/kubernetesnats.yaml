# Capacity derivation: the machine-executable rules turning any
# KubernetesNats manifest's spec values into the capacity footprint it
# reserves from its target cluster. The estimate generator replays the
# catalog presets through these rules to emit
# ../estimates/kubernetesnats.yaml; a server-side estimator can evaluate
# the same rules against live manifests. Every server in the cluster (a
# single server when cluster is empty) carries the declared resources,
# and JetStream -- on by default for this kind -- provisions one
# file-store volume per server. Schema:
# finops/catalogkindcapacityderivation/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCapacityDerivation
metadata:
  name: kubernetesnats
spec:
  workloads:
    - label: server
      resources_path: resources
      instances:
        field_value:
          field_path: cluster.replicas
          default_when_unset: "1"
      volumes:
        # The volume exists exactly when JetStream is on: the enabled
        # flag defaults to true, so the two disjoint bindings below
        # cover "block present, flag unset" and "flag explicitly true"
        # -- an explicitly disabled JetStream binds nothing, whatever
        # disk_size says.
        - label: JetStream file store
          size_path: jet_stream.disk_size
          applies_when:
            - field_path: jet_stream
              op: is_set
            - field_path: jet_stream.enabled
              op: is_unset
        - label: JetStream file store
          size_path: jet_stream.disk_size
          applies_when:
            - field_path: jet_stream.enabled
              op: is_set
            - field_path: jet_stream.enabled
              op: equals
              value: "true"
  exclusions:
    - text: the dollar value of this capacity is the target cluster's node and storage-class economics
    - applies_when:
        - field_path: helm_values
          op: is_set
      text: the helm_values overlay merges last over the typed rendering and can override modeled values, including resources and replica counts
    - applies_when:
        - field_path: metrics
          op: is_set
      text: the prometheus-nats-exporter sidecar consumes CPU and memory this manifest declares no reservation for
  notes:
    - text: the config-reloader sidecar in every server pod and the nats-box utility pod (deployed unless nats_box_enabled is false) carry chart-default reservations this manifest does not declare
    - applies_when:
        - field_path: jet_stream
          op: is_unset
      text: JetStream is on by default for this kind -- with no jet_stream block, every server still provisions the chart-default 10Gi file-store volume, a reservation this footprint cannot count
    - applies_when:
        - field_path: jet_stream
          op: is_set
        - field_path: jet_stream.disk_size
          op: is_unset
      text: when JetStream is on and disk_size is omitted, the file store is stated at its 10Gi spec-declared default size; explicitly disabled JetStream binds no volume at all
    - applies_when:
        - field_path: cluster
          op: is_set
        - field_path: cluster.replicas
          op: is_unset
      text: the chart defaults to 3 servers when clustering is enabled without a declared replica count; this footprint counts only the declared count
