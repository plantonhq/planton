# Capacity derivation: the machine-executable rules turning any
# KubernetesExternalSecretsOperator manifest's spec values into the
# capacity footprint it reserves from its target cluster. The operator
# runs three fixed pod classes -- the controller, the admission webhook,
# and the cert-controller -- each with its own replica count and
# resources block; the footprint sums all three. The stores it connects
# and the secrets it syncs are separate resources carrying their own
# capacity. Schema: finops/catalogkindcapacityderivation/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCapacityDerivation
metadata:
  name: kubernetesexternalsecretsoperator
spec:
  workloads:
    - label: controller replica
      resources_path: resources
      instances:
        field_value:
          field_path: replicas
          default_when_unset: "1"
    - label: webhook replica
      resources_path: webhook.resources
      instances:
        field_value:
          field_path: webhook.replicas
          default_when_unset: "1"
    - label: cert-controller replica
      resources_path: cert_controller.resources
      instances:
        field_value:
          field_path: cert_controller.replicas
          default_when_unset: "1"
  exclusions:
    - text: the dollar value of this capacity is the target cluster's node economics
    - applies_when:
        - field_path: helm_values
          op: is_set
      text: "the helm_values overlay merges LAST over the typed rendering and can override modeled values, including resources and replica counts -- this footprint states the spec's declaration"
  notes:
    - applies_when:
        - field_path: resources
          op: is_unset
      text: "the controller declares no resource requests or limits (the chart default) -- its pods schedule unbounded and the cluster reserves nothing for them"
    - applies_when:
        - field_path: webhook.enabled
          op: is_set
        - field_path: webhook.enabled
          op: equals
          value: "false"
      text: "the webhook is disabled -- no webhook pods run, so any webhook term in this footprint overstates by that amount"
    - applies_when:
        - field_path: cert_controller.enabled
          op: is_set
        - field_path: cert_controller.enabled
          op: equals
          value: "false"
      text: "the cert-controller is disabled -- no cert-controller pods run, so any cert-controller term in this footprint overstates by that amount"
