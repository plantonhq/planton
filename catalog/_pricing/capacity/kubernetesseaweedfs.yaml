# Capacity derivation: the machine-executable rules turning any
# KubernetesSeaweedFs manifest's spec values into the capacity footprint
# it reserves from its target cluster. The estimate generator replays the
# catalog presets through these rules to emit
# ../estimates/kubernetesseaweedfs.yaml; a server-side estimator can
# evaluate the same rules against live manifests. SeaweedFS scales four
# pod classes independently -- masters, volume servers, filers, and the
# optional dedicated S3 gateway -- each bound to its own replicas and
# resources; master, volume, and filer instances additionally carry a
# per-pod data PVC. The admin console binds as a fifth singleton class.
# Schema: finops/catalogkindcapacityderivation/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCapacityDerivation
metadata:
  name: kubernetesseaweedfs
spec:
  workloads:
    - label: master
      resources_path: master.resources
      instances:
        field_value:
          field_path: master.replicas
          default_when_unset: "1"
      volumes:
        - label: metadata
          size_path: master.data_volume.size
    - label: volume server
      resources_path: volume.resources
      instances:
        field_value:
          field_path: volume.replicas
          default_when_unset: "1"
      volumes:
        - label: data
          size_path: volume.data_volume.size
    - label: filer
      resources_path: filer.resources
      instances:
        field_value:
          field_path: filer.replicas
          default_when_unset: "1"
      volumes:
        - label: metadata
          size_path: filer.data_volume.size
    - label: S3 gateway
      resources_path: s3.dedicated.resources
      instances:
        field_value:
          field_path: s3.dedicated.replicas
          default_when_unset: "1"
    - label: admin console
      resources_path: admin.resources
      instances:
        constant: "1"
      volumes:
        - label: state
          size_path: admin.data_volume.size
  exclusions:
    - text: the dollar value of this capacity is the target cluster's node and storage-class economics
    - text: volume sizes left undeclared fall back to tier defaults this footprint cannot count -- master 5Gi, volume server 30Gi, filer 10Gi per pod
    - applies_when:
        - field_path: replication
          op: is_set
      text: the replication placement code multiplies stored BYTES inside the declared volume PVCs -- "001" writes every object twice, halving effective capacity for the same reservation
    - text: the bucket-creation post-install hook Job is ephemeral and carries only chart-default sizing
    - applies_when:
        - field_path: helm_values
          op: is_set
      text: the helm_values overlay merges last and can override any modeled value, including resources, replica counts, and volume sizes -- this footprint states the typed spec's declaration
    - text: how fast the volume PVCs fill is workload-driven (bucket TTLs and versioning change object churn) -- the footprint states reservations, never occupancy
  notes:
    - text: the S3 gateway binding contributes only when s3.dedicated is declared -- the default embedded gateway rides the filer pods with no extra reservation
    - text: the admin-console binding contributes only when admin resources or a data volume are declared alongside admin.enabled -- the console is off by default
