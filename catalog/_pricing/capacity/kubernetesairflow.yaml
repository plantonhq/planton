# Capacity derivation: the machine-executable rules turning any
# KubernetesAirflow manifest's spec values into the capacity footprint it
# reserves from its target cluster. The estimate generator replays the
# catalog presets through these rules to emit
# ../estimates/kubernetesairflow.yaml; a server-side estimator can
# evaluate the same rules against live manifests. Airflow is a
# multi-workload chart: each fixed kind class the spec sizes (API
# server, scheduler, DAG processor, triggerer, Celery workers, the
# bundled Redis broker, PgBouncer) binds its own replicas and resources;
# the shared DAG and log volumes are single cluster-wide reservations.
# Anything only the chart sizes (statsd-exporter, migration and
# bootstrap Jobs, git-sync sidecars) is excluded loudly below.
# Schema: finops/catalogkindcapacityderivation/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCapacityDerivation
metadata:
  name: kubernetesairflow
spec:
  workloads:
    - label: API server
      resources_path: kinds.api_server.resources
      instances:
        field_value:
          field_path: kinds.api_server.replicas
          default_when_unset: "1"
    - label: scheduler
      resources_path: kinds.scheduler.resources
      instances:
        field_value:
          field_path: kinds.scheduler.replicas
          default_when_unset: "1"
    - label: DAG processor
      resources_path: kinds.dag_processor.resources
      instances:
        field_value:
          field_path: kinds.dag_processor.replicas
          default_when_unset: "1"
    - label: triggerer
      resources_path: kinds.triggerer.resources
      instances:
        field_value:
          field_path: kinds.triggerer.replicas
          default_when_unset: "1"
      volumes:
        - label: local-state
          size_path: kinds.triggerer.persistence_size
    - label: worker
      resources_path: kinds.workers.resources
      instances:
        field_value:
          field_path: kinds.workers.replicas
          default_when_unset: "1"
      volumes:
        - label: task-log
          size_path: kinds.workers.persistence_size
    - label: Redis broker
      resources_path: broker.bundled_redis.resources
      instances:
        constant: "1"
      volumes:
        - label: data
          size_path: broker.bundled_redis.persistence_size
    - label: PgBouncer pooler
      resources_path: pgbouncer.resources
      instances:
        constant: "1"
    - label: shared DAG store
      instances:
        constant: "1"
      volumes:
        - label: DAG
          size_path: dags.persistence.size
    - label: shared log store
      instances:
        constant: "1"
      volumes:
        - label: logs
          size_path: logging.persistence.size
  exclusions:
    - text: the dollar value of this capacity is the target cluster's node and storage-class economics
    - applies_when:
        - field_path: broker
          op: is_unset
      text: without a Celery broker every task runs as its own ephemeral pod (the KubernetesExecutor path) -- per-task reservations exist only while tasks run and no standing worker fleet is counted
    - applies_when:
        - field_path: kinds.workers.keda
          op: is_set
      text: when KEDA autoscaling is enabled it owns the Celery worker replica count at runtime between its declared bounds -- the footprint states the declared replicas
    - applies_when:
        - field_path: dags.git_sync
          op: is_set
      text: the git-sync sidecar rides every Airflow component -- its declared resources are per-sidecar and are not multiplied into this footprint
    - text: a triggerer or worker kind block declared without its persistence size is stated at the 100Gi spec-declared default; with no kind block at all the chart still provisions the volume, a reservation this footprint cannot count
    - applies_when:
        - field_path: helm_values
          op: is_set
      text: the helm_values overlay merges last and can override any modeled value, including resources and replica counts -- this footprint states the typed spec's declaration
    - text: the statsd-exporter and the migration and admin-bootstrap Jobs carry only chart-default sizing; the metadata database and any composed Valkey broker are separate kinds with their own footprints
