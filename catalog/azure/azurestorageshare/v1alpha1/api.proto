syntax = "proto3";

package dev.planton.azure.azurestorageshare.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurestorageshare/v1alpha1/outputs.proto";
import "catalog/azure/azurestorageshare/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureStorageShare is the top-level API resource for an Azure Files
// share -- the SMB/NFS file system unit of Azure storage, living inside
// an AzureStorageAccount (referenced via storage_account_id). Workloads
// mount shares for shared POSIX-style state; quota, tier, protocol, and
// stored access policies are set per share.
message AzureStorageShare {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureStorageShare'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureStorageShareSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureStorageShareStatus status = 5;
}

// AzureStorageShareStatus holds the deployment status and outputs.
message AzureStorageShareStatus {
  // outputs
  AzureStorageShareOutputs outputs = 1;
}
