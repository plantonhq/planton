# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azurestorageshare
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Everything written to the share is encrypted by Azure Storage service-side encryption (256-bit AES) automatically -- SSE is always on for every storage account and cannot be disabled."
      notes: "The key posture (Microsoft-managed vs customer-managed) is the ACCOUNT's configuration -- the share inherits whatever the referenced account enforces."
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: "Customer-managed keys are configured on the storage account (its encryption block and key vault wiring), never per share -- the lever lives on the AzureStorageAccount kind."
    - control_id: enc-in-transit
      status: not_applicable
      notes: "Transport posture is the account's: 'secure transfer required' forces HTTPS/SMB 3.x-with-encryption account-wide, and the share adds no knob. Worth knowing when choosing enabled_protocol: NFS 4.1 traffic is NOT encrypted in transit -- that is exactly why Azure restricts NFS shares to private network reachability."
    - control_id: no-public-access
      status: not_applicable
      notes: "The share has no endpoint of its own -- it is reachable through the account's file endpoint, and public exposure is decided by the account's network rules, private endpoints, and firewall. The one share-level fact: choosing NFS forbids public-endpoint mounts by service rule, forcing private reach."
    - control_id: restricted-ingress
      status: not_applicable
      notes: "Source-network filtering (IP rules, VNet rules, private endpoints) is the account's firewall surface -- component posture of the AzureStorageAccount, applying to every share inside it."
    - control_id: edge-protection
      status: not_applicable
      notes: "SMB/NFS/REST file serving offers no WAF attachment point; request filtering belongs to HTTP tiers, not file shares."
    - control_id: rbac
      status: not_applicable
      notes: "Share-level role-based access is real but lives OUTSIDE this manifest: identity-based data-plane grants (Storage File Data SMB Share Reader/Contributor/Elevated Contributor) are role assignments made ON the share's rbac_scope_id output by AzureRoleAssignment compositions, and management-plane access is ARM RBAC on the account's scope. The spec itself carries no authorization knob."
    - control_id: workload-identity
      status: not_applicable
      notes: "The share authenticates nobody and holds no credentials; mounting workloads bring their own identity posture (Entra Kerberos for SMB, network trust for NFS, or account keys -- account-side custody)."
    - control_id: no-legacy-auth
      status: configurable
      field_path: acls
      evidence:
        type: spec_default
        reference: "Stored access policies anchor every SAS token issued against them: shortening or deleting a policy IMMEDIATELY revokes all tokens it anchors -- the revocation lever ad-hoc SAS tokens lack. The 03-policy-anchored-access preset carries windowed read-only and read-write policies."
      notes: "This governs the SAS path's quality, not its existence -- disabling shared-key/SAS authorization entirely (allow_shared_key_access) is the ACCOUNT's switch. Where identity-based access is available (SMB with Entra Kerberos), prefer it over any SAS."
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: "Data-plane access logging is the account's file-service diagnostic settings (StorageRead/StorageWrite/StorageDelete categories to a Log Analytics workspace); control-plane changes land in the Azure Activity Log. Neither has a share-level toggle."
    - control_id: monitoring-integration
      status: not_applicable
      notes: "Capacity and transaction metrics are emitted at the account's file-service scope in Azure Monitor -- per-share breakdowns are metric dimensions there, not a share-side configuration."
    - control_id: backup-recovery
      status: not_applicable
      notes: "Two real levers, both outside this spec: share soft delete is the account's file-service property (on by default for new accounts, 7-day window), and scheduled snapshot backup with retention is the AzureBackupProtectedFileshare kind registering this share's account to a Recovery Services vault."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: "Retention rides the backup policy on the AzureBackupProtectedFileshare side and the account's soft-delete window -- no retention knob exists on the share."
    - control_id: multi-zone-ha
      status: not_applicable
      notes: "Redundancy is the ACCOUNT's SKU (LRS/ZRS/GRS/GZRS) and applies to every share inside it -- a share cannot choose zones. NFS premium shares additionally constrain the choice: FileStorage accounts offer LRS and ZRS only."
    - control_id: deletion-protection
      status: not_applicable
      notes: "Neither Azure nor this spec offers a share-level deletion-protection flag. The safety nets are the account's soft delete (restorable within its window) and ARM resource locks at account/group scope -- subscription-side governance outside the manifest. Deleting a share deletes its snapshots with it."
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Azure Files is a fully managed service -- Microsoft operates and patches the file-service infrastructure with no customer-visible patch surface on the share."
