syntax = "proto3";

package dev.planton.azure.azurefunctionapp.v1alpha1;

import "catalog/azure/azurefunctionapp/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureFunctionAppIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message AzureFunctionAppIacInput {
  // the catalog object to deploy to be deployed
  AzureFunctionApp target = 1;
  // provider-config for Azure authentication
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
