# Dedicated AzureStorageAccount for the function-app scenario only.
# Account names are globally unique in Azure and hyphen-forbidden, so
# each scenario that creates and destroys its own runtime-state account
# carries a distinct hyphen-free name -- reusing a name across
# sequential subtests hits Azure's post-delete reservation and the
# recreate hangs.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureStorageAccount
metadata:
  name: planton-oss-e2e-functionapp-fixture-account
  id: planton-oss-e2e-functionapp-fixture-account
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurestorageaccount
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  # centralus: co-located with the function app it backs (the app runs in
  # its plan's region, which is centralus on the test subscription).
  region: centralus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  accountName: pltnosse2efnfix
  replicationType: LRS
