# Minimal AzureFunctionApp scenario: a Python function app on the
# fixture Basic B1 plan (registry prerequisite) with a SCENARIO-LOCAL
# storage account for runtime state -- proving the plan FK seam, the
# account-name + access-key storage binding through the account's
# captured outputs, the enum dials, and user tags. The account is
# declared via the e2e-prerequisites annotation instead of a registry
# prerequisite: storage-account names are globally unique and sequential
# subtests that destroy and recreate the same name hang on recreate.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureFunctionApp
metadata:
  name: planton-oss-e2e-azurefunctionapp-smoke
  id: planton-oss-e2e-azurefunctionapp-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurefunctionapp
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "catalog/azure/azurefunctionapp/e2e/minimal-account.yaml"
  tags:
    - planton-e2e
spec:
  # centralus: the app must live in its plan's region, and the fixture
  # plan runs in centralus (probe-verified Basic-tier capacity on
  # the test subscription).
  region: centralus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  functionAppName: pltn-oss-e2e-azfn-smoke
  servicePlanId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-plan
  storageAccountName:
    valueFrom:
      name: planton-oss-e2e-functionapp-fixture-account
  storageAccountAccessKey:
    valueFrom:
      name: planton-oss-e2e-functionapp-fixture-account
  httpsOnly: true
  siteConfig:
    applicationStack:
      pythonVersion: "3.12"
    alwaysOn: true
    minimumTlsVersion: TLS_1_2
    ftpsState: DISABLED
    # The Front Door origin-lockdown wire path (literal form; the
    # reference-resolution path of this field class is live-proven by
    # the DNS-record reference scenarios).
    ipRestrictions:
      - name: front-door-only
        priority: 100
        action: ALLOW
        serviceTag: AzureFrontDoor.Backend
        headers:
          xAzureFdid:
            - value: 11111111-2222-3333-4444-555555555555
      - name: e2e-probe
        priority: 200
        action: ALLOW
        ipAddress: 0.0.0.0/0
    ipRestrictionDefaultAction: DENY
  tags:
    e2e-suite: azure
