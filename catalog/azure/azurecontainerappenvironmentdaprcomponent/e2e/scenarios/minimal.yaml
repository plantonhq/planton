# Minimal AzureContainerAppEnvironmentDaprComponent scenario: a cron
# binding component on the fixture environment (registry prerequisite) --
# proving the environment FK seam, the metadata entries, the app scoping
# list, and the init dials. The cron binding is deliberately chosen as
# the backendless component type: it needs no storage account, broker,
# or connection secret, so the scenario proves the registration surface
# with zero extra fixtures (secret-backed metadata is exercised offline
# through the hack manifest and presets).
apiVersion: azure.planton.dev/v1alpha1
kind: AzureContainerAppEnvironmentDaprComponent
metadata:
  name: planton-oss-e2e-azurecadapr-smoke
  id: planton-oss-e2e-azurecadapr-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurecontainerappenvironmentdaprcomponent
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  containerAppEnvironmentId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-cae
  componentName: cadapr-e2e-smoke
  componentType: bindings.cron
  version: v1
  initTimeout: 10s
  metadata:
    - name: schedule
      value:
        value: "@every 15m"
  scopes:
    - planton-oss-e2e-app
