apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurecontainerappenvironmentdaprcomponent
spec:
  # The scenario deploys the composed RG -> environment chain and
  # registers a backendless cron-binding Dapr component (no storage or
  # broker fixture needed), verifies it via the ARM API, destroys it,
  # and verifies it is gone. The component itself is near-instant; the
  # fixture environment's create + ~5-10 minute delete dominates the run.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 60
