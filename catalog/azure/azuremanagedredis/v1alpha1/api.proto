syntax = "proto3";

package dev.planton.azure.azuremanagedredis.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azuremanagedredis/v1alpha1/outputs.proto";
import "catalog/azure/azuremanagedredis/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureManagedRedis is the top-level API resource for an Azure Managed
// Redis instance -- Azure's current-generation Redis service, built on
// Redis Enterprise. It is the target for NEW Redis deployments (Azure is
// retiring classic Azure Cache for Redis) and carries the capabilities
// the classic service never had: customer-managed-key encryption, active
// multi-primary geo-replication, Redis modules, and a keyless-by-default
// authentication posture.
message AzureManagedRedis {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureManagedRedis'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureManagedRedisSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureManagedRedisStatus status = 5;
}

// AzureManagedRedisStatus holds the deployment status and outputs.
message AzureManagedRedisStatus {
  // outputs
  AzureManagedRedisOutputs outputs = 1;
}
