apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azuremanagedredis
spec:
  # The scenario deploys the fixture resource group (registry
  # prerequisite), creates a BALANCED_B0 instance -- the smallest
  # general-purpose size -- with access keys enabled (proving the key
  # outputs), an eviction policy, and user tags, verifies it via the ARM
  # API, destroys it, and verifies it is gone.
  #
  # Managed Redis clusters provision and delete in tens of minutes
  # (azurerm's own create timeout is 45 minutes), which sizes this
  # profile's timeout. Managed Redis is newer than classic Redis and not
  # yet in every region -- if the pinned region rejects creations, probe
  # and re-region the scenario rather than deferring.
  tier: 1
  status: deferred
  deferred_reason: >-
    Deferred by owner decision: a Managed Redis cluster provisions and
    deletes in tens of minutes, so the dual-engine suite exceeds the
    pre-approved live-E2E window. The component stands on its green
    offline gate -- 100% parity audit, full tofu plan rendering the
    SKU/CMK/module/persistence seams, spec tests covering every
    validation rule, and the outputs conformance case. The scenario
    runs unchanged once a live window is approved.
  validated_provisioners: []
  timeout_minutes: 90
