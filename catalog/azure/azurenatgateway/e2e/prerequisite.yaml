# AzureNatGateway install profile used as a fixture by scenarios that prove
# the subnet-side attach seam (declared via the
# planton.dev/e2e-prerequisites annotation -- attaching a NAT gateway
# is OPTIONAL for a subnet, so it is never a registry prerequisite). The
# harness deploys this document (via the gateway's Pulumi module) after the
# fixture resource group and captures its outputs -- nat_gateway_id in
# particular -- for the attaching scenario's reference to resolve against.
# The gateway is a bare fixture with no associated addresses: it cannot
# translate traffic, but the attach seam under test is real -- the
# gateway's own scenario proves the address associations.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureNatGateway
metadata:
  name: planton-oss-e2e-azure-fixture-nat
  id: planton-oss-e2e-azure-fixture-nat
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurenatgateway
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-azure-fixture-nat
