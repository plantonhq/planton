apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurenatgateway
spec:
  # The harness deploys the fixture resource group (registry prerequisite)
  # plus the scenario-declared extra fixtures (a public IP and a public IP
  # prefix), creates a zonal gateway associated with BOTH address forms,
  # verifies it via the ARM API (generic GetByID on the gateway's ARM id),
  # destroys it, and verifies it is gone -- on both provisioners. The
  # gateway and its addresses bill per hour; the run holds them for
  # minutes.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
