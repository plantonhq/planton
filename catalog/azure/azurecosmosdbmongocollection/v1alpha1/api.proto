syntax = "proto3";

package dev.planton.azure.azurecosmosdbmongocollection.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurecosmosdbmongocollection/v1alpha1/outputs.proto";
import "catalog/azure/azurecosmosdbmongocollection/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureCosmosdbMongoCollection is the top-level API resource for a
// MongoDB API collection inside a Cosmos DB database (referenced via
// mongo_database_id) -- the unit of storage and scale-out where documents
// actually live. Shard key, indexes, TTL, and dedicated throughput are
// set per collection.
message AzureCosmosdbMongoCollection {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureCosmosdbMongoCollection'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureCosmosdbMongoCollectionSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureCosmosdbMongoCollectionStatus status = 5;
}

// AzureCosmosdbMongoCollectionStatus holds the deployment status and outputs.
message AzureCosmosdbMongoCollectionStatus {
  // outputs
  AzureCosmosdbMongoCollectionOutputs outputs = 1;
}
