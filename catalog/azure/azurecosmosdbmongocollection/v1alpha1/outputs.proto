syntax = "proto3";

package dev.planton.azure.azurecosmosdbmongocollection.v1alpha1;

// **AzureCosmosdbMongoCollectionOutputs** captures the outputs of
// provisioning a Cosmos DB MongoDB API collection.
//
// No endpoint or credential outputs on purpose: connectivity and the
// MongoDB connection strings live on the ACCOUNT (AzureCosmosdbAccount's
// outputs); the collection is addressed inside that connection by
// database and collection name.
message AzureCosmosdbMongoCollectionOutputs {
  // The Azure Resource Manager ID of the collection -- the management-
  // plane identity ARM reads and policy target.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.DocumentDB/databaseAccounts/{account}/mongodbDatabases/{db}/collections/{name}
  string mongo_collection_id = 1;

  // The collection's name -- what MongoDB drivers reference inside the
  // database.
  string mongo_collection_name = 2;

  // The name of the database the collection lives in, parsed from the
  // resolved database ID.
  string mongo_database_name = 3;

  // The name of the Cosmos DB account, parsed from the resolved
  // database ID -- saves consumers a second reference when they need
  // the full account/database/collection triple.
  string cosmosdb_account_name = 4;
}
