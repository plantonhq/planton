# Least-privilege permissions the IaC runner's Azure principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: azurecosmosdbmongocollection
spec:
  azure:
    groups:
      - purpose: ManageMongoCollection
        actions:
          - Microsoft.DocumentDB/databaseAccounts/mongodbDatabases/collections/read
          - Microsoft.DocumentDB/databaseAccounts/mongodbDatabases/collections/write
          - Microsoft.DocumentDB/databaseAccounts/mongodbDatabases/collections/delete
        provenance: derived
        notes: "Covers azurerm_cosmosdb_mongo_collection / cosmosdb.NewMongoCollection -- create with the shard key, TTL, and index list riding the collection payload; refresh; in-place updates (indexes, TTL); and destroy. Both modules parse the resource group, account, and database names locally from the resolved mongo_database_id -- no API call reads the parents -- and Cosmos child operations are long-running, so both providers poll the collection until provisioning settles (read persists through creates, updates, and destroys). Typically held via DocumentDB Account Contributor, Contributor, or Owner on the resource group."
      - purpose: ManageCollectionThroughput
        actions:
          - Microsoft.DocumentDB/databaseAccounts/mongodbDatabases/collections/throughputSettings/read
          - Microsoft.DocumentDB/databaseAccounts/mongodbDatabases/collections/throughputSettings/write
        provenance: derived
        notes: "Needed when the spec sets throughput or autoscale_max_throughput: dedicated throughput rides the create payload, but the provider reads the collection's throughput settings on every refresh to detect drift and issues throughputSettings/write for in-place throughput changes. A collection sharing the database's throughput (both fields unset) has no throughput sub-resource, and these actions go unused."
