# Composed AzureCosmosdbMongoCollection scenario: the full three-kind
# Mongo chain -- scenario-local account, database with shared
# throughput, and the collection under test with a tenantId shard key
# and the _id unique index Azure requires on every Mongo collection.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureCosmosdbMongoCollection
metadata:
  name: planton-oss-e2e-azurecosmosdbmongocollection-chain
  id: planton-oss-e2e-azurecosmosdbmongocollection-chain
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurecosmosdbmongocollection
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "catalog/azure/azurecosmosdbmongocollection/e2e/mongo-chain-account.yaml, catalog/azure/azurecosmosdbmongocollection/e2e/mongo-chain-database.yaml"
  tags:
    - planton-e2e
spec:
  mongoDatabaseId:
    valueFrom:
      name: planton-oss-e2e-cosmosmgchain-fixture-database
  collectionName: tenants
  shardKey: tenantId
  indexes:
    - keys:
        - _id
      unique: true
