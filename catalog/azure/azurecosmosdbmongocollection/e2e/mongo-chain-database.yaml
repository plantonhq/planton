# Scenario-local Mongo database for the collection chain.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureCosmosdbMongoDatabase
metadata:
  name: planton-oss-e2e-cosmosmgchain-fixture-database
  id: planton-oss-e2e-cosmosmgchain-fixture-database
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurecosmosdbmongodatabase
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  cosmosdbAccountId:
    valueFrom:
      name: planton-oss-e2e-cosmosmgchain-fixture-account
  databaseName: chaindb
  throughput: 400
