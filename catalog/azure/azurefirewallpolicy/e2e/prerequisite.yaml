# AzureFirewallPolicy install profile used as a prerequisite by composed
# kinds (declared via prerequisites: [AzureFirewallPolicy] in the kind
# registry -- the rule collection group -- and via the
# planton.dev/e2e-prerequisites annotation by the firewall's
# policy-attach scenario). The harness deploys this document (via the
# policy's Pulumi module) after the fixture resource group and captures its
# outputs -- firewall_policy_id in particular -- for dependents' references
# to resolve against. The policy is a bare STANDARD-tier fixture: rules,
# DNS, and posture belong to the consuming scenario's own resources.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureFirewallPolicy
metadata:
  name: planton-oss-e2e-azure-fixture-fwpolicy
  id: planton-oss-e2e-azure-fixture-fwpolicy
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurefirewallpolicy
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-azure-fixture-fwpolicy
