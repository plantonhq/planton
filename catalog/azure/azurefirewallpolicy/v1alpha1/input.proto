syntax = "proto3";

package dev.planton.azure.azurefirewallpolicy.v1alpha1;

import "catalog/azure/azurefirewallpolicy/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureFirewallPolicyIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and Azure
// provider credentials.
message AzureFirewallPolicyIacInput {
  // The firewall policy resource to deploy.
  AzureFirewallPolicy target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
