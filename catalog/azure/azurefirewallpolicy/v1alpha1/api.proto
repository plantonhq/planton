syntax = "proto3";

package dev.planton.azure.azurefirewallpolicy.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurefirewallpolicy/v1alpha1/outputs.proto";
import "catalog/azure/azurefirewallpolicy/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureFirewallPolicy is the top-level API resource for an Azure Firewall
// Policy: the reusable rule-and-inspection document Azure Firewall
// instances enforce. It is a first-class composable resource because one
// policy serves many firewalls, carries its own lifecycle (security policy
// changes on the security team's schedule, not the network's), and is the
// parent of independently-deployable rule collection groups.
message AzureFirewallPolicy {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzureFirewallPolicy".
  string kind = 2 [(buf.validate.field).string.const = 'AzureFirewallPolicy'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Firewall policy specification.
  AzureFirewallPolicySpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzureFirewallPolicyStatus status = 5;
}

// AzureFirewallPolicyStatus holds the deployment outputs.
message AzureFirewallPolicyStatus {
  // Outputs from the IaC deployment.
  AzureFirewallPolicyOutputs outputs = 1;
}
