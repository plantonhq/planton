apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurevirtualnetworkgatewayconnection
spec:
  # Live-proven 2026-08-11 on both engines (full lifecycle, ~60m per
  # engine lane -- the chain's fixture VPN gateway cycle dominates:
  # measured ~35m create + ~15m delete inside the lane; the connection
  # itself deploys in ~2m) plus the blind import round-trip on the
  # terraform lane (single ARM id, zero-change plan -- which also proves
  # ARM returns shared_key faithfully, so no write-normalized tolerance
  # is needed). The fixture site's endpoint has no real device: the
  # tunnel provisions but never reaches Connected, and the verifier
  # asserts ARM state, never tunnel-up.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 90
