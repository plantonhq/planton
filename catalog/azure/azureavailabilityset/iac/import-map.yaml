apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: azureavailabilityset
spec:
  # The availability set's identity is its full ARM resource ID.
  values:
    - name: availability_set_id
      derivations:
        - from_output: availability_set_id
      where_to_find: >-
        Portal -> Availability sets -> the set -> Properties -> Resource
        ID, or `az vm availability-set show --name <name> -g <rg>
        --query id`.
