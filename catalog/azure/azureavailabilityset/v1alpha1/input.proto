syntax = "proto3";

package dev.planton.azure.azureavailabilityset.v1alpha1;

import "catalog/azure/azureavailabilityset/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureAvailabilitySetIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureAvailabilitySetIacInput {
  // The availability set resource to deploy.
  AzureAvailabilitySet target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
