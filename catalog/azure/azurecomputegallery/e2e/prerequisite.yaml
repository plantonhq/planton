# AzureComputeGallery install profile used as a fixture by
# AzureComputeGalleryImage scenarios (the image kind's registry
# prerequisite). The harness deploys this document (via the gallery's
# Pulumi module) after the fixture resource group and captures its
# outputs -- gallery_name in particular -- for the image scenarios'
# references to resolve against. Gallery names forbid dashes, so the
# stable fixture name uses underscores (a gallery is free at rest; a
# crashed run's leftover holds the name and the zero-orphan sweep is
# the remedy).
apiVersion: azure.planton.dev/v1alpha1
kind: AzureComputeGallery
metadata:
  name: planton-oss-e2e-azure-fixture-gallery
  id: planton-oss-e2e-azure-fixture-gallery
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurecomputegallery
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton_oss_e2e_fixture_gallery
  region: eastus
