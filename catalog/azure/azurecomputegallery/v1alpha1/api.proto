syntax = "proto3";

package dev.planton.azure.azurecomputegallery.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurecomputegallery/v1alpha1/outputs.proto";
import "catalog/azure/azurecomputegallery/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureComputeGallery represents an Azure Compute Gallery -- the
// shared library an organization keeps its approved VM images in.
// Image definitions live inside it; VMs and scale sets deploy from
// their published, region-replicated versions.
message AzureComputeGallery {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureComputeGallery'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AzureComputeGallerySpec spec = 4 [(buf.validate.field).required = true];

  //status
  AzureComputeGalleryStatus status = 5;
}

// AzureComputeGalleryStatus represents the status of an Azure Compute
// Gallery deployment.
message AzureComputeGalleryStatus {
  //outputs
  //  azure-compute-gallery outputs
  AzureComputeGalleryOutputs outputs = 1;
}
