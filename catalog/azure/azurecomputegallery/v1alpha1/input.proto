syntax = "proto3";

package dev.planton.azure.azurecomputegallery.v1alpha1;

import "catalog/azure/azurecomputegallery/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureComputeGalleryIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureComputeGalleryIacInput {
  // The Compute Gallery resource to deploy.
  AzureComputeGallery target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
