# AzureLoadBalancer install profile used as a fixture by scenarios that
# prove member-side association seams (declared via the
# planton.dev/e2e-prerequisites annotation -- a NIC's pool
# membership and NAT-rule references are OPTIONAL, so the load balancer
# is never a registry prerequisite). The harness deploys this document
# after the fixture chain and captures its outputs -- the name-keyed
# backend_pool_ids and nat_rule_ids maps in particular -- for the
# associating scenario's references to resolve against. An INTERNAL
# frontend on the fixture subnet keeps the fixture self-contained (no
# public address needed for membership proofs).
apiVersion: azure.planton.dev/v1alpha1
kind: AzureLoadBalancer
metadata:
  name: planton-oss-e2e-azure-fixture-lb
  id: planton-oss-e2e-azure-fixture-lb
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureloadbalancer
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-azure-fixture-lb
  frontendIpConfigurations:
    - name: internal
      subnetId:
        valueFrom:
          name: planton-oss-e2e-azure-fixture-subnet
  backendPools:
    - name: web
  healthProbes:
    - name: tcp-health
      protocol: PROBE_TCP
      port: 22
  rules:
    - name: app
      protocol: TCP
      frontendPort: 8080
      backendPort: 8080
      backendPoolNames: [web]
      probeName: tcp-health
  natRules:
    # The single-target NAT rule the NIC membership scenario completes
    # via its NAT-rule association.
    - name: ssh-admin
      protocol: TCP
      frontendPort: 2222
      backendPort: 22
