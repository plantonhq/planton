syntax = "proto3";

package dev.planton.azure.azureeventgriddomain.v1alpha1;

import "catalog/azure/azureeventgriddomain/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureEventgridDomainIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureEventgridDomainIacInput {
  // The Event Grid domain resource to deploy.
  AzureEventgridDomain target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
