syntax = "proto3";

package dev.planton.azure.azureeventgriddomain.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureeventgriddomain/v1alpha1/outputs.proto";
import "catalog/azure/azureeventgriddomain/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureEventgridDomain represents an Azure Event Grid domain -- one
// publishing endpoint and one pair of access keys serving many event
// streams (domain topics), the multi-tenant pattern. Topics inside the
// domain are auto-managed by Azure or declared explicitly as
// AzureEventgridDomainTopic resources.
message AzureEventgridDomain {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureEventgridDomain'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AzureEventgridDomainSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AzureEventgridDomainStatus status = 5;
}

// AzureEventgridDomainStatus represents the status of an Azure Event
// Grid domain deployment.
message AzureEventgridDomainStatus {
  //outputs
  //  azure-eventgrid-domain outputs
  AzureEventgridDomainOutputs outputs = 1;
}
