# Minimal AzureEventgridDomain scenario: a CloudEvents domain in the
# shared fixture resource group with the auto-topic flags OFF -- the
# pinned-topics posture, so the lane proves the explicit lifecycle the
# domain-topic kind's lane builds on. The domain's cloud-side name
# lives in the region's PUBLIC DNS namespace
# ({name}.{region}.eventgrid.azure.net), so it carries ${E2E_RUN_ID}
# (metadata names stay stable); a crashed run's leftover can then
# never block the next run. Free at rest; creates in seconds.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureEventgridDomain
metadata:
  name: planton-oss-e2e-azureeventgriddomain-smoke
  id: planton-oss-e2e-azureeventgriddomain-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureeventgriddomain
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-egd-${E2E_RUN_ID}
  region: eastus
  inputSchema: CloudEventSchemaV1_0
  autoCreateTopicWithFirstSubscription: false
  autoDeleteTopicWithLastSubscription: false
