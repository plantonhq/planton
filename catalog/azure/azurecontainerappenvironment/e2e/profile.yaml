apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurecontainerappenvironment
spec:
  # The scenario deploys the fixture resource group (registry
  # prerequisite), creates a consumption-only environment with mTLS and
  # user tags -- proving the environment core, the streaming-only
  # logging default, and the tag merge -- verifies it via the ARM API,
  # destroys it, and verifies it is gone. Environments create in a few
  # minutes but DELETE in ~5-10 minutes (Azure tears down the managed
  # infrastructure behind them), which dominates the run.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 45
