# Minimal AzureContainerAppEnvironment scenario: a consumption-only
# environment in the fixture resource group with an explicit logging
# choice and user tags -- proving the environment core (region/RG/name),
# the streaming-only logging default (no workspace), the mTLS toggle
# wire, and the tag merge. Environment names are resource-group-scoped,
# so sequential engine runs recreate the same name safely. Workload
# profiles, VNet injection, and the custom DNS suffix are exercised
# offline (hack manifest + tofu plan) -- a dedicated-profile environment
# bills VM capacity and VNet injection needs a /21 subnet fixture,
# neither of which changes the create/verify/destroy surface this
# scenario proves.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureContainerAppEnvironment
metadata:
  name: planton-oss-e2e-azurecae-smoke
  id: planton-oss-e2e-azurecae-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurecontainerappenvironment
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  # centralus: consistent with the app-hosting family's probe-verified
  # region on the test subscription.
  region: centralus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  environmentName: planton-oss-e2e-cae-smoke
  mutualTlsEnabled: true
  tags:
    e2e-suite: azure
