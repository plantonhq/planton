syntax = "proto3";

package dev.planton.azure.azurecontainerappenvironment.v1alpha1;

// **AzureContainerAppEnvironmentOutputs** captures the outputs of
// provisioning an Azure Container Apps Managed Environment.
//
// The primary output is `environment_id`, referenced by everything that
// lives inside the environment:
// - AzureContainerApp (container_app_environment_id)
// - AzureContainerAppJob (container_app_environment_id)
// - AzureContainerAppEnvironmentStorage (container_app_environment_id)
// - AzureContainerAppEnvironmentDaprComponent (container_app_environment_id)
//
// The `default_domain` and `static_ip_address` outputs are the DNS wiring
// surface (CNAME targets, A records, firewall allowlists); the
// platform-reserved outputs matter for network planning in VNet-injected
// environments; `custom_domain_verification_id` is the TXT-record value
// that proves domain ownership for a custom DNS suffix.
message AzureContainerAppEnvironmentOutputs {
  // The Azure Resource Manager ID of the Container App Environment.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.App/managedEnvironments/{name}
  //
  // This is the primary reference output -- every kind that lives inside
  // the environment consumes it.
  string environment_id = 1;

  // The name of the Container App Environment.
  string environment_name = 2;

  // The default, publicly resolvable domain name for apps in this environment.
  // Apps are accessible at {app-name}.{default_domain}.
  //
  // Useful for DNS CNAME records and verifying environment connectivity.
  string default_domain = 3;

  // The static IP address of the environment.
  // For external environments, this is a public IP.
  // For internal environments (internal_load_balancer_enabled=true), this is a private IP.
  //
  // Useful for DNS A records, firewall allowlists, and network debugging.
  string static_ip_address = 4;

  // The IP range (CIDR notation) reserved for environment infrastructure.
  // This range is used by the Container Apps platform for internal services.
  //
  // Only populated for VNet-injected environments. Useful for network
  // planning and ensuring no CIDR conflicts with other VNet resources.
  string platform_reserved_cidr = 5;

  // The IP address from platform_reserved_cidr reserved for the internal
  // DNS server. Used by container apps for service discovery within the
  // environment.
  //
  // Only populated for VNet-injected environments. Useful for custom DNS
  // configuration and network debugging.
  string platform_reserved_dns_ip_address = 6;

  // The Docker bridge network address (CIDR) used inside the environment's
  // infrastructure. Only populated for VNet-injected environments; useful
  // when diagnosing address-space overlaps.
  string docker_bridge_cidr = 7;

  // The value Azure expects in the asuid.{dns_suffix} TXT record to prove
  // ownership of a custom DNS suffix (and of per-app custom domains).
  // Publish it before configuring `custom_domain`.
  string custom_domain_verification_id = 8;

  // The principal (object) ID of the environment's system-assigned managed
  // identity. Empty unless the identity block enables SYSTEM_ASSIGNED.
  // Grant this principal roles (e.g. AcrPull on a container registry) to
  // let the environment's platform operations authenticate keylessly.
  string identity_principal_id = 9;
}
