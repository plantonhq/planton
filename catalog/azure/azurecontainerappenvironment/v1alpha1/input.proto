syntax = "proto3";

package dev.planton.azure.azurecontainerappenvironment.v1alpha1;

import "catalog/azure/azurecontainerappenvironment/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureContainerAppEnvironmentIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message AzureContainerAppEnvironmentIacInput {
  // the catalog object to deploy to be deployed
  AzureContainerAppEnvironment target = 1;
  // provider-config for Azure authentication
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
