apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurebackupprotectedvm
spec:
  # PROVEN live on both engines (proof session, 2026-08-18): `minimal`
  # (fixture VM under the smoke policy, LUN-0 data disk excluded) --
  # Pulumi 23m51s (deploy 1m52s, destroy 1m25s), Terraform 22m31s
  # incl. a 12s blind import round-trip with a no-differences re-plan;
  # the chain (policy -> fixture vault -> RG, plus the VM's
  # NIC/subnet/VNet/disk chain) dominates at ~10 min each way. Live
  # caught TWO delete-side classes (see the verifier and the e2e
  # README): ARM reads answer 200 for minutes after an engine-reported
  # destroy (async lag -- the verifier's absence bar is now a bounded
  # poll), and one run's DeleteThenPoll returned success while Azure
  # ran no delete job at all (recovered via `az backup protection
  # disable`). Creation only REGISTERS protection -- no backup job
  # runs, no backup storage accrues; cost is the fixture VM's hour
  # (Standard_B2s, cents). protection_state dials and retain-on-destroy
  # stay offline-proven (the suspend state needs an immutable vault the
  # fixture deliberately is not).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 90
