syntax = "proto3";

package dev.planton.azure.azurebackupprotectedvm.v1alpha1;

import "catalog/azure/azurebackupprotectedvm/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureBackupProtectedVmIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureBackupProtectedVmIacInput {
  // The protected VM resource to deploy.
  AzureBackupProtectedVm target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
