# The work queue the subscription's dead-letter forwarding targets --
# live-proving the forward seam resolves through the queue's name output
# and Azure's target-must-exist contract holds.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureServiceBusQueue
metadata:
  name: planton-oss-e2e-sbsub-fixture-queue
  id: planton-oss-e2e-sbsub-fixture-queue
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureservicebusqueue
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  namespaceId:
    valueFrom:
      name: planton-oss-e2e-sbsub-fixture-namespace
  queueName: e2e-poison-sink
