syntax = "proto3";

package dev.planton.azure.azureservicebussubscription.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureservicebussubscription/v1alpha1/outputs.proto";
import "catalog/azure/azureservicebussubscription/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureServiceBusSubscription is the top-level API resource for a
// subscription under an Azure Service Bus topic (referenced via topic_id)
// -- an independent, optionally filtered view of the topic's stream with
// its own consumer semantics. Filter rules fold inside the subscription;
// they combine with OR semantics alongside Azure's auto-created $Default
// catch-all (removed once, out-of-band, for restrictive delivery -- the
// service-created rule cannot be declared or adopted).
message AzureServiceBusSubscription {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureServiceBusSubscription'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureServiceBusSubscriptionSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureServiceBusSubscriptionStatus status = 5;
}

// AzureServiceBusSubscriptionStatus holds the deployment status and outputs.
message AzureServiceBusSubscriptionStatus {
  // outputs
  AzureServiceBusSubscriptionOutputs outputs = 1;
}
