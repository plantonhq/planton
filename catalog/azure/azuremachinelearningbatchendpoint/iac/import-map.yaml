apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: azuremachinelearningbatchendpoint
spec:
  # The endpoint's identity is its full ARM resource ID
  # (.../workspaces/{ws}/batchEndpoints/{name}); the module deploys
  # through azapi, whose import ID is that ARM ID plus the module's
  # pinned api-version as a query suffix (the shared azapi_resource
  # catalog entry).
  values:
    - name: arm_resource_id
      derivations:
        - from_output: batch_endpoint_id
      where_to_find: >-
        Compose {workspace-id}/batchEndpoints/{endpoint-name}, or
        `az ml batch-endpoint show -g <rg> --workspace-name <ws>
        -n <name> --query id`.
    - name: azapi_api_version
      derivations:
        # The api-version is a property of the module (its pinned ARM
        # contract), not of any one resource.
        - literal: "2025-06-01"
      where_to_find: >-
        The module's pinned ARM api-version, declared in the
        azapi_resource type in iac/tf/main.tf.
