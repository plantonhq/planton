syntax = "proto3";

package dev.planton.azure.azuremachinelearningbatchendpoint.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azuremachinelearningbatchendpoint/v1alpha1/outputs.proto";
import "catalog/azure/azuremachinelearningbatchendpoint/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureMachineLearningBatchEndpoint is the top-level API resource
// describing a batch endpoint on an Azure Machine Learning workspace
// -- the stable address batch scoring jobs are submitted to, with a
// default-deployment pointer that routes unrouted submissions.
message AzureMachineLearningBatchEndpoint {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzureMachineLearningBatchEndpoint".
  string kind = 2 [(buf.validate.field).string.const = 'AzureMachineLearningBatchEndpoint'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Batch endpoint specification.
  AzureMachineLearningBatchEndpointSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzureMachineLearningBatchEndpointStatus status = 5;
}

// AzureMachineLearningBatchEndpointStatus holds the deployment outputs.
message AzureMachineLearningBatchEndpointStatus {
  // Outputs from the IaC deployment.
  AzureMachineLearningBatchEndpointOutputs outputs = 1;
}
