syntax = "proto3";

package dev.planton.azure.azuremachinelearningbatchendpoint.v1alpha1;

// **AzureMachineLearningBatchEndpointOutputs** captures the
// outputs of provisioning a Machine Learning batch endpoint.
//
// No key outputs exist here BY THE SERVICE'S OWN CONTRACT: batch
// endpoints accept only Microsoft Entra token auth (the service
// rejects Key mode outright), so there are no static keys to mint,
// set, or read -- the listKeys ARM action exists on the surface but
// answers for a mode the service never enables.
message AzureMachineLearningBatchEndpointOutputs {
  // The Azure Resource Manager ID of the batch endpoint.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.MachineLearningServices/workspaces/{ws}/batchEndpoints/{name}
  string batch_endpoint_id = 1;

  // The endpoint's name -- what deployments attach to and what the
  // default-deployment pointer routes submissions across.
  string batch_endpoint_name = 2;

  // The HTTPS address batch scoring jobs are submitted to (with a
  // Microsoft Entra token).
  string scoring_uri = 3;

  // The endpoint's OpenAPI (Swagger) document address -- the job
  // submission request/response schema. EMPTY until a deployment
  // serves behind the endpoint (live-measured on both engines: ARM
  // returns "" for a deployment-less endpoint, unlike the online
  // sibling whose swagger URI populates at create).
  string swagger_uri = 4;

  // The principal (object) ID of the endpoint's system-assigned
  // identity, when one is enabled -- what role grants bind to when
  // organizational convention grants roles to the endpoint object.
  string system_assigned_identity_principal_id = 5;
}
