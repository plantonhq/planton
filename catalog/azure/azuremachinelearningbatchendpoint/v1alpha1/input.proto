syntax = "proto3";

package dev.planton.azure.azuremachinelearningbatchendpoint.v1alpha1;

import "catalog/azure/azuremachinelearningbatchendpoint/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureMachineLearningBatchEndpointIacInput is the input to the IaC
// modules (Pulumi/Terraform). It contains the target resource
// definition and Azure provider credentials.
message AzureMachineLearningBatchEndpointIacInput {
  // The batch endpoint resource to deploy.
  AzureMachineLearningBatchEndpoint target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
