syntax = "proto3";

package dev.planton.azure.azuresearchservice.v1alpha1;

import "catalog/azure/azuresearchservice/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureSearchServiceIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureSearchServiceIacInput {
  // The search service resource to deploy.
  AzureSearchService target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
