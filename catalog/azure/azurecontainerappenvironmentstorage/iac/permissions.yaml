# Least-privilege permissions the IaC runner's Azure principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: azurecontainerappenvironmentstorage
spec:
  azure:
    groups:
      - purpose: ManageEnvironmentStorage
        actions:
          - Microsoft.App/managedenvironments/storages/read
          - Microsoft.App/managedenvironments/storages/write
          - Microsoft.App/managedenvironments/storages/delete
        provenance: derived
        notes: Covers azurerm_container_app_environment_storage -- create, in-place SMB access_key rotation (every other change replaces the registration), read/refresh, and destroy. The parent environment is addressed by the ARM ID resolved from container_app_environment_id; the module performs no environment read and no storage-account calls -- account_name and access_key arrive as resolved literals from the spec's references, so the RUNNER never lists storage keys itself. ARM never returns the access key on reads (the provider echoes it from configuration). Verified against Microsoft.App's published operations; held via Contributor on the environment's resource group.
