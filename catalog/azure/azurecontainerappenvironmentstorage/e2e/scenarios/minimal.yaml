# Minimal AzureContainerAppEnvironmentStorage scenario: an SMB share
# registration on the fixture environment (registry prerequisite),
# backed by a SCENARIO-LOCAL storage account + Azure Files share --
# proving the environment FK seam, the share/account/access-key trio
# resolved through the fixtures' captured outputs, and the READ_WRITE
# access mode. The account + share are declared via the
# e2e-prerequisites annotation instead of registry prerequisites:
# storage-account names are globally unique and sequential subtests that
# destroy and recreate the same name hang on recreate. The composed
# chain is RG -> environment + (account -> share) -> registration.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureContainerAppEnvironmentStorage
metadata:
  name: planton-oss-e2e-azurecaes-smoke
  id: planton-oss-e2e-azurecaes-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurecontainerappenvironmentstorage
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "catalog/azure/azurecontainerappenvironmentstorage/e2e/smb-account.yaml,catalog/azure/azurecontainerappenvironmentstorage/e2e/smb-share.yaml"
  tags:
    - planton-e2e
spec:
  containerAppEnvironmentId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-cae
  storageName: caes-e2e-smoke
  shareName:
    valueFrom:
      name: planton-oss-e2e-caes-fixture-share
  accessMode: READ_WRITE
  accountName:
    valueFrom:
      name: planton-oss-e2e-caes-fixture-account
  accessKey:
    valueFrom:
      name: planton-oss-e2e-caes-fixture-account
      fieldPath: status.outputs.primary_access_key
