apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azureaksnodepool
spec:
  # A standalone AKS node pool under live E2E: the harness first stands up
  # the prerequisite chain (fixture RG -> AKS cluster, ~5-10 minutes for
  # the control plane), then deploys a ZERO-NODE user pool -- AKS
  # validates the cluster wiring and creates the agent pool without
  # launching instances. Timeout is sized for both teardowns.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 75
