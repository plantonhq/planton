syntax = "proto3";

package dev.planton.azure.azureaksnodepool.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureaksnodepool/v1alpha1/outputs.proto";
import "catalog/azure/azureaksnodepool/v1alpha1/spec.proto";
import "shared/metadata.proto";

// azure-aks-node-pool
message AzureAksNodePool {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureAksNodePool'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AzureAksNodePoolSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AzureAksNodePoolStatus status = 5;
}

// azure-aks-node-pool status
message AzureAksNodePoolStatus {
  //outputs
  //  azure-aks-node-pool outputs
  AzureAksNodePoolOutputs outputs = 1;
}
