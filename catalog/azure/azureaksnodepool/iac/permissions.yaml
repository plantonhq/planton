# Least-privilege permissions the IaC runner's Azure principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: azureaksnodepool
spec:
  azure:
    groups:
      - purpose: ManageNodePool
        actions:
          - Microsoft.ContainerService/managedClusters/read
          - Microsoft.ContainerService/managedClusters/agentPools/read
          - Microsoft.ContainerService/managedClusters/agentPools/write
          - Microsoft.ContainerService/managedClusters/agentPools/delete
        provenance: derived
        notes: Covers azurerm_kubernetes_cluster_node_pool -- the provider reads the parent cluster, then creates/reads/updates/deletes the agent pool. Held via Azure Kubernetes Service Contributor, Contributor, or Owner on the cluster's resource group, matching the module README's prose.
      - purpose: JoinPoolSubnet
        actions:
          - Microsoft.Network/virtualNetworks/subnets/join/action
          - Microsoft.Network/virtualNetworks/subnets/read
          - Microsoft.Network/virtualNetworks/read
        provenance: derived
        notes: Required only when vnet_subnet_id (or pod_subnet_id) places the pool on a BYO subnet -- creating NICs in a subnet the pool does not own demands join on it, and after creating the pool the provider polls BOTH the subnet and its parent virtual network until their provisioning states return to Succeeded (Get on each), which is where the two read actions are exercised. Not needed with AKS-managed networking.
