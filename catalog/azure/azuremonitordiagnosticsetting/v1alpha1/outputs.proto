syntax = "proto3";

package dev.planton.azure.azuremonitordiagnosticsetting.v1alpha1;

// **AzureMonitorDiagnosticSettingOutputs** captures the outputs of
// provisioning an Azure Monitor diagnostic setting.
message AzureMonitorDiagnosticSettingOutputs {
  // The Azure Resource Manager ID of the diagnostic setting -- an extension
  // resource ID scoped under the target resource. Format:
  // {target_resource_id}/providers/Microsoft.Insights/diagnosticSettings/{name}
  string diagnostic_setting_id = 1;

  // The name of the diagnostic setting.
  string diagnostic_setting_name = 2;

  // The ARM ID of the target resource the setting routes telemetry from --
  // resolved from the spec reference, exported for downstream visibility.
  string target_resource_id = 3;
}
