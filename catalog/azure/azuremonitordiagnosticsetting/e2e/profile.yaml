apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azuremonitordiagnosticsetting
spec:
  # The scenario routes the fixture workspace's OWN audit logs back into
  # itself -- one fixture proves both the polymorphic target seam and the
  # workspace destination seam. The setting is near-instant; the API's
  # eventual consistency adds only polling seconds each way.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
