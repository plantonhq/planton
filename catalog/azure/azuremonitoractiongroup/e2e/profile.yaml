apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azuremonitoractiongroup
spec:
  # The scenario deploys a multi-receiver action group (email + webhook +
  # ARM-role fan-out) into the fixture resource group, verifies it via
  # the ARM API, destroys it, and verifies it is gone. Action groups are
  # global and create in seconds.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
