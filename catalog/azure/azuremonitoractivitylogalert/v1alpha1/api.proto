syntax = "proto3";

package dev.planton.azure.azuremonitoractivitylogalert.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azuremonitoractivitylogalert/v1alpha1/outputs.proto";
import "catalog/azure/azuremonitoractivitylogalert/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureMonitorActivityLogAlert is the top-level API resource for an Azure
// Monitor Activity Log Alert: a rule that fires actions when a matching
// entry appears in the Azure Activity Log (control-plane operations,
// service-health incidents, resource-health transitions, policy events,
// Advisor recommendations).
message AzureMonitorActivityLogAlert {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzureMonitorActivityLogAlert".
  string kind = 2 [(buf.validate.field).string.const = 'AzureMonitorActivityLogAlert'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Activity log alert specification.
  AzureMonitorActivityLogAlertSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzureMonitorActivityLogAlertStatus status = 5;
}

// AzureMonitorActivityLogAlertStatus holds the deployment outputs.
message AzureMonitorActivityLogAlertStatus {
  // Outputs from the IaC deployment.
  AzureMonitorActivityLogAlertOutputs outputs = 1;
}
