# Composed AzureMonitorActivityLogAlert scenario: an administrative alert
# scoped to the fixture resource group that fires the fixture action group
# when a VM is deleted.
#
# The action group is the registry prerequisite (bringing the fixture
# resource group transitively). This proves the scope FK (resolved to the
# fixture RG's ARM id), the criteria block (category + operation + levels +
# statuses), and the action FK to the action group -- the
# activity_log_alert_id output must populate on both engines. The alert is
# global metadata, so it provisions in seconds.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureMonitorActivityLogAlert
metadata:
  name: planton-oss-e2e-azuremonitoractivitylogalert-smoke
  id: planton-oss-e2e-azuremonitoractivitylogalert-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuremonitoractivitylogalert
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-ala-smoke
  scopes:
    - valueFrom:
        name: planton-oss-e2e-azure-fixture-rg
  criteria:
    category: ADMINISTRATIVE
    operationName: Microsoft.Compute/virtualMachines/delete
    levels:
      - ERROR
      - CRITICAL
    statuses:
      - Succeeded
  actions:
    - actionGroupId:
        valueFrom:
          name: planton-oss-e2e-azure-fixture-ag
  description: E2E smoke -- fires when a VM is deleted in the fixture resource group
  tags:
    e2e-suite: azure
    purpose: smoke
