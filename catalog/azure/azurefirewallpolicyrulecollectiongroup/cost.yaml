# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azurefirewallpolicyrulecollectiongroup
spec:
  billing_model: free
  free_tier: A rule collection group is an ordered document of firewall rules nested inside a firewall policy. Azure meters neither rules nor rule documents -- a policy carries any number of groups, each with any number of application, network, and DNAT collections, at no charge; authoring, holding, and reordering them never bills.
  notes: "No field of this spec buys anything: priorities, collections, and rules are enforcement configuration read by the firewall's rule engine for free. The real spend lives up the parent chain: the FIREWALL POLICY the group deploys into is free only while attached to at most one firewall (multi-firewall association bills $100 per policy per region per month -- the policy kind's cost profile states the condition), and the FIREWALLS enforcing the rules bill deployment hours plus per-GB data processing as their own component. Splitting rules across one group or twenty changes nothing on the invoice."
