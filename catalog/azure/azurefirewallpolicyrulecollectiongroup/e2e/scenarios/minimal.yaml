# Minimal AzureFirewallPolicyRuleCollectionGroup scenario: a group on the
# fixture policy carrying all THREE collection types -- a DNAT collection
# (translated address + port), a network collection whose rule sources
# from an IP GROUP REFERENCE (the extra fixture proves the FK seam live),
# and an application collection with L7 protocol pairs and FQDN
# destinations.
#
# The firewall-policy reference resolves against the registry
# prerequisite's captured outputs; the ip-group reference resolves against
# the extra fixture declared below (an optional seam, so it is an
# annotation fixture, never a registry prerequisite). The
# rule_collection_group_id output must populate on both engines.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureFirewallPolicyRuleCollectionGroup
metadata:
  name: planton-oss-e2e-azurefirewallpolicyrulecollectiongroup-smoke
  id: planton-oss-e2e-azurefirewallpolicyrulecollectiongroup-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurefirewallpolicyrulecollectiongroup
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "azureipgroup"
  tags:
    - planton-e2e
spec:
  firewallPolicyId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-fwpolicy
  name: planton-oss-e2e-fwrcg-smoke
  priority: 500
  applicationRuleCollections:
    - name: web-egress
      priority: 300
      action: ALLOW
      rules:
        - name: allow-github
          description: package pulls from github
          protocols:
            - type: HTTPS
              port: 443
          sourceAddresses:
            - "10.240.0.0/16"
          destinationFqdns:
            - "github.com"
            - "*.githubusercontent.com"
  networkRuleCollections:
    - name: core-egress
      priority: 200
      action: ALLOW
      rules:
        - name: allow-dns-from-branches
          protocols:
            - UDP
            - TCP
          sourceIpGroups:
            - valueFrom:
                name: planton-oss-e2e-azureipgroup-smoke
          destinationAddresses:
            - "8.8.8.8"
          destinationPorts:
            - "53"
  natRuleCollections:
    - name: inbound-dnat
      priority: 100
      rules:
        - name: rdp-to-jumpbox
          protocols:
            - TCP
          sourceAddresses:
            - "*"
          destinationAddress: "203.0.113.10"
          destinationPorts:
            - "3389"
          translatedAddress: "10.240.1.4"
          translatedPort: 3389
