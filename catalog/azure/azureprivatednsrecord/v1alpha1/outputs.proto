syntax = "proto3";

package dev.planton.azure.azureprivatednsrecord.v1alpha1;

// **AzurePrivateDnsRecordOutputs** captures the outputs from
// provisioning an Azure Private DNS record set.
message AzurePrivateDnsRecordOutputs {
  // The Azure Resource Manager ID of the record set.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/privateDnsZones/{zone}/{TYPE}/{name}
  // where {TYPE} is the record type (A, AAAA, CNAME, MX, PTR, SRV, TXT).
  string record_id = 1;

  // The fully qualified domain name of the record set, with a trailing
  // dot as DNS writes it (e.g. "db.internal.contoso.com." -- the zone
  // apex is the zone name itself). Resolvable only from virtual
  // networks linked to the zone.
  string fqdn = 2;
}
