# Minimal AzurePrivateDnsRecord scenario: one A record in the fixture
# private DNS zone, addressed by reference (the reference is the
# deploy-order edge; the fixture zone chains the fixture resource
# group). The address is an RFC-1918 literal -- ARM accepts any
# syntactically valid value; resolution is a data-plane concern the
# lane does not exercise. Record sets are free at rest.
apiVersion: azure.planton.dev/v1alpha1
kind: AzurePrivateDnsRecord
metadata:
  name: planton-oss-e2e-azureprivatednsrecord-smoke
  id: planton-oss-e2e-azureprivatednsrecord-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureprivatednsrecord
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  privateDnsZoneId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-pdns
  name: db
  a:
    - value: "10.0.0.5"
