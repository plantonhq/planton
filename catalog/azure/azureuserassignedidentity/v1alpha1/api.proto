syntax = "proto3";

package dev.planton.azure.azureuserassignedidentity.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureuserassignedidentity/v1alpha1/outputs.proto";
import "catalog/azure/azureuserassignedidentity/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureUserAssignedIdentity is the top-level API resource for an Azure
// user-assigned managed identity: a standalone, credential-free Azure AD
// identity that workloads authenticate as. It is modeled as a first-class
// composable resource so the identity, the grants it holds
// (AzureRoleAssignment), and the external workloads trusted to act as it
// (AzureFederatedIdentityCredential) are independent nodes in an
// environment's graph.
message AzureUserAssignedIdentity {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzureUserAssignedIdentity".
  string kind = 2 [(buf.validate.field).string.const = 'AzureUserAssignedIdentity'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Managed Identity specification.
  AzureUserAssignedIdentitySpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzureUserAssignedIdentityStatus status = 5;
}

// AzureUserAssignedIdentityStatus holds the deployment outputs.
message AzureUserAssignedIdentityStatus {
  // Outputs from the IaC deployment.
  AzureUserAssignedIdentityOutputs outputs = 1;
}
