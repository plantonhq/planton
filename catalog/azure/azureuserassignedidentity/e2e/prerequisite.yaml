# AzureUserAssignedIdentity install profile used as a prerequisite by composed
# kinds (declared via prerequisites: [AzureUserAssignedIdentity] in the
# kind registry). The E2E harness deploys this document (via the identity's
# Pulumi module) after its own prerequisite (the fixture resource group, whose
# name the resource_group reference below addresses), and captures its outputs
# -- principal_id and identity_id in particular -- for dependents' references
# to resolve against (the role-assignment component grants to the principal;
# the federated-credential component parents on the identity id). The identity
# is a bare fixture: any grant or trust rule a consumer needs, the consumer's
# own scenario provisions -- a component never mutates a resource it merely
# references.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureUserAssignedIdentity
metadata:
  name: planton-oss-e2e-azure-fixture-identity
  id: planton-oss-e2e-azure-fixture-identity
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureuserassignedidentity
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-azure-fixture-identity
