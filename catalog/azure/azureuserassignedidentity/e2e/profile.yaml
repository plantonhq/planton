apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azureuserassignedidentity
spec:
  # Composed live proof: the harness deploys the fixture resource group
  # (registry prerequisite), creates a tagged user-assigned identity in it,
  # verifies the identity via the ARM API (GetByID on the identity's ARM id
  # -- Microsoft.ManagedIdentity answers HEAD with 405, so the probe GETs),
  # destroys it, and verifies it is gone -- on both provisioners. Identities
  # are free and fast to create/delete.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
