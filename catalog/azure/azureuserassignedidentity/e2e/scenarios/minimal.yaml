# Minimal AzureUserAssignedIdentity scenario: a tagged identity in the
# fixture resource group.
#
# The resource-group reference resolves against the registry prerequisite's
# captured outputs through the field's default kind (AzureResourceGroup ->
# the fixture RG's name), keeping the scenario fully registry-driven. User
# tags are set to exercise the merge-over-metadata-tags path on both engines
# (user tags win on key collision). isolation_scope is left unset -- the
# default (usable from any region) is what real deployments overwhelmingly
# use, and the opt-in Regional mode is a plain in-place property.
#
# This scenario is distinct from the identity's prerequisite fixture profile
# (e2e/prerequisite.yaml): the fixture is what OTHER kinds' composed
# scenarios deploy; this scenario is the identity's own first-class proof.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureUserAssignedIdentity
metadata:
  name: planton-oss-e2e-azureuserassignedidentity-smoke
  id: planton-oss-e2e-azureuserassignedidentity-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureuserassignedidentity
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-uai-smoke
  tags:
    e2e-suite: azure
    purpose: smoke
