syntax = "proto3";

package dev.planton.azure.azurecosmosdbsqldatabase.v1alpha1;

// **AzureCosmosdbSqlDatabaseOutputs** captures the outputs of
// provisioning a Cosmos DB SQL (NoSQL) API database.
//
// No endpoint or credential outputs on purpose: connectivity and keys
// live on the ACCOUNT (AzureCosmosdbAccount's endpoint and key outputs);
// the database is addressed inside that connection by name.
message AzureCosmosdbSqlDatabaseOutputs {
  // The Azure Resource Manager ID of the database -- what
  // AzureCosmosdbSqlContainer's sql_database_id references, and the
  // management-plane scope for database-level operations.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.DocumentDB/databaseAccounts/{account}/sqlDatabases/{name}
  string sql_database_id = 1;

  // The database's name -- what SDK calls reference inside the
  // account's connection.
  string sql_database_name = 2;

  // The name of the Cosmos DB account the database lives in, parsed
  // from the resolved account ID -- saves consumers a second reference
  // when they need the account/database pair.
  string cosmosdb_account_name = 3;
}
