syntax = "proto3";

package dev.planton.azure.azurecosmosdbsqldatabase.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurecosmosdbsqldatabase/v1alpha1/outputs.proto";
import "catalog/azure/azurecosmosdbsqldatabase/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureCosmosdbSqlDatabase is the top-level API resource for a SQL
// (NoSQL) API database inside an Azure Cosmos DB account (referenced via
// cosmosdb_account_id) -- the namespace containers live in and the
// boundary for shared throughput. Containers themselves are
// AzureCosmosdbSqlContainer resources referencing this database.
message AzureCosmosdbSqlDatabase {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureCosmosdbSqlDatabase'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureCosmosdbSqlDatabaseSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureCosmosdbSqlDatabaseStatus status = 5;
}

// AzureCosmosdbSqlDatabaseStatus holds the deployment status and outputs.
message AzureCosmosdbSqlDatabaseStatus {
  // outputs
  AzureCosmosdbSqlDatabaseOutputs outputs = 1;
}
