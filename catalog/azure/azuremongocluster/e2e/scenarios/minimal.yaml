# Minimal AzureMongoCluster scenario: the Free-tier sandbox shape --
# one shard, HA disabled, 32 GiB, MongoDB 8.0, NativeAuth only, and
# one composed firewall rule (proving the keyed-child machinery
# live). NativeAuth only is LOAD-BEARING: ARM rejects a Free cluster
# listing MicrosoftEntraID (400 "Microsoft Entra ID authentication is
# not supported for 'Free' cluster tier" -- live-caught, now the
# mongo_cluster_free_tier_no_entra CEL); the Entra-enabled shape is
# proven live by the user kind's lane through its consumer-scoped M10
# prerequisite override. The cloud-side name carries the run-id token
# (the name is a GLOBAL hostname label). Free tier is
# one-per-subscription and region-limited -- if Azure rejects it in
# this region, the proof session bumps computeTier to M10
# (~cents/hour) under proof design authority. The throwaway admin
# password is a literal BY DESIGN (a run-scoped sandbox credential;
# real deployments reference a secret store).
apiVersion: azure.planton.dev/v1alpha1
kind: AzureMongoCluster
metadata:
  name: planton-oss-e2e-azuremongocluster-smoke
  id: planton-oss-e2e-azuremongocluster-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuremongocluster
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-mongo-${E2E_RUN_ID}
  region: eastus
  administratorUsername: mongoadmin
  administratorPassword:
    value: PlantonE2e-Thr0waway
  version: "8.0"
  computeTier: Free
  storageSizeInGb: 32
  shardCount: 1
  highAvailabilityMode: Disabled
  authenticationMethods:
    - NativeAuth
  firewallRules:
    - name: e2e-probe
      startIpAddress: 203.0.113.10
      endIpAddress: 203.0.113.10
