syntax = "proto3";

package dev.planton.azure.azuremongocluster.v1alpha1;

import "catalog/azure/azuremongocluster/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureMongoClusterIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureMongoClusterIacInput {
  // The Mongo cluster resource to deploy.
  AzureMongoCluster target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
