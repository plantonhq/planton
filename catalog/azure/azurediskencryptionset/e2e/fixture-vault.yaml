# A purge-protection-enabled Key Vault for the disk encryption set. Azure
# requires purge protection on any vault backing disk encryption. NOTE: a
# purge-protected vault cannot be purged on teardown (Azure holds it 7+
# days), which is why this kind's live E2E is profile-deferred -- this
# fixture is here for a throwaway-subscription run only.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureKeyVault
metadata:
  name: planton-oss-e2e-des-vault
  id: planton-oss-e2e-des-vault
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurekeyvault
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  vaultName: pltnosse2edesvlt
  rbacAuthorizationEnabled: true
  enabledForDiskEncryption: true
  purgeProtectionEnabled: true
