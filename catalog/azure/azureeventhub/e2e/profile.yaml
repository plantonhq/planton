apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azureeventhub
spec:
  # The harness deploys the fixture resource group, a SCENARIO-LOCAL
  # Event Hubs namespace, and a scenario-local storage account + capture
  # container (all declared via the e2e-prerequisites annotation --
  # namespace and storage-account names are globally unique, so neither
  # is a shared recreate-per-scenario registry prerequisite), creates a
  # hub with the hour-granular retention model and the full capture
  # block (service-managed SAS auth), verifies it via the ARM API,
  # destroys it, and verifies it is gone -- on both provisioners. Hubs
  # create in seconds; the namespace and account fixtures dominate the
  # lane.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
