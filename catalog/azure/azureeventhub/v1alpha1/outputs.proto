syntax = "proto3";

package dev.planton.azure.azureeventhub.v1alpha1;

// **AzureEventHubOutputs** captures the outputs of provisioning an
// event hub.
//
// `event_hub_id` is the ARM identity hub-scoped kinds reference
// (AzureEventHubConsumerGroup, AzureEventHubAuthorizationRule with
// event_hub_id) and the scope for hub-level data-plane role assignments.
message AzureEventHubOutputs {
  // The Azure Resource Manager ID of the event hub.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.EventHub/namespaces/{ns}/eventhubs/{name}
  //
  // The parent reference for consumer groups and hub-scoped authorization
  // rules, and the scope for hub-level data-plane RBAC.
  string event_hub_id = 1;

  // The hub's name -- what producers and consumers address within the
  // namespace (the Kafka topic name on the Kafka endpoint).
  string event_hub_name = 2;

  // The identifiers of the hub's partitions (e.g. "0", "1", ...), as
  // Azure assigned them -- what partition-aware consumers enumerate.
  repeated string partition_ids = 3;
}
