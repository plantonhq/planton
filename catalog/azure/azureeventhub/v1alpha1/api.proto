syntax = "proto3";

package dev.planton.azure.azureeventhub.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureeventhub/v1alpha1/outputs.proto";
import "catalog/azure/azureeventhub/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureEventHub is the top-level API resource for an event hub inside an
// Azure Event Hubs namespace -- one partitioned, replayable event stream.
// Consumer groups (AzureEventHubConsumerGroup) read it independently;
// hub-scoped SAS credentials (AzureEventHubAuthorizationRule) and
// data-plane role assignments target its ARM ID; capture archives it to
// Blob Storage.
message AzureEventHub {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureEventHub'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureEventHubSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureEventHubStatus status = 5;
}

// AzureEventHubStatus holds the deployment status and outputs.
message AzureEventHubStatus {
  // outputs
  AzureEventHubOutputs outputs = 1;
}
