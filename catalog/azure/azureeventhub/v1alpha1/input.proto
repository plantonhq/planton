syntax = "proto3";

package dev.planton.azure.azureeventhub.v1alpha1;

import "catalog/azure/azureeventhub/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureEventHubIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message AzureEventHubIacInput {
  // the catalog object to deploy to be deployed
  AzureEventHub target = 1;
  // provider-config for Azure authentication
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
