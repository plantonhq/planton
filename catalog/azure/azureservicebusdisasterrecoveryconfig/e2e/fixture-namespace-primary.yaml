# The PRIMARY Premium namespace for the geo-DR pairing scenario.
# PREMIUM is Azure's contract for geo-DR (both sides); capacity 1 /
# partitions 1 is the smallest Premium shape.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureServiceBusNamespace
metadata:
  name: planton-oss-e2e-sbdr-fixture-primary
  id: planton-oss-e2e-sbdr-fixture-primary
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureservicebusnamespace
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  namespaceName: pltn-oss-e2e-sbdr-pri
  sku: PREMIUM
  capacity: 1
  premiumMessagingPartitions: 1
