# The PARTNER Premium namespace -- a DIFFERENT region than the primary
# (Azure's pairing contract) and EMPTY at pairing time.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureServiceBusNamespace
metadata:
  name: planton-oss-e2e-sbdr-fixture-partner
  id: planton-oss-e2e-sbdr-fixture-partner
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureservicebusnamespace
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: westus2
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  namespaceName: pltn-oss-e2e-sbdr-sec
  sku: PREMIUM
  capacity: 1
  premiumMessagingPartitions: 1
