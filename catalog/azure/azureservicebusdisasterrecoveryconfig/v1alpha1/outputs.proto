syntax = "proto3";

package dev.planton.azure.azureservicebusdisasterrecoveryconfig.v1alpha1;

import "shared/options/options.proto";

// **AzureServiceBusDisasterRecoveryConfigOutputs** captures the
// outputs of provisioning a Service Bus geo-DR pairing.
//
// The alias connection strings are what DR-aware clients should hold:
// they address the failover-stable alias DNS name, so a failover needs no
// client reconfiguration. Keys come from the paired authorization rule
// (alias_authorization_rule_id, defaulting to the namespace root rule).
message AzureServiceBusDisasterRecoveryConfigOutputs {
  // The Azure Resource Manager ID of the disaster-recovery config (under
  // the primary namespace).
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.ServiceBus/namespaces/{ns}/disasterRecoveryConfigs/{alias}
  string disaster_recovery_config_id = 1;

  // The alias name -- the failover-stable DNS identity
  // `{alias_name}.servicebus.windows.net`.
  string alias_name = 2;

  // The primary connection string addressing the ALIAS -- what DR-aware
  // clients hold.
  string primary_connection_string_alias = 3 [(dev.planton.shared.options.sensitive) = true];

  // The secondary alias connection string -- the rotation partner.
  string secondary_connection_string_alias = 4 [(dev.planton.shared.options.sensitive) = true];

  // The paired rule's primary key (the same key the alias connection
  // string embeds).
  string default_primary_key = 5 [(dev.planton.shared.options.sensitive) = true];

  // The paired rule's secondary key -- the rotation partner.
  string default_secondary_key = 6 [(dev.planton.shared.options.sensitive) = true];
}
