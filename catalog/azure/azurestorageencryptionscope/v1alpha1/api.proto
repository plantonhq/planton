syntax = "proto3";

package dev.planton.azure.azurestorageencryptionscope.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurestorageencryptionscope/v1alpha1/outputs.proto";
import "catalog/azure/azurestorageencryptionscope/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureStorageEncryptionScope is the top-level API resource for an
// encryption scope -- a named encryption boundary inside an
// AzureStorageAccount (referenced via storage_account_id) that lets
// different data in one account encrypt under different keys.
// Containers and blobs opt in by name -- the multi-tenant and
// mixed-sensitivity key-isolation patterns.
message AzureStorageEncryptionScope {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureStorageEncryptionScope'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureStorageEncryptionScopeSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureStorageEncryptionScopeStatus status = 5;
}

// AzureStorageEncryptionScopeStatus holds the deployment status and outputs.
message AzureStorageEncryptionScopeStatus {
  // outputs
  AzureStorageEncryptionScopeOutputs outputs = 1;
}
