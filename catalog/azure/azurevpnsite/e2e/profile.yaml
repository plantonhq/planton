apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurevpnsite
spec:
  # Proven live on both engines (full lifecycle + blind single-id import
  # round-trip, zero-change plan). Measured: the site itself deploys in
  # ~45s and destroys in ~35s; the lane totals ~4-6m per engine, all of
  # it the fixture WAN chain. The name-keyed link_ids map populated
  # identically on both engines (both links, real ARM child IDs) -- the
  # wiring edge connection tunnels pin to, consumed live by the
  # connection lane's fixture. This kind is also a fixture of the VPN
  # family: the connection lane chains through its install profile.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
