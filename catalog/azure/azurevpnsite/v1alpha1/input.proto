syntax = "proto3";

package dev.planton.azure.azurevpnsite.v1alpha1;

import "catalog/azure/azurevpnsite/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureVpnSiteIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureVpnSiteIacInput {
  // The VPN site resource to deploy.
  AzureVpnSite target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
