syntax = "proto3";

package dev.planton.azure.azurevpnsite.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurevpnsite/v1alpha1/outputs.proto";
import "catalog/azure/azurevpnsite/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureVpnSite is the top-level API resource describing a VPN site --
// the Virtual WAN address-book entry for one branch location: its
// internet links, reachable address space, and terminating device.
message AzureVpnSite {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzureVpnSite".
  string kind = 2 [(buf.validate.field).string.const = 'AzureVpnSite'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // VPN site specification.
  AzureVpnSiteSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzureVpnSiteStatus status = 5;
}

// AzureVpnSiteStatus holds the deployment outputs.
message AzureVpnSiteStatus {
  // Outputs from the IaC deployment.
  AzureVpnSiteOutputs outputs = 1;
}
