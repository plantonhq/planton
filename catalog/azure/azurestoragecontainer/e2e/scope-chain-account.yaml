# Dedicated AzureStorageAccount for the container's encryption-scope
# chain scenario only (distinct from the minimal scenario's fixture --
# each scenario destroys and recreates its own parent, and account names
# are globally unique with a post-delete reservation).
apiVersion: azure.planton.dev/v1alpha1
kind: AzureStorageAccount
metadata:
  name: planton-oss-e2e-storagecontainer-scopechain-account
  id: planton-oss-e2e-storagecontainer-scopechain-account
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurestorageaccount
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  accountName: pltnosse2escchn
  replicationType: LRS
