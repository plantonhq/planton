# The AzureStorageEncryptionScope fixture for the container's
# encryption-scope chain scenario: a platform-managed-key scope on the
# chain's scenario-local account. The container under test references
# this scope's name output through its default_encryption_scope FK.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureStorageEncryptionScope
metadata:
  name: planton-oss-e2e-storagecontainer-scopechain-scope
  id: planton-oss-e2e-storagecontainer-scopechain-scope
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurestorageencryptionscope
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  storageAccountId:
    valueFrom:
      name: planton-oss-e2e-storagecontainer-scopechain-account
  scopeName: chainTenantScope
  source: MICROSOFT_STORAGE
