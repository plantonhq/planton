syntax = "proto3";

package dev.planton.azure.azurebackupcontainerstorageaccount.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurebackupcontainerstorageaccount/v1alpha1/outputs.proto";
import "catalog/azure/azurebackupcontainerstorageaccount/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureBackupContainerStorageAccount is the top-level API resource
// describing a storage account's registration with a Recovery
// Services vault as a backup container -- the prerequisite that lets
// the account's file shares be protected.
message AzureBackupContainerStorageAccount {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzureBackupContainerStorageAccount".
  string kind = 2 [(buf.validate.field).string.const = 'AzureBackupContainerStorageAccount'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Backup container registration specification.
  AzureBackupContainerStorageAccountSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzureBackupContainerStorageAccountStatus status = 5;
}

// AzureBackupContainerStorageAccountStatus holds the deployment outputs.
message AzureBackupContainerStorageAccountStatus {
  // Outputs from the IaC deployment.
  AzureBackupContainerStorageAccountOutputs outputs = 1;
}
