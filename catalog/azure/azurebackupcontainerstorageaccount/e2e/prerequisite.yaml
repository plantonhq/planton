# AzureBackupContainerStorageAccount install profile used as a fixture
# by composed kinds (declared via prerequisites:
# [AzureBackupContainerStorageAccount] in the kind registry -- the
# protected-file-share lane today). Registers the SHARED fixture
# storage account (planton-oss-e2e-azure-fixture-sa) with the fixture
# vault so dependent lanes find a registered container; the echoed
# storage_account_id output is what their references resolve against.
#
# COST AND TIME: registration is FREE and data-free; the Register LRO
# normally completes in a couple of minutes (the provider allows 30).
#
# TEARDOWN ORDER: unregister REFUSES while any of the account's shares
# are still protected -- the harness's reverse-order destroy
# (protections first) satisfies that by construction; the queue
# watch-list carries the soft-delete caveat (a just-deleted protection
# can be held 14 days and delay the unregister).
apiVersion: azure.planton.dev/v1alpha1
kind: AzureBackupContainerStorageAccount
metadata:
  name: planton-oss-e2e-azure-fixture-bcsa
  id: planton-oss-e2e-azure-fixture-bcsa
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurebackupcontainerstorageaccount
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  recoveryVaultName:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rsv
  storageAccountId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-sa
