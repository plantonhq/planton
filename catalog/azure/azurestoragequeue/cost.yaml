# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. The queue itself is free to hold -- Azure's
# Queue Storage price list has no meter for the queue object; queued data
# bills capacity and every API call bills a class-1 or class-2 operation
# meter, all on the parent storage account at the ACCOUNT's redundancy
# rates. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azurestoragequeue
spec:
  billing_model: usage_based
  cost_drivers:
    - field_path: storage_account_id
      sku_meter: queue data stored
      pricing_unit: GB-month
      impact: "Every GB of messages sitting in this queue bills the referenced account's queue capacity meter at the ACCOUNT's redundancy rate (LRS through RA-GZRS). Messages are small (64 KB max) and short-lived by design, so capacity is usually the minor term."
    - field_path: storage_account_id
      sku_meter: queue class 1 operations
      pricing_unit: per 10,000 operations
      impact: "Every message's life is a run of class-1 operations on the account's meter -- PutMessage on enqueue, UpdateMessage on lease extension, DeleteMessage on completion, plus CreateQueue, DeleteQueue, SetQueueMetadata, and ClearMessages -- so per-message cost scales with throughput times the operations in the processing pattern."
    - field_path: storage_account_id
      sku_meter: queue class 2 operations
      pricing_unit: per 10,000 operations
      impact: "Every GetMessage, GetMessages, PeekMessage, and GetQueueMetadata bills the account's class-2 meter -- INCLUDING polls that find the queue empty, which is why idle workers polling tight loops are the classic surprise line item; back off empty polls or use Functions' queue-trigger backoff."
  estimate_exclusions:
    - "queue data stored bills per GB-month on the account at its redundancy rate -- depth and dwell time no manifest can know"
    - "class-1 operations (enqueue, update, delete, queue management) and class-2 operations (gets, peeks, metadata reads) each bill per 10,000 on the account; empty-queue polling bills class-2 operations even when no message moves"
    - "geo-redundant accounts (GRS, RA-GRS, GZRS, RA-GZRS) add geo-replication data transfer per GB for queued data"
    - "consumers reading from outside Azure add standard bandwidth egress per GB"
  notes: "The queue is a free namespace over three account meters: capacity for what waits, class-1 operations for what moves, class-2 operations for what looks. An idle declared queue with no pollers bills exactly nothing -- but the same idle queue with a hot polling loop still bills class-2 operations, so the polling discipline of the CONSUMER, not the queue's declaration, decides the idle cost. All rates are keyed by the parent account's redundancy, chosen on the AzureStorageAccount kind."
