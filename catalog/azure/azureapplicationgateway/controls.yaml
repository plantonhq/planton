# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azureapplicationgateway
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A reverse proxy stores no customer data at rest -- requests flow through it. Its configuration and certificate material live in Azure's control plane under Microsoft-managed encryption; Key Vault-sourced certificates keep the private keys in the customer's own vault, referenced rather than copied.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No customer data at rest to key (see enc-at-rest); certificate custody under customer-managed keys is the referenced Key Vault's posture, a separate kind.
    - control_id: enc-in-transit
      status: configurable
      field_path: ssl_policy
      evidence:
        type: spec_default
        reference: HTTPS listeners terminate TLS with referenced certificates and HTTPS backend settings re-encrypt toward backends (end-to-end TLS); unset ssl_policy leaves Azure's default protocol policy, which still admits TLS 1.0/1.1 handshakes -- a PREDEFINED policy like AppGwSslPolicy20220101S (or a CUSTOM min_protocol_version) raises the floor to TLS 1.2+.
      notes: Plain-HTTP listeners are a legitimate spec choice (the internal-gateway preset uses one); the standard-https preset pairs an HTTP->HTTPS redirect with the 2022 strict predefined policy. Mutual TLS composes via ssl_profiles and trusted_client_certificates.
    - control_id: no-public-access
      status: configurable
      field_path: frontend_ip_configurations
      evidence:
        type: spec_default
        reference: Each frontend is public (a referenced Standard public IP) or private (an address in the gateway subnet) -- spec validation enforces exactly one per frontend. A gateway declaring only private frontends has no internet endpoint; the internal-gateway preset is exactly that, with a static subnet address for internal DNS.
      notes: private_link_configurations extends private reach across networks without peering or public exposure.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The spec carries no source-IP filter by design, matching Azure's model -- network-level restriction is NSG territory on the gateway's dedicated subnet (its own component), and request-level IP/geo/rate rules live on the referenced AzureWebApplicationFirewallPolicy. Listeners select traffic by host name, which is routing, not source restriction.
    - control_id: edge-protection
      status: configurable
      field_path: firewall_policy_id
      evidence:
        type: spec_default
        reference: The WAF_V2 SKU enforces a referenced AzureWebApplicationFirewallPolicy inline -- gateway-wide via firewall_policy_id, overridable per listener and per URL path rule (most specific wins); spec validation rejects a policy reference on any other SKU. Unset means no request filtering at the gateway.
      notes: The waf-path-routing preset attaches an org-standard policy gateway-wide. The policy document itself (managed rule sets, custom rules, exclusions) is the referenced component's contract.
    - control_id: rbac
      status: not_applicable
      notes: Management access is subscription/resource-group RBAC posture, not a component choice; the gateway exposes no authentication plane of its own toward the traffic it proxies.
    - control_id: workload-identity
      status: configurable
      field_path: identity
      evidence:
        type: spec_default
        reference: A user-assigned managed identity lets the gateway fetch TLS certificates from Key Vault with short-lived Entra tokens (GET on the vault's secrets) instead of embedding PFX blobs and passwords in the manifest -- and versionless vault references make renewals propagate without a redeploy.
      notes: Both public-facing presets carry a user-assigned identity with Key Vault-sourced certificates; inline PFX data remains the spec's fallback for certificates not yet in a vault.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The gateway authenticates no clients of its own -- application authentication is backend territory, and mutual TLS via ssl_profiles is an additive verification layer, not a legacy path to disable. Weak TLS protocol versions are covered under enc-in-transit.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Management-plane changes land in the Azure Activity Log automatically as subscription-level posture. Per-request access logs, WAF match logs, and performance logs are emitted through a diagnostic setting on the gateway -- a separate kind targeting the application_gateway_id output.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Azure publishes gateway metrics -- throughput, current and estimated-billed capacity units, compute units, connection counts, backend response status, and unhealthy host counts -- to Azure Monitor automatically for every v2 gateway; no configuration exists to disable them.
      notes: Backend health is also queryable on demand; probes (custom or Azure's default) feed the unhealthy-host metrics.
    - control_id: backup-recovery
      status: not_applicable
      notes: The gateway holds routing configuration, not data -- the manifest recreates every listener, rule, and certificate reference declaratively. State that must survive lives on the backends.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: configurable
      field_path: zones
      evidence:
        type: spec_default
        reference: Listing zones (e.g. ["1", "2", "3"]) spreads v2 instances across availability zones so a zone loss degrades capacity instead of availability; an empty list deploys regionally with no zone guarantee. Fixed at creation -- changing zones replaces the gateway.
      notes: Both public-facing presets pin all three zones; the BASIC SKU does not support zones.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither the Network API nor this spec offers a deletion-protection flag for an application gateway; Azure resource locks are subscription-side governance outside the manifest. Deleting the gateway leaves the referenced public IPs, subnet, WAF policy, and certificates intact.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- Microsoft operates and patches the v2 gateway platform (data plane, TLS stack, WAF engine on WAF_V2); no customer-visible patch surface exists.
