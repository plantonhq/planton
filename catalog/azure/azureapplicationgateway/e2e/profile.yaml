apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azureapplicationgateway
spec:
  # The harness deploys the fixture chain (resource group -> virtual
  # network -> the dedicated gateway subnet, per the registry
  # prerequisite) plus the scenario-declared extra fixtures (public IP;
  # the WAF scenario adds the fixture WAF policy), creates the gateway,
  # verifies it via the ARM API (generic GetByID on the gateway's ARM
  # id), destroys it, and verifies it is gone -- on both provisioners.
  # Application Gateway is Azure's slowest networking resource: applies
  # run 15-25 minutes and destroys 5-10, so each scenario is sized for
  # ~35 minutes and suites should run scenarios as standalone go-test
  # invocations rather than one shared timeout.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 50
