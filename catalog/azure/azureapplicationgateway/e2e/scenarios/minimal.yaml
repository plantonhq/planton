# Minimal AzureApplicationGateway scenario: a fixed-capacity Standard_v2
# gateway with one public HTTP listener routed to one pool.
#
# The dedicated-subnet reference resolves against the registry
# prerequisite chain (fixture RG -> VNet -> subnet); the public IP is a
# scenario-declared extra fixture (see the annotation) because frontends
# are OPTIONAL references -- no address kind belongs in the registry
# prerequisites. capacity 1 keeps the run cheap; the pool carries a
# literal address so the full listener -> rule -> settings -> pool wiring
# deploys without member-side fixtures.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureApplicationGateway
metadata:
  name: planton-oss-e2e-azureagw-smoke
  id: planton-oss-e2e-azureagw-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureapplicationgateway
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AzurePublicIp"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-agw-smoke
  subnetId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-subnet
  sku: STANDARD_V2
  capacity: 1
  frontendIpConfigurations:
    - name: public
      publicIpAddressId:
        valueFrom:
          name: planton-oss-e2e-azure-fixture-pip
  frontendPorts:
    - name: http
      port: 80
  backendAddressPools:
    - name: web
      ipAddresses:
        - 10.240.250.100
  backendHttpSettings:
    - name: web-settings
      port: 8080
      protocol: HTTP
      requestTimeout: 30
  httpListeners:
    - name: http-listener
      frontendIpConfigurationName: public
      frontendPortName: http
      protocol: HTTP
  requestRoutingRules:
    - name: http-rule
      ruleType: BASIC_ROUTING
      httpListenerName: http-listener
      priority: 100
      backendAddressPoolName: web
      backendHttpSettingsName: web-settings
  tags:
    e2e-suite: azure
    purpose: smoke
