    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureSubnet,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.subnet_id"
  ];

  // For STATIC allocation: the fixed address inside the subnet.
  string private_ip_address = 3;

  // How the address is assigned.
  AzureApplicationGatewayIpAllocation private_ip_address_allocation = 4 [(buf.validate.field).required = true];

  // Whether this is the primary allocation of the configuration.
  bool primary = 5;

  option (buf.validate.message).cel = {
    id: "appgw_private_link_static_requires_address"
    message: "STATIC private_ip_address_allocation requires private_ip_address (and DYNAMIC forbids it)"
    expression: "(this.private_ip_address_allocation == 2) == (this.private_ip_address != '')"
  };
}

// Request/response buffering. Both fields must be set when the block is
// declared (azurerm's contract).
message AzureApplicationGatewayGlobalConfiguration {
  // Whether the gateway buffers the full request before forwarding.
  // Azure's default (block absent) is true; false streams requests to
  // backends.
  optional bool request_buffering_enabled = 1;

  // Whether the gateway buffers the full response before replying.
  // Azure's default (block absent) is true; false streams responses to
  // clients.
  optional bool response_buffering_enabled = 2;

  option (buf.validate.message).cel = {
    id: "appgw_global_both_required"
    message: "declare both request_buffering_enabled and response_buffering_enabled when the block is present"
    expression: "has(this.request_buffering_enabled) && has(this.response_buffering_enabled)"
  };
}

// Gateway SKUs (name and tier move together on the v2 platform; the
// retired v1 SKUs are not modeled).
enum AzureApplicationGatewaySku {
  // Not specified -- invalid; the SKU is the gateway's fundamental
  // choice.
  azure_application_gateway_sku_unspecified = 0;

  // Small fixed-capacity gateway (1-2 units): no autoscale, mTLS, or URL
  // rewriting. For dev/test and small workloads.
  BASIC = 1;

  // The general-purpose v2 platform: autoscale, zone redundancy,
  // rewrites, mTLS, Private Link.
  STANDARD_V2 = 2;

  // STANDARD_V2 plus Web Application Firewall enforcement (attach an
  // AzureWebApplicationFirewallPolicy).
  WAF_V2 = 3;
}

// Protocols (shared vocabulary; field-level rules restrict each use).
enum AzureApplicationGatewayProtocol {
  // Not specified -- invalid; declare the protocol.
  azure_application_gateway_protocol_unspecified = 0;

  // Plain HTTP (L7).
  HTTP = 1;

  // TLS-terminated HTTPS (L7).
  HTTPS = 2;

  // Raw TCP proxying (L4).
  TCP = 3;

  // TLS proxying (L4).
  TLS = 4;
}

// L7 routing-rule types.
enum AzureApplicationGatewayRequestRoutingRuleType {
  // Not specified -- invalid; declare the rule type.
  azure_application_gateway_request_routing_rule_type_unspecified = 0;

  // Everything from the listener goes to one backend or redirect (ARM:
  // "Basic").
  BASIC_ROUTING = 1;

  // The url_path_map picks per-path destinations (ARM:
  // "PathBasedRouting").
  PATH_BASED_ROUTING = 2;
}

// Private-address allocation methods.
enum AzureApplicationGatewayIpAllocation {
  // Not specified: DYNAMIC.
  azure_application_gateway_ip_allocation_unspecified = 0;

  // Azure assigns an address from the subnet.
  DYNAMIC = 1;

  // The declared private_ip_address is used.
  STATIC = 2;
}

// Managed-identity flavors.
enum AzureApplicationGatewayIdentityType {
  // Not specified: the gateway has no managed identity.
  azure_application_gateway_identity_type_unspecified = 0;

  // Azure-managed identity created and rotated with the gateway.
  SYSTEM_ASSIGNED = 1;

  // Bring-your-own user-assigned identities (set identity_ids) --
  // required for Key Vault certificate references.
  USER_ASSIGNED = 2;

  // Both a system-assigned identity and the listed user-assigned ones.
  SYSTEM_AND_USER_ASSIGNED = 3;
}

// TLS policy types.
enum AzureApplicationGatewaySslPolicyType {
  // Not specified: Azure's default TLS policy (optionally narrowed by
  // disabled_protocols).
  azure_application_gateway_ssl_policy_type_unspecified = 0;

  // A Microsoft-maintained named policy (set policy_name).
  PREDEFINED = 1;

  // A custom minimum protocol + cipher-suite list (TLS 1.0-1.2).
  CUSTOM = 2;

  // A custom policy with TLS 1.3 support.
  CUSTOM_V2 = 3;
}

// TLS protocol versions.
enum AzureApplicationGatewayTlsProtocol {
  // Not specified.
  azure_application_gateway_tls_protocol_unspecified = 0;

  // TLS 1.0 (legacy -- disable in new deployments).
  TLS_V1_0 = 1;

  // TLS 1.1 (legacy).
  TLS_V1_1 = 2;

  // TLS 1.2 -- the standard floor.
  TLS_V1_2 = 3;

  // TLS 1.3 (CUSTOM_V2 policies only).
  TLS_V1_3 = 4;
}

// Client-certificate revocation checking.
enum AzureApplicationGatewayClientRevocationCheck {
  // Not specified: no revocation checking (Azure's default).
  azure_application_gateway_client_revocation_check_unspecified = 0;

  // Check revocation via OCSP.
  OCSP = 1;
}

// HTTP redirect types.
enum AzureApplicationGatewayRedirectType {
  // Not specified -- invalid; declare the redirect status.
  azure_application_gateway_redirect_type_unspecified = 0;

  // 301 Moved Permanently -- cached by clients; the production HTTP ->
  // HTTPS choice.
  PERMANENT = 1;

  // 302 Found.
  FOUND = 2;

  // 303 See Other.
  SEE_OTHER = 3;

  // 307 Temporary Redirect -- preserves the request method.
  TEMPORARY = 4;
}

// URL components a rewrite can limit itself to.
enum AzureApplicationGatewayRewriteRuleUrlComponent {
  // Not specified: rewrite whatever of path/query_string is set.
  azure_application_gateway_rewrite_rule_url_component_unspecified = 0;

  // Rewrite only the path (ARM: "path_only").
  PATH_ONLY = 1;

  // Rewrite only the query string (ARM: "query_string_only").
  QUERY_STRING_ONLY = 2;
}

// Gateway-generated statuses a custom error page can replace.
enum AzureApplicationGatewayCustomErrorStatusCode {
  // Not specified -- invalid; declare the status.
  azure_application_gateway_custom_error_status_code_unspecified = 0;

  // 400 Bad Request.
  HTTP_STATUS_400 = 1;

  // 403 Forbidden (the page WAF blocks serve).
  HTTP_STATUS_403 = 2;

  // 404 Not Found.
  HTTP_STATUS_404 = 3;

  // 405 Method Not Allowed.
  HTTP_STATUS_405 = 4;

  // 408 Request Timeout.
  HTTP_STATUS_408 = 5;

  // 500 Internal Server Error.
  HTTP_STATUS_500 = 6;

  // 502 Bad Gateway (no healthy backends).
  HTTP_STATUS_502 = 7;

  // 503 Service Unavailable.
  HTTP_STATUS_503 = 8;

  // 504 Gateway Timeout.
  HTTP_STATUS_504 = 9;
}
