syntax = "proto3";

package dev.planton.azure.azureapplicationgateway.v1alpha1;

// **AzureApplicationGatewayOutputs** captures the outputs of
// provisioning an Azure Application Gateway.
//
// The name-keyed maps are the composition seams: backend-pool membership
// is expressed from the member side in Azure's model, so a network
// interface or a virtual machine scale set references
// `status.outputs.backend_address_pool_ids.<pool-name>` to join a pool,
// and a frontend's ARM ID chains through
// `status.outputs.frontend_ip_configuration_ids.<frontend-name>`.
//
// A public frontend's ADDRESS is not exported here -- it lives on the
// referenced AzurePublicIp resource (its ip_address output), which DNS
// records point at.
message AzureApplicationGatewayOutputs {
  // The Azure Resource Manager ID of the Application Gateway.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/applicationGateways/{name}
  string application_gateway_id = 1;

  // The name of the Application Gateway.
  string application_gateway_name = 2;

  // The ARM ID of each backend address pool, keyed by the pool's name.
  // THE membership seam: NIC ip_configurations and scale-set network
  // profiles reference a pool ID here to join the pool.
  // Example valueFrom fieldPath: status.outputs.backend_address_pool_ids.web
  map<string, string> backend_address_pool_ids = 3;

  // The ARM ID of each frontend IP configuration, keyed by the
  // frontend's name.
  // Example valueFrom fieldPath: status.outputs.frontend_ip_configuration_ids.public
  map<string, string> frontend_ip_configuration_ids = 4;

  // The first private frontend's address -- what internal DNS records
  // point at. Empty when every frontend is public.
  string private_ip_address = 5;

  // The private addresses of ALL private frontends, in declaration
  // order.
  repeated string private_ip_addresses = 6;
}
