syntax = "proto3";

package dev.planton.azure.azurefrontdoorsecuritypolicy.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurefrontdoorsecuritypolicy/v1alpha1/outputs.proto";
import "catalog/azure/azurefrontdoorsecuritypolicy/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureFrontDoorSecurityPolicy is the top-level API resource for a
// security policy inside an Azure Front Door profile (referenced via
// profile_id) -- the association that attaches a Front Door WAF policy
// (AzureFrontDoorFirewallPolicy) to the endpoint and custom-domain
// hostnames the profile serves. The WAF enforces nothing until this
// association exists.
message AzureFrontDoorSecurityPolicy {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureFrontDoorSecurityPolicy'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureFrontDoorSecurityPolicySpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureFrontDoorSecurityPolicyStatus status = 5;
}

// AzureFrontDoorSecurityPolicyStatus holds the deployment status and outputs.
message AzureFrontDoorSecurityPolicyStatus {
  // outputs
  AzureFrontDoorSecurityPolicyOutputs outputs = 1;
}
