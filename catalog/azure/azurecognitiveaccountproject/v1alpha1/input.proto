syntax = "proto3";

package dev.planton.azure.azurecognitiveaccountproject.v1alpha1;

import "catalog/azure/azurecognitiveaccountproject/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureCognitiveAccountProjectIacInput is the input to the IaC
// modules (Pulumi/Terraform). It contains the target resource
// definition and Azure provider credentials.
message AzureCognitiveAccountProjectIacInput {
  // The AI Foundry project resource to deploy.
  AzureCognitiveAccountProject target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
