# The PRIMARY namespace of the geo-DR pairing (eastus). Scenario-local:
# namespace names are globally unique with a post-delete hold.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureEventHubNamespace
metadata:
  name: planton-oss-e2e-ehdr-fixture-primary
  id: planton-oss-e2e-ehdr-fixture-primary
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureeventhubnamespace
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  namespaceName: pltn-oss-e2e-ehdr-pri
  sku: STANDARD
