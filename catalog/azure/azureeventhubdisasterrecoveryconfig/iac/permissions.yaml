# Least-privilege permissions the IaC runner's Azure principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: azureeventhubdisasterrecoveryconfig
spec:
  azure:
    groups:
      - purpose: ManageDisasterRecoveryConfig
        actions:
          - Microsoft.EventHub/namespaces/disasterRecoveryConfigs/read
          - Microsoft.EventHub/namespaces/disasterRecoveryConfigs/write
          - Microsoft.EventHub/namespaces/disasterRecoveryConfigs/delete
        provenance: derived
        notes: Covers azurerm_eventhub_namespace_disaster_recovery_config -- create the pairing under the primary namespace (parsed from primary_namespace_id), poll it to the Succeeded provisioning state, read/refresh, and destroy.
      - purpose: BreakAndReleasePairing
        actions:
          - Microsoft.EventHub/namespaces/disasterRecoveryConfigs/breakPairing/action
          - Microsoft.EventHub/namespaces/disasterrecoveryconfigs/checkNameAvailability/action
        provenance: derived
        notes: The provider's lifecycle choreography beyond plain CRUD -- changing partner_namespace_id break-pairs before re-pairing, destroy break-pairs before deleting, and after deletion the provider polls the namespace-scoped name-availability check until Azure releases the alias name. Spellings match Azure's operation inventory (lowercase disasterrecoveryconfigs on the name-availability action).
