# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azureeventhubdisasterrecoveryconfig
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The pairing stores no data of its own; the metadata it replicates rests encrypted inside each namespace's control plane.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest of its own to key; customer-managed keys are the namespaces' posture (AzureEventHubNamespaceCustomerManagedKey).
    - control_id: enc-in-transit
      status: not_applicable
      notes: Clients connect through the alias hostname ({alias_name}.servicebus.windows.net) to whichever namespace is primary, where TLS is enforced; the replication channel between namespaces is Microsoft's internal service traffic.
    - control_id: no-public-access
      status: not_applicable
      notes: The alias resolves to the current primary namespace; network exposure (public access, private endpoints) is each namespace's own posture.
    - control_id: restricted-ingress
      status: not_applicable
      notes: Inbound restriction lives on the namespaces' network rule sets; the pairing adds no reachable surface beyond the DNS alias.
    - control_id: edge-protection
      status: not_applicable
      notes: No traffic terminates at the pairing; there is no request-filtering attachment point.
    - control_id: rbac
      status: not_applicable
      notes: Management access is subscription/resource-group RBAC posture, not a component choice; the pairing exposes no authentication plane of its own (failover is authorized by control-plane RBAC on the secondary namespace).
    - control_id: workload-identity
      status: not_applicable
      notes: The pairing runs no workloads and holds no credentials of its own.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths of its own; alias-addressed connection strings inherit the rules and switches of the namespaces they front.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Pairing creation, failover, and break-pair are control-plane operations landing in the Azure Activity Log as subscription-level posture.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The pairing emits no metrics of its own; replication health surfaces through the namespaces' provisioning and role state, read via their APIs.
    - control_id: backup-recovery
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Creating the pairing IS the recovery mechanism -- Azure continuously replicates namespace metadata (event hubs, consumer groups, authorization rules) from primary to partner, and a failover triggered from the secondary re-points the stable alias with no client reconfiguration.
      notes: Geo-DR replicates METADATA only -- event data does not copy to the partner; streams needing data durability beyond the primary region pair this with per-hub capture (AzureEventHub's capture_description) or application-level dual writes.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: Replication is continuous rather than a retained backup series -- there is no backup age or count to govern (see backup-recovery for what replicates).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The pairing spans failure domains BIGGER than zones by contract -- Azure requires the primary and partner namespaces to live in different regions, and the alias survives the loss of the entire primary region via secondary-side failover.
      notes: Zone-level redundancy WITHIN each region remains each namespace's own posture; this kind adds the cross-region layer on top.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Azure nor this spec offers a deletion-protection flag. Deleting the pairing is designed to be graceful -- it breaks the pair, both namespaces keep running independently, and the alias name releases after Azure's break-pair choreography completes.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed PaaS -- Microsoft operates and patches the replication machinery and alias DNS; no customer-visible patch surface exists.
