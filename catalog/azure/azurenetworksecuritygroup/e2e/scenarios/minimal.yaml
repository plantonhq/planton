# Minimal AzureNetworkSecurityGroup scenario: a three-rule group in the
# fixture resource group.
#
# The resource-group reference resolves against the registry prerequisite's
# captured outputs through the field's default kind. The three rules
# deliberately exercise the addressing/port forms: a singular-port HTTPS
# allow, a plural-ports + plural-prefixes web allow (the list forms both
# engines must send as lists), and a service-tag deny (service tags are
# singular-only). User tags exercise the merge-over-metadata-tags path.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureNetworkSecurityGroup
metadata:
  name: planton-oss-e2e-azurenetworksecuritygroup-smoke
  id: planton-oss-e2e-azurenetworksecuritygroup-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurenetworksecuritygroup
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-nsg-smoke
  securityRules:
    - name: allow-https-inbound
      description: Allow HTTPS from anywhere (singular port form)
      priority: 100
      direction: INBOUND
      access: ALLOW
      protocol: TCP
      destinationPortRange: "443"
    - name: allow-web-from-corp
      description: Allow web ports from two corp ranges (plural forms)
      priority: 200
      direction: INBOUND
      access: ALLOW
      protocol: TCP
      destinationPortRanges:
        - "80"
        - "8080"
      sourceAddressPrefixes:
        - "10.1.0.0/16"
        - "10.2.0.0/16"
    - name: deny-internet-inbound
      description: Deny everything else from the internet service tag
      priority: 4000
      direction: INBOUND
      access: DENY
      protocol: ANY
      sourceAddressPrefix: Internet
      destinationPortRange: "*"
  tags:
    e2e-suite: azure
    purpose: smoke
