apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurenetworksecuritygroup
spec:
  # The harness deploys the fixture resource group (registry prerequisite),
  # creates an NSG carrying a rule set that exercises the singular and
  # plural port/prefix forms and the deny path, verifies it via the ARM API
  # (generic GetByID on the group's ARM id), destroys it, and verifies it
  # is gone -- on both provisioners. NSGs are free and fast.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
