# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azuredatafactory
spec:
  billing_model: hybrid
  baseline_charges:
    - service_name: Virtual Network
      sku_meter: standard private endpoint
      pricing_unit: hours
      description: "Every managed_private_endpoints entry is an Azure Private Link private endpoint living inside the factory's managed virtual network, and Private Link bills each endpoint 0.01 USD per hour of EXISTENCE (Global meter) -- about 7.30 USD a month per endpoint from the moment it is created, approved or not, traffic or none. A factory with no managed private endpoints has no baseline: the factory object itself carries no meter."
  cost_drivers:
    - field_path: managed_private_endpoints
      sku_meter: standard private endpoint
      pricing_unit: hours
      impact: "Each entry adds one endpoint-hour meter (0.01 USD/hour) plus per-GB data-processing charges (0.01 USD/GB inbound and outbound) on the traffic that rides it. Entries are ForceNew individually -- churn replaces endpoints, it does not stack fees."
    - field_path: managed_virtual_network_enabled
      sku_meter: managed VNET pipeline activity
      pricing_unit: hours
      impact: "No meter of its own, but it moves pipeline EXECUTION onto the managed-VNET meter class: activity runs stay 1.00 USD per 1,000, while Pipeline Activity jumps from 0.005 to 1.00 USD/hour and External Pipeline Activity from 0.00025 to 1.00 USD/hour (eastus) -- the price of executing inside Azure-managed private networking. Data movement stays 0.25 USD per DIU-hour."
    - field_path: global_parameters
      sku_meter: data factory operations read/write
      pricing_unit: 50K entities
      impact: "Factory metadata (parameters, credentials, and every pipeline/dataset/linked-service entity inside) bills the operations meters on authoring and monitoring activity -- 0.50 USD per 50,000 read/write entity operations, 0.25 USD per 50,000 monitoring run records (eastus). Rounding-error territory for humans; visible only under IaC or CI churn at scale."
  free_tier: "None. Data Factory V2 has no free grant on runs, operations, or private endpoint hours."
  estimate_exclusions:
    - "pipeline execution follows workload: orchestration runs (1.00 USD per 1,000 activity runs, cloud and managed-VNET alike; 1.50 self-hosted), data movement (0.25 USD per DIU-hour cloud/managed-VNET, 0.10 self-hosted), pipeline and external activity hours, and data flow vCore-hours (0.19225-0.34275 USD by compute class, 8-vCore minimum) all bill per run on the pipeline/trigger/dataflow components and the traffic they process"
    - "per-GB data processed through each managed private endpoint (0.01 USD/GB in and out) follows pipeline traffic"
    - "an inactive pipeline (no trigger association, zero runs for a month) bills 0.80 USD/month -- a per-pipeline charge on the pipeline components"
    - "the customer_managed_key's Key Vault key bills on the AzureKeyVaultKey kind; the Purview account behind purview_id, the git repositories, and the referenced user-assigned identities bill (or not) on their own"
  notes: "The factory is the workspace, and empty workspaces are free -- what flips this component to hybrid is managed_private_endpoints: the committed preset 02-private-etl-workspace pins one endpoint to a data lake's blob service, and Private Link bills endpoint-hours regardless of traffic (Microsoft's Private Link cost-optimization guidance names idle endpoints as the standing cost; ADF's managed private endpoints are ordinary private endpoints created inside the managed VNet and file under the factory in Cost Analysis). Preset 01 (managed VNet, no endpoints) is genuinely zero-committed. All rates read from the Azure Retail Prices API (serviceName 'Azure Data Factory v2' eastus; 'Virtual Network' Global) and Microsoft's Data Factory + Private Link pricing pages on 2026-08-18."
