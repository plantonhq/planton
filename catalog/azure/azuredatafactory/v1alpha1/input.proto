syntax = "proto3";

package dev.planton.azure.azuredatafactory.v1alpha1;

import "catalog/azure/azuredatafactory/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureDataFactoryIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureDataFactoryIacInput {
  // The Data Factory resource to deploy.
  AzureDataFactory target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
