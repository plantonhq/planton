# Minimal AzurePrivateDnsZone scenario: a tagged custom internal zone in
# the fixture resource group.
#
# The resource-group reference resolves against the registry prerequisite's
# captured outputs through the field's default kind (AzureResourceGroup ->
# the fixture RG's name), keeping the scenario fully registry-driven. A
# custom internal name (not a privatelink one) keeps the scenario
# self-descriptive; user tags exercise the merge-over-metadata-tags path on
# both engines. The SOA block is left unset -- Azure's standard SOA is what
# real deployments overwhelmingly take, and the block is a plain
# written-at-creation property the offline parity audit covers.
#
# This scenario is distinct from the zone's prerequisite fixture profile
# (e2e/prerequisite.yaml): the fixture is what OTHER kinds' composed
# scenarios (the virtual network link) deploy; this scenario is the zone's
# own first-class proof.
apiVersion: azure.planton.dev/v1alpha1
kind: AzurePrivateDnsZone
metadata:
  name: planton-oss-e2e-azureprivatednszone-smoke
  id: planton-oss-e2e-azureprivatednszone-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureprivatednszone
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: e2e-smoke.planton.internal
  tags:
    e2e-suite: azure
    purpose: smoke
