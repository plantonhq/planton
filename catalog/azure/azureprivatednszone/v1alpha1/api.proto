syntax = "proto3";

package dev.planton.azure.azureprivatednszone.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureprivatednszone/v1alpha1/outputs.proto";
import "catalog/azure/azureprivatednszone/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzurePrivateDnsZone is the top-level API resource for an Azure Private DNS
// zone: name resolution inside virtual networks, enabling Private Link
// connectivity for Azure PaaS services and custom internal DNS for VM
// hostname resolution. It is modeled as a first-class composable resource so
// the zone and its network attachments
// (AzurePrivateDnsZoneVirtualNetworkLink) are independent nodes in an
// environment's graph -- one zone serves many networks.
message AzurePrivateDnsZone {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzurePrivateDnsZone".
  string kind = 2 [(buf.validate.field).string.const = 'AzurePrivateDnsZone'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Private DNS zone specification.
  AzurePrivateDnsZoneSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzurePrivateDnsZoneStatus status = 5;
}

// AzurePrivateDnsZoneStatus holds the deployment outputs.
message AzurePrivateDnsZoneStatus {
  // Outputs from the IaC deployment.
  AzurePrivateDnsZoneOutputs outputs = 1;
}
