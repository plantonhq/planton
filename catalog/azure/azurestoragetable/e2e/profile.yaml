apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurestoragetable
spec:
  # The harness deploys the fixture resource group and a SCENARIO-LOCAL
  # storage account (declared via the e2e-prerequisites annotation --
  # account names are globally unique and Azure briefly holds a
  # just-deleted name, so the account is never a shared recreate-per-
  # scenario registry prerequisite), creates the table, verifies it via
  # the ARM API (the management plane exposes a table read proxy under
  # tableServices/default even though the providers create tables through
  # the data plane), destroys it, and verifies it is gone -- on both
  # provisioners. The fixture account keeps shared keys enabled (Azure's
  # default) -- the providers drive table create/ACLs through the data
  # plane with shared-key auth.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
