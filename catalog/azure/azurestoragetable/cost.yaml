# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. The table itself is free to hold -- Azure's
# Table Storage price list has no meter for the table object; entity data
# bills capacity and every API call bills the transaction meter, all on the
# parent storage account at the ACCOUNT's redundancy rates.
# Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azurestoragetable
spec:
  billing_model: usage_based
  cost_drivers:
    - field_path: storage_account_id
      sku_meter: table data stored
      pricing_unit: GB-month
      impact: "Every GB of entities in this table bills the referenced account's table capacity meter at the ACCOUNT's redundancy rate (LRS through RA-GZRS). Capacity is the meter that never sleeps -- an append-heavy table (audit trails, telemetry) accrues it monotonically unless the application prunes."
    - field_path: storage_account_id
      sku_meter: table transactions
      pricing_unit: per 10,000 transactions
      impact: "Every operation against the table -- reads, writes, deletes, scans, batches -- counts as a transaction on the account's meter (Microsoft's own words on the Tables price page: any type of operation is counted, including deletes). Tables on accounts using the account-scoped encryption key split this into separate per-type meters (batch write, write, read, scan, list, delete per 10,000) at their own rates."
    - field_path: acls
      sku_meter: table transactions
      pricing_unit: per 10,000 transactions
      impact: "Stored access policies are free to declare -- but every SAS-authorized request they anchor bills the same transaction meter as any other call. Policy-anchored access changes WHO can generate metered traffic and how it is revoked, never the rates."
  estimate_exclusions:
    - "table data stored bills per GB-month on the account at its redundancy rate -- entity volume no manifest can know"
    - "transactions bill per 10,000 on the account, and EVERY operation type counts -- reads, writes, deletes, scans, and batch operations alike; accounts using the account-scoped encryption key for tables meter batch-write, write, read, scan, list, and delete operations separately"
    - "geo-redundant accounts add geo-replication data transfer per GB for table data"
    - "consumers reading from outside Azure add standard bandwidth egress per GB"
  notes: "The table is a free namespace over two account meters: capacity for what is stored, transactions for what is touched. There is no provisioned throughput and no capacity floor -- the serverless economics that separate Table Storage from Cosmos DB's Table API -- so a declared, empty, untouched table bills exactly nothing. One operational contract worth knowing at cost-review time: the official modules deploy the table over the account's shared-key data plane, so the parent account must keep shared_access_key_enabled true (Azure's default) for deploys to work."
