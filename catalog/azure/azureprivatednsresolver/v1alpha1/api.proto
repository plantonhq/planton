syntax = "proto3";

package dev.planton.azure.azureprivatednsresolver.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureprivatednsresolver/v1alpha1/outputs.proto";
import "catalog/azure/azureprivatednsresolver/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzurePrivateDnsResolver is the top-level API resource describing an
// Azure DNS Private Resolver -- the managed DNS proxy that resolves
// names across the hybrid boundary through inbound and outbound
// endpoints, without DNS server VMs.
message AzurePrivateDnsResolver {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzurePrivateDnsResolver".
  string kind = 2 [(buf.validate.field).string.const = 'AzurePrivateDnsResolver'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // DNS Private Resolver specification.
  AzurePrivateDnsResolverSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzurePrivateDnsResolverStatus status = 5;
}

// AzurePrivateDnsResolverStatus holds the deployment outputs.
message AzurePrivateDnsResolverStatus {
  // Outputs from the IaC deployment.
  AzurePrivateDnsResolverOutputs outputs = 1;
}
