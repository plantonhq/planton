# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azureprivatednsresolver
spec:
  billing_model: always_on
  baseline_charges:
    - service_name: Azure DNS
      sku_meter: inbound resolver endpoints
      pricing_unit: endpoint-months
      description: Each inbound endpoint bills a flat monthly fee from the moment it provisions, prorated to hours if deleted earlier. The resolver object itself is free -- a resolver with no endpoints bills nothing.
    - service_name: Azure DNS
      sku_meter: outbound resolver endpoints
      pricing_unit: endpoint-months
      description: Each outbound endpoint bills the same flat monthly fee as an inbound one, from provisioning, prorated to hours. The rate prints identically across all of Azure DNS's billing geographies -- one worldwide price.
  cost_drivers:
    - field_path: inbound_endpoints
      sku_meter: inbound resolver endpoints
      pricing_unit: endpoint-months
      impact: The bill is endpoint count times the monthly fee -- most deployments need exactly one, and Azure caps a resolver at five each way. Each endpoint serves roughly 10,000 queries per second, so scaling out endpoints is a throughput decision that multiplies a fixed fee.
    - field_path: outbound_endpoints
      sku_meter: outbound resolver endpoints
      pricing_unit: endpoint-months
      impact: Same meter shape as inbound -- each declared endpoint is one more monthly fee. An inbound-only resolver (answering on-premises queries without forwarding any out) simply omits these and halves the typical bill.
    - field_path: inbound_endpoints.private_ip_allocation_method
      sku_meter: inbound resolver endpoints
      pricing_unit: endpoint-months
      impact: Free either way -- STATIC pins the address on-premises forwarders point at so recreation never breaks their configs, and changes nothing on the meter.
  estimate_exclusions:
    - DNS forwarding rulesets bill their own flat monthly fee on the AzurePrivateDnsResolverForwardingRuleset component that binds the outbound endpoints
    - the resolver adds no per-query meter of its own -- queries it answers from private zones bill those zones' per-million query meter zone-side, and queries forwarded on-premises bill nothing in Azure
    - the anchor virtual network and the dedicated endpoint subnets are first-class components of their own
  notes: "Azure prices the resolver as pure rented plumbing: a flat monthly fee per endpoint (about 180 per endpoint-month at list, prorated to hours), the same rate inbound and outbound, in every billing geography. Nothing usage-shaped bills here -- the retail price family publishes NO query meter for the resolver, so query volume moves other components' bills (the private zones it answers from), never this one. The cost decisions are structural: how many endpoints each way (one is the norm, five the cap), and whether outbound forwarding is needed at all. This is what replaces a pair of DNS-server VMs -- the fee buys away the compute, patching, and HA engineering those cost."
