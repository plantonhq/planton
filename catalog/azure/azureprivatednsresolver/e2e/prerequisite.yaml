# AzurePrivateDnsResolver install profile used as a prerequisite by
# dependent components (declared via prerequisites:
# [AzurePrivateDnsResolver] in the kind registry -- the forwarding
# ruleset is the consumer). The harness deploys this document after its
# own prerequisite chain (fixture resource group -> fixture network ->
# the delegated fixture subnets) and captures its outputs --
# outbound_endpoint_id in particular -- for dependents' references to
# resolve against. The fixture is OUTBOUND-ONLY by design: that is the
# one endpoint dependents bind, and endpoints bill hourly, so the
# fixture carries no inbound endpoint. Azure allows ONE resolver per
# network -- this fixture and the resolver's own smoke both anchor to
# the fixture network, so this family's lanes never run in parallel
# with each other (lanes are sequential per proof session; the
# fixture tears down at deps-down).
apiVersion: azure.planton.dev/v1alpha1
kind: AzurePrivateDnsResolver
metadata:
  name: planton-oss-e2e-azure-fixture-pdnsr
  id: planton-oss-e2e-azure-fixture-pdnsr
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureprivatednsresolver
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-azure-fixture-pdnsr
  virtualNetworkId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-vnet
  outboundEndpoints:
    - name: outbound
      subnetId:
        valueFrom:
          name: planton-oss-e2e-azure-fixture-dnsr-out-subnet
