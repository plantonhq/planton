apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurecontainerappenvironmentmanagedcertificate
spec:
  # Azure only issues a managed certificate after validating domain
  # ownership against PUBLIC DNS: the asuid TXT record (carrying the
  # app's verification id) and the CNAME/HTTP routing record must resolve
  # on the open internet, which requires a registrar-delegated domain the
  # test tenant does not own -- an Azure DNS zone alone is not publicly
  # resolvable, so the create operation polls until its ~30-minute
  # timeout and fails. The kind closes on its offline gate (spec
  # tests, full tofu plan, parity audit, outputs conformance). Unblock
  # path: delegate any real (sub)domain to an Azure DNS zone in the test
  # subscription, point the scenario's subject_name at it, publish the
  # two records, and this scenario runs unchanged.
  tier: 1
  status: deferred
  deferred_reason: >-
    Managed-certificate issuance blocks on Azure validating domain
    ownership against public DNS; the test tenant owns no
    registrar-delegated domain, so the create operation cannot complete.
    Offline gate green; scenario ships ready-to-run once a delegated
    domain exists.
  validated_provisioners: []
  timeout_minutes: 60
