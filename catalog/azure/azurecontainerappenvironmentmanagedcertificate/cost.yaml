# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azurecontainerappenvironmentmanagedcertificate
spec:
  billing_model: free
  free_tier: A managed certificate is the TLS certificate Azure provisions, hosts, and renews end to end for one custom domain on a Container App Environment. Microsoft documents it as a free certificate explicitly -- issuance, hosting, and every automatic renewal carry no meter.
  notes: "No field of this spec buys anything: the name, the environment reference, subject_name, and the validation method are the issuance request Azure fulfills at no charge. The real spend lives in the ENVIRONMENT's plan that runs the app behind the domain -- consumption vCPU/memory/requests or dedicated workload profiles, the AzureContainerAppEnvironment component's bill. The DNS zone publishing the validation records (the asuid TXT and the CNAME/A routing record) bills as its own component when hosted on Azure DNS."
