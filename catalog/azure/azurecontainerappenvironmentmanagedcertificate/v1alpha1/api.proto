syntax = "proto3";

package dev.planton.azure.azurecontainerappenvironmentmanagedcertificate.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurecontainerappenvironmentmanagedcertificate/v1alpha1/outputs.proto";
import "catalog/azure/azurecontainerappenvironmentmanagedcertificate/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureContainerAppEnvironmentManagedCertificate is the top-level API
// resource for an Azure-managed TLS certificate on a Container App
// Environment -- free, domain-validated, provisioned and renewed by
// Azure for one custom domain.
message AzureContainerAppEnvironmentManagedCertificate {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureContainerAppEnvironmentManagedCertificate'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureContainerAppEnvironmentManagedCertificateSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureContainerAppEnvironmentManagedCertificateStatus status = 5;
}

// AzureContainerAppEnvironmentManagedCertificateStatus holds the deployment status and outputs.
message AzureContainerAppEnvironmentManagedCertificateStatus {
  // outputs
  AzureContainerAppEnvironmentManagedCertificateOutputs outputs = 1;
}
