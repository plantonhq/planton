syntax = "proto3";

package dev.planton.azure.azurecontainerappenvironmentmanagedcertificate.v1alpha1;

// **AzureContainerAppEnvironmentManagedCertificateOutputs** captures
// the outputs of provisioning an Azure-managed certificate on a Container
// App Environment.
message AzureContainerAppEnvironmentManagedCertificateOutputs {
  // The Azure Resource Manager ID of the managed certificate.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.App/managedEnvironments/{env}/managedCertificates/{name}
  string certificate_id = 1;

  // The domain-validation token Azure generated for this certificate.
  // Relevant while validation is pending; once the certificate issues
  // (which the deployment waits for), it is informational.
  string validation_token = 2;
}
