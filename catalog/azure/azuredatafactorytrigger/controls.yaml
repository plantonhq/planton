# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azuredatafactorytrigger
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A trigger is scheduling metadata -- a firing condition plus pipeline references -- with no data at rest of its own. The definition is stored by the Microsoft-operated Data Factory service under the FACTORY's encryption posture.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest of its own to key (see enc-at-rest); the customer-managed-key lever for stored factory definitions lives on the AzureDataFactory kind.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The trigger moves no data; the event paths that feed it (Storage to Event Grid to Data Factory for blob events, the custom topic's delivery for custom events) are Microsoft-operated TLS channels, and managing the definition flows through ARM's TLS-only management API.
    - control_id: no-public-access
      status: not_applicable
      notes: A firing condition has no network endpoint -- nothing exists to reach from the internet. The event sources it listens to (a storage account, an Event Grid topic) own their exposure as their own kinds.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No inbound surface to restrict. Worth knowing when composing -- a blob-event trigger on a storage account behind a private endpoint needs the storage side to allow trusted-Azure-services (Event Grid) traffic, a storage-account setting, or events never arrive.
    - control_id: edge-protection
      status: not_applicable
      notes: No inbound request path exists to filter.
    - control_id: rbac
      status: not_applicable
      notes: Authoring is ARM RBAC on the factory (Data Factory Contributor is the canonical role), and Azure adds one deliberate check for the EVENT types -- creating or updating a blob-event or custom-event trigger requires the DEPLOYING principal to hold Microsoft.EventGrid/EventSubscriptions/Write on the storage account or topic, so listening to another team's storage cannot happen without rights on that storage. Both are platform posture, not spec levers.
    - control_id: workload-identity
      status: not_applicable
      notes: The trigger authenticates nobody -- Data Factory's own service identity relays events (Microsoft documents the service needs NO special grant on the storage account or Event Grid), and the fired pipeline's data access is the linked services' posture.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication path of its own to strengthen or disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Authoring operations land in the Azure Activity Log automatically, and every firing is recorded as a trigger run in the factory's run history, exportable through the factory's diagnostic settings -- factory-level posture with no toggle here.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The trigger emits no metrics surface of its own; firing history and outcomes ride the factory's trigger-run telemetry and diagnostic settings.
    - control_id: backup-recovery
      status: not_applicable
      notes: Declarative definition -- nothing to back up; the manifest recreates the trigger. One recovery nuance worth knowing -- a recreated tumbling-window trigger has no memory of processed windows and will re-fire its whole backfill from start_time.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: A trigger has no runtime footprint with a zonal failure mode; evaluation and firing are the Microsoft-operated service's resilience.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Azure nor this spec offers a deletion-protection flag for a trigger; deleting one silently stops the automation it carried (pipelines simply stop being started) and is recreated declaratively.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The service that stores trigger definitions, evaluates their conditions, and fires pipeline runs is Microsoft-operated Azure Data Factory (with Azure Event Grid carrying the event types); no customer-visible patch surface exists.
