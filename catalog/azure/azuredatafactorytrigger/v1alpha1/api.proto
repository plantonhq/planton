syntax = "proto3";

package dev.planton.azure.azuredatafactorytrigger.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azuredatafactorytrigger/v1alpha1/outputs.proto";
import "catalog/azure/azuredatafactorytrigger/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureDataFactoryTrigger represents an Azure Data Factory trigger --
// the instruction that starts pipelines automatically inside a
// factory (AzureDataFactory): on a schedule, per tumbling window, on
// blob events, or on Event Grid custom events.
message AzureDataFactoryTrigger {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureDataFactoryTrigger'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AzureDataFactoryTriggerSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AzureDataFactoryTriggerStatus status = 5;
}

// AzureDataFactoryTriggerStatus represents the status of an Azure
// Data Factory trigger deployment.
message AzureDataFactoryTriggerStatus {
  //outputs
  //  azure-data-factory-trigger outputs
  AzureDataFactoryTriggerOutputs outputs = 1;
}
