apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: azuredatafactorytrigger
spec:
  # The trigger's identity is its full factory-scoped ARM ID
  # ({factory_id}/triggers/{name}) -- the same shape for all four
  # trigger types; the spec's variant block decides which provider
  # resource the import addresses.
  values:
    - name: trigger_id
      derivations:
        - from_output: trigger_id
      where_to_find: >-
        Compose it from the factory's resource ID plus
        /triggers/<trigger-name>, or `az datafactory trigger show
        --factory-name <factory> -g <rg> -n <name> --query id`; also
        the component's own trigger_id output.
