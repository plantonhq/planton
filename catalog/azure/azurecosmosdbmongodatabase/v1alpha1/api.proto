syntax = "proto3";

package dev.planton.azure.azurecosmosdbmongodatabase.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurecosmosdbmongodatabase/v1alpha1/outputs.proto";
import "catalog/azure/azurecosmosdbmongodatabase/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureCosmosdbMongoDatabase is the top-level API resource for a MongoDB
// API database inside an Azure Cosmos DB account (referenced via
// cosmosdb_account_id) -- the namespace collections live in and the
// boundary for shared throughput. Collections themselves are
// AzureCosmosdbMongoCollection resources referencing this database.
message AzureCosmosdbMongoDatabase {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureCosmosdbMongoDatabase'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureCosmosdbMongoDatabaseSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureCosmosdbMongoDatabaseStatus status = 5;
}

// AzureCosmosdbMongoDatabaseStatus holds the deployment status and outputs.
message AzureCosmosdbMongoDatabaseStatus {
  // outputs
  AzureCosmosdbMongoDatabaseOutputs outputs = 1;
}
