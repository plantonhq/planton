# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azurecosmosdbmongodatabase
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Azure Cosmos DB encrypts all data at rest -- documents, indexes, and backups in every database -- with service-managed keys, always on, with no disable switch at any configuration level."
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: "Customer-managed keys are an account-level choice fixed at account creation (the AzureCosmosdbAccount's customer_managed_key), covering every database under it -- the database offers no per-database key lever."
    - control_id: enc-in-transit
      status: not_applicable
      notes: "Transport is the ACCOUNT's endpoint: Cosmos DB's MongoDB endpoint accepts only TLS connections, and the minimum TLS version is set on the AzureCosmosdbAccount. The database has no endpoint or transport lever of its own."
    - control_id: no-public-access
      status: not_applicable
      notes: "Network reachability is account-level posture -- public network access, IP firewall, VNet rules, and private endpoints all live on the AzureCosmosdbAccount, whose single MongoDB endpoint serves every database."
    - control_id: restricted-ingress
      status: not_applicable
      notes: "Inbound source restriction (IP ranges, VNet service endpoints, Private Link) is the account's firewall posture; the database exposes no network filter of its own."
    - control_id: edge-protection
      status: not_applicable
      notes: "The endpoint speaks the MongoDB wire protocol, not HTTP application traffic -- there is no WAF attachment point at the database grain."
    - control_id: rbac
      status: not_applicable
      notes: "Management-plane access is ARM RBAC on the subscription/resource-group -- posture outside this manifest. The MongoDB data plane on RU-based accounts authenticates with the account's keys via the connection string, not role assignments: Entra ID data-plane RBAC is a NoSQL-API capability, so per-database data-plane grants do not exist here. Custody of the connection string IS the data-plane access control."
    - control_id: workload-identity
      status: not_applicable
      notes: "The database holds no credentials and runs no workloads. Callers authenticate with the account's MongoDB connection string -- a shared secret, not a platform-issued identity; keyless data-plane identity is not available on the RU-based Mongo API."
    - control_id: no-legacy-auth
      status: not_applicable
      notes: "The Mongo data plane has exactly one authentication path on RU-based accounts -- the account's keys via connection string -- so there is no weaker alternative to disable at the database grain. Key rotation and any local-auth posture live on the AzureCosmosdbAccount."
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: "Database create/update/delete land in the Azure Activity Log automatically. Data-plane auditing (MongoRequests) is an Azure Monitor diagnostic setting configured on the ACCOUNT -- account-side posture with no per-database toggle."
    - control_id: monitoring-integration
      status: not_applicable
      notes: "Cosmos DB metrics (RU consumption, throttled requests, storage) emit at the account grain with database and collection dimensions -- Microsoft defines no per-database metric resource, and this spec carries no monitoring toggle. Watching this database's shared budget means filtering the account's metrics on its name."
    - control_id: backup-recovery
      status: not_applicable
      notes: "Backups are automatic and account-level: the AzureCosmosdbAccount's backup field picks periodic or continuous mode and every database rides that policy. Deleting the database deletes every collection in it -- continuous mode restores it point-in-time; periodic mode requires a Microsoft support ticket."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: "Retention (periodic interval/retention hours, continuous 7-vs-30-day tier) is configured on the account's backup field; no retention lever exists on this spec."
    - control_id: multi-zone-ha
      status: not_applicable
      notes: "Zone redundancy and region replication follow the ACCOUNT's geo_locations (zone_redundant per region) -- the database's data is replicated wherever the account replicates, with no per-database lever."
    - control_id: deletion-protection
      status: not_applicable
      notes: "Neither the Cosmos DB API nor this spec offers a database-grain deletion-protection flag; ARM resource locks are subscription-side governance outside the manifest. The blast radius is total: a database delete takes every collection and document under it."
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Cosmos DB is a fully managed multi-tenant service -- Microsoft operates and patches the storage and query engines (including the MongoDB protocol compatibility layer) with no customer-visible patch surface."
