# Minimal AzureAksCluster scenario: a single-node cluster in the fixture
# resource group with AKS-managed networking (no subnet reference). The
# Kubernetes version is left unset so AKS picks its current recommended
# GA version and this manifest never goes stale. A zone-aware default
# pool on a small burstable VM exercises the default_node_pool shape;
# oidc_issuer_enabled defaults on so the oidc_issuer_url output is
# populated for workload-identity composition downstream.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureAksCluster
metadata:
  name: planton-oss-e2e-aks-smoke
  id: planton-oss-e2e-aks-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureakscluster
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-aks-smoke
  defaultNodePool:
    name: system
    vmSize: Standard_B2s
    nodeCount: 1
    zones:
      - "1"
