apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azureakscluster
spec:
  # AKS managed cluster under live E2E: deploy -> ARM GetByID verify on
  # cluster_id -> destroy -> verify-destroyed on both provisioners. The
  # minimal scenario uses managed networking (no subnet fixture) and a
  # single-node default pool on a small burstable VM -- AKS takes ~5-10
  # minutes to create and a similar time to delete.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 60
