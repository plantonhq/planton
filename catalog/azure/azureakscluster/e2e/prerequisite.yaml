# AzureAksCluster install profile used as a prerequisite by composed
# components (AzureAksNodePool, declared via prerequisites in the kind
# registry). The harness deploys this cluster after the fixture resource
# group, then resolves the dependent's kubernetes_cluster_id reference
# against its cluster_id output. Managed networking keeps the prerequisite
# chain short (no VNet/subnet fixtures).
apiVersion: azure.planton.dev/v1alpha1
kind: AzureAksCluster
metadata:
  name: planton-oss-e2e-aks-cluster-prereq
  id: planton-oss-e2e-aks-cluster-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureakscluster
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-aks-cluster-prereq
  defaultNodePool:
    name: system
    vmSize: Standard_B2s
    nodeCount: 1
    zones:
      - "1"
