syntax = "proto3";

package dev.planton.azure.azureakscluster.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureakscluster/v1alpha1/outputs.proto";
import "catalog/azure/azureakscluster/v1alpha1/spec.proto";
import "shared/metadata.proto";

// azure-aks-cluster
message AzureAksCluster {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureAksCluster'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AzureAksClusterSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AzureAksClusterStatus status = 5;
}

// azure-aks-cluster status
message AzureAksClusterStatus {
  //outputs
  //  azure-aks-cluster outputs
  AzureAksClusterOutputs outputs = 1;
}
