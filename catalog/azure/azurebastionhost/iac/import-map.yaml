apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: azurebastionhost
spec:
  # The host imports by its full ARM resource ID.
  values:
    - name: bastion_host_id
      derivations:
        - from_output: bastion_host_id
      where_to_find: >-
        `az network bastion show -g <resource-group> -n <name> --query
        id`, or the component's own bastion_host_id output.
