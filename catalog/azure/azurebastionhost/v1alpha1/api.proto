syntax = "proto3";

package dev.planton.azure.azurebastionhost.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurebastionhost/v1alpha1/outputs.proto";
import "catalog/azure/azurebastionhost/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureBastionHost is the top-level API resource describing an Azure
// Bastion host -- the managed jump service that opens RDP/SSH sessions
// to virtual machines over their private addresses.
message AzureBastionHost {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzureBastionHost".
  string kind = 2 [(buf.validate.field).string.const = 'AzureBastionHost'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Bastion host specification.
  AzureBastionHostSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzureBastionHostStatus status = 5;
}

// AzureBastionHostStatus holds the deployment outputs.
message AzureBastionHostStatus {
  // Outputs from the IaC deployment.
  AzureBastionHostOutputs outputs = 1;
}
