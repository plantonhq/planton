syntax = "proto3";

package dev.planton.azure.azurebastionhost.v1alpha1;

import "catalog/azure/azurebastionhost/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureBastionHostIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureBastionHostIacInput {
  // The Bastion host resource to deploy.
  AzureBastionHost target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
