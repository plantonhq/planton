# Minimal AzureEventgridEventSubscription scenario: the SCOPE-addressed
# wiring -- a subscription on the Event Grid topic kind's smoke
# instance (chained by registry prerequisite), delivering to a
# scenario-local storage queue on the fixture account. The subject and
# advanced filters plus the retry policy render real surface at zero
# cost. Subscription names are source-scoped (no run-id needed -- the
# parent topic's cloud name carries it). Free at rest; creates in
# seconds after the webhook-free destination validation.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureEventgridEventSubscription
metadata:
  name: planton-oss-e2e-azureeventgrideventsubscription-smoke
  id: planton-oss-e2e-azureeventgrideventsubscription-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureeventgrideventsubscription
  annotations:
    planton.dev/e2e: "true"
    # The delivery queue is an extra instance this scenario composes --
    # not a kind-level requirement (see the doc's own chain). The
    # fixture storage account is named FIRST because both this
    # scenario's destination and the queue document resolve
    # storage_account_id against it, and a chain entry only resolves
    # against instances deployed ahead of it.
    planton.dev/e2e-prerequisites: "AzureStorageAccount,catalog/azure/azureeventgrideventsubscription/e2e/queue-smoke.yaml"
  tags:
    - planton-e2e
spec:
  scope:
    valueFrom:
      name: planton-oss-e2e-azureeventgridtopic-smoke
  name: eges-smoke-to-queue
  # The source topic's input schema is CloudEventSchemaV1_0 (the topic
  # kind's smoke shape), and ARM rejects a delivery schema the source
  # cannot map (InvalidRequest: "EventDeliverySchema value
  # EventGridSchema cannot be used in combination with the topic's
  # input schema of CloudEventSchemaV1_0" -- live-caught; the provider
  # never validates the pairing). Matching the source proves the
  # schema field live on the scope wiring; the system-topic scenario
  # proves the EventGridSchema default (system topics emit it).
  eventDeliverySchema: CloudEventSchemaV1_0
  destination:
    storageQueue:
      storageAccountId:
        valueFrom:
          name: planton-oss-e2e-azure-fixture-sa
      # Matches queue-smoke.yaml's queueName -- both documents expand
      # the same run-id token.
      queueName: eges-smoke-${E2E_RUN_ID}
  subjectFilter:
    subjectBeginsWith: /planton-e2e/
  advancedFilter:
    stringIn:
      - key: data.source
        values:
          - planton-e2e
  retryPolicy:
    maxDeliveryAttempts: 5
    eventTimeToLive: 60
