apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azuremonitorscheduledqueryalert
spec:
  # The scenario deploys a row-count KQL rule against the fixture
  # workspace, firing into the fixture action group -- proving the
  # workspace scope FK, the criteria wire maps, and the action-group FK
  # through the composed RG -> workspace + action group chain. The
  # Heartbeat table is schema-present in every workspace, so query
  # validation passes without data; the idle fixture never has
  # heartbeats, so the alert never fires.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
