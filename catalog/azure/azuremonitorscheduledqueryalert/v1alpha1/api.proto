syntax = "proto3";

package dev.planton.azure.azuremonitorscheduledqueryalert.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azuremonitorscheduledqueryalert/v1alpha1/outputs.proto";
import "catalog/azure/azuremonitorscheduledqueryalert/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureMonitorScheduledQueryAlert is the top-level API resource for an Azure
// Monitor scheduled query alert rule -- a KQL query evaluated on a schedule
// against a Log Analytics Workspace or Application Insights resource, firing
// action groups when its condition holds.
message AzureMonitorScheduledQueryAlert {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureMonitorScheduledQueryAlert'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureMonitorScheduledQueryAlertSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureMonitorScheduledQueryAlertStatus status = 5;
}

// AzureMonitorScheduledQueryAlertStatus holds the deployment status and outputs.
message AzureMonitorScheduledQueryAlertStatus {
  // outputs
  AzureMonitorScheduledQueryAlertOutputs outputs = 1;
}
