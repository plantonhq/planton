syntax = "proto3";

package dev.planton.azure.azuremonitorscheduledqueryalert.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// **AzureMonitorScheduledQueryAlertSpec** defines the configuration for
// creating an Azure Monitor scheduled query alert rule
// (Microsoft.Insights/scheduledQueryRules) -- the log-search alert.
//
// A scheduled query alert runs a KQL query against a Log Analytics Workspace
// (or an Application Insights resource) on a schedule, compares the result to
// a threshold, and fires action groups when the condition holds. It is the
// alerting half of the logging pipeline: diagnostic settings route logs into
// the workspace, and query alerts watch what arrives -- error spikes,
// security events, missing heartbeats, business anomalies, anything KQL can
// express.
//
// Two evaluation styles per criterion:
//   - **row count** -- time_aggregation_method COUNT compares the number of
//     rows the query returns ("more than 5 exceptions in 10 minutes")
//   - **metric measurement** -- other aggregations compute over a numeric
//     column named in metric_measure_column ("average latency column > 500")
//
// The rule is regional: it must be created in the same region as the
// workspace it queries.
message AzureMonitorScheduledQueryAlertSpec {
  // The Azure region where the alert rule will be created -- must match the
  // region of the workspace (or Application Insights resource) it queries.
  // Examples: "eastus", "westus2", "westeurope".
  string region = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // The Azure Resource Group where the alert rule will be created.
  // Can be a literal string or a reference to an AzureResourceGroup output.
  dev.planton.shared.foreignkey.v1.StringValueOrRef resource_group = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureResourceGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.resource_group_name"
  ];

  // The name of the alert rule, unique within the resource group.
  //
  // **ForceNew**: Changing this destroys and recreates the rule.
  string alert_name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 260
  ];

  // The resource the query runs against -- a Log Analytics Workspace (the
  // common case, and the default reference) or an Application Insights
  // resource (a valueFrom naming that kind; both are declared candidates,
  // so each one's resource ID output fills in).
  // Azure allows exactly one scope per rule.
  //
  // **ForceNew**: Changing this destroys and recreates the rule.
  dev.planton.shared.foreignkey.v1.StringValueOrRef scope = 4 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureLogAnalyticsWorkspace,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.workspace_id",
    (dev.planton.shared.foreignkey.v1.candidate) = {
      kind: AzureLogAnalyticsWorkspace
      field_path: "status.outputs.workspace_id"
    },
    (dev.planton.shared.foreignkey.v1.candidate) = {
      kind: AzureApplicationInsights
      field_path: "status.outputs.application_insights_id"
    }
  ];

  // The display name shown in the portal and notifications. When empty,
  // Azure shows the resource name.
  string display_name = 5;

  // A human-readable description delivered with every notification --
  // the place for runbook links and on-call context.
  string description = 6;

  // Whether the rule evaluates at all. Disable during maintenance windows
  // instead of deleting the rule.
  // Default: true
  optional bool enabled = 7 [(dev.planton.shared.options.default) = "true"];

  // The alert severity: 0 (critical) through 4 (verbose). Severity drives
  // notification routing and on-call urgency conventions.
  // Default: 3 (informational -- raise deliberately for paging conditions)
  optional int32 severity = 8 [
    (buf.validate.field).int32 = {
      gte: 0
      lte: 4
    },
    (dev.planton.shared.options.default) = "3"
  ];

  // How often the query runs, as an ISO 8601 duration. One of PT1M, PT5M,
  // PT10M, PT15M, PT30M, PT45M, PT1H, PT2H, PT3H, PT4H, PT5H, PT6H, P1D.
  // Frequent evaluation costs more; PT5M suits most operational alerts.
  // Default: PT5M
  optional string evaluation_frequency = 9 [
    (buf.validate.field).string = {
      in: [
        "PT1M",
        "PT5M",
        "PT10M",
        "PT15M",
        "PT30M",
        "PT45M",
        "PT1H",
        "PT2H",
        "PT3H",
        "PT4H",
        "PT5H",
        "PT6H",
        "P1D"
      ]
    },
    (dev.planton.shared.options.default) = "PT5M"
  ];

  // The time range each evaluation queries over, as an ISO 8601 duration.
  // One of PT1M, PT5M, PT10M, PT15M, PT30M, PT45M, PT1H, PT2H, PT3H, PT4H,
  // PT5H, PT6H, P1D, P2D. Must be at least the evaluation frequency.
  // Default: PT5M
  optional string window_duration = 10 [
    (buf.validate.field).string = {
      in: [
        "PT1M",
        "PT5M",
        "PT10M",
        "PT15M",
        "PT30M",
        "PT45M",
        "PT1H",
        "PT2H",
        "PT3H",
        "PT4H",
        "PT5H",
        "PT6H",
        "P1D",
        "P2D"
      ]
    },
    (dev.planton.shared.options.default) = "PT5M"
  ];

  // The conditions the query results are evaluated against. Azure evaluates
  // each criterion independently; the rule fires when any holds.
  repeated AzureMonitorScheduledQueryAlertCriteria criteria = 11 [(buf.validate.field).repeated = {min_items: 1}];

  // Overrides the query's default lookback when the query needs more
  // history than the evaluation window (for example a query comparing
  // against last week). One of PT5M, PT10M, PT15M, PT20M, PT30M, PT45M,
  // PT1H, PT2H, PT3H, PT4H, PT5H, PT6H, P1D, P2D.
  string query_time_range_override = 12 [(buf.validate.field).cel = {
    id: "scheduled_query_alert_time_range_override_vocabulary"
    message: "query_time_range_override must be one of PT5M, PT10M, PT15M, PT20M, PT30M, PT45M, PT1H, PT2H, PT3H, PT4H, PT5H, PT6H, P1D, P2D"
    expression: "this == '' || this in ['PT5M', 'PT10M', 'PT15M', 'PT20M', 'PT30M', 'PT45M', 'PT1H', 'PT2H', 'PT3H', 'PT4H', 'PT5H', 'PT6H', 'P1D', 'P2D']"
  }];

  // Whether the alert auto-resolves when the condition stops holding.
  // Mutually exclusive with mute_actions_after_alert_duration.
  // Default: false (Azure's default -- each firing is its own alert)
  bool auto_mitigation_enabled = 13;

  // Suppresses repeat action-group firings for the given duration after an
  // alert fires -- the noise dial for flapping conditions. One of PT5M,
  // PT10M, PT15M, PT30M, PT45M, PT1H, PT2H, PT3H, PT4H, PT5H, PT6H, P1D,
  // P2D. Mutually exclusive with auto_mitigation_enabled.
  string mute_actions_after_alert_duration = 14 [(buf.validate.field).cel = {
    id: "scheduled_query_alert_mute_duration_vocabulary"
    message: "mute_actions_after_alert_duration must be one of PT5M, PT10M, PT15M, PT30M, PT45M, PT1H, PT2H, PT3H, PT4H, PT5H, PT6H, P1D, P2D"
    expression: "this == '' || this in ['PT5M', 'PT10M', 'PT15M', 'PT30M', 'PT45M', 'PT1H', 'PT2H', 'PT3H', 'PT4H', 'PT5H', 'PT6H', 'P1D', 'P2D']"
  }];

  // Whether Azure verifies the alert has access to dedicated
  // workspace-alerts storage (for estates that route alert state to
  // customer-managed storage).
  // Default: false
  bool workspace_alerts_storage_enabled = 15;

  // Whether to skip validating the query at rule creation -- needed when
  // the queried table appears only after data starts flowing (custom logs).
  bool skip_query_validation = 16;

  // The rule's managed identity, used to run the query with Entra
  // permissions instead of the alert service's built-in access -- required
  // when the workspace enforces Entra-only query access, or when the query
  // crosses resources the service identity cannot read.
  AzureMonitorScheduledQueryAlertIdentity identity = 17;

  // The resource types the rule targets when the query projects a
  // resource-id column (for example "Microsoft.Compute/virtualMachines") --
  // lets one rule alert per resource.
  repeated string target_resource_types = 18 [(buf.validate.field).repeated.items = {
    string: {min_len: 1}
  }];

  // The action to take when the alert fires.
  AzureMonitorScheduledQueryAlertAction action = 19;

  // Tags to apply to the alert rule, merged over the Planton-derived
  // metadata tags (user values win on key conflicts).
  map<string, string> tags = 20;

  option (buf.validate.message).cel = {
    id: "scheduled_query_alert_mute_xor_auto_mitigation"
    message: "auto_mitigation_enabled and mute_actions_after_alert_duration are mutually exclusive -- an auto-resolving alert cannot also mute repeat firings"
    expression: "!(this.auto_mitigation_enabled && this.mute_actions_after_alert_duration != '')"
  };
}

// One condition on the query results.
message AzureMonitorScheduledQueryAlertCriteria {
  // The KQL query to run. Its result rows (or a numeric column of them)
  // are what the condition evaluates.
  string query = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // How the query results aggregate before comparison: COUNT compares the
  // number of result rows; AVERAGE/MINIMUM/MAXIMUM/TOTAL compute over the
  // numeric column named in metric_measure_column (Azure requires that
  // column for the non-COUNT aggregations).
  AzureMonitorScheduledQueryAlertTimeAggregation time_aggregation_method = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // The comparison between the aggregated value and the threshold.
  AzureMonitorScheduledQueryAlertOperator operator = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // The threshold the aggregated value is compared against. Zero is a
  // meaningful threshold ("any result row" with COUNT + GREATER_THAN).
  double threshold = 4;

  // The numeric column the non-COUNT aggregations compute over. The query
  // must project this column.
  string metric_measure_column = 5;

  // The column carrying an ARM resource ID when the rule alerts per
  // resource (pairs with the spec's target_resource_types).
  string resource_id_column = 6;

  // Dimension splits -- each combination of the named columns' values is
  // evaluated (and alerts) independently.
  repeated AzureMonitorScheduledQueryAlertDimension dimensions = 7;

  // Requires the condition to hold across multiple evaluation periods
  // before firing -- the flap damper. When absent, one breaching
  // evaluation fires the alert.
  AzureMonitorScheduledQueryAlertFailingPeriods failing_periods = 8;
}

// A dimension split on a criterion.
message AzureMonitorScheduledQueryAlertDimension {
  // The result column to split on.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // How the values list applies: INCLUDE evaluates only matching values
  // (each independently), EXCLUDE evaluates everything else.
  AzureMonitorScheduledQueryAlertDimensionOperator operator = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // The column values the operator applies to. "*" with INCLUDE splits
  // across every value.
  repeated string values = 3 [(buf.validate.field).repeated = {
    min_items: 1
    items: {
      string: {min_len: 1}
    }
  }];
}

// Requires the condition to hold across multiple evaluation periods.
message AzureMonitorScheduledQueryAlertFailingPeriods {
  // How many of the examined periods must breach for the alert to fire
  // (1-6). Must not exceed number_of_evaluation_periods.
  int32 minimum_failing_periods_to_trigger_alert = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 6
  }];

  // How many recent evaluation periods are examined (1-6).
  int32 number_of_evaluation_periods = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 6
  }];

  option (buf.validate.message).cel = {
    id: "scheduled_query_alert_failing_periods_bounds"
    message: "minimum_failing_periods_to_trigger_alert cannot exceed number_of_evaluation_periods -- the alert can never fire otherwise"
    expression: "this.minimum_failing_periods_to_trigger_alert <= this.number_of_evaluation_periods"
  };
}

// The action taken when the alert fires.
message AzureMonitorScheduledQueryAlertAction {
  // The action groups to notify. Each entry can be a literal ARM ID or a
  // reference to an AzureMonitorActionGroup output.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef action_group_ids = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureMonitorActionGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.action_group_id"
  ];

  // Custom properties merged into the alert payload delivered to the
  // action groups.
  map<string, string> custom_properties = 2;

  // Overrides the subject line of email notifications.
  string email_subject = 3;
}

// AzureMonitorScheduledQueryAlertIdentity assigns a managed identity the
// rule runs its query as.
message AzureMonitorScheduledQueryAlertIdentity {
  // The identity model: SYSTEM_ASSIGNED (Azure creates and rotates a
  // service principal bound to the rule's lifecycle) or USER_ASSIGNED
  // (bring an identity from user_assigned_identity_ids, grantable before
  // the rule exists).
  AzureMonitorScheduledQueryAlertIdentityType type = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];

  // The user-assigned identities to attach -- required when (and only
  // meaningful when) type is USER_ASSIGNED. Each entry references an
  // AzureUserAssignedIdentity's ARM id.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef user_assigned_identity_ids = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureUserAssignedIdentity,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.identity_id"
  ];

  option (buf.validate.message).cel = {
    id: "scheduled_query_alert_identity_ids_match_type"
    message: "user_assigned_identity_ids is required with USER_ASSIGNED and must be empty with SYSTEM_ASSIGNED"
    expression: "(this.type == 2 && this.user_assigned_identity_ids.size() > 0) || (this.type == 1 && this.user_assigned_identity_ids.size() == 0)"
  };
}

// The managed-identity model for the rule.
enum AzureMonitorScheduledQueryAlertIdentityType {
  // Not specified -- invalid; choose an explicit identity model.
  azure_monitor_scheduled_query_alert_identity_type_unspecified = 0;

  // Azure creates a service principal bound to the rule's lifecycle.
  SYSTEM_ASSIGNED = 1;

  // Bring your own AzureUserAssignedIdentity -- grantable before the rule
  // exists.
  USER_ASSIGNED = 2;
}

// How the query results aggregate before comparison.
enum AzureMonitorScheduledQueryAlertTimeAggregation {
  // Not specified -- invalid; choose an explicit aggregation.
  azure_monitor_scheduled_query_alert_time_aggregation_unspecified = 0;

  // The number of result rows -- the row-count evaluation style.
  COUNT = 1;

  // The mean of metric_measure_column across result rows.
  AVERAGE = 2;

  // The smallest metric_measure_column value.
  MINIMUM = 3;

  // The largest metric_measure_column value.
  MAXIMUM = 4;

  // The sum of metric_measure_column across result rows.
  TOTAL = 5;
}

// The comparison operator. (Azure's wire value for equality on this API is
// "Equal", not "Equals" -- the modules carry the mapping.)
enum AzureMonitorScheduledQueryAlertOperator {
  // Not specified -- invalid; choose an explicit operator.
  azure_monitor_scheduled_query_alert_operator_unspecified = 0;

  // The aggregated value equals the threshold.
  EQUAL = 1;

  // The aggregated value exceeds the threshold.
  GREATER_THAN = 2;

  // The aggregated value is at least the threshold.
  GREATER_THAN_OR_EQUAL = 3;

  // The aggregated value is below the threshold.
  LESS_THAN = 4;

  // The aggregated value is at most the threshold.
  LESS_THAN_OR_EQUAL = 5;
}

// How a dimension split's values apply.
enum AzureMonitorScheduledQueryAlertDimensionOperator {
  // Not specified -- invalid; choose an explicit operator.
  azure_monitor_scheduled_query_alert_dimension_operator_unspecified = 0;

  // Evaluate only the listed values, each independently.
  INCLUDE = 1;

  // Evaluate every value except the listed ones.
  EXCLUDE = 2;
}
