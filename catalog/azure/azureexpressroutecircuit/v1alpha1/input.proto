syntax = "proto3";

package dev.planton.azure.azureexpressroutecircuit.v1alpha1;

import "catalog/azure/azureexpressroutecircuit/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureExpressRouteCircuitIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureExpressRouteCircuitIacInput {
  // The ExpressRoute circuit resource to deploy.
  AzureExpressRouteCircuit target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
