syntax = "proto3";

package dev.planton.azure.azureexpressroutecircuit.v1alpha1;

import "shared/options/options.proto";

// **AzureExpressRouteCircuitOutputs** captures the outputs of
// provisioning an ExpressRoute circuit.
message AzureExpressRouteCircuitOutputs {
  // The Azure Resource Manager ID of the circuit.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/expressRouteCircuits/{name}
  string express_route_circuit_id = 1;

  // The name of the circuit -- what peerings
  // (AzureExpressRouteCircuitPeering) reference as
  // express_route_circuit_name.
  string express_route_circuit_name = 2;

  // The SERVICE KEY -- the circuit's provisioning credential, handed to
  // the connectivity provider to complete the physical cross-connect.
  // Marked sensitive in both engines; treat it like a password.
  string service_key = 3 [(dev.planton.shared.options.sensitive) = true];

  // The provider side's provisioning state: "NotProvisioned" (fresh
  // circuit, waiting on the provider), "Provisioning", "Provisioned"
  // (peerings can be configured), or "Deprovisioning".
  string service_provider_provisioning_state = 4;

  // The generated key of each authorization ISSUED by this circuit,
  // keyed by the authorization's name from the spec. A virtual network
  // gateway in another subscription redeems one to connect. Marked
  // sensitive in both engines.
  // Example valueFrom fieldPath: status.outputs.authorization_keys.partner-team
  map<string, string> authorization_keys = 5 [(dev.planton.shared.options.sensitive) = true];
}
