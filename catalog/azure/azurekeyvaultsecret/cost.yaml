# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. This component deliberately ships no
# estimate quantities: a Key Vault secret is free to HOLD -- Microsoft's
# price list has no storage meter for secrets, only the vault's operations
# meter -- so the object itself never appears on the invoice, and every
# charge it shapes is a data-plane call billed on the parent vault.
# Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azurekeyvaultsecret
spec:
  billing_model: usage_based
  cost_drivers:
    - field_path: value
      sku_meter: Key Vault operations
      pricing_unit: 10K transactions
      impact: "Every write of the value is one billed operation that creates a NEW secret version, and every consumer read is another -- all at the vault's 0.03 USD per 10,000 transactions rate. Update cadence and reader traffic, not the secret's size or version count, are what move the bill."
    - field_path: key_vault_id
      sku_meter: Key Vault operations
      pricing_unit: 10K transactions
      impact: "Decides WHERE the spend lands, never how big it is: the referenced AzureKeyVault carries the operations meter this secret's reads and writes bill against, and the rate is identical on the STANDARD and PREMIUM vault tiers."
  estimate_exclusions:
    - "every successfully authenticated data-plane call against the secret (set, get, list) bills the parent vault's operations meter at 0.03 USD per 10,000 transactions -- volume no manifest can predict, and Key Vault publishes no free grant, so both presets estimate to a commitment-absence zero"
  notes: "The secret is the free half of a metered pattern: no storage charge, no per-object charge, no per-version charge -- a secret with a thousand retained versions costs exactly what an unversioned one does to hold. The money moves only when something calls the vault about it, and those operations bill on the AzureKeyVault component this spec references, at the same rate in either vault tier. Advisory attributes (expiry, not-before) and tags are free metadata. Rate is eastus retail, retrieved 2026-08-18 from the Azure Retail Prices API and the Key Vault pricing page."
