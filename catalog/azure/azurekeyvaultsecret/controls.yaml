# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azurekeyvaultsecret
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Key Vault persists every secret encrypted with HSM-backed keys unconditionally -- no configuration at any level stores the value in plaintext."
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: "The vault's own storage encryption is Microsoft-managed by design; a secret offers no per-object key choice, and no customer-key surface exists anywhere in the Key Vault storage path."
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Every read and write of the secret travels the vault's HTTPS-only data plane ({name}.vault.azure.net, TLS 1.2+); no plaintext path to the value exists."
    - control_id: no-public-access
      status: not_applicable
      notes: "A secret has no network surface of its own -- reachability is the parent vault's posture (public_network_access_enabled, network_acls, private endpoints), set on the AzureKeyVault component this spec references."
    - control_id: restricted-ingress
      status: not_applicable
      notes: "Inbound filtering is the vault's network_acls territory (see no-public-access) -- there is no per-secret network rule to declare."
    - control_id: edge-protection
      status: not_applicable
      notes: "The data plane serving this secret is a Microsoft-managed REST endpoint with no WAF attachment point; the customer-side perimeter is the vault's network rules plus Azure AD authentication."
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Every data-plane call touching the secret is authorized by the vault -- Azure RBAC roles like Key Vault Secrets User in the recommended mode, or legacy access-policy grants -- and no configuration makes a secret anonymously readable."
      notes: "WHICH authorization model applies is the vault's rbac_authorization_enabled choice, examined on the AzureKeyVault profile. Grants are composed via AzureRoleAssignment at vault or secret scope."
    - control_id: workload-identity
      status: not_applicable
      notes: "The secret runs nothing and calls nothing -- it IS a held credential. Whether its consumers fetch it with short-lived managed identities instead of embedding it is decided on the consumer components; storing credentials here rather than in manifests is this component's entire contribution to that posture."
    - control_id: no-legacy-auth
      status: not_applicable
      notes: "The secret has no authentication paths of its own to strengthen or disable; legacy-versus-RBAC authorization is the vault's choice (see rbac)."
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: "A secret is a data-plane object, so even its CREATION never reaches the Azure Activity Log -- the audit trail of who set or read it is the vault's AuditEvent diagnostic logging, a vault-level diagnostic setting outside both this spec and the vault's. Compose it when access-level audit is required."
    - control_id: monitoring-integration
      status: not_applicable
      notes: "Secrets publish no per-object metrics; traffic and availability signals ride the vault's automatic platform metrics. Near-expiry watching composes through Key Vault's Event Grid system topic (SecretNearExpiry events), a separate component."
    - control_id: backup-recovery
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Soft delete is always on vault-wide and covers every secret: a deleted secret stays recoverable for the vault's retention window (7-90 days, default 90), and the official modules auto-recover a name-colliding create against a soft-deleted secret rather than failing."
      notes: "Deletion-recovery, not replication-grade backup -- point-in-time protection of the VALUE is version history, which every write extends. A data-plane backup/restore blob exists as an operation outside this spec."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: "Recovery retention is the vault's soft_delete_retention_days -- one window for everything inside; no per-secret retention knob exists."
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "The secret inherits Key Vault's automatic redundancy -- zone-redundant service in availability-zone regions, with contents replicated within the region (and to the paired region where one exists), no configuration surface, no opt-out."
    - control_id: deletion-protection
      status: not_applicable
      notes: "No per-secret protection flag exists. The vault's purge_protection_enabled is the relevant guard: with it on, even a deleted secret cannot be purged before the retention window lapses -- set on the AzureKeyVault component."
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Fully managed PaaS -- Microsoft operates and patches the service holding the secret; no customer-visible patch surface exists."
