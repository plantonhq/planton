syntax = "proto3";

package dev.planton.azure.azurekeyvaultsecret.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurekeyvaultsecret/v1alpha1/outputs.proto";
import "catalog/azure/azurekeyvaultsecret/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureKeyVaultSecret is the top-level API resource describing a
// secret stored in an Azure Key Vault -- a versioned sensitive string
// (password, API key, connection string) the vault guards.
message AzureKeyVaultSecret {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzureKeyVaultSecret".
  string kind = 2 [(buf.validate.field).string.const = 'AzureKeyVaultSecret'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Key Vault secret specification.
  AzureKeyVaultSecretSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzureKeyVaultSecretStatus status = 5;
}

// AzureKeyVaultSecretStatus holds the deployment outputs.
message AzureKeyVaultSecretStatus {
  // Outputs from the IaC deployment.
  AzureKeyVaultSecretOutputs outputs = 1;
}
