syntax = "proto3";

package dev.planton.azure.azurekeyvaultsecret.v1alpha1;

import "catalog/azure/azurekeyvaultsecret/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureKeyVaultSecretIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureKeyVaultSecretIacInput {
  // The Key Vault secret resource to deploy.
  AzureKeyVaultSecret target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
