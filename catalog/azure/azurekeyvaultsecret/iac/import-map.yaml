apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: azurekeyvaultsecret
spec:
  # The secret's import identity is its versioned DATA-PLANE ID
  # (https://{vault}.vault.azure.net/secrets/{name}/{version}) -- Key
  # Vault nested items import by URI, not ARM path.
  values:
    - name: secret_id
      derivations:
        - from_output: secret_id
      where_to_find: >-
        `az keyvault secret show --vault-name <vault> -n <name> --query
        id` (returns the current version's URI), or the component's own
        secret_id output.
