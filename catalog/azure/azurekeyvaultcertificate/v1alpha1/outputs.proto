syntax = "proto3";

package dev.planton.azure.azurekeyvaultcertificate.v1alpha1;

// **AzureKeyVaultCertificateOutputs** captures the outputs of
// provisioning a Key Vault certificate -- the identifiers downstream
// resources reference to terminate TLS with it.
message AzureKeyVaultCertificateOutputs {
  // The certificate's versioned data-plane ID:
  // https://{vault}.vault.azure.net/certificates/{name}/{version}. Pins
  // consumers to THIS version -- renewals do not follow.
  string certificate_id = 1;

  // The certificate's versionless data-plane ID:
  // https://{vault}.vault.azure.net/certificates/{name}. Follows renewals
  // automatically.
  string versionless_id = 2;

  // The versioned ID of the certificate's SECRET face:
  // https://{vault}.vault.azure.net/secrets/{name}/{version}. The value
  // TLS terminators consume -- Application Gateway listeners and App
  // Service certificate bindings take exactly this (or its versionless
  // sibling below, to follow renewals).
  string secret_id = 3;

  // The versionless ID of the certificate's secret face:
  // https://{vault}.vault.azure.net/secrets/{name}. The reference that
  // keeps TLS terminators on the CURRENT certificate across renewals --
  // prefer it over secret_id wherever the consumer supports versionless
  // references.
  string versionless_secret_id = 4;

  // The certificate's name within the vault.
  string certificate_name = 5;

  // The current version identifier (the trailing segment of
  // certificate_id).
  string version = 6;

  // The SHA-1 thumbprint of the current certificate, hex-encoded -- the
  // fingerprint integrations match on.
  string thumbprint = 7;

  // The certificate's versioned ARM resource ID -- the control-plane
  // identity used by ARM-level integrations.
  string resource_manager_id = 8;

  // The certificate's versionless ARM resource ID.
  string resource_manager_versionless_id = 9;
}
