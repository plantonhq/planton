syntax = "proto3";

package dev.planton.azure.azurekeyvaultcertificate.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurekeyvaultcertificate/v1alpha1/outputs.proto";
import "catalog/azure/azurekeyvaultcertificate/v1alpha1/spec.proto";
import "shared/metadata.proto";

// azure-key-vault-certificate
message AzureKeyVaultCertificate {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureKeyVaultCertificate'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AzureKeyVaultCertificateSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AzureKeyVaultCertificateStatus status = 5;
}

// azure-key-vault-certificate status
message AzureKeyVaultCertificateStatus {
  //outputs
  //  azure-key-vault-certificate outputs
  AzureKeyVaultCertificateOutputs outputs = 1;
}
