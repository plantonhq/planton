apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurekeyvaultcertificate
spec:
  # The harness deploys the fixture resource group and vault (registry
  # prerequisite chain), enrolls a self-signed auto-renewing certificate
  # (issuer "Self" completes synchronously -- no CA dependency), verifies it
  # through the vault's DATA PLANE (ARM has no certificate read proxy),
  # destroys it, and verifies it is gone -- on both provisioners. The run
  # depends on the subscription-scoped "Key Vault Administrator" bootstrap
  # grant the harness Setup ensures.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
