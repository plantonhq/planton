# Minimal AzureKeyVaultCertificate scenario: a self-signed, auto-renewing
# TLS certificate generated by the fixture vault.
#
# The vault reference resolves against the registry prerequisite's captured
# outputs through the field's default kind. Issuer "Self" keeps enrollment
# synchronous and dependency-free (a CA issuer would park the operation
# pending). The policy exercises the full generate path: key properties,
# an AUTO_RENEW lifetime action at the conventional 80% trigger, the PKCS12
# secret face, and X.509 properties with a DNS SAN. The secret_id /
# versionless_secret_id outputs -- the seam TLS terminators consume -- must
# populate on both engines. User tags exercise the merge-over-metadata-tags
# path.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureKeyVaultCertificate
metadata:
  name: planton-oss-e2e-azurekeyvaultcertificate-smoke
  id: planton-oss-e2e-azurekeyvaultcertificate-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurekeyvaultcertificate
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  name: pltn-oss-e2e-tls-smoke
  keyVaultId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-kv
  certificatePolicy:
    issuerName: Self
    keyProperties:
      exportable: true
      keyType: RSA
      keySize: 2048
    lifetimeActions:
      - actionType: AUTO_RENEW
        trigger:
          lifetimePercentage: 80
    secretProperties:
      contentType: PKCS12
    x509CertificateProperties:
      subject: CN=e2e.planton.internal
      subjectAlternativeNames:
        dnsNames:
          - e2e.planton.internal
      keyUsage:
        - DIGITAL_SIGNATURE
        - KEY_ENCIPHERMENT
      validityInMonths: 12
  tags:
    e2e-suite: azure
    purpose: smoke
