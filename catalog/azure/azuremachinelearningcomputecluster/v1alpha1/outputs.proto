syntax = "proto3";

package dev.planton.azure.azuremachinelearningcomputecluster.v1alpha1;

// **AzureMachineLearningComputeClusterOutputs** captures the
// outputs of provisioning a Machine Learning compute cluster.
message AzureMachineLearningComputeClusterOutputs {
  // The Azure Resource Manager ID of the compute cluster.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.MachineLearningServices/workspaces/{ws}/computes/{name}
  string machine_learning_compute_cluster_id = 1;

  // The cluster's name -- what jobs and pipelines reference as their
  // compute target within the workspace.
  string machine_learning_compute_cluster_name = 2;

  // The principal (object) ID of the cluster's system-assigned
  // identity, when one is enabled -- what storage / Key Vault / ACR
  // grants bind to so jobs on the cluster can reach data and images.
  string system_assigned_identity_principal_id = 3;
}
