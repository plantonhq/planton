syntax = "proto3";

package dev.planton.azure.azuremachinelearningcomputecluster.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azuremachinelearningcomputecluster/v1alpha1/outputs.proto";
import "catalog/azure/azuremachinelearningcomputecluster/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureMachineLearningComputeCluster is the top-level API resource
// describing an auto-scaling compute cluster on an Azure Machine
// Learning workspace -- the pool of VMs that training jobs and
// pipelines run on, growing and shrinking between its configured node
// bounds.
message AzureMachineLearningComputeCluster {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzureMachineLearningComputeCluster".
  string kind = 2 [(buf.validate.field).string.const = 'AzureMachineLearningComputeCluster'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Compute cluster specification.
  AzureMachineLearningComputeClusterSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzureMachineLearningComputeClusterStatus status = 5;
}

// AzureMachineLearningComputeClusterStatus holds the deployment outputs.
message AzureMachineLearningComputeClusterStatus {
  // Outputs from the IaC deployment.
  AzureMachineLearningComputeClusterOutputs outputs = 1;
}
