apiVersion: azure.planton.dev/v1alpha1
kind: AzureMachineLearningComputeCluster
metadata:
  name: gpu-cluster
spec:
  workspaceId:
    value: "<your-machine-learning-workspace-id>"
  name: gpu-cluster
  # GPU quota often lives in a different region from the workspace --
  # clusters (uniquely in the ML family) may run their nodes there.
  region: eastus
  # NC-series (V100): check the family's regional quota BEFORE sizing;
  # the failure otherwise arrives at scale-up, not at create.
  vmSize: Standard_NC6s_v3
  vmPriority: DEDICATED
  scaleSettings:
    minNodeCount: 0
    maxNodeCount: 2
    # GPU nodes are expensive -- release them quickly once idle.
    scaleDownNodesAfterIdleDuration: PT10M
  identity:
    type: SYSTEM_ASSIGNED
