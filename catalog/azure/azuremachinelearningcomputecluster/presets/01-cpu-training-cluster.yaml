apiVersion: azure.planton.dev/v1alpha1
kind: AzureMachineLearningComputeCluster
metadata:
  name: cpu-cluster
spec:
  workspaceId:
    value: "<your-machine-learning-workspace-id>"
  # 3-32 chars, letters/digits/hyphens -- what jobs reference as their
  # compute target.
  name: cpu-cluster
  region: eastus
  vmSize: Standard_DS3_v2
  vmPriority: DEDICATED
  # Scale-to-zero: free while idle; nodes provision when jobs arrive
  # and release after 30 idle minutes.
  scaleSettings:
    minNodeCount: 0
    maxNodeCount: 4
    scaleDownNodesAfterIdleDuration: PT30M
  # The identity jobs use to reach storage, Key Vault, and the
  # registry -- grant it data access before jobs run.
  identity:
    type: SYSTEM_ASSIGNED
