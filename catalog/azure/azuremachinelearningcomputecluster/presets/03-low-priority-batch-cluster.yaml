apiVersion: azure.planton.dev/v1alpha1
kind: AzureMachineLearningComputeCluster
metadata:
  name: spot-batch-cluster
spec:
  workspaceId:
    value: "<your-machine-learning-workspace-id>"
  name: spot-batch
  region: eastus
  vmSize: Standard_DS3_v2
  # Evictable spot-class nodes at a deep discount -- ONLY for
  # checkpointed, fault-tolerant workloads: Azure may take nodes (and
  # the work on them) at any time.
  vmPriority: LOW_PRIORITY
  scaleSettings:
    minNodeCount: 0
    maxNodeCount: 8
    scaleDownNodesAfterIdleDuration: PT5M
  identity:
    type: SYSTEM_ASSIGNED
