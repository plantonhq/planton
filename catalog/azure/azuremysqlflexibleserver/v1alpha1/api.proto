syntax = "proto3";

package dev.planton.azure.azuremysqlflexibleserver.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azuremysqlflexibleserver/v1alpha1/outputs.proto";
import "catalog/azure/azuremysqlflexibleserver/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureMysqlFlexibleServer is the top-level API resource for an Azure
// Database for MySQL Flexible Server: Azure's managed MySQL with
// per-server compute/storage sizing, zone-redundant high availability,
// Microsoft Entra administration, customer-managed-key encryption, read
// replicas, and point-in-time restore. Supports MySQL 5.7, 8.0.21 (the
// 8.0 series), and 8.4.
message AzureMysqlFlexibleServer {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureMysqlFlexibleServer'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureMysqlFlexibleServerSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureMysqlFlexibleServerStatus status = 5;
}

// AzureMysqlFlexibleServerStatus holds the deployment status and outputs.
message AzureMysqlFlexibleServerStatus {
  // outputs
  AzureMysqlFlexibleServerOutputs outputs = 1;
}
