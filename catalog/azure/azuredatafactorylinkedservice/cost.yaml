# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azuredatafactorylinkedservice
spec:
  billing_model: free
  free_tier: A linked service is a saved connection in the factory's address book -- where an external system lives and how to authenticate to it. It stores no data and runs no compute; holding any number of connections carries no standing meter.
  notes: "Two honest nuances, both tiny and both metered on the FACTORY, not here. Authoring ticks Data Factory's read/write operations meter -- every create, read, update, or delete of an entity (linked services included) bills per 50,000 operations, fractions of a cent per deploy cycle. The real spend is what USES the connection: pipeline activity runs, data-movement DIU-hours, and data-flow vCore-hours bill on the AzureDataFactory, priced by which integration runtime the connection runs through (integration_runtime_name -- Azure-hosted rates versus self-hosted rates), and the connected system itself (the storage account, database, Databricks workspace, or Snowflake behind this connection) bills as its own kind. An idle linked service drives none of it."
