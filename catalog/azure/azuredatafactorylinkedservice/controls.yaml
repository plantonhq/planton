# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azuredatafactorylinkedservice
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A linked service is a login recipe, and any inline secret material it carries (connection strings, service principal keys, passwords) is stored encrypted by the Microsoft-operated Data Factory service as the definition at rest; secret-typed fields are additionally write-only in the API (never returned on read).
      notes: The spec's preferred patterns avoid storing secrets here at all -- managed identity, or a Key-Vault-sourced secret (a reference to a Key Vault linked service plus a secret name, resolved by Data Factory at run time so no secret ever sits in this spec).
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: The customer-managed-key lever for stored factory definitions (this entity included) lives on the AzureDataFactory kind, not per linked service.
    - control_id: enc-in-transit
      status: not_applicable
      notes: Run-time transport to the connected system is decided by each connector's endpoint and connection settings across the 23 variants (an HTTPS service_endpoint, a database connection string's encryption options), not by a single toggle on this spec; managing the definition flows through ARM's TLS-only management API.
    - control_id: no-public-access
      status: not_applicable
      notes: The connection record has no network endpoint of its own. Which network path run-time traffic takes is the integration runtime choice -- integration_runtime_name pointing at a self-hosted runtime reaches private networks without exposing anything -- and the connected system's exposure is its own kind's posture.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No inbound surface exists on the connection record to restrict.
    - control_id: edge-protection
      status: not_applicable
      notes: No inbound request path exists to filter.
    - control_id: rbac
      status: not_applicable
      notes: The linked service is a connection definition, not an access grant; authoring it is governed by ARM RBAC on the factory (Data Factory Contributor is the canonical role). What the connection may DO in the target system is decided by the credential it carries, which is that system's authorization model.
    - control_id: workload-identity
      status: configurable
      field_path: azure_blob_storage.use_managed_identity
      evidence:
        type: spec_default
        reference: Most variants offer a keyless mode that authenticates as the factory's managed identity instead of a stored secret -- azure_blob_storage.use_managed_identity (mutually exclusive with a service principal, CEL-enforced), azure_databricks.msi_workspace_id (one of exactly three auth forms), and the equivalent switches on the SQL-family, Data Lake, Kusto, and other service variants. The identity is platform-issued and rotated; nothing is stored in the spec.
      notes: The named field is the blob variant's switch, standing for the whole family -- the choice is per-variant, so reviews should read the auth fields of whichever variant block is set. This is the spec's documented preference order -- managed identity first (no secret at all), Key-Vault-sourced secret second, inline secret last.
    - control_id: no-legacy-auth
      status: configurable
      field_path: azure_blob_storage.connection_string
      evidence:
        type: spec_default
        reference: The linked service IS the factory's authentication choice for one connection, and the weaker paths are explicit spec fields -- inline connection strings, account keys, service_principal_key, and password fields authenticate with long-lived shared secrets, while the same variants expose managed-identity switches and AzureDataFactoryLinkedServiceKeyVaultSecretRef blocks (key_vault_password and friends) that keep secrets out of the definition entirely.
      notes: The named field is the blob variant's shared-secret form, standing for the whole family -- deploying a secret-based variant is a deliberate, reviewable choice, not a hidden default, and the variant block on the manifest shows exactly which login pattern the connection uses.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Authoring operations on linked services land in the Azure Activity Log automatically, and connection USE is visible in the factory's pipeline/activity telemetry via its diagnostic settings -- both factory-level posture with no toggle here.
    - control_id: monitoring-integration
      status: not_applicable
      notes: A connection record emits no metrics or runtime signals of its own; run telemetry belongs to the factory and its pipelines.
    - control_id: backup-recovery
      status: not_applicable
      notes: Declarative definition -- nothing to back up; the manifest recreates the connection (secrets re-supplied from their sources, since Azure never returns them).
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: A connection record has no runtime footprint with a zonal failure mode; definitions are held by the Microsoft-operated Data Factory service.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Azure nor this spec offers a deletion-protection flag for a linked service; deleting one breaks every dataset and pipeline that references it at next use and is recreated declaratively.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The service that stores connection definitions and executes them at run time is Microsoft-operated Azure Data Factory (self-hosted integration runtime NODES are the one adjacent surface the customer patches, and those belong to the integration runtime kind, not this one).
