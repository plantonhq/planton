syntax = "proto3";

package dev.planton.azure.azuredatafactorylinkedservice.v1alpha1;

// **AzureDataFactoryLinkedServiceOutputs** captures the outputs
// from provisioning an Azure Data Factory linked service.
message AzureDataFactoryLinkedServiceOutputs {
  // The linked service's Azure Resource Manager ID
  // ({factory_id}/linkedservices/{name}) -- the same ID shape for all
  // connection types.
  string linked_service_id = 1;

  // The linked service's name -- what datasets, data flows, and the
  // Key-Vault-sourced secret references of OTHER linked services
  // resolve against.
  string linked_service_name = 2;
}
