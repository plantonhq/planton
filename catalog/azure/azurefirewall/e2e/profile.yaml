apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurefirewall
spec:
  # THE slow lane of the Azure suite: composed chain fixture resource
  # group -> fixture VNet -> the firewall-shaped subnet instance (ARM name
  # exactly "AzureFirewallSubnet", /26) -> scenario-local no-zone Standard
  # static public IP + fixture STANDARD firewall policy (both via the
  # e2e-prerequisites annotation) -> the policy-attached firewall.
  # Verified via the ARM API (generic GetByID on the firewall's ARM id),
  # destroyed, verified gone -- on both provisioners. Azure Firewall
  # provisions AND deletes in 10-20+ minutes each way, so a single engine
  # lane runs ~25-45 minutes; the timeout leaves headroom for a slow
  # region day.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 90
