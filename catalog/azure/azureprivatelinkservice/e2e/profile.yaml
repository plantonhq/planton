apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azureprivatelinkservice
spec:
  # Live-proven 2026-08-11 on both engines: full lifecycle (deploy,
  # verify via ARM, destroy, verify-destroyed) plus the Terraform blind
  # import round-trip (single-id, zero-change plan). The lane composes
  # the fixture load balancer (declared via the scenario's
  # e2e-prerequisites annotation) and the policies-disabled subnet
  # fixture; the service itself deploys in under a minute -- the
  # fixture chain dominates the ~11-12 min lane.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
