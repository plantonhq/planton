# Minimal AzurePrivateLinkService scenario: the classic load-balancer
# shape. The registry chain deploys the policies-disabled subnet fixture
# (via [AzureSubnet]); the annotation composes the fixture load balancer
# -- a genuinely OPTIONAL reference (the destination is an exactly-one-of
# with destinationIpAddress), so it is scenario-declared rather than a
# registry prerequisite. The lane proves the destination exactly-one-of
# renders, the subnet's disabled-policies contract is satisfied live, and
# the ARM-generated alias surfaces as an output.
apiVersion: azure.planton.dev/v1alpha1
kind: AzurePrivateLinkService
metadata:
  name: planton-oss-e2e-azureprivatelinkservice-smoke
  id: planton-oss-e2e-azureprivatelinkservice-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureprivatelinkservice
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AzureLoadBalancer"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-pls-smoke
  natIpConfigurations:
    - name: nat-1
      subnetId:
        valueFrom:
          name: planton-oss-e2e-azure-fixture-pls-subnet
      primary: true
  loadBalancerFrontendIpConfigurationIds:
    - valueFrom:
        kind: AzureLoadBalancer
        name: planton-oss-e2e-azure-fixture-lb
        fieldPath: status.outputs.frontend_ip_configuration_ids.internal
  tags:
    e2e-suite: azure
    purpose: smoke
