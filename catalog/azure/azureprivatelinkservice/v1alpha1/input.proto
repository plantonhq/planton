syntax = "proto3";

package dev.planton.azure.azureprivatelinkservice.v1alpha1;

import "catalog/azure/azureprivatelinkservice/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzurePrivateLinkServiceIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzurePrivateLinkServiceIacInput {
  // The Private Link Service resource to deploy.
  AzurePrivateLinkService target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
