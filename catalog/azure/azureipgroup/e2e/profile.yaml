apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azureipgroup
spec:
  # The harness deploys the fixture resource group (registry prerequisite),
  # creates an IP Group carrying a mixed address set (a single address plus
  # a CIDR block), verifies it via the ARM API (generic GetByID on the
  # group's ARM id), destroys it, and verifies it is gone -- on both
  # provisioners. The group is free and provisions in seconds, so this is
  # one of the cheapest lanes in the suite.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
