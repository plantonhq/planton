syntax = "proto3";

package dev.planton.azure.azureipgroup.v1alpha1;

import "catalog/azure/azureipgroup/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureIpGroupIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and Azure
// provider credentials.
message AzureIpGroupIacInput {
  // The IP Group resource to deploy.
  AzureIpGroup target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
