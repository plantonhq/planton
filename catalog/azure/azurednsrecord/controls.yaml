# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azurednsrecord
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A DNS record set is public directory data -- its whole purpose is to be handed out in cleartext to any resolver that asks. There is no customer data at rest to protect.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to encrypt (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: DNS answers travel by the querying resolver's protocol (UDP/TCP port 53); the record carries no transport setting, and transport security for public DNS lives with resolvers and clients, not with the record set.
    - control_id: no-public-access
      status: not_applicable
      notes: A record in a PUBLIC zone exists to be world-resolvable -- global reachability is the record's reason for being, not an exposure to harden. Names that must stay internal belong in a private zone (AzurePrivateDnsRecord).
    - control_id: restricted-ingress
      status: not_applicable
      notes: The record accepts no inbound connections; it is data served by Azure's name-server fleet.
    - control_id: edge-protection
      status: not_applicable
      notes: No request path of its own to filter -- the record only names endpoints; WAF posture belongs to the resources the record points at.
    - control_id: rbac
      status: not_applicable
      notes: Management access is ARM RBAC on the zone's per-type record operations (subscription/resource-group posture, e.g. DNS Zone Contributor); the record exposes no authentication plane of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The record runs no workloads and holds no credentials.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths of its own.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Record-set writes land in the Azure Activity Log as subscription-level posture; Azure public DNS offers no per-record query logging surface, and zone-level diagnostics belong to AzureDnsZone.
    - control_id: monitoring-integration
      status: not_applicable
      notes: Query metrics are published per ZONE (AzureDnsZone's diagnostic surface); the record set publishes no metrics of its own.
    - control_id: backup-recovery
      status: not_applicable
      notes: Stateless declarative configuration -- the manifest recreates the record exactly; there is no runtime state to back up.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Azure public DNS answers every record from a globally distributed anycast name-server fleet; a record set has no zonal -- or even regional -- placement, so no single-zone failure mode exists.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither ARM nor this spec offers a deletion-protection flag on record sets (Azure resource locks are subscription-side governance outside the manifest); deleting the record simply stops the zone answering for that (name, type).
    - control_id: managed-patching
      status: not_applicable
      notes: The record is data inside the Microsoft-operated DNS serving fleet -- it has no software surface of its own to patch.
