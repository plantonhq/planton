# Alias-A AzureDnsRecord scenario: the zone APEX tracking a fixture
# Public IP by ARM ID -- the alias mechanism that keeps the answer in
# sync with the resource (and the only way to point an apex at an Azure
# resource, since DNS forbids CNAME there). The Public IP is an OPTIONAL
# seam, so it arrives via the e2e-prerequisites annotation rather than
# a registry prerequisite.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureDnsRecord
metadata:
  name: planton-oss-e2e-azurednsrecord-alias
  id: planton-oss-e2e-azurednsrecord-alias
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurednsrecord
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "azurepublicip"
  tags:
    - planton-e2e
spec:
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  zoneName:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-dnszone
  name: "@"
  ttlSeconds: 60
  a:
    # Alias targets are bare polymorphic refs (no default kind), so the
    # reference declares its kind explicitly -- the resolver leaves a
    # kind-less reference on a bare ref untouched.
    targetResourceId:
      valueFrom:
        kind: AzurePublicIp
        name: planton-oss-e2e-azure-fixture-pip
        fieldPath: status.outputs.public_ip_id
