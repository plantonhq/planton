# CNAME-by-reference AzureDnsRecord scenario: the record's target
# hostname resolved from another resource's output at deploy time -- the
# composition seam charts use to point a routing record at a hostname
# Azure mints (a Front Door endpoint's hash-suffixed host_name). The
# labeled fixture Public IP stands in as the hostname source: its fqdn
# output only exists once Azure allocates it, so a resolved-and-deployed
# record proves the reference path end to end.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureDnsRecord
metadata:
  name: planton-oss-e2e-azurednsrecord-cnameref
  id: planton-oss-e2e-azurednsrecord-cnameref
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurednsrecord
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "catalog/azure/azurednsrecord/e2e/fixture-labeled-pip.yaml"
  tags:
    - planton-e2e
spec:
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  zoneName:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-dnszone
  name: www
  ttlSeconds: 60
  cname:
    # CNAME targets are bare polymorphic refs (no default kind), so the
    # reference declares its kind explicitly.
    value:
      valueFrom:
        kind: AzurePublicIp
        name: planton-oss-e2e-dnsrecord-labeled-pip
        fieldPath: status.outputs.fqdn
