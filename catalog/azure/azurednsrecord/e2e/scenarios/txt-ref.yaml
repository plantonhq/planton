# TXT-by-reference AzureDnsRecord scenario: a record set MIXING a
# referenced value and a literal in one repeated field -- the
# domain-verification composition seam charts use to publish a token
# another resource mints at deploy time (a Front Door custom domain's
# validation_token at `_dnsauth.<host>`). The labeled fixture Public
# IP's fqdn stands in as the deploy-time value; the literal proves the
# two forms coexist in one record set.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureDnsRecord
metadata:
  name: planton-oss-e2e-azurednsrecord-txtref
  id: planton-oss-e2e-azurednsrecord-txtref
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurednsrecord
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "catalog/azure/azurednsrecord/e2e/fixture-labeled-pip.yaml"
  tags:
    - planton-e2e
spec:
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  zoneName:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-dnszone
  name: _dnsauth.www
  ttlSeconds: 60
  txt:
    # TXT values are bare polymorphic refs (no default kind), so the
    # reference declares its kind explicitly.
    - valueFrom:
        kind: AzurePublicIp
        name: planton-oss-e2e-dnsrecord-labeled-pip
        fieldPath: status.outputs.fqdn
    - value: v=spf1 -all
