syntax = "proto3";

package dev.planton.azure.azurednsrecord.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurednsrecord/v1alpha1/outputs.proto";
import "catalog/azure/azurednsrecord/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureDnsRecord represents a DNS record in an Azure DNS Zone.
// This resource creates individual DNS records (A, AAAA, CNAME, MX, TXT, etc.)
// within an existing Azure DNS Zone.
message AzureDnsRecord {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureDnsRecord'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AzureDnsRecordSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AzureDnsRecordStatus status = 5;
}

// AzureDnsRecordStatus represents the status of an Azure DNS Record deployment.
message AzureDnsRecordStatus {
  //outputs
  //  azure-dns-record outputs
  AzureDnsRecordOutputs outputs = 1;
}
