apiVersion: azure.planton.dev/v1alpha1
kind: AzureDnsRecord
metadata:
  name: my-mail-mx-records
spec:
  resourceGroup:
    value: <your-resource-group>
  zoneName:
    value: example.com
  # Mail records live at the zone apex.
  name: "@"
  # Long TTL: mail-server topology changes rarely, and senders retry.
  ttlSeconds: 3600
  mx:
    # Lowest preference is tried first.
    - preference: 10
      exchange:
        value: mail1.example.com
    - preference: 20
      exchange:
        value: mail2.example.com
