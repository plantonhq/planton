syntax = "proto3";

package dev.planton.azure.azurelocalnetworkgateway.v1alpha1;

// **AzureLocalNetworkGatewayOutputs** captures the outputs of
// provisioning a local network gateway.
message AzureLocalNetworkGatewayOutputs {
  // The Azure Resource Manager ID of the local network gateway -- what
  // connections reference as local_network_gateway_id.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/localNetworkGateways/{name}
  string local_network_gateway_id = 1;

  // The name of the local network gateway resource.
  string local_network_gateway_name = 2;
}
