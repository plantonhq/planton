# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azurelocalnetworkgateway
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: An address-book record describing an on-premises site; it stores no customer data at rest (its contents -- a public endpoint and route prefixes -- are network metadata, not payload).
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to encrypt (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: Tunnel encryption (IPsec/IKE policy) is negotiated by the virtual network gateway and its connection resource -- separate kinds; this object only names the peer and the prefixes behind it.
    - control_id: no-public-access
      status: not_applicable
      notes: The object itself listens nowhere -- gateway_address/gateway_fqdn RECORD the on-premises device's public endpoint so Azure knows where to send tunnel traffic; the device's exposure is governed on-premises, outside Azure.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No inbound surface exists to restrict; what traffic enters the tunnel is decided by the connection and the routing this object declares (address_spaces, bgp_settings), not by an ingress filter.
    - control_id: edge-protection
      status: not_applicable
      notes: No request path exists to filter.
    - control_id: rbac
      status: not_applicable
      notes: Management access is subscription/resource-group RBAC posture, not a component choice; the object exposes no authentication plane of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The object runs no workloads and holds no credentials -- tunnel authentication (shared keys, certificates) lives on the connection resource, a separate kind.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths of its own.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Control-plane changes land in the Azure Activity Log as subscription-level posture; tunnel diagnostics belong to the virtual network gateway, a separate kind.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The object publishes no metrics; tunnel health and throughput are the virtual network gateway's and connection's observability, separate kinds.
    - control_id: backup-recovery
      status: not_applicable
      notes: Stateless description record -- nothing to back up; the manifest recreates it declaratively.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Nothing runs here, so there is nothing to replicate -- the object is ARM metadata consumed by the gateway. Tunnel resilience (zone-redundant gateway SKUs, active-active tunnels, multiple sites) lives on the virtual network gateway and connection kinds.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Azure nor this spec offers a deletion-protection flag for a local network gateway (Azure resource locks are subscription-side governance outside the manifest).
    - control_id: managed-patching
      status: not_applicable
      notes: No software surface exists to patch -- the object deploys nothing; the on-premises VPN device it describes is patched by its owner, outside Azure entirely.
