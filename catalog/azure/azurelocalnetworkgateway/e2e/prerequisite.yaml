# AzureLocalNetworkGateway install profile used as a prerequisite by
# composed components (declared via prerequisites: [AzureLocalNetworkGateway]
# in the kind registry -- the gateway connection's site-to-site far side).
# The harness deploys this document (via the kind's Pulumi module) after
# the fixture resource group and captures its outputs --
# local_network_gateway_id in particular -- for dependents' references to
# resolve against. The fixture describes a documentation-range site
# (TEST-NET-3 public IP, RFC 1918 prefix): ARM provisions the description
# without ever contacting the address, so no real device is needed.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureLocalNetworkGateway
metadata:
  name: planton-oss-e2e-azure-fixture-lngw
  id: planton-oss-e2e-azure-fixture-lngw
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurelocalnetworkgateway
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-azure-fixture-lngw
  gatewayAddress: "203.0.113.10"
  addressSpaces:
    - "192.168.100.0/24"
