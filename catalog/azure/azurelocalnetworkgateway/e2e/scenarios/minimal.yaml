# Minimal AzureLocalNetworkGateway scenario: a static-endpoint site
# description with BGP -- both routing sources exercised in one document.
# The object is pure ARM metadata (nothing deploys on-premises, nothing
# contacts the TEST-NET-3 address), so the lane proves the description
# round-trips: both endpoint forms are ExactlyOneOf at the provider,
# the address space renders as a v5 SET, and the BGP block's
# tunnel-interior peering address persists.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureLocalNetworkGateway
metadata:
  name: planton-oss-e2e-azurelocalnetworkgateway-smoke
  id: planton-oss-e2e-azurelocalnetworkgateway-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurelocalnetworkgateway
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-lngw-smoke
  gatewayAddress: "203.0.113.20"
  addressSpaces:
    - "192.168.110.0/24"
  bgpSettings:
    asn: 65020
    bgpPeeringAddress: "10.255.254.1"
    peerWeight: 10
  tags:
    e2e-suite: azure
    purpose: smoke
