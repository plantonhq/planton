apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurelinuxwebapp
spec:
  # The scenario deploys the fixture resource group and the fixture
  # Basic B1 plan (registry prerequisites), creates a Python web app
  # with always-on, a health probe, enum dials, and the Front Door
  # origin-lockdown ip-restriction (FDID-header GUIDs), verifies it via
  # the ARM API, destroys it, and verifies it is gone. Site names
  # release immediately on delete, so both engine runs can own the same
  # globally-unique name sequentially.
  #
  # Live-proven on both engines against azurerm 5 (2026-08-11): the v5
  # treatment (service-retired Ruby runtime removed from the application
  # stack in spec and both modules) deploys, verifies, and destroys
  # cleanly, including the FDID-header ip-restriction path and the
  # Basic B1 always-on/health-probe surface (~5 min per engine).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
