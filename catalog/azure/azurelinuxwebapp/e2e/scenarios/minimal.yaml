# Minimal AzureLinuxWebApp scenario: a Python web app on the fixture
# Basic B1 plan (registry prerequisite; the resource group arrives
# transitively) -- proving the plan FK seam, the enum dials (TLS floor,
# FTPS state), always-on on a dedicated tier, app settings, and user
# tags. The app name is globally unique (*.azurewebsites.net); this
# scenario owns it and sequential engine runs recreate it only after the
# previous delete completes (site names release immediately on delete).
apiVersion: azure.planton.dev/v1alpha1
kind: AzureLinuxWebApp
metadata:
  name: planton-oss-e2e-azurelinuxwebapp-smoke
  id: planton-oss-e2e-azurelinuxwebapp-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurelinuxwebapp
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  # centralus: the app must live in its plan's region, and the fixture
  # plan runs in centralus (probe-verified Basic-tier capacity on
  # the test subscription).
  region: centralus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  webAppName: pltn-oss-e2e-azweb-smoke
  servicePlanId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-plan
  httpsOnly: true
  appSettings:
    E2E_MARKER: smoke
  siteConfig:
    applicationStack:
      pythonVersion: "3.12"
    alwaysOn: true
    healthCheckPath: /health
    healthCheckEvictionTimeInMin: 5
    minimumTlsVersion: TLS_1_2
    ftpsState: DISABLED
    http2Enabled: true
    # The Front Door origin-lockdown wire path: an FDID-filtered ALLOW
    # rule on the AzureFrontDoor.Backend service tag. The literal form
    # proves both engines deliver the header GUIDs to ARM; the
    # repeated-reference RESOLUTION path of the same field class is
    # live-proven by the DNS-record reference scenarios (a Front Door
    # profile fixture here would add its ~18-minute deletion tax to the
    # lane for machinery already proven).
    ipRestrictions:
      - name: front-door-only
        priority: 100
        action: ALLOW
        serviceTag: AzureFrontDoor.Backend
        headers:
          xAzureFdid:
            - value: 11111111-2222-3333-4444-555555555555
      - name: e2e-probe
        priority: 200
        action: ALLOW
        ipAddress: 0.0.0.0/0
    ipRestrictionDefaultAction: DENY
  tags:
    e2e-suite: azure
