syntax = "proto3";

package dev.planton.azure.azurelinuxwebapp.v1alpha1;

import "catalog/azure/azurelinuxwebapp/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureLinuxWebAppIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message AzureLinuxWebAppIacInput {
  // target infra-component to be deployed
  AzureLinuxWebApp target = 1;
  // provider-config for Azure authentication
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
