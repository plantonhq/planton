syntax = "proto3";

package dev.planton.azure.azureprivatednsresolverforwardingruleset.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureprivatednsresolverforwardingruleset/v1alpha1/outputs.proto";
import "catalog/azure/azureprivatednsresolverforwardingruleset/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzurePrivateDnsResolverForwardingRuleset is the top-level API
// resource describing a DNS forwarding ruleset -- the rule book that
// steers DNS queries for chosen domains out of Azure through a DNS
// Private Resolver's outbound endpoints.
message AzurePrivateDnsResolverForwardingRuleset {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzurePrivateDnsResolverForwardingRuleset".
  string kind = 2 [(buf.validate.field).string.const = 'AzurePrivateDnsResolverForwardingRuleset'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // DNS forwarding ruleset specification.
  AzurePrivateDnsResolverForwardingRulesetSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzurePrivateDnsResolverForwardingRulesetStatus status = 5;
}

// AzurePrivateDnsResolverForwardingRulesetStatus holds the deployment
// outputs.
message AzurePrivateDnsResolverForwardingRulesetStatus {
  // Outputs from the IaC deployment.
  AzurePrivateDnsResolverForwardingRulesetOutputs outputs = 1;
}
