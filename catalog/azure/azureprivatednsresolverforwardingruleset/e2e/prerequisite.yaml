# AzurePrivateDnsResolverForwardingRuleset install profile used as a
# prerequisite by dependent components (declared via prerequisites:
# [AzurePrivateDnsResolverForwardingRuleset] in the kind registry --
# the virtual network link is the consumer). The harness deploys this
# document after its own prerequisite chain (fixture resolver -> its
# network and delegated subnets) and captures its outputs --
# dns_forwarding_ruleset_id in particular -- for dependents'
# references to resolve against. The fixture carries NO rules by
# design: a link binds the ruleset object, not its rules, and an empty
# rule book keeps the fixture boring. Free at rest.
apiVersion: azure.planton.dev/v1alpha1
kind: AzurePrivateDnsResolverForwardingRuleset
metadata:
  name: planton-oss-e2e-azure-fixture-pdnsfrs
  id: planton-oss-e2e-azure-fixture-pdnsfrs
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureprivatednsresolverforwardingruleset
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-azure-fixture-pdnsfrs
  outboundEndpointIds:
    - valueFrom:
        name: planton-oss-e2e-azure-fixture-pdnsr
