syntax = "proto3";

package dev.planton.azure.azurecomputegalleryimage.v1alpha1;

import "catalog/azure/azurecomputegalleryimage/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureComputeGalleryImageIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureComputeGalleryImageIacInput {
