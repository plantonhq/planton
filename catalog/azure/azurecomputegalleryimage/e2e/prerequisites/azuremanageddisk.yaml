# Consumer-scoped AzureManagedDisk override for the image kind's
# version scenario: unlike the standard fixture disk (a plain data
# disk), this one carries os_type Linux -- a gallery image VERSION
# requires an OS-typed snapshot source, and a snapshot inherits its
# os_type from the source disk. Empty and small: the chain proves the
# create/reference contracts, not a bootable OS.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureManagedDisk
metadata:
  name: planton-oss-e2e-azure-fixture-osdisk
  id: planton-oss-e2e-azure-fixture-osdisk
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuremanageddisk
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-azure-fixture-osdisk
  storageAccountType: STANDARD_SSD_LRS
  createOption: EMPTY
  diskSizeGb: 16
  osType: LINUX
  hyperVGeneration: V2
