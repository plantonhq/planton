# Minimal AzureComputeGalleryImage scenario: a Gen2 trusted-launch-
# supported Linux image DEFINITION (no versions -- free) in the fixture
# gallery, which arrives through the registry prerequisite chain
# (AzureComputeGallery publishes e2e/prerequisite.yaml).
apiVersion: azure.planton.dev/v1alpha1
kind: AzureComputeGalleryImage
metadata:
  name: planton-oss-e2e-azurecomputegalleryimage-smoke
  id: planton-oss-e2e-azurecomputegalleryimage-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurecomputegalleryimage
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  galleryName:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-gallery
  name: planton-oss-e2e-image-${E2E_RUN_ID}
  region: eastus
  identifier:
    publisher: planton-e2e
    offer: smoke
    sku: minimal-${E2E_RUN_ID}
  osType: Linux
  hyperVGeneration: V2
  trustedLaunchSupported: true
