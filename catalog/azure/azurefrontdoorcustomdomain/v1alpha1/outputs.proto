syntax = "proto3";

package dev.planton.azure.azurefrontdoorcustomdomain.v1alpha1;

// **AzureFrontDoorCustomDomainOutputs** captures the outputs of
// provisioning an Azure Front Door custom domain.
message AzureFrontDoorCustomDomainOutputs {
  // The Azure Resource Manager ID of the custom domain -- what
  // AzureFrontDoorRoute's custom_domain_ids references to serve this
  // hostname, and what a Front Door security policy scopes a WAF to.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/profiles/{profile}/customDomains/{name}
  string custom_domain_id = 1;

  // The hostname the domain serves (echoed from the spec) -- the name
  // to CNAME to the endpoint's host_name at your DNS provider once
  // validation passes.
  string host_name = 2;

  // The DNS validation challenge: publish this value as a TXT record at
  // `_dnsauth.<host_name>` and Azure flips the domain from pending to
  // approved. The token is public by design -- it proves control of the
  // DNS name, not possession of a secret.
  string validation_token = 3;

  // When the current validation token expires (RFC-3339 timestamp). A
  // domain left unvalidated past this instant needs a fresh token
  // (Azure regenerates it on re-validation).
  string expiration_date = 4;
}
