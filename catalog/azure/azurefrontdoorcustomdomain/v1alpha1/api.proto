syntax = "proto3";

package dev.planton.azure.azurefrontdoorcustomdomain.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurefrontdoorcustomdomain/v1alpha1/outputs.proto";
import "catalog/azure/azurefrontdoorcustomdomain/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureFrontDoorCustomDomain is the top-level API resource for a custom
// domain inside an Azure Front Door profile (referenced via profile_id)
// -- your own hostname served by Front Door, with managed or
// bring-your-own TLS. The domain deploys pending DNS validation
// (publish the validation_token output as a TXT record at
// _dnsauth.<host_name>); routes (AzureFrontDoorRoute) attach it via
// their custom_domain_ids.
message AzureFrontDoorCustomDomain {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureFrontDoorCustomDomain'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureFrontDoorCustomDomainSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureFrontDoorCustomDomainStatus status = 5;
}

// AzureFrontDoorCustomDomainStatus holds the deployment status and outputs.
message AzureFrontDoorCustomDomainStatus {
  // outputs
  AzureFrontDoorCustomDomainOutputs outputs = 1;
}
