# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azurefrontdoorcustomdomain
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The domain is edge-serving configuration and stores no customer data. With a bring-your-own certificate the key material lives in Key Vault (wrapped by an AzureFrontDoorSecret), never on this resource.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to encrypt (see enc-at-rest).
    - control_id: enc-in-transit
      status: enforced_by_default
      field_path: tls
      evidence:
        type: module_default
        reference: Custom domains always terminate TLS -- the tls block is spec-required -- and the modules send minimum_version TLS12 unconditionally because Azure retired TLS 1.0/1.1 in March 2025; every domain floors at TLS 1.2 with TLS 1.3 offered on top.
      notes: tls.cipher_suite optionally hardens further -- one of Azure's predefined suite sets (TLS12_2022 / TLS12_2023) or hand-picked CUSTOMIZED suites. The protocol on the origin leg is the route's forwarding_protocol, a separate kind.
    - control_id: no-public-access
      status: not_applicable
      notes: A custom domain exists to serve public traffic on your own hostname; whether traffic actually flows is decided by the routes that attach it (an AzureFrontDoorRoute's custom_domain_ids -- the route side owns the attachment).
    - control_id: restricted-ingress
      status: not_applicable
      notes: Ingress restriction at the edge lives in the WAF policy attached through an AzureFrontDoorSecurityPolicy -- separate kinds; this spec carries no source filter.
    - control_id: edge-protection
      status: not_applicable
      notes: WAF enforcement is attached by an AzureFrontDoorSecurityPolicy that lists this domain's ARM ID in its domain_ids -- the association lives on that kind, not here.
    - control_id: rbac
      status: not_applicable
      notes: Management access is subscription/resource-group RBAC posture, not a component choice; the domain exposes no authentication plane of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The domain runs no workloads and holds no credentials -- ownership is proven by a DNS TXT record you publish, not by a stored secret.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths of its own; legacy TLS versions are retired platform-wide (see enc-in-transit).
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Control-plane changes land in the Azure Activity Log as subscription-level posture; request access logs are the Front Door profile's diagnostic settings, a separate kind.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The domain publishes no metrics of its own; traffic and TLS metrics ride the Front Door profile, a separate kind.
    - control_id: backup-recovery
      status: not_applicable
      notes: Stateless edge configuration -- nothing to back up; the manifest recreates the domain declaratively (recreation re-enters the pending-validation state, so the validation TXT record must be published again).
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Front Door is a global anycast service -- the domain's configuration is served from Microsoft's worldwide edge fleet by design, with no single-zone or single-region failure mode of its own.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Azure nor this spec offers a deletion-protection flag for a custom domain (Azure resource locks are subscription-side governance outside the manifest).
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed edge service -- Microsoft operates and patches the Front Door fleet that terminates TLS for the domain; no customer-visible patch surface exists.
