# Least-privilege permissions the IaC runner's Azure principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: azurefrontdoororigingroup
spec:
  azure:
    groups:
      - purpose: ManageOriginGroup
        actions:
          - Microsoft.Cdn/profiles/origingroups/read
          - Microsoft.Cdn/profiles/origingroups/write
          - Microsoft.Cdn/profiles/origingroups/delete
        provenance: derived
        notes: Covers azurerm_cdn_frontdoor_origin_group -- create, read/refresh, in-place load-balancing/probe/affinity updates, and destroy. The parent profile is addressed by its ARM ID parsed from the profile_id reference, and the module performs no other API calls. Held via CDN Profile Contributor, Contributor, or narrower custom roles.
