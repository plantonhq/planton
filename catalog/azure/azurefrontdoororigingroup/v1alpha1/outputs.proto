syntax = "proto3";

package dev.planton.azure.azurefrontdoororigingroup.v1alpha1;

// **AzureFrontDoorOriginGroupOutputs** captures the outputs of
// provisioning an Azure Front Door origin group.
message AzureFrontDoorOriginGroupOutputs {
  // The Azure Resource Manager ID of the origin group -- what
  // AzureFrontDoorOrigin's origin_group_id (parent) and
  // AzureFrontDoorRoute's origin_group_id (destination) reference.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/profiles/{profile}/originGroups/{name}
  string origin_group_id = 1;

  // The origin group's name -- unique within its profile.
  string origin_group_name = 2;
}
