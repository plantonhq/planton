# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azurefrontdoororigingroup
spec:
  billing_model: free
  free_tier: The origin group itself -- load-balancing settings, health probes, session affinity, and the traffic-restore ramp -- never bills. Azure charges for the traffic Front Door serves, never for the pool definition.
  notes: "No field of this spec buys anything on Azure's side: the group is configuration on the Front Door PROFILE it references (profile_id), and the profile is where Front Door billing lives -- a base fee per its own SKU plus requests and egress, a separate catalog kind. Health probes carry no Azure meter, though every edge location probes every origin, so an aggressive interval_in_seconds adds load (and potentially egress cost) on the BACKENDS -- which bill as their own kinds."
