apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurefrontdoororigingroup
spec:
  # The harness deploys the fixture resource group and the fixture Front
  # Door profile (registry prerequisite), creates the origin group with a
  # health probe and explicit load-balancing dials, verifies it via the
  # ARM API, destroys it, and verifies it is gone -- on both provisioners.
  # Observed runs ~21 min per engine, dominated by the profile fixture's
  # ~18-min deletion.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 45
