apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azuremonitordatacollectionrule
spec:
  # Live-proven on BOTH engines (2026-08-22): the `minimal` scenario
  # (filtered Linux syslog + two perf-counter sources to the fixture
  # workspace, InsightsMetrics to Azure Monitor metrics) ran the full
  # lifecycle green -- deploy ~17-25s, idempotency re-plan clean,
  # destroy ~11-21s, full lane ~3.5-5 min (the workspace fixture chain
  # dominates). The Terraform lane's blind import round-trip re-adopted
  # the rule by its ARM id with a zero-change plan, zero tolerances.
  # VERIFY-OUT reads 3/4 proto fields by design -- the smoke shape
  # carries no identity block, so identity_principal_id is legitimately
  # empty. OFFLINE-ONLY with reasons: the Event Hub / storage /
  # monitor-account destination arms and the remaining seven
  # data-source arms are pure ARM property writes on the exact
  # CreateOrUpdate body the minimal lane proves (plan-verified with
  # rendered-value inspection); custom streams additionally need a
  # Data Collection Endpoint, which is not a catalog kind yet (unblock:
  # the DCE kind entering the catalog).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
