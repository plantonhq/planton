apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: azuremonitordatacollectionrule
spec:
  # The data collection rule imports by its full ARM resource ID.
  values:
    - name: data_collection_rule_id
      derivations:
        - from_output: data_collection_rule_id
      where_to_find: >-
        `az monitor data-collection rule show -g <resource-group> -n
        <name> --query id`, or the component's own
        data_collection_rule_id output.
