syntax = "proto3";

package dev.planton.azure.azureeventhubcluster.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureeventhubcluster/v1alpha1/outputs.proto";
import "catalog/azure/azureeventhubcluster/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureEventHubCluster is the top-level API resource for a dedicated
// Event Hubs cluster -- single-tenant capacity units that namespaces are
// placed on for guaranteed throughput, 1024-partition hubs, 90-day
// retention, and namespace-level CMK encryption. Note Azure's 4-hour
// deletion moratorium on new clusters.
message AzureEventHubCluster {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureEventHubCluster'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureEventHubClusterSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureEventHubClusterStatus status = 5;
}

// AzureEventHubClusterStatus holds the deployment status and outputs.
message AzureEventHubClusterStatus {
  // outputs
  AzureEventHubClusterOutputs outputs = 1;
}
