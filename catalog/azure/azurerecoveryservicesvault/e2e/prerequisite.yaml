# AzureRecoveryServicesVault install profile used as a fixture by
# composed kinds (declared via prerequisites:
# [AzureRecoveryServicesVault] in the kind registry -- the VM backup
# policy and protected-VM lanes today, the file-share pair next). The
# harness deploys this document after the fixture resource group and
# captures its outputs -- recovery_services_vault_name in particular --
# for dependents' references to resolve against.
#
# COST AND TIME: the vault is FREE at rest and creates in one to three
# minutes. The fixture deliberately stays at the plain defaults
# (geo-redundant, no immutability, no CMK, Microsoft-managed keys) so
# dependent lanes stay fast and their teardown stays unblocked: an
# immutable fixture vault would REFUSE protection suspension semantics
# tests and complicate deletes. The smoke scenario is where the vault's
# own deep surface is proven.
#
# TEARDOWN ORDER: a vault with protected items refuses to delete --
# the harness's reverse-order destroy (protections first) satisfies
# that by construction; the queue watch-list carries the soft-delete
# caveat (deleted protections hold data 14 days).
apiVersion: azure.planton.dev/v1alpha1
kind: AzureRecoveryServicesVault
metadata:
  name: planton-oss-e2e-azure-fixture-rsv
  id: planton-oss-e2e-azure-fixture-rsv
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurerecoveryservicesvault
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-fixture-rsv
  tags:
    e2e-suite: azure
    purpose: fixture
