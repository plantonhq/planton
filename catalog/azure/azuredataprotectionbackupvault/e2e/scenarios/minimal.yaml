# Minimal AzureDataProtectionBackupVault scenario: a locally-redundant
# vault-store vault with a system-assigned identity -- free at rest,
# creates in a couple of minutes, and proves the storage settings, the
# soft-delete defaults, and the identity wire shapes live. The one-way
# doors (Locked immutability, AlwaysOn soft delete, CMK) stay
# deliberately OFFLINE-ONLY: each is permanent on a live vault, and the
# offline plans prove their wire shapes without welding a test vault
# shut. Deletion note for the lane: Azure's delete returns early; the
# provider polls until the name frees (destroy runs a little long).
apiVersion: azure.planton.dev/v1alpha1
kind: AzureDataProtectionBackupVault
metadata:
  name: planton-oss-e2e-azuredataprotectionbackupvault-smoke
  id: planton-oss-e2e-azuredataprotectionbackupvault-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuredataprotectionbackupvault
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-dpbv-smoke
  datastoreType: VaultStore
  redundancy: LocallyRedundant
  retentionDurationInDays: 14
  identity:
    type: SYSTEM_ASSIGNED
  tags:
    e2e-suite: azure
    purpose: smoke
