# AzureDataProtectionBackupVault install profile used as a fixture by
# composed components (declared via prerequisites:
# [AzureDataProtectionBackupVault] in the kind registry -- the backup
# policy lane today, the backup instance lanes next). The harness
# deploys this document after the fixture resource group and captures
# its outputs -- backup_vault_id in particular -- for dependents'
# references to resolve against.
#
# COST AND TIME: the vault is FREE at rest and creates in one to three
# minutes. The fixture deliberately stays close to the plain defaults
# (locally-redundant, no immutability, no CMK) so dependent lanes stay
# fast and their teardown stays unblocked: an immutable fixture vault
# would complicate deletes, and CMK is a one-way door nobody wants
# welded onto a shared fixture. The smoke scenario is where the
# vault's own deeper surface is proven. Two deliberate departures from
# the defaults, both serving the teardown-stays-unblocked intent:
#
#   - identity SYSTEM_ASSIGNED: the backup-instance lanes' RBAC grants
#     bind to this identity's principal (Azure Backup acts AS the
#     vault's identity when it validates disk access at instance
#     create) -- without it the grants have no principal to name.
#   - softDelete "Off": a destroyed backup instance on a soft-delete-On
#     vault ghosts for 14 days and wedges the vault's own delete; Off
#     lets a destroyed instance purge outright so the fixture chain
#     tears down cleanly every run.
#
# TEARDOWN ORDER: a vault with backup instances refuses to delete --
# the harness's reverse-order destroy (instances first) satisfies that
# by construction. Azure's delete also returns before the vault is
# fully gone (the provider polls until the name frees) -- expect the
# fixture's destroy to run a minute or two past the API's answer.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureDataProtectionBackupVault
metadata:
  name: planton-oss-e2e-azure-fixture-dpbv
  id: planton-oss-e2e-azure-fixture-dpbv
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuredataprotectionbackupvault
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-fixture-dpbv
  datastoreType: VaultStore
  redundancy: LocallyRedundant
  softDelete: "Off"
  identity:
    type: SYSTEM_ASSIGNED
  tags:
    e2e-suite: azure
    purpose: fixture
