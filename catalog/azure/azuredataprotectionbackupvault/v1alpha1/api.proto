syntax = "proto3";

package dev.planton.azure.azuredataprotectionbackupvault.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azuredataprotectionbackupvault/v1alpha1/outputs.proto";
import "catalog/azure/azuredataprotectionbackupvault/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureDataProtectionBackupVault is the top-level API resource
// describing a Data Protection backup vault -- the safe that modern
// Azure Backup data (disks, blobs, AKS, flexible-server databases,
// Data Lake storage) lives in.
message AzureDataProtectionBackupVault {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzureDataProtectionBackupVault".
  string kind = 2 [(buf.validate.field).string.const = 'AzureDataProtectionBackupVault'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Data Protection backup vault specification.
  AzureDataProtectionBackupVaultSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzureDataProtectionBackupVaultStatus status = 5;
}

// AzureDataProtectionBackupVaultStatus holds the deployment outputs.
message AzureDataProtectionBackupVaultStatus {
  // Outputs from the IaC deployment.
  AzureDataProtectionBackupVaultOutputs outputs = 1;
}
