apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azuredisksnapshot
spec:
  # PROVEN live on both engines: the `minimal` scenario (an
  # incremental Copy snapshot of the fixture disk) through the full
  # lifecycle in ~4 min/engine, with the apply-idempotency re-plan
  # clean (incremental_enabled and the omitted Optional+Computed
  # disk_size_gb both read back clean) and the terraform lane's blind
  # import round-trip zero-change (IMPORT-RT ~14s). The round-trip is
  # what forced the source fields' create-time-only contract: the
  # provider never reads source_resource_id/source_uri back, so a
  # blind import held a null source against the config's ForceNew
  # value and planned a replace -- both modules now carry
  # ignore_changes on the pair and the spec comments teach that a new
  # capture is a new resource. Offline-proven with reasons: the Import
  # arm (needs an uploaded page-blob VHD the lane cannot honestly
  # stand up -- covered by its own offline plan with rendered-value
  # inspection); the ADE encryption-settings block (records legacy
  # in-guest encryption secrets a fresh fixture disk does not have --
  # exercised by the canonical manifest's offline plan); the
  # AllowPrivate/disk-access posture (disk-access resources are a P2
  # kind the catalog does not carry yet). Measured lane spend:
  # pennies (the delta of an empty 16GB disk for the lane's minutes).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
