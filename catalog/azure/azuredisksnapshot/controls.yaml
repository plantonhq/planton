# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azuredisksnapshot
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Managed-disk snapshots are encrypted at rest by Azure Storage service-side encryption with platform-managed keys, always on, with no disable switch -- and a snapshot of a customer-key-encrypted disk stays under that key regime."
    - control_id: enc-at-rest-cmk
      status: configurable
      field_path: encryption_settings
      evidence:
        type: spec_default
        reference: "Unset, the snapshot rides platform-managed (or the source's inherited) encryption. encryption_settings carries legacy Azure Disk Encryption secrets -- the Key Vault secret holding the disk encryption key, optionally wrapped by a customer key-encryption key -- for snapshots of in-guest ADE-encrypted sources, keeping the held bytes under customer key custody."
      notes: "Two customer-key paths exist and only one lives here: encryption_settings is the legacy in-guest ADE carry-over. The modern server-side path -- a disk encryption set keying the snapshot itself -- is not expressible in this spec (the provider resource carries no disk_encryption_set_id for snapshots); a snapshot of a DES-encrypted disk inherits the source's platform-side encryption facts. Also one-way: removing encryption_settings once set forces replacement -- Azure cannot disable encryption in place."
    - control_id: enc-in-transit
      status: not_applicable
      notes: "The snapshot has no client transport surface of its own; export (beginGetAccess) hands out an HTTPS SAS URL, and restores are Azure-internal storage operations."
    - control_id: no-public-access
      status: configurable
      field_path: network_access_policy
      evidence:
        type: spec_default
        reference: "Unset rides the provider default AllowAll (the snapshot's export data plane accepts authorized requests over the public endpoint). AllowPrivate confines export to the disk_access_id private endpoint, and DenyAll removes export access entirely; pairing either with public_network_access_enabled false yields a fully private posture."
      notes: "Neither preset opens or closes this deliberately -- both ride AllowAll, appropriate for pipeline artifacts consumed inside the subscription. Access always requires ARM authorization regardless (see rbac); this control is about the NETWORK path exports may travel."
    - control_id: restricted-ingress
      status: configurable
      field_path: disk_access_id
      evidence:
        type: spec_default
        reference: "With network_access_policy AllowPrivate, the referenced disk-access resource's private endpoint becomes the ONLY network path for snapshot export -- inbound reach restricted to the virtual networks that endpoint serves."
      notes: "The disk-access resource is a plain ARM ID (not a modeled kind); its private endpoint and DNS wiring are composed outside this manifest."
    - control_id: edge-protection
      status: not_applicable
      notes: "A storage artifact offers no request-filtering attachment point; there is no application traffic to front with a WAF."
    - control_id: rbac
      status: not_applicable
      notes: "Every operation on the snapshot -- read, export (beginGetAccess), restore, delete -- is ARM-authorized under subscription/resource-group RBAC, which is platform posture rather than a component choice; the snapshot exposes no authentication plane of its own."
    - control_id: workload-identity
      status: not_applicable
      notes: "The snapshot runs no workloads and holds no credentials; the ADE secrets it may reference live in the customer's Key Vault, governed there."
    - control_id: no-legacy-auth
      status: not_applicable
      notes: "No authentication paths of its own to strengthen or disable; export URLs are time-boxed SAS grants issued through ARM-authorized calls."
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: "Creation, export-access grants, restores, and deletion land in the Azure Activity Log automatically as ARM operations; no per-snapshot log toggle exists."
    - control_id: monitoring-integration
      status: not_applicable
      notes: "Snapshots publish no platform metrics -- they are inert held bytes; operational visibility is the Activity Log and whatever pipeline created them."
    - control_id: backup-recovery
      status: not_applicable
      notes: "This kind IS the backup artifact -- a point-in-time copy of a disk used for restore, cloning, and gallery image sourcing. Nothing backs up a snapshot automatically: protecting it against regional loss means copying it to another region (a second snapshot resource), and protecting a CHAIN means retention discipline in the pipeline that creates them."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: "A snapshot lives until deleted -- retention is however long the manifest (or the pipeline pruning old ones) keeps the resource. Policy-driven scheduling and retention belong to Azure Backup, a different service with its own resources."
    - control_id: multi-zone-ha
      status: not_applicable
      notes: "The modules create snapshots on standard storage with the provider's default redundancy (no SKU surface exists on the resource to choose ZRS) -- a regional artifact. Cross-zone durability follows the storage redundancy Azure applies; cross-REGION resilience is a deliberate copy to another region."
    - control_id: deletion-protection
      status: not_applicable
      notes: "Neither the snapshots API nor this spec offers a deletion-protection flag; ARM resource locks are subscription-side governance. Worth knowing for incremental chains: deleting a middle snapshot triggers Azure-side delta consolidation, not data loss for later snapshots."
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Snapshot storage is Microsoft-operated managed-disk infrastructure; no customer-visible patch surface exists."
