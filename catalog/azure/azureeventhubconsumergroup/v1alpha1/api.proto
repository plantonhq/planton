syntax = "proto3";

package dev.planton.azure.azureeventhubconsumergroup.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureeventhubconsumergroup/v1alpha1/outputs.proto";
import "catalog/azure/azureeventhubconsumergroup/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureEventHubConsumerGroup is the top-level API resource for a consumer
// group on an event hub -- one application's independent read cursor over
// the stream. Each consuming application gets its own group so offsets
// never collide.
message AzureEventHubConsumerGroup {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureEventHubConsumerGroup'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureEventHubConsumerGroupSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureEventHubConsumerGroupStatus status = 5;
}

// AzureEventHubConsumerGroupStatus holds the deployment status and outputs.
message AzureEventHubConsumerGroupStatus {
  // outputs
  AzureEventHubConsumerGroupOutputs outputs = 1;
}
