apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azureeventhubconsumergroup
spec:
  # The harness deploys the fixture resource group, a SCENARIO-LOCAL
  # Event Hubs namespace, and a scenario-local hub (e2e-prerequisites
  # annotation -- namespace names are globally unique, never a shared
  # recreate-per-scenario registry prerequisite), creates a consumer
  # group with user metadata on the hub, verifies it via the ARM API,
  # destroys it, and verifies it is gone -- on both provisioners.
  # Consumer groups create in seconds; the namespace fixture dominates
  # the lane.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
