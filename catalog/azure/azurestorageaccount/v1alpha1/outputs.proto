syntax = "proto3";

package dev.planton.azure.azurestorageaccount.v1alpha1;

import "shared/options/options.proto";

// **AzureStorageAccountOutputs** captures the outputs of provisioning
// an Azure Storage Account: the ARM identity other resources reference, the
// per-service endpoints applications connect to, and the account's access
// keys.
//
// The secondary endpoints are populated only for the read-access
// replication types (RA_GRS / RA_GZRS) -- they are the read-only mirror in
// the paired region.
message AzureStorageAccountOutputs {
  // The Azure Resource Manager ID of the account. This is the primary
  // output: AzureStorageContainer's storage_account_id references it, and
  // role assignments (Storage Blob Data Reader/Contributor) scope to it.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Storage/storageAccounts/{name}
  string storage_account_id = 1;

  // The account's name -- the DNS prefix of every service endpoint, and
  // what app-hosting kinds (Function App, Linux Web App) bind to.
  string storage_account_name = 2;

  // The resource group the account lives in.
  string resource_group_name = 3;

  // The primary blob endpoint, e.g.
  // "https://{name}.blob.core.windows.net/". Object (blob) reads and
  // writes go here.
  string primary_blob_endpoint = 4;

  // The primary blob HOSTNAME (no scheme/slash) -- the exact value a
  // CDN or Front Door origin, or a custom-domain CNAME, points at.
  string primary_blob_host = 5;

  // The primary queue endpoint, e.g.
  // "https://{name}.queue.core.windows.net/".
  string primary_queue_endpoint = 6;

  // The primary table endpoint, e.g.
  // "https://{name}.table.core.windows.net/".
  string primary_table_endpoint = 7;

  // The primary file endpoint, e.g.
  // "https://{name}.file.core.windows.net/". SMB/NFS share mounts and
  // the Files REST API go here.
  string primary_file_endpoint = 8;

  // The primary Data Lake Storage Gen2 (dfs) endpoint, e.g.
  // "https://{name}.dfs.core.windows.net/". Analytics engines
  // (Spark/Databricks/Synapse) address hierarchical-namespace data here.
  string primary_dfs_endpoint = 9;

  // The primary static-website endpoint, e.g.
  // "https://{name}.z13.web.core.windows.net/". Live only when
  // static_website is configured.
  string primary_web_endpoint = 10;

  // The static-website HOSTNAME (no scheme/slash) -- the exact value a
  // CDN or Front Door origin points at for static-site delivery.
  string primary_web_host = 11;

  // The secondary (paired-region, read-only) blob endpoint. Populated
  // only for RA_GRS / RA_GZRS replication.
  string secondary_blob_endpoint = 12;

  // The secondary queue endpoint (RA_GRS / RA_GZRS only).
  string secondary_queue_endpoint = 13;

  // The secondary table endpoint (RA_GRS / RA_GZRS only).
  string secondary_table_endpoint = 14;

  // The secondary file endpoint (RA_GRS / RA_GZRS only).
  string secondary_file_endpoint = 15;

  // The secondary dfs endpoint (RA_GRS / RA_GZRS only).
  string secondary_dfs_endpoint = 16;

  // The secondary static-website endpoint (RA_GRS / RA_GZRS only).
  string secondary_web_endpoint = 17;

  // The account's FIRST shared access key. Static credential material
  // that authorizes EVERY data-plane operation on the account -- treat
  // it like a root password: prefer Entra-based authorization
  // (role assignments against storage_account_id) and reference this
  // key only where a consumer genuinely requires key auth (e.g. a
  // Function App's storage binding).
  string primary_access_key = 18 [(dev.planton.shared.options.sensitive) = true];

  // The account's SECOND shared access key -- exists so consumers can
  // roll from one key to the other without downtime. The same handling
  // guidance as primary_access_key applies.
  string secondary_access_key = 19 [(dev.planton.shared.options.sensitive) = true];

  // A ready-to-use connection string carrying the account name and the
  // PRIMARY access key. Same secret-handling guidance as the keys.
  string primary_connection_string = 20 [(dev.planton.shared.options.sensitive) = true];

  // The connection string carrying the SECONDARY access key.
  string secondary_connection_string = 21 [(dev.planton.shared.options.sensitive) = true];

  // A blob-service-only connection string (primary key + blob
  // endpoint) -- what some SDKs and app settings expect.
  string primary_blob_connection_string = 22 [(dev.planton.shared.options.sensitive) = true];

  // The blob-service-only connection string on the secondary key.
  string secondary_blob_connection_string = 23 [(dev.planton.shared.options.sensitive) = true];

  // The principal (object) ID of the account's system-assigned
  // identity, populated only when the identity type includes
  // SYSTEM_ASSIGNED. Grant this principal roles to let the account act
  // on other resources (e.g. reading a Key Vault key).
  string identity_principal_id = 24;

  // The ARM ID of the account's BLOB service
  // ({storage_account_id}/blobServices/default) -- the diagnostic-
  // settings scope for blob DATA-ACCESS telemetry (StorageRead /
  // StorageWrite / StorageDelete logs). The account-level ID only
  // exposes account metrics; per-operation audit logs live on the
  // service sub-resources, so an AzureMonitorDiagnosticSetting's
  // target_resource_id references this output. Constructed identically
  // on both engines (ARM materializes the service implicitly -- there
  // is nothing to read back).
  string blob_service_id = 25;

  // The ARM ID of the account's FILE service
  // ({storage_account_id}/fileServices/default) -- the diagnostic-
  // settings scope for Azure Files data-access telemetry.
  string file_service_id = 26;

  // The ARM ID of the account's QUEUE service
  // ({storage_account_id}/queueServices/default) -- the diagnostic-
  // settings scope for queue data-access telemetry.
  string queue_service_id = 27;

  // The ARM ID of the account's TABLE service
  // ({storage_account_id}/tableServices/default) -- the diagnostic-
  // settings scope for table data-access telemetry.
  string table_service_id = 28;
}
