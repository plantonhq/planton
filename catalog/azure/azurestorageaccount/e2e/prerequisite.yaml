# AzureStorageAccount install profile used as a fixture by composed
# kinds (declared via prerequisites: [AzureStorageAccount] in the
# kind registry -- the Machine Learning workspace today). The harness
# deploys this document after the fixture resource group and captures
# its outputs -- storage_account_id in particular -- for dependents'
# references to resolve against.
#
# COST AND TIME: a Standard LRS StorageV2 account provisions in under
# a minute and costs pennies at fixture scale (no capacity is
# pre-provisioned).
#
# The fixture deliberately keeps hierarchical namespace OFF (the spec
# default): the ML workspace REJECTS HNS-enabled accounts as its
# default storage -- do not "upgrade" this fixture to Data Lake shape.
# Account names are GLOBALLY unique and 3-24 lowercase alphanumerics;
# this fixture's name is registered by this profile alone.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureStorageAccount
metadata:
  name: planton-oss-e2e-azure-fixture-sa
  id: planton-oss-e2e-azure-fixture-sa
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurestorageaccount
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  accountName: plantonosse2efxsa
  accountKind: STORAGE_V2
  accountTier: STANDARD
  replicationType: LRS
  tags:
    e2e-suite: azure
    purpose: fixture
