# Minimal AzureStorageAccount scenario: a StorageV2 account in the fixture
# resource group, exercising the surfaces a live apply can prove cheaply --
# blob soft delete + versioning, a DENY firewall with the trusted-services
# bypass (ARM reads are control-plane, so verification is unaffected), a
# lifecycle tiering rule (proves the management-policy fold end to end),
# and the user-tag merge path.
#
# The account name is hyphen-FREE (3-24 lowercase alphanumerics -- unlike
# the vault-name precedent) and globally unique; it embeds no environment
# marker beyond the e2e prefix and is distinct from the container
# scenario's fixture account so the two suites never contend for a
# just-deleted name.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureStorageAccount
metadata:
  name: planton-oss-e2e-azurestorageaccount-smoke
  id: planton-oss-e2e-azurestorageaccount-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurestorageaccount
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  accountName: pltnosse2esasmoke
  replicationType: LRS
  blobProperties:
    versioningEnabled: true
    deleteRetentionPolicy:
      days: 7
    containerDeleteRetentionPolicy:
      days: 7
  networkRules:
    defaultAction: DENY
    bypass:
      - AZURE_SERVICES
    ipRules:
      - "203.0.113.0/24"
  lifecycleRules:
    - name: age-out
      filters:
        blobTypes:
          - BLOCK_BLOB
        prefixMatch:
          - logs/
      actions:
        baseBlob:
          tierToCoolAfterDaysSinceModificationGreaterThan: 30
          deleteAfterDaysSinceModificationGreaterThan: 365
  tags:
    e2e-suite: azure
