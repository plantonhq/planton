metadata:
  name: azurebackuppolicyvm
spec:
  # PROVEN live on both engines (proof session, 2026-08-16): `minimal`
  # (V2 daily policy, full retention ladder, on the fixture vault) --
  # Pulumi 5m43s (deploy 36s), Terraform 5m1s incl. an 11s blind
  # import round-trip with a no-differences re-plan. The first live
  # run caught the instant-restore trap (Azure rejects Instant RP >=
  # vaulted daily retention, and V2 defaults instant to 7 when unset
  # -- BMSUserErrorInstantRPRetentionExceedsVaultedRetention); the fix
  # landed as the `bpv_instant_lt_daily` CEL rule plus an explicit
  # instantRestoreRetentionDays: 2 in the smoke. The hourly window and
  # tiering arms stay offline-proven (rendered and inspected in the
  # offline plan -- a second policy shape would re-prove the same ARM
  # collection). A FREE configuration object; the lane's time is the
  # fixture chain (resource group + vault, both fast).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
