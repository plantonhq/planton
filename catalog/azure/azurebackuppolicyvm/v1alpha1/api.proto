syntax = "proto3";

package dev.planton.azure.azurebackuppolicyvm.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurebackuppolicyvm/v1alpha1/outputs.proto";
import "catalog/azure/azurebackuppolicyvm/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureBackupPolicyVm is the top-level API resource describing an
// Azure Backup policy for IaaS virtual machines -- the schedule and
// retention rules that govern VM backups in a Recovery Services vault.
message AzureBackupPolicyVm {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzureBackupPolicyVm".
  string kind = 2 [(buf.validate.field).string.const = 'AzureBackupPolicyVm'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Backup policy specification.
  AzureBackupPolicyVmSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzureBackupPolicyVmStatus status = 5;
}

// AzureBackupPolicyVmStatus holds the deployment outputs.
message AzureBackupPolicyVmStatus {
  // Outputs from the IaC deployment.
  AzureBackupPolicyVmOutputs outputs = 1;
}
