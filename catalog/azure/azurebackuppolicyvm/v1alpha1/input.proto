syntax = "proto3";

package dev.planton.azure.azurebackuppolicyvm.v1alpha1;

import "catalog/azure/azurebackuppolicyvm/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureBackupPolicyVmIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureBackupPolicyVmIacInput {
