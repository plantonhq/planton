# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azurebackuppolicyvm
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The policy is schedule-and-retention configuration; it stores no customer data. Encryption of the recovery points it produces is the vault's posture (AzureRecoveryServicesVault).
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest of its own; customer-managed-key encryption of backup data is configured on the vault.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The policy moves no data; backup transfer transport belongs to the Azure Backup service and the protected-VM bindings.
    - control_id: no-public-access
      status: not_applicable
      notes: The policy has no reachable endpoint; the vault's public_network_access_enabled governs the backup endpoints.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No inbound surface of its own.
    - control_id: edge-protection
      status: not_applicable
      notes: No request path of its own to filter.
    - control_id: rbac
      status: not_applicable
      notes: Management access is ARM RBAC on the vault's backupPolicies operations (subscription/resource-group posture); the policy exposes no authentication plane of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The policy runs no workloads and holds no credentials.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths of its own.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Policy writes land in the Azure Activity Log as subscription-level posture; backup-job audit belongs to the vault's diagnostic surface.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The policy publishes no metrics of its own; job-failure and critical-operation alerts are the vault's built-in monitoring surface.
    - control_id: backup-recovery
      status: not_applicable
      notes: The policy DEFINES the backup automation (schedule and retention) but protects nothing by itself -- backup happens when an AzureBackupProtectedVm binds a VM to this policy; that binding carries the restore capability and the meters.
    - control_id: backup-retention-policy
      status: configurable
      field_path: retention_daily
      evidence:
        type: spec_validation
        reference: The spec's CEL rules require a retention layer matched to the schedule -- retention_daily (1 or 7-9999 days) for Hourly/Daily schedules, retention_weekly (1-9999 weeks) for Weekly -- and the optional weekly/monthly/yearly layers extend keeps grandfather-father-son style; Azure's 2-6-day daily-retention rejection is front-loaded as validation.
      notes: This component IS the retention policy for classic VM backup. Both presets carry full ladders -- 01-daily-backup-policy keeps 30 dailies / 12 weeklies / 12 monthlies / 7 yearlies; 02-hourly-enhanced-policy adds archive tiering (tiering_policy TierAfter 3 months) and instant_restore_retention_days 7. Reducing retention on a vault under immutability or Multi-User Authorization is a guarded operation.
    - control_id: multi-zone-ha
      status: not_applicable
      notes: A configuration object with no data plane of its own; where recovery points replicate is the vault's storage_mode_type. (V2 policies make instant-restore snapshots zonally resilient, but that is a property of the protected VM's snapshots, metered and realized on the binding.)
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither ARM nor this spec offers a deletion-protection flag on policies; a policy with VMs still bound to it is protected only by Azure's dependency ordering. Guarding backup DATA against deletion is the vault's immutability/soft-delete surface.
    - control_id: managed-patching
      status: not_applicable
      notes: Pure configuration inside the Microsoft-operated Azure Backup service -- no software surface of its own to patch.
