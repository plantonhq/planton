syntax = "proto3";

package dev.planton.azure.azureredislinkedserver.v1alpha1;

// **AzureRedisLinkedServerOutputs** captures the outputs of linking
// two Premium Redis caches into a geo-replication pair.
message AzureRedisLinkedServerOutputs {
  // The Azure Resource Manager ID of the linked-server resource.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cache/redis/{primary}/linkedServers/{secondary}
  string linked_server_id = 1;

  // The link's name -- Azure names it after the LINKED (secondary)
  // cache, so this equals the secondary cache's name.
  string linked_server_name = 2;

  // The geo-replication DNS hostname that always resolves to the CURRENT
  // primary of the pair. Applications that point here instead of a
  // specific cache's hostname keep working across failovers without a
  // connection-string change.
  string geo_replicated_primary_host_name = 3;
}
