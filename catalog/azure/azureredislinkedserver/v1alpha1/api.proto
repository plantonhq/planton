syntax = "proto3";

package dev.planton.azure.azureredislinkedserver.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureredislinkedserver/v1alpha1/outputs.proto";
import "catalog/azure/azureredislinkedserver/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureRedisLinkedServer is the top-level API resource for a Redis
// geo-replication link: it pairs two Premium Azure Cache for Redis
// instances (referenced via target_redis_cache_id and
// linked_redis_cache_id) so the primary continuously replicates to a
// warm secondary in another region. Deleting the link is the failover
// operation -- it promotes the secondary to a writable cache.
message AzureRedisLinkedServer {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureRedisLinkedServer'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureRedisLinkedServerSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureRedisLinkedServerStatus status = 5;
}

// AzureRedisLinkedServerStatus holds the deployment status and outputs.
message AzureRedisLinkedServerStatus {
  // outputs
  AzureRedisLinkedServerOutputs outputs = 1;
}
