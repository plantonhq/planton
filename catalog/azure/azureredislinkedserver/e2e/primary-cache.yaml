# The PRIMARY Premium cache for the geo-replication chain. Both ends of
# a linked-server pair must be PREMIUM; P1 is the smallest Premium size.
# Cache names are globally unique DNS labels, so the scenario owns
# distinct names for both ends.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureRedisCache
metadata:
  name: planton-oss-e2e-redisgeo-primary-cache
  id: planton-oss-e2e-redisgeo-primary-cache
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurerediscache
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  cacheName: pltn-oss-e2e-redisgeo-p
  skuName: PREMIUM
  capacity: 1
