# The SECONDARY Premium cache for the geo-replication chain, in a
# DIFFERENT region (Azure requires the pair to span regions; the
# resource group's own region is irrelevant to the caches inside it).
# Same size as the primary -- Azure requires the secondary at least as
# large.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureRedisCache
metadata:
  name: planton-oss-e2e-redisgeo-secondary-cache
  id: planton-oss-e2e-redisgeo-secondary-cache
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurerediscache
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: westus2
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  cacheName: pltn-oss-e2e-redisgeo-s
  skuName: PREMIUM
  capacity: 1
