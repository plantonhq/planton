syntax = "proto3";

package dev.planton.azure.azureexpressrouteport.v1alpha1;

import "shared/options/options.proto";

// **AzureExpressRoutePortStackOutputs** captures the outputs of
// provisioning an ExpressRoute Port. The per-link facility facts
// (router, interface, patch panel, rack) are what you hand to the
// colocation facility to order the physical cross-connects.
message AzureExpressRoutePortStackOutputs {
  // The Azure Resource Manager ID of the port -- what an ExpressRoute
  // Direct circuit references as express_route_port_id.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/expressRoutePorts/{name}
  string express_route_port_id = 1;

  // The name of the port -- what port authorizations reference
  // cloud-side.
  string express_route_port_name = 2;

  // The port's globally unique resource GUID -- what some provider-side
  // ordering systems ask for to identify the port.
  string guid = 3;

  // The link ethertype (e.g. "0x8100" for Dot1Q) -- fixed by the
  // encapsulation choice.
  string ethertype = 4;

  // The maximum transmission unit of the links (e.g. "1500").
  string mtu = 5;

  // The principal (object) ID of the port's system-assigned identity,
  // when the identity type includes SYSTEM_ASSIGNED (empty otherwise).
  string system_assigned_identity_principal_id = 6;

  // The ARM ID of the first physical link.
  string link1_id = 7;

  // The Microsoft edge router of the first link -- part of the letter
  // of authorization handed to the facility.
  string link1_router_name = 8;

  // The router interface of the first link.
  string link1_interface_name = 9;

  // The patch panel the first link lands on -- what the facility's
  // cross-connect order references.
  string link1_patch_panel_id = 10;

  // The rack of the first link's patch panel.
  string link1_rack_id = 11;

  // The physical connector type of the first link (e.g. "LC").
  string link1_connector_type = 12;

  // The ARM ID of the second physical link.
  string link2_id = 13;

  // The Microsoft edge router of the second link.
  string link2_router_name = 14;

  // The router interface of the second link.
  string link2_interface_name = 15;

  // The patch panel the second link lands on.
  string link2_patch_panel_id = 16;

  // The rack of the second link's patch panel.
  string link2_rack_id = 17;

  // The physical connector type of the second link.
  string link2_connector_type = 18;

  // The generated key of each authorization ISSUED by this port, keyed
  // by the authorization's name from the spec. A circuit in another
  // subscription redeems one to be built on this port. Marked sensitive
  // in both engines.
  // Example valueFrom fieldPath: status.outputs.authorization_keys.partner-team
  map<string, string> authorization_keys = 19 [(dev.planton.shared.options.sensitive) = true];
}
