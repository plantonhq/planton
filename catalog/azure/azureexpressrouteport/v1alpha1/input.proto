syntax = "proto3";

package dev.planton.azure.azureexpressrouteport.v1alpha1;

import "catalog/azure/azureexpressrouteport/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureExpressRoutePortIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureExpressRoutePortIacInput {
  // The ExpressRoute Port resource to deploy.
  AzureExpressRoutePort target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
