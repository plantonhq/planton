apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azureexpressrouteport
spec:
  # Live-proven 2026-08-11 on both engines: full lifecycle plus the
  # Terraform blind import round-trip (port AND the composed
  # authorization child from its address key; zero-change plan with NO
  # tolerance -- live-confirming the provider reads the port
  # authorization's key back from ARM, unlike the circuit's). LIVE
  # FINDING: the shared test subscription created a 10 Gbps Direct port
  # WITHOUT ExpressRoute Direct enrollment friction -- the anticipated
  # authorization-class rejection never happened. The port creates in
  # ~2 min and the lane runs ~4.5-5 min/engine; it bills its full
  # monthly rate from creation (pro-rated ~a dollar for the two
  # lane-length lives), so never leave a failed lane's port alive.
  # The physical cross-connects are out-of-band; verifiers assert ARM
  # object state, the link pair, and the composed authorization, never
  # link light.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 60
