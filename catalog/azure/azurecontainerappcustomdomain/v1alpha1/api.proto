syntax = "proto3";

package dev.planton.azure.azurecontainerappcustomdomain.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurecontainerappcustomdomain/v1alpha1/outputs.proto";
import "catalog/azure/azurecontainerappcustomdomain/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureContainerAppCustomDomain is the top-level API resource for a
// custom-domain binding on a Container App -- your own hostname serving
// the app, with TLS from an Azure-managed or bring-your-own certificate.
message AzureContainerAppCustomDomain {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureContainerAppCustomDomain'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureContainerAppCustomDomainSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureContainerAppCustomDomainStatus status = 5;
}

// AzureContainerAppCustomDomainStatus holds the deployment status and outputs.
message AzureContainerAppCustomDomainStatus {
  // outputs
  AzureContainerAppCustomDomainOutputs outputs = 1;
}
