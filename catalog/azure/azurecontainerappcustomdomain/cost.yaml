# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azurecontainerappcustomdomain
spec:
  billing_model: free
  free_tier: The binding is an entry in the Container App's ingress configuration -- your hostname wired to the app's endpoint, plus the TLS attachment for it. Microsoft.App custom domains carry no meter; binding any number of hostnames, and serving them through Azure's managed certificates, never bills.
  notes: "No field of this spec buys anything: domain_name, the container_app_id reference, and the certificate pairing are routing and TLS metadata stored inside the app's ingress. The real spend lives in the ENVIRONMENT's plan that runs the app the domain points at -- consumption vCPU/memory/requests or dedicated workload profiles, billed through the AzureContainerAppEnvironment and AzureContainerApp kinds. On the bring-your-own path the referenced AzureContainerAppEnvironmentCertificate is also free; a Key Vault sourcing that certificate bills as its own kind."
