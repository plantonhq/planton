syntax = "proto3";

package dev.planton.azure.azureeventgridtopic.v1alpha1;

import "shared/options/options.proto";

// **AzureEventgridTopicOutputs** captures the outputs from
// provisioning an Azure Event Grid topic.
message AzureEventgridTopicOutputs {
  // The topic's Azure Resource Manager ID.
  string topic_id = 1;

  // The topic's name (also the first label of its endpoint hostname).
  string topic_name = 2;

  // The HTTPS endpoint publishers POST events to
  // (https://{name}.{region}.eventgrid.azure.net/api/events).
  string endpoint = 3;

  // The primary access key publishers authenticate with (the
  // aeg-sas-key header). Inert while local_auth_enabled is false.
  string primary_access_key = 4 [(dev.planton.shared.options.sensitive) = true];

  // The secondary access key -- the rotation partner: move publishers
  // here, regenerate the primary, move back.
  string secondary_access_key = 5 [(dev.planton.shared.options.sensitive) = true];

  // The principal ID of the topic's system-assigned identity (empty
  // when no identity is configured) -- grant this on delivery targets
  // that use identity-based access.
  string identity_principal_id = 6;
}
