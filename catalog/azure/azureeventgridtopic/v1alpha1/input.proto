syntax = "proto3";

package dev.planton.azure.azureeventgridtopic.v1alpha1;

import "catalog/azure/azureeventgridtopic/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureEventgridTopicIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureEventgridTopicIacInput {
  // The Event Grid topic resource to deploy.
  AzureEventgridTopic target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
