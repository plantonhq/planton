# Minimal AzureEventgridTopic scenario: a CloudEvents topic with one
# IP allowlist rule in the shared fixture resource group. The topic's
# cloud-side name lives in the region's PUBLIC DNS namespace
# ({name}.{region}.eventgrid.azure.net), so it carries ${E2E_RUN_ID}
# (metadata names stay stable); a crashed run's leftover can then
# never block the next run. Free at rest; creates in seconds.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureEventgridTopic
metadata:
  name: planton-oss-e2e-azureeventgridtopic-smoke
  id: planton-oss-e2e-azureeventgridtopic-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureeventgridtopic
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-egt-${E2E_RUN_ID}
  region: eastus
  inputSchema: CloudEventSchemaV1_0
  inboundIpRules:
    - 203.0.113.0/24
