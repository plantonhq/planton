syntax = "proto3";

package dev.planton.azure.azureapplicationsecuritygroup.v1alpha1;

// **AzureApplicationSecurityGroupOutputs** captures the outputs of
// provisioning an Azure Application Security Group.
message AzureApplicationSecurityGroupOutputs {
  // The Azure Resource Manager ID of the application security group. This
  // is the composition seam: network interfaces
  // (application_security_group_ids), VM scale set IP configurations, and
  // NSG security rules (source/destination_application_security_group_ids)
  // reference this to declare membership or target the group in a rule.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/applicationSecurityGroups/{name}
  string application_security_group_id = 1;

  // The name of the application security group resource.
  string application_security_group_name = 2;
}
