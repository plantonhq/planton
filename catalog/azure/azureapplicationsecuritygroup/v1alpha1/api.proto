syntax = "proto3";

package dev.planton.azure.azureapplicationsecuritygroup.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureapplicationsecuritygroup/v1alpha1/outputs.proto";
import "catalog/azure/azureapplicationsecuritygroup/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureApplicationSecurityGroup is the top-level API resource for an Azure
// Application Security Group: a named grouping of network interfaces that
// network security group rules target by name. It is a first-class
// composable resource because the group has its own lifecycle (created
// once) and is referenced by many members (network interfaces, VM scale
// set IP configurations) and NSG security rules.
message AzureApplicationSecurityGroup {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzureApplicationSecurityGroup".
  string kind = 2 [(buf.validate.field).string.const = 'AzureApplicationSecurityGroup'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Application security group specification.
  AzureApplicationSecurityGroupSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzureApplicationSecurityGroupStatus status = 5;
}

// AzureApplicationSecurityGroupStatus holds the deployment outputs.
message AzureApplicationSecurityGroupStatus {
  // Outputs from the IaC deployment.
  AzureApplicationSecurityGroupOutputs outputs = 1;
}
