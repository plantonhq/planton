# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azureapplicationsecuritygroup
spec:
  billing_model: free
  free_tier: An application security group is pure configuration -- an empty, named grouping that NSG rules target and network interfaces join. Azure has no meter for ASGs; the group, its memberships, and every rule reference to it cost nothing.
  notes: "No field of this spec buys anything: name/region/resource_group/tags are identity, placement, and governance -- the group holds no members of its own (membership is declared from the NIC's side). The real spend lives in the workloads the group organizes: the virtual machines behind the member NICs bill compute, and the NICs, NSGs, and rules referencing the ASG are themselves free config kinds. Micro-segmentation by ASG costs exactly the same as micro-segmentation by CIDR."
