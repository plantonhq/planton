# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azureapplicationsecuritygroup
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: An ASG is a named grouping held in Azure's software-defined-networking control plane; it stores no customer data at rest.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to key (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: No traffic flows to or through an ASG; it is a rule-targeting label, never a network hop.
    - control_id: no-public-access
      status: not_applicable
      notes: The group has no endpoint and no reachability; internet exposure is created by public IPs and gateways, separate kinds.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The ASG is an INGREDIENT of ingress restriction, not the restriction itself -- NSG security rules (a separate kind) reference source/destination ASGs, and NICs declare their memberships; the group enforces nothing on its own.
    - control_id: edge-protection
      status: not_applicable
      notes: Request filtering belongs to application gateways and Front Door, separate kinds; the ASG carries no filtering logic.
    - control_id: rbac
      status: not_applicable
      notes: Management access is subscription/resource-group RBAC posture, not a component choice; the group exposes no authentication plane of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The group runs no workloads and holds no credentials of its own.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths of its own.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Group creation, tag changes, and deletion land in the Azure Activity Log as subscription-level posture; membership changes are audited on the NIC associations that declare them.
    - control_id: monitoring-integration
      status: not_applicable
      notes: A grouping label emits no metrics; traffic hitting rules that target the group is observed through NSG flow logs, a separate kind's posture.
    - control_id: backup-recovery
      status: not_applicable
      notes: Stateless declarative configuration -- the manifest recreates the group; memberships recreate from the NICs' manifests.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: A regional control-plane object with no data path -- there is no zonal failure mode to protect against.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Azure nor this spec offers a deletion-protection flag for an ASG (Azure resource locks are subscription-side governance outside the manifest). Azure refuses to delete a group still referenced by NSG rules or NIC memberships, but that is dependency ordering, not a control.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed software-defined networking -- Microsoft operates and patches the fabric that evaluates ASG-targeted rules; no customer-visible patch surface exists.
