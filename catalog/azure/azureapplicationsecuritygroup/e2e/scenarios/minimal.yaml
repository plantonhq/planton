# Minimal AzureApplicationSecurityGroup scenario: an empty group in the
# fixture resource group.
#
# The resource-group reference resolves against the registry prerequisite's
# captured outputs through the field's default kind. The ASG carries no
# members (membership is declared member-side), so the group itself is the
# whole surface -- the application_security_group_id output, the join key
# every consumer references, must populate on both engines. User tags
# exercise the merge-over-metadata-tags path.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureApplicationSecurityGroup
metadata:
  name: planton-oss-e2e-azureapplicationsecuritygroup-smoke
  id: planton-oss-e2e-azureapplicationsecuritygroup-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureapplicationsecuritygroup
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-asg-smoke
  tags:
    e2e-suite: azure
    purpose: smoke
