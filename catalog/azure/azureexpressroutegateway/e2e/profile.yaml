apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azureexpressroutegateway
spec:
  # Proven live on both engines (full lifecycle + blind single-id import
  # round-trip, zero-change plan). Measured: gateway create ~27m on both
  # engines (billing ~$0.42/hr per scale unit from creation), destroy
  # ~13m, and the prerequisite chain pays a full fixture-hub cycle
  # (~17-20m create, ~13m teardown) before it -- lane total ~72m per
  # engine. The connections arm stays offline-proven (recorded
  # boundary): ARM accepts a connection only against a
  # provider-PROVISIONED circuit, and no carrier exists behind the test
  # subscription -- the lane proves the gateway object in its hub.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 150
