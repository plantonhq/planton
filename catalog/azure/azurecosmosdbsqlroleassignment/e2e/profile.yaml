apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurecosmosdbsqlroleassignment
spec:
  # The harness deploys the fixture resource group, a scenario-local
  # Cosmos SQL account and a custom role definition on it (declared via
  # e2e-prerequisites, in deploy order), plus the fixture
  # user-assigned identity by kind name; the assignment under test then
  # binds the custom role to the identity's principal at the account
  # scope -- the full four-kind composed chain, proving all three FK
  # seams (definition output, identity principal, account scope) on
  # both provisioners. The scenario-local account pins westus3; the
  # full scenario runs ~15 min per engine, dominated by the account
  # fixture's provision + drain.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 75
