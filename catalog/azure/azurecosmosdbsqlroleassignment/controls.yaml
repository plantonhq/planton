# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azurecosmosdbsqlroleassignment
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A role assignment is authorization metadata inside a Cosmos DB account; the documents whose access it governs -- and their at-rest encryption -- belong to the AzureCosmosdbAccount kind's posture.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest of its own to key (see enc-at-rest); customer-managed keys are an account-level choice on the AzureCosmosdbAccount kind.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The assignment carries no traffic of its own; client connections to the account are TLS-enforced as that kind's posture.
    - control_id: no-public-access
      status: not_applicable
      notes: A grant record has no network endpoint; the account's network exposure is the AzureCosmosdbAccount kind's posture.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network surface to restrict (see no-public-access).
    - control_id: edge-protection
      status: not_applicable
      notes: No inbound request path exists to filter.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: spec_default
        reference: The resource IS a data-plane RBAC grant in Cosmos DB's own authorization system -- it cannot be deployed without expressing one. role_definition_id (what), principal_id (who), and scope (where) are all required, and scope narrows to a single database or container path so the grant covers exactly what a workload touches. With the account's key authentication disabled, these grants are the ONLY way clients connect.
      notes: ARM RBAC and Cosmos RBAC are separate systems -- an ARM Owner on the account still reads no documents; data access for Entra identities flows exclusively through these assignments.
    - control_id: workload-identity
      status: configurable
      field_path: principal_id
      evidence:
        type: spec_default
        reference: principal_id defaults to referencing an AzureUserAssignedIdentity's principal_id output -- the composition grants data access to a workload's managed identity, which authenticates with short-lived Entra tokens instead of the account's shared keys. Passing a literal object ID (a user, group, or externally managed service principal) opts out of that keyless default.
      notes: These grants are the enabling half of the fully keyless Cosmos posture -- keys off on the account (that kind's spec), Entra-token workloads granted in through this kind.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The switch that disables key-based (legacy) authentication lives on the AzureCosmosdbAccount kind's spec, not here -- though these assignments are what makes flipping it practical, since Entra principals need grants once keys are off.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Creation and deletion of assignments land in the Azure Activity Log as subscription-level posture; data-plane request auditing is the account's diagnostic-settings surface, outside this spec.
    - control_id: monitoring-integration
      status: not_applicable
      notes: A grant record emits no metrics or runtime signals.
    - control_id: backup-recovery
      status: not_applicable
      notes: Stateless authorization configuration -- nothing to back up; the manifest recreates the grant declaratively (the spec's name field can even pin the GUID so the recreated assignment keeps its ARM ID). Document backups belong to the account kind.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: An assignment has no runtime footprint with a zonal failure mode; it replicates with the account's Microsoft-operated metadata store.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Azure nor this spec offers a deletion-protection flag for a Cosmos role assignment (Azure resource locks are subscription-side governance outside the manifest); deleting one revokes data access and is recreated declaratively.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The Cosmos DB RBAC engine that stores and evaluates assignments is part of the Microsoft-operated Cosmos service; no customer-visible patch surface exists.
