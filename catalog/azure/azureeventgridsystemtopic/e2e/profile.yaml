apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azureeventgridsystemtopic
spec:
  # Live-proven on BOTH engines (2026-08-22): the `minimal` scenario
  # (the fixture storage account's event stream) ran the full lifecycle
  # green -- deploy ~21-37s, idempotency re-plan clean, destroy
  # ~22-32s, full lane ~4.5 min (the storage-account fixture dominates
  # the chain). The Terraform lane's blind import round-trip re-adopted
  # the system topic by its ARM id with a zero-change plan, zero
  # tolerances. VERIFY-OUT reads 3/4 proto fields by design -- the
  # smoke shape carries no identity block, so identity_principal_id is
  # legitimately empty. Azure allows ONE system topic per source per
  # topic type, so this lane must never run concurrently with the event
  # subscription kind's system-topic lane (both stand up a system topic
  # on the fixture account); a `Conflict` on create means a leftover
  # topic squats the source -- sweep the fixture RG, never debug the
  # module.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
