apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azuremachinelearningdatastore
spec:
  # PROVEN both engines: blob variant + workspace-identity auth on the
  # scenario-declared fixture container (registration only -- the
  # provider skips service-side validation and the workspace-identity
  # Blob Data Reader grant is deliberately absent). Create/destroy of
  # the datastore itself is seconds; the ~15 min/engine is the
  # fixture-workspace companion chain. Data-lake and file-share
  # variants stay offline-proven (auth grammars are CEL-tested).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
