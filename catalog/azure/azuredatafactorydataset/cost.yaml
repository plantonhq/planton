# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azuredatafactorydataset
spec:
  billing_model: free
  free_tier: A dataset is factory metadata -- a named view of data a linked service already connects to (which container and path, which table, which format). It stores no data and runs no compute; holding any number of datasets carries no standing meter.
  notes: "Two honest nuances, both tiny and both metered on the FACTORY, not here. Authoring ticks Data Factory's read/write operations meter -- every create, read, update, or delete of an entity (datasets included) bills per 50,000 operations, fractions of a cent per deploy cycle. The real spend is the pipeline RUNS that use the dataset: activity runs, data-movement DIU-hours, and data-flow vCore-hours all bill on the AzureDataFactory when pipelines read or write through this view -- an idle dataset drives none of them. The external system the dataset points at (the storage account, database, or Snowflake behind its linked service) bills as its own kind regardless."
