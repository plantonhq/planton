syntax = "proto3";

package dev.planton.azure.azuredatafactorydataset.v1alpha1;

import "catalog/azure/azuredatafactorydataset/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureDataFactoryDatasetIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureDataFactoryDatasetIacInput {
  // The Data Factory dataset resource to deploy.
  AzureDataFactoryDataset target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
