syntax = "proto3";

package dev.planton.azure.azuredatafactorydataset.v1alpha1;

// **AzureDataFactoryDatasetOutputs** captures the outputs from
// provisioning an Azure Data Factory dataset.
message AzureDataFactoryDatasetOutputs {
  // The dataset's Azure Resource Manager ID
  // ({factory_id}/datasets/{name}) -- the same ID shape for all
  // dataset types.
  string dataset_id = 1;

  // The dataset's name -- what pipelines and data flows resolve
  // against.
  string dataset_name = 2;
}
