# Composed AzureCosmosdbSqlContainer scenario: the full three-kind SQL
# chain -- scenario-local account, database with shared throughput, and
# the container under test with a tenantId partition key.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureCosmosdbSqlContainer
metadata:
  name: planton-oss-e2e-azurecosmosdbsqlcontainer-chain
  id: planton-oss-e2e-azurecosmosdbsqlcontainer-chain
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurecosmosdbsqlcontainer
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "catalog/azure/azurecosmosdbsqlcontainer/e2e/sql-chain-account.yaml, catalog/azure/azurecosmosdbsqlcontainer/e2e/sql-chain-database.yaml"
  tags:
    - planton-e2e
spec:
  sqlDatabaseId:
    valueFrom:
      name: planton-oss-e2e-cosmossqlchain-fixture-database
  containerName: tenants
  partitionKeyPaths:
    - /tenantId
