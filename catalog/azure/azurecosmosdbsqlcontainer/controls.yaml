# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azurecosmosdbsqlcontainer
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Azure Cosmos DB encrypts all data at rest -- documents, indexes, and backups -- with service-managed keys, always on, with no disable switch at any configuration level; the container's documents are encrypted before they land on disk."
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: "Customer-managed keys are an account-level choice fixed at account creation (the AzureCosmosdbAccount's customer_managed_key), covering every database and container under it -- the container offers no per-container key lever."
    - control_id: enc-in-transit
      status: not_applicable
      notes: "Transport is the ACCOUNT's endpoint: Cosmos DB accepts only TLS connections and the minimum TLS version is set on the AzureCosmosdbAccount. The container has no endpoint or transport lever of its own."
    - control_id: no-public-access
      status: not_applicable
      notes: "Network reachability is account-level posture -- public network access, IP firewall, VNet rules, and private endpoints all live on the AzureCosmosdbAccount, whose single endpoint serves every container. Nothing at the container grain opens or closes the network."
    - control_id: restricted-ingress
      status: not_applicable
      notes: "Inbound source restriction (IP ranges, VNet service endpoints, Private Link) is the account's firewall posture; the container exposes no network filter of its own."
    - control_id: edge-protection
      status: not_applicable
      notes: "The Cosmos endpoint accepts database API requests, not application traffic -- there is no WAF attachment point at the container grain; request filtering belongs to the HTTP tiers in front of the application."
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Every data-plane request must be authorized -- Entra ID via Cosmos DB's native data-plane RBAC, resource tokens, or the account's keys -- and Cosmos DB data-plane role assignments scope down to individual databases and containers, so least-privilege grants can name exactly this container."
      notes: "Data-plane role assignments are created against the ACCOUNT (scope path narrows to this container); management-plane access is ARM RBAC on the subscription/resource-group. Key-based access is governed by the account's local-authentication posture (see no-legacy-auth)."
    - control_id: workload-identity
      status: not_applicable
      notes: "The container holds no credentials and runs no workloads. Keyless access is composed caller-side -- a managed identity plus a Cosmos DB data-plane role assignment scoped to this container's path."
    - control_id: no-legacy-auth
      status: not_applicable
      notes: "Disabling key-based (local) authentication in favor of Entra ID is the AzureCosmosdbAccount's account-wide switch; the container exposes no authentication toggles of its own."
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: "Container create/update/delete land in the Azure Activity Log automatically. Data-plane auditing (DataPlaneRequests) is an Azure Monitor diagnostic setting configured on the ACCOUNT -- account-side posture with no per-container toggle; per-container visibility is composed by filtering the logs on collection name."
    - control_id: monitoring-integration
      status: not_applicable
      notes: "Cosmos DB metrics (RU consumption, throttled requests, storage) emit at the account grain with database and collection dimensions -- Microsoft defines no per-container metric resource, and this spec carries no monitoring toggle. Watching this container means filtering the account's metrics on its name."
    - control_id: backup-recovery
      status: not_applicable
      notes: "Backups are automatic and account-level: the AzureCosmosdbAccount's backup field picks periodic or continuous mode and every container's data rides that policy. Nothing here can add or remove backup coverage -- but deleting the container deletes its documents, and only the account's backup mode determines what can come back (continuous mode restores a deleted container point-in-time; periodic mode requires a Microsoft support ticket)."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: "Retention (periodic interval/retention hours, continuous 7-vs-30-day tier) is configured on the account's backup field; no retention lever exists on this spec."
    - control_id: multi-zone-ha
      status: not_applicable
      notes: "Zone redundancy and region replication follow the ACCOUNT's geo_locations (zone_redundant per region) -- the container's data is replicated wherever the account replicates, with no per-container lever. Within a partition, Cosmos DB always maintains a four-replica set."
    - control_id: deletion-protection
      status: not_applicable
      notes: "Neither the Cosmos DB API nor this spec offers a container-grain deletion-protection flag; ARM resource locks are subscription-side governance outside the manifest. A container delete takes its documents and (unlike continuous-backup restore) its dedicated throughput setting with it."
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Cosmos DB is a fully managed multi-tenant service -- Microsoft operates and patches the storage and query engines with no customer-visible patch surface."
