apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: azureeventgridnamespace
spec:
  # The namespace imports by its ARM resource ID.
  values:
    - name: namespace_id
      derivations:
        - from_output: namespace_id
      where_to_find: >-
        `az eventgrid namespace show --name <namespace-name>
        --resource-group <rg> --query id`, or the component's own
        namespace_id output.
