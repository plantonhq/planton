apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: azurenetworkwatcherflowlog
spec:
  # The flow log imports by its full ARM resource ID -- a child of the
  # regional Network Watcher
  # (.../networkWatchers/{watcher}/flowLogs/{name}).
  values:
    - name: flow_log_id
      derivations:
        - from_output: flow_log_id
      where_to_find: >-
        `az network watcher flow-log show --location <region> --name
        <name> --query id` (the watcher resolves from the location), or
        the component's own flow_log_id output.
