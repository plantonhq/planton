apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: azurevpngateway
spec:
  # The gateway's identity is its full ARM resource ID; NAT rules are
  # ARM children composed under it, each keyed by the spec entry's name
  # (the module deploys one rule per entry, addressed by that name).
  values:
    - name: vpn_gateway_id
      derivations:
        - from_output: vpn_gateway_id
      where_to_find: >-
        Portal -> Virtual WAN -> Hubs -> the hub -> VPN (Site to site)
        -> Gateway configuration -> Properties -> Resource ID, or `az
        network vpn-gateway show -g <rg> -n <name> --query id`.
    - name: nat_rule_name
      derivations:
        - from_address_key: true
      where_to_find: >-
        The rule's name in the spec's nat_rules list (the module keys
        one ARM child per name); `az network vpn-gateway nat-rule list
        --gateway-name <gw> -g <rg>` shows what exists cloud-side.
