apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurevpngateway
spec:
  # Proven live on both engines (full lifecycle + blind import
  # round-trip of the gateway AND its composed NAT-rule child derived
  # from the address key, zero-change plan). Measured: create 32-36m,
  # delete 11-13m, lane total ~79m per engine (the fixture-hub cycle --
  # ~18m up, ~13m down -- rides inside it). Bills ~$0.36/hr per scale
  # unit from creation. All 6 outputs populated on both engines,
  # including the name-keyed nat_rule_ids map and ARM's assigned
  # instance public_ip_addresses pair. The gateway is also a fixture of
  # the VPN family: the connection lane chains through this kind's
  # install profile (~36m deploy-and-verify inside that lane).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 150
