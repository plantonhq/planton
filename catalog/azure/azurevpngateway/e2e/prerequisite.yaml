# AzureVpnGateway install profile used as a fixture by composed
# kinds (declared via prerequisites: [AzureVpnGateway] in the kind
# registry -- the VPN gateway connection). The harness deploys this
# document after the fixture hub and captures its outputs --
# vpn_gateway_id in particular -- for dependents' references to resolve
# against.
#
# COST AND TIME: this is the EXPENSIVE fixture of the VPN family. The
# gateway bills (~$0.36/hr per scale unit class) from creation, creates
# in 30-45 minutes, and deletes in 10-20 -- every lane that chains
# through it pays that full cycle ON TOP of the fixture-hub cycle it
# chains through itself. ARM allows one VPN gateway per hub: this
# fixture OCCUPIES the fixture hub, so a wedged teardown blocks every
# lane that needs the hub's gateway slot until swept.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureVpnGateway
metadata:
  name: planton-oss-e2e-azure-fixture-vpngw
  id: planton-oss-e2e-azure-fixture-vpngw
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurevpngateway
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-azure-fixture-vpngw
  virtualHubId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-vhub
