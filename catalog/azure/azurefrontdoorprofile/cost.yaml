# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azurefrontdoorprofile
spec:
  billing_model: hybrid
  baseline_charges:
    - service_name: Azure Front Door Service
      sku_meter: profile base fee
      pricing_unit: profile-months
      description: Every Standard/Premium profile bills a flat monthly base fee from creation until deletion, fixed by the sku -- Premium's is roughly ten times Standard's, buying Private Link to origins, the managed WAF rule sets, and Bot Manager. The fee is the same worldwide (Azure prints identical rates across all eight commercial pricing zones).
  cost_drivers:
    - field_path: sku
      sku_meter: profile base fee
      pricing_unit: profile-months
      impact: The only committed-spend dial, and it is one-way -- PREMIUM multiplies the monthly base fee about tenfold AND bills client requests at a higher per-10,000 rate than STANDARD; Azure refuses a downgrade back, so the tier premium is locked in at creation.
  estimate_exclusions:
    - client requests bill per 10,000 by the client's pricing zone and follow traffic -- PREMIUM's request rate is higher than STANDARD's
    - data transfer out from edge to client bills per GB by the client's pricing zone; edge-to-origin transfer bills a separate per-GB meter; inbound transfer is free on both tiers
    - custom domains beyond the first 100 bill per domain-month; the first 100 are free
  notes: "Azure bills Front Door profile-plus-usage: one flat monthly base fee fixed by the tier, then per-request and per-GB meters that follow traffic and the CLIENT'S geography (eight pricing zones), not any Azure region -- the profile is global and has no region of its own. The composition model matters for cost attribution: endpoints, origin groups, origins, routes, custom domains, and security policies are separate components carrying no meters of their own, so every request and byte they serve lands on THIS profile's meters. WAF adds nothing on these tiers -- custom rules are free on both and the managed rule sets are free on PREMIUM (they are what the tenfold base-fee difference buys); the separately-metered per-policy/per-rule WAF charges belong to Front Door (classic), a different product this spec does not model."
