apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurefrontdoorprofile
spec:
  # The harness deploys the fixture resource group, creates a Standard
  # profile with log scrubbing and tags, verifies it via the ARM API,
  # destroys it, and verifies it is gone -- on both provisioners. Front
  # Door profiles provision in ~1-2 min but DELETE in ~18 min; observed
  # full-scenario runs ~20-21 min per engine.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 45
