# AzureFrontDoorProfile install profile used as a prerequisite by
# composed components (AzureFrontDoorEndpoint, AzureFrontDoorOriginGroup,
# and transitively AzureFrontDoorOrigin and AzureFrontDoorRoute, declared
# via prerequisites in the kind registry). The harness deploys this
# profile after the fixture resource group, then resolves the dependents'
# profile_id references against its profile_id output. Profile names are
# resource-group-scoped (no global-uniqueness hazard), so a shared
# fixture recreates cleanly per scenario.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureFrontDoorProfile
metadata:
  name: planton-oss-e2e-fd-profile-prereq
  id: planton-oss-e2e-fd-profile-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurefrontdoorprofile
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  profileName: planton-oss-e2e-fd-prereq
