syntax = "proto3";

package dev.planton.azure.azurefrontdoorprofile.v1alpha1;

import "catalog/azure/azurefrontdoorprofile/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureFrontDoorProfileIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message AzureFrontDoorProfileIacInput {
  // target infra-component to be deployed
  AzureFrontDoorProfile target = 1;
  // provider-config for Azure authentication
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
