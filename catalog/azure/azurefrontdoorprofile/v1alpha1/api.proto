syntax = "proto3";

package dev.planton.azure.azurefrontdoorprofile.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurefrontdoorprofile/v1alpha1/outputs.proto";
import "catalog/azure/azurefrontdoorprofile/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureFrontDoorProfile is the top-level API resource for an Azure Front
// Door (Standard/Premium) profile -- the container for a global CDN and
// application-delivery deployment on Microsoft's edge network. The
// delivery surface composes against it: AzureFrontDoorEndpoint (entry
// hostname), AzureFrontDoorOriginGroup (backend pool), AzureFrontDoorOrigin
// (backend), and AzureFrontDoorRoute (URL-pattern rule) all reference the
// profile's outputs.
message AzureFrontDoorProfile {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureFrontDoorProfile'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureFrontDoorProfileSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureFrontDoorProfileStatus status = 5;
}

// AzureFrontDoorProfileStatus holds the deployment status and outputs.
message AzureFrontDoorProfileStatus {
  // outputs
  AzureFrontDoorProfileOutputs outputs = 1;
}
