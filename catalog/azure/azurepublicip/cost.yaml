# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azurepublicip
spec:
  billing_model: always_on
  baseline_charges:
    - service_name: Virtual Network
      sku_meter: standard static public IPv4
      pricing_unit: IP-hours
      description: A Standard static IPv4 address bills a flat hourly meter from creation to deletion, attached or idle -- Azure's billing clock starts the second hour after creation (a grace hour to assign it) and stops only when the resource is deleted, never when its consumer detaches. The meter bills in Azure's Global region; the rate does not vary by deployment region.
  cost_drivers:
    - field_path: sku_tier
      sku_meter: global static public IPv4
      pricing_unit: IP-hours
      impact: The GLOBAL tier (cross-region load balancer frontends) bills its own hourly meter at double the regional Standard rate.
    - field_path: sku
      sku_meter: standard static public IPv4
      pricing_unit: IP-hours
      impact: STANDARD_V2 (the next-generation SKU for StandardV2 NAT gateways) has no meter of its own in Azure's retail price API -- Microsoft's pricing page lists it at the same hourly rate as Standard, but no API-verifiable price exists yet.
    - field_path: ip_version
      sku_meter: standard static public IPv4
      pricing_unit: IP-hours
      impact: IPv6 removes the charge entirely -- Microsoft's documentation states public IPv6 addresses have no charge, and the retail price API publishes no IPv6 meter. The static-address meter is an IPv4 meter.
    - field_path: public_ip_prefix_id
      sku_meter: standard static public IPv4
      pricing_unit: IP-hours
      impact: An address drawn from a reserved prefix moves the spend to the referenced AzurePublicIpPrefix component -- the prefix bills every address in its block per IP-hour from the moment it is created, drawn or not, and Microsoft publishes no separate meter for the act of drawing one.
    - field_path: ddos_protection_mode
      sku_meter: DDoS protection
      pricing_unit: IP-months
      impact: ENABLED attaches dedicated DDoS protection whose cost bills through the referenced protection plan, not this address -- the plan is a separately billed resource shared across many addresses.
  estimate_exclusions:
    - a dedicated DDoS protection plan (ddos_protection_plan_id) bills on its own resource, outside this manifest
    - data transfer to and from the address bills per GB as bandwidth and follows traffic; a "RoutingPreference":"Internet" ip_tag moves egress to the cheaper internet-transit bandwidth rates
  notes: "A public IP is the purest always-on shape in Azure: one flat hourly meter per IPv4 address, no usage arm of its own (the bytes bill as bandwidth). The three things that change the number are the tier (GLOBAL doubles it), the version (IPv6 zeroes it), and prefix membership (the referenced prefix pays instead, at a small premium per address). Deleting the resource is the only off switch -- detaching it from a VM or load balancer changes nothing."
