apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurepublicip
spec:
  # The harness deploys the fixture resource group (registry prerequisite),
  # creates a zone-redundant Standard static address with a scope-hashed
  # DNS label, verifies it via the ARM API (generic GetByID on the
  # address's ARM id), destroys it, and verifies it is gone -- on both
  # provisioners. A public IP bills per hour; the run holds it for minutes.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
