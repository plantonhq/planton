# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azuresubnet
spec:
  billing_model: free
  free_tier: A subnet is a carved-out slice of its parent virtual network's address space -- and the network itself is free. Address prefixes, service endpoints, delegations, network-policy modes, and the route-table/NSG/NAT attachments are all configuration on Azure's software-defined fabric; the subnet never bills.
  notes: "No field of this spec buys anything directly: route_table_id, network_security_group_id, and nat_gateway_id attach resources that bill (or not) as their own components -- a NAT gateway carries an hourly fee plus data processing, while route tables and NSGs are themselves free. Likewise the billable primitives deployed INTO the subnet -- private endpoints, VMs, delegated PaaS servers like PostgreSQL Flexible Server -- bill as their own components. Service endpoints and endpoint policies are free; traffic charges (egress, peering) accrue to the traffic sources, not to the subnet."
