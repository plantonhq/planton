# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azuresubnet
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A subnet is address space inside a software-defined network; it stores no customer data at rest.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to encrypt (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: Traffic encryption is not a subnet choice -- VNet encryption is the parent AzureVirtualNetwork kind's encryption field, and payload-level TLS belongs to the workloads deployed into the subnet.
    - control_id: no-public-access
      status: configurable
      field_path: default_outbound_access_enabled
      evidence:
        type: spec_default
        reference: Defaults to true, Azure's historical implicit outbound internet access; setting it false removes the implicit public path so egress must be explicit (a NAT gateway via nat_gateway_id, a firewall via route_table_id) -- the posture the spec recommends for production as Microsoft retires implicit outbound. On the Azure-services side, service_endpoints keeps traffic to listed services (Storage, SQL, Key Vault) on the Azure backbone instead of the public internet, with service_endpoint_policy_ids narrowing each endpoint's reach to specific resources.
      notes: The subnet's own address space has no inbound path from the internet -- inbound exposure is created by public IPs, load balancers, and gateways on the resources deployed into it, each a separate component. private_endpoint_network_policies governs whether NSG and route rules also apply to private-endpoint traffic, a zero-trust refinement.
    - control_id: restricted-ingress
      status: configurable
      field_path: network_security_group_id
      evidence:
        type: spec_default
        reference: Unset leaves the subnet governed only by Azure's implicit default rules (allow VNet-internal and load-balancer traffic, deny other inbound); attaching a network security group applies its rules to everything deployed in the subnet -- Azure's primary network access control, and this attachment is the seam where it takes effect.
      notes: The rules themselves live on the AzureNetworkSecurityGroup kind; one group typically guards many subnets of the same tier.
    - control_id: edge-protection
      status: not_applicable
      notes: Request-level filtering (WAF) belongs to application gateways and Front Door, separate kinds; a subnet has no request-filtering attachment point of its own.
    - control_id: rbac
      status: not_applicable
      notes: Management access is subscription/resource-group RBAC posture, not a component choice; the subnet exposes no authentication plane of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The subnet runs no workloads and holds no credentials of its own.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths of its own.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Traffic audit (VNet flow logs) is configured through Network Watcher on the network or its subnets -- separate resources, not fields of this spec. Control-plane changes land in the Azure Activity Log as subscription-level posture.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The subnet publishes no metrics of its own; traffic observability (flow logs, connection monitor) is configured through Network Watcher resources, separate kinds.
    - control_id: backup-recovery
      status: not_applicable
      notes: Stateless network configuration -- nothing to back up; the manifest recreates the subnet declaratively.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A subnet inherits its parent virtual network's regional span across every availability zone; zone placement happens on the resources deployed into it, and the subnet itself has no single-zone failure mode.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Azure nor this spec offers a deletion-protection flag for a subnet (Azure resource locks are subscription-side governance outside the manifest). A subnet with deployed resources refuses deletion until they empty, but that is dependency ordering, not a control.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed software-defined networking -- Microsoft operates and patches the underlying network fabric; no customer-visible patch surface exists.
