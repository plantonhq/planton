# Minimal AzureSubnet scenario -- the attach-model proof. The subnet is
# created inside the fixture network with all three attach seams exercised:
# a route table steering its egress, an NSG filtering its traffic, and a
# NAT gateway owning its outbound connectivity.
#
# The virtual-network reference resolves against the registry prerequisite's
# captured outputs; the route table, NSG, and NAT gateway are
# scenario-declared extra fixtures (see the annotation) -- they are OPTIONAL
# seams, so they must never pollute the registry prerequisites that every
# downstream kind's fixture chain would then deploy. Each attach reference
# resolves through its field's default kind against the extra fixture's
# outputs. default_outbound_access_enabled: false is the posture the NAT
# attachment exists for (explicit egress; Azure is retiring implicit
# outbound), and it exercises the optional bool's non-default value.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureSubnet
metadata:
  name: planton-oss-e2e-azuresubnet-smoke
  id: planton-oss-e2e-azuresubnet-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuresubnet
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AzureRouteTable, AzureNetworkSecurityGroup, AzureNatGateway"
  tags:
    - planton-e2e
spec:
  virtualNetworkId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-vnet
  name: planton-oss-e2e-subnet-smoke
  addressPrefixes:
    - "10.240.1.0/24"
  serviceEndpoints:
    - Microsoft.Storage
  defaultOutboundAccessEnabled: false
  routeTableId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rt
  networkSecurityGroupId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-nsg
  natGatewayId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-nat
