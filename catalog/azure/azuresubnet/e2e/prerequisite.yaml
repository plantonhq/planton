# AzureSubnet install profile used as a prerequisite by composed components
# (declared via prerequisites: [AzureSubnet] in the kind registry). The E2E
# harness deploys this document (via the subnet's Pulumi module) after its
# own prerequisite chain (fixture resource group -> fixture virtual
# network), and captures its outputs -- subnet_id in particular -- for
# dependents' references to resolve against. The subnet is a bare fixture:
# no route table, NSG, or NAT gateway attachments -- anything a consumer
# needs attached, its own scenario declares. Its prefix is carved from the
# top of the fixture network's 10.240.0.0/16 space to stay clear of
# scenario subnets.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureSubnet
metadata:
  name: planton-oss-e2e-azure-fixture-subnet
  id: planton-oss-e2e-azure-fixture-subnet
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuresubnet
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  virtualNetworkId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-vnet
  name: planton-oss-e2e-azure-fixture-subnet
  addressPrefixes:
    - "10.240.250.0/24"
---
# A second, firewall-shaped subnet instance: Azure Firewall's data path
# only deploys into a subnet whose ARM name is EXACTLY "AzureFirewallSubnet"
# with at least a /26 prefix, so the generic fixture above cannot serve it.
# Consumers address this instance by its metadata name
# (planton-oss-e2e-azure-fixture-firewall-subnet); resolution is name-aware,
# and the extra instance is harmless for consumers that only use the
# generic one (subnets are free and provision in seconds). The /26 is
# carved adjacent to the generic fixture's prefix to stay clear of
# scenario subnets.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureSubnet
metadata:
  name: planton-oss-e2e-azure-fixture-firewall-subnet
  id: planton-oss-e2e-azure-fixture-firewall-subnet
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuresubnet
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  virtualNetworkId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-vnet
  name: AzureFirewallSubnet
  addressPrefixes:
    - "10.240.249.0/26"
---
# A third, gateway-shaped subnet instance: virtual network gateways only
# deploy into a subnet whose ARM name is EXACTLY "GatewaySubnet" (/27 or
# larger recommended), so neither fixture above can serve one. Consumers
# address this instance by its metadata name
# (planton-oss-e2e-azure-fixture-gateway-subnet); the extra instance is
# harmless for consumers that only use the generic one. The /24 is carved
# below the firewall fixture's /26 to stay clear of scenario subnets.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureSubnet
metadata:
  name: planton-oss-e2e-azure-fixture-gateway-subnet
  id: planton-oss-e2e-azure-fixture-gateway-subnet
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuresubnet
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  virtualNetworkId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-vnet
  name: GatewaySubnet
  addressPrefixes:
    - "10.240.248.0/24"
---
# A fourth, private-link-shaped subnet instance: a Private Link Service's
# NAT addresses only deploy onto a subnet whose
# privateLinkServiceNetworkPoliciesEnabled flag is FALSE (an ARM
# requirement no offline gate can check), so the generic fixture above --
# which keeps the secure default -- cannot serve one. Consumers address
# this instance by its metadata name
# (planton-oss-e2e-azure-fixture-pls-subnet); the extra instance is
# harmless for consumers that only use the generic one. The /24 is carved
# below the gateway fixture's prefix to stay clear of scenario subnets.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureSubnet
metadata:
  name: planton-oss-e2e-azure-fixture-pls-subnet
  id: planton-oss-e2e-azure-fixture-pls-subnet
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuresubnet
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  virtualNetworkId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-vnet
  name: planton-oss-e2e-azure-fixture-pls-subnet
  addressPrefixes:
    - "10.240.247.0/24"
  privateLinkServiceNetworkPoliciesEnabled: false
---
# A fifth, bastion-shaped subnet instance: Azure Bastion's dedicated
# infrastructure only deploys into a subnet whose ARM name is EXACTLY
# "AzureBastionSubnet" with at least a /26 prefix, so no fixture above
# can serve it. Consumers address this instance by its metadata name
# (planton-oss-e2e-azure-fixture-bastion-subnet); the extra instance is
# harmless for consumers that only use the generic one (subnets are
# free and provision in seconds). The /26 is carved below the PLS
# fixture's prefix to stay clear of scenario subnets.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureSubnet
metadata:
  name: planton-oss-e2e-azure-fixture-bastion-subnet
  id: planton-oss-e2e-azure-fixture-bastion-subnet
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuresubnet
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  virtualNetworkId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-vnet
  name: AzureBastionSubnet
  addressPrefixes:
    - "10.240.246.0/26"
---
# A sixth, DNS-resolver-inbound-shaped subnet instance: a DNS Private
# Resolver endpoint only deploys into a DEDICATED subnet delegated to
# "Microsoft.Network/dnsResolvers" (/28-/24, one endpoint per subnet,
# nothing else in it), so no fixture above can serve one. Consumers
# address this instance by its metadata name
# (planton-oss-e2e-azure-fixture-dnsr-in-subnet); the extra instance is
# harmless for consumers that only use the generic one (subnets are
# free and provision in seconds). The /28 is carved inside
# 10.240.246.0/24 above the bastion fixture's /26 (which ends at .63)
# to stay clear of scenario subnets.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureSubnet
metadata:
  name: planton-oss-e2e-azure-fixture-dnsr-in-subnet
  id: planton-oss-e2e-azure-fixture-dnsr-in-subnet
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuresubnet
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  virtualNetworkId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-vnet
  name: planton-oss-e2e-azure-fixture-dnsr-in-subnet
  addressPrefixes:
    - "10.240.246.64/28"
  delegations:
    - name: dnsresolver
      serviceName: Microsoft.Network/dnsResolvers
      actions:
        - Microsoft.Network/virtualNetworks/subnets/join/action
---
# A seventh, DNS-resolver-outbound-shaped subnet instance: endpoints
# are one-per-subnet, so the resolver's outbound endpoint needs its own
# delegated /28 (same contract as the inbound fixture above). The /28
# is carved adjacent to the inbound fixture's.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureSubnet
metadata:
  name: planton-oss-e2e-azure-fixture-dnsr-out-subnet
  id: planton-oss-e2e-azure-fixture-dnsr-out-subnet
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuresubnet
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  virtualNetworkId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-vnet
  name: planton-oss-e2e-azure-fixture-dnsr-out-subnet
  addressPrefixes:
    - "10.240.246.80/28"
  delegations:
    - name: dnsresolver
      serviceName: Microsoft.Network/dnsResolvers
      actions:
        - Microsoft.Network/virtualNetworks/subnets/join/action
---
# An eighth, container-instance-shaped subnet instance: a PRIVATE
# container group only deploys into a subnet delegated to
# "Microsoft.ContainerInstance/containerGroups" (which then admits
# nothing but container groups), so no fixture above can serve one.
# Consumers address this instance by its metadata name
# (planton-oss-e2e-azure-fixture-aci-subnet). Azure serializes
# container-group operations per subnet, so lanes sharing this fixture
# deploy one group at a time. The /28 is carved adjacent to the DNS
# resolver fixtures'.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureSubnet
metadata:
  name: planton-oss-e2e-azure-fixture-aci-subnet
  id: planton-oss-e2e-azure-fixture-aci-subnet
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuresubnet
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  virtualNetworkId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-vnet
  name: planton-oss-e2e-azure-fixture-aci-subnet
  addressPrefixes:
    - "10.240.246.96/28"
  delegations:
    - name: containergroups
      serviceName: Microsoft.ContainerInstance/containerGroups
      actions:
        - Microsoft.Network/virtualNetworks/subnets/join/action
