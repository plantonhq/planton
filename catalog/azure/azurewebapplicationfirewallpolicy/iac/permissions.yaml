# Least-privilege permissions the IaC runner's Azure principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: azurewebapplicationfirewallpolicy
spec:
  azure:
    groups:
      - purpose: ManageWebApplicationFirewallPolicy
        actions:
          - Microsoft.Network/ApplicationGatewayWebApplicationFirewallPolicies/read
          - Microsoft.Network/ApplicationGatewayWebApplicationFirewallPolicies/write
          - Microsoft.Network/ApplicationGatewayWebApplicationFirewallPolicies/delete
        provenance: derived
        notes: Covers azurerm_web_application_firewall_policy -- create, read/refresh, in-place rule and settings updates, and destroy. Held via Network Contributor, Contributor, or narrower custom roles. The module makes no other provider calls; the separate .../join/action belongs to whoever deploys the Application Gateway that attaches this policy, not to this runner.
