# Minimal AzureWebApplicationFirewallPolicy scenario: an OWASP 3.2 policy
# in the fixture resource group.
#
# The resource-group reference resolves against the registry prerequisite's
# captured outputs through the field's default kind. Beyond the required
# managed rule set, the scenario carries one custom rate-limit rule (proving
# the rule-type/action/operator/grouping enum seams end to end), a
# rule-group override (the tuning path), and a log-scrubbing rule (the
# policy-settings path) -- all pure control-plane configuration with no
# extra cost or latency.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureWebApplicationFirewallPolicy
metadata:
  name: planton-oss-e2e-azurewaf-smoke
  id: planton-oss-e2e-azurewaf-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurewebapplicationfirewallpolicy
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  policyName: planton-oss-e2e-waf-smoke
  customRules:
    - name: throttleApi
      priority: 20
      ruleType: RATE_LIMIT_RULE
      action: BLOCK
      rateLimitDuration: ONE_MIN
      rateLimitThreshold: 300
      groupRateLimitBy: CLIENT_ADDR
      matchConditions:
        - matchVariables:
            - variableName: REQUEST_URI
          operator: BEGINS_WITH
          matchValues:
            - /api/
  managedRules:
    managedRuleSets:
      - version: "3.2"
        ruleGroupOverrides:
          - ruleGroupName: REQUEST-920-PROTOCOL-ENFORCEMENT
            rules:
              - id: "920300"
  policySettings:
    logScrubbing:
      rules:
        - matchVariable: SCRUB_REQUEST_HEADER_NAMES
          selectorMatchOperator: SELECTOR_EQUALS
          selector: Authorization
  tags:
    e2e-suite: azure
    purpose: smoke
