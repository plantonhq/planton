# AzureWebApplicationFirewallPolicy install profile used as a fixture by
# scenarios that prove WAF-policy attachment (declared via the
# planton.dev/e2e-prerequisites annotation -- a gateway's
# firewall_policy_id is an OPTIONAL reference, so this is never a registry
# prerequisite). The harness deploys this document (via the policy's Pulumi
# module) after the fixture resource group and captures its outputs --
# policy_id in particular -- for the attaching scenario's reference to
# resolve against. The policy is a bare OWASP 3.2 baseline: exactly what a
# WAF_v2 gateway attachment consumes.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureWebApplicationFirewallPolicy
metadata:
  name: planton-oss-e2e-azure-fixture-waf
  id: planton-oss-e2e-azure-fixture-waf
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurewebapplicationfirewallpolicy
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  policyName: planton-oss-e2e-fixture-waf
  managedRules:
    managedRuleSets:
      - version: "3.2"
