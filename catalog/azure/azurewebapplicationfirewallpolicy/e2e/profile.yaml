apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurewebapplicationfirewallpolicy
spec:
  # The harness deploys the fixture resource group (registry prerequisite),
  # creates an OWASP 3.2 policy with a custom rate-limit rule and log
  # scrubbing, verifies it via the ARM API (generic GetByID on the policy's
  # ARM id), destroys it, and verifies it is gone -- on both provisioners.
  # The policy is a pure control-plane object, so runs are fast.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
