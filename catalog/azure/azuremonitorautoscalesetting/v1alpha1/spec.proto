// Scale-event notifications: who hears about every scale action.
message AzureMonitorAutoscaleSettingNotification {
  // Email notification settings. At least one of email and webhooks must
  // be configured.
  AzureMonitorAutoscaleSettingNotificationEmail email = 1;

  // Webhooks fired on every scale action (wire these to chat, paging,
  // or automation endpoints).
  repeated AzureMonitorAutoscaleSettingNotificationWebhook webhooks = 2;

  // The provider requires at least one channel on the block -- an empty
  // notification block configures nothing and is rejected at plan time.
  option (buf.validate.message).cel = {
    id: "autoscale_notification_at_least_one_channel"
    message: "configure at least one notification channel: email and/or webhooks"
    expression: "has(this.email) || this.webhooks.size() > 0"
  };
}

// Email notification settings for scale events. The channel IS its
// recipient list: ARM retired the classic subscription-administrator
// and co-administrator email flags in April 2024
// (SendEmailsToAdminCoAdminsNotSupported -- ARM rejects any request
// that sets them), so explicit recipient addresses are the only email
// wiring Azure still delivers.
message AzureMonitorAutoscaleSettingNotificationEmail {
  // Field numbers 1-2 carried the retired subscription-administrator /
  // co-administrator flags; ARM rejects them since the April 2024
  // classic-administrator retirement, so the catalog does not model
  // them (recorded in the provider-parity manifest).
  reserved 1, 2;
  reserved "send_to_subscription_administrator", "send_to_subscription_co_administrator";

  // Email addresses notified on every scale action.
  repeated string custom_emails = 3 [(buf.validate.field).repeated.items = {
    string: {min_len: 1}
  }];

  // An email block without recipients configures nothing: the retired
  // admin flags were the only other wiring, and ARM no longer accepts
  // them.
  option (buf.validate.message).cel = {
    id: "autoscale_notification_email_recipients_required"
    message: "email notifications need at least one address in custom_emails (Azure retired the subscription-administrator email flags in April 2024)"
    expression: "this.custom_emails.size() > 0"
  };
}

// A webhook fired on every scale action.
message AzureMonitorAutoscaleSettingNotificationWebhook {
  // The URI Azure POSTs the scale-event payload to.
  string service_uri = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "autoscale_webhook_uri_scheme"
      message: "the webhook service_uri must be an http:// or https:// URL"
      expression: "this == '' || this.startsWith('http://') || this.startsWith('https://')"
    }
  ];

  // Extra properties merged into the webhook payload (e.g. a routing
  // key your receiver dispatches on). Azure's read API omits a webhook's
  // empty properties map -- provide at least one property when a
  // round-trip-stable configuration matters.
  map<string, string> properties = 2;
}
