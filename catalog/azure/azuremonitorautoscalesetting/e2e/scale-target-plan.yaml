# Dedicated AzureServicePlan for the autoscale scenario only -- the
# cheapest SCALABLE target with a fixture chain of one resource. The
# shared fixture plan is Basic B1, a tier Azure Monitor autoscale does
# not accept (Standard and above only), so this lane carries its own
# Standard S1 plan; it exists for minutes and bills pro-rated cents.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureServicePlan
metadata:
  name: planton-oss-e2e-azautoscale-fixture-plan
  id: planton-oss-e2e-azautoscale-fixture-plan
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureserviceplan
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  # centralus: the region with probe-verified App Service capacity on
  # the test subscription (see the shared fixture plan's record); a
  # plan's region is independent of its resource group's. The autoscale
  # setting below MUST match this region.
  region: centralus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  servicePlanName: planton-oss-e2e-azautoscale-plan
  osType: LINUX
  skuName: STANDARD_S1
