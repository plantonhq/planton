syntax = "proto3";

package dev.planton.azure.azureeventgriddomaintopic.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureeventgriddomaintopic/v1alpha1/outputs.proto";
import "catalog/azure/azureeventgriddomaintopic/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureEventgridDomainTopic represents one named event stream inside
// an Azure Event Grid domain -- the per-tenant mailbox of the
// multi-tenant pattern. Many topics share the domain's single endpoint
// and keys; each carries its own subscriptions and its own lifecycle.
message AzureEventgridDomainTopic {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureEventgridDomainTopic'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AzureEventgridDomainTopicSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AzureEventgridDomainTopicStatus status = 5;
}

// AzureEventgridDomainTopicStatus represents the status of an Azure
// Event Grid domain topic deployment.
message AzureEventgridDomainTopicStatus {
  //outputs
  //  azure-eventgrid-domain-topic outputs
  AzureEventgridDomainTopicOutputs outputs = 1;
}
