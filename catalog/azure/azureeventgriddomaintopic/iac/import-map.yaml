apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: azureeventgriddomaintopic
spec:
  # The domain topic imports by its full ARM resource ID -- scoped
  # under the parent domain ({domain_id}/topics/{name}).
  values:
    - name: domain_topic_id
      derivations:
        - from_output: domain_topic_id
      where_to_find: >-
        `az eventgrid domain topic show --domain-name <domain-name>
        --name <topic-name> --resource-group <rg> --query id`, or the
        component's own domain_topic_id output.
