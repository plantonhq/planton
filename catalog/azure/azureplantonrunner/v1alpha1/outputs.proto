syntax = "proto3";

package dev.planton.azure.azureplantonrunner.v1alpha1;

// AzurePlantonRunnerOutputs captures the observable identifiers of a
// deployed runner appliance -- the handles for day-2 operations: finding
// the app in Azure tooling and the name the runner registered itself
// under with the control plane.
message AzurePlantonRunnerOutputs {
  // The Azure resource ID of the Container App keeping the runner
  // running. The primary handle for inspecting the appliance with Azure
  // tooling.
  string container_app_id = 1;

  // The Container App's name (metadata.name).
  string container_app_name = 2;

  // The name of the Container App secret holding the runner token. The
  // container reads PLANTON_RUNNER_TOKEN from this secret; the token
  // authorizes joining and is never the runner's identity.
  string token_secret_name = 3;

  // The name the runner registers itself under with the control plane --
  // the value shown by `planton runner list` the moment it joins.
  string runner_name = 4;

  // The resource group the runner was deployed in. Echoed so downstream
  // tooling and verifiers can target the correct group.
  string resource_group_name = 5;
}
