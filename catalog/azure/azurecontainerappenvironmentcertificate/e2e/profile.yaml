apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurecontainerappenvironmentcertificate
spec:
  # The scenario uploads a throwaway self-signed PFX to the fixture
  # environment (registry prerequisite), verifies the certificate via the
  # ARM API, destroys it, and verifies it is gone. The upload is a
  # synchronous PUT; the fixture environment's create + ~5-10 minute
  # delete dominates the run. The Key Vault source path is proven by the
  # offline gate (plan + spec tests) -- exercising it live would add a
  # vault + generated certificate + RBAC-grant fixture chain with a
  # ~10-minute purge for a pairing the provider sends verbatim.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 60
