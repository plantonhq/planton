# Minimal AzureContainerAppEnvironmentCertificate scenario: an inline-PFX
# certificate stored on the fixture environment (registry prerequisite),
# proving the upload path, the certificate-fact outputs (subject, issuer,
# thumbprint, expiry), and teardown.
#
# The PFX below is a THROWAWAY: a self-signed certificate for the
# non-existent test name app.e2e.planton.test, generated exclusively for
# this fixture. Its private key protects nothing and trusts nothing --
# it exists only because Container Apps accepts self-signed uploads,
# which makes the BYO path provable without a CA. Password:
# planton-e2e.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureContainerAppEnvironmentCertificate
metadata:
  name: planton-oss-e2e-azurecacert-smoke
  id: planton-oss-e2e-azurecacert-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurecontainerappenvironmentcertificate
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  certificateName: app.e2e.planton.test
  containerAppEnvironmentId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-cae
  certificateBlobBase64: 
  certificatePassword: planton-e2e
  tags:
    e2e-suite: web-domain
