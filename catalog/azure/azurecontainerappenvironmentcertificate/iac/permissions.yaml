# Least-privilege permissions the IaC runner's Azure principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: azurecontainerappenvironmentcertificate
spec:
  azure:
    groups:
      - purpose: ManageEnvironmentCertificate
        actions:
          - Microsoft.App/managedenvironments/certificates/read
          - Microsoft.App/managedenvironments/certificates/write
          - Microsoft.App/managedenvironments/certificates/delete
        provenance: derived
        notes: Covers azurerm_container_app_environment_certificate -- create, in-place tag updates (every other change replaces the certificate), read/refresh, and destroy. The parent environment is addressed by the ARM ID resolved from container_app_environment_id; the module performs no environment read and no other API calls. ARM never returns the PFX blob or password on reads, so no secret-listing action exists or is needed. The RUNNER also needs no Key Vault access on the vault-sourced path -- the ENVIRONMENT's managed identity reads the vault at deploy and renewal time, a grant composed on the vault (separate kinds). Verified against Microsoft.App's published operations; held via Contributor on the environment's resource group.
