syntax = "proto3";

package dev.planton.azure.azureapplicationinsights.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureapplicationinsights/v1alpha1/outputs.proto";
import "catalog/azure/azureapplicationinsights/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureApplicationInsights is the top-level resource definition for an Azure
// Application Insights instance. It follows the KRM (Kubernetes Resource Model)
// pattern with apiVersion, kind, metadata, spec, and status.
message AzureApplicationInsights {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzureApplicationInsights".
  string kind = 2 [(buf.validate.field).string.const = 'AzureApplicationInsights'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Application Insights specification.
  AzureApplicationInsightsSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzureApplicationInsightsStatus status = 5;
}

// AzureApplicationInsightsStatus holds the deployment outputs.
message AzureApplicationInsightsStatus {
  // Outputs from the IaC deployment.
  AzureApplicationInsightsOutputs outputs = 1;
}
