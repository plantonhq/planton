syntax = "proto3";

package dev.planton.azure.azureapplicationinsights.v1alpha1;

import "catalog/azure/azureapplicationinsights/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureApplicationInsightsIacInput is the input to the IaC modules (Pulumi/Terraform).
// It contains the target resource definition and Azure provider credentials.
message AzureApplicationInsightsIacInput {
  // The Application Insights resource to deploy.
  AzureApplicationInsights target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
