# AzureApplicationInsights install profile used as a fixture by
# composed kinds (declared via prerequisites:
# [AzureApplicationInsights] in the kind registry -- the Machine
# Learning workspace today). The harness deploys this document after
# the fixture log-analytics workspace (this kind's own registry
# prerequisite -- workspace-based is the only mode Azure still
# supports) and captures its outputs -- application_insights_id in
# particular -- for dependents' references to resolve against.
#
# COST AND TIME: the component provisions in under a minute; billing
# follows ingested telemetry, which a fixture never sends -- pennies
# at most through the log-analytics workspace it binds to.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureApplicationInsights
metadata:
  name: planton-oss-e2e-azure-fixture-appi
  id: planton-oss-e2e-azure-fixture-appi
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureapplicationinsights
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  applicationInsightsName: planton-oss-e2e-fixture-appi
  applicationType: WEB
  workspaceId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-law
  tags:
    e2e-suite: azure
    purpose: fixture
