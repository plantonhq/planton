syntax = "proto3";

package dev.planton.azure.azuremonitormetricalert.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azuremonitormetricalert/v1alpha1/outputs.proto";
import "catalog/azure/azuremonitormetricalert/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureMonitorMetricAlert is the top-level API resource for an Azure Monitor
// metric alert rule -- a static, dynamic (machine-learning), or web-test
// availability condition evaluated over platform metrics, firing action
// groups when it holds.
message AzureMonitorMetricAlert {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureMonitorMetricAlert'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureMonitorMetricAlertSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureMonitorMetricAlertStatus status = 5;
}

// AzureMonitorMetricAlertStatus holds the deployment status and outputs.
message AzureMonitorMetricAlertStatus {
  // outputs
  AzureMonitorMetricAlertOutputs outputs = 1;
}
