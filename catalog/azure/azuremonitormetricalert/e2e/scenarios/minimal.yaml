# Minimal AzureMonitorMetricAlert scenario: a static-threshold rule on a
# scenario-local storage account's Transactions metric, firing into the
# fixture action group. Proves the polymorphic scope reference (explicit
# valueFrom kind + fieldPath -- scopes carry no default kind), the static
# criteria wire maps (Total / GreaterThan), and the action-group FK. The
# storage account is a path-declared extra fixture (globally-unique
# names -- see the fixture manifest); the action group arrives through
# the registry prerequisite. The threshold is far above anything the
# idle fixture produces, so the alert never fires.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureMonitorMetricAlert
metadata:
  name: planton-oss-e2e-azmalert-smoke
  id: planton-oss-e2e-azmalert-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuremonitormetricalert
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "catalog/azure/azuremonitormetricalert/e2e/metric-target-account.yaml"
  tags:
    - planton-e2e
spec:
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  alertName: planton-oss-e2e-malert-smoke
  scopes:
    - valueFrom:
        kind: AzureStorageAccount
        name: planton-oss-e2e-malert-fixture-account
        fieldPath: status.outputs.storage_account_id
  description: E2E smoke rule -- threshold far above idle-fixture traffic
  severity: 3
  frequency: PT5M
  windowSize: PT15M
  staticCriteria:
    - metricNamespace: Microsoft.Storage/storageAccounts
      metricName: Transactions
      aggregation: TOTAL
      operator: GREATER_THAN
      threshold: 100000000
  actions:
    - actionGroupId:
        valueFrom:
          name: planton-oss-e2e-azure-fixture-ag
  tags:
    purpose: e2e-smoke
