# Dedicated AzureStorageAccount for the metric-alert scenario only -- the
# cheapest metric-bearing target. Account names are globally unique in
# Azure and hyphen-forbidden, so each scenario that creates and destroys
# its own account carries a distinct hyphen-free name -- reusing a name
# across sequential subtests hits Azure's post-delete reservation and the
# recreate hangs.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureStorageAccount
metadata:
  name: planton-oss-e2e-malert-fixture-account
  id: planton-oss-e2e-malert-fixture-account
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurestorageaccount
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  # eastus: co-located with the fixture resource group.
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  accountName: pltnosse2emalertfix
  replicationType: LRS
