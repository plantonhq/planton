syntax = "proto3";

package dev.planton.azure.azuremachinelearningcomputeinstance.v1alpha1;

// **AzureMachineLearningComputeInstanceOutputs** captures the
// outputs of provisioning a Machine Learning compute instance.
message AzureMachineLearningComputeInstanceOutputs {
  // The Azure Resource Manager ID of the compute instance.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.MachineLearningServices/workspaces/{ws}/computes/{name}
  string machine_learning_compute_instance_id = 1;

  // The instance's name -- what its owner selects as their compute in
  // notebooks and the ML studio.
  string machine_learning_compute_instance_name = 2;

  // The principal (object) ID of the instance's system-assigned
  // identity, when one is enabled -- what storage / Key Vault grants
  // bind to.
  string system_assigned_identity_principal_id = 3;

  // The admin username for SSH access, assigned by the service --
  // populated only when the ssh block is configured.
  string ssh_username = 4;

  // The port the instance answers SSH on, assigned by the service --
  // populated only when the ssh block is configured. When the block is
  // absent both engines must still emit a numeric zero (not a nil /
  // empty string): a raw nil Pulumi export fails the harness int32
  // parse. Use Elem() on the optional SSH fields; Terraform already
  // falls back with try(..., 0).
  int32 ssh_port = 5;
}
