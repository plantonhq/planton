apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azuremachinelearningcomputeinstance
spec:
  # PROVEN both engines 2026-08-14. One STANDARD_DS2_V2 workstation VM
  # with a system identity on the fixture workspace. Cloud-side name
  # carries ${E2E_RUN_ID} -- first Azure use of the token; both engines
  # expand it (shape ci-<8-hex>-<p|t>) and the verifier reads the
  # expanded ARM id. Outputs 3/5 (ssh_username / ssh_port empty -- no
  # ssh block; Pulumi must Elem() those optional fields or the harness
  # int32 parse fails). Identity principal populates on both engines.
  # Terraform import RT zero-change. Create ~4.5-5 min, delete ~1 min.
  # Personal/assign-to-user, SSH, and VNet stay offline-proven.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 45
