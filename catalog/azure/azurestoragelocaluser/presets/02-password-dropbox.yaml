apiVersion: azure.planton.dev/v1alpha1
kind: AzureStorageLocalUser
metadata:
  name: my-dropbox-user
spec:
  storageAccountId:
    valueFrom:
      kind: AzureStorageAccount
      name: <storage-account-resource-name>
      fieldPath: status.outputs.storage_account_id
  # Replace: 3-64 lowercase letters and digits only.
  userName: vendordropbox
  # Azure GENERATES the password at creation and returns it exactly
  # once -- in the password output. Hand it over a secure channel.
  sshPasswordEnabled: true
  homeDirectory: <containerName>
  # Write-only drop box: the sender can add files but never read, list,
  # or delete what's already there.
  permissionScopes:
    - service: BLOB
      resourceName:
        valueFrom:
          kind: AzureStorageContainer
          name: <container-resource-name>
          fieldPath: status.outputs.container_name
      write: true
      create: true
