apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurestoragelocaluser
spec:
  # The harness deploys the fixture resource group, a SCENARIO-LOCAL
  # SFTP-enabled storage account, and a container on it (declared via
  # the e2e-prerequisites annotation, in deploy order -- account names
  # are globally unique and Azure briefly holds a just-deleted name, so
  # the account is never a shared recreate-per-scenario registry
  # prerequisite), creates the local user with both auth methods and a
  # container-scoped grant, verifies it via the ARM API (and that the
  # Azure-generated password landed in the outputs), destroys it, and
  # verifies it is gone.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
