# Minimal AzureStorageLocalUser scenario: an SFTP exchange-partner
# identity on the scenario-local SFTP fixture account -- both auth
# methods on (proving the Azure-generated password lands in the outputs
# AND the public-key list round-trips), a home directory, and a
# permission scope whose resource name resolves through the container
# FK seam (fixture RG -> SFTP account -> container -> this user).
apiVersion: azure.planton.dev/v1alpha1
kind: AzureStorageLocalUser
metadata:
  name: planton-oss-e2e-azurestoragelocaluser-smoke
  id: planton-oss-e2e-azurestoragelocaluser-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurestoragelocaluser
  annotations:
    planton.dev/e2e: "true"
    # Scenario-local account + container (in deploy order) instead of
    # registry prerequisites: storage-account names are globally unique
    # and sequential subtests that destroy and recreate the same name
    # hang on recreate.
    planton.dev/e2e-prerequisites: "catalog/azure/azurestoragelocaluser/e2e/minimal-account.yaml,catalog/azure/azurestoragelocaluser/e2e/minimal-container.yaml"
  tags:
    - planton-e2e
spec:
  storageAccountId:
    valueFrom:
      name: planton-oss-e2e-slu-fixture-account
  userName: partner01
  sshKeyEnabled: true
  sshPasswordEnabled: true
  sshAuthorizedKeys:
    # A well-formed ed25519 PUBLIC key -- public material, safe in a
    # fixture; the matching private key does not exist anywhere.
    - key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGJ3iXFCbaYbzUZzz2i2Cv6/L7Ohtq5rM9lZ74W2mBrz e2e-partner-pipeline
      description: e2e partner pipeline key
  homeDirectory: partner-inbound
  permissionScopes:
    - service: BLOB
      resourceName:
        valueFrom:
          name: planton-oss-e2e-slu-fixture-container
      read: true
      write: true
      list: true
      create: true
