# Dedicated container on the scenario-local SFTP fixture account -- the
# resource the local user's permission scope grants access to, proving
# the container-name FK seam live.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureStorageContainer
metadata:
  name: planton-oss-e2e-slu-fixture-container
  id: planton-oss-e2e-slu-fixture-container
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurestoragecontainer
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  storageAccountId:
    valueFrom:
      name: planton-oss-e2e-slu-fixture-account
  containerName: partner-inbound
