# Dedicated SFTP-enabled AzureStorageAccount for the local-user scenario
# only. Account names are globally unique in Azure and hyphen-forbidden,
# so each scenario that creates and destroys its own parent account
# carries a distinct hyphen-free name -- reusing a name across sequential
# subtests hits Azure's post-delete reservation and the recreate hangs.
# SFTP (and its hierarchical-namespace prerequisite) is on because the
# scenario proves the credential identity SFTP authenticates.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureStorageAccount
metadata:
  name: planton-oss-e2e-slu-fixture-account
  id: planton-oss-e2e-slu-fixture-account
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurestorageaccount
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  accountName: pltnosse2eslufix
  replicationType: LRS
  isHnsEnabled: true
  sftpEnabled: true
