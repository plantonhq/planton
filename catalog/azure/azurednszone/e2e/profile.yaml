apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurednszone
spec:
  # The scenario creates a public DNS zone (with a customized SOA record
  # and user tags) in the fixture resource group, verifies it via the ARM
  # API, destroys it, and verifies it is gone. Zones create and delete in
  # seconds; the fixture resource group dominates the run. Public DNS
  # zone names are not globally unique, so sequential recreate is safe.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
