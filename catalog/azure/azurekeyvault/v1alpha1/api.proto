syntax = "proto3";

package dev.planton.azure.azurekeyvault.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurekeyvault/v1alpha1/outputs.proto";
import "catalog/azure/azurekeyvault/v1alpha1/spec.proto";
import "shared/metadata.proto";

//azure-key-vault
message AzureKeyVault {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureKeyVault'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AzureKeyVaultSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AzureKeyVaultStatus status = 5;
}

//azure-key-vault status
message AzureKeyVaultStatus {
  //outputs
  AzureKeyVaultOutputs outputs = 1;
}
