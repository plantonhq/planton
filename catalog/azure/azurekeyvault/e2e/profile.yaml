apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurekeyvault
spec:
  # The harness deploys the fixture resource group (registry prerequisite),
  # creates a Standard RBAC vault with a network-rule block, verifies it via
  # the ARM API (generic GetByID on the vault's ARM id), destroys it, and
  # verifies it is gone -- on both provisioners. Purge protection stays off
  # so the provider's default purge-on-destroy frees the globally unique
  # vault name immediately (no soft-deleted orphan lingers).
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
