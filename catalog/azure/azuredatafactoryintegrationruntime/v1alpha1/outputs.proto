syntax = "proto3";

package dev.planton.azure.azuredatafactoryintegrationruntime.v1alpha1;

import "shared/options/options.proto";

// **AzureDataFactoryIntegrationRuntimeOutputs** captures the
// outputs from provisioning an Azure Data Factory integration
// runtime.
message AzureDataFactoryIntegrationRuntimeOutputs {
  // The integration runtime's Azure Resource Manager ID
  // ({factory_id}/integrationRuntimes/{name}) -- the same ID shape
  // for all three flavors.
  string integration_runtime_id = 1;

  // The integration runtime's name -- what linked services, data
  // flow activities, and the SSIS proxy resolve against.
  string integration_runtime_name = 2;

  // The primary authorization key a self-hosted agent uses to join
  // this runtime. Populated only for a PRIMARY self_hosted runtime
  // (Azure issues no keys for the managed flavors or for a linked
  // registration). SECRET -- Azure returns it readable, so the
  // catalog treats it as sensitive even though the provider does
  // not.
  string primary_authorization_key = 3 [(dev.planton.shared.options.sensitive) = true];

  // The secondary authorization key (for key rotation). Populated
  // only for a PRIMARY self_hosted runtime. SECRET.
  string secondary_authorization_key = 4 [(dev.planton.shared.options.sensitive) = true];
}
