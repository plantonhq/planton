# AzureVpnServerConfiguration install profile used as a fixture by
# composed components (declared via prerequisites:
# [AzureVpnServerConfiguration] in the kind registry -- the
# point-to-site VPN gateway). The harness deploys this document after
# the fixture resource group and captures its outputs --
# vpn_server_configuration_id in particular -- for dependents'
# references to resolve against.
#
# COST AND TIME: free and seconds -- the cheap fixture of the
# point-to-site pair (the gateway that chains through it is the
# expensive one). Certificate auth keeps the fixture
# environment-independent: the pinned root is PUBLIC data only (the
# private key was discarded at generation; no client can ever
# authenticate with it, which is fine -- no lane ever connects a real
# client).
apiVersion: azure.planton.dev/v1alpha1
kind: AzureVpnServerConfiguration
metadata:
  name: planton-oss-e2e-azure-fixture-vpnsc
  id: planton-oss-e2e-azure-fixture-vpnsc
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurevpnserverconfiguration
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-fixture-vpnsc
  vpnAuthenticationTypes:
    - Certificate
  clientRootCertificates:
    # Self-signed test root, public data only. Generated with:
    #   openssl req -x509 -newkey rsa:2048 -keyout root.key -out root.pem \
    #     -days 3650 -nodes -subj "/CN=planton-oss-e2e-p2s-root"
    #   openssl x509 -in root.pem -outform der | base64
    - name: e2e-root
      publicCertData: 
  vpnProtocols:
    - OpenVPN
  tags:
    e2e-suite: azure
    purpose: fixture
