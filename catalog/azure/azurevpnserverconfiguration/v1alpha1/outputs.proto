syntax = "proto3";

package dev.planton.azure.azurevpnserverconfiguration.v1alpha1;

// **AzureVpnServerConfigurationOutputs** captures the outputs of
// provisioning a VPN server configuration.
message AzureVpnServerConfigurationOutputs {
  // The Azure Resource Manager ID of the VPN server configuration --
  // what a point-to-site VPN gateway references as its
  // vpn_server_configuration_id.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/vpnServerConfigurations/{name}
  string vpn_server_configuration_id = 1;

  // The name of the VPN server configuration.
  string vpn_server_configuration_name = 2;

  // The ARM ID of each policy group on the configuration, keyed by
  // the group's name from the spec.
  // Example valueFrom fieldPath: status.outputs.policy_group_ids.engineering
  map<string, string> policy_group_ids = 3;
}
