apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azuredataprotectionbackuppolicy
spec:
  # PROVEN live on both engines (proof session, 2026-08-20), ALL
  # THREE scenarios: Pulumi 4m33s-5m4s each; Terraform 3m50s-3m56s
  # each incl. a blind import round-trip (13-14s) with a
  # no-differences re-plan -- the kubernetes variant's vault
  # name+resource-group addressing seam proven end to end through a
  # resolved reference. Policies are FREE configuration objects on
  # the fixture vault -- the lane's time is the fixture chain
  # (resource group + Data Protection vault, both fast). The three
  # scenarios cover all three retention dialects
  # live: `minimal` (disk, flat durations -- deliberately the SAFE
  # shape, it doubles as future backup-instance lanes' install
  # manifest), `kubernetes-nested-retention` (the nested life-cycle
  # dialect AND the vault name+resource-group addressing seam unique
  # to that variant), and `blob-dual-store` (the operational/vault
  # dual-duration dialect only blob carries). The mysql/pg/data-lake
  # variants stay OFFLINE-PROVEN: their retention grammars are
  # shape-identical to the proven dialects (the flex pair to the
  # kubernetes shape, data-lake to the disk shape modulo flat
  # criteria), and their wire shapes are inspected in the per-variant
  # offline plans -- recorded honestly here rather than burning three
  # more lanes on grammar already proven.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 45
