apiVersion: azure.planton.dev/v1alpha1
kind: AzureContainerAppJob
metadata:
  name: my-migration-job
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  jobName: my-migration-job
  containerAppEnvironmentId:
    value: "<container-app-environment-id>"
  replicaTimeoutInSeconds: 1800
  containers:
    - name: migrate
      image: mycompany.azurecr.io/db-migrate:v1.0.0
      cpu: 0.5
      memory: "1Gi"
      command: ["/bin/migrate"]
      args: ["up"]
      env:
        - name: DB_CONNECTION
          secretName: db-conn
  manualTrigger:
    parallelism: 1
    replicaCompletionCount: 1
  secrets:
    - name: db-conn
      keyVaultSecretId: https://my-keyvault.vault.azure.net/secrets/db-connection
      identity: System
  registries:
    - server:
        value: mycompany.azurecr.io
      identity: System
  identity:
    type: SYSTEM_ASSIGNED
