apiVersion: azure.planton.dev/v1alpha1
kind: AzureContainerAppJob
metadata:
  name: my-queue-worker
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  jobName: my-queue-worker
  containerAppEnvironmentId:
    value: "<container-app-environment-id>"
  replicaTimeoutInSeconds: 600
  replicaRetryLimit: 2
  containers:
    - name: worker
      image: mycompany.azurecr.io/queue-worker:v1.0.0
      cpu: 0.5
      memory: "1Gi"
      env:
        - name: QUEUE_NAME
          value: work
        - name: STORAGE_CONNECTION
          secretName: storage-conn
  eventTrigger:
    scale:
      maxExecutions: 10
      pollingIntervalInSeconds: 30
      rules:
        - name: queue-depth
          customRuleType: azure-queue
          metadata:
            queueName: work
            queueLength: "5"
          authentication:
            - secretName: storage-conn
              triggerParameter: connection
  secrets:
    - name: storage-conn
      value: "<storage-account-connection-string>"
  registries:
    - server:
        value: mycompany.azurecr.io
      identity: System
  identity:
    type: SYSTEM_ASSIGNED
