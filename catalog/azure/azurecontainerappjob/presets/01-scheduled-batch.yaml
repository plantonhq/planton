apiVersion: azure.planton.dev/v1alpha1
kind: AzureContainerAppJob
metadata:
  name: my-nightly-report
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  jobName: my-nightly-report
  containerAppEnvironmentId:
    value: "<container-app-environment-id>"
  replicaTimeoutInSeconds: 3600
  replicaRetryLimit: 1
  containers:
    - name: report
      image: mycompany.azurecr.io/report-generator:v1.0.0
      cpu: 1.0
      memory: "2Gi"
      env:
        - name: REPORT_DATE
          value: yesterday
        - name: DB_CONNECTION
          secretName: db-conn
  scheduleTrigger:
    cronExpression: "0 2 * * *"
  secrets:
    - name: db-conn
      keyVaultSecretId: https://my-keyvault.vault.azure.net/secrets/db-connection
      identity: "<your-user-assigned-identity-id>"
  registries:
    - server:
        value: mycompany.azurecr.io
      identity: "<your-user-assigned-identity-id>"
  identity:
    type: USER_ASSIGNED
    userAssignedIdentityIds:
      - value: "<your-user-assigned-identity-id>"
