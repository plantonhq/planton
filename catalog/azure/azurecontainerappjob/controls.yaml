# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azurecontainerappjob
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: "Run-to-completion compute holds no durable data of its own -- EMPTY_DIR volumes are ephemeral scratch lost at termination, and anything the workload persists lands in the data stores it writes (Azure Files shares behind AZURE_FILE volumes, databases, blobs), whose encryption posture belongs to those components. The job's secrets block is management-plane configuration; keeping secret material out of it entirely via key_vault_secret_id is the stronger arrangement."
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: "No data at rest of its own to key (see enc-at-rest). Key Vault-referenced secrets put the secret material under the vault's key posture, where CMK is a real choice."
    - control_id: enc-in-transit
      status: not_applicable
      notes: "Jobs have no ingress -- there is no inbound connection to this component to encrypt, and outbound TLS is the workload code's own behavior. The platform's interactions on the job's behalf (image pulls, Key Vault secret reads, KEDA scaler polls against Azure services) ride HTTPS by service requirement."
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Container Apps jobs have no ingress model at all -- unlike Container Apps, a job cannot be assigned an external endpoint, FQDN, or listener. Executions make outbound calls only; nothing about a job is internet-reachable by construction."
    - control_id: restricted-ingress
      status: not_applicable
      notes: "No ingress surface exists to restrict (see no-public-access). What CAN be shaped is egress -- a VNet-injected parent environment routes execution traffic through the customer network, where NSGs and firewalls apply; that posture lives on the environment component."
    - control_id: edge-protection
      status: not_applicable
      notes: "No inbound traffic exists to filter -- WAF belongs to request-serving tiers. A job is the opposite shape: it originates work, it never receives it."
    - control_id: rbac
      status: not_applicable
      notes: "Management access is subscription/resource-group RBAC posture, not a component choice. Worth knowing when operating one: starting an execution is itself an ARM RBAC action (Microsoft.App/jobs/start/action), so who can run the job -- and thereby read every secret it mounts -- is governed by role assignments outside this spec."
    - control_id: workload-identity
      status: configurable
      field_path: identity
      evidence:
        type: spec_default
        reference: "Unset, the job holds no Azure identity and any cloud access rides injected credentials; the identity block attaches a system-assigned and/or user-assigned managed identity, and the spec threads it end to end -- registries authenticate by identity instead of password secrets, secrets resolve from Key Vault by identity, and event-trigger scale rules carry identity_id so KEDA reads queue depth without a connection string."
      notes: "All three presets attach a managed identity and use it for registry auth; 01-scheduled-batch and 03-on-demand also resolve their secrets from Key Vault through it."
    - control_id: no-legacy-auth
      status: configurable
      field_path: registries
      evidence:
        type: spec_default
        reference: "Each registry entry authenticates with exactly one mode (spec-enforced) -- a managed identity, or the weaker username plus password_secret_name pair that parks a static registry password in the job's secrets. Choosing identity leaves no static credential in play."
      notes: "All three presets use identity-based registry auth. The static-password path stays representable for registries outside Entra's reach (Docker Hub, GHCR)."
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: "Control-plane operations -- including every jobs/start invocation -- land in the Azure Activity Log as subscription-level posture; the job offers no audit knob of its own. What the workload does inside an execution is visible only through the logs it writes (see monitoring-integration)."
    - control_id: monitoring-integration
      status: not_applicable
      notes: "The monitoring wiring is the parent environment's choice, not this component's -- execution console and system logs flow to whatever destination the environment's logging configuration declares (Log Analytics, Azure Monitor, or none), and the job inherits it without a field of its own. Azure Monitor's platform metrics for job executions exist regardless of that choice."
    - control_id: backup-recovery
      status: not_applicable
      notes: "Run-to-completion compute with no durable state -- the job definition recreates losslessly from infrastructure-as-code, and EMPTY_DIR scratch is gone by design. Durable outputs live where the workload writes them; back up those components."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: "No backups exist to retain (see backup-recovery)."
    - control_id: multi-zone-ha
      status: not_applicable
      notes: "Zone placement is decided by the parent Container App Environment (its zone-redundancy choice at creation), and the job inherits it with no zone knob of its own. The sharper resilience lever for a job is retry posture -- replica_retry_limit -- since executions are short-lived by nature."
    - control_id: deletion-protection
      status: not_applicable
      notes: "Neither Microsoft.App/jobs nor this spec offers a deletion-protection flag; Azure resource locks are subscription-side governance outside the manifest. Deleting the job erases its execution history along with it."
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Serverless platform -- Microsoft owns and patches the hosts, kernel, and container runtime beneath every execution; no customer-visible patch surface exists."
      notes: "The container image's CONTENTS remain the user's build responsibility -- the platform patches what runs the container, never what runs inside it."
