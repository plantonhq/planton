syntax = "proto3";

package dev.planton.azure.azurecontainerappjob.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurecontainerappjob/v1alpha1/outputs.proto";
import "catalog/azure/azurecontainerappjob/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureContainerAppJob is the top-level API resource for an Azure Container
// App Job -- a run-to-completion containerized workload (batch processing,
// scheduled tasks, queue workers) inside an Azure Container Apps Managed
// Environment.
message AzureContainerAppJob {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureContainerAppJob'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureContainerAppJobSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureContainerAppJobStatus status = 5;
}

// AzureContainerAppJobStatus holds the deployment status and outputs.
message AzureContainerAppJobStatus {
  // outputs
  AzureContainerAppJobOutputs outputs = 1;
}
