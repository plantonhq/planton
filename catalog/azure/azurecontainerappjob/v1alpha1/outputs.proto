syntax = "proto3";

package dev.planton.azure.azurecontainerappjob.v1alpha1;

// **AzureContainerAppJobOutputs** captures the outputs of provisioning
// an Azure Container App Job.
//
// This is a leaf workload resource -- no downstream Planton resources
// reference these outputs. They are consumed by CI/CD systems that start
// manual executions (`job_id`), event-stream consumers
// (`event_stream_endpoint`), and firewall allowlists
// (`outbound_ip_addresses`).
message AzureContainerAppJobOutputs {
  // The Azure Resource Manager ID of the Container App Job.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.App/jobs/{name}
  //
  // Use this to start manual executions (az containerapp job start) and
  // for programmatic access.
  string job_id = 1;

  // The name of the Container App Job.
  string job_name = 2;

  // The endpoint streaming the job's execution events (started, running,
  // succeeded, failed) -- the hook for execution monitoring.
  string event_stream_endpoint = 3;

  // Outbound IP addresses used by the job's replicas for egress traffic.
  // Use these to configure firewall allowlists on external services the
  // job connects to.
  repeated string outbound_ip_addresses = 4;

  // The principal (object) ID of the job's system-assigned managed
  // identity. Empty unless the identity block enables SYSTEM_ASSIGNED.
  // Grant this principal roles (AcrPull, Storage Queue Data Reader, etc.)
  // to let the job authenticate keylessly.
  string identity_principal_id = 5;
}
