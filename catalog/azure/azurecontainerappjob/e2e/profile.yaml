apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurecontainerappjob
spec:
  # The scenario deploys the composed RG -> environment -> job chain: a
  # schedule-triggered job (cron pinned outside the E2E window, so the
  # run proves the management surface, not an execution) -- verifies it
  # via the ARM API, destroys it, and verifies it is gone. The job
  # creates in ~1 minute; the fixture environment's create + ~5-10
  # minute delete dominates the run.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 60
