# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azureprivatednszonevirtualnetworklink
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The link is an attachment record between a zone and a network; it stores no customer data at rest.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to encrypt (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: The link moves no traffic itself -- it grants one network resolution of the zone; queries travel by Azure's VNet-provided resolver over standard DNS.
    - control_id: no-public-access
      status: not_applicable
      notes: The link has no reachable endpoint, and it only ever WIDENS private resolution -- the zone stays answerable exclusively inside linked virtual networks, never publicly.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No inbound surface of its own; which networks can resolve the zone is exactly the set of links, each its own resource.
    - control_id: edge-protection
      status: not_applicable
      notes: No request path of its own to filter.
    - control_id: rbac
      status: not_applicable
      notes: Management access is ARM RBAC on the zone's virtualNetworkLinks operations plus join authorization on the linked network (subscription/resource-group posture); the link exposes no authentication plane of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The link runs no workloads and holds no credentials.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths of its own.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Link writes land in the Azure Activity Log as subscription-level posture; query-level observability belongs to the zone, not the link.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The link publishes no metrics of its own; zone query metrics are AzurePrivateDnsZone's surface.
    - control_id: backup-recovery
      status: not_applicable
      notes: Stateless declarative configuration -- the manifest recreates the link exactly (a replaced link means only a brief resolution gap for the affected network); there is no runtime state to back up.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: An attachment record with no data plane of its own -- resolution is served by the Microsoft-operated private DNS service, whose availability posture belongs to the zone, not the link.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither ARM nor this spec offers a deletion-protection flag for links (Azure resource locks are subscription-side governance outside the manifest). Deleting the link stops the network resolving the zone, nothing more.
    - control_id: managed-patching
      status: not_applicable
      notes: Pure configuration inside the Microsoft-operated private DNS service -- no software surface of its own to patch.
