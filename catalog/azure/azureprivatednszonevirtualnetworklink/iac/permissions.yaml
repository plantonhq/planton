# Least-privilege permissions the IaC runner's Azure principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: azureprivatednszonevirtualnetworklink
spec:
  azure:
    groups:
      - purpose: ManageLink
        actions:
          - Microsoft.Network/privateDnsZones/virtualNetworkLinks/read
          - Microsoft.Network/privateDnsZones/virtualNetworkLinks/write
          - Microsoft.Network/privateDnsZones/virtualNetworkLinks/delete
        provenance: derived
        notes: Covers azurerm_private_dns_zone_virtual_network_link -- create, read/refresh, in-place registration/resolution-policy/tag updates, and destroy. The link is an ARM child of the zone, so these are needed in the zone's scope; Private DNS Zone Contributor covers them.
      - purpose: JoinLinkedNetwork
        actions:
          - Microsoft.Network/virtualNetworks/join/action
        provenance: derived
        notes: The link references the target network by ARM ID (spec.virtual_network_id); ARM authorizes the reference through the network's join action, in the NETWORK's scope -- Network Contributor there covers it. Verified against the live Microsoft.Network operation inventory.
