syntax = "proto3";

package dev.planton.azure.azureprivatednszonevirtualnetworklink.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureprivatednszonevirtualnetworklink/v1alpha1/outputs.proto";
import "catalog/azure/azureprivatednszonevirtualnetworklink/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzurePrivateDnsZoneVirtualNetworkLink is the top-level API resource for a
// private DNS zone virtual network link: the attachment that makes an Azure
// Private DNS zone resolvable from a virtual network. It is modeled as a
// first-class composable resource because links are many-per-zone with
// independent lifecycles -- hub-and-spoke topologies link one zone to many
// networks, and networks join and leave without touching the zone.
message AzurePrivateDnsZoneVirtualNetworkLink {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzurePrivateDnsZoneVirtualNetworkLink".
  string kind = 2 [(buf.validate.field).string.const = 'AzurePrivateDnsZoneVirtualNetworkLink'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Virtual network link specification.
  AzurePrivateDnsZoneVirtualNetworkLinkSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzurePrivateDnsZoneVirtualNetworkLinkStatus status = 5;
}

// AzurePrivateDnsZoneVirtualNetworkLinkStatus holds the deployment outputs.
message AzurePrivateDnsZoneVirtualNetworkLinkStatus {
  // Outputs from the IaC deployment.
  AzurePrivateDnsZoneVirtualNetworkLinkOutputs outputs = 1;
}
