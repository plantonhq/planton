apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azureprivatednszonevirtualnetworklink
spec:
  # Composed live proof across a two-parent chain: the harness deploys the
  # fixture resource group, the fixture private DNS zone, and the fixture
  # virtual network (registry prerequisites; the RG chains transitively),
  # writes a link binding the zone to the network, verifies the link via
  # the ARM API (generic GetByID on the link's ARM id), destroys it, and
  # verifies it is gone -- on both provisioners. Links are free and fast.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
