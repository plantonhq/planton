# Minimal AzurePrivateDnsZoneVirtualNetworkLink scenario: a link binding
# the fixture zone to the fixture network.
#
# Both parent references resolve against the registry prerequisites'
# captured outputs through the fields' default kinds (AzurePrivateDnsZone ->
# the fixture zone's ARM id; AzureVirtualNetwork -> the fixture network's
# ARM id), keeping the scenario fully registry-driven with no literal
# subscription ids -- and exercising the modules' parse of the zone's RG and
# name from the referenced ARM id. registration_enabled and
# resolution_policy are left unset: Azure's defaults are what privatelink
# deployments use, and both are plain in-place properties the offline parity
# audit covers. User tags exercise the merge-over-metadata-tags path.
apiVersion: azure.planton.dev/v1alpha1
kind: AzurePrivateDnsZoneVirtualNetworkLink
metadata:
  name: planton-oss-e2e-azureprivatednszonevirtualnetworklink-smoke
  id: planton-oss-e2e-azureprivatednszonevirtualnetworklink-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureprivatednszonevirtualnetworklink
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  name: planton-oss-e2e-link-smoke
  privateDnsZoneId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-pdns
  virtualNetworkId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-vnet
  tags:
    e2e-suite: azure
    purpose: smoke
