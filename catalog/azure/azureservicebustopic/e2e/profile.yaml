apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azureservicebustopic
spec:
  # The harness deploys the fixture resource group and a SCENARIO-LOCAL
  # Service Bus namespace (e2e-prerequisites annotation -- namespace
  # names are globally unique with a post-delete hold), creates a topic
  # with duplicate detection and publish ordering, verifies it via the
  # ARM API, destroys it, and verifies it is gone -- on both
  # provisioners. Topics create in seconds; the namespace fixture
  # dominates the lane.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
