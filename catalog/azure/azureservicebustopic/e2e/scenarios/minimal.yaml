# Minimal AzureServiceBusTopic scenario: an ordered, dedup-enabled topic
# on a scenario-local namespace -- proving the parent-by-ARM-id
# reference, the ForceNew dedup pair, publish ordering, and the
# namespace-name output parse on both engines.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureServiceBusTopic
metadata:
  name: planton-oss-e2e-azureservicebustopic-smoke
  id: planton-oss-e2e-azureservicebustopic-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureservicebustopic
  annotations:
    planton.dev/e2e: "true"
    # Scenario-local namespace: globally-unique names must never be
    # destroyed and recreated across sequential subtests.
    planton.dev/e2e-prerequisites: "catalog/azure/azureservicebustopic/e2e/fixture-namespace.yaml"
  tags:
    - planton-e2e
spec:
  namespaceId:
    valueFrom:
      name: planton-oss-e2e-sbtopic-fixture-namespace
  topicName: e2e-events
  maxSizeInMegabytes: 2048
  requiresDuplicateDetection: true
  duplicateDetectionHistoryTimeWindow: PT1M
  supportOrdering: true
  defaultMessageTtl: P7D
