syntax = "proto3";

package dev.planton.azure.azureservicebustopic.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureservicebustopic/v1alpha1/outputs.proto";
import "catalog/azure/azureservicebustopic/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureServiceBusTopic is the top-level API resource for a topic inside an
// Azure Service Bus namespace (referenced via namespace_id) -- the
// publish-subscribe primitive. Publishers send to the topic; each
// AzureServiceBusSubscription under it receives an independent, filtered
// copy of the stream. Topic-scoped SAS credentials are minted with
// AzureServiceBusAuthorizationRule.
message AzureServiceBusTopic {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureServiceBusTopic'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureServiceBusTopicSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureServiceBusTopicStatus status = 5;
}

// AzureServiceBusTopicStatus holds the deployment status and outputs.
message AzureServiceBusTopicStatus {
  // outputs
  AzureServiceBusTopicOutputs outputs = 1;
}
