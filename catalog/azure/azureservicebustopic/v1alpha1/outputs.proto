syntax = "proto3";

package dev.planton.azure.azureservicebustopic.v1alpha1;

// **AzureServiceBusTopicOutputs** captures the outputs of provisioning
// a Service Bus topic.
//
// No connection string here on purpose: credentials are minted by
// AzureServiceBusAuthorizationRule (namespace- or topic-scoped) or granted
// keyless via Entra data-plane roles on topic_id. Subscriptions reference
// the topic by topic_id.
message AzureServiceBusTopicOutputs {
  // The Azure Resource Manager ID of the topic. The parent reference for
  // AzureServiceBusSubscription and topic-scoped SAS rules, and the scope
  // for topic-level data-plane role assignments (Azure Service Bus Data
  // Sender).
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.ServiceBus/namespaces/{ns}/topics/{name}
  string topic_id = 1;

  // The topic's name -- what SDKs and function bindings reference within
  // the namespace.
  string topic_name = 2;

  // The name of the Service Bus namespace the topic lives in, parsed from
  // the resolved namespace ID -- saves consumers a second reference when
  // they need the namespace/topic pair.
  string namespace_name = 3;
}
