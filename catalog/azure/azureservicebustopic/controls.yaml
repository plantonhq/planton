# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azureservicebustopic
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Service Bus encrypts all message data at rest with Microsoft-managed keys unconditionally -- messages published to the topic rest on the namespace's encrypted storage until delivered through subscriptions, with no opt-out and no topic-level knob.
      notes: Upgrading to customer-managed keys is a PREMIUM namespace-level configuration on the AzureServiceBusNamespace kind, not a topic choice.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Customer-managed keys are a NAMESPACE-level configuration on PREMIUM -- the parent AzureServiceBusNamespace applies BYOK encryption to every entity in it; the topic spec has no key surface of its own.
    - control_id: enc-in-transit
      status: not_applicable
      notes: Publishers connect to the NAMESPACE endpoint ({namespace}.servicebus.windows.net), where TLS is enforced and the minimum TLS version is configured -- the topic exposes no transport surface of its own.
    - control_id: no-public-access
      status: not_applicable
      notes: Network exposure is the parent namespace's posture (public network access, private endpoints, IP rules); the topic has no endpoint of its own to expose or hide.
    - control_id: restricted-ingress
      status: not_applicable
      notes: Inbound restriction lives on the namespace's network rule sets and private endpoints -- namespace-level posture, not a topic field.
    - control_id: edge-protection
      status: not_applicable
      notes: Service Bus is an AMQP/HTTPS messaging endpoint fronted by Azure's service fabric; no WAF attachment point exists on a topic.
    - control_id: rbac
      status: not_applicable
      notes: The topic declares no access rules of its own, but its ARM ID is a data-plane RBAC grant scope -- grant "Azure Service Bus Data Sender" on exactly this topic via AzureRoleAssignment (receivers are authorized at the same scope and consume through subscriptions), or mint topic-scoped SAS credentials with AzureServiceBusAuthorizationRule (topic_id). Both are separate kinds carrying their own posture.
    - control_id: workload-identity
      status: not_applicable
      notes: The topic holds no credentials and runs no workloads; publisher access goes keyless by granting Entra identities data-plane roles at this topic's scope via AzureRoleAssignment instead of SAS rules.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The SAS-versus-Entra decision is the namespace's local_auth_enabled switch -- disabling it kills SAS keys namespace-wide. The topic has no authentication toggle of its own.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Runtime and operational audit logs (diagnostic settings) are configured on the NAMESPACE as separate resources; control-plane changes to the topic land in the Azure Activity Log as subscription-level posture.
    - control_id: monitoring-integration
      status: not_applicable
      notes: Service Bus metrics (incoming/outgoing messages, size, throttled requests) are published at the namespace level with per-entity dimensions; diagnostic-setting export is namespace-scoped configuration outside this spec.
    - control_id: backup-recovery
      status: not_applicable
      notes: Messages transit the topic only until delivered to subscriptions or expired -- Azure offers no service-side backup or restore for topic contents, and the namespace's geo-DR pairing (AzureServiceBusDisasterRecoveryConfig) replicates the topic's DEFINITION but never its messages.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery); default_message_ttl bounds how long unforwarded messages live, not backup retention.
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Zone redundancy is the parent namespace's posture -- a Service Bus namespace in an availability-zone region replicates across zones, and every topic inherits that placement; the topic has no zonal knob.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Azure nor this spec offers a deletion-protection flag for a topic (Azure resource locks are subscription-side governance outside the manifest). The status field gates traffic (DISABLED) but not deletion -- and deleting or renaming the topic takes every subscription under it along.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed PaaS -- Microsoft operates and patches the Service Bus brokers and storage; no customer-visible patch surface exists.
