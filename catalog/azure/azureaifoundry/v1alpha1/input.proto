syntax = "proto3";

package dev.planton.azure.azureaifoundry.v1alpha1;

import "catalog/azure/azureaifoundry/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureAiFoundryIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureAiFoundryIacInput {
  // The AI Foundry hub resource to deploy.
  AzureAiFoundry target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
