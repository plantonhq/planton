apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: azureaifoundry
spec:
  # The hub's identity is its full ARM resource ID (an ML workspace
  # path -- hubs are workspaces of kind "Hub"; the provider's importer
  # verifies the kind).
  values:
    - name: ai_foundry_id
      derivations:
        - from_output: ai_foundry_id
      where_to_find: >-
        Portal -> Azure AI Foundry -> the hub -> Properties ->
        Resource ID, or `az ml workspace show -g <rg> -n <name>
        --query id` (hubs are ML workspaces at ARM).
