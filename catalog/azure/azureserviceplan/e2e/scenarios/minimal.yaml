# Minimal AzureServicePlan scenario: a Basic B1 Linux plan in the
# fixture resource group -- proving the enum SKU mapping (spec value ->
# Azure's wire spelling), the Linux default, an explicit worker count,
# and user tags. Plan names are resource-group-scoped, so sequential
# engine runs recreate the same name safely.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureServicePlan
metadata:
  name: planton-oss-e2e-azureserviceplan-smoke
  id: planton-oss-e2e-azureserviceplan-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureserviceplan
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  # centralus: probe-verified Basic-tier capacity (eastus has no Basic
  # quota on the test subscription and westus3 rejected Basic creates on capacity).
  region: centralus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  servicePlanName: planton-oss-e2e-plan-smoke
  osType: LINUX
  skuName: BASIC_B1
  workerCount: 1
  tags:
    e2e-suite: azure
