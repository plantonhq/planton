apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azureserviceplan
spec:
  # The scenario deploys the fixture resource group (registry
  # prerequisite), creates a Basic B1 Linux plan -- proving the enum SKU
  # wire mapping, the Linux default, and user tags -- verifies it via
  # the ARM API, destroys it, and verifies it is gone. Plans provision
  # and delete in seconds to a couple of minutes.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
