# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azurefrontdoorendpoint
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The endpoint is edge-serving configuration; it stores no customer data at rest.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to encrypt (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: TLS posture is decided elsewhere in the Front Door graph -- the routes attached to this endpoint choose supported_protocols and https_redirect_enabled, and custom domains carry the certificate and cipher policy. The endpoint's generated *.azurefd.net hostname serves Azure's managed edge certificate, but this spec carries no transit field.
    - control_id: no-public-access
      status: not_applicable
      notes: The endpoint IS the public entry point by design -- its purpose is a globally reachable hostname. The enabled flag (default true) stops all requests at the edge for maintenance windows, but that is a service switch, not an exposure control.
    - control_id: restricted-ingress
      status: not_applicable
      notes: Ingress restriction at the edge lives in the WAF policy attached through an AzureFrontDoorSecurityPolicy -- separate kinds; this spec carries no source filter.
    - control_id: edge-protection
      status: not_applicable
      notes: WAF enforcement is attached by an AzureFrontDoorSecurityPolicy that lists this endpoint's ARM ID in its domain_ids (protecting the generated hostname) -- the association lives on that kind, not here.
    - control_id: rbac
      status: not_applicable
      notes: Management access is subscription/resource-group RBAC posture, not a component choice; the endpoint exposes no authentication plane of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The endpoint runs no workloads and holds no credentials of its own.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths of its own.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Control-plane changes land in the Azure Activity Log as subscription-level posture; request access logs are the Front Door profile's diagnostic settings, a separate kind.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The endpoint publishes no metrics of its own; traffic metrics ride the Front Door profile, a separate kind.
    - control_id: backup-recovery
      status: not_applicable
      notes: Stateless edge configuration -- nothing to back up; the manifest recreates the endpoint declaratively. Note that recreation generates a NEW *.azurefd.net hostname (the hash suffix changes), so DNS records pointing at the old hostname must be updated.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Front Door is a global anycast service -- the endpoint's hostname is answered from Microsoft's worldwide edge fleet by design, with no single-zone or single-region failure mode of its own.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Azure nor this spec offers a deletion-protection flag for an endpoint (Azure resource locks are subscription-side governance outside the manifest).
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed edge service -- Microsoft operates and patches the Front Door fleet that answers the endpoint's hostname; no customer-visible patch surface exists.
