# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azurefrontdoorendpoint
spec:
  billing_model: free
  free_tier: The endpoint itself -- its name, generated *.azurefd.net hostname, enabled switch, and tags -- never bills. Azure charges for the traffic Front Door serves, never for the entry-point resource.
  notes: "No field of this spec buys anything: the endpoint is configuration on the Front Door PROFILE it references (profile_id), and the profile is where Front Door billing lives -- a base fee per its own SKU plus requests and egress, a separate catalog kind. Disabling the endpoint stops traffic (and therefore traffic charges) but the endpoint resource itself carries no meter either way."
