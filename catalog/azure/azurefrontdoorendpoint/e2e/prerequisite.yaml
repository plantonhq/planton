# AzureFrontDoorEndpoint install profile used as a prerequisite by
# composed components (AzureFrontDoorRoute, declared via prerequisites in
# the kind registry). The harness deploys this endpoint after the fixture
# profile (the endpoint's own registry prerequisite), then resolves the
# route's endpoint_id reference against its endpoint_id output.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureFrontDoorEndpoint
metadata:
  name: planton-oss-e2e-fd-endpoint-prereq
  id: planton-oss-e2e-fd-endpoint-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurefrontdoorendpoint
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  profileId:
    valueFrom:
      name: planton-oss-e2e-fd-profile-prereq
  endpointName: pltn-e2e-fd-ep-prereq
