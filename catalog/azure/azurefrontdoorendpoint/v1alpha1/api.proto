syntax = "proto3";

package dev.planton.azure.azurefrontdoorendpoint.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurefrontdoorendpoint/v1alpha1/outputs.proto";
import "catalog/azure/azurefrontdoorendpoint/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureFrontDoorEndpoint is the top-level API resource for an endpoint
// inside an Azure Front Door profile (referenced via profile_id) -- the
// public entry point that receives client traffic on its generated
// `*.azurefd.net` hostname. Routes (AzureFrontDoorRoute) attach to the
// endpoint to connect it to origin groups.
message AzureFrontDoorEndpoint {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureFrontDoorEndpoint'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureFrontDoorEndpointSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureFrontDoorEndpointStatus status = 5;
}

// AzureFrontDoorEndpointStatus holds the deployment status and outputs.
message AzureFrontDoorEndpointStatus {
  // outputs
  AzureFrontDoorEndpointOutputs outputs = 1;
}
