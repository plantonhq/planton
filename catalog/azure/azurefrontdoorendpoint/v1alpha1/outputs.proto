syntax = "proto3";

package dev.planton.azure.azurefrontdoorendpoint.v1alpha1;

// **AzureFrontDoorEndpointOutputs** captures the outputs of
// provisioning an Azure Front Door endpoint.
message AzureFrontDoorEndpointOutputs {
  // The Azure Resource Manager ID of the endpoint -- what
  // AzureFrontDoorRoute's endpoint_id references, and (alongside custom
  // domain IDs) what a Front Door security policy associates a WAF
  // policy with.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/profiles/{profile}/afdEndpoints/{name}
  string endpoint_id = 1;

  // The endpoint's name -- unique within its profile.
  string endpoint_name = 2;

  // The generated, globally unique public hostname clients connect to
  // (`{name}-{hash}.z01.azurefd.net`). This is the CNAME target for
  // custom-domain DNS records (e.g. an AzureDnsRecord pointing
  // `www.example.com` at this value).
  string host_name = 3;
}
