# AzureCognitiveAccount install profile used as a fixture by composed
# components (declared via prerequisites: [AzureCognitiveAccount] in
# the kind registry -- the model deployment and the AI Foundry
# project). The harness deploys this document after the fixture
# resource group and captures its outputs -- cognitive_account_id in
# particular -- for dependents' references to resolve against.
#
# COST AND TIME: the account object is free at rest on S0 (billing
# follows deployment usage) and provisions in one to three minutes.
#
# The fixture is deliberately the AISERVICES shape with project
# management and a system identity: it serves BOTH dependents -- the
# model-deployment lane (AIServices hosts OpenAI model deployments
# exactly as an OpenAI-kind account does) and the project lane (which
# requires AIServices + project management + an identity). Deletion is
# a SOFT delete; the module purges the ghost on destroy (the provider
# default), so per-lane fixture cycles never collide on the name.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureCognitiveAccount
metadata:
  name: planton-oss-e2e-azure-fixture-cogacc
  id: planton-oss-e2e-azure-fixture-cogacc
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurecognitiveaccount
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-fixture-cogacc
  kind: AIServices
  skuName: S0
  customSubdomainName: planton-oss-e2e-fixture-cogacc
  projectManagementEnabled: true
  identity:
    type: SYSTEM_ASSIGNED
  tags:
    e2e-suite: azure
    purpose: fixture
