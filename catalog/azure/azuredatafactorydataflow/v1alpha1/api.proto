syntax = "proto3";

package dev.planton.azure.azuredatafactorydataflow.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azuredatafactorydataflow/v1alpha1/outputs.proto";
import "catalog/azure/azuredatafactorydataflow/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureDataFactoryDataFlow represents an Azure Data Factory data flow
// -- a visually-designed data transformation (mapping data flow) or a
// reusable transformation snippet (flowlet) inside a factory
// (AzureDataFactory).
message AzureDataFactoryDataFlow {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureDataFactoryDataFlow'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AzureDataFactoryDataFlowSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AzureDataFactoryDataFlowStatus status = 5;
}

// AzureDataFactoryDataFlowStatus represents the status of an Azure
// Data Factory data flow deployment.
message AzureDataFactoryDataFlowStatus {
  //outputs
  //  azure-data-factory-data-flow outputs
  AzureDataFactoryDataFlowOutputs outputs = 1;
}
