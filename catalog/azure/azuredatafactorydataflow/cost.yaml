# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. A data flow definition is free to hold;
# the meter spins when a pipeline's Execute Data Flow activity (or a
# debug session) runs it -- Spark cluster time billed per vCore-hour on
# the Azure Data Factory V2 service against the factory. Schema:
# finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azuredatafactorydataflow
spec:
  billing_model: usage_based
  cost_drivers:
    - field_path: script
      sku_meter: data flow execution vCore-hours
      pricing_unit: vCore-hour
      impact: "The script IS the workload: every execution bills the Spark cluster's vCores for the minutes it runs (prorated by the minute, rounded up), and the script's shape -- joins, aggregations, data volume touched -- decides how long that is. The cluster's size and compute class (General Purpose versus Memory Optimized, 8-vCore minimum) are chosen on the integration runtime of the Execute Data Flow activity that runs this flow, not here; the same script costs more on a bigger or memory-optimized cluster."
    - field_path: flowlet
      sku_meter: data flow execution vCore-hours
      pricing_unit: ""
      impact: "A flowlet (true) never runs alone and so never bills alone -- its logic executes inside the embedding data flow's cluster and is metered there. A mapping data flow (false, the default) is the runnable, billable form."
    - field_path: sinks
      sku_meter: connected stores' own meters
      pricing_unit: ""
      impact: "Every source read and sink write lands on an external system (through the referenced datasets and linked services) whose storage, request, and transaction meters bill on that system's own component -- a flow that writes more sinks touches more billed surfaces downstream."
  estimate_exclusions:
    - data flow execution bills per vCore-hour while running -- General Purpose "0.27325" USD, Memory Optimized "0.34275" USD, Compute Optimized "0.19225" USD per vCore-hour at East US, on an 8-vCore-minimum cluster, prorated by the minute and rounded up
    - debug sessions bill the same vCore-hour meter for as long as the debug cluster stays up (its TTL is an integration-runtime setting)
    - each execution also bills one orchestration activity run on the factory (Execute Data Flow is a pipeline activity)
    - Microsoft's pricing page notes data flows additionally bill the managed disk and blob storage required for execution and debugging
    - Data Factory operations bill on the factory -- read/write per 50,000 entity operations (authoring this data flow included) and monitoring per 50,000 run records
    - the systems the flow reads and writes (through its datasets and linked services) bill their own storage and request meters as their own components
  notes: "The definition never appears on the invoice -- an idle data flow costs exactly nothing, and there is no inactive-entity fee for data flows (that meter exists only for pipelines). All execution spend is decided OUTSIDE this spec: the pipeline that runs it (how often), and the Azure integration runtime of the Execute Data Flow activity (cluster size, compute class, time-to-live -- a warm TTL cluster keeps billing vCore-hours between runs on the factory's side). Rates verified live from Microsoft's Data Factory data-pipeline pricing page and the Retail Prices API (serviceName 'Azure Data Factory v2', eastus) on 2026-08-18."
