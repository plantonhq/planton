syntax = "proto3";

package dev.planton.azure.azurefabriccapacity.v1alpha1;

// **AzureFabricCapacityOutputs** captures the outputs from
// provisioning a Microsoft Fabric capacity.
message AzureFabricCapacityOutputs {
  // The capacity's Azure Resource Manager ID.
  string fabric_capacity_id = 1;

  // The capacity's name -- what Fabric workspaces assign themselves
  // to.
  string fabric_capacity_name = 2;
}
