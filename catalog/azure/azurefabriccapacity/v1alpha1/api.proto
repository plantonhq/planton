syntax = "proto3";

package dev.planton.azure.azurefabriccapacity.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurefabriccapacity/v1alpha1/outputs.proto";
import "catalog/azure/azurefabriccapacity/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureFabricCapacity represents a Microsoft Fabric capacity -- the
// billing and compute anchor of Microsoft Fabric: workspaces assign
// themselves to a capacity, and the capacity's F-SKU sets how much
// compute every workload on it shares.
message AzureFabricCapacity {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureFabricCapacity'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AzureFabricCapacitySpec spec = 4 [(buf.validate.field).required = true];

  //status
  AzureFabricCapacityStatus status = 5;
}

// AzureFabricCapacityStatus represents the status of a Microsoft
// Fabric capacity deployment.
message AzureFabricCapacityStatus {
  //outputs
  //  azure-fabric-capacity outputs
  AzureFabricCapacityOutputs outputs = 1;
}
