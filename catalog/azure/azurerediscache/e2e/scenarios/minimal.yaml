# Minimal AzureRedisCache scenario: the production-default STANDARD tier
# at the smallest size (C0), proving the surfaces every cache carries --
# Entra authentication enabled alongside the keys, an eviction policy, a
# firewall rule (the folded sub-resource), a pinned patch window (the
# day-of-week enum seam), and user tags.
#
# The cache name is globally unique across Azure; this scenario owns it
# and both engine runs recreate it only after the previous delete fully
# completes (Redis deletes poll to completion -- no soft-delete hold).
apiVersion: azure.planton.dev/v1alpha1
kind: AzureRedisCache
metadata:
  name: planton-oss-e2e-azurerediscache-smoke
  id: planton-oss-e2e-azurerediscache-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurerediscache
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  cacheName: pltn-oss-e2e-redis-smoke
  skuName: STANDARD
  capacity: 0
  redisConfiguration:
    activeDirectoryAuthenticationEnabled: true
    maxmemoryPolicy: allkeys-lru
  patchSchedules:
    - dayOfWeek: SUNDAY
      startHourUtc: 2
  firewallRules:
    - name: e2e_probe_range
      startIp: 203.0.113.0
      endIp: 203.0.113.255
  tags:
    e2e-suite: azure
