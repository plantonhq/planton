apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurecognitivedeployment
spec:
  # LIVE-PROVEN 2026-08-12 on BOTH engines: full six-phase lifecycle
  # (~5 min/engine; the chain pays the fixture account's cycle) plus the
  # blind import round-trip. A real gpt-5.4-mini model provisioned on
  # GlobalStandard at capacity 10 -- the quota boundary never bit (2,000
  # units available, probed read-only before the lanes). What DID bite:
  # the catalog LIFECYCLE boundary -- ARM rejected the originally-pinned
  # gpt-4o-mini with ServiceModelDeprecating (Deprecating-lifecycle
  # models are closed to NEW deployments long before final retirement);
  # the scenario model was re-pinned from the live catalog and the
  # lesson lives on the spec's model.name field and in GUIDE.md. The
  # round-trip consumed ONE declared tolerance: model.version is
  # READ-AUGMENTED for version-unset configs (declared in the provider
  # import catalog; drift on model format/name still fails). The
  # ProvisionedManaged arm is offline-proven only (reserved PTU capacity
  # bills continuously -- deliberately never deployed by a lane).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
