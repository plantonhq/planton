# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azurefunctionappflexconsumption
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: "Serverless compute holds no durable data of its own -- the code package rests in the deployment storage CONTAINER the user provides (storage_container_endpoint), whose encryption posture belongs to that AzureStorageAccount, and anything functions persist lands in the stores they write. App settings and connection strings are management-plane configuration encrypted by App Service platform-side."
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: "No data at rest of its own to key (see enc-at-rest). CMK is a real choice on the deployment storage account and on whatever stores the functions write -- both outside this spec."
    - control_id: enc-in-transit
      status: configurable
      field_path: https_only
      evidence:
        type: spec_default
        reference: "The field's declared default is true -- all plain-HTTP requests redirect to HTTPS (deliberately stricter than Azure's API default of false). site_config.minimum_tls_version floors the handshake at TLS 1.2 when unset, raisable to TLS 1.3."
      notes: "All three committed presets pin httpsOnly true and TLS_1_2 explicitly. client_certificate_enabled layers mutual TLS on top when REQUIRED is chosen. Outbound TLS is the functions' own code."
    - control_id: no-public-access
      status: configurable
      field_path: public_network_access_enabled
      evidence:
        type: spec_default
        reference: "The field's declared default is true (Azure's own default: the app answers its public *.azurewebsites.net hostname). Set false to make the app reachable only through Private Endpoints."
      notes: "No committed preset flips it -- these presets are internet-facing APIs and a worker. The private endpoint and DNS zone that make the private path real are separate resources."
    - control_id: restricted-ingress
      status: configurable
      field_path: site_config.ip_restrictions
      evidence:
        type: spec_default
        reference: "Empty, the app answers any source. Populated, rules filter by CIDR, service tag, or subnet in priority order, with ip_restriction_default_action deciding the unmatched remainder (unset deploys ALLOW, so rules act as a deny-list; DENY flips them into an allowlist). The SCM (Kudu) site has its own parallel rule set."
      notes: "No committed preset ships rules; preset 03 instead gates by identity (Easy Auth v2 returns 401 to unauthenticated requests before function code runs). The x_azure_fdid header filter locks the app to a specific Front Door profile so edge bypass is closed."
    - control_id: edge-protection
      status: not_applicable
      notes: "The app has no built-in WAF -- request inspection is composed IN FRONT (Azure Front Door or Application Gateway with a WAF policy), with an ip_restrictions rule on the AzureFrontDoor.Backend service tag plus the x_azure_fdid header filter so traffic cannot bypass the edge. What the spec does offer at its own front door is authentication, not inspection: auth_settings_v2 validates identity tokens platform-side before requests reach function code."
    - control_id: rbac
      status: not_applicable
      notes: "Management access is subscription/resource-group RBAC posture, not a component choice. The data plane is HTTP: callers are gated by function keys, or better by auth_settings_v2 (preset 03 requires an Entra token and returns 401 otherwise) -- an authentication layer, not an ARM RBAC control on this resource."
    - control_id: workload-identity
      status: configurable
      field_path: identity
      evidence:
        type: spec_default
        reference: "Unset, the app holds no Azure identity. The identity block attaches a system-assigned and/or user-assigned managed identity, and the spec threads it into deployment itself: storage_authentication_type SYSTEM_ASSIGNED_IDENTITY or USER_ASSIGNED_IDENTITY authenticates the app to its deployment container by identity, retiring the storage key."
      notes: "Preset 02-identity-secured-worker runs the full credential-free pattern -- system-assigned identity, identity-based deployment storage, basic-auth publishing disabled. Presets 01 and 03 use the storage-key path (STORAGE_ACCOUNT_CONNECTION_STRING), the pattern the identity path replaces."
    - control_id: no-legacy-auth
      status: configurable
      field_path: webdeploy_publish_basic_authentication_enabled
      evidence:
        type: spec_default
        reference: "The field's declared default is true (Azure's own default: username/password publishing over Web Deploy stays open). Set false to close the classic credential-based deployment path and force identity-based deployment."
      notes: "Preset 02 sets false. The sibling legacy credential is the deployment storage key: storage_authentication_type STORAGE_ACCOUNT_CONNECTION_STRING parks a static account key in the app's configuration, and the identity-based modes retire it (see workload-identity)."
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: "Control-plane operations land in the Azure Activity Log as subscription-level posture; the app offers no audit knob of its own. Request-level and execution-level visibility ride Application Insights (see monitoring-integration)."
    - control_id: monitoring-integration
      status: configurable
      field_path: application_insights_connection_string
      evidence:
        type: spec_default
        reference: "Unset, no APM wiring exists -- executions are visible only through platform metrics. Set, Azure configures the app to send requests, dependencies, exceptions, and traces to the referenced Application Insights resource (the recommended monitoring path; the legacy instrumentation key lives in site_config for backward compatibility)."
      notes: "Preset 03-entra-protected-api wires it from an AzureApplicationInsights output. Health probing is separate: site_config.health_check_path plus health_check_eviction_time_in_min (presets 01 and 03) evicts unhealthy instances from the load balancer."
    - control_id: backup-recovery
      status: not_applicable
      notes: "Stateless serverless compute -- the app definition recreates losslessly from infrastructure-as-code, and the code package survives independently in the deployment storage container. Durable state lives where functions write it; back up those components. function_app_name is ForceNew and globally unique: recreation under a new name changes the default hostname."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: "No backups exist to retain (see backup-recovery). site_config.app_service_logs.retention_period_days is file-system LOG retention, not a backup dial."
    - control_id: multi-zone-ha
      status: not_applicable
      notes: "Zone redundancy for Flex Consumption is a property of the hosting plan, decided when the FC1 plan is created (Microsoft's reliability guidance: the plan must be created zone-redundant in a supporting region) -- the app inherits it with no zone knob in this spec. Within a zone-redundant plan, Azure spreads instances across zones automatically."
    - control_id: deletion-protection
      status: not_applicable
      notes: "Neither Microsoft.Web/sites nor this spec offers a deletion-protection flag; Azure resource locks are subscription-side governance outside the manifest. Deleting the app releases its globally-unique hostname; the code package survives in the deployment storage container."
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Serverless platform -- Microsoft owns and patches the hosts, OS, and language runtime images beneath every instance; runtime_version pins the major line and Microsoft patches within it. No customer-visible patch surface exists."
      notes: "The function code's own dependencies (npm, pip, NuGet packages inside the deployment package) remain the user's build responsibility."
