apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurefunctionappflexconsumption
spec:
  # PROVEN both engines 2026-08-14. TWO scenarios: `minimal`
  # (connection-string deployment-storage auth on a scenario-local FC1
  # plan + storage account + blob container in centralus -- FC1 is
  # available there; outputs 8/10, identity fields empty as designed)
  # and `identity-auth` (system-assigned storage auth, no key, basic-auth
  # publishing closed -- outputs 10/10). ARM does NOT validate storage
  # access at create in identity mode: the app object creates cleanly
  # without the day-2 Blob Data Contributor grant (that grant is still
  # required before a package deploy). Terraform import RT zero-change
  # on both scenarios, including the write-only class (storage key,
  # zip_deploy_file, app_service_logs). Always-ready pool billed only
  # for lane minutes; both engines ~8-10 min/scenario, effectively $0.
  # Offline-proven with reasons: user-assigned storage-auth, auth v2
  # IdP arms, zip_deploy_file, VNet integration.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
