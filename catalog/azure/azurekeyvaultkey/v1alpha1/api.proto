syntax = "proto3";

package dev.planton.azure.azurekeyvaultkey.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurekeyvaultkey/v1alpha1/outputs.proto";
import "catalog/azure/azurekeyvaultkey/v1alpha1/spec.proto";
import "shared/metadata.proto";

// azure-key-vault-key
message AzureKeyVaultKey {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureKeyVaultKey'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AzureKeyVaultKeySpec spec = 4 [(buf.validate.field).required = true];

  //status
  AzureKeyVaultKeyStatus status = 5;
}

// azure-key-vault-key status
message AzureKeyVaultKeyStatus {
  //outputs
  //  azure-key-vault-key outputs
  AzureKeyVaultKeyOutputs outputs = 1;
}
