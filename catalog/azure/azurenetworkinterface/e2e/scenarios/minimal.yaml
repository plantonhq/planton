# Minimal AzureNetworkInterface scenario: a dynamic IPv4 NIC in the
# fixture subnet with accelerated networking on and a NIC-level NSG
# attached.
#
# The subnet reference resolves against the registry prerequisite chain's
# captured outputs (resource group -> virtual network -> subnet). The NSG
# is a scenario-declared extra fixture (see the annotation) -- NIC-level
# filtering is an OPTIONAL seam, so the NSG kind must never pollute the
# registry prerequisites; its association resource is the seam under
# test. Accelerated networking exercises the SR-IOV flag (valid on a
# detached NIC). User tags exercise the merge-over-metadata-tags path.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureNetworkInterface
metadata:
  name: planton-oss-e2e-azurenetworkinterface-smoke
  id: planton-oss-e2e-azurenetworkinterface-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurenetworkinterface
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AzureNetworkSecurityGroup"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-nic-smoke
  ipConfigurations:
    - name: primary
      subnetId:
        valueFrom:
          name: planton-oss-e2e-azure-fixture-subnet
  acceleratedNetworkingEnabled: true
  networkSecurityGroupId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-nsg
  tags:
    e2e-suite: azure
    purpose: smoke
