apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurenetworkinterface
spec:
  # The harness deploys the fixture chain (resource group -> virtual
  # network -> subnet, via the registry prerequisites), creates a NIC with
  # a dynamic IPv4 configuration in the fixture subnet and accelerated
  # networking on, verifies it via the ARM API (generic GetByID on the
  # NIC's ARM id), destroys it, and verifies it is gone -- on both
  # provisioners. A detached NIC is free; the run holds it for minutes.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
