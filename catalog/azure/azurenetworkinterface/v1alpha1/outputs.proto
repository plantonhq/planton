syntax = "proto3";

package dev.planton.azure.azurenetworkinterface.v1alpha1;

// **AzureNetworkInterfaceOutputs** captures the outputs of
// provisioning an Azure Network Interface.
message AzureNetworkInterfaceOutputs {
  // The Azure Resource Manager ID of the NIC. This is the primary output:
  // AzureVirtualMachine's network_interface_ids references it to attach
  // the NIC to a VM.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/networkInterfaces/{name}
  string network_interface_id = 1;

  // The name of the NIC.
  string network_interface_name = 2;

  // The primary configuration's private IP address -- what backends,
  // firewall rules, and DNS records key on.
  string private_ip_address = 3;

  // The private IP addresses of ALL configurations, in configuration
  // order (multi-IP and dual-stack NICs carry more than one).
  repeated string private_ip_addresses = 4;

  // The NIC's MAC address, populated once the NIC is attached to a
  // running virtual machine (empty until then) -- what license servers
  // and appliance registrations key on.
  string mac_address = 5;

  // The DNS suffix for the virtual network's internal name resolution
  // (the {vnet-internal-suffix} completing internal_dns_name_label into a
  // resolvable FQDN).
  string internal_domain_name_suffix = 6;
}
