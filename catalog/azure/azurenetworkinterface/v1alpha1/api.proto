syntax = "proto3";

package dev.planton.azure.azurenetworkinterface.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurenetworkinterface/v1alpha1/outputs.proto";
import "catalog/azure/azurenetworkinterface/v1alpha1/spec.proto";
import "shared/metadata.proto";

// azure-network-interface
message AzureNetworkInterface {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureNetworkInterface'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AzureNetworkInterfaceSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AzureNetworkInterfaceStatus status = 5;
}

// azure-network-interface status
message AzureNetworkInterfaceStatus {
  //outputs
  //  azure-network-interface outputs
  AzureNetworkInterfaceOutputs outputs = 1;
}
