syntax = "proto3";

package dev.planton.azure.azurecosmosdbsqlroledefinition.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurecosmosdbsqlroledefinition/v1alpha1/outputs.proto";
import "catalog/azure/azurecosmosdbsqlroledefinition/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureCosmosdbSqlRoleDefinition is the top-level API resource for a
// Cosmos DB SQL (NoSQL) API role definition inside a Cosmos DB account
// (referenced via cosmosdb_account_id) -- a named bundle of data-plane
// permissions that AzureCosmosdbSqlRoleAssignment resources bind to
// Microsoft Entra principals.
message AzureCosmosdbSqlRoleDefinition {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureCosmosdbSqlRoleDefinition'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureCosmosdbSqlRoleDefinitionSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureCosmosdbSqlRoleDefinitionStatus status = 5;
}

// AzureCosmosdbSqlRoleDefinitionStatus holds the deployment status and outputs.
message AzureCosmosdbSqlRoleDefinitionStatus {
  // outputs
  AzureCosmosdbSqlRoleDefinitionOutputs outputs = 1;
}
