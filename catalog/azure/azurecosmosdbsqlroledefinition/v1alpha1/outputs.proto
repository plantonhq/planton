syntax = "proto3";

package dev.planton.azure.azurecosmosdbsqlroledefinition.v1alpha1;

// **AzureCosmosdbSqlRoleDefinitionOutputs** captures the outputs of
// provisioning a Cosmos DB SQL role definition. The fully-scoped ARM
// resource ID is the definition's identity for composition -- it is
// exactly what a Cosmos DB SQL role assignment binds -- and the
// GUID/name coordinates are exported so downstream automation can reason
// about the role without re-reading the spec.
message AzureCosmosdbSqlRoleDefinitionOutputs {
  // The fully-scoped Azure Resource Manager ID of the role definition.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.DocumentDB/databaseAccounts/{account}/sqlRoleDefinitions/{guid}
  // This is the value an AzureCosmosdbSqlRoleAssignment's
  // role_definition_id field consumes -- reference it to grant this role
  // to a principal.
  string role_definition_id = 1;

  // The definition's GUID resource name -- either the pinned
  // spec.role_definition_id or the GUID generated at deploy time.
  string role_definition_guid = 2;

  // The role's display name as deployed (what the account's data-plane
  // RBAC listings show).
  string role_name = 3;

  // The name of the Cosmos DB account the definition lives in, parsed
  // from the resolved account ID -- saves consumers a second reference
  // when they need the account/definition pair.
  string cosmosdb_account_name = 4;
}
