apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurecosmosdbsqlroledefinition
spec:
  # The harness deploys the fixture resource group and a scenario-local
  # Cosmos SQL account (declared via e2e-prerequisites -- account
  # names are globally unique), creates a custom read-only role
  # definition with a generated GUID, verifies it via the ARM API,
  # destroys it, and verifies it is gone -- on both provisioners. The
  # scenario-local account pins westus3 (eastus rejects new Cosmos
  # accounts under zonal-capacity pressure -- see e2e/README.md); the
  # full scenario runs ~14 min per engine, dominated by the account
  # fixture's provision + drain.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 75
