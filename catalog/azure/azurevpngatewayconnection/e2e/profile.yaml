apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurevpngatewayconnection
spec:
  # Proven live on both engines (full lifecycle + blind single-id
  # import round-trip by the gateway-child ID, zero-change plan). The
  # flagship held: the tunnel's map-keyed cross-kind reference
  # (link_ids.primary-isp) resolved through the family's longest chain
  # on both engines. Measured: the connection itself deploys in ~3m and
  # destroys in ~3m; the chain pays the WHOLE family inside
  # DEPENDENCIES-UP (~53-57m: hub ~18m + gateway ~36m + site seconds),
  # lane total ~84-89m per engine. The tunnel provisions but never
  # reaches Connected (no real branch device behind the fixture site's
  # TEST-NET endpoint) -- the verifier asserts ARM state, never
  # tunnel-up. Proven caveat: an omitted shared_key gets an
  # ARM-generated value that reads back EMPTY -- recorded on the spec
  # field and in the GUIDE.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 180
