syntax = "proto3";

package dev.planton.azure.azurevpngatewayconnection.v1alpha1;

// **AzureVpnGatewayConnectionOutputs** captures the outputs of
// provisioning a VPN gateway connection.
message AzureVpnGatewayConnectionOutputs {
  // The Azure Resource Manager ID of the connection (a child of the
  // gateway).
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/vpnGateways/{gateway}/vpnConnections/{name}
  string connection_id = 1;

  // The name of the connection.
  string connection_name = 2;
}
