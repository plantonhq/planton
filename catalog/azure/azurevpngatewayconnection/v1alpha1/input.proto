syntax = "proto3";

package dev.planton.azure.azurevpngatewayconnection.v1alpha1;

import "catalog/azure/azurevpngatewayconnection/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureVpnGatewayConnectionIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureVpnGatewayConnectionIacInput {
  // The VPN gateway connection resource to deploy.
  AzureVpnGatewayConnection target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
