# Minimal AzureManagedDisk scenario: an empty zonal Standard SSD data
# disk.
#
# The resource-group reference resolves against the registry
# prerequisite's captured outputs. EMPTY + diskSizeGb exercises the
# create-option validation matrix's most common path; the zone pin
# exercises zonal placement; user tags exercise the
# merge-over-metadata-tags path. The disk stays detached -- the VM-side
# attachment seam is proven by the virtual machine's composed scenario.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureManagedDisk
metadata:
  name: planton-oss-e2e-azuremanageddisk-smoke
  id: planton-oss-e2e-azuremanageddisk-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuremanageddisk
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-disk-smoke
  storageAccountType: STANDARD_SSD_LRS
  createOption: EMPTY
  diskSizeGb: 16
  zone: "1"
  tags:
    e2e-suite: azure
    purpose: smoke
