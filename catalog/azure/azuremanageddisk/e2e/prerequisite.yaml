# AzureManagedDisk install profile used as a fixture by scenarios that
# prove the VM-side attach seam (declared via the
# planton.dev/e2e-prerequisites annotation -- attaching a data disk
# is OPTIONAL for a virtual machine, so the disk kind is never a registry
# prerequisite). The harness deploys this document (via the disk's Pulumi
# module) after the fixture resource group and captures its outputs --
# disk_id in particular -- for the attaching scenario's reference to
# resolve against. Zone-pinned to "1" to match the VM fixtures (a zonal
# disk only attaches to VMs in the same zone).
apiVersion: azure.planton.dev/v1alpha1
kind: AzureManagedDisk
metadata:
  name: planton-oss-e2e-azure-fixture-disk
  id: planton-oss-e2e-azure-fixture-disk
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuremanageddisk
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-azure-fixture-disk
  storageAccountType: STANDARD_SSD_LRS
  createOption: EMPTY
  diskSizeGb: 16
  zone: "1"
