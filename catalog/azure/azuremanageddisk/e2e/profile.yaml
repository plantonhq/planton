apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azuremanageddisk
spec:
  # The harness deploys the fixture resource group (registry
  # prerequisite), creates a small zonal Standard SSD data disk, verifies
  # it via the ARM API (generic GetByID on the disk's ARM id), destroys
  # it, and verifies it is gone -- on both provisioners. A detached 16 GiB
  # disk bills cents per month; the run holds it for minutes.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
