syntax = "proto3";

package dev.planton.azure.azuremanageddisk.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azuremanageddisk/v1alpha1/outputs.proto";
import "catalog/azure/azuremanageddisk/v1alpha1/spec.proto";
import "shared/metadata.proto";

// azure-managed-disk
message AzureManagedDisk {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureManagedDisk'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AzureManagedDiskSpec spec = 4 [(buf.validate.field).required = true];

  //status
  AzureManagedDiskStatus status = 5;
}

// azure-managed-disk status
message AzureManagedDiskStatus {
  //outputs
  //  azure-managed-disk outputs
  AzureManagedDiskOutputs outputs = 1;
}
