# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. The filesystem itself is free to hold --
# Azure's Data Lake Storage price list has no meter for the filesystem
# object; data bills capacity (at the same rates as blob storage, plus
# hierarchical-namespace metadata) and every API call bills the Data Lake
# operation meters, all on the parent storage account at the ACCOUNT's tier
# and redundancy. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azurestoragedatalakegen2filesystem
spec:
  billing_model: usage_based
  cost_drivers:
    - field_path: storage_account_id
      sku_meter: data lake capacity
      pricing_unit: GB-month
      impact: "Every GB landing in this filesystem bills the referenced account's capacity meter -- the same per-GB rates as flat-namespace blob storage, keyed by the ACCOUNT's access tier and redundancy, with the hierarchical namespace adding billed METADATA capacity for the directory and folder structure (Microsoft's own pricing-page statement)."
    - field_path: storage_account_id
      sku_meter: data lake write operations
      pricing_unit: per 10,000 operations (every 4 MB)
      impact: "Data Lake writes (AppendFile, FlushFile, CreatePath, rename-file calls) bill per 10,000 -- and unlike flat blob operations they are SIZE-SCALED, metered in 4 MB increments, so one 16 MB append counts as four billable operations. Analytics engines writing large files pay per volume, not per call."
    - field_path: storage_account_id
      sku_meter: data lake read operations
      pricing_unit: per 10,000 operations (every 4 MB)
      impact: "Data Lake reads (ReadFile, file listings) bill per 10,000 in the same 4 MB increments -- a full-table scan by a query engine bills reads proportional to the bytes touched, which is why partition pruning and columnar formats are cost levers, not just performance ones."
    - field_path: default_encryption_scope
      sku_meter: named encryption scopes
      pricing_unit: scope-months
      impact: "Binding a scope adds nothing to the filesystem's bill, but the REFERENCED AzureStorageEncryptionScope bills a flat monthly fee on its own component from the moment it is enabled, and a Key Vault-keyed scope adds per-transaction wrap/unwrap operations on the key's vault -- the Regulated Zone preset's committed spend lives there."
  estimate_exclusions:
    - "data lake capacity bills per GB-month on the account at its tier-and-redundancy rate, and the hierarchical namespace additionally bills metadata capacity for the folder structure -- volumes no manifest can know"
    - "write operations and read operations each bill per 10,000 in 4 MB increments (size-scaled); iterative read operations (List Filesystem, List Path) bill per 10,000; iterative write operations (directory and path renames) bill per 100; all-other operations bill per 10,000 with delete free"
    - "cool, cold, and archive tiers add per-GB data retrieval (archive adds high-priority read and retrieval meters), and early-deletion penalties apply below each tier's minimum retention"
    - "query acceleration bills per GB of data scanned plus per GB of data returned when applications use it"
    - "geo-redundant accounts add geo-replication data transfer per GB, and reads served outside Azure add standard bandwidth egress"
    - "the named encryption scope's monthly fee bills on the referenced AzureStorageEncryptionScope component, not here"
    - "root-path owner, group, and ACL entries are free posture -- Azure has no meter for POSIX ACLs; setting them at deploy time bills a handful of ordinary operations"
  notes: "The filesystem is a free zone boundary over the account's data-lake meters: capacity for what the lake holds (plus metadata for its shape), size-scaled operations for what jobs touch. The 4 MB operation increments are the economics that separate ADLS from flat blob -- costs track bytes processed, so file sizing (fewer, larger files), partition pruning, and rename discipline (renames bill as iterative writes per 100) are real cost levers. All rates key off the parent account's tier and redundancy, chosen on the AzureStorageAccount kind; deleting the filesystem deletes its data and, with it, the capacity charge."
