# Minimal AzureStorageDataLakeGen2Filesystem scenario: a data-lake zone
# filesystem on the scenario-local HNS fixture account, proving the
# root-path POSIX ACL (unqualified user/group/other entries plus a
# DEFAULT-scope inheritance entry), the properties map, and the
# data-plane create/destroy path end to end.
#
# The account reference resolves against the extra fixture's captured
# outputs through the field's default kind (fixture RG -> scenario-local
# HNS account -> this filesystem). The encryption-scope seam is not
# exercised live: the scope kind's own suite proves it, and its shape
# here is identical to the container kind's live-proven scope FK.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureStorageDataLakeGen2Filesystem
metadata:
  name: planton-oss-e2e-azurestoragedatalakegen2filesystem-smoke
  id: planton-oss-e2e-azurestoragedatalakegen2filesystem-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurestoragedatalakegen2filesystem
  annotations:
    planton.dev/e2e: "true"
    # Scenario-local account (minimal-account.yaml) instead of a registry
    # prerequisite: storage-account names are globally unique and
    # sequential subtests that destroy and recreate the same name hang on
    # recreate.
    planton.dev/e2e-prerequisites: "catalog/azure/azurestoragedatalakegen2filesystem/e2e/minimal-account.yaml"
  tags:
    - planton-e2e
spec:
  storageAccountId:
    valueFrom:
      name: planton-oss-e2e-adlsfs-fixture-account
  filesystemName: raw-zone
  aces:
    - type: USER
      permissions: rwx
    - type: GROUP
      permissions: r-x
    - type: OTHER
      permissions: "---"
    - scope: DEFAULT
      type: OTHER
      permissions: "---"
  properties:
    environment: ZTJl
