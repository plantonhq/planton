apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurestoragedatalakegen2filesystem
spec:
  # The harness deploys the fixture resource group and a SCENARIO-LOCAL
  # HNS-enabled storage account (declared via the e2e-prerequisites
  # annotation -- account names are globally unique and Azure briefly
  # holds a just-deleted name, so the account is never a shared
  # recreate-per-scenario registry prerequisite), creates the filesystem
  # with a root POSIX ACL through the account's dfs data plane, verifies
  # it via the ARM blob-container proxy (filesystems surface as
  # containers in ARM), destroys it, and verifies it is gone.
  #
  # The default_encryption_scope seam is excluded from live runs: its
  # shape is identical to the container kind's live-proven scope FK, and
  # exercising it live would add an encryption-scope fixture for a
  # pairing the spec tests, tofu plan, and parity audit fully prove.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
