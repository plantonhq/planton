# Minimal AzureServiceBusNamespace scenario: a STANDARD namespace in the
# fixture resource group with user tags -- proving the tier mapping, the
# root SAS credential outputs, and the tag merge on both engines.
# Premium seams (capacity/partitions/CMK/network rules) are
# offline-covered; see the E2E profile.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureServiceBusNamespace
metadata:
  name: planton-oss-e2e-azureservicebusnamespace-smoke
  id: planton-oss-e2e-azureservicebusnamespace-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureservicebusnamespace
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  namespaceName: pltn-oss-e2e-sbns-smoke
  sku: STANDARD
  tags:
    purpose: e2e-smoke
