apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azureservicebusnamespace
spec:
  # The scenario deploys the fixture resource group (registry
  # prerequisite), creates a STANDARD namespace with user tags, verifies
  # it via the ARM API, destroys it, and verifies it is gone. Standard
  # namespaces provision in ~1-2 minutes. Premium-gated seams (capacity,
  # partitions, CMK, network rules) are covered by the offline gate
  # (spec CELs + full tofu plan renders + parity audit) -- a Premium
  # lane would add a Key Vault fixture chain and Premium provisioning
  # time for seams the plans already render.
  #
  # Namespace names are globally unique with a post-delete hold --
  # scenarios carry distinct names, never reused across sequential runs.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
