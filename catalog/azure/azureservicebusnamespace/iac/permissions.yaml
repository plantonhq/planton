# Least-privilege permissions the IaC runner's Azure principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: azureservicebusnamespace
spec:
  azure:
    groups:
      - purpose: ManageNamespace
        actions:
          - Microsoft.ServiceBus/namespaces/read
          - Microsoft.ServiceBus/namespaces/write
          - Microsoft.ServiceBus/namespaces/Delete
        provenance: derived
        notes: Covers azurerm_servicebus_namespace (and the Pulumi module's servicebus.Namespace) -- create, read/refresh, in-place updates (sku within BASIC/STANDARD, capacity, local auth, public network access, identity, tags), and destroy. The delete action's capital D is the provider operation's own published spelling. The customer_managed_key block rides the namespace payload; no deployer permission on the referenced Key Vault is claimed because the key is unwrapped by the namespace's attached user-assigned identity, which must hold wrap/unwrap on the vault (Key Vault Crypto Service Encryption User) -- a consumer-side grant composed via AzureRoleAssignment, not a runner need.
      - purpose: ConfigureNetworkRuleSets
        actions:
          - Microsoft.ServiceBus/namespaces/networkrulesets/read
          - Microsoft.ServiceBus/namespaces/networkrulesets/write
        provenance: derived
        notes: Required only when network_rule_set is declared -- the provider folds the firewall into the namespace resource but writes it as its own ARM child (the namespace's default rule set) in a separate operation after the namespace create, and reads it back on refresh. Removing the block rewrites an open rule set; the runner never needs the delete action.
      - purpose: ReadRootSasCredentials
        actions:
          - Microsoft.ServiceBus/namespaces/authorizationRules/read
          - Microsoft.ServiceBus/namespaces/authorizationRules/listkeys/action
        provenance: derived
        notes: Both modules surface the root rule's (RootManageSharedAccessKey) connection strings and keys as this kind's sensitive outputs -- the provider reads the rule and lists its keys on every refresh. With a keyless posture (local_auth_enabled false) the keys stop being usable credentials but the provider still reads them.
      - purpose: AttachUserAssignedIdentities
        actions:
          - Microsoft.ManagedIdentity/userAssignedIdentities/assign/action
        provenance: derived
        notes: Required only when identity.user_assigned_identity_ids attaches user-assigned identities (USER_ASSIGNED / SYSTEM_AND_USER_ASSIGNED -- the CMK arrangement always does). A SERVICE-side need -- the modules only carry the resolved identity IDs in the namespace payload, and Azure checks assign on each referenced identity's own scope when the namespace write attaches it.
      - purpose: AdmitServiceEndpointSubnets
        actions:
          - Microsoft.Network/virtualNetworks/subnets/joinViaServiceEndpoint/action
        provenance: derived
        notes: Required only when network_rule_set.network_rules admits subnets. A SERVICE-side need -- the modules only carry the resolved subnet IDs in the rule-set payload, and Azure checks joinViaServiceEndpoint on each admitted subnet's own scope when the rule is written.
