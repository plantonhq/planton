syntax = "proto3";

package dev.planton.azure.azureservicebusnamespace.v1alpha1;

import "catalog/azure/azureservicebusnamespace/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureServiceBusNamespaceIacInput is the input to the IaC module.
