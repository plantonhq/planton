syntax = "proto3";

package dev.planton.azure.azurefederatedidentitycredential.v1alpha1;

// **AzureFederatedIdentityCredentialOutputs** captures the outputs of
// provisioning a federated identity credential. The ARM resource ID is the
// credential's identity for automation; the trust coordinates (issuer,
// subject, audience) are exported as deployed so downstream tooling -- CI
// configuration generators, cluster onboarding jobs -- can wire the external
// side of the trust without re-reading the spec.
message AzureFederatedIdentityCredentialOutputs {
  // The full Azure Resource Manager ID of the federated identity credential.
  // Format: {identity-id}/federatedIdentityCredentials/{name}
  // where {identity-id} is the parent user-assigned identity's ARM ID.
  string federated_identity_credential_id = 1;

  // The credential's ARM resource name under its parent identity, as
  // deployed (what the portal lists in the identity's "Federated
  // credentials" tab).
  string name = 2;

  // The ARM ID of the parent user-assigned identity this credential is
  // written on -- the identity the trusted external workload acts as.
  string user_assigned_identity_id = 3;

  // The OIDC issuer URL the trust matches against the incoming token's
  // `iss` claim, as deployed.
  string issuer = 4;

  // The workload identifier the trust matches against the incoming token's
  // `sub` claim, as deployed.
  string subject = 5;

  // The audience the trust matches against the incoming token's `aud`
  // claim, as deployed -- "api://AzureADTokenExchange" unless overridden.
  string audience = 6;
}
