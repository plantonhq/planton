# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azurefederatedidentitycredential
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A federated credential is a trust rule held by Azure AD; it stores no customer data at rest.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to encrypt (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: The credential carries no traffic of its own; the token exchange it authorizes happens against Azure AD's TLS-only endpoints, which is platform posture, not a component choice.
    - control_id: no-public-access
      status: not_applicable
      notes: A trust rule has no network endpoint -- nothing exists to reach from the internet.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network surface to restrict (see no-public-access).
    - control_id: edge-protection
      status: not_applicable
      notes: No inbound request path exists to filter.
    - control_id: rbac
      status: not_applicable
      notes: The credential conveys no permissions -- it only authenticates the external workload AS the identity. What that identity may do is granted separately through AzureRoleAssignment resources, the RBAC kind with its own posture.
    - control_id: workload-identity
      status: enforced_by_default
      evidence:
        type: spec_default
        reference: The resource exists solely to replace stored secrets with keyless federation. The required issuer, subject, and audience fields encode the three-way match Azure AD evaluates on every token exchange -- an external workload's short-lived OIDC token is exchanged for the identity's credentials only when its iss, sub, and aud claims equal these values exactly, and audience defaults to api://AzureADTokenExchange, the value Azure AD's token-exchange endpoint expects. No client secret is created anywhere in the flow.
      notes: The trust is only as narrow as the subject string -- the spec documents preferring the most specific form the issuer offers (one credential per branch, environment, or service account; no wildcards).
    - control_id: no-legacy-auth
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A federated credential admits exactly one authentication mechanism -- the OIDC token exchange against its issuer/subject/audience triple. No password, secret, or certificate variant of a federated credential exists, so no weaker path is available to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Lifecycle changes to the credential land in the Azure Activity Log and the token exchanges it authorizes in Azure AD's sign-in logs, both platform-level posture; no logging toggle exists on this resource.
    - control_id: monitoring-integration
      status: not_applicable
      notes: A trust rule emits no metrics or runtime signals.
    - control_id: backup-recovery
      status: not_applicable
      notes: Stateless trust configuration -- nothing to back up; the manifest recreates the credential declaratively on its parent identity.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The credential has no runtime footprint with a zonal failure mode; Azure AD evaluates the trust rule as Microsoft-operated platform infrastructure.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Azure nor this spec offers a deletion-protection flag for a federated credential (Azure resource locks are subscription-side governance outside the manifest); deleting one revokes the external workload's path to the identity and is recreated declaratively.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The token-exchange infrastructure that evaluates federated credentials is Microsoft-operated Azure AD; no customer-visible patch surface exists.
