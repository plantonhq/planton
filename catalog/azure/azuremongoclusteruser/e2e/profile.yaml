apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azuremongoclusteruser
spec:
  # PROVEN live on both engines (dual-engine six-phase runner + blind
  # import round-trip). ONE scenario runs: `minimal` (the fixture
  # identity's service principal granted root on an Entra-enabled M10
  # fixture cluster -- the three-kind reference chain proven live:
  # registry chains the cluster through this kind's consumer-scoped
  # override, the scenario annotation chains the identity, and the
  # grant bound the principal first-try). The override exists because
  # ARM refuses MicrosoftEntraID auth on the Free tier the cluster
  # kind's own smoke uses. Measured: grant deploy ~1m10-30s, destroy
  # ~20-30s; the ~8-9 min M10 cluster chain dominates the ~15-minute
  # lane. The blind import by the cluster-scoped id
  # ({cluster_id}/users/{object_id} -- the ARM name IS the principal's
  # object id) round-tripped zero-change with zero tolerances. The
  # grant is free; the timeout budgets the M10 cluster chain
  # (~cents), not the grant.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 90
