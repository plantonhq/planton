# Minimal AzureMongoClusterUser scenario: the fixture identity's
# service principal granted root on the admin database of an
# Entra-enabled fixture cluster. The registry prerequisite chains the
# cluster through THIS kind's consumer-scoped override
# (e2e/prerequisites/azuremongocluster.yaml -- M10 with
# MicrosoftEntraID, because ARM refuses Entra auth on the Free tier
# the cluster kind's own smoke uses); the fixture identity is
# declared here, not on the registry -- a grant does not universally
# need a managed identity, only THIS scenario's principal does.
# Proves the three-kind reference chain live: cluster id + principal
# id resolving into the grant. The grant itself is free; the lane
# pays the M10 cluster chain (~cents).
apiVersion: azure.planton.dev/v1alpha1
kind: AzureMongoClusterUser
metadata:
  name: planton-oss-e2e-azuremongoclusteruser-smoke
  id: planton-oss-e2e-azuremongoclusteruser-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuremongoclusteruser
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AzureUserAssignedIdentity"
  tags:
    - planton-e2e
spec:
  mongoClusterId:
    valueFrom:
      name: planton-oss-e2e-azuremongocluster-smoke
  objectId:
    valueFrom:
      kind: AzureUserAssignedIdentity
      name: planton-oss-e2e-azure-fixture-identity
      fieldPath: status.outputs.principal_id
  principalType: servicePrincipal
  roles:
    - database: admin
      role: root
