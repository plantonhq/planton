apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: azuremongoclusteruser
spec:
  # The grant imports by its cluster-scoped ARM resource ID
  # ({cluster_id}/users/{object_id} -- the ARM name IS the principal's
  # object id).
  values:
    - name: mongo_cluster_user_id
      derivations:
        - from_output: mongo_cluster_user_id
      where_to_find: >-
        Compose {cluster_id}/users/{object_id} from the cluster's ARM
        ID and the granted principal's object id, or use the
        component's own mongo_cluster_user_id output.
