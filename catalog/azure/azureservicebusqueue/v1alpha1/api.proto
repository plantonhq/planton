syntax = "proto3";

package dev.planton.azure.azureservicebusqueue.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureservicebusqueue/v1alpha1/outputs.proto";
import "catalog/azure/azureservicebusqueue/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureServiceBusQueue is the top-level API resource for a queue inside an
// Azure Service Bus namespace (referenced via namespace_id) -- reliable
// point-to-point messaging with FIFO delivery, sessions, duplicate
// detection, and a built-in dead-letter sub-queue. The queue's ARM ID is a
// data-plane RBAC scope, and queue-scoped SAS credentials are minted with
// AzureServiceBusAuthorizationRule.
message AzureServiceBusQueue {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureServiceBusQueue'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureServiceBusQueueSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureServiceBusQueueStatus status = 5;
}

// AzureServiceBusQueueStatus holds the deployment status and outputs.
message AzureServiceBusQueueStatus {
  // outputs
  AzureServiceBusQueueOutputs outputs = 1;
}
