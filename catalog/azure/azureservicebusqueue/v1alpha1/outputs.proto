syntax = "proto3";

package dev.planton.azure.azureservicebusqueue.v1alpha1;

// **AzureServiceBusQueueOutputs** captures the outputs of provisioning
// a Service Bus queue.
//
// No connection string here on purpose: credentials are minted by
// AzureServiceBusAuthorizationRule (namespace- or queue-scoped) or granted
// keyless via Entra data-plane roles on queue_id. SDKs address the queue
// by the namespace endpoint plus queue_name.
message AzureServiceBusQueueOutputs {
  // The Azure Resource Manager ID of the queue. The scope for queue-level
  // data-plane role assignments (Azure Service Bus Data Receiver/Sender)
  // and the parent reference for queue-scoped SAS rules.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.ServiceBus/namespaces/{ns}/queues/{name}
  string queue_id = 1;

  // The queue's name -- what SDKs, connection strings, and function
  // bindings reference within the namespace.
  string queue_name = 2;

  // The name of the Service Bus namespace the queue lives in, parsed from
  // the resolved namespace ID -- saves consumers a second reference when
  // they need the namespace/queue pair.
  string namespace_name = 3;
}
