# Minimal AzureServiceBusQueue scenario: a session-enabled queue with
# duplicate detection and dead-letter dials on a scenario-local
# namespace -- proving the parent-by-ARM-id reference, the ForceNew
# trio, the lifecycle dials, and the namespace-name output parse on
# both engines.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureServiceBusQueue
metadata:
  name: planton-oss-e2e-azureservicebusqueue-smoke
  id: planton-oss-e2e-azureservicebusqueue-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureservicebusqueue
  annotations:
    planton.dev/e2e: "true"
    # Scenario-local namespace (fixture-namespace.yaml) instead of a
    # registry prerequisite: namespace names are globally unique and
    # sequential subtests that destroy and recreate the same name hang
    # on the post-delete hold.
    planton.dev/e2e-prerequisites: "catalog/azure/azureservicebusqueue/e2e/fixture-namespace.yaml"
  tags:
    - planton-e2e
spec:
  namespaceId:
    valueFrom:
      name: planton-oss-e2e-sbqueue-fixture-namespace
  queueName: e2e-orders
  maxSizeInMegabytes: 2048
  requiresDuplicateDetection: true
  duplicateDetectionHistoryTimeWindow: PT30S
  requiresSession: true
  lockDuration: PT2M
  maxDeliveryCount: 5
  deadLetteringOnMessageExpiration: true
  defaultMessageTtl: P7D
