# Dedicated AzureServiceBusNamespace for the queue scenario only.
# Namespace names are globally unique in Azure with a post-delete name
# hold, so each scenario that creates and destroys its own parent
# namespace carries a distinct name -- reusing a name across sequential
# subtests hits the hold and the recreate hangs.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureServiceBusNamespace
metadata:
  name: planton-oss-e2e-sbqueue-fixture-namespace
  id: planton-oss-e2e-sbqueue-fixture-namespace
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureservicebusnamespace
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  namespaceName: pltn-oss-e2e-sbque-fx
  sku: STANDARD
