# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azureservicebusqueue
spec:
  billing_model: free
  free_tier: The queue itself -- its name, size and session dials, dead-lettering, forwarding chains, and gate status -- never bills. A queue is an entity inside a Service Bus NAMESPACE, and Azure meters everything at the namespace level; creating more queues inside a namespace adds nothing to the bill, and Service Bus explicitly does not charge for the storage messages occupy (max_size_in_megabytes is a quota, not a meter).
  notes: "The real spend lives on the parent AzureServiceBusNamespace, a separate catalog kind: per-million operations on BASIC, the hourly base charge plus operations and brokered connections on STANDARD, or the flat daily messaging-unit rate on PREMIUM. Every send, receive, peek, and lock renewal against this queue is one of those namespace-metered operations on the shared tiers; partition and size dials only consume capacity the namespace already pays for."
