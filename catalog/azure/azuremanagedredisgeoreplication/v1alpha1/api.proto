syntax = "proto3";

package dev.planton.azure.azuremanagedredisgeoreplication.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azuremanagedredisgeoreplication/v1alpha1/outputs.proto";
import "catalog/azure/azuremanagedredisgeoreplication/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureManagedRedisGeoReplication is the top-level API resource for an
// Azure Managed Redis active geo-replication group: it links Managed
// Redis instances (referenced by ARM ID) whose default databases declare
// the same geo-replication group name into a multi-primary replica set --
// every member accepts writes and Azure merges the datasets with
// conflict-free semantics. Deleting the resource unlinks the members;
// removing a member from the linked list evacuates just that region.
message AzureManagedRedisGeoReplication {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureManagedRedisGeoReplication'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureManagedRedisGeoReplicationSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureManagedRedisGeoReplicationStatus status = 5;
}

// AzureManagedRedisGeoReplicationStatus holds the deployment status and
// outputs.
message AzureManagedRedisGeoReplicationStatus {
  // outputs
  AzureManagedRedisGeoReplicationOutputs outputs = 1;
}
