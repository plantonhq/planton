# The EAST member for the geo-replication scenario: BALANCED_B3 (the
# geo-replication SKU floor) declaring the shared group name. Both
# members must carry the SAME group name, have no persistence, and use
# only geo-compatible modules -- the group resource links them.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureManagedRedis
metadata:
  name: planton-oss-e2e-amrgeo-fixture-east
  id: planton-oss-e2e-amrgeo-fixture-east
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuremanagedredis
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  clusterName: pltn-oss-e2e-amrgeo-east
  skuName: BALANCED_B3
  defaultDatabase:
    geoReplicationGroupName: pltn-oss-e2e-amrgeo-group
