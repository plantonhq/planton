syntax = "proto3";

package dev.planton.azure.azurefrontdoorruleset.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurefrontdoorruleset/v1alpha1/outputs.proto";
import "catalog/azure/azurefrontdoorruleset/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureFrontDoorRuleSet is the top-level API resource for a rule set
// inside an Azure Front Door profile (referenced via profile_id) -- the
// ordered edge delivery policy (redirects, rewrites, header edits,
// per-request cache overrides) that routes (AzureFrontDoorRoute) attach
// by ARM ID. One rule set is commonly shared by many routes.
message AzureFrontDoorRuleSet {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureFrontDoorRuleSet'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureFrontDoorRuleSetSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureFrontDoorRuleSetStatus status = 5;
}

// AzureFrontDoorRuleSetStatus holds the deployment status and outputs.
message AzureFrontDoorRuleSetStatus {
  // outputs
  AzureFrontDoorRuleSetOutputs outputs = 1;
}
