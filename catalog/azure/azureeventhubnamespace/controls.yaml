# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azureeventhubnamespace
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Event Hubs encrypts all stored event data at rest with service-managed keys on every tier; encryption cannot be disabled.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Customer-managed-key encryption is composed through AzureEventHubNamespaceCustomerManagedKey -- its own kind, available only to namespaces on a dedicated cluster. This spec carries the prerequisites (identity to unwrap the key, dedicated_cluster_id for eligibility) but no key configuration of its own.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every data-plane endpoint the namespace exposes -- AMQP, HTTPS, and the Kafka bootstrap on port 9093 -- requires TLS; Event Hubs offers no plaintext listener.
    - control_id: no-public-access
      status: configurable
      field_path: public_network_access_enabled
      evidence:
        type: spec_default
        reference: Azure's default is true (a public endpoint at {name}.servicebus.windows.net); setting it false removes public reachability -- clients then connect only through private endpoints (AzurePrivateEndpoint) or admitted VNet service endpoints, and the network_rule_sets block's own public-access dial must agree (a spec CEL front-loads Azure's server-side check).
    - control_id: restricted-ingress
      status: configurable
      field_path: network_rule_sets
      evidence:
        type: spec_default
        reference: Absent means no namespace firewall; declaring the block with default_action DENY admits only the listed ip_rules and virtual_network_rules (each entry IS an allow rule -- Azure's per-rule action accepts only Allow), with trusted_service_access_enabled deciding whether Microsoft platform services bypass it. Not available on BASIC (a spec CEL mirrors Azure's rejection).
      notes: The 02-locked-down-keyless preset denies by default and admits one office range plus one delegated subnet.
    - control_id: edge-protection
      status: not_applicable
      notes: The namespace's endpoints speak AMQP, Kafka, and HTTPS event protocols protected by TLS, authentication, and network scoping; no WAF or request-filtering attachment point exists for an event-streaming data plane.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Management operations are authorized by Azure RBAC unconditionally, and the data plane honors Entra role assignments (Azure Event Hubs Data Owner / Data Sender / Data Receiver) on every namespace -- no spec field has to enable role-based access.
      notes: SAS credentials coexist with RBAC until local_authentication_enabled retires them (see no-legacy-auth).
    - control_id: workload-identity
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Any workload holding a managed identity can authenticate to the data plane with short-lived Entra tokens on every namespace -- the identity path is always on. Setting local_authentication_enabled false makes it the ONLY path.
      notes: The spec's own identity block is the namespace's outbound identity (capture storage auth, CMK unwrapping), not the client path.
    - control_id: no-legacy-auth
      status: configurable
      field_path: local_authentication_enabled
      evidence:
        type: spec_default
        reference: Defaults to true -- SAS (shared-access-signature) keys work, including the root RootManageSharedAccessKey surfaced in this kind's outputs. Setting it false retires every SAS rule's keys as usable credentials; clients must authenticate with Entra identities.
      notes: The 02-locked-down-keyless preset does exactly that.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: ARM writes every management operation on the namespace to the Azure Activity Log unconditionally; runtime and data-plane audit categories flow to Azure Monitor through the namespace's diagnostic-settings surface.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The namespace publishes throughput, request, throttling, and connection metrics to Azure Monitor for every namespace without configuration -- the namespaces resource type carries its own Azure Monitor metric definitions.
    - control_id: backup-recovery
      status: not_applicable
      notes: Event Hubs is a retention-window stream, not a backed-up store -- events age out by per-hub retention and are not restorable from backup. The geo-DR alias (AzureEventHubDisasterRecoveryConfig) replicates namespace metadata, not event data.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain. Message retention is a per-hub setting on AzureEventHub, bounded by this namespace's tier (1 day on BASIC, 7 on STANDARD, up to 90 on PREMIUM) -- a streaming window, not a backup policy.
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: In availability-zone regions, Event Hubs enables zone redundancy automatically at no extra cost -- configuration, metadata, and event data replicate synchronously across three zones with automatic failover, and no spec field controls it because the service offers no dial.
      notes: For namespaces placed on a dedicated cluster, zone redundancy follows the cluster and requires it to hold at least 3 capacity units.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither the Event Hubs API nor this spec offers a deletion-protection flag (Azure resource locks are subscription-side governance outside the manifest); deleting the namespace deletes every entity in it.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The namespace is fully managed PaaS -- Microsoft patches and upgrades the brokers behind it; the spec exposes no version or maintenance surface because none exists.
