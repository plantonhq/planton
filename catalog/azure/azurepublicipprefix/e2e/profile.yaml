apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurepublicipprefix
spec:
  # The harness deploys the fixture resource group (registry prerequisite),
  # reserves the smallest range Azure offers (/31, two addresses), verifies
  # it via the ARM API (generic GetByID on the prefix's ARM id), destroys
  # it, and verifies it is gone -- on both provisioners. The reservation
  # bills per address per hour; the run holds two addresses for minutes.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
