# AzurePublicIpPrefix install profile used as a fixture by scenarios that
# prove prefix associations (declared via the
# planton.dev/e2e-prerequisites annotation -- a NAT gateway's prefixes
# are OPTIONAL references, so this is never a registry prerequisite). The
# harness deploys this document (via the prefix's Pulumi module) after the
# fixture resource group and captures its outputs -- public_ip_prefix_id in
# particular -- for the associating scenario's reference to resolve against.
# /31 reserves the smallest range Azure offers (2 addresses), keeping the
# fixture's per-minute reservation cost minimal.
apiVersion: azure.planton.dev/v1alpha1
kind: AzurePublicIpPrefix
metadata:
  name: planton-oss-e2e-azure-fixture-pippfx
  id: planton-oss-e2e-azure-fixture-pippfx
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurepublicipprefix
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-azure-fixture-pippfx
  prefixLength: 31
  # Pinned to zone 1 to match the NAT gateway scenario's zonal gateway: ARM
  # rejects associating a no-zone prefix with a zonal Standard NAT gateway
  # (PublicIPOrPrefixAndStandardSkuNatGatewayZoneDoNotMatch).
  zones:
    - "1"
