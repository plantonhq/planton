# AzureLogAnalyticsWorkspace install profile used as a prerequisite by
# composed components (Application Insights, diagnostic settings,
# scheduled query alerts -- declared via prerequisites:
# [AzureLogAnalyticsWorkspace] in the kind registry). The E2E harness
# deploys this document (via the workspace's Pulumi module), captures its
# outputs under its manifest name, and resolves dependents' workspace
# references against them. The resource group arrives transitively
# through this kind's own AzureResourceGroup prerequisite. Workspace
# names are resource-group-scoped, so sequential recreate is safe; the
# pay-as-you-go default SKU keeps the fixture free-tier cheap.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureLogAnalyticsWorkspace
metadata:
  name: planton-oss-e2e-azure-fixture-law
  id: planton-oss-e2e-azure-fixture-law
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureloganalyticsworkspace
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  workspaceName: planton-oss-e2e-fixture-law
