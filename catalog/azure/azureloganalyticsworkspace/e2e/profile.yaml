apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azureloganalyticsworkspace
spec:
  # The scenario deploys a workspace into the fixture resource group,
  # verifies it via the ARM API, destroys it, and verifies it is gone.
  # Workspaces create and delete in about a minute each; the fixture RG
  # dominates nothing here.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
