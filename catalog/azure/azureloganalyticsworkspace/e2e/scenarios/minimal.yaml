# Minimal AzureLogAnalyticsWorkspace scenario: a pay-as-you-go workspace
# in the fixture resource group exercising the retention dial, a daily
# ingestion cap, the resource-context access default, and user tags --
# the everyday production shape. The commitment-tier and identity seams
# are proven by the offline plan (they change billing, not behavior the
# ARM read can distinguish).
apiVersion: azure.planton.dev/v1alpha1
kind: AzureLogAnalyticsWorkspace
metadata:
  name: planton-oss-e2e-azurelaw-smoke
  id: planton-oss-e2e-azurelaw-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureloganalyticsworkspace
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  workspaceName: planton-oss-e2e-law-smoke
  sku: PER_GB_2018
  retentionInDays: 30
  dailyQuotaGb: 1
  tags:
    purpose: e2e-smoke
