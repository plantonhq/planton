syntax = "proto3";

package dev.planton.azure.azurestorageobjectreplication.v1alpha1;

// **AzureStorageObjectReplicationOutputs** captures the outputs of
// provisioning an object replication policy. Azure materializes the
// policy on BOTH accounts under one server-assigned policy GUID, so
// there are two ARM IDs for the one logical policy.
message AzureStorageObjectReplicationOutputs {
  // The policy's ARM ID on the SOURCE account.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Storage/storageAccounts/{src}/objectReplicationPolicies/{policyId}
  string source_object_replication_id = 1;

  // The policy's ARM ID on the DESTINATION account -- the authoritative
  // copy (Azure assigns rule IDs here first).
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Storage/storageAccounts/{dst}/objectReplicationPolicies/{policyId}
  string destination_object_replication_id = 2;

  // The server-assigned policy GUID shared by both sides -- what
  // `az storage account or-policy show --policy-id` and the monitoring
  // surfaces key on.
  string policy_id = 3;
}
