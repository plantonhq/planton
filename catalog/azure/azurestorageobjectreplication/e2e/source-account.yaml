# Dedicated SOURCE AzureStorageAccount for the object-replication
# scenario only. Blob versioning AND change feed are on -- Azure's
# apply-time prerequisites for the replication source. Account names are
# globally unique and hyphen-forbidden, so the scenario carries its own
# distinct hyphen-free names instead of shared registry prerequisites.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureStorageAccount
metadata:
  name: planton-oss-e2e-orsrc-fixture-account
  id: planton-oss-e2e-orsrc-fixture-account
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurestorageaccount
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  accountName: pltnosse2eorsrcfix
  replicationType: LRS
  blobProperties:
    versioningEnabled: true
    changeFeedEnabled: true
