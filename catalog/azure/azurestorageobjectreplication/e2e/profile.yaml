apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurestorageobjectreplication
spec:
  # The harness deploys the fixture resource group, TWO scenario-local
  # storage accounts (source with versioning + change feed, destination
  # with versioning -- Azure's apply-time prerequisites), and a container
  # on each (all declared via the e2e-prerequisites annotation, in
  # deploy order -- account names are globally unique and Azure briefly
  # holds a just-deleted name, so accounts are never shared
  # recreate-per-scenario registry prerequisites), creates the
  # replication policy, verifies the destination-side policy (the
  # authoritative copy) via the ARM API, destroys it, and verifies both
  # sides are gone.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
