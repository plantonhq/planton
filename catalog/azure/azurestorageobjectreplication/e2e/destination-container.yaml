# The container on the DESTINATION account that the replication rule
# copies into.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureStorageContainer
metadata:
  name: planton-oss-e2e-ordst-fixture-container
  id: planton-oss-e2e-ordst-fixture-container
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurestoragecontainer
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  storageAccountId:
    valueFrom:
      name: planton-oss-e2e-ordst-fixture-account
  containerName: invoices-replica
