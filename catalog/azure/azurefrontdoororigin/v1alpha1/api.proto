syntax = "proto3";

package dev.planton.azure.azurefrontdoororigin.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurefrontdoororigin/v1alpha1/outputs.proto";
import "catalog/azure/azurefrontdoororigin/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureFrontDoorOrigin is the top-level API resource for one backend
// inside an Azure Front Door origin group (referenced via
// origin_group_id): the backend's address, TLS validation posture,
// priority/weight in the pool, and optional Private Link connectivity.
message AzureFrontDoorOrigin {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureFrontDoorOrigin'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureFrontDoorOriginSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureFrontDoorOriginStatus status = 5;
}

// AzureFrontDoorOriginStatus holds the deployment status and outputs.
message AzureFrontDoorOriginStatus {
  // outputs
  AzureFrontDoorOriginOutputs outputs = 1;
}
