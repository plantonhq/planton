# AzureFrontDoorOrigin install profile used as a prerequisite by
# composed kinds (AzureFrontDoorRoute, declared via prerequisites in
# the kind registry -- ARM rejects a route whose origin group has no
# origins yet). The harness deploys this origin after the fixture origin
# group; the route's origin_ids list references its origin_id output to
# sequence deployment.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureFrontDoorOrigin
metadata:
  name: planton-oss-e2e-fd-origin-prereq
  id: planton-oss-e2e-fd-origin-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurefrontdoororigin
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  originGroupId:
    valueFrom:
      name: planton-oss-e2e-fd-og-prereq
  originName: e2e-primary-prereq
  hostName:
    value: example.com
