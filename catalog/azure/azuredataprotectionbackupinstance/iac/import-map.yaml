apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: azuredataprotectionbackupinstance
spec:
  # The instance's identity is its full ARM resource ID -- a child of
  # its vault (.../backupVaults/{vault}/backupInstances/{name}). The
  # SAME ID shape serves all six variant resources; which provider
  # resource imports it follows the spec's variant block.
  values:
    - name: backup_instance_id
      derivations:
        - from_output: backup_instance_id
      where_to_find: >-
        `az dataprotection backup-instance list -g <rg> --vault-name
        <vault> --query "[].id"` (instance names carry a
        service-derived suffix -- list and match, never compose by
        hand), or the component's own backup_instance_id output.
