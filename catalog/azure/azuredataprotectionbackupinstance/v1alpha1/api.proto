syntax = "proto3";

package dev.planton.azure.azuredataprotectionbackupinstance.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azuredataprotectionbackupinstance/v1alpha1/outputs.proto";
import "catalog/azure/azuredataprotectionbackupinstance/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureDataProtectionBackupInstance is the top-level API resource
// describing a Data Protection backup instance -- the binding that
// puts one datasource (blob storage, disk, Kubernetes cluster,
// MySQL/PostgreSQL flexible server, or Data Lake storage) under a
// backup policy's protection, expressed as one kind with variant
// blocks.
message AzureDataProtectionBackupInstance {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzureDataProtectionBackupInstance".
  string kind = 2 [(buf.validate.field).string.const = 'AzureDataProtectionBackupInstance'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Data Protection backup instance specification.
  AzureDataProtectionBackupInstanceSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzureDataProtectionBackupInstanceStatus status = 5;
}

// AzureDataProtectionBackupInstanceStatus holds the deployment outputs.
message AzureDataProtectionBackupInstanceStatus {
  // Outputs from the IaC deployment.
  AzureDataProtectionBackupInstanceOutputs outputs = 1;
}
