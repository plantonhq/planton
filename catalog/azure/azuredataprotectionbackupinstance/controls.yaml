# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azuredataprotectionbackupinstance
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Backup data is encrypted at rest wherever the variant lands it, unconditionally -- vault-tier recovery points sit in Backup Storage under Azure Storage service-side encryption, and operational-tier artifacts (disk and AKS snapshots, blob versions and staged data) sit in the customer's own resource group or storage account, which Azure Storage encrypts with no off switch."
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: "Customer-managed keys for vault-held backup data are the VAULT's encryption setting -- the referenced AzureDataProtectionBackupVault component owns that choice for everything it protects. Operational-tier artifacts inherit the key posture of the account or resource group they live in. The instance carries no key knob."
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Backup traffic from the datasource into vault storage moves over Azure's internal fabric under HTTPS -- Microsoft's transport, with no customer-configurable alternative on the instance."
    - control_id: no-public-access
      status: not_applicable
      notes: "The instance is a protection binding, not an endpoint -- nothing listens. Network exposure of the backup path is decided vault-side and datasource-side, never on this manifest."
    - control_id: restricted-ingress
      status: not_applicable
      notes: "No inbound surface exists to restrict (see no-public-access)."
    - control_id: edge-protection
      status: not_applicable
      notes: "No request surface exists for a WAF to filter."
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Every operation on the protection -- create, re-bind the policy, restore, delete data -- is authorized by Azure RBAC on the vault's scope unconditionally (Backup Contributor / Backup Operator / Backup Reader are the purpose-built roles). Azure additionally validates at create time that the VAULT's managed identity holds the datasource roles (Disk Backup Reader, Storage Account Backup Contributor, the AKS trusted-access binding, the flexible servers' backup roles) -- a second, mandatory authorization gate on the data side."
    - control_id: workload-identity
      status: not_applicable
      notes: "The instance holds no credentials -- Azure Backup acts as the VAULT's system-assigned managed identity, a keyless platform-issued identity by construction. Its datasource role assignments are composed on the AzureDataProtectionBackupVault kind's system_assigned_identity_principal_id output, never here."
    - control_id: no-legacy-auth
      status: not_applicable
      notes: "No authentication paths of its own to strengthen or disable; the vault's security settings (soft delete, immutability, resource-guard MUA) are the hardening surface, vault-side."
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Every management action on the instance -- creation, policy re-binding, restores, data deletion -- lands in the Azure Activity Log unconditionally, and Azure Backup records every backup and restore job in the vault's jobs history."
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Backup job outcomes and protected-item health surface in Backup center and the vault's monitoring blade for every instance with no configuration; the vault's diagnostic settings can additionally export job and health data to a Log Analytics workspace, vault-side."
    - control_id: backup-recovery
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "This kind IS the control -- the instance is what makes a datasource's backups automated and restorable. Recovery points accrue on the referenced policy's schedule and restore through Azure Backup's standard flows, per variant (disk from incremental snapshots, AKS workloads with optional volume data, blob from operational versions or vaulted copies, the flexible servers from vault-tier fulls)."
      notes: "The purpose-control, with two facts worth hearing plainly: creation only registers -- the first recovery point lands on the policy's next scheduled run (operational blob protection is the exception, continuous from enablement) -- and the vault's managed identity must hold the datasource roles BEFORE create or the deploy fails with an authorization-class error."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: "Retention length is the referenced AzureDataProtectionBackupPolicy's whole job -- schedule and retention live there, and re-pointing backup_policy_id updates protection in place on every variant EXCEPT kubernetes_cluster, where the provider ships no update path and even the policy binding replaces the instance. This manifest holds the binding, never the retention numbers."
    - control_id: multi-zone-ha
      status: not_applicable
      notes: "Resilience of the backup DATA is the vault's redundancy choice (LocallyRedundant / ZoneRedundant / GeoRedundant), configured on the AzureDataProtectionBackupVault kind; operational-tier snapshots default to ZRS in regions that support it (Microsoft's pricing documentation). The binding itself has no zone posture."
    - control_id: deletion-protection
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Data Protection backup vaults ship soft delete enabled by default -- destroying the instance stops protection and deletes the backup data, but the vault retains it as a soft-deleted item for 14 days and holds the vault's own deletion for that window, a provider-level recycle bin even though the instance object itself has no delete lock."
      notes: "The vault's immutability and resource-guard (multi-user authorization) settings can harden the window further, vault-side. With soft delete disabled on the vault, a destroy is immediate and final."
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Azure Backup is a fully managed service -- Microsoft operates the backup fabric, and the AKS variant's Backup extension is serviced through Azure's managed extension channel on the cluster. No customer-visible patch surface exists on the protection itself."
