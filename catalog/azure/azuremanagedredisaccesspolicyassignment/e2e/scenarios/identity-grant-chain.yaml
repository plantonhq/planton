# AzureManagedRedisAccessPolicyAssignment chain scenario: a
# scenario-local KEYLESS Managed Redis cluster (access keys off) and the
# assignment under test granting data-plane access to the fixture
# user-assigned identity. Exercises both FK seams: the cluster reference
# (managed_redis_id) and the identity principal-id reference.
#
# The identity resolves through its registry install profile by kind
# name; the cluster is a path-declared extra fixture (expensive parent
# -- scenario-local by design).
apiVersion: azure.planton.dev/v1alpha1
kind: AzureManagedRedisAccessPolicyAssignment
metadata:
  name: planton-oss-e2e-azuremanagedredisaccesspolicyassignment-chain
  id: planton-oss-e2e-azuremanagedredisaccesspolicyassignment-chain
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuremanagedredisaccesspolicyassignment
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AzureUserAssignedIdentity, catalog/azure/azuremanagedredisaccesspolicyassignment/e2e/keyless-cluster.yaml"
  tags:
    - planton-e2e
spec:
  managedRedisId:
    valueFrom:
      name: planton-oss-e2e-amrgrant-fixture-cluster
  objectId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-identity
