apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azuremanagedredisaccesspolicyassignment
spec:
  # The chain scenario deploys the fixture resource group + fixture
  # user-assigned identity, a scenario-local KEYLESS Managed Redis
  # cluster (access keys off -- the posture the grant exists for), and
  # the assignment under test granting data-plane access to the fixture
  # identity's principal. Proves both FK seams: the cluster reference
  # and the identity principal-id reference.
  #
  # The scenario-local cluster dominates the runtime: Managed Redis
  # provisions and deletes in tens of minutes.
  tier: 1
  status: deferred
  deferred_reason: >-
    Deferred by owner decision: the scenario-local Managed Redis
    cluster fixture provisions and deletes in tens of minutes, so the
    dual-engine chain exceeds the pre-approved live-E2E window. The
    kind stands on its green offline gate -- 100% parity audit,
    full tofu plan, spec tests, and the outputs conformance case. The
    scenario runs unchanged once a live window is approved.
  validated_provisioners: []
  timeout_minutes: 120
