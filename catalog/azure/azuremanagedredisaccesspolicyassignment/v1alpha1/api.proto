syntax = "proto3";

package dev.planton.azure.azuremanagedredisaccesspolicyassignment.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azuremanagedredisaccesspolicyassignment/v1alpha1/outputs.proto";
import "catalog/azure/azuremanagedredisaccesspolicyassignment/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureManagedRedisAccessPolicyAssignment is the top-level API resource
// for a Managed Redis data-plane grant: it assigns the built-in "default"
// access policy to a Microsoft Entra identity on an AzureManagedRedis
// instance (referenced via managed_redis_id). The Redis analog of a role
// assignment, and the grant half of Managed Redis's keyless-by-default
// story -- with access keys off, granted identities are how clients
// connect at all.
message AzureManagedRedisAccessPolicyAssignment {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureManagedRedisAccessPolicyAssignment'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureManagedRedisAccessPolicyAssignmentSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureManagedRedisAccessPolicyAssignmentStatus status = 5;
}

// AzureManagedRedisAccessPolicyAssignmentStatus holds the deployment
// status and outputs.
message AzureManagedRedisAccessPolicyAssignmentStatus {
  // outputs
  AzureManagedRedisAccessPolicyAssignmentOutputs outputs = 1;
}
