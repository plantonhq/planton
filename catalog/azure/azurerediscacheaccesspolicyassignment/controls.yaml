# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azurerediscacheaccesspolicyassignment
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A grant record is authorization metadata held by the cache's control plane; the cached data whose access it governs belongs to the AzureRedisCache kind's posture.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest of its own to key (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: The grant carries no traffic of its own; client TLS enforcement is the AzureRedisCache kind's posture.
    - control_id: no-public-access
      status: not_applicable
      notes: A grant record has no network endpoint; the cache's exposure is the AzureRedisCache kind's posture.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network surface to restrict (see no-public-access).
    - control_id: edge-protection
      status: not_applicable
      notes: No inbound request path exists to filter.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: spec_default
        reference: The resource IS a data-plane RBAC grant in Redis's access-policy system -- it cannot be deployed without expressing one. access_policy_name (what -- a built-in like "Data Reader" or a custom AzureRedisCacheAccessPolicy), object_id (who), and redis_cache_id (where) are all required, so every deployment names a bounded permission set for one principal on one cache.
      notes: With the cache's access keys disabled, these grants are the ONLY way clients connect -- an ARM Owner on the cache still reads no keys' worth of data without one.
    - control_id: workload-identity
      status: configurable
      field_path: object_id
      evidence:
        type: spec_default
        reference: object_id defaults to referencing an AzureUserAssignedIdentity's principal_id output -- the composition grants Redis access to a workload's managed identity, which connects with its object ID (or object_id_alias) as the Redis username and a short-lived Entra token as the password, no stored secret involved. Passing a literal GUID (a user, group, or externally managed service principal) opts out of that keyless default.
      notes: The enabling half of the fully keyless Redis posture -- Entra auth on and access keys off on the cache (that kind's spec), token-bearing workloads granted in through this kind. For a managed identity the PRINCIPAL id must be granted, not the client id -- the wrong one fails at connect time, not at deploy time.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The switch that disables access-key (legacy shared-secret) authentication lives on the AzureRedisCache kind's spec -- though these assignments are what makes flipping it practical, since Entra principals need grants once keys are off.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Creation and deletion of assignments land in the Azure Activity Log as subscription-level posture; data-plane connection auditing is the cache's diagnostic-settings surface.
    - control_id: monitoring-integration
      status: not_applicable
      notes: A grant record emits no metrics or runtime signals.
    - control_id: backup-recovery
      status: not_applicable
      notes: Stateless authorization configuration -- nothing to back up; the manifest recreates the grant declaratively (every field is fixed at creation, so recreation is a momentary revoke-and-re-grant, safe for the grant class).
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: A grant has no runtime footprint with a zonal failure mode; it lives in the cache's Microsoft-operated configuration store and follows the cache's own availability posture.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Azure nor this spec offers a deletion-protection flag for an assignment (Azure resource locks are subscription-side governance outside the manifest); deleting one revokes the principal's data access and is recreated declaratively.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The authorization machinery that stores and evaluates assignments is part of the Microsoft-operated Azure Cache for Redis service; no customer-visible patch surface exists.
