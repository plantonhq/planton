apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurerediscacheaccesspolicyassignment
spec:
  # The harness deploys the fixture resource group + fixture identity
  # (by kind name) and a SCENARIO-LOCAL Entra-enabled BASIC cache with a
  # custom policy on it (path-form extra fixtures, in deploy order),
  # then creates the assignment under test -- granting the CUSTOM policy
  # to the identity's principal -- verifies it via the ARM API, destroys
  # it, and verifies it is gone. This chain live-proves both of the
  # family's FK seams: policy-name and identity-principal references.
  #
  # The assignment itself deploys in seconds; the timeout is sized by
  # the fixture cache's provisioning (Redis is the slowest-provisioning
  # service in the Azure catalog).
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 90
