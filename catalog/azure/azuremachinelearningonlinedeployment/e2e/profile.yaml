apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azuremachinelearningonlinedeployment
spec:
  # Proven live on both engines: one Standard_F2s_v2 instance serving
  # a SETUP-seeded MLflow model (no-code path -- no environment, no
  # scoring script). Measured: create 17-18 min, delete ~6 min; the
  # instance bills until destroy (no scale-to-zero). The model-less
  # arm is a live-proven service boundary (bare 400 BadRequest). The
  # Terraform blind import was zero-change (no tolerances needed).
  # Probes, data collection, and secure egress stay offline-proven.
  # A first-create InternalServerError from Azure's MFE is transient
  # -- retry the lane, do not debug the module.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 60
