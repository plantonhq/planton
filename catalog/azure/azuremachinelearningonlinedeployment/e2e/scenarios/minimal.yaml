# Minimal AzureMachineLearningOnlineDeployment scenario: one small
# managed instance serving a tiny MLflow model on the fixture endpoint.
#
# A model is REQUIRED live: the ARM schema marks model, environment,
# and code all optional (BYOC images embed their model), but the
# SERVICE rejects a model-less managed create synchronously --
# Status=400 Code="BadRequest" Message="The request is invalid.", no
# field detail (live-proven boundary). The model is seeded by the
# SETUP-phase script below (Microsoft's canonical ~750 B sklearn
# sample, registered into the fixture workspace as an MLflow model);
# no environment and no code are set, so the lane also proves the
# no-code-deployment path -- Azure builds the serving container from
# the model's own conda.yaml. The subscription-scoped model ID
# composes through the harness's exported subscription variable (the
# E2E_ENV token below) because a committed manifest must not hardcode
# one account's identifier.
#
# The cloud-side NAME carries ${E2E_RUN_ID} (metadata names stay
# stable -- prerequisite FK resolution keys off them): deployment names
# are scoped to their ENDPOINT, and both engine lanes attach to the
# SAME fixture endpoint -- a fixed name would collide across engines.
#
# COST: the single Standard_F2s_v2 instance bills from provisioning to
# destroy (managed deployments have no scale-to-zero) -- minutes of VM
# time per lane.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureMachineLearningOnlineDeployment
metadata:
  name: planton-oss-e2e-azuremachinelearningonlinedeployment-smoke
  id: planton-oss-e2e-azuremachinelearningonlinedeployment-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuremachinelearningonlinedeployment
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-setup-script: "catalog/azure/azuremachinelearningonlinedeployment/e2e/scenarios/minimal.setup.sh"
  tags:
    - planton-e2e
spec:
  endpointId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-mloe
  name: dep-${E2E_RUN_ID}
  region: eastus
  instanceType: Standard_F2s_v2
  instanceCount: 1
  model: /subscriptions/${E2E_ENV:PLANTON_E2E_AZURE_SUBSCRIPTION_ID}/resourceGroups/planton-oss-e2e-azure-fixture-rg/providers/Microsoft.MachineLearningServices/workspaces/planton-oss-e2e-fixture-mlw/models/planton-oss-e2e-sklearn/versions/1
  tags:
    e2e-suite: azure
    purpose: smoke
