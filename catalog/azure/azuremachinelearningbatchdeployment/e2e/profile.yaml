apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azuremachinelearningbatchdeployment
spec:
  # The deployment is a job RECIPE -- nothing provisions and nothing
  # bills at create time (compute materializes per job, and no lane
  # ever submits a job); the time lives in its chain (the fixture
  # workspace, the fixture batch endpoint, and the fixture
  # scale-to-zero compute cluster). The bare-recipe arm the wave
  # originally gambled on is a live-proven service boundary (400
  # UserError naming ModelConfiguration.ModelReference and
  # ComputeConfiguration.ComputeId, ArgumentNullOrEmpty -- now a
  # spec CEL), so the smoke serves a SETUP-seeded MLflow model on
  # the fixture cluster instead. The model union's dataPath/
  # outputPath arms, the pipeline-component recipe, and the batching
  # dials are offline-proven only this wave (they need registered
  # assets no catalog kind creates).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 45
