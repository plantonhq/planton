# Minimal AzureMachineLearningBatchDeployment scenario: a Model-type
# recipe serving a tiny MLflow model on the fixture batch endpoint,
# running on the fixture scale-to-zero compute cluster.
#
# A model AND a compute are REQUIRED live: the ARM schema marks every
# recipe property optional, but the SERVICE validates a Model-type
# create synchronously and rejects a bare recipe with 400
# Code="UserError" naming both properties -- ModelConfiguration.
# ModelReference and ComputeConfiguration.ComputeId, each
# "'...' must not be empty." (ErrorCode ArgumentNullOrEmpty;
# live-proven boundary, recorded on the spec fields). The bare-recipe
# arm the wave originally gambled on is therefore undeployable.
#
# The model is seeded by the SETUP-phase script below (Microsoft's
# canonical ~750 B sklearn sample, registered into the fixture
# workspace as an MLflow model); no environment and no code are set,
# so the lane also proves the no-code path. The compute rides the
# e2e-prerequisites annotation: the fixture compute cluster scales to
# zero and no lane ever submits a job, so nothing provisions and
# nothing bills either way. The subscription-scoped model ID composes
# through the harness's exported subscription variable (the E2E_ENV
# token below) because a committed manifest must not hardcode one
# account's identifier.
#
# The cloud-side NAME carries ${E2E_RUN_ID} (metadata names stay
# stable -- prerequisite FK resolution keys off them): deployment
# names are scoped to their ENDPOINT, and both engine lanes attach to
# the SAME fixture endpoint -- a fixed name would collide across
# engines.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureMachineLearningBatchDeployment
metadata:
  name: planton-oss-e2e-azuremachinelearningbatchdeployment-smoke
  id: planton-oss-e2e-azuremachinelearningbatchdeployment-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuremachinelearningbatchdeployment
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-setup-script: "catalog/azure/azuremachinelearningbatchdeployment/e2e/scenarios/minimal.setup.sh"
    planton.dev/e2e-prerequisites: "AzureMachineLearningComputeCluster"
  tags:
    - planton-e2e
spec:
  endpointId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-mlbe
  name: bd-${E2E_RUN_ID}
  region: eastus
  computeId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-mlcc
  model:
    id:
      assetId: /subscriptions/${E2E_ENV:PLANTON_E2E_AZURE_SUBSCRIPTION_ID}/resourceGroups/planton-oss-e2e-azure-fixture-rg/providers/Microsoft.MachineLearningServices/workspaces/planton-oss-e2e-fixture-mlw/models/planton-oss-e2e-sklearn/versions/1
  tags:
    e2e-suite: azure
    purpose: smoke
