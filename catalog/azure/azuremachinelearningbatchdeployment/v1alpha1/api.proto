syntax = "proto3";

package dev.planton.azure.azuremachinelearningbatchdeployment.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azuremachinelearningbatchdeployment/v1alpha1/outputs.proto";
import "catalog/azure/azuremachinelearningbatchdeployment/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureMachineLearningBatchDeployment is the top-level API resource
// describing a batch deployment on an Azure Machine Learning batch
// endpoint -- the job recipe (model, compute, batching behavior) the
// endpoint's default-deployment pointer routes submissions to.
message AzureMachineLearningBatchDeployment {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzureMachineLearningBatchDeployment".
  string kind = 2 [(buf.validate.field).string.const = 'AzureMachineLearningBatchDeployment'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Batch deployment specification.
  AzureMachineLearningBatchDeploymentSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzureMachineLearningBatchDeploymentStatus status = 5;
}

// AzureMachineLearningBatchDeploymentStatus holds the deployment outputs.
message AzureMachineLearningBatchDeploymentStatus {
  // Outputs from the IaC deployment.
  AzureMachineLearningBatchDeploymentOutputs outputs = 1;
}
