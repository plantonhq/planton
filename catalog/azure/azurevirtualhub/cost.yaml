# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azurevirtualhub
spec:
  billing_model: hybrid
  baseline_charges:
    - service_name: Virtual WAN
      sku_meter: Standard hub deployment
      pricing_unit: hours
      description: A Standard hub bills its deployment-hour meter from creation until deletion, gateways or not -- Microsoft states plainly that a hub in a Basic WAN carries no base fee and no data-processing fee, so this charge exists only on the Standard tier.
  cost_drivers:
    - field_path: sku
      sku_meter: Standard hub deployment
      pricing_unit: hours
      impact: The tier decides whether the hub bills at all -- STANDARD (the default) pays the hourly deployment fee for the full-mesh router; BASIC pays no hub fee but is confined to site-to-site VPN, so its real spend lives in the VPN gateway's scale and connection units on that gateway's own component.
    - field_path: route_maps
      sku_meter: hub deployment with route maps
      pricing_unit: hours
      impact: Presence of route maps moves the hub off the base deployment meter onto the dearer route-maps/third-party-integration hub meter -- Microsoft's price list bills a hub with route maps or a third-party Firewall Manager policy at a higher hourly rate, not as an add-on line.
    - field_path: virtual_router_auto_scale_min_capacity
      sku_meter: routing infrastructure units
      pricing_unit: unit-hours
      impact: The hub's deployment fee covers the router's default capacity of 2 routing infrastructure units (3 Gbps, ~2,000 attached VMs); raising this floor commits additional units at the per-unit hourly rate around the clock, and the router autoscales -- and bills -- above whatever floor is set when traffic demands it.
  estimate_exclusions:
    - hub data processing bills per GB for VNet-to-VNet traffic transiting the router -- branch-to-branch and VNet-to-branch flows through the same hub carry no hub processing charge
    - routing infrastructure units the router autoscales above the provisioned floor follow traffic load
    - gateways created on the hub (site-to-site VPN, point-to-site VPN, ExpressRoute) are their own components billing scale units and connection units
    - an Azure Firewall referenced by routing intent bills its secured-hub deployment and data-processing meters on its own component
    - hub-to-hub and inter-region flows bill standard inter-region data-transfer rates on top of hub processing
  notes: "Azure bills a Virtual WAN hub as a flat hourly router fee plus capacity and traffic: the Standard deployment meter runs from creation, routing infrastructure units above the included 2 add unit-hours, and the router's VNet-to-VNet transit bills per GB processed. Two facts stop bill surprises: adding route maps replaces the hub's base meter with a dearer one rather than adding a line, and a Basic-WAN hub is genuinely free at the hub -- its spend is entirely in the VPN gateway units of the one gateway type it supports. Custom route tables, BGP peerings with NVAs, and static routes carry no meters of their own."
