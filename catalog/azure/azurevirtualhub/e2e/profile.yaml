apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurevirtualhub
spec:
  # Proven live on both engines (full lifecycle + blind import round-trip
  # of the hub AND its composed route table/route map, zero-change plan).
  # Measured: deploy ~35m (the router's Provisioned settling dominates;
  # the composed route map alone ran ~17m -- the provider polls the
  # router around the child create), destroy ~11-13m, lane total ~50m
  # per engine. The hub bills (~$0.25/hr class) from creation; the
  # timeout leaves headroom for a slow region day. The hub is also the
  # fixture pivot of the Virtual WAN family: connection and gateway
  # lanes chain through this kind's install profile (~17-20m fixture
  # create inside their lanes). Offline-proven-only arms (recorded, live
  # needs no catalog kind provides): BGP peerings (a real NVA) and
  # routing intent (a hub firewall).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 90
