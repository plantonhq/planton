# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azurevirtualhub
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The hub is a Microsoft-managed transit router -- it forwards packets and holds no customer data at rest. Its configuration (route tables, route maps, peerings) is ARM resource metadata on Microsoft's control plane, not a data store this manifest could encrypt.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: With no customer data at rest on the hub, there is no store to key -- neither the hub API nor this spec carries any encryption-key surface.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The hub router forwards traffic as the endpoints send it -- whether flows are encrypted is decided by the tunnels and workloads on either side (VPN/ExpressRoute gateways are their own kinds; VNet-to-VNet transit rides Azure's backbone). No field of this manifest changes what is encrypted on the wire.
    - control_id: no-public-access
      status: not_applicable
      notes: The hub router has no public endpoint of its own -- it routes between private address spaces drawn from address_prefix. Internet-facing surface arrives only with gateways (VPN, ExpressRoute, P2S) or a firewall, each composed as its own component with its own exposure posture.
    - control_id: restricted-ingress
      status: not_applicable
      notes: A managed hub offers no NSG attachment point -- Microsoft owns the hub's internal subnets. Traffic filtering in a Virtual WAN is composed as an Azure Firewall or NVA steered by routing_intent or route-table next hops, and enforcement lives on that appliance's component, not on hub fields.
    - control_id: edge-protection
      status: not_applicable
      notes: The hub fronts no web endpoint, so there is nothing for a WAF to filter. routing_intent steers Internet-bound and private transit through an Azure Firewall in the hub -- network-layer inspection on the firewall's own component -- which is transit filtering, not request-level edge protection.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every management operation on the hub and its children -- route tables, route maps, BGP connections, routing intent -- is authorized by Azure RBAC unconditionally, and ARM additionally cross-checks referenced resources (the WAN's join/action, the firewall's read) at write time, failing with LinkedAccessCheckFailed when the caller lacks rights on the referenced scope.
    - control_id: workload-identity
      status: not_applicable
      notes: The hub runs no customer workloads and calls no cloud APIs on the customer's behalf -- there is no identity to attach. NVAs that peer with the hub's router over BGP carry their own identities on their own components.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The hub's only surface is the ARM management plane, authenticated by Entra ID -- there is no local-credential or legacy-protocol path to disable. BGP peerings with NVAs are unauthenticated by BGP's nature and scoped to connected spokes.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every management-plane action on the hub and its routing children lands in the Azure Activity Log unconditionally -- who changed a route table, who repointed routing intent, who deleted the hub.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The hub router's platform metrics -- data processed, routing infrastructure units, spoke VM utilization -- flow to Azure Monitor for every hub with no configuration; they are also what the router's autoscaler acts on.
    - control_id: backup-recovery
      status: not_applicable
      notes: There is no data to back up -- the hub's routing configuration is declarative in this manifest and re-creatable by a fresh deploy. State that must survive (connected VNets, branch configs) lives on the referencing components.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: With no backup facility on the hub, there is no retention to configure.
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Microsoft deploys the hub's services across availability zones automatically in zone-capable regions and provisions gateways active-active inside the hub -- resiliency is built in, with no field to enable or disable it. Cross-REGION resilience is composed by adding hubs in other regions to the same WAN.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither the hub API nor this spec offers a deletion-protection flag; Azure resource locks are subscription-side governance outside the manifest. ARM does refuse to delete a hub that still has gateways or connections attached -- a dependency guard that orders teardown, not a protection lock.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The hub router and the hub's internal infrastructure are Microsoft-managed -- patching, scaling, and instance replacement happen on Microsoft's side with no version or maintenance field in the hub spec. Gateways created on the hub carry their own maintenance configuration on their own components.
