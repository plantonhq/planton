syntax = "proto3";

package dev.planton.azure.azurevirtualwan.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurevirtualwan/v1alpha1/outputs.proto";
import "catalog/azure/azurevirtualwan/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureVirtualWan is the top-level API resource describing a Virtual
// WAN -- the umbrella of Azure's managed hub-and-spoke networking, under
// which regional virtual hubs and their gateways are created.
message AzureVirtualWan {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzureVirtualWan".
  string kind = 2 [(buf.validate.field).string.const = 'AzureVirtualWan'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Virtual WAN specification.
  AzureVirtualWanSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzureVirtualWanStatus status = 5;
}

// AzureVirtualWanStatus holds the deployment outputs.
message AzureVirtualWanStatus {
  // Outputs from the IaC deployment.
  AzureVirtualWanOutputs outputs = 1;
}
