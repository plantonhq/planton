syntax = "proto3";

package dev.planton.azure.azurevirtualwan.v1alpha1;

import "catalog/azure/azurevirtualwan/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureVirtualWanIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureVirtualWanIacInput {
  // The Virtual WAN resource to deploy.
  AzureVirtualWan target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
