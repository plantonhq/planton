syntax = "proto3";

package dev.planton.azure.azurevirtualwan.v1alpha1;

// **AzureVirtualWanOutputs** captures the outputs of provisioning
// a Virtual WAN.
message AzureVirtualWanOutputs {
  // The Azure Resource Manager ID of the WAN -- what virtual hubs
  // reference as their virtual_wan_id.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/virtualWans/{name}
  string virtual_wan_id = 1;

  // The name of the WAN.
  string virtual_wan_name = 2;
}
