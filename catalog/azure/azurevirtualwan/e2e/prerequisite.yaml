# AzureVirtualWan install profile used as a fixture by composed
# components (declared via prerequisites: [AzureVirtualWan] in the kind
# registry -- the virtual hub's chain, and transitively everything that
# attaches to a hub). The harness deploys this document after the
# fixture resource group and captures its outputs -- virtual_wan_id in
# particular -- for dependents' references to resolve against. The WAN
# is a free policy object (seconds-to-minutes); the cost lives in the
# hubs and gateways its consumers create.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureVirtualWan
metadata:
  name: planton-oss-e2e-azure-fixture-vwan
  id: planton-oss-e2e-azure-fixture-vwan
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurevirtualwan
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-azure-fixture-vwan
