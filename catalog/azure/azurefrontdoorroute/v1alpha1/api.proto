syntax = "proto3";

package dev.planton.azure.azurefrontdoorroute.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurefrontdoorroute/v1alpha1/outputs.proto";
import "catalog/azure/azurefrontdoorroute/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureFrontDoorRoute is the top-level API resource for a route inside an
// Azure Front Door endpoint (referenced via endpoint_id): the rule that
// matches client requests by URL pattern and forwards them to an origin
// group, with protocol policy and edge caching.
message AzureFrontDoorRoute {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureFrontDoorRoute'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureFrontDoorRouteSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureFrontDoorRouteStatus status = 5;
}

// AzureFrontDoorRouteStatus holds the deployment status and outputs.
message AzureFrontDoorRouteStatus {
  // outputs
  AzureFrontDoorRouteOutputs outputs = 1;
}
