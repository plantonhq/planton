syntax = "proto3";

package dev.planton.azure.azureroledefinition.v1alpha1;

// **AzureRoleDefinitionOutputs** captures the outputs of provisioning a
// custom Azure RBAC role definition. The fully-scoped ARM resource ID is the
// definition's identity for composition -- it is exactly what a role
// assignment binds -- and the GUID/name/scope coordinates are exported so
// downstream automation can reason about the role without re-reading the spec.
message AzureRoleDefinitionOutputs {
  // The fully-scoped Azure Resource Manager ID of the role definition.
  // Format: {scope}/providers/Microsoft.Authorization/roleDefinitions/{guid}
  // This is the value an AzureRoleAssignment's role_definition_id field
  // consumes -- reference it to grant this custom role to a principal.
  string role_definition_id = 1;

  // The definition's GUID resource name -- either the pinned
  // spec.role_definition_id or the GUID generated at deploy time. With the
  // scope, it uniquely identifies the definition in the authorization API.
  string role_definition_guid = 2;

  // The role's display name as deployed (the tenant-unique name operators
  // see in the portal's role picker).
  string role_name = 3;

  // The scope the definition was created at, as resolved at deploy time.
  string scope = 4;

  // The assignable scopes Azure recorded for the definition. Carries what
  // was actually applied -- when the spec omitted assignable_scopes, this
  // holds the provider-defaulted value (the definition's own scope).
  repeated string assignable_scopes = 5;
}
