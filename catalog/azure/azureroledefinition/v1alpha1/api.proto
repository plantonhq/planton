syntax = "proto3";

package dev.planton.azure.azureroledefinition.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureroledefinition/v1alpha1/outputs.proto";
import "catalog/azure/azureroledefinition/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureRoleDefinition is the top-level API resource for a custom Azure RBAC
// role -- a named, reusable bundle of permissions. It is modeled as a
// first-class composable resource so the roles an organization defines, the
// assignments that grant them, and the resources they protect are independent
// nodes in an environment's graph.
message AzureRoleDefinition {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureRoleDefinition'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureRoleDefinitionSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureRoleDefinitionStatus status = 5;
}

// AzureRoleDefinitionStatus holds the deployment status and outputs.
message AzureRoleDefinitionStatus {
  // outputs
  AzureRoleDefinitionOutputs outputs = 1;
}
