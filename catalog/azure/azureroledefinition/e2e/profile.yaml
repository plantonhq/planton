apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azureroledefinition
spec:
  # Composed live proof: the harness deploys the fixture resource group
  # (registry prerequisite), creates a custom role definition scoped at it,
  # verifies the definition via the authorization API (GetByID on the
  # fully-scoped ARM id), destroys it, and verifies it is gone -- on both
  # provisioners. Role definitions are free; the destroy phase dominates the
  # runtime because Azure deletes them with eventual consistency (the provider
  # polls for consecutive not-found responses, ~4 minutes).
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
