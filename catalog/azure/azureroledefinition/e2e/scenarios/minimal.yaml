# Minimal AzureRoleDefinition scenario: define a custom role scoped at the
# fixture resource group with a single harmless control-plane read action.
#
# The scope reference resolves against the registry prerequisite's captured
# outputs through the field's default kind (AzureResourceGroup -> the fixture
# RG's ARM id), keeping the scenario fully registry-driven -- no literal
# subscription ids. Resource-group-scoped creation is a first-class azurerm
# path (its own acceptance suite exercises it) and confines the role to the
# ephemeral fixture's blast radius.
#
# The role name is deliberately distinctive: custom role names are unique per
# Azure AD tenant, so a generic name could collide with leftovers from an
# earlier failed teardown and mask real failures. assignable_scopes is
# omitted to exercise Azure's server-side defaulting (assignable = [scope]),
# which the verifier implicitly confirms by finding the definition at the
# fixture scope.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureRoleDefinition
metadata:
  name: planton-oss-e2e-azureroledefinition-smoke
  id: planton-oss-e2e-azureroledefinition-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureroledefinition
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  name: planton-oss-e2e-smoke-rg-reader
  scope:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  description: Planton E2E smoke custom role (read resource-group metadata only)
  permissions:
    - actions:
        - Microsoft.Resources/subscriptions/resourceGroups/read
