apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurecontainerregistry
spec:
  # The harness deploys the fixture resource group (registry prerequisite),
  # creates a Standard registry with the admin account on (exercising the
  # credential outputs), verifies it via the ARM API (generic GetByID on
  # the registry's ARM id), destroys it, and verifies it is gone -- on both
  # provisioners. Premium-only features (geo-replication, network rules,
  # CMK) are proven offline: a live geo-replicated run replicates real
  # storage across regions and adds cost/time without exercising any
  # additional module seam.
  #
  # Live-proven on both engines against azurerm 5 (2026-08-11): the v5
  # treatment (service-retired trust policy removed from the spec;
  # geo-replication routing renamed to global_endpoint_routing_enabled,
  # Required in v5, same ARM property) deploys, verifies, and destroys
  # cleanly. The smoke scenario is Standard-tier, so replica behavior
  # under the renamed routing field remains offline-proven with the
  # other Premium-only arms (deliberate -- see above).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
