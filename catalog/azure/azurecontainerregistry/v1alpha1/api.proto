syntax = "proto3";

package dev.planton.azure.azurecontainerregistry.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurecontainerregistry/v1alpha1/outputs.proto";
import "catalog/azure/azurecontainerregistry/v1alpha1/spec.proto";
import "shared/metadata.proto";

// azure-container-registry
message AzureContainerRegistry {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureContainerRegistry'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  AzureContainerRegistrySpec spec = 4 [(buf.validate.field).required = true];

  //status
  AzureContainerRegistryStatus status = 5;
}

// azure-container-registry status
message AzureContainerRegistryStatus {
  //outputs
  //  azure-container-registry outputs
  AzureContainerRegistryOutputs outputs = 1;
}
