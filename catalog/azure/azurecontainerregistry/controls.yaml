# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azurecontainerregistry
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: All registry content -- images, manifests, artifacts -- is encrypted at rest with platform-managed keys on every SKU tier; it cannot be disabled.
    - control_id: enc-at-rest-cmk
      status: configurable
      field_path: encryption
      evidence:
        type: spec_default
        reference: Unset means platform-managed keys; the encryption block (Premium-only) wraps the registry's data with a Key Vault key you own -- key_vault_key_id names the key, identity_client_id names the user-assigned identity that unwraps it.
      notes: The identity must hold get/wrapKey/unwrapKey on the vault before the registry is created -- a vault-side grant outside this manifest.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The registry's endpoints serve TLS only -- every docker push, pull, and login rides HTTPS; there is no plaintext listener to enable or disable.
    - control_id: no-public-access
      status: configurable
      field_path: public_network_access_enabled
      evidence:
        type: spec_default
        reference: Default true -- the registry's login server answers the internet (subject to network rules); false closes the public endpoint entirely, leaving private endpoints as the only path (Premium).
      notes: anonymous_pull_enabled is the sharper edge of the same surface -- it lets ANYONE pull without credentials, and stays false in every preset.
    - control_id: restricted-ingress
      status: configurable
      field_path: network_rule_set
      evidence:
        type: spec_default
        reference: Unset means the public endpoint accepts any source; a rule set with default_action DENY plus ip_rules allowlists exact CIDRs (Premium-only). network_rule_bypass_option decides whether trusted Azure services skip the rules.
      notes: The 03-premium-network-restricted preset is exactly this posture -- DENY with office and CI CIDRs, plus data_endpoint_enabled for allowlistable egress.
    - control_id: edge-protection
      status: not_applicable
      notes: The registry API is a managed Azure endpoint -- there is no WAF attachment point, and none is idiomatic for a docker registry; source restriction (network rules, private endpoints) is the available hardening, covered by the two controls above.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Management-plane operations are authorized by Azure RBAC unconditionally, and the data plane's own verbs -- push, pull, delete, sign -- are Entra-governed roles (AcrPush, AcrPull, AcrDelete) unless the admin user or anonymous pull deliberately bypasses them.
    - control_id: workload-identity
      status: configurable
      field_path: identity
      evidence:
        type: spec_default
        reference: Unset means the registry holds no platform identity; a SYSTEM_ASSIGNED or USER_ASSIGNED identity is how the registry itself reaches other services without stored secrets -- the CMK identity being the concrete case in this spec.
      notes: Pull-side workload identity (AcrPull granted to a consumer's managed identity) lives on the consumer's manifest, not here.
    - control_id: no-legacy-auth
      status: configurable
      field_path: admin_user_enabled
      evidence:
        type: spec_default
        reference: Default false. The admin user is the registry's legacy credential -- one shared username with two static passwords and full push/pull power, unauditable per person. Entra identities and scoped tokens are the modern path; every preset keeps it off.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every management-plane action on the registry lands in the Azure Activity Log unconditionally. Data-plane trails -- who pushed, who pulled, login events -- are emitted as resource logs and need a diagnostic setting to a workspace to be retained.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Platform metrics -- pull counts, push counts, storage used -- flow to Azure Monitor for every registry with no configuration; repository event logs need a diagnostic setting, composed outside this manifest.
    - control_id: backup-recovery
      status: not_applicable
      notes: Registry content is rebuildable build output, and the API offers no backup facility; geo-replication (georeplications) is availability, not backup -- a bad push replicates everywhere. Recovery is re-pushing from CI or a second registry fed by the same pipeline.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: With no backup facility there is no backup retention here. retention_policy_in_days is a different animal -- it PURGES untagged manifests to cap storage growth, the opposite of retaining.
    - control_id: multi-zone-ha
      status: configurable
      field_path: zone_redundancy_enabled
      evidence:
        type: spec_default
        reference: Default false; true spreads the Premium registry's data across availability zones in its home region, and each georeplications entry carries its own zone_redundancy_enabled for the replica's region.
      notes: Geo-replication is the wider form of the same posture -- regional resilience plus network-local pulls per region.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither the registry API nor this spec offers a deletion-protection flag; Azure resource locks are subscription-side governance outside the manifest. export_policy_enabled governs artifact export, not registry deletion.
    - control_id: managed-patching
      status: not_applicable
      notes: A fully managed PaaS -- Azure patches the registry service; there is no customer-visible OS or runtime to patch and no patch field to configure.
