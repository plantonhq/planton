# Least-privilege permissions the IaC runner's Azure principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: azuremachinelearningonlineendpoint
spec:
  azure:
    groups:
      - purpose: ManageOnlineEndpoint
        actions:
          - Microsoft.MachineLearningServices/workspaces/onlineEndpoints/read
          - Microsoft.MachineLearningServices/workspaces/onlineEndpoints/write
          - Microsoft.MachineLearningServices/workspaces/onlineEndpoints/delete
        provenance: derived
        notes: Covers the azapi_resource at Microsoft.MachineLearningServices/workspaces/onlineEndpoints@2025-06-01 -- create and every update travel as a full PUT (write; the traffic and mirror_traffic dials update in place), refresh reads the endpoint (the exported scoringUri/swaggerUri come from the same read), and destroy deletes it. Bring-your-own Key-mode keys ride the same write as a sensitive_body overlay -- merged into the PUT, never stored in state, never read back -- so the namespace's onlineendpoints/listkeys action is deliberately NOT granted (the module never lists keys; operators retrieve service-minted keys out of band). The parent workspace is addressed by the ARM ID resolved from workspace_id (azapi's parent_id) and is never read; azapi's schema validation runs locally against its embedded ARM schemas. Held via Contributor on the workspace's resource group or an AzureML custom role carrying these verbs.
