apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurevirtualnetwork
spec:
  # Composed live proof: the harness deploys the fixture resource group
  # (registry prerequisite), creates a multi-CIDR virtual network with a
  # raised flow timeout and user tags in it, verifies the network via the
  # ARM API (generic GetByID on the network's ARM id), destroys it, and
  # verifies it is gone -- on both provisioners. Virtual networks are free
  # and fast to create/delete.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
