syntax = "proto3";

package dev.planton.azure.azurevirtualnetwork.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurevirtualnetwork/v1alpha1/outputs.proto";
import "catalog/azure/azurevirtualnetwork/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureVirtualNetwork is the top-level API resource for an Azure Virtual
// Network: the isolated private address space every network-attached Azure
// workload lives inside. It is modeled as a first-class composable resource
// so the network, its subnets (AzureSubnet), its outbound gateway
// (AzureNatGateway), and its private DNS attachments
// (AzurePrivateDnsZoneVirtualNetworkLink) are independent nodes in an
// environment's graph.
message AzureVirtualNetwork {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzureVirtualNetwork".
  string kind = 2 [(buf.validate.field).string.const = 'AzureVirtualNetwork'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Virtual network specification.
  AzureVirtualNetworkSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzureVirtualNetworkStatus status = 5;
}

// AzureVirtualNetworkStatus holds the deployment outputs.
message AzureVirtualNetworkStatus {
  // Outputs from the IaC deployment.
  AzureVirtualNetworkOutputs outputs = 1;
}
