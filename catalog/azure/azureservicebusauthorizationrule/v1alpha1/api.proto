syntax = "proto3";

package dev.planton.azure.azureservicebusauthorizationrule.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureservicebusauthorizationrule/v1alpha1/outputs.proto";
import "catalog/azure/azureservicebusauthorizationrule/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureServiceBusAuthorizationRule is the top-level API resource for a
// Service Bus SAS credential: listen/send/manage rights scoped to exactly
// one of a namespace, queue, or topic. Its keys and connection strings
// surface as sensitive outputs -- the least-privilege alternative to the
// namespace's root key, and the credential seam Service Bus consumers
// reference.
message AzureServiceBusAuthorizationRule {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureServiceBusAuthorizationRule'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureServiceBusAuthorizationRuleSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureServiceBusAuthorizationRuleStatus status = 5;
}

// AzureServiceBusAuthorizationRuleStatus holds the deployment status and
// outputs.
message AzureServiceBusAuthorizationRuleStatus {
  // outputs
  AzureServiceBusAuthorizationRuleOutputs outputs = 1;
}
