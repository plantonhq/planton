# Dedicated namespace for the NAMESPACE-scope authorization rule
# scenario. Each scenario carries its own distinctly-named namespace
# (globally unique names + the post-delete hold).
apiVersion: azure.planton.dev/v1alpha1
kind: AzureServiceBusNamespace
metadata:
  name: planton-oss-e2e-sbauth-ns-fixture-namespace
  id: planton-oss-e2e-sbauth-ns-fixture-namespace
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureservicebusnamespace
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  namespaceName: pltn-oss-e2e-sbauthn-fx
  sku: STANDARD
