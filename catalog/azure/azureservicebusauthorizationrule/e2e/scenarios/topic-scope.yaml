# Topic-scope dispatch path: a send-only rule on one topic, through the
# namespace -> topic fixture chain -- proving the topic-scoped provider
# resource and the single-right minimum.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureServiceBusAuthorizationRule
metadata:
  name: planton-oss-e2e-sbauth-topicscope
  id: planton-oss-e2e-sbauth-topicscope
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureservicebusauthorizationrule
  annotations:
    planton.dev/e2e: "true"
    # Namespace then topic, in deploy order.
    planton.dev/e2e-prerequisites: "catalog/azure/azureservicebusauthorizationrule/e2e/fixture-namespace-topicscope.yaml, catalog/azure/azureservicebusauthorizationrule/e2e/fixture-topic.yaml"
  tags:
    - planton-e2e
spec:
  ruleName: e2e-publisher
  topicId:
    valueFrom:
      name: planton-oss-e2e-sbauth-fixture-topic
  send: true
