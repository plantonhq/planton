# Namespace-scope dispatch path: a listen+send rule covering the whole
# scenario-local namespace -- proving the namespace-scoped provider
# resource, the rights pair, and the six credential outputs.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureServiceBusAuthorizationRule
metadata:
  name: planton-oss-e2e-sbauth-nsscope
  id: planton-oss-e2e-sbauth-nsscope
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureservicebusauthorizationrule
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "catalog/azure/azureservicebusauthorizationrule/e2e/fixture-namespace-nsscope.yaml"
  tags:
    - planton-e2e
spec:
  ruleName: e2e-app-listener
  namespaceId:
    valueFrom:
      name: planton-oss-e2e-sbauth-ns-fixture-namespace
  listen: true
  send: true
