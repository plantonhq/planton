apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azureservicebusauthorizationrule
spec:
  # THREE scenarios -- one per dispatch path. The kind's scope XOR
  # selects between three different provider resources
  # (namespace/queue/topic authorization rules), and each path is
  # separate module code, so each gets its own live proof: the
  # namespace-scope rule (listen+send) on a scenario-local namespace;
  # the queue-scope rule (full manage trio) through a namespace -> queue
  # chain; the topic-scope rule (send-only) through a namespace -> topic
  # chain. Each scenario's namespace carries a distinct globally-unique
  # name. Rules create in seconds; the namespace fixtures dominate.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 45
