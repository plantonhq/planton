# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azureservicebusauthorizationrule
spec:
  billing_model: free
  free_tier: An authorization rule is pure configuration -- a named SAS credential with listen/send/manage rights scoped to a namespace, one queue, or one topic. Azure has no meter for Service Bus rules; creating, holding, or rotating them costs nothing at any scope.
  notes: "No field of this spec buys anything: the scope references (namespace_id, queue_id, or topic_id) point at resources billed as their own catalog kinds, and the listen/send/manage booleans only shape what the credential may do. The traffic a rule's connection strings carry is metered on the AzureServiceBusNamespace at the root of whichever scope is chosen -- per-million operations on BASIC, the base charge plus operations and brokered connections on STANDARD, the flat daily messaging-unit rate on PREMIUM -- the same whether clients authenticate with this rule's SAS keys or with Entra identities."
