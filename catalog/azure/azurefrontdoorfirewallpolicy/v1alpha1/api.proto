syntax = "proto3";

package dev.planton.azure.azurefrontdoorfirewallpolicy.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurefrontdoorfirewallpolicy/v1alpha1/outputs.proto";
import "catalog/azure/azurefrontdoorfirewallpolicy/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureFrontDoorFirewallPolicy is the top-level API resource for a Web
// Application Firewall policy for Azure Front Door -- the edge rule set
// (custom match/rate-limit rules, Microsoft's managed rule sets, log
// scrubbing) that an AzureFrontDoorSecurityPolicy associates with a
// profile's domains. Global and resource-group-scoped; one policy is
// commonly shared by many profiles.
message AzureFrontDoorFirewallPolicy {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureFrontDoorFirewallPolicy'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureFrontDoorFirewallPolicySpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureFrontDoorFirewallPolicyStatus status = 5;
}

// AzureFrontDoorFirewallPolicyStatus holds the deployment status and outputs.
message AzureFrontDoorFirewallPolicyStatus {
  // outputs
  AzureFrontDoorFirewallPolicyOutputs outputs = 1;
}
