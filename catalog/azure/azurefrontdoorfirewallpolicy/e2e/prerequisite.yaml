# AzureFrontDoorFirewallPolicy install profile used as a prerequisite
# by composed kinds (AzureFrontDoorSecurityPolicy, declared via
# prerequisites in the kind registry). The harness deploys this policy
# after the fixture resource group, then resolves the security policy's
# firewall_policy_id reference against its firewall_policy_id output.
# STANDARD deliberately: the fixture profile is Standard and Azure
# requires the skus to match at association time. Policy names are
# resource-group-scoped (no global-uniqueness hazard), so a shared
# fixture recreates cleanly per scenario.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureFrontDoorFirewallPolicy
metadata:
  name: planton-oss-e2e-fd-waf-prereq
  id: planton-oss-e2e-fd-waf-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurefrontdoorfirewallpolicy
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  policyName: plantonosse2ewafprereq
  sku: STANDARD
  mode: PREVENTION
  customRules:
    - name: fixtureblock
      priority: 10
      ruleType: MATCH_RULE
      action: BLOCK
      matchConditions:
        - matchVariable: SOCKET_ADDR
          operator: IP_MATCH
          matchValues: [203.0.113.0/24]
