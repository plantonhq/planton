apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurefrontdoorfirewallpolicy
spec:
  # The harness deploys the fixture resource group, creates the WAF
  # policy (both scenarios: the STANDARD custom-rules smoke and the
  # PREMIUM managed-rules/scrubbing depth run), verifies it via the ARM
  # API, destroys it, and verifies it is gone -- on both provisioners.
  # The policy is resource-group-scoped (no Front Door profile fixture),
  # so runs avoid the family's ~18-minute profile-delete tax: observed
  # 2-3 min per scenario per engine (minimal 168s/161s, premium
  # 124s/149s).
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
