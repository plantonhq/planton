syntax = "proto3";

package dev.planton.azure.azurecontainerinstance.v1alpha1;

import "catalog/azure/azurecontainerinstance/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureContainerInstanceIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureContainerInstanceIacInput {
  // The container group resource to deploy.
  AzureContainerInstance target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
