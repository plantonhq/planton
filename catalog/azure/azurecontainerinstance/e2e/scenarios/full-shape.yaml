# Full-shape scenario: every secret-bearing surface and the write-only
# read-back class live in one lane -- an init container seeding a
# shared empty_dir scratch volume, an Azure File volume on the fixture
# share (account name + key from the fixture storage account's
# outputs), secure environment variables, both probe forms, Log
# Analytics diagnostics on the fixture workspace (customer GUID +
# shared key -- both write-only against ARM), and a system-assigned
# identity. The share and workspace chains arrive through their kinds'
# install profiles declared below (the share transitively chains the
# fixture storage account). Bills per second -- effectively free.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureContainerInstance
metadata:
  name: planton-oss-e2e-azurecontainerinstance-full
  id: planton-oss-e2e-azurecontainerinstance-full
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurecontainerinstance
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "AzureStorageShare, AzureLogAnalyticsWorkspace"
    # Write-only ForceNew secrets (the secure env var) make a
    # zero-change round-trip structurally impossible: the blind import
    # lacks the secret, the config supplies it, and the only plan is a
    # replace -- which the oracle rightly refuses and ignore_changes
    # must never paper over (rotating the secret SHOULD replace the
    # group). The recipes prove on the secret-free minimal and
    # private-subnet scenarios.
    planton.dev/e2e-import-roundtrip-skip: >-
      write-only ForceNew secrets (secure env vars) plan a one-time
      replace after any import; recipes are proven by the secret-free
      scenarios
  tags:
    - planton-e2e
spec:
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-aci-full-${E2E_RUN_ID}
  region: eastus
  osType: Linux
  identity:
    type: SYSTEM_ASSIGNED
  initContainers:
    - name: seed
      image: mcr.microsoft.com/cbl-mariner/busybox:2.0
      commands: ["sh", "-c", "echo ready > /work/ready"]
      volumes:
        - name: work
          mountPath: /work
          emptyDir: true
  containers:
    - name: web
      image: mcr.microsoft.com/azuredocs/aci-helloworld:latest
      cpu: 0.5
      memory: 1
      ports:
        - port: 80
      environmentVariables:
        APP_MODE: e2e
      # A dummy value proving the write-only wire path -- Azure never
      # returns it on reads (the import round-trip expects its absence).
      secureEnvironmentVariables:
        E2E_TOKEN: planton-e2e-not-a-secret
      volumes:
        # The SAME empty_dir name as the init container's -- one shared
        # scratch volume (the sharing mechanism).
        - name: work
          mountPath: /work
          emptyDir: true
        # The persistent form: the fixture share, addressed by the
        # fixture storage account's name + key outputs (the key is
        # write-only against ARM).
        - name: content
          mountPath: /content
          azureFile:
            shareName:
              valueFrom:
                name: planton-oss-e2e-azure-fixture-share
            storageAccountName:
              valueFrom:
                name: planton-oss-e2e-azure-fixture-sa
            storageAccountKey:
              valueFrom:
                name: planton-oss-e2e-azure-fixture-sa
      livenessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 30
        failureThreshold: 3
      readinessProbe:
        exec: ["ls", "/work/ready"]
        initialDelaySeconds: 5
  diagnosticsLogAnalytics:
    workspaceId:
      valueFrom:
        name: planton-oss-e2e-azure-fixture-law
    workspaceKey:
      valueFrom:
        name: planton-oss-e2e-azure-fixture-law
    # ContainerInsights, never ContainerInstanceLogs: the provider
    # always attaches a metadata object alongside a log type and ARM
    # rejects metadata for ContainerInstanceLogs
    # (LogAnalyticsMetadataNotAllowed, live-proven) -- a CEL now blocks
    # that value. Insights allows metadata, so the entry below also
    # proves the metadata wire path. Keys are a CLOSED ARM vocabulary
    # (pod-uuid / cluster-resource-id / node-name -- live-proven,
    # InvalidLogAnalyticsMetadataKeys); values are free.
    logType: ContainerInsights
    metadata:
      node-name: planton-e2e

