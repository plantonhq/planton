apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurevirtualnetworkgateway
spec:
  # Live-proven 2026-08-11 on both engines (full lifecycle; measured
  # create 34-36m, destroy 14-15m, ~60m per engine lane) plus the blind
  # import round-trip on the terraform lane -- the gateway by ARM id AND
  # the NAT-rule child by its composed {gateway_id}/natRules/{name} id,
  # zero-change plan, destroy from re-imported state. The live lanes
  # forced the SKU redesign to the AZ tiers (Azure retired non-AZ VpnGw
  # creates: NonAzSkusNotAllowedForVPNGateway) and the zone-redundant
  # fixture public IP (VmssVpnGatewayPublicIpsMustHaveZonesConfigured).
  # The slowest class in the suite -- the timeout budgets a full cycle
  # with headroom for a slow region day. VpnGw1AZ keeps spend trivial
  # (~$0.2-0.4/hour while the lane runs).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 90
