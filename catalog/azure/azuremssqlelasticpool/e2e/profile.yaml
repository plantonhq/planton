apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azuremssqlelasticpool
spec:
  # The harness deploys the fixture resource group and the fixture logical
  # server (registry prerequisite chain), creates the pool, verifies it via
  # the ARM API (generic GetByID on the pool's ARM id), destroys it, and
  # verifies it is gone -- on both provisioners. Pools create in ~2-4
  # minutes.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 35
