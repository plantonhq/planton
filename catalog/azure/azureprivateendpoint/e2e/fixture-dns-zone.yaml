# The private DNS zone the endpoint registers its IP into via the DNS zone
# group -- the blob privatelink zone. Private DNS zones are global (no
# region). The zone need not be VNet-linked for the DNS zone group to
# register A records against it, so this fixture is just the zone.
apiVersion: azure.planton.dev/v1alpha1
kind: AzurePrivateDnsZone
metadata:
  name: planton-oss-e2e-pe-blob-zone
  id: planton-oss-e2e-pe-blob-zone
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureprivatednszone
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: privatelink.blob.core.windows.net
