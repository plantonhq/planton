# Composed AzurePrivateEndpoint scenario: an endpoint into the fixture
# subnet connecting to a scenario-local storage account's blob endpoint,
# with a private DNS zone group registering the endpoint IP in the blob
# privatelink zone.
#
# The subnet is the registry prerequisite (bringing the virtual network and
# resource group). The storage account (the polymorphic connection target)
# and the private DNS zone are scenario-local extra fixtures -- both carry
# globally-unique names, so they live in the scenario, not shared
# prerequisites. This proves: the subnet FK, the polymorphic connection
# target reference (explicit kind + fieldPath, since the target is
# polymorphic and has no default_kind), the sub-resource wiring, and the DNS
# zone group seam -- the private_endpoint_id and private_ip_address outputs
# must populate on both engines.
apiVersion: azure.planton.dev/v1alpha1
kind: AzurePrivateEndpoint
metadata:
  name: planton-oss-e2e-azureprivateendpoint-smoke
  id: planton-oss-e2e-azureprivateendpoint-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureprivateendpoint
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "catalog/azure/azureprivateendpoint/e2e/fixture-target-account.yaml,catalog/azure/azureprivateendpoint/e2e/fixture-dns-zone.yaml"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-pe-smoke
  subnetId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-subnet
  privateServiceConnection:
    privateConnectionResourceId:
      valueFrom:
        kind: AzureStorageAccount
        name: planton-oss-e2e-pe-target-account
        fieldPath: status.outputs.storage_account_id
    subresourceNames:
      - blob
  privateDnsZoneIds:
    - valueFrom:
        name: planton-oss-e2e-pe-blob-zone
  tags:
    e2e-suite: azure
    purpose: smoke
