# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azureprivateendpoint
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A private endpoint is a network interface and a tunnel entrance -- it stores no customer data at rest.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to encrypt (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: The endpoint moves packets; whether TLS rides them is decided by the client and the target service, never by any field here. Private Link keeps the traffic on the Microsoft backbone -- off the public internet -- but that is a routing guarantee, not stream encryption.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The endpoint's network interface carries only a private address drawn from the referenced subnet -- the resource is unreachable from the public internet by construction, and its read-only NIC cannot be given a public IP.
      notes: This shields the PATH, not the target -- the target service's own public endpoint stays open unless disabled service-side on that component. The per-sub-resource mapping (subresource_names) is the exfiltration boundary Private Link adds on top.
    - control_id: restricted-ingress
      status: configurable
      field_path: application_security_group_ids
      evidence:
        type: spec_default
        reference: Empty joins no application security group; entries join the endpoint's network interface to each referenced group so NSG rules can govern traffic to the endpoint by workload group instead of by IP.
      notes: NSG rules apply to private-endpoint traffic only when the referenced subnet has private-endpoint network policies enabled -- a switch on the AzureSubnet component, historically off by default. The rules themselves live on AzureNetworkSecurityGroup components, deliberately outside this manifest.
    - control_id: edge-protection
      status: not_applicable
      notes: A private tunnel entrance offers no request-filtering attachment point -- WAF is composed on HTTP-aware tiers (Application Gateway, Front Door), and private-endpoint traffic already bypasses the public edge entirely.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every management-plane operation is authorized by Azure RBAC unconditionally, and the connection handshake itself is RBAC-arbitrated -- the connection auto-approves only when the deploying principal holds privateEndpointConnectionsApproval rights on the TARGET resource; otherwise the target's owner must approve it manually (is_manual_connection).
    - control_id: workload-identity
      status: not_applicable
      notes: The endpoint runs no workloads and holds no credentials of its own.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths of its own -- authentication happens at the target service the tunnel reaches.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Control-plane events (creation, connection approval, deletion) land in the Azure Activity Log as subscription-level posture; the endpoint itself sees no data-plane access events to audit -- those belong to the target service's own logs.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Azure publishes private-endpoint platform metrics -- bytes in and bytes out through the endpoint -- to Azure Monitor for every endpoint with no configuration.
    - control_id: backup-recovery
      status: not_applicable
      notes: Nothing to back up -- the endpoint is connectivity, recreated declaratively. The caveat worth knowing is that recreation draws a DIFFERENT dynamic address from the subnet; deployments whose firewall allowlists or externally-managed DNS must survive recreation pin addresses through ip_configurations.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Private endpoints are zone-agnostic -- Microsoft's Private Link FAQ states an availability-zone failure in the endpoint's region does not affect the endpoint's availability, with no configuration and no way to pin one zone.
      notes: End-to-end zone resilience also requires the TARGET service to be zone-resilient -- a decision on that component, not this one.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither the API nor this spec offers a deletion-protection flag; Azure resource locks are subscription-side governance outside the manifest. Deletion removes only the private path -- the target service and its data are untouched, but clients resolving through the zone group lose their private answer.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- Microsoft operates the Private Link platform; no customer-visible patch surface exists.
