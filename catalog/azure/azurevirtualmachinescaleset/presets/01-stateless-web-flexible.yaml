apiVersion: azure.planton.dev/v1alpha1
kind: AzureVirtualMachineScaleSet
metadata:
  name: my-web-fleet
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: <your-fleet-name>
  # FLEXIBLE orchestration applies by default -- Azure's recommendation
  # for new workloads.
  skuName: Standard_D2s_v3
  instances: 3
  # 1 fault domain: zones (or a small fleet) are the resilience unit.
  platformFaultDomainCount: 1
  osProfile:
    computerNamePrefix: web
    linux:
      adminUsername: azureuser
      sshPublicKeys:
        - publicKey: "<your-ssh-public-key>"
  osDisk:
    caching: READ_ONLY
    storageAccountType: PREMIUM_LRS
    # Ephemeral OS disk: free, fast, wiped on stop/reimage -- the
    # natural fit for a stateless, image-driven fleet.
    diffDiskSettings:
      placement: CACHE_DISK
  sourceImageReference:
    publisher: Canonical
    offer: ubuntu-24_04-lts
    sku: server
    version: latest
  networkInterfaces:
    - name: primary
      primary: true
      acceleratedNetworkingEnabled: true
      ipConfigurations:
        - name: internal
          primary: true
          subnetId:
            value: "<subnet-resource-id>"
          # Join the load balancer's pool by its name-keyed map output:
          # every instance receives the LB's traffic.
          loadBalancerBackendAddressPoolIds:
            - value: "<load-balancer-backend-pool-id>"
  # The health extension: rolling upgrades and instance repair key on it.
  extensions:
    - name: health
      publisher: Microsoft.ManagedServices
      type: ApplicationHealthLinux
      typeHandlerVersion: "1.0"
      settings: '{"protocol":"http","port":80,"requestPath":"/healthz"}'
  upgradePolicy:
    mode: ROLLING
    rolling:
      maxBatchInstancePercent: 20
      maxUnhealthyInstancePercent: 20
      maxUnhealthyUpgradedInstancePercent: 20
      pauseTimeBetweenBatches: PT30S
      prioritizeUnhealthyInstancesEnabled: true
  automaticInstanceRepair:
    enabled: true
    gracePeriod: PT30M
  terminationNotification:
    timeout: PT10M
  bootDiagnostics:
    enabled: true
  zones: ["1", "2", "3"]
