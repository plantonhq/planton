apiVersion: azure.planton.dev/v1alpha1
kind: AzureVirtualMachineScaleSet
metadata:
  name: my-windows-fleet
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: <your-fleet-name>
  # UNIFORM: the classic large-fleet mode -- required here for
  # automatic OS image upgrades and the LB health probe.
  orchestrationMode: UNIFORM
  skuName: Standard_D2s_v3
  instances: 3
  osProfile:
    # Windows computer names cap at 15 characters including the
    # per-instance suffix -- keep the prefix short.
    computerNamePrefix: winweb
    windows:
      adminUsername: azureadmin
      adminPassword:
        value: "<admin-password>"
      # Azure Hybrid Benefit: bring an existing Windows Server license.
      licenseType: WINDOWS_SERVER
  osDisk:
    caching: READ_WRITE
    storageAccountType: PREMIUM_LRS
  sourceImageReference:
    publisher: MicrosoftWindowsServer
    offer: WindowsServer
    sku: 2022-datacenter-azure-edition
    # With automatic OS upgrades below, "latest" keeps the fleet on new
    # image releases -- Azure rolls them batch by batch.
    version: latest
  networkInterfaces:
    - name: primary
      primary: true
      ipConfigurations:
        - name: internal
          primary: true
          subnetId:
            value: "<subnet-resource-id>"
          loadBalancerBackendAddressPoolIds:
            - value: "<load-balancer-backend-pool-id>"
  upgradePolicy:
    mode: ROLLING
    rolling:
      maxBatchInstancePercent: 20
      maxUnhealthyInstancePercent: 20
      maxUnhealthyUpgradedInstancePercent: 20
      pauseTimeBetweenBatches: PT1M
    # UNIFORM-only: Azure rolls new OS image versions automatically,
    # gated by the health probe.
    automaticOsUpgrade:
      enabled: true
    # UNIFORM-only: instance health from the load balancer's probe.
    healthProbeId:
      value: "<load-balancer-probe-id>"
  automaticInstanceRepair:
    enabled: true
    gracePeriod: PT30M
  bootDiagnostics:
    enabled: true
  zones: ["1", "2", "3"]
  zoneBalance: true
