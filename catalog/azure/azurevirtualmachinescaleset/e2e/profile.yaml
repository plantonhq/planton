apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurevirtualmachinescaleset
spec:
  # The harness deploys the fixture chain (resource group -> virtual
  # network -> subnet, via the registry prerequisites) and proves BOTH
  # orchestration modes -- each scenario creates a one-instance
  # burstable Linux fleet (FLEXIBLE regional with fault-domain count 1;
  # UNIFORM without overprovisioning), verifies it via the ARM API
  # (generic GetByID on the scale set's ARM id, mode-agnostic), destroys
  # it, and verifies it is gone, on both provisioners. Instance
  # provisioning makes these the suite's slower runs.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 40
