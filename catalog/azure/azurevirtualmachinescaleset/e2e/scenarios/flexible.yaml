# FLEXIBLE-orchestration scenario: a one-instance burstable Linux fleet
# in the fixture subnet -- the mode Azure recommends for new workloads
# and this component's default. Regional spreading with fault-domain
# count 1 (the zonal-or-minimal contract), SSH-key auth, and a
# managed-storage boot-diagnostics block. The throwaway public key
# exists only so ARM accepts the profile; it grants access to nothing.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureVirtualMachineScaleSet
metadata:
  name: planton-oss-e2e-azurevirtualmachinescaleset-flexible
  id: planton-oss-e2e-azurevirtualmachinescaleset-flexible
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: azurevirtualmachinescaleset
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-vmss-flex
  skuName: Standard_B2s
  instances: 1
  platformFaultDomainCount: 1
  osProfile:
    computerNamePrefix: e2eflex
    linux:
      adminUsername: azureuser
      sshPublicKeys:
        - publicKey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBvUEIH5UU/EzaIyRcGhmQNt63nyi+zWgfzYFElbfxVd
  osDisk:
    caching: READ_WRITE
    storageAccountType: STANDARD_LRS
  sourceImageReference:
    publisher: Canonical
    offer: ubuntu-24_04-lts
    sku: server
    version: latest
  networkInterfaces:
    - name: primary
      primary: true
      ipConfigurations:
        - name: internal
          primary: true
          subnetId:
            valueFrom:
              name: planton-oss-e2e-azure-fixture-subnet
  bootDiagnostics:
    enabled: true
  tags:
    e2e-suite: azure
    purpose: flexible-smoke
