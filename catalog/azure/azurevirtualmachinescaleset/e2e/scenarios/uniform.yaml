# UNIFORM-orchestration scenario: a one-instance burstable Linux fleet
# in the fixture subnet, exercising the classic-mode dispatch branch and
# two UNIFORM-only capabilities (overprovision off, oldest-first
# scale-in policy). The throwaway public key exists only so ARM accepts
# the profile; it grants access to nothing.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureVirtualMachineScaleSet
metadata:
  name: planton-oss-e2e-azurevirtualmachinescaleset-uniform
  id: planton-oss-e2e-azurevirtualmachinescaleset-uniform
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurevirtualmachinescaleset
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-vmss-uni
  orchestrationMode: UNIFORM
  skuName: Standard_B2s
  instances: 1
  osProfile:
    computerNamePrefix: e2euni
    linux:
      adminUsername: azureuser
      sshPublicKeys:
        - publicKey: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBvUEIH5UU/EzaIyRcGhmQNt63nyi+zWgfzYFElbfxVd
  osDisk:
    caching: READ_WRITE
    storageAccountType: STANDARD_LRS
  sourceImageReference:
    publisher: Canonical
    offer: ubuntu-24_04-lts
    sku: server
    version: latest
  networkInterfaces:
    - name: primary
      primary: true
      ipConfigurations:
        - name: internal
          primary: true
          subnetId:
            valueFrom:
              name: planton-oss-e2e-azure-fixture-subnet
  overprovision: false
  scaleIn:
    rule: OLDEST_VM
  tags:
    e2e-suite: azure
    purpose: uniform-smoke
