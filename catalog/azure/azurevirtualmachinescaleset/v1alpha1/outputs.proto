syntax = "proto3";

package dev.planton.azure.azurevirtualmachinescaleset.v1alpha1;

// **AzureVirtualMachineScaleSetOutputs** captures the outputs of
// provisioning an Azure Virtual Machine Scale Set.
//
// The scale set's ARM id is the seam a standalone AzureVirtualMachine's
// availability.virtual_machine_scale_set_id consumes (attaching an
// individually-managed VM to a FLEXIBLE set), and what monitoring and
// autoscale resources scope to. The system-assigned principal is the
// AzureRoleAssignment seam for granting the fleet access without stored
// credentials.
message AzureVirtualMachineScaleSetOutputs {
  // The Azure Resource Manager ID of the scale set.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Compute/virtualMachineScaleSets/{name}
  string scale_set_id = 1;

  // The name of the scale set.
  string scale_set_name = 2;

  // The scale set's globally unique ARM-assigned identifier.
  string unique_id = 3;

  // The system-assigned managed identity's principal (object) ID --
  // what AzureRoleAssignment grants reference. Empty unless the
  // identity type includes SYSTEM_ASSIGNED (UNIFORM sets only).
  string system_assigned_identity_principal_id = 4;
}
