syntax = "proto3";

package dev.planton.azure.azurevirtualmachinescaleset.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// **AzureVirtualMachineScaleSetSpec** defines the configuration for
// creating an Azure Virtual Machine Scale Set: a fleet of identical VMs
// managed as one resource -- the template (image, size, OS profile,
// disks, network), the fleet controls (instance count, zones, upgrade
// policy, spot economics, instance repair), and the orchestration mode.
//
// ARM has exactly ONE scale-set resource type with an orchestration-mode
// property, and this component models it that way:
// - FLEXIBLE (the default, and Azure's recommendation for new workloads)
//   spreads instances across fault domains like a resilient VM group;
//   individual VMs can even attach to the set (an AzureVirtualMachine's
//   availability.virtual_machine_scale_set_id). It carries per-OS patch
//   orchestration, mixed-SKU profiles, and spot/on-demand priority
//   mixing.
// - UNIFORM is the classic mode behind large stateless fleets: identical
//   instances, overprovisioning, automatic OS-image upgrades, spot
//   restore, scale-in policy, and gallery applications.
// Mode-specific capabilities are gated by validation, so the spec tells
// the truth about what each mode supports.
//
// The scale set is a template, so its network and data-disk shapes are
// deliberately INLINE (unlike the single VM, which references first-class
// NICs and disks): every instance stamps its own NIC and disks from the
// template, and they live and die with the instance. What IS shared is
// referenced: subnets, load-balancer backend pools (by the load
// balancer's name-keyed pool-ID outputs), NSGs, identities, and the
// rolling-upgrade health probe.
message AzureVirtualMachineScaleSetSpec {
  // The Azure region the scale set runs in, e.g. "eastus". Must match
  // the region of the referenced subnets and load balancer. Changing the
  // region replaces the scale set.
  string region = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // The Azure resource group the scale set will be created in. Can be a
  // literal resource-group name or a reference to an AzureResourceGroup's
  // name output.
  dev.planton.shared.foreignkey.v1.StringValueOrRef resource_group = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = AzureResourceGroup,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.resource_group_name"
  ];

  // The name of the scale set, unique within the resource group.
  // Instance computer names derive from computer_name_prefix (or this
  // name), so keep it short for Windows fleets (the 15-character
  // computer-name limit, minus the instance suffix). Changing the name
  // replaces the scale set.
  string name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 64
  ];

  // How the scale set orchestrates its instances. Unspecified applies
  // FLEXIBLE -- Azure's recommendation for new workloads. The mode is
  // fixed at creation and gates mode-specific capabilities (spec-level
  // validation tells you which).
  AzureVirtualMachineScaleSetOrchestrationMode orchestration_mode = 4;

  // The VM size every instance uses, e.g. "Standard_D2s_v3",
  // "Standard_B2s". On a FLEXIBLE scale set the special value "Mix"
  // activates sku_profile (mixed sizes with an allocation strategy).
  // Resizing updates in place and rolls instances per the upgrade
  // policy.
  string sku_name = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // The number of instances. Unset lets the platform manage the count --
  // right when an autoscaler owns it; set it for a fixed-size fleet.
  // 0-1000.
  optional int32 instances = 6 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];

  // FLEXIBLE + sku_name "Mix" only: the mixed VM sizes instances may use
  // and the strategy for picking among them -- the capacity-resilient
  // shape for spot fleets and constrained regions.
  AzureVirtualMachineScaleSetSkuProfile sku_profile = 7;

  // The operating-system profile: exactly one of `linux` or `windows`,
  // carrying the OS's authentication and OS-specific management surface
  // (SSH-first for Linux, password + WinRM/unattend for Windows, per-OS
  // patch vocabularies on FLEXIBLE sets).
  AzureVirtualMachineScaleSetOsProfile os_profile = 8 [(buf.validate.field).required = true];

  // The OS disk template every instance stamps. Inline by definition --
  // an instance's OS disk is born and dies with it.
  AzureVirtualMachineScaleSetOsDisk os_disk = 9 [(buf.validate.field).required = true];

  // Data-disk templates every instance stamps. Inline (template) disks,
  // unlike the single VM's referenced first-class disks: each instance
  // gets its own copies, created and deleted with the instance.
  repeated AzureVirtualMachineScaleSetDataDisk data_disks = 10;

  // Marketplace/platform image to boot from, by its four coordinates
  // (publisher/offer/sku/version). Exactly one image source: this or
  // source_image_id.
  AzureVirtualMachineScaleSetSourceImageReference source_image_reference = 11;

  // A custom or gallery image to boot from, by ARM ID (a managed image,
  // or a Shared Image Gallery image/version -- community and direct
  // shared gallery IDs included). Exactly one image source.
  string source_image_id = 12;

  // The network-interface templates every instance stamps -- at least
  // one; exactly one marked primary (the first, when several are
  // declared). Subnets, NSGs, load-balancer pools, and public IP
  // prefixes are referenced; the NICs themselves are per-instance
  // template stampings.
  repeated AzureVirtualMachineScaleSetNetworkInterface network_interfaces = 13 [(buf.validate.field).repeated.min_items = 1];

  // How instances receive template changes and OS image upgrades.
  // Leave unset for MANUAL (changes apply to new instances only).
  AzureVirtualMachineScaleSetUpgradePolicy upgrade_policy = 14;

  // Run the fleet on spot capacity: deeply discounted, evictable when
  // Azure needs the capacity back. Presence makes instances spot;
  // absence is a regular on-demand fleet. Fixed at creation.
  AzureVirtualMachineScaleSetSpot spot = 15;

  // The scale set's managed identity: how instances authenticate to
  // Azure services without stored credentials. On FLEXIBLE sets only
  // user-assigned identities are supported (ARM's contract).
  AzureVirtualMachineScaleSetIdentity identity = 16;

  // The trusted-launch / encryption security posture. secure_boot and
  // vtpm are UNIFORM-only capabilities; encryption_at_host works in both
  // modes.
  AzureVirtualMachineScaleSetSecurity security = 17;

  // Automatic instance repair: unhealthy instances (per the health
  // extension, or the health probe on UNIFORM sets) are replaced
  // automatically. Requires health monitoring to be configured.
  AzureVirtualMachineScaleSetAutomaticInstanceRepair automatic_instance_repair = 18;

  // Emits a scheduled event before an instance is terminated, giving the
  // workload up to 15 minutes to drain. Presence enables it.
  AzureVirtualMachineScaleSetTerminationNotification termination_notification = 19;

  // VM extensions installed onto every instance -- the health extension
  // (ApplicationHealthLinux / ApplicationHealthWindows) is the load-
  // bearing one: rolling upgrades, automatic instance repair, and
  // hotpatching all key on instance health.
  repeated AzureVirtualMachineScaleSetExtension extensions = 20;

  // How long ALL extensions on an instance may collectively take to
  // provision, as an ISO 8601 duration between PT15M and PT2H. Unset
  // applies Azure's default (PT1H30M).
  string extensions_time_budget = 21;

  // Boot diagnostics: serial console output and boot screenshots.
  // Presence enables it; an empty message uses Azure's managed storage
  // (the right default), or point storage_account_uri at your own
  // storage account.
  AzureVirtualMachineScaleSetBootDiagnostics boot_diagnostics = 22;

  // Availability zones instances spread across, e.g. ["1","2","3"] for
  // zone redundancy. Removing a zone from an existing set replaces it.
  repeated string zones = 23;

  // Strictly balance instance counts across zones. Azure's default is
  // false (best-effort); true requires zones and trades scale-out speed
  // for exact balance. Fixed at creation.
  optional bool zone_balance = 24 [(dev.planton.shared.options.default) = "false"];

  // The number of fault domains instances spread across. REQUIRED on
  // FLEXIBLE sets (1 with zones -- zones are the resilience unit -- or
  // the region's max for regional spreading); optional on UNIFORM sets
  // (Azure picks). Fixed at creation.
  optional int32 platform_fault_domain_count = 25 [(buf.validate.field).int32.gte = 1];

  // Placement constraints: proximity groups, capacity reservations,
  // dedicated host groups, and placement-group sizing.
  AzureVirtualMachineScaleSetPlacement placement = 26;

  // UNIFORM only: provision extra instances during scale-out and keep
  // the first healthy ones -- faster, more reliable scale-out at no
  // extra cost (overprovisioned instances are not billed). Unset on a
  // UNIFORM set applies Azure's default (true). No default annotation:
  // the loader would materialize it onto FLEXIBLE sets, where the field
  // is illegal.
  optional bool overprovision = 27;

  // UNIFORM only: which instances scale-in removes first, and whether
  // removal force-deletes.
  AzureVirtualMachineScaleSetScaleIn scale_in = 28;

  // UNIFORM only: skip running extensions on overprovisioned instances
  // that will be discarded anyway. Unset applies Azure's default
  // (false). No default annotation: the loader would materialize it
  // onto FLEXIBLE sets, where the field is illegal.
  optional bool do_not_run_extensions_on_overprovisioned_machines = 29;

  // Cloud-init / provisioning data, base64-encoded, delivered once at
  // first boot of every instance. May embed bootstrap secrets, so it is
  // treated as secret material.
  string custom_data = 30 [
    (buf.validate.field).string.max_bytes = 65536,
    (dev.planton.shared.options.sensitive) = true
  ];

  // Arbitrary machine-readable data, base64-encoded, retrievable from
  // inside instances via the Instance Metadata Service at any time --
  // unlike custom_data it is UPDATABLE in place and readable back, so
  // never put secrets here.
  string user_data = 31 [(buf.validate.field).string.max_bytes = 65536];

  // Whether the Azure VM agent is provisioned on instances. Azure's
  // default is true; false is for appliance images that ship without an
  // agent -- it disables extensions and most platform management. Fixed
  // at creation.
  optional bool provision_vm_agent = 32 [(dev.planton.shared.options.default) = "true"];

  // Whether extension operations are allowed. Azure's default is true;
  // false requires the set to declare no extensions. Fixed at creation.
  optional bool extension_operations_enabled = 33 [(dev.planton.shared.options.default) = "true"];

  // Certificates from Key Vault installed onto every instance at
  // provisioning time. Each entry names a vault and the certificate
  // secret URLs to install (Windows fleets also name the certificate
  // store).
  repeated AzureVirtualMachineScaleSetSecret secrets = 34;

  // FLEXIBLE only: the Microsoft.Network API version used for the
  // instances' networking resources. Unset applies Azure's default
  // ("2020-11-01"); "2022-11-01" unlocks NIC auxiliary acceleration.
  string network_api_version = 35 [(buf.validate.field).cel = {
    id: "vmss_network_api_version_valid"
    message: "network_api_version must be \"2020-11-01\" or \"2022-11-01\" (or unset for Azure's default)"
    expression: "this == '' || this in ['2020-11-01', '2022-11-01']"
  }];

  // The marketplace plan for images that require purchase-plan
  // acceptance (third-party marketplace images). Leave unset for
  // platform and custom images. Fixed at creation.
  AzureVirtualMachineScaleSetPlan plan = 36;

  // UNIFORM only: VM Applications (gallery applications) installed onto
  // every instance, ordered by `order`. Up to 100.
  repeated AzureVirtualMachineScaleSetGalleryApplication gallery_applications = 37 [(buf.validate.field).repeated.max_items = 100];

  // Niche capability toggles: Ultra SSD attachability for instances.
  AzureVirtualMachineScaleSetAdditionalCapabilities additional_capabilities = 38;

  // UNIFORM only: the Azure Edge Zone the scale set is deployed in, for
  // edge-computing workloads. Leave unset for regular regional
  // deployment. Fixed at creation.
  string edge_zone = 39;

  // Free-form tags applied to the scale set, merged over the
  // Planton-derived resource tags (organization, environment, resource
  // id); a user tag with the same key wins. Tags are Azure's governance
  // surface -- Azure Policy enforces them and Microsoft Cost Management
  // groups by them. Updatable in place.
  map<string, string> tags = 40;

  // -------------------------------------------------------------------
  // Image / OS contracts
  // -------------------------------------------------------------------

  option (buf.validate.message).cel = {
    id: "vmss_image_source_exactly_one"
    message: "set exactly one image source: source_image_reference (marketplace/platform) or source_image_id (custom/gallery)"
    expression: "(has(this.source_image_reference) ? 1 : 0) + (this.source_image_id != '' ? 1 : 0) == 1"
  };

  option (buf.validate.message).cel = {
    id: "vmss_linux_auth_required"
    message: "a Linux scale set requires admin_username and at least one credential -- SSH keys when password authentication is disabled (the default), admin_password when it is enabled"
    expression: "!has(this.os_profile) || !has(this.os_profile.linux) || (this.os_profile.linux.admin_username != '' && ((!has(this.os_profile.linux.disable_password_authentication) || this.os_profile.linux.disable_password_authentication) ? this.os_profile.linux.ssh_public_keys.size() > 0 : has(this.os_profile.linux.admin_password)))"
  };

  option (buf.validate.message).cel = {
    id: "vmss_windows_auth_required"
    message: "a Windows scale set requires admin_username and admin_password"
    expression: "!has(this.os_profile) || !has(this.os_profile.windows) || (this.os_profile.windows.admin_username != '' && has(this.os_profile.windows.admin_password))"
  };

  // -------------------------------------------------------------------
  // Orchestration-mode gating: UNIFORM-only capabilities
  // (orchestration_mode: 0 = unspecified = FLEXIBLE, 1 = FLEXIBLE,
  // 2 = UNIFORM)
  // -------------------------------------------------------------------

  option (buf.validate.message).cel = {
    id: "vmss_overprovision_is_uniform_only"
    message: "overprovision is a UNIFORM-orchestration capability (FLEXIBLE sets never overprovision)"
    expression: "this.orchestration_mode == 2 || !has(this.overprovision)"
  };

  option (buf.validate.message).cel = {
    id: "vmss_scale_in_is_uniform_only"
    message: "scale_in policy is a UNIFORM-orchestration capability"
    expression: "this.orchestration_mode == 2 || !has(this.scale_in)"
  };

  option (buf.validate.message).cel = {
    id: "vmss_gallery_applications_are_uniform_only"
    message: "gallery_applications are a UNIFORM-orchestration capability"
    expression: "this.orchestration_mode == 2 || this.gallery_applications.size() == 0"
  };

  option (buf.validate.message).cel = {
    id: "vmss_overprovision_extensions_skip_is_uniform_only"
    message: "do_not_run_extensions_on_overprovisioned_machines is a UNIFORM-orchestration capability"
    expression: "this.orchestration_mode == 2 || !has(this.do_not_run_extensions_on_overprovisioned_machines)"
  };

  option (buf.validate.message).cel = {
    id: "vmss_secure_boot_vtpm_are_uniform_only"
    message: "secure_boot_enabled and vtpm_enabled (trusted launch) are UNIFORM-orchestration capabilities on scale sets"
    expression: "this.orchestration_mode == 2 || !has(this.security) || (!this.security.secure_boot_enabled && !this.security.vtpm_enabled)"
  };

  option (buf.validate.message).cel = {
    id: "vmss_os_disk_security_encryption_is_uniform_only"
    message: "os_disk confidential-VM encryption (security_encryption_type / secure_vm_disk_encryption_set_id) is a UNIFORM-orchestration capability on scale sets"
    expression: "this.orchestration_mode == 2 || !has(this.os_disk) || (this.os_disk.security_encryption_type == 0 && !has(this.os_disk.secure_vm_disk_encryption_set_id))"
  };

  option (buf.validate.message).cel = {
    id: "vmss_health_probe_is_uniform_only"
    message: "upgrade_policy.health_probe_id is a UNIFORM-orchestration capability (FLEXIBLE sets monitor health via the application health extension)"
    expression: "this.orchestration_mode == 2 || !has(this.upgrade_policy) || !has(this.upgrade_policy.health_probe_id)"
  };

  option (buf.validate.message).cel = {
    id: "vmss_automatic_os_upgrade_is_uniform_only"
    message: "upgrade_policy.automatic_os_upgrade is a UNIFORM-orchestration capability"
    expression: "this.orchestration_mode == 2 || !has(this.upgrade_policy) || !has(this.upgrade_policy.automatic_os_upgrade)"
  };

  option (buf.validate.message).cel = {
    id: "vmss_spot_restore_is_uniform_only"
    message: "spot.restore is a UNIFORM-orchestration capability"
    expression: "this.orchestration_mode == 2 || !has(this.spot) || !has(this.spot.restore)"
  };

  option (buf.validate.message).cel = {
    id: "vmss_host_group_is_uniform_only"
    message: "placement.host_group_id is a UNIFORM-orchestration capability"
    expression: "this.orchestration_mode == 2 || !has(this.placement) || this.placement.host_group_id == ''"
  };

  option (buf.validate.message).cel = {
    id: "vmss_edge_zone_is_uniform_only"
    message: "edge_zone is a UNIFORM-orchestration capability on scale sets"
    expression: "this.orchestration_mode == 2 || this.edge_zone == ''"
  };

  option (buf.validate.message).cel = {
    id: "vmss_nat_rules_are_uniform_only"
    message: "ip_configuration load_balancer_inbound_nat_rule_ids are a UNIFORM-orchestration capability (on FLEXIBLE sets, NAT attaches to the instance NICs directly)"
    expression: "this.orchestration_mode == 2 || this.network_interfaces.all(n, n.ip_configurations.all(c, c.load_balancer_inbound_nat_rule_ids.size() == 0))"
  };

  option (buf.validate.message).cel = {
    id: "vmss_data_disk_name_is_uniform_only"
    message: "data_disks[].name is a UNIFORM-orchestration capability (FLEXIBLE sets derive instance disk names; ARM's orchestrated surface carries no per-disk name)"
    expression: "this.orchestration_mode == 2 || this.data_disks.all(d, d.name == '')"
  };

  option (buf.validate.message).cel = {
    id: "vmss_extension_automatic_upgrade_is_uniform_only"
    message: "extensions[].automatic_upgrade_enabled is a UNIFORM-orchestration capability (ARM's orchestrated extension surface does not carry it)"
    expression: "this.orchestration_mode == 2 || this.extensions.all(e, !e.automatic_upgrade_enabled)"
  };

  option (buf.validate.message).cel = {
    id: "vmss_extension_failure_suppression_is_flexible_only"
    message: "extensions[].failure_suppression_enabled is a FLEXIBLE-orchestration capability"
    expression: "this.orchestration_mode != 2 || this.extensions.all(e, !e.failure_suppression_enabled)"
  };

  // -------------------------------------------------------------------
  // Orchestration-mode gating: FLEXIBLE-only capabilities
  // -------------------------------------------------------------------

  option (buf.validate.message).cel = {
    id: "vmss_sku_profile_is_flexible_only"
    message: "sku_profile (mixed VM sizes) is a FLEXIBLE-orchestration capability"
    expression: "this.orchestration_mode != 2 || !has(this.sku_profile)"
  };

  option (buf.validate.message).cel = {
    id: "vmss_priority_mix_is_flexible_only"
    message: "spot.priority_mix is a FLEXIBLE-orchestration capability"
    expression: "this.orchestration_mode != 2 || !has(this.spot) || !has(this.spot.priority_mix)"
  };

  option (buf.validate.message).cel = {
    id: "vmss_network_api_version_is_flexible_only"
    message: "network_api_version is a FLEXIBLE-orchestration setting"
    expression: "this.orchestration_mode != 2 || this.network_api_version == ''"
  };

  option (buf.validate.message).cel = {
    id: "vmss_patch_modes_are_flexible_only"
    message: "per-OS patch_mode / patch_assessment_mode / hotpatching are FLEXIBLE-orchestration capabilities on scale sets"
    expression: "this.orchestration_mode != 2 || !has(this.os_profile) || ((!has(this.os_profile.linux) || (this.os_profile.linux.patch_mode == 0 && this.os_profile.linux.patch_assessment_mode == 0)) && (!has(this.os_profile.windows) || (this.os_profile.windows.patch_mode == 0 && this.os_profile.windows.patch_assessment_mode == 0 && !this.os_profile.windows.hotpatching_enabled)))"
  };

  option (buf.validate.message).cel = {
    id: "vmss_flexible_requires_fault_domain_count"
    message: "FLEXIBLE orchestration requires platform_fault_domain_count (1 when spreading across zones, or the region's maximum for regional spreading)"
    expression: "this.orchestration_mode == 2 || has(this.platform_fault_domain_count)"
  };

  option (buf.validate.message).cel = {
    id: "vmss_flexible_identity_is_user_assigned_only"
    message: "FLEXIBLE-orchestration scale sets support only USER_ASSIGNED managed identities (ARM's contract)"
    expression: "this.orchestration_mode == 2 || !has(this.identity) || this.identity.type == 2"
  };

  // -------------------------------------------------------------------
  // Mode-independent conditional contracts
  // -------------------------------------------------------------------

  option (buf.validate.message).cel = {
    id: "vmss_sku_profile_pairs_with_mix"
    message: "sku_profile requires sku_name \"Mix\", and sku_name \"Mix\" requires sku_profile"
    expression: "(this.sku_name == 'Mix') == has(this.sku_profile)"
  };

  option (buf.validate.message).cel = {
    id: "vmss_zone_balance_requires_zones"
    message: "zone_balance requires zones to be specified"
    expression: "!has(this.zone_balance) || !this.zone_balance || this.zones.size() > 0"
  };

  option (buf.validate.message).cel = {
    id: "vmss_rolling_upgrade_policy_pairing"
    message: "upgrade_policy.rolling is required when mode is ROLLING and forbidden when mode is MANUAL"
    expression: "!has(this.upgrade_policy) || (this.upgrade_policy.mode == 3 ? has(this.upgrade_policy.rolling) : (this.upgrade_policy.mode == 2 || !has(this.upgrade_policy.rolling)))"
  };

  option (buf.validate.message).cel = {
    id: "vmss_rolling_upgrades_need_health"
    message: "ROLLING upgrade mode requires health monitoring: an ApplicationHealthLinux/ApplicationHealthWindows extension, or upgrade_policy.health_probe_id on a UNIFORM set"
    expression: "!has(this.upgrade_policy) || this.upgrade_policy.mode != 3 || has(this.upgrade_policy.health_probe_id) || this.extensions.exists(e, e.type in ['ApplicationHealthLinux', 'ApplicationHealthWindows'])"
  };

  option (buf.validate.message).cel = {
    id: "vmss_automatic_os_upgrade_needs_automatic_or_rolling"
    message: "upgrade_policy.automatic_os_upgrade requires upgrade mode AUTOMATIC or ROLLING"
    expression: "!has(this.upgrade_policy) || !has(this.upgrade_policy.automatic_os_upgrade) || this.upgrade_policy.mode in [2, 3]"
  };

  option (buf.validate.message).cel = {
    id: "vmss_cross_zone_upgrades_require_zones"
    message: "upgrade_policy.rolling.cross_zone_upgrades_enabled requires zones"
    expression: "!has(this.upgrade_policy) || !has(this.upgrade_policy.rolling) || !this.upgrade_policy.rolling.cross_zone_upgrades_enabled || this.zones.size() > 0"
  };

  option (buf.validate.message).cel = {
    id: "vmss_maximum_surge_requires_no_overprovision"
    message: "upgrade_policy.rolling.maximum_surge_instances_enabled requires overprovision to be explicitly false"
    expression: "!has(this.upgrade_policy) || !has(this.upgrade_policy.rolling) || !this.upgrade_policy.rolling.maximum_surge_instances_enabled || (has(this.overprovision) && !this.overprovision)"
  };

  option (buf.validate.message).cel = {
    id: "vmss_instance_repair_needs_health"
    message: "automatic_instance_repair requires health monitoring: an ApplicationHealthLinux/ApplicationHealthWindows extension, or upgrade_policy.health_probe_id on a UNIFORM set"
    expression: "!has(this.automatic_instance_repair) || !this.automatic_instance_repair.enabled || (has(this.upgrade_policy) && has(this.upgrade_policy.health_probe_id)) || this.extensions.exists(e, e.type in ['ApplicationHealthLinux', 'ApplicationHealthWindows'])"
  };

  option (buf.validate.message).cel = {
    id: "vmss_hotpatching_needs_platform_patching_and_health"
    message: "hotpatching_enabled requires patch_mode WINDOWS_AUTOMATIC_BY_PLATFORM and an ApplicationHealthWindows extension"
    expression: "!has(this.os_profile) || !has(this.os_profile.windows) || !this.os_profile.windows.hotpatching_enabled || (this.os_profile.windows.patch_mode == 3 && this.extensions.exists(e, e.type == 'ApplicationHealthWindows'))"
  };

  option (buf.validate.message).cel = {
    id: "vmss_platform_patching_needs_health_extension"
    message: "patch_mode AUTOMATIC_BY_PLATFORM requires an ApplicationHealthLinux/ApplicationHealthWindows extension"
    expression: "!has(this.os_profile) || (((!has(this.os_profile.linux) || this.os_profile.linux.patch_mode != 2) && (!has(this.os_profile.windows) || this.os_profile.windows.patch_mode != 3)) || this.extensions.exists(e, e.type in ['ApplicationHealthLinux', 'ApplicationHealthWindows']))"
  };

  option (buf.validate.message).cel = {
    id: "vmss_guest_state_encryption_needs_secure_boot_and_vtpm"
    message: "os_disk.security_encryption_type requires security.vtpm_enabled (and DISK_WITH_VM_GUEST_STATE additionally requires security.secure_boot_enabled)"
    expression: "!has(this.os_disk) || this.os_disk.security_encryption_type == 0 || (has(this.security) && this.security.vtpm_enabled && (this.os_disk.security_encryption_type != 2 || this.security.secure_boot_enabled))"
  };

  option (buf.validate.message).cel = {
    id: "vmss_encryption_at_host_conflicts_guest_state_disk"
    message: "security.encryption_at_host_enabled cannot be combined with os_disk.security_encryption_type DISK_WITH_VM_GUEST_STATE"
    expression: "!has(this.security) || !this.security.encryption_at_host_enabled || !has(this.os_disk) || this.os_disk.security_encryption_type != 2"
