// How the scale set orchestrates its instances. Unspecified means
// FLEXIBLE (Azure's recommendation for new workloads).
enum AzureVirtualMachineScaleSetOrchestrationMode {
  // Not specified: FLEXIBLE.
  azure_virtual_machine_scale_set_orchestration_mode_unspecified = 0;

  // Instances are spread like a resilient VM group: per-OS patch
  // orchestration, mixed-SKU profiles, spot/on-demand mixing, and
  // standalone VMs can attach to the set.
  FLEXIBLE = 1;

  // The classic large-fleet mode: identical instances,
  // overprovisioning, automatic OS image upgrades, spot restore,
  // scale-in policy, gallery applications, trusted launch.
  UNIFORM = 2;
}

// Mixed-SKU allocation strategies.
enum AzureVirtualMachineScaleSetAllocationStrategy {
  // Not specified -- invalid; the strategy is an explicit choice.
  azure_virtual_machine_scale_set_allocation_strategy_unspecified = 0;

  // Pick the cheapest available size first.
  LOWEST_PRICE = 1;

  // Pick the size most likely to allocate successfully.
  CAPACITY_OPTIMIZED = 2;

  // Honor the per-size ranks.
  PRIORITIZED = 3;
}

// Host-caching modes for a disk.
enum AzureVirtualMachineScaleSetDiskCaching {
  // Not specified -- invalid; caching is an explicit choice per disk.
  azure_virtual_machine_scale_set_disk_caching_unspecified = 0;

  // No host caching: write-heavy disks, and required for Ultra/
  // PremiumV2 data disks.
  NONE = 1;

  // Read caching only: re-read-heavy data, and required for ephemeral
  // OS disks.
  READ_ONLY = 2;

  // Read/write caching: the general-purpose OS-disk mode.
  READ_WRITE = 3;
}

// Storage SKUs valid for scale-set OS disks.
enum AzureVirtualMachineScaleSetOsDiskStorageAccountType {
  // Not specified -- invalid; the SKU is an explicit choice.
  azure_virtual_machine_scale_set_os_disk_storage_account_type_unspecified = 0;

  // HDD -- dev/test only.
  STANDARD_LRS = 1;

  // Standard SSD, locally redundant.
  STANDARD_SSD_LRS = 2;

  // Premium SSD, locally redundant -- the production default.
  PREMIUM_LRS = 3;

  // Standard SSD, zone redundant.
  STANDARD_SSD_ZRS = 4;

  // Premium SSD, zone redundant.
  PREMIUM_ZRS = 5;
}

// Storage SKUs valid for scale-set data disks.
enum AzureVirtualMachineScaleSetDataDiskStorageAccountType {
  // Not specified -- invalid; the SKU is an explicit choice.
  azure_virtual_machine_scale_set_data_disk_storage_account_type_unspecified = 0;

  // HDD -- dev/test only.
  DATA_STANDARD_LRS = 1;

  // Standard SSD, locally redundant.
  DATA_STANDARD_SSD_LRS = 2;

  // Premium SSD, locally redundant.
  DATA_PREMIUM_LRS = 3;

  // Premium SSD, zone redundant.
  DATA_PREMIUM_ZRS = 4;

  // Ultra SSD: dialed IOPS/throughput, zonal instances only.
  ULTRA_SSD_LRS = 5;

  // Premium SSD v2: dialed IOPS/throughput, zonal instances only.
  PREMIUM_V2_LRS = 6;

  // Standard SSD, zone redundant.
  DATA_STANDARD_SSD_ZRS = 7;
}

// How a data disk is created.
enum AzureVirtualMachineScaleSetDataDiskCreateOption {
  // Not specified: Azure's default (EMPTY).
  azure_virtual_machine_scale_set_data_disk_create_option_unspecified = 0;

  // A fresh empty disk per instance.
  EMPTY = 1;

