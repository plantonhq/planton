      # prior state -- mongo_cluster_resource.go: "API doesn't return the
      # value of create_mode"; azure-rest-api-specs#31266), so an imported
      # state cannot carry it and a config that sets any mode plans a
      # one-time in-place update after import. The provider's own
      # CustomizeDiff deliberately skips ForceNew when the old value is
      # empty (the import case), so the update is safe convergence, never
      # a replace -- create_mode is a create-time discriminator with no
      # cloud-side existence (config-only).
      config_only_attributes: [create_mode]
