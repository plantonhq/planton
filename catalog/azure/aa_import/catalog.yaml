      # echoes prior state), so a blind import holds it empty and the
      # first post-adoption apply re-asserts the configured value -- an
      # in-place update. Rotation stays a real update, so this is the
      # write-normalized secret class (the account_key/client_secret/
      # shared_key precedent), never ignore_changes.
      write_normalized_attributes: [administrator_password]
