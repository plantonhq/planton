# AzureRouteTable install profile used as a fixture by scenarios that prove
# the subnet-side attach seam (declared via the
# planton.dev/e2e-prerequisites annotation -- attaching a route table
# is OPTIONAL for a subnet, so it is never a registry prerequisite). The
# harness deploys this document (via the table's Pulumi module) after the
# fixture resource group and captures its outputs -- route_table_id in
# particular -- for the attaching scenario's reference to resolve against.
# The table is a bare fixture with one inert black-hole route: enough to be
# a real routing policy without touching live traffic paths.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureRouteTable
metadata:
  name: planton-oss-e2e-azure-fixture-rt
  id: planton-oss-e2e-azure-fixture-rt
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureroutetable
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-azure-fixture-rt
  routes:
    - name: blackhole-test-prefix
      addressPrefix: "192.0.2.0/24"
      nextHopType: NONE
