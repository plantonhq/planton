# Minimal AzureRouteTable scenario: a three-route table (black-hole +
# service tag to internet + appliance-forwarding default) with BGP
# propagation disabled, in the fixture resource group.
#
# The resource-group reference resolves against the registry prerequisite's
# captured outputs through the field's default kind (AzureResourceGroup ->
# the fixture RG's name), keeping the scenario fully registry-driven. The
# three routes exercise the repeated message on both engines with three
# different next-hop shapes: NONE, INTERNET with a service-tag prefix, and
# VIRTUAL_APPLIANCE carrying the forwarding address through the
# StringValueOrRef literal form (proving the reference-capable field's wire
# path end to end -- ARM accepts any forwarding address without a live
# appliance, so the route deploys standalone; the referenced-firewall form
# resolves to exactly this literal before the modules run).
# bgp_route_propagation_enabled: false exercises the non-default value of
# the optional bool.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureRouteTable
metadata:
  name: planton-oss-e2e-azureroutetable-smoke
  id: planton-oss-e2e-azureroutetable-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureroutetable
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-rt-smoke
  routes:
    - name: blackhole-test-prefix
      addressPrefix: "192.0.2.0/24"
      nextHopType: NONE
    - name: backup-direct
      addressPrefix: "AzureBackup"
      nextHopType: INTERNET
    - name: default-via-appliance
      addressPrefix: "0.0.0.0/0"
      nextHopType: VIRTUAL_APPLIANCE
      nextHopInIpAddress:
        value: "10.240.250.4"
  bgpRoutePropagationEnabled: false
  tags:
    e2e-suite: azure
    purpose: smoke
