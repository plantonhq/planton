apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azureroutetable
spec:
  # Composed live proof: the harness deploys the fixture resource group
  # (registry prerequisite), creates a route table carrying a black-hole
  # route and an internet route with BGP propagation disabled, verifies the
  # table via the ARM API (generic GetByID on the table's ARM id), destroys
  # it, and verifies it is gone -- on both provisioners. Route tables are
  # free and fast to create/delete.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
