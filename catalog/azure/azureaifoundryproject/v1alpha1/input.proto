syntax = "proto3";

package dev.planton.azure.azureaifoundryproject.v1alpha1;

import "catalog/azure/azureaifoundryproject/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureAiFoundryProjectIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureAiFoundryProjectIacInput {
  // The AI Foundry project resource to deploy.
  AzureAiFoundryProject target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
