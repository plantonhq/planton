apiVersion: azure.planton.dev/v1alpha1
kind: AzureVirtualMachine
metadata:
  name: my-spot-vm
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: batch-worker
  size: Standard_D4s_v3
  networkInterfaceIds:
    - valueFrom:
        name: <your-network-interface-resource-name>
  osProfile:
    linux:
      adminUsername: azureuser
      sshPublicKeys:
        - publicKey: <your-ssh-public-key>
  osDisk:
    caching: READ_WRITE
    storageAccountType: STANDARD_SSD_LRS  # the OS disk is disposable on a spot worker
  sourceImageReference:
    publisher: Canonical
    offer: ubuntu-24_04-lts
    sku: server
    version: latest
  spot:
    evictionPolicy: DEALLOCATE  # disks survive eviction; the VM restarts when capacity returns
  identity:
    type: SYSTEM_ASSIGNED  # grant it AcrPull / queue access via AzureRoleAssignment
  dataDiskAttachments:
    - managedDiskId:
        valueFrom:
          name: <your-managed-disk-resource-name>
      lun: 0
      caching: READ_ONLY
  terminationNotification:
    timeout: PT15M  # maximum drain window before eviction
  bootDiagnostics:
    enabled: true
