apiVersion: azure.planton.dev/v1alpha1
kind: AzureVirtualMachine
metadata:
  name: my-windows-vm
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: win-vm  # Windows computer names cap at 15 characters
  size: Standard_D2s_v3
  networkInterfaceIds:
    - valueFrom:
        name: <your-network-interface-resource-name>
  osProfile:
    windows:
      adminUsername: azureadmin
      adminPassword:
        valueFrom:
          name: <your-secret-resource-name>  # never a literal password in a manifest
      licenseType: WINDOWS_SERVER  # Azure Hybrid Benefit if you hold a license
  osDisk:
    caching: READ_WRITE
    storageAccountType: PREMIUM_LRS
    diskSizeGb: 128
  sourceImageReference:
    publisher: MicrosoftWindowsServer
    offer: WindowsServer
    sku: 2022-datacenter-g2
    version: latest
  availability:
    zone: "1"
  security:
    secureBootEnabled: true  # trusted launch on a Gen2 image
    vtpmEnabled: true
  bootDiagnostics:
    enabled: true
