apiVersion: azure.planton.dev/v1alpha1
kind: AzureVirtualMachine
metadata:
  name: my-ubuntu-vm
spec:
  region: <azure-region>
  resourceGroup:
    value: "<your-resource-group-name>"
  name: app-vm
  size: Standard_D2s_v3
  networkInterfaceIds:
    - valueFrom:
        name: <your-network-interface-resource-name>
  osProfile:
    linux:
      adminUsername: azureuser
      sshPublicKeys:
        - publicKey: <your-ssh-public-key>
  osDisk:
    caching: READ_WRITE
    storageAccountType: PREMIUM_LRS
  sourceImageReference:
    publisher: Canonical
    offer: ubuntu-24_04-lts
    sku: server
    version: latest
  availability:
    zone: "1"
  bootDiagnostics:  # managed-storage boot diagnostics -- the debugging lifeline
    enabled: true
