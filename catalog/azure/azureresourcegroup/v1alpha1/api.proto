syntax = "proto3";

package dev.planton.azure.azureresourcegroup.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureresourcegroup/v1alpha1/outputs.proto";
import "catalog/azure/azureresourcegroup/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureResourceGroup is the top-level API resource for an Azure Resource Group.
// Resource groups are the foundational organizational unit in Azure -- every other
// Azure resource lives inside one.
message AzureResourceGroup {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureResourceGroup'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureResourceGroupSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureResourceGroupStatus status = 5;
}

// AzureResourceGroupStatus holds the deployment status and outputs.
message AzureResourceGroupStatus {
  // outputs
  AzureResourceGroupOutputs outputs = 1;
}
