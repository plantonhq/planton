# Least-privilege permissions the IaC runner's Azure principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: azureresourcegroup
spec:
  azure:
    groups:
      - purpose: ManageResourceGroup
        actions:
          - Microsoft.Resources/subscriptions/resourceGroups/read
          - Microsoft.Resources/subscriptions/resourceGroups/write
          - Microsoft.Resources/subscriptions/resourceGroups/delete
        provenance: derived
        notes: Covers azurerm_resource_group -- create, read/refresh, tag updates (the only in-place change; name and region are ForceNew), and destroy. Unlike every other kind, these permissions must be held at SUBSCRIPTION scope (the group does not exist yet to scope to); Contributor and Owner carry them. Treat the delete with respect -- deleting a resource group deletes every resource inside it, so resourceGroups/delete is subscription-shaped power even though it is a single operation.
