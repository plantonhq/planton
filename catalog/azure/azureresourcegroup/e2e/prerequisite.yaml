# AzureResourceGroup install profile used as a prerequisite by composed
# kinds (declared via prerequisites: [AzureResourceGroup] in the kind
# registry). The E2E harness deploys this document (via the resource group's
# Pulumi module), captures its outputs under its manifest name, and resolves
# dependents' resource-group references against them. It is deliberately
# distinct from scenarios/minimal.yaml so the fixture consumed by other
# kinds stays separate from this kind's own smoke scenario. Resource
# groups are free, so one shared fixture instance covers every consumer.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureResourceGroup
metadata:
  name: planton-oss-e2e-azure-fixture-rg
  id: planton-oss-e2e-azure-fixture-rg
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureresourcegroup
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  name: planton-oss-e2e-azure-fixture-rg
  region: eastus
