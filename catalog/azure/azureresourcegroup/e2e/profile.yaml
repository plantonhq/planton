apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azureresourcegroup
spec:
  # Walking skeleton for the Azure harness, live-validated on both provisioners
  # (deploy -> CheckExistence verify -> destroy -> verify-destroyed) against the
  # Azure test subscription via the ambient credential chain (az login / OIDC).
  # Resource groups are free, so this is the cheapest possible end-to-end proof.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 5
