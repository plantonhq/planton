syntax = "proto3";

package dev.planton.azure.azurepostgresqlflexibleserver.v1alpha1;

import "catalog/azure/azurepostgresqlflexibleserver/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzurePostgresqlFlexibleServerIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message AzurePostgresqlFlexibleServerIacInput {
