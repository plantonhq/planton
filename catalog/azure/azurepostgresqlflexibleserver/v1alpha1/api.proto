syntax = "proto3";

package dev.planton.azure.azurepostgresqlflexibleserver.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurepostgresqlflexibleserver/v1alpha1/outputs.proto";
import "catalog/azure/azurepostgresqlflexibleserver/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzurePostgresqlFlexibleServer is the top-level API resource for an Azure
// Database for PostgreSQL Flexible Server.
// Azure Database for PostgreSQL Flexible Server is a fully managed relational
// database service with granular control over compute, storage, high
// availability, authentication, encryption, and networking. Supports
// PostgreSQL 11 through 18.
message AzurePostgresqlFlexibleServer {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzurePostgresqlFlexibleServer'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzurePostgresqlFlexibleServerSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzurePostgresqlFlexibleServerStatus status = 5;
}

// AzurePostgresqlFlexibleServerStatus holds the deployment status and outputs.
message AzurePostgresqlFlexibleServerStatus {
  // outputs
  AzurePostgresqlFlexibleServerOutputs outputs = 1;
}
