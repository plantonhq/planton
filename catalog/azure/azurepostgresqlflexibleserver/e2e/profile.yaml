apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurepostgresqlflexibleserver
spec:
  # The harness deploys the fixture resource group (registry prerequisite),
  # creates a burstable public-access server with a database, a firewall
  # rule, and a server-parameter override, verifies it via the ARM API
  # (generic GetByID on the server's ARM id), destroys it, and verifies it
  # is gone -- on both provisioners. Server creates run ~8-15 minutes and
  # destroys ~2 minutes, so the timeout is sized for the slow path.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 40
