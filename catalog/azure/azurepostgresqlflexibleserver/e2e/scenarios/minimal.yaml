# Minimal AzurePostgresqlFlexibleServer scenario: a burstable public-access
# server in the fixture resource group.
#
# The resource-group reference resolves against the registry prerequisite's
# captured outputs through the field's default kind. The server_name embeds
# no random suffix even though server names are GLOBALLY unique -- the
# planton-oss-e2e prefix keeps collisions out of practical reach and the
# name frees on destroy. zone is deliberately unset so Azure places the
# server in whatever zone the region has burstable capacity in. The
# database, firewall rule, and server-parameter entries prove all three
# child-resource paths live; the parameter (azure.extensions) is DYNAMIC,
# so no restart-pending state lingers on the run.
#
# The region is westus3 rather than the suite's eastus: free/PAYG test
# subscriptions are offer-restricted from provisioning PostgreSQL
# Flexible Servers in some regions (LocationIsOfferRestricted -- verified
# live in eastus, eastus2, AND westus2). Before moving this scenario,
# probe the per-region flag:
#   az rest --method get --url "https://management.azure.com/subscriptions/{sub}/providers/Microsoft.DBforPostgreSQL/locations/{region}/capabilities?api-version=2024-08-01" --query "value[0].restricted"
# ("Disabled" means provisioning is allowed; westus3/centralus/
# canadacentral/northeurope/uksouth were Disabled at last check). A server
# may live in a different region than its resource group, so the eastus
# fixture RG serves unchanged.
apiVersion: azure.planton.dev/v1alpha1
kind: AzurePostgresqlFlexibleServer
metadata:
  name: planton-oss-e2e-azurepg-smoke
  id: planton-oss-e2e-azurepg-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurepostgresqlflexibleserver
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: westus3
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  serverName: planton-oss-e2e-pg-smoke
  administratorLogin: pgadmin
  administratorPassword:
    value: PltnE2e-P0stgres!
  skuName: B_Standard_B1ms
  storageMb: 32768
  backupRetentionDays: 7
  databases:
    - name: smoke
  firewallRules:
    - name: allow-azure-services
      startIpAddress: "0.0.0.0"
      endIpAddress: "0.0.0.0"
  serverParameters:
    azure.extensions: PGCRYPTO
  tags:
    e2e-suite: azure
    purpose: smoke
