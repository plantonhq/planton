# The partner (secondary) logical server for the failover group scenario,
# in a DIFFERENT region than the shared primary fixture (which is westus3),
# so the group has a valid cross-region pair. Logical servers are free.
# eastus is offer-restricted on the test subscription (ProvisioningDisabled);
# centralus provisions cleanly (live-verified session 031).
apiVersion: azure.planton.dev/v1alpha1
kind: AzureMssqlServer
metadata:
  name: planton-oss-e2e-fog-partner
  id: planton-oss-e2e-fog-partner
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuremssqlserver
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: centralus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  serverName: planton-oss-e2e-fog-partner
  administratorLogin: sqladmin
  administratorPassword:
    value: PltnE2e-Mssql!1
