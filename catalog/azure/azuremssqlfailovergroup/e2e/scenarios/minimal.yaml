# Composed AzureMssqlFailoverGroup scenario: the shared MSSQL server fixture
# (westus3) as the primary, a scenario-local partner server (centralus), and a
# scenario-local S0 database on the primary, joined into an AUTOMATIC
# failover group.
#
# The primary is the registry prerequisite (AzureMssqlServer); the partner
# server and the database are scenario-local extra fixtures. This proves the
# primary server FK, the partner-server FK, the database FK, and the
# read-write failover policy on both engines. The listener endpoint outputs
# are DNS-composed from the group name.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureMssqlFailoverGroup
metadata:
  name: planton-oss-e2e-azuremssqlfailovergroup-smoke
  id: planton-oss-e2e-azuremssqlfailovergroup-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuremssqlfailovergroup
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "catalog/azure/azuremssqlfailovergroup/e2e/fixture-partner-server.yaml,catalog/azure/azuremssqlfailovergroup/e2e/fixture-database.yaml"
  tags:
    - planton-e2e
spec:
  name: planton-oss-e2e-fog-smoke
  serverId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-sql
  partnerServers:
    - serverId:
        valueFrom:
          name: planton-oss-e2e-fog-partner
  databaseIds:
    - valueFrom:
        name: planton-oss-e2e-fog-db
  readWriteEndpointFailoverPolicy:
    mode: AUTOMATIC
    graceMinutes: 60
  tags:
    e2e-suite: azure
    purpose: smoke
