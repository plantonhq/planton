apiVersion: azure.planton.dev/v1alpha1
kind: AzureContainerApp
metadata:
  name: my-enterprise-api
spec:
  resourceGroup:
    value: "<your-resource-group-name>"
  containerAppName: my-enterprise-api
  containerAppEnvironmentId:
    value: "<container-app-environment-id>"
  containers:
    - name: api
      image: mycompany.azurecr.io/enterprise-api:v1.0.0
      cpu: 1.0
      memory: "2Gi"
      env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Production
        - name: DB_CONNECTION
          secretName: db-conn
      livenessProbe:
        transport: HTTP_GET
        port: 8080
        path: /healthz
        initialDelayInSeconds: 10
        intervalSeconds: 15
        timeoutSeconds: 5
        failureCountThreshold: 3
      readinessProbe:
        transport: HTTP_GET
        port: 8080
        path: /ready
        intervalSeconds: 5
        timeoutSeconds: 3
        successCountThreshold: 2
        failureCountThreshold: 3
      startupProbe:
        transport: HTTP_GET
        port: 8080
        path: /healthz
        intervalSeconds: 3
        timeoutSeconds: 5
        failureCountThreshold: 30
  minReplicas: 2
  maxReplicas: 20
  cooldownPeriodInSeconds: 180
  terminationGracePeriodSeconds: 30
  httpScaleRules:
    - name: http-requests
      concurrentRequests: "75"
  secrets:
    - name: db-conn
      keyVaultSecretId: https://my-keyvault.vault.azure.net/secrets/db-connection
      identity: "<your-user-assigned-identity-id>"
  registries:
    - server:
        value: mycompany.azurecr.io
      identity: "<your-user-assigned-identity-id>"
  identity:
    type: USER_ASSIGNED
    userAssignedIdentityIds:
      - value: "<your-user-assigned-identity-id>"
  ingress:
    externalEnabled: true
    targetPort: 8080
    # Azure evaluates the list as one allowlist (or one denylist) -- every
    # rule must share the same action; traffic outside an allowlist is
    # implicitly denied.
    ipSecurityRestrictions:
      - name: allow-office
        action: ALLOW
        ipAddressRange: 203.0.113.0/24
        description: Corporate office CIDR
    trafficWeight:
      - latestRevision: true
        percentage: 100
  tags:
    environment: production
