apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurecontainerapp
spec:
  # The scenario deploys the composed RG -> environment -> app chain:
  # a public quickstart container with external HTTP ingress, the
  # latest-revision traffic weight, an HTTP scale rule, and
  # scale-to-zero bounds -- verifies the app via the ARM API, destroys
  # it, and verifies it is gone. The app itself creates in ~1-2 minutes;
  # the fixture environment's create + ~5-10 minute delete dominates the
  # run.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 60
