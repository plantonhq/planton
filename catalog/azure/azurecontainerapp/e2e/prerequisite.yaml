# AzureContainerApp install profile used as a prerequisite by
# AzureContainerAppCustomDomain (declared via prerequisites:
# [AzureContainerApp] in the kind registry). The E2E harness deploys this
# document (via the app's Pulumi module), captures its outputs under its
# manifest name, and resolves dependents' app references against them.
# The environment and resource group arrive transitively through this
# kind's own AzureContainerAppEnvironment prerequisite. External HTTP
# ingress is deliberately enabled -- a custom-domain binding attaches to
# the app's ingress and Azure rejects the binding without one.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureContainerApp
metadata:
  name: planton-oss-e2e-azure-fixture-ca
  id: planton-oss-e2e-azure-fixture-ca
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azurecontainerapp
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  containerAppName: planton-oss-e2e-fixture-ca
  containerAppEnvironmentId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-cae
  containers:
    - name: web
      image: mcr.microsoft.com/k8se/quickstart:latest
      cpu: 0.25
      memory: "0.5Gi"
  minReplicas: 0
  maxReplicas: 1
  ingress:
    externalEnabled: true
    targetPort: 80
    trafficWeight:
      - latestRevision: true
        percentage: 100
