apiVersion: azure.planton.dev/v1alpha1
kind: AzureContainerApp
metadata:
  name: test-app
spec:
  resource_group:
    value: test-rg
  container_app_name: test-container-app
  container_app_environment_id:
    value: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/test-rg/providers/Microsoft.App/managedEnvironments/test-env
  revision_mode: MULTIPLE
  workload_profile_name: dedicated-d4
  max_inactive_revisions: 25
  revision_suffix: v2
  min_replicas: 1
  max_replicas: 30
  cooldown_period_in_seconds: 120
  polling_interval_in_seconds: 15
  termination_grace_period_seconds: 30
  containers:
    - name: web
      image: mcr.microsoft.com/k8se/quickstart:latest
      cpu: 0.5
      memory: "1Gi"
      command: ["/bin/server"]
      args: ["--port", "8080"]
      env:
        - name: MODE
          value: production
        - name: API_KEY
          secret_name: api-key
      liveness_probe:
        transport: HTTP_GET
        port: 8080
        path: /healthz
        initial_delay_in_seconds: 5
        failure_count_threshold: 5
        headers:
          - name: X-Probe
            value: liveness
      readiness_probe:
        transport: TCP_SOCKET
        port: 8080
        success_count_threshold: 2
      startup_probe:
        transport: HTTPS_GET
        port: 8443
        path: /started
        failure_count_threshold: 60
      volume_mounts:
        - name: shared-data
          path: /data
          sub_path: web
  init_containers:
    - name: migrate
      image: mcr.microsoft.com/k8se/quickstart:latest
      command: ["/bin/migrate"]
      env:
        - name: DB_URL
          secret_name: db-url
  volumes:
    - name: shared-data
      storage_type: AZURE_FILE
      storage_name:
        value: test-env-storage
      mount_options: uid=1000,gid=1000
    - name: scratch
      storage_type: EMPTY_DIR
    - name: certs
      storage_type: SECRET
  http_scale_rules:
    - name: http-load
      concurrent_requests: "100"
  azure_queue_scale_rules:
    - name: work-queue
      queue_name: work
      queue_length: 5
      authentication:
        - secret_name: queue-conn
          trigger_parameter: connection
  custom_scale_rules:
    - name: cron-scale
      custom_rule_type: cron
      metadata:
        timezone: UTC
        start: 0 8 * * 1-5
        end: 0 18 * * 1-5
        desiredReplicas: "5"
      identity_id:
        value: System
  secrets:
    - name: api-key
      value: plain-text-secret
    - name: db-url
      key_vault_secret_id: https://test-vault.vault.azure.net/secrets/db-url
      identity: System
    - name: queue-conn
      value: DefaultEndpointsProtocol=https;AccountName=test
  registries:
    - server:
        value: testregistry.azurecr.io
      identity: System
  ingress:
    external_enabled: true
    target_port: 8080
    transport: AUTO
    allow_insecure_connections: false
    client_certificate_mode: ACCEPT
    traffic_weight:
      - revision_suffix: v1
        percentage: 80
      - revision_suffix: v2
        percentage: 20
        label: canary
    ip_security_restrictions:
      - name: office
        action: ALLOW
        ip_address_range: 203.0.113.0/24
        description: Office CIDR
    cors:
      allowed_origins:
        - https://example.com
      allowed_headers:
        - Content-Type
        - Authorization
      allowed_methods:
        - GET
        - POST
      exposed_headers:
        - X-Request-Id
      max_age_in_seconds: 3600
      allow_credentials_enabled: true
  dapr:
    app_id: test-app
    app_port: 8080
    app_protocol: DAPR_HTTP
  identity:
    type: SYSTEM_AND_USER_ASSIGNED
    user_assigned_identity_ids:
      - value: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/test-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/test-uai
  tags:
    team: platform
