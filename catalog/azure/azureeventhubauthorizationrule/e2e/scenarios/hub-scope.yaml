# Hub-scope AzureEventHubAuthorizationRule scenario: the manage trio on
# one hub through a scenario-local namespace -> hub chain -- proving the
# hub dispatch path (namespace/hub names parsed from the hub's ARM id)
# and the manage-requires-listen-and-send contract live.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureEventHubAuthorizationRule
metadata:
  name: planton-oss-e2e-azureeventhubauthorizationrule-hubscope
  id: planton-oss-e2e-azureeventhubauthorizationrule-hubscope
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureeventhubauthorizationrule
  annotations:
    planton.dev/e2e: "true"
    # Deploy order: namespace, then hub.
    planton.dev/e2e-prerequisites: "catalog/azure/azureeventhubauthorizationrule/e2e/fixture-namespace-hubscope.yaml,catalog/azure/azureeventhubauthorizationrule/e2e/fixture-hub.yaml"
  tags:
    - planton-e2e
spec:
  ruleName: e2e-hub-manage
  eventHubId:
    valueFrom:
      name: planton-oss-e2e-ehauth-fixture-hub
  listen: true
  send: true
  manage: true
