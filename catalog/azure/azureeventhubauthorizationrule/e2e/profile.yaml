apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azureeventhubauthorizationrule
spec:
  # Two scenarios cover BOTH dispatch paths per engine: namespace-scope
  # (listen+send on a scenario-local namespace) and hub-scope (the manage
  # trio through a scenario-local namespace -> hub chain). Each verifies
  # the rule via the ARM API, checks the six credential faces populate,
  # destroys, and verifies it is gone. Rules create in seconds; the
  # namespace fixtures dominate the lanes.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
