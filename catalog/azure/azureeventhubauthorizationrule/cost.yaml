# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azureeventhubauthorizationrule
spec:
  billing_model: free
  free_tier: An authorization rule is pure configuration -- a named SAS credential with listen/send/manage rights scoped to a namespace or one hub. Azure has no meter for rules; creating, holding, or rotating them costs nothing at any scope.
  notes: "No field of this spec buys anything: the scope references (namespace_id or event_hub_id) point at resources billed as their own catalog kinds, and the listen/send/manage booleans only shape what the credential may do. The traffic a rule's connection strings carry is metered on the parent AzureEventHubNamespace (throughput/processing/capacity units and per-million-events ingress on shared tiers) -- the same whether clients authenticate with this rule's SAS keys or with Entra identities."
