# AzureMssqlServer install profile used as the parent fixture by the
# database and elastic-pool scenarios (their kinds declare AzureMssqlServer
# as a registry prerequisite). The harness deploys this document (via the
# server's Pulumi module) after the fixture resource group and captures its
# outputs -- server_id in particular -- for the child scenarios' references
# to resolve against.
#
# The server_name is distinct from the smoke scenario's so the fixture and
# a server smoke run can coexist. The logical server itself is free --
# databases and pools carry the compute -- so one shared fixture instance
# covers every consumer.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureMssqlServer
metadata:
  name: planton-oss-e2e-azure-fixture-sql
  id: planton-oss-e2e-azure-fixture-sql
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuremssqlserver
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: westus3
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  serverName: planton-oss-e2e-fx-sql
  administratorLogin: sqladmin
  administratorPassword:
    value: PltnE2e-Mssql!1
