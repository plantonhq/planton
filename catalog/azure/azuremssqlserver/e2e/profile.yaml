apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azuremssqlserver
spec:
  # The harness deploys the fixture resource group (registry prerequisite),
  # creates the logical server with a firewall rule and a Defender alert
  # policy, verifies it via the ARM API (generic GetByID on the server's
  # ARM id), destroys it, and verifies it is gone -- on both provisioners.
  # Logical servers create in ~1-2 minutes (no compute of their own).
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 30
