syntax = "proto3";

package dev.planton.azure.azuremssqlserver.v1alpha1;

// **AzureMssqlServerOutputs** captures the outputs of provisioning an
// Azure SQL Database logical server.
//
// `server_id` is the join key for everything that lives on or attaches to
// the server: AzureMssqlDatabase and AzureMssqlElasticPool parent
// references, and AzurePrivateEndpoint's private_connection_resource_id
// (subresource_names: ["sqlServer"]). `fqdn` + `administrator_login` are
// what applications need to construct connection strings:
//   Server={fqdn},1433;Database={db};User ID={admin};Password={password};Encrypt=True;
message AzureMssqlServerOutputs {
  // The Azure Resource Manager ID of the logical server.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Sql/servers/{name}
  // Referenced by AzureMssqlDatabase.server_id,
  // AzureMssqlElasticPool.server_id, and AzurePrivateEndpoint
  // (private_connection_resource_id).
  string server_id = 1;

  // The name of the logical server.
  string server_name = 2;

  // The server's fully qualified domain name
  // ({name}.database.windows.net) -- the connection-string host. With
  // private endpoints it resolves privately through the
  // privatelink.database.windows.net zone.
  string fqdn = 3;

  // The administrator login, echoed so applications can construct
  // connection strings without duplicating the value. Empty on an
  // Entra-only server (SQL logins disabled).
  string administrator_login = 4;

  // The principal (directory object) ID of the server's system-assigned
  // managed identity -- the subject for AzureRoleAssignment grants. Empty
  // unless the identity type includes SYSTEM_ASSIGNED.
  string identity_principal_id = 5;
}
