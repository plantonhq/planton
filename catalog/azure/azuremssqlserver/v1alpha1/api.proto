syntax = "proto3";

package dev.planton.azure.azuremssqlserver.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azuremssqlserver/v1alpha1/outputs.proto";
import "catalog/azure/azuremssqlserver/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureMssqlServer is the top-level API resource for an Azure SQL Database
// logical server -- the administrative container that carries the login
// endpoint, SQL and Microsoft Entra authentication, networking posture,
// the transparent-data-encryption key, auditing, and Microsoft Defender
// settings. Databases (AzureMssqlDatabase) and elastic pools
// (AzureMssqlElasticPool) are first-class resources created on the server.
message AzureMssqlServer {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureMssqlServer'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureMssqlServerSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureMssqlServerStatus status = 5;
}

// AzureMssqlServerStatus holds the deployment status and outputs.
message AzureMssqlServerStatus {
  // outputs
  AzureMssqlServerOutputs outputs = 1;
}
