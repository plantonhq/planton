# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azurebackuppolicyfileshare
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The policy is schedule-and-retention configuration; it stores no customer data. Encryption of snapshots is the storage account's posture and of vaulted copies the vault's (AzureRecoveryServicesVault).
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest of its own; customer-managed-key encryption of backup data is configured on the vault and the storage account.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The policy moves no data; backup transfer transport belongs to the Azure Backup service and the protected-share bindings.
    - control_id: no-public-access
      status: not_applicable
      notes: The policy has no reachable endpoint; the vault's public_network_access_enabled governs the backup endpoints.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No inbound surface of its own.
    - control_id: edge-protection
      status: not_applicable
      notes: No request path of its own to filter.
    - control_id: rbac
      status: not_applicable
      notes: Management access is ARM RBAC on the vault's backupPolicies operations (subscription/resource-group posture); the policy exposes no authentication plane of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The policy runs no workloads and holds no credentials.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths of its own.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Policy writes land in the Azure Activity Log as subscription-level posture; backup-job audit belongs to the vault's diagnostic surface.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The policy publishes no metrics of its own; job-failure and critical-operation alerts are the vault's built-in monitoring surface.
    - control_id: backup-recovery
      status: not_applicable
      notes: The policy DEFINES the backup automation (schedule, retention, and the snapshot-vs-vault tier) but protects nothing by itself -- backup happens when an AzureBackupProtectedFileShare binds a share to this policy; that binding carries the restore capability and the meters.
    - control_id: backup-retention-policy
      status: configurable
      field_path: retention_daily
      evidence:
        type: spec_validation
        reference: retention_daily is REQUIRED (the provider's own contract, 1-200 days) as the base layer both Daily and Hourly schedules retain into; optional weekly (1-200), monthly (1-120), and yearly (1-10) layers extend keeps, and snapshot_retention_in_days must stay below retention_daily.count on the vault-standard tier (spec CEL mirrors the provider's CustomizeDiff).
      notes: This component IS the retention policy for Azure Files backup. Both presets carry ladders -- 01-daily-snapshot-policy keeps 30 dailies / 12 weeklies / 12 monthlies / 5 yearlies on the snapshot tier; 02-hourly-vault-standard-policy keeps 30 dailies / 12 monthlies vaulted with 5 local snapshot days alongside. backup_tier vault-standard makes retained copies survive storage-account deletion and compromise.
    - control_id: multi-zone-ha
      status: not_applicable
      notes: A configuration object with no data plane of its own; snapshot durability follows the storage account's SKU and vaulted-copy redundancy follows the vault's storage_mode_type -- both separate catalog kinds.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither ARM nor this spec offers a deletion-protection flag on policies; guarding backup DATA against deletion is the vault's immutability/soft-delete surface. Note the snapshot tier's inherent limit -- snapshots share the storage account's fate; the vault-standard tier removes that coupling.
    - control_id: managed-patching
      status: not_applicable
      notes: Pure configuration inside the Microsoft-operated Azure Backup service -- no software surface of its own to patch.
