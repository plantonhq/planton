apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurebackupprotectedfileshare
spec:
  # PROVEN live on both engines (proof session, 2026-08-18): `minimal`
  # (the fixture share under the policy smoke, wired through the
  # fixture registration's echoed output) -- Pulumi 20m15s (deploy
  # 1m41, destroy 1m25), Terraform 15m44s incl. a 13s blind import
  # round-trip with a no-differences re-plan; the group's deepest
  # fixture chain dominates (~8-9 min each way). The FIRST lane caught
  # the ScopeLocked ordering defect live: teardown deleted the fixture
  # share while the registration's DoNotDelete lock still covered the
  # account -- fixed by reordering the kind's registry prerequisites
  # (share BEFORE registration; commented load-bearing in
  # catalog_kind.proto). The soft-delete watch item resolved
  # clean: a smoke item has zero recovery points, so the delete lands
  # outright and the unregister minutes later succeeded; the verifier
  # shares the VM sibling's bounded-poll absence bar for the measured
  # async read lag. Protect/unprotect sit in the provider's 80-minute
  # timeout class (normal runs are minutes; the budget covers the
  # class).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 120
