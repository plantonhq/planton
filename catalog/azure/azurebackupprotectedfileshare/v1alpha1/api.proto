syntax = "proto3";

package dev.planton.azure.azurebackupprotectedfileshare.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurebackupprotectedfileshare/v1alpha1/outputs.proto";
import "catalog/azure/azurebackupprotectedfileshare/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureBackupProtectedFileShare is the top-level API resource
// describing a protected Azure Files share -- the binding that puts
// one file share under a backup policy's protection in a Recovery
// Services vault.
message AzureBackupProtectedFileShare {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzureBackupProtectedFileShare".
  string kind = 2 [(buf.validate.field).string.const = 'AzureBackupProtectedFileShare'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Protected file share specification.
  AzureBackupProtectedFileShareSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzureBackupProtectedFileShareStatus status = 5;
}

// AzureBackupProtectedFileShareStatus holds the deployment outputs.
message AzureBackupProtectedFileShareStatus {
  // Outputs from the IaC deployment.
  AzureBackupProtectedFileShareOutputs outputs = 1;
}
