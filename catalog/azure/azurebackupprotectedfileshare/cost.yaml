# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. This kind deliberately ships no
# estimate: the protection commits real spend (a banded per-instance fee
# plus snapshot storage), but both are set by the backed-up shares' DATA
# SIZE in the storage account -- delegated to the referenced share and
# account components and invisible in this manifest -- so a dollar
# figure here would be a guess wearing a dollar sign.
# Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azurebackupprotectedfileshare
spec:
  billing_model: hybrid
  baseline_charges:
    - service_name: Backup
      sku_meter: protected instance fee
      pricing_unit: instance-months
      description: Registering the share starts a monthly Azure Backup fee -- and the billed INSTANCE is the STORAGE ACCOUNT holding backed-up shares, sized by the combined size of every share protected in it. Microsoft's retail meter is Azure Files Protected Instance at 5.00 per month (eastus, verified 2026-08-18), billed per 500 GB increment, with instances at or under 250 GB billing 60 percent of the unit. The size that sets the count lives on the shares, not here.
    - service_name: Azure Files
      sku_meter: snapshot storage
      pricing_unit: GB-months
      description: Snapshot-managed backup keeps its recovery points as share snapshots INSIDE the source storage account -- the differential snapshot data bills that account's Azure Files snapshot rates, never vault storage. The bill lands on the storage account's own invoice line.
  cost_drivers:
    - field_path: source_storage_account_id
      sku_meter: protected instance fee
      pricing_unit: instance-months
      impact: The account is the billed instance -- protecting a second share in the SAME account grows one instance's size rather than adding a second fee, while protecting a share in a different account starts a new instance. The combined protected size is invisible here, which is why no estimate document exists for this component.
    - field_path: source_file_share_name
      sku_meter: snapshot storage
      pricing_unit: GB-months
      impact: The share's data size and daily churn set both the instance's size contribution and the differential snapshot volume each recovery point adds -- both live on the referenced AzureStorageShare, not in this manifest.
    - field_path: backup_policy_id
      sku_meter: snapshot storage
      pricing_unit: GB-months
      impact: The referenced policy's schedule and retention decide how many snapshots exist at once -- daily snapshots kept 30 days hold a month of churn in the account. The policy is the snapshot bill's throttle, and it lives on its own component.
  estimate_exclusions:
    - the instance-fee band count and the snapshot volume follow the protected shares' combined data size and churn -- delegated to the referenced share and storage-account components and unknowable here, which is why no estimate document exists for this component
    - snapshot storage bills on the source storage account at Azure Files snapshot rates (by the account's redundancy and media tier), on that component
    - restore operations may add transaction and egress charges on the storage account
  notes: "The honest estimate lives at composition time: this manifest contributes the binding, the referenced shares contribute the sizes that band the fee, and the referenced policy contributes the retention that multiplies snapshots. Microsoft's pricing page (2026-08-18) defines the protected instance as the storage account holding backed-up shares, bands the fee per 500 GB increment of combined share size (5.00 per unit at eastus list, 60 percent of a unit for instances at or under 250 GB), and keeps snapshot data in the customer's own account rather than the vault -- this is the snapshot-management flavor of Azure Files backup, not the vaulted flavor. The deletion economics mirror VM backup: stopping protection keeps billing on retained data, and destroying this resource deletes the backup data (vault soft delete may hold it 14 more days)."
