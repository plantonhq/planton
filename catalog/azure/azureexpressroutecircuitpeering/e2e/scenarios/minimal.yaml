# Minimal AzureExpressRouteCircuitPeering scenario: private peering on
# the fixture circuit (vlan 100, RFC-1918 /30 pair). The registry chain
# deploys the fixture circuit; its provider side is NECESSARILY
# NotProvisioned (no carrier behind the test subscription). LIVE-VERIFIED:
# ARM accepts and stores private-peering configuration on the
# unprovisioned circuit -- the lane asserts the ARM child (config
# stored, session dark until the carrier provisions). Only Microsoft
# peering's unprovisioned-circuit behavior remains unexercised.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureExpressRouteCircuitPeering
metadata:
  name: planton-oss-e2e-azureexpressroutecircuitpeering-smoke
  id: planton-oss-e2e-azureexpressroutecircuitpeering-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureexpressroutecircuitpeering
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  expressRouteCircuitName:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-erc
  peeringType: AZURE_PRIVATE_PEERING
  vlanId: 100
  primaryPeerAddressPrefix: "192.168.16.0/30"
  secondaryPeerAddressPrefix: "192.168.16.4/30"
  peerAsn: 65010
