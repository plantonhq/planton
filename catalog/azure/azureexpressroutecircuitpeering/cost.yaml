# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azureexpressroutecircuitpeering
spec:
  billing_model: free
  free_tier: A peering is the BGP routing configuration stored ON an ExpressRoute circuit -- the /30 pairs, VLAN id, and advertisement contract that make routes flow through the pipe. ExpressRoute prices the circuit, not its configuration; both peering types are included with every circuit, and configuring, holding, or disabling a peering never bills on its own.
  notes: "The CIRCUIT is the bill: its monthly fee (by bandwidth tier and SKU) and, on metered plans, per-GB outbound data are the AzureExpressRouteCircuit kind's costs, incurred whether or not any peering is configured -- plus the connectivity provider's own charges outside Azure entirely. One field of this spec does trigger real Azure spend: `connections` (Global Reach) links this private peering to other circuits' peerings, and Global Reach is a PAID add-on billed on the circuits per the ExpressRoute pricing page (add-on fee plus per-GB transfer between them). The gateway that joins a VNet to the private peering bills as its own component too."
