# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azureeventhubschemagroup
spec:
  billing_model: free
  free_tier: A schema group is pure configuration -- a named collection in the namespace's schema registry with a format and compatibility policy. The registry is a built-in feature of STANDARD-and-higher namespaces with no meter of its own; groups and the schemas registered inside them cost nothing.
  notes: "No field of this spec buys anything: namespace_id points at the parent AzureEventHubNamespace (billed as its own catalog kind -- and its tier is what gates the registry, since BASIC namespaces reject schema groups), while schema_group_name, schema_compatibility, and schema_type only shape how the registry validates schema versions. Registry storage is bounded by per-tier limits (a size cap on STANDARD, larger on PREMIUM/dedicated) -- limits, not meters."
