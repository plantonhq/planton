# Least-privilege permissions the IaC runner's Azure principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: azureeventhubschemagroup
spec:
  azure:
    groups:
      - purpose: ManageSchemaGroup
        actions:
          - Microsoft.EventHub/namespaces/schemagroups/read
          - Microsoft.EventHub/namespaces/schemagroups/write
          - Microsoft.EventHub/namespaces/schemagroups/delete
        provenance: derived
        notes: Covers azurerm_eventhub_namespace_schema_group -- create under the namespace (namespace_id), read/refresh, and destroy; there are no in-place updates because every field is ForceNew. Azure's operation inventory spells the segment lowercase (schemagroups).
