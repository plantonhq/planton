kind: AzureEventHubNamespace
metadata:
  name: planton-oss-e2e-ehsg-fixture-namespace
  id: planton-oss-e2e-ehsg-fixture-namespace
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azureeventhubnamespace
  annotations:
    planton.dev/e2e: "true"
