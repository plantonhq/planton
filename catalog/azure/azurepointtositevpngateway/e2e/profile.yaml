apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurepointtositevpngateway
spec:
  # Proven live on both engines: full lifecycle green through the
  # four-fixture chain (rg -> WAN -> hub -> server configuration), the
  # cross-kind references resolving through the chain, plus a blind
  # Terraform import round-trip (single ARM ID; plan clean). Measured:
  # create 32-33 min, delete 11-14 min, fixture-hub cycle ~17-23 min up
  # / ~14 min down -- a single-engine lane totals ~80 minutes (see the
  # point-to-site section of e2e/README.md); billing (~$0.36/hr per
  # scale unit) starts at creation. No client ever connects (the
  # fixture root's private key does not exist) -- verifiers assert ARM
  # state.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 150
