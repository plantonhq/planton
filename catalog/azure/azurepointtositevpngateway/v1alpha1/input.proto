syntax = "proto3";

package dev.planton.azure.azurepointtositevpngateway.v1alpha1;

import "catalog/azure/azurepointtositevpngateway/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzurePointToSiteVpnGatewayIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzurePointToSiteVpnGatewayIacInput {
