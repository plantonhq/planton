# Least-privilege permissions the IaC runner's Azure principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: azurepointtositevpngateway
spec:
  azure:
    groups:
      - purpose: ManagePointToSiteGateway
        actions:
          - Microsoft.Network/p2sVpnGateways/read
          - Microsoft.Network/p2sVpnGateways/write
          - Microsoft.Network/p2sVpnGateways/delete
        provenance: derived
        notes: Covers azurerm_point_to_site_vpn_gateway / network.PointToPointVpnGateway (the SDK's legacy token; the ARM object is the point-to-site gateway) -- create (a 30-45 minute operation), refresh, in-place updates (scale_unit, connection configurations, DNS servers, tags), and destroy. All are included in Azure's built-in Network Contributor role, the coarse grant this manifest replaces.
      - purpose: ReadReferencedHubAndPolicy
        actions:
          - Microsoft.Network/virtualHubs/read
          - Microsoft.Network/vpnServerConfigurations/read
        provenance: derived
        notes: The modules never call the hub or server-configuration APIs -- they pass the resolved virtual_hub_id and vpn_server_configuration_id in the gateway payload -- but ARM validates both references at create (service-side), which requires read on each referenced resource's scope. One point-to-site gateway per hub is ARM's rule.
      - purpose: ReadReferencedHubRouting
        actions:
          - Microsoft.Network/virtualHubs/hubRouteTables/read
          - Microsoft.Network/virtualHubs/routeMaps/read
        provenance: derived
        notes: Service-side reads on optional references -- required only when a connection configuration carries a route block naming hub route tables (association and propagation) or route maps. ARM authorizes each referenced id against its own scope at create; manifests riding ARM's default routing need neither.
