# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azuredataprotectionresourceguard
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The guard is governance configuration (an operation-exclusion list); it stores no customer data at rest.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to encrypt (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: The guard moves no data; approval checks happen inside Azure's ARM control plane.
    - control_id: no-public-access
      status: not_applicable
      notes: The guard has no reachable endpoint; it is an ARM object consulted by the Backup service when a guarded operation is attempted.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No inbound surface of its own.
    - control_id: edge-protection
      status: not_applicable
      notes: No request path of its own to filter.
    - control_id: rbac
      status: configurable
      field_path: vault_critical_operation_exclusion_list
      evidence:
        type: spec_default
        reference: An unset (empty) exclusion list -- the default -- gates EVERY critical vault operation (disabling soft delete, deleting protection, reducing retention) behind an approval through the guard; each ARM operation named in the list is an explicit spec choice to let that operation bypass approval.
      notes: The guard IS an access-control object -- it imposes Multi-User Authorization on the vaults that reference it, and approval authority follows Azure RBAC on the GUARD's own scope. The protection is real only under scope separation -- deploy the guard in a resource group a DIFFERENT administrator controls than the vaults (the 01-mua-guard preset's posture, with no exclusions); a guard in the vaults' own scope is a speed bump, not a control.
    - control_id: workload-identity
      status: not_applicable
      notes: The guard runs no workloads and holds no credentials.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths of its own; approvals ride Entra-ID-authenticated ARM.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Guard writes and guarded-operation approvals land in the Azure Activity Log as subscription-level posture; the guard itself has no logging surface in this spec.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The guard publishes no metrics of its own.
    - control_id: backup-recovery
      status: not_applicable
      notes: Stateless declarative configuration -- the manifest recreates the guard exactly; there is no runtime state to back up.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery). The guard's relationship to retention is indirect -- reducing retention on a guarded vault requires an approval.
    - control_id: multi-zone-ha
      status: not_applicable
      notes: A control-plane governance object with no data plane of its own; ARM's availability carries it.
    - control_id: deletion-protection
      status: not_applicable
      notes: Honestly the guard's weak spot -- it deletes cleanly even while vaults reference it, and the approval requirement leaves with it (Azure does not gate the guard with itself). Gate guard deletion with resource locks or pipeline approvals; neither is a field of this spec.
    - control_id: managed-patching
      status: not_applicable
      notes: Pure configuration inside the Microsoft-operated Azure Backup service -- no software surface of its own to patch.
