syntax = "proto3";

package dev.planton.azure.azuredatafactorypipeline.v1alpha1;

import "catalog/azure/azuredatafactorypipeline/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureDataFactoryPipelineIacInput is the input to the IaC modules
// (Pulumi/Terraform). It contains the target resource definition and
// Azure provider credentials.
message AzureDataFactoryPipelineIacInput {
  // The Data Factory pipeline resource to deploy.
  AzureDataFactoryPipeline target = 1;

  // Azure provider configuration (credentials).
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
