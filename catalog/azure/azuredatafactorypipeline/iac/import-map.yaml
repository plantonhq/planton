apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: azuredatafactorypipeline
spec:
  # The pipeline's identity is its full factory-scoped ARM ID
  # ({factory_id}/pipelines/{name}).
  values:
    - name: pipeline_id
      derivations:
        - from_output: pipeline_id
      where_to_find: >-
        Compose it from the factory's resource ID plus
        /pipelines/<pipeline-name>, or `az datafactory pipeline show
        --factory-name <factory> -g <rg> -n <name> --query id`; also
        the component's own pipeline_id output.
