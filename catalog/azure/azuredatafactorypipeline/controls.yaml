# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azuredatafactorypipeline
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A pipeline is orchestration logic -- an ordered activity list, parameters, and variables -- and carries no data of its own at rest. The definition is stored by the Microsoft-operated Data Factory service under the FACTORY's encryption posture; the data its activities move rests in the external systems, which own that posture. Secrets never belong in a pipeline -- connections and credentials live on linked services.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest of its own to key (see enc-at-rest); the customer-managed-key lever for stored factory definitions (pipelines included) lives on the AzureDataFactory kind.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The pipeline moves no bytes itself -- at run time, each activity's transport rides the linked service's connection and the integration runtime executing it, which own that posture. Managing the definition flows through ARM's TLS-only management API.
    - control_id: no-public-access
      status: not_applicable
      notes: An orchestration definition has no network endpoint -- nothing exists to reach from the internet. The factory's own endpoint exposure (public_network_enabled) is AzureDataFactory posture.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network surface to restrict (see no-public-access).
    - control_id: edge-protection
      status: not_applicable
      notes: No inbound request path exists to filter.
    - control_id: rbac
      status: not_applicable
      notes: Authoring and running the pipeline is governed by ARM RBAC on the factory (Data Factory Contributor authors; factories/pipelines/createrun/action gates on-demand runs) -- platform posture for every factory entity, with no authorization plane on the pipeline itself.
    - control_id: workload-identity
      status: not_applicable
      notes: The pipeline authenticates nobody. Activities reach external systems through linked services, where the identity-versus-secret choice is made (the AzureDataFactoryLinkedService kind); the factory's managed identity is AzureDataFactory posture.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication path of its own to strengthen or disable; login patterns live on the linked services its activities reference.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Authoring operations on pipelines land in the Azure Activity Log automatically, and per-run history (pipeline runs, activity runs, trigger runs) is captured by the factory's diagnostic settings -- both factory-level posture with no toggle on the pipeline.
    - control_id: monitoring-integration
      status: configurable
      field_path: monitor_metrics_after_duration
      evidence:
        type: spec_default
        reference: Setting an elapsed-time TimeSpan (e.g. "0.00:30:00") makes the run emit the factory's elapsed-time metric when this pipeline exceeds it -- the one per-pipeline observability lever this surface offers, alertable through Azure Monitor. Omitted, no elapsed-time signal fires.
      notes: Run telemetry beyond that single metric (run outcomes, activity durations, consumption) is factory-level -- the AzureDataFactory's diagnostic settings export it; the pipeline itself adds only this threshold.
    - control_id: backup-recovery
      status: not_applicable
      notes: Declarative definition -- nothing to back up; the manifest recreates the pipeline in the factory's pipeline namespace. Factories bound to a git repository additionally keep the authored JSON versioned there (AzureDataFactory posture).
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: A pipeline has no standing runtime footprint with a zonal failure mode; runs execute on the Microsoft-operated service and the integration runtimes, whose resilience is their own kinds' posture.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither Azure nor this spec offers a deletion-protection flag for a pipeline; deleting one silently orphans the triggers that reference it (their next fire fails) and is recreated declaratively.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The service that stores pipeline definitions and orchestrates their runs is Microsoft-operated Azure Data Factory; no customer-visible patch surface exists on the entity.
