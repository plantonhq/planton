syntax = "proto3";

package dev.planton.azure.azurerediscacheaccesspolicy.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurerediscacheaccesspolicy/v1alpha1/outputs.proto";
import "catalog/azure/azurerediscacheaccesspolicy/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureRedisCacheAccessPolicy is the top-level API resource for a custom
// Redis data-plane access policy -- a named permission set in Redis ACL
// syntax defined on an AzureRedisCache (referenced via redis_cache_id)
// and granted to Microsoft Entra identities through
// AzureRedisCacheAccessPolicyAssignment. The data-plane analog of a
// custom role definition.
message AzureRedisCacheAccessPolicy {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureRedisCacheAccessPolicy'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureRedisCacheAccessPolicySpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureRedisCacheAccessPolicyStatus status = 5;
}

// AzureRedisCacheAccessPolicyStatus holds the deployment status and outputs.
message AzureRedisCacheAccessPolicyStatus {
  // outputs
  AzureRedisCacheAccessPolicyOutputs outputs = 1;
}
