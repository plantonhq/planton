# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azurerediscacheaccesspolicy
spec:
  billing_model: free
  free_tier: A custom access policy is pure configuration -- a named permission set in Redis's own ACL syntax, defining WHAT token-authenticated clients may do on the cache. Azure has no meter for access policies; the three built-ins exist on every cache at no charge, and custom ones cost nothing to create, hold, or update.
  notes: "No field of this spec buys anything: redis_cache_id points at the AzureRedisCache that bills as its own catalog kind (an hourly rate set by tier and size), policy_name is a label, and the permissions ACL string is evaluated by the cache's own engine at no charge. Microsoft Entra authentication on the cache -- the feature that makes these policies matter -- also carries no meter; the commands a policy-governed client runs consume capacity the cache already pays for."
