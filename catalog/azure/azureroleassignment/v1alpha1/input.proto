syntax = "proto3";

package dev.planton.azure.azureroleassignment.v1alpha1;

import "catalog/azure/azureroleassignment/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureRoleAssignmentIacInput is the input to the IaC module.
