syntax = "proto3";

package dev.planton.azure.azureroleassignment.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureroleassignment/v1alpha1/outputs.proto";
import "catalog/azure/azureroleassignment/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureRoleAssignment is the top-level API resource for an Azure RBAC role
// assignment -- the grant of a role to a principal at a scope. It is the
// atomic unit of Azure authorization, modeled as a first-class composable
// resource so identities, grants, and the resources they protect are
// independent nodes in an environment's graph.
message AzureRoleAssignment {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'AzureRoleAssignment'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  AzureRoleAssignmentSpec spec = 4 [(buf.validate.field).required = true];

  // status
  AzureRoleAssignmentStatus status = 5;
}

// AzureRoleAssignmentStatus holds the deployment status and outputs.
message AzureRoleAssignmentStatus {
  // outputs
  AzureRoleAssignmentOutputs outputs = 1;
}
