syntax = "proto3";

package dev.planton.azure.azureroleassignment.v1alpha1;

// **AzureRoleAssignmentOutputs** captures the outputs of provisioning an
// Azure RBAC role assignment. The fully-scoped ARM ID is the assignment's
// identity for auditing and for the authorization API; the resolved
// scope/role/principal coordinates are exported so downstream automation can
// reason about the grant without re-reading the spec (the role definition ID
// in particular is resolved even when the spec referenced the role by name).
message AzureRoleAssignmentOutputs {
  // The fully-scoped Azure Resource Manager ID of the role assignment.
  // Format: {scope}/providers/Microsoft.Authorization/roleAssignments/{name}
  // This is the identifier the authorization API uses to fetch or delete the
  // assignment.
  string role_assignment_id = 1;

  // The assignment's ARM resource name -- the GUID that (with the scope)
  // uniquely identifies it. Either the pinned spec.name or the GUID generated
  // at deploy time.
  string name = 2;

  // The scope the role was granted at, as resolved at deploy time.
  string scope = 3;

  // The fully-scoped role definition ID that was bound. Populated whether the
  // spec referenced the role by name or by ID -- when a built-in role name was
  // given, this carries the ID Azure resolved it to.
  string role_definition_id = 4;

  // The Azure AD object ID of the principal the role was granted to.
  string principal_id = 5;

  // The principal type Azure recorded for the assignment (User, Group, or
  // ServicePrincipal) -- useful when the spec omitted principal_type and Azure
  // inferred it from the directory.
  string principal_type = 6;
}
