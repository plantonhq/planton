# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azurevirtualnetworkpeering
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: "The peering is routing configuration -- it stores no customer data. Its state (the two network IDs, the connectivity flags) is ARM metadata on Microsoft's control plane."
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: "With nothing stored, there is no store to key (see enc-at-rest)."
    - control_id: enc-in-transit
      status: not_applicable
      notes: "The peering is L3 plumbing and imposes no encryption of its own -- private connectivity without encryption overhead is the product's stated shape. Peered traffic stays on the Microsoft backbone and never touches the public internet; workloads needing cryptographic protection across the link compose TLS at the application layer or an IPsec gateway/NVA path instead of (or over) the peering."
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Peered traffic flows between private IP addresses over the Microsoft backbone exclusively -- no public IPs, no internet transit, no gateways in the path. Nothing about the peering is internet-facing by construction."
    - control_id: restricted-ingress
      status: configurable
      field_path: allow_forwarded_traffic
      evidence:
        type: spec_default
        reference: "Azure's default (false) admits only traffic ORIGINATING in the remote network -- packets it merely relays from elsewhere (an NVA, a VPN) are dropped at this end. allow_virtual_network_access can block even direct traffic for inspection topologies, and subnet-scoped peering (peer_complete_virtual_networks_enabled false with the subnet-name lists) narrows the link to declared subnets only."
      notes: "The 01-hub-to-spoke preset enables forwarded traffic deliberately (the hub relays inspected spoke traffic); 03-subnet-scoped-peering narrows reachability to listed subnets. Per-flow enforcement inside the peered space remains NSG territory on the subnets themselves."
    - control_id: edge-protection
      status: not_applicable
      notes: "A network link offers no request-filtering attachment point -- WAF belongs to the HTTP-aware tiers behind it. The peering-layer analogue is the inspection topology: allow_forwarded_traffic plus user-defined routes steering flows through a hub firewall, composed on those components."
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Every management operation is ARM RBAC -- and creating even one direction requires rights on BOTH scopes: virtualNetworkPeerings/write on the local network and peer/action on the remote one, so neither network's owner can be joined to without consenting authorization. The data plane is L3 connectivity with no authentication plane of its own."
    - control_id: workload-identity
      status: not_applicable
      notes: "The peering runs no workloads and holds no credentials -- there is no identity to attach."
    - control_id: no-legacy-auth
      status: not_applicable
      notes: "The only authenticated surface is the ARM management plane, authenticated by Entra ID -- there is no local-credential or legacy-protocol path to disable."
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Every management-plane action on the peering lands in the Azure Activity Log unconditionally -- who connected the networks, who flipped the traffic flags, who severed the link."
    - control_id: monitoring-integration
      status: not_applicable
      notes: "Peerings publish no metrics of their own -- the peering's state (Connected / Disconnected) surfaces on the parent network resource, and traffic visibility across the link rides virtual network flow logs and Network Watcher, configured on the network components."
    - control_id: backup-recovery
      status: not_applicable
      notes: "There is no data to back up -- the peering is declarative in this manifest and re-creatable by a fresh deploy. The operational caveat: recreation is a brief connectivity gap for this direction, and both directions must exist before traffic flows again."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: "No backups exist to retain (see backup-recovery)."
    - control_id: multi-zone-ha
      status: not_applicable
      notes: "The peering is configuration, not a running instance -- there is nothing of it to replicate, and the connectivity it establishes rides Microsoft's backbone with no zonal failure mode of its own. Cross-region resilience is composed with additional networks and additional peerings, which is exactly what global peering exists for."
    - control_id: deletion-protection
      status: not_applicable
      notes: "Neither the peering API nor this spec offers a deletion-protection flag; Azure resource locks are subscription-side governance outside the manifest. Deleting one direction severs connectivity for the pair -- allow_virtual_network_access false is the reversible way to stop traffic without dismantling the link."
    - control_id: managed-patching
      status: not_applicable
      notes: "Pure configuration -- there is no software surface to patch. The backbone infrastructure carrying peered traffic is Microsoft-managed."
