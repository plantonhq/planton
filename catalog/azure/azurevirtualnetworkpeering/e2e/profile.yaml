apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurevirtualnetworkpeering
spec:
  # The harness deploys the fixture resource group and virtual network
  # (registry prerequisites) plus a scenario-declared SECOND network (a
  # path-form extra fixture -- the standard profiles provide one instance
  # of a kind, and a peering needs two), creates one direction of a peering
  # between them, verifies it via the ARM API (generic GetByID on the
  # peering's ARM id), destroys it, and verifies it is gone -- on both
  # provisioners. Networks and peerings are free.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
