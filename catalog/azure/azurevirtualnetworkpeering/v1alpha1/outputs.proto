syntax = "proto3";

package dev.planton.azure.azurevirtualnetworkpeering.v1alpha1;

// **AzureVirtualNetworkPeeringOutputs** captures the outputs of
// provisioning one direction of an Azure virtual network peering.
message AzureVirtualNetworkPeeringOutputs {
  // The Azure Resource Manager ID of the peering.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/virtualNetworks/{vnet}/virtualNetworkPeerings/{name}
  string peering_id = 1;

  // The name of the peering within its local virtual network.
  string peering_name = 2;

  // The name of the LOCAL virtual network the peering is written on,
  // derived from the referenced network's ARM ID -- exported so charts can
  // compose sibling resources without re-parsing the ID.
  string virtual_network_name = 3;

  // The name of the resource group the local network lives in, derived
  // from the referenced network's ARM ID.
  string resource_group_name = 4;
}
