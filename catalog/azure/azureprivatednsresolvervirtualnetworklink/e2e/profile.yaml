apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azureprivatednsresolvervirtualnetworklink
spec:
  # green: live dual-engine proof complete. The `minimal` scenario
  # (links the fixture ruleset to the fixture network -- the hub-link
  # pattern) passed the full lifecycle on BOTH engines, live-proving
  # the family's full three-level reference chain: the lane deployed
  # fixture resolver -> fixture ruleset -> smoke link, deploys 20-29s
  # and destroys 20-32s (the ~7-9 minute fixture chain dominates the
  # 16m25s-17m28s lanes), idempotency re-plans clean, 2/2 outputs
  # populated. The Terraform lane's blind import round-trip re-imported
  # the link by its ruleset-child ARM id (resolved through the chain,
  # under the FIXTURE ruleset) with a zero-change plan and zero
  # tolerances consumed. Links are free at rest; the chained fixture
  # resolver's outbound endpoint hours are the only billing meter
  # (cents). This kind's lane never runs in parallel with the resolver
  # or ruleset lanes (the chained fixture resolver anchors the shared
  # fixture network -- Azure allows one resolver per network; the
  # family's serialization contract and the resurfacing-resource-group
  # teardown class live in the harness manual). OFFLINE-ONLY with
  # reasons: the metadata-update arm (the link's one in-place surface
  # -- a property write on the object the lane creates);
  # cross-subscription links (the shared test subscription is single
  # -- unblock: a second subscription in the suite).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 60
