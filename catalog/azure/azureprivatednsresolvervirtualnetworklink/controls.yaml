# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: azureprivatednsresolvervirtualnetworklink
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The link is an attachment record between a ruleset and a network; it stores no customer data at rest.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to encrypt (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: The link moves no traffic itself -- it activates the ruleset's forwarding for one network; transport characteristics belong to the resolver's endpoints and the forwarding targets.
    - control_id: no-public-access
      status: not_applicable
      notes: The link has no reachable endpoint; it is control-plane configuration scoping which PRIVATE network the ruleset steers.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No inbound surface of its own.
    - control_id: edge-protection
      status: not_applicable
      notes: No request path of its own to filter.
    - control_id: rbac
      status: not_applicable
      notes: Management access is ARM RBAC on the ruleset's virtualNetworkLinks operations plus join authorization on the linked network (subscription/resource-group posture); the link exposes no authentication plane of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The link runs no workloads and holds no credentials.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths of its own.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Link writes land in the Azure Activity Log as subscription-level posture; there is no query-audit surface on the link.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The link publishes no metrics of its own; forwarding health is observed on the resolver's endpoints, a separate catalog kind.
    - control_id: backup-recovery
      status: not_applicable
      notes: Stateless declarative configuration -- the manifest recreates the link exactly; there is no runtime state to back up.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: An attachment record with no data plane of its own -- resolution availability for the linked network rides the DNS Private Resolver's endpoints, a separate catalog kind.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither ARM nor this spec offers a deletion-protection flag for links (Azure resource locks are subscription-side governance outside the manifest). Deleting the link returns the network's captured domains to normal in-Azure resolution.
    - control_id: managed-patching
      status: not_applicable
      notes: Pure configuration inside the Microsoft-operated DNS Private Resolver service -- no software surface of its own to patch.
