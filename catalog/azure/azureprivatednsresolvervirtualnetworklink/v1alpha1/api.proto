syntax = "proto3";

package dev.planton.azure.azureprivatednsresolvervirtualnetworklink.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azureprivatednsresolvervirtualnetworklink/v1alpha1/outputs.proto";
import "catalog/azure/azureprivatednsresolvervirtualnetworklink/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzurePrivateDnsResolverVirtualNetworkLink is the top-level API
// resource describing the attachment that makes a DNS forwarding
// ruleset take effect in one virtual network.
message AzurePrivateDnsResolverVirtualNetworkLink {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzurePrivateDnsResolverVirtualNetworkLink".
  string kind = 2 [(buf.validate.field).string.const = 'AzurePrivateDnsResolverVirtualNetworkLink'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Virtual network link specification.
  AzurePrivateDnsResolverVirtualNetworkLinkSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzurePrivateDnsResolverVirtualNetworkLinkStatus status = 5;
}

// AzurePrivateDnsResolverVirtualNetworkLinkStatus holds the deployment
// outputs.
message AzurePrivateDnsResolverVirtualNetworkLinkStatus {
  // Outputs from the IaC deployment.
  AzurePrivateDnsResolverVirtualNetworkLinkOutputs outputs = 1;
}
