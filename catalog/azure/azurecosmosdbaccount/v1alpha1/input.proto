syntax = "proto3";

package dev.planton.azure.azurecosmosdbaccount.v1alpha1;

import "catalog/azure/azurecosmosdbaccount/v1alpha1/api.proto";
import "catalog/azure/provider.proto";

// AzureCosmosdbAccountIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message AzureCosmosdbAccountIacInput {
  // the catalog object to deploy to be deployed
  AzureCosmosdbAccount target = 1;
  // provider-config for Azure authentication
  dev.planton.azure.AzureProviderConfig provider_config = 2;
}
