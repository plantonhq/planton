apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurecosmosdbaccount
spec:
  # The harness deploys the fixture resource group, creates a single-region
  # SQL API account with session consistency (never free_tier -- one per
  # subscription), verifies it via the ARM API, destroys it, and verifies
  # it is gone -- on both provisioners.
  #
  # Cosmos accounts provision in ~3-5 minutes; teardown takes ~8-9 more
  # while Azure drains the account (the full scenario runs ~13 min per
  # engine). Scenarios pin westus3: eastus rejects new accounts under
  # zonal-capacity pressure (ServiceUnavailable) even for non-zonal
  # requests -- see e2e/README.md.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 60
