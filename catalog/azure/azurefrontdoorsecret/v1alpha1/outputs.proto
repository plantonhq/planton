syntax = "proto3";

package dev.planton.azure.azurefrontdoorsecret.v1alpha1;

// **AzureFrontDoorSecretOutputs** captures the outputs of
// provisioning an Azure Front Door secret.
message AzureFrontDoorSecretOutputs {
  // The Azure Resource Manager ID of the secret -- what
  // AzureFrontDoorCustomDomain's tls.secret_id references to terminate
  // TLS with the wrapped certificate.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Cdn/profiles/{profile}/secrets/{name}
  string secret_id = 1;

  // The secret's name -- unique within its profile.
  string secret_name = 2;

  // The DNS names (subject + subject alternative names) the wrapped
  // certificate covers -- read back from the certificate so operators
  // can confirm a domain's host_name is actually covered before
  // attaching the secret to it.
  repeated string subject_alternative_names = 3;
}
