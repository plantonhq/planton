# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azurefrontdoorsecret
spec:
  billing_model: free
  free_tier: The secret itself never bills -- it is a reference wrapper that lets Front Door serve a Key Vault certificate; Azure charges nothing to hold or serve it at the edge.
  notes: "No field of this spec buys anything: the secret is configuration on the Front Door PROFILE it references (profile_id), and Front Door billing lives there -- a base fee per its own SKU plus requests and egress, a separate catalog kind. The certificate the secret wraps lives in Key Vault, whose vault and certificate operations bill on the Key Vault side as their own catalog kinds. Certificate rotation (new Key Vault versions followed by a versionless reference) moves no money through this resource."
