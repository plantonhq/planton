# Minimal AzureMachineLearningWorkspace scenario: a Basic workspace
# with a system identity on the fixture companion chain (storage
# account + key vault + application insights). DEFAULT managed-network
# mode -- no isolation, no outbound rules. Two live attempts at the
# approved-outbound + provision-on-creation flagship failed in
# different ways (PE-rule destroy 409-loop; managed-VNet create
# rolled the workspace back with "workspace identity has been
# deleted"). The workspace OBJECT lifecycle (create, identity,
# outputs, purge-on-destroy) is what this lane proves; the managed
# network and its three composed children stay offline-proven, with
# the live findings on the spec fields.
#
# The workspace object provisions in two to five minutes;
# provisionOnCreationEnabled makes the managed VNet materialize at
# deploy time (several more minutes, incl. the private endpoint) so
# failures land in the create, not on a first job. The Basic tier is
# free at rest -- the fixture storage/insights/log-analytics cost
# pennies. Deletion is a SOFT delete at the service: both modules
# enable the provider's machine_learning purge features flag, so the
# lane's destroy purges the ghost and frees this fixed name for the
# other engine's run (no CLI or API lists ML ghosts -- the portal's
# "Recently deleted" view is the only listing surface).
apiVersion: azure.planton.dev/v1alpha1
kind: AzureMachineLearningWorkspace
metadata:
  name: planton-oss-e2e-azuremachinelearningworkspace-smoke
  id: planton-oss-e2e-azuremachinelearningworkspace-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: azuremachinelearningworkspace
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: eastus
  resourceGroup:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-rg
  name: planton-oss-e2e-mlw-smoke
  applicationInsightsId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-appi
  keyVaultId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-kv
  storageAccountId:
    valueFrom:
      name: planton-oss-e2e-azure-fixture-sa
  identity:
    type: SYSTEM_ASSIGNED
  friendlyName: E2E Smoke Workspace
  tags:
    e2e-suite: azure
    purpose: smoke
