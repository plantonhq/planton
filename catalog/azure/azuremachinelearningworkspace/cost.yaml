# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: azuremachinelearningworkspace
spec:
  billing_model: free
  free_tier: The workspace is the free coordination object a data-science team works in -- experiments, models, endpoints, datastores, and compute all hang off it. Microsoft's pricing page states it plainly -- there is no additional charge to use Azure Machine Learning; the workspace object, its managed identity, its managed virtual network, and its outbound rules carry no meter.
  notes: "No field of this spec buys anything directly, but the workspace is the doorway to two kinds of real spend, both billed as their own components. First, the REQUIRED companions it attaches: the storage account (artifacts and default datastores), key vault (secrets), application-insights component (telemetry), and optional container registry each bill at their own rates -- attaching them here changes nothing about their bills. Second, everything that RUNS through the workspace: compute instances and clusters, serverless jobs, and the VMs behind online-endpoint deployments are the actual Azure ML spend, metered as the compute they consume. CMK encryption adds Key Vault key operations and, service-side, a per-workspace Cosmos/search footprint Microsoft documents with the encryption feature -- posture spend, not a workspace meter."
