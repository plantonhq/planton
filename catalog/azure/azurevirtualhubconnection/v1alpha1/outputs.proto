syntax = "proto3";

package dev.planton.azure.azurevirtualhubconnection.v1alpha1;

// **AzureVirtualHubConnectionOutputs** captures the outputs of
// provisioning a Virtual Hub Connection.
message AzureVirtualHubConnectionOutputs {
  // The Azure Resource Manager ID of the connection -- what a hub BGP
  // peering references as its virtual_network_connection_id.
  // Format: /subscriptions/{sub}/resourceGroups/{rg}/providers/Microsoft.Network/virtualHubs/{hub}/hubVirtualNetworkConnections/{name}
  string virtual_hub_connection_id = 1;

  // The name of the connection.
  string virtual_hub_connection_name = 2;
}
