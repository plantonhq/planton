syntax = "proto3";

package dev.planton.azure.azurevirtualhubconnection.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/azure/azurevirtualhubconnection/v1alpha1/outputs.proto";
import "catalog/azure/azurevirtualhubconnection/v1alpha1/spec.proto";
import "shared/metadata.proto";

// AzureVirtualHubConnection is the top-level API resource describing a
// Virtual Hub Connection -- the attachment that joins a virtual network
// (a spoke) to a Virtual WAN hub.
message AzureVirtualHubConnection {
  // API version identifier. Must be "azure.planton.dev/v1alpha1".
  string api_version = 1 [(buf.validate.field).string.const = 'azure.planton.dev/v1alpha1'];

  // Resource kind. Must be "AzureVirtualHubConnection".
  string kind = 2 [(buf.validate.field).string.const = 'AzureVirtualHubConnection'];

  // Standard Planton metadata (name, org, env, labels, tags).
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // Virtual Hub Connection specification.
  AzureVirtualHubConnectionSpec spec = 4 [(buf.validate.field).required = true];

  // Deployment status containing outputs. Populated after deployment.
  AzureVirtualHubConnectionStatus status = 5;
}

// AzureVirtualHubConnectionStatus holds the deployment outputs.
message AzureVirtualHubConnectionStatus {
  // Outputs from the IaC deployment.
  AzureVirtualHubConnectionOutputs outputs = 1;
}
