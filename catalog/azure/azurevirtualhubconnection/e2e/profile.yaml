apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: azurevirtualhubconnection
spec:
  # Proven live on both engines (full lifecycle + blind single-id import
  # round-trip, zero-change plan; ARM accepted the propagation-only
  # routing block -- the at-least-one-of contract satisfied by
  # propagation alone). Measured: the connection itself deploys in ~2m
  # and destroys in ~2m; the lane total (~37-39m per engine) is
  # dominated by the fixture hub's cycle inside the lane (~17-20m
  # create, ~13m teardown) alongside the fixture VNet. The timeout
  # budgets the full chain.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 120
