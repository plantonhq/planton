apiVersion: auth0.planton.dev/v1alpha1
kind: Auth0Branding
metadata:
  name: branding
  org: example-org
  env: production
  relationships:
    - kind: Auth0CustomDomainVerification
      name: sign-in-domain-verification
      type: depends_on
spec:
  logoUrl: https://assets.example.com/logo.png
  faviconUrl: https://assets.example.com/favicon.png
  colors:
    primary: "#0059d6"
    pageBackground: "#0b1120"
  # The page the login box renders inside. Both tags are required:
  # auth0:head inside <head>, auth0:widget where the login box goes.
  universalLoginTemplate: |
    <!DOCTYPE html>
    <html lang="{{ locale }}">
      <head>
        {%- auth0:head -%}
        <style>
          body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
          .site-header, .site-footer { padding: 16px 24px; color: #ffffff; font-family: system-ui, sans-serif; }
          .site-main { flex: 1; display: flex; align-items: center; justify-content: center; }
          .site-footer a { color: #ffffff; }
        </style>
        <title>{{ prompt.screen.texts.pageTitle }}</title>
      </head>
      <body class="_widget-auto-layout">
        <header class="site-header">Example</header>
        <main class="site-main">
          {%- auth0:widget -%}
        </main>
        <footer class="site-footer">
          <a href="https://example.com/support">Help</a> &middot;
          <a href="https://example.com/privacy">Privacy</a>
        </footer>
      </body>
    </html>
