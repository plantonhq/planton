apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: auth0branding
spec:
  # A tenant has ONE branding and ONE theme, and applying this component
  # rewrites the look of every login page the tenant serves: a live lane
  # needs a dedicated test tenant whose login pages nobody signs in through.
  # None exists yet, so the lanes are not run; the first live proof is an
  # operator's own tenant, read back on its login page. Unblock: a throwaway
  # Auth0 tenant for the E2E harness (AUTH0_DOMAIN / AUTH0_CLIENT_ID /
  # AUTH0_CLIENT_SECRET, the credential holding read:branding,
  # update:branding, delete:branding and read:custom_domains), then run both
  # engines' minimal and theme scenarios. A page-template scenario would
  # also compose a verified custom domain, so it needs the
  # auth0customdomainverification lane's arrangement too (its parent domain,
  # Cloudflare zone and credentials, and the custom_domains scopes).
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 5
