# A theme alone: only the login box's look is managed, so the tenant's logo,
# favicon, colors and font are not touched (the branding resource is not
# declared). The theme is sent whole -- every field left out at Auth0's
# default -- and destroy deletes it, returning the login box to Auth0's look.
apiVersion: auth0.planton.dev/v1alpha1
kind: Auth0Branding
metadata:
  name: e2e-branding-theme
  org: e2e-org
  env: testing
spec:
  theme:
    displayName: Planton E2E
    borders:
      buttonsStyle: sharp
      showWidgetShadow: false
    fonts:
      title:
        bold: true
    pageBackground:
      pageLayout: left
