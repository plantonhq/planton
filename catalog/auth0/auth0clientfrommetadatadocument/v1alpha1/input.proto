syntax = "proto3";

package dev.planton.auth0.auth0clientfrommetadatadocument.v1alpha1;

import "catalog/auth0/auth0clientfrommetadatadocument/v1alpha1/api.proto";
import "catalog/auth0/provider.proto";

// Auth0ClientFromMetadataDocumentIacInput is the input to the
// Auth0ClientFromMetadataDocument IaC module. It contains the target resource
// and the Auth0 provider configuration.
message Auth0ClientFromMetadataDocumentIacInput {
  // target is the Auth0ClientFromMetadataDocument resource to be deployed.
  Auth0ClientFromMetadataDocument target = 1;

  // provider_config contains the Auth0 credentials for authentication: the
  // tenant's domain and a Machine-to-Machine application's client id and secret.
  // The application is registered in that tenant, and the credential needs
  // create:clients, read:clients, update:clients and delete:clients on its
  // Management API.
  dev.planton.auth0.Auth0ProviderConfig provider_config = 2;
}
