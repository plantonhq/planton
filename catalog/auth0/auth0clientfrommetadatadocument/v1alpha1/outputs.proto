syntax = "proto3";

package dev.planton.auth0.auth0clientfrommetadatadocument.v1alpha1;

// Auth0ClientFromMetadataDocumentStackOutputs contains the application as Auth0
// registered it: its Management API id, what Auth0 took from the metadata
// document, and the document's validation result as of the last read.
//
// https://registry.terraform.io/providers/auth0/auth0/latest/docs/resources/client_cimd#read-only
// https://www.pulumi.com/registry/packages/auth0/api-docs/clientcimd/#outputs
message Auth0ClientFromMetadataDocumentStackOutputs {
  // client_id is the application's id in the Management API ("tpc_...", the
  // prefix of every third-party application). A client grant authorizing the
  // application for an API, and an Auth0Connection's enabled_clients, name the
  // application by it. In sign-in flows the application presents
  // external_client_id instead.
  string client_id = 1;

  // external_client_id is the metadata document's URL: the client_id the
  // application sends to /authorize and /oauth/token, and the value its
  // access tokens carry as client_id.
  string external_client_id = 2;

  // name is the application's name, from the document's client_name: what
  // Auth0 shows people on the consent screen.
  string name = 3;

  // app_type is the application type Auth0 holds ("native", "regular_web" or
  // "spa"): the spec's app_type when set, otherwise the document's.
  string app_type = 4;

  // grant_types are the grants Auth0 holds for the application: the spec's
  // when set, otherwise the document's supported ones.
  repeated string grant_types = 5;

  // callbacks are the redirect URIs Auth0 sends people back to, from the
  // document's redirect_uris.
  repeated string callbacks = 6;

  // logo_uri is the logo Auth0 shows on the consent screen, from the
  // document.
  string logo_uri = 7;

  // jwks_uri is where the application publishes the public keys it signs
  // private_key_jwt assertions with, from the document; empty for a public
  // client.
  string jwks_uri = 8;

  // third_party_security_mode is the security mode Auth0 registered the
  // application in: always "strict" for a registration from a metadata
  // document.
  string third_party_security_mode = 9;

  // external_metadata_created_by is who registered the application: "admin"
  // (through the Management API, as this resource does) or "client" (the
  // application registered itself).
  string external_metadata_created_by = 10;

  // validation_valid is whether the document, as Auth0 fetched it at the last
  // read, passes Auth0's validation.
  bool validation_valid = 11;

  // validation_warnings are what Auth0 ignored in the document at the last
  // read -- a property it does not support, a grant type it filtered out.
  repeated string validation_warnings = 12;

  // validation_violations are what prevents Auth0 from processing the
  // document fully as it stands at the last read -- for the document's owner
  // to fix before the next fetch (external_client_id_version).
  repeated string validation_violations = 13;
}
