# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: auth0clientfrommetadatadocument
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: "An application registration (the document's URL and the settings the tenant sets over it: origins, token lifetimes, refresh-token rotation, metadata) inside Auth0's SaaS control plane, none of it secret -- the application holds no client secret, only public keys the document's jwks_uri serves; its storage is Auth0's provider-managed posture, with no encryption seam in this spec."
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: There is no data at rest at this component's level to key (see enc-at-rest); Auth0 exposes no customer-managed-key surface on applications.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: spec_validation
        reference: "spec.external_client_id.https_url in spec.proto: the metadata document's URL must be https://, so Auth0 fetches the document -- and, by Auth0's same-origin rule, its jwks_uri -- only over TLS; Auth0 refuses any other document URL (auth0.com/docs/get-started/auth0-overview/create-applications/register-applications-with-cimd, CIMD URL validation rules)."
      notes: The modules reach Auth0 only through the Management API, served exclusively over HTTPS.
    - control_id: no-public-access
      status: not_applicable
      notes: "The application is a sign-in client by design; what it may reach is governed by client grants (a third-party application reaches an API only through an explicit grant, never the Management API) and by the tenant's domain-level connections, not by this registration."
    - control_id: restricted-ingress
      status: not_applicable
      notes: The spec has no network filter to configure; allowed_origins and web_origins govern which browser origins may call Auth0 for this application, not network ingress to a resource.
    - control_id: edge-protection
      status: not_applicable
      notes: Auth0's own edge serves the tenant's sign-in endpoints (its attack protection is the tenant's posture), outside this spec.
    - control_id: rbac
      status: not_applicable
      notes: WHO may change the tenant's applications is governed at the Auth0 tenant level -- Management API tokens scoped as iac/permissions.yaml lists, and dashboard admin roles -- with no per-application access-control surface in this spec.
    - control_id: workload-identity
      status: not_applicable
      notes: "The component authenticates to nothing; the credential the IaC runner presents is the provider connection's concern (iac/permissions.yaml). The application it registers never holds a shared secret: Auth0 accepts only none (a public client using PKCE) or private_key_jwt with keys from the document's jwks_uri, and require_proof_of_possession can bind its tokens to its key."
    - control_id: no-legacy-auth
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Auth0 registers every application from a metadata document as a strict third-party application: only the authorization_code grant (with mandatory PKCE) and refresh_token, no implicit or password grant, and no client-secret authentication (auth0.com/docs/get-started/auth0-overview/create-applications/register-applications-with-cimd and auth0.com/docs/get-started/applications/third-party-applications/security-controls); the spec's grant_types admits only those two grants (repeated.items.string.in in spec.proto)."
    - control_id: strong-user-auth
      status: not_applicable
      notes: The application changes which client people sign in to, never how they prove who they are; credential strength lives on the tenant's connections (the auth0connection kind) and its multi-factor policy.
    - control_id: audit-logging
      status: not_applicable
      notes: The spec exposes no audit toggle. Registration and changes are Management API operations captured in Auth0's tenant logs (exported, where wanted, by the auth0eventstream kind), which name the application by its document URL.
    - control_id: monitoring-integration
      status: not_applicable
      notes: Neither the spec nor the modules expose a metrics surface for applications; the document's validation result is reported as outputs (validation_valid, validation_warnings, validation_violations).
    - control_id: backup-recovery
      status: not_applicable
      notes: "The registration is declaratively re-creatable from the manifest and the hosted document, so the two are the recovery point; a re-created application receives a new client_id, and grants that named the old one are applied again."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist at this component's level to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The object has no placement to configure; availability of the sign-in endpoints is Auth0's SaaS platform posture.
    - control_id: deletion-protection
      status: not_applicable
      notes: "Destroying this resource deletes the application in Auth0 (DELETE /api/v2/clients/{id}); sign-in through it stops at once. Because registration is keyed by the document's URL, applying the same URL later registers it again under a new client_id."
    - control_id: managed-patching
      status: not_applicable
      notes: A pure configuration object with no software of its own to patch; the sign-in endpoints are Auth0's SaaS, patched by Auth0.
