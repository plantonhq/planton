# Provider-parity manifest: this kind's recorded judgment against the pinned
# auth0 provider (checked by `planton provider-parity --check`; format
# documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

# This kind carries ZERO divergences: every configurable argument of
# auth0_client_cimd -- external_client_id and external_client_id_version,
# the settings over the document (app_type, grant_types, description,
# allowed_origins, web_origins, oidc_conformant, require_proof_of_possession,
# skip_non_verifiable_callback_uri_confirmation_prompt, redirection_policy,
# organization_discovery_methods, client_metadata) and the blocks
# default_organization, jwt_configuration, refresh_token and
# token_quota.client_credentials, leaf by leaf -- matches its spec field by
# exact name.
resources: {}
