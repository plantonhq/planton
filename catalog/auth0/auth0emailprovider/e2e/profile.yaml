apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: auth0emailprovider
spec:
  # A tenant has ONE email provider, and applying this component replaces
  # whichever one the tenant sends through: a live lane needs a dedicated
  # test tenant whose emails nobody relies on. None exists yet, so the lanes
  # are not run. Unblock: a throwaway Auth0 tenant for the E2E harness
  # (AUTH0_DOMAIN / AUTH0_CLIENT_ID / AUTH0_CLIENT_SECRET, the credential
  # holding the email_provider scopes of iac/permissions.yaml), a sending
  # domain verified with Resend (PLANTON_E2E_AUTH0_EMAIL_FROM_DOMAIN) and a
  # Resend API key with sending access (PLANTON_E2E_AUTH0_RESEND_API_KEY),
  # then run both engines' minimal scenario one after the other. The
  # custom-action scenario also composes an Auth0Action bound to the
  # tenant's custom-email-provider trigger, so it needs the action scopes
  # too.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 5
