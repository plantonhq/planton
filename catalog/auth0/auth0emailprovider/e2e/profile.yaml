apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: auth0emailprovider
spec:
  # A tenant has ONE email provider, and applying this component replaces
  # whichever one the tenant sends through: the lanes run only on a dedicated
  # test tenant whose emails nobody relies on (AUTH0_DOMAIN / AUTH0_CLIENT_ID
  # / AUTH0_CLIENT_SECRET, the credential holding the email_provider scopes of
  # iac/permissions.yaml, plus the action scopes for the custom-action
  # scenario), one lane at a time. They need a sending domain verified with
  # Resend (PLANTON_E2E_AUTH0_EMAIL_FROM_DOMAIN) and a Resend API key with
  # sending access (PLANTON_E2E_AUTH0_RESEND_API_KEY).
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 5
