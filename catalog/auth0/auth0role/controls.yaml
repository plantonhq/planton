# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: auth0role
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A role is a named permission bundle inside Auth0's SaaS control plane -- it stores no data of its own. The tenant configuration it rests in (name, description, permission list, none of it secret) is Auth0's provider-managed storage posture, with no encryption seam in this spec.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: There is no data at rest at this component's level to key (see enc-at-rest); Auth0 exposes no customer-managed-key surface on role objects in the spec or the modules.
    - control_id: enc-in-transit
      status: not_applicable
      notes: A role terminates no connections of its own. The Management API calls that create and manage it travel to Auth0's HTTPS-only API; the tokens that carry its granted permissions ride whatever transport the authorization flow uses, outside this spec.
    - control_id: no-public-access
      status: not_applicable
      notes: A role has no network endpoint to expose; it is a configuration object addressed only through Auth0's Management API and dashboard.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No inbound network surface exists to filter (see no-public-access).
    - control_id: edge-protection
      status: not_applicable
      notes: The object receives no HTTP requests -- there is no request path to put a filter in front of; Auth0's own API edge is Auth0's provider-managed posture.
    - control_id: rbac
      status: not_applicable
      notes: "The role IS the RBAC building block, not a thing RBAC guards: it bundles API permissions (scopes defined on resource servers) for assignment to users, and enforcement happens on the resource server side (the auth0resourceserver kind's enforce_policies). WHO may manage the role object itself is governed at the Auth0 tenant level -- Management API tokens scoped with the roles scopes (documented in iac/permissions.yaml) and dashboard admin roles -- with no per-role access-control surface in this spec."
    - control_id: workload-identity
      status: not_applicable
      notes: The role holds no credentials and authenticates to nothing. The credential the IaC runner presents is the provider connection's concern, documented in iac/permissions.yaml; no spec field selects between static and federated auth.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: A role carries no credential path of its own to weaken or disable -- it grants permissions to identities that authenticated elsewhere; the strength of that authentication is the connections' posture (see strong-user-auth).
    - control_id: strong-user-auth
      status: not_applicable
      notes: "A role is a permission bundle -- it signs nobody in and decides what an already-authenticated user may do, never how that user proves who they are. Credential strength for the tenant's end users (password policy, brute-force protection, MFA) lives on the tenant's connections: the auth0connection kind carries that stance."
    - control_id: audit-logging
      status: not_applicable
      notes: The spec exposes no audit toggle. Changes to the role and its permission list are Management API operations captured in Auth0's tenant logs, whose retention and streaming are tenant-plan posture (exported, where wanted, by the auth0eventstream kind).
    - control_id: monitoring-integration
      status: not_applicable
      notes: Neither the spec nor the modules expose a metrics surface for this object; role-assignment activity is visible only through Auth0's tenant-level logs and dashboard.
    - control_id: backup-recovery
      status: not_applicable
      notes: "The role and its permission list are declaratively re-creatable from the manifest -- the modules manage the COMPLETE permission set authoritatively, so the manifest is the recovery point. What is NOT in the manifest is the role's user assignments, made out-of-band; those live in Auth0's tenant data under Auth0's provider-managed durability."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist at this component's level to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The object has no placement to configure -- availability of role evaluation during login is Auth0's SaaS platform posture.
    - control_id: deletion-protection
      status: not_applicable
      notes: "Neither the Auth0 Management API's roles endpoints nor the auth0 provider exposes a deletion-protection flag: a delete request proceeds when issued, removing the role and its assignments -- users lose the bundled permissions at their next token issuance. Protection, where wanted, is an operational concern outside this spec."
    - control_id: managed-patching
      status: not_applicable
      notes: A pure configuration object with no software of its own to patch; the RBAC engine that evaluates roles at login is Auth0's SaaS, patched by Auth0.
