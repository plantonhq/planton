# Least-privilege permissions the IaC runner's Auth0 credential needs to
# provision, update, and destroy this component with the official modules.
# Auth0 authenticates with a machine-to-machine application authorized for
# the tenant's Management API (https://{tenant-domain}/api/v2/); the
# auth0/auth0 Terraform provider (~> 1.0 per iac/tf/provider.tf) and the
# pulumi-auth0 SDK exchange its client id and secret for a token through
# the client-credentials flow, and the grant's scopes are the policy. Every
# group is `derived` (static analysis of the module sources against Auth0's
# endpoint docs, cited in notes) until a live capture upgrades it to
# `proven`. Schema: iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: auth0role
spec:
  auth0:
    groups:
      - purpose: ManageRole
        scopes:
          - create:roles
          - read:roles
          - update:roles
          - delete:roles
        provenance: derived
        notes: The modules (iac/tf/main.tf and iac/pulumi/module/role.go) manage auth0_role and, when spec.permissions is non-empty, the authoritative auth0_role_permissions — both on the same role object. Create via POST /api/v2/roles; read the role AND its permission list back via GET /api/v2/roles/{id} and GET /api/v2/roles/{id}/permissions (read:roles); rename or redescribe via PATCH /api/v2/roles/{id} and manage the permission set via POST and DELETE on /api/v2/roles/{id}/permissions (update:roles — documented for adding by post-role-permission-assignment, derived for removal on the same endpoint family); destroy via DELETE /api/v2/roles/{id}. Scope names verbatim from the post-roles doc's scope inventory (auth0.com/docs/api/management/v2/roles/post-roles, read 2026-08-22). The modules never assign the role to users, so no role-members or user scope is needed, and the scopes a role references must already exist on their resource servers.
