apiVersion: auth0.planton.dev/v1alpha1
kind: Auth0TenantSettings
metadata:
  name: e2e-tenant-settings
  org: e2e-org
  env: testing
  annotations:
    planton.dev/e2e-import-roundtrip-skip: >-
      The test tenant keeps what earlier lanes set (Auth0 has no delete for
      tenant settings), and default_redirection_uri has no computed value, so
