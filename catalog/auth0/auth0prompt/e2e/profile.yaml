apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: auth0prompt
spec:
  # A tenant has ONE set of prompt settings, and applying this component
  # changes how everyone signs in through the tenant: a live lane needs a
  # dedicated test tenant whose login page nobody uses. None exists yet, so
  # the lanes are not run; the first live proof is an operator's own tenant,
  # read back on its login page. Unblock: a throwaway Auth0 tenant for the
  # E2E harness (AUTH0_DOMAIN / AUTH0_CLIENT_ID / AUTH0_CLIENT_SECRET, the
  # credential holding read:prompts and update:prompts), then run both
  # engines' minimal scenario. The device-biometrics scenario also needs
  # WebAuthn with device biometrics enabled as a multi-factor method on that
  # tenant, which Auth0 requires before it accepts the first factor.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 5
