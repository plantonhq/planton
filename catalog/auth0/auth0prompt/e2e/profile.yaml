apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: auth0prompt
spec:
  # A tenant has ONE set of prompt settings, and applying this component
  # changes how everyone signs in through the tenant: the lanes run only on a
  # dedicated test tenant whose login page nobody uses (AUTH0_DOMAIN /
  # AUTH0_CLIENT_ID / AUTH0_CLIENT_SECRET, the credential holding
  # read:prompts and update:prompts), one lane at a time.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 5
