syntax = "proto3";

package dev.planton.auth0.auth0prompt.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/auth0/auth0prompt/v1alpha1/outputs.proto";
import "catalog/auth0/auth0prompt/v1alpha1/spec.proto";
import "shared/metadata.proto";

// Auth0Prompt is a component that manages how an Auth0 tenant's login flow
// behaves: whether it runs the Universal Login experience, whether it asks for
// the identifier first and the password on a second screen, and whether the
// device's own authenticator is offered as the first factor.
//
// A tenant has one prompt configuration, so one Auth0Prompt resource per
// tenant. Destroying it leaves the last-applied configuration in place.
//
// Use cases:
// - Turn on identifier-first login, so enterprise users are routed to their
//   company's identity provider by their email domain
// - Offer the device's own authenticator (Touch ID, Face ID, Windows Hello) as
//   the first factor after the identifier screen
//
// Example manifest:
// ```yaml
// apiVersion: auth0.planton.dev/v1alpha1
// kind: Auth0Prompt
// metadata:
//   name: prompt
//   org: my-organization
// spec:
//   universalLoginExperience: new
//   identifierFirst: true
// ```
message Auth0Prompt {
  // api_version is the version of the Auth0 API resource.
  // Must be "auth0.planton.dev/v1alpha1" for this version.
  string api_version = 1 [(buf.validate.field).string.const = 'auth0.planton.dev/v1alpha1'];

  // kind is the Kubernetes Resource Model (KRM) kind.
  // Must be "Auth0Prompt" for this resource type.
  string kind = 2 [(buf.validate.field).string.const = 'Auth0Prompt'];

  // metadata contains standard cloud resource metadata.
  // - name: Unique identifier for the resource within Planton
  // - org: Organization that owns it
  // - env: Environment it is deployed from
  // - labels: Key-value pairs for filtering and organization
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec contains the login-flow settings to apply.
  Auth0PromptSpec spec = 4 [(buf.validate.field).required = true];

  // status contains the resource as applied, populated after deployment.
  Auth0PromptStatus status = 5;
}

// Auth0PromptStatus represents the current state of a Auth0Prompt resource.
// Populated by the deployment system.
message Auth0PromptStatus {
  // outputs contains the stack outputs: the login-flow settings as applied.
  Auth0PromptStackOutputs outputs = 1;
}
