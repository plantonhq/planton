syntax = "proto3";

package dev.planton.auth0.auth0customdomainverification.v1alpha1;

import "shared/options/options.proto";

// Auth0CustomDomainVerificationOutputs contains the custom domain once Auth0
// has verified it.
//
// https://registry.terraform.io/providers/auth0/auth0/latest/docs/resources/custom_domain_verification#read-only
// https://www.pulumi.com/registry/packages/auth0/api-docs/customdomainverification/#outputs
message Auth0CustomDomainVerificationOutputs {
  // custom_domain_id is the verified custom domain's identifier in Auth0 (cd_...).
  string custom_domain_id = 1;

  // domain is the verified domain's name (e.g. "id.example.com"), ready to
  // serve sign-in. Auth0TenantSettings.default_custom_domain reads it, so a
  // tenant's default domain is always one Auth0 has verified.
  string domain = 2;

  // origin_domain_name is the tenant host the domain serves from (e.g.
  // "example-cd-abc123.edge.tenants.eu.auth0.com"), the origin a self-managed
  // proxy forwards to.
  string origin_domain_name = 3;

  // cname_api_key is the key a self-managed domain's proxy must send to the
  // origin in the cname-api-key header, so Auth0 accepts its requests. Auth0
  // returns it once, when the domain is first verified; it is empty for an
  // Auth0-managed domain.
  string cname_api_key = 4 [(dev.planton.shared.options.sensitive) = true];
}
