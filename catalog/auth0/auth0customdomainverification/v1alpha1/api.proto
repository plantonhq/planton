syntax = "proto3";

package dev.planton.auth0.auth0customdomainverification.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/auth0/auth0customdomainverification/v1alpha1/outputs.proto";
import "catalog/auth0/auth0customdomainverification/v1alpha1/spec.proto";
import "shared/metadata.proto";

// Auth0CustomDomainVerification is a kind that completes an
// Auth0CustomDomain: it asks Auth0 to check the domain's DNS record and waits
// until the domain is ready to serve sign-in -- verified, and for an
// Auth0-managed domain, holding its issued certificate.
//
// It is the last of three nodes: the Auth0CustomDomain, the DNS record that
// publishes its dns_record_* outputs, and this verification, which must be
// ordered after the record (metadata.relationships, type depends_on) because
// Auth0 can only verify a record that already resolves.
//
// Use cases:
// - Bring a new sign-in domain live in the same install that creates it
// - Receive the proxy key a self-managed domain's proxy must send
// - Give Auth0TenantSettings.default_custom_domain a domain that is known to be
//   verified
//
// Example manifest:
// ```yaml
// apiVersion: auth0.planton.dev/v1alpha1
// kind: Auth0CustomDomainVerification
// metadata:
//   name: sign-in-domain-verification
//   org: my-organization
//   relationships:
//     - kind: CloudflareDnsRecord
//       name: sign-in-domain-cname
//       type: depends_on
// spec:
//   customDomainId:
//     valueFrom:
//       kind: Auth0CustomDomain
//       name: sign-in-domain
//       fieldPath: status.outputs.id
// ```
message Auth0CustomDomainVerification {
  // api_version is the version of the Auth0 API resource.
  // Must be "auth0.planton.dev/v1alpha1" for this version.
  string api_version = 1 [(buf.validate.field).string.const = 'auth0.planton.dev/v1alpha1'];

  // kind is the Kubernetes Resource Model (KRM) kind.
  // Must be "Auth0CustomDomainVerification" for this resource type.
  string kind = 2 [(buf.validate.field).string.const = 'Auth0CustomDomainVerification'];

  // metadata contains standard catalog object metadata.
  // - name: Unique identifier for the verification resource within Planton
  // - org: Organization that owns it
  // - env: Environment it is deployed from
  // - labels: Key-value pairs for filtering and organization
  // - relationships: the DNS record this verification waits for (depends_on)
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec names the custom domain to verify.
  Auth0CustomDomainVerificationSpec spec = 4 [(buf.validate.field).required = true];

  // status contains the verified domain, populated after deployment.
  Auth0CustomDomainVerificationStatus status = 5;
}

// Auth0CustomDomainVerificationStatus represents the current state of an
// Auth0CustomDomainVerification resource. Populated by the deployment system.
message Auth0CustomDomainVerificationStatus {
  // outputs contains the outputs: the verified domain.
  Auth0CustomDomainVerificationOutputs outputs = 1;
}
