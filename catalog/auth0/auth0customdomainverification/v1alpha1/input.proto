syntax = "proto3";

package dev.planton.auth0.auth0customdomainverification.v1alpha1;

import "catalog/auth0/auth0customdomainverification/v1alpha1/api.proto";
import "catalog/auth0/provider.proto";

// Auth0CustomDomainVerificationStackInput is the input to the
// Auth0CustomDomainVerification IaC module. It contains the target resource and
// the Auth0 provider configuration.
message Auth0CustomDomainVerificationStackInput {
  // target is the Auth0CustomDomainVerification resource to be deployed.
  Auth0CustomDomainVerification target = 1;

  // provider_config contains the Auth0 credentials for authentication: the
  // tenant's domain and a Machine-to-Machine application's client id and secret.
  // The custom domain verified is one of that tenant's, and the application needs
  // read:custom_domains and create:custom_domains on its Management API
  // (Auth0 files verification under create).
  dev.planton.auth0.Auth0ProviderConfig provider_config = 2;
}
