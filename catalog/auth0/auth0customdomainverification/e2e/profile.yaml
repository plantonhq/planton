apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: auth0customdomainverification
spec:
  # The three-node chain runs live: the custom domain, the Cloudflare CNAME in
  # a real, delegated zone (PLANTON_E2E_AUTH0_DNS_ZONE_ID, the zone of
  # PLANTON_E2E_AUTH0_CUSTOM_DOMAIN_PARENT, written with a token scoped to
  # DNS on that zone: CLOUDFLARE_API_TOKEN, PLANTON_E2E_CLOUDFLARE_ACCOUNT_ID),
  # then the verification, which waits until Auth0 reports the domain ready
  # (three to four minutes measured). The test tenant needs a verified card
  # on file for the custom domain.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
