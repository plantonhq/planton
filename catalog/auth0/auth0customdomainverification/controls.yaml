# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: auth0customdomainverification
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: "The verification stores nothing of its own beyond the one-time proxy key Auth0 returns for a self-managed domain, which the platform keeps as a secret output (cname_api_key, marked sensitive); the domain's state is Auth0's provider-managed posture."
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: There is no data at rest at this component's level to key (see enc-at-rest); Auth0 exposes no customer-managed-key surface on custom domains.
    - control_id: enc-in-transit
      status: not_applicable
      notes: "The verification makes one Management API call to Auth0's HTTPS-only API; for an Auth0-managed domain it is what leads Auth0 to issue the domain's certificate (see the auth0customdomain component)."
    - control_id: no-public-access
      status: not_applicable
      notes: "The verification exposes no endpoint of its own."
    - control_id: restricted-ingress
      status: not_applicable
      notes: The spec has no network filter to configure; restricting who reaches the tenant's edge is the tenant's network ACLs, outside this component.
    - control_id: edge-protection
      status: not_applicable
      notes: Auth0's own edge fronts the domain (its attack protection is the tenant's posture); a self-managed domain's proxy is the operator's, outside this spec.
    - control_id: rbac
      status: not_applicable
      notes: WHO may change the tenant's custom domains is governed at the Auth0 tenant level -- Management API tokens scoped as iac/permissions.yaml lists, and dashboard admin roles -- with no per-domain access-control surface in this spec.
    - control_id: workload-identity
      status: not_applicable
      notes: The component authenticates to nothing; the credential the IaC runner presents is the provider connection's concern (iac/permissions.yaml).
    - control_id: no-legacy-auth
      status: not_applicable
      notes: A custom domain carries no credential path of its own; how people sign in is the tenant's connections' posture.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The domain changes where people sign in, never how they prove who they are; credential strength lives on the tenant's connections (the auth0connection kind).
    - control_id: audit-logging
      status: not_applicable
      notes: The spec exposes no audit toggle. Changes to custom domains are Management API operations captured in Auth0's tenant logs (exported, where wanted, by the auth0eventstream kind).
    - control_id: monitoring-integration
      status: not_applicable
      notes: Neither the spec nor the modules expose a metrics surface for custom domains.
    - control_id: backup-recovery
      status: not_applicable
      notes: "The verification is re-runnable from the manifest against the same domain, so the manifest is the recovery point; nothing else exists to back up."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist at this component's level to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The object has no placement to configure; availability of the sign-in edge is Auth0's SaaS platform posture.
    - control_id: deletion-protection
      status: not_applicable
      notes: "Destroying this resource deletes nothing: verification is a one-time action and the provider's delete only forgets it, leaving the domain verified. Destroy the Auth0CustomDomain to remove the domain."
    - control_id: managed-patching
      status: not_applicable
      notes: A pure configuration object with no software of its own to patch; the edge serving the domain is Auth0's SaaS, patched by Auth0.
