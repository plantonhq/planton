apiVersion: auth0.planton.dev/v1alpha1
kind: Auth0EmailTemplate
metadata:
  name: verify-email
  org: example-org
  env: production
spec:
  template: verify_email
  from: Planton <no-reply@planton.ai>
  subject: Verify your email for Planton
  body: |
    <!doctype html>
    <html>
      <body style="margin:0;padding:0;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1d1d1f;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:40px 16px;">
          <tr>
            <td align="center">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px;padding:40px;">
                <tr>
                  <td>
                    <h1 style="margin:0 0 16px;font-size:22px;font-weight:600;">Verify your email</h1>
                    <p style="margin:0 0 24px;font-size:15px;line-height:1.6;">Confirm that {{ user.email }} is your address to finish setting up your Planton account.</p>
                    <p style="margin:0 0 24px;">
                      <a href="{{ url }}" style="display:inline-block;background:#1d1d1f;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:12px 24px;border-radius:8px;">Verify email</a>
                    </p>
                    <p style="margin:0 0 8px;font-size:13px;line-height:1.6;color:#6e6e73;">The link works for one day. If you did not create a Planton account, you can ignore this email.</p>
                    <p style="margin:0;font-size:13px;line-height:1.6;color:#6e6e73;">Questions? Write to <a href="mailto:support@planton.ai" style="color:#6e6e73;">support@planton.ai</a>.</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </body>
    </html>
  urlLifetimeInSeconds: 86400
