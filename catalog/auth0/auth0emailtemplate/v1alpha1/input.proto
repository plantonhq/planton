syntax = "proto3";

package dev.planton.auth0.auth0emailtemplate.v1alpha1;

import "catalog/auth0/auth0emailtemplate/v1alpha1/api.proto";
import "catalog/auth0/provider.proto";

// Auth0EmailTemplateStackInput is the input to the Auth0EmailTemplate IaC module.
// It contains the target resource and the Auth0 provider configuration.
message Auth0EmailTemplateStackInput {
  // target is the Auth0EmailTemplate resource to be deployed.
  Auth0EmailTemplate target = 1;

  // provider_config contains the Auth0 credentials for authentication: the
  // tenant's domain and a Machine-to-Machine application's client id and secret.
  // The application needs read:email_templates, create:email_templates and update:email_templates on the tenant's Management API.
  dev.planton.auth0.Auth0ProviderConfig provider_config = 2;
}
