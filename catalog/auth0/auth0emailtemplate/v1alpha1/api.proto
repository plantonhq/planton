syntax = "proto3";

package dev.planton.auth0.auth0emailtemplate.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/auth0/auth0emailtemplate/v1alpha1/outputs.proto";
import "catalog/auth0/auth0emailtemplate/v1alpha1/spec.proto";
import "shared/metadata.proto";

// Auth0EmailTemplate is a component that manages one of the emails an Auth0
// tenant sends: its sender, subject and body (Liquid-templated HTML), where the
// link in it leads afterwards, and how long that link lives.
//
// There is one template per email, so a tenant carries one Auth0EmailTemplate
// resource for each email it customizes. A template needs an email provider
// (Auth0EmailProvider). Auth0 cannot delete a template: destroying it disables
// the template, and Auth0 falls back to its default email.
//
// Use cases:
// - Send a verification email in your product's voice and design
// - Send people back to your application after they reset their password
//
// Example manifest:
// ```yaml
// apiVersion: auth0.planton.dev/v1alpha1
// kind: Auth0EmailTemplate
// metadata:
//   name: verify-email
//   org: my-organization
// spec:
//   template: verify_email
//   from: Acme <no-reply@acme.com>
//   subject: Verify your email for Acme
//   body: <html><body>Hello {{ user.name }}, <a href="{{ url }}">verify your email</a>.</body></html>
//   resultUrl: https://app.acme.com/welcome
// ```
message Auth0EmailTemplate {
  // api_version is the version of the Auth0 API resource.
  // Must be "auth0.planton.dev/v1alpha1" for this version.
  string api_version = 1 [(buf.validate.field).string.const = 'auth0.planton.dev/v1alpha1'];

  // kind is the Kubernetes Resource Model (KRM) kind.
  // Must be "Auth0EmailTemplate" for this resource type.
  string kind = 2 [(buf.validate.field).string.const = 'Auth0EmailTemplate'];

  // metadata contains standard catalog object metadata.
  // - name: Unique identifier for the resource within Planton
  // - org: Organization that owns it
  // - env: Environment it is deployed from
  // - labels: Key-value pairs for filtering and organization
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec contains the email to customize and its content.
  Auth0EmailTemplateSpec spec = 4 [(buf.validate.field).required = true];

  // status contains the resource as applied, populated after deployment.
  Auth0EmailTemplateStatus status = 5;
}

// Auth0EmailTemplateStatus represents the current state of a Auth0EmailTemplate resource.
// Populated by the deployment system.
message Auth0EmailTemplateStatus {
  // outputs contains the outputs: the template managed.
  Auth0EmailTemplateOutputs outputs = 1;
}
