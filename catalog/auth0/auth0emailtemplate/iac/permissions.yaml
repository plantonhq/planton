# Least-privilege permissions the IaC runner's Auth0 credential needs to
# provision, update, and destroy this component with the official modules.
# Auth0 authenticates with a machine-to-machine application authorized for
# the tenant's Management API (https://{tenant-domain}/api/v2/); the
# auth0/auth0 Terraform provider (~> 1.58 per iac/tf/provider.tf) and the
# pulumi-auth0 SDK exchange its client id and secret for a token through
# the client-credentials flow, and the grant's scopes are the policy. Every
# group is `derived` (static analysis of the module sources against Auth0's
# endpoint docs, cited in notes) until a live capture upgrades it to
# `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: auth0emailtemplate
spec:
  auth0:
    groups:
      - purpose: ManageEmailTemplate
        scopes:
          - read:email_templates
          - create:email_templates
          - update:email_templates
        provenance: derived
        notes: The modules (iac/tf/main.tf and iac/pulumi/module/email_template.go) manage auth0_email_template. The provider's create first reads GET /api/v2/email-templates/{templateName} (read:email_templates) and then either creates the template via POST /api/v2/email-templates (create:email_templates) or, when it already exists, takes it over via PATCH /api/v2/email-templates/{templateName} (update:email_templates); updates use the same PATCH, and destroy is that PATCH again with enabled false -- Auth0 has no delete for a template, so no delete scope exists or is needed (terraform-provider-auth0 internal/auth0/email/resource_template.go, createEmailTemplate and deleteEmailTemplate, and the scopes the Management API's OpenAPI document names for each operation).
