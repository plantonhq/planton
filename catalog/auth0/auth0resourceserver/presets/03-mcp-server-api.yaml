apiVersion: auth0.planton.dev/v1alpha1
kind: Auth0ResourceServer
metadata:
  name: mcp-server-api
  org: example-org
  env: production
spec:
  # The MCP server's own URL: the audience its clients ask for tokens to.
  identifier: https://mcp.example.com/mcp
  name: Example MCP Server
  signingAlg: RS256
  tokenDialect: rfc9068_profile
  tokenLifetime: 3600
  # MCP clients keep a person signed in with refresh tokens.
  allowOfflineAccess: true
  skipConsentForVerifiableFirstPartyClients: true
  scopes:
    - name: tools:read
      description: List the server's tools and read their results
    - name: tools:call
      description: Call the server's tools on your behalf
  subjectTypeAuthorization:
    # Only applications holding a grant -- for third-party MCP clients, the
    # default grant below -- may act for a person.
    user:
      policy: require_client_grant
    # No application gets a token for itself: the server acts for people.
    client:
      policy: deny_all
  thirdPartyClientDefaultGrants:
    - subjectType: user
      scopes:
        - tools:read
        - tools:call
