# An API with its scopes and token settings, created and deleted. Nothing
# beyond them is declared, so the lane also proves that an API leaves every
# unmanaged setting (the access policy, proof of possession, encryption,
# authorization details) at Auth0's defaults.
apiVersion: auth0.planton.dev/v1alpha1
kind: Auth0ResourceServer
metadata:
  name: e2e-api
  org: e2e-org
  env: testing
spec:
  identifier: https://e2e-api.planton.dev/
  name: E2E Test API
  signingAlg: RS256
  tokenLifetime: 86400
  allowOfflineAccess: true
  skipConsentForVerifiableFirstPartyClients: true
  enforcePolicies: true
  tokenDialect: access_token_authz
  scopes:
    - name: read:items
      description: Read access to items
    - name: write:items
      description: Write access to items
