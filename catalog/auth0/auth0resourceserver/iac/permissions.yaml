# Least-privilege permissions the IaC runner's Auth0 credential needs to
# provision, update, and destroy this component with the official modules.
# Auth0 authenticates with a machine-to-machine application authorized for
# the tenant's Management API (https://{tenant-domain}/api/v2/); the
# auth0/auth0 Terraform provider (~> 1.0 per iac/tf/provider.tf) and the
# pulumi-auth0 SDK exchange its client id and secret for a token through
# the client-credentials flow, and the grant's scopes are the policy. Every
# group is `derived` (static analysis of the module sources against Auth0's
# endpoint docs, cited in notes) until a live capture upgrades it to
# `proven`. Schema: iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: auth0resourceserver
spec:
  auth0:
    groups:
      - purpose: ManageResourceServer
        scopes:
          - create:resource_servers
          - read:resource_servers
          - update:resource_servers
          - delete:resource_servers
        provenance: derived
        notes: The modules (iac/tf/main.tf and iac/pulumi/module/resourceserver.go) manage auth0_resource_server and, when spec.scopes is non-empty, auth0_resource_server_scopes — create the API definition via POST /api/v2/resource-servers, read it back via GET /api/v2/resource-servers/{id}, change token settings and RBAC flags via PATCH /api/v2/resource-servers/{id}, destroy via DELETE /api/v2/resource-servers/{id}. The scopes resource writes the scopes list OF the same resource server object, so it rides update:resource_servers and needs no further family. Scope names verbatim from the post-resource-servers doc's scope inventory (auth0.com/docs/api/management/v2/resource-servers/post-resource-servers, read 2026-08-22; the POST refuses tokens without create:resource_servers).
