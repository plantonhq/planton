# Least-privilege permissions the IaC runner's Auth0 credential needs to
# provision, update, and destroy this component with the official modules.
# Auth0 authenticates with a machine-to-machine application authorized for
# the tenant's Management API (https://{tenant-domain}/api/v2/); the
# auth0/auth0 Terraform provider (~> 1.58 per iac/tf/provider.tf) and the
# pulumi-auth0 SDK exchange its client id and secret for a token through
# the client-credentials flow, and the grant's scopes are the policy. Every
# group is `derived` (static analysis of the module sources against Auth0's
# endpoint docs, cited in notes) until a live capture upgrades it to
# `proven`. Schema: iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: auth0resourceserver
spec:
  auth0:
    groups:
      - purpose: ManageResourceServer
        scopes:
          - create:resource_servers
          - read:resource_servers
          - update:resource_servers
          - delete:resource_servers
        provenance: derived
        notes: The modules (iac/tf/main.tf and iac/pulumi/module/resourceserver.go) manage auth0_resource_server and, when spec.scopes is non-empty, auth0_resource_server_scopes -- create the API definition via POST /api/v2/resource-servers, read it back via GET /api/v2/resource-servers/{id}, change its token settings, access policy, proof of possession, token encryption, authorization details and claims mapping via PATCH /api/v2/resource-servers/{id}, destroy via DELETE /api/v2/resource-servers/{id}. The scopes resource writes the scopes list OF the same resource server object, so it rides update:resource_servers and needs no further family. Scope names verbatim from the post-resource-servers doc's scope inventory (auth0.com/docs/api/management/v2/resource-servers/post-resource-servers, read 2026-08-22; the POST refuses tokens without create:resource_servers).
      - purpose: ManageThirdPartyClientDefaultGrants
        scopes:
          - create:client_grants
          - read:client_grants
          - update:client_grants
          - delete:client_grants
        provenance: derived
        condition:
          spec_field_set: third_party_client_default_grants
        notes: One auth0_client_grant per third_party_client_default_grants entry (iac/tf/main.tf and iac/pulumi/module/default_grants.go), each with default_for third_party_clients and no client_id. Create via POST /api/v2/client-grants (create:client_grants, auth0.com/docs/api/management/v2/client-grants/post-client-grants), read back via GET /api/v2/client-grants/{id} (read:client_grants), change its scopes, authorization details types and organization settings via PATCH /api/v2/client-grants/{id} (update:client_grants), and remove on destroy or entry removal via DELETE /api/v2/client-grants/{id} (delete:client_grants) -- the client-grants family Auth0Client's api_grants uses, applied here without naming an application.
