syntax = "proto3";

package dev.planton.auth0.auth0promptcustomtext.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/auth0/auth0promptcustomtext/v1alpha1/outputs.proto";
import "catalog/auth0/auth0promptcustomtext/v1alpha1/spec.proto";
import "shared/metadata.proto";

// Auth0PromptCustomText is a component that manages the words one Universal
// Login prompt shows in one language: every title, description, button and
// error message on that prompt's screens, in place of Auth0's defaults.
//
// There is one custom text per prompt and language, so a tenant carries one
// Auth0PromptCustomText resource for each prompt it re-words in each language.
// Destroying it returns the prompt to Auth0's default words.
//
// Use cases:
// - Say "Log in to Planton" in your own voice instead of Auth0's default
// - Translate the login and signup screens for a language you serve
//
// Example manifest:
// ```yaml
// apiVersion: auth0.planton.dev/v1alpha1
// kind: Auth0PromptCustomText
// metadata:
//   name: login-en
//   org: my-organization
// spec:
//   prompt: login
//   language: en
//   screens:
//     login:
//       texts:
//         title: Welcome back
//         description: Log in to continue to Acme.
// ```
message Auth0PromptCustomText {
  // api_version is the version of the Auth0 API resource.
  // Must be "auth0.planton.dev/v1alpha1" for this version.
  string api_version = 1 [(buf.validate.field).string.const = 'auth0.planton.dev/v1alpha1'];

  // kind is the Kubernetes Resource Model (KRM) kind.
  // Must be "Auth0PromptCustomText" for this resource type.
  string kind = 2 [(buf.validate.field).string.const = 'Auth0PromptCustomText'];

  // metadata contains standard cloud resource metadata.
  // - name: Unique identifier for the resource within Planton
  // - org: Organization that owns it
  // - env: Environment it is deployed from
  // - labels: Key-value pairs for filtering and organization
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec contains the prompt, the language, and the words to show.
  Auth0PromptCustomTextSpec spec = 4 [(buf.validate.field).required = true];

  // status contains the resource as applied, populated after deployment.
  Auth0PromptCustomTextStatus status = 5;
}

// Auth0PromptCustomTextStatus represents the current state of a Auth0PromptCustomText resource.
// Populated by the deployment system.
message Auth0PromptCustomTextStatus {
  // outputs contains the stack outputs: the prompt and language managed.
  Auth0PromptCustomTextStackOutputs outputs = 1;
}
