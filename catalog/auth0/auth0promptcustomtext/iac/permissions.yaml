# Least-privilege permissions the IaC runner's Auth0 credential needs to
# provision, update, and destroy this component with the official modules.
# Auth0 authenticates with a machine-to-machine application authorized for
# the tenant's Management API (https://{tenant-domain}/api/v2/); the
# auth0/auth0 Terraform provider (~> 1.58 per iac/tf/provider.tf) and the
# pulumi-auth0 SDK exchange its client id and secret for a token through
# the client-credentials flow, and the grant's scopes are the policy. Every
# group is `derived` (static analysis of the module sources against Auth0's
# endpoint docs, cited in notes) until a live capture upgrades it to
# `proven`. Schema: iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: auth0promptcustomtext
spec:
  auth0:
    groups:
      - purpose: ManagePromptCustomText
        scopes:
          - read:prompts
          - update:prompts
        provenance: derived
        notes: The modules (iac/tf/main.tf and iac/pulumi/module/prompt_custom_text.go) manage auth0_prompt_custom_text, the words of one prompt in one language -- read via GET /api/v2/prompts/{prompt}/custom-text/{language} (read:prompts) and written via PUT /api/v2/prompts/{prompt}/custom-text/{language} (update:prompts), the two scopes the Management API's OpenAPI document names for the custom-text endpoints. The resource's create is that PUT, and its delete is a PUT of an empty document (terraform-provider-auth0 internal/auth0/prompt/resource_custom_text.go, deletePromptCustomText), so no other scope is needed.
