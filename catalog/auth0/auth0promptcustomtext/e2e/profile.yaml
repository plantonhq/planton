apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: auth0promptcustomtext
spec:
  # A prompt's text in a language is ONE object per tenant, and applying
  # this component changes what everyone signing in reads: the lanes run only
  # on a dedicated test tenant (AUTH0_DOMAIN / AUTH0_CLIENT_ID /
  # AUTH0_CLIENT_SECRET, the credential holding read:prompts and
  # update:prompts), one lane at a time.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 5
