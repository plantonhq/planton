apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: auth0customdomain
spec:
  # A custom domain is proven by the domain alone: the lanes create it under
  # the operator's parent domain (PLANTON_E2E_AUTH0_CUSTOM_DOMAIN_PARENT) on a
  # dedicated test tenant (AUTH0_DOMAIN / AUTH0_CLIENT_ID / AUTH0_CLIENT_SECRET,
  # the custom_domains scopes of iac/permissions.yaml) and delete it. Auth0
  # refuses a custom domain (403) on a tenant without a verified credit card on
  # file, even on a trial; the card is not charged.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 10
