# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: auth0customdomain
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: "A custom domain's configuration (its name, certificate type, TLS policy, client-IP header, metadata and passkey relying party) inside Auth0's SaaS control plane, none of it secret; its storage is Auth0's provider-managed posture, with no encryption seam in this spec."
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: There is no data at rest at this component's level to key (see enc-at-rest); Auth0 exposes no customer-managed-key surface on custom domains.
    - control_id: enc-in-transit
      status: not_applicable
      notes: "With type auth0_managed_certs, Auth0 serves the domain over HTTPS with a certificate it issues and renews, and tls_policy admits only the recommended policy (TLS 1.2 and 1.3); with self_managed_certs, TLS is terminated by the operator's own proxy with the operator's certificate, outside this spec."
    - control_id: no-public-access
      status: not_applicable
      notes: "The domain serves the tenant's public sign-in pages and Authentication API by design; access to what it serves is governed by the tenant's applications and connections, not by the domain."
    - control_id: restricted-ingress
      status: not_applicable
      notes: The spec has no network filter to configure; restricting who reaches the tenant's edge is the tenant's network ACLs, outside this component.
    - control_id: edge-protection
      status: not_applicable
      notes: Auth0's own edge fronts the domain (its attack protection is the tenant's posture); a self-managed domain's proxy is the operator's, outside this spec.
    - control_id: rbac
      status: not_applicable
      notes: WHO may change the tenant's custom domains is governed at the Auth0 tenant level -- Management API tokens scoped as iac/permissions.yaml lists, and dashboard admin roles -- with no per-domain access-control surface in this spec.
    - control_id: workload-identity
      status: not_applicable
      notes: The component authenticates to nothing; the credential the IaC runner presents is the provider connection's concern (iac/permissions.yaml).
    - control_id: no-legacy-auth
      status: not_applicable
      notes: A custom domain carries no credential path of its own; how people sign in is the tenant's connections' posture.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The domain changes where people sign in, never how they prove who they are; credential strength lives on the tenant's connections (the auth0connection kind).
    - control_id: audit-logging
      status: not_applicable
      notes: The spec exposes no audit toggle. Changes to custom domains are Management API operations captured in Auth0's tenant logs (exported, where wanted, by the auth0eventstream kind).
    - control_id: monitoring-integration
      status: not_applicable
      notes: Neither the spec nor the modules expose a metrics surface for custom domains.
    - control_id: backup-recovery
      status: not_applicable
      notes: "The domain is declaratively re-creatable from the manifest, so the manifest is the recovery point; a recreated domain is verified again by its Auth0CustomDomainVerification."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist at this component's level to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The object has no placement to configure; availability of the sign-in edge is Auth0's SaaS platform posture.
    - control_id: deletion-protection
      status: not_applicable
      notes: "Destroying this resource deletes the custom domain in Auth0 (DELETE /api/v2/custom-domains/{id}); sign-in through the domain stops while the tenant's canonical domain keeps working. Recreating it issues a new domain id and requires verification again."
    - control_id: managed-patching
      status: not_applicable
      notes: A pure configuration object with no software of its own to patch; the edge serving the domain is Auth0's SaaS, patched by Auth0.
