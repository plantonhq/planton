syntax = "proto3";

package dev.planton.auth0.auth0customdomain.v1alpha1;

import "catalog/auth0/auth0customdomain/v1alpha1/api.proto";
import "catalog/auth0/provider.proto";

// Auth0CustomDomainIacInput is the input to the Auth0CustomDomain IaC module.
// It contains the target resource and the Auth0 provider configuration.
message Auth0CustomDomainIacInput {
  // target is the Auth0CustomDomain resource to be deployed.
  Auth0CustomDomain target = 1;

  // provider_config contains the Auth0 credentials for authentication: the
  // tenant's domain and a Machine-to-Machine application's client id and secret.
  // The custom domain is created in that tenant, and the application needs
  // create:custom_domains, read:custom_domains, update:custom_domains and
  // delete:custom_domains on its Management API.
  dev.planton.auth0.Auth0ProviderConfig provider_config = 2;
}
