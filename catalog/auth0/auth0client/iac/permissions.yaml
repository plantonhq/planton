# Least-privilege permissions the IaC runner's Auth0 credential needs to
# provision, update, and destroy this component with the official modules.
# Auth0 authenticates with a machine-to-machine application authorized for
# the tenant's Management API (https://{tenant-domain}/api/v2/); the
# auth0/auth0 Terraform provider (~> 1.0 per iac/tf/provider.tf) and the
# Pulumi module exchange its client id and secret for a token through the
# client-credentials flow, and the grant's scopes are the policy. Every
# group is `derived` (static analysis of the module sources against Auth0's
# endpoint docs, cited in notes) until a live capture upgrades it to
# `proven`. Schema: iac/componentpermissions/v1.
#
# Auth0 scopes are per resource family, not per object: a credential
# holding them manages EVERY client and grant in the tenant, and
# read:client_keys reads every client's secret. Narrowing to one client is
# not expressible, so the trust boundary is the tenant (a dedicated tenant,
# or a dedicated machine-to-machine application per boundary).
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: auth0client
spec:
  auth0:
    groups:
      - purpose: ManageClient
        scopes:
          - create:clients
          - read:clients
          - update:clients
          - delete:clients
        provenance: derived
        notes: Covers auth0_client, the application registration -- create via POST /api/v2/clients (create:clients, named by the endpoint doc's insufficient-scope contract, auth0.com/docs/api/management/v2/clients/post-clients, read 2026-08-22), read back on refresh via GET /api/v2/clients/{id} (read:clients, listed in get-clients-by-id's accepted scopes, read 2026-08-22), change in place via PATCH /api/v2/clients/{id} (update:clients), and destroy via DELETE /api/v2/clients/{id} (delete:clients). The update and delete names follow Auth0's per-endpoint-family naming; the patch-clients page was not fetched.
      - purpose: ReadClientSecret
        scopes:
          - read:client_keys
        provenance: derived
        notes: The data.auth0_client read-back that surfaces client_secret and token_endpoint_auth_method as outputs (iac/tf/main.tf names the requirement). GET /api/v2/clients/{id} returns secret material only to tokens holding this scope (get-clients-by-id's accepted scopes, read 2026-08-22). It fails silently when missing -- the client installs green and its client_secret output is empty -- so a credential for any deployment that reads the secret needs it.
      - purpose: ManageApiGrants
        scopes:
          - create:client_grants
          - read:client_grants
          - update:client_grants
          - delete:client_grants
        provenance: derived
        notes: Needed only when spec.api_grants is non-empty -- one auth0_client_grant per entry authorizes the client against an API. Create via POST /api/v2/client-grants (create:client_grants, auth0.com/docs/api/management/v2/client-grants/post-client-grants, read 2026-08-22), read back via GET /api/v2/client-grants (read:client_grants), change scopes via PATCH /api/v2/client-grants/{id} (update:client_grants), and remove on destroy or grant removal via DELETE /api/v2/client-grants/{id} (delete:client_grants); the last three follow the same family naming.
