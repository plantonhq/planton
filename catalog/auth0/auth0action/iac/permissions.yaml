# Least-privilege permissions the IaC runner's Auth0 credential needs to
# provision, update, and destroy this component with the official modules.
# Auth0 authenticates with a machine-to-machine application authorized for
# the tenant's Management API (https://{tenant-domain}/api/v2/); the
# auth0/auth0 Terraform provider (~> 1.0 per iac/tf/provider.tf) and the
# Pulumi module exchange its client id and secret for a token through the
# client-credentials flow, and the grant's scopes are the policy. Every
# group is `derived` (static analysis of the module sources against Auth0's
# endpoint docs, cited in notes) until a live capture upgrades it to
# `proven`. Schema: iac/componentpermissions/v1.
#
# Auth0 scopes are per resource family, not per object: a credential
# holding them manages EVERY action in the tenant, so the trust boundary is
# the tenant.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: auth0action
spec:
  auth0:
    groups:
      - purpose: ManageAction
        scopes:
          - create:actions
          - read:actions
          - update:actions
          - delete:actions
        provenance: derived
        notes: Covers auth0_action, the function with its code, runtime, dependencies, and secrets — create via POST /api/v2/actions/actions (create:actions, named by the endpoint doc's insufficient-scope contract, auth0.com/docs/api/management/v2/actions/post-action, read 2026-08-22) and deploy via POST /api/v2/actions/actions/{id}/deploy (the same scope, post-deploy-action, read 2026-08-22); read back via get-action and get-bindings (read:actions); change code or config via PATCH /api/v2/actions/actions/{id} (update:actions); destroy via DELETE /api/v2/actions/actions/{id} (delete:actions). The read, update, and delete names follow Auth0's per-endpoint-family naming. The optional trigger binding (auth0_trigger_action, only when spec.trigger_binding is set) attaches and detaches through PATCH /api/v2/actions/triggers/{triggerId}/bindings, which the patch-bindings doc (read 2026-08-22) also puts under update:actions — no further scope.
