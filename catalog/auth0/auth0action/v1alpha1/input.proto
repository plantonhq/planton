syntax = "proto3";

package dev.planton.auth0.auth0action.v1alpha1;

import "catalog/auth0/auth0action/v1alpha1/api.proto";
import "catalog/auth0/provider.proto";

// Auth0ActionIacInput is the input to the Auth0Action IaC module.
// It contains the target resource and the Auth0 provider configuration.
message Auth0ActionIacInput {
  // target is the Auth0Action resource to be deployed.
  Auth0Action target = 1;

  // auth0_provider_config contains the Auth0 credentials for authentication.
  // Includes domain, client_id, and client_secret.
  dev.planton.auth0.Auth0ProviderConfig provider_config = 2;
}
