# Least-privilege permissions the IaC runner's Auth0 credential needs to
# provision, update, and destroy this component with the official modules.
# Auth0 authenticates with a machine-to-machine application authorized for
# the tenant's Management API (https://{tenant-domain}/api/v2/); the
# auth0/auth0 Terraform provider (~> 1.58 per iac/tf/provider.tf) and the
# pulumi-auth0 SDK exchange its client id and secret for a token through
# the client-credentials flow, and the grant's scopes are the policy. Every
# group is `derived` (static analysis of the module sources against Auth0's
# endpoint docs, cited in notes) until a live capture upgrades it to
# `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: auth0promptscreenpartials
spec:
  auth0:
    groups:
      - purpose: ManagePromptScreenPartials
        scopes:
          - read:prompts
          - update:prompts
        provenance: derived
        notes: The modules (iac/tf/main.tf and iac/pulumi/module/prompt_screen_partials.go) manage auth0_prompt_screen_partials, every partial of one prompt -- read via GET /api/v2/prompts/{prompt}/partials (read:prompts) and written via PUT /api/v2/prompts/{prompt}/partials (update:prompts), the two scopes the Management API's OpenAPI document names for the partials endpoints. The resource's create is that PUT, and its delete is a PUT of an empty set (terraform-provider-auth0 internal/auth0/prompt/resource_screen_partials.go, deletePromptScreenPartials), so no other scope is needed.
