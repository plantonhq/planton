# Provider-parity manifest: this kind's recorded judgment against the pinned
# auth0 provider (checked by `planton provider-parity --check`; format
# documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

# This kind carries ZERO divergences: prompt_type, screen_partials.screen_name
# and the seven screen_partials.insertion_points.* fragments -- every
# configurable argument of auth0_prompt_screen_partials -- match their spec
# fields by exact name.
#
# The single-screen auth0_prompt_screen_partial is composed into this kind:
# every one of its arguments (prompt_type, screen_name, and the same seven
# insertion_points fragments) is expressible here as one screen_partials
# entry. The modules never declare it, and it must never be mixed with this
# kind on one prompt: Auth0 stores one set of partials per prompt, which this
# kind replaces whole on every apply, so a single-screen resource beside it
# would be overwritten, and would overwrite it in turn.
resources: {}
