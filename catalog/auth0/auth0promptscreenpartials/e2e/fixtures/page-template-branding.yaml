# The page template the partials render inside. Auth0 refuses partials until
# the tenant has a page template (403 "requires a page template"), and a page
# template until it has a custom domain; the scenario brings the custom domain
# first. The smallest template Auth0 accepts: its two tags, nothing else.
# Destroy deletes the template (the tenant has a custom domain while it runs).
apiVersion: auth0.planton.dev/v1alpha1
kind: Auth0Branding
metadata:
  name: e2e-partials-page-template
  org: e2e-org
  env: testing
spec:
  universalLoginTemplate: |
    <!DOCTYPE html>
    <html>
      <head>{%- auth0:head -%}</head>
      <body>{%- auth0:widget -%}</body>
    </html>
