apiVersion: auth0.planton.dev/v1alpha1
kind: Auth0PromptScreenPartials
metadata:
  name: e2e-signup-partials
  org: e2e-org
  env: testing
  annotations:
    # Auth0 accepts partials only on a tenant with a custom domain and a page
    # template (a 403 for each otherwise), so the lane brings both: the domain
    # (it need not be verified), then a branding that sets the template.
    planton.dev/e2e-required-env: PLANTON_E2E_AUTH0_CUSTOM_DOMAIN_PARENT
    planton.dev/e2e-prerequisites: Auth0CustomDomain,catalog/auth0/auth0promptscreenpartials/e2e/fixtures/page-template-branding.yaml
spec:
  promptType: signup
  screenPartials:
    - screenName: signup
      insertionPoints:
        formContentEnd: <div class="e2e-terms">By signing up you accept the terms.</div>
