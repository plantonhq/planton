apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: auth0promptscreenpartials
spec:
  # A prompt has ONE set of partials, and applying this component replaces
  # what everyone signing in through the tenant sees on that prompt: a live
  # lane needs a dedicated test tenant whose login pages nobody uses. None
  # exists yet, so the lanes are not run; the first live proof is an
  # operator's own tenant, read back on its login page. Unblock: a throwaway
  # Auth0 tenant for the E2E harness (AUTH0_DOMAIN / AUTH0_CLIENT_ID /
  # AUTH0_CLIENT_SECRET, the credential holding read:prompts and
  # update:prompts) carrying a verified custom domain and a Universal Login
  # page template -- the auth0customdomainverification lane's arrangement (its
  # parent domain, Cloudflare zone and credentials, and the custom_domains
  # scopes) plus an Auth0Branding universal_login_template, which Auth0
  # requires before it renders partials -- then run both engines' minimal
  # scenario, and the multi-screen scenario.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 5
