syntax = "proto3";

package dev.planton.auth0.auth0user.v1alpha1;

import "catalog/auth0/auth0user/v1alpha1/api.proto";
import "catalog/auth0/provider.proto";

// Auth0UserStackInput is the input to the Auth0User IaC module.
// It contains the target resource and the Auth0 provider configuration.
message Auth0UserStackInput {
  // target is the Auth0User resource to be deployed.
  Auth0User target = 1;

  // provider_config contains the Auth0 credentials for authentication.
  // Includes domain, client_id, and client_secret, used to authenticate with
  // Auth0's Management API. The credentials should belong to a Machine-to-Machine
  // application granted the user scopes (create:users, read:users, update:users,
  // delete:users) and, when roles are assigned, read:roles.
  dev.planton.auth0.Auth0ProviderConfig provider_config = 2;
}
