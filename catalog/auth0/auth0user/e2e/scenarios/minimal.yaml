# The cheapest scenario proves the mint law: a database user declared with
# no password gets one generated by the module and reported as an output.
# The connection is the Auth0Connection kind's own minimal fixture, installed
# by the harness from the registry's prerequisites edge and resolved here by
# reference. The email carries the run id: Auth0 requires a unique email per
# connection, and a run whose destroy failed must not block the next.
apiVersion: auth0.planton.dev/v1alpha1
kind: Auth0User
metadata:
  name: e2e-user
  org: e2e-org
  env: testing
  annotations:
    planton.dev/e2e-required-env: PLANTON_E2E_AUTH0_CLIENT_ID
spec:
  connection_name:
    value_from:
      kind: Auth0Connection
      name: e2e-database
      field_path: status.outputs.name
  email: e2e-user-${E2E_RUN_ID}@e2e.planton.dev
  name: E2E User
  email_verified: true
  verify_email: false
