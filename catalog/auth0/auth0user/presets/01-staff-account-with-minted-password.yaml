apiVersion: auth0.planton.dev/v1alpha1
kind: Auth0User
metadata:
  name: staff-root
  org: example-org
  env: production
spec:
  connectionName:
    valueFrom:
      kind: Auth0Connection
      name: users
      fieldPath: status.outputs.name
  email: platform-root@example.com
  name: Platform root
  emailVerified: true
  verifyEmail: false
