# Least-privilege permissions the IaC runner's Auth0 credential needs to
# provision, update, and destroy this component with the official modules.
# Auth0 authenticates with a machine-to-machine application authorized for
# the tenant's Management API (https://{tenant-domain}/api/v2/); the
# auth0/auth0 Terraform provider (~> 1.0 per iac/tf/provider.tf) and the
# pulumi-auth0 SDK exchange its client id and secret for a token through
# the client-credentials flow, and the grant's scopes are the policy. Every
# group is `derived` (static analysis of the module sources against Auth0's
# endpoint docs, cited in notes) until a live capture upgrades it to
# `proven`. Schema: iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: auth0eventstream
spec:
  auth0:
    groups:
      - purpose: ManageEventStream
        scopes:
          - create:event_streams
          - read:event_streams
          - update:event_streams
          - delete:event_streams
        provenance: derived
        notes: Both modules (iac/tf/main.tf and iac/pulumi/module/eventstream.go) manage exactly one resource, auth0_event_stream -- create via POST /api/v2/event-streams, read back via GET /api/v2/event-streams/{id}, change in place via PATCH /api/v2/event-streams/{id}, destroy via DELETE /api/v2/event-streams/{id}. Scope names verbatim from the post-event-streams doc's scope inventory (auth0.com/docs/api/management/v2/event-streams/post-event-streams, read 2026-08-22; the POST refuses tokens without create:event_streams). update:event_streams is exercised only for webhook destinations (endpoint and authorization changes); an eventbridge configuration change forces delete-and-recreate instead. No other Auth0 object is touched.
