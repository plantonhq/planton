syntax = "proto3";

package dev.planton.auth0.auth0eventstream.v1alpha1;

import "catalog/auth0/auth0eventstream/v1alpha1/api.proto";
import "catalog/auth0/provider.proto";

// Auth0EventStreamIacInput is the input to the Auth0EventStream IaC module.
// It contains the target resource and the Auth0 provider configuration.
message Auth0EventStreamIacInput {
  // target is the Auth0EventStream resource to be deployed.
  Auth0EventStream target = 1;

  // auth0_provider_config contains the Auth0 credentials for authentication.
  // Includes domain, client_id, and client_secret.
  dev.planton.auth0.Auth0ProviderConfig provider_config = 2;
}
