syntax = "proto3";

package dev.planton._test.testcloudresourcegeneric.v1alpha2;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// TestCloudResourceGenericSpec at v1alpha2 -- the permanent fixture for "a
// kind with two versions and a declarative conversion between them".
//
// Relative to v1alpha1 it carries exactly one breaking change of each class
// the conversion machinery must prove (see ../conversions/):
//
//   RENAME    string_field            -> display_name
//   RESHAPE   repeated string commands -> repeated TestGenericStep steps
//   REMOVAL   string_no_default        -> gone (upgrade declares the loss)
//   ADDITION  replicas                 -> new, defaulted (downgrade declares the loss)
//
// Everything else is deliberately identical to v1alpha1 so the conversion
// corpus also proves untouched fields pass through byte-for-byte.
message TestCloudResourceGenericSpec {
  // ─── RENAMED from v1alpha1 string_field ───────────────────────────────────────

  optional string display_name = 1 [(dev.planton.shared.options.default) = "default-string"];

  // ─── Scalar fields identical to v1alpha1 ─────────────────────────────────────

  optional int32 int32_field = 3 [(dev.planton.shared.options.default) = "42"];
  optional int64 int64_field = 4 [(dev.planton.shared.options.default) = "9999"];
  optional uint32 uint32_field = 5 [(dev.planton.shared.options.default) = "100"];
  optional uint64 uint64_field = 6 [(dev.planton.shared.options.default) = "50000"];
  optional float float_field = 7 [(dev.planton.shared.options.default) = "3.14"];
  optional double double_field = 8 [(dev.planton.shared.options.default) = "2.718"];
  optional bool bool_field = 9 [(dev.planton.shared.options.default) = "true"];

  // ─── Nested message identical to v1alpha1 ────────────────────────────────────

  TestGenericNestedMessage nested = 10;

  // ─── StringValueOrRef fields identical to v1alpha1 ───────────────────────────

  dev.planton.shared.foreignkey.v1.StringValueOrRef required_ref = 11 [(buf.validate.field).required = true];
  dev.planton.shared.foreignkey.v1.StringValueOrRef optional_ref = 12;

  dev.planton.shared.foreignkey.v1.StringValueOrRef annotated_ref = 17 [
    (dev.planton.shared.foreignkey.v1.default_kind) = TestCloudResourceGeneric,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.id"
  ];

  // ─── Map field identical to v1alpha1 ─────────────────────────────────────────

  map<string, string> labels = 13;

  // ─── RESHAPED from v1alpha1 repeated string commands ─────────────────────────
  //
  // The plain command strings became structured steps -- the shape-change
  // class of breaking change (list of scalars -> list of messages).

  repeated TestGenericStep steps = 14;

  // ─── Sensitive fields identical to v1alpha1 ──────────────────────────────────

  string sensitive_string = 15 [(dev.planton.shared.options.sensitive) = true];
  dev.planton.shared.foreignkey.v1.StringValueOrRef sensitive_ref = 16 [(dev.planton.shared.options.sensitive) = true];

  // ─── ADDED in v1alpha2 (did not exist in v1alpha1) ───────────────────────────

  optional int32 replicas = 18 [(dev.planton.shared.options.default) = "1"];

  // A kind-less reference declared access, not placement: no default_kind
  // (the kind is stated per manifest in valueFrom) and containment_exempt
  // authored on the field. Durable fixture for the containment-decision
  // registry's "-> *" form and for every consumer that must skip such an
  // edge when it resolves nesting, so the contract holds even when no
  // production kind happens to carry the shape.
  dev.planton.shared.foreignkey.v1.StringValueOrRef kindless_access_ref = 19 [
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true
  ];
}

// TestGenericStep is the structured replacement for v1alpha1's plain command
// strings.
message TestGenericStep {
  string command = 1 [(buf.validate.field).required = true];
}

// TestGenericNestedMessage tests nested message defaults (identical to
// v1alpha1).
message TestGenericNestedMessage {
  optional string nested_string = 1 [(dev.planton.shared.options.default) = "nested-default"];
  optional int32 nested_int = 2 [(dev.planton.shared.options.default) = "99"];
}
