syntax = "proto3";

package dev.planton._test.testcloudresourcekubernetes.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/kubernetes/container_env.proto";
import "catalog/kubernetes/kubernetes.proto";
import "catalog/kubernetes/options.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// TestCloudResourceKubernetesSpec is permanent test infrastructure for
// Kubernetes-specific proto processing tests: ContainerResources defaults,
// ContainerEnv handling, and Flatten/HCL generation for Terraform modules.
//
// For generic (non-Kubernetes) test fields, use TestCloudResourceGeneric instead.
//
// Field coverage:
//   - StringValueOrRef namespace (singular flatten testing)
//   - ContainerResources with default_container_resources (default strategy testing)
//   - ContainerEnv with list-based variables/secrets
//   - map<string, StringValueOrRef> (Flatten map-value rule testing)
//   - repeated string command (plain repeated field)
//   - Scalar with default (schedule-like field for mixed testing)
message TestCloudResourceKubernetesSpec {
  // ─── Namespace as StringValueOrRef ────────────────────────────────────────────

  dev.planton.shared.foreignkey.v1.StringValueOrRef namespace = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesNamespace,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "spec.name"
  ];

  bool create_namespace = 3;

  // ─── Container resources with default ─────────────────────────────────────────

  dev.planton.kubernetes.ContainerResources resources = 4 [(dev.planton.kubernetes.default_container_resources) = {
    limits: {
      cpu: "1000m"
      memory: "1Gi"
    }
    requests: {
      cpu: "50m"
      memory: "100Mi"
    }
  }];

  // ─── Container environment (list-based) ───────────────────────────────────────

  dev.planton.kubernetes.ContainerEnv env = 5;

  // ─── Map with StringValueOrRef values (Flatten map-value rule testing) ────────

  map<string, dev.planton.shared.foreignkey.v1.StringValueOrRef> ref_map = 6;

  // ─── Plain repeated field ─────────────────────────────────────────────────────

  repeated string command = 7;

  // ─── Scalar with default ──────────────────────────────────────────────────────

  optional string schedule = 8 [(dev.planton.shared.options.default) = "0 0 * * *"];

  // ─── Manifest-only word (never forwarded to an engine) ────────────────────────

  // A word the manifest carries so an empty block can say what it means; the
  // wire spells it by the absence of other fields. The generators must drop it
  // from tfvars and declare no variable for it.
  optional bool select_all = 9 [(dev.planton.shared.options.manifest_only) = true];
}
