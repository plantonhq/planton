# The second act of minimal.yaml: the same settings with a longer retention
# window, an in-place update security settings take.
# Not a scenario of its own (the second-act annotation keeps discovery from
# running it as a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpDialogflowCxSecuritySettings
metadata:
  name: planton-oss-e2e-gcpdfcxs-minimal
  id: planton-oss-e2e-gcpdfcxs-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpdialogflowcxsecuritysettings
  annotations:
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e: "true"
    planton.dev/e2e-second-act: minimal.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
  tags:
    - planton-e2e
spec:
  location: global
  displayName: planton-oss-e2e-dfcxs-minimal-${E2E_RUN_ID}
  redactionStrategy: REDACT_WITH_SERVICE
  redactionScope: REDACT_DISK_STORAGE
  retentionWindowDays: 14
  purgeDataTypes:
    - DIALOGFLOW_HISTORY
