# The bucket the audio-export scenario records into. force_destroy lets the
# lane tear it down.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGcsBucket
metadata:
  name: planton-oss-e2e-gcpdfcxs-bucket
  id: planton-oss-e2e-gcpdfcxs-bucket
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpdialogflowcxsecuritysettings
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  bucketName: pln-e2e-dfcxs-${E2E_RUN_ID}
  location: US-CENTRAL1
  uniformBucketLevelAccessEnabled: true
  forceDestroy: true
