syntax = "proto3";

package dev.planton.gcp.gcphavpnconnection.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcphavpnconnection/v1alpha1/outputs.proto";
import "catalog/gcp/gcphavpnconnection/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-ha-vpn-connection
message GcpHaVpnConnection {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpHaVpnConnection'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpHaVpnConnectionSpec spec = 4 [(buf.validate.field).required = true];
  GcpHaVpnConnectionStatus status = 5;
}

message GcpHaVpnConnectionStatus {
  GcpHaVpnConnectionStackOutputs outputs = 1;
}
