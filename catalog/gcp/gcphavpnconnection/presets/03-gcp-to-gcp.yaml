apiVersion: gcp.planton.dev/v1alpha1
kind: GcpHaVpnConnection
metadata:
  name: hub-to-spoke
spec:
  gateway:
    valueFrom:
      kind: GcpHaVpnGateway
      name: hub-vpn
      fieldPath: status.outputs.gateway_self_link
  router:
    valueFrom:
      kind: GcpHaVpnGateway
      name: hub-vpn
      fieldPath: status.outputs.router_name
  region:
    valueFrom:
      kind: GcpHaVpnGateway
      name: hub-vpn
      fieldPath: status.outputs.region
  peer:
    gcpGateway:
      valueFrom:
        kind: GcpHaVpnGateway
        name: spoke-vpn
        fieldPath: status.outputs.gateway_self_link
  tunnels:
    - name: hub-to-spoke-0
      vpnGatewayInterface: 0
      sharedSecret: ${secrets-group.hub-spoke-vpn.psk-0}
      bgpSession:
        interfaceIpRange: 169.254.30.1/30
        peerAsn: 64515
    - name: hub-to-spoke-1
      vpnGatewayInterface: 1
      sharedSecret: ${secrets-group.hub-spoke-vpn.psk-1}
      bgpSession:
        interfaceIpRange: 169.254.31.1/30
        peerAsn: 64515
