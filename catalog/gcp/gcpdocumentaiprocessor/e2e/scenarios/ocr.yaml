# GcpDocumentAiProcessor scenario: an Enterprise OCR processor in the us
# multi-region with the display name defaulted from metadata.name.
# project_id is deliberately omitted. Creating a processor is free; pages
# processed would bill, and the scenario processes none.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpDocumentAiProcessor
metadata:
  name: planton-oss-e2e-gcpdocai-ocr
  id: planton-oss-e2e-gcpdocai-ocr
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpdocumentaiprocessor
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
  tags:
    - planton-e2e
spec:
  location: us
  type: OCR_PROCESSOR
  displayName: e2e-docai-ocr-${E2E_RUN_ID} # per kind and engine, so lanes side by side never share it
