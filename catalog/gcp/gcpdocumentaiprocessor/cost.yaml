# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/componentcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostProfile
metadata:
  name: gcpdocumentaiprocessor
spec:
  billing_model: usage_based
  cost_drivers:
    - field_path: type
      sku_meter: Document AI pages processed
      pricing_unit: pages
      impact: The processor bills per page processed, and the rate depends on the type -- Enterprise OCR and Layout Parser are the cheapest, Form Parser and the specialized parsers cost more per page, with volume tiers (per cloud.google.com/document-ai/pricing, read 2026-09-23). An idle pretrained processor bills nothing.
    - field_path: default_version
      sku_meter: Document AI custom processor hosting
      pricing_unit: hours
      impact: A version you trained (custom extractors) can bill deployment hours while deployed, independent of pages processed.
  estimate_exclusions:
    - pages processed follow the documents sent to the processor, not any spec field
  notes: "Batch processing reads and writes documents in Cloud Storage, billed there."
