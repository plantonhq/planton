# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: gcpdataprocautoscalingpolicy
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A policy stores no customer data -- its scaling bounds and algorithm knobs are Dataproc control-plane metadata; the data lives on attached clusters' disks, whose encryption is the cluster kind's posture.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: There is no data at rest to key on the policy itself; CMEK for cluster disks is configured on the cluster, not here.
    - control_id: enc-in-transit
      status: not_applicable
      notes: A policy terminates no connections of its own. Management calls happen on Google API endpoints, which serve exclusively over TLS as provider behavior, not per-policy configuration.
    - control_id: no-public-access
      status: not_applicable
      notes: A policy has no network endpoint to expose; it is a control-plane object reachable only through the IAM-governed Dataproc API.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network surface exists to filter; a policy is a configuration object with no addresses or ports.
    - control_id: edge-protection
      status: not_applicable
      notes: A policy receives no HTTP requests -- web ACLs and request filters have nothing to attach to.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Creating, modifying, deleting, and attaching autoscaling policies is governed by Dataproc IAM (the dataproc.autoscalingPolicies.* permission family, including the distinct .use permission a cluster creator needs to attach one); policies are additionally first-class IAM resources with their own get/setIamPolicy surface. No anonymous or non-IAM path exists.
      notes: The spec exposes no per-policy IAM fields -- resource-level grants, when wanted, are wired outside this kind.
    - control_id: workload-identity
      status: not_applicable
      notes: A policy holds no credentials and calls no cloud APIs as itself; the autoscaler acts inside Dataproc's own service identity, and cluster workload identity is the cluster kind's concern.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The only authentication path involving the policy is IAM-authenticated Dataproc API access; no weaker alternative exists to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every create, update, and delete on an autoscaling policy is recorded in Cloud Audit Logs' Admin Activity log, which is always on and cannot be disabled.
    - control_id: monitoring-integration
      status: not_applicable
      notes: A policy emits no runtime telemetry of its own; the scaling decisions it drives surface in the attached clusters' Dataproc metrics and autoscaler logs, which belong to the cluster kind.
    - control_id: backup-recovery
      status: not_applicable
      notes: A policy holds no data to back up -- it is declarative configuration fully re-creatable from the manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: A policy is regional control-plane metadata (its location field is placement, matching the clusters it may govern, not a replication toggle); availability is Google's service posture.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Empty defaults to DELETE (the provider default); PREVENT makes any destroying plan fail until the value is lifted, and ABANDON removes the policy from management while attached clusters keep scaling by it in GCP.
      notes: Independently of this engine-side guard, the Dataproc API itself refuses to delete a policy while any cluster still references it -- a dependency guard that protects live clusters regardless of the setting.
    - control_id: managed-patching
      status: not_applicable
      notes: A policy is a pure configuration object with no software to patch; the autoscaler is Google-operated, and cluster image patching is the cluster kind's concern.
