# GcpDataprocAutoscalingPolicy scenario: a balanced policy with primary
# bounds, a secondary (spot) burst arm, and the YARN algorithm. project_id
# is deliberately omitted (ambient project). The cloud-side policy_id
# carries ${E2E_RUN_ID} so reruns never collide.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpDataprocAutoscalingPolicy
metadata:
  name: planton-oss-e2e-gcpdpasp-smoke
  id: planton-oss-e2e-gcpdpasp-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpdataprocautoscalingpolicy
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  policyId: e2e-dpasp-${E2E_RUN_ID}
  location: us-central1
  workerConfig:
    maxInstances: 10
    minInstances: 2
    weight: 1
  secondaryWorkerConfig:
    maxInstances: 20
    weight: 3
  basicAlgorithm:
    cooldownPeriod: 120s
    yarnConfig:
      gracefulDecommissionTimeout: 3600s
      scaleUpFactor: 0.5
      scaleDownFactor: 1.0
  # Explicit DELETE must be a no-op against the provider default on
  # re-plan.
  deletionPolicy: DELETE
