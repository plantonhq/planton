syntax = "proto3";

package dev.planton.gcp.gcpdataprocautoscalingpolicy.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpdataprocautoscalingpolicy/v1alpha1/outputs.proto";
import "catalog/gcp/gcpdataprocautoscalingpolicy/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-dataproc-autoscaling-policy
message GcpDataprocAutoscalingPolicy {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpDataprocAutoscalingPolicy'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpDataprocAutoscalingPolicySpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpDataprocAutoscalingPolicyStatus status = 5;
}

//gcp-dataproc-autoscaling-policy status
message GcpDataprocAutoscalingPolicyStatus {
  //outputs
  GcpDataprocAutoscalingPolicyOutputs outputs = 1;
}
