apiVersion: gcp.planton.dev/v1alpha1
kind: GcpComputeMig
metadata:
  name: broker-fleet
spec:
  # Stateful fleets are usually zonal: cross-zone rebalancing and
  # preserved state do not mix.
  zone: us-central1-a

  template:
    machineType: e2-medium
    disks:
      - boot: true
        sourceImage:
          value: debian-cloud/debian-12
      # The data disk every instance gets; the stateful rule below
      # preserves each instance's copy across recreation.
      - deviceName: data
        sizeGb: 100
        diskType: pd-balanced
    networkInterfaces:
      - subnetwork:
          valueFrom:
            kind: GcpSubnetwork
            name: prod-subnet
            fieldPath: status.outputs.subnetwork_self_link
    startupScript: |
      #!/bin/bash
      /opt/broker/mount-data-and-start.sh

  targetSize: 3

  # The stateful contract: each instance's data disk survives repairs
  # and updates; internal IPs keep their identity too.
  statefulDisks:
    - deviceName: data
      deleteRule: NEVER
  statefulInternalIps:
    - interfaceName: nic0
      deleteRule: NEVER

  # RECREATE preserves instance NAMES through updates — what stateful
  # consumers address — and requires an unavailability budget above 0
  # (one instance at a time here).
  updatePolicy:
    minimalAction: REPLACE
    type: OPPORTUNISTIC
    replacementMethod: RECREATE
    maxUnavailableFixed: 1

  # Repairs preserve the running template version — a repair must never
  # double as an unplanned upgrade on a stateful fleet.
  instanceLifecyclePolicy:
    defaultActionOnFailure: REPAIR
    forceUpdateOnRepair: "NO"

  deletionPolicy: PREVENT
