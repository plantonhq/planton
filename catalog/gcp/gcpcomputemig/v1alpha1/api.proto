syntax = "proto3";

package dev.planton.gcp.gcpcomputemig.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpcomputemig/v1alpha1/outputs.proto";
import "catalog/gcp/gcpcomputemig/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-compute-mig
message GcpComputeMig {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpComputeMig'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpComputeMigSpec spec = 4 [(buf.validate.field).required = true];
  GcpComputeMigStatus status = 5;
}

message GcpComputeMigStatus {
  GcpComputeMigOutputs outputs = 1;
}
