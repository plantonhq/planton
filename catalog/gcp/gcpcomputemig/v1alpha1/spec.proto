  // instance metadata of VMs created from it.
  string version_name = 1;

  // Instance template for this version. Leave EMPTY to run this
  // kind's own template (the default and the normal case). Set a full
  // template self link URL to pin an EXTERNAL template — the canary
  // escape hatch for splitting the fleet across templates this kind
  // does not manage.
  string template_self_link = 2;

  // Fixed number of instances running this version. Unset on the
  // stable version (it absorbs the remainder of the fleet).
  optional int32 target_size_fixed = 3 [(buf.validate.field).int32.gte = 0];

  // Percent of the fleet (0-100) running this version, rounded up.
  // Unset on the stable version (it absorbs the remainder).
  optional int32 target_size_percent = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
}

// GcpComputeMigNamedPort maps a logical service name to a port number
// on every VM in the group.
message GcpComputeMigNamedPort {
  // The port name backend services reference via port_name (e.g.
  // "http").
  string name = 1 [(buf.validate.field).required = true];

  // The port number the service listens on (e.g. 8080).
  int32 port = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 65535
    }
  ];
}

// GcpComputeMigUpdatePolicy controls how the group rolls out template
// and configuration changes to running VMs.
message GcpComputeMigUpdatePolicy {
  option (buf.validate.message).cel = {
    id: "surge_fixed_xor_percent"
    expression: "!(has(this.max_surge_fixed) && has(this.max_surge_percent))"
    message: "the surge budget is either fixed or percent — set at most one of max_surge_fixed / max_surge_percent"
  };
  option (buf.validate.message).cel = {
    id: "unavailable_fixed_xor_percent"
    expression: "!(has(this.max_unavailable_fixed) && has(this.max_unavailable_percent))"
    message: "the unavailability budget is either fixed or percent — set at most one of max_unavailable_fixed / max_unavailable_percent"
  };
  option (buf.validate.message).cel = {
    id: "recreate_needs_unavailable_budget"
    expression: "this.replacement_method != 'RECREATE' || (has(this.max_unavailable_fixed) && this.max_unavailable_fixed > 0) || (has(this.max_unavailable_percent) && this.max_unavailable_percent > 0)"
    message: "RECREATE preserves instance names by replacing in place, so it needs room to take instances down — set max_unavailable_fixed or max_unavailable_percent above 0 (the provider's own requirement)"
  };

  // The most disruptive action the rollout may take on its own:
  //   "NONE"    -- no automatic action (changes wait for manual
  //                refresh)
  //   "REFRESH" -- apply updates that need no restart
  //   "RESTART" -- stop/start instances to apply updates
  //   "REPLACE" -- recreate instances from the new template (the usual
  //                choice for template rotations)
  string minimal_action = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "NONE",
        "REFRESH",
        "RESTART",
        "REPLACE"
      ]
    }
  ];

  // Rollout mode:
  //   "PROACTIVE"     -- the group rolls changes out automatically
  //                      within the surge/unavailability budget
  //   "OPPORTUNISTIC" -- changes apply only when instances are
  //                      recreated anyway (manual refresh, autoscaler
  //                      churn, repairs)
  string type = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "OPPORTUNISTIC",
        "PROACTIVE"
      ]
    }
  ];

  // Cap on how disruptive an individual update is allowed to be —
  // updates needing more disruption than this wait instead. Same value
  // set as minimal_action; defaults to "REPLACE" (no cap).
  string most_disruptive_allowed_action = 3 [(buf.validate.field).cel = {
    id: "valid_most_disruptive_allowed_action"
    expression: "this == '' || this in ['NONE', 'REFRESH', 'RESTART', 'REPLACE']"
    message: "most_disruptive_allowed_action must be NONE, REFRESH, RESTART, or REPLACE"
  }];

  // How replaced instances are recreated:
  //   ""           -- same as "SUBSTITUTE"
  //   "SUBSTITUTE" -- new instances get fresh random names (allows
  //                   surge; zero-unavailability rollouts possible)
  //   "RECREATE"   -- instance NAMES are preserved (stateful-friendly);
  //                   requires an unavailability budget above 0
  string replacement_method = 4 [(buf.validate.field).cel = {
    id: "valid_replacement_method"
    expression: "this == '' || this in ['RECREATE', 'SUBSTITUTE']"
    message: "replacement_method must be RECREATE or SUBSTITUTE"
  }];

  // Extra instances the rollout may create above target_size (fixed
  // count). Higher surge = faster rollout, more temporary cost.
  // Regional groups accept ONLY 0 or a value >= the group's zone count
  // (live-verified 400: "Fixed updatePolicy.maxSurge for regional
  // managed instance group has to be either 0 or at least equal to the
  // number of zones" — a regional group spreads over 3 zones by
  // default, so 1 and 2 are rejected; use percent for finer budgets).
  optional int32 max_surge_fixed = 5 [(buf.validate.field).int32.gte = 0];

  // Extra instances the rollout may create above target_size, as a
  // percent of the group (0-100).
  optional int32 max_surge_percent = 6 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];

  // Instances the rollout may take below target_size (fixed count).
  optional int32 max_unavailable_fixed = 7 [(buf.validate.field).int32.gte = 0];

  // Instances the rollout may take below target_size, as a percent of
  // the group (0-100).
  optional int32 max_unavailable_percent = 8 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];

  // REGIONAL groups only: whether the group proactively redistributes
  // instances to keep the zone balance ("PROACTIVE", the GCP default)
  // or leaves them where they are ("NONE" — required for stateful
  // regional groups).
  string instance_redistribution_type = 9 [(buf.validate.field).cel = {
    id: "valid_instance_redistribution_type"
    expression: "this == '' || this in ['PROACTIVE', 'NONE']"
    message: "instance_redistribution_type must be PROACTIVE or NONE"
  }];
}

// GcpComputeMigAutoHealing recreates VMs that fail an application-level
// health check.
message GcpComputeMigAutoHealing {
  // The health check that decides instance health, referenced as a
  // GcpHealthCheck or a literal self link. Use a health check tuned for
  // auto-healing (conservative thresholds) — aggressive LB health
  // checks cause repair storms.
  dev.planton.shared.foreignkey.v1.StringValueOrRef health_check = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpHealthCheck,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.self_link"
  ];

  // Seconds a freshly created VM gets to boot and become healthy before
  // auto-healing counts failures against it (0-3600). Size it to your
  // application's cold-start time — too short and the group repair-loops
  // healthy-but-slow instances.
  int32 initial_delay_sec = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 3600
    }
  ];
}

// GcpComputeMigStandbyPolicy configures the group's standby pool of
// pre-created suspended/stopped VMs (pair with the spec's
// target_suspended_size / target_stopped_size).
message GcpComputeMigStandbyPolicy {
  // Seconds a newly created standby VM runs before being suspended or
  // stopped (0-3600) — time for boot and warmup so resume is instant.
  optional int32 initial_delay_sec = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 3600
  }];

  // How standby VMs are consumed:
  //   ""               -- same as "MANUAL" (GCP default)
  //   "MANUAL"         -- standby VMs activate only by explicit API
  //                       action
  //   "SCALE_OUT_POOL" -- scale-outs resume standby VMs first (the
  //                       fast-scale-out mode)
  string mode = 2 [(buf.validate.field).cel = {
    id: "valid_standby_mode"
    expression: "this == '' || this in ['MANUAL', 'SCALE_OUT_POOL']"
    message: "mode must be MANUAL or SCALE_OUT_POOL"
  }];
}

// GcpComputeMigStatefulDisk preserves one template disk across instance
// recreation and updates.
message GcpComputeMigStatefulDisk {
  // Device name of the template disk to make stateful — must match a
  // device_name in the template's disks.
  string device_name = 1 [(buf.validate.field).required = true];

  // What happens to the preserved disk when its instance is PERMANENTLY
  // deleted (group deletion, explicit instance delete — not repairs):
  //   ""                               -- same as "NEVER" (GCP default)
  //   "NEVER"                          -- the disk is kept
  //   "ON_PERMANENT_INSTANCE_DELETION" -- the disk is deleted with the
  //                                       instance
  string delete_rule = 2 [(buf.validate.field).cel = {
    id: "valid_stateful_disk_delete_rule"
    expression: "this == '' || this in ['NEVER', 'ON_PERMANENT_INSTANCE_DELETION']"
    message: "delete_rule must be NEVER or ON_PERMANENT_INSTANCE_DELETION"
  }];
}

// GcpComputeMigStatefulIp preserves an interface's IP across instance
// recreation — each VM keeps its address identity through repairs and
// updates.
message GcpComputeMigStatefulIp {
  // Network interface name whose IP to preserve. When omitted, "nic0"
  // (the first interface) is used.
  string interface_name = 1;

  // What happens to the preserved IP when its instance is PERMANENTLY
  // deleted:
  //   ""                               -- same as "NEVER" (GCP default)
  //   "NEVER"                          -- the address is kept
  //   "ON_PERMANENT_INSTANCE_DELETION" -- the address is released with
  //                                       the instance
  string delete_rule = 2 [(buf.validate.field).cel = {
    id: "valid_stateful_ip_delete_rule"
    expression: "this == '' || this in ['NEVER', 'ON_PERMANENT_INSTANCE_DELETION']"
    message: "delete_rule must be NEVER or ON_PERMANENT_INSTANCE_DELETION"
  }];
}

// GcpComputeMigInstanceLifecyclePolicy controls the group's repair
// behavior.
message GcpComputeMigInstanceLifecyclePolicy {
  // What the group does with failed instances (crashed, preempted,
  // failed to start):
  //   ""           -- same as "REPAIR" (GCP default)
  //   "REPAIR"     -- recreate/restart failed instances automatically
  //   "DO_NOTHING" -- leave failed instances alone (manual operations
  //                   mode)
  string default_action_on_failure = 1 [(buf.validate.field).cel = {
    id: "valid_default_action_on_failure"
    expression: "this == '' || this in ['REPAIR', 'DO_NOTHING']"
    message: "default_action_on_failure must be REPAIR or DO_NOTHING"
  }];

  // Whether a repair may apply the LATEST template version instead of
  // the instance's current one: "YES" or "NO" (GCP default NO —
  // repairs preserve the running version; YES turns repairs into
  // opportunistic update vectors).
  string force_update_on_repair = 2 [(buf.validate.field).cel = {
    id: "valid_force_update_on_repair"
    expression: "this == '' || this in ['YES', 'NO']"
    message: "force_update_on_repair must be YES or NO"
  }];

  // What the group does when the auto-healing health check fails (only
  // meaningful with auto_healing configured):
  //   ""               -- same as "DEFAULT_ACTION" (GCP default)
  //   "DEFAULT_ACTION" -- follow default_action_on_failure
  //   "REPAIR"         -- repair on health-check failure even when
  //                       default_action_on_failure is DO_NOTHING
  //   "DO_NOTHING"     -- never repair on health-check failure
  string on_failed_health_check = 3 [(buf.validate.field).cel = {
    id: "valid_on_failed_health_check"
    expression: "this == '' || this in ['DEFAULT_ACTION', 'REPAIR', 'DO_NOTHING']"
    message: "on_failed_health_check must be DEFAULT_ACTION, REPAIR, or DO_NOTHING"
  }];

  // Whether a repair may recreate the instance in a DIFFERENT zone of a
  // regional group: "YES" or "NO" (GCP default NO — repairs stay
  // in-zone).
  string on_repair_allow_changing_zone = 4 [(buf.validate.field).cel = {
    id: "valid_on_repair_allow_changing_zone"
    expression: "this == '' || this in ['YES', 'NO']"
    message: "on_repair_allow_changing_zone must be YES or NO"
  }];
}

// GcpComputeMigAllInstancesConfig stamps labels and metadata onto ALL
// instances in addition to the template's — fleet-wide toggles that
// apply per update_policy without rotating the template.
message GcpComputeMigAllInstancesConfig {
  // Labels added to every instance (on top of template labels).
  map<string, string> labels = 1;

  // Metadata added to every instance (on top of template metadata).
  map<string, string> metadata = 2;
}

// GcpComputeMigDistributionPolicy shapes a REGIONAL group's spread
// across zones.
message GcpComputeMigDistributionPolicy {
  // The zones instances may run in (e.g. ["us-central1-a",
  // "us-central1-f"]). When omitted, GCP uses the region's zones.
  // Immutable: changing zones replaces the group.
  repeated string zones = 1;

  // The distribution shape the group converges to (per the API's
  // documented set):
  //   ""                -- same as "EVEN" (GCP default)
  //   "EVEN"            -- equal instance counts across zones (highest
  //                        availability)
  //   "BALANCED"        -- spread across zones subject to capacity
  //   "ANY"             -- any zone with capacity (best for scarce
  //                        shapes)
  //   "ANY_SINGLE_ZONE" -- all instances in one zone GCP picks
  // The provider does not pre-validate this list — it is the API's
  // documented vocabulary, enforced here so typos fail at validate
  // time.
  string target_shape = 2 [(buf.validate.field).cel = {
    id: "valid_target_shape"
    expression: "this == '' || this in ['EVEN', 'BALANCED', 'ANY', 'ANY_SINGLE_ZONE']"
    message: "target_shape must be EVEN, BALANCED, ANY, or ANY_SINGLE_ZONE"
  }];
}

// GcpComputeMigInstanceFlexibilityPolicy lets a REGIONAL group fall
// back across ranked machine-type alternatives when the primary shape
// is out of capacity.
message GcpComputeMigInstanceFlexibilityPolicy {
  // Named, ranked machine-type selections. Lower rank is preferred.
  repeated GcpComputeMigInstanceSelection instance_selections = 1 [(buf.validate.field).repeated.min_items = 1];
}

// GcpComputeMigInstanceSelection names one ranked machine-type
// alternative set.
message GcpComputeMigInstanceSelection {
  // Name of this selection (e.g. "primary", "fallback").
  string name = 1 [(buf.validate.field).required = true];

  // Machine types in this selection (e.g. ["e2-standard-4",
  // "n2-standard-4"]).
  repeated string machine_types = 2 [(buf.validate.field).repeated.min_items = 1];

  // Preference rank — selections with lower rank are consumed first.
  optional int32 rank = 3 [(buf.validate.field).int32.gte = 0];
}

// GcpComputeMigAutoscaler scales the group between min and max replicas
// from CPU, load-balancer capacity, custom metrics, or schedules.
message GcpComputeMigAutoscaler {
  option (buf.validate.message).cel = {
    id: "max_gte_min_replicas"
    expression: "this.max_replicas >= this.min_replicas"
    message: "max_replicas must be greater than or equal to min_replicas"
  };

  // Name of the autoscaler resource. When omitted, the group name is
  // used.
  string autoscaler_name = 1 [(buf.validate.field).cel = {
    id: "autoscaler_name_format"
    expression: "this == '' || this.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$')"
    message: "autoscaler_name must be lowercase letters, numbers, and hyphens, starting with a letter and not ending with a hyphen"
  }];

  // Human-readable description of the autoscaler.
  string description = 2;

  // Minimum number of replicas the autoscaler maintains (>= 0).
  int32 min_replicas = 3 [(buf.validate.field).int32.gte = 0];

  // Maximum number of replicas the autoscaler may create.
  int32 max_replicas = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32.gte = 1
  ];

  // Seconds the autoscaler waits before collecting usage from a NEW
  // instance — covers boot and warmup so unreliable early samples do
  // not drive scaling. GCP default: 60.
  optional int32 cooldown_period = 5 [(buf.validate.field).int32.gte = 0];

  // Operating mode (the API's documented vocabulary; the provider
  // defaults it to "ON" and does not pre-validate the value):
  //   ""               -- same as "ON"
  //   "ON"             -- scale out and in
  //   "OFF"            -- autoscaler holds everything (group keeps its
  //                       current size)
  //   "ONLY_SCALE_OUT" -- grow but never shrink
  string mode = 6 [(buf.validate.field).cel = {
    id: "valid_autoscaler_mode"
    expression: "this == '' || this in ['ON', 'OFF', 'ONLY_SCALE_OUT']"
    message: "mode must be ON, OFF, or ONLY_SCALE_OUT"
  }];

  // Target CPU utilization as a fraction in (0, 1] — e.g. 0.6 keeps
  // average fleet CPU at 60%. The default signal when no other target
  // is set (GCP applies 0.6 when the policy has no targets at all).
  optional double cpu_target = 7 [(buf.validate.field).double = {
    gt: 0
    lte: 1
  }];

  // Predictive autoscaling for the CPU signal (the provider's own
  // documented values):
  //   ""                      -- same as "NONE"
  //   "NONE"                  -- react to real-time metrics only
  //   "OPTIMIZE_AVAILABILITY" -- learn daily/weekly patterns and scale
  //                              out AHEAD of anticipated demand
  string cpu_predictive_method = 8 [(buf.validate.field).cel = {
    id: "valid_cpu_predictive_method"
    expression: "this == '' || this in ['NONE', 'OPTIMIZE_AVAILABILITY']"
    message: "cpu_predictive_method must be NONE or OPTIMIZE_AVAILABILITY"
  }];

  // Target backend utilization fraction (0, 1] of the load balancer's
  // configured serving capacity — scales the fleet to hold the
  // balancer's per-backend utilization at this level. Only meaningful
  // when the group serves an EXTERNAL HTTP(S) load balancer with
  // UTILIZATION balancing mode.
  optional double load_balancing_target = 9 [(buf.validate.field).double = {
    gt: 0
    lte: 1
  }];

  // Custom Cloud Monitoring metric signals.
  repeated GcpComputeMigAutoscalerMetric metrics = 10;

  // Limits how fast the autoscaler SHRINKS the fleet after load drops —
  // the guard against cascading scale-in on temporary dips.
  GcpComputeMigScaleInControl scale_in_control = 11;

  // Calendar-based capacity schedules (cron) that set a minimum replica
  // count for recurring time windows — e.g. business-hours capacity
  // floors. Metric-based scaling still adds capacity above the
  // schedule's floor.
  repeated GcpComputeMigScalingSchedule schedules = 12;

  // Seconds of load stabilization the autoscaler considers before
  // scale-in decisions — effectively how long it "remembers" peak load.
  optional int32 stabilization_period = 13 [(buf.validate.field).int32.gte = 0];
}

// GcpComputeMigAutoscalerMetric scales on a Cloud Monitoring metric.
message GcpComputeMigAutoscalerMetric {
  option (buf.validate.message).cel = {
    id: "metric_target_or_single_instance_assignment"
    expression: "!(has(this.target) && has(this.single_instance_assignment))"
    message: "a metric is either utilization-targeted (target + type) or workload-proportional (single_instance_assignment) — set at most one"
  };

  // The metric identifier, e.g.
  // "pubsub.googleapis.com/subscription/num_undelivered_messages" or
  // "custom.googleapis.com/myapp/queue_depth". The metric must export
  // values for the fleet's instances (or be a per-group metric used
  // with filter + single_instance_assignment).
  string name = 1 [(buf.validate.field).required = true];

  // Target value of the metric the autoscaler maintains per instance.
  // Pair with type to say how the metric is interpreted.
  optional double target = 2 [(buf.validate.field).double.gt = 0];

  // How the metric's values are interpreted against target (the
  // provider validates this list):
  //   "GAUGE"             -- instantaneous value
  //   "DELTA_PER_SECOND"  -- rate per second
  //   "DELTA_PER_MINUTE"  -- rate per minute
  string type = 3 [(buf.validate.field).cel = {
    id: "valid_metric_type"
    expression: "this == '' || this in ['GAUGE', 'DELTA_PER_SECOND', 'DELTA_PER_MINUTE']"
    message: "type must be GAUGE, DELTA_PER_SECOND, or DELTA_PER_MINUTE"
  }];

  // Monitoring filter expression selecting the metric's time series
  // (e.g. a per-group Pub/Sub subscription metric). GCP default:
  // "resource.type = gce_instance".
  string filter = 4;

  // For per-GROUP workload metrics (queue depth, pending jobs): the
  // amount of work one instance handles. The autoscaler keeps
  // instances proportional to metric_value / single_instance_assignment.
  // Mutually exclusive with target/type.
  optional double single_instance_assignment = 5 [(buf.validate.field).double.gt = 0];
}

// GcpComputeMigScaleInControl bounds how fast the fleet shrinks.
message GcpComputeMigScaleInControl {
  option (buf.validate.message).cel = {
    id: "scale_in_control_needs_a_bound"
    expression: "has(this.max_scaled_in_replicas_fixed) || has(this.max_scaled_in_replicas_percent) || has(this.time_window_sec)"
    message: "scale_in_control needs at least one bound: max_scaled_in_replicas_fixed, max_scaled_in_replicas_percent, or time_window_sec"
  };
  option (buf.validate.message).cel = {
    id: "scaled_in_replicas_fixed_xor_percent"
    expression: "!(has(this.max_scaled_in_replicas_fixed) && has(this.max_scaled_in_replicas_percent))"
    message: "the scale-in cap is either fixed or percent — set at most one"
  };

  // Max instances that may be removed within the trailing time window
  // (fixed count).
  optional int32 max_scaled_in_replicas_fixed = 1 [(buf.validate.field).int32.gte = 0];

  // Max instances that may be removed within the trailing time window,
  // as a percent of the group (0-100).
  optional int32 max_scaled_in_replicas_percent = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];

  // The trailing time window (seconds) the scale-in cap applies over.
  optional int32 time_window_sec = 3 [(buf.validate.field).int32.gte = 0];
}

// GcpComputeMigScalingSchedule sets a recurring minimum-capacity window.
message GcpComputeMigScalingSchedule {
  // Name of the schedule (unique within the autoscaler).
  string schedule_name = 1 [(buf.validate.field).required = true];

  // Cron expression for when the window STARTS (e.g. "0 8 * * MON-FRI"
  // for weekday mornings), interpreted in time_zone.
  string schedule = 2 [(buf.validate.field).required = true];

  // How long the window lasts, in seconds. The provider documents a
  // minimum of 300.
  int32 duration_sec = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32.gte = 300
  ];

  // Minimum replicas the group holds during the window.
  int32 min_required_replicas = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32.gte = 0
  ];

  // Keep the schedule defined but inactive. GCP default: false.
  optional bool disabled = 5;

  // IANA time zone the cron expression is evaluated in (e.g.
  // "America/New_York"). GCP default: "UTC".
  string time_zone = 6;

  // Human-readable description of the schedule.
  string description = 7;
}

// GcpComputeMigPerInstanceConfig pins one instance NAME to preserved
// state — the stateful-workload surface. The group treats configured
// instances as stateful: their name and preserved disks/IPs/metadata
// survive recreation, repairs, and updates.
message GcpComputeMigPerInstanceConfig {
  // The per-instance config's name — which IS the name of the managed
  // instance it applies to (for RECREATE-method groups the instance
  // names are "<base_instance_name>-<suffix>"; a config for a
  // not-yet-existing name creates an instance with that name).
  string config_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1}
  ];

  // Preserved state pinned to the instance: disks, IPs, and metadata
  // that survive recreation.
  GcpComputeMigPreservedState preserved_state = 2;

  // The LEAST disruptive action the group may take to apply this
  // config to the instance (the update escalates to what the change
  // actually needs, but never below this): "NONE" (GCP default),
  // "REFRESH", "RESTART", or "REPLACE".
  string minimal_action = 3 [(buf.validate.field).cel = {
    id: "valid_pic_minimal_action"
    expression: "this == '' || this in ['NONE', 'REFRESH', 'RESTART', 'REPLACE']"
    message: "minimal_action must be NONE, REFRESH, RESTART, or REPLACE"
  }];

  // The MOST disruptive action the group may take to apply this config
  // — updates needing more wait instead. "NONE", "REFRESH", "RESTART",
  // or "REPLACE" (GCP default).
  string most_disruptive_allowed_action = 4 [(buf.validate.field).cel = {
    id: "valid_pic_most_disruptive_allowed_action"
    expression: "this == '' || this in ['NONE', 'REFRESH', 'RESTART', 'REPLACE']"
    message: "most_disruptive_allowed_action must be NONE, REFRESH, RESTART, or REPLACE"
  }];

  // When true, removing this config from the spec DELETES the managed
  // instance itself. Default false: the instance keeps running and
  // only its stateful config is removed (state application follows
  // remove_instance_state_on_destroy).
  optional bool remove_instance_on_destroy = 5;

  // When true, removing this config also removes its preserved state
  // (disks per their delete rules, IPs, metadata) from the running
  // instance immediately. Default false: the instance keeps the state
  // until it is recreated. Irrelevant when remove_instance_on_destroy
  // deletes the instance altogether.
  optional bool remove_instance_state_on_destroy = 6;
}

// GcpComputeMigPreservedState is the stateful payload of a per-instance
// config.
message GcpComputeMigPreservedState {
  // Preserved metadata key/value pairs pinned to the instance (merged
  // over template/all-instances metadata).
  map<string, string> metadata = 1;

  // Preserved disks pinned to the instance.
  repeated GcpComputeMigPreservedDisk disks = 2;

  // Preserved EXTERNAL IPs pinned to the instance's interfaces.
  repeated GcpComputeMigPreservedIp external_ips = 3;

  // Preserved INTERNAL IPs pinned to the instance's interfaces.
  repeated GcpComputeMigPreservedIp internal_ips = 4;
}

// GcpComputeMigPreservedDisk pins one existing disk to the instance.
message GcpComputeMigPreservedDisk {
  // Device name the disk is exposed under on the instance — matches
  // the template's disk device_name when overriding a template disk.
  string device_name = 1 [(buf.validate.field).required = true];

  // The disk to attach, referenced as a GcpComputeDisk or a literal
  // self link. The disk must live in the instance's zone.
  dev.planton.shared.foreignkey.v1.StringValueOrRef source = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpComputeDisk,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.self_link"
  ];

  // Attachment mode: "READ_WRITE" (GCP default) or "READ_ONLY".
  string mode = 3 [(buf.validate.field).cel = {
    id: "valid_preserved_disk_mode"
    expression: "this == '' || this in ['READ_WRITE', 'READ_ONLY']"
    message: "mode must be READ_WRITE or READ_ONLY"
  }];

  // What happens to the disk when the instance is PERMANENTLY deleted:
  //   ""                               -- same as "NEVER" (GCP default)
  //   "NEVER"                          -- the disk is kept
  //   "ON_PERMANENT_INSTANCE_DELETION" -- the disk is deleted with the
  //                                       instance
  string delete_rule = 4 [(buf.validate.field).cel = {
    id: "valid_preserved_disk_delete_rule"
    expression: "this == '' || this in ['NEVER', 'ON_PERMANENT_INSTANCE_DELETION']"
    message: "delete_rule must be NEVER or ON_PERMANENT_INSTANCE_DELETION"
  }];
}

// GcpComputeMigPreservedIp pins one IP address to an instance
// interface.
message GcpComputeMigPreservedIp {
  // Interface name the address is pinned to (e.g. "nic0").
  string interface_name = 1 [(buf.validate.field).required = true];

  // The literal IP address to preserve, or a reference to a reserved
  // GcpAddress. When omitted, the instance's current address is
  // adopted as preserved state.
  dev.planton.shared.foreignkey.v1.StringValueOrRef address = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpAddress,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.address"
  ];

  // What happens to the address when the instance is PERMANENTLY
  // deleted:
  //   ""                               -- same as "NEVER" (GCP default)
  //   "NEVER"                          -- the address is kept
  //   "ON_PERMANENT_INSTANCE_DELETION" -- the address is released with
  //                                       the instance
  string auto_delete = 3 [(buf.validate.field).cel = {
    id: "valid_preserved_ip_auto_delete"
    expression: "this == '' || this in ['NEVER', 'ON_PERMANENT_INSTANCE_DELETION']"
    message: "auto_delete must be NEVER or ON_PERMANENT_INSTANCE_DELETION"
  }];
}

// GcpComputeMigResizeRequest asks GCP to add capacity for a bounded
// duration when it becomes available (Dynamic Workload Scheduler) —
// the batch/HPC path for scarce machine shapes. Requests are IMMUTABLE:
// change any field and the request is replaced (a new ask is queued).
// Destroying a request cancels it if still ACTIVE; the deletion_policy
// of the spec applies.
message GcpComputeMigResizeRequest {
  // Name of the resize request (unique within the group).
  string request_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1}
  ];

  // Human-readable description of the request.
  string description = 2;

  // Number of instances to ADD to the group when capacity is granted.
  int32 resize_by = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32.gte = 1
  ];

  // How long the granted instances run before GCP reclaims them, in
  // seconds (10 minutes to 7 days: 600-604800 — the provider's own
  // documented bounds). Requires the template's
  // scheduling.provisioning_model to support bounded runs (FLEX_START).
  // When omitted, the request asks for unbounded capacity.
  optional int64 requested_run_duration_seconds = 4 [(buf.validate.field).int64 = {
    gte: 600
    lte: 604800
  }];
}
