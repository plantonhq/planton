# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpcomputemig
spec:
  gcp:
    groups:
      - purpose: EnableComputeApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
          - resourcemanager.projects.get
        provenance: derived
        reach: target
        privilege: ordinary
        notes: Covers google_project_service enabling compute.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed. The provider reads the project with resourcemanager.projects.get before its services on every refresh, so a re-plan or destroy needs it (measured live).
      - purpose: ManageInstanceTemplate
        permissions:
          - compute.instanceTemplates.create
          - compute.instanceTemplates.get
          - compute.instanceTemplates.delete
          - compute.instanceTemplates.useReadOnly
          - compute.networks.get
        provenance: derived
        reach: target
        privilege: ordinary
        notes: Covers google_compute_instance_template and google_compute_region_instance_template (the module picks one by zone vs region); templates are immutable, so updates are create-new-then-delete-old, never an update permission. GCP defines NO compute.regionInstanceTemplates permissions (verified against IAM's testable-permissions inventory) -- regional templates authorize under these same unqualified names. useReadOnly lets the group manager reference the template. Creating a template reads the network its interface names (compute.networks.get; Google refuses the create without it, measured).
      - purpose: ManageGroupManager
        permissions:
          - compute.instanceGroupManagers.create
          - compute.instanceGroupManagers.get
          - compute.instanceGroupManagers.update
          - compute.instanceGroupManagers.delete
          - compute.instanceGroupManagers.use
          - compute.instanceGroups.create
          - compute.instanceGroups.get
          - compute.instances.create
          - compute.instances.delete
          - compute.zoneOperations.get
          - compute.regionOperations.get
        provenance: derived
        reach: target
        privilege: ordinary
        notes: Covers google_compute_instance_group_manager / _region_instance_group_manager plus every sub-resource that authorizes THROUGH the manager -- per-instance configs (google_compute_per_instance_config / _region_) and resize requests (google_compute_resize_request / _region_) all check instanceGroupManagers.update, since GCP defines no compute.resizeRequests or per-instance-config permissions (verified against the IAM inventory; mirrors how node pools authorize under container.clusters.update). Google creates the group the manager runs as the caller (compute.instanceGroups.create, measured). The manager creates and deletes VMs on the caller's behalf, so instances.create/delete are checked on sizing changes; zone/regionOperations.get polls the operations every mutation returns.
      - purpose: CreateGroupVms
        permissions:
          - compute.disks.create
          - compute.images.useReadOnly
          - compute.subnetworks.use
          - compute.instances.setLabels
          - compute.instances.setMetadata
        provenance: derived
        reach: target
        privilege: ordinary
        notes: Creating a group manager, Google checks that the caller could create the template's VMs itself -- their boot disks from the template's image, their NICs on the network's subnetwork, the labels the module puts on every template, and metadata, which Google writes onto every group VM (its instance-template key) even when the template sets none (Google refuses the create without compute.disks.create and compute.instances.setMetadata, measured). instances.create sits in ManageGroupManager.
      - purpose: CreateGroupVmsWithTags
        permissions:
          - compute.instances.setTags
        provenance: derived
        reach: target
        privilege: ordinary
        condition:
          spec_field_set: template.tags
        notes: Required only when the template carries network tags, which its VMs are created with.
      - purpose: CreateGroupVmsWithServiceAccount
        permissions:
          - compute.instances.setServiceAccount
        provenance: derived
        reach: target
        privilege: ordinary
        condition:
          spec_field_set: template.service_account.email
        notes: Required only when the template attaches a service account to its VMs (with ActAsServiceAccount).
      - purpose: ManageAutoscaler
        permissions:
          - compute.autoscalers.create
          - compute.autoscalers.get
          - compute.autoscalers.update
          - compute.autoscalers.delete
        provenance: derived
        reach: target
        privilege: ordinary
        condition:
          spec_field_set: autoscaler
        notes: Required only when spec.autoscaler is set (google_compute_autoscaler / _region_autoscaler). GCP defines NO compute.regionAutoscalers permissions (verified against the IAM inventory) -- regional autoscalers authorize under these same names.
      - purpose: UseHealthCheck
        permissions:
          - compute.healthChecks.use
        provenance: derived
        reach: target
        privilege: ordinary
        condition:
          spec_field_set: auto_healing.health_check
        notes: Required only when auto_healing references a health check by self link -- Google checks compute.healthChecks.use, not the read-only grant, when the group manager wires auto-healing (measured).
      - purpose: ActAsServiceAccount
        permissions:
          - iam.serviceAccounts.actAs
        provenance: derived
        reach: target
        privilege: uses_identity
        condition:
          spec_field_set: template.service_account.email
        notes: Required only when template.service_account.email attaches an identity to the fleet -- GCP demands actAs on that account before creating instances running as it. Not needed when the block is omitted.
