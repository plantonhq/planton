# The second act of minimal.yaml: the same rule with a second label, a
# setLabels call in place (its name, IP, ports and scheme recreate it). Not a
# scenario of its own (the second-act annotation keeps discovery from running
# it as a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGlobalForwardingRule
metadata:
  name: planton-oss-e2e-gcpgfr-smoke
  id: planton-oss-e2e-gcpgfr-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpglobalforwardingrule
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-second-act: minimal.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
  tags:
    - planton-e2e
spec:
  forwardingRuleName: planton-oss-e2e-gcpgfr-smoke-${E2E_RUN_ID} # per kind and engine, so lanes side by side never share it
  description: Ephemeral global forwarding rule created by the Planton E2E harness; safe to delete
  target:
    valueFrom:
      kind: GcpTargetHttpsProxy
      name: planton-oss-e2e-gcpthsp-prereq
      fieldPath: status.outputs.self_link
  ipAddress:
    valueFrom:
      kind: GcpGlobalAddress
      name: planton-oss-e2e-gcpgip-prereq
      fieldPath: status.outputs.address
  portRange: "443"
  loadBalancingScheme: EXTERNAL
  labels:
    managed-by: planton-e2e
    e2e-act: updated

  # Ephemeral test fixture: fully delete on destroy.
  deletionPolicy: DELETE
