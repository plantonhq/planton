# Minimal GcpGlobalForwardingRule scenario: the complete external HTTPS
# frontend — a reserved static IP (GcpGlobalAddress prerequisite) bound on
# port 443 to the GcpTargetHttpsProxy prerequisite, whose own registry chain
# installs the URL map, managed certificate, backend service, and health
# check below it. The deepest composed chain in the GCP harness; the VIP is
# ephemeral to the run and destroyed with everything else. project_id is
# omitted and rides the harness-exported GOOGLE_PROJECT.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGlobalForwardingRule
metadata:
  name: planton-oss-e2e-gcpgfr-smoke
  id: planton-oss-e2e-gcpgfr-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpglobalforwardingrule
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  description: Ephemeral global forwarding rule created by the Planton E2E harness; safe to delete
  target:
    valueFrom:
      kind: GcpTargetHttpsProxy
      name: planton-oss-e2e-gcpthsp-prereq
      fieldPath: status.outputs.self_link
  ipAddress:
    valueFrom:
      kind: GcpGlobalAddress
      name: planton-oss-e2e-gcpgip-prereq
      fieldPath: status.outputs.address
  portRange: "443"
  loadBalancingScheme: EXTERNAL
  labels:
    managed-by: planton-e2e

  # Ephemeral test fixture: fully delete on destroy.
  deletionPolicy: DELETE
