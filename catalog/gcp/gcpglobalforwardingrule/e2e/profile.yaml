apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpglobalforwardingrule
spec:
  # The deepest composed scenario in the GCP harness: the registry chain
  # installs health check -> backend service -> URL map -> managed
  # certificate -> target HTTPS proxy, plus a reserved global address; the
  # rule then binds the VIP on port 443. Verify asserts the VIP and target
  # wiring via compute globalForwardingRules.get; destroy tears the whole
  # chain down in reverse, on both provisioners.
  #
  # Awaiting re-proof: both modules now send load_balancing_scheme
  # EXTERNAL explicitly when the spec leaves it unset (the provider's own
  # default moved to EXTERNAL_MANAGED, and the scheme is immutable). The
  # earlier live proof predates that change; the next proof confirms the
  # classic frontend deploys and re-plans clean on both engines under the
  # apply-idempotency gate.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 30
