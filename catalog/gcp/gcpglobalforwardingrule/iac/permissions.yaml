# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpglobalforwardingrule
spec:
  gcp:
    groups:
      - purpose: EnableComputeApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling compute.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageForwardingRule
        permissions:
          - compute.globalForwardingRules.create
          - compute.globalForwardingRules.get
          - compute.globalForwardingRules.update
          - compute.globalForwardingRules.setTarget
          - compute.globalForwardingRules.setLabels
          - compute.globalForwardingRules.delete
        provenance: derived
        notes: "Covers google_compute_global_forwarding_rule across create, read/refresh, and destroy. The two mutable surfaces map to dedicated authorizations: repointing target is the setTarget RPC (the zero-downtime frontend swap), label changes are setLabels, and the backend-bucket migration fields patch through update. All six permissions exist in IAM's testable-permissions inventory (verified live)."
      - purpose: ManagePscEndpoint
        permissions:
          - compute.globalForwardingRules.pscCreate
          - compute.globalForwardingRules.pscUpdate
          - compute.globalForwardingRules.pscSetLabels
          - compute.globalForwardingRules.pscDelete
        provenance: derived
        notes: "IAM defines a parallel psc* permission set on global forwarding rules (verified live in the testable-permissions inventory) governing the Private Service Connect form -- the scheme-NONE rules the 03-psc-google-apis preset creates. Included so PSC frontends authorize; which of the two sets a given mutation actually exercises is for the live capture lane to prove."
      - purpose: UseReferencedFrontendResources
        permissions:
          - compute.targetHttpProxies.use
          - compute.targetHttpsProxies.use
          - compute.globalAddresses.use
          - compute.networks.use
          - compute.subnetworks.use
        provenance: derived
        notes: "Compute authorizes attaching the rule to what it references: use on the target HTTP or HTTPS proxy (whichever kind target resolves to), use on a reserved static address when ip_address references one, and use on the VPC network and subnetwork for the internal-facing and Private Service Connect schemes. All verified live; only the permissions matching the manifest's actual references are exercised."
