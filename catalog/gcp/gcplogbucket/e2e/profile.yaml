apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcplogbucket
spec:
  # Two live scenarios on the project scope: minimal (custom bucket,
  # retention 45, integer index) and views-analytics (enable_analytics +
  # a log view + a linked BigQuery dataset — the one-way analytics door
  # is armed on a run-scoped bucket that dies with the run). PROVEN live
  # 4/4 lanes (both scenarios x both engines), IDEMPOTENCY clean; the
  # linked dataset went ACTIVE and destroyed cleanly. Bucket IDs carry
  # ${E2E_RUN_ID}: the 7-day DELETE_REQUESTED soft delete is CONFIRMED
  # live (every destroyed bucket observed in that state via the API), so
  # a fixed name would collide with its own previous run. LIVE-CAUGHT
  # API truth landed on the spec/GUIDE/preset: log VIEW filters speak a
  # restricted grammar (log source / resource type / apphub / user
  # labels / LOG_ID only) — severity is NOT a legal view dimension.
  # Deploy -> buckets.get verify -> destroy -> verify gone (pending
  # deletion counts as gone for management), on both provisioners.
  # OFFLINE-PROVEN-ONLY arms (recorded): folder/organization/billing
  # scopes and scope_settings (org credentials — the GcpProject-grain
  # deferral), cmek (requires the one-time Logging-service-account KMS
  # grant), locked (one-way; a locked bucket blocks deletion until every
  # entry ages out), and the _Default adoption arm (adopt-only truths).
  # Unblock: org-credentialed lane for the scopes; the KMS grant
  # preflight for cmek.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
