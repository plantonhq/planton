# GcpSpannerDatabase install profile for consumers (the
# GcpSpannerBackupSchedule chain). A plain database on the instance
# prerequisite; deletionProtection false so chain teardown can run.
# metadata.name stays fixed for FK resolution.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSpannerDatabase
metadata:
  name: planton-oss-e2e-gcpspdb-prereq
  id: planton-oss-e2e-gcpspdb-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpspannerdatabase
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  instance:
    valueFrom:
      kind: GcpSpannerInstance
      name: planton-oss-e2e-gcpspn-prereq
      fieldPath: status.outputs.instance_name
  databaseName: e2e_prereq
  deletionProtection: false
