apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcptpuvm
spec:
  # Awaiting the live proof lane. The scenario proves in the harness
  # project with roles/tpu.admin and TPU v2 spot quota in us-central1-f
  # (a fresh project's TPU quota and the zone's spot stock are on the
  # watch list); the module enables tpu.googleapis.com itself and attaches
  # the TPU through google-beta under the recorded admission. Offline bar
  # met: both modules build and validate, offline plans for the reference
  # manifest, the scenario, and the accelerator-config, multi-NIC,
  # data-disk, and service-account arms are clean on the pinned providers,
  # and the accounting is total against the beta schema. Live facts the
  # proof lane confirms: (1) the spot v2-8 reaches READY and RE-PLANS CLEAN
  # on both engines (Pulumi serves the beta resource from its single
  # provider); (2) the verifier reads the attribution labels and a network
  # endpoint; (3) destroy deletes the TPU and the verifier reads 404.
  #
  # Not performed: stock (2026-11-21). Google refused a spot v2-8 with "Insufficient
  # capacity. Try again in a different zone or at a later time." in
  # us-central1-f and again in us-central1-b, on both engines -- a capacity
  # event, not a quota or module defect (quota read live: v2 spot 48 and
  # on-demand 16 per zone). The lane reached Google as its declared identity
  # on its own network, with actAs on the default compute account now in the
  # manifest. Re-run when a zone has v2-8 stock (us-central1-c and
  # europe-west4-a offer it).
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 30
