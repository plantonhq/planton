syntax = "proto3";

package dev.planton.gcp.gcptpuvm.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcptpuvm/v1alpha1/outputs.proto";
import "catalog/gcp/gcptpuvm/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-tpu-vm
message GcpTpuVm {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpTpuVm'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpTpuVmSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpTpuVmStatus status = 5;
}

//gcp-tpu-vm status
message GcpTpuVmStatus {
  //stack-outputs
  GcpTpuVmStackOutputs outputs = 1;
}
