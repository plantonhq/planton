syntax = "proto3";

package dev.planton.gcp.gcpmonitoringuptimecheck.v1alpha1;

// Outputs produced after provisioning a Cloud Monitoring uptime check.
message GcpMonitoringUptimeCheckOutputs {
  // The server-assigned resource name of the uptime check.
  // Format: projects/{project}/uptimeCheckConfigs/{uptime_check_id}
  string uptime_check_name = 1;

  // The bare check ID (the last segment of uptime_check_name) — the value
  // an alert policy's threshold filter references as
  // metric.label.check_id to page on this check's failures. THE
  // composition handle for check-plus-alert wiring.
  string uptime_check_id = 2;
}
