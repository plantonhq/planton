# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpmonitoringuptimecheck
spec:
  gcp:
    groups:
      - purpose: EnableMonitoringApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling monitoring.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageUptimeCheck
        permissions:
          - monitoring.uptimeCheckConfigs.create
          - monitoring.uptimeCheckConfigs.get
          - monitoring.uptimeCheckConfigs.update
          - monitoring.uptimeCheckConfigs.delete
        provenance: derived
        notes: "Covers google_monitoring_uptime_check_config for every check shape the spec expresses -- HTTP/HTTPS, TCP, resource-group targets, and synthetic monitors -- across create, read/refresh, in-place updates, and destroy. All four permissions exist in IAM's testable-permissions inventory (verified live). Mutations return synchronously; Cloud Monitoring defines no operations permission for uptime checks. A resource_group target references an existing Monitoring group by ID only, so no monitoring.groups.* permission is needed; a synthetic_monitor references an existing Cloud Function by name only, so no cloudfunctions.* permission is needed either."
