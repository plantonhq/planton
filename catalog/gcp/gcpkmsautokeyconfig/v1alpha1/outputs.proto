syntax = "proto3";

package dev.planton.gcp.gcpkmsautokeyconfig.v1alpha1;

// GcpKmsAutokeyConfigOutputs carries the configuration's identity.
message GcpKmsAutokeyConfigOutputs {
  // Full resource name: folders/{id}/autokeyConfig or
  // projects/{id}/autokeyConfig.
  string name = 1;

  // The scope Autokey is configured on: folders/{id} or projects/{id}.
  string parent = 2;
}
