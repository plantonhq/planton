apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpkmsautokeyconfig
spec:
  # Proven live on both engines (2026-11-19): the project's own Autokey
  # configuration storing keys in the resource's project, deployed and cleared
  # on destroy by an identity holding only this kind's permissions manifest,
  # with the re-plan clean. Create and every update are the same PATCH of the
  # project's one configuration, so there is no separate update act. The
  # folder arm and dedicated key projects stay offline-only.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
