# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpkmsautokeyconfig
spec:
  gcp:
    caller_project_services:
      - cloudkms.googleapis.com
    groups:
      - purpose: EnableCloudKmsApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
          - resourcemanager.projects.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_project_service enabling cloudkms.googleapis.com on a project configuration's project and on a folder configuration's key project. disable_on_destroy is false, so the disable permission is never needed. The provider reads the project with resourcemanager.projects.get before its services on every refresh, so a re-plan or destroy needs it (measured live). Proven 2026-11-19 -- an identity holding only this manifest deployed and destroyed the kind on both engines; it has no in-place update.
      - purpose: ManageAutokeyConfig
        permissions:
          - cloudkms.autokeyConfigs.get
          - cloudkms.autokeyConfigs.update
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_kms_autokey_config and google_kms_project_autokey_config (Pulumi kms.AutokeyConfig / kms.ProjectAutokeyConfig) -- create, update, and the DELETE destroy are all PATCHes of the scope's one configuration, read on every refresh. Held at the folder or the project (roles/cloudkms.autokeyAdmin there). The provider-default project lookup reads provider configuration only and needs no permission. Proven 2026-11-19 -- an identity holding only this manifest deployed and destroyed the kind on both engines; it has no in-place update.
      - purpose: ManageFolderAutokeyConfig
        permissions:
          - cloudkms.autokeyConfigs.get
          - cloudkms.autokeyConfigs.update
        provenance: derived
        reach: organization
        privilege: ordinary
        condition:
          spec_field_set: scope.folder_id
        notes: "The folder shape -- Autokey's main one: Google authorizes the folder's Autokey configuration on the folder (roles/cloudkms.autokeyAdmin there carries these). The folder configuration's calls bill to the caller's project, where cloudkms.googleapis.com must be on; the module enables the API on key_project, which serves the keys Autokey creates. The project group covers the project shape."
