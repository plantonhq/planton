syntax = "proto3";

package dev.planton.gcp.gcpserverlessvpcconnector.v1alpha1;

// GcpServerlessVpcConnectorOutputs captures values returned after
// provisioning.
message GcpServerlessVpcConnectorOutputs {
  // Short name of the connector as created in GCP.
  string name = 1;

  // Fully qualified resource name
  // (projects/{project}/locations/{region}/connectors/{name}) — the handle
  // serverless workloads (Cloud Functions, Cloud Run, App Engine) set as
  // their VPC connector.
  string self_link = 2;

  // State of the connector (READY, CREATING, DELETING, ERROR, UPDATING).
  string state = 3;

  // Region the connector lives in (plain region name).
  string region = 4;
}
