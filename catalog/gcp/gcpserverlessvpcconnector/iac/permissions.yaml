# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpserverlessvpcconnector
spec:
  gcp:
    groups:
      - purpose: EnableVpcAccessApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling vpcaccess.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageConnector
        permissions:
          - vpcaccess.connectors.create
          - vpcaccess.connectors.get
          - vpcaccess.connectors.update
          - vpcaccess.connectors.delete
          - vpcaccess.operations.get
        provenance: derived
        notes: Covers google_vpc_access_connector across its lifecycle -- create, in-place machine_type and instance-count growth (update), and delete -- plus polling the long-running operation every mutation returns. The consuming serverless services authorize their own attachment separately; GCP defines no vpcaccess.connectors.use permission (verified against IAM's testable-permissions inventory).
