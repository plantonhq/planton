# Subnet-placement GcpServerlessVpcConnector scenario: the connector
# occupies an existing dedicated /28 subnetwork (the Shared-VPC-capable
# mode), exercising the second placement arm. The subnetwork comes from the
# consumer-scoped prerequisite profile (e2e/prerequisites/gcpsubnetwork.yaml).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpServerlessVpcConnector
metadata:
  name: planton-oss-e2e-gcpvpcconn-subnet
  id: planton-oss-e2e-gcpvpcconn-subnet
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpserverlessvpcconnector
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  # us-east1 deliberately: the connector fleet's shared-core zonal pools in
  # us-central1 stock out recurrently (ZONE_RESOURCE_POOL_EXHAUSTED, observed
  # live 2026-08-11 for both supported machine classes); this chain is
  # self-contained, so its region tracks capacity reliability.
  region: us-east1
  connectorName: e2e-conns-${E2E_RUN_ID}
  subnet:
    name:
      valueFrom:
        kind: GcpSubnetwork
        name: planton-oss-e2e-gcpsnw-vpcconn-prereq
        fieldPath: status.outputs.subnetwork_name
  machineType: e2-micro
  minInstances: 2
  maxInstances: 3
  # Explicit DELETE keeps the destroy real and proves the no-op-diff
  # behavior of the new arm.
  deletionPolicy: DELETE
