# GcpServerlessVpcConnector install profile used when the connector is an
# E2E PREREQUISITE for another component (e.g. a Cloud Function routing
# egress through it). Network placement on a /28 (10.8.2.0/28) that no
# other E2E range uses. metadata.name stays fixed — prerequisite FK
# resolution keys off it — while the cloud-side connector name carries
# ${E2E_RUN_ID}.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpServerlessVpcConnector
metadata:
  name: planton-oss-e2e-gcpvpcconn-prereq
  id: planton-oss-e2e-gcpvpcconn-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpserverlessvpcconnector
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-central1
  connectorName: e2e-connp-${E2E_RUN_ID}
  network:
    valueFrom:
      kind: GcpVpcNetwork
      name: planton-oss-e2e-gcpvpcnetwork-prereq
      fieldPath: status.outputs.network_name
  ipCidrRange: 10.8.2.0/28
  machineType: e2-micro
  minInstances: 2
  maxInstances: 3
