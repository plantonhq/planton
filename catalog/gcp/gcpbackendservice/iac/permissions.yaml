# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpbackendservice
spec:
  gcp:
    groups:
      - purpose: EnableComputeApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
          - resourcemanager.projects.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_project_service enabling compute.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed. The provider reads the project with resourcemanager.projects.get before its services on every refresh, so a re-plan or destroy needs it (measured live). Proven 2026-11-19 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
      - purpose: ManageBackendService
        permissions:
          - compute.backendServices.create
          - compute.backendServices.get
          - compute.backendServices.update
          - compute.backendServices.delete
          - compute.globalOperations.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_compute_backend_service -- create, read/refresh, in-place updates (backends, health check, affinity, CDN, IAP, logging, headers are all mutable; name and project changes replace), and destroy. Global backend services return global operations the provider polls. service_lb_policy attaches a Network Services ServiceLbPolicy by URL through this same compute mutation -- Google's networkservices role reference defines no serviceLbPolicies.use permission (only create/get/list/update/delete, verified live), so no extra grant is listed here; reading the referenced policy in its own project requires networkservices.serviceLbPolicies.get there. Proven 2026-11-19 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
      - purpose: ManageRegionalBackendService
        permissions:
          - compute.regionBackendServices.create
          - compute.regionBackendServices.get
          - compute.regionBackendServices.update
          - compute.regionBackendServices.delete
          - compute.regionBackendServices.setSecurityPolicy
          - compute.regionOperations.get
          - compute.regionHealthChecks.useReadOnly
          - compute.regionSecurityPolicies.use
        provenance: proven
        reach: target
        privilege: ordinary
        condition:
          spec_field_set: region
        notes: Covers google_compute_region_backend_service, built instead of the global service when region is set. Regional services authorize against their own compute.regionBackendServices family and return region operations the provider polls; a referenced regional health check authorizes with compute.regionHealthChecks.useReadOnly and a regional Cloud Armor policy with compute.regionSecurityPolicies.use (listed with the regional family because a condition names one field; each is exercised only when the service references one). Signed-URL keys exist on the global service alone. Proven 2026-11-19 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
      - purpose: UsePassthroughNetwork
        permissions:
          - compute.networks.use
        provenance: proven
        reach: target
        privilege: ordinary
        condition:
          spec_field_set: network
        notes: The VPC network a regional passthrough Network Load Balancer's backend service names authorizes with compute.networks.use on that network. Proven 2026-11-19 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
      - purpose: UseReferencedHealthCheck
        permissions:
          - compute.healthChecks.useReadOnly
        provenance: proven
        reach: target
        privilege: ordinary
        condition:
          spec_field_set: health_check
        notes: A service-side check, not a module API call -- attaching a health check authorizes with compute.healthChecks.useReadOnly on the referenced check. Grant it on the project that owns the check, which differs from the backend service's project in cross-project setups. Proven 2026-11-19 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
      - purpose: UseReferencedBackendGroups
        permissions:
          - compute.instanceGroups.use
          - compute.networkEndpointGroups.use
          - compute.regionNetworkEndpointGroups.use
        provenance: proven
        reach: target
        privilege: ordinary
        condition:
          spec_field_set: backends
        notes: Service-side checks, not module API calls -- each backend group authorizes with compute.instanceGroups.use or compute.networkEndpointGroups.use on the referenced group. Grant the one(s) matching what the backends actually reference, on the projects that own those groups (which differ from the backend service's project in cross-project setups). A regional network endpoint group backend is checked as compute.regionNetworkEndpointGroups.use (measured live -- refused without it on both engines). Proven 2026-11-19 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
      - purpose: ManageSignedUrlKeys
        permissions:
          - compute.backendServices.addSignedUrlKey
          - compute.backendServices.deleteSignedUrlKey
        provenance: derived
        reach: target
        privilege: ordinary
        condition:
          spec_field_set: signed_url_keys
        notes: Covers google_compute_backend_service_signed_url_key. Keys are immutable in GCP (add/delete only), so rotation and key-value changes exercise both permissions; the key material itself never leaves the request.
      - purpose: AttachSecurityPolicy
        permissions:
          - compute.backendServices.setSecurityPolicy
          - compute.securityPolicies.use
        provenance: derived
        reach: target
        privilege: ordinary
        condition:
          spec_field_set: security_policy
        notes: Attaching the Cloud Armor policy security_policy names authorizes on both sides -- setting the policy on the backend service and using the referenced security policy.
      - purpose: AttachEdgeSecurityPolicy
        permissions:
          - compute.backendServices.setSecurityPolicy
          - compute.securityPolicies.use
        provenance: derived
        reach: target
        privilege: ordinary
        condition:
          spec_field_set: edge_security_policy
        notes: Attaching the Cloud Armor edge policy edge_security_policy names authorizes on both sides -- setting the policy on the backend service and using the referenced security policy.
      - purpose: ApplyResourceManagerTags
        permissions:
          - compute.backendServices.createTagBinding
          - resourcemanager.tagValueBindings.create
        provenance: derived
        reach: target
        privilege: ordinary
        condition:
          spec_field_set: resource_manager_tags
        notes: Attaching a tag at create time authorizes on both sides, the binding on the backend service and the use of each named tag value (tag values are org-level resources, so the tagValueBindings grant lives there). The module sends tags only through the create-only params block; tag changes replace the backend service, re-running these checks.
