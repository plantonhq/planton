# GcpBackendService install profile used when the backend service is an E2E
# PREREQUISITE for another component (e.g. a URL map's default_service). A
# health-checked backend service with no backends[] is a valid creation order
# and needs only the GcpHealthCheck prerequisite from the registry.
# project_id is omitted and rides the harness-exported GOOGLE_PROJECT.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpBackendService
metadata:
  name: planton-oss-e2e-gcpbs-prereq
  id: planton-oss-e2e-gcpbs-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpbackendservice
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  description: Ephemeral backend service created by the Planton E2E harness as a prerequisite; safe to delete
  protocol: HTTP
  loadBalancingScheme: EXTERNAL
  healthCheck:
    valueFrom:
      kind: GcpHealthCheck
      name: planton-oss-e2e-gcphc-prereq
      fieldPath: status.outputs.self_link
