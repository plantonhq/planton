apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpbackendservice
spec:
  # Proven live on both engines (2026-11-19): a classic global service with
  # CDN and logging, a managed one over a serverless NEG logging request and
  # response headers, a regional managed one, and an internal passthrough
  # service, each deployed, updated in place and destroyed by an identity
  # holding only this kind's permissions manifest, with the re-plan clean (the
  # unset scheme is sent as EXTERNAL). Google refuses log header lists on the
  # classic EXTERNAL scheme, and the spec walls it.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
