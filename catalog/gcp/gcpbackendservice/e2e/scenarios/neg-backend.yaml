# Composed GcpBackendService scenario proving a live backend: a serverless NEG
# in backends[].group, and NO health check (serverless platforms manage their
# own health — the optional-health-check contract exercised live). The NEG is a
# value_from reference to the GcpRegionNetworkEndpointGroup prerequisite
# (declared via prerequisites in the kind registry); the harness deploys the
# NEG first and resolves backends[0].group before the backend service applies.
# project_id is omitted and rides the harness-exported GOOGLE_PROJECT.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpBackendService
metadata:
  name: planton-oss-e2e-gcpbs-neg
  id: planton-oss-e2e-gcpbs-neg
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpbackendservice
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  description: Ephemeral backend service with a live serverless NEG backend; safe to delete
  protocol: HTTP
  loadBalancingScheme: EXTERNAL_MANAGED
  backends:
    - group:
        valueFrom:
          kind: GcpRegionNetworkEndpointGroup
          name: planton-oss-e2e-gcprneg-prereq
          fieldPath: status.outputs.self_link
      # Serverless NEG backends must omit balancing_mode and capacity dials —
      # GCP rejects RATE/UTILIZATION/CONNECTION for serverless NEGs.

  # Ephemeral test fixture: fully delete on destroy.
  deletionPolicy: DELETE
