  };

  option (buf.validate.message).cel = {
    id: "tls_settings_protocol"
    message: "tls_settings only applies when protocol is SSL, HTTPS, or HTTP2 — the load balancer must speak TLS to the backends"
    expression: "!has(this.tls_settings) || this.protocol in ['SSL', 'HTTPS', 'HTTP2']"
  };

  option (buf.validate.message).cel = {
    id: "custom_metrics_locality_policy"
    message: "top-level custom_metrics only apply with locality_lb_policy WEIGHTED_ROUND_ROBIN"
    expression: "size(this.custom_metrics) == 0 || this.locality_lb_policy == 'WEIGHTED_ROUND_ROBIN'"
  };

  option (buf.validate.message).cel = {
    id: "migration_percentage_requires_state"
    message: "external_managed_migration_testing_percentage only applies with external_managed_migration_state TEST_BY_PERCENTAGE"
    expression: "this.external_managed_migration_testing_percentage == 0.0 || this.external_managed_migration_state == 'TEST_BY_PERCENTAGE'"
  };

  option (buf.validate.message).cel = {
    id: "migration_requires_external_scheme"
    message: "external_managed_migration_state drives the EXTERNAL → EXTERNAL_MANAGED canary and only applies while load_balancing_scheme is EXTERNAL (or unset, which defaults to EXTERNAL)"
    expression: "this.external_managed_migration_state == '' || (!has(this.load_balancing_scheme) || this.load_balancing_scheme in ['', 'EXTERNAL'])"
  };

  option (buf.validate.message).cel = {
    id: "backend_preference_not_external"
    message: "backend preference cannot be set when load_balancing_scheme is EXTERNAL (the default) — use EXTERNAL_MANAGED or an internal scheme"
