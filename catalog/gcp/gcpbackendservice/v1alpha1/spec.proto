    expression: "this.region != '' || (!has(this.network) && !has(this.failover_policy) && !has(this.connection_tracking_policy) && !has(this.ha_policy) && !has(this.network_pass_through_lb_traffic_policy) && !this.backends.exists(b, b.failover))"
