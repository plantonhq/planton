    expression: "this.region == '' || (this.compression_mode == '' && size(this.custom_request_headers) == 0 && size(this.custom_response_headers) == 0 && !has(this.edge_security_policy) && this.service_lb_policy == '' && size(this.signed_url_keys) == 0)"
  };

  option (buf.validate.message).cel = {
    id: "traffic_director_levers_global_only"
    message: "locality_lb_policies, max_stream_duration, and security_settings are Traffic Director / cross-region levers that exist only on a global backend service — clear region or remove them"
    expression: "this.region == '' || (size(this.locality_lb_policies) == 0 && !has(this.max_stream_duration) && !has(this.security_settings))"
