syntax = "proto3";

package dev.planton.gcp.gcpserviceconnectionpolicy.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpserviceconnectionpolicy/v1alpha1/outputs.proto";
import "catalog/gcp/gcpserviceconnectionpolicy/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-service-connection-policy
message GcpServiceConnectionPolicy {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpServiceConnectionPolicy'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpServiceConnectionPolicySpec spec = 4 [(buf.validate.field).required = true];
  GcpServiceConnectionPolicyStatus status = 5;
}

message GcpServiceConnectionPolicyStatus {
  GcpServiceConnectionPolicyOutputs outputs = 1;
}
