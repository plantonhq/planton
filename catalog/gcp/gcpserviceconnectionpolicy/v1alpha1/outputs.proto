syntax = "proto3";

package dev.planton.gcp.gcpserviceconnectionpolicy.v1alpha1;

// Outputs produced after provisioning a GCP service connection policy.
message GcpServiceConnectionPolicyOutputs {
  // Fully qualified policy resource path
  // (projects/{project}/locations/{location}/serviceConnectionPolicies/{name}).
  // The canonical identifier for API calls and audit tooling.
  string policy_id = 1;

  // Short name of the policy — what an operator sees in the console's
  // service connection policy list for the network.
  string name = 2;

  // The type of underlying resources the automation creates for this
  // policy (PSC for Private Service Connect). Confirms the connectivity
  // mechanism without inspecting individual connections.
  string infrastructure = 3;

  // Server-computed etag. Changes on every policy mutation — useful for
  // change detection when auditing shared networks.
  string etag = 4;
}
