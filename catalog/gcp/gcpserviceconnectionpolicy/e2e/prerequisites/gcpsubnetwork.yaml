# Consumer-scoped GcpSubnetwork install profile for the service connection
# policy chain: the address space PSC endpoints are drawn from. A regular
# /24 — service connection policies need no special subnet purpose.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSubnetwork
metadata:
  name: planton-oss-e2e-gcpsnw-scp-prereq
  id: planton-oss-e2e-gcpsnw-scp-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpsubnetwork
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  vpcSelfLink:
    valueFrom:
      kind: GcpVpcNetwork
      name: planton-oss-e2e-gcpvpcnetwork-prereq
      fieldPath: status.outputs.network_self_link
  subnetworkName: e2e-scp-subnet-${E2E_RUN_ID}
  region: us-central1
  ipCidrRange: 10.9.0.0/24
  description: Ephemeral /24 for the GcpServiceConnectionPolicy E2E chain; safe to delete
