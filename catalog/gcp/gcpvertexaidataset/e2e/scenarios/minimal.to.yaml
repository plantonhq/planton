# The second act of minimal.yaml: the same image dataset under a new display
# name -- a datasets.patch with the displayName mask that changes it in place
# (its location and schema recreate it). Not a scenario of its own (the
# second-act annotation keeps discovery from running it as a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVertexAiDataset
metadata:
  name: planton-oss-e2e-gcpvds-minimal
  id: planton-oss-e2e-gcpvds-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpvertexaidataset
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-second-act: minimal.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
  tags:
    - planton-e2e
spec:
  location: us-central1
  displayName: planton-oss-e2e-vds-renamed-${E2E_RUN_ID} # Google assigns the id; the run id names this lane's copy, so lanes side by side and the sweep tell them apart
  metadataSchemaUri: gs://google-cloud-aiplatform/schema/dataset/metadata/image_1.0.0.yaml
