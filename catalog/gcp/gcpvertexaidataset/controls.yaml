# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpvertexaidataset
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Vertex AI encrypts every dataset and its imported items at rest with Google-managed keys without configuration.
    - control_id: enc-at-rest-cmk
      status: configurable
      field_path: kms_key_name
      evidence:
        type: spec_default
        reference: Unset means Google-managed encryption; a Cloud KMS key (a GcpKmsKey reference or a literal path) in the dataset's region encrypts it and everything imported into it under the customer-managed key. Both modules emit the block only when set. Fixed at creation.
      notes: The 02-encrypted-tabular preset sets it.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every Vertex AI API call is TLS over Google's regional endpoint; there is no plaintext path.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A dataset has no address of its own; it is reached only through the Vertex AI API under IAM.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network listener exists to restrict; access is API-level and governed by IAM.
    - control_id: edge-protection
      status: not_applicable
      notes: No edge is served; the dataset is a data container behind the Vertex AI API.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Reading, importing into, or changing a dataset requires aiplatform.datasets.* permissions on the project.
    - control_id: workload-identity
      status: not_applicable
      notes: The dataset authenticates nothing; the jobs that read it run under their own identities.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths exist to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component enforces no end-user sign-in; access is administrative, whose posture rbac carries.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every dataset create, import, and delete is a Vertex AI admin write recorded in Cloud Audit Logs (Admin Activity) unconditionally.
    - control_id: monitoring-integration
      status: not_applicable
      notes: A dataset has no runtime to monitor; the jobs that read it emit their own metrics.
    - control_id: backup-recovery
      status: not_applicable
      notes: Vertex AI keeps no backups of a dataset; the source data in Cloud Storage or BigQuery is the recovery path, and labeled datasets can be exported through the Vertex AI API. The GUIDE says so.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A dataset is a regional Google-managed resource stored across the region's zones; there is no zonal placement to choose.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Unset means DELETE -- the dataset and its imported items and annotations are deleted on destroy; PREVENT makes destroy fail; ABANDON leaves the dataset when the block leaves management.
      notes: The 02-encrypted-tabular preset sets PREVENT.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The dataset service is fully Google-operated; there is no software surface the customer patches.
