syntax = "proto3";

package dev.planton.gcp.gcpvertexaidataset.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpvertexaidataset/v1alpha1/outputs.proto";
import "catalog/gcp/gcpvertexaidataset/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-vertex-ai-dataset
message GcpVertexAiDataset {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpVertexAiDataset'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpVertexAiDatasetSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpVertexAiDatasetStatus status = 5;
}

//gcp-vertex-ai-dataset status
message GcpVertexAiDatasetStatus {
  //stack-outputs
  GcpVertexAiDatasetStackOutputs outputs = 1;
}
