# The data store the webhooks-and-tools scenario's data store tool searches:
# an empty unstructured store in the global location, enrolled in the chat
# solution Dialogflow agents use. Its name output is what the tool's
# data_store references. The store id carries the run id (Google reserves a
# deleted store's id for a while); metadata.name stays fixed.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVertexAiSearchDataStore
metadata:
  name: planton-oss-e2e-gcpdfcx-store
  id: planton-oss-e2e-gcpdfcx-store
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpdialogflowcxagent
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  location: global
  dataStoreId: planton-oss-e2e-dfcx-store-${E2E_RUN_ID}
  displayName: Planton OSS E2E agent store
  industryVertical: GENERIC
  contentConfig: CONTENT_REQUIRED
  solutionTypes:
    - SOLUTION_TYPE_CHAT
