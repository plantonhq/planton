# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpmonitoringnotificationchannel
spec:
  gcp:
    groups:
      - purpose: EnableMonitoringApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling monitoring.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageNotificationChannel
        permissions:
          - monitoring.notificationChannels.create
          - monitoring.notificationChannels.get
          - monitoring.notificationChannels.update
          - monitoring.notificationChannels.delete
        provenance: derived
        notes: Covers google_monitoring_notification_channel -- create, read/refresh (GCP redacts sensitive_labels on read), in-place updates, and destroy (force_delete rides the same delete authorization). All four verified present in IAM's testable-permissions inventory. The channel-verification permissions (getVerificationCode, sendVerificationCode, verify) exist in the inventory but the modules never call those APIs, so they are deliberately not requested.
