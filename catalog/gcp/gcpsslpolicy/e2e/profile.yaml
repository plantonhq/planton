apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpsslpolicy
spec:
  # Leaf scenarios: SSL policies are free, create in seconds, and have no
  # dependencies. Two scenarios cover the kind's two module branches — a
  # global policy (empty region) and a regional one — the same dual-scope
  # pattern the health check uses. deploy -> compute sslPolicies get verify
  # -> destroy -> verify gone, on both provisioners.
  tier: 1
  # Proven live 2026-08-11 (both engines, both scenarios, idempotency gate):
  # post_quantum_key_exchange ENABLED verified in the stored global policy.
  # The pairing arms were ALSO proven live via throwaway applies verified in
  # the stored API objects: FIPS_202205 + TLS_1_2 + DEFERRED (global) and
  # TLS_1_3 + RESTRICTED (regional).
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 10
