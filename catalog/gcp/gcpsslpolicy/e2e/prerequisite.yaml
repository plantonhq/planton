# GcpSslPolicy install profile used when the policy is an E2E PREREQUISITE
# for another component (e.g. a target HTTPS proxy's ssl_policy ref). A
# global MODERN/TLS 1.2 policy — attachable by any global proxy scenario.
# project_id is omitted and rides the harness-exported GOOGLE_PROJECT.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSslPolicy
metadata:
  name: planton-oss-e2e-gcpsslpol-prereq
  id: planton-oss-e2e-gcpsslpol-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpsslpolicy
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  description: Ephemeral SSL policy created by the Planton E2E harness as a prerequisite; safe to delete
  profile: MODERN
  minTlsVersion: TLS_1_2
