# Global GcpSslPolicy scenario: a MODERN profile with a TLS 1.2 floor — the
# hardening posture most production frontends want. project_id is
# deliberately omitted: the module falls back to the provider's default
# project, which the E2E harness exports as GOOGLE_PROJECT from the resolved
# test project. SSL policy names are project-scoped and hard-deleted, so a
# fixed name is safe across runs.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSslPolicy
metadata:
  name: planton-oss-e2e-gcpsslpol-smoke
  id: planton-oss-e2e-gcpsslpol-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpsslpolicy
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  description: Ephemeral SSL policy created by the Planton E2E harness; safe to delete
  profile: MODERN
  minTlsVersion: TLS_1_2
  # Opt in to post-quantum key exchange now (profile-independent) — the
  # first live arm for this dial.
  postQuantumKeyExchange: ENABLED
  # Explicit DELETE (the provider default) proves the deletion_policy
  # round-trip: create accepts it and re-plans stay diff-free.
  deletionPolicy: DELETE
