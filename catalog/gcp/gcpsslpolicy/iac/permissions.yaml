# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpsslpolicy
spec:
  gcp:
    groups:
      - purpose: EnableComputeApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling compute.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageGlobalSslPolicy
        permissions:
          - compute.sslPolicies.create
          - compute.sslPolicies.get
          - compute.sslPolicies.update
          - compute.sslPolicies.delete
          - compute.globalOperations.get
        provenance: derived
        notes: Covers google_compute_ssl_policy (created when spec.region is empty) -- create, read/refresh, in-place updates (profile, min_tls_version, custom_features, post_quantum_key_exchange are all mutable), destroy, and polling the global operation every mutation returns.
      - purpose: ManageRegionalSslPolicy
        permissions:
          - compute.regionSslPolicies.create
          - compute.regionSslPolicies.get
          - compute.regionSslPolicies.update
          - compute.regionSslPolicies.delete
          - compute.regionOperations.get
        provenance: derived
        notes: Covers google_compute_region_ssl_policy (created when spec.region is set). Regional policies authorize against their own compute.regionSslPolicies family (verified in the testable-permissions inventory), not the global one. Not needed for global policies.
