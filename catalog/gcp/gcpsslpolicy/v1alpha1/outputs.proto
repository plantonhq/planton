syntax = "proto3";

package dev.planton.gcp.gcpsslpolicy.v1alpha1;

// Outputs produced after provisioning a GCP Compute Engine SSL policy.
message GcpSslPolicyOutputs {
  // Self-link URI of the SSL policy. This is the value a target HTTPS (or
  // SSL) proxy references in its ssl_policy field — the composition handle
  // that hardens TLS at the load balancer.
  // Global: https://www.googleapis.com/compute/v1/projects/{project}/global/sslPolicies/{name}
  // Regional: https://www.googleapis.com/compute/v1/projects/{project}/regions/{region}/sslPolicies/{name}
  string self_link = 1;

  // Name of the SSL policy as it exists in GCP.
  string ssl_policy_name = 2;

  // The cipher suites the policy actually enables, as computed by GCP from
  // the profile (or copied from custom_features on CUSTOM) — the list a
  // compliance auditor asks for.
  repeated string enabled_features = 3;

  // Region of a regional SSL policy; empty for a global one. Downstream
  // composition can use this to confirm scope compatibility (regional
  // proxies require an SSL policy in their own region).
  string region = 4;
}
