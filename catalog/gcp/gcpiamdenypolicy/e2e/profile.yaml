apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpiamdenypolicy
spec:
  # Google grants roles/iam.denyAdmin only on an organization, even for a
  # project-attached deny policy. The lane runs as the declared identity,
  # which the harness grants it on the test organization
  # (PLANTON_E2E_GCP_ORGANIZATION_ID) holding the harness project; the second
  # act changes a rule's description in place. The offline bar (spec suite,
  # both engines' builds, offline plans) is the shipped evidence until then;
  # validated_provisioners stays empty until the live lanes actually run.
  tier: 2
  status: deferred
  deferred_reason: the live lane waits for a test organization exported as PLANTON_E2E_GCP_ORGANIZATION_ID, where the harness grants the declared identity roles/iam.denyAdmin; offline plans only until then
  validated_provisioners: []
  timeout_minutes: 15
