apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpiamdenypolicy
spec:
  # Proven live on both engines (2026-11-23, test organization
  # planton-e2e.com). Google grants roles/iam.denyAdmin only on an
  # organization, even for a project-attached deny policy, so the declared
  # identity holds it on the test organization; the policy attaches to the
  # harness project. The second act changes a rule's description, judged in
  # place from the PROJECT's Admin Activity log (UpdatePolicy), where Google
  # writes a deny policy's changes: the harness reads the attachment point
  # from the policy's url-encoded name. Google refuses a rule naming a
  # principal that does not exist, so the break-glass exception is the
  # harness project's Cloud Storage agent.
  tier: 2
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
