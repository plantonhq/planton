# Minimal GcpIamDenyPolicy scenario: one deny rule with a break-glass
# exception. parent is deliberately omitted — the module falls back to
# the provider's default project. Google grants roles/iam.denyAdmin only on
# an organization, even for a project-attached policy, so the declared
# identity holds it on the test organization (PLANTON_E2E_GCP_ORGANIZATION_ID),
# which holds the harness project.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpIamDenyPolicy
metadata:
  name: planton-oss-e2e-gcpiamdenypolicy-min
  id: planton-oss-e2e-gcpiamdenypolicy-min
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpiamdenypolicy
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-upgrade-manifest: minimal.to.yaml # the update: the rule's description
    planton.dev/e2e-required-env: PLANTON_E2E_GCP_ORGANIZATION_ID
  tags:
    - planton-e2e
spec:
  rules:
    - description: E2E fixture rule — denies secret-version access with a break-glass exception
      denyRule:
        deniedPrincipals:
          - principalSet://goog/public:all
        exceptionPrincipals:
          - principal://iam.googleapis.com/projects/-/serviceAccounts/planton-e2e-breakglass@example-project.iam.gserviceaccount.com
        deniedPermissions:
          - secretmanager.googleapis.com/versions.access
