# Minimal GcpIamDenyPolicy scenario: one deny rule with a break-glass
# exception. parent is deliberately omitted — the module falls back to
# the provider's default project. The profile is DEFERRED: creating deny
# policies requires org-level roles/iam.denyAdmin, which the standalone
# test project's credentials deliberately lack; this scenario is ready
# for the day an org-scoped credential exists.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpIamDenyPolicy
metadata:
  name: planton-oss-e2e-gcpiamdenypolicy-min
  id: planton-oss-e2e-gcpiamdenypolicy-min
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpiamdenypolicy
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  rules:
    - description: E2E fixture rule — denies secret-version access with a break-glass exception
      denyRule:
        deniedPrincipals:
          - principalSet://goog/public:all
        exceptionPrincipals:
          - principal://iam.googleapis.com/projects/-/serviceAccounts/planton-e2e-breakglass@example-project.iam.gserviceaccount.com
        deniedPermissions:
          - secretmanager.googleapis.com/versions.access
