# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpiamdenypolicy
spec:
  gcp:
    groups:
      - purpose: ManageDenyPolicy
        permissions:
          - iam.denypolicies.create
          - iam.denypolicies.get
          - iam.denypolicies.update
          - iam.denypolicies.delete
        provenance: derived
        notes: "Covers google_iam_deny_policy (Pulumi iam.DenyPolicy) -- the modules' only resource: create, read/refresh, in-place updates (display name and rules), and delete. The grant SCOPE is the unusual part: Google's deny-access guide directs the role carrying these permissions (roles/iam.denyAdmin, whose contents were verified live as exactly the iam.denypolicies family plus policy-analysis extras) to be granted ON THE ORGANIZATION even for policies attached to a single project -- project-level credentials cannot manage deny policies at all, which is why guardrails of this kind are typically owned by platform teams rather than project teams. The attach point named in spec.parent (project, folder, or organization) is a request parameter the modules URL-encode, not the authorization scope. The FQDN-formatted permission strings INSIDE spec.rules (e.g. secretmanager.googleapis.com/versions.access) are the policy's subject matter -- what it denies -- never something the deploying principal needs to hold. Neither module declares a google_project_service (deny policies ride the always-on IAM v2 surface), and the Terraform module's data.google_client_config (mirrored by the Pulumi module's client-config read, both gated to the empty-parent case) resolves the provider's default project from local configuration without an API call."
