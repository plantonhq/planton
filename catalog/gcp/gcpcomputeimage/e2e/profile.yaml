apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpcomputeimage
spec:
  # Proven live on both engines (2026-11-21), as an identity holding only this
  # kind's permissions manifest: an image of a disk fixture and a copy of a
  # named Debian 12 public image deployed, re-planned clean, and destroyed;
  # the disk image's labels changed in place (images.setLabels), judged from
  # Google's Admin Activity log. Two live findings shaped the spec: Google
  # records the image a family path resolved to, so a family source re-planned
  # a replacement on every apply (the spec now refuses it), and Google adds
  # the source's guest OS features to any list, so a partial list did the same
  # (the scenario takes the source's).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
