# GcpComputeImage scenario: an image of a disk fixture (the golden-image
# path), referenced through the disk's self_link, with explicit guest OS
# features. Cost: a 10 GB standard disk and the image's storage for the
# lane's duration (cents).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpComputeImage
metadata:
  name: planton-oss-e2e-gcpimg-disk-image
  id: planton-oss-e2e-gcpimg-disk-image
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcomputeimage
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "catalog/gcp/gcpcomputeimage/e2e/prerequisites/disk.yaml"
  tags:
    - planton-e2e
spec:
  imageName: planton-e2e-gcpimg-disk-${E2E_RUN_ID}
  description: Ephemeral image created by the Planton E2E harness; safe to delete
  sourceDisk:
    valueFrom:
      kind: GcpComputeDisk
      name: planton-oss-e2e-gcpimg-disk
      fieldPath: status.outputs.self_link
  guestOsFeatures:
    - UEFI_COMPATIBLE
    - GVNIC
