# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpcomputeimage
spec:
  gcp:
    groups:
      - purpose: EnableComputeApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
          - resourcemanager.projects.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_project_service enabling compute.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed. The provider reads the project with resourcemanager.projects.get before its services on every refresh, so a re-plan or destroy needs it (measured live). Proven 2026-11-21 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
      - purpose: ManageImage
        permissions:
          - compute.images.create
          - compute.images.get
          - compute.images.delete
          - compute.images.setLabels
          - compute.globalOperations.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_compute_image across its lifecycle -- create, label changes (the one in-place update), and delete -- plus polling the global operation every mutation returns. Proven 2026-11-21 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
      - purpose: ReadImageSources
        permissions:
          - compute.disks.useReadOnly
          - compute.images.useReadOnly
          - compute.snapshots.useReadOnly
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Each permission gates one source shape -- source_disk, source_image, and source_snapshot; a raw_disk tarball is read through Cloud Storage permissions on its object, not a compute permission. Proven 2026-11-21 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
