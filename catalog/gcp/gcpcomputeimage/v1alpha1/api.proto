syntax = "proto3";

package dev.planton.gcp.gcpcomputeimage.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpcomputeimage/v1alpha1/outputs.proto";
import "catalog/gcp/gcpcomputeimage/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-compute-image
message GcpComputeImage {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpComputeImage'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpComputeImageSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpComputeImageStatus status = 5;
}

//gcp-compute-image status
message GcpComputeImageStatus {
  //stack-outputs
  GcpComputeImageStackOutputs outputs = 1;
}
