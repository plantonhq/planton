syntax = "proto3";

package dev.planton.gcp.gcpcomputeimage.v1alpha1;

// GcpComputeImageOutputs captures the image's identity.
message GcpComputeImageOutputs {
  // Name of the image in GCP.
  string name = 1;

  // Self-link URL of the image -- what a disk's image, an instance's boot
  // disk image, or another image's source_image consumes.
  string self_link = 2;

  // The image's family, or empty when it has none. Consumers that should
  // always boot the newest build use
  // "projects/{project}/global/images/family/{family}".
  string family = 3;

  // The image's size in GB.
  int32 disk_size_gb = 4;

  // The image's resource ID: projects/{project}/global/images/{name} --
  // the relative form, without self_link's
  // https://www.googleapis.com/compute/v1/ prefix. Consume self_link where
  // a field takes an image URL (a disk's image, an instance's boot disk,
  // a managed instance group's source_image, another image's
  // source_image); consume image_id where Google documents the relative
  // form only, such as a GKE node pool's secondary boot disk image.
  string image_id = 5;
}
