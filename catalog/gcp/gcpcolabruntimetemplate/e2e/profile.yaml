apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpcolabruntimetemplate
spec:
  # Proven live on both engines (2026-11-21), as an identity holding only this
  # kind's permissions manifest: a run-scoped e2-standard-4 template with
  # internet access on its own network and subnetwork deployed, re-planned
  # clean, and destroyed; its display name changed in place
  # (UpdateNotebookRuntimeTemplate), judged from Google's Admin Activity log.
  # Two live findings shaped the spec: a template that sends no network spec
  # has no internet access and Google refuses it without both a network and a
  # subnetwork, so the block is required; and with no network named Google
  # uses the project's network called default, which this project lacks.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
