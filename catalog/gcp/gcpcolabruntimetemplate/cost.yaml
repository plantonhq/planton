# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/componentcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostProfile
metadata:
  name: gcpcolabruntimetemplate
spec:
  billing_model: free
  free_tier: A runtime template carries no meter of its own (per cloud.google.com/colab/pricing, read 2026-09-23) -- publishing and keeping it cost nothing.
  notes: "The template decides what every runtime created from it costs: machine_spec (machine type and GPUs) sets the hourly compute rate, data_persistent_disk_spec the disk rate, and idle_timeout how long a forgotten runtime keeps billing. Those charges bill under the runtimes (GcpColabRuntime and scheduled notebook runs), not the template."
