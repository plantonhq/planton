# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpcolabruntimetemplate
spec:
  gcp:
    groups:
      - purpose: EnableAiplatformApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling aiplatform.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageRuntimeTemplate
        permissions:
          - aiplatform.notebookRuntimeTemplates.create
          - aiplatform.notebookRuntimeTemplates.get
          - aiplatform.notebookRuntimeTemplates.update
          - aiplatform.notebookRuntimeTemplates.delete
        provenance: derived
        notes: Covers google_colab_runtime_template (Pulumi colab.RuntimeTemplate) -- created and deleted through long-running operations the provider polls, patched for the display name, the key, and the software config. roles/aiplatform.admin contains all of them. GCP defines no aiplatform.operations.get permission (IAM's testable-permissions inventory carries only aiplatform.operations.list); polling the long-running operations needs nothing beyond these.
      - purpose: UsePrivateNetwork
        permissions:
          - compute.subnetworks.use
        provenance: derived
        condition:
          spec_field_set: network_spec
        notes: Placing runtimes on a declared network and subnetwork requires using the subnetwork; the default network needs no grant.
