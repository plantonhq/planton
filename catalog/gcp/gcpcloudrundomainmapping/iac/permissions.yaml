# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpcloudrundomainmapping
spec:
  gcp:
    groups:
      - purpose: DeployDomainMapping
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: "The two permissions listed cover google_project_service enabling run.googleapis.com (disable_on_destroy is false, so the disable permission is never needed) -- and they are the module's ONLY operations that GCP's published permission inventory can authorize. The mapping resource itself (google_cloud_run_domain_mapping: create, the status polling reads that follow it, and delete) is enforced against run.domainmappings.create, run.domainmappings.get, and run.domainmappings.delete -- permissions GCP genuinely checks (a live create without them fails 403 naming run.domainmappings.create verbatim) yet publishes NOWHERE: the testable-permissions inventory's run.* family covers services, jobs, revisions, routes, configurations, and executions with no domainmappings entries, and no predefined role carries them -- Google's Cloud Run IAM documentation states that Cloud Run roles apply only to Cloud Run resources, not to domain mappings, and that the Project Editor role is needed to create or update them. The names are grantable to a custom role only through gcloud (iam roles update --add-permissions), not the console. The deploying principal therefore needs, beyond the permissions listed here, either Project Editor (or Owner) or such a gcloud-amended custom role. This is the inverse of the GKE node-pool case: there the expected permission family does not exist and a published permission (container.clusters.update) authorizes instead; here the enforced family exists in the authorization system but is excluded from publication, so no listable permission can stand in for it. Separately, the create requires the provisioning identity to have VERIFIED the domain (Search Console / gcloud domains verify) -- a domain-ownership gate outside IAM entirely. The module's data.google_client_config makes no API call."
