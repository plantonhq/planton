syntax = "proto3";

package dev.planton.gcp.gcpcloudrundomainmapping.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpcloudrundomainmapping/v1alpha1/outputs.proto";
import "catalog/gcp/gcpcloudrundomainmapping/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-cloud-run-domain-mapping
message GcpCloudRunDomainMapping {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpCloudRunDomainMapping'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpCloudRunDomainMappingSpec spec = 4 [(buf.validate.field).required = true];
  GcpCloudRunDomainMappingStatus status = 5;
}

message GcpCloudRunDomainMappingStatus {
  GcpCloudRunDomainMappingOutputs outputs = 1;
}
