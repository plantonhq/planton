# The second act of notebook-gcs.yaml: the same paused schedule on a new
# cron, a patch in place. Not a scenario of its own.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpColabSchedule
metadata:
  name: planton-oss-e2e-gcpcols-notebook
  id: planton-oss-e2e-gcpcols-notebook
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcolabschedule
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-second-act: notebook-gcs.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-prerequisites: "catalog/gcp/gcpcolabschedule/e2e/prerequisites/gcpvpcnetwork-gcpcols.yaml,catalog/gcp/gcpcolabschedule/e2e/prerequisites/gcpsubnetwork-gcpcols.yaml,catalog/gcp/gcpcolabschedule/e2e/prerequisites/gcpcolabruntimetemplate-schedule.yaml,catalog/gcp/gcpcolabschedule/e2e/prerequisites/gcpgcsbucket-schedule.yaml,catalog/gcp/gcpcolabschedule/e2e/prerequisites/gcpserviceaccount-schedule.yaml"
  tags:
    - planton-e2e
spec:
  location: us-central1
  displayName: e2e-cols-${E2E_RUN_ID} # per kind and engine, so lanes side by side never share it
  cron: "0 7 * * *"
  maxConcurrentRunCount: 1
  maxRunCount: 10
  desiredState: PAUSED
  notebookExecutionJob:
    gcsNotebookSource:
      uri: gs://pln-e2e-cols-${E2E_RUN_ID}/report.ipynb
    notebookRuntimeTemplateResourceName:
      valueFrom:
        kind: GcpColabRuntimeTemplate
        name: planton-oss-e2e-gcpcols-template
        fieldPath: status.outputs.name
    gcsOutputUri:
      valueFrom:
        kind: GcpGcsBucket
        name: planton-oss-e2e-gcpcols-bucket
        fieldPath: status.outputs.url
    serviceAccount:
      valueFrom:
        kind: GcpServiceAccount
        name: planton-oss-e2e-gcpcols-sa
        fieldPath: status.outputs.email
    executionTimeout: 1800s
  deletionPolicy: DELETE
