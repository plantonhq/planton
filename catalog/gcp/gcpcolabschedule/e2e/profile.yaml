apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpcolabschedule
spec:
  # Proven live on both engines (2026-11-21), as an identity holding only this
  # kind's permissions manifest: a paused daily notebook schedule over a
  # runtime template, a Cloud Storage bucket and a run service account
  # (fixtures) deployed, read back PAUSED, re-planned clean, and destroyed;
  # its cron changed in place (ScheduleService.UpdateSchedule), judged from
  # Google's Admin Activity log. Google accepted a notebook object that does
  # not exist yet. Creating a schedule needs the permission to create the runs
  # it launches -- Google refused a notebook schedule without
  # aiplatform.pipelineJobs.create. The pipeline arm's groups stay derived: no
  # scenario sets it.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
