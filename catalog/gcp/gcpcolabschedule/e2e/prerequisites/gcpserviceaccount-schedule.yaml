# The identity the schedule's notebook runs would execute as.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpServiceAccount
metadata:
  name: planton-oss-e2e-gcpcols-sa
  id: planton-oss-e2e-gcpcols-sa
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpcolabschedule
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  serviceAccountId: e2e-cols-sa-${E2E_RUN_ID}
  displayName: Planton OSS E2E Colab schedule identity
  description: Ephemeral notebook-run identity deployed as an E2E fixture; safe to delete
