# Consumer-scoped GcpSubnetwork install profile for the gcpcolabschedule chain: the
# runtimes' subnetwork in the template's region, with Private Google Access.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSubnetwork
metadata:
  name: planton-oss-e2e-gcpcols-subnet
  id: planton-oss-e2e-gcpcols-subnet
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpsubnetwork
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  vpcSelfLink:
    valueFrom:
      kind: GcpVpcNetwork
      name: planton-oss-e2e-gcpcols-vpc
      fieldPath: status.outputs.network_self_link
  subnetworkName: e2e-gcpcols-subnet-${E2E_RUN_ID}
  region: us-central1
  ipCidrRange: 10.9.44.0/24
  privateIpGoogleAccess: true
  description: Ephemeral subnetwork for the gcpcolabschedule E2E chain; safe to delete
