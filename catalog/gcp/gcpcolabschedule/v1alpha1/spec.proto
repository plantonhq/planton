syntax = "proto3";

package dev.planton.gcp.gcpcolabschedule.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";

// GcpColabScheduleSpec defines a Vertex AI schedule
// (`google_colab_schedule`) -- a cron that launches a run on a timer. It
// launches one of two things, set by exactly one arm:
//
//   notebook_execution_job  a Colab Enterprise notebook run: a notebook
//                           from Cloud Storage or a Dataform repository,
//                           executed on a runtime template's machine (or a
//                           custom machine), with the executed notebook
//                           written to Cloud Storage -- nightly reports,
//                           scheduled retraining, data-quality checks
//   pipeline_job            a Vertex AI Pipelines run: a compiled Kubeflow
//                           pipeline (inline or from a template registry)
//                           with its runtime parameters
//
// Both are Google's Schedules API; the provider files it under Colab.
//
// A schedule can be paused and resumed (desired_state) and bounded by a
// time window and a run count. Mutable in place: everything except
// location, the project, and the notebook arm (a change to the notebook
// run REPLACES the schedule; the pipeline arm updates in place).
message GcpColabScheduleSpec {
  option (buf.validate.message).cel = {
    id: "exactly_one_run"
    message: "set exactly one of notebook_execution_job or pipeline_job"
    expression: "has(this.notebook_execution_job) != has(this.pipeline_job)"
  };

  // The GCP project the schedule lives in: a literal project ID or a
  // GcpProject reference. If omitted, the provider's default project is
  // used.
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];

  // The Vertex AI region the schedule and its runs live in, e.g.
  // "us-central1". Changing it needs a new schedule.
  string location = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-z]+-[a-z]+[0-9]+$"
  ];

  // The schedule's name in the console -- up to 128 characters. Defaults
  // to metadata.name.
  string display_name = 3 [(buf.validate.field).string.max_len = 128];

  // When runs launch, in cron syntax, optionally prefixed with a time zone:
  // "0 6 * * *" (06:00 UTC daily) or "TZ=America/New_York 0 9 * * 1-5"
  // (09:00 New York time on weekdays).
  string cron = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 9
  ];

  // How many runs may be STARTED at the same time. A run that would exceed
  // it is skipped (or queued, with allow_queueing). This limits launching,
  // not how long a run executes.
  int64 max_concurrent_run_count = 5 [(buf.validate.field).int64.gte = 1];

  // Queue a run that hits max_concurrent_run_count instead of skipping it.
  bool allow_queueing = 6;

  // The earliest a run may launch, RFC 3339 (e.g. "2026-10-01T00:00:00Z").
  // Unset: the schedule's creation time. Sent only when set.
  string start_time = 7 [(buf.validate.field).cel = {
    id: "start_time.rfc3339"
    message: "start_time must be an RFC 3339 timestamp"
    expression: "this == '' || this.matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$')"
  }];

  // After this time no new runs launch and the schedule completes, RFC
  // 3339. Unset: no end.
  string end_time = 8 [(buf.validate.field).cel = {
    id: "end_time.rfc3339"
    message: "end_time must be an RFC 3339 timestamp"
    expression: "this == '' || this.matches('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$')"
  }];

  // Complete the schedule after this many runs have launched. Unset (0):
  // runs keep launching until the schedule is paused, ended, or deleted.
  int64 max_run_count = 9 [(buf.validate.field).int64.gte = 0];

  // How many runs may be in a non-terminal state at once -- Google applies
  // it to pipeline schedules only. Unset (0): no limit beyond
  // max_concurrent_run_count.
  int64 max_concurrent_active_run_count = 10 [(buf.validate.field).int64.gte = 0];

  // Whether the schedule launches runs:
  //   "ACTIVE" -- runs launch on the cron (the default)
  //   "PAUSED" -- nothing launches; resume by setting ACTIVE again
  // The block pauses or resumes the schedule to match on every apply.
  string desired_state = 11 [(buf.validate.field).cel = {
    id: "desired_state.valid"
    message: "desired_state must be ACTIVE or PAUSED"
    expression: "this == '' || this in ['ACTIVE', 'PAUSED']"
  }];

  // The Colab Enterprise notebook run each tick launches. Exactly one of
  // notebook_execution_job or pipeline_job. A change replaces the
  // schedule.
  GcpColabScheduleNotebookExecutionJob notebook_execution_job = 12;

  // The Vertex AI Pipelines run each tick launches. Exactly one of
  // notebook_execution_job or pipeline_job. Updates in place.
  GcpColabSchedulePipelineJob pipeline_job = 13;

  // What happens to the schedule when this resource is destroyed:
  //   "" / "DELETE" -- the schedule is deleted (runs it already launched
  //                    and their outputs stay)
  //   "PREVENT"     -- destroy fails
  //   "ABANDON"     -- the schedule leaves management and keeps launching
  //                    runs
  string deletion_policy = 14 [(buf.validate.field).cel = {
    id: "valid_deletion_policy"
    expression: "this == '' || this in ['DELETE', 'PREVENT', 'ABANDON']"
    message: "deletion_policy must be one of: DELETE, PREVENT, ABANDON"
  }];
}

// GcpColabScheduleNotebookExecutionJob is the notebook run a tick
// launches: which notebook, on what machine, as whom, and where the
// executed notebook lands.
message GcpColabScheduleNotebookExecutionJob {
  option (buf.validate.message).cel = {
    id: "exactly_one_source"
    message: "set exactly one of gcs_notebook_source or dataform_repository_source"
    expression: "has(this.gcs_notebook_source) != has(this.dataform_repository_source)"
  };
  option (buf.validate.message).cel = {
    id: "exactly_one_environment"
    message: "set exactly one of notebook_runtime_template_resource_name or custom_environment_spec"
    expression: "(has(this.notebook_runtime_template_resource_name) && (this.notebook_runtime_template_resource_name.value != '' || has(this.notebook_runtime_template_resource_name.value_from))) != has(this.custom_environment_spec)"
  };
  option (buf.validate.message).cel = {
    id: "exactly_one_identity"
    message: "set exactly one of execution_user or service_account"
    expression: "(this.execution_user != '') != (has(this.service_account) && (this.service_account.value != '' || has(this.service_account.value_from)))"
  };

  // The run's name in the console -- up to 128 characters. Defaults to the
  // schedule's display name.
  string display_name = 1 [(buf.validate.field).string.max_len = 128];

  // Run a notebook stored in Cloud Storage. Exactly one source.
  GcpColabScheduleGcsNotebookSource gcs_notebook_source = 2;

  // Run a notebook from a Dataform repository (notebooks under version
  // control). Exactly one source.
  GcpColabScheduleDataformRepositorySource dataform_repository_source = 3;

  // Run on a runtime template's machine, network, and image: a
  // GcpColabRuntimeTemplate reference or a literal
  // projects/{project}/locations/{location}/notebookRuntimeTemplates/{id}.
  // Exactly one of this or custom_environment_spec.
  dev.planton.shared.foreignkey.v1.StringValueOrRef notebook_runtime_template_resource_name = 4 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpColabRuntimeTemplate,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.name"
  ];

  // Run on a machine described here instead of a template. Exactly one of
  // this or notebook_runtime_template_resource_name.
  GcpColabScheduleCustomEnvironmentSpec custom_environment_spec = 5;

  // Run in a Vertex AI Workbench instance-based environment (Google's empty
  // workbench_runtime marker); still needs a template or a custom
  // environment for the machine. Sent only when true.
  bool workbench_runtime = 6;

  // Where the executed notebook (with its outputs) is written:
  // a GcpGcsBucket reference (its gs:// URL) or a literal gs://bucket or
  // gs://bucket/prefix. The run's identity needs write access.
  dev.planton.shared.foreignkey.v1.StringValueOrRef gcs_output_uri = 7 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpGcsBucket,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.url"
  ];

  // Run as this user (their email) -- their access applies. Exactly one of
  // execution_user or service_account.
  string execution_user = 8 [(buf.validate.field).cel = {
    id: "execution_user.email"
    message: "execution_user must be an email address"
    expression: "this == '' || this.isEmail()"
  }];

  // Run as this service account: a GcpServiceAccount reference or a
  // literal email. The schedule's caller needs iam.serviceAccounts.actAs
  // on it. Exactly one of execution_user or service_account; the choice
  // for unattended production runs.
  dev.planton.shared.foreignkey.v1.StringValueOrRef service_account = 9 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpServiceAccount,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.email"
  ];

  // The longest a run may execute, in seconds ending in "s" (e.g.
  // "3600s"). Unset: Google's default of 24 hours.
  string execution_timeout = 10 [(buf.validate.field).cel = {
    id: "execution_timeout.format"
    message: "execution_timeout must be a duration in seconds such as 3600s"
    expression: "this == '' || this.matches('^[0-9]+(\\\\.[0-9]{1,9})?s$')"
  }];

  // The Jupyter kernel to run the notebook with. Unset: the notebook's
  // default kernel.
  string kernel_name = 11;

  // Labels on every run the schedule launches.
  map<string, string> labels = 12;

  // Customer-managed encryption key for the run: a GcpKmsKey reference or
  // a literal key path in the schedule's region.
  dev.planton.shared.foreignkey.v1.StringValueOrRef kms_key_name = 13 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpKmsKey,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_id"
  ];
}

// GcpColabScheduleGcsNotebookSource is a notebook file in Cloud Storage.
message GcpColabScheduleGcsNotebookSource {
  // The notebook: gs://bucket/path/notebook.ipynb.
  string uri = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^gs://[^/]+/.+$"
  ];

  // Pin an object generation (version) of the notebook. Unset: the current
  // version at each run.
  string generation = 2 [(buf.validate.field).cel = {
    id: "generation.numeric"
    message: "generation must be a Cloud Storage object generation number"
    expression: "this == '' || this.matches('^[0-9]+$')"
  }];
}

// GcpColabScheduleDataformRepositorySource is a notebook in a Dataform
// repository.
message GcpColabScheduleDataformRepositorySource {
  // The repository:
  // projects/{project}/locations/{location}/repositories/{repository}.
  string dataform_repository_resource_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^projects/[^/]+/locations/[^/]+/repositories/[^/]+$"
  ];

  // Pin a commit. Unset: the repository's HEAD at each run.
  string commit_sha = 2;
}

// GcpColabScheduleCustomEnvironmentSpec is a run's machine, network, and
// disk when no template is used.
message GcpColabScheduleCustomEnvironmentSpec {
  // The machine and accelerators.
  GcpColabScheduleMachineSpec machine_spec = 1;

  // The network the run joins.
  GcpColabScheduleNetworkSpec network_spec = 2;

  // The run's persistent disk.
  GcpColabSchedulePersistentDiskSpec persistent_disk_spec = 3;
}

// GcpColabScheduleMachineSpec is a run's machine.
message GcpColabScheduleMachineSpec {
  // The Compute Engine machine type, e.g. "n1-standard-4". Immutable.
  string machine_type = 1;

  // The accelerator, e.g. "NVIDIA_TESLA_T4", "NVIDIA_L4",
  // "NVIDIA_H100_80GB", "TPU_V5_LITEPOD".
  string accelerator_type = 2;

  // How many accelerators the machine gets.
  int32 accelerator_count = 3 [(buf.validate.field).int32.gte = 0];

  // Split each GPU into NVIDIA multi-instance partitions of this size
  // (e.g. "1g.10gb"); then accelerator_count should be 1. Immutable.
  string gpu_partition_size = 4;

  // The TPU topology for a TPU accelerator, e.g. "2x2x1". Immutable.
  string tpu_topology = 5;

  // Draw the machine from a Compute Engine reservation.
  GcpColabScheduleReservationAffinity reservation_affinity = 6;
}

// GcpColabScheduleReservationAffinity picks reserved or on-demand
// capacity.
message GcpColabScheduleReservationAffinity {
  // "NO_RESERVATION", "ANY_RESERVATION", "SPECIFIC_RESERVATION",
  // "SPECIFIC_THEN_ANY_RESERVATION", or "SPECIFIC_THEN_NO_RESERVATION".
  string reservation_affinity_type = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "NO_RESERVATION",
        "ANY_RESERVATION",
        "SPECIFIC_RESERVATION",
        "SPECIFIC_THEN_ANY_RESERVATION",
        "SPECIFIC_THEN_NO_RESERVATION"
      ]
    }
  ];

  // The reservation label key; for a reservation by name,
  // "compute.googleapis.com/reservation-name".
  string key = 2;

  // The reservation label values -- for a named reservation, its full
  // resource name.
  repeated string values = 3;

  // Draw from Google's shared Vertex AI capacity pool.
  bool use_reservation_pool = 4;
}

// GcpColabScheduleNetworkSpec is the network a notebook run joins.
message GcpColabScheduleNetworkSpec {
  // Give the run a public internet path. Default false.
  bool enable_internet_access = 1;

  // The VPC network: a GcpVpcNetwork reference or a literal
  // projects/{project}/global/networks/{name}.
  dev.planton.shared.foreignkey.v1.StringValueOrRef network = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpVpcNetwork,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.network_id"
  ];

  // The subnetwork: a GcpSubnetwork reference or a literal
  // projects/{project}/regions/{region}/subnetworks/{name}.
  dev.planton.shared.foreignkey.v1.StringValueOrRef subnetwork = 3 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpSubnetwork,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.subnetwork_self_link"
  ];
}

// GcpColabSchedulePersistentDiskSpec is a notebook run's disk.
message GcpColabSchedulePersistentDiskSpec {
  // "pd-standard" (Google's default), "pd-balanced", "pd-ssd", or
  // "pd-extreme".
  string disk_type = 1 [(buf.validate.field).cel = {
    id: "disk_type.valid"
    message: "disk_type must be pd-standard, pd-balanced, pd-ssd, or pd-extreme"
    expression: "this == '' || this in ['pd-standard', 'pd-balanced', 'pd-ssd', 'pd-extreme']"
  }];

  // Disk size in GB. Unset (0): Google's default of 100.
  int64 disk_size_gb = 2 [(buf.validate.field).int64.gte = 0];
}

// GcpColabSchedulePipelineJob is the Vertex AI Pipelines run a tick
// launches.
message GcpColabSchedulePipelineJob {
  // The run's name in the console -- up to 128 characters.
  string display_name = 1 [(buf.validate.field).string.max_len = 128];

  // The compiled pipeline definition as a JSON string -- the output of the
  // Kubeflow Pipelines SDK compiler. Set this or template_uri.
  string pipeline_spec = 2;

  // Where the compiled pipeline is downloaded from when pipeline_spec is
  // empty -- an Artifact Registry pipeline template URI
  // (https://{region}-kfp.pkg.dev/{project}/{repository}/{template}/{tag}).
  string template_uri = 3;

  // The run's parameters and output location.
  GcpColabSchedulePipelineRuntimeConfig runtime_config = 4;

  // The service account the pipeline's steps run as: a GcpServiceAccount
  // reference or a literal email. Unset: the Compute Engine default
  // service account. The schedule's caller needs
  // iam.serviceAccounts.actAs on it.
  dev.planton.shared.foreignkey.v1.StringValueOrRef service_account = 5 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpServiceAccount,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.email"
  ];

  // A VPC network the pipeline's workloads peer with (private services
  // access must already be configured on it): a GcpVpcNetwork reference or
  // a literal network path. Google wants
  // projects/{project_NUMBER}/global/networks/{name}; the modules resolve a
  // project ID to its number. Unset: no peering.
  dev.planton.shared.foreignkey.v1.StringValueOrRef network = 6 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpVpcNetwork,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.network_self_link"
  ];

  // Names of reserved IP ranges on the peered network the workloads may
  // use (e.g. "vertex-ai-ip-range"). Unset: any range on the network.
  repeated string reserved_ip_ranges = 7;

  // Validate every component before the run starts.
  bool preflight_validations = 8;

  // Labels on every pipeline run. Google overrides the reserved
  // vertex-ai-pipelines-run-billing-id key.
  map<string, string> labels = 9;

  // Customer-managed encryption key for the run: a GcpKmsKey reference or
  // a literal key path in the schedule's region.
  dev.planton.shared.foreignkey.v1.StringValueOrRef kms_key_name = 10 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpKmsKey,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_id"
  ];

  // Private Service Connect interface: reach private services through a
  // network attachment instead of peering.
  GcpColabSchedulePscInterfaceConfig psc_interface_config = 11;
}

// GcpColabSchedulePipelineRuntimeConfig is a pipeline run's parameters and
// output root.
message GcpColabSchedulePipelineRuntimeConfig {
  // The Cloud Storage root the run's artifacts are written under
  // ({job_id}/{task_id}/{output_key}), e.g. gs://bucket/pipeline-root. The
  // pipeline's service account needs storage.objects.get and
  // storage.objects.create on it.
  string gcs_output_directory = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^gs://[^/]+(/.*)?$"
  ];

  // How the run reacts to a failed task:
  //   "PIPELINE_FAILURE_POLICY_FAIL_SLOW" -- running tasks finish, nothing
  //                                          new is scheduled
  //   "PIPELINE_FAILURE_POLICY_FAIL_FAST" -- the run stops at once
  string failure_policy = 2 [(buf.validate.field).cel = {
    id: "failure_policy.valid"
    message: "failure_policy must be PIPELINE_FAILURE_POLICY_FAIL_SLOW or PIPELINE_FAILURE_POLICY_FAIL_FAST"
    expression: "this == '' || this in ['PIPELINE_FAILURE_POLICY_FAIL_SLOW', 'PIPELINE_FAILURE_POLICY_FAIL_FAST']"
  }];

  // Runtime parameters substituted into the pipeline's placeholders
  // (pipelines compiled with KFP SDK 1.9+ / the v2 DSL). Values are
  // strings.
  map<string, string> parameter_values = 3;
}

// GcpColabSchedulePscInterfaceConfig is Private Service Connect interface
// networking for a pipeline run.
message GcpColabSchedulePscInterfaceConfig {
  // The Compute Engine network attachment the run attaches to, in the
  // schedule's region and project (created beforehand).
  string network_attachment = 1;

  // DNS peering so the run resolves private domains through another
  // project's Cloud DNS. The Vertex AI service agent needs roles/dns.peer
  // on each target project.
  repeated GcpColabScheduleDnsPeeringConfig dns_peering_configs = 2;
}

// GcpColabScheduleDnsPeeringConfig peers one DNS suffix.
message GcpColabScheduleDnsPeeringConfig {
  // The DNS suffix to peer, ending with a dot, e.g.
  // "internal.example.com.".
  string domain = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^.+\\.$"
  ];

  // The VPC network in target_project where the zone is visible: a
  // GcpVpcNetwork reference (its name) or a literal network name.
  dev.planton.shared.foreignkey.v1.StringValueOrRef target_network = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpVpcNetwork,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.network_name"
  ];

  // The project hosting the Cloud DNS zone: a GcpProject reference or a
  // literal project ID.
  dev.planton.shared.foreignkey.v1.StringValueOrRef target_project = 3 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];
}
