# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpdeploytarget
spec:
  gcp:
    groups:
      - purpose: EnableCloudDeployApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling clouddeploy.googleapis.com on the target's project. disable_on_destroy is false, so the disable permission is never needed.
      - purpose: ManageTarget
        permissions:
          - clouddeploy.targets.create
          - clouddeploy.targets.get
          - clouddeploy.targets.update
          - clouddeploy.targets.delete
          - clouddeploy.operations.get
        provenance: derived
        notes: Covers google_clouddeploy_target (Pulumi clouddeploy.Target) -- create, read on every refresh, in-place updates (the target type, approval, parameters, labels, annotations, associated entities, execution configurations), and delete under deletion_policy DELETE (ABANDON and PREVENT call no delete API). Create, update, and delete return long-running operations the provider polls with clouddeploy.operations.get. All five appear in roles/clouddeploy.admin. Naming an execution service account, bucket, worker pool, cluster, or custom target type on the target reads none of them at apply time; the execution service account uses them when jobs run.
