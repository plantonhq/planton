apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpdeploytarget
spec:
  # Proven live on both engines (2026-11-18): a Cloud Run target, a
  # multi-target over two target fixtures, a custom target over a custom
  # target type, and a target with execution configurations, each deployed and
  # destroyed by an identity holding only this kind's permissions manifest, and
  # the Cloud Run target updated in place (description, approval no longer
  # required). Every scenario re-planned clean with execution_configs unset and
  # set; Google accepts an execution service account that holds no roles yet.
  # Cloud Deploy checks grants through its own cache, which was measured
  # refusing a held permission a minute after the identity was ready.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
