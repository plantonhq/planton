# The second act of cloud-run-target.yaml: the same target with its
# description changed and approval no longer required, in-place updates a
# target takes.
# Not a scenario of its own (the second-act annotation keeps discovery from
# running it as a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpDeployTarget
metadata:
  name: planton-oss-e2e-gcpcdtgt-run
  id: planton-oss-e2e-gcpcdtgt-run
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpdeploytarget
  annotations:
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e: "true"
    planton.dev/e2e-second-act: cloud-run-target.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
  tags:
    - planton-e2e
spec:
  location: us-central1
  targetId: e2e-run-${E2E_RUN_ID}
  description: Ephemeral Cloud Run target created by the Planton E2E harness, updated in place; safe to delete
  requireApproval: false
  labels:
    purpose: e2e
  annotations:
    owner: planton-e2e
  deployParameters:
    min-instances: "0"
  run:
    location: projects/${E2E_ENV:PLANTON_E2E_GCP_PROJECT_ID}/locations/us-central1
