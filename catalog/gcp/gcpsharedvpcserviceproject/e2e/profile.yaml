apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpsharedvpcserviceproject
spec:
  # Attaching a service project needs an organization holding both the host
  # (the harness project) and a second project
  # (PLANTON_E2E_GCP_SECOND_PROJECT_ID). The live lane, detach-on-destroy,
  # runs as the declared identity and detaches on destroy, so the host
  # prerequisite can be disabled after it. It has no second act: both
  # projects recreate the attachment, so the kind proves by deploy and
  # destroy. The abandon arm leaves its attachment by design, which blocks the
  # host's teardown, so it runs only where an operator sets
  # PLANTON_E2E_GCP_SHARED_VPC_DETACH_BY_HAND and detaches by hand. Offline bar
  # met: both modules build and validate, offline plans for the reference
  # manifest and both scenarios are clean on the pinned provider, and the
  # accounting is total.
  tier: 2
  status: deferred
  deferred_reason: the live lane waits for a test organization exported as PLANTON_E2E_GCP_ORGANIZATION_ID holding the harness project and the second project PLANTON_E2E_GCP_SECOND_PROJECT_ID; offline plans only until then
  validated_provisioners: []
  timeout_minutes: 10
