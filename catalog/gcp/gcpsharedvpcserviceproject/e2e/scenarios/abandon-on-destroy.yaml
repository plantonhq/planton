# GcpSharedVpcServiceProject scenario with deletion_policy ABANDON: destroy
# unmanages the attachment and leaves the project attached. Both projects by
# literal -- the shape for a host and project created outside the chart.
# The destroy therefore leaves the attachment behind by design, and Google
# refuses to disable a host that still has one, so the host's own teardown
# would fail. The arm stays offline: it runs only where an operator sets
# PLANTON_E2E_GCP_SHARED_VPC_DETACH_BY_HAND, promising to detach the second
# project by hand after the lane.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSharedVpcServiceProject
metadata:
  name: planton-oss-e2e-gcpsvps-abandon
  id: planton-oss-e2e-gcpsvps-abandon
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpsharedvpcserviceproject
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-required-env: PLANTON_E2E_GCP_ORGANIZATION_ID,PLANTON_E2E_GCP_SECOND_PROJECT_ID,PLANTON_E2E_GCP_SHARED_VPC_DETACH_BY_HAND
  tags:
    - planton-e2e
spec:
  hostProjectId:
    value: ${E2E_ENV:PLANTON_E2E_GCP_PROJECT_ID}
  serviceProjectId:
    value: ${E2E_ENV:PLANTON_E2E_GCP_SECOND_PROJECT_ID}
  deletionPolicy: ABANDON
