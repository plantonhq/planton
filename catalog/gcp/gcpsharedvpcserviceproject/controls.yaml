# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpsharedvpcserviceproject
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A Shared VPC attachment stores no customer data -- it is a control-plane association between two projects.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest exists to key (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: The attachment terminates no connections; management API calls ride Google's TLS-only endpoints like every GCP API.
    - control_id: no-public-access
      status: not_applicable
      notes: There is no endpoint to expose -- the attachment lets the service project SEE the host's networks; whether anything in them is public is the networks' and the workloads' posture.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No inbound network path exists on the attachment itself; firewall posture belongs to the host's networks.
    - control_id: edge-protection
      status: not_applicable
      notes: No requests are served; there is no inbound traffic for a WAF or request filter to inspect.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Attaching and detaching authorize against compute.organizations.enableXpnResource / disableXpnResource, granted only through roles/compute.xpnAdmin on the organization or a folder above both projects; and attaching grants the service project NO use of any subnetwork by itself -- every deployer and service agent still needs roles/compute.networkUser on the host's subnetworks, a separate additive grant.
      notes: The two-step model (attach, then grant networkUser per subnetwork) is Google's least-privilege design and the reason the grants are not folded into this kind.
    - control_id: workload-identity
      status: not_applicable
      notes: Nothing authenticates through the attachment -- it carries no credentials and calls no APIs.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths exist to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component enforces no end-user sign-in; any credentials involved are administrative access, whose posture rbac carries.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: enableXpnResource and disableXpnResource land in Cloud Audit Logs (Admin Activity) unconditionally; Admin Activity logging cannot be disabled and is retained free in the _Required log bucket.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The attachment emits no operational metrics and the spec has no logging or monitoring surface.
    - control_id: backup-recovery
      status: not_applicable
      notes: Declarative configuration fully re-creatable from source control; there is no data to back up.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The attachment is global control-plane state with no failure-domain choice; the shared networks' regional posture belongs to their own kinds.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Empty (the default) detaches the service project on destroy -- refused by Google while any resource in the service project still uses a host subnetwork; ABANDON unmanages the resource and leaves the attachment live. This provider resource accepts no PREVENT.
      notes: Google's own guard -- no detach while workloads use the shared subnetworks -- bounds the blast radius; ABANDON is the choice for a project whose workloads must outlive the chart that attached it.
    - control_id: managed-patching
      status: not_applicable
      notes: There is no software surface to patch; the Compute Engine control plane that holds the attachment is Google's own infrastructure.
