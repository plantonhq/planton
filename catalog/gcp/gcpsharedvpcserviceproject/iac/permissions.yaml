# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpsharedvpcserviceproject
spec:
  gcp:
    api_enabled_by:
      - GcpVpcNetwork
    groups:
      - purpose: ManageSharedVpcServiceProject
        permissions:
          - compute.organizations.enableXpnResource
          - compute.organizations.disableXpnResource
        provenance: derived
        reach: organization
        privilege: ordinary
        notes: "Covers google_compute_shared_vpc_service_project (Pulumi compute.SharedVPCServiceProject) -- the modules' only resource. enableXpnResource on first apply; disableXpnResource on destroy when deletion_policy is empty (refused by Google while resources in the service project still use a host subnetwork; ABANDON calls no disable API). Both organizations.* permissions are granted on the organization or a folder above BOTH projects; roles/compute.xpnAdmin contains them."
      - purpose: ReadSharedVpcAttachment
        permissions:
          - compute.projects.get
        provenance: derived
        reach: target
        privilege: ordinary
        notes: "The provider reads the HOST project with compute.projects.get on every refresh and import (it lists the host's xpnResources to find the attachment) -- a project permission, held on the host project."
      - purpose: ResolveAndPollHostProject
        permissions:
          - resourcemanager.projects.get
          - compute.globalOperations.get
        provenance: derived
        reach: target
        privilege: ordinary
        notes: "Before attaching, the provider reads the host project through Resource Manager (refused without resourcemanager.projects.get on both engines: \"Required 'resourcemanager.projects.get' permission for 'projects/<host>'\"), and enableXpnResource and disableXpnResource return an operation in the host project that both engines poll as compute.globalOperations.get. Held on the host project."
