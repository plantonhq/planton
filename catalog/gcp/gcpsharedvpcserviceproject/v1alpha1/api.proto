syntax = "proto3";

package dev.planton.gcp.gcpsharedvpcserviceproject.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpsharedvpcserviceproject/v1alpha1/outputs.proto";
import "catalog/gcp/gcpsharedvpcserviceproject/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-shared-vpc-service-project
message GcpSharedVpcServiceProject {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpSharedVpcServiceProject'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpSharedVpcServiceProjectSpec spec = 4 [(buf.validate.field).required = true];
  GcpSharedVpcServiceProjectStatus status = 5;
}

message GcpSharedVpcServiceProjectStatus {
  GcpSharedVpcServiceProjectStackOutputs outputs = 1;
}
