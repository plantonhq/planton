syntax = "proto3";

package dev.planton.gcp.gcpsharedvpcserviceproject.v1alpha1;

// GcpSharedVpcServiceProjectOutputs captures the attachment's two
// ends after provisioning.
message GcpSharedVpcServiceProjectOutputs {
  // The project ID now attached as a service project.
  string service_project_id = 1;

  // The host project ID it is attached to.
  string host_project_id = 2;
}
