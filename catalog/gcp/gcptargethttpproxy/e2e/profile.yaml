apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcptargethttpproxy
spec:
  # Proven live on both engines (2026-11-19): a global proxy, swapped to a
  # second URL map in place (setUrlMap), and a regional proxy, each deployed
  # and destroyed by an identity holding only this kind's permissions
  # manifest, with the re-plan clean. A regional proxy needs
  # compute.regionUrlMaps.use.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 25
