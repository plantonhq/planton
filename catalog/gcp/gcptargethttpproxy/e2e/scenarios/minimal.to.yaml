# The second act of minimal.yaml: the same proxy pointed at a second URL map,
# the one field a target HTTP proxy changes in place (setUrlMap); its name,
# description and scope recreate it. Not a scenario of its own (the
# second-act annotation keeps discovery from running it as a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpTargetHttpProxy
metadata:
  name: planton-oss-e2e-gcpthp-smoke
  id: planton-oss-e2e-gcpthp-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcptargethttpproxy
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-prerequisites: "catalog/gcp/gcptargethttpproxy/e2e/prerequisites/gcpurlmap-swap.yaml" # the URL map the update act swaps to
    planton.dev/e2e-second-act: minimal.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
  tags:
    - planton-e2e
spec:
  proxyName: planton-oss-e2e-gcpthp-smoke-${E2E_RUN_ID} # per kind and engine, so lanes side by side never share it
  description: Ephemeral target HTTP proxy created by the Planton E2E harness; safe to delete
  urlMap:
    valueFrom:
      kind: GcpUrlMap
      name: planton-oss-e2e-gcpthp-swap-um
      fieldPath: status.outputs.self_link
  # Explicit DELETE keeps the destroy real and proves the no-op-diff
  # behavior of the new arm.
  deletionPolicy: DELETE
