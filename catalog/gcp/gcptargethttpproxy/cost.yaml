# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: gcptargethttpproxy
spec:
  billing_model: free
  free_tier: "A target HTTP proxy is a configuration object of Cloud Load Balancing with no meter of its own -- Google charges nothing to create or hold the proxy, and nothing for the URL-map binding it maintains. The complete Cloud Load Balancing meter list on Google's network pricing page (forwarding rules, data processing, internal-ALB proxy instances, authorization policies, custom request headers, and self-managed-certificate connections) contains no charge for target proxies."
  notes: "No field of this spec buys anything -- url_map, keep-alive, and proxy_bind shape behavior, not billing. The real spend lives one hop on either side of the proxy: the forwarding rule that points at it bills per hour (first 5 rules $0.025/hour per project, each additional $0.01/hour, on the GcpGlobalForwardingRule kind), and every byte the frontend serves bills as per-GiB inbound and outbound data processing in the regions where traffic is processed. Downstream, the backend services and their backends bill as their own components. The standard pattern this proxy exists for -- serving an http-to-https 301 from a redirect-only URL map -- processes each redirect request and response through the load balancer, so even a redirect-only frontend accrues (tiny) data processing on real traffic."
