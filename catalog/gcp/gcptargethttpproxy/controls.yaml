# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcptargethttpproxy
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The proxy stores no customer data -- it is a binding between a forwarding rule and a URL map, configuration metadata Google holds on its own encrypted control plane.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest exists to key (see enc-at-rest); the resource exposes no Cloud KMS surface.
    - control_id: enc-in-transit
      status: not_applicable
      notes: "Honest by design: a target HTTP proxy is deliberately the PLAINTEXT leg of a frontend -- it cannot terminate TLS at any configuration level; that is the sibling GcpTargetHttpsProxy. The production pattern that satisfies the control's intent is pointing this proxy at a redirect-only URL map (http-to-https 301) while the HTTPS proxy carries the real traffic -- preset 01 is exactly that, and preset 02 (plain HTTP end to end) exists for internal or migration traffic that has accepted cleartext."
    - control_id: no-public-access
      status: not_applicable
      notes: The proxy has no address of its own; whether the frontend is internet-facing is the forwarding rule's scheme and address. proxy_bind only rebinds the proxy into a Traffic Director mesh's private IPs.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The proxy exposes no source-filtering surface; inbound restriction on an Application Load Balancer path lives in Cloud Armor policies attached to the backend services.
    - control_id: edge-protection
      status: not_applicable
      notes: The proxy is a pass-through binding, not a filter. Web application firewalling (Cloud Armor) attaches to the backend services the URL map routes to -- there is no request-filtering attachment point on a target proxy.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Management access is governed by Compute Engine IAM (the compute.targetHttpProxies permission family, plus compute.urlMaps.use on the referenced URL map) on every project; the resource has no data plane to govern separately.
    - control_id: workload-identity
      status: not_applicable
      notes: Nothing authenticates to cloud APIs through a target proxy; it carries no credential surface.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The proxy speaks plaintext HTTP to clients by definition and carries no authentication paths to disable; TLS floors and cipher retirement belong to GcpSslPolicy on the HTTPS sibling.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Proxy create, setUrlMap, and delete land in Cloud Audit Logs (Admin Activity) unconditionally; Admin Activity logging cannot be disabled.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The proxy publishes no metrics of its own; the load balancer's request metrics and logs are keyed by the URL map and backend services, and request logging is enabled per backend service.
    - control_id: backup-recovery
      status: not_applicable
      notes: The proxy is declarative configuration fully re-creatable from source control; there is no data to back up or restore.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: No zonal placement exists to configure -- a global proxy is served by Google's global frontend fabric and a regional one (region set) by the region's Envoy-based frontend spread across its zones; availability is the platform's, not a spec choice.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Empty defaults to DELETE; PREVENT makes destroy fail outright, protecting a production frontend, and ABANDON unmanages the proxy while it keeps serving.
      notes: GCP independently refuses to delete a proxy still referenced by a forwarding rule, so a frontend cannot be torn down out from under its VIP.
    - control_id: managed-patching
      status: not_applicable
      notes: There is no software surface here to patch; the Google Front End and Envoy fabric that materialize the proxy are patched by Google as platform infrastructure, with no version or channel exposed on this resource.
