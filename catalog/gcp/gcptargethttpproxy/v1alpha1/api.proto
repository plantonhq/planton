syntax = "proto3";

package dev.planton.gcp.gcptargethttpproxy.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcptargethttpproxy/v1alpha1/outputs.proto";
import "catalog/gcp/gcptargethttpproxy/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-target-http-proxy
message GcpTargetHttpProxy {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpTargetHttpProxy'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpTargetHttpProxySpec spec = 4 [(buf.validate.field).required = true];
  GcpTargetHttpProxyStatus status = 5;
}

message GcpTargetHttpProxyStatus {
  GcpTargetHttpProxyOutputs outputs = 1;
}
