# GcpCloudComposerUserWorkloadsConfigMap scenario: DAG tuning parameters
# delivered into the prerequisite Composer environment. project_id is
# deliberately omitted (ambient project).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudComposerUserWorkloadsConfigMap
metadata:
  name: planton-oss-e2e-gcpcuwcm-smoke
  id: planton-oss-e2e-gcpcuwcm-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcloudcomposeruserworkloadsconfigmap
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-central1
  environment:
    valueFrom:
      kind: GcpCloudComposerEnvironment
      name: planton-oss-e2e-gcpcce-prereq
      fieldPath: status.outputs.environment_name
  configMapName: e2e-dag-configuration
  data:
    batch-window-hours: "6"
    feature-lineage-enabled: "true"
  deletionPolicy: DELETE
