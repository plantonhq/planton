# Minimal GcpWorkloadIdentityPool scenario. project_id is deliberately
# omitted: the module falls back to the provider's default project, which the
# E2E harness exports as GOOGLE_PROJECT from the resolved test project. The
# pool ID carries ${E2E_RUN_ID} because soft-deleted pool IDs are reserved for
# ~30 days and cannot be reused — a fixed ID would collide with the previous
# engine run's ghost.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpWorkloadIdentityPool
metadata:
  name: planton-oss-e2e-gcpwip-smoke
  id: planton-oss-e2e-gcpwip-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpworkloadidentitypool
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  workloadIdentityPoolId: e2e-smoke-${E2E_RUN_ID}
  displayName: Planton E2E Smoke Pool
  description: Ephemeral pool created by the Planton E2E harness; safe to delete
  # Explicit mode proves the formerly-beta-only argument applies cleanly on
  # the GA provider (it is GA on the pinned line); FEDERATION_ONLY matches the
  # spec default, so the arm adds surface without changing pool behavior.
  mode: FEDERATION_ONLY
  # Explicit provider default: proves the DELETE (soft-delete) round-trip.
  deletionPolicy: DELETE
