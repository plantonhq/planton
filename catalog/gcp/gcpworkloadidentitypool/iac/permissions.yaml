# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpworkloadidentitypool
spec:
  gcp:
    groups:
      - purpose: ManageWorkloadIdentityPool
        permissions:
          - iam.workloadIdentityPools.create
          - iam.workloadIdentityPools.delete
          - iam.workloadIdentityPools.get
          - iam.workloadIdentityPools.update
        provenance: derived
        notes: Covers google_iam_workload_identity_pool (Pulumi iam.WorkloadIdentityPool) -- create, read/refresh, in-place updates (display_name, description, disabled, mode diffs the API rejects aside, and the inline certificate/trust configs), and destroy (the soft-delete). deletion_policy PREVENT and ABANDON are client-side stances that never call the API, and the modules never call undelete. The provider polls the long-running operations create and delete return under the same pool-scoped authorization. These four are the core of roles/iam.workloadIdentityPoolAdmin, the role the READMEs recommend on the target project.
      - purpose: ApplyAttestationRules
        permissions:
          - iam.workloadIdentityPools.getAttestationRules
          - iam.workloadIdentityPools.setAttestationRules
        provenance: derived
        condition:
          spec_field_set: attestation_rules
        notes: Required only when attestation_rules is set (TRUST_DOMAIN pools allowlisting which Google Cloud workloads may receive a managed identity). GCP applies the rules through a separate API call after the pool itself is created -- both modules document that a failed apply can leave a pool without its rules until re-apply -- and the provider reads the rules back on refresh under the get permission.
