# Consumer-scoped GcpServiceAccount install profile for the Composer
# environment chain: the workloads identity Composer 3 requires to be
# explicitly specified, carrying its own additive composer.worker grant.
# The cloud-side account id carries ${E2E_RUN_ID} (grants are additive
# and account ids are reserved briefly after deletion); metadata.name
# stays fixed for FK resolution.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpServiceAccount
metadata:
  name: planton-oss-e2e-gsa-prereq
  id: planton-oss-e2e-gsa-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpserviceaccount
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  serviceAccountId: e2e-cce-sa-${E2E_RUN_ID}
  displayName: Planton OSS E2E Composer workloads identity
  description: Ephemeral Composer workloads identity deployed as an E2E prerequisite; safe to delete
  projectIamRoles:
    - roles/composer.worker
