apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpcloudcomposerenvironment
spec:
  # Proven live on both engines (2026-11-19): a small Composer 3 environment
  # on its own subnetwork with a dedicated workloads identity, environment
  # variables and a secret stored in Secret Manager, deployed (about 25
  # minutes), relabelled in place and destroyed by an identity holding only
  # this kind's permissions manifest, with the re-plan clean. Composer 3 runs
  # its cluster in Google's project and uses none of the project's CPU quota.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 240
