# Published install profile: the environment the user-workloads Secret
# and ConfigMap chains deliver into. The cloud-side environment name
# carries ${E2E_RUN_ID}; metadata.name stays fixed for FK resolution.
# Installing this prerequisite takes 25-45 minutes — consumers' batch
# runs must budget for it.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudComposerEnvironment
metadata:
  name: planton-oss-e2e-gcpcce-prereq
  id: planton-oss-e2e-gcpcce-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcloudcomposerenvironment
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-central1
  environmentName: e2e-cce-dep-${E2E_RUN_ID}
  nodeConfig:
    network:
      valueFrom:
        kind: GcpVpcNetwork
        name: planton-oss-e2e-gcpvpcnetwork-prereq
        fieldPath: status.outputs.network_self_link
    subnetwork:
      valueFrom:
        kind: GcpSubnetwork
        name: planton-oss-e2e-gcpsnw-cce-prereq
        fieldPath: status.outputs.subnetwork_self_link
    # Composer 3 requires the workloads identity to be explicitly
    # specified — the prerequisite service account carries its own
    # composer.worker grant.
    serviceAccount:
      valueFrom:
        kind: GcpServiceAccount
        name: planton-oss-e2e-gsa-prereq
        fieldPath: status.outputs.email
  softwareConfig:
    imageVersion: composer-3-airflow-2
  environmentSize: ENVIRONMENT_SIZE_SMALL
