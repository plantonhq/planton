syntax = "proto3";

package dev.planton.gcp.gcpcloudcomposerenvironment.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpcloudcomposerenvironment/v1alpha1/outputs.proto";
import "catalog/gcp/gcpcloudcomposerenvironment/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-cloud-composer-environment
message GcpCloudComposerEnvironment {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpCloudComposerEnvironment'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpCloudComposerEnvironmentSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpCloudComposerEnvironmentStatus status = 5;
}

//gcp-cloud-composer-environment status
message GcpCloudComposerEnvironmentStatus {
  //outputs
  GcpCloudComposerEnvironmentOutputs outputs = 1;
}
