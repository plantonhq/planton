# GcpPubSubSubscription scenario: a basic pull subscription composed on
# the GcpPubSubTopic prerequisite (which itself chains the schema
# prerequisite) — the live proof of the topic FK resolution and the
# label merge. project_id is deliberately omitted (ambient project). The
# cloud-side subscription_name carries ${E2E_RUN_ID} so reruns never
# collide.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpPubSubSubscription
metadata:
  name: planton-oss-e2e-gcppss-smoke
  id: planton-oss-e2e-gcppss-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcppubsubsubscription
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  subscriptionName: e2e-pss-${E2E_RUN_ID}
  topic:
    valueFrom:
      kind: GcpPubSubTopic
      name: planton-oss-e2e-gcppst-prereq
      fieldPath: status.outputs.topic_id
  labels:
    team: platform-e2e
  # Explicit DELETE so the ephemeral run's destroy is a live no-op-diff
  # proof of the new deletion_policy wiring.
  deletionPolicy: DELETE
