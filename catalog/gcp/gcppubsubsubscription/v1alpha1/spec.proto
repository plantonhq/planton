syntax = "proto3";

package dev.planton.gcp.gcppubsubsubscription.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";

// GcpPubSubSubscriptionExpirationPolicy configures when an inactive subscription
// expires and is automatically deleted. A subscription is considered active when
// any connected subscriber is successfully consuming messages or issuing operations.
//
// If not set, GCP applies a default TTL of 31 days. Set ttl to an empty string
// ("") to create a subscription that never expires.
message GcpPubSubSubscriptionExpirationPolicy {
  // Duration after which the subscription expires if inactive.
  // Format: duration string (e.g., "2592000s" for 30 days).
  // Minimum: 86400s (1 day). Set to "" for a subscription that never expires.
  string ttl = 1;
}

// GcpPubSubSubscriptionDeadLetterPolicy configures dead-letter handling for
// messages that cannot be processed after repeated delivery attempts. Messages
// exceeding the maximum delivery attempts are forwarded to the dead-letter topic.
//
// The Pub/Sub service account (service-{project_number}@gcp-sa-pubsub.iam.gserviceaccount.com)
// must have Subscriber permissions on this subscription and Publisher permissions
// on the dead-letter topic.
message GcpPubSubSubscriptionDeadLetterPolicy {
  // The topic to which dead-letter messages are published.
  // Format: projects/{project}/topics/{topic}
  dev.planton.shared.foreignkey.v1.StringValueOrRef dead_letter_topic = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpPubSubTopic,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.topic_id"
  ];

  // Maximum number of delivery attempts before a message is dead-lettered.
  // A delivery attempt is counted as 1 + (NACKs + ack deadline exceeded events).
  // Range: 5 to 100. Defaults to 5 when set to 0.
  int32 max_delivery_attempts = 2 [(buf.validate.field).cel = {
    id: "max_delivery_attempts_range"
    expression: "this == 0 || (this >= 5 && this <= 100)"
    message: "max_delivery_attempts must be between 5 and 100, or 0 for default (5)"
  }];
}

// GcpPubSubSubscriptionRetryPolicy configures how Pub/Sub retries message
// delivery after a NACK or acknowledgement deadline exceeded event. If not set,
// messages are retried as soon as possible.
message GcpPubSubSubscriptionRetryPolicy {
  // Minimum delay between consecutive delivery attempts of a given message.
  // Format: duration string (e.g., "10s").
  // Range: 0s to 600s. Defaults to 10s.
  string minimum_backoff = 1;

  // Maximum delay between consecutive delivery attempts of a given message.
  // Format: duration string (e.g., "600s").
  // Range: 0s to 600s. Defaults to 600s.
  string maximum_backoff = 2;
}

// GcpPubSubSubscriptionPushConfigOidcToken configures OIDC-based authentication
// for push deliveries. Pub/Sub generates a signed JWT and attaches it as an
// Authorization header in each HTTP request to the push endpoint.
message GcpPubSubSubscriptionPushConfigOidcToken {
  // Service account used to generate the OIDC token. Accepts a literal
  // email or a reference to a GcpServiceAccount resource.
  // The caller must have iam.serviceAccounts.actAs permission on this account.
  dev.planton.shared.foreignkey.v1.StringValueOrRef service_account_email = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpServiceAccount,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.email"
  ];

  // Audience claim for the OIDC token. Identifies the intended recipient.
  // Defaults to the push endpoint URL if not specified.
  string audience = 2;
}

// GcpPubSubSubscriptionPushConfigNoWrapper configures unwrapped payload delivery.
// When set, the raw message data is sent as the HTTP body without the standard
// Pub/Sub message envelope. Useful for webhook integrations that expect
// application-specific payloads.
message GcpPubSubSubscriptionPushConfigNoWrapper {
  // When true, Pub/Sub message metadata is written as HTTP headers
  // (x-goog-pubsub-<key>:<value>) and message attributes as plain headers.
  bool write_metadata = 1;
}

// GcpPubSubSubscriptionPushConfigPubsubWrapper is the standard push payload:
// the message wrapped in the Pub/Sub JSON envelope. It carries no settings;
// choosing it says the envelope is wanted, the same delivery a push config with
// no wrapper choice gets.
message GcpPubSubSubscriptionPushConfigPubsubWrapper {}

// GcpPubSubSubscriptionPushConfig configures push delivery to an HTTPS endpoint.
// Pub/Sub sends each message as an HTTP POST request to the configured endpoint.
//
// Mutually exclusive with bigquery_config and cloud_storage_config.
// If none of the three delivery configs are set, the subscription uses pull delivery.
message GcpPubSubSubscriptionPushConfig {
  // URL to which Pub/Sub pushes messages. Must use HTTPS.
  // Accepts a literal URL or a reference to a GcpCloudRun service — pushing to
  // a Cloud Run service in the same environment is the canonical serverless
  // consumer pattern, and the service URL contains a generated suffix that can
  // only be known by reading the deployed service's output. Pair a Cloud Run
  // push endpoint with oidc_token (the service account must hold run.invoker)
  // unless the service allows unauthenticated invocations.
  dev.planton.shared.foreignkey.v1.StringValueOrRef push_endpoint = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpCloudRun,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.url"
  ];

  // Endpoint configuration attributes. The supported attribute is "x-goog-version"
  // which controls the push message format ("v1beta1" or "v1").
  map<string, string> attributes = 2;

  // OIDC token configuration for authenticating push requests.
  GcpPubSubSubscriptionPushConfigOidcToken oidc_token = 3;

  // How the payload is delivered: wrapped in the Pub/Sub envelope, or
  // unwrapped (the raw message data as the HTTP body). Leaving the choice
  // unset delivers wrapped, Pub/Sub's default; choosing `pubsub_wrapper`
  // says so explicitly.
  oneof wrapper {
    // The message payload is sent unwrapped (no Pub/Sub envelope).
    GcpPubSubSubscriptionPushConfigNoWrapper no_wrapper = 4;

    // The message is wrapped in the standard Pub/Sub envelope.
    GcpPubSubSubscriptionPushConfigPubsubWrapper pubsub_wrapper = 5;
  }
}

// GcpPubSubSubscriptionBigQueryConfig configures delivery to a BigQuery table.
// Each message is written as a row. Pub/Sub handles batching and streaming inserts.
//
// Mutually exclusive with push_config and cloud_storage_config.
message GcpPubSubSubscriptionBigQueryConfig {
  // The BigQuery table to write messages to.
  // Format: {project_id}.{dataset_id}.{table_id}
  // Accepts a literal or a reference to a GcpBigQueryTable resource (its
  // qualified_name output is exactly this dotted form).
  dev.planton.shared.foreignkey.v1.StringValueOrRef table = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpBigQueryTable,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.qualified_name"
  ];

  // When true, use the Pub/Sub topic's schema to map message fields to BigQuery columns.
  // Only one of use_topic_schema and use_table_schema can be true.
  bool use_topic_schema = 2;

  // When true, use the BigQuery table's schema to determine which message fields
  // to write. Only one of use_topic_schema and use_table_schema can be true.
  bool use_table_schema = 3;

  // When true (and use_topic_schema or use_table_schema is true), message fields
  // not present in the BigQuery table schema are silently dropped. When false,
  // messages with extra fields are not written and remain in the backlog.
  bool drop_unknown_fields = 4;

  // When true, the subscription name, messageId, publishTime, attributes, and
  // orderingKey are written to additional columns in the BigQuery table.
  bool write_metadata = 5;

  // Service account to use for writing to BigQuery. Accepts a literal
  // email or a reference to a GcpServiceAccount resource. Defaults to the
  // Pub/Sub service agent if not specified.
  dev.planton.shared.foreignkey.v1.StringValueOrRef service_account_email = 6 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpServiceAccount,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.email"
  ];
}

// GcpPubSubSubscriptionCloudStorageConfigAvroConfig configures Avro format
// for Cloud Storage delivery.
message GcpPubSubSubscriptionCloudStorageConfigAvroConfig {
  // When true, serialize output using the topic schema.
  bool use_topic_schema = 1;

  // When true, include subscription name, messageId, publishTime, attributes,
  // and orderingKey as additional fields in the Avro output.
  bool write_metadata = 2;
}

// GcpPubSubSubscriptionCloudStorageConfigTextConfig writes each message's raw
// data as text, one message per line. It carries no settings; choosing it says
// text output is wanted, the same output a Cloud Storage config with no format
// choice gets.
message GcpPubSubSubscriptionCloudStorageConfigTextConfig {}

// GcpPubSubSubscriptionCloudStorageConfig configures delivery to a Cloud Storage
// bucket. Messages are batched and written as objects based on size, duration,
// or message count thresholds.
//
// Mutually exclusive with push_config and bigquery_config.
message GcpPubSubSubscriptionCloudStorageConfig {
  // The Cloud Storage bucket to write messages to (without "gs://" prefix).
  // The bucket must already exist.
  dev.planton.shared.foreignkey.v1.StringValueOrRef bucket = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpGcsBucket,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.bucket_id"
  ];

  // Prefix for Cloud Storage filenames.
  string filename_prefix = 2;

  // Suffix for Cloud Storage filenames. Must not end in "/".
  string filename_suffix = 3;

  // Format string for datetime in Cloud Storage filenames.
  string filename_datetime_format = 4;

  // Maximum bytes per Cloud Storage file before a new file is created.
  // Range: 1024 (1 KB) to 10737418240 (10 GiB).
  int64 max_bytes = 5;

  // Maximum duration before a new Cloud Storage file is created.
  // Format: duration string (e.g., "300s").
  // Range: 60s (1 minute) to 600s (10 minutes). Default: 300s (5 minutes).
  // Must not exceed the subscription's ack_deadline_seconds.
  string max_duration = 6;

  // Maximum number of messages per Cloud Storage file. Minimum: 1000.
  int64 max_messages = 7;

  // The output format: Avro records, or raw text. Leaving the choice unset
  // writes text, Pub/Sub's default; choosing `text_config` says so explicitly.
  oneof output_format {
    // Messages are written as Avro records, optionally using the topic schema
    // and carrying message metadata.
    GcpPubSubSubscriptionCloudStorageConfigAvroConfig avro_config = 8;

    // Messages are written as raw text.
    GcpPubSubSubscriptionCloudStorageConfigTextConfig text_config = 10;
  }

  // Service account to use for writing to Cloud Storage. Accepts a literal
  // email or a reference to a GcpServiceAccount resource. Defaults to the
  // Pub/Sub service agent if not specified.
  dev.planton.shared.foreignkey.v1.StringValueOrRef service_account_email = 9 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpServiceAccount,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.email"
  ];
}

// GcpPubSubSubscriptionMessageTransformJavascriptUdf defines a JavaScript
// user-defined function transform. The function receives each message
// (data + attributes) and returns the transformed message, or null/undefined
// to filter the message out entirely.
message GcpPubSubSubscriptionMessageTransformJavascriptUdf {
  // Name of the JavaScript function to invoke from the code below.
  // Must be unique across all transforms on the resource.
  string function_name = 1 [(buf.validate.field).required = true];

  // The JavaScript source code defining the function. The function
  // signature is (message, metadata) => message; return null or undefined
  // to drop the message.
  string code = 2 [(buf.validate.field).required = true];
}

// GcpPubSubSubscriptionMessageTransformAiInferenceUnstructuredInference
// configures AI inference over arbitrary JSON payloads. The parameters
// object is combined with each Pub/Sub message's data field to form the
// inference request sent to the model.
message GcpPubSubSubscriptionMessageTransformAiInferenceUnstructuredInference {
  // A parameters object included in each inference request (e.g. model
  // temperature or system-prompt knobs the endpoint understands). Combined
  // with the message data to form the request body.
  map<string, string> parameters = 1;
}

// GcpPubSubSubscriptionMessageTransformAiInference sends each message to a
// Vertex AI model before delivery and replaces the message with the
// inference response — enrich, classify, or redact messages for THIS
// consumer with a model instead of hand-written JavaScript.
message GcpPubSubSubscriptionMessageTransformAiInference {
  // The Vertex AI model endpoint inference requests are sent to. Accepts a
  // literal path — projects/{project}/locations/{location}/endpoints/{endpoint}
  // for a dedicated endpoint, or
  // projects/{project}/locations/{location}/publishers/{publisher}/models/{model}
  // for a publisher model — or a reference to a GcpVertexAiEndpoint resource
  // (its endpoint_id output is exactly the dedicated-endpoint form).
  dev.planton.shared.foreignkey.v1.StringValueOrRef endpoint = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpVertexAiEndpoint,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.endpoint_id"
  ];

  // The service account used to make prediction requests against the
  // endpoint (it needs Vertex AI invocation permission on the model).
  // Accepts a literal email or a reference to a GcpServiceAccount resource.
  // Defaults to the Pub/Sub service agent if not specified.
  dev.planton.shared.foreignkey.v1.StringValueOrRef service_account_email = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpServiceAccount,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.email"
  ];

  // Configuration for making inferences using arbitrary JSON payloads
  // (rather than a model-specific request schema).
  GcpPubSubSubscriptionMessageTransformAiInferenceUnstructuredInference unstructured_inference = 3;
}

// GcpPubSubSubscriptionMessageTransform is one step in the subscription's
// ordered transform pipeline, applied to every message before delivery.
// Use transforms to reshape payloads for one consumer without touching the
// topic's canonical form (topic-level transforms change what ALL
// subscriptions see; subscription-level transforms are per-consumer).
//
// Each step is exactly one transform: a JavaScript user-defined function
// or an AI inference call (the Pub/Sub API models the step as a choice).
message GcpPubSubSubscriptionMessageTransform {
  option (buf.validate.message).cel = {
    id: "exactly_one_transform"
    expression: "(has(this.javascript_udf) ? 1 : 0) + (has(this.ai_inference) ? 1 : 0) == 1"
    message: "each transform step is exactly one of: javascript_udf or ai_inference"
  };

  // A JavaScript user-defined function transform.
  GcpPubSubSubscriptionMessageTransformJavascriptUdf javascript_udf = 1;

  // When true, this transform is kept in the pipeline definition but not
  // applied — the staging lever for rolling a transform in or out without
  // losing its position in the ordered list.
  bool disabled = 2;

  // An AI inference transform backed by a Vertex AI model endpoint.
  GcpPubSubSubscriptionMessageTransformAiInference ai_inference = 3;
}

// GcpPubSubSubscriptionSpec defines the configuration for a GCP Pub/Sub subscription.
//
// A subscription is a named resource representing the stream of messages from a
// single, specific topic, to be delivered to the subscribing application. Pub/Sub
// supports four delivery methods:
//
//   - **Pull** (default): The subscriber pulls messages using the API.
//   - **Push**: Pub/Sub sends messages as HTTP POST requests to an endpoint.
//   - **BigQuery**: Pub/Sub writes messages directly to a BigQuery table.
//   - **Cloud Storage**: Pub/Sub writes messages to Cloud Storage objects.
//
// Only one delivery method can be active. If none of push_config, bigquery_config,
// or cloud_storage_config is set, the subscription defaults to pull delivery.
//
// Important behavioral notes:
//
//   - The subscription_name and filter fields are immutable after creation.
//     Changing either requires destroying and recreating the subscription.
//
//   - enable_message_ordering is immutable after creation. Once enabled,
//     messages with the same ordering key are delivered in publish order.
//
//   - enable_exactly_once_delivery guarantees each message is delivered exactly
//     once within the acknowledgement deadline window. Does not prevent duplicate
//     delivery if the publisher sends the same message multiple times.
message GcpPubSubSubscriptionSpec {
  option (buf.validate.message).cel = {
    id: "delivery_method_mutual_exclusion"
    expression: "(!has(this.push_config) || !has(this.bigquery_config)) && (!has(this.push_config) || !has(this.cloud_storage_config)) && (!has(this.bigquery_config) || !has(this.cloud_storage_config))"
    message: "only one of push_config, bigquery_config, or cloud_storage_config can be set; if none is set, the subscription uses pull delivery"
  };

  option (buf.validate.message).cel = {
    id: "bigquery_schema_mutual_exclusion"
    expression: "!has(this.bigquery_config) || !(this.bigquery_config.use_topic_schema && this.bigquery_config.use_table_schema)"
    message: "only one of use_topic_schema and use_table_schema can be true in bigquery_config"
  };

  // GCP project where the subscription will be created.
  // Can be a literal project ID or a reference to a GcpProject resource.
  // If omitted, the provider's default project is used.
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];

  // Name of the Pub/Sub subscription.
  // Must be 3-255 characters, start with a letter, and contain only letters,
  // numbers, hyphens, underscores, periods, tildes, plus signs, and percent
  // signs. Names beginning with "goog" are reserved by Google and rejected
  // at create time. Immutable after creation.
  string subscription_name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 255,
    (buf.validate.field).string.pattern = "^[a-zA-Z][a-zA-Z0-9\\-_\\.~+%]*$",
    (buf.validate.field).cel = {
      id: "subscription_name_goog_reserved"
      expression: "!this.startsWith('goog')"
      message: "subscription names beginning with 'goog' are reserved by Google — choose a different name"
    }
  ];

  // The topic from which this subscription receives messages.
  // Format: projects/{project}/topics/{name} or just the topic name if
  // the topic is in the same project as the subscription.
  // Immutable after creation.
  dev.planton.shared.foreignkey.v1.StringValueOrRef topic = 3 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpPubSubTopic,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.topic_id"
  ];

  // Maximum time (in seconds) after a subscriber receives a message before the
  // subscriber should acknowledge the message. After the deadline expires,
  // the message is redelivered.
  // Range: 10 to 600 seconds. Defaults to 10 seconds.
  int32 ack_deadline_seconds = 4 [(buf.validate.field).cel = {
    id: "ack_deadline_range"
    expression: "this == 0 || (this >= 10 && this <= 600)"
    message: "ack_deadline_seconds must be between 10 and 600, or 0 for default (10)"
  }];

  // How long to retain unacknowledged messages in the subscription's backlog.
  // If retain_acked_messages is true, this also controls retention of acknowledged
  // messages and determines how far back a seek operation can go.
  // Format: duration string (e.g., "604800s" for 7 days).
  // Range: 600s (10 minutes) to 2678400s (31 days). Default: 604800s (7 days).
  string message_retention_duration = 5;

  // When true, acknowledged messages are retained in the backlog until they
  // fall out of the message_retention_duration window. Enables replay via seek.
  bool retain_acked_messages = 6;

  // Expiration policy for the subscription. Controls automatic deletion of
  // inactive subscriptions. If not set, GCP defaults to 31 days TTL.
  GcpPubSubSubscriptionExpirationPolicy expiration_policy = 7;

  // Message attribute filter expression. Only messages matching the filter are
  // delivered; non-matching messages are automatically acknowledged.
  // Maximum length: 256 bytes. Immutable after creation.
  string filter = 8 [(buf.validate.field).string.max_len = 256];

  // When true, messages with the same ordering key are delivered to subscribers
  // in the order they were published. Immutable after creation.
  bool enable_message_ordering = 9;

  // When true, Pub/Sub guarantees that a message is not resent before its
  // acknowledgement deadline expires. An acknowledged message will not be
  // resent. Note: subscribers may still receive duplicates if the publisher
  // sends the same message multiple times.
  bool enable_exactly_once_delivery = 10;

  // Dead-letter policy. Messages that cannot be processed after repeated
  // delivery attempts are forwarded to the configured dead-letter topic.
  GcpPubSubSubscriptionDeadLetterPolicy dead_letter_policy = 11;

  // Retry policy. Controls the backoff between consecutive delivery attempts
  // after a NACK or ack deadline exceeded event.
  GcpPubSubSubscriptionRetryPolicy retry_policy = 12;

  // Push delivery configuration. When set, Pub/Sub sends messages as HTTP POST
  // requests to the configured endpoint. Mutually exclusive with bigquery_config
  // and cloud_storage_config.
  GcpPubSubSubscriptionPushConfig push_config = 13;

  // BigQuery delivery configuration. When set, Pub/Sub writes messages directly
  // to a BigQuery table. Mutually exclusive with push_config and
  // cloud_storage_config.
  GcpPubSubSubscriptionBigQueryConfig bigquery_config = 14;

  // Cloud Storage delivery configuration. When set, Pub/Sub writes messages to
  // Cloud Storage objects in batches. Mutually exclusive with push_config and
  // bigquery_config.
  GcpPubSubSubscriptionCloudStorageConfig cloud_storage_config = 15;

  // User-defined labels attached to the subscription, for cost attribution
  // and fleet queries. Merged with Planton's platform labels (which win on
  // key conflicts).
  map<string, string> labels = 16;

  // Ordered pipeline of transforms applied to every message before
  // delivery to this subscription — reshape payloads for this consumer
  // without changing what other subscriptions on the topic see.
  // Transforms run in list order; a transform returning null drops the
  // message.
  repeated GcpPubSubSubscriptionMessageTransform message_transforms = 17;

  // Resource Manager tags bound to the subscription for org-policy and
  // IAM conditions. Keys in the form "tagKeys/{id}", values
  // "tagValues/{id}". Create-time only: changing them later replaces the
  // subscription (its backlog is lost — plan tag changes deliberately).
  map<string, string> resource_manager_tags = 18;

  // Deletion policy for the subscription — what happens when this
  // resource is destroyed:
  //   ""        -- same as "DELETE" (provider default)
  //   "DELETE"  -- the subscription is deleted; its unacknowledged
  //                backlog is lost immediately
  //   "PREVENT" -- destroy FAILS; protects a consumer whose backlog
  //                must never be silently dropped
  //   "ABANDON" -- the subscription is removed from management but keeps
  //                accumulating and serving messages in GCP
  string deletion_policy = 19 [(buf.validate.field).cel = {
    id: "valid_deletion_policy"
    message: "deletion_policy must be one of: DELETE, PREVENT, ABANDON"
    expression: "this == '' || this in ['DELETE', 'PREVENT', 'ABANDON']"
  }];
}
