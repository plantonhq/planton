# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcppubsubsubscription
spec:
  gcp:
    groups:
      - purpose: EnablePubSubApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling pubsub.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageSubscription
        permissions:
          - pubsub.subscriptions.create
          - pubsub.subscriptions.get
          - pubsub.subscriptions.update
          - pubsub.subscriptions.delete
        provenance: derived
        notes: Covers google_pubsub_subscription -- create, read/refresh, in-place updates (ack deadline, retention, expiration, dead-letter and retry policies, delivery configs, transforms, labels are mutable; subscription_name, topic, filter, and ordering changes replace), and destroy. Delivery-side prerequisites are granted to Google's agents, not the deployer -- the Pub/Sub service agent (or a configured service_account_email) needs write access on the BigQuery table or Cloud Storage bucket for export delivery, and for dead-lettering it needs Subscriber on this subscription plus Publisher on the dead-letter topic -- or delivery fails after a successful deploy.
      - purpose: AttachToTopic
        permissions:
          - pubsub.topics.attachSubscription
        provenance: derived
        notes: A service-side check, not a module API call -- creating a subscription authorizes pubsub.topics.attachSubscription on the topic it consumes from, which lives in ANOTHER project in cross-project setups (the subscription's project alone is not enough). Grant it on the topic's project.
      - purpose: ActAsPushIdentity
        permissions:
          - iam.serviceAccounts.actAs
        provenance: derived
        condition:
          spec_field_set: push_config.oidc_token
        notes: The spec contract documents that the caller must hold iam.serviceAccounts.actAs on the token-minting service account push_config.oidc_token names, the standard guard against privilege escalation through another identity. Grant it on that specific service account, not project-wide.
      - purpose: ApplyResourceManagerTags
        permissions:
          - pubsub.subscriptions.createTagBinding
          - resourcemanager.tagValueBindings.create
        provenance: derived
        condition:
          spec_field_set: resource_manager_tags
        notes: Attaching a tag at create time authorizes on both sides, the binding on the subscription and the use of each named tag value (tag values are org-level resources, so the tagValueBindings grant lives there). Tags bind at create time only; a tag change replaces the subscription and loses its backlog, re-running these checks.
