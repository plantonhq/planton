# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: gcppubsubsubscription
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every message Pub/Sub holds for this subscription -- backlog, retained acked messages -- is encrypted at rest with Google-managed keys unconditionally; no switch exists to store messages unencrypted.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Customer-managed encryption for message storage is configured on the TOPIC (its kms_key_name field) -- the subscription exposes no key surface of its own, and messages it holds are covered by the topic's key choice.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Pull consumption rides Google's TLS-terminated APIs (HTTPS/gRPC), and push delivery refuses plaintext by contract -- the spec requires push_endpoint to be an HTTPS URL, so no delivery path can downgrade to cleartext.
    - control_id: no-public-access
      status: not_applicable
      notes: A subscription has no network endpoint to expose -- it is an API resource reachable only through authenticated, IAM-authorized Pub/Sub calls. Push delivery SENDS to an endpoint the consumer owns; that endpoint's exposure is the consumer component's posture.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network ingress exists to restrict -- who may consume is an IAM question (see rbac), and what arrives is decided by the topic and the filter, not a network perimeter.
    - control_id: edge-protection
      status: not_applicable
      notes: No web-facing surface exists for a WAF to front. A push consumer's HTTPS endpoint may warrant one, but that protection attaches to the consumer service, not to this resource.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Both planes are IAM-governed unconditionally -- management mutations authorize against pubsub.subscriptions create/update/delete, and consuming authorizes against pubsub.subscriptions.consume per subscription, grantable per-principal at subscription granularity.
      notes: Consumer identity is the admission model -- grant roles/pubsub.subscriber on exactly the subscriptions a workload drains. Cross-project billing and authorization follow the subscription's project.
    - control_id: workload-identity
      status: configurable
      field_path: push_config.oidc_token
      evidence:
        type: spec_default
        reference: Without oidc_token (the default), push requests arrive unauthenticated and the endpoint must allow anonymous calls. With it, Pub/Sub mints a short-lived signed OIDC JWT as the configured service account for every request -- keyless, expiring, verifiable identity instead of a shared secret.
      notes: Preset 02 is the canonical pattern -- a push-invoker service account holding run.invoker on the consumer Cloud Run service. BigQuery and Cloud Storage delivery likewise write as a service account (or Google's Pub/Sub service agent), never with static keys.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The subscription carries no authentication protocol of its own to harden -- all access rides IAM-authorized Google API calls, and push authentication is the OIDC path assessed under workload-identity.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Subscription create, update, delete, and IAM policy changes land in Cloud Audit Logs (Admin Activity) unconditionally; Admin Activity logging cannot be disabled.
      notes: Per-message consume visibility is Data Access audit logging, a project-level configuration outside this spec.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Pub/Sub exports subscription metrics -- backlog size, oldest unacknowledged message age, delivery and ack rates -- to Cloud Monitoring automatically with no configuration on the resource; these are the canonical consumer-health alerting signals.
      notes: dead_letter_policy adds a structural failure signal -- poison messages surface on the DLQ topic instead of silently cycling, and the DLQ's own metrics make failures observable (preset 04).
    - control_id: backup-recovery
      status: configurable
      field_path: retain_acked_messages
      evidence:
        type: spec_default
        reference: False (the default) means an acknowledged message is gone from this subscription. True keeps acked messages in the backlog for the retention window, and a seek operation rewinds the subscription to any timestamp within it -- replay as the recovery path after a consumer bug.
      notes: Preset 04 pairs 14-day acked retention with exactly-once delivery for a payments consumer. Topic-level retention (on the topic component) provides the same replay for ALL subscriptions at lower cost; this field is the per-consumer lever.
    - control_id: backup-retention-policy
      status: configurable
      field_path: message_retention_duration
      evidence:
        type: spec_validation
        reference: The retention window is an explicit duration from 600s (10 minutes) to 2678400s (31 days), default 7 days -- organizational replay policy is set directly, and Google enforces the bounds at the API.
      notes: The window governs both unacked backlog and (with retain_acked_messages) how far back a seek can rewind; longer windows bill message storage per GiB-month.
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Pub/Sub persists and serves the subscription's messages from multiple zones as part of the managed service -- no single-zone failure mode exists, and no configuration on the resource can reduce durability below that.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Empty defaults to DELETE (the subscription is removed and its unacknowledged backlog is lost immediately); PREVENT makes destroy fail outright -- the guard for a consumer whose backlog must never be silently dropped; ABANDON unmanages the subscription while it keeps accumulating and serving messages.
      notes: A second, quieter deletion path exists -- expiration_policy auto-deletes a subscription after 31 days of inactivity by default; set its ttl to "" for a subscription that must survive idle periods. PREVENT does not stop service-side expiration, so both levers matter for critical consumers.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Pub/Sub is a fully managed service -- Google operates and patches the brokers, storage, and delivery infrastructure invisibly, and the resource exposes no version, runtime, or maintenance channel to manage.
