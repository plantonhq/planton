apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpkmskey
spec:
  # Proven live on both engines (2026-11-19): an HSM key with a 90-day
  # rotation, deployed, given a longer rotation and a label in place, and
  # destroyed by an identity holding only this kind's permissions manifest,
  # with the re-plan clean and the update judged in place from Google's audit
  # log; initial_version_name reads back. Cloud KMS never deletes a key:
  # destroy schedules its versions for destruction.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
