syntax = "proto3";

package dev.planton.gcp.gcpkmskey.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpkmskey/v1alpha1/outputs.proto";
import "catalog/gcp/gcpkmskey/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-kms-key
message GcpKmsKey {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpKmsKey'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpKmsKeySpec spec = 4 [(buf.validate.field).required = true];
  GcpKmsKeyStatus status = 5;
}

message GcpKmsKeyStatus {
  GcpKmsKeyOutputs outputs = 1;
}
