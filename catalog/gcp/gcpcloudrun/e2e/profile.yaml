apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpcloudrun
spec:
  # Proven live on both engines (2026-11-20): a public minimal service and one
  # reading a stored secret, each deployed, an env var changed in place
  # (UpdateService in Google's audit log, a new revision) and destroyed by an
  # identity holding only this kind's permissions manifest, with the re-plan
  # clean. The Terraform resource keeps the revision that was ready when its
  # plan was made, so the revision output reads the service after the apply.
  tier: 1
  #
  # Awaiting re-proof: the service gained sandbox templates with a supervisor
  # container (sandboxes.templates + sandbox_launcher) and Resource Manager
  # tags; the earlier live proof predates them. Live proof of the sandbox arm
  # needs an image the sandbox feature accepts and tags need org-level
  # tagKeys/tagValues (the standing org-fixture unblock condition); the
  # committed scenarios stay on the proven shape, so the next proof confirms
  # the untouched shape still re-plans clean and records what the rendered
  # arms can only prove offline.
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
