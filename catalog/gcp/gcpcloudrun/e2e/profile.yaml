apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpcloudrun
spec:
  # The minimal scenario is a leaf public service (~3-5 minutes per engine).
  #
  # Direct VPC egress is deliberately NOT covered by a live scenario: GCP
  # holds a serverless address reservation in the subnetwork for 1-2 HOURS
  # after the service is destroyed (documented Cloud Run behavior), so an
  # ephemeral create -> verify -> destroy cycle cannot tear its subnetwork
  # down without orphaning it. The direct-VPC surface is offline-proven
  # (spec tests + the hack manifest through `planton tofu plan`).
  #
  # Deploy-from-source (build_config), IAP, and multi-region are
  # offline-proven only: source deploys need a staged GCS source archive,
  # IAP needs an OAuth consent screen, and multi-region needs the global
  # endpoint -- each is an arm the proof lane designs live or records as a
  # deferral with its unblock condition.
  tier: 1
  #
  # Awaiting re-proof: the service gained sandbox templates with a supervisor
  # container (sandboxes.templates + sandbox_launcher) and Resource Manager
  # tags; the earlier live proof predates them. Live proof of the sandbox arm
  # needs an image the sandbox feature accepts and tags need org-level
  # tagKeys/tagValues (the standing org-fixture unblock condition); the
  # committed scenarios stay on the proven shape, so the next proof confirms
  # the untouched shape still re-plans clean and records what the rendered
  # arms can only prove offline.
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 30
