# Minimal GcpCloudRun scenario: a public hello service — the smallest useful
# Cloud Run deployment, exercising the container/port/resources core, the
# public-invoker IAM grant, scale-to-zero, the startup CPU boost, a
# readiness probe (traffic-gating without restart), service and revision
# annotations, the service-wide scaling max, and the explicit teardown
# policy. project_id is deliberately omitted (ambient project). Cloud Run
# service names are project-scoped with no soft-delete reservation, so the
# name stays fixed. deletion_protection must be false so DESTROY can run.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudRun
metadata:
  name: planton-oss-e2e-cldrun-minimal
  id: planton-oss-e2e-cldrun-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcloudrun
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-central1
  annotations:
    planton-e2e/arm: service-annotations
  revisionAnnotations:
    planton-e2e/arm: revision-annotations
  containers:
    - image: us-docker.pkg.dev/cloudrun/container/hello:latest
      ports:
        containerPort: 8080
      resources:
        cpu: "1"
        memory: 512Mi
        startupCpuBoost: true
      readinessProbe:
        periodSeconds: 10
        httpGet:
          path: /
  scaling:
    minInstanceCount: 0
    maxInstanceCount: 2
  serviceScaling:
    maxInstanceCount: 4
  allowUnauthenticated: true
  ingress: INGRESS_TRAFFIC_ALL
  executionEnvironment: EXECUTION_ENVIRONMENT_GEN2
  deletionProtection: false
  deletionPolicy: DELETE
