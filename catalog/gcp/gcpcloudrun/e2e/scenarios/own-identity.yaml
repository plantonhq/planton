# GcpCloudRun own-identity scenario: the shape a service gets when it is
# registered with its own runtime identity and made public without an allUsers
# grant. The GcpServiceAccount prerequisite is created immediately before the
# service, which runs as it through a reference (status.outputs.email), so the
# lane proves a just-created identity is usable on the service's first create.
# invoker_iam_disabled switches Cloud Run's Invoker IAM check off -- the public
# form domain-restricted sharing accepts -- and the identity holds exactly the
# kind's permissions manifest, so the lane also proves that manifest covers
# the setting. deletion_protection must be false so DESTROY can run.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudRun
metadata:
  name: planton-oss-e2e-cldrun-own-identity
  id: planton-oss-e2e-cldrun-own-identity
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcloudrun
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-prerequisites: "GcpServiceAccount"
  tags:
    - planton-e2e
spec:
  serviceName: planton-oss-e2e-cldrun-oi-${E2E_RUN_ID} # per kind and engine, so lanes side by side never share it
  region: us-central1
  serviceAccount:
    valueFrom:
      kind: GcpServiceAccount
      name: planton-oss-e2e-gsa-prereq
      fieldPath: status.outputs.email
  containers:
    - image: us-docker.pkg.dev/cloudrun/container/hello:latest
      ports:
        containerPort: 8080
      resources:
        cpu: "1"
        memory: 512Mi
  scaling:
    minInstanceCount: 0
    maxInstanceCount: 1
  invokerIamDisabled: true
  ingress: INGRESS_TRAFFIC_ALL
  deletionProtection: false
  deletionPolicy: DELETE
