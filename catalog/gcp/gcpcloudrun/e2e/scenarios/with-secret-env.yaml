# GcpCloudRun secret-value scenario: the minimal public service plus one
# literal variable and one secret_value variable. The module must create the
# variable's Secret Manager secret (replicated in us-central1), store the
# value as a version, grant the project's Compute Engine default service
# account secretAccessor on that secret alone (no service_account is set),
# and point the variable at the stored version -- the revision carries a
# secret key reference, never the value. Destroy removes the secret with the
# service. The value is a literal because this lane runs without a platform;
# on Planton the field takes only a $secret/ reference.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudRun
metadata:
  name: planton-oss-e2e-cldrun-secret-env
  id: planton-oss-e2e-cldrun-secret-env
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpcloudrun
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-central1
  annotations:
    planton-e2e/arm: service-annotations
  revisionAnnotations:
    planton-e2e/arm: revision-annotations
  containers:
    - image: us-docker.pkg.dev/cloudrun/container/hello:latest
      env:
        - name: LOG_LEVEL
          value: info
        - name: E2E_TOKEN
          secretValue: e2e-not-a-real-secret
      ports:
        containerPort: 8080
      resources:
        cpu: "1"
        memory: 512Mi
        startupCpuBoost: true
      readinessProbe:
        periodSeconds: 10
        httpGet:
          path: /
  scaling:
    minInstanceCount: 0
    maxInstanceCount: 2
  serviceScaling:
    maxInstanceCount: 4
  allowUnauthenticated: true
  ingress: INGRESS_TRAFFIC_ALL
  executionEnvironment: EXECUTION_ENVIRONMENT_GEN2
  deletionProtection: false
  deletionPolicy: DELETE
