# Development manifest for GcpCloudRun — exercises a broad slice of the spec
# (sidecar with startup ordering, secret env, Cloud SQL volume, all three
# probe types, scaling with the service-wide max, traffic split, direct VPC
# egress, annotations at both object levels, sub_path mounts, and the
# teardown policy) for offline plan verification.
#
# Usage: planton tofu plan --manifest catalog/gcp/gcpcloudrun/e2e/manifest.yaml
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudRun
metadata:
  name: hack-cloud-run
  id: cldrun-hack-001
  org: planton-dev
  env: dev
spec:
  # project_id omitted: the service lands in the provider's default project.
  region: us-central1
  serviceName: hack-api
  description: Development service exercising the full template surface
  labels:
    team: platform
  annotations:
    external-tool/owner: platform-team
  revisionLabels:
    cost-center: "1234"
  revisionAnnotations:
    external-tool/trace: enabled
  containers:
    - name: app
      image: us-docker.pkg.dev/cloudrun/container/hello:latest
      env:
        - name: LOG_LEVEL
          value: debug
        - name: DB_PASSWORD
          valueFromSecret:
            secret: hack-db-password
            version: latest
        # A Planton secret: the component keeps it in a Secret Manager
        # secret of its own, readable only by the runtime identity.
        - name: API_TOKEN
          secretValue: $secret/hack-api-token
      ports:
        containerPort: 8080
      resources:
        cpu: "1"
        memory: 512Mi
        startupCpuBoost: true
      volumeMounts:
        - name: cloudsql
          mountPath: /cloudsql
        - name: assets
          mountPath: /media
          subPath: static
      startupProbe:
        periodSeconds: 5
        httpGet:
          path: /
      livenessProbe:
        httpGet:
          path: /
      readinessProbe:
        periodSeconds: 10
        httpGet:
          path: /
      dependsOn:
        - collector
    - name: collector
      image: us-docker.pkg.dev/cloudrun/container/hello:latest
  volumes:
    - name: cloudsql
      cloudSqlInstance:
        instances:
          - value: my-project:us-central1:hack-db
    - name: assets
      gcs:
        bucket:
          value: hack-assets-bucket
        readOnly: true
        mountOptions:
          - implicit-dirs
          - only-dir=media
  scaling:
    minInstanceCount: 0
    maxInstanceCount: 10
  serviceScaling:
    maxInstanceCount: 20
  maxInstanceRequestConcurrency: 80
  timeoutSeconds: 300
  executionEnvironment: EXECUTION_ENVIRONMENT_GEN2
  sessionAffinity: true
  vpcAccess:
    networkInterfaces:
      - network:
          value: hack-vpc
        subnetwork:
          value: hack-subnet
        tags:
          - cloud-run-egress
    egress: PRIVATE_RANGES_ONLY
  ingress: INGRESS_TRAFFIC_ALL
  allowUnauthenticated: true
  traffic:
    - type: TRAFFIC_TARGET_ALLOCATION_TYPE_LATEST
      percent: 100
  deletionProtection: false
  deletionPolicy: DELETE
