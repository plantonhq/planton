# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_cloud_run_v2_service:
    mappings:
      # Renames: the spec says what the field IS, where the provider
      # inherits terser API names.
      - spec: spec.service_name
        arg: name
      - spec: spec.project_id
        arg: project
      - spec: spec.region
        arg: location

      # The spec flattens the provider's revision-template wrapper: the
      # serving surface reads as one level, organized by what it
      # configures instead of where the API nests it. Exact matching
      # resumes below each subtree mapping.
      - spec: spec.containers
        arg: template.containers
      - spec: spec.volumes
        arg: template.volumes
      - spec: spec.vpc_access
        arg: template.vpc_access
      - spec: spec.node_selector
        arg: template.node_selector
      # The sandbox wrapper block is a single-item list around the
      # template list; the spec names the templates directly.
      - spec: spec.sandbox_templates
        arg: template.sandboxes.templates
      # The provider's bare "tags" is the Resource Manager tag map; the
      # spec uses the catalog-wide resource_manager_tags vocabulary.
      - spec: spec.resource_manager_tags
        arg: tags
      - spec: spec.scaling
        arg: template.scaling
      - spec: spec.revision
        arg: template.revision
      - spec: spec.revision_labels
        arg: template.labels
      - spec: spec.revision_annotations
        arg: template.annotations
      - spec: spec.service_account
        arg: template.service_account
      - spec: spec.execution_environment
        arg: template.execution_environment
      - spec: spec.max_instance_request_concurrency
        arg: template.max_instance_request_concurrency
      - spec: spec.timeout_seconds
        arg: template.timeout
      - spec: spec.session_affinity
        arg: template.session_affinity
      - spec: spec.encryption_key
        arg: template.encryption_key
      - spec: spec.gpu_zonal_redundancy_disabled
        arg: template.gpu_zonal_redundancy_disabled
      - spec: spec.health_check_disabled
        arg: template.health_check_disabled

      # The service-level scaling block (across ALL revisions) is the root
      # `scaling` argument -- distinct from the per-revision
      # template.scaling above.
      - spec: spec.service_scaling
        arg: scaling

      # The env oneof's secret arm names what it does; the provider nests
      # the same shape one level deeper.
      - spec: spec.containers.env.value_from_secret
        arg: template.containers.env.value_source.secret_key_ref

      # The provider models CPU/memory as one limits map; the spec keeps
      # the two honest fields -- both argument sides land on the map.
      - spec: spec.containers.resources.cpu
        arg: template.containers.resources.limits
      - spec: spec.containers.resources.memory
        arg: template.containers.resources.limits
    exclusions:
      # The provider schema mirrors the API's shared Probe message, but
      # Cloud Run itself rejects TCP liveness probes (liveness supports
      # HTTP and gRPC only) -- the spec deliberately has no TCP arm on
      # liveness, encoding the API truth the schema misses.
      - arg: template.containers.liveness_probe.tcp_socket.port
        reason: >-
          Cloud Run rejects TCP liveness probes (liveness supports HTTP
          and gRPC only); the schema exposes the arm only because the API
          proto shares one Probe message across probe types

      # Same class, readiness flavor: the provider models a readiness
      # success_threshold ("Defaults to 2"), but the GA v2 API's probe
      # message carries no such field (verified live 2026-08-11 against
      # the discovery document) -- the control plane silently drops the
      # value, so any explicit setting is a perpetual re-plan diff. The
      # spec deliberately has no such field; re-admission is
      # single-success by API design.
      - arg: template.containers.readiness_probe.success_threshold
        reason: >-
          the GA Run v2 API's probe message has no successThreshold (the
          live control plane silently drops the provider-modeled value,
          leaving a perpetual re-plan diff caught by the apply-idempotency
          gate); re-admission is single-success by API design

      # API-client telemetry strings with no user-facing behavior.
      - arg: client
        reason: >-
          API-client telemetry label (which tool created the resource);
          no user-facing behavior
      - arg: client_version
        reason: >-
          API-client telemetry version accompanying client; no
          user-facing behavior

  google_cloud_run_v2_service_iam_member:
    # Instantiated by the allow_unauthenticated toggle: the boolean IS the
    # allUsers invoker grant -- every argument is wired by the module.
    mappings:
      - spec: spec.allow_unauthenticated
        arg: member
    exclusions:
      - arg: role
        reason: >-
          fixed to roles/run.invoker -- the public-serving semantics of
          the allow_unauthenticated toggle, never user surface
      - arg: name
        reason: wired by the module to the service it creates -- never user surface
      - arg: location
        reason: wired by the module to the service it creates -- never user surface
      - arg: project
        reason: wired by the module to the service it creates -- never user surface
      - arg: condition.title
        reason: >-
          the public grant is unconditioned by design; conditioned
          invoker grants to specific identities are IAM-family territory
      - arg: condition.expression
        reason: the public grant is unconditioned by design; see condition.title
      - arg: condition.description
        reason: the public grant is unconditioned by design; see condition.title

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables run.googleapis.com
      with fixed arguments (disable_on_destroy false so destroying one
      service never disables the API project-wide); not spec surface.

  # One secret per env[].secret_value: the module creates it, stores the
  # value as a version, and grants the runtime identity read access to that
  # secret alone. Only the value itself is spec surface.
  google_secret_manager_secret:
    internal: >-
      created by the module per env[].secret_value -- its id
      (runjob/run, region, service, container, variable), user-managed
      replication in the service's region(s), and attribution labels are all
      derived from the service, never authored.
  google_secret_manager_secret_iam_member:
    internal: >-
      the roles/secretmanager.secretAccessor grant on each stored secret
      for the service's runtime identity (its service account, else the
      project's Compute Engine default) -- derived, never authored.
  google_secret_manager_secret_version:
    specRoot: spec.containers.env
    mappings:
      - spec: spec.containers.env.secret_value
        arg: secret_data
    exclusions:
      - arg: secret
        reason: the module's own secret for this variable (derived), never authored
      - arg: project
        reason: follows the service's project through the secret it belongs to
      - arg: enabled
        reason: a stored value is always the enabled version the variable is pinned to
      - arg: is_secret_data_base64
        reason: the stored value is the variable's text as resolved, never base64-encoded
      - arg: secret_data_wo
        reason: write-only arm of secret_data; the module pins the variable to the stored version, which needs the version resource's own lifecycle
      - arg: secret_data_wo_version
        reason: companion of the unused write-only arm (see secret_data_wo)
      - arg: deletion_policy
        reason: a replaced or removed version is deleted (the provider default) -- the copy is derived, and a disabled or abandoned version would outlive the value's source
