# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpcloudrun
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Everything the service stores -- the deployed container image copy, revision configuration, and secret references (including the Secret Manager secrets the module creates for secret_value variables) -- is encrypted at rest with Google-managed keys without configuration, per Google Cloud's default encryption at rest. The instances themselves are stateless; durable data lives on the components the code writes to.
    - control_id: enc-at-rest-cmk
      status: configurable
      field_path: encryption_key
      evidence:
        type: spec_default
        reference: Unset (the default) leaves the deployed container image under Google-managed keys; naming a Cloud KMS key (or referencing a GcpKmsKey resource) encrypts it with the customer-managed key instead. The key must live in the service's region and the Cloud Run service agent needs encrypter/decrypter on it.
      notes: No preset enables CMEK. It covers the image copy Cloud Run deploys; data the code writes elsewhere is keyed by those components.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The service's run.app endpoint (and any tagged preview URL) serves HTTPS only -- Google's front end terminates TLS and there is no plaintext listener to expose. Traffic from the front end to the instance rides Google's encrypted infrastructure.
      notes: Whether the code encrypts its own outbound calls is the workload's affair; direct VPC egress traffic inherits Google's network-layer encryption across physical boundaries.
    - control_id: no-public-access
      status: configurable
      field_path: ingress
      evidence:
        type: spec_default
        reference: The default (INGRESS_TRAFFIC_ALL) accepts traffic from the public internet, subject to the IAM invoker check; INGRESS_TRAFFIC_INTERNAL_ONLY removes internet reachability entirely -- only VPC-internal sources, Pub/Sub push, and Eventarc reach the service. default_uri_disabled additionally removes the run.app front door.
      notes: The 02-private-vpc-service preset sets INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER and keeps IAM authentication on; 01-public-api-service deliberately serves the public internet with allow_unauthenticated. Note the two layers are independent -- a service with ingress ALL but allow_unauthenticated false is network-reachable yet rejects anonymous callers at the IAM check.
    - control_id: restricted-ingress
      status: configurable
      field_path: ingress
      evidence:
        type: spec_default
        reference: The ingress enum restricts inbound traffic to declared network source classes -- INTERNAL_ONLY (VPC, internal load balancers, Pub/Sub, Eventarc) or INTERNAL_LOAD_BALANCER (internal plus Cloud Load Balancing). The default ALL accepts every path.
      notes: Source-IP or geography scoping finer than these classes lives on a Cloud Armor policy attached to the composed load balancer -- separate resources fronting the service.
    - control_id: edge-protection
      status: not_applicable
      notes: A Cloud Run service has no WAF attachment point of its own; Cloud Armor policies attach to the external load balancer composed in front of it (serverless NEG, backend service, URL map). iap_enabled puts Google's managed login wall before requests, which is authentication, not request filtering.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Management-plane operations (deploy, update, delete, traffic shifts) authorize against Cloud Run IAM roles unconditionally, and every request to the endpoint passes the IAM run.routes.invoke check unless the spec explicitly opens it -- allow_unauthenticated grants invoker to allUsers THROUGH IAM, and invoker_iam_disabled switches the check off, both deliberate opt-ins the proto refuses to combine.
    - control_id: workload-identity
      status: configurable
      field_path: service_account
      evidence:
        type: spec_default
        reference: Revisions authenticate to Google APIs as the spec's service account through short-lived credentials from the metadata server -- no static key is ever provisioned. Unset defaults to the project's Compute Engine default service account; naming a dedicated GcpServiceAccount is the least-privilege posture.
      notes: The 02-private-vpc-service preset pins a dedicated runtime identity; the default compute account is broader than any single service needs.
    - control_id: no-legacy-auth
      status: configurable
      field_path: invoker_iam_disabled
      evidence:
        type: spec_default
        reference: False (the default) keeps every request under the IAM invoker check -- the only authentication path the platform offers. True disables the check entirely, the org-policy escape hatch for environments that forbid allUsers grants; the weaker path exists only as this explicit opt-in.
      notes: No preset disables the invoker check. The service exposes no other legacy authentication surface -- runtime credentials are exclusively the metadata server's short-lived tokens.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Service create, update, delete, and IAM policy changes land in Cloud Audit Logs (Admin Activity) unconditionally; Admin Activity logging cannot be disabled. Per-request Data Access logging for run.app invocations is an audit-config choice on the project, outside this spec.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Cloud Run exports request count, latencies, instance count, and billable instance time to Cloud Monitoring and streams container stdout/stderr to Cloud Logging for every service without configuration.
    - control_id: backup-recovery
      status: not_applicable
      notes: The service is declarative configuration fully re-creatable from the manifest, and revisions are immutable snapshots Cloud Run retains for rollback. Instances are stateless -- whatever data the code produces lives in the systems it writes to, backed up there.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain -- see backup-recovery.
    - control_id: multi-zone-ha
      status: configurable
      field_path: gpu_zonal_redundancy_disabled
      evidence:
        type: spec_default
        reference: False (the default) keeps instances -- GPU included -- zonally redundant across the region; true opts a GPU service into single-zone capacity, trading zonal-failure tolerance for cheaper GPUs. Non-GPU services run on Cloud Run's regional infrastructure with no placement choice exposed.
      notes: The 03-gpu-inference preset disables zonal redundancy deliberately -- a stated preproduction trade-off. multi_region_settings extends availability past zones to whole regions (one service identity serving from several).
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_protection
      evidence:
        type: spec_default
        reference: Defaults to true (matching GCP's posture) -- a destroy fails until deletion_protection is explicitly set to false, so removing a service and its revisions is always a two-step, deliberate act.
      notes: The 01-public-api-service preset opts out for disposable experiments. deletion_policy adds an engine-side second layer -- PREVENT fails any destroying plan outright, ABANDON unmanages the service while it keeps serving in GCP.
    - control_id: managed-patching
      status: configurable
      field_path: build_config.enable_automatic_updates
      evidence:
        type: spec_default
        reference: For deploy-from-source services, true has Google patch the OS and runtime layers of the running image (paired with containers.base_image_uri) without a redeploy; unset leaves the image pinned as built. Services deploying a prebuilt image -- every catalog preset -- own their image contents and patch by rebuilding through the pipeline that owns the image.
      notes: The execution sandbox (GEN1/GEN2) is Google's infrastructure, patched invisibly as part of the platform either way.
