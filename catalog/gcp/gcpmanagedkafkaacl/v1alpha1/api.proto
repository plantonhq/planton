syntax = "proto3";

package dev.planton.gcp.gcpmanagedkafkaacl.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpmanagedkafkaacl/v1alpha1/outputs.proto";
import "catalog/gcp/gcpmanagedkafkaacl/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-managed-kafka-acl
message GcpManagedKafkaAcl {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpManagedKafkaAcl'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpManagedKafkaAclSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpManagedKafkaAclStatus status = 5;
}

//gcp-managed-kafka-acl status
message GcpManagedKafkaAclStatus {
  //stack-outputs
  GcpManagedKafkaAclStackOutputs outputs = 1;
}
