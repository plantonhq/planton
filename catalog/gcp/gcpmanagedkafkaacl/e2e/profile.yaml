apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpmanagedkafkaacl
spec:
  # Proven live on both engines (2026-11-21), as an identity holding only this
  # kind's permissions manifest: an ACL on one topic pattern of a run-scoped
  # Kafka cluster fixture, with ALLOW entries for a producer and a consumer
  # and a DENY for a third principal, deployed, re-planned clean, and
  # destroyed; one more entry changed it in place (ManagedKafka.UpdateAcl),
  # judged from Google's Admin Activity log. Kafka principals that name no
  # existing service account are accepted. A DENY on User:* would deny the
  # ACL's own principals too, since DENY wins in Kafka.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 120
