# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpmanagedkafkaacl
spec:
  gcp:
    api_enabled_by:
      - GcpManagedKafkaCluster
    groups:
      - purpose: ManageAcl
        permissions:
          - managedkafka.acls.create
          - managedkafka.acls.get
          - managedkafka.acls.update
          - managedkafka.acls.delete
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_managed_kafka_acl (Pulumi managedkafka.Acl) -- created, its entries patched, read on every refresh, deleted. Names grounded in Google's Managed Kafka roles page; roles/managedkafka.admin contains all four. Proven 2026-11-21 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
