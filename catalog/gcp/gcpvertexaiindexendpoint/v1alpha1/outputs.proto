syntax = "proto3";

package dev.planton.gcp.gcpvertexaiindexendpoint.v1alpha1;

// Outputs produced after provisioning a GCP Vertex AI Vector Search
// index endpoint.
message GcpVertexAiIndexEndpointOutputs {
  // Fully qualified index endpoint resource path — the value a
  // GcpVertexAiDeployedIndex passes as its `index_endpoint` reference.
  // Format: projects/{project}/locations/{location}/indexEndpoints/{id}
  string index_endpoint_id = 1;

  // The GCP-assigned numeric index endpoint ID (the last path segment
  // of index_endpoint_id).
  string index_endpoint_name = 2;

  // Domain name for querying deployed indexes over the public internet.
  // Populated only when public_endpoint_enabled is true.
  string public_endpoint_domain_name = 3;

  // RFC3339 timestamp of when the index endpoint was created.
  string create_time = 4;

  // RFC3339 timestamp of when the index endpoint was last updated.
  string update_time = 5;
}
