apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpcloudcomposeruserworkloadssecret
spec:
  # Composed scenario: the chain installs a full Composer 3 environment
  # (25-45 minutes) before delivering the Secret, so a batch run for both
  # engines needs >=240m. The Secret itself creates/destroys in seconds.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]  # live-proven 2026-08-12: full lifecycle + apply-idempotency on both engines
  timeout_minutes: 240
