# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: gcpcloudcomposeruserworkloadssecret
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The Secret's material lives in the Composer environment's managed GKE control-plane storage, which Google encrypts at rest by default -- there is no unencrypted storage tier for credential material to land on.
      notes: The spec adds handling discipline on top of storage encryption -- the data field is sensitive-annotated (held as secrets in IaC state, redacted in plans, never placed in outputs) and CEL-validated as base64 so raw credentials cannot be pasted in by accident.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No customer-managed-key choice exists on a user-workloads Secret; the CMEK decision covering the environment's data is made on the GcpCloudComposerEnvironment itself.
    - control_id: enc-in-transit
      status: not_applicable
      notes: A Secret terminates no connections -- it is delivered through the TLS-only Composer API and consumed inside the environment's cluster; no client-facing transport setting exists here.
    - control_id: no-public-access
      status: not_applicable
      notes: A Secret is not network-addressable -- it has no endpoint, only the Composer management API governed by IAM. Network exposure belongs to the parent environment.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No inbound network path exists to restrict (see no-public-access).
    - control_id: edge-protection
      status: not_applicable
      notes: A Kubernetes Secret has no Layer-7 entry point for a WAF to front.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Reading and mutating the Secret goes through the Composer API, which IAM governs with a dedicated permission family (composer.userworkloadssecrets.*) -- there is no unauthenticated path to the credential material, and inside the cluster Composer scopes it to the user-workloads namespace.
      notes: Least privilege matters more here than on the sibling ConfigMap -- a principal holding the secrets permissions can read credential material, so grant them separately from broader Composer administration where possible.
    - control_id: workload-identity
      status: not_applicable
      notes: This object IS stored-credential delivery -- the deliberate escape hatch for systems that only speak passwords and tokens (database logins, third-party APIs). Keyless identity for GCP APIs belongs to the environment's service account; where a GCP service supports IAM auth, prefer that over a secret entry here.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication path of its own exists to retire -- access to the object is IAM-authenticated Composer API access; the strength of the credentials INSIDE it is a property of the systems they belong to.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Creating, updating, or deleting the Secret lands in Cloud Audit Logs as project-level posture; which DAG used which credential is visible only in the parent environment's Airflow task logs.
    - control_id: monitoring-integration
      status: not_applicable
      notes: Composer publishes metrics on environment and Airflow dimensions; a Secret has no metric dimension and no export knob.
    - control_id: backup-recovery
      status: not_applicable
      notes: The Secret holds no data beyond what the manifest (or its secret store) declares -- it is re-creatable from that source at any time; GCP is deliberately not the system of record for the material.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist at the Secret level to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: A Secret is stored in the environment's managed control plane with no zonal footprint of its own -- resilience is the parent environment's sizing and resilience mode.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Unset means DELETE -- destroy removes the Kubernetes Secret from the environment and DAGs consuming it start failing; PREVENT makes any destroying plan fail -- protection for credentials live pipelines depend on; ABANDON removes it from management while it stays (and keeps authenticating) in the cluster.
      notes: Neither preset sets it.
    - control_id: managed-patching
      status: not_applicable
      notes: A Secret is pure configuration on a fully managed service -- there is no software of its own to patch.
