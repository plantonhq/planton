# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpmodelarmortemplate
spec:
  gcp:
    groups:
      - purpose: EnableModelArmorApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
        provenance: derived
        notes: Covers google_project_service enabling modelarmor.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageTemplate
        permissions:
          - modelarmor.templates.create
          - modelarmor.templates.get
          - modelarmor.templates.update
          - modelarmor.templates.delete
        provenance: derived
        notes: Covers google_model_armor_template (Pulumi modelarmor.Template) -- created with templateId, patched with an update mask over filter_config, template_metadata, and labels, read on every refresh. roles/modelarmor.admin contains all four.
