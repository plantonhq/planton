apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpmonitoringslo
spec:
  # Two live scenarios on the custom-service arm: minimal (request-based
  # good/total ratio, rolling 30d) and calendar-distribution
  # (distribution cut + calendar MONTH). PROVEN live 4/4 lanes (both
  # scenarios x both engines), IDEMPOTENCY clean. LIVE-CAUGHT API truth
  # landed on the spec/GUIDE: every SLO filter must parse to exactly ONE
  # monitored resource type — pin resource.type alongside metric.type or
  # the create is rejected (Error 400 "parses to N resource types and
  # must parse to 1"); filters are otherwise validated syntactically at
  # create, so no live metric streams are needed.
  # OFFLINE-PROVEN-ONLY arms (recorded): the basic_service (generic
  # service) arm — GCP validates service_type + labels server-side and
  # the test tenant carries no auto-detectable workload — and the
  # windows_based SLI family, which needs live metric streams to
  # evaluate; both are exercised as offline plan arms with every field
  # RENDERED. Unblock: a Cloud Run fixture chain for basic_service; a
  # metric-producing workload for windows arms.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
