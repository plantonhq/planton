# The second act of minimal.yaml: the same policy with its rule no longer
# enforcing, one update of the policy in place. Not a scenario of its own
# (the second-act annotation keeps discovery from running it as a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpOrgPolicy
metadata:
  name: planton-oss-e2e-gcporgp-minimal
  id: planton-oss-e2e-gcporgp-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcporgpolicy
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-second-act: minimal.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
    planton.dev/e2e-required-env: PLANTON_E2E_GCP_ORGANIZATION_ID
  tags:
    - planton-e2e
spec:
  constraint: compute.disableSerialPortAccess
  policy:
    rules:
      - enforce: false
