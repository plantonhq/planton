syntax = "proto3";

package dev.planton.gcp.gcpworkflow.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// GcpWorkflowSpec defines a Cloud Workflows workflow — a serverless
// orchestrator that executes a sequence of steps (HTTP calls, connector
// calls to GCP services, conditionals, retries) defined in YAML or JSON.
// Workflows are the glue between services: an Eventarc trigger fires an
// execution, the workflow calls Cloud Run / BigQuery / Pub/Sub in order,
// handles errors, and records the result.
//
// Every deployment of new source mints a new REVISION; executions started
// before a deploy finish on the revision they started with. The
// revision_id stack output tracks the deployed revision.
message GcpWorkflowSpec {
  // The GCP project to create the workflow in. Can be a literal project ID
  // or a reference to a GcpProject resource. If omitted, the provider's
  // default project is used. Immutable: changing it replaces the workflow.
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];

  // The region the workflow runs in (e.g. us-central1). If omitted, the
  // provider's default region is used. Immutable: changing it replaces the
  // workflow.
  string region = 2;

  // The workflow name in GCP. Defaults to metadata.name when left empty.
  // Immutable: changing it replaces the workflow (a new workflow with a
  // fresh execution history — running executions on the old name are
  // unaffected until it is deleted).
  string workflow_name = 3;

  // What this workflow orchestrates — shown in the console list. At most
  // 1000 unicode characters (the provider's own documented cap).
  string description = 4 [(buf.validate.field).string.max_len = 1000];

  // User labels attached to the workflow (merged with the platform's
  // standard labels by the module).
  map<string, string> labels = 5;

  // The workflow definition — the YAML (or JSON) source executed on each
  // run (https://cloud.google.com/workflows/docs/reference/syntax). The
  // API caps the size at 128KB. REQUIRED: a workflow without source has
  // never been deployable through the API — the provider still marks the
  // argument optional but its own 8.0.0 upgrade note says it "will become
  // REQUIRED ... to align with API constraints"; this spec models the API
  // truth today. Every source change deploys a NEW revision.
  string source_contents = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_bytes = 131072
  ];

  // The service account the workflow's executions run AS — the identity
  // its HTTP calls and connector calls carry (format: bare email; the
  // module renders the projects/{project}/serviceAccounts/{email} form the
  // API stores). A literal email or a reference to a GcpServiceAccount
  // resource. If omitted, the project's default compute service account is
  // used — fine for experiments, wrong for production (grant a dedicated
  // account only the roles the steps need). Changing the service account
  // deploys a NEW revision.
  dev.planton.shared.foreignkey.v1.StringValueOrRef service_account = 7 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpServiceAccount,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.email"
  ];

  // Customer-managed encryption key (CMEK) used to encrypt workflow
  // definitions and execution data at rest. The full crypto key resource
  // name (projects/{p}/locations/{l}/keyRings/{r}/cryptoKeys/{k}) — a
  // literal or a reference to a GcpKmsKey resource. Grant the Workflows
  // service agent roles/cloudkms.cryptoKeyEncrypterDecrypter on the key
  // BEFORE deploying, or the deploy fails. Omit for Google-managed
  // encryption.
  dev.planton.shared.foreignkey.v1.StringValueOrRef crypto_key = 8 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpKmsKey,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_id",
    (dev.planton.shared.foreignkey.v1.candidate) = {
      kind: GcpKmsKey
      field_path: "status.outputs.key_id"
    },
    (dev.planton.shared.foreignkey.v1.candidate) = {
      kind: GcpKmsKeyHandle
      field_path: "status.outputs.kms_key"
    }
  ];

  // How much call detail execution history records:
  //   ""                          -- the API default (errors only)
  //   "CALL_LOG_LEVEL_UNSPECIFIED" -- explicit API default
  //   "LOG_ALL_CALLS"             -- every call and its result (debugging;
  //                                  highest log volume and cost)
  //   "LOG_ERRORS_ONLY"           -- failed calls only
  //   "LOG_NONE"                  -- nothing
  string call_log_level = 9 [(buf.validate.field).cel = {
    id: "valid_call_log_level"
    message: "call_log_level must be one of: CALL_LOG_LEVEL_UNSPECIFIED, LOG_ALL_CALLS, LOG_ERRORS_ONLY, LOG_NONE"
    expression: "this == '' || this in ['CALL_LOG_LEVEL_UNSPECIFIED', 'LOG_ALL_CALLS', 'LOG_ERRORS_ONLY', 'LOG_NONE']"
  }];

  // How much step-level detail execution history keeps:
  //   ""                                    -- the API default (basic)
  //   "EXECUTION_HISTORY_LEVEL_UNSPECIFIED" -- explicit API default
  //   "EXECUTION_HISTORY_BASIC"             -- step names and status
  //   "EXECUTION_HISTORY_DETAILED"          -- step inputs/outputs too
  //                                            (needed for step-level
  //                                            debugging in the console)
  string execution_history_level = 10 [(buf.validate.field).cel = {
    id: "valid_execution_history_level"
    message: "execution_history_level must be one of: EXECUTION_HISTORY_LEVEL_UNSPECIFIED, EXECUTION_HISTORY_BASIC, EXECUTION_HISTORY_DETAILED"
    expression: "this == '' || this in ['EXECUTION_HISTORY_LEVEL_UNSPECIFIED', 'EXECUTION_HISTORY_BASIC', 'EXECUTION_HISTORY_DETAILED']"
  }];

  // Environment variables visible to the workflow source via sys.get_env().
  // Values are written into the workflow revision, where anyone who can
  // view the workflow reads them: configuration only, never a credential
  // -- a credential goes in secret_env_vars. At most 20 entries across
  // user_env_vars and secret_env_vars together (the API's own cap,
  // enforced here); each value up to 4KiB. Keys must be non-empty and must
  // NOT start with "GOOGLE" or "WORKFLOWS" (reserved prefixes the API
  // rejects — key-shape rules live here in the comment because map KEYS
  // are not CEL-addressable). Changing env vars deploys a NEW revision.
  map<string, string> user_env_vars = 11 [(dev.planton.shared.options.secret_home) = "secret_env_vars"];

  // Resource manager tags bound at workflow creation, keyed
  // tagKeys/{tag_key_id} with values tagValues/{tag_value_id} — the
  // org-policy / cost-attribution tag system (distinct from labels).
  // Immutable: changing tags REPLACES the workflow (provider ForceNew) —
  // plan tag changes deliberately.
  map<string, string> resource_manager_tags = 12;

  // Guard rail: while true (the DEFAULT), destroying this resource FAILS
  // before touching the workflow. Set false explicitly to allow destroy.
  // Both IaC engines send the value explicitly on every apply so a
  // true -> false transition always reaches the engine (the
  // send-true-or-omit class would silently keep the guard up).
  optional bool deletion_protection = 13 [(dev.planton.shared.options.default) = "true"];

  // Deletion policy — what happens when this resource is destroyed:
  //   ""        -- same as "DELETE" (provider default)
  //   "DELETE"  -- the workflow and its execution history are deleted;
  //                running executions are cancelled
  //   "PREVENT" -- destroy FAILS (defense in depth alongside
  //                deletion_protection)
  //   "ABANDON" -- the workflow is removed from management but keeps
  //                running in GCP
  string deletion_policy = 14 [(buf.validate.field).cel = {
    id: "valid_deletion_policy"
    message: "deletion_policy must be one of: DELETE, PREVENT, ABANDON"
    expression: "this == '' || this in ['DELETE', 'PREVENT', 'ABANDON']"
  }];

  // Secret values the workflow reads at run time, keyed by environment
  // variable name. Cloud Workflows has no secret field, so the component
  // never puts the value on the workflow: it keeps each one in a Secret
  // Manager secret it owns (id workflow_<region>_<workflow name>_<key>,
  // replicated only in the workflow's region), grants the workflow's
  // runtime identity (service_account, or the project's Compute Engine
  // default service account when unset) secretAccessor on that secret
  // alone, and sets the variable to the version's resource name,
  // projects/<project>/secrets/<id>/versions/<n>. The workflow reads the
  // value through the Secret Manager connector, which returns the payload
  // base64-encoded:
  //
  //   - read_token:
  //       call: googleapis.secretmanager.v1.projects.secrets.versions.access
  //       args:
  //         name: ${sys.get_env("API_TOKEN")}
  //       result: token_version
  //   - decode_token:
  //       assign:
  //         - api_token: ${text.decode(base64.decode(token_version.payload.data))}
  //
  // (The accessString helper returns the decoded string, but takes the
  // secret's short id, version, and project as separate arguments rather
  // than the full name.) A changed value adds a version, which changes the
  // variable and deploys a new revision, so rotation is a deploy;
  // destroying the workflow removes the secrets.
  // The variable itself counts toward the 20-variable cap and carries the
  // same key rules as user_env_vars; a key may not appear in both maps,
  // region must be set (the secrets replicate there), and a literal
  // service_account must name the account by email.
  map<string, string> secret_env_vars = 15 [(dev.planton.shared.options.sensitive) = true];

  option (buf.validate.message).cel = {
    id: "env_vars_max_20"
    message: "user_env_vars and secret_env_vars together accept at most 20 entries (the API cap)"
    expression: "size(this.user_env_vars) + size(this.secret_env_vars) <= 20"
  };
  option (buf.validate.message).cel = {
    id: "secret_env_vars_disjoint"
    message: "a variable is either in user_env_vars or in secret_env_vars, never both"
    expression: "!this.secret_env_vars.exists(k, k in this.user_env_vars)"
  };
  option (buf.validate.message).cel = {
    id: "secret_env_vars_need_region"
    message: "secret_env_vars needs region: the stored secrets replicate only in the workflow's region"
    expression: "size(this.secret_env_vars) == 0 || this.region != ''"
  };
  option (buf.validate.message).cel = {
    id: "secret_env_vars_need_email_identity"
    message: "with secret_env_vars, service_account must name the account by email (or projects/{project}/serviceAccounts/{email}): the secret grant is made to that email"
    expression: "size(this.secret_env_vars) == 0 || !has(this.service_account.value) || this.service_account.value.matches('^(projects/[^/]+/serviceAccounts/)?[^/@]+@[^/]+$')"
  };
}
