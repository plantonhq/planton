syntax = "proto3";

package dev.planton.gcp.gcpworkflow.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpworkflow/v1alpha1/outputs.proto";
import "catalog/gcp/gcpworkflow/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-workflow
message GcpWorkflow {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpWorkflow'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpWorkflowSpec spec = 4 [(buf.validate.field).required = true];
  GcpWorkflowStatus status = 5;
}

message GcpWorkflowStatus {
  GcpWorkflowOutputs outputs = 1;
}
