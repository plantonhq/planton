# GcpWorkflow secret-value scenario: one literal variable and one stored
# secret value, with a source that reads the secret the documented way --
# the variable holds the stored version's resource name, and the Secret
# Manager connector resolves it. The module must create the variable's
# secret (replicated in us-central1), store the value as a version, grant
# the project's Compute Engine default service account secretAccessor on
# that secret alone (no service_account is set), and set the variable to the
# version's resource name -- the workflow never carries the value. Destroy
# removes the secret with the workflow. The value is a literal because this
# lane runs without a platform; on Planton the field takes only a $secret/
# reference.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpWorkflow
metadata:
  name: planton-oss-e2e-gcpwflow-secret-env
  id: planton-oss-e2e-gcpwflow-secret-env
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpworkflow
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-central1
  sourceContents: |
    main:
      steps:
        - readToken:
            call: googleapis.secretmanager.v1.projects.secrets.versions.access
            args:
              name: ${sys.get_env("E2E_TOKEN")}
            result: tokenVersion
        - done:
            return: ${sys.get_env("MODE") + " " + string(len(text.decode(base64.decode(tokenVersion.payload.data))))}
  userEnvVars:
    MODE: e2e
  secretEnvVars:
    E2E_TOKEN: e2e-not-a-real-secret
  description: E2E secret-value workflow — reads a stored secret; delete freely.
  deletionProtection: false
  deletionPolicy: DELETE
