# Minimal GcpWorkflow scenario: the smallest deployable workflow — a
# two-step source, ambient project, explicit region.
# deletion_protection must be false so DESTROY can run.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpWorkflow
metadata:
  name: planton-oss-e2e-gcpwflow-minimal
  id: planton-oss-e2e-gcpwflow-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpworkflow
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-upgrade-manifest: minimal.to.yaml # the in-place update: the description
  tags:
    - planton-e2e
spec:
  workflowName: planton-oss-e2e-gcpwf-minimal-${E2E_RUN_ID} # per kind and engine, so lanes side by side never share it
  region: us-central1
  sourceContents: |
    main:
      steps:
        - hello:
            return: "hello world"
  description: E2E minimal workflow — returns a constant; delete freely.
  deletionProtection: false
  deletionPolicy: DELETE
