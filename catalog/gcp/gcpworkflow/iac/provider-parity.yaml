# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name (region, description, labels,
# source_contents, service_account, call_log_level,
# execution_history_level, user_env_vars, deletion_protection, and
# deletion_policy all auto-match that way). Every exclusion carries its
# reason: omission is a decision, never an accident.

resources:
  google_workflows_workflow:
    mappings:
      # The workflow name defaults from metadata.name; the spec names it
      # for what it is.
      - spec: spec.workflow_name
        arg: name

      - spec: spec.project_id
        arg: project

      # The spec names the CMEK lever for what it references; the provider
      # suffixes _name.
      - spec: spec.crypto_key
        arg: crypto_key_name

      # The provider's `tags` argument is the resource-manager tag system
      # (tagKeys/{id} -> tagValues/{id}) -- the spec names it precisely to
      # keep it distinct from labels.
      - spec: spec.resource_manager_tags
        arg: tags
    exclusions:
      - arg: name_prefix
        reason: >-
          Versioned-name rotation is the catalog pattern; without hardcoded
          create-before-destroy semantics the argument is a dead lever
          (the established catalog judgment for name_prefix arguments).

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables
      workflows.googleapis.com with fixed arguments (disable_on_destroy
      false so destroying one workflow never disables Workflows
      project-wide); not spec surface.

  # One secret per secret_env_vars entry: the module creates it, stores the value as a
  # version, and grants the runtime identity read access to that secret
  # alone. Only the value itself is spec surface.
  google_secret_manager_secret:
    internal: >-
      created by the module per secret_env_vars entry -- its id
      (workflow, region, workflow name, key), user-managed replication in the workflow's
      region, and attribution labels are all derived from the workflow,
      never authored.
  google_secret_manager_secret_iam_member:
    internal: >-
      the roles/secretmanager.secretAccessor grant on each stored secret
      for the workflow's runtime identity (service_account, else the project's Compute Engine default) -- derived,
      never authored.
  google_secret_manager_secret_version:
    specRoot: spec
    mappings:
      - spec: spec.secret_env_vars
        arg: secret_data
    exclusions:
      - arg: secret
        reason: the module's own secret for this variable (derived), never authored
      - arg: project
        reason: follows the workflow's project through the secret it belongs to
      - arg: enabled
        reason: a stored value is always the enabled version the variable is pinned to
      - arg: is_secret_data_base64
        reason: the stored value is the variable's text as resolved, never base64-encoded
      - arg: secret_data_wo
        reason: write-only arm of secret_data; the module pins the variable to the stored version, which needs the version resource's own lifecycle
      - arg: secret_data_wo_version
        reason: companion of the unused write-only arm (see secret_data_wo)
      - arg: deletion_policy
        reason: a replaced or removed version is deleted (the provider default) -- the copy is derived, and a disabled or abandoned version would outlive the value's source
