apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpredisclusterendpointset
spec:
  # Proven live on both engines (2026-11-23) as the declared identity: the
  # registry's prerequisite cluster is pinned WITHOUT psc_configs, so it
  # publishes a discovery and a primary service attachment; two reserved
  # internal addresses and two PSC-form forwarding rules deploy as
  # extra-instance fixtures on the prerequisite subnet; then the set
  # registers both connections, each reported PSC_CONNECTION_STATUS_ACTIVE,
  # and re-plans clean. What the runs taught: Google leaves the primary
  # attachment's connection type unset, so GcpRedisCluster now takes the
  # untyped attachment as the primary one; and Google takes a connection's
  # forwarding rule only as projects/{project}/regions/{region}/forwardingRules/{name},
  # so the modules drop a self link's API prefix.
  #
  # A live attempt (2026-11-20) settled two of the PSC rule's shapes: Google
  # wants the reserved address resource (its self link), never a literal IP,
  # and no IP protocol on a rule that targets a service attachment. On
  # Pulumi the fixture rule's address reference then resolved empty, so the
  # lane waits on that resolution before it runs again.
  #
  # No second act: the set's create, update and delete are one write (a
  # PATCH of the cluster's endpoint list), so an update proves no permission
  # create doesn't, and Google's audit log can't tell them apart. It carries
  # no second act, as the IAM-member kinds don't.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 60
