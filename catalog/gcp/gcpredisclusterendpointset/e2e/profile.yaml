apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpredisclusterendpointset
spec:
  # Awaiting the live proof lane. The scenario proves in the harness
  # project with roles/redis.admin and roles/compute.networkAdmin: the
  # registry's prerequisite cluster is pinned WITHOUT psc_configs so it
  # publishes a discovery and a primary service attachment, two reserved
  # internal addresses and two PSC-form forwarding rules deploy as
  # extra-instance fixtures on the prerequisite subnet, then the set
  # registers both connections. Offline bar met: both modules build and
  # validate, offline plans for the reference manifest and the scenario are
  # clean on the pinned provider, and the accounting is total. Live facts
  # the proof lane confirms: (1) a cluster without psc_configs creates and
  # publishes exactly a discovery and a primary attachment on a zero-replica
  # cluster (the *_service_attachment handles populate by connection type);
  # (2) a regional forwarding rule in the PSC form (scheme NONE) accepts a
  # Redis Cluster service attachment as target and reports a
  # psc_connection_id; (3) Google accepts the registration with exactly one
  # connection per attachment and reports each connection ACTIVE; (4) the
  # set RE-PLANS CLEAN under the apply-idempotency gate on both engines with
  # project_id left unset (Optional+Computed, sent only when set); (5)
  # destroy order is set -> rules -> addresses -> cluster -> subnet -> policy
  # -> network -- a resourceInUseByAnotherResource on teardown means the
  # fixture chain was listed out of order.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 60
