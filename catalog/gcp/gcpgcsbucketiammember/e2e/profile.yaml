apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpgcsbucketiammember
spec:
  # Proven live on both engines (2026-11-19): a storage.objectCreator grant on
  # a bucket to a logging sink's writer identity, deployed and destroyed by an
  # identity holding only this kind's permissions manifest, with the re-plan
  # clean. A grant has no in-place update: every field replaces it. The
  # provider reads the bucket back as b/<name>, so the modules export the bare
  # name. The conditional arm stays offline-only.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
