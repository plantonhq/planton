# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcptpuqueuedresource
spec:
  gcp:
    groups:
      - purpose: EnableTpuApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
          - resourcemanager.projects.get
        provenance: derived
        reach: target
        privilege: ordinary
        notes: Covers google_project_service enabling tpu.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed. The provider reads the project with resourcemanager.projects.get before its services on every refresh, so a re-plan or destroy needs it (measured live).
      - purpose: ManageQueuedResource
        permissions:
          - tpu.nodes.create
          - tpu.nodes.get
          - tpu.nodes.delete
          - tpu.operations.get
        provenance: derived
        reach: target
        privilege: ordinary
        notes: Covers google_tpu_v2_queued_resource (google-beta; Pulumi tpu.V2QueuedResource) -- created and deleted through long-running operations the provider polls; the request provisions and deletes its nodes on the caller's behalf, which is why the node permissions travel with it. The provider-default project read for the node parent uses provider configuration only. GCP defines no tpu.queuedResources permission -- roles/tpu.admin, which manages queued resources, carries only tpu.nodes.* and tpu.operations.*, so the queued-resource calls authorize as the node permissions listed here. roles/tpu.admin contains all of them.
      - purpose: ActAsNodeIdentity
        permissions:
          - iam.serviceAccounts.actAs
        provenance: derived
        reach: target
        privilege: uses_identity
        notes: The request's nodes run as the Compute Engine default account (PROJECT_NUMBER-compute@developer.gserviceaccount.com), and Cloud TPU checks that the caller may act as it -- refusing a TPU VM's create with "needs to be granted the iam.serviceAccountUser role" for that account (measured on GcpTpuVm, which shares the node API).
