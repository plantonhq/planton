syntax = "proto3";

package dev.planton.gcp.gcptpuqueuedresource.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcptpuqueuedresource/v1alpha1/outputs.proto";
import "catalog/gcp/gcptpuqueuedresource/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-tpu-queued-resource
message GcpTpuQueuedResource {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpTpuQueuedResource'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpTpuQueuedResourceSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpTpuQueuedResourceStatus status = 5;
}

//gcp-tpu-queued-resource status
message GcpTpuQueuedResourceStatus {
  //stack-outputs
  GcpTpuQueuedResourceStackOutputs outputs = 1;
}
