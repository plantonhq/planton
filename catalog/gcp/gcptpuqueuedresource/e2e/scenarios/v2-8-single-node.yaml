# GcpTpuQueuedResource scenario: a request for one v2-8 node in
# us-central1-c. The request exists the moment Google accepts it; the node
# follows when capacity allows, and the verifier accepts a request still
# WAITING_FOR_RESOURCES. Destroy deletes the request and any node it
# provisioned. The node id carries the run id.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpTpuQueuedResource
metadata:
  name: planton-oss-e2e-gcptpuq-v2
  id: planton-oss-e2e-gcptpuq-v2
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcptpuqueuedresource
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "catalog/gcp/gcptpuqueuedresource/e2e/prerequisites/gcpvpcnetwork.yaml,catalog/gcp/gcptpuqueuedresource/e2e/prerequisites/gcpsubnetwork.yaml"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
  tags:
    - planton-e2e
spec:
  zone: us-central1-c
  queuedResourceId: e2e-tpuq-${E2E_RUN_ID} # per kind and engine, so lanes side by side never share it
  nodeSpecs:
    - nodeId: pln-e2e-tpuq-${E2E_RUN_ID}
      node:
        runtimeVersion: tpu-ubuntu2204-base
        acceleratorType: v2-8
        networkConfig:
          network:
            valueFrom:
              kind: GcpVpcNetwork
              name: planton-oss-e2e-gcptpuq-vpc
              fieldPath: status.outputs.network_id
          subnetwork:
            valueFrom:
              kind: GcpSubnetwork
              name: planton-oss-e2e-gcptpuq-subnet
              fieldPath: status.outputs.subnetwork_self_link
  deletionPolicy: DELETE
