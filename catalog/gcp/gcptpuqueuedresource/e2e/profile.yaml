apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcptpuqueuedresource
spec:
  # Awaiting the live proof lane. The scenario proves in the harness
  # project with roles/tpu.admin; the module enables tpu.googleapis.com
  # itself and attaches the request through google-beta under the
  # recorded admission. Offline bar met: both modules build and validate,
  # offline plans for the reference manifest, the scenario, and a
  # two-node throwaway arm are clean on the pinned providers, and the
  # accounting is total against the beta schema. Live facts the proof lane
  # confirms: (1) Google accepts the request and the apply returns once it
  # is queued (a request still WAITING_FOR_RESOURCES is a live state the
  # verifier accepts); (2) the request RE-PLANS CLEAN on both engines --
  # the node parent the modules derive matches what Google stores; (3)
  # destroy deletes the request and any node it provisioned, and the
  # verifier reads 404.
  #
  # No second act: a queued resource has no field Google updates in place --
  # every field recreates the request -- so an update would prove only
  # create and delete again. It carries no second act, as the IAM-member
  # kinds don't.
  #
  # Zone stock (2026-11-21, 2026-11-22): Google refused an on-demand v2-8 request with
  # "Insufficient capacity. Try again in a different zone or at a later
  # time." in us-central1-f, us-central1-b and us-central1-c, on both engines -- a
  # capacity event, not a quota or module defect (quota read live: v2 spot 48
  # and on-demand 16 per zone). The scenario runs in europe-west4-a,
  # which lists v2-8.
  tier: 1
  status: deferred
  deferred_reason: "not performed: stock -- Google refused a v2-8 with \"Insufficient capacity. Try again in a different zone or at a later time.\" in us-central1-f and us-central1-b (2026-11-21) and in us-central1-c and europe-west4-a (2026-11-22), on both engines, with quota held (v2 spot 48, on-demand 16 per zone); re-run in a zone with v2-8 stock"
  validated_provisioners: []
  timeout_minutes: 30
