# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/componentcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostProfile
metadata:
  name: gcptpuqueuedresource
spec:
  billing_model: always_on
  baseline_charges:
    - service_name: Cloud TPU
      sku_meter: TPU chip time
      pricing_unit: chip-hours
      description: A waiting request bills nothing; once its nodes are provisioned every chip bills until the request is deleted, whether or not a job is running (per cloud.google.com/tpu/pricing, read 2026-09-23).
  cost_drivers:
    - field_path: node_specs.node.accelerator_type
      sku_meter: TPU chip time
      pricing_unit: chip-hours
      impact: Each node's generation sets the per-chip rate and its size the chip count.
    - field_path: node_specs
      sku_meter: TPU chip time
      pricing_unit: chip-hours
      impact: Every node in the request bills once provisioned -- the cost scales with the node count.
