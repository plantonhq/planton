syntax = "proto3";

package dev.planton.gcp.gcpsecretmanagersecret.v1alpha1;

// Outputs produced after provisioning a Secret Manager secret.
message GcpSecretManagerSecretOutputs {
  // The full resource name of the secret.
  // Global: projects/{project}/secrets/{secret_id}
  // Regional: projects/{project}/locations/{region}/secrets/{secret_id}
  // The handle consumers use to reference the secret (e.g. a Cloud Run
  // valueFromSecret mount takes this name).
  string secret_name = 1;

  // The short secret ID (the last segment of secret_name).
  string secret_id = 2;

  // The full resource name of the version created from initial_version
  // (…/versions/1); empty when no initial_version was configured.
  // Consumers pinning an exact version (instead of the "latest" alias)
  // reference this value.
  string latest_version_name = 3;
}
