apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpworkloadidentitypoolprovider
spec:
  # Composed keyless-auth scenario: the harness deploys a
  # GcpWorkloadIdentityPool prerequisite, resolves the provider's pool
  # reference from its outputs, then runs deploy -> providers.get verify
  # (must be ACTIVE) -> destroy -> verify soft-deleted-or-gone, on both
  # provisioners. Provider IDs are soft-delete-reserved like pool IDs, so the
  # scenario carries the ${E2E_RUN_ID} token for a fresh ID per run/engine.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
