syntax = "proto3";

package dev.planton.gcp.gcpworkloadidentitypoolprovider.v1alpha1;

// Outputs produced after provisioning a GCP Workload Identity Pool Provider.
message GcpWorkloadIdentityPoolProviderOutputs {
  // The full resource name:
  // projects/<project_number>/locations/global/workloadIdentityPools/<pool_id>/providers/<provider_id>.
  // This is the AUDIENCE for the keyless-auth handshake: OIDC tokens minted
  // for this provider set `aud` to this value (with an //iam.googleapis.com/
  // prefix), and GCP provider configurations that authenticate via web
  // identity consume exactly this string as their audience.
  string name = 1;

  // The bare provider ID (the spec's workload_identity_pool_provider_id,
  // echoed for composing tooling that addresses the provider by short ID).
  string workload_identity_pool_provider_id = 2;

  // The provider lifecycle state: ACTIVE, or DELETED while soft-deleted (GCP
  // retains deleted providers for ~30 days; a DELETED provider rejects token
  // exchanges and blocks reuse of its ID).
  string state = 3;
}
