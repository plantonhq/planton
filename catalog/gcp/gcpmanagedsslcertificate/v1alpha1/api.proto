syntax = "proto3";

package dev.planton.gcp.gcpmanagedsslcertificate.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpmanagedsslcertificate/v1alpha1/outputs.proto";
import "catalog/gcp/gcpmanagedsslcertificate/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-managed-ssl-certificate
message GcpManagedSslCertificate {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpManagedSslCertificate'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpManagedSslCertificateSpec spec = 4 [(buf.validate.field).required = true];
  GcpManagedSslCertificateStatus status = 5;
}

message GcpManagedSslCertificateStatus {
  GcpManagedSslCertificateOutputs outputs = 1;
}
