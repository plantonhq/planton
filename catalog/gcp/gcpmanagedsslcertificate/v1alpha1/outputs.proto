syntax = "proto3";

package dev.planton.gcp.gcpmanagedsslcertificate.v1alpha1;

// Outputs produced after provisioning a GCP managed SSL certificate.
message GcpManagedSslCertificateOutputs {
  // Self-link URI of the SSL certificate. This is the value a target HTTPS
  // proxy references in its ssl_certificates list — the composition handle
  // that terminates TLS at the load balancer.
  // Format: https://www.googleapis.com/compute/v1/projects/{project}/global/sslCertificates/{name}
  string self_link = 1;

  // Name of the SSL certificate as it exists in GCP.
  string certificate_name = 2;

  // Server-assigned numeric ID of the certificate.
  string certificate_id = 3;

  // Expiry time of the certificate in RFC3339 format. Empty until the
  // certificate finishes provisioning (Google issues it only after DNS points
  // at the load balancer).
  string expire_time = 4;
}
