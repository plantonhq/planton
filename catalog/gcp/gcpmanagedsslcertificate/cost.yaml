# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: gcpmanagedsslcertificate
spec:
  billing_model: free
  free_tier: A classic Google-managed SSL certificate carries no meter -- Google Cloud's load-balancing pricing has no per-certificate or monthly certificate fee, and its one certificate-related charge ($0.45 per million TLS connections for SELF-managed certificates keyed with RSA-3072 or RSA-4096) explicitly does not apply to Google-managed certificates, whose key types (RSA-2048, ECDSA) Google states carry no per-connection charge. Issuance and every automatic renewal are equally chargeless, for 1 domain or 100.
  notes: "No field of this spec buys anything: the domain list sizes the certificate's coverage, never a bill. The real spend is the load balancer this certificate terminates TLS for -- the target HTTPS proxy's forwarding rule bills hourly and the balancer bills per-GB data processing, each as its own catalog kind -- and the certificate only provisions once each domain's DNS points at that balancer's IP. The contrast with the modern kind matters in the other direction here: Certificate Manager certificates (GcpCertManagerCert) meter per certificate-month past a project's first 100, so the classic chargeless kind is the cheaper fit for a handful of non-wildcard domains on a global load balancer."
