apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpeventarcmessagebus
spec:
  # Two scenarios: minimal (the bus alone) and routed (bus + a Pub/Sub
  # topic pipeline + a route-everything enrollment — the full family
  # fan-out, topic via a scenario-level GcpPubSubTopic prerequisite).
  # LIVE-PROVEN (2026-08-11, both engines): us-central1 accepted the
  # bus create, and the pipeline accepted the CANONICAL topic form
  # (projects/{p}/topics/{t}) — the provider-documented
  # location-scoped form is NOT required. TIMING: pipelines are the
  # family's slow resource — create ~5m, destroy ~4m (the routed lane
  # runs ~11m end to end per engine); the bus itself is ~40-60s each
  # way. Budget lanes accordingly.
  # The http_endpoint pipeline arm is offline-plan-proven only (needs a
  # VPC network attachment + a private HTTPS endpoint — heavy fixture;
  # unblock: a PSC/network-attachment fixture chain).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
