syntax = "proto3";

package dev.planton.gcp.gcpaddress.v1alpha1;

// Outputs produced after provisioning a GCP regional address.
message GcpAddressOutputs {
  // The reserved IP address or the start of the reserved CIDR range.
  // For EXTERNAL addresses this is a public IP. For INTERNAL addresses
  // this is the reserved private IP or range start.
  string address = 1;

  // The self-link URL of the regional address resource.
  // Used to reference this address in other GCP resources like forwarding
  // rules, NAT gateways, or VM network interfaces.
  string self_link = 2;

  // Name of the regional address resource in GCP (e.g. "nat-external-ip").
  string name = 3;

  // The region from the spec (e.g. "us-central1") — the plain region name,
  // not a provider self-link, so downstream composition can confirm scope
  // compatibility without parsing URLs.
  string region = 4;
}
