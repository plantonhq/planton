# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpaddress
spec:
  gcp:
    groups:
      - purpose: EnableComputeApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling compute.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageAddress
        permissions:
          - compute.addresses.get
          - compute.addresses.setLabels
          - compute.regionOperations.get
        provenance: derived
        notes: Covers google_compute_address reads, label changes (labels are the reservation's one mutable surface -- everything else forces replacement), and polling the region operation every mutation returns.
      - purpose: ReserveExternalAddress
        permissions:
          - compute.addresses.create
          - compute.addresses.delete
        provenance: derived
        notes: Reserving and releasing an EXTERNAL address (address_type unset or EXTERNAL -- the default).
      - purpose: ReserveInternalAddress
        permissions:
          - compute.addresses.createInternal
          - compute.addresses.deleteInternal
          - compute.subnetworks.use
        provenance: derived
        notes: INTERNAL reservations authorize under the dedicated *Internal permission variants, NOT the external create/delete (both pairs verified against IAM's testable-permissions inventory). subnetworks.use covers GCE_ENDPOINT and DNS_RESOLVER placements that draw the address from a subnetwork (the 03-internal-gce-endpoint preset does).
