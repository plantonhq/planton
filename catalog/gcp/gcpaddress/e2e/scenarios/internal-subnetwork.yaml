# Internal GcpAddress scenario: exercises the GCE_ENDPOINT branch with a
# subnetwork reference from the consumer-scoped GcpSubnetwork prerequisite.
# The harness deploys GcpVpcNetwork (registry prerequisite) then this component's
# gcpsubnetwork override, resolves the subnetwork self-link, then applies
# this INTERNAL reservation. project_id is deliberately omitted.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpAddress
metadata:
  name: planton-oss-e2e-gcpaddr-internal
  id: planton-oss-e2e-gcpaddr-internal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpaddress
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  description: Ephemeral internal GCE endpoint address created by the Planton E2E harness; safe to delete
  addressName: planton-oss-e2e-gcpaddr-internal
  region: us-central1
  addressType: INTERNAL
  purpose: GCE_ENDPOINT
  ipVersion: IPV4
  subnetwork:
    valueFrom:
      kind: GcpSubnetwork
      name: planton-oss-e2e-gcpsnw-addr-prereq
      fieldPath: status.outputs.subnetwork_self_link

  # Ephemeral test fixture: fully delete on destroy.
  deletionPolicy: DELETE
