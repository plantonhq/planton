# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcploggingsink
spec:
  gcp:
    groups:
      - purpose: EnableLoggingApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling logging.googleapis.com -- rendered only on the project-scope path (folder/org/billing sinks are not project resources, so the module creates no enablement there). disable_on_destroy is false, so the disable permission is never needed.
      - purpose: ManageSink
        permissions:
          - logging.sinks.create
          - logging.sinks.get
          - logging.sinks.update
          - logging.sinks.delete
        provenance: derived
        notes: "Covers all four scope variants -- google_logging_project_sink, google_logging_folder_sink, google_logging_organization_sink, and google_logging_billing_account_sink (exactly one deploys, count-gated off the scope) -- create, read/refresh, in-place updates (filter, exclusions, destination, disabled), and destroy. All four permissions verified present in IAM's testable-permissions inventory. The permissions must be held AT the sink's scope: on the project for project sinks, on the folder/organization/billing account for the others. Deployer permissions end here -- the sink's WRITER IDENTITY (the writer_identity output, a GCP-minted service account) separately needs write access granted ON the destination (roles/storage.objectCreator on a GCS bucket, roles/bigquery.dataEditor on a BigQuery dataset, roles/pubsub.publisher on a Pub/Sub topic) or the sink silently exports nothing; that grant is consumer wiring through the destination kind's iam_members, not a deployer permission of this module, which never touches the destination."
