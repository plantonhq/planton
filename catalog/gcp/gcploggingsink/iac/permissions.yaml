# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcploggingsink
spec:
  gcp:
    caller_project_services:
      - logging.googleapis.com
    groups:
      - purpose: EnableLoggingApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
          - resourcemanager.projects.get
        provenance: derived
        reach: target
        privilege: ordinary
        notes: Covers google_project_service enabling logging.googleapis.com -- rendered only on the project-scope path (folder/org/billing sinks are not project resources, so the module creates no enablement there). disable_on_destroy is false, so the disable permission is never needed. The provider reads the project with resourcemanager.projects.get before its services on every refresh, so a re-plan or destroy needs it (measured live).
      - purpose: ManageSink
        permissions:
          - logging.sinks.create
          - logging.sinks.get
          - logging.sinks.update
          - logging.sinks.delete
        provenance: derived
        reach: target
        privilege: ordinary
        notes: "Covers all four scope variants -- google_logging_project_sink, google_logging_folder_sink, google_logging_organization_sink, and google_logging_billing_account_sink (exactly one deploys, count-gated off the scope) -- create, read/refresh, in-place updates (filter, exclusions, destination, disabled), and destroy. All four permissions verified present in IAM's testable-permissions inventory. The permissions must be held AT the sink's scope: on the project for project sinks, on the folder/organization/billing account for the others. Deployer permissions end here -- the sink's WRITER IDENTITY (the writer_identity output, a GCP-minted service account) separately needs write access granted ON the destination (roles/storage.objectCreator on a GCS bucket, roles/bigquery.dataEditor on a BigQuery dataset, roles/pubsub.publisher on a Pub/Sub topic) or the sink silently exports nothing; that grant is consumer wiring through a standalone grant block (GcpGcsBucketIamMember, GcpPubSubTopicIamMember) whose member references writer_identity, not a deployer permission of this module, which never touches the destination."
      - purpose: ManageFolderSink
        permissions:
          - logging.sinks.create
          - logging.sinks.get
          - logging.sinks.update
          - logging.sinks.delete
        provenance: derived
        reach: organization
        privilege: ordinary
        condition:
          spec_field_set: scope.folder_id
        notes: "The folder shape: Google authorizes the sink on its scope, so a folder-scoped one needs these permissions on the folder (roles/logging.configWriter there carries them); a folder or organization sink's calls bill to the caller's project, where logging.googleapis.com is on by default. The project group covers the project shape."
      - purpose: ManageOrganizationSink
        permissions:
          - logging.sinks.create
          - logging.sinks.get
          - logging.sinks.update
          - logging.sinks.delete
        provenance: derived
        reach: organization
        privilege: ordinary
        condition:
          spec_field_set: scope.organization_id
        notes: "The organization shape: Google authorizes the sink on its scope, so an organization-scoped one needs these permissions on the organization (roles/logging.configWriter there carries them); a folder or organization sink's calls bill to the caller's project, where logging.googleapis.com is on by default. The project group covers the project shape."
