syntax = "proto3";

package dev.planton.gcp.gcploggingsink.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcploggingsink/v1alpha1/outputs.proto";
import "catalog/gcp/gcploggingsink/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-logging-sink
message GcpLoggingSink {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpLoggingSink'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpLoggingSinkSpec spec = 4 [(buf.validate.field).required = true];
  GcpLoggingSinkStatus status = 5;
}

message GcpLoggingSinkStatus {
  GcpLoggingSinkOutputs outputs = 1;
}
