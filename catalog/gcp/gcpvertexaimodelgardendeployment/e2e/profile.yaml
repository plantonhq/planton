apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpvertexaimodelgardendeployment
spec:
  # Proven live on both engines (2026-11-21), as an identity holding only this
  # kind's permissions manifest: Qwen3-0.6B from Hugging Face deployed twice
  # -- with deploy_config omitted (Google's recommended shape; it re-planned
  # clean) and on an explicit one-L4 g2-standard-12 shape -- and destroyed;
  # the explicit deployment's replica ceiling moved from 1 to 2 in place
  # (EndpointService.MutateDeployedModel), judged from Google's Admin Activity
  # log. The provider's region is the deployment's location: Vertex AI is
  # reached through the region's endpoint. Destroy undeploys and deletes the
  # endpoint but never the model Vertex AI uploaded into the Model Registry;
  # the e2e harness releases it (model-garden-models).
  tier: 2
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 60
