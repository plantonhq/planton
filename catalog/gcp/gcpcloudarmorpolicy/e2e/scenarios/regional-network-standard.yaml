# GcpCloudArmorPolicy scenario exercising the CLOUD_ARMOR_NETWORK type: a
# regional packet-level policy with STANDARD network DDoS protection, no
# rules and no user-defined fields, so Google adds its own default rule.
# Offline unless PLANTON_E2E_GCP_CLOUD_ARMOR_ENTERPRISE is set: Google
# creates a CLOUD_ARMOR_NETWORK policy only in a project with a Cloud Armor
# Enterprise subscription ("Network security policies require Cloud Armor
# Enterprise subscription", 412), which the harness project does not hold.
# Rules, user-defined fields, ADVANCED protection and the network edge
# security service need the same subscription.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudArmorPolicy
metadata:
  name: planton-oss-e2e-cap-regional-network
  id: planton-oss-e2e-cap-regional-network
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcloudarmorpolicy
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-required-env: PLANTON_E2E_GCP_CLOUD_ARMOR_ENTERPRISE # set only in a project enrolled in Cloud Armor Enterprise
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
  tags:
    - planton-e2e
spec:
  policyName: planton-oss-e2e-cap-rnet-${E2E_RUN_ID}
  description: Ephemeral regional network policy for Planton OSS E2E
  region: us-central1
  type: CLOUD_ARMOR_NETWORK

  ddosProtectionConfig:
    ddosProtection: STANDARD

  # No rules: Google adds the default rule itself.
  rules: []

  # Ephemeral test fixture: fully delete on destroy.
  deletionPolicy: DELETE
