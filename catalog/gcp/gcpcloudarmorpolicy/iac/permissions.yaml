# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpcloudarmorpolicy
spec:
  gcp:
    groups:
      - purpose: EnableComputeApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling compute.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageSecurityPolicy
        permissions:
          - compute.securityPolicies.create
          - compute.securityPolicies.get
          - compute.securityPolicies.update
          - compute.securityPolicies.delete
          - compute.securityPolicies.setLabels
        provenance: derived
        notes: Covers google_compute_security_policy (Terraform) / compute.SecurityPolicy (Pulumi) -- create, read/refresh, in-place updates, and destroy under deletion_policy DELETE. GCP defines NO compute.securityPolicyRules.* IAM permissions (verified against IAM's testable-permissions inventory) -- the rules live inside the policy resource, and every rule add, patch, and remove authorizes as compute.securityPolicies.update on the parent policy. Labels are applied through the dedicated setLabels method, which carries its own permission.
