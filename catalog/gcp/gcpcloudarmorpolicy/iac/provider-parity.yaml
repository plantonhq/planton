# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_compute_security_policy:
    mappings:
      # Renames: the spec says what each field IS, where the provider
      # inherits terser API names.
      - spec: spec.policy_name
        arg: name
      - spec: spec.project_id
        arg: project

      # The provider's singular repeated-block name; the spec uses the
      # plural. Matching resumes name-for-name below the subtree (action,
      # priority, preview, description, header_action,
      # rate_limit_options, redirect_options, ...); the deeper mappings
      # below override this prefix where the provider wraps single fields
      # in an extra block level.
      - spec: spec.rules
        arg: rule

      # The provider wraps the IP-range match in a config block and the
      # CEL match in an expr block; the spec flattens both to the match
      # message itself (exactly one of the two arms is set, enforced by
      # spec CEL).
      - spec: spec.rules.match.src_ip_ranges
        arg: rule.match.config.src_ip_ranges
      - spec: spec.rules.match.expression
        arg: rule.match.expr.expression

      # The provider nests the reCAPTCHA token site keys one block deeper
      # (expr_options.recaptcha_options); the spec keeps them directly on
      # expr_options -- reCAPTCHA is the only thing expr_options carries.
      - spec: spec.rules.match.expr_options.action_token_site_keys
        arg: rule.match.expr_options.recaptcha_options.action_token_site_keys
      - spec: spec.rules.match.expr_options.session_token_site_keys
        arg: rule.match.expr_options.recaptcha_options.session_token_site_keys

      # Singular-to-plural renames inside the WAF exclusion block: the
      # spec pluralizes every repeated field the provider names singular.
      - spec: spec.rules.preconfigured_waf_config.exclusions
        arg: rule.preconfigured_waf_config.exclusion
      - spec: spec.rules.preconfigured_waf_config.exclusions.request_cookies
        arg: rule.preconfigured_waf_config.exclusion.request_cookie
      - spec: spec.rules.preconfigured_waf_config.exclusions.request_headers
        arg: rule.preconfigured_waf_config.exclusion.request_header
      - spec: spec.rules.preconfigured_waf_config.exclusions.request_query_params
        arg: rule.preconfigured_waf_config.exclusion.request_query_param
      - spec: spec.rules.preconfigured_waf_config.exclusions.request_uris
        arg: rule.preconfigured_waf_config.exclusion.request_uri

      # Adaptive Protection: the provider wraps everything in a
      # layer_7_ddos_defense_config block (the only defense the API
      # offers); the spec flattens the wrapper and names the enable
      # switch for what it enables.
      - spec: spec.adaptive_protection_config.enable_layer_7_ddos_defense
        arg: adaptive_protection_config.layer_7_ddos_defense_config.enable
      - spec: spec.adaptive_protection_config.rule_visibility
        arg: adaptive_protection_config.layer_7_ddos_defense_config.rule_visibility
      - spec: spec.adaptive_protection_config.threshold_configs
        arg: adaptive_protection_config.layer_7_ddos_defense_config.threshold_configs

  # The REGIONAL policy, built when spec.region is set. The regional
  # collection names its rule list `rules` (the global one says `rule`)
  # and nests the HTTP match the same way; it lacks labels, Adaptive
  # Protection, reCAPTCHA options, request-body inspection size, redirect,
  # header injection, and reCAPTCHA token options (each walled to the
  # global arm by spec CEL), and adds the network-policy levers the spec
  # walls to this arm: ddos_protection_config, user_defined_fields, and
  # rules[].network_match.
  google_compute_region_security_policy:
    mappings:
      - spec: spec.policy_name
        arg: name
      - spec: spec.project_id
        arg: project
      - spec: spec.rules
        arg: rules
      - spec: spec.rules.match.src_ip_ranges
        arg: rules.match.config.src_ip_ranges
      - spec: spec.rules.match.expression
        arg: rules.match.expr.expression
      - spec: spec.rules.preconfigured_waf_config.exclusions
        arg: rules.preconfigured_waf_config.exclusion
      - spec: spec.rules.preconfigured_waf_config.exclusions.request_cookies
        arg: rules.preconfigured_waf_config.exclusion.request_cookie
      - spec: spec.rules.preconfigured_waf_config.exclusions.request_headers
        arg: rules.preconfigured_waf_config.exclusion.request_header
      - spec: spec.rules.preconfigured_waf_config.exclusions.request_query_params
        arg: rules.preconfigured_waf_config.exclusion.request_query_param
      - spec: spec.rules.preconfigured_waf_config.exclusions.request_uris
        arg: rules.preconfigured_waf_config.exclusion.request_uri

  # The region's enrollment in advanced network DDoS protection, created
  # only when the spec declares network_edge_security_service. Its
  # security_policy is the composed regional policy's link; its
  # deletion_policy is the kind's own, fanned out.
  google_compute_network_edge_security_service:
    specRoot: spec.network_edge_security_service
    mappings:
      - spec: spec.region
        arg: region
      - spec: spec.project_id
        arg: project
      - spec: spec.deletion_policy
        arg: deletion_policy
    exclusions:
      - arg: security_policy
        reason: >-
          composed link -- the module attaches the regional security policy
          this kind builds, never a caller-supplied one

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables compute.googleapis.com
      with fixed arguments (disable_on_destroy false so destroying one
      security policy never disables the API project-wide); not spec
      surface.
