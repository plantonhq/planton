apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpsccbigqueryexport
spec:
  # Proven live on both engines (2026-11-19): a project export of findings
  # matching no real category into a BigQuery dataset, deployed, re-described
  # in place and destroyed by an identity holding only this kind's permissions
  # manifest, with the re-plan clean. Google grants Security Command Center
  # write on the dataset as the caller, so the caller needs the dataset's IAM.
  # Folder and organization scopes stay offline-only.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
