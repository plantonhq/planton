# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# One kind, three BigQuery-export resources (the singular ones; the plural
# organization resource is deprecated) -- the spec's scope selects which
# one the module creates; each entry records the scope arm that names the
# parent.
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_scc_v2_project_scc_big_query_export:
    mappings:
      - spec: spec.scope.project_id
        arg: project

  google_scc_v2_folder_scc_big_query_export:
    mappings:
      - spec: spec.scope.folder_id
        arg: folder

  google_scc_v2_organization_scc_big_query_export:
    mappings:
      - spec: spec.scope.organization_id
        arg: organization
    exclusions:
      - arg: name
        reason: composed by both modules from the organization, location, and big_query_export_id (Google's own value) -- the organization resource takes name as an Optional, non-Computed argument, so leaving it unset would plan a change on every run

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables the owning API so a
      fresh project works on the first deploy; not a knob of the kind.
