# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: gcpservicenetworkingconnection
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The connection is network configuration -- a peering plus reserved-range references; it stores no customer data at rest.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to key (see enc-at-rest); the Service Networking API exposes no KMS surface for connections.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Traffic over the peering to the producer's network rides Google's network fabric, where Google encrypts traffic that leaves a physical boundary automatically -- the same default in-transit protection as intra-VPC traffic, with no switch on the connection to weaken it.
      notes: Payload-level TLS to the producer service (for example Cloud SQL's ssl_mode) remains the producer resource's control, not this connection's.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The connection's whole function is private connectivity -- producer resources receive addresses from the reserved INTERNAL VPC_PEERING ranges inside your VPC, and traffic to them stays in private address space over the peering rather than touching the public internet.
      notes: Whether a producer instance ALSO exposes a public endpoint (for example Cloud SQL with public IPv4 enabled) is that instance's posture, orthogonal to this peering.
    - control_id: restricted-ingress
      status: not_applicable
      notes: Reachability across the peering is governed by the VPC's firewall rules and routes -- separate catalog kinds; the connection itself has no filtering surface.
    - control_id: edge-protection
      status: not_applicable
      notes: The connection receives no HTTP requests -- request filters have nothing to attach to.
    - control_id: rbac
      status: not_applicable
      notes: Management access is project IAM posture (Service Networking roles), not a component choice; the connection exposes no authentication plane of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The connection runs no workloads and holds no credentials.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths of its own exist to retire.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: The spec exposes no audit surface. Connection changes land in Cloud Audit Logs as project-level posture; traffic audit (VPC Flow Logs) is per-subnetwork configuration on separate kinds.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The connection publishes no metrics of its own; peering traffic observability belongs to the network kinds, and producer-side signals to the producer instances.
    - control_id: backup-recovery
      status: not_applicable
      notes: Declarative configuration re-creatable from the manifest -- though recreating the connection is disruptive (network and service are ForceNew, and producers hold subnets in the ranges), which is a change-safety concern, not a backup one.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The peering is a network-level object with no zonal placement to configure; availability of the producer services reached over it is those kinds' posture.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Unset defaults to DELETE; setting deletion_policy=PREVENT makes destroy fail before the peering is removed -- protecting the private connectivity every producer instance on the network depends on. GCP separately refuses to delete the connection while any producer still holds subnets in the reserved ranges, so teardown ordering (instances first) is enforced service-side regardless.
      notes: Neither preset sets PREVENT; ABANDON is the documented escape hatch for stuck teardowns, leaving the peering serving unmanaged.
    - control_id: managed-patching
      status: not_applicable
      notes: A pure configuration object with no software to patch; the peering fabric beneath it is Google-operated.
