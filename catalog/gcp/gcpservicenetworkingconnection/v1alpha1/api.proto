syntax = "proto3";

package dev.planton.gcp.gcpservicenetworkingconnection.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpservicenetworkingconnection/v1alpha1/outputs.proto";
import "catalog/gcp/gcpservicenetworkingconnection/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-service-networking-connection
message GcpServiceNetworkingConnection {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpServiceNetworkingConnection'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpServiceNetworkingConnectionSpec spec = 4 [(buf.validate.field).required = true];
  GcpServiceNetworkingConnectionStatus status = 5;
}

message GcpServiceNetworkingConnectionStatus {
  GcpServiceNetworkingConnectionOutputs outputs = 1;
}
