syntax = "proto3";

package dev.planton.gcp.gcpservicenetworkingconnection.v1alpha1;

// Outputs produced after provisioning a GCP private services access
// connection.
message GcpServiceNetworkingConnectionOutputs {
  // Name of the VPC peering GCP created on the network for this connection
  // (e.g. servicenetworking-googleapis-com). This is the peering an operator
  // looks for on the network's peerings list when auditing private services
  // access, and the handle for peering-level route settings.
  string peering = 1;

  // Self-link of the peered VPC network as the connection resolved it —
  // confirms which network the producer is attached to without chasing the
  // reference chain.
  string network = 2;
}
