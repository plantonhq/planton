# GcpServiceNetworkingConnection scenario: peer the prerequisite VPC with
# Google's managed-services producer using the prerequisite VPC_PEERING
# range. project_id is deliberately omitted: API enablement rides the
# provider's default project, which the E2E harness exports as
# GOOGLE_PROJECT from the resolved test project. The connection has no
# cloud-side name (it is addressed by network + service), so no run-id
# token is needed — and the peering it creates is removed on destroy.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpServiceNetworkingConnection
metadata:
  name: planton-oss-e2e-gcpsnc-smoke
  id: planton-oss-e2e-gcpsnc-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpservicenetworkingconnection
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  network:
    valueFrom:
      kind: GcpVpcNetwork
      name: planton-oss-e2e-gcpvpc-prereq
      fieldPath: status.outputs.network_self_link
  reservedPeeringRanges:
    - valueFrom:
        kind: GcpGlobalAddress
        name: planton-oss-e2e-gcpgip-psa-prereq
        fieldPath: status.outputs.name
  # Explicit DELETE keeps the destroy real and proves the no-op-diff
  # behavior of the new arm.
  deletionPolicy: DELETE
