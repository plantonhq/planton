apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpservicenetworkingconnection
spec:
  # Composed scenario: the connection needs a VPC and a reserved VPC_PEERING
  # range (GcpGlobalAddress), both installed from the prerequisite graph —
  # the range via this component's consumer-scoped prerequisite override
  # (e2e/prerequisites/gcpglobaladdress.yaml), since the address kind's
  # published profile is the EXTERNAL VIP shape the forwarding-rule chain
  # needs. deploy -> network peering verify -> destroy -> verify gone, on
  # both provisioners. Peering creation is a producer-side operation and can
  # take a few minutes.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 20
