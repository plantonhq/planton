# The second act of minimal.yaml: the same cluster with user labels added,
# a patch in place. Not a scenario of its own (the second-act annotation
# keeps discovery from running it as a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpManagedKafkaCluster
metadata:
  name: planton-oss-e2e-gcpkafka-smoke
  id: planton-oss-e2e-gcpkafka-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpmanagedkafkacluster
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-second-act: minimal.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
  tags:
    - planton-e2e
spec:
  location: us-central1
  clusterId: e2e-kafka-${E2E_RUN_ID}
  capacityConfig:
    vcpuCount: 3
    memoryBytes: 3221225472
  networkConfigs:
    - subnet:
        valueFrom:
          kind: GcpSubnetwork
          name: planton-oss-e2e-gcpkafka-subnet
          fieldPath: status.outputs.subnetwork_self_link
  labels:
    team: platform-e2e
  deletionPolicy: DELETE
