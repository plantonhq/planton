# GcpManagedKafkaCluster scenario: the smallest cluster Google sells -- 3
# vCPU and 3 GiB -- attached to the prerequisite subnet (referenced by kind,
# so the self link is trimmed to Google's path form by both modules).
# project_id is deliberately omitted: the cluster rides the provider's
# default project. The cloud-side id carries the run id.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpManagedKafkaCluster
metadata:
  name: planton-oss-e2e-gcpkafka-smoke
  id: planton-oss-e2e-gcpkafka-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpmanagedkafkacluster
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  location: us-central1
  clusterId: e2e-kafka-${E2E_RUN_ID}
  capacityConfig:
    vcpuCount: 3
    memoryBytes: 3221225472
  networkConfigs:
    - subnet:
        valueFrom:
          kind: GcpSubnetwork
          name: planton-oss-e2e-gcpkafka-subnet
          fieldPath: status.outputs.subnetwork_self_link
  deletionPolicy: DELETE
