apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpmanagedkafkacluster
spec:
  # Proven live on both engines (2026-11-21), as an identity holding only this
  # kind's permissions manifest: the smallest cluster Google sells (3 vCPU, 3
  # GiB) and a tuned one (6 GiB, a 200 GiB broker disk, rebalance on scale-up,
  # labels) on a run-scoped subnet fixture, deployed (about 20 to 30 minutes
  # each), re-planned clean, and destroyed; user labels changed in place
  # (ManagedKafka.UpdateCluster), judged from Google's Admin Activity log.
  # Capacity sent as decimal strings and the subnet trimmed to Google's path
  # form re-plan clean on both engines.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 120
