syntax = "proto3";

package dev.planton.gcp.gcpmanagedkafkacluster.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpmanagedkafkacluster/v1alpha1/outputs.proto";
import "catalog/gcp/gcpmanagedkafkacluster/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-managed-kafka-cluster
message GcpManagedKafkaCluster {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpManagedKafkaCluster'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpManagedKafkaClusterSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpManagedKafkaClusterStatus status = 5;
}

//gcp-managed-kafka-cluster status
message GcpManagedKafkaClusterStatus {
  //stack-outputs
  GcpManagedKafkaClusterStackOutputs outputs = 1;
}
