# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpmanagedkafkacluster
spec:
  gcp:
    groups:
      - purpose: EnableApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
        provenance: derived
        notes: Covers google_project_service enabling managedkafka.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageCluster
        permissions:
          - managedkafka.clusters.create
          - managedkafka.clusters.get
          - managedkafka.clusters.update
          - managedkafka.clusters.delete
          - managedkafka.operations.get
        provenance: derived
        notes: Covers google_managed_kafka_cluster (Pulumi managedkafka.Cluster) -- created and updated through long-running operations, read on every refresh, deleted. Names grounded in Google's Managed Kafka roles page; roles/managedkafka.admin contains all five.
