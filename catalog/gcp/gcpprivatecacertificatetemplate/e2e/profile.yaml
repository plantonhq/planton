apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpprivatecacertificatetemplate
spec:
  # Proven live on both engines (2026-11-20): a minimal template and a TLS
  # server template with predefined values, a CEL rule and passthrough
  # extensions, each deployed, re-described in place (UpdateCertificateTemplate
  # in Google's audit log) and destroyed by an identity holding only this kind's
  # permissions manifest, with the re-plan clean. Google stores CA options and
  # key usage on every template, so both modules always send them; a deleted
  # template's ID is never usable again.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
