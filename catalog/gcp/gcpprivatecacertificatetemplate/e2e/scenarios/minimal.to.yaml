# The second act of minimal.yaml: the same template with a new description
# -- a certificateTemplates.patch with the description mask that changes it
# in place (its id and location recreate it). Not a scenario of its own (the
# second-act annotation keeps discovery from running it as a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpPrivateCaCertificateTemplate
metadata:
  name: planton-oss-e2e-gcppcat-minimal
  id: planton-oss-e2e-gcppcat-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpprivatecacertificatetemplate
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-second-act: minimal.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
  tags:
    - planton-e2e
spec:
  location: us-central1
  templateId: e2e-gcppcat-min-${E2E_RUN_ID}
  description: Planton E2E minimal template, re-described in place
  labels:
    e2e-arm: minimal
  deletionPolicy: DELETE
