syntax = "proto3";

package dev.planton.gcp.gcpprivatecacertificatetemplate.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";

// GcpPrivateCaCertificateTemplateX509Parameters describes the X.509 fields every certificate issued with the template carries (its predefined values): what the key may
// be used for, the CA basic constraints, certificate policies, OCSP
// responders, name constraints, and custom extensions (Google's
// X509Parameters message).
message GcpPrivateCaCertificateTemplateX509Parameters {
  // What the certificate's key may be used for (the key usage and extended
  // key usage extensions). Omit for no key-usage statement; both usage
  // groups are optional and an empty group states nothing.
  GcpPrivateCaCertificateTemplateKeyUsage key_usage = 1;

  // The basic constraints extension: whether the certificate is a CA and
  // how many CA levels may sit below it. Omit to leave the extension to
  // Google's default (for a leaf certificate, is_ca false).
  GcpPrivateCaCertificateTemplateCaOptions ca_options = 2;

  // Certificate policy object identifiers (RFC 5280 section 4.2.1.4), each
  // an OID path such as [2, 23, 140, 1, 2, 1] (CA/Browser Forum
  // domain-validated).
  repeated GcpPrivateCaCertificateTemplateObjectId policy_ids = 3;

  // OCSP responder URLs placed in the Authority Information Access
  // extension, e.g. "http://ocsp.example.com". Google runs no OCSP
  // responder; list your own.
  repeated string aia_ocsp_servers = 4;

  // Custom X.509 extensions, each an OID, a base64 DER value, and whether
  // a relying party that does not understand it must reject the
  // certificate (critical).
  repeated GcpPrivateCaCertificateTemplateX509Extension additional_extensions = 5;

  // The name constraints extension (RFC 5280 section 4.2.1.10): the names
  // certificates below a CA may and may not carry. Meaningful on CA
  // certificates.
  GcpPrivateCaCertificateTemplateNameConstraints name_constraints = 6;
}

// GcpPrivateCaCertificateTemplateKeyUsage states what the certificate's key may do.
message GcpPrivateCaCertificateTemplateKeyUsage {
  // The key usage extension's bits.
  GcpPrivateCaCertificateTemplateBaseKeyUsage base_key_usage = 1;

  // The extended key usage extension's well-known purposes.
  GcpPrivateCaCertificateTemplateExtendedKeyUsage extended_key_usage = 2;

  // Extended key usages with no named field here, each an OID path.
  repeated GcpPrivateCaCertificateTemplateObjectId unknown_extended_key_usages = 3;
}

// GcpPrivateCaCertificateTemplateBaseKeyUsage is the key usage extension (RFC 5280 section 4.2.1.3).
// A CA certificate sets cert_sign and crl_sign; a TLS leaf typically sets
// digital_signature and key_encipherment.
message GcpPrivateCaCertificateTemplateBaseKeyUsage {
  // The key may make digital signatures other than certificate and CRL
  // signatures (TLS handshakes, signed tokens).
  bool digital_signature = 1;

  // The key may protect content against the signer later denying it
  // (non-repudiation).
  bool content_commitment = 2;

  // The key may encipher other keys (RSA key transport in TLS).
  bool key_encipherment = 3;

  // The key may encipher raw data directly.
  bool data_encipherment = 4;

  // The key may be used in key agreement (ECDH).
  bool key_agreement = 5;

  // The key may sign certificates -- set on every CA certificate.
  bool cert_sign = 6;

  // The key may sign certificate revocation lists -- set on every CA
  // certificate that publishes CRLs.
  bool crl_sign = 7;

  // With key_agreement, the key may only encipher.
  bool encipher_only = 8;

  // With key_agreement, the key may only decipher.
  bool decipher_only = 9;
}

// GcpPrivateCaCertificateTemplateExtendedKeyUsage is the extended key usage extension's well-known
// purposes (RFC 5280 section 4.2.1.12).
message GcpPrivateCaCertificateTemplateExtendedKeyUsage {
  // TLS server authentication -- what an HTTPS or gRPC server certificate
  // needs.
  bool server_auth = 1;

  // TLS client authentication -- what an mTLS client certificate needs.
  bool client_auth = 2;

  // Code signing.
  bool code_signing = 3;

  // S/MIME email protection.
  bool email_protection = 4;

  // Trusted timestamping.
  bool time_stamping = 5;

  // Signing OCSP responses.
  bool ocsp_signing = 6;
}

// GcpPrivateCaCertificateTemplateCaOptions is the basic constraints extension (RFC 5280 section
// 4.2.1.9). Both fields are presence-based: an unset field is left out of
// the certificate, which is different from setting it to false or 0.
message GcpPrivateCaCertificateTemplateCaOptions {
  // true makes a CA certificate (CA:TRUE), false states CA:FALSE; unset
  // leaves the CA flag out of the extension.
  optional bool is_ca = 1;

  // The path length constraint: how many CA levels may sit below this
  // certificate. 0 means it may sign only leaf certificates -- a
  // subordinate that issues workload certificates; unset means no limit
  // is stated.
  optional int32 max_issuer_path_length = 2 [(buf.validate.field).int32.gte = 0];
}

// GcpPrivateCaCertificateTemplateObjectId is an ASN.1 object identifier as its numeric arcs, most
// significant first, e.g. [1, 3, 6, 1, 5, 5, 7, 3, 1].
message GcpPrivateCaCertificateTemplateObjectId {
  // The OID's arcs, most significant first.
  repeated int32 object_id_path = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items.int32.gte = 0
  ];
}

// GcpPrivateCaCertificateTemplateX509Extension is one custom X.509 extension.
message GcpPrivateCaCertificateTemplateX509Extension {
  // The extension's OID.
  GcpPrivateCaCertificateTemplateObjectId object_id = 1 [(buf.validate.field).required = true];

  // A relying party that does not understand a critical extension must
  // reject the certificate. Mark an extension critical only when every
  // consumer knows it.
  bool critical = 2;

  // The extension's DER value, base64-encoded.
  string value = 3 [(buf.validate.field).string.min_len = 1];
}

// GcpPrivateCaCertificateTemplateNameConstraints is the name constraints extension. A name matches a
// DNS constraint when adding labels to its left gives the name
// ("example.com" admits "www.example.com", not "example1.com"); an email
// constraint is an address, a host, or ".domain" for every host in it; a
// URI constraint matches the URI's host the same way; IP ranges are CIDR.
message GcpPrivateCaCertificateTemplateNameConstraints {
  // Whether the constraints are marked critical. RFC 5280 requires true on
  // a CA certificate that carries them.
  bool critical = 1;

  // DNS names certificates below this CA may carry.
  repeated string permitted_dns_names = 2;

  // DNS names certificates below this CA must not carry.
  repeated string excluded_dns_names = 3;

  // IP ranges (CIDR) certificates below this CA may carry.
  repeated string permitted_ip_ranges = 4;

  // IP ranges (CIDR) certificates below this CA must not carry.
  repeated string excluded_ip_ranges = 5;

  // Email addresses, hosts, or ".domain" suffixes that may appear.
  repeated string permitted_email_addresses = 6;

  // Email addresses, hosts, or ".domain" suffixes that must not appear.
  repeated string excluded_email_addresses = 7;

  // URI hosts or ".domain" suffixes that may appear.
  repeated string permitted_uris = 8;

  // URI hosts or ".domain" suffixes that must not appear.
  repeated string excluded_uris = 9;
}

// GcpPrivateCaCertificateTemplateIdentityConstraints limits the identities certificates may carry.
message GcpPrivateCaCertificateTemplateIdentityConstraints {
  // Copy the Subject from the certificate request into the certificate;
  // false discards the requested Subject.
  bool allow_subject_passthrough = 1;

  // Copy the subject alternative names from the request; false discards
  // them.
  bool allow_subject_alt_names_passthrough = 2;

  // A CEL expression over the resolved subject and subject alternative
  // names that must hold before a certificate is signed, e.g.
  // subject_alt_names.all(san, san.type == DNS && san.value.endsWith(".internal.example.com")).
  GcpPrivateCaCertificateTemplateCelExpression cel_expression = 3;
}

// GcpPrivateCaCertificateTemplateCelExpression is a CEL expression with its descriptive fields
// (Google's Expr); see Google's CA Service CEL guide for the variables.
message GcpPrivateCaCertificateTemplateCelExpression {
  // The expression.
  string expression = 1;

  // A short title for the expression.
  string title = 2;

  // What the expression checks.
  string description = 3;

  // Where the expression came from, for error messages (a file and line).
  string location = 4;
}

// GcpPrivateCaCertificateTemplatePassthroughExtensions lists the X.509 extensions a certificate request
// may carry through the template. Extensions a request sets that are not
// listed are dropped.
message GcpPrivateCaCertificateTemplatePassthroughExtensions {
  // Named extensions: BASE_KEY_USAGE, EXTENDED_KEY_USAGE, CA_OPTIONS,
  // POLICY_IDS, AIA_OCSP_SERVERS, NAME_CONSTRAINTS.
  repeated string known_extensions = 1 [(buf.validate.field).repeated.items.string = {
    in: [
      "BASE_KEY_USAGE",
      "EXTENDED_KEY_USAGE",
      "CA_OPTIONS",
      "POLICY_IDS",
      "AIA_OCSP_SERVERS",
      "NAME_CONSTRAINTS"
    ]
  }];

  // Custom extensions, by OID.
  repeated GcpPrivateCaCertificateTemplateObjectId additional_extensions = 2;
}

// GcpPrivateCaCertificateTemplateSpec defines a certificate template
// (`google_privateca_certificate_template`) -- a reusable shape for
// certificates (a TLS server leaf, an mTLS client), shared across pools in
// one project and location. A certificate references it to inherit its
// predefined values and limits; callers need privateca.templateUser on it.
// Values in the template conflict-fail against a pool's baseline values
// rather than overriding them.
message GcpPrivateCaCertificateTemplateSpec {
  // The GCP project the template lives in: a literal project ID or a GcpProject reference.
  // If omitted, the provider's default project is used. Immutable.
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];

  // The CA Service region, e.g. "us-central1"; certificates using the template must be in the same region. Immutable.
  string location = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-z]+-[a-z]+[0-9]+$"
  ];

  // The template's ID, unique in its parent: letters, digits, "-" and "_",
  // at most 63 characters. Defaults to metadata.name. Immutable.
  string template_id = 3 [(buf.validate.field).cel = {
    id: "template_id_format"
    expression: "this == '' || this.matches('^[a-zA-Z0-9_-]{1,63}$')"
    message: "template_id must be 1-63 letters, digits, '-' or '_'"
  }];

  // What the template is for, shown to people choosing one.
  string description = 4;

  // The longest lifetime a certificate issued with the template may have,
  // e.g. 2592000s (30 days). The pool's own maximum still applies; the
  // shorter wins.
  string maximum_lifetime = 5 [(buf.validate.field).cel = {
    id: "maximum_lifetime_duration"
    expression: "this == '' || (this.matches('^[0-9]+(\\\\.[0-9]{1,9})?s$'))"
    message: "maximum_lifetime must be a duration in seconds with an 's' suffix, e.g. 86400s"
  }];

  // X.509 values stamped onto every certificate issued with the template.
  GcpPrivateCaCertificateTemplateX509Parameters predefined_values = 6;

  // Limits on the identities certificates issued with it may carry. Omit
  // for no limits.
  GcpPrivateCaCertificateTemplateIdentityConstraints identity_constraints = 7;

  // Extensions a request may pass through the template.
  GcpPrivateCaCertificateTemplatePassthroughExtensions passthrough_extensions = 8;

  // Labels on the template. The platform attribution labels are added on
  // top and win on a key conflict.
  map<string, string> labels = 9;

  // What happens to the template when this resource is destroyed:
  //   "" / "DELETE" -- deleted (the provider's default)
  //   "PREVENT"     -- destroy fails
  //   "ABANDON"     -- it leaves management and stays in GCP
  string deletion_policy = 10 [(buf.validate.field).cel = {
    id: "valid_deletion_policy"
    expression: "this == '' || this in ['DELETE', 'PREVENT', 'ABANDON']"
    message: "deletion_policy must be one of: DELETE, PREVENT, ABANDON"
  }];
}
