# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: gcpfirestorebackupschedule
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every backup the schedule creates is encrypted at rest by Firestore -- backups follow the database's encryption posture, and no unencrypted state exists.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: The schedule exposes no encryption surface of its own -- the key posture is the referenced database's (GcpFirestoreDatabase kms_key_name), and backups follow it.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Schedule management runs over the TLS-only Firestore Admin API, and backup bytes move inside Google's infrastructure -- no customer-visible network path exists.
    - control_id: no-public-access
      status: not_applicable
      notes: Neither the schedule nor the backups it creates have a network endpoint; both are reachable only through the IAM-gated Firestore Admin API.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network ingress surface exists; network-source restriction of the Firestore API is a VPC Service Controls perimeter decision at the project level.
    - control_id: edge-protection
      status: not_applicable
      notes: The schedule serves no HTTP traffic; there is no request surface for a web application firewall to filter.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Schedule management authorizes against IAM datastore.backupSchedules.* permissions and the backups against datastore.backups.* per Google's Firestore IAM reference -- restoring a backup into a database requires the separate datastore.backups.restoreDatabase grant.
    - control_id: workload-identity
      status: not_applicable
      notes: The schedule runs no workloads and holds no credentials; Firestore's own service executes the cadence, and callers authenticate with their own IAM identities.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The only access path is the IAM-authenticated Firestore Admin API; no legacy or weaker authentication path exists to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Schedule create, update, and delete land in Cloud Audit Logs (Admin Activity) unconditionally; Admin Activity logging cannot be disabled.
    - control_id: monitoring-integration
      status: not_applicable
      notes: No metric surface of its own exists -- backups and schedules are inspected through the Firestore Admin API and gcloud (backups list), not through a Cloud Monitoring metric the schedule emits.
    - control_id: backup-recovery
      status: configurable
      field_path: daily
      evidence:
        type: spec_validation
        reference: The exactly_one_recurrence rule forces every schedule to declare its cadence -- daily true or a weekly day -- on which Firestore takes managed, restorable backups of the referenced database.
      notes: This component IS the automated-backup control for Firestore databases, extending protection beyond PITR's 7-day window to 14 weeks. A database supports one daily plus one weekly schedule -- the two presets compose on the same database. Backups survive deletion of both the schedule and the database.
    - control_id: backup-retention-policy
      status: configurable
      field_path: retention
      evidence:
        type: spec_validation
        reference: retention is required and validated as a seconds duration -- always an explicit, reviewable choice up to 14 weeks (8467200s), the schedule's only mutable field, applying to backups created after a change.
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Backup placement follows the referenced database's location automatically; the schedule has no failure-domain field of its own.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Empty defaults to DELETE (the schedule is removed and the cadence stops); PREVENT makes destroy fail -- the guard for a compliance-mandated cadence; ABANDON unmanages the schedule while it keeps taking backups.
      notes: No deletion lever touches backups already taken -- they outlive the schedule and age out per the retention they were created with.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The schedule executes inside Google's fully managed Firestore service; no software surface, version, or channel exists on the resource to patch.
