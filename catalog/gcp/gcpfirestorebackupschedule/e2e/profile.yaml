apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpfirestorebackupschedule
spec:
  # Composed scenario: deploys the GcpFirestoreDatabase prerequisite, then
  # attaches a daily backup schedule. The schedule itself creates/destroys
  # in seconds; the chain cost is the database (~1-2 minutes).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
