# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# One kind, five resources: the web app registration (beta-only at the pin,
# admitted in pkg/providerparity/admissions/google-beta.yaml and accounted
# against the google-beta schema), the reCAPTCHA v3 and reCAPTCHA Enterprise
# attestation configurations and the debug tokens (GA App Check), and API
# enablement plumbing. The spec's ONE deletion_policy maps onto the app and
# each debug token; the attestation configurations have none (provider
# truth -- per-app singletons Google never deletes).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_firebase_web_app:
    mappings:
      - spec: spec.project_id
        arg: project

  # Instantiated once when spec.app_check.recaptcha_v3 is present (its
  # required site secret is its switch). app_id is wired from the
  # registration this module creates.
  google_firebase_app_check_recaptcha_v3_config:
    specRoot: spec.app_check.recaptcha_v3
    mappings:
      - spec: spec.project_id
        arg: project
    exclusions:
      - arg: app_id
        reason: wired by the module to the app registration it creates -- never user surface

  # Instantiated once when spec.app_check.recaptcha_enterprise is present
  # (its required site key is its switch). Both reCAPTCHA configurations may
  # coexist -- the v3-to-Enterprise migration shape.
  google_firebase_app_check_recaptcha_enterprise_config:
    specRoot: spec.app_check.recaptcha_enterprise
    mappings:
      - spec: spec.project_id
        arg: project
    exclusions:
      - arg: app_id
        reason: wired by the module to the app registration it creates -- never user surface

  # Instantiated per spec.app_check.debug_tokens entry, keyed by display
  # name. The kind-level deletion_policy maps onto each token.
  google_firebase_app_check_debug_token:
    specRoot: spec.app_check.debug_tokens
    mappings:
      - spec: spec.project_id
        arg: project
      - spec: spec.deletion_policy
        arg: deletion_policy
    exclusions:
      - arg: app_id
        reason: wired by the module to the app registration it creates -- never user surface

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables
      firebaseappcheck.googleapis.com exactly when the spec composes an App
      Check resource; disable_on_destroy false so destroying this app never
      disables an API the project's other apps depend on. The Firebase
      Management API itself is enabled by the GcpFirebaseProject the app
      lives in. Not spec surface.
