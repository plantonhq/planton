syntax = "proto3";

package dev.planton.gcp.gcpfirebasewebapp.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpfirebasewebapp/v1alpha1/outputs.proto";
import "catalog/gcp/gcpfirebasewebapp/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-firebase-web-app
message GcpFirebaseWebApp {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpFirebaseWebApp'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpFirebaseWebAppSpec spec = 4 [(buf.validate.field).required = true];
  GcpFirebaseWebAppStatus status = 5;
}

message GcpFirebaseWebAppStatus {
  GcpFirebaseWebAppStackOutputs outputs = 1;
}
