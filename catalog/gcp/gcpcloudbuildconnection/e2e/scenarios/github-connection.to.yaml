# The second act of github-connection.yaml: the same connection with a second
# annotation, an update Google applies in place. Not a scenario of its own
# (the second-act annotation keeps discovery from running it as a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudBuildConnection
metadata:
  name: planton-oss-e2e-gcpcbcon-github
  id: planton-oss-e2e-gcpcbcon-github
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcloudbuildconnection
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-second-act: github-connection.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
    planton.dev/e2e-required-env: PLANTON_E2E_GCP_GITHUB_APP_INSTALLATION_ID,PLANTON_E2E_GCP_GITHUB_TOKEN_SECRET_VERSION
  tags:
    - planton-e2e
spec:
  location: us-central1
  connectionId: planton-e2e-github-${E2E_RUN_ID}
  annotations:
    purpose: e2e
    e2e-act: updated
  githubConfig:
    appInstallationId: ${E2E_ENV:PLANTON_E2E_GCP_GITHUB_APP_INSTALLATION_ID}
    authorizerCredential:
      oauthTokenSecretVersion:
        value: ${E2E_ENV:PLANTON_E2E_GCP_GITHUB_TOKEN_SECRET_VERSION}
