apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpcloudbuildconnection
spec:
  # Deferred: a working connection needs credentials only a person can
  # mint -- Cloud Build's GitHub App installed on a test organization (its
  # installation ID) and the authorizing account's OAuth token stored as a
  # Secret Manager secret version the Cloud Build service agent can read.
  # The scenario declares both as owner-arranged env tokens. Offline bar
  # met: both modules build and validate, offline plans for the reference
  # manifest, the scenario, and every code-host arm are clean on the pinned
  # provider, and the accounting is total. Live facts the proof lane
  # confirms once the tokens exist: (1) the connection creates and reaches
  # installation_stage COMPLETE; (2) an annotation change updates in
  # place; (3) destroy removes it (the verifier accepts 404).
  tier: 2
  status: deferred
  validated_provisioners: []
  timeout_minutes: 20
