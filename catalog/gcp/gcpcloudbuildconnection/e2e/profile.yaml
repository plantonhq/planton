apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpcloudbuildconnection
spec:
  # Proven live on both engines (2026-11-23) as the declared identity: a
  # github.com connection through Cloud Build's GitHub App installed on the
  # fixture organization planton-e2e-fixtures, authorized by a classic token
  # of its machine account planton-e2e-bot (repo, read:user, read:org) held
  # as a Secret Manager version the Cloud Build service agent reads. The
  # connection reaches installation_stage COMPLETE, re-plans clean, takes an
  # annotation change in place (UpdateConnection in the audit log) and is
  # destroyed.
  tier: 2
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
