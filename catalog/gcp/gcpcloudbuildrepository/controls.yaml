# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpcloudbuildrepository
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The link stores no code or data; the repository stays on the code host.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No customer data is stored by the link to encrypt with a customer key.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Builds clone the repository over the HTTPS remote_uri through the parent connection's credentials.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A repository link has no address of its own; access is through the Cloud Build API under IAM.
    - control_id: restricted-ingress
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Webhooks from the code host are verified with the webhook secret before Cloud Build acts on them.
    - control_id: edge-protection
      status: not_applicable
      notes: The block serves no traffic.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Linking and reading repositories requires cloudbuild.repositories permissions granted through IAM.
    - control_id: workload-identity
      status: not_applicable
      notes: No workload runs as this block; builds run as their trigger's service account.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths exist on Google's side to disable; code-host credentials are tokens kept in Secret Manager.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component enforces no end-user sign-in; access is administrative, whose posture rbac carries.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Repository link creates and deletes are Cloud Build admin writes recorded in Cloud Audit Logs (Admin Activity) unconditionally.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The block emits no metrics of its own.
    - control_id: backup-recovery
      status: not_applicable
      notes: The block holds configuration only; it is recreated from its manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A Cloud Build regional resource Google replicates within its region; there is no zone to choose.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: deletion_policy PREVENT makes destroy fail.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Cloud Build is fully Google-operated.
