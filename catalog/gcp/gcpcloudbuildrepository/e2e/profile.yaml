apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpcloudbuildrepository
spec:
  # Deferred: Google links a repository only through a connection whose
  # installation is complete, and that needs owner-arranged credentials
  # (see gcpcloudbuildconnection's profile) plus a test repository the
  # installation can see. The scenario's connection fixture and the
  # repository URI are owner-arranged env tokens. Offline bar met: both
  # modules build and validate, offline plans for the reference manifest
  # and the scenario are clean on the pinned provider, and the accounting
  # is total. Live facts the proof lane confirms: (1) the link creates
  # under the fixture connection and re-plans clean; (2) its name output
  # is the full repository name a trigger accepts; (3) destroy removes the
  # link before the connection (the verifier accepts 404).
  tier: 2
  status: deferred
  validated_provisioners: []
  timeout_minutes: 20
