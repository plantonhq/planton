# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpvpcnetwork
spec:
  gcp:
    groups:
      - purpose: EnableComputeApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling compute.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageNetwork
        permissions:
          - compute.networks.create
          - compute.networks.get
          - compute.networks.update
          - compute.networks.delete
          - compute.globalOperations.get
        provenance: derived
        notes: Covers google_compute_network -- create, read/refresh, in-place updates (routing mode, MTU), and destroy, plus polling the global operations every network mutation returns.
      - purpose: DeleteDefaultRoutes
        permissions:
          - compute.routes.list
          - compute.routes.delete
        provenance: derived
        notes: Required only when delete_default_routes_on_create is true -- the provider lists the new network's routes and deletes the auto-created default route after creation. Not needed otherwise.
