# GcpVpcNetwork install profile used when the network is an E2E PREREQUISITE for
# another component (e.g. a subnetwork). Custom-mode (no auto subnets) so the
# dependent subnet fully controls its address plan. VPC names are
# project-scoped with no soft-delete reservation, so the name stays fixed.
# project_id is omitted and rides the harness-exported GOOGLE_PROJECT.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVpcNetwork
metadata:
  name: planton-oss-e2e-gcpvpcnetwork-prereq
  id: planton-oss-e2e-gcpvpcnetwork-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpvpcnetwork
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  networkName: planton-oss-e2e-vpc-prereq
  autoCreateSubnetworks: false
