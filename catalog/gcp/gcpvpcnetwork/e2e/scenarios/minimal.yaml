# GcpVpcNetwork leaf scenario — the network kind never had a scenario (only a
# prerequisite profile). Exercises provider-floor depth fields on a
# custom-mode regional VPC.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVpcNetwork
metadata:
  name: planton-oss-e2e-gcpvpcnetwork-smoke
  id: planton-oss-e2e-gcpvpcnetwork-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpvpcnetwork
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  networkName: planton-oss-e2e-vpc-${E2E_RUN_ID}
  autoCreateSubnetworks: false
  description: Ephemeral VPC for the networking-depth E2E smoke; safe to delete
  mtu: 1460
  # STANDARD best-path selection with MED comparison armed: proves the
  # explicit-send wiring (alwaysCompareMed is sent true AND false — the
  # re-plan after deploy must show no diff, and a live edit to false must
  # actually land).
  bgpBestPathSelection:
    mode: STANDARD
    alwaysCompareMed: true
    interRegionCost: ADD_COST_TO_MED
  # Explicit DELETE keeps the destroy real and proves the no-op-diff
  # behavior of the new arm.
  deletionPolicy: DELETE
