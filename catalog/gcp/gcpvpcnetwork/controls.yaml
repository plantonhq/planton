# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: gcpvpcnetwork
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A VPC network is a software-defined network container; it stores no customer data at rest.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to encrypt (see enc-at-rest).
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Google encrypts VM-to-VM traffic that leaves a physical boundary within the VPC automatically (encryption in transit by default between Google datacenters); the network exposes no switch to weaken it.
      notes: Payload-level TLS between workloads remains the workloads' responsibility; this control covers the network fabric Google operates.
    - control_id: no-public-access
      status: not_applicable
      notes: The network itself has no public reachability -- internet exposure is created by external addresses, forwarding rules, and Cloud NAT, each a separate catalog kind with its own posture. Every VPC firewall starts with default-deny ingress.
    - control_id: restricted-ingress
      status: not_applicable
      notes: Ingress restriction lives on VPC firewall rules and policies -- separate catalog kinds that attach into the network. network_firewall_policy_enforcement_order only orders their evaluation.
    - control_id: edge-protection
      status: not_applicable
      notes: Request filtering attaches to edge components (load balancers, Cloud Armor policies), not to the network container.
    - control_id: rbac
      status: not_applicable
      notes: Management access is project IAM posture, not a component choice; the network exposes no authentication plane of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The network runs no workloads and holds no credentials of its own.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths of its own.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: Network traffic audit (VPC Flow Logs) is configured per subnetwork -- a separate catalog kind, not a field of this spec. Control-plane changes to the network land in Cloud Audit Logs as project-level posture.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The network container publishes no metrics of its own; traffic observability (flow logs, firewall logging) is configured on subnetworks and firewall rules, separate kinds.
    - control_id: backup-recovery
      status: not_applicable
      notes: Stateless network configuration -- nothing to back up; the manifest recreates the network declaratively.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A VPC network is a global resource spanning every region and zone by design; subnets choose regions, and the network itself has no single-zone failure mode.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Unset applies no engine-side stance; setting deletion_policy=PREVENT makes destroy plans fail before touching the network. A network carrying subnets or peerings also refuses deletion until they are removed, but that is dependency ordering, not a control.
      notes: No preset sets it; both presets are example networks meant to be re-creatable.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed software-defined networking -- Google operates and patches the underlying network fabric; no customer-visible patch surface exists.
