syntax = "proto3";

package dev.planton.gcp.gcpvpcnetwork.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpvpcnetwork/v1alpha1/outputs.proto";
import "catalog/gcp/gcpvpcnetwork/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-vpc-network
message GcpVpcNetwork {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpVpcNetwork'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpVpcNetworkSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpVpcNetworkStatus status = 5;
}

//gcp-vpc-network status
message GcpVpcNetworkStatus {
  //outputs
  //  outputs
  GcpVpcNetworkOutputs outputs = 1;
}
