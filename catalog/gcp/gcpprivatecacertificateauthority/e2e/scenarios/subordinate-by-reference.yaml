# GcpPrivateCaCertificateAuthority scenario: a two-tier chain. The registry
# prerequisite installs the subordinate's DevOps pool; the annotation adds
# the root's pool and the self-signed root, which signs this subordinate on
# create (first-party activation). The subordinate may sign leaves only
# (a zero path length, sent through zero_max_issuer_path_length).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpPrivateCaCertificateAuthority
metadata:
  name: planton-oss-e2e-gcppcaa-sub
  id: planton-oss-e2e-gcppcaa-sub
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpprivatecacertificateauthority
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "catalog/gcp/gcpprivatecacertificateauthority/e2e/prerequisites/root-pool.yaml,catalog/gcp/gcpprivatecacertificateauthority/e2e/prerequisites/root-ca.yaml"
  tags:
    - planton-e2e
spec:
  location: us-central1
  pool:
    valueFrom:
      kind: GcpPrivateCaPool
      name: planton-oss-e2e-gcppcaa-pool
      fieldPath: status.outputs.name
  certificateAuthorityId: e2e-gcppcaa-sub-${E2E_RUN_ID}
  type: SUBORDINATE
  subordinateConfig:
    certificateAuthority:
      valueFrom:
        kind: GcpPrivateCaCertificateAuthority
        name: planton-oss-e2e-gcppcaa-root-ca
        fieldPath: status.outputs.name
  config:
    subjectConfig:
      subject:
        commonName: Planton E2E Issuing CA
        organization: Planton
    x509Config:
      caOptions:
        isCa: true
        maxIssuerPathLength: 0
      keyUsage:
        baseKeyUsage:
          certSign: true
          crlSign: true
  keySpec:
    algorithm: EC_P256_SHA256
  lifetime: 1296000s
  deletionProtection: false
  skipGracePeriod: true
  ignoreActiveCertificatesOnDeletion: true
  labels:
    e2e-arm: subordinate-by-reference
