# GcpPrivateCaCertificateAuthority scenario: a self-signed root in the
# consumer-scoped DevOps pool, with a one-month P-256 certificate, deletion
# protection off, and skip_grace_period so teardown deletes it at once and
# the pool can go too.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpPrivateCaCertificateAuthority
metadata:
  name: planton-oss-e2e-gcppcaa-root
  id: planton-oss-e2e-gcppcaa-root
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpprivatecacertificateauthority
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  location: us-central1
  pool:
    valueFrom:
      kind: GcpPrivateCaPool
      name: planton-oss-e2e-gcppcaa-pool
      fieldPath: status.outputs.name
  certificateAuthorityId: e2e-gcppcaa-self-${E2E_RUN_ID}
  type: SELF_SIGNED
  config:
    subjectConfig:
      subject:
        commonName: Planton E2E Self-Signed Root
        organization: Planton
    x509Config:
      caOptions:
        isCa: true
      keyUsage:
        baseKeyUsage:
          certSign: true
          crlSign: true
  keySpec:
    algorithm: EC_P256_SHA256
  lifetime: 2592000s
  deletionProtection: false
  skipGracePeriod: true
  ignoreActiveCertificatesOnDeletion: true
  labels:
    e2e-arm: self-signed-root
