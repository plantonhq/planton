apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpprivatecacertificateauthority
spec:
  # Proven live on both engines (2026-11-20): a self-signed root in a DevOps
  # pool, and a subordinate signed by reference by a root in its own pool, each
  # created, relabeled in place (UpdateCertificateAuthority in Google's audit
  # log) and deleted at once with skip_grace_period by an identity holding only
  # this kind's permissions manifest, with the re-plan clean. A deleted pool's
  # ID is never usable again, so each scenario's fixture pools carry the
  # scenario in their IDs.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
