# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpprivatecacertificateauthority
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "The CA's private key lives in Cloud HSM (algorithm) or in the named Cloud KMS key; it never leaves the HSM."
    - control_id: enc-at-rest-cmk
      status: configurable
      field_path: key_spec.cloud_kms_key_version
      evidence:
        type: spec_default
        reference: "cloud_kms_key_version signs with a customer-managed Cloud KMS key version the customer owns and audits; algorithm uses a Google-managed HSM key."
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "The CA Service API is served over TLS only."
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Only principals with privateca permissions on the pool can have the authority sign; its published certificate and CRL are public by design."
    - control_id: restricted-ingress
      status: not_applicable
      notes: "The authority is an API resource with no network listener."
    - control_id: edge-protection
      status: not_applicable
      notes: "No edge is served."
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Creating, enabling, disabling, and deleting authorities requires privateca.certificateAuthorities.* permissions."
    - control_id: workload-identity
      status: not_applicable
      notes: "The authority holds no credential for workloads; it signs the certificates they use."
    - control_id: no-legacy-auth
      status: not_applicable
      notes: "No authentication happens at the authority."
    - control_id: strong-user-auth
      status: not_applicable
      notes: "No end-user sign-in exists."
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Authority administration and every signature are recorded in Cloud Audit Logs; a customer key adds Cloud KMS audit logs."
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "CA Service reports CA health and issuance metrics to Cloud Monitoring."
    - control_id: backup-recovery
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "A deleted authority stays restorable for 30 days unless skip_grace_period is set."
    - control_id: backup-retention-policy
      status: configurable
      field_path: skip_grace_period
      evidence:
        type: spec_default
        reference: "Unset keeps Google's 30-day recovery window; true deletes immediately and irreversibly."
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "CA Service is a regional service; an authority has no zonal dependency."
    - control_id: deletion-protection
      status: enforced_by_default
      field_path: deletion_protection
      evidence:
        type: spec_default
        reference: "deletion_protection defaults to true and is sent explicitly by both modules; a destroy fails until the manifest sets false and is applied."
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "CA Service is fully Google-operated."
