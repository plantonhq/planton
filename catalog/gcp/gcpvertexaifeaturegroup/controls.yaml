# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpvertexaifeaturegroup
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The feature group is registry metadata Vertex AI encrypts at rest with Google-managed keys; the feature data stays in BigQuery under the table's own encryption.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: The provider offers no key on a feature group; the feature data is protected by the source BigQuery table's own CMEK setting, and online copies by the online store's key.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every Vertex AI API call and every Feature Store read of BigQuery is TLS within Google's network; there is no plaintext path.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A feature group has no address of its own; it is reached only through the Vertex AI API under IAM.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network listener exists to restrict; access is API-level and governed by IAM.
    - control_id: edge-protection
      status: not_applicable
      notes: No edge is served; the feature group is registry metadata.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Reading or changing a feature group and its features requires aiplatform.featureGroups.* and aiplatform.features.* permissions on the project; reading the data requires BigQuery permissions on the source.
    - control_id: workload-identity
      status: not_applicable
      notes: The feature group authenticates nothing itself; Feature Store reads the source as the Vertex AI Service Agent, which is granted BigQuery access explicitly (the GUIDE says so).
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths exist to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component enforces no end-user sign-in; access is administrative, whose posture rbac carries.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every feature group and feature create, update, and delete is a Vertex AI admin write recorded in Cloud Audit Logs (Admin Activity) unconditionally.
    - control_id: monitoring-integration
      status: not_applicable
      notes: A feature group has no runtime to monitor; online stores and the BigQuery source emit their own metrics.
    - control_id: backup-recovery
      status: not_applicable
      notes: The group is metadata re-creatable from source control; the feature data is recovered through the BigQuery table's own time travel and snapshots.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A feature group is a regional Google-managed registry entry; there is no zonal placement to choose.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Unset means DELETE -- the features and the group are deleted on destroy (the BigQuery source is never touched); PREVENT makes destroy fail; ABANDON leaves them when the block leaves management. Fanned to every feature.
      notes: The 02-composite-entity-key preset sets PREVENT.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Feature Store is fully Google-operated; there is no software surface the customer patches.
