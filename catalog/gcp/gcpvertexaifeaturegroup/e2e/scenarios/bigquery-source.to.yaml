# The second act of bigquery-source.yaml: the same feature group with a new
# description -- a featureGroups.patch with the description mask that
# changes it in place (its id, location and BigQuery source recreate it).
# Not a scenario of its own (the second-act annotation keeps discovery from
# running it as a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVertexAiFeatureGroup
metadata:
  name: planton-oss-e2e-gcpvfg-bigquery
  id: planton-oss-e2e-gcpvfg-bigquery
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpvertexaifeaturegroup
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-second-act: bigquery-source.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
    planton.dev/e2e-prerequisites: "catalog/gcp/gcpvertexaifeaturegroup/e2e/prerequisites/gcpbigquerytable-features.yaml"
  tags:
    - planton-e2e
spec:
  location: us-central1
  featureGroupId: pln_e2e_vfg_${E2E_RUN_ID_UNDERSCORE}
  description: Planton OSS E2E feature group, re-described in place
  bigQuery:
    inputUri:
      valueFrom:
        kind: GcpBigQueryTable
        name: planton-oss-e2e-gcpvfg-source
        fieldPath: status.outputs.qualified_name
    entityIdColumns:
      - entity_id
  features:
    - featureId: age
      description: Age in years
      labels:
        pii: "false"
    - featureId: lifetime_value
  deletionPolicy: DELETE
