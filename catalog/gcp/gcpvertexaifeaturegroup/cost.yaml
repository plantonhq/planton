# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/componentcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostProfile
metadata:
  name: gcpvertexaifeaturegroup
spec:
  billing_model: free
  free_tier: A feature group and its registered features carry no meter of their own (per cloud.google.com/vertex-ai/pricing, Vertex AI Feature Store section, read 2026-09-23) -- they are registry metadata over a BigQuery table; nothing is copied or stored under Vertex AI.
  notes: "The spend around a feature group lives elsewhere. The source table bills storage and queries under BigQuery. The online stores whose feature views serve the group's features bill for their serving capacity and for the BigQuery reads each sync performs -- those charges belong to the online store and to BigQuery, not to this block."
