syntax = "proto3";

package dev.planton.gcp.gcpcomputedisk.v1alpha1;

// GcpComputeDiskOutputs captures observable values produced after
// provisioning a Compute Engine persistent disk.
message GcpComputeDiskOutputs {
  // Name of the disk in GCP.
  string name = 1;

  // Server-assigned unique numeric identifier of the disk.
  string disk_id = 2;

  // Self-link URL of the disk — the composition key a
  // GcpComputeInstance's boot_disk.source_disk or attached_disks[].source
  // consumes.
  string self_link = 3;

  // Zone the disk lives in (plain zone name, e.g. "us-central1-a").
  string zone = 4;

  // Provisioned size of the disk in GB.
  int32 size_gb = 5;

  // Disk type (plain type name, e.g. "pd-balanced").
  string type = 6;
}
