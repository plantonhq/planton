syntax = "proto3";

package dev.planton.gcp.gcpcomputedisk.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpcomputedisk/v1alpha1/outputs.proto";
import "catalog/gcp/gcpcomputedisk/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-compute-disk
message GcpComputeDisk {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpComputeDisk'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpComputeDiskSpec spec = 4 [(buf.validate.field).required = true];
  GcpComputeDiskStatus status = 5;
}

message GcpComputeDiskStatus {
  GcpComputeDiskOutputs outputs = 1;
}
