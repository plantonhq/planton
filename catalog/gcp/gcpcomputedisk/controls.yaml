# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: gcpcomputedisk
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Compute Engine encrypts every persistent disk at rest with Google-managed keys without configuration -- there is no unencrypted disk in GCP.
    - control_id: enc-at-rest-cmk
      status: configurable
      field_path: kms_key
      evidence:
        type: spec_default
        reference: Unset means Google-managed encryption; naming a Cloud KMS key at creation encrypts the disk with the customer-managed key. Immutable after creation -- changing keys means a new disk.
      notes: The 02-encrypted-database-volume preset pins a CMEK. The Compute Engine service agent needs roles/cloudkms.cryptoKeyEncrypterDecrypter on the key BEFORE create, and the destroy-time safety snapshot is encrypted with the same key.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Data moving between a VM and its persistent disk infrastructure is encrypted by Google at the storage layer on every disk, without configuration.
    - control_id: no-public-access
      status: not_applicable
      notes: A disk has no network endpoint -- it is a block device reachable only by attaching it to a VM in the same project and zone, an operation IAM governs. There is nothing to expose publicly.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network surface -- no ports, no firewall attachment point. Access is the attach operation, governed by IAM.
    - control_id: edge-protection
      status: not_applicable
      notes: No internet-facing surface exists for a WAF to front.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every operation on the disk -- attach, resize, snapshot, delete -- is governed by Compute Engine IAM permissions; nothing reads its blocks without first winning an IAM-authorized attach.
    - control_id: workload-identity
      status: not_applicable
      notes: A disk holds no identity and calls no APIs -- it is passive storage. Identity questions belong to the VM that mounts it.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: There is no authentication surface beyond IAM -- no passwords, no keys, no legacy protocol to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every administrative action on the disk (create, resize, snapshot, attach, delete) lands in Cloud Audit Logs' Admin Activity stream unconditionally.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Disk I/O metrics (read/write ops, throughput) publish to Cloud Monitoring through the VM the disk is attached to, without an agent.
      notes: An unattached disk generates no I/O and surfaces no per-disk metrics -- its only observable is inventory and audit logs.
    - control_id: backup-recovery
      status: configurable
      field_path: create_snapshot_before_destroy
      evidence:
        type: spec_default
        reference: Off by default; when set, destroying the disk first captures a final snapshot -- a last-resort net that makes even a mistaken destroy recoverable. Calendar-based snapshots attach through a snapshot-schedule resource policy, a separate resource outside this spec.
      notes: The 02-encrypted-database-volume preset enables it. The final snapshot bills snapshot storage until deleted.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: Snapshot retention is a property of the snapshot-schedule resource policy or of manual snapshot lifecycle -- both outside this spec, which carries no retention field.
    - control_id: multi-zone-ha
      status: not_applicable
      notes: This kind models a zonal disk -- the spec's own contract; regional persistent disks (synchronous two-zone replication) are a separate GCP resource shape this component deliberately does not model. Cross-zone durability here means snapshots, which are regional objects.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Default ("" = DELETE) destroys the disk and its data on IaC destroy; PREVENT fails the destroy outright -- the guard rail for precious data volumes; ABANDON removes the disk from management but leaves it (and its bill) alive in GCP.
      notes: create_snapshot_before_destroy is the softer companion net -- destruction proceeds but leaves a recoverable snapshot behind.
    - control_id: managed-patching
      status: not_applicable
      notes: A disk runs no software to patch. Whatever operating system lives on its blocks is patched through the VM that boots it.
