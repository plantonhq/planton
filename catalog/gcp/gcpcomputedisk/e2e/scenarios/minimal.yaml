# GcpComputeDisk scenario: the minimal empty data volume. Disk names are
# project-scoped with no reservation window, so the name stays fixed.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpComputeDisk
metadata:
  name: planton-oss-e2e-gcpdisk-minimal
  id: planton-oss-e2e-gcpdisk-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcomputedisk
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  zone: us-central1-a
  type: pd-balanced
  sizeGb: 50
  labels:
    e2e-suite: gcp
