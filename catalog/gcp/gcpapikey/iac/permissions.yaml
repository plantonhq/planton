# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpapikey
spec:
  gcp:
    groups:
      - purpose: EnableApiKeysApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
        provenance: derived
        notes: Covers google_project_service (Terraform) / projects.Service (Pulumi) enabling apikeys.googleapis.com on the target project -- the API every other call in this module is made against, and one a fresh project has disabled. The Terraform module pins disable_on_destroy=false and the Pulumi module leaves the field unset -- the provider's own reference states false OR UNSET leaves the service enabled on destroy (pinned 8.x line), so neither engine ever calls the disable path and serviceusage.services.disable is deliberately not granted.
      - purpose: ManageApiKey
        permissions:
          - apikeys.keys.create
          - apikeys.keys.get
          - apikeys.keys.update
          - apikeys.keys.delete
          - apikeys.keys.getKeyString
        provenance: derived
        notes: Covers google_apikeys_key (Terraform) / projects.ApiKey (Pulumi) -- create on first apply, get on every refresh and import, update when display_name or restrictions change (the key's identity fields recreate instead), and delete on destroy under deletion_policy DELETE (a soft delete; ABANDON and PREVENT call no delete API). getKeyString is required because both modules export the key string as an output -- the provider reads it through keys.getKeyString after create, a separate permission from the metadata read so it can be withheld from principals that only manage restrictions. roles/serviceusage.apiKeysAdmin contains all five. Undelete is deliberately not granted -- neither module recovers a soft-deleted key; recovery is an operator act.
