# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# One kind, one resource of substance plus its API enablement. Every
# restriction block and leaf matches its spec field by exact name; the two
# divergences are the key's identity (the provider calls the key id `name`;
# the spec says what it is) and the project (the catalog's project_id
# reference convention).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_apikeys_key:
    mappings:
      - spec: spec.project_id
        arg: project
      # The provider's `name` is the key's short resource id, not a display
      # name; the spec names it for what it is and carries the RFC 1034
      # rule the API enforces.
      - spec: spec.key_id
        arg: name
    exclusions:
      # Cross-engine parity rules an argument out when the pinned Pulumi
      # SDK cannot send it: a spec field one engine silently drops is worse
      # than an honest omission. Re-evaluate at the next SDK bump.
      - arg: check_existing_usage
        reason: >-
          SDK gap -- GA at the pin, but the pinned Pulumi SDK bridges an
          earlier provider line that has no check_existing_usage (nor the
          FORCE deletion_policy it pairs with); modeling it would break
          cross-engine parity. Re-evaluate when pulumi-gcp v10 (the 8.x
          bridge) is GA.

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables apikeys.googleapis.com,
      the API every create, read, and delete of the key talks to and one a
      fresh project has OFF; disable_on_destroy is false so destroying one
      key never switches off the API the project's other keys depend on.
