syntax = "proto3";

package dev.planton.gcp.gcpapikey.v1alpha1;

// GcpApiKeyStackOutputs captures the key's identity after provisioning.
message GcpApiKeyStackOutputs {
  // The key's full resource name:
  // projects/{project}/locations/global/keys/{key_id}. What the API Keys
  // API and IAM conditions address the key by.
  string name = 1;

  // The key's unique id (a UUID). This is the value a Firebase app
  // registration's api_key_id takes -- reference it from
  // GcpFirebaseAndroidApp / GcpFirebaseAppleApp / GcpFirebaseWebApp rather
  // than passing the key string.
  string uid = 2;

  // The key string -- the value a client presents to Google APIs. A
  // credential Google bills and rate-limits against the project, so both
  // engines mark it sensitive in their state and outputs; it reaches the
  // client build through the platform's secret handling, never a log or a
  // plan. (It ships inside the client binary by design; the restrictions on
  // the key, not the secrecy of the string, are what bound its blast
  // radius.)
  string key_string = 3;
}
