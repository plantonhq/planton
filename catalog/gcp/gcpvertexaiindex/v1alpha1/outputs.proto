syntax = "proto3";

package dev.planton.gcp.gcpvertexaiindex.v1alpha1;

// Outputs produced after provisioning a GCP Vertex AI Vector Search index.
message GcpVertexAiIndexOutputs {
  // Fully qualified index resource path — the value a
  // GcpVertexAiDeployedIndex passes as its `index` reference.
  // Format: projects/{project}/locations/{location}/indexes/{indexId}
  string index_id = 1;

  // The GCP-assigned numeric index ID (the last path segment of
  // index_id).
  string index_name = 2;

  // Cloud Storage URI of the YAML schema describing additional
  // index-specific information GCP attaches to this index type.
  string metadata_schema_uri = 3;

  // RFC3339 timestamp of when the index was created.
  string create_time = 4;

  // RFC3339 timestamp of when the index was last updated (data or
  // metadata).
  string update_time = 5;
}
