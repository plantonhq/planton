# GcpDeployCustomTargetType scenario: a task-based type with render and
# deploy containers, in the harness project. Nothing runs until a target
# using the type gets a rollout, so the images are never pulled. Free.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpDeployCustomTargetType
metadata:
  name: planton-oss-e2e-gcpcdctt-tasks
  id: planton-oss-e2e-gcpcdctt-tasks
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpdeploycustomtargettype
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  location: us-central1
  customTargetTypeId: planton-e2e-cdctt-tasks-${E2E_RUN_ID}
  description: Ephemeral custom target type for an E2E lane; safe to delete
  tasks:
    render:
      container:
        image: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
        command:
          - /bin/bash
        args:
          - -c
          - echo render
    deploy:
      container:
        image: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
        command:
          - /bin/bash
        args:
          - -c
          - echo deploy
        env:
          PLANTON_E2E: "true"
