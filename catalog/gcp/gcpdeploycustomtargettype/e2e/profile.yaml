apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpdeploycustomtargettype
spec:
  # Awaiting the live proof lane. Both scenarios create a type in the
  # harness project and need no fixtures: Cloud Deploy stores the
  # definition and runs nothing until a target that uses the type gets a
  # rollout, so the images and the Git repository are never pulled. Free.
  # Offline bar met: both modules build and validate, offline plans for
  # the reference manifest and every scenario are clean on the pinned
  # provider, and the accounting is total. Live facts the proof lane
  # confirms: (1) a task-based and an action-based type create and
  # re-plan clean on both engines (the tasks field is in the 8.3 provider
  # but not in the pinned API client's discovery document, so its
  # round-trip is the proof); (2) Google accepts Skaffold module sources
  # it has not fetched yet (the actions scenario's Cloud Storage path is a
  # placeholder) -- if it validates them at create, the scenario keeps
  # only the public Git module; (3) the name output is the full name a
  # target's custom_target_type accepts; (4) destroy removes it (the
  # verifier accepts 404).
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 20
