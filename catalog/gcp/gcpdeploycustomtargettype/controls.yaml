# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpdeploycustomtargettype
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The type is configuration; it stores no customer data of its own.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No customer data is stored by the type to encrypt with a customer key.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The type terminates no connections; management calls ride the TLS-only Cloud Deploy API endpoint.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A custom target type has no address of its own; access is through the Cloud Deploy API under IAM.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network listener exists to restrict; the containers run in each target execution environment, whose worker pool carries network posture.
    - control_id: edge-protection
      status: not_applicable
      notes: The type serves no traffic.
    - control_id: rbac
      status: not_applicable
      notes: The type grants no access; who may deploy through it is governed by IAM on the pipelines and targets that use it.
    - control_id: workload-identity
      status: not_applicable
      notes: The render and deploy containers run as the execution service account of each target that uses the type, configured on the GcpDeployTarget.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths exist to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component enforces no end-user sign-in.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Type changes are Cloud Deploy admin writes recorded in Cloud Audit Logs (Admin Activity) unconditionally.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The type emits no metrics of its own; render and deploy logs land in Cloud Build on each rollout.
    - control_id: backup-recovery
      status: not_applicable
      notes: The type holds configuration only; it is recreated from its manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The type is a regional Cloud Deploy API resource Google operates; there is no placement to choose.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: deletion_policy PREVENT makes destroy fail.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Cloud Deploy is fully Google-operated; the container images the tasks name are the owner to patch.
