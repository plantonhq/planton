syntax = "proto3";

package dev.planton.gcp.gcpdeploycustomtargettype.v1alpha1;

// GcpDeployCustomTargetTypeStackOutputs carries the custom target type's
// identity: what a Cloud Deploy target's custom_target.custom_target_type
// takes.
message GcpDeployCustomTargetTypeStackOutputs {
  // Full resource name:
  // projects/{project}/locations/{location}/customTargetTypes/{custom_target_type_id}.
  string name = 1;
  // The custom target type's ID.
  string custom_target_type_id = 2;
  // Google's unique identifier for the custom target type.
  string uid = 3;
}
