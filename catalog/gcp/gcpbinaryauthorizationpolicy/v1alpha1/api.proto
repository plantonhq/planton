syntax = "proto3";

package dev.planton.gcp.gcpbinaryauthorizationpolicy.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpbinaryauthorizationpolicy/v1alpha1/outputs.proto";
import "catalog/gcp/gcpbinaryauthorizationpolicy/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-binary-authorization-policy
message GcpBinaryAuthorizationPolicy {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpBinaryAuthorizationPolicy'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpBinaryAuthorizationPolicySpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpBinaryAuthorizationPolicyStatus status = 5;
}

//gcp-binary-authorization-policy status
message GcpBinaryAuthorizationPolicyStatus {
  //stack-outputs
  GcpBinaryAuthorizationPolicyStackOutputs outputs = 1;
}
