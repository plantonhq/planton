# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpbinaryauthorizationpolicy
spec:
  gcp:
    groups:
      - purpose: EnableBinaryAuthorizationApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling binaryauthorization.googleapis.com on the policy's project. disable_on_destroy is false, so the disable permission is never needed.
      - purpose: ManagePolicy
        permissions:
          - binaryauthorization.policy.get
          - binaryauthorization.policy.update
        provenance: derived
        notes: Covers google_binary_authorization_policy (Pulumi binaryauthorization.Policy) -- create, update, and the DELETE destroy (which writes Google's default policy) are all a PUT of the project's one policy, read on every refresh. Held on the project (roles/binaryauthorization.policyEditor). The provider-default project lookup reads provider configuration only and needs no permission.
      - purpose: ReadRequiredAttestors
        permissions:
          - binaryauthorization.attestors.get
        provenance: derived
        condition:
          spec_field_set: default_admission_rule.require_attestations_by
        notes: Google refuses a policy naming an attestor the caller cannot read (roles/binaryauthorization.attestorsViewer on each attestor, which may live in another project). Needed when any rule requires attestation.
