apiVersion: gcp.planton.dev/v1alpha1
kind: GcpDnsRecord
metadata:
  name: my-canary-record
spec:
  projectId:
    value: "<gcp-project-id>"
  managedZone:
    value: "<dns-zone-name>"
  type: A
  name:
    value: "api.example.com."
  routingPolicy:
    wrr:
      # Traffic splits by weight ratio: 95% stable, 5% canary. Shift the
      # weights to progress the rollout; a weight of 0 stages an entry
      # with no traffic.
      - weight: 95
        values:
          - value: <stable-ipv4-address>
      - weight: 5
        values:
          - value: <canary-ipv4-address>
  # Low TTL so weight changes take effect quickly during the rollout.
  ttlSeconds: 60
