# Public zone prerequisite for GcpDnsRecord scenarios. Run-scoped dnsName
# so parallel runs never collide.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpDnsZone
metadata:
  name: planton-oss-e2e-zone-drec-prereq
  id: planton-oss-e2e-zone-drec-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpdnszone
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  visibility: public
  dnsName: e2e-${E2E_RUN_ID}.example.com.
  description: Ephemeral public zone for GcpDnsRecord E2E
