syntax = "proto3";

package dev.planton.gcp.gcpspannerinstance.v1alpha1;

// GcpSpannerInstanceOutputs captures observable values produced after
// provisioning a Cloud Spanner instance.
message GcpSpannerInstanceOutputs {
  // Fully qualified instance ID.
  // Format: projects/{project}/instances/{instance_name}
  // This is the canonical identifier used for IAM bindings and API calls.
  string instance_id = 1;

  // Short instance name. This is the value that GcpSpannerDatabase,
  // GcpSpannerBackupSchedule, and other downstream resources use to
  // reference this instance.
  string instance_name = 2;

  // Instance state: CREATING or READY.
  // CREATING indicates the instance is being provisioned.
  // READY indicates the instance is available for use.
  string state = 3;

  // The instance configuration the instance was created with
  // (e.g. "regional-us-central1", "nam6") — the geographic topology
  // handle auditors and capacity planners ask for. Always the plain
  // config name: the Spanner API reads the value back as the fully
  // qualified projects/{project}/instanceConfigs/{name} path, and both
  // engines normalize to the last path segment.
  string config = 4;
}
