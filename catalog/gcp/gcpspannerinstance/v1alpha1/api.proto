syntax = "proto3";

package dev.planton.gcp.gcpspannerinstance.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpspannerinstance/v1alpha1/outputs.proto";
import "catalog/gcp/gcpspannerinstance/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-spanner-instance
message GcpSpannerInstance {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpSpannerInstance'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpSpannerInstanceSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpSpannerInstanceStatus status = 5;
}

//gcp-spanner-instance status
message GcpSpannerInstanceStatus {
  //outputs
  GcpSpannerInstanceOutputs outputs = 1;
}
