# Autoscaling GcpSpannerInstance scenario: the managed-autoscaler arm with
# processing-unit bounds and explicit utilization targets. Exercises the
# autoscaling_config module branch on both engines; the verifier asserts
# GCP allocated real capacity within the bounds.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSpannerInstance
metadata:
  name: planton-oss-e2e-gcpspn-autoscale
  id: planton-oss-e2e-gcpspn-autoscale
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpspannerinstance
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  instanceName: planton-oss-e2e-spn-autoscale
  config: regional-us-central1
  displayName: Planton E2E Autoscale
  edition: ENTERPRISE
  autoscalingConfig:
    autoscalingLimits:
      minProcessingUnits: 1000
      maxProcessingUnits: 2000
    autoscalingTargets:
      highPriorityCpuUtilizationPercent: 65
      storageUtilizationPercent: 80
      # The total-CPU signal (user traffic + background maintenance).
      totalCpuUtilizationPercent: 70
  deletionPolicy: DELETE
