# GcpSpannerInstance install profile for consumers (GcpSpannerDatabase,
# GcpSpannerBackupSchedule chains). The smallest billable footprint — 100
# processing units, regional config. metadata.name stays fixed for FK
# resolution; instance names release immediately on delete, so the
# cloud-side name is fixed too.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSpannerInstance
metadata:
  name: planton-oss-e2e-gcpspn-prereq
  id: planton-oss-e2e-gcpspn-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpspannerinstance
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  instanceName: planton-oss-e2e-spn-prereq
  config: regional-us-central1
  displayName: Planton E2E Prereq
  processingUnits: 100
  edition: STANDARD
