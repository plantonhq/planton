# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# Three resources provisioned as one node: the hierarchical firewall policy,
# one rule per spec.rules entry, and one association per spec.associations
# entry. The all-in-one google_compute_firewall_policy_with_rules variant is
# deliberately not consumed (dispositions ledger): two shapes for one policy
# would give the catalog two truths.

resources:
  google_compute_firewall_policy:
    mappings:
      # The parent: the provider takes one string (organizations/{id} or
      # folders/{id}); the spec models it as a message with one arm per
      # hierarchy node so a folder-level policy can reference its GcpFolder
      # -- the module renders the string from whichever arm is set.
      - spec: spec.parent.organization_id
        arg: parent
      - spec: spec.parent.folder_id
        arg: parent

  google_compute_firewall_policy_rule:
    # Instantiated per entry of spec.rules.
    specRoot: spec.rules
    mappings:
      # The provider's secure-tag blocks carry {name, state}; state is
      # read-only, so each spec reference resolves to the one input, name.
      - spec: spec.rules.target_secure_tags
        arg: target_secure_tags.name
      - spec: spec.rules.match.src_secure_tags
        arg: match.src_secure_tags.name
      # The kind-level deletion_policy fans to every rule.
      - spec: spec.deletion_policy
        arg: deletion_policy
    exclusions:
      - arg: firewall_policy
        reason: wired by the module to the policy it creates -- the rules are the policy's own

  google_compute_firewall_policy_association:
    # Instantiated per entry of spec.associations.
    specRoot: spec.associations
    mappings:
      # organizations/{id} or folders/{id}, rendered from the exactly-one-arm
      # target message the way the policy's parent is.
      - spec: spec.associations.target.organization_id
        arg: attachment_target
      - spec: spec.associations.target.folder_id
        arg: attachment_target
      # The kind-level deletion_policy fans to every association.
      - spec: spec.deletion_policy
        arg: deletion_policy
    exclusions:
      - arg: firewall_policy
        reason: wired by the module to the policy it creates -- an association attaches this policy and no other
