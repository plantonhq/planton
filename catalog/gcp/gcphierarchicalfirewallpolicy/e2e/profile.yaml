apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcphierarchicalfirewallpolicy
spec:
  # A hierarchical firewall policy exists only inside a Google Cloud
  # Organization. Proven live on both engines (2026-11-23, test organization
  # planton-e2e.com) as the declared identity, granted on the organization
  # the groups that reach it: a policy on the organization with threat
  # intelligence, geography and a disabled rule, and a policy on a folder
  # fixture associated with it. Each second act changes the description,
  # judged in place from the organization's or the folder's Admin Activity
  # log (firewallPolicies.patch). What the runs taught: polling the
  # organization-level operation needs compute.globalOperations.get; Google
  # refuses a rule that names no source (INGRESS) or destination (EGRESS),
  # a catch-all goto_next included; and Google stores a named protocol's
  # number as its name, so the spec asks for the name. Short and association
  # names carry the run id because Google does not free a deleted policy's
  # short name immediately.
  tier: 2
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
