syntax = "proto3";

package dev.planton.gcp.gcpfirebaseproject.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpfirebaseproject/v1alpha1/outputs.proto";
import "catalog/gcp/gcpfirebaseproject/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-firebase-project
message GcpFirebaseProject {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpFirebaseProject'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpFirebaseProjectSpec spec = 4 [(buf.validate.field).required = true];
  GcpFirebaseProjectStatus status = 5;
}

message GcpFirebaseProjectStatus {
  GcpFirebaseProjectStackOutputs outputs = 1;
}
