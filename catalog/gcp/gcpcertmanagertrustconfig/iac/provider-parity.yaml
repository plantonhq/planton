# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason.

resources:
  google_certificate_manager_trust_config:
    mappings:
      # Renames: the spec says what each field IS.
      - spec: spec.trust_config_name
        arg: name
      - spec: spec.project_id
        arg: project
      # Each PEM is a one-field block in the provider; the spec lifts the
      # wrapper into a plain string list.
      - spec: spec.allowlisted_certificates
        arg: allowlisted_certificates.pem_certificate
      - spec: spec.trust_stores.trust_anchors
        arg: trust_stores.trust_anchors.pem_certificate
      - spec: spec.trust_stores.intermediate_cas
        arg: trust_stores.intermediate_cas.pem_certificate

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables
      certificatemanager.googleapis.com with fixed arguments
      (disable_on_destroy false so destroying one trust config never
      disables the API project-wide); not spec surface.
