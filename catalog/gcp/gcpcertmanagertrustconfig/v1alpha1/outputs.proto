syntax = "proto3";

package dev.planton.gcp.gcpcertmanagertrustconfig.v1alpha1;

// Outputs produced after provisioning a Certificate Manager trust config.
message GcpCertManagerTrustConfigOutputs {
  // Full resource name of the trust config
  // (projects/{project}/locations/{location}/trustConfigs/{name}) -- the
  // value a server TLS policy's mTLS client-validation trust config and a
  // backend authentication config take.
  string trust_config_id = 1;

  // Name of the trust config as it exists in GCP.
  string trust_config_name = 2;

  // The Certificate Manager location the trust config lives in ("global"
  // unless a regional location was configured).
  string location = 3;
}
