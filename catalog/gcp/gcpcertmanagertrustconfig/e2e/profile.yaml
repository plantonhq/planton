apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpcertmanagertrustconfig
spec:
  # Awaiting the live proof lane. One leaf scenario, no prerequisites: a
  # global trust config whose trust store holds a throwaway self-signed
  # test root (generated for this scenario; its private key was never
  # committed) and one allowlisted self-signed device certificate. Free --
  # a trust config bills nothing until a TLS policy validates connections
  # with it. Offline bar met: both modules build and validate, offline
  # plans for the reference manifest, the scenario, and the presets are
  # clean on the pinned provider, and the accounting is total. Live facts
  # the proof lane confirms: (1) Certificate Manager accepts the test root
  # as a trust anchor and the device certificate as an allowlisted entry;
  # (2) the config reads back with the platform attribution labels and
  # RE-PLANS CLEAN on both engines -- the location "global" both modules
  # send when unset, and the sensitive trust-anchor blocks, must not diff;
  # (3) destroy leaves the verifier reading 404.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 15
