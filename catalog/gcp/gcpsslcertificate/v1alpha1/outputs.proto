syntax = "proto3";

package dev.planton.gcp.gcpsslcertificate.v1alpha1;

// Outputs produced after provisioning a self-managed GCP SSL certificate.
// The private key is write-only in GCP and deliberately never appears here.
message GcpSslCertificateOutputs {
  // Self-link URI of the SSL certificate. This is the value a target HTTPS
  // (or SSL) proxy references in its ssl_certificates list — the composition
  // handle that terminates TLS at the load balancer.
  // Global: https://www.googleapis.com/compute/v1/projects/{project}/global/sslCertificates/{name}
  // Regional: https://www.googleapis.com/compute/v1/projects/{project}/regions/{region}/sslCertificates/{name}
  string self_link = 1;

  // Name of the SSL certificate as it exists in GCP.
  string certificate_name = 2;

  // Server-assigned numeric ID of the certificate.
  string certificate_id = 3;

  // Expiry time of the certificate in RFC3339 format, parsed by GCP from the
  // uploaded chain. Self-managed certificates do NOT renew themselves — plan
  // the create-before-destroy rotation off this timestamp.
  string expire_time = 4;

  // Region of a regional certificate; empty for a global one. Downstream
  // composition can use this to confirm scope compatibility (regional
  // proxies require certificates in their own region).
  string region = 5;
}
