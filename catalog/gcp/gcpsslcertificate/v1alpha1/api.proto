syntax = "proto3";

package dev.planton.gcp.gcpsslcertificate.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpsslcertificate/v1alpha1/outputs.proto";
import "catalog/gcp/gcpsslcertificate/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-ssl-certificate
message GcpSslCertificate {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpSslCertificate'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpSslCertificateSpec spec = 4 [(buf.validate.field).required = true];
  GcpSslCertificateStatus status = 5;
}

message GcpSslCertificateStatus {
  GcpSslCertificateOutputs outputs = 1;
}
