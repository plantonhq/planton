# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: gcpsslcertificate
spec:
  billing_model: free
  free_tier: "A Compute Engine SSL certificate is a configuration object of Cloud Load Balancing with no meter of its own -- Google charges nothing to upload, hold, or attach the certificate, global or regional, at any count. The complete Cloud Load Balancing meter list on Google's network pricing page (forwarding rules, data processing, internal-ALB proxy instances, authorization policies, custom request headers, and self-managed-certificate connections) contains no charge for the certificate resource at rest."
  notes: "One conditional meter is keyed to this object's key type: Google bills $0.45 per 1,000,000 load balancer connections established using SELF-MANAGED certificates with RSA-3072 or RSA-4096 keys (network pricing, SSL certificates section). Certificates with RSA-2048, ECDSA P-256, or ECDSA P-384 keys -- and all Google-managed certificates -- have no per-connection charge, so the private_key you upload decides whether this meter exists at all. Beyond that, the real spend lives on the load balancer presenting the certificate: the forwarding rule bills per hour (first 5 rules $0.025/hour per project, each additional $0.01/hour) and the load balancer bills per-GiB inbound and outbound data processing in the regions where traffic is processed -- both on the GcpGlobalForwardingRule/frontend kinds, never on this one. The certificate also does not renew itself; the operational cost of rotation is time, not money."
