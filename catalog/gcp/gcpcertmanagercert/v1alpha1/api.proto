syntax = "proto3";

package dev.planton.gcp.gcpcertmanagercert.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpcertmanagercert/v1alpha1/outputs.proto";
import "catalog/gcp/gcpcertmanagercert/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-cert-manager-cert
message GcpCertManagerCert {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpCertManagerCert'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpCertManagerCertSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpCertManagerCertStatus status = 5;
}

//gcp-cert-manager-cert status
message GcpCertManagerCertStatus {
  //outputs
  GcpCertManagerCertOutputs outputs = 1;
}
