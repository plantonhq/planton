# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# (The deprecated self_managed PEM aliases -- certificate_pem /
# private_key_pem -- are outside the checker's universe by rule: the
# current pem_certificate / pem_private_key pair is the modeled surface.)

resources:
  google_certificate_manager_certificate:
    mappings:
      # Renames: the spec says what each field IS where the provider
      # inherits terser API names.
      - spec: spec.cert_name
        arg: name
      - spec: spec.project_id
        arg: project
    exclusions:
      - arg: self_managed.pem_private_key_wo
        reason: >-
          the write-only variant of the modeled self_managed.pem_private_key
          -- same key material, differing only in Terraform-state hygiene;
          adopting it would raise this one module's toolchain floor to
          Terraform/OpenTofu >= 1.11 (write-only arguments), a divergence
          from the catalog-wide assumption; re-evaluate when the catalog
          declares a >= 1.11 floor
      - arg: self_managed.pem_private_key_wo_version
        reason: >-
          the re-send trigger for self_managed.pem_private_key_wo; rides
          the same judgment and re-evaluate trigger (see
          self_managed.pem_private_key_wo)

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables
      certificatemanager.googleapis.com with fixed arguments
      (disable_on_destroy false so destroying one certificate never
      disables the API project-wide); not spec surface.
