# GcpGkeCluster install profile used when the cluster is an E2E PREREQUISITE
# for another component (e.g. a node pool). The fastest cluster GKE can
# create: ZONAL Standard control plane with GKE-managed pod/service ranges.
# Cluster names are project-scoped with no soft-delete reservation, so the
# name stays fixed. project_id is omitted and rides the harness-exported
# GOOGLE_PROJECT. deletion_protection is explicitly false so the ephemeral
# destroy just works.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGkeCluster
metadata:
  name: planton-oss-e2e-gke-prereq
  id: planton-oss-e2e-gke-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpgkecluster
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  description: Ephemeral zonal GKE cluster serving as an E2E prerequisite; safe to delete
  # us-east1 with the whole GKE chain (2026-08-12 us-central1 GCE_STOCKOUT).
  location: us-east1-b
  network:
    valueFrom:
      kind: GcpVpcNetwork
      name: planton-oss-e2e-gcpvpcnetwork-prereq
      fieldPath: status.outputs.network_self_link
  subnetwork:
    valueFrom:
      kind: GcpSubnetwork
      name: planton-oss-e2e-gcpsnw-gke-prereq
      fieldPath: status.outputs.subnetwork_self_link
  deletionProtection: false
