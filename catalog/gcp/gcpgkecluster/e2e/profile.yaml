apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpgkecluster
spec:
  # Proven live on both engines (2026-11-20): a zonal Standard cluster, a
  # regional private cluster and an Autopilot cluster, each deployed, the
  # private cluster's maintenance window moved in place (SetMaintenancePolicy
  # in Google's audit log) and destroyed by an identity holding only this
  # kind's permissions manifest, with the re-plan clean. The short-lived
  # default pool boots from pd-standard, so a regional cluster fits a fresh
  # project's 250 GB regional SSD quota; a Standard cluster's creator needs
  # actAs on the Compute Engine default account the pool runs as; the Logging
  # and Monitoring APIs are enabled with the cluster.
  tier: 1
  # Live-proven 2026-08-12 on both engines at the full spec surface of the release then pinned:
  # 3 scenarios (minimal zonal, private-cluster regional incl. RBAC
  # lockdown + Secret Manager CSI rotation + DNS-endpoint token serving +
  # both read-side switches, autopilot incl. autopilot_policy +
  # node_pool_auto_config) x 2 engines, all phases green under the
  # apply-idempotency gate. Scenarios live in us-east1: a us-central1
  # regional create failed on GCE_STOCKOUT for its transient default-pool
  # instances (the recurring zonal-capacity class in e2e/README.md).
  #
  # Proven live on both engines with the time-of-day recurring maintenance
  # window (the private-cluster scenario), which round-trips and re-plans
  # clean although the provider normalizes durations. Rollback-safe upgrades
  # and the checkpointing and node-readiness addons are proven offline only.
  # The fleet_membership output (empty without fleet_project) is proven end
  # to end by the GcpGkeFleetScope bind-fleet-registered-cluster scenario.
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 180
