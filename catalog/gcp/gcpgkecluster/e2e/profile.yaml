apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpgkecluster
spec:
  # GKE control planes are the slowest resources in the harness: creates run
  # 10-25 minutes and destroys 5-10, per scenario per engine. With three
  # scenarios (minimal, private-cluster, autopilot), batch runs with a
  # go test -timeout of at least 180m.
  tier: 1
  # Live-proven 2026-08-12 on both engines at the full spec surface of the release then pinned:
  # 3 scenarios (minimal zonal, private-cluster regional incl. RBAC
  # lockdown + Secret Manager CSI rotation + DNS-endpoint token serving +
  # both read-side switches, autopilot incl. autopilot_policy +
  # node_pool_auto_config) x 2 engines, all phases green under the
  # apply-idempotency gate. Scenarios live in us-east1: a us-central1
  # regional create failed on GCE_STOCKOUT for its transient default-pool
  # instances (the recurring zonal-capacity class in e2e/README.md).
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 180
