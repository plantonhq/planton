# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpgkecluster
spec:
  gcp:
    groups:
      - purpose: EnableContainerApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
          - resourcemanager.projects.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: "Covers google_project_service enabling container.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed. Proven 2026-10-20 on dev by the least-privilege lane: an identity holding exactly the kind's rendered permissions deployed, updated and destroyed it. The provider reads the project with resourcemanager.projects.get before its services on every refresh, so a re-plan or destroy needs it (measured live)."
      - purpose: ManageCluster
        permissions:
          - container.clusters.create
          - container.clusters.get
          - container.clusters.update
          - container.clusters.delete
          - container.operations.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: "Covers google_container_cluster -- create, read/refresh, in-place updates, and destroy, plus polling the long-running operations every mutation returns. Proven 2026-10-20 on dev by the least-privilege lane: an identity holding exactly the kind's rendered permissions deployed, updated and destroyed it."
      - purpose: ActAsNodeServiceAccount
        permissions:
          - iam.serviceAccounts.actAs
        provenance: derived
        reach: target
        privilege: uses_identity
        condition:
          spec_field_set: cluster_autoscaling.auto_provisioning_defaults.service_account
        notes: Required only when cluster_autoscaling.auto_provisioning_defaults.service_account selects a custom node service account -- GKE demands actAs on that account before it will provision nodes running as it. Not needed when node identity is left to the provider default.
