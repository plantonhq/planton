# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpgkecluster
spec:
  gcp:
    groups:
      - purpose: EnableClusterApis
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
          - resourcemanager.projects.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: "Covers google_project_service enabling container.googleapis.com, monitoring.googleapis.com, and logging.googleapis.com (unless the spec turns logging off) on the target project. disable_on_destroy is false in the module, so the disable permission is never needed. Proven 2026-10-20 on dev by the least-privilege lane: an identity holding exactly the kind's rendered permissions deployed, updated and destroyed it. The provider reads the project with resourcemanager.projects.get before its services on every refresh, so a re-plan or destroy needs it (measured live)."
      - purpose: ManageCluster
        permissions:
          - container.clusters.create
          - container.clusters.get
          - container.clusters.update
          - container.clusters.delete
          - container.operations.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: "Covers google_container_cluster -- create, read/refresh, in-place updates, and destroy, plus polling the long-running operations every mutation returns. Proven 2026-10-20 on dev by the least-privilege lane: an identity holding exactly the kind's rendered permissions deployed, updated and destroyed it."
      - purpose: ActAsDefaultNodeServiceAccount
        permissions:
          - iam.serviceAccounts.actAs
        provenance: derived
        reach: target
        privilege: uses_identity
        notes: A Standard cluster is created with a default node pool that runs as the project's Compute Engine default service account, so GKE demands actAs on that account before creating the cluster, even though the module removes the pool right after ("The user does not have access to service account ...-compute@developer.gserviceaccount.com", measured). An Autopilot cluster creates without it (measured); the manifest cannot condition a group on a field being unset, so the group is listed for both. A custom node service account (cluster_autoscaling.auto_provisioning_defaults.service_account) needs actAs on that account the same way.
