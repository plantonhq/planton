apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpcloudbuildtrigger
spec:
  # Proven live on both engines (2026-11-18): a Pub/Sub trigger with an inline
  # build and a user-specified service account, a webhook trigger over a
  # secret, and a regional trigger on a worker pool, each deployed and
  # destroyed by an identity holding only this kind's permissions manifest,
  # and the Pub/Sub trigger updated in place; every scenario re-planned clean
  # (build.timeout's default and the computed approval_config read back
  # without drift). The repository-event and filename arms stay offline-only
  # until the Cloud Build GitHub connection is proven.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
