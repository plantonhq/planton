# Consumer-scoped GcpServiceAccount install profile for the gcpcbtrg
# scenarios: the identity the triggers' builds run as, with the
# logs-writer grant a user-specified build account needs. The cloud-side
# account id carries ${E2E_RUN_ID} (account ids are reserved briefly after
# deletion); metadata.name stays fixed for FK resolution.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpServiceAccount
metadata:
  name: planton-oss-e2e-gcpcbtrg-sa
  id: planton-oss-e2e-gcpcbtrg-sa
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpserviceaccount
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  serviceAccountId: e2e-cbtrg-${E2E_RUN_ID}
  displayName: Planton OSS E2E Cloud Build trigger identity
  description: Ephemeral build identity deployed as an E2E prerequisite; safe to delete
  projectIamRoles:
    - roles/logging.logWriter
