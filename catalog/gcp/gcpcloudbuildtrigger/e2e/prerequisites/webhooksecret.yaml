# Consumer-scoped GcpSecretManagerSecret install profile for the gcpcbtrg
# webhook scenario: the webhook's key, seeded as version 1, readable by
# Google's Cloud Build service agent (named by the project NUMBER, an
# owner-arranged env token). Secret IDs are project-scoped and
# hard-deleted, but the ID still carries ${E2E_RUN_ID} so parallel engine
# runs never collide.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSecretManagerSecret
metadata:
  name: planton-oss-e2e-gcpcbtrg-secret
  id: planton-oss-e2e-gcpcbtrg-secret
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpsecretmanagersecret
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  secretId: e2e-cbtrg-hook-${E2E_RUN_ID}
  initialVersion:
    data:
      value: planton-e2e-webhook-key
  iamMembers:
    - role: roles/secretmanager.secretAccessor
      member:
        value: serviceAccount:service-${E2E_ENV:PLANTON_E2E_GCP_PROJECT_NUMBER}@gcp-sa-cloudbuild.iam.gserviceaccount.com
  deletionPolicy: DELETE
