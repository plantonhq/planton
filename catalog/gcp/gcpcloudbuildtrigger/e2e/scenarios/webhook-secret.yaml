# GcpCloudBuildTrigger scenario: a global webhook trigger whose key is the
# secret fixture's first version, with a one-step inline build running as
# the service-account fixture. The secret grants Google's Cloud Build
# service agent secretAccessor; the agent's email needs the harness
# project's NUMBER, an owner-arranged env token, so the scenario skips
# without it. Nothing calls the webhook, so no build runs. Free.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudBuildTrigger
metadata:
  name: planton-oss-e2e-gcpcbtrg-webhook
  id: planton-oss-e2e-gcpcbtrg-webhook
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcloudbuildtrigger
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-required-env: PLANTON_E2E_GCP_PROJECT_NUMBER
    planton.dev/e2e-prerequisites: "catalog/gcp/gcpcloudbuildtrigger/e2e/prerequisites/serviceaccount.yaml,catalog/gcp/gcpcloudbuildtrigger/e2e/prerequisites/webhooksecret.yaml"
  tags:
    - planton-e2e
spec:
  triggerName: planton-e2e-webhook-${E2E_RUN_ID}
  description: Planton E2E webhook trigger; safe to delete
  serviceAccount:
    valueFrom:
      kind: GcpServiceAccount
      name: planton-oss-e2e-gcpcbtrg-sa
      fieldPath: status.outputs.name
  webhookConfig:
    secret:
      valueFrom:
        kind: GcpSecretManagerSecret
        name: planton-oss-e2e-gcpcbtrg-secret
        fieldPath: status.outputs.latest_version_name
  substitutions:
    _EVENT: $(body.event)
  filter: _EVENT == "release"
  build:
    steps:
      - name: ubuntu
        script: echo "webhook event $_EVENT"
    options:
      logging: CLOUD_LOGGING_ONLY
