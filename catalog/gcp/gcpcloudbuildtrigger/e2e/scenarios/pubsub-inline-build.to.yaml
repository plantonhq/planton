# The second act of pubsub-inline-build.yaml: the same trigger with its
# description changed, an in-place update a trigger takes.
# Not a scenario of its own (the second-act annotation keeps discovery from
# running it as a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudBuildTrigger
metadata:
  name: planton-oss-e2e-gcpcbtrg-pubsub
  id: planton-oss-e2e-gcpcbtrg-pubsub
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcloudbuildtrigger
  annotations:
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e: "true"
    planton.dev/e2e-second-act: pubsub-inline-build.yaml
    planton.dev/e2e-prerequisites: "catalog/gcp/gcpcloudbuildtrigger/e2e/prerequisites/serviceaccount.yaml,catalog/gcp/gcpcloudbuildtrigger/e2e/prerequisites/topic.yaml"
  tags:
    - planton-e2e
spec:
  triggerName: planton-e2e-pubsub-${E2E_RUN_ID}
  description: Planton E2E Pub/Sub trigger, updated in place; safe to delete
  tags:
    - planton-e2e
  serviceAccount:
    valueFrom:
      kind: GcpServiceAccount
      name: planton-oss-e2e-gcpcbtrg-sa
      fieldPath: status.outputs.name
  pubsubConfig:
    topic:
      valueFrom:
        kind: GcpPubSubTopic
        name: planton-oss-e2e-gcpcbtrg-topic
        fieldPath: status.outputs.topic_id
  substitutions:
    _GREETING: hello
  build:
    steps:
      - name: ubuntu
        args:
          - echo
          - $_GREETING
    timeout: 300s
    options:
      logging: CLOUD_LOGGING_ONLY
