# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpcloudbuildtrigger
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The trigger is configuration; it stores no customer data of its own. Build logs and artifacts land in the buckets and registries the build names.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No customer data is stored by the trigger to encrypt with a customer key.
    - control_id: enc-in-transit
      status: not_applicable
      notes: Management calls ride Google TLS-only Cloud Build API endpoint; webhook calls arrive over HTTPS only.
    - control_id: no-public-access
      status: configurable
      field_path: webhook_config
      evidence:
        type: spec_default
        reference: Only a webhook trigger has a callable URL, and Google accepts a call only with the secret key held in Secret Manager; every other trigger has no address of its own and is managed through the Cloud Build API under IAM.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network listener exists to restrict; webhook calls are authenticated by their secret key.
    - control_id: edge-protection
      status: not_applicable
      notes: The trigger serves no traffic.
    - control_id: rbac
      status: configurable
      field_path: approval_config
      evidence:
        type: spec_default
        reference: Running, editing, and deleting triggers is governed by Cloud Build IAM roles; approval_config makes every build wait for a person holding the Cloud Build Approver role.
    - control_id: workload-identity
      status: configurable
      field_path: service_account
      evidence:
        type: spec_default
        reference: service_account runs builds as a dedicated service account (no keys) instead of the project default Cloud Build account.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths exist to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component enforces no end-user sign-in; access is administrative, whose posture rbac carries.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Trigger create, update, delete, and run calls are Cloud Build admin writes recorded in Cloud Audit Logs (Admin Activity) unconditionally.
    - control_id: monitoring-integration
      status: configurable
      field_path: build.options.logging
      evidence:
        type: spec_default
        reference: Build logs go to Cloud Logging by default; build.options.logging and build.logs_bucket choose Cloud Logging, a bucket, or both.
    - control_id: backup-recovery
      status: not_applicable
      notes: The trigger holds configuration only; it is recreated from its manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The trigger is a Cloud Build API resource Google replicates in its location; there is no placement to choose.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: deletion_policy PREVENT makes destroy fail.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Cloud Build and its builder images are Google-operated.
