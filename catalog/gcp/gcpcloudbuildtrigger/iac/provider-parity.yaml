# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_cloudbuild_trigger:
    mappings:
      - spec: spec.project_id
        arg: project
      # The provider's `name` is the user-assigned name; its computed
      # `trigger_id` is Google's generated ID (an output), so the spec says
      # trigger_name to keep the two apart.
      - spec: spec.trigger_name
        arg: name
      # Google's Build resource and cloudbuild.yaml call these lists
      # `steps` and `secrets`; exact matching resumes below them.
      - spec: spec.build.steps
        arg: build.step
      - spec: spec.build.secrets
        arg: build.secret
    exclusions:
      - arg: build.options.dynamic_substitutions
        reason: "the provider documents it as always enabled for triggered builds and not overridable (\"NOTE this is always enabled for triggered builds and cannot be overridden in the build configuration file\"); every build this kind declares is a triggered build"
      - arg: build.options.substitution_option
        reason: "the provider documents it as fixed for triggered builds (\"NOTE this is always set to ALLOW_LOOSE for triggered builds and cannot be overridden in the build configuration file\"); every build this kind declares is a triggered build"
      - arg: build.step.timing
        reason: "output only -- the provider describes it as \"Output only. Stores timing information for executing this build step\"; Google writes it, a spec never does"
  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables the owning API so a
      fresh project works on the first deploy; not a knob of the kind.
