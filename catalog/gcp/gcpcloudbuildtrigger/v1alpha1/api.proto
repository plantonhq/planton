syntax = "proto3";

package dev.planton.gcp.gcpcloudbuildtrigger.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpcloudbuildtrigger/v1alpha1/outputs.proto";
import "catalog/gcp/gcpcloudbuildtrigger/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-cloud-build-trigger
message GcpCloudBuildTrigger {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpCloudBuildTrigger'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpCloudBuildTriggerSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpCloudBuildTriggerStatus status = 5;
}

//gcp-cloud-build-trigger status
message GcpCloudBuildTriggerStatus {
  //stack-outputs
  GcpCloudBuildTriggerStackOutputs outputs = 1;
}
