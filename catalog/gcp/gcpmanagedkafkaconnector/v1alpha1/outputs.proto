syntax = "proto3";

package dev.planton.gcp.gcpmanagedkafkaconnector.v1alpha1;

// GcpManagedKafkaConnectorStackOutputs captures the connector's identity.
message GcpManagedKafkaConnectorStackOutputs {
  // Full resource name --
  // projects/{project}/locations/{location}/connectClusters/{connect_cluster}/connectors/{connector_id}.
  string name = 1;

  // The connector's ID (the last segment of name).
  string connector_id = 2;
}
