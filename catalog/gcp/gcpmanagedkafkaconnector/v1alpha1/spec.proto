syntax = "proto3";

package dev.planton.gcp.gcpmanagedkafkaconnector.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";

// GcpManagedKafkaConnectorTaskRestartPolicy restarts failed connector tasks
// with exponential backoff (`task_restart_policy`). A declared policy names
// at least one backoff: an empty one sends the same request as no policy
// at all.
message GcpManagedKafkaConnectorTaskRestartPolicy {
  option (buf.validate.message).cel = {
    id: "task_restart_policy.names_a_backoff"
    expression: "this.minimum_backoff != '' || this.maximum_backoff != ''"
    message: "A restart policy needs a minimum backoff, a maximum backoff, or both; remove the policy to send none."
  };
  option (buf.validate.message).cel = {
    id: "task_restart_policy.minimum_within_maximum"
    expression: "this.minimum_backoff == '' || this.maximum_backoff == '' || duration(this.minimum_backoff) <= duration(this.maximum_backoff)"
    message: "The minimum backoff must not be longer than the maximum backoff."
  };

  // The shortest wait before retrying a failed task -- a duration in
  // seconds with up to nine fractional digits and an "s" suffix, e.g.
  // "60s". At most maximum_backoff. Empty leaves Google's default.
  string minimum_backoff = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^[0-9]+(\\.[0-9]{1,9})?s$"
  ];

  // The longest wait between retries -- the backoff's upper bound, same
  // format, e.g. "1800s". Empty leaves Google's default.
  string maximum_backoff = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^[0-9]+(\\.[0-9]{1,9})?s$"
  ];
}

// GcpManagedKafkaConnectorSpec defines one connector on a Managed Service
// for Apache Kafka Connect cluster (`google_managed_kafka_connector`) -- a
// single pipeline moving data between Kafka and another system: a
// MirrorMaker 2 source replicating another Kafka cluster, a Pub/Sub source
// or sink, a BigQuery sink, a Cloud Storage sink. Connectors are their own
// block so the team whose data a pipeline moves owns it in its own
// manifest.
//
// Immutable: project_id, location, connect_cluster, connector_id (a change
// replaces the connector). configs and the restart policy update in place.
//
// project_id and location name the Connect cluster's project and region:
// the modules send them beside the Connect cluster's bare ID, so they must
// be the Connect cluster's own.
message GcpManagedKafkaConnectorSpec {
  option (buf.validate.message).cel = {
    id: "spec.connector_class_set"
    expression: "'connector.class' in this.configs && this.configs['connector.class'] != ''"
    message: "configs must name the plugin in \"connector.class\"; Kafka Connect cannot run a connector without it."
  };
  option (buf.validate.message).cel = {
    id: "spec.connect_cluster_path_matches_location"
    expression: "!has(this.connect_cluster.value) || !this.connect_cluster.value.startsWith('projects/') || this.connect_cluster.value.matches('^projects/[^/]+/locations/' + this.location + '/connectClusters/[^/]+$')"
    message: "A literal Connect cluster path must be in this connector's location: projects/{project}/locations/{location}/connectClusters/{connect_cluster}."
  };
  option (buf.validate.message).cel = {
    id: "spec.connect_cluster_path_matches_project"
    expression: "!has(this.connect_cluster.value) || !this.connect_cluster.value.startsWith('projects/') || !has(this.project_id.value) || this.project_id.value == '' || this.connect_cluster.value.startsWith('projects/' + this.project_id.value + '/')"
    message: "A literal Connect cluster path must be in this connector's project_id."
  };
  // The GCP project the Connect cluster lives in: a literal project ID or
  // a GcpProject reference. If omitted, the provider's default project is
  // used.
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];

  // The Connect cluster's region, e.g. "us-central1" -- the region the
  // Connect cluster runs in. Immutable.
  string location = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-z]+-[a-z]+[0-9]+$"
  ];

  // The Connect cluster that runs the connector. A
  // GcpManagedKafkaConnectCluster reference resolves to its full resource
  // path (name output); a literal takes the full path or the bare Connect
  // cluster ID. The modules derive the bare ID Google's resource expects.
  // Immutable.
  dev.planton.shared.foreignkey.v1.StringValueOrRef connect_cluster = 3 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpManagedKafkaConnectCluster,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.name"
  ];

  // The connector's ID, the name Kafka Connect shows for it -- 1-63
  // characters, RFC 1035 (lowercase letters, digits, hyphens; starts with a
  // letter). Defaults to metadata.name, which must then fit the same rule.
  // Immutable.
  string connector_id = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.pattern = "^[a-z](?:[-a-z0-9]{0,61}[a-z0-9])?$"
  ];

  // The connector's Kafka Connect configuration, keyed by property --
  // required, because "connector.class" picks the plugin (for example
  // com.google.pubsub.kafka.sink.CloudPubSubSinkConnector,
  // com.wepay.kafka.connect.bigquery.BigQuerySinkConnector,
  // io.aiven.kafka.connect.gcs.GcsSinkConnector,
  // org.apache.kafka.connect.mirror.MirrorSourceConnector), "tasks.max"
  // its parallelism, "topics" the topics a sink reads (for a MirrorMaker 2
  // source, a regular expression of the topics it replicates), plus the
  // plugin's own keys and converters. The values are plain text in four
  // places: the manifest, Planton's stored copy of it, the IaC module's
  // input, and the Connect cluster. Keep credentials out of them where the
  // plugin offers Google IAM authentication instead. Google stores the
  // connector id as Kafka Connect's own "name" key, so the modules send
  // name = the connector id; a "name" written here is replaced by it.
  map<string, string> configs = 5;

  // Automatic restarts for failed tasks, with the backoffs you choose.
  // Omitted, the modules send no policy and Google's own handling of
  // failed tasks applies.
  GcpManagedKafkaConnectorTaskRestartPolicy task_restart_policy = 6;

  // What happens to the connector when this resource is destroyed:
  //   "" / "DELETE" -- deleted (the pipeline stops)
  //   "PREVENT"     -- destroy fails
  //   "ABANDON"     -- it leaves management and keeps running
  string deletion_policy = 7 [(buf.validate.field).cel = {
    id: "valid_deletion_policy"
    expression: "this == '' || this in ['DELETE', 'PREVENT', 'ABANDON']"
    message: "deletion_policy must be one of: DELETE, PREVENT, ABANDON"
  }];
}
