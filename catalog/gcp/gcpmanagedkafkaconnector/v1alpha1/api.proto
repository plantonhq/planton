syntax = "proto3";

package dev.planton.gcp.gcpmanagedkafkaconnector.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpmanagedkafkaconnector/v1alpha1/outputs.proto";
import "catalog/gcp/gcpmanagedkafkaconnector/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-managed-kafka-connector
message GcpManagedKafkaConnector {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpManagedKafkaConnector'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpManagedKafkaConnectorSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpManagedKafkaConnectorStatus status = 5;
}

//gcp-managed-kafka-connector status
message GcpManagedKafkaConnectorStatus {
  //stack-outputs
  GcpManagedKafkaConnectorStackOutputs outputs = 1;
}
