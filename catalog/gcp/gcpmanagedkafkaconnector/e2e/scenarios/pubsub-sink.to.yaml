# The second act of pubsub-sink.yaml: the same connector with fewer tasks,
# a patch of its configs in place. Not a scenario of its own.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpManagedKafkaConnector
metadata:
  name: planton-oss-e2e-gcpkcnr-smoke
  id: planton-oss-e2e-gcpkcnr-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpmanagedkafkaconnector
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-second-act: pubsub-sink.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-prerequisites: "catalog/gcp/gcpmanagedkafkaconnector/e2e/prerequisites/gcpmanagedkafkatopic-source.yaml,catalog/gcp/gcpmanagedkafkaconnector/e2e/prerequisites/gcppubsubtopic-sink.yaml"
  tags:
    - planton-e2e
spec:
  location: us-central1
  connectCluster:
    valueFrom:
      kind: GcpManagedKafkaConnectCluster
      name: planton-oss-e2e-gcpkcnr-connect
      fieldPath: status.outputs.name
  connectorId: e2e-pubsub-sink-${E2E_RUN_ID}
  configs:
    connector.class: com.google.pubsub.kafka.sink.CloudPubSubSinkConnector
    tasks.max: "2"
    topics: e2e-kcnr-orders-${E2E_RUN_ID}
    cps.topic: e2e-kcnr-sink-${E2E_RUN_ID}
    cps.project: ${E2E_ENV:PLANTON_E2E_GCP_PROJECT_ID}
    value.converter: org.apache.kafka.connect.storage.StringConverter
    key.converter: org.apache.kafka.connect.storage.StringConverter
  taskRestartPolicy:
    minimumBackoff: 60s
    maximumBackoff: 1800s
  deletionPolicy: DELETE
