apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpmanagedkafkaconnector
spec:
  # Proven live on both engines (2026-11-21), as an identity holding only this
  # kind's permissions manifest: a Pub/Sub sink connector on a Connect cluster
  # chain (Kafka cluster, Connect cluster, a Kafka topic and a Pub/Sub topic
  # as fixtures) deployed, re-planned clean, and destroyed; its tasks.max
  # dropped from 3 to 2 in place (ManagedKafkaConnect.UpdateConnector), judged
  # from Google's Admin Activity log. Google stores the connector id as Kafka
  # Connect's own name config, so both modules send it; without it every
  # re-plan showed its removal. The connector create accepts the bare Connect
  # cluster id. Resource creation is what the kind proves; whether the sink's
  # tasks reach RUNNING depends on the Managed Kafka service agent's grant on
  # the sink topic, which the lane does not make.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 180
