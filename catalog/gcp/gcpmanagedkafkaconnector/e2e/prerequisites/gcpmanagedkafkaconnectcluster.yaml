# Consumer-scoped GcpManagedKafkaConnectCluster install profile for the
# gcpkcnr chain: the smallest Connect cluster (3 vCPU, 3 GiB) attached to
# the chain's Kafka cluster, its workers on the same subnet.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpManagedKafkaConnectCluster
metadata:
  name: planton-oss-e2e-gcpkcnr-connect
  id: planton-oss-e2e-gcpkcnr-connect
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpmanagedkafkaconnectcluster
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  location: us-central1
  connectClusterId: e2e-gcpkcnr-connect-${E2E_RUN_ID}
  kafkaCluster:
    valueFrom:
      kind: GcpManagedKafkaCluster
      name: planton-oss-e2e-gcpkcnr-kafka
      fieldPath: status.outputs.name
  capacityConfig:
    vcpuCount: 3
    memoryBytes: 3221225472
  networkConfigs:
    - primarySubnet:
        valueFrom:
          kind: GcpSubnetwork
          name: planton-oss-e2e-gcpkcnr-subnet
          fieldPath: status.outputs.subnetwork_self_link
  deletionPolicy: DELETE
