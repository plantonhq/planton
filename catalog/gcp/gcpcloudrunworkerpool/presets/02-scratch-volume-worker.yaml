apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudRunWorkerPool
metadata:
  name: media-transcoder
spec:
  projectId:
    value: my-gcp-project
  workerPoolName: media-transcoder
  description: Transcodes uploaded media from a queue into a scratch volume per instance
  region: us-central1
  containers:
    - name: transcoder
      image: us-docker.pkg.dev/my-gcp-project/apps/media-transcoder:2.1.0
      env:
        - name: QUEUE
          value: projects/my-gcp-project/subscriptions/media-uploads
        - name: OUTPUT_BUCKET
          value: media-transcoded
      resources:
        cpu: "2"
        memory: 2Gi
      volumeMounts:
        - name: scratch
          mountPath: /tmp/work
      # The transcoder warms up before it binds its health listener; the
      # probe holds the revision back until it does.
      startupProbe:
        tcpSocket:
          port: 8081
        periodSeconds: 10
        failureThreshold: 6
  # In-memory scratch per instance; it counts against the memory limit.
  volumes:
    - name: scratch
      emptyDir:
        medium: MEMORY
        sizeLimit: 1Gi
  serviceAccount:
    valueFrom:
      kind: GcpServiceAccount
      name: media-transcoder-sa
      fieldPath: status.outputs.email
  # Four instances; raise or lower the count as the queue grows or shrinks,
  # and 0 parks the pool.
  scaling:
    scalingMode: MANUAL
    manualInstanceCount: 4
  labels:
    tier: production
  deletionProtection: true
  deletionPolicy: DELETE
