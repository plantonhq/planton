apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpcloudrunworkerpool
spec:
  # Proven live on both engines (2026-11-20): a MANUAL pool of Google's sample
  # worker image, one with direct VPC egress into a subnet, and one reading a
  # stored secret, each deployed, its instance count raised in place
  # (UpdateWorkerPool in Google's audit log) and destroyed by an identity
  # holding only this kind's permissions manifest, with the re-plan clean.
  # AUTOMATIC scaling can't be deployed: the provider sends a manual count
  # under it and Cloud Run refuses one, so the spec refuses AUTOMATIC. After a
  # pool with direct VPC egress is deleted, Cloud Run holds its serverless
  # address in the subnet for about two hours (1h49m measured), so the fixture
  # subnet's teardown waits it out.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 25
