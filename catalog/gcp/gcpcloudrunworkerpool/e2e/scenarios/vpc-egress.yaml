# GcpCloudRunWorkerPool scenario: direct VPC egress into the prerequisite
# subnet (network and subnetwork by reference, PRIVATE_RANGES_ONLY), a
# literal env var, and revision labels, on a MANUAL pool of one instance.
# AUTOMATIC scaling is not declared: the Google provider sends a manual
# instance count with every scaling block, and Cloud Run refuses one under
# AUTOMATIC, so the spec refuses AUTOMATIC. No probe is set: the public
# worker-pool sample image idles without a health listener, so a probe
# would have no port to reach.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudRunWorkerPool
metadata:
  name: planton-oss-e2e-gcprunwp-vpc
  id: planton-oss-e2e-gcprunwp-vpc
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcloudrunworkerpool
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
  tags:
    - planton-e2e
spec:
  workerPoolName: planton-oss-e2e-gcprunwp-vpc-${E2E_RUN_ID} # per kind and engine, so lanes side by side never share it
  description: Ephemeral VPC-egress worker pool created by the Planton E2E harness; safe to delete
  region: us-central1
  containers:
    - name: worker
      image: us-docker.pkg.dev/cloudrun/container/worker-pool:latest
      env:
        - name: WORKER_MODE
          value: idle
      resources:
        cpu: "1"
        memory: 512Mi
  revisionLabels:
    e2e-scenario: vpc-egress
  vpcAccess:
    networkInterfaces:
      - network:
          valueFrom:
            kind: GcpVpcNetwork
            name: planton-oss-e2e-gcpvpcnetwork-prereq
            fieldPath: status.outputs.network_name
        subnetwork:
          valueFrom:
            kind: GcpSubnetwork
            name: planton-oss-e2e-gcpsnw-runwp-prereq
            fieldPath: status.outputs.subnetwork_name
    egress: PRIVATE_RANGES_ONLY
  scaling:
    scalingMode: MANUAL
    manualInstanceCount: 1
  deletionProtection: false
  deletionPolicy: DELETE
