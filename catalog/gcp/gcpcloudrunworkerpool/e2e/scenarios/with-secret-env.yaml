# GcpCloudRunWorkerPool secret-value scenario: the minimal worker pool plus
# one literal variable and one secret_value variable. The module must create
# the variable's Secret Manager secret (replicated in us-central1), store the
# value as a version, grant the project's Compute Engine default service
# account secretAccessor on that secret alone (no pool service account), and
# point the variable at the stored version -- the revision carries a secret
# key reference, never the value. Destroy removes the secret with the pool.
# The value is a literal because this lane runs without a platform; on
# Planton the field takes only a $secret/ reference.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudRunWorkerPool
metadata:
  name: planton-oss-e2e-gcprunwp-secret-env
  id: planton-oss-e2e-gcprunwp-secret-env
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpcloudrunworkerpool
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-central1
  workerPoolName: planton-oss-e2e-gcprunwp-se-${E2E_RUN_ID}
  containers:
    - image: us-docker.pkg.dev/cloudrun/container/worker-pool:latest
      env:
        - name: LOG_LEVEL
          value: info
        - name: E2E_TOKEN
          secretValue: e2e-not-a-real-secret
      resources:
        cpu: "1"
        memory: 512Mi
  scaling:
    scalingMode: MANUAL
    manualInstanceCount: 1
  deletionProtection: false
  deletionPolicy: DELETE
