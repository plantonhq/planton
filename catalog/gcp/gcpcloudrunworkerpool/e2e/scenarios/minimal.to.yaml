# The second act of minimal.yaml: the same worker pool with MANUAL scaling
# raised from one instance to two -- a workerPools.patch that changes the
# pool in place (its name and region recreate it). Not a scenario of its own
# (the second-act annotation keeps discovery from running it as a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudRunWorkerPool
metadata:
  name: planton-oss-e2e-gcprunwp-smoke
  id: planton-oss-e2e-gcprunwp-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcloudrunworkerpool
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-second-act: minimal.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
  tags:
    - planton-e2e
spec:
  workerPoolName: planton-oss-e2e-gcprunwp-min-${E2E_RUN_ID} # per kind and engine, so lanes side by side never share it
  region: us-central1
  containers:
    - image: us-docker.pkg.dev/cloudrun/container/worker-pool:latest
      resources:
        cpu: "1"
        memory: 512Mi
  scaling:
    scalingMode: MANUAL
    manualInstanceCount: 2
  deletionProtection: false
  deletionPolicy: DELETE
