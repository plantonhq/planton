syntax = "proto3";

package dev.planton.gcp.gcpcloudrunworkerpool.v1alpha1;

// GcpCloudRunWorkerPoolOutputs captures the observable values of a
// Cloud Run worker pool after provisioning. A worker pool has no URL: it
// receives no requests, so there is nothing to reach it at -- the outputs
// identify it and report the revision that is running.
message GcpCloudRunWorkerPoolOutputs {
  // Full resource name
  // (projects/{project}/locations/{region}/workerPools/{name}).
  string name = 1;

  // Bare worker pool name in GCP -- the segment the API is keyed by.
  string worker_pool_name = 2;

  // Server-generated unique identifier, stable across updates.
  string uid = 3;

  // Region the worker pool runs in.
  string location = 4;

  // The GCP project the worker pool lives in.
  string project_id = 5;

  // Name of the most recently created revision (may still be rolling out).
  string latest_created_revision = 6;

  // Name of the newest revision that is serving instances -- what a
  // rollout has actually reached.
  string latest_ready_revision = 7;

  // The generation Cloud Run's controller has reconciled (a decimal
  // string, as Google reports it); equal to the pool's generation once a
  // rollout is complete.
  string observed_generation = 8;

  // Opaque version token for optimistic concurrency on the API.
  string etag = 9;

  // The pool's overall readiness: type "Ready", with state
  // CONDITION_SUCCEEDED once the pool reaches its serving state. When a
  // rollout fails, its message and reasons say why (an image that cannot
  // be pulled, a container that never passes its startup probe), while
  // latest_ready_revision still names the last revision that worked.
  GcpCloudRunWorkerPoolCondition terminal_condition = 10;

  // The conditions of the pool's sub-resources, in the order Google
  // reports them: the extra diagnostics to read when terminal_condition
  // is not CONDITION_SUCCEEDED. Empty when Google reports none.
  repeated GcpCloudRunWorkerPoolCondition conditions = 11;
}

// GcpCloudRunWorkerPoolCondition is one status condition Cloud Run reports
// for the worker pool, as Google returns it.
message GcpCloudRunWorkerPoolCondition {
  // What the condition reports, e.g. "Ready" for the pool as a whole.
  string type = 1;

  // The condition's state: CONDITION_PENDING, CONDITION_RECONCILING,
  // CONDITION_FAILED, or CONDITION_SUCCEEDED.
  string state = 2;

  // Human-readable detail about the current state, the first thing to
  // read when a rollout fails.
  string message = 3;

  // When the condition last changed state, as an RFC 3339 timestamp.
  string last_transition_time = 4;

  // How to read a failure of this condition: ERROR, WARNING, or INFO.
  string severity = 5;

  // The pool-level reason for the state, when Google gives one.
  string reason = 6;

  // The revision-level reason, when the condition is about a revision.
  string revision_reason = 7;

  // The execution-level reason, when the condition is about an execution.
  string execution_reason = 8;
}
