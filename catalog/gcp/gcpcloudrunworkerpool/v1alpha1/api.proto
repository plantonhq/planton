syntax = "proto3";

package dev.planton.gcp.gcpcloudrunworkerpool.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpcloudrunworkerpool/v1alpha1/outputs.proto";
import "catalog/gcp/gcpcloudrunworkerpool/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-cloud-run-worker-pool
message GcpCloudRunWorkerPool {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpCloudRunWorkerPool'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpCloudRunWorkerPoolSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpCloudRunWorkerPoolStatus status = 5;
}

//gcp-cloud-run-worker-pool status
message GcpCloudRunWorkerPoolStatus {
  //stack-outputs
  GcpCloudRunWorkerPoolStackOutputs outputs = 1;
}
