apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVpcPeering
metadata:
  name: spoke-to-hub
spec:
  network:
    valueFrom:
      kind: GcpVpcNetwork
      name: spoke
      fieldPath: status.outputs.network_self_link
  peerNetwork:
    valueFrom:
      kind: GcpVpcNetwork
      name: hub
      fieldPath: status.outputs.network_self_link
  importCustomRoutes: true
  deletionPolicy: PREVENT
