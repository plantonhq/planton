# The OTHER half of independent-flags.yaml's peering: an INDEPENDENT
# GcpVpcPeering on the second network pointing back at the registry's
# prerequisite network, so the pair goes ACTIVE (a peering with one side only
# is INACTIVE by Google's design). Google requires both sides of a pair to use
# the same update strategy. Deployed as a fixture, not the instance under test.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVpcPeering
metadata:
  name: planton-oss-e2e-gcppeer-ind-b
  id: planton-oss-e2e-gcppeer-ind-b
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpvpcpeering
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  peeringName: planton-oss-e2e-gcppeer-ind-b-${E2E_RUN_ID}
  network:
    valueFrom:
      kind: GcpVpcNetwork
      name: planton-oss-e2e-gcppeer-peer-vpc
      fieldPath: status.outputs.network_self_link
  peerNetwork:
    valueFrom:
      kind: GcpVpcNetwork
      name: planton-oss-e2e-gcpvpcnetwork-prereq
      fieldPath: status.outputs.network_self_link
  exportCustomRoutes: true
  importCustomRoutes: true
  stackType: IPV4_ONLY
  updateStrategy: INDEPENDENT
