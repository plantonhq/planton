apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpvpcpeering
spec:
  # Proven live on both engines (2026-11-23). Two live scenarios, each with an
  # ACTIVE pair (side A under test, side B a fixture on the second network):
  #   - independent-flags: the kind's default strategy; the second act turns
  #     off custom-route export, an updatePeering in place judged from the
  #     audit log.
  #   - consensus-dual-stack-flags: CONSENSUS with complementary flags on the
  #     two sides. No second act: Google applies a CONSENSUS change only after
  #     the matching peering makes the complementary one, so one side's update
  #     cannot be judged alone. Google deletes a CONSENSUS peering only after
  #     both network owners call networks.requestRemovePeering, which neither
  #     provider does; the harness makes both requests before each destroy
  #     (planton.dev/e2e-prepare-destroy: consensus-peering), the step the
  #     GUIDE gives the customer, so this scenario proves that teardown.
  #
  # Offline-proven-only arm (skips honestly through its required-env token):
  #   - routes-config-existing-peering: the ROUTES-CONFIG form targets the
  #     Google-managed servicenetworking-googleapis-com peering, which exists
  #     only behind a private-services-access connection plus a Cloud SQL or
  #     Memorystore instance -- a fixture the harness does not carry. Unblock:
  #     a private-IP fixture exported as PLANTON_E2E_GCP_SERVICE_NETWORKING_VPC.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
