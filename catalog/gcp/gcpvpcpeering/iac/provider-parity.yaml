# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# Two provider resources, exactly one per instance, selected by whether
# spec.peer_network is set: the peering itself when this side CREATES it;
# the routes-config resource when it manages the route exchange of a peering
# that already exists (Google-managed private services access, or the other
# party's peering). The route-exchange flags match name-for-name on both.

resources:
  google_compute_network_peering:
    mappings:
      # The peering entry's name, defaulting from metadata.name; the spec
      # names it for what it is beside the two networks.
      - spec: spec.peering_name
        arg: name

  google_compute_network_peering_routes_config:
    mappings:
      # The EXISTING peering whose routes are managed -- the same spec field
      # as the create form's name, because it is the same thing: the entry's
      # name on this side's network.
      - spec: spec.peering_name
        arg: peering
    exclusions:
      - arg: project
        reason: >-
          derived by the module from the network reference -- the routes
          config addresses its network by name within a project, and the
          spec's network is a self link that already carries the project;
          a second project field could only contradict it
