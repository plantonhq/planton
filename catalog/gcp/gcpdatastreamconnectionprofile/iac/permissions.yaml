# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpdatastreamconnectionprofile
spec:
  gcp:
    groups:
      - purpose: EnableApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
          - resourcemanager.projects.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_project_service enabling datastream.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed. The provider reads the project with resourcemanager.projects.get before its services on every refresh, so a re-plan or destroy needs it (measured live). Proven 2026-11-18 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
      - purpose: ManageConnectionProfile
        permissions:
          - datastream.connectionProfiles.create
          - datastream.connectionProfiles.get
          - datastream.connectionProfiles.update
          - datastream.connectionProfiles.delete
          - datastream.operations.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_datastream_connection_profile (Pulumi datastream.ConnectionProfile) -- created (with Google's connectivity test unless create_without_validation), patched, read on every refresh, deleted, and its long-running operations polled. Names grounded in Google's Datastream roles page; roles/datastream.admin contains all five. Proven 2026-11-18 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
      - purpose: UsePrivateConnection
        permissions:
          - datastream.privateConnections.get
        provenance: derived
        reach: target
        privilege: ordinary
        condition:
          spec_field_set: private_connection
        notes: Google reads the named private connection when a profile uses it. Datastream's service agent -- not the runner -- reads Secret Manager versions, writes buckets, and writes BigQuery datasets; those grants live on the accessed resources.
