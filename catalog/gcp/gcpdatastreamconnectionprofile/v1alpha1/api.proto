import "catalog/gcp/gcpdatastreamconnectionprofile/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-datastream-connection-profile
message GcpDatastreamConnectionProfile {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpDatastreamConnectionProfile'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpDatastreamConnectionProfileSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpDatastreamConnectionProfileStatus status = 5;
}

//gcp-datastream-connection-profile status
message GcpDatastreamConnectionProfileStatus {
  //stack-outputs
  GcpDatastreamConnectionProfileStackOutputs outputs = 1;
}
