# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpdatastreamconnectionprofile
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Datastream encrypts a profile's stored credentials at rest with Google-managed keys."
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: "A profile has no key setting; a stream's customer_managed_encryption_key covers the data it holds, and Secret Manager's own CMEK covers a stored password."
    - control_id: enc-in-transit
      status: configurable
      field_path: postgresql_profile.ssl_config
      evidence:
        type: spec_default
        reference: "Each source profile's ssl_config (MySQL, PostgreSQL, MongoDB) turns on TLS to the database, with server or mutual verification; unset follows the database's own policy. Private connectivity and SSH tunnels add a private or encrypted path."
    - control_id: no-public-access
      status: configurable
      field_path: private_connection
      evidence:
        type: spec_default
        reference: "Unset connects over public IPs (the database allowlists Datastream's regional IPs); private_connection or forward_ssh_connectivity keeps the database off the internet."
    - control_id: restricted-ingress
      status: not_applicable
      notes: "The profile listens on nothing; the database's own allowlist restricts who reaches it."
    - control_id: edge-protection
      status: not_applicable
      notes: "No edge is served."
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Managing and using profiles requires datastream.connectionProfiles.* permissions."
    - control_id: workload-identity
      status: configurable
      field_path: postgresql_profile.secret_manager_stored_password
      evidence:
        type: spec_default
        reference: "Datastream signs in to databases with a user and password; secret_manager_stored_password keeps the password in Secret Manager, read by Datastream's service agent, instead of in the manifest."
    - control_id: no-legacy-auth
      status: not_applicable
      notes: "The database's own authentication applies; the profile offers no protocol choice to disable."
    - control_id: strong-user-auth
      status: not_applicable
      notes: "No end-user sign-in exists."
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Profile administration is recorded in Cloud Audit Logs (Admin Activity)."
    - control_id: monitoring-integration
      status: not_applicable
      notes: "A profile emits no metrics of its own; streams report their health in Cloud Monitoring."
    - control_id: backup-recovery
      status: not_applicable
      notes: "The profile is redeclared from the spec; there is no data in it."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: "No backups exist."
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Datastream is a regional service; profiles have no zonal dependency."
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: "Unset means DELETE (Google refuses while a stream uses the profile); PREVENT makes destroy fail; ABANDON leaves it in GCP."
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Datastream is fully Google-operated; there is no software surface the customer patches."
