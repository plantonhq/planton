# Consumer-scoped GcpSecretManagerSecret install profile for the gcpdscp
# chain: a secret whose version 1 holds a placeholder password, so the
# profile's secret_manager_stored_password reference resolves to a real
# version name. Secret ids are hard-deleted, so the id carries the run id
# only to keep concurrent runs apart.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSecretManagerSecret
metadata:
  name: planton-oss-e2e-gcpdscp-password
  id: planton-oss-e2e-gcpdscp-password
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpsecretmanagersecret
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  secretId: e2e-gcpdscp-password-${E2E_RUN_ID}
  initialVersion:
    data:
      value: planton-e2e-placeholder-password
