apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpdatastreamconnectionprofile
spec:
  # Proven live on both engines (2026-11-18): BigQuery and Cloud Storage
  # destination profiles and a PostgreSQL source created without validation,
  # each deployed and destroyed by an identity holding only this kind's
  # permissions manifest, and the Cloud Storage profile updated in place (its
  # display name and root path). Every scenario re-planned clean with the
  # password never read back. Private-connection profiles and the other
  # source engines stay offline-only.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
