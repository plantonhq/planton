syntax = "proto3";

package dev.planton.gcp.gcpfirewallrule.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpfirewallrule/v1alpha1/outputs.proto";
import "catalog/gcp/gcpfirewallrule/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-firewall-rule
message GcpFirewallRule {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpFirewallRule'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpFirewallRuleSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpFirewallRuleStatus status = 5;
}

//gcp-firewall-rule status
message GcpFirewallRuleStatus {
  //outputs
  GcpFirewallRuleOutputs outputs = 1;
}
