# Consumer-scoped GcpVpcNetwork install profile for the private DNS zone
# scenario. Cloud-side network names carry ${E2E_RUN_ID}; metadata.name stays
# fixed for FK resolution.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVpcNetwork
metadata:
  name: planton-oss-e2e-gcpvpc-prereq
  id: planton-oss-e2e-gcpvpc-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpdnszone
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  networkName: planton-oss-e2e-vpc-${E2E_RUN_ID}
  autoCreateSubnetworks: false
