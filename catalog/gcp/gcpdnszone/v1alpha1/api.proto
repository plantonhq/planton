syntax = "proto3";

package dev.planton.gcp.gcpdnszone.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpdnszone/v1alpha1/outputs.proto";
import "catalog/gcp/gcpdnszone/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-dns-zone
message GcpDnsZone {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpDnsZone'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpDnsZoneSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpDnsZoneStatus status = 5;
}

//gcp-dns-zone status
message GcpDnsZoneStatus {
  //outputs
  //  outputs
  GcpDnsZoneOutputs outputs = 1;
}
