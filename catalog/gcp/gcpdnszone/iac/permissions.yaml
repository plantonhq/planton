# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpdnszone
spec:
  gcp:
    groups:
      - purpose: EnableDnsApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling dns.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageZone
        permissions:
          - dns.managedZones.create
          - dns.managedZones.get
          - dns.managedZones.update
          - dns.managedZones.delete
        provenance: derived
        notes: Covers google_dns_managed_zone -- create, read/refresh, in-place updates (DNSSEC, logging, forwarding), and destroy.
      - purpose: BindPrivateZoneNetworks
        permissions:
          - dns.networks.bindPrivateDNSZone
        provenance: derived
        condition:
          spec_field_set: private_visibility_config.networks
        notes: Binding a private zone's resolution scope to the VPC networks in private_visibility_config demands this permission on each network's project.
      - purpose: BindPrivateZoneGkeClusters
        permissions:
          - dns.gkeClusters.bindPrivateDNSZone
        provenance: derived
        condition:
          spec_field_set: private_visibility_config.gke_clusters
        notes: Binding a private zone to the GKE clusters in private_visibility_config.gke_clusters demands this permission on each cluster's project.
      - purpose: TargetPeeringNetwork
        permissions:
          - dns.networks.targetWithPeeringZone
        provenance: derived
        condition:
          spec_field_set: peering_config
        notes: A peering zone resolves through peering_config's target network, which demands this permission on that network's project.
