# Consumer-scoped GcpServiceAccount install profile for the user chain: the
# identity the IAM service-account scenario wires by reference. Its own
# run-scoped account id so a prerequisite deploy never collides with a
# concurrently running lane; project_id omitted so it lands in the
# harness-exported test project.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpServiceAccount
metadata:
  name: planton-oss-e2e-gsa-prereq
  id: planton-oss-e2e-gsa-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpserviceaccount
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  serviceAccountId: e2e-sqlusr-sa-${E2E_RUN_ID} # per kind and engine, so lanes side by side never share it
  displayName: Planton OSS E2E Cloud SQL IAM user identity
  description: Ephemeral identity the Cloud SQL IAM user scenario binds; safe to delete
