# The second act of minimal.yaml: the same BUILT_IN user with a rotated
# password -- a users.update that changes the credential in place (its name,
# instance and type recreate it). The new password is a throwaway E2E
# credential too. Not a scenario of its own (the second-act annotation keeps
# discovery from running it as a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudSqlUser
metadata:
  name: planton-oss-e2e-gcpsqlusr-smoke
  id: planton-oss-e2e-gcpsqlusr-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcloudsqluser
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-second-act: minimal.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
  tags:
    - planton-e2e
spec:
  instance:
    valueFrom:
      kind: GcpCloudSql
      name: planton-oss-e2e-gcpsql-prereq
      fieldPath: status.outputs.instance_name
  userName: e2e-app-${E2E_RUN_ID} # per kind and engine, so lanes side by side never share it
  password: E2eAppPassword456!
  type: BUILT_IN
  databaseRoles:
    - cloudsqlsuperuser
  deletionPolicy: DELETE
