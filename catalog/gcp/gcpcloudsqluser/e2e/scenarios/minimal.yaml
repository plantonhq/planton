# GcpCloudSqlUser scenario: a BUILT_IN application user on the prerequisite
# instance. Password is a throwaway E2E credential — never reuse outside tests.
# Also proves database_roles live (the predefined cloudsqlsuperuser role on
# PostgreSQL) and the explicit DELETE teardown policy (no-op against the
# provider default on re-plan).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudSqlUser
metadata:
  name: planton-oss-e2e-gcpsqlusr-smoke
  id: planton-oss-e2e-gcpsqlusr-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcloudsqluser
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  instance:
    valueFrom:
      kind: GcpCloudSql
      name: planton-oss-e2e-gcpsql-prereq
      fieldPath: status.outputs.instance_name
  userName: e2e-app
  password: E2eAppPassword123!
  type: BUILT_IN
  databaseRoles:
    - cloudsqlsuperuser
  deletionPolicy: DELETE
