# GcpCloudSqlUser scenario: an IAM service-account user wired by REFERENCE to
# the prerequisite GcpServiceAccount — no hand-built username. Both engines
# derive the database username Cloud SQL expects (the account email with
# ".gserviceaccount.com" dropped; PostgreSQL stores exactly that form), so the
# proof is that the user exists under the derived name and RE-PLANS CLEAN.
# The prerequisite instance carries cloudsql.iam_authentication=on, which IAM
# users require. No password: IAM types authenticate through IAM.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudSqlUser
metadata:
  name: planton-oss-e2e-gcpsqlusr-iamsa
  id: planton-oss-e2e-gcpsqlusr-iamsa
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpcloudsqluser
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  instance:
    valueFrom:
      kind: GcpCloudSql
      name: planton-oss-e2e-gcpsql-prereq
      fieldPath: status.outputs.instance_name
  type: CLOUD_IAM_SERVICE_ACCOUNT
  serviceAccount:
    valueFrom:
      kind: GcpServiceAccount
      name: planton-oss-e2e-gsa-prereq
      fieldPath: status.outputs.email
  deletionPolicy: DELETE
