syntax = "proto3";

package dev.planton.gcp.gcpcloudsqluser.v1alpha1;

// GcpCloudSqlUserOutputs captures values returned after provisioning a
// Cloud SQL user.
message GcpCloudSqlUserOutputs {
  // The user name as stored by Cloud SQL. For IAM users on MySQL this is
  // the truncated form (email without the "@domain" suffix) — the name
  // clients actually authenticate with.
  string user_name = 1;

  // Name of the Cloud SQL instance this user belongs to.
  string instance_name = 2;
}
