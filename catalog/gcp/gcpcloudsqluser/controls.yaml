# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: gcpcloudsqluser
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A user stores no database data -- it is access-control configuration held by the Cloud SQL control plane and the engine's system tables (which live on the instance's unconditionally encrypted storage). At-rest posture belongs to the parent instance.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data store here means no key decision (see enc-at-rest); the instance's encryption_key_name owns that choice.
    - control_id: enc-in-transit
      status: not_applicable
      notes: A user terminates no connections -- TLS enforcement is the parent instance's network.ssl_mode posture. The coupling runs the other way for IAM logins, which the Cloud SQL connectors carry over identity-bound TLS.
    - control_id: no-public-access
      status: not_applicable
      notes: A user is not addressable -- it has no endpoint, only a management API governed by IAM. Reachability is the instance's public-IP and private-network posture.
    - control_id: restricted-ingress
      status: configurable
      field_path: host
      evidence:
        type: spec_default
        reference: On MySQL, the classic user@host scoping declares which sources this login is valid FROM -- "10.0.0.0/8" admits the login only from that range, "%" from anywhere. Empty (the default, and the only choice for PostgreSQL and SQL Server) leaves source restriction entirely to the instance's authorized networks.
      notes: This is identity-level scoping layered UNDER the instance's network allowlist -- both must admit a connection. Neither preset sets it.
    - control_id: edge-protection
      status: not_applicable
      notes: A database login speaking the MySQL/PostgreSQL/SQL Server wire protocol has no Layer-7 entry point for a WAF to front.
    - control_id: rbac
      status: configurable
      field_path: database_roles
      evidence:
        type: spec_default
        reference: Empty grants no roles at creation; listing roles (predefined ones like cloudsqlsuperuser or custom roles already created in the database) scopes what the login may do from the moment it exists. MySQL 8+ and PostgreSQL only.
      notes: Creation-time grants only -- finer in-engine GRANTs on schemas and tables are managed inside the database. Management-plane access to the user object itself is Cloud SQL IAM.
    - control_id: workload-identity
      status: configurable
      field_path: type
      evidence:
        type: spec_default
        reference: BUILT_IN (the default) authenticates with a stored password; CLOUD_IAM_USER, CLOUD_IAM_SERVICE_ACCOUNT, and CLOUD_IAM_GROUP authenticate through IAM with short-lived tokens and no stored credential. A CEL rule makes an IAM-typed user carrying a password unrepresentable.
      notes: The 02-iam-service-account-user preset is the keyless shape. On PostgreSQL the instance must first set the "cloudsql.iam_authentication" flag -- a parent-instance prerequisite, not a field here.
    - control_id: no-legacy-auth
      status: configurable
      field_path: type
      evidence:
        type: spec_default
        reference: The stored-password path is the weaker one, and the CLOUD_IAM_* types retire it per identity -- an IAM user has no password at all (CEL-enforced), so no guessable credential exists for that login.
      notes: For BUILT_IN users, password_policy (allowed_failed_attempts, expiration, failed-attempts lockout) hardens the credentialed path -- the 01-application-user preset locks after five failed attempts.
    - control_id: strong-user-auth
      status: not_applicable
      notes: This identity is a database login, not end-user sign-in -- password_policy (allowed_failed_attempts, password_expiration_duration) hardens the BUILT_IN credential and the CLOUD_IAM_* types remove the stored password entirely (see no-legacy-auth).
    - control_id: audit-logging
      status: not_applicable
      notes: Changes to the identity (creation, password rotation, role changes) land in Cloud Audit Logs as project-level posture; login and statement auditing (pgAudit, SQL Server audit) are configured through the parent instance's flags.
    - control_id: monitoring-integration
      status: not_applicable
      notes: Cloud SQL publishes metrics on instance dimensions; a user is not a metric dimension and has no export knob.
    - control_id: backup-recovery
      status: not_applicable
      notes: A user holds no data to back up -- it is declarative configuration re-creatable from the manifest (the password comes from the manifest or its secret store; GCP never returns it).
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist at the user level to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: A user is a control-plane object with no zonal footprint -- zone redundancy is the parent instance's availability_type.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Unset means DELETE -- destroy drops the login; PREVENT makes any dropping plan fail -- protection for a credential applications still authenticate with; ABANDON removes it from management while it keeps existing (and authenticating) on the instance -- the documented answer for PostgreSQL users that cannot be dropped while they still own database objects.
      notes: Neither preset sets it.
    - control_id: managed-patching
      status: not_applicable
      notes: A user is configuration on a fully managed service -- there is no software of its own to patch; engine patching belongs to the parent instance.
