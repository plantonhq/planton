# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_sql_user:
    mappings:
      # Renames: the spec says what the field IS, where the provider
      # inherits terser API names.
      - spec: spec.user_name
        arg: name
      # A service-account user names the account by reference; both
      # engines derive the provider's name argument from its email.
      - spec: spec.service_account
        arg: name
      - spec: spec.project_id
        arg: project
    exclusions:
      # Terraform's ephemeral write-only variants of the modeled password:
      # the same credential capability through a different engine-side
      # idiom. Planton carries the password on the secret-annotated spec
      # field (encrypted in state on both engines), so the write-only pair
      # adds no reachable capability.
      - arg: password_wo
        reason: >-
          write-only variant of the modeled password field -- same
          capability, engine-side ergonomics; the spec's password field is
          secret-annotated and encrypted in state on both engines
      - arg: password_wo_version
        reason: >-
          version counter that only accompanies password_wo; meaningless
          without the write-only variant
