# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: gcprouternat
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: A NAT gateway translates addresses and stores no customer data at rest.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest to encrypt (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: The gateway translates addresses without terminating or originating encryption; payload encryption is end-to-end between the workloads and their destinations.
    - control_id: no-public-access
      status: configurable
      field_path: type
      evidence:
        type: spec_default
        reference: PUBLIC (the default) gives private VMs outbound internet access through external addresses; PRIVATE creates a gateway with no external path at all -- NAT between private networks only, used with Network Connectivity Center spokes.
      notes: Either way the gateway accepts no unsolicited inbound connections; Cloud NAT is outbound-initiated by design. The 03-private-nat preset picks PRIVATE.
    - control_id: restricted-ingress
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Cloud NAT only ever translates connections initiated from inside the VPC; unsolicited inbound traffic has no path through it. Endpoint-independent mapping (off by default in the spec) is the only inbound-adjacent behavior, and it still requires an established outbound flow.
    - control_id: edge-protection
      status: not_applicable
      notes: No inbound request surface exists to filter (see restricted-ingress).
    - control_id: rbac
      status: not_applicable
      notes: Management access is project IAM posture, not a component choice; the gateway exposes no authentication plane of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The gateway runs no workloads and holds no credentials of its own.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths of its own.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: configurable
      field_path: log_filter
      evidence:
        type: spec_default
        reference: Defaults to ERRORS_ONLY, which records NAT allocation failures; ALL and TRANSLATIONS_ONLY additionally write per-connection translation logs to Cloud Logging, and DISABLED turns logging off entirely.
      notes: Translation logs are the gateway's traffic audit trail -- who connected where through which external address. Control-plane changes land in Cloud Audit Logs regardless.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Cloud NAT publishes gateway metrics (allocated ports, dropped connections, bytes translated) to Cloud Monitoring for every gateway automatically; port-exhaustion visibility needs no configuration.
      notes: min_ports_per_vm and dynamic port allocation are the levers the metrics inform.
    - control_id: backup-recovery
      status: not_applicable
      notes: Stateless address translation -- no data to back up; the configuration is declarative and re-creatable from the manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Cloud NAT is a distributed regional service -- it is not tied to any single zone, and Google manages its redundancy across the region; single-zone operation is unrepresentable.
      notes: Zonal blast radius belongs to the workloads, not the gateway.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither GCP nor this spec offers a deletion-protection flag for a router or NAT config; the blast radius of deletion is lost egress, recreated declaratively in minutes.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- Google operates and patches the NAT data plane; no customer-visible patch surface exists.
