syntax = "proto3";

package dev.planton.gcp.gcprouternat.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcprouternat/v1alpha1/outputs.proto";
import "catalog/gcp/gcprouternat/v1alpha1/spec.proto";
import "shared/metadata.proto";

// gcp-router-nat
message GcpRouterNat {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpRouterNat'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpRouterNatSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpRouterNatStatus status = 5;
}

// gcp-router-nat status
message GcpRouterNatStatus {
  //outputs
  GcpRouterNatOutputs outputs = 1;
}
