# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcprouternat
spec:
  gcp:
    groups:
      - purpose: EnableComputeApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling compute.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageRouterAndNat
        permissions:
          - compute.routers.create
          - compute.routers.get
          - compute.routers.update
          - compute.routers.delete
          - compute.networks.get
          - compute.regionOperations.get
        provenance: derived
        notes: Covers google_compute_router and google_compute_router_nat -- the NAT configuration is written and destroyed through router updates, the provider reads the router's network, and every mutation returns a region operation the provider polls.
      - purpose: UseStaticNatAddresses
        permissions:
          - compute.addresses.use
          - compute.addresses.get
        provenance: derived
        notes: Required only when nat_ips assigns reserved GcpAddress reservations to the gateway -- attaching an address a resource does not own demands use on it. Not needed with auto-allocated addresses.
