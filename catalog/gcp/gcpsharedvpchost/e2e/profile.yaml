apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpsharedvpchost
spec:
  # Enabling a Shared VPC host is authorized by roles/compute.xpnAdmin on the
  # ORGANIZATION (or a folder above the project) -- Google checks
  # compute.organizations.enableXpnHost there, never on the project -- and the
  # shared test project's identity holds no organization-level grant (the same
  # class as GcpFolder and GcpProject). Offline bar met: both modules build and
  # validate, offline plans for the reference manifest (ambient project, one
  # guarded client-config read) and the literal-project scenario are clean on
  # the pinned provider, and the accounting is total. Live proof waits for the
  # organization-scoped test identity; validated_provisioners stays empty until
  # the live lanes actually run. Unblock: roles/compute.xpnAdmin on the
  # organization for the E2E identity.
  tier: 2
  status: deferred
  deferred_reason: enabling a Shared VPC host requires organization-level roles/compute.xpnAdmin credentials the E2E test identity does not hold; offline plans only
  validated_provisioners: []
  timeout_minutes: 10
