apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpsharedvpchost
spec:
  # Shared VPC exists only inside an organization. Proven live on both
  # engines (2026-11-23, test organization planton-e2e.com) as the declared
  # identity: enableXpnHost and disableXpnHost on the organization, the
  # operation they return polled with compute.globalOperations.get on the host
  # project. No second act: the project is the host's only field, so nothing
  # updates in place and the kind proves by deploy and destroy.
  tier: 2
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
