# GcpSharedVpcHost install profile used when the host is an E2E PREREQUISITE
# for another component (a GcpSharedVpcServiceProject). Names no project, so
# the harness project becomes the host. Enabling it needs the organization-
# level xpnAdmin grant the shared identity lacks, which is why the consuming
# kind's profile is deferred with the same unblock condition.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSharedVpcHost
metadata:
  name: planton-oss-e2e-gcpsvph-prereq
  id: planton-oss-e2e-gcpsvph-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpsharedvpchost
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  deletionPolicy: DELETE
