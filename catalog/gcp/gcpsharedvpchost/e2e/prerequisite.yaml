# GcpSharedVpcHost install profile used when the host is an E2E PREREQUISITE
# for another component (a GcpSharedVpcServiceProject). Names no project, so
# the harness project becomes the host. Enabling it needs Google's
# organization-level Shared VPC admin permissions, which the harness key holds
# on the test organization, so the consuming kind runs in the
# organization-scoped process (e2e/README.md).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSharedVpcHost
metadata:
  name: planton-oss-e2e-gcpsvph-prereq
  id: planton-oss-e2e-gcpsvph-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpsharedvpchost
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  deletionPolicy: DELETE
