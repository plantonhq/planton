# GcpSharedVpcHost scenario naming the host project explicitly, by literal
# ID -- the form a chart uses when the network project was created outside
# it. Names the harness project through the exported token so the plan and
# the live run target the same project as the reference manifest's empty
# form; the difference is the code path (an explicit project skips the
# provider client-config read). Shared VPC exists only inside an
# organization, so the lane needs the test organization holding the harness
# project. No second act: the project is the host's only field, and
# changing it makes another project the host.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSharedVpcHost
metadata:
  name: planton-oss-e2e-gcpsvph-literal
  id: planton-oss-e2e-gcpsvph-literal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpsharedvpchost
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-required-env: PLANTON_E2E_GCP_ORGANIZATION_ID
  tags:
    - planton-e2e
spec:
  projectId:
    value: ${E2E_ENV:PLANTON_E2E_GCP_PROJECT_ID}
  deletionPolicy: DELETE
