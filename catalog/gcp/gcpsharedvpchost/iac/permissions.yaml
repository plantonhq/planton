# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpsharedvpchost
spec:
  gcp:
    api_enabled_by:
      - GcpVpcNetwork
    groups:
      - purpose: ManageSharedVpcHost
        permissions:
          - compute.organizations.enableXpnHost
          - compute.organizations.disableXpnHost
        provenance: derived
        reach: organization
        privilege: ordinary
        notes: "Covers google_compute_shared_vpc_host_project (Pulumi compute.SharedVPCHostProject) -- the modules' only resource. enableXpnHost on first apply; disableXpnHost on destroy under deletion_policy DELETE (refused by Google while service projects are attached; ABANDON and PREVENT call no disable API). Both organizations.* permissions are granted on the ORGANIZATION or a folder above the project, never on the project alone; roles/compute.xpnAdmin contains them."
      - purpose: ReadSharedVpcHostStatus
        permissions:
          - compute.projects.get
        provenance: derived
        reach: target
        privilege: ordinary
        notes: "The provider reads the host project's xpnProjectStatus with compute.projects.get on every refresh and import -- a project permission, held on the host project."
      - purpose: ResolveDefaultProject
        permissions:
          - resourcemanager.projects.get
        provenance: derived
        reach: target
        privilege: ordinary
        notes: "Only when spec.project_id is empty: the Terraform module reads data.google_client_config (count-gated on that case) and the Pulumi module calls organizations.GetClientConfig to make the provider's default project explicit, because this resource requires the project argument. Reading the client config itself needs no permission; projects.get is what the provider's project resolution may call."
