syntax = "proto3";

package dev.planton.gcp.gcpsharedvpchost.v1alpha1;

// GcpSharedVpcHostStackOutputs captures the host project's identity after
// provisioning.
message GcpSharedVpcHostStackOutputs {
  // The project ID that is now the Shared VPC host -- the resolved value,
  // so it is populated even when the spec left project_id empty and the
  // provider's default project was used. What a
  // GcpSharedVpcServiceProject's host_project_id references.
  string host_project_id = 1;
}
