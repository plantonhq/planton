syntax = "proto3";

package dev.planton.gcp.gcpsharedvpchost.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpsharedvpchost/v1alpha1/outputs.proto";
import "catalog/gcp/gcpsharedvpchost/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-shared-vpc-host
message GcpSharedVpcHost {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpSharedVpcHost'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpSharedVpcHostSpec spec = 4 [(buf.validate.field).required = true];
  GcpSharedVpcHostStatus status = 5;
}

message GcpSharedVpcHostStatus {
  GcpSharedVpcHostStackOutputs outputs = 1;
}
