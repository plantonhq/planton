# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: gcphealthcheck
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The check stores no customer data -- probe protocol, path, and thresholds are configuration metadata Google holds on its own encrypted control plane.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest exists to key (see enc-at-rest); the resource exposes no Cloud KMS surface.
    - control_id: enc-in-transit
      status: configurable
      field_path: https
      evidence:
        type: spec_default
        reference: The probe protocol is a required oneof with no default -- https, ssl, http2, and grpc_tls probe over TLS, while http, tcp, and grpc probe in plaintext; the choice is always explicit.
      notes: This governs PROBE traffic only -- the handful of bytes Google's probers exchange with backends on the health-check port, not user traffic. An encrypted probe is also a deeper check on TLS-serving backends; a plaintext TCP probe against an HTTPS service passes while the certificate is broken.
    - control_id: no-public-access
      status: not_applicable
      notes: The check exposes no endpoint -- Google's probers connect OUT to the backends. Whether those backends admit the prober ranges (35.191.0.0/16 and 130.211.0.0/22) is the firewall rules' stance, not this resource's.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No ingress surface exists here to restrict. The one ingress this component implies -- allowing Google's prober ranges through to backends -- is authored on GcpFirewallRule, where the allow rule should be scoped to exactly those documented ranges and the probe port.
    - control_id: edge-protection
      status: not_applicable
      notes: A health check is a liveness probe, not a traffic-filtering surface; WAF posture lives in Cloud Armor policies on the backend services that consume the check.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Management access is governed by Compute Engine IAM on every project -- mutations authorize against the compute.healthChecks (global) or compute.regionHealthChecks (regional) permission families; the resource has no data plane to govern separately.
    - control_id: workload-identity
      status: not_applicable
      notes: Nothing authenticates through a health check -- probes are unauthenticated liveness traffic from Google's infrastructure, and the resource holds no credentials.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The check carries no authentication paths to disable. The genuinely legacy adjacent surface -- GCP's separate httpHealthChecks/httpsHealthChecks API families for legacy networks -- is one the modules never create.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Check create, update, and delete land in Cloud Audit Logs (Admin Activity) unconditionally; Admin Activity logging cannot be disabled.
      notes: Admin Activity covers changes TO the check; per-transition visibility of the health verdicts it produces is enable_logging's job (see monitoring-integration).
    - control_id: monitoring-integration
      status: configurable
      field_path: enable_logging
      evidence:
        type: spec_default
        reference: False by default -- no health-transition logs; true exports a Cloud Logging entry on every backend health-state change, the primary signal for debugging flapping backends and tuning thresholds.
      notes: Backend health is also visible on demand through the consuming backend service's getHealth surface without logging; the log stream adds history and alertability at standard Logging ingestion cost.
    - control_id: backup-recovery
      status: not_applicable
      notes: The check is declarative configuration fully re-creatable from source control; there is no data to back up or restore.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Google documents that every health check is implemented by multiple redundant probers -- health verdicts never hinge on a single probe system, with no failure-domain choice exposed or needed on the resource.
      notes: source_regions sharpens the stance on global HTTP/HTTPS/TCP checks by pinning probes to exactly 3 named regions, so one regional prober outage cannot flip a global verdict. The check itself follows its scope -- a regional check serves regional consumers; multi-region architectures create one check per region.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Empty defaults to DELETE; PREVENT makes destroy fail outright -- valuable for a probe many backend services share; ABANDON unmanages the check while it keeps probing in GCP.
      notes: GCP adds an API-side guard on top -- deleting a health check still referenced by any backend service fails server-side, so even DELETE cannot silently strand consumers.
    - control_id: managed-patching
      status: not_applicable
      notes: There is no software surface here to patch; the prober fleet executing the checks is Google's own infrastructure, patched as part of the platform with no version or channel exposed on this resource.
