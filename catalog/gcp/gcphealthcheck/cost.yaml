# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: gcphealthcheck
spec:
  billing_model: free
  free_tier: "A Compute Engine health check has no meter: the Cloud Load Balancing pricing page enumerates every charge in the product family -- forwarding rules, data processing, custom headers, certificates -- and health checks appear on none of them, at any probe interval, threshold, or backend count, in either global or regional scope. Two paid look-alikes are DIFFERENT products this component never creates: Cloud DNS routing-policy health checks bill per check per month ($0.50 internal fast / $2.00 internal premium, under Cloud DNS pricing), and Cloud Monitoring uptime checks bill $0.30 per 1,000 executions -- neither is a Compute Engine health check."
  notes: "One field starts a meter: enable_logging exports a Cloud Logging entry on every health-state transition, billed as standard Logging ingestion -- trivial for stable fleets, real on large flapping ones. The probe traffic itself is free in the common case, with one priced path Google documents on the LB pricing page: health-check probes to a regional internet NEG traverse the mandatory Cloud NAT and bill as NAT data processing. The real spend always lives in what consumes the check -- the load balancer's forwarding-rule hours and per-GiB data processing, and the backends (instance groups, NEGs) billing as their own catalog kinds. An ABANDONed check keeps probing in GCP, still free at rest."
