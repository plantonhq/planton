# Minimal GcpHealthCheck scenario: a GLOBAL HTTP probe on the serving port.
# project_id is deliberately omitted: the module falls back to the provider's
# default project, which the E2E harness exports as GOOGLE_PROJECT from the
# resolved test project. Health checks are free and carry no soft-delete
# reservation, so the name stays fixed.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpHealthCheck
metadata:
  name: planton-oss-e2e-gcphc-smoke
  id: planton-oss-e2e-gcphc-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcphealthcheck
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  description: Ephemeral health check created by the Planton E2E harness; safe to delete
  http:
    portSpecification: USE_SERVING_PORT
    requestPath: /healthz
  enableLogging: false
  # Explicit provider default on the GLOBAL resource: proves the DELETE
  # round-trip on re-plan.
  deletionPolicy: DELETE
