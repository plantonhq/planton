apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcphealthcheck
spec:
  # Three leaf scenarios exercising BOTH provider resources behind the one
  # kind: minimal (global HTTP), regional (region TCP), and grpc-tls (global
  # gRPC-with-TLS — the formerly-beta protocol arm, GA on the pinned line).
  # Health checks are free, instant to create/destroy, and have no
  # dependencies — deploy -> compute healthChecks/regionHealthChecks get
  # verify -> destroy -> verify 404, on both provisioners.
  #
  # Live-proven 2026-08-12 on both engines under the apply-idempotency gate
  # at the total-accounting surface: the ONE deletion_policy spec field fans
  # to BOTH provider resources — minimal/grpc-tls proved the global arm and
  # regional proved the regional arm, all re-plans clean.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
