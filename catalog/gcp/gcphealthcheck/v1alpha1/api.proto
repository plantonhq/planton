syntax = "proto3";

package dev.planton.gcp.gcphealthcheck.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcphealthcheck/v1alpha1/outputs.proto";
import "catalog/gcp/gcphealthcheck/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-health-check
message GcpHealthCheck {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpHealthCheck'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpHealthCheckSpec spec = 4 [(buf.validate.field).required = true];
  GcpHealthCheckStatus status = 5;
}

message GcpHealthCheckStatus {
  GcpHealthCheckOutputs outputs = 1;
}
