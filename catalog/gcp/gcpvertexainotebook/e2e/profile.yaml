apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpvertexainotebook
spec:
  # Composed scenario: VPC -> subnetwork chain before the notebook create.
  # Workbench instances take ~5-15 minutes per engine; batch runs with a
  # go test -timeout of at least 60m.
  #
  # The chain lives in us-east1 (relocated 2026-08-13): us-central1's
  # zonal small-VM pools have stocked out on this exact machine class
  # repeatedly (the documented ZONE_RESOURCE_POOL_EXHAUSTED class); the
  # chain is self-contained, so region is a free variable pinned to
  # measured capacity.
  #
  # Live-proven 2026-08-13 both engines under the apply-idempotency gate
  # (deletion_policy DELETE round-trip included). Offline-proven-only arms
  # with unblock conditions: the widened accelerator values
  # (H100/H200/B200 need A3/A4 GPU capacity — quota-gated, expensive;
  # unblock: a GPU quota grant on the test project) and the hyperdisk
  # boot/data-disk types (need hyperdisk-capable machine series in the
  # scenario; the widened CELs carry the provider ValidateEnum evidence).
  tier: 1
  #
  # Awaiting re-proof: the notebook gained min_cpu_platform,
  # enable_deletion_protection, and data-disk resource policies; the earlier
  # live proof predates them. All three are API-computed when unset, so the
  # next proof confirms the untouched shape re-plans clean; deletion
  # protection is not armed live (it would block the harness's destroy) and
  # stays offline-proven.
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 20
