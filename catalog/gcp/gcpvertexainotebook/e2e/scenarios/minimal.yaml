# Minimal Workbench notebook on the VPC→subnetwork chain. Uses the smallest
# practical machine type; vmImage is omitted so the service provisions its
# default (latest) Workbench image — the shape most manifests should use,
# and immune to GCP retiring named image families (the legacy DL-VM
# notebook families are already gone).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVertexAiNotebook
metadata:
  name: planton-oss-e2e-gcpvnb-minimal
  id: planton-oss-e2e-gcpvnb-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpvertexainotebook
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  instanceName: planton-oss-e2e-vnb-${E2E_RUN_ID}
  # us-east1: capacity resilience. us-central1 zonal pools have stocked out
  # on this exact machine class repeatedly (ZONE_RESOURCE_POOL_EXHAUSTED for
  # e2-standard-2 in us-central1-a verified 2026-08-12; the same class hit
  # connectors, MIGs, VMs, functions, GKE, and Dataproc through 2026-08).
  # The whole region-matched chain (this scenario + the consumer-scoped
  # subnetwork prerequisite) lives in us-east1 together.
  location: us-east1-b
  machineType: e2-standard-2
  # Explicit DELETE proves the client-side lever round-trips (the
  # provider defaults it server-side; every scenario arms it).
  deletionPolicy: DELETE
  labels:
    e2e: minimal
  # Rides the harness-installed GcpServiceAccount prerequisite so the
  # registry-declared composition (VPC + subnetwork + identity) is actually
  # exercised live, not just installed.
  serviceAccount:
    valueFrom:
      kind: GcpServiceAccount
      name: planton-oss-e2e-gsa-prereq
      fieldPath: status.outputs.email
  networkInterface:
    network:
      valueFrom:
        kind: GcpVpcNetwork
        name: planton-oss-e2e-gcpvpcnetwork-prereq
        fieldPath: status.outputs.network_self_link
    subnet:
      valueFrom:
        kind: GcpSubnetwork
        name: planton-oss-e2e-gcpsubnetwork-prereq
        fieldPath: status.outputs.subnetwork_self_link
