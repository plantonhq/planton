# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpvertexainotebook
spec:
  gcp:
    groups:
      - purpose: EnableApis
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers the two google_project_service resources enabling notebooks.googleapis.com and compute.googleapis.com on the target project. disable_on_destroy is false for both, so the disable permission is never needed.
      - purpose: ManageWorkbenchInstance
        permissions:
          - notebooks.instances.create
          - notebooks.instances.get
          - notebooks.instances.update
          - notebooks.instances.delete
          - notebooks.instances.start
          - notebooks.instances.stop
          - notebooks.operations.get
        provenance: derived
        notes: "Covers google_workbench_instance (Terraform) / workbench.Instance (Pulumi). GCP defines NO workbench.* permission family (verified against IAM's testable-permissions inventory) -- the v2 Workbench Instances API authorizes with the notebooks.instances.* permissions. In-place changes (labels, metadata, machine type via the gce_setup patch) authorize as notebooks.instances.update; desired_state ACTIVE/STOPPED drives start and stop; every mutation returns a long-running operation the provider polls with notebooks.operations.get. The underlying Compute Engine VM is created by the Notebooks service agent, not the caller, so the runner needs no compute.instances.* permissions -- only the Compute API enablement above."
      - purpose: ActAsServiceAccount
        permissions:
          - iam.serviceAccounts.actAs
        provenance: derived
        notes: Required only when service_account pins a VM identity (the 03-secure-private-notebook preset does) -- GCP demands actAs on that account before provisioning a VM running as it. Not needed when the field is omitted and the instance falls to the default compute service account.
