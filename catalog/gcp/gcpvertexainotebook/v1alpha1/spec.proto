syntax = "proto3";

package dev.planton.gcp.gcpvertexainotebook.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// GcpVertexAiNotebookBootDisk defines the boot disk configuration for the
// notebook instance. If not specified, GCP provisions a 150 GB PD_SSD
// boot disk with Google-managed encryption.
message GcpVertexAiNotebookBootDisk {
  // Disk type for the boot disk.
  // Persistent Disk: PD_STANDARD (HDD), PD_SSD, PD_BALANCED, PD_EXTREME.
  // Hyperdisk (newer-generation machine series only): HYPERDISK_BALANCED,
  // HYPERDISK_BALANCED_HIGH_AVAILABILITY, HYPERDISK_ML.
  // If not specified, defaults to PD_SSD.
  string disk_type = 1 [(buf.validate.field).cel = {
    id: "valid_boot_disk_type"
    expression: "this == '' || this in ['PD_STANDARD', 'PD_SSD', 'PD_BALANCED', 'PD_EXTREME', 'HYPERDISK_BALANCED', 'HYPERDISK_BALANCED_HIGH_AVAILABILITY', 'HYPERDISK_ML']"
    message: "disk_type must be one of: PD_STANDARD, PD_SSD, PD_BALANCED, PD_EXTREME, HYPERDISK_BALANCED, HYPERDISK_BALANCED_HIGH_AVAILABILITY, HYPERDISK_ML"
  }];

  // Size of the boot disk in GB.
  // Minimum 10 GB, maximum 64000 GB (64 TB).
  // If not specified, defaults to 150 GB.
  int32 disk_size_gb = 2 [(buf.validate.field).cel = {
    id: "valid_boot_disk_size"
    expression: "this == 0 || (this >= 10 && this <= 64000)"
    message: "disk_size_gb must be between 10 and 64000 (or omitted for default 150 GB)"
  }];

  // KMS key for CMEK encryption of the boot disk.
  // Format: projects/{project}/locations/{location}/keyRings/{ring}/cryptoKeys/{key}
  // If not specified, Google-managed encryption (GMEK) is used.
  dev.planton.shared.foreignkey.v1.StringValueOrRef kms_key = 3 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpKmsKey,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_id"
  ];
}

// GcpVertexAiNotebookDataDisk defines a data disk attached to the notebook
// instance. GCP supports exactly one data disk per Workbench instance.
// If not specified, GCP provisions a 100 GB data disk with Google-managed
// encryption.
message GcpVertexAiNotebookDataDisk {
  // Disk type for the data disk.
  // Persistent Disk: PD_STANDARD (HDD), PD_SSD, PD_BALANCED, PD_EXTREME.
  // Hyperdisk (newer-generation machine series only): HYPERDISK_BALANCED,
  // HYPERDISK_EXTREME, HYPERDISK_THROUGHPUT,
  // HYPERDISK_BALANCED_HIGH_AVAILABILITY, HYPERDISK_ML.
  // If not specified, defaults to PD_STANDARD.
  string disk_type = 1 [(buf.validate.field).cel = {
    id: "valid_data_disk_type"
    expression: "this == '' || this in ['PD_STANDARD', 'PD_SSD', 'PD_BALANCED', 'PD_EXTREME', 'HYPERDISK_BALANCED', 'HYPERDISK_EXTREME', 'HYPERDISK_THROUGHPUT', 'HYPERDISK_BALANCED_HIGH_AVAILABILITY', 'HYPERDISK_ML']"
    message: "disk_type must be one of: PD_STANDARD, PD_SSD, PD_BALANCED, PD_EXTREME, HYPERDISK_BALANCED, HYPERDISK_EXTREME, HYPERDISK_THROUGHPUT, HYPERDISK_BALANCED_HIGH_AVAILABILITY, HYPERDISK_ML"
  }];

  // Size of the data disk in GB.
  // Minimum 10 GB, maximum 64000 GB (64 TB).
  // If not specified, defaults to 100 GB.
  int32 disk_size_gb = 2 [(buf.validate.field).cel = {
    id: "valid_data_disk_size"
    expression: "this == 0 || (this >= 10 && this <= 64000)"
    message: "disk_size_gb must be between 10 and 64000 (or omitted for default 100 GB)"
  }];

  // KMS key for CMEK encryption of the data disk.
  // Format: projects/{project}/locations/{location}/keyRings/{ring}/cryptoKeys/{key}
  // If not specified, Google-managed encryption (GMEK) is used.
  dev.planton.shared.foreignkey.v1.StringValueOrRef kms_key = 3 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpKmsKey,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_id"
  ];

  // Compute Engine resource policies attached to the data disk — most
  // usefully a snapshot schedule, so the notebook's working data is
  // backed up on a cadence without any agent inside the VM. Each entry is
  // a policy's full resource name or self link
  // (projects/{project}/regions/{region}/resourcePolicies/{name}); the
  // policy must live in the instance's region. Leave empty for no
  // attached policies; sent only when set because the API reports the
  // attached set itself.
  repeated string resource_policies = 4 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).repeated = {
      unique: true
      items: {
        string: {min_len: 1}
      }
    }
  ];
}

// GcpVertexAiNotebookAcceleratorConfig defines a GPU accelerator attached
// to the notebook instance. GCP supports exactly one accelerator
// configuration per Workbench instance.
message GcpVertexAiNotebookAcceleratorConfig {
  // GPU accelerator type. Availability varies by zone and machine type:
  // current-generation training/inference GPUs (NVIDIA_H100_80GB,
  // NVIDIA_H100_MEGA_80GB, NVIDIA_H200_141GB, NVIDIA_B200) require
  // their matching A3/A4 machine series; NVIDIA_L4 and the Tesla
  // family run on G2/N1; the _VWS variants are virtual-workstation
  // (graphics) licenses of the same silicon.
  // See https://cloud.google.com/vertex-ai/docs/workbench/instances/create#accelerator
  // for supported types per zone.
  string type = 1 [(buf.validate.field).cel = {
    id: "valid_accelerator_type"
    expression: "this == '' || this in ['NVIDIA_TESLA_P100', 'NVIDIA_TESLA_V100', 'NVIDIA_TESLA_P4', 'NVIDIA_TESLA_T4', 'NVIDIA_TESLA_A100', 'NVIDIA_A100_80GB', 'NVIDIA_L4', 'NVIDIA_H100_80GB', 'NVIDIA_H100_MEGA_80GB', 'NVIDIA_H200_141GB', 'NVIDIA_B200', 'NVIDIA_RTX6000', 'NVIDIA_TESLA_T4_VWS', 'NVIDIA_TESLA_P100_VWS', 'NVIDIA_TESLA_P4_VWS']"
    message: "type must be a valid accelerator type (e.g., NVIDIA_TESLA_T4, NVIDIA_L4, NVIDIA_TESLA_A100, NVIDIA_H100_80GB, NVIDIA_H200_141GB, NVIDIA_B200)"
  }];

  // Number of accelerator cores.
  // Valid values depend on the accelerator type (typically 1, 2, 4, or 8).
  int32 core_count = 2 [(buf.validate.field).cel = {
    id: "valid_accelerator_core_count"
    expression: "this == 0 || this > 0"
    message: "core_count must be a positive integer"
  }];
}

// GcpVertexAiNotebookNetworkInterface defines the network configuration
// for the notebook instance. GCP supports exactly one network interface
// per Workbench instance.
message GcpVertexAiNotebookNetworkInterface {
  // VPC network for the instance.
  // Can be a literal value (VPC name or self_link) or a reference to
  // a GcpVpcNetwork resource.
  dev.planton.shared.foreignkey.v1.StringValueOrRef network = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpVpcNetwork,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.network_self_link"
  ];

  // Subnetwork for the instance.
  // Can be a literal value (subnet name or self_link) or a reference to
  // a GcpSubnetwork resource.
  dev.planton.shared.foreignkey.v1.StringValueOrRef subnet = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpSubnetwork,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.subnetwork_self_link"
  ];

  // NIC type for the network interface.
  // Valid values: VIRTIO_NET, GVNIC.
  // GVNIC provides higher bandwidth and lower latency.
  // If not specified, defaults to VIRTIO_NET.
  string nic_type = 3 [(buf.validate.field).cel = {
    id: "valid_nic_type"
    expression: "this == '' || this in ['VIRTIO_NET', 'GVNIC']"
    message: "nic_type must be one of: VIRTIO_NET, GVNIC"
  }];

  // Static external IP address for the instance (ONE_TO_ONE_NAT access
  // config). The address must be an unused static external IP in the
  // same region as the instance's zone. Reference a GcpAddress resource
  // to reserve and pin the IP as a first-class node, or pass a literal
  // IP address.
  //
  // If omitted (and public IP is not disabled), GCP assigns an ephemeral
  // external IP from a shared pool -- the IP changes across stop/start
  // cycles. Pin a static address when firewall allowlists or DNS records
  // depend on the instance's IP.
  //
  // Cannot be combined with disable_public_ip. Immutable after creation.
  dev.planton.shared.foreignkey.v1.StringValueOrRef external_ip = 4 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpAddress,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.address"
  ];
}

// GcpVertexAiNotebookConfidentialInstanceConfig enables Confidential
// Computing for the notebook VM: guest memory is encrypted in use with
// AMD SEV (Secure Encrypted Virtualization), protecting data even from
// the host hypervisor. Requires an AMD-based machine type that supports
// SEV (e.g., the n2d family). Immutable after creation. Declaring the block
// turns it on; `enabled: false` keeps the setting in the manifest while
// switching it off.
message GcpVertexAiNotebookConfidentialInstanceConfig {
  // Confidential computing technology for the instance.
  // The only supported value is SEV (AMD Secure Encrypted Virtualization).
  // If not specified, defaults to SEV.
  string confidential_instance_type = 1 [(buf.validate.field).cel = {
    id: "valid_confidential_instance_type"
    expression: "this == '' || this == 'SEV'"
    message: "confidential_instance_type must be SEV (the only supported confidential technology)"
  }];

  // Whether Confidential Computing is on. Unset means on: declaring the
  // block has always meant enabling it, and this switch lets a manifest say
  // the opposite out loud.
  optional bool enabled = 2 [(dev.planton.shared.options.default) = "true"];
}

// GcpVertexAiNotebookReservationAffinity controls which Compute Engine
// capacity reservations the notebook VM may consume. Organizations that
// pre-purchase GPU or high-demand CPU capacity use reservations to
// guarantee availability; this block points the notebook at that
// capacity. Immutable after creation.
message GcpVertexAiNotebookReservationAffinity {
  option (buf.validate.message).cel = {
    id: "specific_reservation_requires_key_values"
    expression: "this.consume_reservation_type == 'RESERVATION_SPECIFIC' || (this.key == '' && this.values.size() == 0)"
    message: "key and values may only be set when consume_reservation_type is RESERVATION_SPECIFIC"
  };

  // How the instance consumes reservations:
  //   - RESERVATION_ANY (default): consume any matching open reservation.
  //   - RESERVATION_SPECIFIC: consume only the reservation named in
  //     key/values.
  //   - RESERVATION_NONE: never consume reserved capacity (on-demand only).
  string consume_reservation_type = 1 [(buf.validate.field).cel = {
    id: "valid_consume_reservation_type"
    expression: "this == '' || this in ['RESERVATION_NONE', 'RESERVATION_ANY', 'RESERVATION_SPECIFIC']"
    message: "consume_reservation_type must be one of: RESERVATION_NONE, RESERVATION_ANY, RESERVATION_SPECIFIC"
  }];

  // Corresponds to the label key of a reservation resource. To target a
  // SPECIFIC_RESERVATION by name, use "compute.googleapis.com/reservation-name"
  // as the key. Only valid with RESERVATION_SPECIFIC.
  string key = 2;

  // Corresponds to the label values of a reservation resource -- for the
  // reservation-name key, the reservation's name. Only valid with
  // RESERVATION_SPECIFIC.
  repeated string values = 3;
}

// GcpVertexAiNotebookVmImage defines a Compute Engine VM image to use
// as the notebook environment. When this message is omitted entirely,
// the Workbench service provisions its default (latest) Workbench image
// with JupyterLab and the common ML stack pre-installed -- the
// recommended shape for most notebooks.
//
// Mutually exclusive with GcpVertexAiNotebookContainerImage.
message GcpVertexAiNotebookVmImage {
  // Google Cloud project that the VM image belongs to.
  // GCP's own Workbench images live in "cloud-notebooks-managed".
  // (The legacy deep-learning-VM notebook families under
  // "deeplearning-platform-release" have been retired by GCP and no
  // longer resolve.)
  string project = 1;

  // VM image family. The newest image in this family will be used.
  // GCP's maintained family for Workbench instances is
  // "workbench-instances" (in the "cloud-notebooks-managed" project).
  // Mutually exclusive with name (within this message).
  string family = 2;

  // Specific VM image name. Use this instead of family when you need
  // to pin to an exact image version.
  // Mutually exclusive with family (within this message).
  string name = 3;
}

// GcpVertexAiNotebookContainerImage defines a custom container image
// to use as the notebook environment. Use this when you need a custom
// JupyterLab environment with specific libraries, frameworks, or
// configurations not available in the pre-built VM images.
//
// Mutually exclusive with GcpVertexAiNotebookVmImage.
message GcpVertexAiNotebookContainerImage {
  // Container image repository path.
  // Example: "gcr.io/deeplearning-platform-release/base-cu113.py310"
  string repository = 1 [(buf.validate.field).required = true];

  // Container image tag. If not specified, the latest tag is used.
  string tag = 2;
}

// GcpVertexAiNotebookShieldedInstanceConfig defines Shielded VM settings
// for the notebook instance. Shielded VMs provide verifiable integrity
// to protect against rootkits and bootkits. Each switch carries presence: a
// switch left unset leaves GCP's default for it, and an explicit `false`
// actively turns that protection off (vTPM and integrity monitoring are on
// by default, so `false` on them is a real, deliberate statement).
message GcpVertexAiNotebookShieldedInstanceConfig {
  // Enable Secure Boot. Ensures only verified boot software runs.
  // Disabled by default because some ML libraries may not have signed
  // boot loaders.
  optional bool enable_secure_boot = 1;

  // Enable vTPM (Virtual Trusted Platform Module).
  // Provides measured boot integrity and key generation.
  // Enabled by default; an explicit false turns it off.
  optional bool enable_vtpm = 2;

  // Enable integrity monitoring. Compares boot measurements against
  // a trusted baseline.
  // Enabled by default; an explicit false turns it off.
  optional bool enable_integrity_monitoring = 3;
}

// GcpVertexAiNotebookSpec defines the configuration for a GCP Vertex AI
// Workbench instance (managed notebook).
//
// Vertex AI Workbench provides managed JupyterLab notebook instances
// for data science and machine learning workflows. Each instance is a
// Compute Engine VM pre-configured with JupyterLab, ML frameworks, and
// GPU support. Users access notebooks through a secure proxy URL.
//
// Important behavioral notes:
//
//   - The instance_name and location fields are immutable after creation.
//     Changing them requires destroying and recreating the instance.
//
//   - The location field specifies a zone (e.g., "us-central1-a"), not
//     a region. Notebooks run on individual VMs in specific zones.
//
//   - Exactly one of vm_image or container_image may be specified. If
//     neither is specified, GCP uses the default deep learning VM image.
//
//   - GPU accelerators require compatible machine types (e.g., n1-standard-*
//     for NVIDIA_TESLA_T4). See GCP documentation for compatibility matrix.
//
//   - Network configuration, service account, tags, confidential computing,
//     reservation affinity, and disk encryption settings are immutable
//     after creation (ForceNew).
message GcpVertexAiNotebookSpec {
  option (buf.validate.message).cel = {
    id: "vm_image_container_image_mutual_exclusion"
    expression: "!has(this.vm_image) || !has(this.container_image)"
    message: "only one of vm_image or container_image can be set, not both"
  };

  option (buf.validate.message).cel = {
    id: "external_ip_conflicts_with_disable_public_ip"
    expression: "!this.disable_public_ip || !has(this.network_interface) || !has(this.network_interface.external_ip)"
    message: "network_interface.external_ip cannot be set when disable_public_ip is true"
  };

  // GCP project where the notebook instance will be created.
  // If omitted, the instance is created in the provider's default
  // project (from the credential or ambient configuration).
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];

  // GCP zone where the notebook instance will be created (e.g., "us-central1-a").
  // Immutable after creation.
  string location = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {pattern: "^[a-z]+-[a-z]+[0-9]+-[a-z]$"}
  ];

  // Compute Engine machine type for the instance.
  // Examples: "e2-standard-4", "n1-standard-8", "a2-highgpu-1g".
  // Choose based on workload requirements -- CPU-only for data processing,
  // N1/A2 for GPU-accelerated ML training.
  string machine_type = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1}
  ];

  // Name of the Workbench instance in GCP.
  // If not specified, defaults to metadata.name.
  // Immutable after creation. Must be a valid RFC1035 hostname.
  string instance_name = 4 [(buf.validate.field).cel = {
    id: "valid_instance_name"
    expression: "this == '' || this.matches('^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$')"
    message: "instance_name must be a valid RFC1035 hostname: lowercase letters, digits, and hyphens, starting with a letter"
  }];

  // Email addresses of users who own the instance.
  // Format: alias@example.com. Currently GCP supports one owner only.
  // If set, access mode is Single User (only this owner can access).
  // Immutable after creation.
  repeated string instance_owners = 5;

  // Desired state of the instance: ACTIVE (running) or STOPPED.
  // Use STOPPED to suspend the instance and stop billing for compute
  // (storage charges still apply). Defaults to ACTIVE.
  string desired_state = 6 [(buf.validate.field).cel = {
    id: "valid_desired_state"
    expression: "this == '' || this in ['ACTIVE', 'STOPPED']"
    message: "desired_state must be one of: ACTIVE, STOPPED"
  }];

  // If true, the notebook instance will not register with the proxy
  // and no JupyterLab proxy URL will be generated. Use this for
  // instances accessed only via SSH or other direct methods.
  // Immutable after creation.
  bool disable_proxy_access = 7;

  // Custom metadata key-value pairs for the instance.
  // Some keys trigger special behaviors (e.g., install-monitoring-agent).
  map<string, string> metadata = 8;

  // User-defined labels to organize the instance (cost attribution,
  // team ownership, environment tagging). Keys and values must follow
  // GCP label rules: lowercase letters, digits, underscores, and dashes,
  // at most 63 characters. Merged with the platform's attribution labels;
  // on key conflicts the platform labels win. Mutable in place.
  map<string, string> labels = 9;

  // Boot disk configuration for the notebook instance.
  // If not specified, GCP provisions a 150 GB PD_SSD boot disk with
  // Google-managed encryption.
  GcpVertexAiNotebookBootDisk boot_disk = 10;

  // Data disk configuration for the notebook instance.
  // GCP supports exactly one data disk per Workbench instance.
  // If not specified, GCP provisions a 100 GB data disk with
  // Google-managed encryption.
  GcpVertexAiNotebookDataDisk data_disk = 11;

  // GPU accelerator configuration for the notebook instance.
  // GCP supports one accelerator configuration per instance.
  // Requires compatible machine types (e.g., n1-standard-* for Tesla GPUs).
  GcpVertexAiNotebookAcceleratorConfig accelerator_config = 12;

  // Network interface configuration for the notebook instance.
  // GCP supports one network interface per instance.
  // If not specified, the instance uses the default VPC network.
  // Immutable after creation.
  GcpVertexAiNotebookNetworkInterface network_interface = 13;

  // If true, no external IP is assigned to the instance.
  // Use this for instances that should only be accessible through
  // the Vertex AI proxy or a VPN/Cloud IAP tunnel.
  // Immutable after creation.
  bool disable_public_ip = 14;

  // If true, enable IP forwarding on the instance. Useful for
  // instances acting as network gateways. Default false.
  // Immutable after creation.
  bool enable_ip_forwarding = 15;

  // Service account email for the notebook VM identity.
  // The VM uses this service account to access GCP resources
  // (BigQuery, GCS, Vertex AI, etc.). Scopes are fixed to
  // "https://www.googleapis.com/auth/cloud-platform".
  // Immutable after creation.
  dev.planton.shared.foreignkey.v1.StringValueOrRef service_account = 16 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpServiceAccount,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.email"
  ];

  // Compute Engine network tags for firewall rules.
  // Immutable after creation.
  repeated string tags = 17;

  // VM image configuration for the notebook environment.
  // Uses pre-built deep learning VM images from GCP with popular
  // ML frameworks (TensorFlow, PyTorch, JAX) and JupyterLab.
  // Mutually exclusive with container_image.
  // Immutable after creation.
  GcpVertexAiNotebookVmImage vm_image = 18;

  // Container image configuration for a custom notebook environment.
  // Use this when pre-built VM images don't meet your needs.
  // Mutually exclusive with vm_image.
  GcpVertexAiNotebookContainerImage container_image = 19;

  // Shielded VM configuration for enhanced security.
  // Shielded VMs protect against rootkits and bootkits with
  // Secure Boot, vTPM, and integrity monitoring.
  GcpVertexAiNotebookShieldedInstanceConfig shielded_instance_config = 20;

  // Confidential Computing configuration. When set, guest memory is
  // encrypted in use with AMD SEV -- data stays protected even from the
  // host hypervisor. Requires an SEV-capable AMD machine type (e.g., the
  // n2d family). Immutable after creation.
  GcpVertexAiNotebookConfidentialInstanceConfig confidential_instance_config = 21;

  // Compute Engine reservation affinity. Points the notebook VM at
  // pre-purchased capacity reservations -- the way organizations
  // guarantee GPU availability for ML workloads. Immutable after creation.
  GcpVertexAiNotebookReservationAffinity reservation_affinity = 22;

  // Enable managed end-user credentials (EUC) for the instance. With
  // managed EUC, JupyterLab runs as the accessing user's own Google
  // identity rather than the VM's service account, so notebook code sees
  // the user's IAM permissions (single-user auditability). Mutable in place.
  bool enable_managed_euc = 23;

  // Allow access to the notebook through a third-party identity provider
  // configured on the organization (workforce identity federation).
  // Leave false when all users authenticate with Google identities.
  // Mutable in place.
  bool enable_third_party_identity = 24;

  // Deletion policy for the notebook — what happens when this resource
  // is destroyed:
  //   ""        -- same as "DELETE" (provider default)
  //   "DELETE"  -- the instance is deleted, including its boot and data
  //                disks; unsynced notebook work on those disks is lost
  //   "PREVENT" -- destroy FAILS; a guard for a workstation whose local
  //                disks hold work not yet pushed anywhere else
  //   "ABANDON" -- the instance is removed from management but left
  //                running (and billing) in GCP with its disks intact
  string deletion_policy = 25 [(buf.validate.field).cel = {
    id: "valid_deletion_policy"
    message: "deletion_policy must be one of: DELETE, PREVENT, ABANDON"
    expression: "this == '' || this in ['DELETE', 'PREVENT', 'ABANDON']"
  }];

  // Minimum CPU platform for the VM, e.g. "Intel Cascade Lake" or
  // "Intel Sapphire Rapids": pins the instance to at least this CPU
  // generation so notebook code that relies on newer instruction sets
  // (AVX-512, AMX) is never scheduled on older hardware. The platform
  // must be offered for the machine type in the instance's zone. Leave
  // empty to let Compute Engine choose; sent only when set because the
  // API reports the platform it picked.
  string min_cpu_platform = 26;

  // Workbench-side deletion protection: while true, the API refuses to
  // delete the instance from any client (console, gcloud, either IaC
  // engine) until the flag is lifted — a guard for a workstation whose
  // local disks hold work not yet pushed anywhere else. Off unless set;
  // pair with deletion_policy PREVENT for an engine-side guard too.
  // Sent only when set because the API reports its current value.
  optional bool enable_deletion_protection = 27;
}
