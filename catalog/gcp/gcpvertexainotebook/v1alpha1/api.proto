syntax = "proto3";

package dev.planton.gcp.gcpvertexainotebook.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpvertexainotebook/v1alpha1/outputs.proto";
import "catalog/gcp/gcpvertexainotebook/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-vertex-ai-notebook
message GcpVertexAiNotebook {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpVertexAiNotebook'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpVertexAiNotebookSpec spec = 4 [(buf.validate.field).required = true];
  GcpVertexAiNotebookStatus status = 5;
}

message GcpVertexAiNotebookStatus {
  GcpVertexAiNotebookOutputs outputs = 1;
}
