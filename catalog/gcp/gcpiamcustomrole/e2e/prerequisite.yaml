# GcpIamCustomRole install profile used as a prerequisite by composed
# kinds (e.g. GcpProjectIamMember). The E2E harness deploys this role
# first (via its Pulumi module), captures its outputs, and resolves the
# dependent's role reference (status.outputs.name) against them. The role id
# differs from the smoke scenario's so a prerequisite deploy never collides
# with a concurrently-running gcpiamcustomrole scenario.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpIamCustomRole
metadata:
  name: planton-oss-e2e-gcprole-prereq
  id: planton-oss-e2e-gcprole-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpiamcustomrole
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  roleId: plantonOssE2ePrereqRole
  title: Planton OSS E2E Prerequisite Role
  description: Ephemeral role deployed as an E2E prerequisite; safe to delete
  permissions:
    - storage.objects.get
    - storage.objects.list
