syntax = "proto3";

package dev.planton.gcp.gcpiamcustomrole.v1alpha1;

// Outputs produced after provisioning a GCP IAM custom role.
message GcpIamCustomRoleOutputs {
  // The fully-qualified role name: projects/<project>/roles/<role_id>.
  // This is the grantable handle — feed it directly into IAM grants
  // (GcpProjectIamMember's role field) exactly as IAM policies expect it.
  string name = 1;

  // The bare role ID within the project (the spec's role_id, echoed for
  // convenience when composing tooling that addresses the role by short ID).
  string role_id = 2;

  // Whether the role is currently soft-deleted. GCP retains deleted custom
  // roles for up to 14 days; a true value means the role exists but rejects
  // all grants until undeleted or permanently purged.
  bool deleted = 3;
}
