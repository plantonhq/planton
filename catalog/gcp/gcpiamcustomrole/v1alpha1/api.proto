syntax = "proto3";

package dev.planton.gcp.gcpiamcustomrole.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpiamcustomrole/v1alpha1/outputs.proto";
import "catalog/gcp/gcpiamcustomrole/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-iam-custom-role
message GcpIamCustomRole {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpIamCustomRole'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpIamCustomRoleSpec spec = 4 [(buf.validate.field).required = true];
  GcpIamCustomRoleStatus status = 5;
}

message GcpIamCustomRoleStatus {
  GcpIamCustomRoleOutputs outputs = 1;
}
