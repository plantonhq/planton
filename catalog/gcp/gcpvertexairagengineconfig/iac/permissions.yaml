# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpvertexairagengineconfig
spec:
  gcp:
    groups:
      - purpose: EnableAiplatformApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
          - resourcemanager.projects.get
        provenance: derived
        reach: target
        privilege: ordinary
        notes: Covers google_project_service enabling aiplatform.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed. The provider reads the project with resourcemanager.projects.get before its services on every refresh, so a re-plan or destroy needs it (measured live).
      - purpose: ManageRagEngineConfig
        permissions:
          - aiplatform.ragEngineConfigs.get
          - aiplatform.ragEngineConfigs.update
        provenance: derived
        reach: target
        privilege: ordinary
        notes: Covers google_vertex_ai_rag_engine_config (Pulumi vertex.AiRagEngineConfig) -- the singleton is created, changed, and destroyed by PATCH (destroy under deletion_policy DELETE PATCHes the tier to UNPROVISIONED; ABANDON and PREVENT call no API) and read on every refresh. roles/aiplatform.admin contains both.
