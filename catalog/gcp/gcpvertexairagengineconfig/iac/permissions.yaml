# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpvertexairagengineconfig
spec:
  gcp:
    groups:
      - purpose: EnableAiplatformApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
        provenance: derived
        notes: Covers google_project_service enabling aiplatform.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageRagEngineConfig
        permissions:
          - aiplatform.ragEngineConfig.get
          - aiplatform.ragEngineConfig.update
        provenance: derived
        notes: Covers google_vertex_ai_rag_engine_config (Pulumi vertex.AiRagEngineConfig) -- the singleton is created, changed, and destroyed by PATCH (destroy under deletion_policy DELETE PATCHes the tier to UNPROVISIONED; ABANDON and PREVENT call no API) and read on every refresh. roles/aiplatform.admin contains both.
