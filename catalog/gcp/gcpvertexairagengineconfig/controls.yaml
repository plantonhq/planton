# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpvertexairagengineconfig
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: RAG Engine's managed database encrypts corpus data at rest with Google-managed keys in every tier without configuration.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: The managed database offers no customer-managed key at the location level; CMEK for RAG data is a corpus-level setting, not part of this configuration.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every RAG Engine API call is TLS over Google's regional Vertex AI endpoint; there is no plaintext path.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The managed database has no address of its own; it is reached only through the Vertex AI API under IAM.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network listener exists to restrict; access is API-level and governed by IAM.
    - control_id: edge-protection
      status: not_applicable
      notes: No edge is served; the configuration is a control-plane setting.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Reading or changing the tier requires aiplatform.ragEngineConfig.* permissions on the project; corpus operations carry their own aiplatform IAM permissions.
    - control_id: workload-identity
      status: not_applicable
      notes: The configuration authenticates nothing; callers of RAG Engine use their own identities.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths exist to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component enforces no end-user sign-in; access is administrative, whose posture rbac carries.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every tier change is a Vertex AI admin write recorded in Cloud Audit Logs (Admin Activity) unconditionally.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: RAG Engine emits its request and storage metrics to Cloud Monitoring under the Vertex AI resource types without configuration.
    - control_id: backup-recovery
      status: not_applicable
      notes: The configuration is one enum re-creatable from source control; the corpus data it governs is rebuilt by re-ingesting sources, and moving to UNPROVISIONED deletes it (the GUIDE says so).
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The managed database is a regional Google-managed service spread across the location's zones in every tier; there is no zonal placement to choose.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Unset means DELETE -- destroying the block PATCHes the location to UNPROVISIONED, which deletes the managed database's data; PREVENT makes destroy fail; ABANDON leaves the tier and the data alone when the block leaves management.
      notes: The 01-basic-tier preset sets ABANDON and the 02-scaled-tier preset PREVENT, because for this singleton "delete" means data loss for every corpus in the location.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The managed database is fully Google-operated; there is no software surface the customer patches.
