apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpvertexairagengineconfig
spec:
  # Proven live on both engines (2026-11-21), as an identity holding only this
  # kind's permissions manifest: the us-central1 configuration set to the
  # Basic tier, re-planned clean (the empty tier block compares clean on both
  # engines), and destroyed -- destroy sets the location to UNPROVISIONED,
  # which the verifier reads, because the singleton never goes away. No second
  # act: the configuration's create, update and delete are one write (a PATCH
  # of the location's singleton), so an update proves no permission create
  # doesn't.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
