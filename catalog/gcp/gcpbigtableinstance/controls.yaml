# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: gcpbigtableinstance
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Bigtable encrypts all stored data at rest with Google-managed keys on every cluster without configuration.
    - control_id: enc-at-rest-cmk
      status: configurable
      field_path: clusters.kms_key_name
      evidence:
        type: spec_default
        reference: Unset means Google-managed encryption; naming a regional Cloud KMS key per cluster encrypts that cluster's data with the customer-managed key. Immutable per cluster after creation.
      notes: The 03-enterprise-encrypted preset sets the same key on both clusters. The key's region must match each cluster's region, and the Bigtable service agent needs encrypt/decrypt on it as a prerequisite.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Clients reach Bigtable only through Google's API endpoints over TLS; no cleartext data path exists.
    - control_id: no-public-access
      status: not_applicable
      notes: Bigtable serves through Google's API endpoint rather than an address in your network -- there is no VPC placement or public-IP knob on this spec. Reachability is governed by IAM, and org-level VPC Service Controls can add a network perimeter outside this component.
    - control_id: restricted-ingress
      status: not_applicable
      notes: There is no network ingress surface to restrict -- access is via the IAM-authenticated API endpoint; source-based restriction lives in org-level VPC Service Controls, outside this spec.
    - control_id: edge-protection
      status: not_applicable
      notes: A managed NoSQL API endpoint is protected by TLS and IAM rather than a WAF; no request-filtering attachment point exists.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every management and data operation authorizes through Cloud IAM roles at project or instance scope; there is no non-IAM access path.
      notes: resource_manager_tags enable IAM conditions on the instance for finer-grained policy.
    - control_id: workload-identity
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Bigtable clients authenticate exclusively with Google Cloud IAM credentials (service accounts, workload identity federation) -- no static database passwords exist for the service.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: Bigtable has no legacy or password-based authentication path to disable -- IAM is the only door.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Administrative operations on the instance and its clusters land in Cloud Audit Logs (Admin Activity) unconditionally; Data Access audit logs can additionally be enabled at the project or org level.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Bigtable publishes instance and cluster metrics (CPU, node count, storage, request latency) to Cloud Monitoring for every instance without configuration.
    - control_id: backup-recovery
      status: not_applicable
      notes: Bigtable backups are table-level resources, and tables are application-level concerns this kind deliberately excludes -- the spec's only backup surface is force_destroy, which clears backups blocking instance deletion.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: Backup retention rides table-level backup resources, outside this component's instance-and-clusters scope.
    - control_id: multi-zone-ha
      status: configurable
      field_path: clusters
      evidence:
        type: spec_default
        reference: One cluster is a single zone of failure; each additional cluster (up to 8, each in a different zone or region) is a full replica with automatic replication and client-side failover.
      notes: Presets 02 and 03 run two clusters in different zones of us-central1; the dev preset runs one.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_protection
      evidence:
        type: spec_default
        reference: Defaults to true -- destroy fails until the flag is deliberately set false. force_destroy separately gates deletion while table backups exist.
      notes: Presets 02 and 03 keep it true; the dev preset opts out. deletion_policy PREVENT is a second wall for instances a data platform depends on.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Bigtable is a fully managed service -- Google applies all software and security patching invisibly; no version or maintenance surface exists on the spec.
