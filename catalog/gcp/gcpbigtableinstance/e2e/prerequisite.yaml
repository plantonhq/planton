# GcpBigtableInstance install profile used when the instance is an E2E
# PREREQUISITE for another component (the table chain). Minimal
# single-node cluster; the cloud-side names carry ${E2E_RUN_ID};
# metadata.name stays fixed — prerequisite FK resolution keys off it.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpBigtableInstance
metadata:
  name: planton-oss-e2e-gcpbt-prereq
  id: planton-oss-e2e-gcpbt-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpbigtableinstance
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  instanceName: e2e-btp-${E2E_RUN_ID}
  deletionProtection: false
  clusters:
    - clusterId: e2e-btpc-${E2E_RUN_ID}
      zone: us-central1-a
      numNodes: 1
      storageType: SSD
