# GcpBigtableInstance scenario: a minimal single-node SSD cluster.
# project_id is deliberately omitted: the instance rides the provider's
# default project, which the E2E harness exports as GOOGLE_PROJECT from
# the resolved test project. The cloud-side instance name carries
# ${E2E_RUN_ID}; deletion protection is explicitly disabled so the
# ephemeral create -> verify -> destroy cycle can tear down without a
# two-step disable. edition is armed EXPLICITLY at the provider's own
# default (ENTERPRISE) to prove the explicit-send round-trip — the
# canonical manifest carries the same arm but never runs live.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpBigtableInstance
metadata:
  name: planton-oss-e2e-gcpbt-smoke
  id: planton-oss-e2e-gcpbt-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpbigtableinstance
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  instanceName: e2e-bt-${E2E_RUN_ID}
  deletionProtection: false
  deletionPolicy: DELETE
  edition: ENTERPRISE
  clusters:
    - clusterId: e2e-btc-${E2E_RUN_ID}
      zone: us-central1-a
      numNodes: 1
      storageType: SSD
