# GcpBigtableInstance scenario: a cluster with CPU/storage-target
# autoscaling and user labels — exercises the autoscaling arm of the
# num_nodes-XOR-autoscaling oneof and the user-label merge.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpBigtableInstance
metadata:
  name: planton-oss-e2e-gcpbt-autoscale
  id: planton-oss-e2e-gcpbt-autoscale
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpbigtableinstance
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  instanceName: e2e-bta-${E2E_RUN_ID}
  displayName: E2E autoscaling instance
  deletionProtection: false
  deletionPolicy: DELETE
  labels:
    e2e-scenario: autoscaling
  clusters:
    - clusterId: e2e-btac-${E2E_RUN_ID}
      zone: us-central1-b
      storageType: SSD
      autoscalingConfig:
        minNodes: 1
        maxNodes: 2
        cpuTarget: 60
