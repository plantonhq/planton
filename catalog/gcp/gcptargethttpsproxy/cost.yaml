# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: gcptargethttpsproxy
spec:
  billing_model: free
  free_tier: "A target HTTPS proxy is a configuration object of Cloud Load Balancing with no meter of its own -- Google charges nothing to create or hold the proxy, and nothing extra for TLS termination, QUIC/HTTP-3 negotiation, or TLS 1.3 early data. The complete Cloud Load Balancing meter list on Google's network pricing page (forwarding rules, data processing, internal-ALB proxy instances, authorization policies, custom request headers, and self-managed-certificate connections) contains no charge for target proxies."
  notes: "No field of this spec bills directly, but the certificate wiring can pull in one usage meter: connections established using SELF-MANAGED certificates with RSA-3072 or RSA-4096 keys bill $0.45 per 1,000,000 (network pricing, SSL certificates section) -- Google-managed certificates and RSA-2048/ECDSA keys have no per-connection charge, so what ssl_certificates points at decides whether that meter exists. certificate_map traffic additionally rides Certificate Manager, which bills per certificate above its free allowance on the GcpCertManagerCert side. The dominant spend is the frontend itself: the forwarding rule pointing at this proxy bills per hour (first 5 rules $0.025/hour per project, each additional $0.01/hour) and every request and response byte bills as per-GiB inbound and outbound data processing -- both on the frontend kinds, never on the proxy. Backends bill as their own catalog kinds."
