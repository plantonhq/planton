apiVersion: gcp.planton.dev/v1alpha1
kind: GcpTargetHttpsProxy
metadata:
  name: mtls-frontend
spec:
  projectId:
    value: "<gcp-project-id>"
  description: Mutual-TLS frontend demanding client certificates via a server TLS policy
  urlMap:
    value: "<app-url-map-self-link>" # replace: the URL map routing to real backends
  sslCertificates:
    - value: "<managed-cert-self-link>" # replace: the server-side certificate
  serverTlsPolicy: "projects/<gcp-project-id>/locations/global/serverTlsPolicies/<policy-name>" # replace: an mTLS ServerTlsPolicy
  tlsEarlyData: DISABLED
