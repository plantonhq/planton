syntax = "proto3";

package dev.planton.gcp.gcptargethttpsproxy.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcptargethttpsproxy/v1alpha1/outputs.proto";
import "catalog/gcp/gcptargethttpsproxy/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-target-https-proxy
message GcpTargetHttpsProxy {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpTargetHttpsProxy'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpTargetHttpsProxySpec spec = 4 [(buf.validate.field).required = true];
  GcpTargetHttpsProxyStatus status = 5;
}

message GcpTargetHttpsProxyStatus {
  GcpTargetHttpsProxyOutputs outputs = 1;
}
