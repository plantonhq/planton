# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcptargethttpsproxy
spec:
  gcp:
    groups:
      - purpose: EnableComputeApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling compute.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageTargetHttpsProxy
        permissions:
          - compute.targetHttpsProxies.create
          - compute.targetHttpsProxies.get
          - compute.targetHttpsProxies.delete
          - compute.targetHttpsProxies.update
          - compute.targetHttpsProxies.setUrlMap
          - compute.targetHttpsProxies.setSslCertificates
          - compute.targetHttpsProxies.setSslPolicy
          - compute.targetHttpsProxies.setQuicOverride
          - compute.targetHttpsProxies.setCertificateMap
          - compute.globalOperations.get
        provenance: derived
        notes: Covers google_compute_target_https_proxy -- create, read/refresh, destroy, and polling the global operation every mutation returns. The provider mutates each in-place field through its dedicated RPC (setUrlMap, setSslCertificates, setSslPolicy, setQuicOverride, setCertificateMap), while server_tls_policy and certificate_manager_certificates changes PATCH the proxy, which authorizes as update.
      - purpose: ManageRegionalTargetHttpsProxy
        permissions:
          - compute.regionTargetHttpsProxies.create
          - compute.regionTargetHttpsProxies.get
          - compute.regionTargetHttpsProxies.delete
          - compute.regionTargetHttpsProxies.update
          - compute.regionTargetHttpsProxies.setUrlMap
          - compute.regionTargetHttpsProxies.setSslCertificates
          - compute.regionOperations.get
        provenance: derived
        condition:
          spec_field_set: region
        notes: Covers google_compute_region_target_https_proxy (created when spec.region is set). Regional proxies authorize against their own compute.regionTargetHttpsProxies family (no certificate-map or QUIC RPCs exist there) and return region operations the provider polls. Referenced regional certificates and SSL policies authorize with compute.regionSslCertificates.get and compute.regionSslPolicies.use on the referenced resources.
      - purpose: UseReferencedUrlMap
        permissions:
          - compute.urlMaps.use
        provenance: derived
        notes: Service-side check GCP's targetHttpsProxies.insert reference documents on the referenced urlMap -- always needed, since url_map is required.
      - purpose: UseReferencedSslCertificates
        permissions:
          - compute.sslCertificates.get
        provenance: derived
        condition:
          spec_field_set: ssl_certificates
        notes: Service-side check on each attached certificate. GCP defines NO compute.sslCertificates.use -- attaching authorizes with GET, verified against the testable-permissions inventory.
      - purpose: UseReferencedSslPolicy
        permissions:
          - compute.sslPolicies.use
        provenance: derived
        condition:
          spec_field_set: ssl_policy
        notes: Service-side check GCP's targetHttpsProxies.insert reference documents on the referenced SSL policy.
      - purpose: UseReferencedCertificateMap
        permissions:
          - certificatemanager.certmaps.use
        provenance: derived
        condition:
          spec_field_set: certificate_map
        notes: Service-side check GCP's targetHttpsProxies.insert reference documents on the referenced Certificate Manager map.
      - purpose: UseReferencedServerTlsPolicy
        permissions:
          - networksecurity.serverTlsPolicies.use
        provenance: derived
        condition:
          spec_field_set: server_tls_policy
        notes: Service-side check GCP's targetHttpsProxies.insert reference documents on the referenced server TLS policy (the mTLS lever).
