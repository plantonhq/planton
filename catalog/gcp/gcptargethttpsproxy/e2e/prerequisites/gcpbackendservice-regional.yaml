# Extra-instance GcpBackendService fixture: the REGIONAL backend service a
# regional load-balancer chain routes to (scheme EXTERNAL_MANAGED), with a regional
# health check. Declared through the consuming scenario's e2e-prerequisites
# annotation; the registry's standard backend prerequisite is global.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpBackendService
metadata:
  name: planton-oss-e2e-gcpthsp-rbs
  id: planton-oss-e2e-gcpthsp-rbs
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcptargethttpsproxy
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  description: Ephemeral regional backend service for the gcptargethttpsproxy regional E2E chain; safe to delete
  region: us-central1
  loadBalancingScheme: EXTERNAL_MANAGED
  protocol: HTTP
  healthCheck:
    valueFrom:
      kind: GcpHealthCheck
      name: planton-oss-e2e-gcpthsp-rhc
      fieldPath: status.outputs.self_link
  deletionPolicy: DELETE
