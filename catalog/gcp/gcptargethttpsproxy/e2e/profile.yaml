  # regional family with a regional self-managed certificate fixture over a
  # regional URL map chain; the classic scenarios re-prove the global arm
  # unchanged (offline plan equivalence already shows identical plans).
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 25
