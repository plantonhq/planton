apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcptargethttpsproxy
spec:
  # Composed scenario: the harness installs the GcpUrlMap prerequisite chain
  # (backend service + health check below it) and a GcpManagedSslCertificate
  # (with a ${E2E_RUN_ID} domain, PROVISIONING is expected), resolves the
  # proxy's url_map + ssl_certificates references, then runs deploy ->
  # compute targetHttpsProxies.get verify (incl. url-map and TLS wiring) ->
  # destroy -> verify 404, on both provisioners.
  #
  # Both arms are proven live on both engines. The regional scenario proves
  # google_compute_region_target_https_proxy (behind spec.region) with a
  # regional self-managed certificate fixture over a regional URL map chain;
  # the classic scenarios prove the global arm.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 25
