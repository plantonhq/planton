# Hardened-frontend GcpTargetHttpsProxy scenario: composes ALL four TLS-side
# prerequisites — routing (GcpUrlMap), a self-managed certificate
# (GcpSslCertificate, attached via an explicit valueFrom kind because the
# sslCertificates list defaults to the managed-certificate kind), and an SSL
# policy enforcing a TLS 1.2 / MODERN floor via the field's default kind.
# This is the full production TLS posture assembled live: certificate
# presented + handshake hardened, on one proxy. project_id is omitted and
# rides the harness-exported GOOGLE_PROJECT.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpTargetHttpsProxy
metadata:
  name: planton-oss-e2e-gcpthsp-hardened
  id: planton-oss-e2e-gcpthsp-hardened
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcptargethttpsproxy
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  description: Ephemeral hardened target HTTPS proxy created by the Planton E2E harness; safe to delete
  urlMap:
    valueFrom:
      kind: GcpUrlMap
      name: planton-oss-e2e-gcpum-prereq
      fieldPath: status.outputs.self_link
  sslCertificates:
    - valueFrom:
        kind: GcpSslCertificate
        name: planton-oss-e2e-gcpsslcert-prereq
        fieldPath: status.outputs.self_link
  sslPolicy:
    valueFrom:
      name: planton-oss-e2e-gcpsslpol-prereq
  quicOverride: NONE
  # Explicit DELETE keeps the destroy real and proves the no-op-diff
  # behavior of the new arm.
  deletionPolicy: DELETE
