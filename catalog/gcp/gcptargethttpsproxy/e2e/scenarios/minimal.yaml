# Minimal GcpTargetHttpsProxy scenario: a TLS frontend composing the
# GcpUrlMap and GcpManagedSslCertificate prerequisites (declared via
# prerequisites in the kind registry). The managed certificate stays
# PROVISIONING (no DNS) — attachment works regardless, which is exactly the
# real bring-up order. project_id is omitted and rides the harness-exported
# GOOGLE_PROJECT.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpTargetHttpsProxy
metadata:
  name: planton-oss-e2e-gcpthsp-smoke
  id: planton-oss-e2e-gcpthsp-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcptargethttpsproxy
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  description: Ephemeral target HTTPS proxy created by the Planton E2E harness; safe to delete
  urlMap:
    valueFrom:
      kind: GcpUrlMap
      name: planton-oss-e2e-gcpum-prereq
      fieldPath: status.outputs.self_link
  sslCertificates:
    - valueFrom:
        kind: GcpManagedSslCertificate
        name: planton-oss-e2e-gcpmssl-prereq
        fieldPath: status.outputs.self_link
  quicOverride: NONE
  # Explicit DELETE keeps the destroy real and proves the no-op-diff
  # behavior of the new arm.
  deletionPolicy: DELETE
