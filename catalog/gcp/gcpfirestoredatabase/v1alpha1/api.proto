syntax = "proto3";

package dev.planton.gcp.gcpfirestoredatabase.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpfirestoredatabase/v1alpha1/outputs.proto";
import "catalog/gcp/gcpfirestoredatabase/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-firestore-database
message GcpFirestoreDatabase {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpFirestoreDatabase'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpFirestoreDatabaseSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpFirestoreDatabaseStatus status = 5;
}

//gcp-firestore-database status
message GcpFirestoreDatabaseStatus {
  //outputs
  GcpFirestoreDatabaseOutputs outputs = 1;
}
