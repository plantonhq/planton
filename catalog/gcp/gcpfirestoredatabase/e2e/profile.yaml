apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpfirestoredatabase
spec:
  # Leaf scenarios: a named Native-mode database (minimal) plus the two
  # legal ENTERPRISE single-protocol postures -- MongoDB-dedicated
  # (enterprise) and Firestore-protocol-with-realtime (enterprise-realtime).
  # The API enforces that at most one data-access mode is enabled and that
  # realtime requires the Firestore mode explicitly ENABLED, so these two
  # scenarios cover the whole legal enterprise space. Delete protection is
  # disabled everywhere (E2E must destroy). Database names are
  # project-scoped and deleted names are reserved for a retention window,
  # so every cloud-side name carries ${E2E_RUN_ID}. Creates in ~1-2 minutes.
  #
  # Offline-proven-only arm (deferred): resource_manager_tags needs
  # pre-existing org-level tagKeys/tagValues the E2E project does not have.
  # Unblock: org tag fixtures.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
