# GcpFirestoreDatabase install profile for consumers (the
# GcpFirestoreBackupSchedule and GcpFirestoreIndex chains). A named
# Native-mode database; delete protection disabled so chain teardown
# can run. metadata.name stays fixed for FK resolution.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpFirestoreDatabase
metadata:
  name: planton-oss-e2e-gcpfsdb-prereq
  id: planton-oss-e2e-gcpfsdb-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpfirestoredatabase
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  databaseName: e2e-fsdb-${E2E_RUN_ID}
  locationId: nam5
  type: FIRESTORE_NATIVE
  deleteProtectionState: DELETE_PROTECTION_DISABLED
