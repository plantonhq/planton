# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcppscserviceattachment
spec:
  gcp:
    api_enabled_by:
      - GcpVpcNetwork
    groups:
      - purpose: ManageServiceAttachment
        permissions:
          - compute.serviceAttachments.create
          - compute.serviceAttachments.get
          - compute.serviceAttachments.update
          - compute.serviceAttachments.delete
          - compute.forwardingRules.get
          - compute.subnetworks.get
          - compute.subnetworks.use
          - compute.forwardingRules.use
          - compute.regionOperations.get
        provenance: derived
        reach: target
        privilege: ordinary
        notes: "Covers google_compute_service_attachment (Pulumi compute.ServiceAttachment): create on first apply, get on every refresh, update when the connection policy changes in place (connection_preference, accept and reject lists, reconcile_connections, enable_proxy_protocol, propagated_connection_limit, description), delete on destroy under deletion_policy DELETE (ABANDON and PREVENT call no delete API). Google validates the target forwarding rule and the NAT subnets at create, which reads them. roles/compute.networkAdmin contains all six. Google checks compute.subnetworks.use on each NAT subnet at create (measured live -- refused without it on both engines). Google checks compute.forwardingRules.use on the producer forwarding rule the attachment publishes (measured live -- refused without it on both engines). An in-place update returns a regional operation that Terraform polls with compute.regionOperations.get (measured live -- refused without it)."
