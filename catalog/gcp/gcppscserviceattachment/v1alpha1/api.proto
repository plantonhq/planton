syntax = "proto3";

package dev.planton.gcp.gcppscserviceattachment.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcppscserviceattachment/v1alpha1/outputs.proto";
import "catalog/gcp/gcppscserviceattachment/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-psc-service-attachment
message GcpPscServiceAttachment {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpPscServiceAttachment'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpPscServiceAttachmentSpec spec = 4 [(buf.validate.field).required = true];
  GcpPscServiceAttachmentStatus status = 5;
}

message GcpPscServiceAttachmentStatus {
  GcpPscServiceAttachmentStackOutputs outputs = 1;
}
