# Extra-instance GcpSubnetwork fixture: the PSC NAT subnet
# (purpose PRIVATE_SERVICE_CONNECT) consumer traffic is translated into.
# Google requires the purpose at creation and the subnet must sit in the
# producer VPC and the attachment's region.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSubnetwork
metadata:
  name: planton-oss-e2e-gcppsca-nat
  id: planton-oss-e2e-gcppsca-nat
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcppscserviceattachment
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  description: Ephemeral PSC NAT subnet for the gcppscserviceattachment E2E chain; safe to delete
  vpcSelfLink:
    valueFrom:
      kind: GcpVpcNetwork
      name: planton-oss-e2e-gcpvpcnetwork-prereq
      fieldPath: status.outputs.network_self_link
  subnetworkName: planton-oss-e2e-gcppsca-nat
  region: us-central1
  ipCidrRange: 10.131.1.0/24
  purpose: PRIVATE_SERVICE_CONNECT
  deletionPolicy: DELETE
