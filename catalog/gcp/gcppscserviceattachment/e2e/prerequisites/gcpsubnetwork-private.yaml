# Extra-instance GcpSubnetwork fixture: the private subnet the producer's
# internal passthrough load balancer draws its VIP from (the registry's
# prerequisite network is custom-mode, so a subnet is required).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSubnetwork
metadata:
  name: planton-oss-e2e-gcppsca-subnet
  id: planton-oss-e2e-gcppsca-subnet
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcppscserviceattachment
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  description: Ephemeral private subnet for the gcppscserviceattachment E2E chain; safe to delete
  vpcSelfLink:
    valueFrom:
      kind: GcpVpcNetwork
      name: planton-oss-e2e-gcpvpcnetwork-prereq
      fieldPath: status.outputs.network_self_link
  subnetworkName: planton-oss-e2e-gcppsca-subnet
  region: us-central1
  ipCidrRange: 10.131.0.0/24
  deletionPolicy: DELETE
