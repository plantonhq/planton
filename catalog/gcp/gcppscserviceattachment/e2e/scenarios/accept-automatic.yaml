# GcpPscServiceAttachment scenario: publish an internal passthrough Network
# Load Balancer to every consumer (ACCEPT_AUTOMATIC) through one PSC NAT
# subnet. The whole producer chain is declared here because a path-declared
# fixture's own annotation is never read: private subnet, PSC NAT subnet,
# regional TCP health check, INTERNAL backend service, INTERNAL forwarding
# rule, on the registry's prerequisite network.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpPscServiceAttachment
metadata:
  name: planton-oss-e2e-gcppsca-auto
  id: planton-oss-e2e-gcppsca-auto
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcppscserviceattachment
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "GcpVpcNetwork,catalog/gcp/gcppscserviceattachment/e2e/prerequisites/gcpsubnetwork-private.yaml,catalog/gcp/gcppscserviceattachment/e2e/prerequisites/gcpsubnetwork-psc-nat.yaml,catalog/gcp/gcppscserviceattachment/e2e/prerequisites/gcphealthcheck-regional-tcp.yaml,catalog/gcp/gcppscserviceattachment/e2e/prerequisites/gcpbackendservice-internal.yaml,catalog/gcp/gcppscserviceattachment/e2e/prerequisites/gcpglobalforwardingrule-internal.yaml"
  tags:
    - planton-e2e
spec:
  attachmentName: planton-oss-e2e-gcppsca-auto
  description: Ephemeral PSC service attachment created by the Planton E2E harness; safe to delete
  region: us-central1
  targetService:
    valueFrom:
      kind: GcpGlobalForwardingRule
      name: planton-oss-e2e-gcppsca-ilb
      fieldPath: status.outputs.self_link
  natSubnets:
    - valueFrom:
        kind: GcpSubnetwork
        name: planton-oss-e2e-gcppsca-nat
        fieldPath: status.outputs.subnetwork_self_link
  connectionPreference: ACCEPT_AUTOMATIC
  enableProxyProtocol: false
  deletionPolicy: DELETE
