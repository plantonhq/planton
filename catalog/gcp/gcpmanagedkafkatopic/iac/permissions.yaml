# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpmanagedkafkatopic
spec:
  gcp:
    groups:
      - purpose: ManageTopic
        permissions:
          - managedkafka.topics.create
          - managedkafka.topics.get
          - managedkafka.topics.update
          - managedkafka.topics.delete
        provenance: derived
        notes: Covers google_managed_kafka_topic (Pulumi managedkafka.Topic) -- created, patched (partition count and configs), read on every refresh, deleted. Names grounded in Google's Managed Kafka roles page; roles/managedkafka.admin contains all four.
