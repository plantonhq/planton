syntax = "proto3";

package dev.planton.gcp.gcpmanagedkafkatopic.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpmanagedkafkatopic/v1alpha1/outputs.proto";
import "catalog/gcp/gcpmanagedkafkatopic/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-managed-kafka-topic
message GcpManagedKafkaTopic {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpManagedKafkaTopic'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpManagedKafkaTopicSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpManagedKafkaTopicStatus status = 5;
}

//gcp-managed-kafka-topic status
message GcpManagedKafkaTopicStatus {
  //stack-outputs
  GcpManagedKafkaTopicStackOutputs outputs = 1;
}
