# The second act of minimal.yaml: the same topic with a retention config
# set, a patch in place. Not a scenario of its own.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpManagedKafkaTopic
metadata:
  name: planton-oss-e2e-gcpktpc-smoke
  id: planton-oss-e2e-gcpktpc-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpmanagedkafkatopic
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-second-act: minimal.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
  tags:
    - planton-e2e
spec:
  location: us-central1
  cluster:
    valueFrom:
      kind: GcpManagedKafkaCluster
      name: planton-oss-e2e-gcpktpc-kafka
      fieldPath: status.outputs.name
  topicId: e2e-orders-${E2E_RUN_ID}
  partitionCount: 3
  replicationFactor: 3
  configs:
    retention.ms: "86400000"
  deletionPolicy: DELETE
