apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpmanagedkafkatopic
spec:
  # Proven live on both engines (2026-11-21), as an identity holding only this
  # kind's permissions manifest: a three-partition topic and a compacted
  # six-partition topic with configs, each on a run-scoped Kafka cluster
  # fixture, deployed, re-planned clean, and destroyed; a retention config
  # added in place (ManagedKafka.UpdateTopic), judged from Google's Admin
  # Activity log. Topic creates accept the bare cluster id both modules derive
  # from the cluster reference.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 120
