# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_vertex_ai_feature_online_store:
    mappings:
      - spec: spec.project_id
        arg: project
      # The provider names the axis `region`; every Vertex kind names it
      # `location`.
      - spec: spec.location
        arg: region
      # The provider's `name` is the store's id.
      - spec: spec.feature_online_store_id
        arg: name
      - spec: spec.kms_key_name
        arg: encryption_spec.kms_key_name
  # The feature views are folded: they belong to exactly one store and
  # nothing else in the catalog references a view.
  google_vertex_ai_feature_online_store_featureview:
    specRoot: spec.feature_views
    mappings:
      - spec: spec.project_id
        arg: project
      # Derived from the parent: the store's location and id, never
      # declared twice.
      - spec: spec.location
        arg: region
      - spec: spec.feature_online_store_id
        arg: feature_online_store
      - spec: spec.deletion_policy
        arg: deletion_policy
      - spec: spec.feature_views.feature_view_id
        arg: name
  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables the owning API so a
      fresh project works on the first deploy; not a knob of the kind.

specExclusions:
  - field: spec.optimized
    reason: >-
      the provider expresses Optimized storage as an EMPTY marker block
      (optimized {}) with no settings of its own, exclusive with the
      configured bigtable block; the spec carries it as a presence bool and
      the modules emit the marker block from it (the established
      marker-block judgment)
