apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVertexAiFeatureOnlineStore
metadata:
  name: serving-store
spec:
  projectId:
    value: my-gcp-project
  location: us-central1
  # Lowercase letters, digits, and underscores -- Google's rule for online
  # store and feature view ids.
  featureOnlineStoreId: serving_store
  labels:
    team: ml
  # Exactly one storage kind. A new store uses a managed Bigtable instance
  # (autoscaling); Google no longer creates Optimized stores, so
  # optimized: true describes one that already exists.
  bigtable:
    autoScaling:
      minNodeCount: 1
      maxNodeCount: 3
  featureViews:
    - featureViewId: customer_view
      featureRegistrySource:
        featureGroups:
          - featureGroupId:
              value: customer_features
            featureIds:
              - age
              - lifetime_value
      syncConfig:
        cron: "0 */6 * * *"
  deletionPolicy: DELETE
