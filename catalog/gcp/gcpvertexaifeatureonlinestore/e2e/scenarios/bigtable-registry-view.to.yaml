# The second act of bigtable-registry-view.yaml: the same Bigtable store
# and feature view with the store's e2e-act label changed from first to
# second -- a featureOnlineStores.patch with the labels mask that changes it
# in place (its id, location and storage type recreate it). Not a scenario
# of its own (the second-act annotation keeps discovery from running it as
# a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVertexAiFeatureOnlineStore
metadata:
  name: planton-oss-e2e-gcpvfos-bigtable
  id: planton-oss-e2e-gcpvfos-bigtable
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpvertexaifeatureonlinestore
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-prerequisites: "catalog/gcp/gcpvertexaifeatureonlinestore/e2e/prerequisites/gcpbigquerytable-features.yaml,catalog/gcp/gcpvertexaifeatureonlinestore/e2e/prerequisites/gcpvertexaifeaturegroup-customers.yaml"
    planton.dev/e2e-second-act: bigtable-registry-view.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
  tags:
    - planton-e2e
spec:
  location: us-central1
  featureOnlineStoreId: pln_e2e_vfos_bt_${E2E_RUN_ID_UNDERSCORE}
  bigtable:
    autoScaling:
      minNodeCount: 1
      maxNodeCount: 2
  labels:
    e2e-act: second
  featureViews:
    - featureViewId: customer_view
      labels:
        tier: e2e
      featureRegistrySource:
        featureGroups:
          - featureGroupId:
              valueFrom:
                kind: GcpVertexAiFeatureGroup
                name: planton-oss-e2e-gcpvfos-group
                fieldPath: status.outputs.feature_group_id
            featureIds:
              - age
              - lifetime_value
      syncConfig:
        cron: "0 */6 * * *"
  deletionPolicy: DELETE
