# The second act of optimized-minimal.yaml: the same Optimized store with its
# e2e-act label changed from first to second -- a featureOnlineStores.patch
# with the labels mask that changes it in place (its id, location and
# storage type recreate it). Not a scenario of its own (the second-act
# annotation keeps discovery from running it as a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVertexAiFeatureOnlineStore
metadata:
  name: planton-oss-e2e-gcpvfos-optimized
  id: planton-oss-e2e-gcpvfos-optimized
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpvertexaifeatureonlinestore
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-second-act: optimized-minimal.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
  tags:
    - planton-e2e
spec:
  location: us-central1
  featureOnlineStoreId: pln_e2e_vfos_opt_${E2E_RUN_ID_UNDERSCORE}
  optimized: true
  labels:
    e2e-act: second
