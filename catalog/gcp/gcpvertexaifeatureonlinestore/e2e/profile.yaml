apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpvertexaifeatureonlinestore
spec:
  # Proven live on both engines (2026-11-20) on Bigtable serving: a one-node
  # autoscaling store serving one feature view over a BigQuery table and
  # feature group, deployed, relabeled in place (UpdateFeatureOnlineStore in
  # Google's audit log) and destroyed by an identity holding only this kind's
  # permissions manifest, with the re-plan clean. Google refuses new stores
  # with Optimized serving ("Creating FeatureOnlineStore with Optimized
  # serving is no longer supported", measured 2026-11-20), so the kind is
  # proven on Bigtable; the optimized flag manages stores that already exist.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 45
