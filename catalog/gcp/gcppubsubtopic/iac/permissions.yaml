# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcppubsubtopic
spec:
  gcp:
    groups:
      - purpose: EnablePubSubApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling pubsub.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageTopic
        permissions:
          - pubsub.topics.create
          - pubsub.topics.get
          - pubsub.topics.update
          - pubsub.topics.delete
        provenance: derived
        notes: Covers google_pubsub_topic -- create, read/refresh, in-place updates (CMEK key, retention, storage policy, schema settings, ingestion, transforms, labels are all mutable; topic_name and project changes replace), and destroy. Two runtime prerequisites are NOT deployer permissions and are granted to Google's own agents instead -- for CMEK the Pub/Sub service agent needs roles/cloudkms.cryptoKeyEncrypterDecrypter on the referenced key, and for ingestion the configured gcp_service_account needs its source-side access (e.g. read on the Cloud Storage bucket) -- or publishes and ingestion fail after a successful deploy.
      - purpose: AttachSchema
        permissions:
          - pubsub.schemas.attach
        provenance: derived
        notes: Required only when schema_settings references a schema -- attaching a schema for publish-time validation is authorized on the schema side by pubsub.schemas.attach on the referenced schema (which may live in another project). Not needed for topics without schema validation.
      - purpose: ApplyResourceManagerTags
        permissions:
          - pubsub.topics.createTagBinding
          - resourcemanager.tagValueBindings.create
        provenance: derived
        notes: Required only when resource_manager_tags is set -- attaching a tag at create time authorizes on both sides, the binding on the topic and the use of each named tag value (tag values are org-level resources, so the tagValueBindings grant lives there). Tags bind at create time only; a tag change replaces the topic and detaches every subscription, re-running these checks. Not needed for untagged topics.
