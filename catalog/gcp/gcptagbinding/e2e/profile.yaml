apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcptagbinding
spec:
  # Proven live on both engines (2026-11-18) on the PROJECT arm, both
  # scenarios deployed and destroyed by an identity holding only this kind's
  # permissions manifest (a binding has no in-place update: any change
  # replaces it). Measured: the empty parent and the project ID literal both
  # resolve the project NUMBER and re-plan clean; the binding, value and key
  # are destroyed in that order; the provider's `name` attribute arrives
  # without the tagBindings/ prefix its documentation shows, so both modules
  # put it back. The folder, organization and location-scoped arms stay
  # offline-only until an organization-scoped test identity and a regional
  # fixture exist.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
