syntax = "proto3";

package dev.planton.gcp.gcptagbinding.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcptagbinding/v1alpha1/outputs.proto";
import "catalog/gcp/gcptagbinding/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-tag-binding
message GcpTagBinding {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpTagBinding'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpTagBindingSpec spec = 4 [(buf.validate.field).required = true];
  GcpTagBindingStatus status = 5;
}

message GcpTagBindingStatus {
  GcpTagBindingStackOutputs outputs = 1;
}
