# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `proven`: a live run under an identity holding only these
# entries (each note says what the run showed). Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcptagbinding
spec:
  gcp:
    groups:
      - purpose: BindTagValue
        permissions:
          - resourcemanager.tagValueBindings.create
          - resourcemanager.tagValueBindings.delete
          - resourcemanager.hierarchyNodes.createTagBinding
          - resourcemanager.hierarchyNodes.deleteTagBinding
          - resourcemanager.hierarchyNodes.listTagBindings
        provenance: proven
        reach: target
        privilege: ordinary
        notes: "Covers google_tags_tag_binding and google_tags_location_tag_binding (Pulumi tags.TagBinding / tags.LocationTagBinding) -- exactly one per instance, selected by spec.location. Google authorizes a binding with resourcemanager.tagValueBindings.create (and .delete on destroy) on the tag value, or inherited from its key, which roles/resourcemanager.tagUser carries; GCP defines no tagValues.use permission. create on first apply, list-by-parent on refresh and import, delete on destroy under deletion_policy DELETE (ABANDON and PREVENT call no delete API); a binding has no update -- every change recreates it. Proven 2026-11-18 -- an identity holding only this manifest deployed and destroyed the kind on both engines (a binding has no in-place update)."
      - purpose: TagTheResource
        permissions:
          - resourcemanager.projects.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: "Google also requires roles/resourcemanager.tagUser (or the equivalent tag-binding permission the tagged service defines, e.g. compute.instances.createTagBinding) on the RESOURCE being tagged (for a project, folder, or organization: resourcemanager.hierarchyNodes.createTagBinding, deleteTagBinding, and listTagBindings, which the refresh's list-by-parent reads). For a project parent that is tagUser on the project. projects.get is additionally needed when the manifest names the project by ID or names no parent at all: both modules read the project once to resolve its NUMBER (data.google_project on Terraform, organizations.LookupProject on Pulumi); a GcpProject reference or a numeric literal performs no read. Proven 2026-11-18 -- an identity holding only this manifest deployed and destroyed the kind on both engines (a binding has no in-place update)."
      - purpose: BindTagOnFolder
        permissions:
          - resourcemanager.tagValueBindings.create
          - resourcemanager.tagValueBindings.delete
          - resourcemanager.hierarchyNodes.createTagBinding
          - resourcemanager.hierarchyNodes.deleteTagBinding
          - resourcemanager.hierarchyNodes.listTagBindings
        provenance: derived
        reach: organization
        privilege: ordinary
        condition:
          spec_field_set: parent.folder_id
        notes: "The folder-parented shape of BindTagValue: Google checks the hierarchyNodes binding permissions on the folder being tagged and tagValueBindings on the tag value, and only an organization-owned value can be bound to a folder -- both checks sit above the project (roles/resourcemanager.tagUser on the organization, or on the value and the folder)."
      - purpose: BindTagOnOrganization
        permissions:
          - resourcemanager.tagValueBindings.create
          - resourcemanager.tagValueBindings.delete
          - resourcemanager.hierarchyNodes.createTagBinding
          - resourcemanager.hierarchyNodes.deleteTagBinding
          - resourcemanager.hierarchyNodes.listTagBindings
        provenance: derived
        reach: organization
        privilege: ordinary
        condition:
          spec_field_set: parent.organization_id
        notes: "The organization-parented shape of BindTagValue: Google checks the hierarchyNodes binding permissions on the organization being tagged and tagValueBindings on the organization-owned tag value -- both on the organization (roles/resourcemanager.tagUser there carries them)."
