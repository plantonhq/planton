syntax = "proto3";

package dev.planton.gcp.gcpprivatecapool.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpprivatecapool/v1alpha1/outputs.proto";
import "catalog/gcp/gcpprivatecapool/v1alpha1/spec.proto";
import "shared/metadata.proto";

//GcpPrivateCaPool
message GcpPrivateCaPool {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpPrivateCaPool'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpPrivateCaPoolSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpPrivateCaPoolStatus status = 5;
}

//GcpPrivateCaPool status
message GcpPrivateCaPoolStatus {
  //stack-outputs
  GcpPrivateCaPoolStackOutputs outputs = 1;
}
