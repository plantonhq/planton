# The second act of enterprise-policy.yaml: the same Enterprise pool now
# publishing CRLs beside its CA certificates -- a caPools.patch with the
# publishingOptions mask that changes it in place (its id, location and tier
# recreate it). Not a scenario of its own (the second-act annotation keeps
# discovery from running it as a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpPrivateCaPool
metadata:
  name: planton-oss-e2e-gcppca-enterprise
  id: planton-oss-e2e-gcppca-enterprise
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpprivatecapool
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-second-act: enterprise-policy.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
  tags:
    - planton-e2e
spec:
  location: us-central1
  caPoolId: e2e-gcppca-ent-${E2E_RUN_ID}
  tier: ENTERPRISE
  publishingOptions:
    publishCaCert: true
    publishCrl: true
  issuancePolicy:
    maximumLifetime: 2592000s
    backdateDuration: 600s
    allowedKeyTypes:
      - ellipticCurveSignatureAlgorithm: ECDSA_P384
      - rsa:
          minModulusSize: 2048
    allowedIssuanceModes:
      allowCsrBasedIssuance: true
      allowConfigBasedIssuance: false
    identityConstraints:
      allowSubjectPassthrough: false
      allowSubjectAltNamesPassthrough: true
      celExpression:
        title: E2E names
        expression: subject_alt_names.all(san, san.type == DNS && san.value.endsWith(".e2e.example.com"))
    baselineValues:
      caOptions:
        isCa: false
      keyUsage:
        baseKeyUsage:
          digitalSignature: true
        extendedKeyUsage:
          clientAuth: true
      policyIds:
        - objectIdPath: [2, 23, 140, 1, 2, 1]
  labels:
    e2e-arm: enterprise-policy
  deletionPolicy: DELETE
