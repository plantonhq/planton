apiVersion: gcp.planton.dev/v1alpha1
kind: GcpPrivateCaPool
metadata:
  name: internal-tls
spec:
  projectId:
    value: my-gcp-project
  location: us-central1
  tier: ENTERPRISE
  publishingOptions:
    publishCaCert: true
    publishCrl: true
    encodingFormat: PEM
  issuancePolicy:
    maximumLifetime: 7776000s
    allowedKeyTypes:
      - ellipticCurveSignatureAlgorithm: ECDSA_P256
      - rsa:
          minModulusSize: 2048
          maxModulusSize: 4096
    allowedIssuanceModes:
      allowCsrBasedIssuance: true
      allowConfigBasedIssuance: true
    identityConstraints:
      allowSubjectPassthrough: true
      allowSubjectAltNamesPassthrough: true
      celExpression:
        title: Internal names
        expression: subject_alt_names.all(san, san.type == DNS && san.value.endsWith(".internal.example.com"))
    baselineValues:
      caOptions:
        isCa: false
      keyUsage:
        baseKeyUsage:
          digitalSignature: true
          keyEncipherment: true
        extendedKeyUsage:
          serverAuth: true
          clientAuth: true
  labels:
    team: platform
  deletionPolicy: DELETE
