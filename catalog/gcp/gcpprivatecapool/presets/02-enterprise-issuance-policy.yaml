apiVersion: gcp.planton.dev/v1alpha1
kind: GcpPrivateCaPool
metadata:
  name: internal-servers
spec:
  location: us-central1
  tier: ENTERPRISE
  kmsKeyName:
    valueFrom:
      kind: GcpKmsKey
      name: pki-at-rest
      fieldPath: status.outputs.key_id
  publishingOptions:
    publishCaCert: true
    publishCrl: true
  issuancePolicy:
    maximumLifetime: 31536000s
    allowedKeyTypes:
      - rsa:
          minModulusSize: 2048
      - ellipticCurveSignatureAlgorithm: ECDSA_P256
    allowedIssuanceModes:
      allowCsrBasedIssuance: true
      allowConfigBasedIssuance: true
    identityConstraints:
      allowSubjectPassthrough: true
      allowSubjectAltNamesPassthrough: true
      celExpression:
        title: Internal DNS only
        expression: subject_alt_names.all(san, san.type == DNS && san.value.endsWith(".internal.example.com"))
    baselineValues:
      caOptions:
        isCa: false
      keyUsage:
        baseKeyUsage:
          digitalSignature: true
          keyEncipherment: true
        extendedKeyUsage:
          serverAuth: true
