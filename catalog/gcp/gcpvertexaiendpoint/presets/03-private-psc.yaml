apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVertexAiEndpoint
metadata:
  name: partner-inference
spec:
  location: us-central1
  displayName: Partner Inference
  description: PSC-exposed endpoint with IAM-authorized connections and a consumer allowlist
  labels:
    team: ml-platform
  # Private Service Connect: consumers reach the endpoint through a PSC
  # service attachment — no VPC peering, per-project access control.
  privateServiceConnectConfig:
    projectAllowlist:
      - consumer-analytics-prod
      - consumer-reporting-prod
  kmsKeyName:
    valueFrom:
      kind: GcpKmsKey
      name: inference-key
      fieldPath: status.outputs.key_id
