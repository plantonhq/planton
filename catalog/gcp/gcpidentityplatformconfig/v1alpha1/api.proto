syntax = "proto3";

package dev.planton.gcp.gcpidentityplatformconfig.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpidentityplatformconfig/v1alpha1/outputs.proto";
import "catalog/gcp/gcpidentityplatformconfig/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-identity-platform-config
message GcpIdentityPlatformConfig {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpIdentityPlatformConfig'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpIdentityPlatformConfigSpec spec = 4 [(buf.validate.field).required = true];
  GcpIdentityPlatformConfigStatus status = 5;
}

message GcpIdentityPlatformConfigStatus {
  GcpIdentityPlatformConfigOutputs outputs = 1;
}
