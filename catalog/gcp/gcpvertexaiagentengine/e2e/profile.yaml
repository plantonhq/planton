apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpvertexaiagentengine
spec:
  # Proven live on both engines (2026-11-21), as an identity holding only this
  # kind's permissions manifest: the smallest ADK agent built from its inline
  # source by Vertex AI's Python build, and the same agent running as a
  # prerequisite service account with a secret env var from a run-scoped
  # Secret Manager secret, instance bounds, resource limits and a Memory Bank,
  # deployed, re-planned clean, and destroyed; the minimal agent's description
  # changed in place (UpdateReasoningEngine), judged from Google's Admin
  # Activity log. Agent Engine serves the entrypoint object through its query
  # methods, so the ADK agent is wrapped as an AdkApp; Memory Bank refuses
  # Gemini 2.5 models. The stored-secret groups stay derived: no scenario
  # stores a secret value.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 45
