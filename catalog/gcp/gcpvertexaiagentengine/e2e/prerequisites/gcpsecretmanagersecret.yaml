# Consumer-scoped GcpSecretManagerSecret install profile for the agent's
# memory-bank-secrets scenario: the secret the agent reads as an env var,
# readable by the prerequisite service account the agent runs as. The
# secret id carries the run id; metadata.name stays the one the scenario
# references.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSecretManagerSecret
metadata:
  name: planton-oss-e2e-gcpsecret-smoke
  id: planton-oss-e2e-gcpsecret-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpsecretmanagersecret
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  secretId: e2e-agent-secret-${E2E_RUN_ID}
  initialVersion:
    data:
      value: planton-e2e-smoke-payload
  iamMembers:
    - role: roles/secretmanager.secretAccessor
      member:
        valueFrom:
          kind: GcpServiceAccount
          name: planton-oss-e2e-gsa-prereq
          fieldPath: status.outputs.member
