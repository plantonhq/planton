# GcpVertexAiAgentEngine scenario: the same inline-source agent with a
# Memory Bank (generation and embedding models, a generation trigger, a
# TTL, a managed and a custom topic, one worked example), a secret env var
# from the registry's prerequisite Secret Manager secret, instance bounds,
# resource limits, and an explicit SERVICE_ACCOUNT identity on the
# registry-installed prerequisite service account. Both prerequisites are
# declared by kind, so the harness installs each from its standard profile.
# The memory bank itself costs nothing until memories are generated; the
# two publisher models are the project's own Gemini and embedding models
# in the agent's location, named through the harness's project export.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVertexAiAgentEngine
metadata:
  name: planton-oss-e2e-gcpagent-memory
  id: planton-oss-e2e-gcpagent-memory
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpvertexaiagentengine
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "GcpServiceAccount,GcpSecretManagerSecret"
  tags:
    - planton-e2e
spec:
  location: us-central1
  displayName: Memory agent
  description: An ADK agent that remembers across sessions
  labels:
    team: support
  spec:
    agentFramework: google-adk
    identityType: SERVICE_ACCOUNT
    serviceAccount:
      valueFrom:
        kind: GcpServiceAccount
        name: planton-oss-e2e-gsa-prereq
        fieldPath: status.outputs.email
    sourceCodeSpec:
      inlineSource:
        sourceArchive: 
      pythonSpec:
        version: "3.12"
        entrypointModule: agent
        entrypointObject: root_agent
        requirementsFile: requirements.txt
    deploymentSpec:
      minInstances: 0
      maxInstances: 3
      containerConcurrency: 9
      resourceLimits:
        cpu: "2"
        memory: 4Gi
      env:
        - name: LOG_LEVEL
          value: debug
      secretEnv:
        - name: API_TOKEN
          secretRef:
            secret:
              valueFrom:
                kind: GcpSecretManagerSecret
                name: planton-oss-e2e-gcpsecret-smoke
                fieldPath: status.outputs.secret_id
            version: latest
  contextSpec:
    memoryBankConfig:
      generationConfig:
        model: projects/${E2E_ENV:PLANTON_E2E_GCP_PROJECT_ID}/locations/us-central1/publishers/google/models/gemini-2.5-flash
        generationTriggerConfig:
          generationRule:
            eventCount: 5
            overlapEventCount: 1
      similaritySearchConfig:
        embeddingModel: projects/${E2E_ENV:PLANTON_E2E_GCP_PROJECT_ID}/locations/us-central1/publishers/google/models/text-embedding-005
      ttlConfig:
        defaultTtl: 7776000s
        memoryRevisionDefaultTtl: 604800s
      customizationConfigs:
        - scopeKeys:
            - user_id
          memoryTopics:
            - managedMemoryTopic:
                managedTopicEnum: USER_PREFERENCES
            - customMemoryTopic:
                label: billing
                description: Anything about invoices or payment methods
          generateMemoriesExamples:
            - conversationSource:
                events:
                  - content:
                      role: user
                      parts:
                        - text: I prefer email over phone calls.
                  - content:
                      role: model
                      parts:
                        - text: Noted -- email it is.
              generatedMemories:
                - fact: The user prefers email over phone calls.
                  topics:
                    - managedMemoryTopic: USER_PREFERENCES
          enableThirdPersonMemories: true
