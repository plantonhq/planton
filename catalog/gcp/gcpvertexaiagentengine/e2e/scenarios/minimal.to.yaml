# The second act of minimal.yaml: the same agent engine with a description,
# a patch in place (its location and source recreate it). Not a scenario of
# its own (the second-act annotation keeps discovery from running it as a
# lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVertexAiAgentEngine
metadata:
  name: planton-oss-e2e-gcpagent-minimal
  id: planton-oss-e2e-gcpagent-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpvertexaiagentengine
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-second-act: minimal.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
  tags:
    - planton-e2e
spec:
  location: us-central1
  description: Planton E2E minimal agent, updated in place
  displayName: planton-oss-e2e-gcpage-minimal-${E2E_RUN_ID} # names this lane's engine in the project's list
  agent:
    agentFramework: google-adk
    sourceCodeSpec:
      inlineSource:
        sourceArchive: 
      pythonSpec:
        version: "3.12"
        entrypointModule: agent
        entrypointObject: app
