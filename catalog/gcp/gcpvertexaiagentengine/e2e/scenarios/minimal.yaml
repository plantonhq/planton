# GcpVertexAiAgentEngine scenario: the smallest ADK agent built from an
# inline source archive -- the shape Google's own provider test deploys.
# The archive is the base64 .tar.gz of e2e/fixtures/agent-source/ (agent.py
# and requirements.txt; the rebuild command is in agent.py's docstring).
# project_id is deliberately omitted: the agent rides the provider's
# default project, which the harness exports as GOOGLE_PROJECT. The build
# runs as a Cloud Build in that project; expect ten to fifteen minutes.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVertexAiAgentEngine
metadata:
  name: planton-oss-e2e-gcpagent-minimal
  id: planton-oss-e2e-gcpagent-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpvertexaiagentengine
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  location: us-central1
  spec:
    agentFramework: google-adk
    sourceCodeSpec:
      inlineSource:
        sourceArchive: 
      pythonSpec:
        version: "3.12"
        entrypointModule: agent
        entrypointObject: root_agent
