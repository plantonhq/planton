# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpurlmap
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The URL map stores no customer data -- it is a routing table, configuration metadata Google holds on its own encrypted control plane.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest exists to key (see enc-at-rest); the resource exposes no Cloud KMS surface.
    - control_id: enc-in-transit
      status: configurable
      field_path: default_url_redirect.https_redirect
      evidence:
        type: spec_default
        reference: Default false; true makes the map answer plaintext requests with a redirect whose scheme is https -- the standard http-to-https upgrade, expressed as a redirect-only URL map behind a GcpTargetHttpProxy.
      notes: The URL map is where the http-to-https upgrade is written, not where TLS happens -- termination is the GcpTargetHttpsProxy's job. Preset 03 uses redirects for apex-to-www; the redirect-only https upgrade map is the documented companion to the HTTPS frontend.
    - control_id: no-public-access
      status: not_applicable
      notes: The map has no network endpoint; whether the frontend consulting it is internet-facing is decided by the forwarding rule, two hops upstream.
    - control_id: restricted-ingress
      status: not_applicable
      notes: "Host and path matching decides WHERE requests go, never WHO may send them -- an unmatched host still receives the map's default target. Source restriction lives in Cloud Armor policies and firewall rules."
    - control_id: edge-protection
      status: not_applicable
      notes: "Routing is not request filtering: rewrites, redirects, fault injection, and custom error pages transform traffic but block nothing by security policy. The WAF (Cloud Armor) attaches to the backend services this map routes to -- the map's role is deciding which (Cloud Armor-protected) backend service each request reaches."
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Management access is governed by Compute Engine IAM (the compute.urlMaps permission family, plus compute.backendServices.use / compute.backendBuckets.use on every referenced target) on every project; the resource has no data plane to govern separately.
    - control_id: workload-identity
      status: not_applicable
      notes: Nothing authenticates to cloud APIs through a URL map; it carries no credential surface.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The map carries no authentication paths to disable; TLS floors belong to GcpSslPolicy and client authentication to the HTTPS proxy's server TLS policy.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: URL map create, update, and delete land in Cloud Audit Logs (Admin Activity) unconditionally; Admin Activity logging cannot be disabled.
      notes: The spec's routing tests add pre-change safety on top -- GCP refuses an update whose asserted host/path resolutions fail.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: External Application Load Balancer request metrics in Cloud Monitoring are keyed by this URL map's name (the load balancer monitored resources carry a url_map_name label), so every request the map routes is measurable without configuration.
      notes: Per-request logs are a backend-service choice (log_config there), not a URL map field.
    - control_id: backup-recovery
      status: not_applicable
      notes: The map is declarative configuration fully re-creatable from source control; there is no data to back up or restore.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: No zonal placement exists to configure -- a global URL map is evaluated by Google's global frontend fabric and a regional one (region set) by the region's Envoy-based frontend spread across its zones; availability is the platform's, not a spec choice.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Empty defaults to DELETE; PREVENT fails the destroy outright, and ABANDON removes the map from management while it keeps serving. This guard is engine-side only -- the field is never sent to the GCP API.
      notes: GCP independently refuses to delete a URL map still referenced by a target proxy, so the routing table cannot vanish out from under a live frontend.
    - control_id: managed-patching
      status: not_applicable
      notes: There is no software surface here to patch; the fabric that evaluates the routing table is Google's own frontend infrastructure, patched as part of the platform with no version or channel exposed on this resource.
