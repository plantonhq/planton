# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: gcpurlmap
spec:
  billing_model: free
  free_tier: "A URL map is the routing table of Cloud Load Balancing and carries no meter of its own -- Google charges nothing for the map, its host rules, path matchers, route rules, rewrites, redirects, weighted splits, or routing tests, at any size. The complete Cloud Load Balancing meter list on Google's network pricing page (forwarding rules, data processing, internal-ALB proxy instances, authorization policies, custom request headers, and self-managed-certificate connections) contains no charge for the URL map resource."
  notes: "One conditional meter can be triggered from this spec: the custom-request-headers feature bills $0.75 per 1,000,000 HTTP(S) requests (capped at the first 666,666,667 requests per month per account) when the backend service serving the request has NO Cloud Armor policy -- and Google states the charge applies whether the headers are configured on a backend service or a URL map, so header_action fields here can start that meter. With a Cloud Armor policy on the backend service the feature is free. Everything else routes spend rather than creating it: cache_policy shapes Cloud CDN charges that bill on CDN-enabled backends, request_mirror_policy doubles the request load the mirror backend must be sized (and billed) for, and weighted splits move traffic between backends that each bill as their own kinds. The frontend spend -- forwarding rule hours (first 5 rules $0.025/hour per project, each additional $0.01/hour) and per-GiB inbound/outbound data processing on every request the map routes, redirects included -- lives on the frontend kinds, never on the map."
