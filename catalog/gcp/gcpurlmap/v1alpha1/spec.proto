syntax = "proto3";

package dev.planton.gcp.gcpurlmap.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";

// GcpUrlMapSpec defines a Compute Engine URL map — the L7 routing brain of an
// Application Load Balancer (and of Traffic Director meshes). A URL map
// matches each request's host and path and decides what happens: send it to
// a backend service or backend bucket, split it across weighted backends,
// rewrite or redirect it, inject faults, or return a custom error page.
//
// Routing is evaluated in this order:
//   1. host_rules match the request Host header to a named path_matcher.
//   2. Within that path_matcher, route_rules (priority-ordered, with rich
//      header/query/path matching) are tried first, then path_rules (longest
//      prefix), then the path_matcher's own default.
//   3. If no host_rule matches, the URL map's top-level default applies.
//
// At every level the "what to do" is exactly one of: a service (backend
// service or bucket), a url_redirect, or a route_action (which can weight
// across backends and rewrite/retry/mirror). Target proxies reference this URL
// map; forwarding rules and addresses sit in front of the proxy.
//
// One kind, two scopes. With region empty the map is GLOBAL (the global
// external ALB, the cross-region internal ALB, Traffic Director); with region
// set it is REGIONAL (the regional external ALB and the regional internal
// ALB), routing only to regional backend services in that region. The two
// scopes share the whole routing surface except Cloud CDN route caching,
// custom error pages, stream-duration limits, and header-driven routing
// tests, which exist only on the global map (and are rejected when region is
// set); the regional map alone honors a path_template_rewrite in a path
// matcher's default route action. A URL map cannot move between scopes.
message GcpUrlMapSpec {
  // The GCP project that owns the URL map.
  // Can be a literal project ID or a reference to a GcpProject resource.
  // If omitted, the provider's default project is used.
  // Immutable: changing it destroys and recreates the URL map.
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];

  // Name of the URL map in GCP. Must be 1-63 characters: lowercase letters,
  // digits, and hyphens; must start with a letter and end with a letter or
  // digit. If not specified, defaults to metadata.name.
  // Immutable: changing it destroys and recreates the URL map, briefly
  // breaking every target proxy that references the old self_link.
  string url_map_name = 2 [(buf.validate.field).cel = {
    id: "valid_url_map_name"
    message: "url_map_name must be RFC1035-compliant: 1-63 lowercase letters, digits, or hyphens; must start with a letter and end with a letter or digit"
    expression: "this == '' || this.matches('^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$')"
  }];

  // What this URL map fronts and how it routes — write it for the operator
  // reading a routing incident later. Mutable.
  string description = 3 [(buf.validate.field).string.max_len = 2048];

  // The scope selector. Empty builds a GLOBAL URL map (the global external
  // ALB, the cross-region internal ALB, Traffic Director); a region name
  // such as us-central1 builds a REGIONAL one (the regional external ALB and
  // the regional internal ALB). A regional map routes only to regional
  // backend services in its own region — never to a backend bucket, which
  // is a global-only resource — and is referenced only by regional target
  // proxies. Cloud CDN route caching (cache_policy), custom error pages
  // (custom_error_response_policy), max_stream_duration, and the
  // header-driven routing-test fields exist only on the global map and are
  // rejected when region is set. Immutable: a URL map cannot move between
  // scopes or regions.
  string region = 13 [(buf.validate.field).cel = {
    id: "valid_region"
    message: "region must be a valid GCP region name such as us-central1, or empty for a global URL map"
    expression: "this == '' || this.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$')"
  }];

  // The default target when no host/path rule matches — a backend service or
  // backend bucket. Reference a GcpBackendService or GcpBackendBucket, or
  // provide a self-link directly (a regional map takes only a regional
  // GcpBackendService in its region). Exactly one of default_service,
  // default_url_redirect, or default_route_action must be set. Mutable.
  dev.planton.shared.foreignkey.v1.StringValueOrRef default_service = 4;

  // Redirect unmatched requests instead of serving them (e.g. an
  // apex-to-www or http-to-https redirect as the catch-all). Mutually
  // exclusive with default_service and default_route_action.
  GcpUrlMapUrlRedirect default_url_redirect = 5;

  // Advanced default handling: weight traffic across several backends, rewrite
  // URLs, set timeouts/retries. Mutually exclusive with default_service and
  // default_url_redirect (its weighted_backend_services is the third arm of
  // the default-target choice).
  GcpUrlMapRouteAction default_route_action = 6;

  // Return a custom error page (from a backend bucket) for chosen response
  // codes at the top level. Global external Application Load Balancers only
  // — rejected when region is set.
  GcpUrlMapCustomErrorResponsePolicy default_custom_error_response_policy = 7;

  // Headers added to or removed from every request/response at the URL-map
  // level, before any per-route header action. Mutable.
  GcpUrlMapHeaderAction header_action = 8;

  // Map request Host headers to named path matchers. Each host rule points a
  // set of hosts (with optional wildcards) at one path_matcher by name.
  // Mutable.
  repeated GcpUrlMapHostRule host_rules = 9;

  // The named path matchers host rules point at — each owns the path-level
  // routing (path_rules, route_rules, and its own default). Mutable.
  repeated GcpUrlMapPathMatcher path_matchers = 10;

  // Routing self-tests evaluated by GCP at create/update time: each asserts
  // that a given host+path resolves to an expected service or redirect. A
  // failing test blocks the update — a guard against a routing change that
  // silently breaks a path. On a regional map every test names its expected
  // service and carries no headers or redirect expectations (those forms
  // exist only on the global map). Mutable.
  repeated GcpUrlMapTest tests = 11;

  // What `terraform destroy` (or a stack teardown) may do to the URL map.
  // DELETE (the default when empty) allows deletion; PREVENT fails the
  // destroy outright — the URL map and anything orchestrating its teardown
  // stop there; ABANDON removes it from state without deleting it in GCP
  // (the map keeps serving, unmanaged). Client-side only — never sent to
  // the GCP API.
  string deletion_policy = 12 [(buf.validate.field).cel = {
    id: "valid_deletion_policy"
    expression: "this == '' || this in ['DELETE', 'PREVENT', 'ABANDON']"
    message: "deletion_policy must be one of: DELETE, PREVENT, ABANDON"
  }];

  option (buf.validate.message).cel = {
    id: "exactly_one_default_target"
    message: "set exactly one default target: default_service, default_url_redirect, or default_route_action (with weighted_backend_services)"
    expression: "(has(this.default_service) ? 1 : 0) + (has(this.default_url_redirect) ? 1 : 0) + (has(this.default_route_action) && size(this.default_route_action.weighted_backend_services) > 0 ? 1 : 0) == 1"
  };

  option (buf.validate.message).cel = {
    id: "default_route_action_conflicts_redirect"
    message: "default_route_action and default_url_redirect are mutually exclusive"
    expression: "!(has(this.default_route_action) && has(this.default_url_redirect))"
  };

  option (buf.validate.message).cel = {
    id: "default_no_path_template_rewrite"
    message: "path_template_rewrite is honored only inside a route rule's route_action (and, on a regional map, a path matcher's default route action) — GCP rejects it in the URL map's default route action"
    expression: "!has(this.default_route_action) || !has(this.default_route_action.url_rewrite) || this.default_route_action.url_rewrite.path_template_rewrite == ''"
  };

  // A path matcher's default route action honors path_template_rewrite on
  // the regional map only; the rule lives here rather than on the path
  // matcher because only the spec knows the scope.
  option (buf.validate.message).cel = {
    id: "path_matcher_path_template_rewrite_regional_only"
    message: "path_template_rewrite in a path matcher's default route action is honored only by a regional URL map — set region, move the rewrite into a route rule, or use path_prefix_rewrite"
    expression: "this.region != '' || !this.path_matchers.exists(p, has(p.default_route_action) && has(p.default_route_action.url_rewrite) && p.default_route_action.url_rewrite.path_template_rewrite != '')"
  };

  // The regional URL map carries no Cloud CDN route caching, no custom
  // error pages, no stream-duration limit, and no header-driven routing
  // tests. Each wall walks every site the surface appears at, so a manifest
  // fails before the API sees it and the message names the lever.
  option (buf.validate.message).cel = {
    id: "cache_policy_global_only"
    message: "cache_policy (Cloud CDN route caching) exists only on a global URL map — a regional Application Load Balancer has no Cloud CDN; clear region or remove every cache_policy"
    expression: "this.region == '' || (!(has(this.default_route_action) && has(this.default_route_action.cache_policy)) && !this.path_matchers.exists(p, (has(p.default_route_action) && has(p.default_route_action.cache_policy)) || p.path_rules.exists(r, has(r.route_action) && has(r.route_action.cache_policy)) || p.route_rules.exists(r, has(r.route_action) && has(r.route_action.cache_policy))))"
  };

  option (buf.validate.message).cel = {
    id: "custom_error_response_policy_global_only"
    message: "custom error response policies exist only on a global URL map — the regional map has no error-page surface; clear region or remove every custom_error_response_policy and default_custom_error_response_policy"
    expression: "this.region == '' || (!has(this.default_custom_error_response_policy) && !this.path_matchers.exists(p, has(p.default_custom_error_response_policy) || p.path_rules.exists(r, has(r.custom_error_response_policy)) || p.route_rules.exists(r, has(r.custom_error_response_policy))))"
  };

  option (buf.validate.message).cel = {
    id: "max_stream_duration_global_only"
    message: "max_stream_duration exists only on a global URL map (Traffic Director) at the map's default route action and inside path rules and route rules — a regional map carries none; clear region or remove it"
    expression: "this.region == '' || (!(has(this.default_route_action) && has(this.default_route_action.max_stream_duration)) && !this.path_matchers.exists(p, p.path_rules.exists(r, has(r.route_action) && has(r.route_action.max_stream_duration)) || p.route_rules.exists(r, has(r.route_action) && has(r.route_action.max_stream_duration))))"
  };

  option (buf.validate.message).cel = {
    id: "regional_tests_are_service_only"
    message: "on a regional URL map every routing test names its expected service and carries no headers, expected_output_url, or expected_redirect_response_code — those test forms exist only on the global map"
    expression: "this.region == '' || this.tests.all(t, has(t.service) && size(t.headers) == 0 && t.expected_output_url == '' && t.expected_redirect_response_code == 0)"
  };
}

// A redirect action. Set host and/or path components; GCP returns the chosen
// response code with the rewritten Location.
message GcpUrlMapUrlRedirect {
  // Replace the host in the redirect Location. Empty keeps the request host.
  string host_redirect = 1 [(buf.validate.field).string.max_len = 255];

  // Redirect to HTTPS (scheme becomes https). The standard http→https
  // upgrade. Default false.
  bool https_redirect = 2;

  // Replace the entire path with this value. Mutually exclusive with
  // prefix_redirect. Empty keeps the request path.
  string path_redirect = 3 [(buf.validate.field).string.max_len = 1024];

  // Replace the matched path prefix with this value, keeping the remainder.
  // Mutually exclusive with path_redirect.
  string prefix_redirect = 4 [(buf.validate.field).string.max_len = 1024];

  // The HTTP redirect status code: FOUND (302), MOVED_PERMANENTLY_DEFAULT
  // (301), PERMANENT_REDIRECT (308), SEE_OTHER (303), or TEMPORARY_REDIRECT
  // (307). Empty uses the GCP default (MOVED_PERMANENTLY_DEFAULT).
  string redirect_response_code = 5 [(buf.validate.field).cel = {
    id: "valid_redirect_response_code"
    message: "redirect_response_code must be one of FOUND, MOVED_PERMANENTLY_DEFAULT, PERMANENT_REDIRECT, SEE_OTHER, or TEMPORARY_REDIRECT"
    expression: "this == '' || this in ['FOUND', 'MOVED_PERMANENTLY_DEFAULT', 'PERMANENT_REDIRECT', 'SEE_OTHER', 'TEMPORARY_REDIRECT']"
  }];

  // Drop the query string from the redirect Location. Default false (the query
  // string is preserved).
  bool strip_query = 6;

  option (buf.validate.message).cel = {
    id: "redirect_path_or_prefix_exclusive"
    message: "path_redirect and prefix_redirect are mutually exclusive — set at most one"
    expression: "this.path_redirect == '' || this.prefix_redirect == ''"
  };
}

// Header mutations applied at a routing level: add or remove request and
// response headers.
message GcpUrlMapHeaderAction {
  // Headers to add to the request before it reaches the backend.
  repeated GcpUrlMapHeaderValue request_headers_to_add = 1;

  // Header names to strip from the request before it reaches the backend.
  repeated string request_headers_to_remove = 2 [(buf.validate.field).repeated.items.string.min_len = 1];

  // Headers to add to the response before it returns to the client.
  repeated GcpUrlMapHeaderValue response_headers_to_add = 3;

  // Header names to strip from the response before it returns to the client.
  repeated string response_headers_to_remove = 4 [(buf.validate.field).repeated.items.string.min_len = 1];
}

// One header to add, with replace-vs-append semantics.
message GcpUrlMapHeaderValue {
  // The header name (e.g. "X-Client-Geo").
  string header_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 1024
  ];

  // The header value. May use load-balancer variables (e.g. "{client_region}").
  string header_value = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.max_len = 1024
  ];

  // Replace an existing header of the same name (true) or append to it
  // (false).
  bool replace = 3;
}

// A routing action: the full per-route traffic-management surface. Weight
// traffic across backends, rewrite the request, bound its time budget, retry
// failures, mirror it, answer CORS preflights, inject faults for resilience
// testing, and control CDN caching — all scoped to the routes that use this
// action. Used as the URL map's default action, a path matcher's default
// action, and inside path rules and route rules.
//
// A route action is a valid TARGET only through weighted_backend_services;
// the other sub-policies may accompany a plain service target (e.g. a
// path rule with `service` plus a route_action carrying only retry_policy
// and timeout). Route-scoped policies here override the backend service's
// own resilience/CDN settings for matching traffic only.
message GcpUrlMapRouteAction {
  // Split traffic across multiple backend services by weight — the mechanism
  // for weighted canary and blue/green rollouts. The weights are relative; a
  // backend's share is its weight over the sum of weights.
  repeated GcpUrlMapWeightedBackendService weighted_backend_services = 1;

  // Rewrite the host and/or path before forwarding to the backend.
  GcpUrlMapUrlRewrite url_rewrite = 2;

  // Total time budget for the request, INCLUDING all retries (from the
  // first byte of the request to the last byte of the response). Pair with
  // retry_policy.per_try_timeout: per-try bounds one attempt, this bounds
  // the whole exchange. Unset uses the backend service's own timeout.
  // Not permitted when the route targets a redirect.
  GcpUrlMapDuration timeout = 3;

  // Retry failed requests to the backend. Which failures count is chosen
  // by retry_conditions; how long each attempt may run by per_try_timeout.
  // Retries consume the overall timeout's budget — they never extend it.
  GcpUrlMapRetryPolicy retry_policy = 4;

  // Mirror every matched request to a second backend service, fire-and-
  // forget (responses from the mirror are discarded; the client sees only
  // the primary's response). Useful for shadow-testing a new stack with
  // production traffic — the mirror backend must be sized for the full
  // mirrored load.
  GcpUrlMapRequestMirrorPolicy request_mirror_policy = 5;

  // Answer cross-origin (CORS) preflights and stamp CORS headers at the
  // load balancer, before requests reach the backend.
  GcpUrlMapCorsPolicy cors_policy = 6;

  // Deliberately inject failures (aborts with a chosen status, fixed
  // delays) into a percentage of matched requests — chaos/resilience
  // testing of the CLIENTS of this route. Never leave enabled on a
  // production default route: the injected failures are real to callers.
  GcpUrlMapFaultInjectionPolicy fault_injection_policy = 7;

  // Upper bound on how long a STREAM on this route may stay open
  // (gRPC/long-poll streams — distinct from timeout, which bounds a
  // request/response exchange). Live API truth: GCP rejects this field
  // unless the URL map's backend service uses the INTERNAL_SELF_MANAGED
  // (Traffic Director) load-balancing scheme ("Max stream duration is
  // only supported when UrlMap is used with BackendService whose Load
  // Balancing Scheme is INTERNAL_SELF_MANAGED") — leave it unset on
  // external application load balancers. Global maps only: the regional
  // map has no such argument (except in a path matcher's default route
  // action, which carries it on both scopes).
  GcpUrlMapDuration max_stream_duration = 8;

  // Cloud CDN caching for the routes using this action — overrides the
  // backend service's cdn_policy for matching traffic only. Takes effect
  // only when the target backend service (or bucket) has CDN enabled;
  // GCP ignores it otherwise. Global maps only — regional Application Load
  // Balancers have no Cloud CDN, and the regional map has no such argument.
  GcpUrlMapCachePolicy cache_policy = 9;
}

// One weighted backend in a traffic split.
message GcpUrlMapWeightedBackendService {
  // The backend service receiving this share of traffic. Reference a
  // GcpBackendService or provide a self-link directly.
  dev.planton.shared.foreignkey.v1.StringValueOrRef backend_service = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpBackendService,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.self_link"
  ];

  // Relative weight of this backend (0-1000). Its share is weight over the sum
  // of all weights in the split; 0 drains this backend from the split.
  int32 weight = 2 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 1000
  ];

  // Header mutations applied ONLY to the share of traffic sent to this
  // backend — e.g. tag canary responses with an identifying header so
  // clients and dashboards can tell which arm served them. Applied after
  // the URL-map-level and route-level header actions.
  GcpUrlMapHeaderAction header_action = 3;
}

// URL rewrite before forwarding to the backend.
message GcpUrlMapUrlRewrite {
  // Replace the request Host header with this value before forwarding.
  string host_rewrite = 1 [(buf.validate.field).string.max_len = 255];

  // Replace the matched path prefix with this value. Mutually exclusive with
  // path_template_rewrite.
  string path_prefix_rewrite = 2 [(buf.validate.field).string.max_len = 1024];

  // Rewrite the path using a template that references named path variables
  // captured by a route rule's path_template_match (e.g. "/v2/{country}").
  // Honored inside a route_rule's route_action on both scopes and, on a
  // REGIONAL map only, in a path matcher's default route action — GCP
  // rejects it in the map's default route action and in path-rule route
  // actions everywhere. Mutually exclusive with path_prefix_rewrite.
  string path_template_rewrite = 3 [(buf.validate.field).string.max_len = 1024];

  option (buf.validate.message).cel = {
    id: "rewrite_prefix_or_template_exclusive"
    message: "path_prefix_rewrite and path_template_rewrite are mutually exclusive — set at most one"
    expression: "this.path_prefix_rewrite == '' || this.path_template_rewrite == ''"
  };
}

// A span of time at nanosecond resolution — GCP's Duration shape, used for
// route timeouts, retry budgets, stream limits, and CDN cache lifetimes. Both
// components carry presence because zero is a real value here: a duration of
// `0s` (a TTL of zero, an immediate delay) is spelled `seconds: 0`, and a
// component left unset means zero as well; the two differ only in that the
// first records the author's intent.
message GcpUrlMapDuration {
  // Whole seconds (0 to 315,576,000,000 — GCP's int64 Duration bound).
  optional int64 seconds = 1 [
    (buf.validate.field).int64.gte = 0,
    (buf.validate.field).int64.lte = 315576000000
  ];

  // Fraction of a second at nanosecond resolution (0 to 999,999,999).
  // Durations under one second use seconds = 0 and a positive nanos.
  optional int32 nanos = 2 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.lte = 999999999
  ];
}

// Retry policy for a route: which failures are retried, how many times, and
// how long each attempt may run.
message GcpUrlMapRetryPolicy {
  // Number of allowed retries (GCP defaults to 1 when unset/0). Each retry
  // still spends the route's overall timeout budget.
  int32 num_retries = 1 [(buf.validate.field).int32.gte = 0];

  // Which failures trigger a retry. 5xx (any 5xx or no response at all),
  // gateway-error (502/503/504 only), connect-failure, retriable-4xx
  // (currently only 409), refused-stream, and the gRPC status conditions
  // cancelled, deadline-exceeded, resource-exhausted, unavailable.
  repeated string retry_conditions = 2 [(buf.validate.field).cel = {
    id: "valid_retry_conditions"
    message: "each retry condition must be one of: 5xx, gateway-error, connect-failure, retriable-4xx, refused-stream, cancelled, deadline-exceeded, resource-exhausted, unavailable"
    expression: "this.all(c, c in ['5xx', 'gateway-error', 'connect-failure', 'retriable-4xx', 'refused-stream', 'cancelled', 'deadline-exceeded', 'resource-exhausted', 'unavailable'])"
  }];

  // Time budget for EACH retry attempt (the route's timeout bounds the
  // whole exchange across attempts). Unset uses the overall timeout for
  // every attempt.
  GcpUrlMapDuration per_try_timeout = 3;
}

// Mirror matched requests to a second backend service, fire-and-forget.
message GcpUrlMapRequestMirrorPolicy {
  // The backend service receiving the mirrored copy of every matched
  // request. Reference a GcpBackendService or provide a self-link
  // directly. Responses from this backend are discarded.
  dev.planton.shared.foreignkey.v1.StringValueOrRef backend_service = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpBackendService,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.self_link"
  ];
}

// Cross-origin resource sharing (CORS) handled at the load balancer: the
// browser's preflight is answered and response headers are stamped without
// the request reaching the backend.
message GcpUrlMapCorsPolicy {
  // Sets Access-Control-Allow-Credentials: allow requests carrying
  // credentials (cookies, authorization headers). Default false.
  bool allow_credentials = 1;

  // Headers the client may send (Access-Control-Allow-Headers).
  repeated string allow_headers = 2 [(buf.validate.field).repeated.items.string.min_len = 1];

  // Methods the client may use (Access-Control-Allow-Methods), e.g.
  // ["GET", "POST", "OPTIONS"].
  repeated string allow_methods = 3 [(buf.validate.field).repeated.items.string.min_len = 1];

  // Regular expressions matching allowed origins; a request origin is
  // allowed when it matches any listed regex or exact allow_origins entry.
  repeated string allow_origin_regexes = 4 [(buf.validate.field).repeated.items.string.min_len = 1];

  // Exact origins allowed, e.g. "https://app.example.com".
  repeated string allow_origins = 5 [(buf.validate.field).repeated.items.string.min_len = 1];

  // Disable this CORS policy without deleting its configuration (true
  // turns the policy off). Default false — the policy is in effect.
  bool disabled = 6;

  // Headers the browser may read from the response
  // (Access-Control-Expose-Headers).
  repeated string expose_headers = 7 [(buf.validate.field).repeated.items.string.min_len = 1];

  // Seconds a browser may cache the preflight response
  // (Access-Control-Max-Age).
  int32 max_age = 8 [(buf.validate.field).int32.gte = 0];
}

// Deliberate failure injection for resilience testing of this route's
// clients. Percentages are evaluated per request; both arms may be active
// at once (delay first, then abort decision).
message GcpUrlMapFaultInjectionPolicy {
  // Abort a percentage of requests with a fixed HTTP status, before they
  // reach the backend.
  GcpUrlMapFaultAbort abort = 1;

  // Delay a percentage of requests by a fixed duration before forwarding.
  GcpUrlMapFaultDelay delay = 2;
}

// The abort arm of fault injection.
message GcpUrlMapFaultAbort {
  // HTTP status returned to aborted requests (200-599).
  int32 http_status = 1 [(buf.validate.field).cel = {
    id: "valid_fault_http_status"
    message: "http_status must be between 200 and 599"
    expression: "this == 0 || (this >= 200 && this <= 599)"
  }];

  // Percentage of requests aborted (0.0-100.0).
  double percentage = 2 [
    (buf.validate.field).double.gte = 0,
    (buf.validate.field).double.lte = 100
  ];
}

// The delay arm of fault injection.
message GcpUrlMapFaultDelay {
  // How long delayed requests are held before forwarding.
  GcpUrlMapDuration fixed_delay = 1;

  // Percentage of requests delayed (0.0-100.0).
  double percentage = 2 [
    (buf.validate.field).double.gte = 0,
    (buf.validate.field).double.lte = 100
  ];
}

// Cloud CDN cache behavior for the routes using this action. TTLs are only
// respected in cache modes that use them; GCP applies its own defaults for
// any field left unset (cache_mode CACHE_ALL_STATIC, client/default TTL
// 3600s, max TTL 86400s). Takes effect only when the target backend has
// CDN enabled.
message GcpUrlMapCachePolicy {
  // What gets cached. CACHE_ALL_STATIC (the GCP default) caches static
  // content types and honors origin cache headers for the rest;
  // USE_ORIGIN_HEADERS caches only what the backends explicitly mark
  // cacheable (TTL fields must be unset — the origin controls lifetimes);
  // FORCE_CACHE_ALL caches everything, ignoring origin headers (never
  // combine with private or per-user content).
  string cache_mode = 1 [(buf.validate.field).cel = {
    id: "valid_cache_mode"
    message: "cache_mode must be CACHE_ALL_STATIC, USE_ORIGIN_HEADERS, or FORCE_CACHE_ALL"
    expression: "this == '' || this in ['CACHE_ALL_STATIC', 'USE_ORIGIN_HEADERS', 'FORCE_CACHE_ALL']"
  }];

  // Requests carrying any of these headers bypass the cache and go
  // straight to the origin (e.g. a debug or authorization header).
  repeated string cache_bypass_request_header_names = 2 [(buf.validate.field).repeated.items.string.min_len = 1];

  // Cache negative responses (404, 410, ...) so repeated misses do not
  // hammer the backends. Pair with negative_caching_policy to set
  // per-status TTLs.
  bool negative_caching = 3;

  // Collapse concurrent cache-fill requests for the same key into one
  // origin fetch. Default true on GCP's side.
  bool request_coalescing = 4;

  // What forms the cache key — trim protocol, host, query string, or
  // select specific query parameters, headers, and cookies.
  GcpUrlMapCacheKeyPolicy cache_key_policy = 5;

  // Max lifetime in browsers and downstream caches (sets the max-age
  // clients see). Not respected with cache_mode USE_ORIGIN_HEADERS.
  GcpUrlMapDuration client_ttl = 6;

  // Edge-cache lifetime for responses without their own cache headers.
  // Not respected with cache_mode USE_ORIGIN_HEADERS.
  GcpUrlMapDuration default_ttl = 7;

  // Upper bound on any edge-cache lifetime, capping even origin-supplied
  // max-age. Not respected with cache_mode USE_ORIGIN_HEADERS or
  // FORCE_CACHE_ALL.
  GcpUrlMapDuration max_ttl = 8;

  // How long stale content may still be served while revalidating in the
  // background (up to 1 day).
  GcpUrlMapDuration serve_while_stale = 9;

  // Per-status TTLs for cached negative responses; only meaningful with
  // negative_caching enabled.
  repeated GcpUrlMapNegativeCachingPolicy negative_caching_policy = 10;

  option (buf.validate.message).cel = {
    id: "origin_headers_mode_owns_ttls"
    message: "with cache_mode USE_ORIGIN_HEADERS the origin's headers control lifetimes — remove client_ttl, default_ttl, and max_ttl (GCP would silently ignore them)"
    expression: "this.cache_mode != 'USE_ORIGIN_HEADERS' || (!has(this.client_ttl) && !has(this.default_ttl) && !has(this.max_ttl))"
  };
}

// What forms the CDN cache key for routes using this cache policy.
message GcpUrlMapCacheKeyPolicy {
  // Query parameters EXCLUDED from the cache key (everything else is
  // included). Mutually exclusive with included_query_parameters.
  repeated string excluded_query_parameters = 1 [(buf.validate.field).repeated.items.string.min_len = 1];

  // Include the request host in the cache key (distinct hosts cache
  // separately).
  bool include_host = 2;

  // Include the protocol (http/https) in the cache key.
  bool include_protocol = 3;

  // Include the entire query string in the cache key. When false, the
  // included/excluded parameter lists refine what participates.
  bool include_query_string = 4;

  // Cookie names whose values join the cache key.
  repeated string included_cookie_names = 5 [(buf.validate.field).repeated.items.string.min_len = 1];

  // Header names whose values join the cache key.
  repeated string included_header_names = 6 [(buf.validate.field).repeated.items.string.min_len = 1];

  // Query parameters INCLUDED in the cache key (everything else is
  // ignored). Mutually exclusive with excluded_query_parameters.
  repeated string included_query_parameters = 7 [(buf.validate.field).repeated.items.string.min_len = 1];

  option (buf.validate.message).cel = {
    id: "query_params_include_or_exclude"
    message: "included_query_parameters and excluded_query_parameters are mutually exclusive — set at most one list"
    expression: "size(this.included_query_parameters) == 0 || size(this.excluded_query_parameters) == 0"
  };
}

// Cache lifetime for one negative (error) response status.
message GcpUrlMapNegativeCachingPolicy {
  // The HTTP status code this TTL applies to. GCP accepts only 300, 301,
  // 302, 307, 308, 404, 405, 410, 421, 451, and 501, each at most once.
  int32 code = 1 [(buf.validate.field).cel = {
    id: "valid_negative_caching_code"
    message: "code must be one of 300, 301, 302, 307, 308, 404, 405, 410, 421, 451, 501"
    expression: "this == 0 || this in [300, 301, 302, 307, 308, 404, 405, 410, 421, 451, 501]"
  }];

  // How long responses with this status are cached.
  GcpUrlMapDuration ttl = 2;
}

// A custom error response policy: serve error pages from a backend bucket for
// chosen response codes. Global external Application Load Balancers only.
message GcpUrlMapCustomErrorResponsePolicy {
  // The backend bucket serving the error pages. Reference a GcpBackendBucket
  // or provide a self-link directly.
  dev.planton.shared.foreignkey.v1.StringValueOrRef error_service = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpBackendBucket,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.self_link"
  ];

  // Rules mapping response codes to the error page and (optionally) an
  // overridden status code.
  repeated GcpUrlMapCustomErrorResponseRule error_response_rules = 2;
}

// One custom-error-response rule.
message GcpUrlMapCustomErrorResponseRule {
  // Response codes this rule matches: exact ("404", "503") or a class ("4xx",
  // "5xx"). At least one is required.
  repeated string match_response_codes = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];

  // Override the response code returned to the client (e.g. serve a 200 with a
  // maintenance page). Empty keeps the original code.
  int32 override_response_code = 2 [(buf.validate.field).cel = {
    id: "valid_override_response_code"
    message: "override_response_code must be between 200 and 599"
    expression: "this == 0 || (this >= 200 && this <= 599)"
  }];

  // Path within the error backend bucket to serve for matched codes (e.g.
  // "/errors/404.html").
  string path = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 1024
  ];
}

// A host rule mapping request hosts to a named path matcher.
message GcpUrlMapHostRule {
  // Hosts this rule matches. A "*" wildcard may lead a domain
  // (e.g. "*.example.com") or match everything ("*"). At least one required.
  repeated string hosts = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];

  // The name of the path_matcher (in path_matchers) that handles these hosts.
  string path_matcher = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // What this host rule covers — write it for the operator reading the routing
  // table later.
  string description = 3 [(buf.validate.field).string.max_len = 1024];
}

// A path matcher: the path-level routing a host rule points at.
message GcpUrlMapPathMatcher {
  // The path matcher's name, referenced by host_rules.path_matcher.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 63
  ];

  // The default target when no path_rule or route_rule matches — a backend
  // service or backend bucket. Reference a GcpBackendService or
  // GcpBackendBucket, or provide a self-link. Set exactly one of
  // default_service, default_url_redirect, or default_route_action.
  dev.planton.shared.foreignkey.v1.StringValueOrRef default_service = 2;

  // Redirect as the path matcher's default instead of serving.
  GcpUrlMapUrlRedirect default_url_redirect = 3;

  // Advanced default handling (weighted split / rewrite) for the path matcher.
  // On a regional map this is the one place besides route rules where a
  // url_rewrite may carry path_template_rewrite.
  GcpUrlMapRouteAction default_route_action = 4;

  // Custom error pages for this path matcher's default. Global external ALBs
  // only — rejected when the map's region is set.
  GcpUrlMapCustomErrorResponsePolicy default_custom_error_response_policy = 5;

  // What this path matcher covers.
  string description = 6 [(buf.validate.field).string.max_len = 1024];

  // Header mutations applied to all traffic through this path matcher.
  GcpUrlMapHeaderAction header_action = 7;

  // Longest-prefix path rules: each maps a set of path patterns to a service,
  // redirect, or route action. Evaluated after route_rules.
  repeated GcpUrlMapPathRule path_rules = 8;

  // Priority-ordered route rules with rich header/query/path matching.
  // Evaluated before path_rules. A path matcher uses either path_rules or
  // route_rules, not both.
  repeated GcpUrlMapRouteRule route_rules = 9;

  option (buf.validate.message).cel = {
    id: "path_matcher_default_target_at_most_one"
    message: "a path matcher may set at most one default target: default_service, default_url_redirect, or default_route_action with weighted_backend_services (a route action carrying only sub-policies may accompany default_service)"
    expression: "(has(this.default_service) ? 1 : 0) + (has(this.default_url_redirect) ? 1 : 0) + (has(this.default_route_action) && size(this.default_route_action.weighted_backend_services) > 0 ? 1 : 0) <= 1"
  };

  option (buf.validate.message).cel = {
    id: "path_matcher_route_action_conflicts_redirect"
    message: "default_route_action and default_url_redirect are mutually exclusive — a redirect never reaches a backend"
    expression: "!(has(this.default_route_action) && has(this.default_url_redirect))"
  };

  option (buf.validate.message).cel = {
    id: "path_matcher_rules_exclusive"
    message: "a path matcher uses either path_rules or route_rules, not both"
    expression: "size(this.path_rules) == 0 || size(this.route_rules) == 0"
  };
}

// A longest-prefix path rule.
message GcpUrlMapPathRule {
  // Path patterns this rule matches. Each must start with "/" and may end with
  // a single "*" wildcard (e.g. "/api/*"). At least one required.
  repeated string paths = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];

  // The target when a path matches — a backend service or backend bucket.
  // Reference a GcpBackendService or GcpBackendBucket, or provide a self-link.
  // Set exactly one of service, url_redirect, or route_action.
  dev.planton.shared.foreignkey.v1.StringValueOrRef service = 2;

  // Advanced handling (weighted split / rewrite) for matched paths.
  GcpUrlMapRouteAction route_action = 3;

  // Redirect matched paths instead of serving them.
  GcpUrlMapUrlRedirect url_redirect = 4;

  // Custom error pages for matched paths. Global external ALBs only.
  GcpUrlMapCustomErrorResponsePolicy custom_error_response_policy = 5;

  option (buf.validate.message).cel = {
    id: "path_rule_target_exactly_one"
    message: "a path rule must have exactly one target: service, url_redirect, or route_action with weighted_backend_services (a route action carrying only sub-policies may accompany service)"
    expression: "(has(this.service) ? 1 : 0) + (has(this.url_redirect) ? 1 : 0) + (has(this.route_action) && size(this.route_action.weighted_backend_services) > 0 ? 1 : 0) == 1"
  };

  option (buf.validate.message).cel = {
    id: "path_rule_route_action_conflicts_redirect"
    message: "route_action and url_redirect are mutually exclusive — a redirect never reaches a backend"
    expression: "!(has(this.route_action) && has(this.url_redirect))"
  };

  option (buf.validate.message).cel = {
    id: "path_rule_no_path_template_rewrite"
    message: "path_template_rewrite is honored only inside a route rule's route_action — GCP rejects it in a path rule's route action"
    expression: "!has(this.route_action) || !has(this.route_action.url_rewrite) || this.route_action.url_rewrite.path_template_rewrite == ''"
  };
}

// A priority-ordered route rule with rich matching.
message GcpUrlMapRouteRule {
  // Evaluation priority (0 to 2147483647); lower numbers are evaluated first
  // and must be unique within the path matcher. Proto3 int32 has no presence,
  // so required is omitted — priority 0 is valid and must not be rejected as
  // "unset".
  int32 priority = 1 [(buf.validate.field).int32.gte = 0];

  // The target backend service when this rule matches. Reference a
  // GcpBackendService or provide a self-link. Route rules target backend
  // services only (not buckets). Set exactly one of service, url_redirect, or
  // route_action.
  dev.planton.shared.foreignkey.v1.StringValueOrRef service = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpBackendService,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.self_link"
  ];

  // Conditions a request must meet for this rule to fire (path/header/query
  // matching). At least one match rule is required.
  repeated GcpUrlMapRouteRuleMatchRule match_rules = 3 [(buf.validate.field).repeated.min_items = 1];

  // Advanced handling (weighted split / rewrite / retry) for matched requests.
  GcpUrlMapRouteAction route_action = 4;

  // Redirect matched requests instead of serving them.
  GcpUrlMapUrlRedirect url_redirect = 5;

  // Header mutations applied to matched requests.
  GcpUrlMapHeaderAction header_action = 6;

  // Custom error pages for matched requests. Global external ALBs only.
  GcpUrlMapCustomErrorResponsePolicy custom_error_response_policy = 7;

  option (buf.validate.message).cel = {
    id: "route_rule_target_exactly_one"
    message: "a route rule must have exactly one target: service, url_redirect, or route_action with weighted_backend_services (a route action carrying only sub-policies may accompany service)"
    expression: "(has(this.service) ? 1 : 0) + (has(this.url_redirect) ? 1 : 0) + (has(this.route_action) && size(this.route_action.weighted_backend_services) > 0 ? 1 : 0) == 1"
  };

  option (buf.validate.message).cel = {
    id: "route_rule_route_action_conflicts_redirect"
    message: "route_action and url_redirect are mutually exclusive — a redirect never reaches a backend"
    expression: "!(has(this.route_action) && has(this.url_redirect))"
  };
}

// The conditions a route rule matches on. Set at least one match dimension.
message GcpUrlMapRouteRuleMatchRule {
  // Match when the path starts with this prefix (e.g. "/api"). Mutually
  // exclusive with full_path_match, regex_match, and path_template_match.
  string prefix_match = 1 [(buf.validate.field).string.max_len = 1024];

  // Match when the path equals this exactly. Mutually exclusive with the other
  // path matchers.
  string full_path_match = 2 [(buf.validate.field).string.max_len = 1024];

  // Match the path against this regular expression. Mutually exclusive with
  // the other path matchers.
  string regex_match = 3 [(buf.validate.field).string.max_len = 1024];

  // Match the path against a wildcard template capturing named variables
  // (e.g. "/v1/{country}/**"), usable by a route_action's
  // path_template_rewrite. Mutually exclusive with the other path matchers.
  string path_template_match = 4 [(buf.validate.field).string.max_len = 1024];

  // Case-insensitive path matching. Default false.
  bool ignore_case = 5;

  // Match on request headers — all listed header matches must hold.
  repeated GcpUrlMapHeaderMatch header_matches = 6;

  // Match on query parameters — all listed matches must hold.
  repeated GcpUrlMapQueryParameterMatch query_parameter_matches = 7;

  // Traffic Director metadata filters (xDS node metadata matching).
  repeated GcpUrlMapMetadataFilter metadata_filters = 8;

  option (buf.validate.message).cel = {
    id: "match_rule_single_path_matcher"
    message: "set at most one path matcher: prefix_match, full_path_match, regex_match, or path_template_match"
    expression: "(this.prefix_match != '' ? 1 : 0) + (this.full_path_match != '' ? 1 : 0) + (this.regex_match != '' ? 1 : 0) + (this.path_template_match != '' ? 1 : 0) <= 1"
  };
}

// A header match condition.
message GcpUrlMapHeaderMatch {
  // The header name to match.
  string header_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // Match when the header equals this exactly.
  string exact_match = 2;

  // Match when the header starts with this.
  string prefix_match = 3;

  // Match when the header ends with this.
  string suffix_match = 4;

  // Match the header against this regular expression.
  string regex_match = 5;

  // Match when the header is present (any value).
  bool present_match = 6;

  // Match when the header's integer value falls in a range.
  GcpUrlMapHeaderMatchRange range_match = 7;

  // Invert the whole match — fire when the condition does NOT hold. Default
  // false.
  bool invert_match = 8;
}

// An integer range for a header match.
message GcpUrlMapHeaderMatchRange {
  // Inclusive lower bound.
  int64 range_start = 1;

  // Exclusive upper bound.
  int64 range_end = 2;
}

// A query-parameter match condition.
message GcpUrlMapQueryParameterMatch {
  // The query parameter name to match.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // Match when the parameter equals this exactly.
  string exact_match = 2;

  // Match when the parameter is present (any value).
  bool present_match = 3;

  // Match the parameter against this regular expression.
  string regex_match = 4;
}

// A Traffic Director metadata filter.
message GcpUrlMapMetadataFilter {
  // How the labels combine: MATCH_ALL (every label must match) or MATCH_ANY
  // (at least one).
  string filter_match_criteria = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "valid_filter_match_criteria"
      message: "filter_match_criteria must be MATCH_ALL or MATCH_ANY"
      expression: "this in ['MATCH_ALL', 'MATCH_ANY']"
    }
  ];

  // The xDS node metadata labels to match against (1-64 entries).
  repeated GcpUrlMapMetadataFilterLabel filter_labels = 2 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 64
  ];
}

// One xDS metadata label.
message GcpUrlMapMetadataFilterLabel {
  // Label name.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // Label value.
  string value = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
}

// A routing self-test asserting that a host+path resolves as expected.
message GcpUrlMapTest {
  // The request Host header the test sends.
  string host = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // The request path the test sends.
  string path = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // The backend service or backend bucket the request is expected to resolve
  // to. Reference a GcpBackendService or GcpBackendBucket, or provide a
  // self-link. Leave empty when asserting a redirect via
  // expected_redirect_response_code. Required on a regional map, whose
  // tests can only assert a service.
  dev.planton.shared.foreignkey.v1.StringValueOrRef service = 3;

  // What this test guards — write it for whoever reads a failed-test error.
  string description = 4 [(buf.validate.field).string.max_len = 1024];

  // The URL the request is expected to be redirected/rewritten to. Optional
  // when service is set. Global maps only.
  string expected_output_url = 5 [(buf.validate.field).string.max_len = 1024];

  // The redirect status code the request is expected to produce. Cannot be set
  // together with service. Global maps only.
  int32 expected_redirect_response_code = 6 [(buf.validate.field).int32.gte = 0];

  // Request headers the test sends. Global maps only.
  repeated GcpUrlMapTestHeader headers = 7;
}

// One request header a routing test sends.
message GcpUrlMapTestHeader {
  // Header name.
  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  // Header value.
  string value = 2 [(buf.validate.field).required = true];
}
