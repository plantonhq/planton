syntax = "proto3";

package dev.planton.gcp.gcpurlmap.v1alpha1;

// Outputs produced after provisioning a GCP global URL map.
message GcpUrlMapStackOutputs {
  // Self-link URI of the URL map. This is the value a target HTTP(S) proxy
  // references as its url_map — the composition handle that puts this routing
  // brain behind a load-balancer frontend.
  // Format: https://www.googleapis.com/compute/v1/projects/{project}/global/urlMaps/{name}
  string self_link = 1;

  // Name of the URL map as it exists in GCP.
  string url_map_name = 2;

  // Server-assigned numeric ID of the URL map.
  string map_id = 3;

  // Server-computed fingerprint of the URL map. Used for optimistic
  // concurrency control when updating the map outside of IaC.
  string fingerprint = 4;

  // Region of a regional URL map; empty for a global one. Downstream blocks
  // read it to confirm scope compatibility (a regional link must point at a
  // regional target in the same region), and the E2E verifier picks the
  // regional or global API by it.
  string region = 5;
}
