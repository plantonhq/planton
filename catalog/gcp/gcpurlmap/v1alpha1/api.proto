syntax = "proto3";

package dev.planton.gcp.gcpurlmap.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpurlmap/v1alpha1/outputs.proto";
import "catalog/gcp/gcpurlmap/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-url-map
message GcpUrlMap {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpUrlMap'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpUrlMapSpec spec = 4 [(buf.validate.field).required = true];
  GcpUrlMapStatus status = 5;
}

message GcpUrlMapStatus {
  GcpUrlMapOutputs outputs = 1;
}
