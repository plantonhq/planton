# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpurlmap
spec:
  gcp:
    groups:
      - purpose: EnableComputeApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
          - resourcemanager.projects.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_project_service enabling compute.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed. The provider reads the project with resourcemanager.projects.get before its services on every refresh, so a re-plan or destroy needs it (measured live). Proven 2026-11-22 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
      - purpose: ManageUrlMap
        permissions:
          - compute.urlMaps.create
          - compute.urlMaps.get
          - compute.urlMaps.update
          - compute.urlMaps.delete
          - compute.globalOperations.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_compute_url_map -- create, read/refresh, in-place updates (description, defaults, host rules, path matchers, tests are all mutable), destroy, and polling the global operation every mutation returns. Proven 2026-11-22 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
      - purpose: ManageRegionalUrlMap
        permissions:
          - compute.regionUrlMaps.create
          - compute.regionUrlMaps.get
          - compute.regionUrlMaps.update
          - compute.regionUrlMaps.delete
          - compute.regionOperations.get
        provenance: proven
        reach: target
        privilege: ordinary
        condition:
          spec_field_set: region
        notes: Covers google_compute_region_url_map, built instead of the global map when region is set. Regional maps authorize against their own compute.regionUrlMaps family and return region operations the provider polls; the referenced regional backend services authorize with compute.regionBackendServices.use. Proven 2026-11-22 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
      - purpose: UseReferencedBackends
        permissions:
          - compute.backendServices.use
          - compute.backendBuckets.use
          - compute.regionBackendServices.use
        provenance: proven
        reach: target
        privilege: ordinary
        notes: "Service-side checks, not module API calls -- GCP's urlMaps.insert reference documents that every backend target named in the map (default_service, path matcher defaults, path/route rule services, weighted_backend_services, request_mirror_policy, custom error services) authorizes with compute.backendServices.use or compute.backendBuckets.use on the referenced resource. Grant the one(s) matching what the map actually targets: backendBuckets.use is needed only when a bucket is a target (e.g. a custom error service or static-content path). A regional URL map checks compute.regionBackendServices.use on the services it routes to (measured live -- refused without it on both engines). Proven 2026-11-22 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines."
