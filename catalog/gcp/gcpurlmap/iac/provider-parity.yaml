# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# One kind, two provider resources: GCP models the global and regional URL
# maps as separate API collections sharing the routing surface; the global
# one alone carries Cloud CDN route caching, custom error pages,
# stream-duration limits outside a path matcher's default action, and
# header-driven routing tests, and the regional one alone honors a
# path_template_rewrite in a path matcher's default route action.
# spec.region is the scope selector -- it name-matches the regional
# resource's own region argument; every argument only one collection
# carries is walled to that scope by the spec's CEL rules, so each resource
# sees exactly the fields it has.

resources:
  google_compute_url_map:
    mappings:
      # Renames: the spec says what the field IS, where the provider
      # inherits terser API names.
      - spec: spec.url_map_name
        arg: name
      - spec: spec.project_id
        arg: project
      # Repeated-message fields are plural per proto style; provider blocks
      # are singular. Exact matching resumes below each subtree mapping.
      - spec: spec.host_rules
        arg: host_rule
      - spec: spec.path_matchers
        arg: path_matcher
      - spec: spec.tests
        arg: test
      - spec: spec.path_matchers.path_rules
        arg: path_matcher.path_rule
      # The provider's route_rules block is already plural -- it matches
      # exactly below the path_matcher mapping; no entry needed.
      # error_response_rules is plural at each of its four sites.
      - spec: spec.default_custom_error_response_policy.error_response_rules
        arg: default_custom_error_response_policy.error_response_rule
      - spec: spec.path_matchers.default_custom_error_response_policy.error_response_rules
        arg: path_matcher.default_custom_error_response_policy.error_response_rule
      - spec: spec.path_matchers.path_rules.custom_error_response_policy.error_response_rules
        arg: path_matcher.path_rule.custom_error_response_policy.error_response_rule
      - spec: spec.path_matchers.route_rules.custom_error_response_policy.error_response_rules
        arg: path_matcher.route_rules.custom_error_response_policy.error_response_rule

  google_compute_region_url_map:
    mappings:
      - spec: spec.url_map_name
        arg: name
      - spec: spec.project_id
        arg: project
      - spec: spec.host_rules
        arg: host_rule
      - spec: spec.path_matchers
        arg: path_matcher
      - spec: spec.tests
        arg: test
      - spec: spec.path_matchers.path_rules
        arg: path_matcher.path_rule

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables compute.googleapis.com
      with fixed arguments (disable_on_destroy false so destroying one URL
      map never disables the API project-wide); not spec surface.

specExclusions:
  # path_template_rewrite is provider surface at the route-rules site on
  # both collections and at a path matcher's default route action on the
  # regional one; the spec reuses one route-action message at all four
  # routing levels (default, path-matcher default, path rules, route rules),
  # so the leaf exists at two sites neither provider resource has an argument
  # for. Site-level CEL rules reject it there, making these leaves
  # unreachable by valid manifests (the path-matcher site is walled to the
  # regional scope and matches by name on that resource).
  - field: spec.default_route_action.url_rewrite.path_template_rewrite
    reason: >-
      provider carries path_template_rewrite only inside route rules; the
      spec's default_no_path_template_rewrite CEL rejects it at the URL
      map's default route action
  - field: spec.path_matchers.path_rules.route_action.url_rewrite.path_template_rewrite
    reason: >-
      provider carries path_template_rewrite only inside route rules; the
      spec's path_rule_no_path_template_rewrite CEL rejects it at a path
      rule's route action
