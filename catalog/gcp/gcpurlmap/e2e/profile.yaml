apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpurlmap
spec:
  # Composed scenarios: the harness deploys GcpBackendService (and its
  # GcpHealthCheck prerequisite) via the kind registry; the features
  # scenario additionally composes two EXTERNAL_MANAGED backend fixtures
  # through its e2e-prerequisites annotation to exercise the full
  # per-route traffic-management surface (weighted header attribution,
  # timeouts/retries, mirroring, CORS, route-scoped CDN caching, fault
  # injection). Deploy -> compute urlMaps.get verify -> destroy -> verify
  # 404, on both provisioners.
  #
  #
  # Offline-proven-only arm (deferred, with unblock condition):
  #   - max_stream_duration: LIVE-VERIFIED rejection — the API refuses it
  #     unless the backend service's load-balancing scheme is
  #     INTERNAL_SELF_MANAGED (Traffic Director), and the harness has no
  #     Traffic Director fixture chain. Unblock: an INTERNAL_SELF_MANAGED
  #     backend + URL map lane.
  #
  # Awaiting re-proof: the kind gained its regional arm
  # (google_compute_region_url_map behind spec.region), and the module now
  # count-gates two resources. The regional scenario proves the regional
  # family over a regional backend-service fixture, with the one knob only
  # the regional map honors (path_template_rewrite in a path matcher's
  # default route action, paired with a path_template_match route rule) and
  # a service-only routing test. The classic scenarios re-prove the global
  # arm unchanged (offline plan equivalence already shows identical plans).
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 25
