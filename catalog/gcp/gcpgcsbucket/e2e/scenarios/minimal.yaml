# GcpGcsBucket scenario: the minimal private bucket — UBLA, enforced
# public-access prevention, force_destroy so the ephemeral bucket tears
# down cleanly. project_id is deliberately omitted (ambient project).
# The cloud-side bucketName carries ${E2E_RUN_ID} because GCS names are
# globally unique across ALL of GCP.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGcsBucket
metadata:
  name: planton-oss-e2e-gcsb-minimal
  id: planton-oss-e2e-gcsb-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpgcsbucket
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  bucketName: planton-oss-e2e-min-${E2E_RUN_ID}
  location: us-central1
  uniformBucketLevelAccessEnabled: true
  publicAccessPrevention: enforced
  forceDestroy: true
  labels:
    e2e-suite: gcp
