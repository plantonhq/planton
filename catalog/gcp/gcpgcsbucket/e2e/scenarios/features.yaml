# GcpGcsBucket scenario: the depth arms — versioning with bounded history,
# the explicit-zero lifecycle contract (ageDays: 0 + prefix = TTL-on-write,
# proving the send-zero flags land identically on both engines), a
# size-banded transition rule, autoclass, a shortened soft-delete window,
# CSEK write-restriction enforcement (no KMS dependency), an explicit
# deletion policy, and an additive IAM member resolved live from the
# GcpServiceAccount prerequisite.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGcsBucket
metadata:
  name: planton-oss-e2e-gcsb-features
  id: planton-oss-e2e-gcsb-features
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpgcsbucket
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  bucketName: planton-oss-e2e-feat-${E2E_RUN_ID}
  location: us-central1
  uniformBucketLevelAccessEnabled: true
  publicAccessPrevention: enforced
  forceDestroy: true
  versioningEnabled: true
  autoclass:
    enabled: true
    terminalStorageClass: ARCHIVE
  softDeletePolicy:
    retentionDurationSeconds: 604800
  lifecycleRules:
    # Bounded version history: keep the 2 newest noncurrent versions.
    - action:
        type: Delete
      condition:
        withState: ARCHIVED
        numNewerVersions: 2
    # Explicit zero age + prefix: delete tmp/ objects on the next sweep —
    # the presence-vs-zero contract proven live.
    - action:
        type: Delete
      condition:
        ageDays: 0
        matchesPrefix:
          - tmp/
    # Reclaim abandoned multipart uploads after 7 days.
    - action:
        type: AbortIncompleteMultipartUpload
      condition:
        ageDays: 7
    # Size band: only large current objects age into COLDLINE — proves the
    # 7.x size conditions land on both engines. (Autoclass owns the general
    # transitions; this rule's SetStorageClass would conflict, so it stays
    # a Delete on very large tmp uploads instead.)
    - action:
        type: Delete
      condition:
        ageDays: 30
        sizeAboveBytes: 1073741824
        matchesPrefix:
          - uploads/
  # New objects may not use customer-supplied (raw) keys — the mandatory
  # half of the encryption posture, with no KMS dependency in this scenario.
  encryptionEnforcement:
    customerSuppliedRestrictionMode: FullyRestricted
  # Explicit provider-default deletion policy: proves the field round-trips.
  deletionPolicy: DELETE
  iamMembers:
    - role: roles/storage.objectViewer
      member:
        valueFrom:
          kind: GcpServiceAccount
          name: planton-oss-e2e-gsa-prereq
          fieldPath: status.outputs.member
  labels:
    e2e-suite: gcp
