# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpgcsbucket
spec:
  gcp:
    groups:
      - purpose: EnableStorageApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling storage.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageBucket
        permissions:
          - storage.buckets.create
          - storage.buckets.get
          - storage.buckets.update
          - storage.buckets.delete
        provenance: derived
        notes: Covers google_storage_bucket and google_storage_notification -- bucket create/read/update/delete, lifecycle and website configuration, and notification configuration, all bucket-scoped operations.
      - purpose: GrantBucketIam
        permissions:
          - storage.buckets.getIamPolicy
          - storage.buckets.setIamPolicy
        provenance: derived
        condition:
          spec_field_set: iam_members
        notes: Covers google_storage_bucket_iam_member, which reads and rewrites the bucket policy for each iam_members grant (the 02-static-website preset's allUsers objectViewer).
      - purpose: ManageFolders
        permissions:
          - storage.folders.create
          - storage.folders.get
          - storage.folders.delete
        provenance: derived
        condition:
          spec_field_set: folders
        notes: Covers google_storage_folder, one per folders entry -- hierarchical-namespace buckets manage folders as their own resources.
      - purpose: ManageManagedFolders
        permissions:
          - storage.managedFolders.create
          - storage.managedFolders.get
          - storage.managedFolders.delete
        provenance: derived
        condition:
          spec_field_set: managed_folders
        notes: Covers google_storage_managed_folder, one per managed_folders entry, managed as its own resource.
      - purpose: PublishNotificationsPrerequisite
        permissions:
          - pubsub.topics.getIamPolicy
        provenance: derived
        condition:
          spec_field_set: notifications
        notes: Notifications (the 04-event-driven-pipeline preset) publish from the project's Cloud Storage service agent, which must hold pubsub.topics.publish on the target topic -- a grant made on the topic (a separate component), not by this module; the provider only verifies the topic. Listed for visibility, not held by this module's apply.
