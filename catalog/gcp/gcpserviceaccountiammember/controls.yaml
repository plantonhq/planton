# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: gcpserviceaccountiammember
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The grant stores no customer data -- it is one (role, member) entry in the service account's IAM policy, control-plane metadata Google holds on its own encrypted infrastructure.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest exists to key (see enc-at-rest); the resource exposes no Cloud KMS surface.
    - control_id: enc-in-transit
      status: not_applicable
      notes: A policy entry terminates no connections -- it is consulted inside IAM's authorization checks, never on a wire the operator configures.
    - control_id: no-public-access
      status: configurable
      field_path: member
      evidence:
        type: spec_validation
        reference: The modules' member-format validation admits allUsers and allAuthenticatedUsers alongside the identity-scoped formats, so public exposure is always an explicit, reviewable value in the manifest -- never a default or a side effect.
      notes: On a service account the stakes are sharper than on most resources -- a public grant of an impersonation role hands the account's entire identity to the internet, which is why the component's own documentation calls those literals never appropriate on a service account in practice. Review any manifest carrying them as an incident, not a configuration.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network path exists to restrict -- IAM authorization is identity-based, not source-based. Network posture for whatever the impersonated account reaches lives on those resources' own controls.
    - control_id: edge-protection
      status: not_applicable
      notes: The grant receives no inbound traffic; there is no request path for a WAF to front.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: This component IS role-based access control on the account's resource side -- one role to one member -- and managing the grant itself authorizes against iam.serviceAccounts.getIamPolicy and setIamPolicy on the target account, grantable down to the single service account; no unauthenticated management path exists.
      notes: Account-scoped grants are the least-privilege form of service-account usage control -- the project-level equivalent of roles/iam.serviceAccountUser allows acting as EVERY account in the project, while this grant names exactly one. Compose with GcpIamCustomRole (its name output feeds role) when a predefined usage role is still too broad.
    - control_id: workload-identity
      status: not_applicable
      notes: Nothing authenticates through a grant -- it consumes identities as grantees and issues no credentials. The roles/iam.workloadIdentityUser + principalSet:// pairing this kind grants is exactly how a keyless federated workload (a GitHub repository, an external OIDC identity) GAINS impersonation of the account; the keyless posture itself lives on the workload identity pool and provider resources and on the account's own key discipline.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The grant carries no authentication path to disable. The impersonation and token-creator grants it makes are the keyless replacement for exported service-account keys, but retiring those keys happens on the GcpServiceAccount resource, not here.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every create and destroy is a SetIamPolicy call on the service account, landing in Cloud Audit Logs (Admin Activity) unconditionally; Admin Activity logging cannot be disabled.
      notes: Admin Activity records changes TO the policy (who granted what to whom, with the etag output usable for correlation). The impersonation events the grant enables -- who actually minted tokens as the account -- are Data Access-level IAM logging, opt-in and project-wide, outside this resource.
    - control_id: monitoring-integration
      status: not_applicable
      notes: A single policy entry emits no metrics and has no export knob. Grant hygiene (unused impersonation paths, over-broad usage roles) is IAM recommender and Policy Analyzer territory, operating on whole policies rather than this resource.
    - control_id: backup-recovery
      status: not_applicable
      notes: The grant is declarative configuration fully re-creatable from source control; there is no data to back up or restore.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The IAM policy is global control-plane metadata Google replicates as part of the platform; no failure-domain choice exists on the resource.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither GCP nor this spec offers a deletion-protection flag for an IAM grant -- every field is immutable and destroy subtracts exactly this (role, member[, condition]) pair. Removal revokes the access path the moment it lands (a deleted workloadIdentityUser grant stops a CI/CD pipeline's impersonation immediately), so plan removals as deliberately as grants; re-creating from the manifest takes seconds.
    - control_id: managed-patching
      status: not_applicable
      notes: There is no software surface here to patch; IAM's evaluation engine is Google's own infrastructure, patched as part of the platform.
