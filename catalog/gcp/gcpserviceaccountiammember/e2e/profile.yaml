apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpserviceaccountiammember
spec:
  # Composed grant on the account's own IAM policy: the harness deploys the
  # GcpServiceAccount prerequisite, resolves BOTH the grant's target
  # (service_account_id ← the account's `name` output) and its member
  # (← the account's `member` output) from the same node — one prerequisite
  # proving both reference paths — then runs deploy → getIamPolicy verify →
  # destroy → verify the (role, member) pair is gone. Control-plane only;
  # seconds per phase. The additive grant never touches other bindings.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
