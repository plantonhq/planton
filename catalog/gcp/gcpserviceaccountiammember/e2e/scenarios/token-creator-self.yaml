# Composed GcpServiceAccountIamMember scenario. Both service_account_id and
# member are value_from references to the SAME GcpServiceAccount prerequisite
# (declared in the kind registry): the grant lets the account mint short-lived
# tokens as itself — a real self-impersonation pattern — while proving both
# reference paths (the `name` output feeding the target, the `member` output
# feeding the grantee) with a single prerequisite kind.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpServiceAccountIamMember
metadata:
  name: planton-oss-e2e-gcpsaim-smoke
  id: planton-oss-e2e-gcpsaim-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpserviceaccountiammember
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  serviceAccountId:
    valueFrom:
      kind: GcpServiceAccount
      name: planton-oss-e2e-gsa-prereq
      fieldPath: status.outputs.name
  role:
    value: roles/iam.serviceAccountTokenCreator
  member:
    valueFrom:
      kind: GcpServiceAccount
      name: planton-oss-e2e-gsa-prereq
      fieldPath: status.outputs.member
