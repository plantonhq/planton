syntax = "proto3";

package dev.planton.gcp.gcpredisinstance.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpredisinstance/v1alpha1/outputs.proto";
import "catalog/gcp/gcpredisinstance/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-redis-instance
message GcpRedisInstance {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpRedisInstance'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpRedisInstanceSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpRedisInstanceStatus status = 5;
}

//gcp-redis-instance status
message GcpRedisInstanceStatus {
  //outputs
  GcpRedisInstanceOutputs outputs = 1;
}
