syntax = "proto3";

package dev.planton.gcp.gcpredisinstance.v1alpha1;

import "shared/options/options.proto";

// GcpRedisInstanceStackOutputs captures observable values produced after
// provisioning a Memorystore for Redis instance.
message GcpRedisInstanceStackOutputs {
  // Hostname or IP address of the primary Redis endpoint.
  // Clients connect to this address for read and write operations.
  string host = 1;

  // Port number of the primary Redis endpoint (typically 6379).
  int32 port = 2;

  // Hostname or IP address of the read replica endpoint.
  // Only populated when tier is STANDARD_HA with read replicas enabled.
  // Clients can direct read-only traffic here to reduce load on the primary.
  string read_endpoint = 3;

  // Port number of the read replica endpoint.
  // Only populated when tier is STANDARD_HA with read replicas enabled.
  int32 read_endpoint_port = 4;

  // Zone where the Redis primary is currently running.
  // For STANDARD_HA, this may change after a failover event.
  string current_location_id = 5;

  // Redis AUTH string for client authentication.
  // Only populated when auth_enabled is true.
  // This value is generated and rotated by GCP automatically.
  // Treat as a secret -- do not log or expose in UIs.
  string auth_string = 6 [(dev.planton.shared.options.sensitive) = true];

  // PEM-encoded CA certificates protecting the server endpoint.
  // Only populated when transit_encryption_mode is SERVER_AUTHENTICATION.
  // Clients must install these as trust anchors to complete the TLS
  // handshake — this is the material every TLS-enabled consumer needs.
  repeated string server_ca_certs = 7;

  // Cloud IAM identity (format "serviceAccount:<email>") used by import and
  // export operations. Grant this identity access to Cloud Storage buckets
  // used for RDB import/export. May change on CMEK rotation.
  string persistence_iam_identity = 8;

  // The CIDR range actually in use by the instance. Populated whether
  // reserved_ip_range was set explicitly or auto-selected by GCP — the
  // value to consult when planning non-overlapping address space.
  string effective_reserved_ip_range = 9;

  // Name of the Redis instance in GCP — the identity handle API callers and
  // automation use to address the instance.
  string instance_name = 10;

  // Region hosting the instance (plain region name, e.g. "us-central1") —
  // regional kinds export it so API callers can construct the instance's
  // locations path without re-deriving it from a zone.
  string region = 11;
}
