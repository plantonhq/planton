# BASIC-tier leaf over direct peering: the smallest Memorystore shape, peered
# to the run-scoped prerequisite VPC. Exercises the ambient-project contract
# (no spec.project_id), the VPC reference wiring, and the user-label merge.
# Deletion protection is explicitly disabled (the spec defaults it TRUE) so
# the ephemeral create -> verify -> destroy cycle can tear down without a
# two-step disable.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpRedisInstance
metadata:
  name: planton-oss-e2e-gcpred-basic
  id: planton-oss-e2e-gcpred-basic
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpredisinstance
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  instanceName: planton-oss-e2e-red-basic-${E2E_RUN_ID}
  region: us-central1
  tier: BASIC
  memorySizeGb: 1
  redisVersion: REDIS_7_2
  authorizedNetwork:
    valueFrom:
      kind: GcpVpcNetwork
      name: planton-oss-e2e-gcpvpc-prereq
      fieldPath: status.outputs.network_self_link
  labels:
    team: platform-e2e
  maintenanceWindow:
    day: SUNDAY
    hour: 3
    minute: 30
    description: e2e window pinned to the minute
  deletionProtection: false
  deletionPolicy: DELETE
