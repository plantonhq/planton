apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpbinaryauthorizationattestor
spec:
  # Proven live on both engines (2026-11-19): a PGP attestor and a Cloud KMS
  # signing attestor, each with the note it creates, deployed, re-described in
  # place and destroyed by an identity holding only this kind's permissions
  # manifest, with the re-plan clean. The KMS arm needs
  # cloudkms.cryptoKeys.get: the provider reads the key before its version.
  # The PEM arm over an existing note stays offline-only.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
