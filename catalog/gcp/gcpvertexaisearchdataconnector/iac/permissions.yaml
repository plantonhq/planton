# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpvertexaisearchdataconnector
spec:
  gcp:
    groups:
      - purpose: EnableDiscoveryEngineApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
        provenance: derived
        notes: Covers google_project_service enabling discoveryengine.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageDataConnector
        permissions:
          - discoveryengine.collections.create
          - discoveryengine.collections.get
          - discoveryengine.collections.delete
          - discoveryengine.dataConnectors.get
          - discoveryengine.dataConnectors.update
          - discoveryengine.dataStores.get
          - discoveryengine.operations.get
        provenance: derived
        notes: Covers google_discovery_engine_data_connector (Pulumi discoveryengine.DataConnector) -- the set-up call that creates the collection and its data stores, read/refresh of the connector and the stores it created, the in-place PATCHes (schedule, parameters, modes, action side), destroy of the collection under deletion_policy DELETE (ABANDON and PREVENT call no API), and the long-running operations the provider polls. The Discovery Engine service agent, not the runner, reads the source credentials from Secret Manager.
