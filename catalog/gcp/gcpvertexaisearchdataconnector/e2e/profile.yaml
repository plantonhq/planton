apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpvertexaisearchdataconnector
spec:
  # Deferred: a data connector authenticates to a third-party source tenant
  # (Jira, ServiceNow, Confluence, ...) through credentials stored in Secret
  # Manager, and the harness project holds no source tenant and no such
  # secrets; Google's first-party connectors (BigQuery, Google Drive) need a
  # Gemini Enterprise license on the project the harness cannot assume.
  # Offline bar met: both modules build and validate, offline plans for the
  # reference manifest and both scenarios (Jira federated with actions,
  # ServiceNow periodic ingestion) are clean on the pinned provider, and the
  # accounting is total. Facts a live run confirms when a tenant exists:
  # (1) setup creates the collection and one data store per entity and the
  # entity_data_stores output lists them in manifest order on both engines;
  # (2) the params map and the JSON entity params RE-PLAN CLEAN under the
  # apply-idempotency gate (Google normalizes the JSON; the provider
  # suppresses struct-field diffs); (3) static_ip_addresses populate when
  # static_ip_enabled; (4) destroy deletes the connector, its collection,
  # and the created stores under deletion_policy DELETE.
  tier: 2
  status: deferred
  deferred_reason: a data connector authenticates to a third-party source tenant through Secret Manager secrets the harness project does not hold; proven offline on the pinned provider
  validated_provisioners: []
  timeout_minutes: 60
