# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpvertexaisearchdataconnector
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Vertex AI Search encrypts the data stores a connector fills at rest with Google-managed keys without configuration; the connector's credentials live in Secret Manager, encrypted there.
    - control_id: enc-at-rest-cmk
      status: configurable
      field_path: kms_key_name
      evidence:
        type: spec_default
        reference: Unset means Google-managed encryption; a Cloud KMS key in the collection's location encrypts every data store the connector creates under the customer-managed key. Immutable for the connector's life.
      notes: The 02-servicenow-periodic-cmek preset references a GcpKmsKey. The Discovery Engine service agent needs encrypt/decrypt on the key as a prerequisite.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Google's connectors reach the source over TLS and the Discovery Engine API is TLS-only; there is no plaintext path.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A connector and its collection have no address of their own; they are reached only through the Discovery Engine API under IAM.
    - control_id: restricted-ingress
      status: configurable
      field_path: static_ip_enabled
      evidence:
        type: spec_default
        reference: Unset means the connector reaches the source from Google's shared egress; static_ip_enabled gives it fixed egress addresses (exported as static_ip_addresses) that the source can allowlist, and destination_configs can route through private connectivity.
      notes: The 01-jira-federated-actions preset enables static egress addresses.
    - control_id: edge-protection
      status: not_applicable
      notes: No edge is served; the connector is a client of the source.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Managing the connector and reading its collection are governed by Discovery Engine IAM permissions; the connector reads the source with the credentials named in params, which the Discovery Engine service agent fetches from Secret Manager under its own IAM grant.
    - control_id: workload-identity
      status: not_applicable
      notes: The connector authenticates to the source with the source's own credential (OAuth client, service user), named as Secret Manager secrets; there is no cloud workload identity to bind.
    - control_id: no-legacy-auth
      status: configurable
      field_path: params
      evidence:
        type: spec_default
        reference: The auth_type parameter picks the source's authentication -- OAuth flows or, where a source only offers them, user-name and password grants; the credential material is always a Secret Manager secret, never a spec value.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The connector has no end users; EUA and FEDERATED_AND_EUA connector modes carry the searching user's identity to the source at query time, a per-engine concern.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Creating, changing, and deleting the connector and its collection land in Cloud Audit Logs (Admin Activity) unconditionally; sync runs and their errors are reported on the connector and in Cloud Logging.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Discovery Engine reports the connector's state, last sync time, and errors on the resource and emits indexing metrics per created data store to Cloud Monitoring without configuration.
    - control_id: backup-recovery
      status: not_applicable
      notes: The connector is declarative and re-creatable from source control; the data it indexes is re-synced from the source, never restored.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The connector and its stores live in a Discovery Engine multi-region (global, us, or eu) and are replicated across it by Google; there is no zonal placement to configure.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Unset means DELETE -- the connector, its collection, and every data store it created are deleted, indexed data included; PREVENT makes any destroying plan fail; ABANDON removes everything from management while syncing continues.
      notes: The 02-servicenow-periodic-cmek preset sets PREVENT.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Google's connectors are fully Google-operated; there is no software surface the customer patches.
