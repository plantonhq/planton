# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_org_policy_custom_constraint:
    mappings:
      # The provider's name carries Google's custom. prefix; the spec takes
      # the bare constraint_name and the module adds the prefix, so it can
      # never be doubled or forgotten.
      - spec: spec.constraint_name
        arg: name
      # The parent is always an organization; the spec takes the numeric id
      # and the module renders organizations/{id}.
      - spec: spec.organization_id
        arg: parent
