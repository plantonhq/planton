apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcporgpolicycustomconstraint
spec:
  # A custom constraint's parent is always the organization. Proven live on
  # both engines (2026-11-23, test organization planton-e2e.com) as the
  # declared identity, which the harness grants roles/orgpolicy.policyAdmin on
  # the organization; the second act changes the description, judged in place
  # from the organization's Admin Activity log (UpdateCustomConstraint). The
  # scenario names the constraint with the alphanumeric run id, since the name
  # takes letters and digits only. Nothing enforces the lane's constraint, so
  # it changes nothing in the organization while it stands.
  tier: 2
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
