apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcporgpolicycustomconstraint
spec:
  # A custom constraint's parent is always the organization. Its lane runs as
  # the declared identity, which the harness grants
  # roles/orgpolicy.policyAdmin on the test organization
  # (PLANTON_E2E_GCP_ORGANIZATION_ID); the second act changes the description
  # in place, judged from the organization's Admin Activity log. Offline bar
  # met: both modules build and validate, offline plans for the reference
  # manifest and the scenario are clean on the pinned provider, and the
  # accounting is total. validated_provisioners stays empty until the live
  # lanes actually run.
  tier: 2
  status: deferred
  deferred_reason: the live lanes wait for a test organization exported as PLANTON_E2E_GCP_ORGANIZATION_ID, where the harness grants the declared identity roles/orgpolicy.policyAdmin; offline plans only until then
  validated_provisioners: []
  timeout_minutes: 15
