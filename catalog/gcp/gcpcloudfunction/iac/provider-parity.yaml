# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_cloudfunctions2_function:
    mappings:
      # Renames: the spec says what each field IS, where the provider
      # inherits terser API names.
      - spec: spec.function_name
        arg: name
      - spec: spec.project_id
        arg: project
      - spec: spec.region
        arg: location

      # Build-time env vars: the spec name distinguishes them from the
      # runtime service_config.environment_variables.
      - spec: spec.build_config.build_environment_variables
        arg: build_config.environment_variables

      # The trigger wrapper: the spec groups the trigger choice
      # (trigger_type) with the event configuration; the provider takes
      # the event block at the top level. Children match by name below
      # the mapping.
      - spec: spec.trigger.event_trigger
        arg: event_trigger

      # Scaling bounds: the spec groups them in one message; the provider
      # flattens them onto service_config.
      - spec: spec.service_config.scaling.min_instance_count
        arg: service_config.min_instance_count
      - spec: spec.service_config.scaling.max_instance_count
        arg: service_config.max_instance_count

  google_cloud_run_service_iam_member:
    # Instantiated by the allow_unauthenticated toggle: the boolean IS the
    # allUsers invoker grant on the UNDERLYING Cloud Run service (Gen 2
    # functions are served by Cloud Run) -- every argument is wired by
    # the module.
    mappings:
      - spec: spec.service_config.allow_unauthenticated
        arg: member
    exclusions:
      - arg: role
        reason: >-
          fixed to roles/run.invoker -- the public-serving semantics of
          the allow_unauthenticated toggle, never user surface
      - arg: service
        reason: wired by the module to the function it creates (the Cloud Run service shares the function's name) -- never user surface
      - arg: location
        reason: wired by the module to the function's region -- never user surface
      - arg: project
        reason: wired by the module to the function's project -- never user surface
      - arg: condition.title
        reason: >-
          the public grant is unconditioned by design; conditioned
          invoker grants to specific identities are IAM-family territory
      - arg: condition.expression
        reason: the public grant is unconditioned by design; see condition.title
      - arg: condition.description
        reason: the public grant is unconditioned by design; see condition.title

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables the five APIs a Gen 2
      deploy exercises (cloudfunctions, cloudbuild, run, artifactregistry,
      eventarc) with fixed arguments (disable_on_destroy false so
      destroying one function never disables an API project-wide); not
      spec surface.

  # One secret per service_config.secret_environment_variables[].value: the module creates it, stores the value as a
  # version, and grants the runtime identity read access to that secret
  # alone. Only the value itself is spec surface.
  google_secret_manager_secret:
    internal: >-
      created by the module per service_config.secret_environment_variables[].value -- its id
      (function, region, function name, key), user-managed replication in the function's
      region, and attribution labels are all derived from the function,
      never authored.
  google_secret_manager_secret_iam_member:
    internal: >-
      the roles/secretmanager.secretAccessor grant on each stored secret
      for the function's runtime identity (service_config.service_account_email, else the project's Compute Engine default) -- derived,
      never authored.
  google_secret_manager_secret_version:
    specRoot: spec.service_config.secret_environment_variables
    mappings:
      - spec: spec.service_config.secret_environment_variables.value
        arg: secret_data
    exclusions:
      - arg: secret
        reason: the module's own secret for this variable (derived), never authored
      - arg: project
        reason: follows the function's project through the secret it belongs to
      - arg: enabled
        reason: a stored value is always the enabled version the variable is pinned to
      - arg: is_secret_data_base64
        reason: the stored value is the variable's text as resolved, never base64-encoded
      - arg: secret_data_wo
        reason: write-only arm of secret_data; the module pins the variable to the stored version, which needs the version resource's own lifecycle
      - arg: secret_data_wo_version
        reason: companion of the unused write-only arm (see secret_data_wo)
      - arg: deletion_policy
        reason: a replaced or removed version is deleted (the provider default) -- the copy is derived, and a disabled or abandoned version would outlive the value's source

specExclusions:
  - field: spec.trigger.trigger_type
    reason: >-
      the trigger choice selector -- HTTP means no event_trigger block is
      sent and EVENT_TRIGGER requires one (enforced by CEL); the provider
      has no argument carrying the choice, it is implied by the
      event_trigger block's presence
  - field: spec.build_config.update_policy
    reason: >-
      the provider expresses the runtime-patching choice as a pair of
      marker blocks carrying no configurable arguments between them
      (automatic_update_policy is empty; on_deploy_update_policy has only
      the computed runtime_version); the spec collapses the choice to one
      enum and the modules emit the matching marker block
