# Consumer-scoped GcpServerlessVpcConnector for the vpc-connector-egress
# scenario. Uses network+ipCidrRange on 10.8.2.0/28 (outside other E2E
# ranges). metadata.name stays fixed for FK resolution from the function
# scenario's valueFrom.
#
# 2026-08-11: region moved us-central1 → us-east1. Connector fleets are
# e2-class VMs, and us-central1's e2 zonal pools answered
# ZONE_RESOURCE_POOL_EXHAUSTED twice this week (audit-log verified; the
# connector kind's own scenarios moved to us-east1 on the same evidence).
# The whole function chain is self-contained, so its region is a free
# variable — pinned to measured capacity.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpServerlessVpcConnector
metadata:
  name: planton-oss-e2e-gcpvpcconn-prereq
  id: planton-oss-e2e-gcpvpcconn-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpserverlessvpcconnector
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-east1
  connectorName: e2e-connp-${E2E_RUN_ID}
  network:
    valueFrom:
      kind: GcpVpcNetwork
      name: planton-oss-e2e-gcpvpcnetwork-prereq
      fieldPath: status.outputs.network_name
  ipCidrRange: 10.8.2.0/28
  machineType: e2-micro
  minInstances: 2
  maxInstances: 3
