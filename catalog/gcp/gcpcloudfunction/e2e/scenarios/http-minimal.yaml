# Minimal public HTTP GcpCloudFunction scenario. The source bucket/object
# are staged by the test entrypoint before the runner starts (see
# e2e/profile.yaml); the ${E2E_RUN_ID} token here expands to the same
# engine-scoped value the staging code computes. project_id is deliberately
# omitted (ambient project). Function names are project-scoped with no
# soft-delete reservation; the cloud-side name still carries ${E2E_RUN_ID}
# so an orphaned run never blocks the next one.
# 2026-08-11: region moved us-central1 → us-east1 with the whole function
# chain (us-central1 e2 zonal stockout — see the connector prerequisite).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudFunction
metadata:
  name: planton-oss-e2e-cldfunc-http
  id: planton-oss-e2e-cldfunc-http
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcloudfunction
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-east1
  functionName: e2e-fn-http-${E2E_RUN_ID}
  description: Ephemeral function created by the Planton E2E harness; safe to delete
  buildConfig:
    runtime: python312
    entryPoint: handler
    source:
      storageSource:
        bucket:
          value: planton-oss-e2e-cldfunc-src-${E2E_RUN_ID}
        object: functions/hello.zip
  serviceConfig:
    availableMemory: 256M
    timeoutSeconds: 60
    scaling:
      minInstanceCount: 0
      maxInstanceCount: 1
    allowUnauthenticated: true
  trigger:
    triggerType: HTTP
  # Destroy really destroys in E2E: the live lanes prove the full lifecycle.
  deletionPolicy: DELETE
