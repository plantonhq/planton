# GcpCloudFunction secret-value scenario: the minimal public HTTP function
# plus one literal variable and one stored secret value. The module must
# create the variable's Secret Manager secret (replicated in us-east1),
# store the value as a version, grant the project's Compute Engine default
# service account secretAccessor on that secret alone (no
# service_account_email is set), and point the variable at the stored
# version -- the function carries a secret reference, never the value.
# Destroy removes the secret with the function. The value is a literal
# because this lane runs without a platform; on Planton the field takes only
# a $secret/ reference. Source staging is the http-minimal scenario's (see
# e2e/profile.yaml).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudFunction
metadata:
  name: planton-oss-e2e-cldfunc-secret-env
  id: planton-oss-e2e-cldfunc-secret-env
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcloudfunction
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-east1
  functionName: e2e-fn-secret-${E2E_RUN_ID}
  description: Ephemeral function created by the Planton E2E harness; safe to delete
  buildConfig:
    runtime: python312
    entryPoint: handler
    source:
      storageSource:
        bucket:
          value: planton-oss-e2e-cldfunc-src-${E2E_RUN_ID}
        object: functions/hello.zip
  serviceConfig:
    availableMemory: 256M
    timeoutSeconds: 60
    scaling:
      minInstanceCount: 0
      maxInstanceCount: 1
    environmentVariables:
      LOG_LEVEL: info
    secretEnvironmentVariables:
      - key: E2E_TOKEN
        value: e2e-not-a-real-secret
    allowUnauthenticated: true
  trigger:
    triggerType: HTTP
  deletionPolicy: DELETE
