syntax = "proto3";

package dev.planton.gcp.gcpcloudfunction.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpcloudfunction/v1alpha1/outputs.proto";
import "catalog/gcp/gcpcloudfunction/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-cloud-function
message GcpCloudFunction {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpCloudFunction'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpCloudFunctionSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpCloudFunctionStatus status = 5;
}

//gcp-cloud-function status
message GcpCloudFunctionStatus {
  //outputs
  GcpCloudFunctionOutputs outputs = 1;
}
