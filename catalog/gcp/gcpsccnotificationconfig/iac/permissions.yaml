# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpsccnotificationconfig
spec:
  gcp:
    groups:
      - purpose: EnableSecurityCenterApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
          - resourcemanager.projects.get
        provenance: derived
        reach: target
        privilege: ordinary
        notes: Covers google_project_service enabling securitycenter.googleapis.com on a project config's project (scope.project_id, or no scope at all); a folder or organization config enables nothing. disable_on_destroy is false, so the disable permission is never needed. The provider reads the project with resourcemanager.projects.get before its services on every refresh, so a re-plan or destroy needs it (measured live).
      - purpose: ManageNotificationConfig
        permissions:
          - securitycenter.notificationconfig.create
          - securitycenter.notificationconfig.get
          - securitycenter.notificationconfig.update
          - securitycenter.notificationconfig.delete
        provenance: derived
        reach: target
        privilege: ordinary
        notes: Covers the project, folder, and organization notification-config resources (Pulumi securitycenter.V2*NotificationConfig) -- create, read on every refresh, PATCH updates of description, topic, and filter, delete on destroy. Held at the scope (roles/securitycenter.notificationConfigEditor there). The provider-default project lookup reads provider configuration only and needs no permission.
      - purpose: LetSecurityCenterPublishToTheTopic
        permissions:
          - pubsub.topics.get
          - pubsub.topics.getIamPolicy
          - pubsub.topics.setIamPolicy
        provenance: derived
        reach: target
        privilege: ordinary
        notes: Creating a notification config makes Security Command Center grant its own service account roles/pubsub.publisher on the topic, as the caller -- so the caller must read and set the topic's IAM policy (roles/pubsub.admin on the topic carries all three). Measured live -- without them Google refuses the create with "User does not have permission to access PubSub topic".
