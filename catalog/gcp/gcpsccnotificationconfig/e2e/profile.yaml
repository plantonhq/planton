apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpsccnotificationconfig
spec:
  # Proven live on both engines (2026-11-19): a project notification config
  # publishing findings matching no real category to a topic, deployed,
  # re-described in place and destroyed by an identity holding only this
  # kind's permissions manifest, with the re-plan clean. Google grants
  # Security Command Center publish on the topic as the caller, so the caller
  # needs the topic's IAM. Security Command Center writes no audit entry for
  # notification configs, so the update is the engine's plan and the
  # verifier's read. Folder and organization scopes stay offline-only.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
