# The second act of project-to-topic.yaml: the same notification config with
# a new description, updated in place (the scope and id recreate it). Not a
# scenario of its own (the second-act annotation keeps discovery from running
# it as a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSccNotificationConfig
metadata:
  name: planton-oss-e2e-gcpsccn-project
  id: planton-oss-e2e-gcpsccn-project
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpsccnotificationconfig
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-second-act: project-to-topic.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
    planton.dev/e2e-required-env: PLANTON_E2E_GCP_SCC_PROJECT_ID
    planton.dev/e2e-prerequisites: "catalog/gcp/gcpsccnotificationconfig/e2e/prerequisites/topic.yaml"
  tags:
    - planton-e2e
spec:
  scope:
    projectId:
      value: ${E2E_ENV:PLANTON_E2E_GCP_SCC_PROJECT_ID}
  configId: e2e-gcpsccn-${E2E_RUN_ID}
  description: Planton E2E notification config, updated in place
  pubsubTopic:
    valueFrom:
      kind: GcpPubSubTopic
      name: planton-oss-e2e-gcpsccn-topic
      fieldPath: status.outputs.topic_id
  filter: category = "PLANTON_E2E_NO_SUCH_CATEGORY"
