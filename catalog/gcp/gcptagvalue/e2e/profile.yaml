apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcptagvalue
spec:
  # Proven live on both engines (2026-11-18), deployed, updated in place
  # (description) and destroyed by an identity holding only this kind's
  # permissions manifest, under a project-owned prerequisite key. Measured: the
  # key reference resolves to tagKeys/{id} once the key exports its id as
