# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcptagvalue
spec:
  gcp:
    groups:
      - purpose: ManageTagValue
        permissions:
          - resourcemanager.tagValues.create
          - resourcemanager.tagValues.get
          - resourcemanager.tagValues.update
          - resourcemanager.tagValues.delete
        provenance: derived
        notes: "Covers google_tags_tag_value (Pulumi tags.TagValue) -- the modules' only resource. create on first apply; get on every refresh and import; update when the description changes (parent and short_name are ForceNew and recreate instead); delete on destroy under deletion_policy DELETE (refused by Google while bindings exist; ABANDON and PREVENT call no delete API). Granted on the KEY's owner (organization or project); roles/resourcemanager.tagAdmin contains all four."
