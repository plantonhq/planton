syntax = "proto3";

package dev.planton.gcp.gcptagvalue.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcptagvalue/v1alpha1/outputs.proto";
import "catalog/gcp/gcptagvalue/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-tag-value
message GcpTagValue {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpTagValue'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpTagValueSpec spec = 4 [(buf.validate.field).required = true];
  GcpTagValueStatus status = 5;
}

message GcpTagValueStatus {
  GcpTagValueStackOutputs outputs = 1;
}
