syntax = "proto3";

package dev.planton.gcp.gcpsccmuteconfig.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpsccmuteconfig/v1alpha1/outputs.proto";
import "catalog/gcp/gcpsccmuteconfig/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-scc-mute-config
message GcpSccMuteConfig {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpSccMuteConfig'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpSccMuteConfigSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpSccMuteConfigStatus status = 5;
}

//gcp-scc-mute-config status
message GcpSccMuteConfigStatus {
  //stack-outputs
  GcpSccMuteConfigStackOutputs outputs = 1;
}
