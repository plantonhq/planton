# The second act of project-dynamic.yaml: the same mute rule with a new
# description, updated in place (the scope, id and type recreate it). Not a
# scenario of its own (the second-act annotation keeps discovery from running
# it as a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSccMuteConfig
metadata:
  name: planton-oss-e2e-gcpsccm-project
  id: planton-oss-e2e-gcpsccm-project
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpsccmuteconfig
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-second-act: project-dynamic.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
    planton.dev/e2e-required-env: PLANTON_E2E_GCP_SCC_PROJECT_ID
  tags:
    - planton-e2e
spec:
  scope:
    projectId:
      value: ${E2E_ENV:PLANTON_E2E_GCP_SCC_PROJECT_ID}
  muteConfigId: e2e-gcpsccm-${E2E_RUN_ID}
  description: Planton E2E mute rule, updated in place
  filter: category = "PLANTON_E2E_NO_SUCH_CATEGORY"
  type: DYNAMIC
