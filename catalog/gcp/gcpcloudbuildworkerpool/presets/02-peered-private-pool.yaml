apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudBuildWorkerPool
metadata:
  name: private-builds
spec:
  projectId:
    value: my-gcp-project
  location: us-central1
  networkConfig:
    peeredNetwork:
      valueFrom:
        kind: GcpVpcNetwork
        name: ci-vpc
        fieldPath: status.outputs.network_self_link
    peeredNetworkIpRange: /26
  workerConfig:
    machineType: e2-standard-4
    noExternalIp: true
