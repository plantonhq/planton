apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpcloudbuildworkerpool
spec:
  # Proven live on both engines (2026-11-18): a default (no network) pool
  # deployed, updated in place (renamed, its workers' disk grown) and destroyed
  # by an identity holding only this kind's permissions manifest, re-planning
  # clean with worker_config's computed fields unset. On a project whose Cloud
  # Build API was just turned on, the first create can fail while the Cloud
  # Build service agent is still getting its access (measured: "not_found:
  # service-<number>@gcp-sa-cloudbuild...: could not get machine type"); a
  # retry minutes later succeeds. The peered and
  # PSC arms stay offline-only (they need private services access or a
  # network attachment).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
