# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/componentcostprofile/v1.
# Rates from https://firebase.google.com/pricing (read 2026-09-17).
apiVersion: finops.planton.dev/v1
kind: ComponentCostProfile
metadata:
  name: gcpfirebaseappleapp
spec:
  billing_model: free
  cost_drivers: []
  estimate_exclusions:
    - Firebase Cloud Messaging is free at any volume -- registering the app and delivering push to it through APNs adds no meter
    - App Check with App Attest and DeviceCheck is free; both are Apple services with no price on either side
    - Debug tokens are free
  notes: "Registering an Apple app has no meter of its own: the Firebase Management API, App Check attestation with App Attest and DeviceCheck, and debug tokens are all free, and Cloud Messaging is free at any volume. What the app uses AFTER registration -- Firestore, Realtime Database, Authentication beyond its free tier, Cloud Storage for Firebase -- bills at each product's published rates on the components that create them, never on this one."
