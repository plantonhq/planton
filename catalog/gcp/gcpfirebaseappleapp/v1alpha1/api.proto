syntax = "proto3";

package dev.planton.gcp.gcpfirebaseappleapp.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpfirebaseappleapp/v1alpha1/outputs.proto";
import "catalog/gcp/gcpfirebaseappleapp/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-firebase-apple-app
message GcpFirebaseAppleApp {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpFirebaseAppleApp'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpFirebaseAppleAppSpec spec = 4 [(buf.validate.field).required = true];
  GcpFirebaseAppleAppStatus status = 5;
}

message GcpFirebaseAppleAppStatus {
  GcpFirebaseAppleAppStackOutputs outputs = 1;
}
