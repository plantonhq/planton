syntax = "proto3";

package dev.planton.gcp.gcpfirestoreindex.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpfirestoreindex/v1alpha1/outputs.proto";
import "catalog/gcp/gcpfirestoreindex/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-firestore-index
message GcpFirestoreIndex {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpFirestoreIndex'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpFirestoreIndexSpec spec = 4 [(buf.validate.field).required = true];
  GcpFirestoreIndexStatus status = 5;
}

message GcpFirestoreIndexStatus {
  GcpFirestoreIndexOutputs outputs = 1;
}
