apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpfirestoreindex
spec:
  # Composed scenarios: minimal deploys the GcpFirestoreDatabase
  # prerequisite and creates a simple composite index; enterprise arms the
  # Enterprise surface (search_config, MONGODB_COMPATIBLE_API, multikey)
  # against a MongoDB-dedicated ENTERPRISE database deployed as an
  # extra-instance fixture via the e2e-prerequisites annotation. Index
  # build is asynchronous but the resource creates quickly; the chain cost
  # is the database(s) (~1-2 minutes each).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
