# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: gcpfirestoreindex
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Index entries are stored data inside Firestore, which encrypts everything at rest by default -- including index and metadata overhead; encryption cannot be disabled.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: The encryption posture is the database's -- a CMEK database (GcpFirestoreDatabase kms_key_name) covers its indexes with the same key; the index exposes no KMS surface of its own.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The index has no connection surface of its own -- queries reach it through the database's TLS-only API, and index management runs over the TLS-only Firestore Admin API; the in-transit posture is assessed on GcpFirestoreDatabase.
    - control_id: no-public-access
      status: not_applicable
      notes: An index has no endpoint to expose; who can query through it is decided by the database's IAM and Security Rules posture, assessed on GcpFirestoreDatabase.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network ingress surface exists on an index; network-source restriction of the Firestore API is a VPC Service Controls perimeter decision at the project level.
    - control_id: edge-protection
      status: not_applicable
      notes: The index serves no HTTP traffic; there is no request surface for a web application firewall to filter.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Index create, read, and delete authorize against IAM datastore.schemas.* permissions per Google's Firestore IAM reference; querying through the index authorizes against the database's own IAM and Security Rules.
    - control_id: workload-identity
      status: not_applicable
      notes: The index runs no workloads and holds no credentials; callers authenticate to the Firestore APIs with their own identities.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The index carries no authentication paths to disable; api_scope selects which query API surface the index serves, not how callers authenticate.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Index create and delete through the Firestore Admin API land in Cloud Audit Logs (Admin Activity) unconditionally; Admin Activity logging cannot be disabled.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The index has no metric surface of its own -- build progress is observable through Firestore Admin operations, and the query and storage metrics it influences are database-level signals in Cloud Monitoring.
    - control_id: backup-recovery
      status: not_applicable
      notes: The index is declarative configuration over derived data, fully re-creatable from source control -- Firestore rebuilds the entries from the documents whenever the definition is applied; there is no primary data here to back up.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Index entries replicate with the database's location redundancy automatically; no failure-domain choice exists on the index.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Empty defaults to DELETE (the index is dropped and rebuildable); PREVENT makes destroy fail; ABANDON unmanages the index while it keeps serving queries.
      notes: Deleting an index destroys only derived data -- the documents are untouched -- but multi-field queries that depended on it start failing immediately, which is the real blast radius PREVENT guards against.
    - control_id: managed-patching
      status: not_applicable
      notes: There is no software surface on the index to patch; the Firestore fleet that builds and serves it is Google's own infrastructure, patched as part of the platform with no version or channel exposed here.
