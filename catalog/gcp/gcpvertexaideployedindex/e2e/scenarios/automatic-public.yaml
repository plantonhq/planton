# Deploys the prerequisite index onto the prerequisite public endpoint
# with automatic serving compute at minimum bounds — the catalog's first
# scenario FK-referencing two sibling kinds from the same family. The
# deployed_index_id MUST be run-scoped: GCP holds a failed/undeploying
# deployment's ID project-wide ("It will be deleted automatically, please
# retry again later") — the hold even survives deleting the parent
# endpoint, so a fixed ID 400s across engines and back-to-back runs. The
# ID class forbids hyphens (letter start, letters/numbers/underscores),
# so the underscore run-id token is used instead of the plain one.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVertexAiDeployedIndex
metadata:
  name: planton-oss-e2e-gcpvdidx-auto
  id: planton-oss-e2e-gcpvdidx-auto
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpvertexaideployedindex
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  location: us-central1
  deployedIndexId: planton_oss_e2e_${E2E_RUN_ID_UNDERSCORE}
  index:
    valueFrom:
      kind: GcpVertexAiIndex
      name: planton-oss-e2e-gcpvaidx-prereq
      fieldPath: status.outputs.index_id
  indexEndpoint:
    valueFrom:
      kind: GcpVertexAiIndexEndpoint
      name: planton-oss-e2e-gcpvaiep-prereq
      fieldPath: status.outputs.index_endpoint_id
  displayName: planton-oss-e2e-vdidx-auto-${E2E_RUN_ID}
  automaticResources:
    minReplicaCount: 1
    maxReplicaCount: 1
  # Explicit DELETE proves the client-side lever round-trips — on this
  # resource DELETE means undeploy (the provider defaults it
  # server-side; every scenario arms it).
  deletionPolicy: DELETE
