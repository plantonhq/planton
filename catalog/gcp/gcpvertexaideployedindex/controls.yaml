# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: gcpvertexaideployedindex
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The index data loaded onto the serving nodes is encrypted at rest with Google-managed keys, as all Vertex AI data is, without configuration.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Customer-managed encryption attaches to the referenced GcpVertexAiIndex and GcpVertexAiIndexEndpoint resources at their creation; the deployment -- a placement of one onto the other -- exposes no encryption surface of its own.
    - control_id: enc-in-transit
      status: not_applicable
      notes: Transport posture is the referenced index endpoint's control -- public endpoints serve HTTPS, VPC-peered private endpoints serve over the peered network. The deployment configures no transport surface.
    - control_id: no-public-access
      status: not_applicable
      notes: Whether queries arrive over the public internet or a private peered network is decided by the referenced GcpVertexAiIndexEndpoint; the deployment inherits that exposure and cannot change it.
    - control_id: restricted-ingress
      status: not_applicable
      notes: Network source scoping lives on the endpoint's topology (public vs VPC-peered). The deployment's reserved_ip_ranges field chooses which address ranges the serving nodes deploy INTO -- placement, not source restriction.
    - control_id: edge-protection
      status: not_applicable
      notes: There is no request-filtering attachment point on a deployed index; Cloud Armor attaches to load balancers, not Vertex AI query endpoints.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Management of the deployment (deploy, mutate, undeploy) is governed by Vertex AI IAM roles on the parent endpoint, and public-endpoint queries authorize as IAM calls -- both always active.
      notes: On VPC-peered private endpoints, auth_config layers JWT authorization onto the data plane (see no-legacy-auth).
    - control_id: workload-identity
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Query clients authenticate with IAM identities and short-lived tokens; auth_config's allowed issuers are themselves service accounts whose signed JWTs gate the private endpoint. The deployment issues no static credentials.
    - control_id: no-legacy-auth
      status: configurable
      field_path: auth_config
      evidence:
        type: spec_default
        reference: Omitted means a VPC-peered private query endpoint relies on network reachability alone -- the weak path; configuring auth_config requires callers to present JWTs signed by the allowed issuer service accounts with an accepted audience. Immutable.
      notes: The 03-peered-reserved-ranges preset requires JWTs from the query-client service account with audience vector-search-clients.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: configurable
      field_path: enable_access_logging
      evidence:
        type: spec_default
        reference: Administrative actions (deploy, mutate, undeploy) land in Cloud Audit Logs unconditionally; per-query access logging on the private endpoint is off by default and enabled by this flag, sending access records to Cloud Logging. Immutable.
      notes: The 03-peered-reserved-ranges preset enables access logging.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Vertex AI exports deployed-index serving metrics (query rates, latencies, replica counts) to Cloud Monitoring for every deployment without configuration.
    - control_id: backup-recovery
      status: not_applicable
      notes: The deployment is a serving placement holding no primary data -- the vectors live in the referenced GcpVertexAiIndex, rebuilt from source embeddings; undeploying loses nothing.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: configurable
      field_path: dedicated_resources.min_replica_count
      evidence:
        type: spec_default
        reference: One replica carries no SLA; setting the floor to 2 or more (the GCP default for the automatic arm) gives the deployment redundant serving nodes. Mutable in place.
      notes: All three presets keep a floor of 2. The automatic arm's min_replica_count carries the same lever for Vertex-managed sizing.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Unset means DELETE -- destroy undeploys the index and queries against this deployment stop being served. PREVENT makes the destroy fail, guarding a live serving path; ABANDON leaves the deployment serving unmanaged.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed serving -- Google operates and patches the nodes hosting the index; no customer-visible patch surface or maintenance window exists on the deployment.
