# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpvertexaideployedindex
spec:
  gcp:
    groups:
      - purpose: ManageDeployedIndex
        permissions:
          - aiplatform.indexEndpoints.deploy
          - aiplatform.indexEndpoints.get
          - aiplatform.indexEndpoints.update
        provenance: derived
        notes: "Covers google_vertex_ai_index_endpoint_deployed_index (Terraform) / vertex.AiIndexEndpointDeployedIndex (Pulumi). GCP defines NO aiplatform.deployedIndexes.* permissions -- a deployed index is a field of its endpoint, so every operation authorizes on the parent ENDPOINT (verified against IAM's testable-permissions inventory): DeployIndex as indexEndpoints.deploy, reads (refresh) as indexEndpoints.get, and in-place replica-bound changes (the provider PATCHes them via MutateDeployedIndex) as indexEndpoints.update. No serviceusage permissions here -- the module deliberately enables no API, because the endpoint this deployment lands on already required aiplatform.googleapis.com."
      - purpose: UndeployIndex
        permissions:
          - aiplatform.indexEndpoints.undeploy
        provenance: derived
        notes: "Destroy under deletion_policy DELETE (and the undeploy half of every change that cannot update in place -- all fields except replica bounds force undeploy-and-redeploy) authorizes as indexEndpoints.undeploy on the parent endpoint."
