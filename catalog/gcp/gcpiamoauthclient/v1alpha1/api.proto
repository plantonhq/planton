syntax = "proto3";

package dev.planton.gcp.gcpiamoauthclient.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpiamoauthclient/v1alpha1/outputs.proto";
import "catalog/gcp/gcpiamoauthclient/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-iam-oauth-client
message GcpIamOauthClient {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpIamOauthClient'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpIamOauthClientSpec spec = 4 [(buf.validate.field).required = true];
  GcpIamOauthClientStatus status = 5;
}

message GcpIamOauthClientStatus {
  GcpIamOauthClientOutputs outputs = 1;
}
