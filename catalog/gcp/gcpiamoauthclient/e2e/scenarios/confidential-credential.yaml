# Confidential-credential scenario: a CONFIDENTIAL_CLIENT with one
# managed credential, proving the credential fan-out and the
# client_secret output. The credential ships disabled: true — the
# destroy-safe fixture shape, because GCP requires a credential to be
# DISABLED before it can be deleted and DESTROY must not need a manual
# pre-step. Real deployments run enabled credentials and follow the
# GUIDE's two-step removal (disable in one apply, remove in the next).
# The client ID is run-scoped: deleted client IDs stay reserved ~30 days.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpIamOauthClient
metadata:
  name: planton-oss-e2e-gcpoauthclient-cred
  id: planton-oss-e2e-gcpoauthclient-cred
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpiamoauthclient
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  oauthClientId: e2e-oauth-cred-${E2E_RUN_ID}
  clientType: CONFIDENTIAL_CLIENT
  allowedGrantTypes:
    - AUTHORIZATION_CODE_GRANT
    - REFRESH_TOKEN_GRANT
  allowedScopes:
    - https://www.googleapis.com/auth/cloud-platform
    - openid
  allowedRedirectUris:
    - value: https://e2e.example.com/callback
  credentials:
    - credentialId: primary
      displayName: E2E fixture credential
      disabled: true
  description: E2E confidential client — destroy-safe disabled credential
  deletionPolicy: DELETE
