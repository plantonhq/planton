syntax = "proto3";

package dev.planton.gcp.gcpmonitoringalertpolicy.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpmonitoringalertpolicy/v1alpha1/outputs.proto";
import "catalog/gcp/gcpmonitoringalertpolicy/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-monitoring-alert-policy
message GcpMonitoringAlertPolicy {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpMonitoringAlertPolicy'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpMonitoringAlertPolicySpec spec = 4 [(buf.validate.field).required = true];
  GcpMonitoringAlertPolicyStatus status = 5;
}

message GcpMonitoringAlertPolicyStatus {
  GcpMonitoringAlertPolicyOutputs outputs = 1;
}
