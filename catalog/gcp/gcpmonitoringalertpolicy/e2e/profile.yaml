apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpmonitoringalertpolicy
spec:
  # Composed scenarios: both wire the channel prerequisite fixture (the
  # registry prerequisite) into notification_channels. minimal proves the
  # threshold family and the channel FK edge; log-match-rate-limited
  # proves the conditionMatchedLog + notificationRateLimit API pairing
  # that only surfaces live. Neither policy's condition ever fires in the
  # test project. deploy -> monitoring alertPolicies.get verify ->
  # destroy -> verify gone, on both provisioners. Policies are free and
  # create in seconds.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
