# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: gcpmonitoringalertpolicy
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: An alert policy stores no customer data -- its conditions, strategy, and documentation are Cloud Monitoring control-plane metadata held inside Google's own service infrastructure, not a data store this component owns.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: There is no data at rest to key (see enc-at-rest); the Monitoring API exposes no CMEK surface for alert policies.
    - control_id: enc-in-transit
      status: not_applicable
      notes: A policy terminates no connections of its own. The only wire traffic involving it -- Monitoring API management calls and condition evaluation inside Google's infrastructure -- happens on Google API endpoints, which serve exclusively over TLS as provider behavior, not per-policy configuration. Delivery transport belongs to the referenced notification channels.
    - control_id: no-public-access
      status: not_applicable
      notes: An alert policy has no network endpoint to expose; it is a control-plane rule reachable only through the IAM-governed Monitoring API.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network surface exists to filter; a policy is a configuration object with no addresses or ports.
    - control_id: edge-protection
      status: not_applicable
      notes: A policy receives no HTTP requests -- web ACLs and request filters have nothing to attach to.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Creating, modifying, and deleting alert policies is governed by Cloud Monitoring IAM roles on the owning project (the monitoring.alertPolicies.* permission family); no anonymous or non-IAM management path exists.
      notes: The spec exposes no per-policy access surface -- access scoping is the project's IAM posture.
    - control_id: workload-identity
      status: not_applicable
      notes: A policy holds no credentials and calls no cloud APIs as itself; condition evaluation runs inside Cloud Monitoring's own service identity.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The only authentication path involving the policy is IAM-authenticated Monitoring API access; no weaker alternative exists to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every create, update, and delete on an alert policy is recorded in Cloud Audit Logs' Admin Activity log, which is always on and cannot be disabled.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The policy is itself a Cloud Monitoring construct -- it consumes metrics and opens incidents rather than emitting runtime telemetry of its own to export.
    - control_id: backup-recovery
      status: not_applicable
      notes: A policy holds no data to back up -- it is declarative configuration fully re-creatable from the manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Alert policies live in Cloud Monitoring's regional-redundant control plane with no zonal placement to configure; availability is Google's service posture, not per-policy configuration.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Empty defaults to DELETE (the provider default); PREVENT makes any destroying plan fail until the value is lifted, and ABANDON removes the policy from management while it keeps evaluating (and paging) in GCP.
      notes: This is an IaC-engine guard, not an API-side flag -- deletion through the GCP console or gcloud is not blocked by it.
    - control_id: managed-patching
      status: not_applicable
      notes: A policy is a pure configuration object with no software to patch; the evaluation engine is Google-operated.
