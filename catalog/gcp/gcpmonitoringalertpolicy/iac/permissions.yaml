# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpmonitoringalertpolicy
spec:
  gcp:
    groups:
      - purpose: EnableMonitoringApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling monitoring.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageAlertPolicy
        permissions:
          - monitoring.alertPolicies.create
          - monitoring.alertPolicies.get
          - monitoring.alertPolicies.update
          - monitoring.alertPolicies.delete
        provenance: derived
        notes: Covers google_monitoring_alert_policy -- create, read/refresh, in-place updates (conditions, severity, enabled, channels, strategy, documentation, user labels), and destroy. All four verified present in IAM's testable-permissions inventory. Referencing notification channels in notification_channels needs no channel-side permission -- the API stores the resource names without a read.
