syntax = "proto3";

package dev.planton.gcp.gcpvertexaitensorboard.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpvertexaitensorboard/v1alpha1/outputs.proto";
import "catalog/gcp/gcpvertexaitensorboard/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-vertex-ai-tensorboard
message GcpVertexAiTensorboard {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpVertexAiTensorboard'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpVertexAiTensorboardSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpVertexAiTensorboardStatus status = 5;
}

//gcp-vertex-ai-tensorboard status
message GcpVertexAiTensorboardStatus {
  //stack-outputs
  GcpVertexAiTensorboardStackOutputs outputs = 1;
}
