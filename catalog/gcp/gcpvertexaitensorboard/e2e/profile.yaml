apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpvertexaitensorboard
spec:
  # Proven live on both engines (2026-11-20): a minimal TensorBoard and one
  # with two experiments and runs, each deployed, re-described in place
  # (UpdateTensorboard in Google's audit log) and destroyed by an identity
  # holding only this kind's permissions manifest, with the re-plan clean.
  # Experiments and runs reach Google through the regional endpoint the
  # provider's region selects, so both modules set it from the location, and
  # a TensorBoard's operations are read under aiplatform.locations.get.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
