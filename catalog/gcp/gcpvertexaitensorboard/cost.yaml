# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/componentcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostProfile
metadata:
  name: gcpvertexaitensorboard
spec:
  billing_model: usage_based
  baseline_charges:
    - service_name: Vertex AI
      sku_meter: TensorBoard storage
      pricing_unit: GiB-months
      description: A TensorBoard bills per GiB-month of logged data it stores -- scalars, histograms, images, and profiles -- from the first series written (per cloud.google.com/vertex-ai/pricing, Vertex AI TensorBoard section, read 2026-09-23). An empty TensorBoard, and declared experiments and runs with nothing logged, store nothing and owe nothing.
  cost_drivers:
    - field_path: experiments.runs
      sku_meter: TensorBoard storage
      pricing_unit: GiB-months
      impact: Storage grows with what training jobs log into runs -- declared and job-created alike; profiles and image summaries are the heavy ones. Declaring a run costs nothing until data is written to it.
  estimate_exclusions:
    - the training jobs that stream into the TensorBoard bill node-hours under the jobs
    - the staging bucket training jobs use bills under Cloud Storage
