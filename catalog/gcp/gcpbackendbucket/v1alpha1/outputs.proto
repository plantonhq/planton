syntax = "proto3";

package dev.planton.gcp.gcpbackendbucket.v1alpha1;

// Outputs produced after provisioning a GCP Compute Engine backend bucket.
message GcpBackendBucketOutputs {
  // Self-link URI of the backend bucket. This is the value URL maps
  // reference as a default service or path-rule target — the composition
  // handle for routing static content.
  // Format: https://www.googleapis.com/compute/v1/projects/{project}/global/backendBuckets/{name}
  string self_link = 1;

  // Name of the backend bucket as it exists in GCP.
  string backend_bucket_name = 2;

  // Name of the Cloud Storage bucket currently serving as the origin,
  // echoed for tooling that resolves the serving chain.
  string bucket_name = 3;
}
