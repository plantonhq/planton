apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpbackendbucket
spec:
  # Composed scenario: the harness deploys a GcpGcsBucket prerequisite (its
  # globally-unique bucket name carries ${E2E_RUN_ID} — GCS names are shared
  # across ALL of GCP, not project-scoped), resolves the backend bucket's
  # origin reference from its outputs, then runs deploy -> compute
  # backendBuckets.get verify (incl. origin wiring) -> destroy -> verify 404,
  # on both provisioners.
  #
  # Offline-proven arms: the signed_url_key fan-out (key material is secret
  # in both engines' state; no committed fixture carries keys) and
  # params.resource_manager_tags (needs org-level tagKeys/tagValues the test
  # project does not own — the standing org-fixture unblock condition).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
