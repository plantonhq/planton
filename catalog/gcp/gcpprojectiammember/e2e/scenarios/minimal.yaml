# Composed GcpProjectIamMember scenario. role and member are value_from
# references to the GcpIamCustomRole and GcpServiceAccount prerequisites
# (declared via prerequisites in the kind registry); the E2E harness deploys
# both first and resolves these references to the created role name and the
# ready-made serviceAccount:<email> member string before the grant is applied.
# project_id is omitted and rides the harness-exported GOOGLE_PROJECT.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpProjectIamMember
metadata:
  name: planton-oss-e2e-gcppim-smoke
  id: planton-oss-e2e-gcppim-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpprojectiammember
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  role:
    valueFrom:
      kind: GcpIamCustomRole
      name: planton-oss-e2e-gcprole-prereq
      fieldPath: status.outputs.name
  member:
    valueFrom:
      kind: GcpServiceAccount
      name: planton-oss-e2e-gsa-prereq
      fieldPath: status.outputs.member
