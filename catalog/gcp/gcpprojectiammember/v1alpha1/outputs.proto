syntax = "proto3";

package dev.planton.gcp.gcpprojectiammember.v1alpha1;

// Outputs produced after applying a project-level IAM member grant.
// The grant itself has no server-generated identity beyond its inputs; the
// outputs echo the fully-resolved grant tuple so downstream tooling and audits
// can see exactly what was applied without re-resolving references.
message GcpProjectIamMemberOutputs {
  // The project ID whose IAM policy received the grant (after reference
  // resolution and any provider-default fallback).
  string project_id = 1;

  // The role that was granted (predefined name or fully-qualified custom
  // role name), after reference resolution.
  string role = 2;

  // The member the role was granted to, in IAM member format, after
  // reference resolution.
  string member = 3;

  // The etag of the project IAM policy after this grant was applied — a
  // fingerprint of the policy version, useful for audit correlation.
  string etag = 4;
}
