syntax = "proto3";

package dev.planton.gcp.gcpalloydbuser.v1alpha1;

// GcpAlloydbUserOutputs captures values returned after provisioning an
// AlloyDB user.
message GcpAlloydbUserOutputs {
  // Fully qualified user resource name.
  // Format: projects/{project}/locations/{location}/clusters/{cluster}/users/{user}
  string name = 1;

  // The user_id as stored by AlloyDB.
  string user_id = 2;

  // Fully qualified cluster resource name this user belongs to.
  string cluster_id = 3;
}
