# Consumer-scoped GcpGlobalAddress install profile for the user chain.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGlobalAddress
metadata:
  name: planton-oss-e2e-gcpgip-psa-prereq
  id: planton-oss-e2e-gcpgip-psa-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpalloydbuser
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  description: Ephemeral VPC_PEERING range for the AlloyDB user E2E chain; safe to delete
  addressName: planton-oss-e2e-gcpgip-${E2E_RUN_ID}
  addressType: INTERNAL
  purpose: VPC_PEERING
  prefixLength: 16
  network:
    valueFrom:
      kind: GcpVpcNetwork
      name: planton-oss-e2e-gcpvpc-prereq
      fieldPath: status.outputs.network_self_link
