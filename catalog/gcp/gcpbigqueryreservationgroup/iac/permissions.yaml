# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpbigqueryreservationgroup
spec:
  gcp:
    groups:
      - purpose: EnableApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
          - resourcemanager.projects.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_project_service enabling bigqueryreservation.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed. The provider reads the project with resourcemanager.projects.get before its services on every refresh, so a re-plan or destroy needs it (measured live). Proven 2026-11-21 -- an identity holding only this manifest deployed and destroyed the kind on both engines; it has no in-place update.
      - purpose: ManageReservationGroup
        permissions:
          - bigquery.reservationGroups.create
          - bigquery.reservationGroups.get
          - bigquery.reservationGroups.delete
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_bigquery_reservation_group (Pulumi bigquery.ReservationGroup) -- created, read on every refresh, deleted; every argument is immutable, so no update. Names grounded in Google's BigQuery roles page. Proven 2026-11-21 -- an identity holding only this manifest deployed and destroyed the kind on both engines; it has no in-place update.
