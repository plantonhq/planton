# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcprediscluster
spec:
  gcp:
    groups:
      - purpose: EnableRedisApis
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
        provenance: derived
        notes: Covers TWO google_project_service resources -- the module enables both redis.googleapis.com and networkconnectivity.googleapis.com (PSC service connectivity automation rides the latter). disable_on_destroy is false on both, so the disable permission is never needed.
      - purpose: ManageCluster
        permissions:
          - redis.clusters.create
          - redis.clusters.get
          - redis.clusters.update
          - redis.clusters.delete
          - redis.operations.get
        provenance: derived
        notes: Covers google_redis_cluster -- create, read/refresh, in-place updates (shards, replicas, node type, redis configs, persistence, backups, maintenance, the replication role, the PSC config, deletion protection, and attaching or swapping an ACL policy through acl_policy), and destroy under deletion_policy DELETE (ABANDON and PREVENT call no delete API). Cluster mutations are long-running operations (creates run ten to fifteen minutes) the provider polls as redis.operations.get. roles/redis.admin contains all five.
