    expression: "this.server_ca_mode == '' || this.transit_encryption_mode == 'TRANSIT_ENCRYPTION_MODE_SERVER_AUTHENTICATION'"
    message: "server_ca_mode requires transit_encryption_mode TRANSIT_ENCRYPTION_MODE_SERVER_AUTHENTICATION"
  };
