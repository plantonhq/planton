apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcprediscluster
spec:
  # Proven live on both engines (2026-11-20): a one-shard shared-core cluster
  # with Google-placed PSC endpoints, and a two-shard cluster with a replica,
  # TLS, IAM auth, AOF, backups and a Redis config, each deployed, its
  # maintenance window moved in place (UpdateCluster in Google's audit log)
  # and destroyed by an identity holding only this kind's permissions
  # manifest, with the re-plan clean. The name output is the cluster's full
  # resource path (the provider's name attribute is the bare id), and a ready
  # cluster reads ACTIVE.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 90
