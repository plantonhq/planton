# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpartifactregistryrepo
spec:
  gcp:
    groups:
      - purpose: EnableArtifactRegistryApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service (Terraform) / projects.Service (Pulumi) enabling artifactregistry.googleapis.com on the target project. disable_on_destroy is false in both modules, so the disable permission is never needed.
      - purpose: ManageRepository
        permissions:
          - artifactregistry.repositories.create
          - artifactregistry.repositories.get
          - artifactregistry.repositories.update
          - artifactregistry.repositories.delete
        provenance: derived
        notes: "Covers google_artifact_registry_repository (Terraform) / artifactregistry.Repository (Pulumi) across all three serving modes -- create, read/refresh, in-place updates (description, labels, cleanup policies, docker config, remote upstream credentials, vulnerability-scanning enablement), and destroy. Verified against Google's IAM roles-and-permissions reference for artifactregistry; the committed action-inventory snapshot (pkg/iac/actioninventory/gcp.yaml) carries the artifactregistry service prefix and lists every permission here. Google's broad roles/artifactregistry.admin bundles all of these plus far more; this manifest is the least-privilege set. When kms_key_name sets CMEK, the deployer needs no Cloud KMS permission -- the grant that matters is roles/cloudkms.cryptoKeyEncrypterDecrypter to the Artifact Registry SERVICE AGENT on the key, a prerequisite made outside this module."
      - purpose: ManageRepositoryIamGrants
        permissions:
          - artifactregistry.repositories.getIamPolicy
          - artifactregistry.repositories.setIamPolicy
        provenance: derived
        notes: Covers google_artifact_registry_repository_iam_member (Terraform) / artifactregistry.RepositoryIamMember (Pulumi) -- the provider reads the repository's IAM policy and merges each additive (role, member) grant into it. Needed only when iam_members is non-empty. Verified against Google's IAM roles-and-permissions reference for artifactregistry; the committed action-inventory snapshot carries the artifactregistry service prefix and lists these permissions.
