# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: gcpartifactregistryrepo
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Artifact Registry encrypts every stored artifact at rest with Google-managed keys without configuration; encryption cannot be disabled -- kms_key_name only swaps WHICH key protects the bytes.
    - control_id: enc-at-rest-cmk
      status: configurable
      field_path: kms_key_name
      evidence:
        type: spec_default
        reference: Unset means Google-managed encryption; naming a Cloud KMS key (or referencing a GcpKmsKey) makes it the repository's CMEK. The Artifact Registry service agent needs roles/cloudkms.cryptoKeyEncrypterDecrypter on the key before create. Immutable -- changing it replaces the repository and everything stored in it.
      notes: No preset enables CMEK.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Pushes and pulls ride the {location}-{format}.pkg.dev endpoint over HTTPS, and all management calls ride the TLS-only Artifact Registry API; no plaintext listener exists.
    - control_id: no-public-access
      status: configurable
      field_path: iam_members
      evidence:
        type: spec_default
        reference: With no grants, the repository is reachable only by IAM-authorized principals -- private is the default. Public exposure happens only by explicitly granting roles/artifactregistry.reader to the special member allUsers, and only where the project's domain-restriction policy allows public grants.
      notes: No preset grants public access; all three keep artifacts behind IAM.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The registry endpoint is Google's managed API surface, and no field on the resource scopes it by network source -- access is identity-based. Network-boundary restriction (VPC Service Controls perimeters) is project/organization configuration outside this manifest.
    - control_id: edge-protection
      status: not_applicable
      notes: Requests terminate on Google's registry API edge; there is no load-balancer attachment point to hang Cloud Armor or any other request filter on.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Both planes are IAM-gated with no anonymous path -- managing the repository authorizes against the artifactregistry.repositories permission family, and pushing or pulling artifacts requires reader/writer/repoAdmin grants on the repository or project.
      notes: iam_members makes the data-plane grants declarative and additive -- each entry is one (role, member) pair that composes safely with grants made elsewhere; authoritative policies that clobber unlisted grants are deliberately not modeled.
    - control_id: workload-identity
      status: not_applicable
      notes: The repository runs no workload and holds no caller credentials -- GKE, Cloud Run, and CI consumers authenticate pulls and pushes with their own platform-issued identities. The one outbound credential (a remote repository's upstream username/password) never enters the spec; only its Secret Manager version PATH does, and rotation updates in place.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: Every access path authenticates IAM principals with OAuth tokens over HTTPS; the resource exposes no weaker or legacy protocol to disable. Remote-mode upstream credentials are username/password because that is the UPSTREAM registry's auth model (Docker Hub rate-limit tokens and the like), held in Secret Manager rather than in configuration.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Repository create, update, and delete land in Cloud Audit Logs (Admin Activity) unconditionally; Admin Activity logging cannot be disabled.
      notes: Data-plane pushes and pulls are Data Access log entries, off by default and enabled per-project outside this manifest. Cleanup-policy matches surface in audit logs too -- the visibility mechanism behind cleanup_policy_dry_run.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Artifact Registry publishes GA metrics to Cloud Monitoring without configuration -- control-plane and data-plane request counts and latency distributions (artifactregistry.googleapis.com/api/* metrics, covering Docker/Maven/pip/npm client traffic) plus quota usage metrics."
    - control_id: backup-recovery
      status: not_applicable
      notes: The service exposes no backup or snapshot facility for a repository. The structural safety net is different -- artifacts are content-addressed and re-pushable from CI, and KEEP cleanup policies protect versions from every DELETE policy; neither is a backup.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery). Age-based retention of LIVE artifact versions is cleanup_policies' job -- older_than DELETE conditions paired with keep-count guards.
    - control_id: multi-zone-ha
      status: configurable
      field_path: location
      evidence:
        type: spec_default
        reference: The location choice is the availability lever the resource exposes -- a single region co-locates with build and runtime infrastructure, while a multi-region ("us", "europe", "asia") serves the repository across an entire continent for globally consumed artifacts. Immutable after creation.
      notes: Storage pricing is identical for regional and multi-regional repositories, so the multi-region availability upgrade is paid for in data-transfer topology, not storage rate.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: "Empty means DELETE -- destroy removes the repository and every artifact version in it, and images become unpullable immediately. PREVENT makes destroy fail outright, the guard for a registry running workloads still pull from; ABANDON unmanages the repository while it keeps serving."
      notes: Unlike a GCS bucket there is no force_destroy gate -- a populated repository deletes without a second check, so PREVENT (or KEEP policies plus IAM) is the protection that matters.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fully managed service -- Google operates and patches the registry fleet; no version, image, or channel surface is exposed on the resource.
