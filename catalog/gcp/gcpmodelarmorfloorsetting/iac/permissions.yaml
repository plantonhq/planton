# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpmodelarmorfloorsetting
spec:
  gcp:
    caller_project_services:
      - modelarmor.googleapis.com
    groups:
      - purpose: EnableModelArmorApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
          - resourcemanager.projects.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_project_service enabling modelarmor.googleapis.com on the floor's project; the module creates it only for a project floor (scope.project_id, or no scope at all), never for a folder or organization floor. disable_on_destroy is false, so the disable permission is never needed. The provider reads the project with resourcemanager.projects.get before its services on every refresh, so a re-plan or destroy needs it (measured live). Proven 2026-11-21 -- an identity holding only this manifest deployed and destroyed the kind on both engines; it has no in-place update.
      - purpose: ManageFloorSetting
        permissions:
          - modelarmor.floorSettings.get
          - modelarmor.floorSettings.update
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_model_armor_floorsetting (Pulumi modelarmor.Floorsetting) -- create and update are the same PATCH on the scope's singleton, read on every refresh; delete makes no API call. Held at the floor's scope -- the project, the folder, or the organization (roles/modelarmor.floorSettingsAdmin there). The provider-default project lookup reads provider configuration only and needs no permission. Proven 2026-11-21 -- an identity holding only this manifest deployed and destroyed the kind on both engines; it has no in-place update.
      - purpose: ManageFolderFloorSetting
        permissions:
          - modelarmor.floorSettings.get
          - modelarmor.floorSettings.update
        provenance: derived
        reach: organization
        privilege: ordinary
        condition:
          spec_field_set: scope.folder_id
        notes: "The folder shape: Google authorizes the floor setting on its scope, so a folder-scoped one needs these permissions on the folder (roles/modelarmor.floorSettingsAdmin there carries them); its calls bill to the caller's project, where modelarmor.googleapis.com must be on. The project group covers the project shape."
      - purpose: ManageOrganizationFloorSetting
        permissions:
          - modelarmor.floorSettings.get
          - modelarmor.floorSettings.update
        provenance: derived
        reach: organization
        privilege: ordinary
        condition:
          spec_field_set: scope.organization_id
        notes: "The organization shape: Google authorizes the floor setting on its scope, so an organization-scoped one needs these permissions on the organization (roles/modelarmor.floorSettingsAdmin there carries them); its calls bill to the caller's project, where modelarmor.googleapis.com must be on. The project group covers the project shape."
