# GcpModelArmorFloorSetting scenario: the harness project's floor (no
# scope: the provider's project), enforced, screening Vertex AI traffic
# inspect-only with logging. Google cannot delete a floor setting -- the
# destroy only stops managing it, and the verifier asserts the setting
# still reads -- so this scenario is built to leave behind a floor that
# blocks nothing: Vertex AI traffic is inspected, never blocked, and the
# one required filter (injection detection at HIGH, the weakest threshold)
# is looser than every template scenario in the catalog. Floor settings
# are free.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpModelArmorFloorSetting
metadata:
  name: planton-oss-e2e-gcpmafs-project
  id: planton-oss-e2e-gcpmafs-project
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpmodelarmorfloorsetting
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  enableFloorSettingEnforcement: true
  integratedServices:
    - AI_PLATFORM
  filterConfig:
    piAndJailbreakFilterSettings:
      filterEnforcement: ENABLED
      confidenceLevel: HIGH
  aiPlatformFloorSetting:
    enforcementType: INSPECT_ONLY
    enableCloudLogging: true
