# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpbigqueryconnection
spec:
  gcp:
    groups:
      - purpose: EnableApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
        provenance: derived
        notes: Covers google_project_service enabling bigqueryconnection.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageConnection
        permissions:
          - bigquery.connections.create
          - bigquery.connections.get
          - bigquery.connections.update
          - bigquery.connections.delete
        provenance: derived
        notes: Covers google_bigquery_connection (Pulumi bigquery.Connection) -- created, patched, read on every refresh, deleted. Names grounded in Google's BigQuery roles page; roles/bigquery.connectionAdmin contains all four.
