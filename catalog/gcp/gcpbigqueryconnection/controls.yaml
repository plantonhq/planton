# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpbigqueryconnection
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "BigQuery encrypts a connection's stored credential at rest with Google-managed keys."
    - control_id: enc-at-rest-cmk
      status: configurable
      field_path: kms_key_name
      evidence:
        type: spec_default
        reference: "Unset uses Google-managed keys; kms_key_name encrypts the stored credential with a customer-managed Cloud KMS key."
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "BigQuery reaches Cloud SQL, Spanner, Cloud Storage, and the Connector framework over TLS; Omni runs in the other cloud's region over encrypted links."
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "A connection has no address; it is usable only by principals holding bigquery.connections.use."
    - control_id: restricted-ingress
      status: not_applicable
      notes: "No listener exists to restrict."
    - control_id: edge-protection
      status: not_applicable
      notes: "No edge is served."
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Using a connection in a query requires bigquery.connections.use; managing it requires bigquery.connections.* permissions."
    - control_id: workload-identity
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "The cloudResource, spark, Omni, and Cloud SQL arms act as Google-owned identities you grant access to; only cloudSql and the Connector framework carry a database password."
    - control_id: no-legacy-auth
      status: not_applicable
      notes: "Authentication to each source is the arm's own; there is no protocol choice to disable."
    - control_id: strong-user-auth
      status: not_applicable
      notes: "No end-user sign-in exists."
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Connection administration is recorded in Cloud Audit Logs (Admin Activity), and queries that use it are recorded as BigQuery data access."
    - control_id: monitoring-integration
      status: not_applicable
      notes: "A connection emits no metrics of its own; queries through it are observed in BigQuery's job metrics."
    - control_id: backup-recovery
      status: not_applicable
      notes: "The connection is redeclared from the spec; there is no data in it."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: "No backups exist."
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Connections are regional or multi-regional BigQuery metadata, served without a zonal dependency."
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: "Unset means DELETE -- the connection is deleted on destroy and tables or routines using it stop working; PREVENT makes destroy fail; ABANDON leaves it in GCP."
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "BigQuery is fully Google-operated; there is no software surface the customer patches."
