syntax = "proto3";

package dev.planton.gcp.gcpbigqueryconnection.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpbigqueryconnection/v1alpha1/outputs.proto";
import "catalog/gcp/gcpbigqueryconnection/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-bigquery-connection
message GcpBigQueryConnection {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpBigQueryConnection'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpBigQueryConnectionSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpBigQueryConnectionStatus status = 5;
}

//gcp-bigquery-connection status
message GcpBigQueryConnectionStatus {
  //stack-outputs
  GcpBigQueryConnectionStackOutputs outputs = 1;
}
