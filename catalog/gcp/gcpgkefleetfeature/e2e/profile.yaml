apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpgkefleetfeature
spec:
  # Proven live on both engines (2026-11-21), as an identity holding only this
  # kind's permissions manifest, granted in the second test project:
  # multi-cluster service discovery, Config Sync as the fleet default from
  # Google's public samples repository, and Policy Controller as the fleet
  # default with one per-cluster override on a membership with no cluster
  # behind it, each deployed, re-planned clean, and destroyed; the
  # fleet-default audit interval changed in place (GkeHub.UpdateFeature),
  # judged from Google's Admin Activity log. Google no longer accepts a Config
  # Sync upgrade mode in the fleet default and pins the current release
  # itself, so the spec requires the release (1.25.2 measured); Google accepts
  # a per-cluster Policy Controller entry for a membership with no cluster.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
