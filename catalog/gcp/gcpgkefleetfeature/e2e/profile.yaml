apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpgkefleetfeature
spec:
  # Awaiting the live proof lane. Every scenario runs on the second test
  # project's fleet (the consumer-scoped GcpGkeFleet prerequisite), so a
  # fleet-wide default never reaches clusters other lanes create. Offline
  # bar met: both modules build and validate, offline plans for the
  # reference manifest and every scenario are clean on the pinned
  # provider, and the accounting is total. Live facts the proof lane
  # confirms: (1) each feature's API enables and the feature reads ACTIVE;
  # (2) the Config Sync default and the Policy Controller default and
  # per-cluster override re-plan clean on both engines; (3) Google accepts a
  # per-cluster entry for a membership with no cluster behind it -- if it
  # refuses, the scenario moves onto a cluster fixture chain like the
  # scope's; (4) destroy turns each feature off (the verifier accepts 404 or
  # a delete time).
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 20
