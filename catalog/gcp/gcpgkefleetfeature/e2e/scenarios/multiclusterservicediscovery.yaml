# GcpGkeFleetFeature scenario: multi-cluster service discovery on the
# second project's fleet (the registry prerequisite) -- a feature with no
# settings, the smallest proof of enable and disable. Free.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGkeFleetFeature
metadata:
  name: planton-oss-e2e-gcpflft-mcsd
  id: planton-oss-e2e-gcpflft-mcsd
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpgkefleetfeature
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-identity-project: ${E2E_ENV:PLANTON_E2E_GCP_SECOND_PROJECT_ID} # the kind is granted, and runs, in the second test project
    planton.dev/e2e-exclusive: gcp-fleet-second-project # the second project holds one fleet, which every fleet kind writes
    planton.dev/e2e-names-nothing: "a fleet feature is named by its type, once per project"
    planton.dev/e2e-required-env: PLANTON_E2E_GCP_SECOND_PROJECT_ID
  tags:
    - planton-e2e
spec:
  projectId:
    valueFrom:
      kind: GcpGkeFleet
      name: planton-oss-e2e-gcpflft-fleet
      fieldPath: status.outputs.project_id
  feature: multiclusterservicediscovery
