# The second act of policycontroller-membership-config.yaml: the same
# feature with a longer fleet-default audit interval, a patch in place. Not a
# scenario of its own.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGkeFleetFeature
metadata:
  name: planton-oss-e2e-gcpflft-poco
  id: planton-oss-e2e-gcpflft-poco
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpgkefleetfeature
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-second-act: policycontroller-membership-config.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-identity-project: ${E2E_ENV:PLANTON_E2E_GCP_SECOND_PROJECT_ID} # the kind is granted, and runs, in the second test project
    planton.dev/e2e-exclusive: gcp-fleet-second-project # the second project holds one fleet, which every fleet kind writes
    planton.dev/e2e-names-nothing: "a fleet feature is named by its type, once per project"
    planton.dev/e2e-required-env: PLANTON_E2E_GCP_SECOND_PROJECT_ID
    planton.dev/e2e-prerequisites: "catalog/gcp/gcpgkefleetfeature/e2e/prerequisites/membership.yaml"
  tags:
    - planton-e2e
spec:
  projectId:
    valueFrom:
      kind: GcpGkeFleet
      name: planton-oss-e2e-gcpflft-fleet
      fieldPath: status.outputs.project_id
  feature: policycontroller
  fleetDefaultMemberConfig:
    policycontroller:
      policyControllerHubConfig:
        installSpec: INSTALL_SPEC_ENABLED
        auditIntervalSeconds: 120
        referentialRulesEnabled: true
        policyContent:
          templateLibrary:
            installation: ALL
          bundles:
            - bundle: pss-baseline-v2022
  membershipConfigs:
    - membership:
        valueFrom:
          kind: GcpGkeFleetMembership
          name: planton-oss-e2e-gcpflft-membership
          fieldPath: status.outputs.name
      policycontroller:
        policyControllerHubConfig:
          installSpec: INSTALL_SPEC_SUSPENDED
          deploymentConfigs:
            - component: admission
              replicaCount: 2
              podAffinity: ANTI_AFFINITY
          policyContent:
            bundles:
              - bundle: pss-baseline-v2022
                exemptedNamespaces:
                  - kube-system
