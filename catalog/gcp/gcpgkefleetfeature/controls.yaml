# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: gcpgkefleetfeature
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The feature is configuration; it stores no customer data of its own.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No customer data is stored by the feature to encrypt with a customer key.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The feature terminates no connections; management calls ride Google's TLS-only Fleet API endpoint.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A feature has no address of its own; access is through the Fleet API under IAM.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network listener exists to restrict.
    - control_id: edge-protection
      status: not_applicable
      notes: The feature serves no traffic.
    - control_id: rbac
      status: configurable
      field_path: fleet_default_member_config
      evidence:
        type: spec_default
        reference: Policy Controller enforces admission policies on every cluster the fleet default reaches; Config Sync's drift prevention refuses manual changes to synced objects.
    - control_id: workload-identity
      status: not_applicable
      notes: No workload runs as this block; fleet Workload Identity is a membership setting.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths exist to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component enforces no end-user sign-in; access is administrative, whose posture rbac carries.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Feature and per-cluster setting changes are GKE Hub admin writes recorded in Cloud Audit Logs (Admin Activity) unconditionally.
    - control_id: monitoring-integration
      status: configurable
      field_path: fleet_default_member_config.policycontroller.policy_controller_hub_config.monitoring
      evidence:
        type: spec_default
        reference: Policy Controller exports metrics to Cloud Monitoring or Prometheus, and fleet logging routes the fleet's logs to the host project.
    - control_id: backup-recovery
      status: not_applicable
      notes: The feature holds configuration only; it is recreated from its manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The feature is a Fleet API resource Google replicates; there is no placement to choose.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: deletion_policy PREVENT makes destroy fail.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The Fleet API is fully Google-operated.
