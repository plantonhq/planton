# Consumer-scoped GcpSecretManagerSecret install profile for the gcpdstrm
# chain: version 1 holds a placeholder password for the source profile.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSecretManagerSecret
metadata:
  name: planton-oss-e2e-gcpdstrm-password
  id: planton-oss-e2e-gcpdstrm-password
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpsecretmanagersecret
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  secretId: e2e-gcpdstrm-password-${E2E_RUN_ID}
  initialVersion:
    data:
      value: planton-e2e-placeholder-password
