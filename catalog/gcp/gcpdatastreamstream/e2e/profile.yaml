apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpdatastreamstream
spec:
  # Proven live on both engines (2026-11-18): a PostgreSQL-to-BigQuery stream
  # created without validation and left NOT_STARTED (per-schema datasets,
  # merge, no backfill), deployed, renamed in place and destroyed by an
  # identity holding only this kind's permissions manifest, with desired_state
  # sent explicitly and the re-plan clean. The other source engines,
  # Cloud Storage destinations, BigLake tables and CMEK stay offline-only.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 45
