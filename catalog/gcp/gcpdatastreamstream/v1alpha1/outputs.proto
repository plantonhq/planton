syntax = "proto3";

package dev.planton.gcp.gcpdatastreamstream.v1alpha1;

// GcpDatastreamStreamOutputs captures the stream's identity.
message GcpDatastreamStreamOutputs {
  // Full resource name --
  // projects/{project}/locations/{location}/streams/{stream_id}.
  string name = 1;

  // The stream's ID.
  string stream_id = 2;
}
