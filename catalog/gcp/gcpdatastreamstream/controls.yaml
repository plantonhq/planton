# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpdatastreamstream
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Datastream encrypts the data it holds in flight with a stream-specific key; the destinations encrypt what lands."
    - control_id: enc-at-rest-cmk
      status: configurable
      field_path: customer_managed_encryption_key
      evidence:
        type: spec_default
        reference: "Unset uses a Google-managed key; customer_managed_encryption_key encrypts the stream's data with a Cloud KMS key, and the dataset template's kms_key_name does the same for the datasets it creates."
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Datastream writes to BigQuery and Cloud Storage over Google's encrypted network; the source session's TLS is set on the source connection profile."
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "A stream has no address; its reachability to the source is decided by the source profile's connectivity."
    - control_id: restricted-ingress
      status: not_applicable
      notes: "The stream listens on nothing."
    - control_id: edge-protection
      status: not_applicable
      notes: "No edge is served."
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Managing, starting, and pausing streams requires datastream.streams.* permissions."
    - control_id: workload-identity
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Datastream writes to the destination and uses keys as its Google-managed service agent, granted on each resource; no key file is involved."
    - control_id: no-legacy-auth
      status: not_applicable
      notes: "Authentication to the source is the profile's; the stream offers no protocol choice."
    - control_id: strong-user-auth
      status: not_applicable
      notes: "No end-user sign-in exists."
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Stream administration and state changes are recorded in Cloud Audit Logs (Admin Activity)."
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Datastream publishes stream metrics (freshness, throughput, unsupported events) to Cloud Monitoring and error details through the API."
    - control_id: backup-recovery
      status: not_applicable
      notes: "The stream copies data; the source and destination keep their own backups, and a recreated stream can backfill again."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: "No backups exist."
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Datastream is a regional, Google-operated service that recovers workers across zones."
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: "Unset means DELETE -- the stream stops and is deleted (data already written stays); PREVENT makes destroy fail; ABANDON leaves it running in GCP."
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Datastream is fully Google-operated; there is no software surface the customer patches."
