# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason.

resources:
  google_pubsub_topic_iam_member:
    exclusions:
      - arg: project
        reason: >-
          the provider documents that "if it is not provided, the project
          will be parsed from the identifier of the parent resource"; this
          kind accepts the topic only by its full name
          (projects/{project}/topics/{topic}, a GcpPubSubTopic's topic_id),
          so the project is always carried in spec.topic and a separate
          field could only contradict it
      - arg: condition
        reason: >-
          Pub/Sub topics do not accept IAM Conditions: the provider's topic
          IAM (iam_pubsub_topic.go) reads and writes the policy without
          requesting policy version 3, which conditional role bindings need
          (iam_storage_bucket.go, by contrast, requests
          optionsRequestedPolicyVersion), its topic IAM docs document no
          condition, and Google's list of resource types that accept
          conditional role bindings does not include Pub/Sub; a modeled
          condition would accept input Google cannot apply
