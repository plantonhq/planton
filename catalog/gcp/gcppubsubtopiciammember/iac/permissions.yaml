# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcppubsubtopiciammember
spec:
  gcp:
    groups:
      - purpose: ManageTopicIamGrant
        permissions:
          - pubsub.topics.getIamPolicy
          - pubsub.topics.setIamPolicy
        provenance: derived
        notes: "Covers google_pubsub_topic_iam_member (Pulumi pubsub.TopicIAMMember) -- the provider implements the additive grant as a read-modify-write of the topic's IAM policy: getIamPolicy on create, every refresh, and destroy; setIamPolicy on create (merging the pair in) and destroy (subtracting exactly it). Both permissions authorize on the topic itself and are satisfied by a grant on the topic or its project; roles/pubsub.admin carries them. State the privilege honestly: setIamPolicy writes the topic's WHOLE policy, so a runner holding it can grant any principal publish or subscribe on the topic -- including itself; scope the runner's grant to the topics it manages. The project is parsed from the topic's full name, so the modules make no project lookup, enable no service, and make no other API calls."
