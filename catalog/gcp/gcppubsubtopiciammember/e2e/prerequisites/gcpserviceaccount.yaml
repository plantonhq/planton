# Consumer-scoped GcpServiceAccount install profile for the gcppstim
# scenarios: the grantee of service-account-subscriber, and the identity
# the sink-publisher chain's bucket prerequisite composes. The account id
# carries ${E2E_RUN_ID} (account ids are reserved briefly after deletion);
# metadata.name stays fixed for reference resolution.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpServiceAccount
metadata:
  name: planton-oss-e2e-gcppstim-sa
  id: planton-oss-e2e-gcppstim-sa
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpserviceaccount
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  serviceAccountId: e2e-pstim-${E2E_RUN_ID}
  displayName: Planton OSS E2E topic grantee
  description: Ephemeral identity deployed as an E2E prerequisite; safe to delete
