# GcpPubSubTopicIamMember scenario: a workload identity granted
# roles/pubsub.subscriber on the topic fixture, member from the
# service-account fixture's `member` output. No condition: Pub/Sub does not
# accept conditional role bindings. Free.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpPubSubTopicIamMember
metadata:
  name: planton-oss-e2e-gcppstim-sub
  id: planton-oss-e2e-gcppstim-sub
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcppubsubtopiciammember
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "GcpPubSubTopic,GcpServiceAccount"
  tags:
    - planton-e2e
spec:
  topic:
    valueFrom:
      kind: GcpPubSubTopic
      name: planton-oss-e2e-gcppstim-topic
      fieldPath: status.outputs.topic_id
  role:
    value: roles/pubsub.subscriber
  member:
    valueFrom:
      kind: GcpServiceAccount
      name: planton-oss-e2e-gcppstim-sa
      fieldPath: status.outputs.member
