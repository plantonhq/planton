# GcpVectorSearchCollection scenario: a hybrid collection -- one dense field
# with precomputed vectors (no embedding config) and one sparse field --
# with two indexes: dot product over the dense vectors with inline
# filter and store fields, and a second index over the sparse field. Every
# Optional+Computed index lever Google allows together (metric, dedicated
# STORAGE_OPTIMIZED infrastructure) is set here so the sweep sees it on the
# wire; a STORAGE_OPTIMIZED index takes only DOT_PRODUCT and no ScaNN
# options.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVectorSearchCollection
metadata:
  name: planton-oss-e2e-gcpvsc-hybrid
  id: planton-oss-e2e-gcpvsc-hybrid
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpvectorsearchcollection
  annotations:
    planton.dev/e2e: "true"
    # Pulumi only: Terraform starts a collection's indexes together and Google
    # runs one index operation per collection at a time, refusing the second
    # with 409 "unable to queue the operation" (the GUIDE's several-indexes
    # section), so a two-index first apply on Terraform ends after one index
    # by design of the provider. The single-index arm runs on both engines.
    planton.dev/e2e-engines: "pulumi"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
  tags:
    - planton-e2e
spec:
  location: us-central1
  collectionId: e2e-vsc-hyb-${E2E_RUN_ID} # per kind and engine, so lanes side by side never share it
  displayName: Hybrid search
  description: Dense and sparse fields side by side
  labels:
    team: search
  dataSchema: '{"type":"object","properties":{"title":{"type":"string"},"category":{"type":"string"}}}'
  vectorSchemas:
    - fieldName: dense
      denseVector:
        dimensions: 768
    - fieldName: lexical
      sparseVector: true
  indexes:
    - indexId: dense-cosine
      indexField: dense
      displayName: Dense cosine
      distanceMetric: DOT_PRODUCT
      filterFields:
        - category
      storeFields:
        - title
      labels:
        tier: dev
      dedicatedInfrastructure:
        mode: STORAGE_OPTIMIZED
        autoscalingSpec:
          minReplicaCount: 1
          maxReplicaCount: 2
    - indexId: lexical-ann
      indexField: lexical
