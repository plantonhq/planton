# The second act of minimal.yaml: the same collection with a new
# description, a patch in place. Not a scenario of its own.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVectorSearchCollection
metadata:
  name: planton-oss-e2e-gcpvsc-minimal
  id: planton-oss-e2e-gcpvsc-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpvectorsearchcollection
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-second-act: minimal.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
  tags:
    - planton-e2e
spec:
  location: us-central1
  collectionId: e2e-vsc-min-${E2E_RUN_ID} # per kind and engine, so lanes side by side never share it
  description: E2E minimal collection, updated in place; delete freely
  dataSchema: '{"type":"object","properties":{"title":{"type":"string"},"body":{"type":"string"}}}'
  vectorSchemas:
    - fieldName: text_embedding
      denseVector:
        dimensions: 768
        vertexEmbeddingConfig:
          modelId: text-embedding-005
          taskType: RETRIEVAL_DOCUMENT
          textTemplate: "Title: {title} ---- Body: {body}"
  indexes:
    - indexId: docs-ann
      indexField: text_embedding
