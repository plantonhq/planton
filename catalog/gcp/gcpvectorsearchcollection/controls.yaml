# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpvectorsearchcollection
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Vector Search encrypts every collection's data objects and every index at rest with Google-managed keys without configuration.
    - control_id: enc-at-rest-cmk
      status: configurable
      field_path: kms_key_name
      evidence:
        type: spec_default
        reference: Unset means Google-managed encryption; a Cloud KMS key in the same region encrypts the collection and its indexes under the customer-managed key. Immutable for the collection's life.
      notes: The 02-hybrid-dedicated preset references a GcpKmsKey. The Vector Search service agent needs encrypt/decrypt on the key as a prerequisite.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every write and search is TLS over vectorsearch.googleapis.com; there is no plaintext path.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A collection has no address of its own; it is reached only through the Vector Search API under IAM.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network listener exists to restrict; access is API-level and governed by IAM.
    - control_id: edge-protection
      status: not_applicable
      notes: No edge is served; searches are API calls.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Managing the collection and its indexes, writing objects, and searching are all governed by Vector Search IAM permissions on every collection -- no anonymous data plane exists.
    - control_id: workload-identity
      status: not_applicable
      notes: The collection authenticates nothing; callers use their own identities.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths exist to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component enforces no end-user sign-in; access is service and administrative, whose posture rbac carries.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Creating, changing, and deleting the collection and its indexes land in Cloud Audit Logs (Admin Activity) unconditionally; data writes and searches are Data Access logs enabled at the project.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Vector Search emits query, latency, and storage metrics per collection and index to Cloud Monitoring without configuration.
    - control_id: backup-recovery
      status: not_applicable
      notes: The collection and index definitions are declarative and re-creatable from source control; the data objects are written by applications from their own sources of truth, and an index is rebuilt from the collection's data whenever it is replaced.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A collection is a regional service spread across the location's zones; dedicated index replicas are placed by Google across zones, and the pooled infrastructure is regional by construction.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Unset means DELETE -- the indexes and then the collection are deleted, data included; PREVENT makes any destroying plan fail; ABANDON removes everything from management while it keeps serving. The policy is fanned to every index.
      notes: The 02-hybrid-dedicated preset sets PREVENT.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Vector Search is fully Google-operated; there is no software surface the customer patches.
