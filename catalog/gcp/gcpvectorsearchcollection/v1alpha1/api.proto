syntax = "proto3";

package dev.planton.gcp.gcpvectorsearchcollection.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpvectorsearchcollection/v1alpha1/outputs.proto";
import "catalog/gcp/gcpvectorsearchcollection/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-vector-search-collection
message GcpVectorSearchCollection {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpVectorSearchCollection'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpVectorSearchCollectionSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpVectorSearchCollectionStatus status = 5;
}

//gcp-vector-search-collection status
message GcpVectorSearchCollectionStatus {
  //stack-outputs
  GcpVectorSearchCollectionStackOutputs outputs = 1;
}
