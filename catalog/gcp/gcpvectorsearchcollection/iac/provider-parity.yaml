# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_vector_search_collection:
    mappings:
      - spec: spec.project_id
        arg: project
      - spec: spec.kms_key_name
        arg: encryption_spec.crypto_key_name
      # The provider's block is singular (vector_schema, a set); the spec
      # names the list for what it is. Matching resumes below the subtree.
      - spec: spec.vector_schemas
        arg: vector_schema
      - spec: spec.vector_schemas.field_name
        arg: vector_schema.field_name
      - spec: spec.vector_schemas.dense_vector.dimensions
        arg: vector_schema.dense_vector.dimensions
      - spec: spec.vector_schemas.dense_vector.vertex_embedding_config.model_id
        arg: vector_schema.dense_vector.vertex_embedding_config.model_id
      - spec: spec.vector_schemas.dense_vector.vertex_embedding_config.task_type
        arg: vector_schema.dense_vector.vertex_embedding_config.task_type
      - spec: spec.vector_schemas.dense_vector.vertex_embedding_config.text_template
        arg: vector_schema.dense_vector.vertex_embedding_config.text_template
  # The indexes are folded: one collection owns them, nothing else in the
  # catalog references one, and they share the collection's lifecycle.
  google_vector_search_index:
    specRoot: spec.indexes
    mappings:
      - spec: spec.project_id
        arg: project
      # Derived from the parent: the collection's location and the
      # collection's id, never declared twice.
      - spec: spec.location
        arg: location
      - spec: spec.collection_id
        arg: collection_id
      - spec: spec.deletion_policy
        arg: deletion_policy
      # The ScaNN wrapper block holds one leaf; the spec lifts it.
      - spec: spec.indexes.feature_norm_type
        arg: dense_scann.feature_norm_type
  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables the owning API so a
      fresh project works on the first deploy; not a knob of the kind.

specExclusions:
  - field: spec.vector_schemas.sparse_vector
    reason: >-
      the provider expresses a sparse vector field as an EMPTY marker block
      (sparse_vector {}) with no settings of its own; the spec carries it as
      a presence bool and the modules emit the marker block from it (the
      established marker-block judgment)
