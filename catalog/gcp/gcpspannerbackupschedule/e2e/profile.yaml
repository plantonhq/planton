apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpspannerbackupschedule
spec:
  # Composed scenario: deploys the GcpSpannerInstance and GcpSpannerDatabase
  # prerequisites, then attaches a daily full-backup schedule to the
  # database. The schedule itself creates/destroys in seconds; the chain
  # cost is the instance (~1 minute).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]  # live-proven 2026-08-12: full lifecycle + apply-idempotency on both engines
  timeout_minutes: 30
