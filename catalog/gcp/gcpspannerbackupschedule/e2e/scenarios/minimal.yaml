# GcpSpannerBackupSchedule scenario: a daily full-backup schedule on the
# prerequisite database. The harness resolves both parent references from
# the prerequisites' outputs. project_id is deliberately omitted (ambient
# project). No backup is created during the run (the cadence never fires
# inside the test window), so DESTROY needs no backup sweep.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSpannerBackupSchedule
metadata:
  name: planton-oss-e2e-gcpsbs-smoke
  id: planton-oss-e2e-gcpsbs-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpspannerbackupschedule
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  instance:
    valueFrom:
      kind: GcpSpannerInstance
      name: planton-oss-e2e-gcpspn-prereq
      fieldPath: status.outputs.instance_name
  database:
    valueFrom:
      kind: GcpSpannerDatabase
      name: planton-oss-e2e-gcpspdb-prereq
      fieldPath: status.outputs.database_name
  cron: "0 2 * * *"
  retentionDuration: 86400s
  backupType: FULL
  deletionPolicy: DELETE
