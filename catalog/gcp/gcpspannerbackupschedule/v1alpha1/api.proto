syntax = "proto3";

package dev.planton.gcp.gcpspannerbackupschedule.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpspannerbackupschedule/v1alpha1/outputs.proto";
import "catalog/gcp/gcpspannerbackupschedule/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-spanner-backup-schedule
message GcpSpannerBackupSchedule {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpSpannerBackupSchedule'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpSpannerBackupScheduleSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpSpannerBackupScheduleStatus status = 5;
}

//gcp-spanner-backup-schedule status
message GcpSpannerBackupScheduleStatus {
  //outputs
  GcpSpannerBackupScheduleOutputs outputs = 1;
}
