apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpserviceaccount
spec:
  # Leaf identity scenarios: the keyless minimal shape plus the
  # user-managed-key generate flow (keepers rotation trigger, key_base64
  # export) -> iam serviceAccounts.get verify -> destroy -> verify-destroyed
  # on both provisioners against the GCP test project via ambient ADC. The
  # manifests omit project_id and ride the harness-exported GOOGLE_PROJECT,
  # so no project id is hardcoded in the repo.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 10
