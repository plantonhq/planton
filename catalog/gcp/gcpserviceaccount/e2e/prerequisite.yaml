# GcpServiceAccount install profile used as a prerequisite by composed
# kinds (e.g. GcpProjectIamMember). The E2E harness deploys this identity
# first (via its Pulumi module), captures its outputs, and resolves the
# dependent's member reference (status.outputs.member) against them.
# project_id is omitted so the account lands in the harness-exported test
# project. The account id differs from the smoke scenario's so a prerequisite
# deploy never collides with a concurrently-running gcpserviceaccount scenario.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpServiceAccount
metadata:
  name: planton-oss-e2e-gsa-prereq
  id: planton-oss-e2e-gsa-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpserviceaccount
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  serviceAccountId: planton-oss-e2e-sa-pre
  displayName: Planton OSS E2E prerequisite identity
  description: Ephemeral identity deployed as an E2E prerequisite; safe to delete
