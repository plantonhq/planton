syntax = "proto3";

package dev.planton.gcp.gcpserviceaccount.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpserviceaccount/v1alpha1/outputs.proto";
import "catalog/gcp/gcpserviceaccount/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-service-account
message GcpServiceAccount {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpServiceAccount'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpServiceAccountSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpServiceAccountStatus status = 5;
}

//gcp-service-account status
message GcpServiceAccountStatus {
  //outputs
  //  outputs
  GcpServiceAccountOutputs outputs = 1;
}
