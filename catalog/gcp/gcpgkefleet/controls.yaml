# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: gcpgkefleet
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The fleet is configuration; it stores no customer data of its own.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No customer data is stored by the fleet to encrypt with a customer key.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The fleet terminates no connections; management calls ride Google's TLS-only Fleet API endpoint.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A fleet has no address of its own; access is through the Fleet API under IAM.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network listener exists to restrict.
    - control_id: edge-protection
      status: not_applicable
      notes: The fleet serves no traffic.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fleet changes require gkehub.fleet.* permissions (roles/gkehub.admin); default_cluster_config extends policy to every cluster in the fleet.
    - control_id: workload-identity
      status: not_applicable
      notes: Fleet Workload Identity is a membership setting (GcpGkeFleetMembership.issuer), not a fleet field.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths exist to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component enforces no end-user sign-in; access is administrative, whose posture rbac carries.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Fleet changes are GKE Hub admin writes recorded in Cloud Audit Logs (Admin Activity) unconditionally.
    - control_id: monitoring-integration
      status: configurable
      field_path: default_cluster_config.security_posture_config
      evidence:
        type: spec_default
        reference: security_posture_config surfaces workload configuration and vulnerability findings for every cluster in the fleet.
    - control_id: backup-recovery
      status: not_applicable
      notes: The fleet holds configuration only; it is recreated from its manifest.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The fleet is a global resource Google replicates; there is no placement to choose.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: deletion_policy PREVENT makes destroy fail, guarding a fleet teams depend on; Google also refuses to delete a fleet that still has memberships or scopes.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The Fleet API is fully Google-operated.
