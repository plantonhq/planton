# The second act of second-project-defaults.yaml: the same fleet with a new
# display name, a patch in place. Not a scenario of its own.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGkeFleet
metadata:
  name: planton-oss-e2e-gcpfleet-defaults
  id: planton-oss-e2e-gcpfleet-defaults
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpgkefleet
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-second-act: second-project-defaults.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-identity-project: ${E2E_ENV:PLANTON_E2E_GCP_SECOND_PROJECT_ID} # the kind is granted, and runs, in the second test project
    planton.dev/e2e-exclusive: gcp-fleet-second-project # the second project holds one fleet, which every fleet kind writes
    planton.dev/e2e-names-nothing: "a project has one fleet, named by its project"
    planton.dev/e2e-required-env: PLANTON_E2E_GCP_SECOND_PROJECT_ID
  tags:
    - planton-e2e
spec:
  projectId:
    value: ${E2E_ENV:PLANTON_E2E_GCP_SECOND_PROJECT_ID}
  displayName: Planton E2E fleet renamed
  defaultClusterConfig:
    binaryAuthorizationConfig:
      evaluationMode: DISABLED
    securityPostureConfig:
      mode: BASIC
      vulnerabilityMode: VULNERABILITY_BASIC
  deletionPolicy: DELETE
