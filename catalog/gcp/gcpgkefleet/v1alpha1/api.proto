syntax = "proto3";

package dev.planton.gcp.gcpgkefleet.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpgkefleet/v1alpha1/outputs.proto";
import "catalog/gcp/gcpgkefleet/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-gke-fleet
message GcpGkeFleet {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpGkeFleet'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpGkeFleetSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpGkeFleetStatus status = 5;
}

//gcp-gke-fleet status
message GcpGkeFleetStatus {
  //stack-outputs
  GcpGkeFleetStackOutputs outputs = 1;
}
