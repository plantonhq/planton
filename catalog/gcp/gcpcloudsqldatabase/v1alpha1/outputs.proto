syntax = "proto3";

package dev.planton.gcp.gcpcloudsqldatabase.v1alpha1;

// GcpCloudSqlDatabaseOutputs captures values returned after provisioning
// a database inside a Cloud SQL instance.
message GcpCloudSqlDatabaseOutputs {
  // Name of the database inside the instance.
  string database_name = 1;

  // GCP resource self link for the database.
  string self_link = 2;
}
