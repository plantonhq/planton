apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpcloudsqldatabase
spec:
  # Composed scenario: deploys the GcpCloudSql prerequisite (which itself
  # pulls the service networking chain) then creates a database on it.
  tier: 1
