# GcpCloudSqlDatabase scenario: a logical database on the prerequisite
# instance. The harness resolves the instance reference from the
# prerequisite's instance_name output. The explicit DELETE teardown policy
# must be a no-op against the provider default on re-plan.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudSqlDatabase
metadata:
  name: planton-oss-e2e-gcpsqldb-smoke
  id: planton-oss-e2e-gcpsqldb-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcloudsqldatabase
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  instance:
    valueFrom:
      kind: GcpCloudSql
      name: planton-oss-e2e-gcpsql-prereq
      fieldPath: status.outputs.instance_name
  databaseName: e2e_app
  deletionPolicy: DELETE
