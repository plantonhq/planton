# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpgkenodepool
spec:
  gcp:
    groups:
      - purpose: EnableContainerApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
          - resourcemanager.projects.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: "Covers google_project_service enabling container.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed. Proven 2026-10-20 on dev by the least-privilege lane: an identity holding exactly the kind's rendered permissions deployed, updated and destroyed it. The provider reads the project with resourcemanager.projects.get before its services on every refresh, so a re-plan or destroy needs it (measured live). Proven 2026-11-20 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines."
      - purpose: ManageNodePool
        permissions:
          - container.clusters.get
          - container.clusters.update
          - container.operations.get
          - compute.instanceGroupManagers.get
          - compute.instanceGroupManagers.list
        provenance: proven
        reach: target
        privilege: ordinary
        notes: "Covers google_container_node_pool -- the provider reads the parent cluster and polls the long-running operation every mutation returns. GCP defines NO container.nodePools.* IAM permissions (verified against IAM's testable-permissions inventory and the published container roles reference); node pool create/update/delete all authorize as container.clusters.update on the parent cluster. The provider also reads the pool's managed instance groups (its size and instance template) on create, refresh and destroy, which Google authorizes as compute.instanceGroupManagers.list and get on the project -- a live create was refused without them. Proven 2026-10-20 on dev by the least-privilege lane: an identity holding exactly the kind's rendered permissions deployed, updated and destroyed it. Proven 2026-11-20 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines."
      - purpose: ActAsDefaultNodeServiceAccount
        permissions:
          - iam.serviceAccounts.actAs
        provenance: proven
        reach: target
        privilege: uses_identity
        notes: A pool whose node_config names no service account runs its nodes as the project's Compute Engine default service account, and GKE demands actAs on the account nodes run as before creating them -- the check that refuses a Standard cluster's default pool without it (measured on GcpGkeCluster). A custom node identity (node_config.service_account) needs actAs on that account the same way. The manifest cannot condition a group on a field being unset, so the group is listed whatever node_config names. Proven 2026-11-20 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
