apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpgkenodepool
spec:
  # Every scenario deploys a full GKE cluster prerequisite (10-25 minutes)
  # before the pool itself (~3-6 minutes), and destroys both after. Batch
  # runs with a go test -timeout of at least 180m.
  tier: 1
  # Live-proven 2026-08-12 on both engines at the full spec surface of the release then pinned:
  # 2 scenarios (minimal fixed-count, autoscaling-spot incl. the kubelet
  # eviction trio with percentage-only minimum reclaim, crash-loop
  # backoff, image GC age, cgroup v2, ignore_node_count_changes) x 2
  # engines, all phases green under the apply-idempotency gate. The GKE
  # chain lives in us-east1 (see the cluster profile).
  #
  # Awaiting re-proof: the pool gained graceful-shutdown grace periods (the
  # autoscaling-spot scenario sets 120/30), a boot-time init script, and the
  # end-of-support upgrade hold; the earlier live proof predates them. The
  # next proof confirms the grace periods round-trip on a Spot pool and re-
  # plan clean (both are API-computed when unset); the init script and the
  # hold stay offline-proven.
  status: pending_proof
  validated_provisioners: []
  # Deferred arm — node_drain_config (customized node drain): GKE gates
  # the feature behind a per-project allowlist granted only via a GCP
  # support case; the live API rejects creates with "customized node drain
  # timeout is not enabled for this project" (caught 2026-08-12 on this
  # project). Offline-proven (rendered in plans); unblock condition: the
  # allowlist granted on the E2E project, then re-arm the scenario.
  timeout_minutes: 180
