apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpgkenodepool
spec:
  # Proven live on both engines (2026-11-20): an on-demand pool and an
  # autoscaled Spot pool on a zonal cluster, each deployed, the Spot pool's
  # autoscaling maximum raised in place (UpdateCluster in Google's audit log)
  # and destroyed by an identity holding only this kind's permissions
  # manifest, with the re-plan clean. A pool's nodes run as the project's
  # Compute Engine default service account unless node_config names one, and
  # GKE demands actAs on that account.
  tier: 1
  # Live-proven 2026-08-12 on both engines at the full spec surface of the release then pinned:
  # 2 scenarios (minimal fixed-count, autoscaling-spot incl. the kubelet
  # eviction trio with percentage-only minimum reclaim, crash-loop
  # backoff, image GC age, cgroup v2, ignore_node_count_changes) x 2
  # engines, all phases green under the apply-idempotency gate. The GKE
  # chain lives in us-east1 (see the cluster profile).
  #
  # Proven live on both engines with graceful-shutdown grace periods on a
  # Spot pool (the autoscaling-spot scenario sets 120/30), which round-trip
  # and re-plan clean although both are API-computed when unset. The
  # boot-time init script and the end-of-support upgrade hold are proven
  # offline only.
  status: green
  validated_provisioners: [pulumi, terraform]
  # Deferred arm — node_drain_config (customized node drain): GKE gates
  # the feature behind a per-project allowlist granted only via a GCP
  # support case; the live API rejects creates with "customized node drain
  # timeout is not enabled for this project" (caught 2026-08-12 on this
  # project). Offline-proven (rendered in plans); unblock condition: the
  # allowlist granted on the E2E project, then re-arm the scenario.
  timeout_minutes: 180
