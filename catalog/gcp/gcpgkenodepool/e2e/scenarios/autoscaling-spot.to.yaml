# The second act of autoscaling-spot.yaml: the same Spot pool with the
# autoscaler's per-zone maximum raised from 2 to 3 nodes -- an UpdateCluster
# call naming the pool (desired node pool autoscaling) that patches it in
# place (its name and initial size recreate it). Not a scenario
# of its own (the second-act annotation keeps discovery from running it as a
# lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGkeNodePool
metadata:
  name: planton-oss-e2e-gkenp-spot
  id: planton-oss-e2e-gkenp-spot
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpgkenodepool
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-exclusive: gcp-project-vcpus # the lane project holds 12 vCPUs across all regions, so VM-running kinds never run side by side
    planton.dev/e2e-second-act: autoscaling-spot.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
  tags:
    - planton-e2e
spec:
  clusterName:
    valueFrom:
      kind: GcpGkeCluster
      name: planton-oss-e2e-gke-prereq
      fieldPath: status.outputs.name
  location:
    valueFrom:
      kind: GcpGkeCluster
      name: planton-oss-e2e-gke-prereq
      fieldPath: status.outputs.location
  nodePoolName: planton-oss-e2e-spot-pool-${E2E_RUN_ID} # per kind and engine, so lanes side by side never share it
  # Start with one node (the API's default initial size of 3 would exceed
  # maxNodes); the autoscaler owns the size from then on.
  initialNodeCount: 1
  autoscaling:
    minNodes: 0
    maxNodes: 3
    locationPolicy: ANY
  management:
    autoRepair: true
    autoUpgrade: true
  upgradeSettings:
    maxSurge: 1
    maxUnavailable: 0
  # Read-side switch in its natural habitat (the autoscaler owns the
  # size): skips the per-pool IGM node-count queries. The pool's
  # instance_group_urls output stays populated — only the provider's
  # unexported managed-IGM attribute is skipped — so the live evidence
  # is the clean re-plan after apply (the idempotency gate).
  ignoreNodeCountChanges: true
  # Explicit destroy stance: the destroy-verified phase proves the pool
  # deletes cleanly with the policy armed.
  deletionPolicy: DELETE
  nodeConfig:
    machineType: e2-standard-2
    diskSizeGb: 50
    diskType: pd-balanced
    spot: true
    labels:
      workload-class: batch
    taints:
      - key: workload-class
        value: batch
        effect: NO_SCHEDULE
    shieldedInstanceConfig:
      enableSecureBoot: true
    kubeletConfig:
      insecureKubeletReadonlyPortEnabled: "FALSE"
      podPidsLimit: 4096
      # The expanded tuning families, one representative each: eviction
      # (threshold + grace + reclaim as a coherent trio), restart backoff,
      # and age-based image GC. Reclaim is percentage-only — the live API
      # rejected 100Mi with 'invalid percentage, must end with "%"'.
      evictionSoft:
        memoryAvailable: 200Mi
      evictionSoftGracePeriod:
        memoryAvailable: "90s"
      evictionMinimumReclaim:
        memoryAvailable: "10%"
      crashLoopBackOff:
        maxContainerRestartPeriod: "300s"
      imageMinimumGcAge: "120s"
      # Graceful node shutdown on reclaim (Spot pools only): two minutes in
      # total, thirty seconds of it reserved for critical pods.
      shutdownGracePeriodSeconds: 120
      shutdownGracePeriodCriticalPodsSeconds: 30
    linuxNodeConfig:
      cgroupMode: CGROUP_MODE_V2
