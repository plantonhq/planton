# Minimal GcpGkeNodePool scenario: a fixed-size single-node pool on the
# prerequisite zonal cluster — the smallest pool GKE can attach, exercising
# the fixed-count sizing arm and the cluster/location reference resolution.
# project_id is deliberately omitted (ambient project).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGkeNodePool
metadata:
  name: planton-oss-e2e-gkenp-minimal
  id: planton-oss-e2e-gkenp-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpgkenodepool
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-exclusive: gcp-project-vcpus # the lane project holds 12 vCPUs across all regions, so VM-running kinds never run side by side
  tags:
    - planton-e2e
spec:
  clusterName:
    valueFrom:
      kind: GcpGkeCluster
      name: planton-oss-e2e-gke-prereq
      fieldPath: status.outputs.name
  location:
    valueFrom:
      kind: GcpGkeCluster
      name: planton-oss-e2e-gke-prereq
      fieldPath: status.outputs.location
  nodePoolName: planton-oss-e2e-np-minimal-${E2E_RUN_ID} # per kind and engine, so lanes side by side never share it
  nodeCount: 1
