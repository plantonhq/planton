# Autoscaling Spot GcpGkeNodePool scenario: exercises the autoscaling sizing
# arm (scale-to-zero minimum, ANY location policy), Spot capacity, taints,
# Kubernetes node labels, explicit management/upgrade settings, kubelet
# hardening AND tuning (soft-eviction trio, crash-loop backoff, image GC
# ages), an explicit deletion policy, and cgroup v2 — the depth surface of
# the expanded spec, live on the prerequisite cluster. node_drain_config is
# deliberately NOT armed: GKE gates customized node drain behind a
# per-project support-case allowlist (the API 400s without it — see the
# spec field comment and this kind's e2e profile deferral).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGkeNodePool
metadata:
  name: planton-oss-e2e-gkenp-spot
  id: planton-oss-e2e-gkenp-spot
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpgkenodepool
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  clusterName:
    valueFrom:
      kind: GcpGkeCluster
      name: planton-oss-e2e-gke-prereq
      fieldPath: status.outputs.name
  location:
    valueFrom:
      kind: GcpGkeCluster
      name: planton-oss-e2e-gke-prereq
      fieldPath: status.outputs.location
  nodePoolName: planton-oss-e2e-spot-pool
  # Start with one node (the API's default initial size of 3 would exceed
  # maxNodes); the autoscaler owns the size from then on.
  initialNodeCount: 1
  autoscaling:
    minNodes: 0
    maxNodes: 2
    locationPolicy: ANY
  management:
    autoRepair: true
    autoUpgrade: true
  upgradeSettings:
    maxSurge: 1
    maxUnavailable: 0
  # Read-side switch in its natural habitat (the autoscaler owns the
  # size): skips the per-pool IGM node-count queries. The pool's
  # instance_group_urls output stays populated — only the provider's
  # unexported managed-IGM attribute is skipped — so the live evidence
  # is the clean re-plan after apply (the idempotency gate).
  ignoreNodeCountChanges: true
  # Explicit destroy stance: the destroy-verified phase proves the pool
  # deletes cleanly with the policy armed.
  deletionPolicy: DELETE
  nodeConfig:
    machineType: e2-standard-2
    diskSizeGb: 50
    diskType: pd-balanced
    spot: true
    labels:
      workload-class: batch
    taints:
      - key: workload-class
        value: batch
        effect: NO_SCHEDULE
    shieldedInstanceConfig:
      enableSecureBoot: true
    kubeletConfig:
      insecureKubeletReadonlyPortEnabled: "FALSE"
      podPidsLimit: 4096
      # The expanded tuning families, one representative each: eviction
      # (threshold + grace + reclaim as a coherent trio), restart backoff,
      # and age-based image GC. Reclaim is percentage-only — the live API
      # rejected 100Mi with 'invalid percentage, must end with "%"'.
      evictionSoft:
        memoryAvailable: 200Mi
      evictionSoftGracePeriod:
        memoryAvailable: "90s"
      evictionMinimumReclaim:
        memoryAvailable: "10%"
      crashLoopBackOff:
        maxContainerRestartPeriod: "300s"
      imageMinimumGcAge: "120s"
      # Graceful node shutdown on reclaim (Spot pools only): two minutes in
      # total, thirty seconds of it reserved for critical pods.
      shutdownGracePeriodSeconds: 120
      shutdownGracePeriodCriticalPodsSeconds: 30
    linuxNodeConfig:
      cgroupMode: CGROUP_MODE_V2
