  // reservation; SPECIFIC_RESERVATION targets one by name;
  // ANY_RESERVATION_THEN_FAIL consumes matching reservations and fails
  // scale-up (instead of falling back to on-demand) when none is
  // available.
  string consume_reservation_type = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "NO_RESERVATION",
        "ANY_RESERVATION",
        "SPECIFIC_RESERVATION",
        "ANY_RESERVATION_THEN_FAIL"
      ]
    }
  ];

  // Reservation label key — "compute.googleapis.com/reservation-name" for
  // SPECIFIC_RESERVATION.
  string key = 2;

  // Reservation label values — the reservation name(s).
  repeated string values = 3;
}

// GcpGkeNodePoolSecondaryBootDisk preloads data onto nodes at boot.
message GcpGkeNodePoolSecondaryBootDisk {
  // Disk image to create the secondary boot disk from (a prepared image
  // containing the container images/data to preload).
  string disk_image = 1 [(buf.validate.field).required = true];

  // CONTAINER_IMAGE_CACHE serves preloaded container images to the
  // container runtime. Empty attaches the disk without special handling.
  string mode = 2 [(buf.validate.field).cel = {
    id: "secondary_disk_mode_valid"
    message: "mode must be empty or CONTAINER_IMAGE_CACHE"
    expression: "this == '' || this == 'CONTAINER_IMAGE_CACHE'"
  }];
}

// GcpGkeNodePoolKubeletConfig tunes the kubelet on every node. Unset
// fields keep GKE defaults.
message GcpGkeNodePoolKubeletConfig {
  // CPU management: "static" gives Guaranteed-QoS pods exclusive cores
  // (latency-sensitive workloads); "none" (default) shares cores.
  string cpu_manager_policy = 1 [(buf.validate.field).cel = {
    id: "cpu_manager_policy_valid"
    message: "cpu_manager_policy must be empty, static, or none"
    expression: "this == '' || this in ['static', 'none']"
  }];

  // Enforce CPU CFS quota for containers with CPU limits. Disabling trades
  // throttling for potential node CPU contention.
  optional bool cpu_cfs_quota = 2;

  // CFS quota period, e.g. "100ms" (kubelet default) — shorter periods
  // smooth throttling for latency-sensitive workloads.
  string cpu_cfs_quota_period = 3;

  // Maximum processes per pod — a fork-bomb fence for multi-tenant pools.
  optional int64 pod_pids_limit = 4 [(buf.validate.field).int64 = {
    gte: 1024
    lte: 4194304
  }];

  // The kubelet's insecure read-only port 10255: FALSE closes it (the
  // hardened posture new clusters default to); TRUE keeps it open for
  // legacy monitoring agents that still scrape it.
  string insecure_kubelet_readonly_port_enabled = 5 [(buf.validate.field).cel = {
    id: "readonly_port_valid"
    message: "insecure_kubelet_readonly_port_enabled must be empty, TRUE, or FALSE"
    expression: "this == '' || this in ['TRUE', 'FALSE']"
  }];

  // Parallel image pulls (kubelet default serializes fewer) — speeds up
  // busy nodes that churn many images.
  optional int64 max_parallel_image_pulls = 6;

  // Container log file size before rotation, e.g. "10Mi" (10Mi-500Mi).
  string container_log_max_size = 7;

  // Rotated container log files kept per container (2-10).
  optional int64 container_log_max_files = 8 [(buf.validate.field).int64 = {
    gte: 2
    lte: 10
  }];

  // Disk usage percent below which image GC never runs (must be lower
  // than the high threshold).
  optional int64 image_gc_low_threshold_percent = 9 [(buf.validate.field).int64 = {
    gte: 10
    lte: 85
  }];

  // Disk usage percent above which image GC always runs.
  optional int64 image_gc_high_threshold_percent = 10 [(buf.validate.field).int64 = {
    gte: 10
    lte: 85
  }];

  // Minimum age an unused image must reach before GC may remove it,
  // seconds format, e.g. "120s".
  string image_minimum_gc_age = 11 [(buf.validate.field).cel = {
    id: "image_min_gc_age_format"
    message: "image_minimum_gc_age must be a seconds-format duration like \"120s\""
    expression: "this == '' || this.matches('^[0-9]+(\\\\.[0-9]+)?s$')"
  }];

  // Maximum age an unused image may reach before GC removes it regardless
  // of disk pressure, seconds format, e.g. "86400s".
  string image_maximum_gc_age = 12 [(buf.validate.field).cel = {
    id: "image_max_gc_age_format"
    message: "image_maximum_gc_age must be a seconds-format duration like \"86400s\""
    expression: "this == '' || this.matches('^[0-9]+(\\\\.[0-9]+)?s$')"
  }];

  // Sysctl patterns pods may set as unsafe sysctls (e.g. "net.*",
  // "kernel.shm*") — gate carefully: unsafe sysctls affect the whole
  // node, not just the pod that sets them.
  repeated string allowed_unsafe_sysctls = 13 [(buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE];

  // Maximum seconds the kubelet grants a pod to terminate during
  // soft-eviction (caps the pod's own grace period in that path).
  optional int64 eviction_max_pod_grace_period_seconds = 14 [(buf.validate.field).int64.gte = 0];

  // Kill only the offending process instead of the whole container on
  // OOM — for containers running multiple processes where one leaking
  // process should not take down its siblings.
  optional bool single_process_oom_kill = 15;

  // Soft eviction thresholds: the kubelet starts graceful pod eviction
  // when a signal stays past its threshold for the paired grace period.
  GcpGkeNodePoolEvictionSignals eviction_soft = 16;

  // Grace periods paired with eviction_soft: how long a signal must stay
  // past its threshold before eviction starts (durations like "90s").
  GcpGkeNodePoolEvictionGracePeriods eviction_soft_grace_period = 17;

  // Minimum amounts reclaimed per eviction: prevents thrashing by making
  // each eviction free at least this much of the signal's resource.
  GcpGkeNodePoolEvictionMinimumReclaim eviction_minimum_reclaim = 18;

  // Caps the exponential backoff for restarting crashed containers —
  // lower caps recover crash-looping containers faster at the cost of
  // more restart churn.
  GcpGkeNodePoolCrashLoopBackOff crash_loop_back_off = 19;

  // Kubernetes Memory Manager policy: Static reserves exclusive NUMA
  // memory for Guaranteed-QoS pods; None (default) does not.
  GcpGkeNodePoolMemoryManager memory_manager = 20;

  // Kubernetes Topology Manager: aligns CPU, memory, and device (GPU)
  // NUMA placement per pod or per container — for latency-critical and
  // HPC workloads that suffer on cross-NUMA access.
  GcpGkeNodePoolTopologyManager topology_manager = 21;

  // Graceful node shutdown: the total time, in seconds, a node delays its
  // shutdown so every pod (critical and non-critical) can terminate
  // cleanly when the VM is reclaimed. Only configurable on Spot or
  // preemptible pools (the ones that get reclaimed). Between 10 and
  // 10000. Leave unset for GKE's default; sent only when set because the
  // API fills the value itself.
  optional int64 shutdown_grace_period_seconds = 22 [(buf.validate.field).int64 = {
    gte: 10
    lte: 10000
  }];

  // The portion of shutdown_grace_period_seconds reserved for critical
  // pods (system-node-critical and system-cluster-critical priority
  // classes) after ordinary pods have been given their share. Must not
  // exceed shutdown_grace_period_seconds. Spot or preemptible pools only.
  // Sent only when set because the API fills the value itself.
  optional int64 shutdown_grace_period_critical_pods_seconds = 23 [(buf.validate.field).int64 = {
    gte: 0
    lte: 10000
  }];

  option (buf.validate.message).cel = {
    id: "critical_grace_within_total"
    message: "shutdown_grace_period_critical_pods_seconds cannot exceed shutdown_grace_period_seconds"
    expression: "!has(this.shutdown_grace_period_critical_pods_seconds) || !has(this.shutdown_grace_period_seconds) || this.shutdown_grace_period_critical_pods_seconds <= this.shutdown_grace_period_seconds"
  };
}

// GcpGkeNodePoolEvictionSignals holds per-signal soft-eviction thresholds.
// Each value is an absolute quantity ("100Mi") or percentage ("10%").
message GcpGkeNodePoolEvictionSignals {
  // Threshold for memory.available.
  string memory_available = 1;

  // Threshold for nodefs.available (the filesystem backing pod volumes
  // and logs).
  string nodefs_available = 2;

  // Threshold for nodefs.inodesFree.
  string nodefs_inodes_free = 3;

  // Threshold for imagefs.available (the filesystem backing container
  // images and writable layers).
  string imagefs_available = 4;

  // Threshold for imagefs.inodesFree.
  string imagefs_inodes_free = 5;

  // Threshold for pid.available.
  string pid_available = 6;
}

// GcpGkeNodePoolEvictionGracePeriods pairs a grace period with each soft
// eviction signal. Values are durations like "90s".
message GcpGkeNodePoolEvictionGracePeriods {
  // Grace period for memory.available.
  string memory_available = 1;

  // Grace period for nodefs.available.
  string nodefs_available = 2;

  // Grace period for nodefs.inodesFree.
  string nodefs_inodes_free = 3;

  // Grace period for imagefs.available.
  string imagefs_available = 4;

  // Grace period for imagefs.inodesFree.
  string imagefs_inodes_free = 5;

  // Grace period for pid.available.
  string pid_available = 6;
}

// GcpGkeNodePoolEvictionMinimumReclaim sets per-signal minimum reclaim
// amounts. Unlike the soft-eviction thresholds (which accept absolute
// quantities OR percentages), GKE accepts ONLY percentages here — the API
// rejects quantities at create with 'invalid percentage "100Mi", must end
// with "%"'. Values are percentage strings like "10%".
message GcpGkeNodePoolEvictionMinimumReclaim {
  // Minimum reclaim for memory.available, percentage like "10%".
  string memory_available = 1 [(buf.validate.field).cel = {
    id: "reclaim_memory_pct"
    message: "eviction_minimum_reclaim.memory_available must be a percentage like \"10%\" — GKE rejects absolute quantities here"
    expression: "this == '' || this.matches('^[0-9]+(\\\\.[0-9]+)?%$')"
  }];

  // Minimum reclaim for nodefs.available, percentage like "10%".
  string nodefs_available = 2 [(buf.validate.field).cel = {
    id: "reclaim_nodefs_pct"
    message: "eviction_minimum_reclaim.nodefs_available must be a percentage like \"10%\" — GKE rejects absolute quantities here"
    expression: "this == '' || this.matches('^[0-9]+(\\\\.[0-9]+)?%$')"
  }];

  // Minimum reclaim for nodefs.inodesFree, percentage like "10%".
  string nodefs_inodes_free = 3 [(buf.validate.field).cel = {
    id: "reclaim_nodefs_inodes_pct"
    message: "eviction_minimum_reclaim.nodefs_inodes_free must be a percentage like \"10%\" — GKE rejects absolute quantities here"
    expression: "this == '' || this.matches('^[0-9]+(\\\\.[0-9]+)?%$')"
  }];

  // Minimum reclaim for imagefs.available, percentage like "10%".
  string imagefs_available = 4 [(buf.validate.field).cel = {
    id: "reclaim_imagefs_pct"
    message: "eviction_minimum_reclaim.imagefs_available must be a percentage like \"10%\" — GKE rejects absolute quantities here"
    expression: "this == '' || this.matches('^[0-9]+(\\\\.[0-9]+)?%$')"
  }];

  // Minimum reclaim for imagefs.inodesFree, percentage like "10%".
  string imagefs_inodes_free = 5 [(buf.validate.field).cel = {
    id: "reclaim_imagefs_inodes_pct"
    message: "eviction_minimum_reclaim.imagefs_inodes_free must be a percentage like \"10%\" — GKE rejects absolute quantities here"
    expression: "this == '' || this.matches('^[0-9]+(\\\\.[0-9]+)?%$')"
  }];

  // Minimum reclaim for pid.available, percentage like "10%".
  string pid_available = 6 [(buf.validate.field).cel = {
    id: "reclaim_pid_pct"
    message: "eviction_minimum_reclaim.pid_available must be a percentage like \"10%\" — GKE rejects absolute quantities here"
    expression: "this == '' || this.matches('^[0-9]+(\\\\.[0-9]+)?%$')"
  }];
}

// GcpGkeNodePoolCrashLoopBackOff caps container-restart backoff.
message GcpGkeNodePoolCrashLoopBackOff {
  // Maximum backoff delay between restarts of a crashing container,
  // seconds format (e.g. "300s"; kubelet default caps at 300s).
  string max_container_restart_period = 1 [(buf.validate.field).cel = {
    id: "max_restart_period_format"
    message: "max_container_restart_period must be a seconds-format duration like \"300s\""
    expression: "this == '' || this.matches('^[0-9]+(\\\\.[0-9]+)?s$')"
  }];
}

// GcpGkeNodePoolMemoryManager selects the kubelet Memory Manager policy.
message GcpGkeNodePoolMemoryManager {
  // "Static" reserves exclusive NUMA-aligned memory for Guaranteed-QoS
  // pods; "None" disables the manager. Capitalized, per the kubelet's
  // own policy names.
  string policy = 1 [(buf.validate.field).cel = {
    id: "memory_manager_policy_valid"
    message: "policy must be empty, None, or Static"
    expression: "this == '' || this in ['None', 'Static']"
  }];
}

// GcpGkeNodePoolTopologyManager aligns NUMA placement of CPU, memory, and
// devices.
message GcpGkeNodePoolTopologyManager {
  // Alignment policy: none (default), best-effort, restricted, or
  // single-numa-node (strictest — pods failing alignment are rejected).
  string policy = 1 [(buf.validate.field).cel = {
    id: "topology_manager_policy_valid"
    message: "policy must be empty, none, best-effort, restricted, or single-numa-node"
    expression: "this == '' || this in ['none', 'best-effort', 'restricted', 'single-numa-node']"
  }];

  // Alignment scope: container (default; each container aligned
  // independently) or pod (all containers of a pod share one alignment).
  string scope = 2 [(buf.validate.field).cel = {
    id: "topology_manager_scope_valid"
    message: "scope must be empty, container, or pod"
    expression: "this == '' || this in ['container', 'pod']"
  }];
}

// GcpGkeNodePoolLinuxNodeConfig tunes the node OS.
message GcpGkeNodePoolLinuxNodeConfig {
  // Sysctls applied to every node, e.g.
  // {"net.core.somaxconn": "4096"} — only GKE's allowlisted keys.
  map<string, string> sysctls = 1;

  // Container runtime cgroup mode: CGROUP_MODE_V2 (the modern default on
  // current GKE versions) or CGROUP_MODE_V1 for workloads that still need
  // v1.
  string cgroup_mode = 2 [(buf.validate.field).cel = {
    id: "cgroup_mode_valid"
    message: "cgroup_mode must be empty, CGROUP_MODE_UNSPECIFIED, CGROUP_MODE_V1, or CGROUP_MODE_V2"
    expression: "this == '' || this in ['CGROUP_MODE_UNSPECIFIED', 'CGROUP_MODE_V1', 'CGROUP_MODE_V2']"
  }];

  // Hugepage pre-allocation for DPDK/database workloads.
  GcpGkeNodePoolHugepagesConfig hugepages_config = 3;

  // Kernel transparent hugepage mode for anonymous memory:
  // ALWAYS, MADVISE (only regions that request it), or NEVER.
  string transparent_hugepage_enabled = 4 [(buf.validate.field).cel = {
    id: "thp_enabled_valid"
    message: "transparent_hugepage_enabled must be empty, TRANSPARENT_HUGEPAGE_ENABLED_ALWAYS, TRANSPARENT_HUGEPAGE_ENABLED_MADVISE, TRANSPARENT_HUGEPAGE_ENABLED_NEVER, or TRANSPARENT_HUGEPAGE_ENABLED_UNSPECIFIED"
    expression: "this == '' || this in ['TRANSPARENT_HUGEPAGE_ENABLED_ALWAYS', 'TRANSPARENT_HUGEPAGE_ENABLED_MADVISE', 'TRANSPARENT_HUGEPAGE_ENABLED_NEVER', 'TRANSPARENT_HUGEPAGE_ENABLED_UNSPECIFIED']"
  }];

  // Kernel defrag behavior when allocating transparent hugepages:
  // ALWAYS (stall to reclaim), DEFER (kick background reclaim),
  // DEFER_WITH_MADVISE, MADVISE, or NEVER.
  string transparent_hugepage_defrag = 5 [(buf.validate.field).cel = {
    id: "thp_defrag_valid"
    message: "transparent_hugepage_defrag must be empty, TRANSPARENT_HUGEPAGE_DEFRAG_ALWAYS, TRANSPARENT_HUGEPAGE_DEFRAG_DEFER, TRANSPARENT_HUGEPAGE_DEFRAG_DEFER_WITH_MADVISE, TRANSPARENT_HUGEPAGE_DEFRAG_MADVISE, TRANSPARENT_HUGEPAGE_DEFRAG_NEVER, or TRANSPARENT_HUGEPAGE_DEFRAG_UNSPECIFIED"
    expression: "this == '' || this in ['TRANSPARENT_HUGEPAGE_DEFRAG_ALWAYS', 'TRANSPARENT_HUGEPAGE_DEFRAG_DEFER', 'TRANSPARENT_HUGEPAGE_DEFRAG_DEFER_WITH_MADVISE', 'TRANSPARENT_HUGEPAGE_DEFRAG_MADVISE', 'TRANSPARENT_HUGEPAGE_DEFRAG_NEVER', 'TRANSPARENT_HUGEPAGE_DEFRAG_UNSPECIFIED']"
  }];

  // Signed-kernel-module enforcement: ENFORCE_SIGNED_MODULES rejects
  // unsigned module loads (the hardened posture);
  // DO_NOT_ENFORCE_SIGNED_MODULES allows them.
  string node_kernel_module_loading_policy = 6 [(buf.validate.field).cel = {
    id: "kernel_module_policy_valid"
    message: "node_kernel_module_loading_policy must be empty, POLICY_UNSPECIFIED, ENFORCE_SIGNED_MODULES, or DO_NOT_ENFORCE_SIGNED_MODULES"
    expression: "this == '' || this in ['POLICY_UNSPECIFIED', 'ENFORCE_SIGNED_MODULES', 'DO_NOT_ENFORCE_SIGNED_MODULES']"
  }];

  // PTP/KVM paravirtual clock sync for sub-millisecond time accuracy —
  // for workloads needing precise cross-node timestamps (trading,
  // distributed tracing at fine granularity).
  optional bool enable_ptp_kvm_time_sync = 7;

  // Swap on the nodes (Kubernetes swap support): sizing profile plus
  // encryption. Swap trades OOM kills for latency under memory pressure;
  // pair with kubelet eviction tuning.
  GcpGkeNodePoolSwapConfig swap_config = 8;

  // A custom initialization script GKE runs on every node at boot,
  // before the node joins the cluster — for host-level setup that no
  // DaemonSet can do (kernel parameters that need a reboot-free apply,
  // vendor agents, custom certificates). Sourced from Cloud Storage or
  // Secret Manager; exactly one source.
  GcpGkeNodePoolCustomNodeInit custom_node_init = 9;
}

// GcpGkeNodePoolCustomNodeInit is the node's boot-time init script.
message GcpGkeNodePoolCustomNodeInit {
  option (buf.validate.message).cel = {
    id: "exactly_one_init_script_source"
    message: "set exactly one of gcs_uri or secret_manager_secret_uri for the init script"
    expression: "(this.gcs_uri != '') != (this.secret_manager_secret_uri != '')"
  };

  option (buf.validate.message).cel = {
    id: "gcs_generation_requires_gcs_uri"
    message: "gcs_generation pins a Cloud Storage object version — set gcs_uri alongside it"
    expression: "!has(this.gcs_generation) || this.gcs_uri != ''"
  };

  // Cloud Storage object holding the script, e.g.
  // "gs://my-bucket/node-init.sh". The node's service account needs read
  // access to the object.
  string gcs_uri = 1 [(buf.validate.field).cel = {
    id: "gcs_uri_format"
    message: "gcs_uri must be a gs:// object URI"
    expression: "this == '' || this.startsWith('gs://')"
  }];

  // Pin the Cloud Storage object to one generation so a later upload
  // does not silently change what new nodes run. Leave unset to always
  // fetch the current object; sent only when set because the API records
  // the generation it resolved.
  optional int64 gcs_generation = 2 [(buf.validate.field).int64.gte = 1];

  // Secret Manager secret version holding the script, e.g.
  // "projects/P/secrets/node-init/versions/latest" — for scripts that
  // embed credentials. The node's service account needs
  // secretmanager.versions.access on it.
  string secret_manager_secret_uri = 3 [(buf.validate.field).cel = {
    id: "secret_uri_format"
    message: "secret_manager_secret_uri must be a Secret Manager version resource name: projects/{project}/secrets/{secret}/versions/{version}"
    expression: "this == '' || this.matches('^projects/[^/]+/secrets/[^/]+/versions/[^/]+$')"
  }];
}

// GcpGkeNodePoolSwapConfig provisions and encrypts node swap space.
// Size swap with AT MOST ONE profile: boot-disk, dedicated local SSDs,
// or a slice of the ephemeral local SSDs (none lets GKE choose its
// default sizing).
message GcpGkeNodePoolSwapConfig {
  option (buf.validate.message).cel = {
    id: "at_most_one_swap_profile"
    message: "size swap with at most one profile: boot_disk_profile, dedicated_local_ssd_profile, or ephemeral_local_ssd_profile"
    expression: "(has(this.boot_disk_profile) ? 1 : 0) + (has(this.dedicated_local_ssd_profile) ? 1 : 0) + (has(this.ephemeral_local_ssd_profile) ? 1 : 0) <= 1"
  };

  // Whether swap is enabled on the nodes.
  optional bool enabled = 1;

  // Swap carved from the boot disk.
  GcpGkeNodePoolSwapSizing boot_disk_profile = 2;

  // Swap on local SSDs dedicated entirely to swap.
  GcpGkeNodePoolSwapDedicatedSsd dedicated_local_ssd_profile = 3;

  // Swap carved from the ephemeral-storage local SSDs.
  GcpGkeNodePoolSwapSizing ephemeral_local_ssd_profile = 4;

  // Swap encryption (on by default; disabling trades confidentiality for
  // a little throughput).
  GcpGkeNodePoolSwapEncryption encryption_config = 5;
}

// GcpGkeNodePoolSwapSizing sizes swap as absolute GiB or a percentage of
// the backing storage.
message GcpGkeNodePoolSwapSizing {
  option (buf.validate.message).cel = {
    id: "swap_size_gib_xor_percent"
    message: "set swap_size_gib or swap_size_percent, not both"
    expression: "!(has(this.swap_size_gib) && has(this.swap_size_percent))"
  };

  // Absolute swap size in GiB.
  optional int64 swap_size_gib = 1 [(buf.validate.field).int64.gte = 1];

  // Swap size as a percentage of the backing storage (1-100).
  optional int32 swap_size_percent = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
}

// GcpGkeNodePoolSwapDedicatedSsd dedicates whole local SSDs to swap.
message GcpGkeNodePoolSwapDedicatedSsd {
  // Number of local SSDs dedicated to swap.
  optional int64 disk_count = 1 [(buf.validate.field).int64.gte = 1];
}

// GcpGkeNodePoolSwapEncryption controls swap encryption.
message GcpGkeNodePoolSwapEncryption {
  // Set true to DISABLE swap encryption (encrypted by default).
  optional bool disabled = 1;
}

// GcpGkeNodePoolHugepagesConfig pre-allocates hugepages on every node.
message GcpGkeNodePoolHugepagesConfig {
  // Number of 2MB hugepages.
  optional int64 hugepage_size_2m = 1;

  // Number of 1GB hugepages.
  optional int64 hugepage_size_1g = 2;
}
