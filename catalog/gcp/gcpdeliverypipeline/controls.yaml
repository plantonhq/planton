# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpdeliverypipeline
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Pipeline and automation configuration is stored by Cloud Deploy, encrypted at rest by Google.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: The pipeline holds configuration only; render and deploy artifacts land in the targets' artifact storage bucket, whose key is set on that bucket.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Management calls ride the TLS-only Cloud Deploy API endpoint.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A pipeline has no address of its own; releases and rollouts are created through the Cloud Deploy API under IAM.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network listener exists to restrict.
    - control_id: edge-protection
      status: not_applicable
      notes: The pipeline serves no traffic.
    - control_id: rbac
      status: configurable
      field_path: automations
      evidence:
        type: spec_default
        reference: Automations act only as the user-managed service account each one names, and only on the targets its selector picks; who may create releases is pipeline IAM (roles/clouddeploy.releaser), outside this block.
    - control_id: workload-identity
      status: configurable
      field_path: automations
      evidence:
        type: spec_default
        reference: Each automation runs as a named user-managed service account (no keys); the deploying identity needs iam.serviceAccounts.actAs on it.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths exist to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component enforces no end-user sign-in; access is administrative, whose posture rbac carries.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Pipeline, automation, release, and rollout changes are Cloud Deploy admin writes recorded in Cloud Audit Logs (Admin Activity) unconditionally.
    - control_id: monitoring-integration
      status: configurable
      field_path: serial_pipeline.stages
      evidence:
        type: spec_default
        reference: A stage strategy's analysis job watches Cloud Monitoring alert policies (google_cloud.alert_policy_checks) and fails the rollout when one fires.
    - control_id: backup-recovery
      status: not_applicable
      notes: The pipeline is configuration recreated from its manifest; its release history is not backed up and is deleted with it.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The pipeline is a regional Cloud Deploy resource Google operates; there is no zone placement to choose.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: deletion_policy PREVENT makes destroy fail -- the guard that matters here, because the provider always deletes with force=true, taking releases, rollouts, and automations with the pipeline.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Cloud Deploy is fully Google-operated.
