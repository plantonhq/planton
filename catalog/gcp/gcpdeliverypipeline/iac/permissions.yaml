# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpdeliverypipeline
spec:
  gcp:
    groups:
      - purpose: EnableCloudDeployApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling clouddeploy.googleapis.com on the pipeline's project. disable_on_destroy is false, so the disable permission is never needed.
      - purpose: ManageDeliveryPipeline
        permissions:
          - clouddeploy.deliveryPipelines.create
          - clouddeploy.deliveryPipelines.get
          - clouddeploy.deliveryPipelines.update
          - clouddeploy.deliveryPipelines.delete
          - clouddeploy.operations.get
        provenance: derived
        notes: Covers google_clouddeploy_delivery_pipeline (Pulumi clouddeploy.DeliveryPipeline) -- create, read on every refresh, in-place updates (stages, strategies, labels, suspended), and delete under deletion_policy DELETE (ABANDON and PREVENT call no delete API; the delete always sends force=true). Create, update, and delete return long-running operations the provider polls with clouddeploy.operations.get.
      - purpose: ManageAutomations
        permissions:
          - clouddeploy.automations.create
          - clouddeploy.automations.get
          - clouddeploy.automations.update
          - clouddeploy.automations.delete
          - clouddeploy.operations.get
        provenance: derived
        condition:
          spec_field_set: automations
        notes: Only when automations is set -- covers one google_clouddeploy_automation (Pulumi clouddeploy.Automation) per entry, with create, refresh reads, in-place updates, and delete returning long-running operations polled with clouddeploy.operations.get.
      - purpose: ActAsAutomationServiceAccount
        permissions:
          - iam.serviceAccounts.actAs
        provenance: derived
        condition:
          spec_field_set: automations
        notes: Only when automations is set -- Cloud Deploy requires the caller creating or updating an automation to act as the service account the automation runs as (roles/iam.serviceAccountUser carries this permission). Grant it on that service account rather than project-wide.
