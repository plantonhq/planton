syntax = "proto3";

package dev.planton.gcp.gcpdeliverypipeline.v1alpha1;

// GcpDeliveryPipelineOutputs carries the pipeline's identity: what
// releases are created against, and what a GcpDeployPolicy selector names.
message GcpDeliveryPipelineOutputs {
  // Full resource name:
  // projects/{project}/locations/{location}/deliveryPipelines/{delivery_pipeline_id}.
  string name = 1;
  // The pipeline's ID -- the value `gcloud deploy releases create
  // --delivery-pipeline` and a deploy policy's pipeline selector take.
  string delivery_pipeline_id = 2;
  // Google's unique identifier for the pipeline.
  string uid = 3;
}
