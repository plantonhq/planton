syntax = "proto3";

package dev.planton.gcp.gcpdeliverypipeline.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpdeliverypipeline/v1alpha1/outputs.proto";
import "catalog/gcp/gcpdeliverypipeline/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-delivery-pipeline
message GcpDeliveryPipeline {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpDeliveryPipeline'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpDeliveryPipelineSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpDeliveryPipelineStatus status = 5;
}

//gcp-delivery-pipeline status
message GcpDeliveryPipelineStatus {
  //stack-outputs
  GcpDeliveryPipelineStackOutputs outputs = 1;
}
