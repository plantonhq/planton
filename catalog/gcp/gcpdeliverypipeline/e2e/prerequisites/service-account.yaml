# GcpServiceAccount fixture: the identity the scenarios' automations run
# as, referenced through its email output. It holds no roles: no release is
# created, so no automation ever fires. The cloud-side account id carries
# ${E2E_RUN_ID} (account ids are reserved briefly after deletion);
# metadata.name stays fixed for FK resolution.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpServiceAccount
metadata:
  name: planton-oss-e2e-gcpcdpip-automation
  id: planton-oss-e2e-gcpcdpip-automation
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpdeliverypipeline
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  serviceAccountId: e2e-cdpip-${E2E_RUN_ID}
  displayName: Planton OSS E2E Cloud Deploy automation identity
  description: Ephemeral Cloud Deploy automation identity deployed as an E2E prerequisite; safe to delete
