apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpdeliverypipeline
spec:
  # Proven live on both engines (2026-11-18): a two-stage promote pipeline, a
  # Cloud Run canary, and a pipeline with automations, each deployed and
  # destroyed by an identity holding only this kind's permissions manifest, and
  # the two-stage pipeline updated in place. Measured: an empty standard
  # strategy is Google's default and is stored as none, so the modules send a
  # strategy only when it carries something (it re-planned forever before); a
  # canary deployment's predeploy and postdeploy cannot be stored by the
  # provider on Terraform, so the spec refuses them. The GKE gateway-mesh and
  # service-networking canary arms stay offline-only.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
