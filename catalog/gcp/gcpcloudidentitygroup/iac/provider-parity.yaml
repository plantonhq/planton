# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_cloud_identity_group:
    mappings:
      # The spec spells the group key as what it is -- the group's email --
      # and the identity-mapped namespace beside it.
      - spec: spec.group_email
        arg: group_key.id
      - spec: spec.group_namespace
        arg: group_key.namespace
      # The Cloud Identity customer the group lives under.
      - spec: spec.customer_id
        arg: parent
      # Google accepts exactly two labels here, both with empty values: the
      # discussion-forum label every Google Group must carry and the
      # security label that turns it into a security group. The spec
      # exposes the one real choice (security) and both modules derive the
      # map from it.
      - spec: spec.security
        arg: labels

  # One membership per member, folded into the group (many per parent,
  # referenced by nothing). Its group link is the composed group.
  google_cloud_identity_group_membership:
    specRoot: spec.memberships
    mappings:
      - spec: spec.memberships.member
        arg: preferred_member_key.id
      - spec: spec.memberships.member_namespace
        arg: preferred_member_key.namespace
      - spec: spec.memberships.roles.expire_time
        arg: roles.expiry_detail.expire_time
      - spec: spec.deletion_policy
        arg: deletion_policy
    exclusions:
      - arg: group
        reason: >-
          composed link -- the module attaches each membership to the group
          this kind builds, never a caller-supplied one
