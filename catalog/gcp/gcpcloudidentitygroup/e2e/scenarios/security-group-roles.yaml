# GcpCloudIdentityGroup scenario: a SECURITY group whose one member (the
# service-account prerequisite) is also a MANAGER, with WITH_INITIAL_OWNER
# so the caller becomes an owner -- the shape that proves the security
# label, the role set, and the extra owner Google adds. Owner-arranged
# customer and domain tokens.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudIdentityGroup
metadata:
  name: planton-oss-e2e-gcpcigrp-security
  id: planton-oss-e2e-gcpcigrp-security
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpcloudidentitygroup
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-required-env: PLANTON_E2E_GCP_CLOUD_IDENTITY_CUSTOMER_ID,PLANTON_E2E_VERIFIED_DOMAIN
    planton.dev/e2e-prerequisites: GcpServiceAccount
  tags:
    - planton-e2e
spec:
  groupEmail: planton-e2e-sec-${E2E_RUN_ID}@${E2E_ENV:PLANTON_E2E_VERIFIED_DOMAIN}
  customerId: ${E2E_ENV:PLANTON_E2E_GCP_CLOUD_IDENTITY_CUSTOMER_ID}
  displayName: planton-e2e-security-${E2E_RUN_ID}
  security: true
  initialGroupConfig: WITH_INITIAL_OWNER
  memberships:
    - member:
        valueFrom:
          kind: GcpServiceAccount
          name: planton-oss-e2e-gsa-prereq
          fieldPath: status.outputs.email
      roles:
        - name: MEMBER
        - name: MANAGER
      createIgnoreAlreadyExists: true
  deletionPolicy: DELETE
