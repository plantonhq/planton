# GcpCloudIdentityGroup scenario: a plain Google Group with one member (a
# GcpServiceAccount prerequisite by reference) under the owner-arranged
# Cloud Identity customer (PLANTON_E2E_GCP_CLOUD_IDENTITY_CUSTOMER_ID) in
# the owner-arranged verified domain; the lane skips honestly when either
# token is unset.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudIdentityGroup
metadata:
  name: planton-oss-e2e-gcpcigrp-minimal
  id: planton-oss-e2e-gcpcigrp-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpcloudidentitygroup
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-required-env: PLANTON_E2E_GCP_CLOUD_IDENTITY_CUSTOMER_ID,PLANTON_E2E_VERIFIED_DOMAIN
    planton.dev/e2e-prerequisites: GcpServiceAccount
  tags:
    - planton-e2e
spec:
  groupEmail: planton-e2e-${E2E_RUN_ID}@${E2E_ENV:PLANTON_E2E_VERIFIED_DOMAIN}
  customerId: ${E2E_ENV:PLANTON_E2E_GCP_CLOUD_IDENTITY_CUSTOMER_ID}
  displayName: planton-e2e-${E2E_RUN_ID}
  description: Ephemeral group created by the Planton E2E harness; safe to delete
  memberships:
    - member:
        valueFrom:
          kind: GcpServiceAccount
          name: planton-oss-e2e-gsa-prereq
          fieldPath: status.outputs.email
  deletionPolicy: DELETE
