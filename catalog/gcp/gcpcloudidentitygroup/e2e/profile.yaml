apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpcloudidentitygroup
spec:
  # A Google Group lives under a Cloud Identity or Workspace customer, not
  # in the harness project, so proving it needs a customer the E2E identity
  # can administer (the Groups Admin role) with a verified domain for the
  # group's email, exported as PLANTON_E2E_GCP_CLOUD_IDENTITY_CUSTOMER_ID and
  # PLANTON_E2E_VERIFIED_DOMAIN -- neither exists for the shared test
  # identity today. Offline bar met: both modules build and validate,
  # offline plans for the reference manifest and both scenarios (the tokens
  # substituted) are clean on the pinned provider, and the accounting is
  # total. Live facts the proof lane confirms when the customer exists: (1)
  # the group deploys with the discussion-forum label (and the security
  # label on the security scenario) and RE-PLANS CLEAN under the
  # apply-idempotency gate on both engines; (2) the service-account
  # prerequisite lands as a membership by email and its roles round-trip
  # as a set (MEMBER + MANAGER); (3) WITH_INITIAL_OWNER adds the caller as
  # an owner beyond the declared list -- the verifier accepts a live count
  # at or above the declared one; (4) the group_email and name outputs
  # agree across engines and the group is gone after destroy (Cloud
  # Identity answers 403, not 404, for a deleted group).
  tier: 2
  status: deferred
  deferred_reason: a Cloud Identity group needs a customer the E2E identity can administer (Groups Admin) and a verified domain, exported as PLANTON_E2E_GCP_CLOUD_IDENTITY_CUSTOMER_ID and PLANTON_E2E_VERIFIED_DOMAIN, neither of which the E2E test identity has; offline plans only
  validated_provisioners: []
  timeout_minutes: 10
