apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpvertexaipersistentresource
spec:
  # Proven live on both engines (2026-11-20): one pool of one n1-standard-4,
  # deployed, renamed (which replaces it) and destroyed by an identity holding
  # only this kind's permissions manifest, with the re-plan clean. The
  # provider updates a persistent resource with a PUT Google does not serve
  # and treats labels as replacing, so every change replaces the resource;
  # the modules replace delete-first, since the ID is held while the old one
  # exists. Google's audit log shows the replacement, as declared.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 60
