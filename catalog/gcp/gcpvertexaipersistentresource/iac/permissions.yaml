# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpvertexaipersistentresource
spec:
  gcp:
    groups:
      - purpose: EnableAiplatformApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling aiplatform.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManagePersistentResource
        permissions:
          - aiplatform.persistentResources.create
          - aiplatform.persistentResources.get
          - aiplatform.persistentResources.delete
        provenance: derived
        notes: Covers google_vertex_ai_persistent_resource (Pulumi vertex.AiPersistentResource) -- created and deleted through long-running operations the provider polls, patched for display name, labels, and replica counts, read on every refresh. roles/aiplatform.admin contains all of them. GCP defines no aiplatform.persistentResources.update permission (roles/aiplatform.admin carries create, get, list, and delete only), so the in-place PATCH authorizes under a permission this list already holds; the live capture lane names which. GCP defines no aiplatform.operations.get permission (IAM's testable-permissions inventory carries only aiplatform.operations.list); polling the long-running operations needs nothing beyond these.
      - purpose: ResolveNetworkProjectNumber
        permissions:
          - resourcemanager.projects.get
        provenance: derived
        notes: Covers data.google_project (Pulumi organizations.LookupProject), read only when the peered network's path carries a project ID -- Google requires the project number in it. Needed on the network's project.
