# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpvertexaipersistentresource
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Vertex AI encrypts every replica's disks at rest with Google-managed keys without configuration.
    - control_id: enc-at-rest-cmk
      status: configurable
      field_path: kms_key_name
      evidence:
        type: spec_default
        reference: Unset means Google-managed encryption; a Cloud KMS key in the resource's region encrypts the machines' disks under the customer-managed key, and jobs on the resource must use the same key. Fixed at creation.
      notes: The 02-private-gpu-pool preset references a GcpKmsKey.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Control-plane calls are TLS to the regional Vertex AI endpoint; job traffic to Google services from the machines is TLS within Google's network.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The machines run in Google's tenant project with no inbound address; jobs are submitted only through the Vertex AI API under IAM.
    - control_id: restricted-ingress
      status: not_applicable
      notes: The machines accept no inbound connections; they reach private services outbound through network peering or a PSC interface.
    - control_id: edge-protection
      status: not_applicable
      notes: No edge is served; the resource runs batch training.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Managing the resource requires aiplatform.persistentResources.* permissions; running a job on it requires aiplatform.customJobs.create plus actAs on the job's service account.
    - control_id: workload-identity
      status: configurable
      field_path: enable_custom_service_account
      evidence:
        type: spec_default
        reference: Unset (false) runs jobs as the Vertex AI Custom Code Service Agent; true requires every job to run as a user-managed service account it names -- least-privilege identities per workload. Fixed at creation.
      notes: The 02-private-gpu-pool preset sets it.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths exist to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component enforces no end-user sign-in; access is administrative, whose posture rbac carries.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every persistent resource create, update, and delete, and every job submitted to it, is a Vertex AI admin write recorded in Cloud Audit Logs (Admin Activity) unconditionally.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Vertex AI emits the resource's replica usage and the jobs' CPU, memory, and accelerator metrics to Cloud Monitoring under the Vertex AI resource types without configuration.
    - control_id: backup-recovery
      status: not_applicable
      notes: The machines are stateless training capacity; jobs write their outputs to Cloud Storage, and the resource is re-creatable from source control.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Vertex AI places the resource's machines in the region and replaces failed replicas itself; there is no zonal placement to choose.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Unset means DELETE -- the machines are released on destroy; PREVENT makes destroy fail; ABANDON leaves the resource running (and billing) outside management.
      notes: The 02-private-gpu-pool preset sets PREVENT.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Vertex AI operates the machines' images and runtime; there is no OS surface the customer patches.
