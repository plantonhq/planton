# GcpGkeWorkloadIdentityBinding: grants roles/iam.workloadIdentityUser on
# the chained service account to a run-scoped KSA principal.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGkeWorkloadIdentityBinding
metadata:
  name: planton-oss-e2e-wib-minimal
  id: planton-oss-e2e-wib-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpgkeworkloadidentitybinding
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  serviceAccountEmail:
    valueFrom:
      kind: GcpServiceAccount
      name: planton-oss-e2e-gsa-wib-prereq
      fieldPath: status.outputs.email
  ksaNamespace: e2e-${E2E_RUN_ID}
  ksaName: workload-sa
