# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: gcpgkeworkloadidentitybinding
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The binding stores no customer data -- it is one policy entry on the Google Service Account, control-plane metadata Google holds on its own encrypted infrastructure.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest exists to key (see enc-at-rest); the resource exposes no Cloud KMS surface.
    - control_id: enc-in-transit
      status: not_applicable
      notes: The binding terminates no connections. The token exchange it authorizes runs between the GKE metadata server and Google's IAM endpoints on the platform's own TLS -- a property of GCP's APIs, not a knob here.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: spec_validation
        reference: A public grant is unrepresentable -- the modules construct the member string from validated parts (serviceAccount:<pool-project>.svc.id.goog[<ksa_namespace>/<ksa_name>], with both KSA fields held to RFC 1123 patterns), so allUsers, allAuthenticatedUsers, or any hand-typed principal cannot appear in this grant.
      notes: This is the structural advantage over a generic IAM-member resource -- the only identity this kind can ever empower is one named Kubernetes ServiceAccount in one named namespace of the pool project's cluster fleet.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network path exists to restrict -- the grant admits no traffic; it authorizes identity impersonation evaluated inside IAM.
    - control_id: edge-protection
      status: not_applicable
      notes: The binding receives no inbound requests; there is nothing for a WAF to front.
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Managing the binding authorizes against iam.serviceAccounts.setIamPolicy and getIamPolicy on the target service account -- Service Account IAM, with no unauthenticated path. The grant it writes is itself maximally scoped RBAC -- the role is hardcoded to roles/iam.workloadIdentityUser in both modules, so this kind cannot hand out anything broader.
      notes: What the workload may DO in GCP is the GSA's own role set, assessed on the components granting those roles -- this binding only connects the KSA to the GSA.
    - control_id: workload-identity
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: This kind IS the keyless-identity control for GKE workloads -- the grant is the GCP half of Workload Identity, letting the named KSA mint short-lived tokens as the GSA through the GKE metadata server. Both modules hardcode roles/iam.workloadIdentityUser and construct the federated principal; no service-account key is created, exported, or ever exists in this path.
      notes: "Two prerequisites live outside this resource: the KSA must carry the iam.gke.io/gcp-service-account=<gsa-email> annotation (the Kubernetes half, owned by the workload's deployment -- the service_account_email output is exactly that value), and node pools must run workloadMetadataConfig.mode = GKE_METADATA. An optional condition can time-box the impersonation with a CEL expression."
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The binding carries no authentication path to disable -- it exists to make the legacy path (exported service-account JSON keys) unnecessary. Actually forbidding key creation on the GSA is the org policy iam.disableServiceAccountKeyCreation, outside this resource.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every create and destroy is a SetIamPolicy call on the service account, landing in Cloud Audit Logs (Admin Activity) unconditionally -- Google's Cloud Audit Logs overview states Admin Activity logs are always written and cannot be configured, excluded, or disabled.
      notes: Admin Activity covers changes TO the binding; visibility into each impersonation at runtime (which KSA minted tokens as the GSA, when) is Data Access audit logging for the IAM/credentials APIs -- disabled by default and enabled project-wide, not on this resource.
    - control_id: monitoring-integration
      status: not_applicable
      notes: A policy entry emits no metrics and has no export knob; token-minting activity surfaces through the audit-log pipeline (see audit-logging), not a metrics integration on this resource.
    - control_id: backup-recovery
      status: not_applicable
      notes: The binding is declarative configuration fully re-creatable from source control; there is no data to back up or restore.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The GSA's IAM policy is control-plane metadata Google replicates as part of the platform; no failure-domain choice exists on the resource.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither GCP nor this spec offers a deletion-protection flag for an IAM grant -- every field is immutable and destroy subtracts exactly this binding. Removal fails closed for the workload -- pods lose GCP access as their short-lived tokens expire -- so treat destroying a production binding as a workload outage, re-creatable from the manifest in seconds.
    - control_id: managed-patching
      status: not_applicable
      notes: There is no software surface here to patch; IAM and the GKE metadata server are Google's own infrastructure, patched as part of the platform.
