syntax = "proto3";

package dev.planton.gcp.gcpsubnetwork.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpsubnetwork/v1alpha1/outputs.proto";
import "catalog/gcp/gcpsubnetwork/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-subnetwork
message GcpSubnetwork {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpSubnetwork'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpSubnetworkSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpSubnetworkStatus status = 5;
}

//gcp-subnetwork status
message GcpSubnetworkStatus {
  //outputs
  //  outputs
  GcpSubnetworkOutputs outputs = 1;
}
