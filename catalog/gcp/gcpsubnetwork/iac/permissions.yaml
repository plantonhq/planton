# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpsubnetwork
spec:
  gcp:
    groups:
      - purpose: EnableComputeApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
          - resourcemanager.projects.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: "Covers google_project_service enabling compute.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed. Proven 2026-10-20 on dev by the least-privilege lane: an identity holding exactly the kind's rendered permissions deployed, updated and destroyed it. The provider reads the project with resourcemanager.projects.get before its services on every refresh, so a re-plan or destroy needs it (measured live)."
      - purpose: ManageSubnetwork
        permissions:
          - compute.subnetworks.create
          - compute.subnetworks.get
          - compute.subnetworks.update
          - compute.subnetworks.delete
          - compute.subnetworks.expandIpCidrRange
          - compute.subnetworks.setPrivateIpGoogleAccess
          - compute.networks.updatePolicy
          - compute.regionOperations.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: "Covers google_compute_subnetwork -- create, read/refresh, in-place updates, and destroy. The provider splits mutations across dedicated API methods with their own permissions -- growing ip_cidr_range calls expandIpCidrRange (the one-way expansion; shrinking recreates), toggling private_ip_google_access calls setPrivateIpGoogleAccess, and everything else mutable (role, secondary ranges, stack_type, flow-log config) patches the subnetwork under compute.subnetworks.update. Every mutation returns a region operation the provider polls. Creating a subnetwork changes its parent network, and Google authorizes that as compute.networks.updatePolicy on the network (\"Required 'compute.networks.updatePolicy' permission\", observed on a live create). The kind's READMEs previously recommended roles/compute.networkAdmin -- this manifest is the narrower truth (and networkAdmin alone was also insufficient: it lacks the serviceusage enablement grant the module needs). Proven 2026-10-20 on dev by the least-privilege lane: an identity holding exactly the kind's rendered permissions deployed, updated and destroyed it."
      - purpose: ApplyResourceManagerTags
        permissions:
          - compute.subnetworks.createTagBinding
          - resourcemanager.tagValueBindings.create
        provenance: derived
        reach: target
        privilege: ordinary
        condition:
          spec_field_set: resource_manager_tags
        notes: Attaching a tag at create time authorizes on both sides, the binding on the subnetwork and the use of each named tag value (tag values are org-level resources, so the tagValueBindings grant lives there). The module sends tags only through the create-only params block; tag changes replace the subnetwork, re-running these checks.
