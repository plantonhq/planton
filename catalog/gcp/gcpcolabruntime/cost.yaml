# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/componentcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostProfile
metadata:
  name: gcpcolabruntime
spec:
  billing_model: hybrid
  baseline_charges:
    - service_name: Colab Enterprise
      sku_meter: runtime persistent disk
      pricing_unit: GiB-months
      description: The runtime's disk bills for as long as the runtime exists, running or stopped (per cloud.google.com/colab/pricing, read 2026-09-23).
  cost_drivers:
    - field_path: desired_state
      sku_meter: runtime compute
      pricing_unit: vCPU-hours, GiB-hours, GPU-hours
      impact: A running runtime bills the machine and any GPUs its template sets; STOPPED stops the compute meter and keeps only the disk.
    - field_path: runtime_template
      sku_meter: runtime compute
      pricing_unit: vCPU-hours, GiB-hours, GPU-hours
      impact: The template's machine type, GPUs, and idle shutdown decide the hourly rate and how long an unattended runtime keeps billing.
