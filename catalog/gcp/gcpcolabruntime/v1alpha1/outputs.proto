syntax = "proto3";

package dev.planton.gcp.gcpcolabruntime.v1alpha1;

// GcpColabRuntimeOutputs carries the runtime's identity.
message GcpColabRuntimeOutputs {
  // Full resource name:
  // projects/{project}/locations/{location}/notebookRuntimes/{runtime_id}.
  string name = 1;

  // The runtime's id (the last segment of name).
  string runtime_id = 2;

  // The region the runtime lives in.
  string location = 3;

  // The runtime's state as Google reported it at the end of the deploy,
  // e.g. RUNNING or STOPPED. A snapshot: a runtime a user starts or idle
  // shutdown stops later reads as it was until the next deploy.
  string state = 4;
}
