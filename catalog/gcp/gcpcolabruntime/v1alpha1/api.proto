syntax = "proto3";

package dev.planton.gcp.gcpcolabruntime.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpcolabruntime/v1alpha1/outputs.proto";
import "catalog/gcp/gcpcolabruntime/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-colab-runtime
message GcpColabRuntime {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpColabRuntime'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpColabRuntimeSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpColabRuntimeStatus status = 5;
}

//gcp-colab-runtime status
message GcpColabRuntimeStatus {
  //stack-outputs
  GcpColabRuntimeStackOutputs outputs = 1;
}
