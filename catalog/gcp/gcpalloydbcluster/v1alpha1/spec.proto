syntax = "proto3";

package dev.planton.gcp.gcpalloydbcluster.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// GcpAlloydbClusterInitialUser defines the initial database superuser
// created during cluster provisioning. AlloyDB is PostgreSQL-compatible,
// so this user has full superuser privileges in the cluster.
//
// If not specified, no initial user is created and access must be configured
// manually after provisioning (e.g., via AlloyDB Auth Proxy + IAM).
message GcpAlloydbClusterInitialUser {
  // Password for the initial user. Must be at least 8 characters.
  // This value is sensitive and should be handled accordingly.
  string password = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 8,
    (dev.planton.shared.options.sensitive) = true
  ];

  // Username for the initial user. If not specified, defaults to "postgres"
  // per GCP AlloyDB conventions.
  string user = 2;
}

// GcpAlloydbClusterBackupSchedule defines when automated backups are taken.
// AlloyDB supports weekly schedules with configurable start times.
message GcpAlloydbClusterBackupSchedule {
  // Days of the week to take backups.
  // If not specified, GCP defaults to daily backups.
  repeated string days_of_week = 1 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {
        in: [
          "MONDAY",
          "TUESDAY",
          "WEDNESDAY",
          "THURSDAY",
          "FRIDAY",
          "SATURDAY",
          "SUNDAY"
        ]
      }
    }
  }];

  // Hour of day (0-23 UTC) to start backups. GCP's TimeOfDay structure
  // is simplified here since minutes/seconds/nanos are always zero for
  // AlloyDB backup schedules.
  int32 start_hour = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 23
  }];
}

// GcpAlloydbClusterAutomatedBackupPolicy configures periodic snapshot backups
// for the AlloyDB cluster. These are point-in-time full backups stored in
// the specified (or default) location.
//
// When this block is not specified, GCP uses its default automated backup
// policy (enabled, daily, 14-day time-based retention).
//
// Retention can be either quantity-based (keep N backups) or time-based
// (keep backups for N seconds). These are mutually exclusive.
message GcpAlloydbClusterAutomatedBackupPolicy {
  // Whether automated backups are enabled. Set to false to explicitly
  // disable automated backups.
  bool enabled = 1;

  // Length of the time window during which a backup can be taken.
  // Duration in seconds with 's' suffix, e.g., "3600s" (1 hour).
  // Default: "3600s".
  string backup_window = 2 [(buf.validate.field).cel = {
    id: "backup_window_format"
    expression: "this == '' || this.matches('^[0-9]+s$')"
    message: "backup_window must be a duration in seconds (e.g., '3600s')"
  }];

  // GCP region where backups will be stored. If not specified,
  // backups are stored in the same region as the cluster.
  string location = 3;

  // Number of backups to retain. Mutually exclusive with
  // time_based_retention_period.
  int32 quantity_based_retention_count = 4;

  // How long to retain backups. Duration in seconds with 's' suffix,
  // e.g., "1209600s" (14 days). Mutually exclusive with
  // quantity_based_retention_count.
  string time_based_retention_period = 5 [(buf.validate.field).cel = {
    id: "time_based_retention_period_format"
    expression: "this == '' || this.matches('^[0-9]+s$')"
    message: "time_based_retention_period must be a duration in seconds (e.g., '1209600s')"
  }];

  // Weekly schedule defining when backups are taken.
  GcpAlloydbClusterBackupSchedule weekly_schedule = 6;

  // Cloud KMS key for encrypting automated backups. If not specified,
  // backups use Google-managed encryption. When using a different key
  // from the cluster's encryption, this enables independent backup
  // encryption lifecycle management.
  dev.planton.shared.foreignkey.v1.StringValueOrRef encryption_kms_key_name = 7 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpKmsKey,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_id"
  ];

  // Labels applied to every backup created by this policy — how backup
  // storage costs are attributed and backup sets are filtered in the
  // console (distinct from the cluster's own labels).
  map<string, string> labels = 8;

  // Quantity-based and time-based retention are mutually exclusive.
  option (buf.validate.message).cel = {
    id: "retention_mutual_exclusion"
    expression: "this.quantity_based_retention_count == 0 || this.time_based_retention_period == ''"
    message: "only one of quantity_based_retention_count or time_based_retention_period may be set"
  };
}

// GcpAlloydbClusterContinuousBackupConfig configures continuous backup
// (write-ahead log streaming) that enables point-in-time recovery (PITR).
//
// Continuous backup is enabled by default with a 14-day recovery window.
// This is separate from automated backups: automated backups are periodic
// snapshots, while continuous backups capture every write for PITR.
message GcpAlloydbClusterContinuousBackupConfig {
  // Whether continuous backup is enabled. Defaults to true.
  // Set to false only if you do not need point-in-time recovery.
  bool enabled = 1;

  // Number of days for which continuous backup data is retained,
  // enabling PITR within this window. Range: 1-35. Default: 14.
  int32 recovery_window_days = 2 [(buf.validate.field).cel = {
    id: "recovery_window_days_range"
    expression: "this == 0 || (this >= 1 && this <= 35)"
    message: "recovery_window_days must be between 1 and 35"
  }];

  // Cloud KMS key for encrypting continuous backup data. If not specified,
  // continuous backups use Google-managed encryption.
  dev.planton.shared.foreignkey.v1.StringValueOrRef encryption_kms_key_name = 3 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpKmsKey,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_id"
  ];
}

// GcpAlloydbClusterMaintenanceWindow defines the preferred time for
// GCP to apply system updates and patches to the AlloyDB cluster.
// Currently AlloyDB supports a single maintenance window per cluster.
message GcpAlloydbClusterMaintenanceWindow {
  // Day of the week for maintenance.
  string day = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "MONDAY",
        "TUESDAY",
        "WEDNESDAY",
        "THURSDAY",
        "FRIDAY",
        "SATURDAY",
        "SUNDAY"
      ]
    }
  ];

  // Hour of day (0-23, UTC) when the maintenance window starts.
  int32 start_hour = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 23
  }];
}

// GcpAlloydbClusterQueryInsightsConfig configures query performance
// monitoring for the primary instance. Query insights captures execution
// plans, application context, and client information to help diagnose
// slow queries and performance issues.
message GcpAlloydbClusterQueryInsightsConfig {
  // Number of query execution plans captured per minute.
  // Range: 0-20. Default: 5. Set to 0 to disable plan capture.
  int32 query_plans_per_minute = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 20
  }];

  // Maximum length of the query string stored in insights.
  // Range: 256-4500. 0 means unset — GCP applies its default (1024).
  // Longer strings help debug complex queries but use more storage.
  int32 query_string_length = 2 [(buf.validate.field).cel = {
    id: "query_string_length_range"
    message: "query_string_length must be between 256 and 4500 (or 0 for the GCP default)"
    expression: "this == 0 || (this >= 256 && this <= 4500)"
  }];

  // Whether to record application tags set via
  // pg_stat_statements.track_activity_query_size.
  // Useful for tagging queries by application or feature.
  bool record_application_tags = 3;

  // Whether to record the client IP address for each query.
  // Useful for identifying which application instances generate load.
  bool record_client_address = 4;
}

// GcpAlloydbClusterPscConfig enables Private Service Connect for the cluster
// instead of VPC peering via Private Service Access.
message GcpAlloydbClusterPscConfig {
  // When true, the cluster is reachable only through PSC endpoints.
  bool psc_enabled = 1;
}

// GcpAlloydbClusterDataplexConfig controls the cluster's Dataplex Universal
// Catalog integration (automatic metadata discovery). GCP enables the
// integration by default when this block is absent — set enabled: false to
// opt out explicitly.
message GcpAlloydbClusterDataplexConfig {
  // Whether Dataplex integration is enabled for the cluster. Mutable.
  // Required inside dataplex_config: declaring the block takes the
  // integration under management, and the switch says which way.
  optional bool enabled = 1 [(buf.validate.field).required = true];
}

// GcpAlloydbClusterRestoreBackupSource seeds the new cluster from an
// AlloyDB backup instead of creating it empty. Create-time only: every
// restore field is immutable, and changing it destroys and recreates the
// cluster.
message GcpAlloydbClusterRestoreBackupSource {
  // Full resource name of the source backup, e.g.
  // "projects/{project}/locations/{location}/backups/{backup}".
  string backup_name = 1 [(buf.validate.field).required = true];
}

// GcpAlloydbClusterRestoreContinuousBackupSource seeds the new cluster by
// point-in-time recovery (PITR) from a source cluster's continuous backup
// stream. Create-time only (immutable; changing it recreates the cluster).
message GcpAlloydbClusterRestoreContinuousBackupSource {
  // The source cluster to restore from — its full resource name
  // "projects/{project}/locations/{location}/clusters/{cluster}", or a
  // reference to a GcpAlloydbCluster resource. Restore provenance, not
  // physical placement: the new cluster is seeded FROM the source, never
  // contained IN it (containment_exempt).
  dev.planton.shared.foreignkey.v1.StringValueOrRef cluster = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpAlloydbCluster,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.cluster_id"
  ];

  // The point in time to restore to, in RFC 3339 format (e.g.
  // "2026-08-01T12:00:00Z"). Must fall inside the source cluster's
  // continuous-backup recovery window.
  string point_in_time = 2 [(buf.validate.field).required = true];
}

// GcpAlloydbClusterRestoreBackupdrBackupSource seeds the new cluster from a
// Backup and DR Service backup. Create-time only (immutable; changing it
// recreates the cluster).
message GcpAlloydbClusterRestoreBackupdrBackupSource {
  // Full resource name of the Backup and DR backup, in the format
  // "projects/{project}/locations/{location}/backupVaults/{vault}/dataSources/{dataSource}/backups/{backup}".
  string backup = 1 [(buf.validate.field).required = true];
}

// GcpAlloydbClusterRestoreBackupdrPitrSource seeds the new cluster by
// point-in-time recovery through the Backup and DR Service. Create-time
// only (immutable; changing it recreates the cluster).
message GcpAlloydbClusterRestoreBackupdrPitrSource {
  // Full resource name of the Backup and DR data source, in the format
  // "projects/{project}/locations/{location}/backupVaults/{vault}/dataSources/{dataSource}".
  string data_source = 1 [(buf.validate.field).required = true];

  // The point in time to restore to, in RFC 3339 format.
  string point_in_time = 2 [(buf.validate.field).required = true];
}

// GcpAlloydbClusterConnectionPoolConfig configures AlloyDB managed
// connection pooling on the bundled primary — a built-in PgBouncer-style
// pooler for workloads with many short-lived connections.
message GcpAlloydbClusterConnectionPoolConfig {
  // Turn managed connection pooling on or off. Mutable in place.
  bool enabled = 1;

  // Pooler flags, keyed by flag name WITHOUT the "connection-pooling-"
  // prefix and with underscores instead of dashes (GCP's documented
  // convention for this provider surface): e.g. the flag
  // "connection-pooling-pool-mode" is set as key "pool_mode". Only
  // applied while enabled is true.
  map<string, string> flags = 2;
}

// GcpAlloydbClusterAuthorizedExternalNetwork allows a CIDR range to reach
// the primary instance's public IP. Only valid when enable_public_ip is
// true.
message GcpAlloydbClusterAuthorizedExternalNetwork {
  string cidr_range = 1 [(buf.validate.field).string.min_len = 1];
}

// GcpAlloydbClusterPscAutoConnection configures PSC service automation for
// the bundled primary instance.
message GcpAlloydbClusterPscAutoConnection {
  // Consumer network, e.g. "projects/vpc-host/global/networks/default".
  string consumer_network = 1;

  // Consumer project ID (not project number).
  string consumer_project = 2;
}

// GcpAlloydbClusterPscInterfaceConfig configures a PSC interface for
// outbound connectivity from the bundled primary instance.
message GcpAlloydbClusterPscInterfaceConfig {
  // Network attachment resource in the consumer project.
  string network_attachment_resource = 1;
}

// GcpAlloydbClusterPscInstanceConfig configures Private Service Connect on
// the bundled primary instance (requires the cluster itself to be a PSC
// cluster via psc_config.psc_enabled).
message GcpAlloydbClusterPscInstanceConfig {
  // Consumer project numbers allowed to create PSC endpoints.
  repeated string allowed_consumer_projects = 1;

  // PSC service automation connections.
  repeated GcpAlloydbClusterPscAutoConnection psc_auto_connections = 2;

  // PSC interfaces for outbound connectivity (0 or 1 supported by AlloyDB).
  repeated GcpAlloydbClusterPscInterfaceConfig psc_interface_configs = 3;
}

// GcpAlloydbClusterSecondaryConfig configures a cross-region DR secondary
// cluster. Only valid when cluster_type is SECONDARY.
message GcpAlloydbClusterSecondaryConfig {
  // Full resource name of the primary cluster this secondary follows.
  string primary_cluster_name = 1 [(buf.validate.field).string.min_len = 1];
}

// GcpAlloydbClusterPrimaryInstance defines the configuration for the
// primary compute instance bundled with the AlloyDB cluster.
//
// A cluster without a primary instance cannot serve queries. This is why
// the primary instance is bundled rather than being a separate component.
// Read pool instances have independent scaling lifecycles and are NOT
// included here.
//
// Machine configuration can be specified via either cpu_count (simpler,
// lets GCP choose the machine family) or machine_type (explicit machine
// family selection). These are mutually exclusive.
message GcpAlloydbClusterPrimaryInstance {
  // ID for the primary instance. This becomes the GCP resource name.
  // Must start with a lowercase letter, can contain lowercase letters,
  // numbers, and hyphens, and must end with a lowercase letter or number.
  // Maximum 63 characters. Immutable after creation.
  string instance_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9-]{0,61}[a-z0-9]$",
    (buf.validate.field).string.min_len = 2,
    (buf.validate.field).string.max_len = 63
  ];

  // Number of CPUs for the instance. Valid values: 2, 4, 8, 16, 32, 64, 96, 128.
  // GCP selects the appropriate machine family automatically.
  // Mutually exclusive with machine_type.
  int32 cpu_count = 2;

  // Explicit machine type (e.g., "n2-highmem-4", "c4a-highmem-4-lssd").
  // Use this for advanced scenarios where you need a specific machine family.
  // Mutually exclusive with cpu_count.
  string machine_type = 3;

  // Availability type controlling the placement of the instance.
  // ZONAL: single-zone deployment (lower cost, single zone of failure).
  // REGIONAL: multi-zone deployment with automatic failover (recommended
  // for production). Default: REGIONAL when unset.
  string availability_type = 4 [(buf.validate.field).cel = {
    id: "availability_type_valid_value"
    expression: "this == '' || this in ['AVAILABILITY_TYPE_UNSPECIFIED', 'ZONAL', 'REGIONAL']"
    message: "availability_type must be ZONAL, REGIONAL, or AVAILABILITY_TYPE_UNSPECIFIED"
  }];

  // PostgreSQL database flags as key-value pairs.
  // These correspond to PostgreSQL server parameters (e.g.,
  // "max_connections", "work_mem", "shared_buffers").
  // See GCP AlloyDB documentation for supported flags.
  map<string, string> database_flags = 5;

  // Human-readable display name for the primary instance.
  string display_name = 6;

  // Query insights configuration for performance monitoring.
  // If not specified, GCP uses default query insights settings
  // (enabled with sensible defaults).
  GcpAlloydbClusterQueryInsightsConfig query_insights_config = 7;

  // Whether to require the AlloyDB Auth Proxy or AlloyDB Language Connectors
  // for all connections. When true, direct IP connections are rejected.
  // This enforces IAM-based authentication for all database access.
  bool require_connectors = 8;

  // SSL mode for client connections.
  // ENCRYPTED_ONLY: all connections must use TLS (recommended for production).
  // ALLOW_UNENCRYPTED_AND_ENCRYPTED: both TLS and plaintext allowed.
  string ssl_mode = 9 [(buf.validate.field).cel = {
    id: "ssl_mode_valid_value"
    expression: "this == '' || this in ['ENCRYPTED_ONLY', 'ALLOW_UNENCRYPTED_AND_ENCRYPTED']"
    message: "ssl_mode must be ENCRYPTED_ONLY or ALLOW_UNENCRYPTED_AND_ENCRYPTED"
  }];

  // Instance activation: ALWAYS keeps the primary running (the default
  // posture); NEVER stops it. Flipping ALWAYS→NEVER→ALWAYS is the
  // stop/start lever — a stopped primary keeps its configuration and
  // storage but serves nothing and stops billing for compute. Stop read
  // pool instances before stopping the primary.
  string activation_policy = 10 [(buf.validate.field).cel = {
    id: "activation_policy_valid"
    message: "activation_policy must be ALWAYS, NEVER, or ACTIVATION_POLICY_UNSPECIFIED"
    expression: "this == '' || this in ['ACTIVATION_POLICY_UNSPECIFIED', 'ALWAYS', 'NEVER']"
  }];

  // Unstructured metadata stored on the primary instance (annotations, not
  // labels — not used for billing filtering). Mutable in place.
  map<string, string> annotations = 11;

  // Pin a ZONAL primary to a specific Compute Engine zone (e.g.
  // "us-central1-a"). Only valid when availability_type is ZONAL — GCP
  // rejects it on REGIONAL instances; leave empty to let GCP pick a zone
  // with available capacity. Mutable: changing it live-migrates the
  // primary to the new zone.
  string gce_zone = 12;

  // AlloyDB managed connection pooling on the primary (built-in pooler).
  // Mutable in place.
  GcpAlloydbClusterConnectionPoolConfig connection_pool_config = 13;

  // Enable a public IP on the primary instance. Pair with
  // authorized_external_networks to control who may reach it.
  bool enable_public_ip = 14;

  // Enable outbound public IP for the primary instance.
  bool enable_outbound_public_ip = 15;

  // CIDR ranges allowed to reach the primary's public IP. Requires
  // enable_public_ip.
  repeated GcpAlloydbClusterAuthorizedExternalNetwork authorized_external_networks = 16;

  // Draw the primary's private IPs from a specific Private Service Access
  // allocated range (RFC 1035 name) instead of the range the cluster uses.
  // Immutable: changing it destroys and recreates the primary instance.
  string allocated_ip_range_override = 17 [(buf.validate.field).cel = {
    id: "valid_allocated_ip_range_override"
    message: "allocated_ip_range_override must be an RFC 1035 range name (1-63 chars: [a-z]([-a-z0-9]*[a-z0-9])?)"
    expression: "this == '' || this.matches('^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$')"
  }];

  // Private Service Connect configuration for the primary instance —
  // meaningful only on PSC clusters (psc_config.psc_enabled).
  GcpAlloydbClusterPscInstanceConfig psc_instance_config = 18;

  // What happens to the PRIMARY INSTANCE in GCP when this resource is
  // destroyed (the cluster has its own deletion_policy at the spec root).
  //   "DELETE"  -- (GCP's default when unset) the primary is deleted
  //   "PREVENT" -- destroy FAILS while the primary exists
  //   "ABANDON" -- the primary is removed from management but keeps
  //                running (and billing) in GCP
  string deletion_policy = 19 [(buf.validate.field).cel = {
    id: "valid_deletion_policy"
    message: "deletion_policy must be one of: DELETE, PREVENT, ABANDON"
    expression: "this == '' || this in ['DELETE', 'PREVENT', 'ABANDON']"
  }];

  // cpu_count and machine_type are mutually exclusive.
  option (buf.validate.message).cel = {
    id: "machine_config_mutual_exclusion"
    expression: "this.cpu_count == 0 || this.machine_type == ''"
    message: "only one of cpu_count or machine_type may be set"
  };

  option (buf.validate.message).cel = {
    id: "authorized_networks_require_public_ip"
    message: "authorized_external_networks requires enable_public_ip"
    expression: "size(this.authorized_external_networks) == 0 || this.enable_public_ip"
  };

  option (buf.validate.message).cel = {
    id: "gce_zone_requires_zonal"
    message: "gce_zone can only be set on ZONAL instances — GCP rejects it when availability_type is REGIONAL (the default)"
    expression: "this.gce_zone == '' || this.availability_type == 'ZONAL'"
  };
}

// GcpAlloydbClusterSpec defines the configuration for an AlloyDB cluster
// with a bundled primary instance.
//
// AlloyDB is Google Cloud's fully managed, PostgreSQL-compatible database
// designed for demanding enterprise workloads requiring high performance,
// high availability, and strong consistency. It combines the familiarity
// of PostgreSQL with Google's infrastructure for superior throughput and
// lower latency compared to standard PostgreSQL.
//
// This component bundles a cluster (the logical container with backup,
// encryption, and networking configuration) with a primary instance (the
// compute node that serves queries). A cluster without a primary instance
// cannot serve any traffic, which is why they are bundled together.
//
// Networking uses VPC peering via Private Service Access. The cluster's
// network field references a VPC that must have Private Service Access
// configured (compose GcpGlobalAddress with VPC_PEERING purpose +
// GcpServiceNetworkingConnection on the target VPC).
//
// Important behavioral notes:
//
//   - The cluster_name, location, network, and kms_key_name fields are
//     immutable after creation. Changing them requires recreating the cluster.
//
//   - The primary_instance.instance_id field is immutable after creation.
//
//   - AlloyDB supports both automated periodic backups and continuous
//     backup (WAL streaming for point-in-time recovery). Both can be
//     configured independently with separate CMEK keys.
//
//   - Connectivity is exactly one of PSA (network_config.network) or PSC
//     (psc_config.psc_enabled). The provider enforces this mutual exclusion.
message GcpAlloydbClusterSpec {
  option (buf.validate.message).cel = {
    id: "connectivity_psa_xor_psc"
    message: "set network for Private Service Access OR enable psc_config.psc_enabled — not both, not neither"
    expression: "(has(this.network) && (has(this.network.value) || has(this.network.value_from)) && !(has(this.psc_config) && this.psc_config.psc_enabled)) || (!(has(this.network) && (has(this.network.value) || has(this.network.value_from))) && has(this.psc_config) && this.psc_config.psc_enabled)"
  };

  option (buf.validate.message).cel = {
    id: "secondary_requires_secondary_config"
    message: "cluster_type SECONDARY requires secondary_config.primary_cluster_name"
    expression: "this.cluster_type != 'SECONDARY' || (has(this.secondary_config) && this.secondary_config.primary_cluster_name != '')"
  };

  // GCP project where the AlloyDB cluster will be created.
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];

  // Name of the AlloyDB cluster. This becomes the GCP resource cluster_id.
  // Must start with a lowercase letter, can contain lowercase letters,
  // numbers, and hyphens, and must end with a lowercase letter or number.
  // Maximum 63 characters. Immutable after creation.
  string cluster_name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9-]{0,61}[a-z0-9]$",
    (buf.validate.field).string.min_len = 2,
    (buf.validate.field).string.max_len = 63
  ];

  // GCP region where the cluster will be deployed (e.g., "us-central1").
  // Immutable after creation.
  string location = 3 [(buf.validate.field).required = true];

  // VPC network for Private Service Access connectivity, as the relative
  // resource path "projects/{project}/global/networks/{network}" (the
  // AlloyDB API rejects full https:// self-link URLs). The VPC must have
  // Private Service Access configured (compose GcpGlobalAddress +
  // GcpServiceNetworkingConnection). Mutually exclusive with PSC.
  // Immutable after creation.
  dev.planton.shared.foreignkey.v1.StringValueOrRef network = 4 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpVpcNetwork,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.network_id"
  ];

  // Private Service Connect configuration. When psc_enabled is true, network
  // must be unset — the cluster is reachable only through PSC endpoints.
  GcpAlloydbClusterPscConfig psc_config = 14;

  // Cluster role. PRIMARY (default) is a writable primary; SECONDARY is a
  // cross-region DR replica that follows a primary cluster.
  optional string cluster_type = 15 [
    (dev.planton.shared.options.default) = "PRIMARY",
    (buf.validate.field).cel = {
      id: "cluster_type_valid"
      message: "cluster_type must be PRIMARY or SECONDARY"
      expression: "this == '' || this in ['PRIMARY', 'SECONDARY']"
    }
  ];

  // Required when cluster_type is SECONDARY — names the primary cluster.
  GcpAlloydbClusterSecondaryConfig secondary_config = 16;

  // Name of the allocated IP range for Private Service Access.
  // When set, the cluster uses this specific IP range for its private
  // connectivity instead of an auto-allocated range. This is common in
  // enterprise setups where IP ranges are pre-planned.
  string allocated_ip_range = 5;

  // PostgreSQL major version for the cluster.
  // Supported values: "POSTGRES_14", "POSTGRES_15", "POSTGRES_16".
  // If not specified, GCP selects the latest stable version.
  string database_version = 6 [(buf.validate.field).cel = {
    id: "database_version_valid_value"
    expression: "this == '' || this in ['POSTGRES_14', 'POSTGRES_15', 'POSTGRES_16']"
    message: "database_version must be POSTGRES_14, POSTGRES_15, or POSTGRES_16"
  }];

  // Human-readable display name for the cluster.
  string display_name = 7;

  // Initial database user created during cluster provisioning.
  // If not specified, no initial user is created. Access must then be
  // configured via AlloyDB Auth Proxy with IAM authentication.
  GcpAlloydbClusterInitialUser initial_user = 8;

  // Automated backup policy for periodic snapshot backups.
  // When not specified, GCP uses its default policy (enabled, daily, 14-day retention).
  GcpAlloydbClusterAutomatedBackupPolicy automated_backup_policy = 9;

  // Continuous backup configuration for point-in-time recovery (PITR).
  // Enabled by default with a 14-day recovery window.
  GcpAlloydbClusterContinuousBackupConfig continuous_backup_config = 10;

  // Cloud KMS key for encrypting the cluster's data at rest (CMEK).
  // Format: projects/{project}/locations/{location}/keyRings/{keyRing}/cryptoKeys/{key}
  // If not specified, data is encrypted with Google-managed keys.
  // Immutable after creation.
  dev.planton.shared.foreignkey.v1.StringValueOrRef kms_key_name = 11 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpKmsKey,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_id"
  ];

  // Preferred maintenance window for system updates.
  GcpAlloydbClusterMaintenanceWindow maintenance_window = 12;

  // Primary instance configuration. Required -- a cluster without a
  // primary instance cannot serve queries.
  GcpAlloydbClusterPrimaryInstance primary_instance = 13 [(buf.validate.field).required = true];

  // Unstructured metadata stored on the cluster (annotations, not labels —
  // not used for billing filtering).
  map<string, string> annotations = 17;

  // Billing subscription tier: STANDARD (default) or TRIAL. A TRIAL cluster
  // converts to STANDARD when trial credits end.
  string subscription_type = 18 [(buf.validate.field).cel = {
    id: "subscription_type_valid"
    message: "subscription_type must be TRIAL or STANDARD"
    expression: "this == '' || this in ['TRIAL', 'STANDARD']"
  }];

  // When true, a database_version change returns immediately instead of
  // waiting for the in-place major-version upgrade to finish. The upgrade
  // continues server-side; use for very large clusters where the wait
  // exceeds sane IaC timeouts.
  bool skip_await_major_version_upgrade = 19;

  // User-defined labels on the cluster and its bundled primary instance
  // (cost attribution, team ownership, environment tagging). Merged with
  // the platform's attribution labels; on key conflicts the platform
  // labels win. Mutable in place.
  map<string, string> labels = 20;

  // Dataplex Universal Catalog integration (automatic metadata discovery).
  // GCP enables it by default when this block is absent; set
  // enabled: false to opt out explicitly.
  GcpAlloydbClusterDataplexConfig dataplex_config = 21;

  // Seed the new cluster from an AlloyDB backup. At most one restore
  // source may be set; all restore sources are create-time only (changing
  // one destroys and recreates the cluster).
  GcpAlloydbClusterRestoreBackupSource restore_backup_source = 22;

  // Seed the new cluster by point-in-time recovery from a source cluster's
  // continuous backup stream. At most one restore source may be set;
  // create-time only.
  GcpAlloydbClusterRestoreContinuousBackupSource restore_continuous_backup_source = 23;

  // Seed the new cluster from a Backup and DR Service backup. At most one
  // restore source may be set; create-time only.
  GcpAlloydbClusterRestoreBackupdrBackupSource restore_backupdr_backup_source = 24;

  // Seed the new cluster by point-in-time recovery through the Backup and
  // DR Service. At most one restore source may be set; create-time only.
  GcpAlloydbClusterRestoreBackupdrPitrSource restore_backupdr_pitr_source = 25;

  // Client-side destroy guard: while true (GCP's default), any destroy —
  // including the platform's own teardown flows — FAILS until this field
  // is flipped to false and applied. Both engines always send the value
  // explicitly, so the spec is the single source of truth. Note the
  // ordering quirk in the provider: deletion_policy ABANDON is evaluated
  // BEFORE this guard, so abandoning a protected cluster still works.
  optional bool deletion_protection = 26 [(dev.planton.shared.options.default) = "true"];

  // What happens to the CLUSTER in GCP when this resource is destroyed
  // (the bundled primary has its own deletion_policy under
  // primary_instance). AlloyDB clusters use a different value set from
  // most GCP resources:
  //   "DEFAULT" -- (GCP's default when unset) the cluster is deleted;
  //                the API rejects the delete while any instance other
  //                than the bundled primary still exists
  //   "FORCE"   -- the cluster AND every instance still in it are
  //                deleted — required when destroying a SECONDARY
  //                cluster that has a secondary instance
  //   "PREVENT" -- destroy FAILS; the strongest guard, evaluated even
  //                before deletion_protection
  //   "ABANDON" -- the cluster is removed from management but keeps
  //                running (and billing) in GCP; bypasses
  //                deletion_protection
  string deletion_policy = 27 [(buf.validate.field).cel = {
    id: "valid_deletion_policy"
    message: "deletion_policy must be one of: DEFAULT, FORCE, PREVENT, ABANDON"
    expression: "this == '' || this in ['DEFAULT', 'FORCE', 'PREVENT', 'ABANDON']"
  }];

  option (buf.validate.message).cel = {
    id: "at_most_one_restore_source"
    message: "at most one restore source may be set: restore_backup_source, restore_continuous_backup_source, restore_backupdr_backup_source, or restore_backupdr_pitr_source"
    expression: "[has(this.restore_backup_source), has(this.restore_continuous_backup_source), has(this.restore_backupdr_backup_source), has(this.restore_backupdr_pitr_source)].filter(x, x).size() <= 1"
  };
}
