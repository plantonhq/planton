syntax = "proto3";

package dev.planton.gcp.gcpalloydbcluster.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpalloydbcluster/v1alpha1/outputs.proto";
import "catalog/gcp/gcpalloydbcluster/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-alloydb-cluster
message GcpAlloydbCluster {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpAlloydbCluster'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpAlloydbClusterSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpAlloydbClusterStatus status = 5;
}

//gcp-alloydb-cluster status
message GcpAlloydbClusterStatus {
  //outputs
  GcpAlloydbClusterOutputs outputs = 1;
}
