# GcpAlloydbCluster install profile used when the cluster is an E2E PREREQUISITE
# for another component (e.g. a read pool instance or database user). The
# smallest useful PSA cluster: zonal primary on the shared prerequisite VPC.
# clusterName carries ${E2E_RUN_ID}; metadata.name stays fixed for FK
# resolution across the prerequisite chain.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpAlloydbCluster
metadata:
  name: planton-oss-e2e-gcpadb-prereq
  id: planton-oss-e2e-gcpadb-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpalloydbcluster
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  clusterName: planton-oss-e2e-adbprereq-${E2E_RUN_ID}
  location: us-central1
  network:
    valueFrom:
      kind: GcpVpcNetwork
      name: planton-oss-e2e-gcpvpc-prereq
      fieldPath: status.outputs.network_id
  # The destroy guard defaults TRUE; prerequisite fixtures disarm it so
  # dependency teardown completes.
  deletionProtection: false
  primaryInstance:
    instanceId: primary
    cpuCount: 2
    availabilityType: ZONAL
