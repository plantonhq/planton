syntax = "proto3";

package dev.planton.gcp.gcpalloydbinstance.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// GcpAlloydbInstanceQueryInsightsConfig configures query performance
// monitoring for the instance.
message GcpAlloydbInstanceQueryInsightsConfig {
  // Number of query execution plans captured per minute. Range: 0-20.
  int32 query_plans_per_minute = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 20
  }];

  // Maximum length of the query string stored in insights. Range: 256-4500.
  // 0 means unset — GCP applies its default (1024).
  int32 query_string_length = 2 [(buf.validate.field).cel = {
    id: "query_string_length_range"
    message: "query_string_length must be between 256 and 4500 (or 0 for the GCP default)"
    expression: "this == 0 || (this >= 256 && this <= 4500)"
  }];

  // Whether to record application tags for queries.
  bool record_application_tags = 3;

  // Whether to record the client IP address for each query.
  bool record_client_address = 4;
}

// GcpAlloydbInstanceReadPoolConfig holds read-pool-specific settings.
// Required when instance_type is READ_POOL.
message GcpAlloydbInstanceReadPoolConfig {
  // Read capacity — number of nodes in the read pool instance.
  int32 node_count = 1 [(buf.validate.field).int32.gte = 1];
}

// GcpAlloydbInstanceAuthorizedExternalNetwork allows a CIDR range to reach
// the instance's public IP. Only valid when enable_public_ip is true.
message GcpAlloydbInstanceAuthorizedExternalNetwork {
  string cidr_range = 1 [(buf.validate.field).string.min_len = 1];
}

// GcpAlloydbInstancePscAutoConnection configures PSC service automation.
message GcpAlloydbInstancePscAutoConnection {
  // Consumer network, e.g. "projects/vpc-host/global/networks/default".
  string consumer_network = 1;

  // Consumer project ID (not project number).
  string consumer_project = 2;
}

// GcpAlloydbInstancePscInterfaceConfig configures a PSC interface for outbound
// connectivity.
message GcpAlloydbInstancePscInterfaceConfig {
  // Network attachment resource in the consumer project.
  string network_attachment_resource = 1;
}

// GcpAlloydbInstancePscInstanceConfig configures Private Service Connect for
// the instance.
message GcpAlloydbInstancePscInstanceConfig {
  // Consumer project numbers allowed to create PSC endpoints.
  repeated string allowed_consumer_projects = 1;

  // PSC service automation connections.
  repeated GcpAlloydbInstancePscAutoConnection psc_auto_connections = 2;

  // PSC interfaces for outbound connectivity (0 or 1 supported by AlloyDB).
  repeated GcpAlloydbInstancePscInterfaceConfig psc_interface_configs = 3;
}

// GcpAlloydbInstanceConnectionPoolConfig configures AlloyDB managed
// connection pooling — a built-in PgBouncer-style pooler in front of the
// instance, for workloads with many short-lived connections.
message GcpAlloydbInstanceConnectionPoolConfig {
  // Turn managed connection pooling on or off. Mutable in place.
  bool enabled = 1;

  // Pooler flags, keyed by flag name WITHOUT the "connection-pooling-"
  // prefix and with underscores instead of dashes (GCP's documented
  // convention for this provider surface): e.g. the flag
  // "connection-pooling-pool-mode" is set as key "pool_mode". Only
  // applied while enabled is true.
  map<string, string> flags = 2;
}

// GcpAlloydbInstanceSpec defines an AlloyDB instance (`google_alloydb_instance`)
// attached to an existing cluster.
//
// Read pool instances scale read traffic independently of the bundled primary
// in GcpAlloydbCluster. PRIMARY and SECONDARY types exist for advanced
// topologies; most presets target READ_POOL.
message GcpAlloydbInstanceSpec {
  option (buf.validate.message).cel = {
    id: "machine_config_mutual_exclusion"
    message: "only one of cpu_count or machine_type may be set"
    expression: "this.cpu_count == 0 || this.machine_type == ''"
  };

  option (buf.validate.message).cel = {
    id: "read_pool_requires_node_count"
    message: "READ_POOL instances require read_pool_config.node_count >= 1"
    expression: "!(this.instance_type == 'READ_POOL' || this.instance_type == '') || (has(this.read_pool_config) && this.read_pool_config.node_count >= 1)"
  };

  option (buf.validate.message).cel = {
    id: "read_pool_config_only_for_read_pool"
    message: "read_pool_config applies to READ_POOL instances only"
    expression: "this.instance_type == 'READ_POOL' || this.instance_type == '' || !has(this.read_pool_config) || this.read_pool_config.node_count == 0"
  };

  option (buf.validate.message).cel = {
    id: "authorized_networks_require_public_ip"
    message: "authorized_external_networks requires enable_public_ip"
    expression: "size(this.authorized_external_networks) == 0 || this.enable_public_ip"
  };

  option (buf.validate.message).cel = {
    id: "availability_type_not_for_read_pool"
    message: "availability_type applies to PRIMARY/SECONDARY instances only — read-pool availability is derived from node_count (1 node = ZONAL, 2+ nodes = REGIONAL) and the API does not store a sent value"
    expression: "!(this.instance_type == 'READ_POOL' || this.instance_type == '') || this.availability_type == ''"
  };

  // The GCP project that owns the AlloyDB cluster.
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];

  // The AlloyDB cluster this instance belongs to. Accepts the full cluster
  // resource path or a reference to a GcpAlloydbCluster resource. Immutable.
  dev.planton.shared.foreignkey.v1.StringValueOrRef cluster = 2 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpAlloydbCluster,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.cluster_id"
  ];

  // The instance ID within the cluster. Immutable.
  string instance_id = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 63
      pattern: "^[a-z][a-z0-9-]{0,61}[a-z0-9]$"
    }
  ];

  // Instance role: PRIMARY, READ_POOL, or SECONDARY. Immutable.
  // Presets default to READ_POOL for read scaling.
  optional string instance_type = 4 [
    (dev.planton.shared.options.default) = "READ_POOL",
    (buf.validate.field).cel = {
      id: "instance_type_valid"
      message: "instance_type must be PRIMARY, READ_POOL, or SECONDARY"
      expression: "this in ['PRIMARY', 'READ_POOL', 'SECONDARY']"
    }
  ];

  // Number of CPUs. GCP selects the machine family. Mutually exclusive with
  // machine_type.
  int32 cpu_count = 5;

  // Explicit machine type (e.g. "n2-highmem-4"). Mutually exclusive with
  // cpu_count.
  string machine_type = 6;

  // Read pool sizing. Required when instance_type is READ_POOL.
  GcpAlloydbInstanceReadPoolConfig read_pool_config = 7;

  // ZONAL or REGIONAL placement for PRIMARY/SECONDARY instances. GCP
  // defaults to REGIONAL when unset. Must stay empty on READ_POOL
  // instances: read-pool availability is DERIVED from node_count (1 node =
  // ZONAL, 2+ nodes = REGIONAL spread across zones) and the AlloyDB API
  // does not store a sent value — the stored object omits the field, so
  // any explicit value produces a perpetual re-plan diff (live-verified
  // against a single-node read pool).
  string availability_type = 8 [(buf.validate.field).cel = {
    id: "availability_type_valid"
    message: "availability_type must be ZONAL, REGIONAL, or AVAILABILITY_TYPE_UNSPECIFIED"
    expression: "this == '' || this in ['AVAILABILITY_TYPE_UNSPECIFIED', 'ZONAL', 'REGIONAL']"
  }];

  // PostgreSQL database flags as key-value pairs.
  map<string, string> database_flags = 9;

  // Human-readable display name.
  string display_name = 10;

  // Query insights configuration.
  GcpAlloydbInstanceQueryInsightsConfig query_insights_config = 11;

  // When true, only AlloyDB Auth Proxy / Language Connectors may connect.
  bool require_connectors = 12;

  // SSL mode: ENCRYPTED_ONLY or ALLOW_UNENCRYPTED_AND_ENCRYPTED.
  string ssl_mode = 13 [(buf.validate.field).cel = {
    id: "ssl_mode_valid"
    message: "ssl_mode must be ENCRYPTED_ONLY or ALLOW_UNENCRYPTED_AND_ENCRYPTED"
    expression: "this == '' || this in ['ENCRYPTED_ONLY', 'ALLOW_UNENCRYPTED_AND_ENCRYPTED']"
  }];

  // Instance activation: ALWAYS keeps the instance running (the default
  // posture); NEVER stops it. Flipping ALWAYS→NEVER→ALWAYS is the
  // stop/start lever — a stopped instance keeps its configuration and
  // storage but serves nothing and stops billing for compute. Mind the
  // ordering restrictions (stop read pools before the primary).
  string activation_policy = 14 [(buf.validate.field).cel = {
    id: "activation_policy_valid"
    message: "activation_policy must be ALWAYS, NEVER, or ACTIVATION_POLICY_UNSPECIFIED"
    expression: "this == '' || this in ['ACTIVATION_POLICY_UNSPECIFIED', 'ALWAYS', 'NEVER']"
  }];

  // Enable a public IP on the instance.
  bool enable_public_ip = 15;

  // Enable outbound public IP for the instance.
  bool enable_outbound_public_ip = 16;

  // CIDR ranges allowed to reach the public IP. Requires enable_public_ip.
  repeated GcpAlloydbInstanceAuthorizedExternalNetwork authorized_external_networks = 17;

  // Private Service Connect configuration.
  GcpAlloydbInstancePscInstanceConfig psc_instance_config = 18;

  // User-defined labels on the instance (cost attribution, team ownership,
  // environment tagging). Merged with the platform's attribution labels;
  // on key conflicts the platform labels win. Mutable in place.
  map<string, string> labels = 19;

  // Unstructured metadata stored on the instance (annotations, not labels —
  // not used for billing filtering). Mutable in place.
  map<string, string> annotations = 20;

  // Pin a ZONAL instance to a specific Compute Engine zone (e.g.
  // "us-central1-a"). Only valid when availability_type is ZONAL — GCP
  // rejects it on REGIONAL instances; leave empty to let GCP pick a zone
  // with available capacity. Mutable: changing it live-migrates the
  // instance to the new zone.
  string gce_zone = 21;

  // AlloyDB managed connection pooling (built-in pooler). Mutable in place.
  GcpAlloydbInstanceConnectionPoolConfig connection_pool_config = 22;

  // Draw this instance's private IPs from a specific Private Service
  // Access allocated range (RFC 1035 name, e.g.
  // "google-managed-services-default") instead of the range the parent
  // cluster uses. Immutable: changing it destroys and recreates the
  // instance.
  string allocated_ip_range_override = 23 [(buf.validate.field).cel = {
    id: "valid_allocated_ip_range_override"
    message: "allocated_ip_range_override must be an RFC 1035 range name (1-63 chars: [a-z]([-a-z0-9]*[a-z0-9])?)"
    expression: "this == '' || this.matches('^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$')"
  }];

  // What happens to the instance in GCP when this resource is destroyed.
  //   "DELETE"  -- (GCP's default when unset) the instance is deleted;
  //                the parent cluster and its data survive
  //   "PREVENT" -- destroy FAILS; protects serving capacity applications
  //                still connect to
  //   "ABANDON" -- the instance is removed from management but keeps
  //                running (and billing) in GCP
  string deletion_policy = 24 [(buf.validate.field).cel = {
    id: "valid_deletion_policy"
    message: "deletion_policy must be one of: DELETE, PREVENT, ABANDON"
    expression: "this == '' || this in ['DELETE', 'PREVENT', 'ABANDON']"
  }];

  option (buf.validate.message).cel = {
    id: "gce_zone_requires_zonal"
    message: "gce_zone can only be set on ZONAL instances — GCP rejects it when availability_type is REGIONAL (the default)"
    expression: "this.gce_zone == '' || this.availability_type == 'ZONAL'"
  };
}
