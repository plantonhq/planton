# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpmonitoringdashboard
spec:
  gcp:
    groups:
      - purpose: EnableMonitoringApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling monitoring.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageDashboard
        permissions:
          - monitoring.dashboards.create
          - monitoring.dashboards.get
          - monitoring.dashboards.update
          - monitoring.dashboards.delete
        provenance: derived
        notes: Covers google_monitoring_dashboard -- create from dashboard_json, read/refresh (the provider suppresses diffs on server-added keys), in-place updates on document changes, and destroy. All four verified present in IAM's testable-permissions inventory.
