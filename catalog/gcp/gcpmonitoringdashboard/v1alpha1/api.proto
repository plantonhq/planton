syntax = "proto3";

package dev.planton.gcp.gcpmonitoringdashboard.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpmonitoringdashboard/v1alpha1/outputs.proto";
import "catalog/gcp/gcpmonitoringdashboard/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-monitoring-dashboard
message GcpMonitoringDashboard {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpMonitoringDashboard'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpMonitoringDashboardSpec spec = 4 [(buf.validate.field).required = true];
  GcpMonitoringDashboardStatus status = 5;
}

message GcpMonitoringDashboardStatus {
  GcpMonitoringDashboardOutputs outputs = 1;
}
