apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpbigqueryreservation
spec:
  # Proven live on both engines (2026-11-21), as an identity holding only this
  # kind's permissions manifest: a zero-baseline STANDARD reservation
  # autoscaling to 50 with the harness project assigned for QUERY, and a
  # zero-baseline ENTERPRISE reservation in a group fixture, deployed,
  # re-planned clean, and destroyed; the grouped reservation's autoscale
  # ceiling rose in place (UpdateReservation), judged from Google's Admin
  # Activity log. Two live findings shaped the kind: Google refuses a STANDARD
  # reservation that shares idle slots, so the spec requires ignore_idle_slots
  # on STANDARD, and Google stores a reservation's group by its short name, so
  # both modules trim the group path.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
