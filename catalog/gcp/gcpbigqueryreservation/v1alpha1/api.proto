syntax = "proto3";

package dev.planton.gcp.gcpbigqueryreservation.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpbigqueryreservation/v1alpha1/outputs.proto";
import "catalog/gcp/gcpbigqueryreservation/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-bigquery-reservation
message GcpBigQueryReservation {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpBigQueryReservation'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpBigQueryReservationSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpBigQueryReservationStatus status = 5;
}

//gcp-bigquery-reservation status
message GcpBigQueryReservationStatus {
  //stack-outputs
  GcpBigQueryReservationStackOutputs outputs = 1;
}
