# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpbigqueryreservation
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: "A reservation is compute capacity; the data its jobs read is encrypted by the datasets that hold it."
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: "Customer-managed keys are properties of datasets and tables, not of capacity."
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "BigQuery jobs and the Reservation API are TLS-only."
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "A reservation has no address; only assigned projects' jobs run on it."
    - control_id: restricted-ingress
      status: not_applicable
      notes: "No listener exists to restrict."
    - control_id: edge-protection
      status: not_applicable
      notes: "No edge is served."
    - control_id: rbac
      status: configurable
      field_path: assignments
      evidence:
        type: spec_default
        reference: "Only the assignees listed in assignments run jobs on the reservation; managing it requires bigquery.reservations.* and bigquery.reservationAssignments.* permissions."
    - control_id: workload-identity
      status: not_applicable
      notes: "The reservation authenticates nothing; jobs run as their callers."
    - control_id: no-legacy-auth
      status: not_applicable
      notes: "No authentication path exists."
    - control_id: strong-user-auth
      status: not_applicable
      notes: "No end-user sign-in exists."
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Reservation and assignment administration is recorded in Cloud Audit Logs (Admin Activity) unconditionally."
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Slot usage per reservation is published to Cloud Monitoring and INFORMATION_SCHEMA without configuration."
    - control_id: backup-recovery
      status: configurable
      field_path: secondary_location
      evidence:
        type: spec_default
        reference: "Unset keeps a single-region reservation; secondary_location (Enterprise Plus) replicates it to a second region for failover."
      notes: "The 03-disaster-recovery preset sets it."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: "Capacity holds no data to retain."
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Slots are a regional or multi-regional pool; BigQuery schedules them without a zonal dependency."
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: "Unset means DELETE -- the reservation and its assignments are deleted on destroy and jobs fall back to on-demand; PREVENT makes destroy fail; ABANDON leaves them in GCP."
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "BigQuery is fully Google-operated."
