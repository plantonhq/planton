# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpbigqueryreservation
spec:
  gcp:
    groups:
      - purpose: EnableApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
          - resourcemanager.projects.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_project_service enabling bigqueryreservation.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed. The provider reads the project with resourcemanager.projects.get before its services on every refresh, so a re-plan or destroy needs it (measured live). Proven 2026-11-21 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
      - purpose: ManageReservation
        permissions:
          - bigquery.reservations.create
          - bigquery.reservations.get
          - bigquery.reservations.update
          - bigquery.reservations.delete
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_bigquery_reservation (Pulumi bigquery.Reservation) on the admin project -- created, patched, read on every refresh, deleted. Names grounded in Google's BigQuery roles page; roles/bigquery.resourceAdmin contains all four. Proven 2026-11-21 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
      - purpose: ManageAssignments
        permissions:
          - bigquery.reservationAssignments.create
          - bigquery.reservationAssignments.list
          - bigquery.reservationAssignments.delete
        provenance: proven
        reach: target
        privilege: ordinary
        condition:
          spec_field_set: assignments
        notes: Covers google_bigquery_reservation_assignment -- Google checks create on both the admin project and the assignee project, folder, or organization; the provider reads assignments by listing the reservation's (the API has no single-assignment GET). Proven 2026-11-21 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
