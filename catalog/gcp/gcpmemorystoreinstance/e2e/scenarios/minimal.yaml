# GcpMemorystoreInstance scenario: a minimal standalone (CLUSTER_DISABLED)
# Valkey instance reaching the prerequisite VPC through the prerequisite
# service connection policy. project_id is deliberately omitted: the
# instance and the PSC endpoint's consumer project ride the provider's
# default project, which the E2E harness exports as GOOGLE_PROJECT.
# The cloud-side instance name carries ${E2E_RUN_ID}; deletion protection
# is explicitly disabled so the ephemeral create -> verify -> destroy
# cycle can tear down without a two-step disable.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpMemorystoreInstance
metadata:
  name: planton-oss-e2e-gcpmsi-smoke
  id: planton-oss-e2e-gcpmsi-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpmemorystoreinstance
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  instanceName: e2e-msi-${E2E_RUN_ID}
  location: us-central1
  shardCount: 1
  mode: CLUSTER_DISABLED
  nodeType: SHARED_CORE_NANO
  pscAutoConnections:
    - network:
        valueFrom:
          kind: GcpVpcNetwork
          name: planton-oss-e2e-gcpvpcnetwork-prereq
          fieldPath: status.outputs.network_id
  # Weekly window on the hour — the API accepts only whole-hour start
  # times (live 400 "Invalid start time, only hours are supported" on a
  # minute-carrying window, 2026-08-12).
  maintenancePolicy:
    weeklyMaintenanceWindow:
      day: SUNDAY
      hour: 3
  deletionProtectionEnabled: false
  # Explicit DELETE so the ephemeral run's destroy is a live no-op-diff
  # proof of the new deletion_policy wiring.
  deletionPolicy: DELETE
