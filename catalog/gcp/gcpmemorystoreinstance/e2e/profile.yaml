apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpmemorystoreinstance
spec:
  # Proven live on both engines (2026-11-20): a standalone shared-core Valkey
  # instance reached through the prerequisite service connection policy,
  # deployed, its maintenance day moved in place (UpdateInstance in Google's
  # audit log) and destroyed by an identity holding only this kind's
  # permissions manifest, with the re-plan clean. shard_count and
  # replica_count resize in place in CLUSTER mode (the provider updates them).
  tier: 1
  #
  # Awaiting re-proof: the instance gained acl_policy (a shared Valkey ACL
  # policy attached by name); the earlier live proof predates it. Attaching
  # needs an ACL policy resource the catalog does not yet model, so the arm
  # stays offline-proven; the next proof confirms the untouched shape still
  # re-plans clean with the new argument unset.
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 120
