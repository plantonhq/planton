apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpmemorystoreinstance
spec:
  # Composed scenario: the instance rides the full service-connectivity
  # chain — VPC -> subnet -> service connection policy (gcp-memorystore
  # class) — all installed from the prerequisite graph via consumer-scoped
  # overrides. Instance create/destroy runs ~10-20 minutes per engine, so
  # batch runs need a generous timeout (>=120m for both engines).
  # deploy -> ACTIVE + discovery-endpoint verify -> destroy -> verify
  # gone, on both provisioners.
  #
  # Live-proven 2026-08-12 on both engines under the apply-idempotency
  # gate (deploy ~7m, destroy ~11m per engine; service-connectivity chain
  # reverse-destroyed clean). The lane's FIRST run caught an API truth:
  # the maintenance window start time supports WHOLE HOURS ONLY (400
  # "Invalid start time, only hours are supported" on a minute-carrying
  # window, both engines) — the spec's minute field was removed and the
  # exclusion recorded in iac/provider-parity.yaml.
  #
  # OFFLINE-PROVEN ARMS (deferrals with unblock conditions):
  #   - server_ca_mode CUSTOMER_MANAGED_CAS_CA + server_ca_pool: needs a
  #     CA Service pool in-region (real cost + undeletable-material
  #     class). Unblock: a lane that owns a CA Service pool fixture.
  #   - maintenance_version: update-only (the API rejects it at create);
  #     needs an existing instance plus an available target version.
  #     Unblock: an update-arm lane on a live instance.
  #   - psc_auto_connections / DR composition / seed sources: composed
  #     multi-instance shapes beyond the minimal scenario's scope,
  #     offline-rendered.
  tier: 1
  #
  # Awaiting re-proof: the instance gained acl_policy (a shared Valkey ACL
  # policy attached by name); the earlier live proof predates it. Attaching
  # needs an ACL policy resource the catalog does not yet model, so the arm
  # stays offline-proven; the next proof confirms the untouched shape still
  # re-plans clean with the new argument unset.
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 120
