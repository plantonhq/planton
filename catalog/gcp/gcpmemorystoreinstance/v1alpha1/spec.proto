syntax = "proto3";

package dev.planton.gcp.gcpmemorystoreinstance.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// GcpMemorystoreInstancePscAutoConnection defines a Private Service Connect
// auto-created endpoint that connects the Memorystore instance to a consumer
// VPC network. GCP creates and manages the PSC forwarding rules automatically.
//
// The connectivity automation only acts when a GcpServiceConnectionPolicy
// for the gcp-memorystore service class already exists on the network in
// the instance's region — deploy the policy before the instance.
//
// At least one PSC connection is needed for applications to reach the instance.
// Multiple connections can be defined for cross-project or multi-VPC access.
// PSC connections are immutable after instance creation.
message GcpMemorystoreInstancePscAutoConnection {
  // Consumer VPC network where the PSC endpoint will be created.
  // The API requires the relative resource path
  // (projects/{project_id}/global/networks/{network_id}) — full https://
  // self-link URLs are rejected, so the reference resolves to the
  // GcpVpcNetwork's network_id output, which is already in that form.
  dev.planton.shared.foreignkey.v1.StringValueOrRef network = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpVpcNetwork,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.network_id"
  ];

  // Consumer project ID where the PSC endpoint will be created.
  // Usually the same project as the Memorystore instance, but can differ
  // for cross-project connectivity. If omitted, both engines resolve the
  // provider's effective project — the endpoint lands next to the
  // instance, which is the common case.
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];
}

// GcpMemorystoreInstanceRdbConfig controls RDB snapshot persistence.
// RDB creates point-in-time snapshots at a configurable interval.
message GcpMemorystoreInstanceRdbConfig {
  // How often RDB snapshots are taken.
  string rdb_snapshot_period = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "ONE_HOUR",
        "SIX_HOURS",
        "TWELVE_HOURS",
        "TWENTY_FOUR_HOURS"
      ]
    }
  ];

  // Optional RFC3339 timestamp for when to start the first snapshot.
  // If not specified, GCP picks an appropriate time.
  string rdb_snapshot_start_time = 2;
}

// GcpMemorystoreInstanceAofConfig controls Append-Only File persistence.
// AOF logs every write operation, providing stronger durability guarantees
// than RDB at the cost of higher I/O.
message GcpMemorystoreInstanceAofConfig {
  // How often the AOF buffer is flushed to disk.
  // NEVER: OS decides (best performance, risk of data loss on crash).
  // EVERY_SEC: flush once per second (good balance).
  // ALWAYS: flush on every write (strongest durability, lowest performance).
  string append_fsync = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "NEVER",
        "EVERY_SEC",
        "ALWAYS"
      ]
    }
  ];
}

// GcpMemorystoreInstancePersistenceConfig controls data persistence for
// the Memorystore instance. Persistence ensures data survives restarts
// and failovers.
message GcpMemorystoreInstancePersistenceConfig {
  // Persistence mode.
  // DISABLED: no persistence, data is in-memory only.
  // RDB: periodic point-in-time snapshots.
  // AOF: append-only file logging every write.
  string mode = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "DISABLED",
        "RDB",
        "AOF"
      ]
    }
  ];

  // RDB snapshot configuration. Required when mode is RDB.
  GcpMemorystoreInstanceRdbConfig rdb_config = 2;

  // AOF configuration. Required when mode is AOF.
  GcpMemorystoreInstanceAofConfig aof_config = 3;

  option (buf.validate.message).cel = {
    id: "rdb_config_required_for_rdb_mode"
    expression: "this.mode != 'RDB' || has(this.rdb_config)"
    message: "rdb_config is required when persistence mode is RDB"
  };

  option (buf.validate.message).cel = {
    id: "aof_config_required_for_aof_mode"
    expression: "this.mode != 'AOF' || has(this.aof_config)"
    message: "aof_config is required when persistence mode is AOF"
  };
}

// GcpMemorystoreInstanceZoneDistributionConfig controls how the instance
// is distributed across availability zones within the region.
message GcpMemorystoreInstanceZoneDistributionConfig {
  // Zone distribution mode.
  // MULTI_ZONE: nodes spread across multiple zones for high availability (default).
  // SINGLE_ZONE: all nodes in a single zone for lowest latency.
  string mode = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "MULTI_ZONE",
        "SINGLE_ZONE"
      ]
    }
  ];

  // Zone for SINGLE_ZONE mode (e.g., "us-central1-a").
  // Required when mode is SINGLE_ZONE. Ignored for MULTI_ZONE.
  string zone = 2;

  option (buf.validate.message).cel = {
    id: "zone_required_for_single_zone"
    expression: "this.mode != 'SINGLE_ZONE' || size(this.zone) > 0"
    message: "zone is required when mode is SINGLE_ZONE"
  };
}

// GcpMemorystoreInstanceMaintenanceWindow defines when GCP may perform
// maintenance on the instance. The window is fixed at 1 hour duration and
// starts on the hour: the Memorystore API accepts ONLY whole-hour start
// times and rejects a start time carrying minutes with 400 "Invalid start
// time, only hours are supported" (field violation on
// weekly_maintenance_window.start_time; live-verified). This is narrower
// than Redis, whose window start is settable to the minute.
message GcpMemorystoreInstanceMaintenanceWindow {
  // Day of the week for the maintenance window.
  string day = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "MONDAY",
        "TUESDAY",
        "WEDNESDAY",
        "THURSDAY",
        "FRIDAY",
        "SATURDAY",
        "SUNDAY"
      ]
    }
  ];

  // Hour of day (0-23, UTC) when the maintenance window starts. The window
  // always starts on the hour — the API supports no finer granularity.
  int32 hour = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 23
  }];
}

// GcpMemorystoreInstanceMaintenancePolicy defines the maintenance schedule
// for the Memorystore instance.
message GcpMemorystoreInstanceMaintenancePolicy {
  // Weekly maintenance window schedule.
  GcpMemorystoreInstanceMaintenanceWindow weekly_maintenance_window = 1 [(buf.validate.field).required = true];
}

// GcpMemorystoreInstanceAutomatedBackupConfig configures scheduled backups
// for the Memorystore instance. Backups are stored in a managed backup
// collection and can be used to restore data (see managed_backup_source
// on the spec for seeding a new instance from one).
message GcpMemorystoreInstanceAutomatedBackupConfig {
  // Hour of day (0-23, UTC) when the daily backup starts.
  int32 start_hour = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 23
  }];

  // Backup retention duration in seconds.
  // Minimum: 86400s (1 day). Maximum: 31536000s (365 days).
  // Example: "3024000s" for 35 days.
  string retention = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[0-9]+s$"
  ];
}

// GcpMemorystoreInstancePrimaryInstance identifies the primary in a
// cross-instance replication pair, as seen from a SECONDARY.
message GcpMemorystoreInstancePrimaryInstance {
  // Full resource path of the primary instance
  // (projects/{project}/locations/{location}/instances/{instance}).
  // A reference resolves to another GcpMemorystoreInstance's name output.
  dev.planton.shared.foreignkey.v1.StringValueOrRef instance = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpMemorystoreInstance,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.name"
  ];
}

// GcpMemorystoreInstanceSecondaryInstance identifies one secondary in a
// cross-instance replication topology, as seen from the PRIMARY.
message GcpMemorystoreInstanceSecondaryInstance {
  // Full resource path of the secondary instance
  // (projects/{project}/locations/{location}/instances/{instance}).
  // A reference resolves to another GcpMemorystoreInstance's name output.
  dev.planton.shared.foreignkey.v1.StringValueOrRef instance = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpMemorystoreInstance,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.name"
  ];
}

// GcpMemorystoreInstanceCrossInstanceReplicationConfig configures
// cross-region disaster recovery: a SECONDARY instance continuously
// replicates from a PRIMARY in another region.
//
// Deploy the primary first (role PRIMARY, listing its secondaries), then
// each secondary (role SECONDARY, pointing at the primary). A secondary
// is read-only until promoted. Roles are exchanged via an in-place
// update during a planned switchover.
message GcpMemorystoreInstanceCrossInstanceReplicationConfig {
  // This instance's role in the replication topology.
  // NONE: not participating in cross-instance replication.
  // PRIMARY: serves writes; replicates to the listed secondaries.
  // SECONDARY: read-only replica of primary_instance.
  string instance_role = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "NONE",
        "PRIMARY",
        "SECONDARY"
      ]
    }
  ];

  // The primary this instance replicates from. Required when
  // instance_role is SECONDARY; must be unset otherwise.
  GcpMemorystoreInstancePrimaryInstance primary_instance = 2;

  // The secondaries replicating from this instance. Set when
  // instance_role is PRIMARY; must be empty otherwise.
  repeated GcpMemorystoreInstanceSecondaryInstance secondary_instances = 3;

  option (buf.validate.message).cel = {
    id: "secondary_requires_primary_instance"
    expression: "this.instance_role != 'SECONDARY' || has(this.primary_instance)"
    message: "a SECONDARY instance must reference its primary via primary_instance"
  };

  option (buf.validate.message).cel = {
    id: "primary_instance_only_for_secondary"
    expression: "this.instance_role == 'SECONDARY' || !has(this.primary_instance)"
    message: "primary_instance is only set when instance_role is SECONDARY"
  };

  option (buf.validate.message).cel = {
    id: "secondaries_only_for_primary"
    expression: "this.instance_role == 'PRIMARY' || size(this.secondary_instances) == 0"
    message: "secondary_instances is only set when instance_role is PRIMARY"
  };
}

// GcpMemorystoreInstanceGcsSource seeds the new instance's data from RDB
// files in Cloud Storage at creation time.
message GcpMemorystoreInstanceGcsSource {
  // Cloud Storage URIs of RDB files to import (gs://bucket/path.rdb).
  // The Memorystore service agent needs read access to the objects.
  repeated string uris = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items = {
      cel: {
        id: "gcs_uri_format"
        expression: "this.startsWith('gs://')"
        message: "each URI must be a Cloud Storage path starting with gs://"
      }
    }
  ];
}

// GcpMemorystoreInstanceManagedBackupSource seeds the new instance's data
// from an existing managed backup at creation time.
message GcpMemorystoreInstanceManagedBackupSource {
  // Full resource path of the backup to restore from
  // (projects/{project}/locations/{location}/backupCollections/{collection}/backups/{backup}).
  string backup = 1 [(buf.validate.field).required = true];
}

// GcpMemorystoreInstanceSpec defines the configuration for a Google Cloud
// Memorystore instance.
//
// Memorystore is a fully managed, in-memory data store that supports the
// Valkey protocol (Redis-compatible). It provides sub-millisecond latency
// for caching, session management, real-time analytics, leaderboards, and
// pub/sub messaging.
//
// Unlike the legacy Memorystore for Redis API (modeled as GcpRedisInstance),
// this new-generation API offers:
//   - Native sharding via configurable shard_count
//   - Predefined node types (SHARED_CORE_NANO through HIGHMEM_2XLARGE)
//   - Private Service Connect (PSC) networking instead of VPC peering
//   - Both RDB and AOF persistence modes
//   - Automated backups with configurable retention
//   - Cross-region replication for disaster recovery
//   - CLUSTER and CLUSTER_DISABLED (standalone) modes
//
// Important behavioral notes:
//
//   - The instance_name, location, mode, authorization_mode,
//     transit_encryption_mode, kms_key, zone_distribution_config,
//     psc_auto_connections, and the seed sources (gcs_source /
//     managed_backup_source) are immutable after creation. Changing them
//     requires replacing the instance.
//
//   - PSC networking is the only connectivity option, and it is driven by
//     service connectivity automation: a GcpServiceConnectionPolicy for
//     the gcp-memorystore service class must exist on the network in this
//     region BEFORE the instance is created, or creation fails with a
//     connectivity error.
//
//   - Node memory is determined by the node_type, not by an explicit
//     memory_size_gb field. The actual memory per node is reported in
//     stack outputs.
//
//   - Instance creation is a long-running operation — the provider's
//     default create timeout is 60 minutes, and multi-shard instances
//     commonly run tens of minutes. Budget deploy windows accordingly; a
//     create that appears stalled at the 20-minute mark is normal, not
//     hung.
message GcpMemorystoreInstanceSpec {
  // GCP project where the Memorystore instance will be created.
  // Can be a literal project ID or a reference to a GcpProject resource.
  // If omitted, the provider's default project is used.
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];

  // Name of the Memorystore instance. This becomes the GCP resource name.
  // Must start with a lowercase letter, contain only lowercase letters,
  // numbers, and hyphens, and end with a lowercase letter or number.
  // 4-63 characters. Immutable after creation.
  string instance_name = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9-]{2,61}[a-z0-9]$",
    (buf.validate.field).string.min_len = 4,
    (buf.validate.field).string.max_len = 63
  ];

  // GCP region where the instance will be deployed (e.g., "us-central1").
  // Immutable after creation.
  string location = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-z]+-[a-z]+[0-9]+$"
  ];

  // Number of shards for the instance. Each shard handles a portion of
  // the keyspace. Minimum 1 shard.
  //
  // For CLUSTER mode: multiple shards distribute data across nodes.
  // For CLUSTER_DISABLED mode: typically 1 shard (single primary).
  int32 shard_count = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {gte: 1}
  ];

  // Instance mode controlling cluster topology.
  // CLUSTER: sharded mode with native cluster protocol support.
  //   Clients must use cluster-aware drivers.
  // CLUSTER_DISABLED: standalone mode with a single primary endpoint.
  //   Compatible with any Valkey/Redis client.
  // Immutable after creation.
  string mode = 5 [(buf.validate.field).cel = {
    id: "mode_valid_value"
    expression: "this == '' || this in ['CLUSTER', 'CLUSTER_DISABLED']"
    message: "mode must be CLUSTER or CLUSTER_DISABLED"
  }];

  // Predefined node type determining CPU and memory per node.
  // Shared-core and custom (burstable, dev/test tiers, smallest first):
  //   SHARED_CORE_NANO, CUSTOM_PICO, CUSTOM_MICRO, CUSTOM_MINI.
  // Dedicated-core (production tiers):
  //   STANDARD_SMALL, STANDARD_LARGE — balanced CPU:memory;
  //   HIGHCPU_MEDIUM — compute-leaning;
  //   HIGHMEM_MEDIUM, HIGHMEM_XLARGE, HIGHMEM_2XLARGE — memory-leaning,
  //   for large keyspaces.
  // If not specified, GCP selects a default.
  string node_type = 6 [(buf.validate.field).cel = {
    id: "node_type_valid_value"
    expression: "this == '' || this in ['SHARED_CORE_NANO', 'CUSTOM_PICO', 'CUSTOM_MICRO', 'CUSTOM_MINI', 'STANDARD_SMALL', 'STANDARD_LARGE', 'HIGHCPU_MEDIUM', 'HIGHMEM_MEDIUM', 'HIGHMEM_XLARGE', 'HIGHMEM_2XLARGE']"
    message: "node_type must be one of: SHARED_CORE_NANO, CUSTOM_PICO, CUSTOM_MICRO, CUSTOM_MINI, STANDARD_SMALL, STANDARD_LARGE, HIGHCPU_MEDIUM, HIGHMEM_MEDIUM, HIGHMEM_XLARGE, HIGHMEM_2XLARGE"
  }];

  // Engine version (e.g., "VALKEY_8_0", "VALKEY_7_2").
  // If not specified, the latest supported version is used.
  string engine_version = 7;

  // Engine configuration parameters as key-value pairs.
  // See Valkey/Redis configuration reference for supported parameters
  // (e.g., "maxmemory-policy", "notify-keyspace-events").
  map<string, string> engine_configs = 8;

  // Number of read replicas per shard (0-5). Default: 0 (no replicas).
  // Replicas provide read scaling and automatic failover.
  int32 replica_count = 9;

  // Private Service Connect (PSC) endpoints for VPC connectivity.
  // Each entry creates a PSC endpoint in the specified consumer VPC,
  // allowing applications in that VPC to reach the instance.
  //
  // A GcpServiceConnectionPolicy for the gcp-memorystore service class
  // must exist on each network in this region before the instance is
  // created — the connectivity automation refuses to place endpoints
  // without it.
  //
  // At least one PSC connection is recommended for the instance to be
  // reachable. Multiple connections enable cross-project or multi-VPC access.
  // Immutable after creation.
  repeated GcpMemorystoreInstancePscAutoConnection psc_auto_connections = 10;

  // Authentication mode for client connections.
  // AUTH_DISABLED: no authentication required (default).
  // IAM_AUTH: clients authenticate using GCP IAM credentials.
  // Immutable after creation.
  string authorization_mode = 11 [(buf.validate.field).cel = {
    id: "authorization_mode_valid_value"
    expression: "this == '' || this in ['AUTH_DISABLED', 'IAM_AUTH']"
    message: "authorization_mode must be AUTH_DISABLED or IAM_AUTH"
  }];

  // TLS encryption mode for client-to-server traffic.
  // TRANSIT_ENCRYPTION_DISABLED: no encryption (default).
  // SERVER_AUTHENTICATION: clients verify the server's identity via TLS.
  // Immutable after creation.
  string transit_encryption_mode = 12 [(buf.validate.field).cel = {
    id: "transit_encryption_mode_valid_value"
    expression: "this == '' || this in ['TRANSIT_ENCRYPTION_DISABLED', 'SERVER_AUTHENTICATION']"
    message: "transit_encryption_mode must be TRANSIT_ENCRYPTION_DISABLED or SERVER_AUTHENTICATION"
  }];

  // Cloud KMS key for customer-managed encryption at rest (CMEK).
  // Format: projects/{project}/locations/{location}/keyRings/{keyRing}/cryptoKeys/{key}
  // If not specified, data is encrypted with Google-managed keys.
  // Immutable after creation.
  dev.planton.shared.foreignkey.v1.StringValueOrRef kms_key = 13 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpKmsKey,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_id"
  ];

  // Persistence configuration for data durability.
  // Controls whether and how data is written to disk.
  GcpMemorystoreInstancePersistenceConfig persistence_config = 14;

  // Zone distribution configuration.
  // Controls how nodes are spread across availability zones.
  // Immutable after creation.
  GcpMemorystoreInstanceZoneDistributionConfig zone_distribution_config = 15;

  // Maintenance policy for scheduled maintenance windows.
  GcpMemorystoreInstanceMaintenancePolicy maintenance_policy = 16;

  // Automated backup configuration.
  // When configured, GCP takes daily backups at the specified hour
  // and retains them for the specified duration.
  GcpMemorystoreInstanceAutomatedBackupConfig automated_backup_config = 17;

  // Cross-region replication for disaster recovery: make this instance a
  // PRIMARY replicating to secondaries in other regions, or a SECONDARY
  // continuously replicating from a primary. Omit (or role NONE) for a
  // standalone instance.
  GcpMemorystoreInstanceCrossInstanceReplicationConfig cross_instance_replication_config = 18;

  // Seed the new instance's data from RDB files in Cloud Storage at
  // creation time. Mutually exclusive with managed_backup_source.
  // Immutable: seeding only happens at creation.
  GcpMemorystoreInstanceGcsSource gcs_source = 19;

  // Seed the new instance's data from an existing managed backup at
  // creation time. Mutually exclusive with gcs_source.
  // Immutable: seeding only happens at creation.
  GcpMemorystoreInstanceManagedBackupSource managed_backup_source = 20;

  // User-defined labels to organize and track the instance. Merged
  // beneath Planton's platform attribution labels (platform keys win on
  // conflict).
  map<string, string> labels = 21;

  // Whether deletion protection is enabled. When true (the default —
  // matching GCP's safety posture), destroying the instance fails until
  // this is explicitly set to false. Both IaC engines send the value
  // explicitly so destroy behavior is identical regardless of engine.
  optional bool deletion_protection_enabled = 22 [(dev.planton.shared.options.default) = "true"];

  // Server certificate authority mode for the TLS-enabled instance —
  // which CA signs the server certificate clients verify:
  //   ""                             -- GCP default (GOOGLE_MANAGED_PER_INSTANCE_CA)
  //   "GOOGLE_MANAGED_PER_INSTANCE_CA" -- a Google-managed CA unique to
  //                                       this instance
  //   "GOOGLE_MANAGED_SHARED_CA"       -- a Google-managed CA shared
  //                                       across instances (clients trust
  //                                       one CA for a whole fleet)
  //   "CUSTOMER_MANAGED_CAS_CA"        -- your own CA pool in Certificate
  //                                       Authority Service (pair with
  //                                       server_ca_pool)
  // Meaningful with transit_encryption_mode SERVER_AUTHENTICATION.
  // Immutable after creation.
  string server_ca_mode = 23 [(buf.validate.field).cel = {
    id: "server_ca_mode_valid_value"
    expression: "this == '' || this in ['GOOGLE_MANAGED_PER_INSTANCE_CA', 'GOOGLE_MANAGED_SHARED_CA', 'CUSTOMER_MANAGED_CAS_CA']"
    message: "server_ca_mode must be GOOGLE_MANAGED_PER_INSTANCE_CA, GOOGLE_MANAGED_SHARED_CA, or CUSTOMER_MANAGED_CAS_CA"
  }];

  // The Certificate Authority Service CA pool that signs the server
  // certificate when server_ca_mode is CUSTOMER_MANAGED_CAS_CA.
  // Format: projects/{project}/locations/{region}/caPools/{caPoolId}.
  // Immutable after creation.
  string server_ca_pool = 24;

  // Self-service maintenance version. Setting this to a newer available
  // version triggers the maintenance update on your schedule instead of
  // waiting for GCP's rollout — the lever for applying a security patch
  // immediately. Only settable as an UPDATE to an existing instance, and
  // only forward (downgrades are rejected). Leave unset to follow GCP's
  // automatic rollout.
  string maintenance_version = 25;

  // Deletion policy for the instance — what happens when this resource
  // is destroyed (evaluated only after deletion_protection_enabled allows
  // the destroy at all):
  //   ""        -- same as "DELETE" (provider default)
  //   "DELETE"  -- the instance is deleted; all in-memory data is lost
  //   "PREVENT" -- destroy FAILS; a second, independent guard for a
  //                cache whose loss would stampede the backing store
  //   "ABANDON" -- the instance is removed from management but left
  //                running (and billing) in GCP with its data intact
  string deletion_policy = 26 [(buf.validate.field).cel = {
    id: "valid_deletion_policy"
    message: "deletion_policy must be one of: DELETE, PREVENT, ABANDON"
    expression: "this == '' || this in ['DELETE', 'PREVENT', 'ABANDON']"
  }];

  // The Memorystore ACL policy attached to the instance: a set of
  // Valkey ACL rules (users, key patterns, allowed commands) authored once
  // and shared across instances in the same region. Leave empty for the
  // instance's built-in default ACL (the "default" user with full access,
  // gated only by auth_enabled). Full resource name:
  // projects/{project}/locations/{region}/aclPolicies/{aclPolicyId}.
  // Mutable: attaching or swapping a policy is an in-place update; the
  // instance's is_acl_policy_in_sync status reports when the new rules
  // have propagated to every node.
  string acl_policy = 27 [(buf.validate.field).cel = {
    id: "acl_policy_format"
    message: "acl_policy must be empty or a full resource name of the form projects/{project}/locations/{region}/aclPolicies/{aclPolicyId}"
    expression: "this == '' || this.matches('^projects/[^/]+/locations/[^/]+/aclPolicies/[^/]+$')"
  }];

  // An instance is seeded from at most one source.
  option (buf.validate.message).cel = {
    id: "at_most_one_seed_source"
    expression: "!(has(this.gcs_source) && has(this.managed_backup_source))"
    message: "gcs_source and managed_backup_source are mutually exclusive — choose one seed source"
  };

  // A customer-managed CA pool is only consumed in CUSTOMER_MANAGED_CAS_CA
  // mode — the provider ignores it otherwise, so a mismatch is always a
  // configuration mistake.
  option (buf.validate.message).cel = {
    id: "server_ca_pool_requires_customer_managed_cas"
    expression: "this.server_ca_pool == '' || this.server_ca_mode == 'CUSTOMER_MANAGED_CAS_CA'"
    message: "server_ca_pool requires server_ca_mode CUSTOMER_MANAGED_CAS_CA"
  };
}
