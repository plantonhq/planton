syntax = "proto3";

package dev.planton.gcp.gcpmemorystoreinstance.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpmemorystoreinstance/v1alpha1/outputs.proto";
import "catalog/gcp/gcpmemorystoreinstance/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-memorystore-instance
message GcpMemorystoreInstance {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpMemorystoreInstance'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpMemorystoreInstanceSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpMemorystoreInstanceStatus status = 5;
}

//gcp-memorystore-instance status
message GcpMemorystoreInstanceStatus {
  //outputs
  GcpMemorystoreInstanceOutputs outputs = 1;
}
