# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpmemorystoreinstance
spec:
  gcp:
    groups:
      - purpose: EnableMemorystoreApis
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers TWO google_project_service resources -- the module enables both memorystore.googleapis.com and networkconnectivity.googleapis.com (PSC service connectivity automation rides the latter). disable_on_destroy is false on both, so the disable permission is never needed.
      - purpose: ReadProject
        permissions:
          - resourcemanager.projects.get
        provenance: derived
        notes: Covers the data "google_project" lookup the Terraform module runs to resolve the provider's default project when spec project_id is omitted (the PSC endpoint then lands next to the instance).
      - purpose: ManageInstance
        permissions:
          - memorystore.instances.create
          - memorystore.instances.get
          - memorystore.instances.update
          - memorystore.instances.delete
          - memorystore.operations.get
        provenance: derived
        notes: Covers google_memorystore_instance -- create, read/refresh, in-place updates (shards, replicas, persistence, backups, maintenance), and destroy. Instance mutations are long-running operations (creates commonly run tens of minutes) the provider polls as memorystore.operations.get, a real dotted permission in IAM's testable-permissions inventory.
