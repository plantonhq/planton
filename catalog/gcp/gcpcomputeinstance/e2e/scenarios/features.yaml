# GcpComputeInstance scenario: the composed graph — a Spot VM with
# shielded boot, a dedicated GcpServiceAccount identity, and a pre-created
# GcpComputeDisk attached by self-link reference (the disk FK proven
# live). Private placement: subnetwork only, no external IP. Also arms
# the cheap new dials: explicit boot-disk guest OS features and an
# explicit DELETE deletion policy (the provider default, armed to prove
# the round-trip stays diff-free).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpComputeInstance
metadata:
  name: planton-oss-e2e-gcpvm-features
  id: planton-oss-e2e-gcpvm-features
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpcomputeinstance
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  # us-east1: us-central1 zonal e2-micro/e2-small pools answered
  # ZONE_RESOURCE_POOL_EXHAUSTED on 2026-08-11 (audit-log verified; the
  # same stockout class hit the VPC-connector fleets there on
  # 2026-08-10). The VM chain is fully self-contained (own VPC →
  # subnetwork prerequisites), so its region is a free variable —
  # pinned to measured capacity reliability.
  zone: us-east1-b
  machineType: e2-small
  bootDisk:
    image: debian-cloud/debian-12
    sizeGb: 10
    type: pd-balanced
    # The image's COMPLETE feature set in the API's echo order — a
    # partial list plans a VM replacement on every re-apply (the API
    # merges at create; the provider compares authoritatively;
    # live-verified 2026-08-11 against debian-12). If a debian-12 image
    # release changes its feature set, this list must follow it.
    guestOsFeatures:
      - UEFI_COMPATIBLE
      - VIRTIO_SCSI_MULTIQUEUE
      - GVNIC
      - SEV_CAPABLE
      - SEV_LIVE_MIGRATABLE_V2
  attachedDisks:
    - source:
        valueFrom:
          kind: GcpComputeDisk
          name: planton-oss-e2e-gcpdisk-prereq
          fieldPath: status.outputs.self_link
      deviceName: e2e-data
  networkInterfaces:
    - subnetwork:
        valueFrom:
          kind: GcpSubnetwork
          name: planton-oss-e2e-gcpsnw-vm-prereq
          fieldPath: status.outputs.subnetwork_self_link
  serviceAccount:
    email:
      valueFrom:
        kind: GcpServiceAccount
        name: planton-oss-e2e-gsa-prereq
        fieldPath: status.outputs.email
    scopes:
      - https://www.googleapis.com/auth/cloud-platform
  scheduling:
    provisioningModel: SPOT
    onHostMaintenance: TERMINATE
    instanceTerminationAction: DELETE
    # Host-error detection tightened to two minutes (the 30-second grid);
    # proves the dial round-trips and re-plans clean.
    hostErrorTimeoutSeconds: 120
  shieldedInstanceConfig:
    enableSecureBoot: true
  deletionPolicy: DELETE
  labels:
    e2e-suite: gcp
