apiVersion: gcp.planton.dev/v1alpha1
kind: GcpComputeInstance
metadata:
  name: hardened-web-server
spec:
  zone: us-central1-a # replace — must be inside the subnetwork's region
  machineType: e2-standard-2
  bootDisk:
    image:
      value: debian-cloud/debian-12
    sizeGb: 20
    type: pd-balanced
  networkInterfaces:
    # Custom-mode VPC placement via subnetwork reference. No
    # accessConfigs — the VM has no external IP; pair the VPC with Cloud
    # NAT for egress and IAP for operator access.
    - subnetwork:
        valueFrom:
          kind: GcpSubnetwork
          name: app-subnet # replace with your GcpSubnetwork resource
          fieldPath: status.outputs.subnetwork_self_link
  serviceAccount:
    # Dedicated least-privilege identity — never the Compute Engine
    # default account. IAM roles on this account, not OAuth scopes, are
    # the control plane.
    email:
      valueFrom:
        kind: GcpServiceAccount
        name: web-server # replace with your GcpServiceAccount resource
        fieldPath: status.outputs.email
    scopes:
      - https://www.googleapis.com/auth/cloud-platform
  shieldedInstanceConfig:
    # Secure boot blocks boot-chain tampering; vTPM and integrity
    # monitoring stay on (GCP defaults).
    enableSecureBoot: true
    enableVtpm: true
    enableIntegrityMonitoring: true
  metadata:
    # OS Login: SSH access via IAM identities, not static keys.
    enable-oslogin: "TRUE"
  tags:
    # Firewall rules select the VM by these tags — allow 80/443 from the
    # load balancer, 22 from IAP.
    - web-server
    - allow-iap-ssh
  allowStoppingForUpdate: true
  labels:
    env: production # replace with your cost-attribution labels
