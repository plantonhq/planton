apiVersion: gcp.planton.dev/v1alpha1
kind: GcpComputeInstance
metadata:
  name: dev-spot-vm
spec:
  zone: us-central1-a # replace — pick a zone near you
  machineType: e2-medium
  bootDisk:
    # Image family: resolves to the newest Debian 12 image at create time.
    image: debian-cloud/debian-12
    type: pd-balanced
  networkInterfaces:
    # The default auto-mode VPC with an ephemeral external IP — the
    # zero-prerequisite way to get a shell.
    - network:
        value: default
      accessConfigs:
        - ephemeral: true
          networkTier: PREMIUM
  scheduling:
    # Spot: deeply discounted capacity GCP may reclaim at any time. The
    # legacy preemptible flag and no-automatic-restart are derived — this
    # single switch is all you set.
    provisioningModel: SPOT
    onHostMaintenance: TERMINATE
    # Preemption deletes the VM (and its auto-delete boot disk) — fully
    # disposable capacity. Use STOP to keep the stopped VM instead.
    instanceTerminationAction: DELETE
  labels:
    env: dev # replace with your cost-attribution labels
