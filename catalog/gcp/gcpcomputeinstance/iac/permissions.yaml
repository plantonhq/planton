# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpcomputeinstance
spec:
  gcp:
    groups:
      - purpose: EnableComputeApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling compute.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageInstance
        permissions:
          - compute.instances.create
          - compute.instances.get
          - compute.instances.update
          - compute.instances.delete
          - compute.instances.setMetadata
          - compute.instances.setLabels
          - compute.instances.setTags
          - compute.instances.setMachineType
          - compute.instances.setScheduling
          - compute.instances.setServiceAccount
          - compute.instances.setDeletionProtection
          - compute.instances.updateShieldedInstanceConfig
          - compute.instances.updateNetworkInterface
          - compute.instances.start
          - compute.instances.stop
          - compute.instances.suspend
          - compute.instances.resume
          - compute.instances.attachDisk
          - compute.instances.detachDisk
          - compute.zoneOperations.get
        provenance: derived
        notes: Covers google_compute_instance across its whole in-place update surface -- metadata/startup script, labels, tags, machine type, scheduling, service account, shielded config, deletion protection, NIC updates, desired_status start/stop/suspend/resume, and attached-disk changes -- plus polling the zone operation every mutation returns. GCP defines NO compute.instances.setShieldedInstanceConfig permission (verified against IAM's testable-permissions inventory); the shielded-config updater is compute.instances.updateShieldedInstanceConfig.
      - purpose: ProvisionBootDisk
        permissions:
          - compute.disks.create
          - compute.disks.use
          - compute.disks.setLabels
          - compute.images.useReadOnly
          - compute.snapshots.useReadOnly
        provenance: derived
        notes: Creating the VM with a fresh boot disk (boot_disk.image or source_snapshot via initialize_params) creates a disk from an image or snapshot; disks.use covers booting from an existing GcpComputeDisk (boot_disk.source_disk) and attaching data disks (attached_disks); disks.setLabels covers boot_disk.disk_labels.
      - purpose: WireNetworking
        permissions:
          - compute.subnetworks.use
          - compute.subnetworks.useExternalIp
          - compute.addresses.use
        provenance: derived
        notes: Placing each NIC on its VPC subnetwork requires subnetworks.use; granting an external IPv4 through an access config requires subnetworks.useExternalIp; addresses.use covers pinning reserved GcpAddress IPs (network_ip internal, access_configs.nat_ip external).
      - purpose: ActAsServiceAccount
        permissions:
          - iam.serviceAccounts.actAs
        provenance: derived
        notes: Required only when service_account.email attaches an identity to the VM (the 02-hardened-web-server preset does) -- GCP demands actAs on that account before provisioning a VM running as it. Not needed when the block is omitted.
