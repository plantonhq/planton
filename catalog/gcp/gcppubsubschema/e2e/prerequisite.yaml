# Published install profile: consumers (a topic's schema_settings.schema
# reference) attach in their chains. The cloud-side schema_name carries
# ${E2E_RUN_ID}; metadata.name stays fixed for FK resolution.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpPubSubSchema
metadata:
  name: planton-oss-e2e-gcppsch-prereq
  id: planton-oss-e2e-gcppsch-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcppubsubschema
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  schemaName: e2e-pst-schema-${E2E_RUN_ID}
  type: AVRO
  definition: |
    {
      "type": "record",
      "name": "E2eEvent",
      "fields": [
        {"name": "event_id", "type": "string"},
        {"name": "occurred_at_ms", "type": "long"}
      ]
    }
