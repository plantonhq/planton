syntax = "proto3";

package dev.planton.gcp.gcppubsubschema.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcppubsubschema/v1alpha1/outputs.proto";
import "catalog/gcp/gcppubsubschema/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-pub-sub-schema
message GcpPubSubSchema {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpPubSubSchema'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpPubSubSchemaSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpPubSubSchemaStatus status = 5;
}

//gcp-pub-sub-schema status
message GcpPubSubSchemaStatus {
  //outputs
  GcpPubSubSchemaOutputs outputs = 1;
}
