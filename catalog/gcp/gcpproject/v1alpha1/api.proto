syntax = "proto3";

package dev.planton.gcp.gcpproject.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpproject/v1alpha1/outputs.proto";
import "catalog/gcp/gcpproject/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-project
message GcpProject {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpProject'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpProjectSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpProjectStatus status = 5;
}

//gcp-project status
message GcpProjectStatus {
  //outputs
  //  outputs
  GcpProjectOutputs outputs = 1;
}
