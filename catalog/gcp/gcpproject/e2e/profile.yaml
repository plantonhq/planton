apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpproject
spec:
  # Live E2E is conditional on org-level Project Creator credentials, which
  # the shared test project's ambient ADC does not carry. Scenarios are
  # exercised via offline converter plans only until an org-scoped test
  # identity exists; validated_provisioners stays empty until the live
  # lanes actually run.
  tier: 2
  status: deferred
  deferred_reason: project creation requires org-level Project Creator credentials the E2E test identity does not hold; offline plans only
  validated_provisioners: []
  timeout_minutes: 45
