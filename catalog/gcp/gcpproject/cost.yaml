# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: gcpproject
spec:
  billing_model: free
  free_tier: A project is the Layer-0 container of the GCP resource hierarchy, and Google's Resource Manager pricing is explicit that all use of the Cloud Resource Manager API is free of charge -- no meter counts projects, their labels, their hierarchy placement, or the billing-account link. A project costs nothing whether it holds one bucket or an entire production estate.
  notes: "No field of this spec buys anything, yet almost every field steers spend that bills elsewhere. billing_account_id decides WHERE every charge inside the project lands -- it routes invoices, it never creates one. enabled_apis flips services on without charging for the flip; each API meters only when something inside the project actually uses it. labels are the primary cost-allocation dimension in billing exports -- free themselves, they decide how the real spend is sliced. tags bind Resource Manager tags at no charge (Google's one tag caveat, a per-tag monthly fee, applies to tags attached to Cloud Storage BUCKETS, not to projects). The dominant spend is always the resources CREATED in the project, each billing as its own catalog kind -- the project only contains them. One transient footnote: with auto_create_network unset (false, the default) GCP still momentarily creates the default VPC before the module deletes it, and VPC networks are themselves chargeless."
