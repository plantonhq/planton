spec:
  # Proven live on both engines (2026-11-20): a minimal job and one reading a
  # stored secret, each deployed, its task count raised in place (UpdateJob in
  # Google's audit log) and destroyed by an identity holding only this kind's
  # permissions manifest, with the re-plan clean.
  tier: 1
