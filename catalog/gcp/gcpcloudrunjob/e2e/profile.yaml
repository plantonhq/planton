apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpcloudrunjob
spec:
  # Proven live on both engines (2026-11-20): a minimal job and one reading a
  # stored secret, each deployed, its task count raised in place (UpdateJob in
  # Google's audit log) and destroyed by an identity holding only this kind's
  # permissions manifest, with the re-plan clean.
  tier: 1
  #
  # Proven live on both engines untagged. Resource Manager tags need
  # organization-level tag keys and values, so the tags arm is proven offline
  # only.
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
