# Minimal GcpCloudRunJob scenario: a single-task batch hello job, extended
# with execution-level metadata and the explicit teardown policy. The
# execution tokens are deliberately NOT armed here: a token-armed create
# triggers a real execution, an arm the proof lane designs deliberately
# (see the proof queue's watch-list). project_id is deliberately omitted
# (ambient project). Job names are project-scoped with no soft-delete
# reservation. deletion_protection must be false so DESTROY can run.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudRunJob
metadata:
  name: planton-oss-e2e-cldrunjob-minimal
  id: planton-oss-e2e-cldrunjob-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcloudrunjob
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-central1
  jobName: planton-oss-e2e-cldrunjob-${E2E_RUN_ID}
  executionLabels:
    planton-e2e-arm: execution-labels
  executionAnnotations:
    planton-e2e/arm: execution-annotations
  template:
    containers:
      - image: us-docker.pkg.dev/cloudrun/container/job:latest
        resources:
          cpu: "1"
          memory: 512Mi
    executionEnvironment: EXECUTION_ENVIRONMENT_GEN2
    timeoutSeconds: 300
    maxRetries: 1
  taskCount: 1
  deletionProtection: false
  deletionPolicy: DELETE
