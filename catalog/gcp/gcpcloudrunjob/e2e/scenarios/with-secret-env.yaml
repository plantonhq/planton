# GcpCloudRunJob secret-value scenario: the minimal batch job plus one
# literal variable and one secret_value variable. The module must create the
# variable's Secret Manager secret (replicated in us-central1), store the
# value as a version, grant the project's Compute Engine default service
# account secretAccessor on that secret alone (no template service account),
# and point the variable at the stored version -- the task template carries a
# secret key reference, never the value. Destroy removes the secret with the
# job. Tokens stay unarmed, so no execution runs. The value is a literal
# because this lane runs without a platform; on Planton the field takes only a
# $secret/ reference.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudRunJob
metadata:
  name: planton-oss-e2e-cldrunjob-secret-env
  id: planton-oss-e2e-cldrunjob-secret-env
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpcloudrunjob
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-central1
  jobName: planton-oss-e2e-cldrunjob-se-${E2E_RUN_ID}
  executionLabels:
    planton-e2e-arm: execution-labels
  executionAnnotations:
    planton-e2e/arm: execution-annotations
  template:
    containers:
      - image: us-docker.pkg.dev/cloudrun/container/job:latest
        env:
          - name: LOG_LEVEL
            value: info
          - name: E2E_TOKEN
            secretValue: e2e-not-a-real-secret
        resources:
          cpu: "1"
          memory: 512Mi
    executionEnvironment: EXECUTION_ENVIRONMENT_GEN2
    timeoutSeconds: 300
    maxRetries: 1
  taskCount: 1
  deletionProtection: false
  deletionPolicy: DELETE
