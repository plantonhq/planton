# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/componentcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: ComponentCostProfile
metadata:
  name: gcpcloudrunjob
spec:
  billing_model: usage_based
  cost_drivers:
    - field_path: template.containers
      sku_meter: job compute
      pricing_unit: vCPU-seconds
      impact: Each container's cpu/memory limits set the per-second rates every running task accrues -- $0.000018 per vCPU-second and $0.000002 per GiB-second in us-central1 (Tier 1) -- billed at the instance-based rate for the task's entire lifetime, minimum 1 minute per started instance.
    - field_path: task_count
      sku_meter: job compute
      pricing_unit: vCPU-seconds
      impact: Every execution stamps out task_count tasks, each billing its own instance lifetime -- a 10-task execution bills 10 task lifetimes, so the meter scales linearly with the fan-out.
    - field_path: parallelism
      sku_meter: job compute
      impact: Concurrency shapes wall-clock, not billed seconds -- total vCPU/GiB-seconds are the sum of task lifetimes either way; parallelism decides how fast the execution finishes, not how much it costs.
    - field_path: template.timeout_seconds
      sku_meter: job compute
      impact: The per-attempt cap on billed duration -- a hung task stops billing at the timeout (GCP default 600 seconds) instead of running forever; each retry gets a fresh timeout budget.
    - field_path: template.max_retries
      sku_meter: job compute
      impact: Each retry is a fresh billed task attempt -- max_retries (GCP default 3) multiplies the worst-case spend of a failing task.
    - field_path: template.node_selector.accelerator
      sku_meter: job GPU
      pricing_unit: GPU-seconds
      impact: One GPU per task for the task's entire lifetime -- NVIDIA L4 without zonal redundancy bills $0.0001867 per second in us-central1, roughly 10x the CPU meter for a 4-vCPU task; the dominant meter whenever it is set.
    - field_path: template.vpc_access.connector
      sku_meter: Serverless VPC Access connector
      impact: The connector's own instances bill on the GcpServerlessVpcConnector component whether or not executions run; direct VPC egress (network_interfaces) avoids that standing cost and bills only VPC data transfer for the traffic tasks actually move.
    - field_path: template.containers.env.secret_value
      sku_meter: Secret Manager active secret versions
      pricing_unit: versions per location per month
      impact: Each variable set through secret_value keeps one Secret Manager secret with one active version in each replica region (the job's region) -- $0.06 per active version per location per month, prorated by the hour, with the first 6 active versions per billing account free (cloud.google.com/secret-manager/pricing, read 2026-09-24). A replaced version is destroyed, and destroyed versions are free; access operations bill $0.03 per 10,000 beyond the first 10,000 a month, one read per instance start.
  estimate_exclusions:
    - Secret Manager active versions for secret_value variables -- one per variable per replica region at $0.06 a month (first 6 per billing account free); cents at most, and the count of variables is the manifest's, the free allowance the billing account's
    - a job definition at rest bills nothing -- vCPU-seconds and GiB-seconds accrue only while an execution's tasks run, and executions start only when triggered (gcloud, Cloud Scheduler, Eventarc, or a deploy-time execution token)
    - container images bill as Artifact Registry storage on the repository's project, not here
    - network egress from tasks follows Google Cloud networking pricing; data transfer through direct VPC egress bills at VPC rates
    - Secret Manager access operations for secret env vars and volumes bill on the secret's project
  notes: "A job is a definition with a rate card: creating it costs nothing, and every charge follows tasks actually running. Jobs bill at Cloud Run's instance-based rate for the entire lifetime of each started task instance, minimum 1 minute (Cloud Run pricing page, Jobs section). Google's monthly free tier -- the first 240,000 vCPU-seconds and 450,000 GiB-seconds, aggregated per billing account -- bounds the bill for light schedules; it does not make the job free."
