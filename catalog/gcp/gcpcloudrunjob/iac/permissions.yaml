# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpcloudrunjob
spec:
  gcp:
    groups:
      - purpose: EnableRunApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
        provenance: derived
        notes: Covers google_project_service enabling run.googleapis.com on the target project. disable_on_destroy is false in both modules, so the disable permission is never needed.
      - purpose: ManageJob
        permissions:
          - run.jobs.create
          - run.jobs.get
          - run.jobs.update
          - run.jobs.delete
          - run.operations.get
        provenance: derived
        notes: Covers google_cloud_run_v2_job -- create, read/refresh, in-place updates (template, task_count, parallelism, binary authorization, execution tokens), and destroy. Job mutations on the Cloud Run Admin API v2 return long-running operations the provider polls, which authorize as run.operations.get. The committed action-inventory snapshot (pkg/iac/actioninventory/gcp.yaml) carries the run service prefix and lists every run.* permission here; the list was also verified live against Google's Cloud Run IAM documentation (https://cloud.google.com/run/docs/reference/iam/roles, which lists run.jobs.create/get/update/delete and run.operations.get and states run.operations.get is required "to read the status" of a deploy).
      - purpose: ApplyResourceManagerTags
        permissions:
          - run.jobs.createTagBinding
          - resourcemanager.tagValueBindings.create
        provenance: derived
        notes: Required only when resource_manager_tags is set -- attaching a tag at create time authorizes on both sides, the binding on the job (run.jobs.createTagBinding) and the use of each named tag value (tag values are org-level resources, so the tagValueBindings grant lives there, typically through roles/resourcemanager.tagUser on the tag's scope). Tags bind at create time only; a tag change replaces the job, re-running these checks. Not needed for untagged jobs.
      - purpose: ActAsRuntimeServiceAccount
        permissions:
          - iam.serviceAccounts.actAs
        provenance: derived
        notes: Cloud Run's deployment-permissions documentation requires iam.serviceAccounts.actAs on the service identity for every create or update -- and jobs ALWAYS have a service identity. When template.service_account names an account, actAs is needed on that account; when it is unset, the job runs as the project's Compute Engine default service account and actAs is needed there instead. There is no shape of this component that escapes the requirement.
      - purpose: ManageEnvSecrets
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - secretmanager.secrets.create
          - secretmanager.secrets.get
          - secretmanager.secrets.update
          - secretmanager.secrets.delete
          - secretmanager.secrets.getIamPolicy
          - secretmanager.secrets.setIamPolicy
          - secretmanager.versions.add
          - secretmanager.versions.get
          - secretmanager.versions.access
          - secretmanager.versions.enable
          - secretmanager.versions.disable
          - secretmanager.versions.destroy
        provenance: derived
        condition:
          spec_field_set: template.containers.env.secret_value
        notes: Covers the secret the modules keep per env[].secret_value -- google_project_service enabling secretmanager.googleapis.com (disable_on_destroy false), google_secret_manager_secret (user-managed replication in the job's region(s), attribution labels), google_secret_manager_secret_version holding the value (a new value creates the new version before destroying the old; versions.access is the provider's read of the payload on refresh), and google_secret_manager_secret_iam_member granting roles/secretmanager.secretAccessor on that one secret to the runtime identity (IAM member resources read the policy before modifying it). Teardown deletes the secret, which destroys its versions.
      - purpose: ResolveDefaultRuntimeIdentity
        permissions:
          - resourcemanager.projects.get
        provenance: derived
        condition:
          spec_field_set: template.containers.env.secret_value
        notes: The data source the modules use to name the Compute Engine default service account (<project-number>-compute@developer.gserviceaccount.com) in the secretAccessor grant when template.service_account is unset -- google_project reads the project to learn its number. Not exercised when template.service_account names the runtime identity (the condition cannot express "unset", so the entry rides the secret_value condition).
      - purpose: ReadDeployedImage
        permissions:
          - artifactregistry.repositories.downloadArtifacts
        provenance: derived
        notes: Google's Cloud Run deploy guide requires the deploying identity to hold Artifact Registry Reader (roles/artifactregistry.reader) on the repository of the deployed image, separate from the Cloud Run service agent that pulls it when a revision starts; downloadArtifacts is the permission behind that role that the deploy exercises. Needed whenever the image lives in Artifact Registry (the manifest cannot express that as a field condition); scope it to the image's repository in a hardened deployment. Images from other registries do not exercise it.
