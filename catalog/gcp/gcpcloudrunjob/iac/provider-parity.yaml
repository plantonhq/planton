# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_cloud_run_v2_job:
    mappings:
      # Renames: the spec says what the field IS, where the provider
      # inherits terser API names.
      - spec: spec.job_name
        arg: name
      - spec: spec.project_id
        arg: project
      # The provider's bare "tags" is the Resource Manager tag map; the
      # spec uses the catalog-wide resource_manager_tags vocabulary.
      - spec: spec.resource_manager_tags
        arg: tags
      - spec: spec.region
        arg: location

      # The spec flattens the provider's execution-template wrapper
      # (template.task_count / template.parallelism / template.labels /
      # template.annotations) to honest top-level fields; the task
      # template is the spec's `template` message. Exact matching resumes
      # below each subtree mapping.
      - spec: spec.task_count
        arg: template.task_count
      - spec: spec.parallelism
        arg: template.parallelism
      - spec: spec.execution_labels
        arg: template.labels
      - spec: spec.execution_annotations
        arg: template.annotations
      - spec: spec.template
        arg: template.template

      # GPU zonal redundancy is a spec-level dial (it pairs with the
      # spec-level CEL requiring an accelerator) that the provider nests
      # inside the task template.
      - spec: spec.gpu_zonal_redundancy_disabled
        arg: template.template.gpu_zonal_redundancy_disabled

      # The task timeout keeps the honest integer-seconds shape; the
      # provider takes a duration string.
      - spec: spec.template.timeout_seconds
        arg: template.template.timeout

      # The env oneof's secret arm names what it does; the provider nests
      # the same shape one level deeper.
      - spec: spec.template.containers.env.value_from_secret
        arg: template.template.containers.env.value_source.secret_key_ref

      # The provider models CPU/memory as one limits map; the spec keeps
      # the two honest fields -- both argument sides land on the map.
      - spec: spec.template.containers.resources.cpu
        arg: template.template.containers.resources.limits
      - spec: spec.template.containers.resources.memory
        arg: template.template.containers.resources.limits
    exclusions:
      # API-client telemetry strings with no user-facing behavior.
      - arg: client
        reason: >-
          API-client telemetry label (which tool created the resource);
          no user-facing behavior
      - arg: client_version
        reason: >-
          API-client telemetry version accompanying client; no
          user-facing behavior

  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables run.googleapis.com
      with fixed arguments (disable_on_destroy false so destroying one
      job never disables the API project-wide); not spec surface.

  # One secret per env[].secret_value: the module creates it, stores the
  # value as a version, and grants the runtime identity read access to that
  # secret alone. Only the value itself is spec surface.
  google_secret_manager_secret:
    internal: >-
      created by the module per env[].secret_value -- its id
      (runjob/run, region, job, container, variable), user-managed
      replication in the job's region(s), and attribution labels are all
      derived from the job, never authored.
  google_secret_manager_secret_iam_member:
    internal: >-
      the roles/secretmanager.secretAccessor grant on each stored secret
      for the job's runtime identity (its service account, else the
      project's Compute Engine default) -- derived, never authored.
  google_secret_manager_secret_version:
    specRoot: spec.template.containers.env
    mappings:
      - spec: spec.template.containers.env.secret_value
        arg: secret_data
    exclusions:
      - arg: secret
        reason: the module's own secret for this variable (derived), never authored
      - arg: project
        reason: follows the job's project through the secret it belongs to
      - arg: enabled
        reason: a stored value is always the enabled version the variable is pinned to
      - arg: is_secret_data_base64
        reason: the stored value is the variable's text as resolved, never base64-encoded
      - arg: secret_data_wo
        reason: write-only arm of secret_data; the module pins the variable to the stored version, which needs the version resource's own lifecycle
      - arg: secret_data_wo_version
        reason: companion of the unused write-only arm (see secret_data_wo)
      - arg: deletion_policy
        reason: a replaced or removed version is deleted (the provider default) -- the copy is derived, and a disabled or abandoned version would outlive the value's source
