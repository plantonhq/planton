syntax = "proto3";

package dev.planton.gcp.gcpcloudrunjob.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpcloudrunjob/v1alpha1/outputs.proto";
import "catalog/gcp/gcpcloudrunjob/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-cloud-run-job
message GcpCloudRunJob {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpCloudRunJob'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpCloudRunJobSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpCloudRunJobStatus status = 5;
}

//gcp-cloud-run-job status
message GcpCloudRunJobStatus {
  //outputs
  GcpCloudRunJobOutputs outputs = 1;
}
