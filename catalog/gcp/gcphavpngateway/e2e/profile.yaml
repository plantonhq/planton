apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcphavpngateway
spec:
  # Proven live on both engines (2026-11-19): an HA VPN gateway with its Cloud
  # Router, custom BGP advertisement and an identifier range, deployed, given
  # a longer keepalive and a label in place, and destroyed by an identity
  # holding only this kind's permissions manifest, with the re-plan clean.
  # Google checks compute.networks.updatePolicy when the gateway or router is
  # created on a network. The Interconnect arm stays offline-only.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
