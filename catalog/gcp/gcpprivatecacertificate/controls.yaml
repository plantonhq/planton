# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpprivatecacertificate
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Google stores the issued certificate encrypted at rest; the pool's kms_key_name adds a customer-managed key. The private key never reaches Google."
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: "At-rest key choice belongs to the pool (kms_key_name); the certificate has none of its own."
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "The CA Service API is served over TLS only."
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Issuing requires privateca.certificates.create on the pool; a certificate is public material by design, the private key is not in it."
    - control_id: restricted-ingress
      status: not_applicable
      notes: "The certificate is an API resource with no network listener."
    - control_id: edge-protection
      status: not_applicable
      notes: "No edge is served."
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Issuing and revoking need privateca.certificates.* on the pool; a template needs privateca.certificateTemplates.use."
    - control_id: workload-identity
      status: not_applicable
      notes: "The certificate is itself an identity; the kind holds no credential."
    - control_id: no-legacy-auth
      status: not_applicable
      notes: "No authentication happens at the certificate resource."
    - control_id: strong-user-auth
      status: not_applicable
      notes: "No end-user sign-in exists."
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Issuance and revocation are recorded in Cloud Audit Logs."
    - control_id: monitoring-integration
      status: not_applicable
      notes: "Issuance metrics report under the pool and authority."
    - control_id: backup-recovery
      status: not_applicable
      notes: "A certificate is reissued from the spec; revocation is final by design."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: "No backups exist."
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "CA Service is a regional service."
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: "Destroy revokes by default; PREVENT makes destroy fail and ABANDON leaves the certificate valid and unmanaged."
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "CA Service is fully Google-operated."
