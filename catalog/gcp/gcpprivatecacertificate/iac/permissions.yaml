# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpprivatecacertificate
spec:
  gcp:
    api_enabled_by:
      - GcpPrivateCaPool
    groups:
      - purpose: IssueAndRevokeCertificate
        permissions:
          - privateca.certificates.create
          - privateca.certificates.get
          - privateca.certificates.update
          - privateca.caPools.use
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_privateca_certificate (Pulumi certificateauthority.Certificate) -- issued from the pool (caPools.use authorizes issuing through it), read on every refresh, labels updated in place, and revoked on destroy (Google's revoke is an update of the certificate). Names grounded in Google's CA Service permissions-and-roles page; roles/privateca.certificateManager contains all four. Proven 2026-11-20 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
      - purpose: UseTemplate
        permissions:
          - privateca.certificateTemplates.use
        provenance: derived
        reach: target
        privilege: ordinary
        condition:
          spec_field_set: certificate_template
        notes: Issuing with a template needs roles/privateca.templateUser on it, as Google's certificate_template description states. Not exercised without a template.
