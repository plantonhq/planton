# Consumer-scoped GcpPrivateCaPool install profile for the gcppcac chain:
# an Enterprise pool, because Google cannot describe or revoke certificates
# in a DevOps pool, so a certificate resource needs Enterprise.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpPrivateCaPool
metadata:
  name: planton-oss-e2e-gcppcac-pool
  id: planton-oss-e2e-gcppcac-pool
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpprivatecapool
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  location: us-central1
  caPoolId: e2e-gcppcac-pool-${E2E_RUN_ID}
  tier: ENTERPRISE
