apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpprivatecacertificate
spec:
  # Proven live on both engines (2026-11-20): a one-day server certificate
  # issued from config in an Enterprise pool under a self-signed root,
  # relabeled in place and revoked on destroy by an identity holding only this
  # kind's permissions manifest, with the re-plan clean. Certificate Authority
  # Service writes no Admin Activity entry for certificates (not their create,
  # update or revoke), so the update is judged from the engine's plan and the
  # verifier's read instead (planton.dev/e2e-upgrade-unaudited).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 30
