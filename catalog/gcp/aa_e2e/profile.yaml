apiVersion: qa.planton.dev/v1
kind: ProviderE2EProfile
metadata:
  name: gcp
spec:
  credential_approach: oidc
  test_substrate: real_cloud
  default_cost_class: paid_ephemeral
  default_schedule_lane: weekly
  required_tools:
    - pulumi
    - tofu
    - gcloud
  github_environment: e2e-gcp
  max_concurrent_tests: 4
  # Every lane re-plans after apply and fails on any pending change (the
  # IDEMPOTENCY phase): the GCP catalog wires Optional+Computed arguments
  # explicit-send precisely so re-applies are no-ops, and this gate holds
  # that contract mechanically for the kind under test.
  assert_apply_idempotency: true
