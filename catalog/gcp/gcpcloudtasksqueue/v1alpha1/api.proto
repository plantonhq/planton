syntax = "proto3";

package dev.planton.gcp.gcpcloudtasksqueue.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpcloudtasksqueue/v1alpha1/outputs.proto";
import "catalog/gcp/gcpcloudtasksqueue/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-cloud-tasks-queue
message GcpCloudTasksQueue {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpCloudTasksQueue'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpCloudTasksQueueSpec spec = 4 [(buf.validate.field).required = true];
  GcpCloudTasksQueueStatus status = 5;
}

message GcpCloudTasksQueueStatus {
  GcpCloudTasksQueueOutputs outputs = 1;
}
