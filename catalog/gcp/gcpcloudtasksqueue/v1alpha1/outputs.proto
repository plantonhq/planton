syntax = "proto3";

package dev.planton.gcp.gcpcloudtasksqueue.v1alpha1;

// Outputs produced after provisioning a GCP Cloud Tasks queue.
message GcpCloudTasksQueueOutputs {
  // The fully qualified queue ID.
  // Format: projects/{project}/locations/{location}/queues/{name}
  // This is the value downstream resources use to reference this queue.
  string queue_id = 1;

  // The short queue name (same as the spec's queue_name input).
  string queue_name = 2;

  // The effective max burst size of the queue's rate limits.
  // Computed by GCP from max_dispatches_per_second — it is not configurable.
  // Max burst size caps how fast queued tasks are processed when many tasks
  // are enqueued in a short period at a high dispatch rate.
  int32 max_burst_size = 3;
}
