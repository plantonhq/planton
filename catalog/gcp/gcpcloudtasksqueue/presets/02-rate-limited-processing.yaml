apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudTasksQueue
metadata:
  name: order-processing
spec:
  queueName: order-processing
  location: us-central1
  rateLimits:
    # The ceiling on dispatch throughput; GCP additionally computes a
    # max burst size from this rate (reported in outputs).
    maxDispatchesPerSecond: 500
    # Concurrency cap: dispatch stops when this many tasks are in flight.
    maxConcurrentDispatches: 100
  retryConfig:
    maxAttempts: 5
    # Exponential backoff from 1s, doubling 16 times, capped at 1 hour.
    minBackoff: "1s"
    maxBackoff: "3600s"
    maxDoublings: 16
    # Give up entirely after 24 hours regardless of attempts remaining.
    maxRetryDuration: "86400s"
  stackdriverLoggingConfig:
    # Log 10% of dispatch operations — enough signal for operations
    # without the log-volume cost of full sampling.
    samplingRatio: 0.1
