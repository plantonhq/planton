# GcpCloudTasksQueue scenario: queue-level HTTP target composed on the
# GcpServiceAccount prerequisite — the live proof that the OIDC token's
# service-account FK resolves, plus the full uri_override surface
# (including path/query overrides, whose nested blocks are the known
# perpetual-diff hotspot on the provider) and explicit rate/retry/logging
# dials so the verifier checks a fully configured posture.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudTasksQueue
metadata:
  name: planton-oss-e2e-gcptq-oidc
  id: planton-oss-e2e-gcptq-oidc
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcloudtasksqueue
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  queueName: e2e-tq-oidc-${E2E_RUN_ID}
  location: us-central1
  httpTarget:
    httpMethod: POST
    oidcToken:
      serviceAccountEmail:
        valueFrom:
          kind: GcpServiceAccount
          name: planton-oss-e2e-gsa-prereq
          fieldPath: status.outputs.email
      audience: https://e2e-target.example.com
    uriOverride:
      scheme: HTTPS
      host: e2e-target.example.com
      path: /v1/tasks/process
      queryParams: source=e2e
      enforceMode: ALWAYS
    headerOverrides:
      - key: Content-Type
        value: application/json
  rateLimits:
    maxDispatchesPerSecond: 100
    maxConcurrentDispatches: 50
  retryConfig:
    maxAttempts: 3
    minBackoff: "5s"
    maxBackoff: "300s"
    maxDoublings: 4
  stackdriverLoggingConfig:
    samplingRatio: 1.0
  # Destroy really destroys in E2E: the live lanes prove the full lifecycle.
  deletionPolicy: DELETE
