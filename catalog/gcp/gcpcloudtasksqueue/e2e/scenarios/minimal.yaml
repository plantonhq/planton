# GcpCloudTasksQueue scenario: the minimal queue — GCP-managed defaults
# for rate limits and retries. project_id is deliberately omitted (ambient
# project). The cloud-side queueName carries ${E2E_RUN_ID} because a
# deleted queue's ID is reserved for up to 7 days, so reruns never collide
# with a reserved identifier.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudTasksQueue
metadata:
  name: planton-oss-e2e-gcptq-minimal
  id: planton-oss-e2e-gcptq-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcloudtasksqueue
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  queueName: e2e-tq-min-${E2E_RUN_ID}
  location: us-central1
  # Destroy really destroys in E2E: the live lanes prove the full lifecycle.
  deletionPolicy: DELETE
