# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpcloudtasksqueue
spec:
  gcp:
    groups:
      - purpose: EnableCloudTasksApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling cloudtasks.googleapis.com on the target project. disable_on_destroy is false in both modules, so the disable permission is never needed.
      - purpose: ManageQueue
        permissions:
          - cloudtasks.queues.create
          - cloudtasks.queues.get
          - cloudtasks.queues.update
          - cloudtasks.queues.delete
          - cloudtasks.queues.pause
          - cloudtasks.queues.resume
        provenance: derived
        notes: Covers google_cloud_tasks_queue -- create, read/refresh, in-place updates (rate limits, retry config, targets, logging), and destroy. The pause and resume entries exist because desired_state is declarative -- the provider calls the dedicated PauseQueue/ResumeQueue RPCs on a state transition, and Cloud Tasks defines cloudtasks.queues.pause and cloudtasks.queues.resume as distinct permissions. The committed action-inventory snapshot (pkg/iac/actioninventory/gcp.yaml) carries the cloudtasks service prefix and lists every cloudtasks.* permission here; the list was also verified live against Google's Cloud Tasks access-control documentation (https://cloud.google.com/tasks/docs/reference-access-control, which lists all six under roles/cloudtasks.queueAdmin).
      - purpose: ActAsOauthTokenServiceAccount
        permissions:
          - iam.serviceAccounts.actAs
        provenance: derived
        condition:
          spec_field_set: http_target.oauth_token
        notes: The Cloud Tasks API demands actAs on the service account http_target.oauth_token names for authenticated dispatch, at queue create/update time, as the spec contract itself documents on the token message.
      - purpose: ActAsOidcTokenServiceAccount
        permissions:
          - iam.serviceAccounts.actAs
        provenance: derived
        condition:
          spec_field_set: http_target.oidc_token
        notes: The Cloud Tasks API demands actAs on the service account http_target.oidc_token names for authenticated dispatch (the 03-secure-cloud-run-target preset does), at queue create/update time, as the spec contract itself documents on the token message.
