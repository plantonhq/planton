# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpidentityplatformtenant
spec:
  gcp:
    groups:
      - purpose: EnableIdentityToolkitApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service (Terraform) / projects.Service (Pulumi) enabling identitytoolkit.googleapis.com on the target project (a no-op where the config kind already enabled it). The Terraform module pins disable_on_destroy=false and the Pulumi module leaves the field unset -- the provider's own reference states false OR UNSET leaves the service enabled on destroy (pinned 7.x line), so neither engine ever calls the disable path and serviceusage.services.disable is deliberately not granted.
      - purpose: ManageTenant
        permissions:
          - identitytoolkit.tenants.create
          - identitytoolkit.tenants.get
          - identitytoolkit.tenants.list
          - identitytoolkit.tenants.update
          - identitytoolkit.tenants.delete
        provenance: derived
        notes: Covers google_identity_platform_tenant -- create (GCP generates the tenant ID), read/refresh and import (get, with list for discovery), in-place updates (display name, sign-up switches, disable_auth, client permissions), and destroy when deletion_policy allows it (PREVENT and ABANDON are client-side stances that never call delete). All five names verified against Google's published Identity Toolkit IAM reference (https://cloud.google.com/iam/docs/roles-permissions/identitytoolkit, read 2026-08-22), which also shows they are contained in roles/identityplatform.admin -- the role both READMEs recommend ("the deploying identity needs roles/identityplatform.admin or broader").
      - purpose: ManageTenantIdpConfigs
        permissions:
          - firebaseauth.configs.update
          - firebaseauth.configs.get
        provenance: derived
        notes: Required only when default_supported_idps, oauth_idp_configs, or inbound_saml_configs compose tenant-scoped IdP config resources. Google authorizes tenant-parented IdP-config CRUD as firebaseauth.configs.update on the tenant parent, the same class as the project level -- verified on the tenant-scoped create method reference (https://cloud.google.com/identity-platform/docs/reference/rest/v2/projects.tenants.defaultSupportedIdpConfigs/create, read 2026-08-22) -- with firebaseauth.configs.get for the reads the provider issues on refresh and import. The OAuth client IDs and secrets these configs carry come from each provider's own developer console -- no GCP permission obtains them.
