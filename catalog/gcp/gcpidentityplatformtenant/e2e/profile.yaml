apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpidentityplatformtenant
spec:
  # Registry prerequisite GcpIdentityPlatformConfig: the harness deploys
  # the planton-oss-e2e-gcpidcfg-prereq fixture first, which arms
  # multiTenant.allowTenants (tenants cannot be created without it) and
  # adoptExisting (the test project is permanently initialized — the
  # config kind's profile has the story). PROVEN live 4/4 lanes (both
  # scenarios x both engines), IDEMPOTENCY clean — the server-generated
  # tenant ID flow (output, never spec) and the tenant-scoped IdP
  # composition proved on both engines. Tenants themselves are fully
  # deletable, so deploy -> verify -> destroy -> verify-gone is clean.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
