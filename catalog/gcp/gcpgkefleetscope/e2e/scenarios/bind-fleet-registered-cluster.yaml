# GcpGkeFleetScope scenario: a cluster that joined the second project's
# fleet through GcpGkeCluster.fleet_project, bound to a team scope through
# the cluster's fleet_membership output -- the end-to-end proof of that
# output. The fixture chain (network, subnetwork, zonal cluster) lives in
# the second project. Cost: one zonal Standard cluster for the lane's
# duration, inside the GKE free tier's monthly cluster credit, plus its
# default node pool.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGkeFleetScope
metadata:
  name: planton-oss-e2e-gcpflsc-bind
  id: planton-oss-e2e-gcpflsc-bind
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpgkefleetscope
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-required-env: PLANTON_E2E_GCP_SECOND_PROJECT_ID
    planton.dev/e2e-prerequisites: "catalog/gcp/gcpgkefleetscope/e2e/prerequisites/vpc.yaml,catalog/gcp/gcpgkefleetscope/e2e/prerequisites/subnet.yaml,catalog/gcp/gcpgkefleetscope/e2e/prerequisites/cluster.yaml"
  tags:
    - planton-e2e
spec:
  projectId:
    valueFrom:
      kind: GcpGkeFleet
      name: planton-oss-e2e-gcpflsc-fleet
      fieldPath: status.outputs.project_id
  scopeId: e2e-bind-${E2E_RUN_ID}
  namespaces:
    - scopeNamespaceId: e2e-bound
  membershipBindings:
    - membershipBindingId: e2e-cluster
      membership:
        valueFrom:
          kind: GcpGkeCluster
          name: planton-oss-e2e-gcpflsc-cluster
          fieldPath: status.outputs.fleet_membership
