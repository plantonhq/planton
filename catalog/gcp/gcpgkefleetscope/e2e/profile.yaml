apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpgkefleetscope
spec:
  # Proven live on both engines (2026-11-21), as an identity holding only this
  # kind's permissions manifest, granted in the second test project: a team
  # scope with namespaces, namespace labels and role bindings, and a scope
  # bound to a zonal GKE cluster registered through its fleetProject (a
  # cluster chain in that project), each deployed, re-planned clean, and
  # destroyed; the namespace labels changed in place (GkeHub.UpdateScope),
  # judged from Google's Admin Activity log in the second project. A GKE
  # cluster's fleet_membership output carries the //gkehub.googleapis.com/
  # service prefix; the spec and both modules take it as it comes. Free-form
  # role-binding principals are accepted.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 60
