syntax = "proto3";

package dev.planton.gcp.gcpgkefleetscope.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpgkefleetscope/v1alpha1/outputs.proto";
import "catalog/gcp/gcpgkefleetscope/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-gke-fleet-scope
message GcpGkeFleetScope {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpGkeFleetScope'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpGkeFleetScopeSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpGkeFleetScopeStatus status = 5;
}

//gcp-gke-fleet-scope status
message GcpGkeFleetScopeStatus {
  //stack-outputs
  GcpGkeFleetScopeStackOutputs outputs = 1;
}
