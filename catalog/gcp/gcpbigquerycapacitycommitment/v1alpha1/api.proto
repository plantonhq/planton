syntax = "proto3";

package dev.planton.gcp.gcpbigquerycapacitycommitment.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpbigquerycapacitycommitment/v1alpha1/outputs.proto";
import "catalog/gcp/gcpbigquerycapacitycommitment/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-bigquery-capacity-commitment
message GcpBigQueryCapacityCommitment {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpBigQueryCapacityCommitment'];

  //metadata
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpBigQueryCapacityCommitmentSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpBigQueryCapacityCommitmentStatus status = 5;
}

//gcp-bigquery-capacity-commitment status
message GcpBigQueryCapacityCommitmentStatus {
  //stack-outputs
  GcpBigQueryCapacityCommitmentStackOutputs outputs = 1;
}
