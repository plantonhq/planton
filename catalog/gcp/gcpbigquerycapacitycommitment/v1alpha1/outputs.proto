syntax = "proto3";

package dev.planton.gcp.gcpbigquerycapacitycommitment.v1alpha1;

// GcpBigQueryCapacityCommitmentOutputs captures the commitment's
// identity and term.
message GcpBigQueryCapacityCommitmentOutputs {
  // Full resource name --
  // projects/{project}/locations/{location}/capacityCommitments/{id}.
  string name = 1;

  // The commitment's state (PENDING, ACTIVE, or FAILED).
  string state = 2;

  // When the original commitment started (ACTIVE commitments only);
  // renewals don't move it.
  string commitment_start_time = 3;

  // When the current term ends (ACTIVE commitments only). A delete before
  // it fails. A renewal moves it forward, so a commitment that renews never
  // reaches it.
  string commitment_end_time = 4;
}
