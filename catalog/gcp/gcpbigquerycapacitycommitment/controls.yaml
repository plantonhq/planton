# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpbigquerycapacitycommitment
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: "A commitment is a purchase of capacity; it holds no data."
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: "No data is stored."
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "The Reservation API is TLS-only."
    - control_id: no-public-access
      status: not_applicable
      notes: "A commitment has no address."
    - control_id: restricted-ingress
      status: not_applicable
      notes: "No listener exists."
    - control_id: edge-protection
      status: not_applicable
      notes: "No edge is served."
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Buying or changing a commitment requires bigquery.capacityCommitments.* permissions on the admin project."
    - control_id: workload-identity
      status: not_applicable
      notes: "The commitment authenticates nothing."
    - control_id: no-legacy-auth
      status: not_applicable
      notes: "No authentication path exists."
    - control_id: strong-user-auth
      status: not_applicable
      notes: "No end-user sign-in exists."
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Commitment purchases and changes are recorded in Cloud Audit Logs (Admin Activity) unconditionally."
    - control_id: monitoring-integration
      status: not_applicable
      notes: "Committed slots are observed through the reservations that use them."
    - control_id: backup-recovery
      status: not_applicable
      notes: "No data exists to back up."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: "No backups exist."
    - control_id: multi-zone-ha
      status: not_applicable
      notes: "A commitment is a billing construct with no runtime."
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: "Unset means DELETE, which Google refuses before the term ends (the destroy fails); PREVENT always fails; ABANDON leaves the commitment to run out its term."
      notes: "Every preset sets ABANDON."
    - control_id: managed-patching
      status: not_applicable
      notes: "No software surface exists."
