syntax = "proto3";

package dev.planton.gcp.gcpcertificatemap.v1alpha1;

// Outputs produced after provisioning a Certificate Manager certificate
// map.
message GcpCertificateMapOutputs {
  // The full map resource name
  // (projects/{project}/locations/global/certificateMaps/{name}).
  string map_id = 1;

  // The map as a GcpTargetHttpsProxy consumes it
  // (//certificatemanager.googleapis.com/projects/{project}/locations/global/certificateMaps/{name})
  // — set the proxy's certificate_map argument to exactly this value.
  string map_uri = 2;

  // The short map name (the last segment of map_id).
  string map_name = 3;
}
