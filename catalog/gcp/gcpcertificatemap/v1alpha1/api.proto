syntax = "proto3";

package dev.planton.gcp.gcpcertificatemap.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpcertificatemap/v1alpha1/outputs.proto";
import "catalog/gcp/gcpcertificatemap/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-certificate-map
message GcpCertificateMap {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpCertificateMap'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpCertificateMapSpec spec = 4 [(buf.validate.field).required = true];
  GcpCertificateMapStatus status = 5;
}

message GcpCertificateMapStatus {
  GcpCertificateMapOutputs outputs = 1;
}
