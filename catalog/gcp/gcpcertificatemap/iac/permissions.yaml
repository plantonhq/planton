# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the official modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: gcpcertificatemap
spec:
  gcp:
    groups:
      - purpose: EnableCertificateManagerApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
        provenance: derived
        notes: Covers google_project_service enabling certificatemanager.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed.
      - purpose: ManageCertificateMap
        permissions:
          - certificatemanager.certmaps.create
          - certificatemanager.certmaps.get
          - certificatemanager.certmaps.update
          - certificatemanager.certmaps.delete
          - certificatemanager.operations.get
        provenance: derived
        notes: Covers google_certificate_manager_certificate_map -- create, read/refresh, in-place updates (description, labels), and destroy. Certificate Manager mutations return long-running operations the provider polls under certificatemanager.operations.get; the entry mutations below poll under the same permission.
      - purpose: ManageMapEntries
        permissions:
          - certificatemanager.certmapentries.create
          - certificatemanager.certmapentries.get
          - certificatemanager.certmapentries.update
          - certificatemanager.certmapentries.delete
        provenance: derived
        notes: Covers the google_certificate_manager_certificate_map_entry fan-out -- entry create/destroy (hostname, matcher, and name are ForceNew) and the in-place certificate-list rotation that is the entries' one mutable surface.
