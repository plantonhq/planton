syntax = "proto3";

package dev.planton.gcp.gcpdataproccluster.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpdataproccluster/v1alpha1/outputs.proto";
import "catalog/gcp/gcpdataproccluster/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-dataproc-cluster
message GcpDataprocCluster {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpDataprocCluster'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpDataprocClusterSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpDataprocClusterStatus status = 5;
}

//gcp-dataproc-cluster status
message GcpDataprocClusterStatus {
  //outputs
  GcpDataprocClusterOutputs outputs = 1;
}
