syntax = "proto3";

package dev.planton.gcp.gcpdataproccluster.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";

// GcpDataprocClusterDiskConfig configures the boot disk and local SSDs
// for Dataproc cluster node groups (master, worker, secondary worker,
// auxiliary driver groups).
//
// The boot disk type defaults to "pd-standard" in GCP when not specified.
// Local SSDs provide high-performance scratch storage for shuffle data.
message GcpDataprocClusterDiskConfig {
  // Size of the boot disk in GB. Minimum 10 GB.
  // If not specified, GCP defaults to 500 GB for master and worker nodes.
  int32 boot_disk_size_gb = 1 [(buf.validate.field).cel = {
    id: "boot_disk_size_gb_minimum"
    expression: "this == 0 || this >= 10"
    message: "boot_disk_size_gb must be at least 10"
  }];

  // Boot disk type: "pd-standard" (GCP default), "pd-ssd", "pd-balanced",
  // or "hyperdisk-balanced" (the class whose provisioned IOPS/throughput
  // dials apply). The API validates availability per image version and
  // machine family at deploy time.
  string boot_disk_type = 2 [(buf.validate.field).cel = {
    id: "boot_disk_type_valid_value"
    expression: "this == '' || this in ['pd-standard', 'pd-ssd', 'pd-balanced', 'hyperdisk-balanced']"
    message: "boot_disk_type must be pd-standard, pd-ssd, pd-balanced, or hyperdisk-balanced"
  }];

  // Number of local SSDs to attach. Each local SSD is 375 GB.
  // Default: 0 (no local SSDs).
  int32 num_local_ssds = 3;

  // Interface used to attach local SSDs: "scsi" (default) or "nvme".
  // NVMe offers higher throughput for shuffle-heavy Spark workloads but
  // requires an image that ships NVMe drivers (all current Dataproc
  // images do).
  string local_ssd_interface = 4 [(buf.validate.field).cel = {
    id: "local_ssd_interface_valid_value"
    expression: "this == '' || this in ['scsi', 'nvme']"
    message: "local_ssd_interface must be scsi or nvme"
  }];

  // Provisioned I/O operations per second for the boot disk — the IOPS
  // dial decoupled from disk size, honored by disk types that support
  // provisioned performance (hyperdisks).
  optional int64 boot_disk_provisioned_iops = 5 [(buf.validate.field).int64.gte = 1];

  // Provisioned throughput in MB/s for the boot disk — the bandwidth
  // dial decoupled from disk size, honored by disk types that support
  // provisioned performance (hyperdisks).
  optional int64 boot_disk_provisioned_throughput = 6 [(buf.validate.field).int64.gte = 1];

  // Additional persistent disks attached to every node of this role,
  // beyond the boot disk — for HDFS data or shuffle spill that should not
  // share the boot volume, or for Hyperdisk performance tiers the boot
  // disk cannot use. Each entry is one disk on each node. Immutable: the
  // whole set is fixed at cluster creation (ForceNew). Not available on
  // auxiliary (driver) node groups.
  repeated GcpDataprocClusterAttachedDisk attached_disks = 7;
}

// GcpDataprocClusterAttachedDisk is one additional persistent disk
// attached to every node of a role.
message GcpDataprocClusterAttachedDisk {
  // Size of the disk in GB. Leave unset for the API's default size.
  int32 disk_size_gb = 1 [(buf.validate.field).cel = {
    id: "attached_disk_size_gb_minimum"
    expression: "this == 0 || this >= 10"
    message: "disk_size_gb must be at least 10"
  }];

  // Disk type: "pd-standard", "pd-ssd", "pd-balanced", or
  // "hyperdisk-balanced" (the class whose provisioned IOPS/throughput
  // dials apply). Leave empty for the API's default.
  string disk_type = 2 [(buf.validate.field).cel = {
    id: "attached_disk_type_valid_value"
    expression: "this == '' || this in ['pd-standard', 'pd-ssd', 'pd-balanced', 'hyperdisk-balanced']"
    message: "disk_type must be pd-standard, pd-ssd, pd-balanced, or hyperdisk-balanced"
  }];

  // Provisioned I/O operations per second, honored by disk types that
  // support provisioned performance (hyperdisks).
  optional int64 provisioned_iops = 3 [(buf.validate.field).int64.gte = 1];

  // Provisioned throughput in MB/s, honored by disk types that support
  // provisioned performance (hyperdisks).
  optional int64 provisioned_throughput = 4 [(buf.validate.field).int64.gte = 1];
}

// GcpDataprocClusterAccelerator configures GPU accelerators attached to
// Dataproc cluster nodes for ML and compute workloads.
message GcpDataprocClusterAccelerator {
  // Full accelerator type name (e.g., "nvidia-tesla-t4", "nvidia-tesla-v100").
  // See https://cloud.google.com/compute/docs/gpus for available types.
  string accelerator_type = 1 [(buf.validate.field).required = true];

  // Number of accelerators to attach. Must be at least 1.
  int32 accelerator_count = 2 [(buf.validate.field).int32.gte = 1];
}

// GcpDataprocClusterShieldedInstanceConfig hardens the cluster's VMs with
// Shielded VM features: verified boot chain and tamper-evident
// attestation. All three toggles default to off in GCP; production
// security baselines commonly enable all three.
message GcpDataprocClusterShieldedInstanceConfig {
  // Verify the boot integrity of the VM using a secure boot chain.
  bool enable_secure_boot = 1;

  // Enable the virtual Trusted Platform Module (vTPM).
  bool enable_vtpm = 2;

  // Enable integrity monitoring comparing boot measurements against a
  // known-good baseline.
  bool enable_integrity_monitoring = 3;
}

// GcpDataprocClusterConfidentialInstanceConfig runs the cluster's VMs as
// Confidential VMs, encrypting data in use (memory encryption via AMD
// SEV). Requires a machine type from the N2D family.
message GcpDataprocClusterConfidentialInstanceConfig {
  // Enable Confidential Compute for all cluster nodes with the AMD SEV
  // technology. The provider marks this boolean deprecated in favor of
  // confidential_instance_type, which names the technology explicitly;
  // prefer that field for new clusters. Both may be set for a cluster
  // authored before the type field existed.
  bool enable_confidential_compute = 1;

  // Confidential Compute technology for all cluster nodes:
  //   "SEV"     -- AMD Secure Encrypted Virtualization (N2D, C2D, C3D)
  //   "SEV_SNP" -- AMD SEV with Secure Nested Paging: adds integrity
  //                protection and attestation (N2D)
  //   "TDX"     -- Intel Trust Domain Extensions (C3)
  // The machine type must support the chosen technology. Immutable.
  string confidential_instance_type = 2 [(buf.validate.field).cel = {
    id: "confidential_instance_type_valid_value"
    expression: "this == '' || this in ['SEV', 'SEV_SNP', 'TDX']"
    message: "confidential_instance_type must be SEV, SEV_SNP, or TDX"
  }];
}

// GcpDataprocClusterReservationAffinity pins the cluster's VMs to a
// Compute Engine reservation, guaranteeing capacity for large or
// time-critical clusters.
message GcpDataprocClusterReservationAffinity {
  // How the cluster consumes reservations.
  // NO_RESERVATION: never consume reservations.
  // ANY_RESERVATION: consume any matching open reservation (default).
  // SPECIFIC_RESERVATION: consume only the reservation named by key/values.
  string consume_reservation_type = 1 [(buf.validate.field).cel = {
    id: "consume_reservation_type_valid_value"
    expression: "this == '' || this in ['NO_RESERVATION', 'ANY_RESERVATION', 'SPECIFIC_RESERVATION']"
    message: "consume_reservation_type must be NO_RESERVATION, ANY_RESERVATION, or SPECIFIC_RESERVATION"
  }];

  // Reservation label key. For SPECIFIC_RESERVATION use
  // "compute.googleapis.com/reservation-name".
  string key = 2;

  // Reservation label values (the reservation name for
  // SPECIFIC_RESERVATION).
  repeated string values = 3;

  // A specific reservation must be identified by key and values.
  option (buf.validate.message).cel = {
    id: "specific_reservation_requires_key_values"
    expression: "this.consume_reservation_type != 'SPECIFIC_RESERVATION' || (this.key != '' && size(this.values) > 0)"
    message: "key and values are required when consume_reservation_type is SPECIFIC_RESERVATION"
  };
}

// GcpDataprocClusterNodeGroupAffinity places all cluster VMs on a
// sole-tenant node group — physical servers dedicated to your project,
// used for bring-your-own-license or compliance isolation requirements.
message GcpDataprocClusterNodeGroupAffinity {
  // URI of the sole-tenant node group the cluster will be created on.
  // Format: projects/{project}/zones/{zone}/nodeGroups/{node_group}
  // (shorter forms accepted by the API also work).
  string node_group_uri = 1 [(buf.validate.field).required = true];
}

// GcpDataprocClusterGceConfig defines the Compute Engine environment
// for the Dataproc cluster's nodes, including networking, identity,
// instance hardening, and placement.
//
// Either network or subnetwork may be specified, but not both.
// If neither is specified, the cluster uses the project's default VPC.
message GcpDataprocClusterGceConfig {
  // VPC network for the cluster's nodes. Mutually exclusive with subnetwork.
  // Expects a network self-link or resource reference.
  dev.planton.shared.foreignkey.v1.StringValueOrRef network = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpVpcNetwork,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.network_self_link"
  ];

  // VPC subnetwork for the cluster's nodes. Mutually exclusive with network.
  // Using a subnetwork is recommended for production clusters with
  // controlled IP ranges.
  dev.planton.shared.foreignkey.v1.StringValueOrRef subnetwork = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpSubnetwork,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.subnetwork_self_link"
  ];

  // Service account for the cluster's VMs. If not specified, the default
  // Compute Engine service account is used. A custom service account with
  // minimal permissions is recommended for production.
  dev.planton.shared.foreignkey.v1.StringValueOrRef service_account = 3 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpServiceAccount,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.email"
  ];

  // OAuth 2.0 scopes for the service account. If not specified, GCP uses
  // a default set of scopes. Override only when you need to restrict or
  // expand API access.
  repeated string service_account_scopes = 4;

  // GCP zone within the region for node placement. If not specified,
  // GCP auto-selects a zone within the cluster's region.
  string zone = 5;

  // Whether to use only internal IP addresses for cluster nodes.
  // When true, nodes have no external IP and require Cloud NAT or
  // Private Google Access for internet connectivity.
  // Recommended for production to reduce attack surface.
  bool internal_ip_only = 6;

  // GCE network tags applied to all cluster nodes. Useful for
  // firewall rule targeting.
  repeated string tags = 7;

  // Compute Engine metadata key-value pairs applied to all cluster nodes.
  // Common use: startup scripts, environment variables for init actions.
  map<string, string> metadata = 8;

  // Shielded VM hardening (secure boot, vTPM, integrity monitoring)
  // for all cluster nodes.
  GcpDataprocClusterShieldedInstanceConfig shielded_instance_config = 9;

  // Reservation affinity for guaranteed compute capacity.
  GcpDataprocClusterReservationAffinity reservation_affinity = 10;

  // Sole-tenant node group placement for compliance or licensing
  // isolation.
  GcpDataprocClusterNodeGroupAffinity node_group_affinity = 11;

  // Confidential VM (data-in-use encryption) for all cluster nodes.
  // Requires an N2D machine type.
  GcpDataprocClusterConfidentialInstanceConfig confidential_instance_config = 12;

  // Resource manager (secure) tags applied to all cluster instances,
  // keyed "tagKeys/{tag_key_id}" with values "tagValues/{tag_value_id}".
  // Unlike network tags, these are IAM-governed and usable in org
  // policies and firewall rules.
  map<string, string> resource_manager_tags = 13;

  // network and subnetwork are mutually exclusive.
  option (buf.validate.message).cel = {
    id: "network_subnetwork_mutual_exclusion"
    expression: "!(has(this.network) && has(this.subnetwork))"
    message: "only one of network or subnetwork may be set"
  };
}

// GcpDataprocClusterMasterConfig defines the configuration for the
// master node(s) of the Dataproc cluster.
//
// For standard clusters, use 1 master. For high-availability clusters,
// use 3 masters (GCP requirement for HA mode).
message GcpDataprocClusterMasterConfig {
  // Number of master instances. Valid values: 1 (standard) or 3 (HA).
  // If not specified, GCP defaults to 1.
  int32 num_instances = 1;

  // Compute Engine machine type (e.g., "n2-standard-4", "e2-standard-8").
  // If not specified, GCP selects a default machine type.
  // Mutually exclusive with instance_flexibility_policy — a flexibility
  // policy replaces the single machine type (see that field).
  string machine_type = 2;

  // Boot disk and local SSD configuration.
  GcpDataprocClusterDiskConfig disk_config = 3;

  // GPU accelerators attached to master nodes.
  // Typically not needed for masters unless running single-node ML workloads.
  repeated GcpDataprocClusterAccelerator accelerators = 4;

  // Minimum CPU platform for the instances (e.g., "Intel Cascade Lake").
  // Forces nodes onto a specific or newer CPU generation.
  string min_cpu_platform = 5;

  // Custom Dataproc image URI. If not specified, GCP uses the image
  // determined by software_config.image_version.
  string image_uri = 6;

  // Ranked machine-type preferences for master provisioning — keeps the
  // cluster creatable when the preferred type's zonal capacity dries up.
  // REPLACES machine_type: with a flexibility policy present the API
  // provisions solely from the ranked selections and drops a paired
  // machineTypeUri from the stored config. Masters are on-demand
  // capacity: provisioning_model_mix does not apply here (secondary
  // workers only).
  GcpDataprocClusterInstanceFlexibilityPolicy instance_flexibility_policy = 7;

  // Masters have no standard/spot capacity mix — they are always
  // on-demand.
  option (buf.validate.message).cel = {
    id: "master_flexibility_no_provisioning_mix"
    expression: "!has(this.instance_flexibility_policy) || !has(this.instance_flexibility_policy.provisioning_model_mix)"
    message: "provisioning_model_mix applies to secondary workers only"
  };

  // machine_type and instance_flexibility_policy are alternative
  // provisioning contracts, never complements: the API silently drops a
  // paired machineTypeUri from the stored config, and because
  // machine_type is create-only the pairing re-plans as a whole-cluster
  // REPLACEMENT on every subsequent apply (live-verified against the
  // Dataproc API).
  option (buf.validate.message).cel = {
    id: "master_machine_type_xor_flexibility"
    expression: "!(this.machine_type != '' && has(this.instance_flexibility_policy))"
    message: "machine_type and instance_flexibility_policy are mutually exclusive; rank machine types in the flexibility policy's instance_selection_list instead"
  };
}

// GcpDataprocClusterWorkerConfig defines the configuration for the
// primary worker nodes of the Dataproc cluster.
//
// Primary workers are standard, on-demand VMs that persist for the
// lifetime of the cluster. Use secondary workers for cost-optimized,
// preemptible/spot capacity.
message GcpDataprocClusterWorkerConfig {
  // Number of primary worker instances.
  // If not specified, GCP defaults to 2. This is one of the few fields
  // that can be changed in place after creation (manual scaling).
  int32 num_instances = 1;

  // Compute Engine machine type (e.g., "n2-standard-4", "e2-standard-8").
  // If not specified, GCP selects a default machine type.
  // Mutually exclusive with instance_flexibility_policy — a flexibility
  // policy replaces the single machine type (see that field).
  string machine_type = 2;

  // Boot disk and local SSD configuration.
  GcpDataprocClusterDiskConfig disk_config = 3;

  // GPU accelerators attached to worker nodes.
  // Common for Spark ML workloads using GPU-accelerated libraries.
  repeated GcpDataprocClusterAccelerator accelerators = 4;

  // Minimum CPU platform for the instances.
  string min_cpu_platform = 5;

  // Custom Dataproc image URI.
  string image_uri = 6;

  // Minimum number of primary worker instances when autoscaling is active.
  // The autoscaler will not scale below this threshold. Updatable in place.
  int32 min_num_instances = 7;

  // Ranked machine-type preferences for primary-worker provisioning —
  // keeps scale-ups schedulable when the preferred type's zonal capacity
  // dries up. REPLACES machine_type: with a flexibility policy present
  // the API provisions solely from the ranked selections and drops a
  // paired machineTypeUri from the stored config. Primary workers are
  // on-demand capacity: provisioning_model_mix does not apply here
  // (secondary workers only).
  GcpDataprocClusterInstanceFlexibilityPolicy instance_flexibility_policy = 8;

  // Primary workers have no standard/spot capacity mix — they are always
  // on-demand.
  option (buf.validate.message).cel = {
    id: "worker_flexibility_no_provisioning_mix"
    expression: "!has(this.instance_flexibility_policy) || !has(this.instance_flexibility_policy.provisioning_model_mix)"
    message: "provisioning_model_mix applies to secondary workers only"
  };

  // machine_type and instance_flexibility_policy are alternative
  // provisioning contracts, never complements: the API silently drops a
  // paired machineTypeUri from the stored config, and because
  // machine_type is create-only the pairing re-plans as a whole-cluster
  // REPLACEMENT on every subsequent apply (live-verified against the
  // Dataproc API).
  option (buf.validate.message).cel = {
    id: "worker_machine_type_xor_flexibility"
    expression: "!(this.machine_type != '' && has(this.instance_flexibility_policy))"
    message: "machine_type and instance_flexibility_policy are mutually exclusive; rank machine types in the flexibility policy's instance_selection_list instead"
  };
}

// GcpDataprocClusterInstanceSelection names a ranked machine-type
// preference for flexible secondary-worker provisioning.
message GcpDataprocClusterInstanceSelection {
  // Machine types to try for this selection entry (e.g.
  // ["n2-standard-8", "n2d-standard-8"]).
  repeated string machine_types = 1 [(buf.validate.field).repeated.min_items = 1];

  // Preference rank. Lower rank is preferred; Dataproc falls back to
  // higher ranks when capacity for the preferred types is unavailable.
  int32 rank = 2 [(buf.validate.field).int32.gte = 0];

  // Disk shape for nodes provisioned from THIS selection entry —
  // overrides the role's disk_config so, for example, the fallback
  // machine types can carry a different boot disk or local SSD count
  // than the preferred ones. Leave unset to inherit the role's
  // disk_config. Immutable.
  GcpDataprocClusterDiskConfig disk_config = 3;
}

// GcpDataprocClusterProvisioningModelMix blends standard (on-demand)
// and spot capacity within the secondary worker group, protecting a
// baseline of standard capacity while bursting on cheaper spot VMs.
message GcpDataprocClusterProvisioningModelMix {
  // Number of secondary workers that must be standard (on-demand)
  // capacity before any spot VMs are used.
  int32 standard_capacity_base = 1 [(buf.validate.field).int32.gte = 0];

  // Percentage of capacity above the base that should also be standard
  // (0-100). The remainder is provisioned as spot.
  int32 standard_capacity_percent_above_base = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
}

// GcpDataprocClusterInstanceFlexibilityPolicy lets the secondary worker
// group draw from multiple machine types and mix provisioning models —
// the lever for keeping large autoscaled clusters schedulable when a
// single machine type's spot capacity dries up.
message GcpDataprocClusterInstanceFlexibilityPolicy {
  // Ranked machine-type preferences. Dataproc provisions from the
  // lowest-rank entry with available capacity.
  repeated GcpDataprocClusterInstanceSelection instance_selection_list = 1;

  // Standard/spot capacity mix for the group.
  GcpDataprocClusterProvisioningModelMix provisioning_model_mix = 2;
}

// GcpDataprocClusterSecondaryWorkerConfig defines the configuration
// for secondary (preemptible or spot) worker nodes.
//
// Secondary workers provide cost-optimized burst capacity for batch
// workloads. They may be preempted by GCP at any time. Spot VMs are
// the modern replacement for preemptible VMs with better pricing and
// availability.
message GcpDataprocClusterSecondaryWorkerConfig {
  // Number of secondary worker instances. Default: 0.
  // Updatable in place (manual scaling).
  int32 num_instances = 1;

  // Preemptibility of the secondary workers.
  // SPOT: modern spot VMs with dynamic pricing (recommended).
  // PREEMPTIBLE: legacy preemptible VMs with fixed pricing.
  // NON_PREEMPTIBLE: standard on-demand pricing (unusual for secondary workers).
  // If not specified, GCP defaults to PREEMPTIBLE.
  // Immutable after creation.
  string preemptibility = 2 [(buf.validate.field).cel = {
    id: "preemptibility_valid_value"
    expression: "this == '' || this in ['PREEMPTIBLE', 'SPOT', 'NON_PREEMPTIBLE']"
    message: "preemptibility must be PREEMPTIBLE, SPOT, or NON_PREEMPTIBLE"
  }];

  // Boot disk and local SSD configuration for secondary workers.
  // Secondary workers do not support custom machine types or accelerators
  // directly; they inherit machine configuration from the primary worker
  // config unless an instance_flexibility_policy overrides it.
  GcpDataprocClusterDiskConfig disk_config = 3;

  // Machine-type flexibility and standard/spot capacity mix for the
  // group — only secondary workers support flexible provisioning.
  GcpDataprocClusterInstanceFlexibilityPolicy instance_flexibility_policy = 4;
}

// GcpDataprocClusterSoftwareConfig defines the Dataproc image version,
// optional components, and Hadoop/Spark/YARN property overrides.
//
// The image version determines the versions of Apache Spark, Hadoop,
// Hive, Pig, and other components installed on the cluster.
message GcpDataprocClusterSoftwareConfig {
  // Dataproc image version (e.g., "2.2-debian12", "2.1-ubuntu20").
  // See https://cloud.google.com/dataproc/docs/concepts/versioning/dataproc-versions
  // If not specified, GCP uses the latest stable version.
  string image_version = 1;

  // Optional components to install on the cluster. Common values:
  // JUPYTER, DOCKER, PRESTO, ZEPPELIN, HIVE_WEBHCAT, FLINK, TRINO.
  // See https://cloud.google.com/dataproc/docs/concepts/components/overview
  repeated string optional_components = 2;

  // Key-value pairs to override or set Hadoop, Spark, YARN, and other
  // framework properties. Keys use the format "prefix:property", e.g.:
  //   "spark:spark.executor.memory" = "4g"
  //   "hdfs:dfs.replication" = "2"
  //   "dataproc:dataproc.allow.zero.workers" = "true"  (single-node cluster)
  // See https://cloud.google.com/dataproc/docs/concepts/configuring-clusters/cluster-properties
  map<string, string> properties = 3;
}

// GcpDataprocClusterInitAction defines an initialization action (startup
// script) that runs on all nodes when the cluster is created.
//
// Initialization actions are commonly used to install additional software,
// configure networking, or set up monitoring agents.
message GcpDataprocClusterInitAction {
  // GCS URI of the initialization script (must start with "gs://").
  string script = 1 [(buf.validate.field).required = true];

  // Maximum time (in seconds) the script is allowed to run before
  // being forcefully terminated. Default: 300 (5 minutes).
  int32 timeout_sec = 2;
}

// GcpDataprocClusterKerberosConfig enables Hadoop Secure Mode via
// Kerberos on the cluster.
//
// Every *_uri secret field is a Cloud Storage URI of a KMS-encrypted
// file (never inline secret material) — the referenced kms_key_uri
// decrypts them on-cluster. Storing paths, not secrets, is the API's
// own contract, so none of these fields carry literal sensitive data.
message GcpDataprocClusterKerberosConfig {
  // Flag to indicate whether to Kerberize the cluster.
  bool enable_kerberos = 1;

  // Cloud Storage URI of a KMS-encrypted file containing the root
  // principal password. Required to enable Kerberos.
  string root_principal_password_uri = 2 [(buf.validate.field).required = true];

  // URI of the KMS key used to decrypt the root password and the other
  // encrypted files below.
  // Format: projects/{project}/locations/{location}/keyRings/{ring}/cryptoKeys/{key}
  dev.planton.shared.foreignkey.v1.StringValueOrRef kms_key_uri = 3 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpKmsKey,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_id"
  ];

  // Custom Kerberos realm. If unset, Dataproc derives a realm from the
  // cluster's hostname.
  string realm = 4;

  // Lifetime of ticket-granting tickets, in hours. Default: 10.
  int32 tgt_lifetime_hours = 5;

  // Cloud Storage URI of a KMS-encrypted file containing the master key
  // of the KDC database.
  string kdc_db_key_uri = 6;

  // Cloud Storage URI of the keystore file (TLS). If unset, Dataproc
  // generates a self-signed certificate.
  string keystore_uri = 7;

  // Cloud Storage URI of a KMS-encrypted file with the keystore password.
  string keystore_password_uri = 8;

  // Cloud Storage URI of a KMS-encrypted file with the key password.
  string key_password_uri = 9;

  // Cloud Storage URI of the truststore file (TLS).
  string truststore_uri = 10;

  // Cloud Storage URI of a KMS-encrypted file with the truststore password.
  string truststore_password_uri = 11;

  // Remote realm for cross-realm trust.
  string cross_realm_trust_realm = 12;

  // KDC host of the remote trusted realm.
  string cross_realm_trust_kdc = 13;

  // Admin server host of the remote trusted realm.
  string cross_realm_trust_admin_server = 14;

  // Cloud Storage URI of a KMS-encrypted file with the shared password
  // between the on-cluster KDC and the remote trusted realm.
  string cross_realm_trust_shared_password_uri = 15;
}

// GcpDataprocClusterIdentityConfig enables the service-account-to-user
// mapping used by Dataproc personal cluster authentication: each cluster
// user runs workloads as their own mapped service account rather than a
// shared cluster identity.
message GcpDataprocClusterIdentityConfig {
  // Map of user accounts to the service accounts they operate as
  // (e.g. "bob@example.com" -> "bob-sa@project.iam.gserviceaccount.com").
  map<string, string> user_service_account_mapping = 1 [(buf.validate.field).map.min_pairs = 1];
}

// GcpDataprocClusterSecurityConfig hardens in-cluster authentication:
// Kerberos (Hadoop Secure Mode) or personal-cluster identity mapping —
// the API accepts exactly one of the two mechanisms.
message GcpDataprocClusterSecurityConfig {
  // Kerberos (Hadoop Secure Mode) configuration.
  GcpDataprocClusterKerberosConfig kerberos_config = 1;

  // Personal cluster authentication (user-to-service-account mapping).
  GcpDataprocClusterIdentityConfig identity_config = 2;

  option (buf.validate.message).cel = {
    id: "exactly_one_security_mechanism"
    expression: "has(this.kerberos_config) != has(this.identity_config)"
    message: "exactly one of kerberos_config or identity_config must be set"
  };
}

// GcpDataprocClusterEndpointConfig controls access to the Dataproc
// Component Gateway, which provides authenticated web UI access to
// cluster services like Spark UI, YARN ResourceManager, HDFS NameNode,
// Jupyter, and Zeppelin.
message GcpDataprocClusterEndpointConfig {
  // Whether to enable the Dataproc Component Gateway for web UI access.
  // When enabled, GCP creates authenticated HTTPS endpoints for each
  // cluster component. Requires the cluster to have external IP access
  // or appropriate Private Google Access configuration.
  bool enable_http_port_access = 1;
}

// GcpDataprocClusterLifecycleConfig controls automatic cluster deletion,
// which is critical for cost management of ephemeral Spark/Hadoop
// clusters.
//
// Dataproc clusters are often ephemeral -- spun up for a batch job,
// then torn down. Without lifecycle configuration, idle clusters
// continue to incur costs indefinitely. Both fields update in place.
message GcpDataprocClusterLifecycleConfig {
  // Duration of inactivity after which the cluster is automatically
  // deleted. Format: duration in seconds with 's' suffix (e.g., "1800s"
  // for 30 minutes). Valid range: 10 minutes to 14 days.
  //
  // A cluster is considered idle when no jobs are running and no
  // interactive sessions are active.
  string idle_delete_ttl = 1 [(buf.validate.field).cel = {
    id: "idle_delete_ttl_format"
    expression: "this == '' || this.matches('^[0-9]+s$')"
    message: "idle_delete_ttl must be a duration in seconds (e.g., '1800s')"
  }];

  // RFC3339 timestamp at which the cluster is automatically deleted,
  // regardless of activity (e.g., "2026-03-01T00:00:00Z").
  // Useful for time-boxed clusters with a known end date.
  string auto_delete_time = 2;

  // Duration of inactivity after which the cluster is automatically
  // STOPPED (not deleted) — VMs shut down, storage and configuration
  // retained, restartable later. Same format and range as
  // idle_delete_ttl (e.g., "1800s"; 10 minutes to 14 days).
  string idle_stop_ttl = 3 [(buf.validate.field).cel = {
    id: "idle_stop_ttl_format"
    expression: "this == '' || this.matches('^[0-9]+s$')"
    message: "idle_stop_ttl must be a duration in seconds (e.g., '1800s')"
  }];

  // RFC3339 timestamp at which the cluster is automatically STOPPED
  // (not deleted), regardless of activity.
  string auto_stop_time = 4;
}

// GcpDataprocClusterMetastoreConfig attaches the cluster to an existing
// Dataproc Metastore service, giving jobs a persistent, shared Hive
// metastore that outlives ephemeral clusters.
message GcpDataprocClusterMetastoreConfig {
  // Resource name of an existing Dataproc Metastore service.
  // Format: projects/{project}/locations/{location}/services/{service}
  // Accepts a literal resource name today; references attach when a
  // metastore-service kind lands in the catalog.
  dev.planton.shared.foreignkey.v1.StringValueOrRef dataproc_metastore_service = 1 [(buf.validate.field).required = true];
}

// GcpDataprocClusterMetric selects one metric source (and optionally
// specific metric overrides) to collect from the cluster into Cloud
// Monitoring.
message GcpDataprocClusterMetric {
  // Source to collect metrics from.
  string metric_source = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      in: [
        "MONITORING_AGENT_DEFAULTS",
        "HDFS",
        "SPARK",
        "YARN",
        "SPARK_HISTORY_SERVER",
        "HIVESERVER2"
      ]
    }
  ];

  // Specific metrics to collect, overriding the source's default set
  // (e.g. "yarn:ResourceManager:QueueMetrics:AppsCompleted").
  repeated string metric_overrides = 2;
}

// GcpDataprocClusterMetricConfig turns on OSS metric collection
// (Spark/YARN/HDFS/Hive) into Cloud Monitoring — the observability
// surface SRE dashboards and alerting build on.
message GcpDataprocClusterMetricConfig {
  // Metric sources to collect.
  repeated GcpDataprocClusterMetric metrics = 1 [(buf.validate.field).repeated.min_items = 1];
}

// GcpDataprocClusterAuxiliaryNodeGroupConfig sizes the VMs of an
// auxiliary node group.
message GcpDataprocClusterAuxiliaryNodeGroupConfig {
  option (buf.validate.message).cel = {
    id: "auxiliary_disk_no_attached_disks"
    message: "attached_disks apply to master, worker, and secondary worker nodes only -- Dataproc does not attach additional disks to auxiliary (driver) node groups"
    expression: "!has(this.disk_config) || size(this.disk_config.attached_disks) == 0"
  };

  // Number of instances in the group.
  int32 num_instances = 1;

  // Compute Engine machine type for the group's instances.
  string machine_type = 2;

  // Minimum CPU platform for the group's instances.
  string min_cpu_platform = 3;

  // Boot disk and local SSD configuration.
  GcpDataprocClusterDiskConfig disk_config = 4;

  // GPU accelerators attached to the group's instances.
  repeated GcpDataprocClusterAccelerator accelerators = 5;
}

// GcpDataprocClusterAuxiliaryNodeGroup adds a dedicated DRIVER node
// group to the cluster — separate capacity where Spark drivers run so
// heavy driver workloads (large collect()s, many concurrent jobs) don't
// compete with the master's control-plane duties.
message GcpDataprocClusterAuxiliaryNodeGroup {
  // Roles assigned to the group. The API currently supports DRIVER.
  repeated string roles = 1 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items = {
      cel: {
        id: "auxiliary_node_group_role_valid_value"
        expression: "this in ['DRIVER']"
        message: "each role must be DRIVER"
      }
    }
  ];

  // VM sizing for the group.
  GcpDataprocClusterAuxiliaryNodeGroupConfig node_group_config = 2;

  // Optional stable identifier for the group (3-33 characters).
  // If unset, Dataproc generates one.
  string node_group_id = 3 [(buf.validate.field).cel = {
    id: "node_group_id_length"
    expression: "this == '' || (size(this) >= 3 && size(this) <= 33)"
    message: "node_group_id must be 3-33 characters"
  }];
}

// GcpDataprocClusterConfig wraps all Compute Engine (GCE-based) cluster
// infrastructure configuration.
//
// This message mirrors the provider's cluster_config structure, keeping
// the API surface familiar to infrastructure engineers coming from
// Terraform or the GCP console. All fields are optional -- GCP provides
// sensible defaults for a basic cluster when fields are omitted.
message GcpDataprocClusterConfig {
  // Cloud Storage bucket for staging job dependencies, jar files, and
  // other temporary data. If not specified, GCP auto-creates a staging
  // bucket in the cluster's project and region.
  dev.planton.shared.foreignkey.v1.StringValueOrRef staging_bucket = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpGcsBucket,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.bucket_id"
  ];

  // Cloud Storage bucket for ephemeral cluster data (shuffle, spill).
  // If not specified, GCP auto-creates a temp bucket.
  dev.planton.shared.foreignkey.v1.StringValueOrRef temp_bucket = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpGcsBucket,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.bucket_id"
  ];

  // Cluster tier controlling the Dataproc feature set and SLA.
  // CLUSTER_TIER_STANDARD: the default tier.
  // CLUSTER_TIER_PREMIUM: premium features (e.g. advanced repair and
  // faster scaling). Immutable after creation.
  string cluster_tier = 3 [(buf.validate.field).cel = {
    id: "cluster_tier_valid_value"
    expression: "this == '' || this in ['CLUSTER_TIER_STANDARD', 'CLUSTER_TIER_PREMIUM']"
    message: "cluster_tier must be CLUSTER_TIER_STANDARD or CLUSTER_TIER_PREMIUM"
  }];

  // Compute Engine configuration for the cluster's nodes (networking,
  // service account, zone, tags, metadata, hardening, placement).
  GcpDataprocClusterGceConfig gce_config = 4;

  // Master node configuration. If not specified, GCP defaults to
  // 1 master with a default machine type and 500 GB pd-standard disk.
  GcpDataprocClusterMasterConfig master_config = 5;

  // Primary worker node configuration. If not specified, GCP defaults
  // to 2 workers. For a single-node cluster set the software property
  // "dataproc:dataproc.allow.zero.workers" = "true" instead of a
  // worker count of zero.
  GcpDataprocClusterWorkerConfig worker_config = 6;

  // Secondary (preemptible/spot) worker node configuration.
  // If not specified, no secondary workers are created.
  GcpDataprocClusterSecondaryWorkerConfig secondary_worker_config = 7;

  // Software configuration including Dataproc image version, optional
  // components, and framework property overrides.
  GcpDataprocClusterSoftwareConfig software_config = 8;

  // Initialization actions (startup scripts) that run on all nodes
  // when the cluster is created.
  repeated GcpDataprocClusterInitAction initialization_actions = 9;

  // Autoscaling policy that governs worker scaling for this cluster.
  // Resolves to the policy's full resource name
  // (projects/{project}/locations/{location}/autoscalingPolicies/{policy}).
  // Attaching, swapping, or detaching the policy updates in place.
  dev.planton.shared.foreignkey.v1.StringValueOrRef autoscaling_policy_uri = 10 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpDataprocAutoscalingPolicy,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.name"
  ];

  // Cloud KMS key for encrypting persistent disks attached to cluster
  // nodes (CMEK). Format: projects/{project}/locations/{location}/keyRings/{keyRing}/cryptoKeys/{key}
  // If not specified, disks are encrypted with Google-managed keys.
  dev.planton.shared.foreignkey.v1.StringValueOrRef encryption_kms_key_name = 11 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpKmsKey,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.key_id"
  ];

  // In-cluster authentication hardening: Kerberos or personal-cluster
  // identity mapping.
  GcpDataprocClusterSecurityConfig security_config = 12;

  // Component Gateway configuration for authenticated web UI access.
  GcpDataprocClusterEndpointConfig endpoint_config = 13;

  // Lifecycle configuration for automatic cluster deletion.
  // Critical for cost management of ephemeral batch processing clusters.
  GcpDataprocClusterLifecycleConfig lifecycle_config = 14;

  // Attach the cluster to a persistent Dataproc Metastore service.
  GcpDataprocClusterMetastoreConfig metastore_config = 15;

  // OSS metric collection into Cloud Monitoring.
  GcpDataprocClusterMetricConfig dataproc_metric_config = 16;

  // Dedicated DRIVER node groups, separating Spark driver capacity
  // from the master's control-plane duties.
  repeated GcpDataprocClusterAuxiliaryNodeGroup auxiliary_node_groups = 17;

  // The cluster's structural type. STANDARD (default) has masters and
  // workers; SINGLE_NODE runs everything on one VM (the modern
  // alternative to the "dataproc:dataproc.allow.zero.workers" property);
  // ZERO_SCALE keeps only the control plane warm and provisions workers
  // on demand. Immutable after creation.
  string cluster_type = 18 [(buf.validate.field).cel = {
    id: "cluster_type_valid_value"
    expression: "this == '' || this in ['STANDARD', 'SINGLE_NODE', 'ZERO_SCALE']"
    message: "cluster_type must be STANDARD, SINGLE_NODE, or ZERO_SCALE"
  }];

  // The execution engine. DEFAULT runs open-source Spark as-is;
  // LIGHTNING enables the Lightning Engine (Google's accelerated Spark
  // runtime, premium tier). Immutable after creation.
  string engine = 19 [(buf.validate.field).cel = {
    id: "engine_valid_value"
    expression: "this == '' || this in ['DEFAULT', 'LIGHTNING']"
    message: "engine must be DEFAULT or LIGHTNING"
  }];
}

// GcpDataprocClusterKubernetesSoftwareConfig pins the Dataproc-on-GKE
// component versions and framework properties.
message GcpDataprocClusterKubernetesSoftwareConfig {
  // Component-to-version map. The SPARK component is required, e.g.
  // {"SPARK": "3.5-dataproc-17"}.
  // See https://cloud.google.com/dataproc/docs/guides/dpgke/dataproc-gke-version-compatibility
  map<string, string> component_version = 1 [(buf.validate.field).map.min_pairs = 1];

  // Framework properties (e.g. "spark:spark.eventLog.enabled" = "true").
  map<string, string> properties = 2;
}

// GcpDataprocClusterNodePoolAutoscaling bounds GKE node-pool autoscaling
// for a Dataproc-managed node pool.
message GcpDataprocClusterNodePoolAutoscaling {
  // Minimum number of nodes per zone. May be 0 for scale-to-zero pools.
  int32 min_node_count = 1 [(buf.validate.field).int32.gte = 0];

  // Maximum number of nodes per zone.
  int32 max_node_count = 2 [(buf.validate.field).int32.gte = 0];

  option (buf.validate.message).cel = {
    id: "max_gte_min_node_count"
    expression: "this.max_node_count >= this.min_node_count"
    message: "max_node_count must be greater than or equal to min_node_count"
  };
}

// GcpDataprocClusterNodePoolConfig sizes a node pool that Dataproc
// creates on the target GKE cluster when the referenced pool does not
// already exist. Ignored when the pool exists (existing pools are
// adopted as-is).
message GcpDataprocClusterNodePoolConfig {
  // Compute Engine zones where the pool's nodes are placed
  // (e.g. ["us-central1-a"]). Required when Dataproc creates the pool.
  repeated string locations = 1 [(buf.validate.field).repeated.min_items = 1];

  // GKE autoscaling bounds for the pool.
  GcpDataprocClusterNodePoolAutoscaling autoscaling = 2;

  // Compute Engine machine type for the pool's nodes.
  string machine_type = 3;

  // Number of local SSDs attached to each node.
  int32 local_ssd_count = 4 [(buf.validate.field).int32.gte = 0];

  // Minimum CPU platform for the pool's nodes.
  string min_cpu_platform = 5;

  // Use legacy preemptible VMs for the pool. Mutually exclusive with spot.
  bool preemptible = 6;

  // Use modern spot VMs for the pool (recommended over preemptible).
  bool spot = 7;

  option (buf.validate.message).cel = {
    id: "preemptible_spot_mutual_exclusion"
    expression: "!(this.preemptible && this.spot)"
    message: "preemptible and spot are mutually exclusive"
  };
}

// GcpDataprocClusterNodePoolTarget maps a GKE node pool to the Dataproc
// roles it hosts.
message GcpDataprocClusterNodePoolTarget {
  // The target GKE node pool. Resolves to the pool's fully qualified
  // resource name
  // (projects/{project}/locations/{location}/clusters/{cluster}/nodePools/{pool}).
  // The pool may pre-exist (composed via GcpGkeNodePool) or be created
  // by Dataproc using node_pool_config.
  dev.planton.shared.foreignkey.v1.StringValueOrRef node_pool = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpGkeNodePool,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.node_pool_id"
  ];

  // Dataproc roles scheduled onto this pool.
  // DEFAULT: catch-all for roles without a dedicated pool.
  // CONTROLLER: the Dataproc control plane pods.
  // SPARK_DRIVER: Spark driver pods.
  // SPARK_EXECUTOR: Spark executor pods.
  repeated string roles = 2 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items = {
      cel: {
        id: "node_pool_role_valid_value"
        expression: "this in ['DEFAULT', 'CONTROLLER', 'SPARK_DRIVER', 'SPARK_EXECUTOR']"
        message: "each role must be one of DEFAULT, CONTROLLER, SPARK_DRIVER, SPARK_EXECUTOR"
      }
    }
  ];

  // Sizing for the pool when Dataproc creates it. Ignored for
  // pre-existing pools.
  GcpDataprocClusterNodePoolConfig node_pool_config = 3;
}

// GcpDataprocClusterGkeClusterConfig binds the virtual cluster to its
// target GKE cluster and node pools.
message GcpDataprocClusterGkeClusterConfig {
  // The target GKE cluster. Resolves to the cluster's fully qualified
  // resource name (projects/{project}/locations/{location}/clusters/{cluster}).
  dev.planton.shared.foreignkey.v1.StringValueOrRef gke_cluster_target = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpGkeCluster,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.cluster_id"
  ];

  // Node pools Dataproc schedules roles onto. When omitted, Dataproc
  // creates and manages a default pool on the target cluster.
  repeated GcpDataprocClusterNodePoolTarget node_pool_target = 2;
}

// GcpDataprocClusterKubernetesClusterConfig configures the Kubernetes
// side of a Dataproc-on-GKE virtual cluster.
message GcpDataprocClusterKubernetesClusterConfig {
  // Kubernetes namespace Dataproc deploys workloads into. If unset,
  // Dataproc uses a namespace named after the virtual cluster.
  dev.planton.shared.foreignkey.v1.StringValueOrRef kubernetes_namespace = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = KubernetesNamespace,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "spec.name"
  ];

  // The target GKE cluster and node-pool role mapping.
  GcpDataprocClusterGkeClusterConfig gke_cluster_config = 2 [(buf.validate.field).required = true];

  // Component versions (SPARK is required) and framework properties.
  GcpDataprocClusterKubernetesSoftwareConfig kubernetes_software_config = 3 [(buf.validate.field).required = true];
}

// GcpDataprocClusterSparkHistoryServerConfig points the virtual cluster
// at a persistent Spark History Server running on another Dataproc
// cluster, so job history outlives the ephemeral workload cluster.
message GcpDataprocClusterSparkHistoryServerConfig {
  // The Dataproc cluster hosting the Spark History Server. Resolves to
  // the cluster's fully qualified resource name
  // (projects/{project}/regions/{region}/clusters/{cluster}).
  dev.planton.shared.foreignkey.v1.StringValueOrRef dataproc_cluster = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpDataprocCluster,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.cluster_id"
  ];
}

// GcpDataprocClusterAuxiliaryServicesConfig attaches shared, persistent
// services (Hive metastore, Spark History Server) to the virtual cluster.
message GcpDataprocClusterAuxiliaryServicesConfig {
  // Persistent Hive metastore for the virtual cluster's jobs.
  GcpDataprocClusterMetastoreConfig metastore_config = 1;

  // Persistent Spark History Server hosted on another Dataproc cluster.
  GcpDataprocClusterSparkHistoryServerConfig spark_history_server_config = 2;
}

// GcpDataprocClusterVirtualClusterConfig runs Dataproc on an existing
// GKE cluster (Dataproc-on-GKE) instead of dedicated Compute Engine
// VMs: Spark workloads run as Kubernetes pods, sharing the GKE
// cluster's capacity, autoscaling, and operational tooling.
//
// The entire virtual arm is immutable after creation — any change
// replaces the virtual cluster (the underlying GKE cluster and node
// pools are not touched by the replacement).
message GcpDataprocClusterVirtualClusterConfig {
  // Cloud Storage bucket for staging job dependencies. If not
  // specified, GCP auto-creates a staging bucket.
  dev.planton.shared.foreignkey.v1.StringValueOrRef staging_bucket = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpGcsBucket,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.bucket_id"
  ];

  // The Kubernetes-side configuration: target GKE cluster, node-pool
  // role mapping, namespace, and component versions.
  GcpDataprocClusterKubernetesClusterConfig kubernetes_cluster_config = 2 [(buf.validate.field).required = true];

  // Shared persistent services (metastore, Spark History Server).
  GcpDataprocClusterAuxiliaryServicesConfig auxiliary_services_config = 3;
}

// GcpDataprocClusterSpec defines the configuration for a Google Cloud
// Dataproc cluster running Apache Spark, Hadoop, and related
// open-source data processing frameworks.
//
// Dataproc offers two mutually exclusive deployment arms, mirroring the
// API's own shape:
//
//   - cluster_config: the standard arm — dedicated Compute Engine VMs
//     (master, workers, optional spot secondaries) fully managed by
//     Dataproc. When both arms are omitted, GCP creates a default
//     GCE-based cluster (2 workers, default machine types).
//
//   - virtual_cluster_config: the Dataproc-on-GKE arm — Spark workloads
//     run as pods on an existing GKE cluster, composing against
//     GcpGkeCluster and GcpGkeNodePool by reference.
//
// Important behavioral notes:
//
//   - The cluster_name and region fields are immutable after creation.
//     Changing them requires recreating the cluster.
//
//   - Most configuration is immutable after creation (recreate on
//     change). The in-place exceptions on the GCE arm: primary and
//     secondary worker counts (manual scaling), min_num_instances, the
//     autoscaling policy attachment, the lifecycle TTLs, and labels.
//     The virtual arm is fully immutable.
//
//   - User labels are applied to the cluster and propagate to its VMs.
//     The Dataproc API does not support user labels on virtual
//     (GKE-based) clusters — leave labels empty for the virtual arm.
message GcpDataprocClusterSpec {
  // GCP project where the Dataproc cluster will be created.
  // Can be a literal project ID or a reference to a GcpProject resource.
  // If omitted, the provider's default project is used.
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];

  // GCP region for the cluster (e.g., "us-central1", "europe-west12").
  // All cluster nodes will be placed in this region.
  // Immutable after creation.
  string region = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-z]+-[a-z]+[0-9]+$"
  ];

  // Name of the Dataproc cluster. Must start with a lowercase letter,
  // can contain lowercase letters, numbers, and hyphens, and must end
  // with a lowercase letter or number. Maximum 55 characters.
  // Immutable after creation.
  string cluster_name = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9-]{0,53}[a-z0-9]$",
    (buf.validate.field).string.min_len = 2,
    (buf.validate.field).string.max_len = 55
  ];

  // Standard (Compute Engine) cluster arm: nodes, software, networking,
  // encryption, security, and lifecycle. Mutually exclusive with
  // virtual_cluster_config.
  GcpDataprocClusterConfig cluster_config = 4;

  // Dataproc-on-GKE arm: run Spark as pods on an existing GKE cluster.
  // Mutually exclusive with cluster_config.
  GcpDataprocClusterVirtualClusterConfig virtual_cluster_config = 5;

  // Timeout for graceful YARN decommissioning when reducing the number
  // of workers. During this period, YARN waits for running tasks to
  // complete before shutting down nodes. Without this, scaling down
  // can terminate running jobs. Only meaningful for the GCE arm.
  // Format: duration in seconds with 's' suffix (e.g., "3600s").
  // Default: "0s" (immediate decommission).
  string graceful_decommission_timeout = 6 [(buf.validate.field).cel = {
    id: "graceful_decommission_timeout_format"
    expression: "this == '' || this.matches('^[0-9]+s$')"
    message: "graceful_decommission_timeout must be a duration in seconds (e.g., '3600s')"
  }];

  // User-defined labels applied to the cluster (and propagated to its
  // VMs). Merged beneath Planton's platform attribution labels
  // (platform keys win on conflict). Not supported by the API for the
  // virtual (GKE-based) arm.
  map<string, string> labels = 7;

  // Engine-side teardown behavior. "DELETE" (default) destroys the
  // cluster; "PREVENT" fails any plan that would destroy it; "ABANDON"
  // removes it from IaC management while leaving it running in GCP.
  string deletion_policy = 8 [(buf.validate.field).cel = {
    id: "valid_deletion_policy"
    expression: "this == '' || this in ['DELETE', 'PREVENT', 'ABANDON']"
    message: "deletion_policy must be one of: DELETE, PREVENT, ABANDON"
  }];

  // The two deployment arms mirror the API's exactly-one contract;
  // omitting both is also accepted (GCP creates a default GCE cluster).
  option (buf.validate.message).cel = {
    id: "at_most_one_deployment_arm"
    expression: "!(has(this.cluster_config) && has(this.virtual_cluster_config))"
    message: "cluster_config and virtual_cluster_config are mutually exclusive"
  };

  // The API rejects user labels on virtual clusters.
  option (buf.validate.message).cel = {
    id: "labels_unsupported_on_virtual_clusters"
    expression: "!has(this.virtual_cluster_config) || size(this.labels) == 0"
    message: "user labels are not supported on virtual (GKE-based) clusters"
  };
}
