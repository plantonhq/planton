apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpdataproccluster
spec:
  # Composed scenarios: each installs the VPC -> subnetwork chain plus an
  # autoscaling policy from the prerequisite graph, then creates the
  # cluster. A cluster create runs ~2-4 minutes (real VMs boot); destroy
  # ~1-2 minutes. Batch runs for both scenarios on both engines need
  # >=60m. The Dataproc-on-GKE arm is excluded from live runs: its chain
  # needs a ~20-minute GKE cluster with role-mapped node pools per
  # scenario-run — the arm is proven by the offline gate (spec tests +
  # both engines' converters exercised by the spark-on-gke preset).
  tier: 1
  # Live-proven 2026-08-13 on both engines at the total-accounting spec:
  # 2 scenarios (minimal-single-node: first-class clusterType SINGLE_NODE
  # + Component Gateway + deletionPolicy DELETE; autoscaling: policy FK +
  # primary-worker instance_flexibility_policy — the stored cluster's
  # instance_selection_results carried the ranked list's choice) x 2
  # engines, all phases green under the apply-idempotency gate. Scenarios
  # live in us-east1 after a us-central1 ZONE_RESOURCE_POOL_EXHAUSTED on
  # e2-standard-2 (Dataproc's auto-zone placement still chose the
  # exhausted zone — the recurring capacity class in e2e/README.md).
  # First contact also caught machine_type + instance_flexibility_policy
  # as API-mutually-exclusive (silent machineTypeUri drop -> perpetual
  # replacement re-plan) — now a spec CEL wall on master and worker.
  #
  # Awaiting re-proof: the cluster gained additional attached disks on every
  # node role (the autoscaling scenario attaches one 50 GB pd-standard per
  # worker), per-selection disk shapes inside the flexibility policy, and
  # confidential_instance_type; the earlier live proof predates them.
  # Confidential type needs N2D/C3 capacity and stays offline-proven; the next
  # proof confirms the attached disk provisions and re-plans clean.
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 60
