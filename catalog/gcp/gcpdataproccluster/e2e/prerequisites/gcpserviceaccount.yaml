# Consumer-scoped GcpServiceAccount install profile for the Dataproc
# cluster chain: the VM runtime identity, carrying its own additive
# dataproc.worker grant (hardened projects grant the default compute
# service account nothing, so Dataproc refuses to create clusters on
# it). The cloud-side account id carries ${E2E_RUN_ID}; metadata.name
# stays fixed for FK resolution.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpServiceAccount
metadata:
  name: planton-oss-e2e-gsa-prereq
  id: planton-oss-e2e-gsa-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpserviceaccount
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  serviceAccountId: e2e-dpc-sa-${E2E_RUN_ID}
  displayName: Planton OSS E2E Dataproc VM identity
  description: Ephemeral Dataproc VM identity deployed as an E2E prerequisite; safe to delete
  projectIamRoles:
    - roles/dataproc.worker
