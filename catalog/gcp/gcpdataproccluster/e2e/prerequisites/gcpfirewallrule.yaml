# Consumer-scoped GcpFirewallRule install profile for the Dataproc
# cluster chain: custom VPCs have no default firewall rules, and
# multi-node clusters refuse to start when VM-to-VM traffic is blocked
# ("Cannot start master: timed out waiting for nodes"). This allows all
# intra-subnet traffic — exactly the connectivity Dataproc requires
# between its master and workers.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpFirewallRule
metadata:
  name: planton-oss-e2e-gcpfwr-prereq
  id: planton-oss-e2e-gcpfwr-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpfirewallrule
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  network:
    valueFrom:
      kind: GcpVpcNetwork
      name: planton-oss-e2e-gcpvpcnetwork-prereq
      fieldPath: status.outputs.network_self_link
  ruleName: e2e-dpc-allow-internal-${E2E_RUN_ID}
  direction: INGRESS
  action: ALLOW
  rules:
    - protocol: all
  sourceRanges:
    - 10.10.1.0/24
