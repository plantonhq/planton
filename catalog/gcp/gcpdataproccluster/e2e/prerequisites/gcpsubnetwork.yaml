# Consumer-scoped GcpSubnetwork install profile for the Dataproc cluster
# chain: the address space the cluster's VMs live in. A regular /24 —
# nodes keep external IPs in the E2E scenarios, so no Private Google
# Access is needed.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpSubnetwork
metadata:
  name: planton-oss-e2e-gcpsnw-dpc-prereq
  id: planton-oss-e2e-gcpsnw-dpc-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpsubnetwork
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  vpcSelfLink:
    valueFrom:
      kind: GcpVpcNetwork
      name: planton-oss-e2e-gcpvpcnetwork-prereq
      fieldPath: status.outputs.network_self_link
  subnetworkName: e2e-dpc-subnet-${E2E_RUN_ID}
  # Region-matched to the cluster scenarios (us-east1 since the
  # 2026-08-12 us-central1 stockout relocation).
  region: us-east1
  ipCidrRange: 10.10.1.0/24
  description: Ephemeral /24 for the GcpDataprocCluster E2E chain; safe to delete
