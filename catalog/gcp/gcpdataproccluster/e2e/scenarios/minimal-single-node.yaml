# GcpDataprocCluster scenario: a single-node cluster (the sandbox shape —
# master only, declared through the first-class clusterType: SINGLE_NODE
# selector rather than the legacy allow.zero.workers property) on the
# prerequisite subnetwork. project_id is deliberately omitted (ambient
# project). The cloud-side cluster name carries ${E2E_RUN_ID}; nodes keep
# external IPs so the subnetwork needs no Private Google Access.
# Component Gateway is on — its endpoints are part of the posture the
# verifier can rely on being assembled. The explicit DELETE teardown
# policy must be a no-op against the provider default on re-plan.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpDataprocCluster
metadata:
  name: planton-oss-e2e-gcpdpc-smoke
  id: planton-oss-e2e-gcpdpc-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpdataproccluster
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  # us-east1 with the whole Dataproc chain (2026-08-12 us-central1
  # ZONE_RESOURCE_POOL_EXHAUSTED on e2-standard-2 — Dataproc's auto-zone
  # placement still chose the exhausted us-central1-a).
  region: us-east1
  clusterName: e2e-dpc-${E2E_RUN_ID}
  labels:
    team: data-platform
  deletionPolicy: DELETE
  clusterConfig:
    clusterType: SINGLE_NODE
    gceConfig:
      subnetwork:
        valueFrom:
          kind: GcpSubnetwork
          name: planton-oss-e2e-gcpsnw-dpc-prereq
          fieldPath: status.outputs.subnetwork_self_link
      # The prerequisite VM identity carries its own dataproc.worker
      # grant — hardened projects grant the default compute service
      # account nothing.
      serviceAccount:
        valueFrom:
          kind: GcpServiceAccount
          name: planton-oss-e2e-gsa-prereq
          fieldPath: status.outputs.email
    masterConfig:
      numInstances: 1
      machineType: e2-standard-2
      diskConfig:
        bootDiskSizeGb: 50
        bootDiskType: pd-balanced
    endpointConfig:
      enableHttpPortAccess: true
    lifecycleConfig:
      idleDeleteTtl: 3600s
