# The second act of minimal-single-node.yaml: the same single-node cluster
# with its team label changed from data-platform to data-engineering -- a
# clusters.patch of the labels that updates it in place (its name, region
# and most of its cluster config recreate it). Not a scenario of its own (the
# second-act annotation keeps discovery from running it as a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpDataprocCluster
metadata:
  name: planton-oss-e2e-gcpdpc-smoke
  id: planton-oss-e2e-gcpdpc-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpdataproccluster
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-exclusive: gcp-project-vcpus # the lane project holds few vCPUs across all regions (read CPUS_ALL_REGIONS live), so VM-running kinds never run side by side
    planton.dev/e2e-second-act: minimal-single-node.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
  tags:
    - planton-e2e
spec:
  # us-east1 with the whole Dataproc chain (2026-08-12 us-central1
  # ZONE_RESOURCE_POOL_EXHAUSTED on e2-standard-2 — Dataproc's auto-zone
  # placement still chose the exhausted us-central1-a).
  region: us-east1
  clusterName: e2e-dpc-${E2E_RUN_ID}
  labels:
    team: data-engineering
  deletionPolicy: DELETE
  clusterConfig:
    clusterType: SINGLE_NODE
    gceConfig:
      subnetwork:
        valueFrom:
          kind: GcpSubnetwork
          name: planton-oss-e2e-gcpsnw-dpc-prereq
          fieldPath: status.outputs.subnetwork_self_link
      # The prerequisite VM identity carries its own dataproc.worker
      # grant — hardened projects grant the default compute service
      # account nothing.
      serviceAccount:
        valueFrom:
          kind: GcpServiceAccount
          name: planton-oss-e2e-gsa-prereq
          fieldPath: status.outputs.email
    masterConfig:
      numInstances: 1
      machineType: e2-standard-2
      diskConfig:
        bootDiskSizeGb: 50
        bootDiskType: pd-balanced
    endpointConfig:
      enableHttpPortAccess: true
    lifecycleConfig:
      idleDeleteTtl: 3600s
