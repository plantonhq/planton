# GcpDataprocCluster scenario: a standard cluster (1 master + 2 primary
# workers) attached to the prerequisite autoscaling policy — the live
# proof of the policy FK resolving to the full resource name the API
# requires. project_id is deliberately omitted (ambient project); the
# cloud-side cluster name carries ${E2E_RUN_ID}.
# Also proves primary-worker instance flexibility live: a ranked
# machine-type fallback list (the scenario's own type first) that must
# apply cleanly and leave re-plans diff-free.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpDataprocCluster
metadata:
  name: planton-oss-e2e-gcpdpc-autoscaling
  id: planton-oss-e2e-gcpdpc-autoscaling
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpdataproccluster
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  # us-east1 with the whole Dataproc chain (2026-08-12 us-central1
  # ZONE_RESOURCE_POOL_EXHAUSTED on e2-standard-2 across master and
  # both primary workers).
  region: us-east1
  clusterName: e2e-dpc-as-${E2E_RUN_ID}
  clusterConfig:
    gceConfig:
      subnetwork:
        valueFrom:
          kind: GcpSubnetwork
          name: planton-oss-e2e-gcpsnw-dpc-prereq
          fieldPath: status.outputs.subnetwork_self_link
      # The prerequisite VM identity carries its own dataproc.worker
      # grant — hardened projects grant the default compute service
      # account nothing.
      serviceAccount:
        valueFrom:
          kind: GcpServiceAccount
          name: planton-oss-e2e-gsa-prereq
          fieldPath: status.outputs.email
    masterConfig:
      numInstances: 1
      machineType: e2-standard-2
      diskConfig:
        bootDiskSizeGb: 50
        bootDiskType: pd-balanced
    workerConfig:
      numInstances: 2
      # No machineType here: the flexibility policy REPLACES it (the API
      # drops a paired machineTypeUri from the stored config, which
      # re-plans as cluster replacement — CEL-enforced exclusivity,
      # live-caught 2026-08-12).
      diskConfig:
        bootDiskSizeGb: 50
        bootDiskType: pd-balanced
        # One additional persistent disk on every worker (the cheapest
        # class); proves the attached-disk list round-trips.
        attachedDisks:
          - diskSizeGb: 50
            diskType: pd-standard
      instanceFlexibilityPolicy:
        instanceSelectionList:
          - machineTypes:
              - e2-standard-2
              - n2-standard-2
            rank: 1
    autoscalingPolicyUri:
      valueFrom:
        kind: GcpDataprocAutoscalingPolicy
        name: planton-oss-e2e-gcpdpasp-prereq
        fieldPath: status.outputs.name
    lifecycleConfig:
      idleDeleteTtl: 3600s
