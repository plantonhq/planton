# Workflow-destination GcpEventarcTrigger scenario: the workflow arm —
# the workflow fixture deploys first (scenario-level prerequisites
# annotation; GcpWorkflow is NOT a registry prerequisite of this kind)
# and the destination resolves from its workflow_id output. Also
# exercises trigger labels. The trigger identity is the SA fixture: a
# workflow destination REQUIRES a service account (API-enforced at
# create — live-verified), holding eventarc.eventReceiver +
# workflows.invoker. No eventDataContentType: Pub/Sub triggers reject
# any value there (live-verified API truth, spec-enforced).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpEventarcTrigger
metadata:
  name: planton-oss-e2e-gcpevtrg-workflow
  id: planton-oss-e2e-gcpevtrg-workflow
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpeventarctrigger
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "GcpWorkflow, GcpServiceAccount"
  tags:
    - planton-e2e
spec:
  location: us-central1
  matchingCriteria:
    - attribute: type
      value: google.cloud.pubsub.topic.v1.messagePublished
  destination:
    workflow:
      valueFrom:
        kind: GcpWorkflow
        name: planton-oss-e2e-gcpwflow-prereq
        fieldPath: status.outputs.workflow_id
  serviceAccount:
    valueFrom:
      kind: GcpServiceAccount
      name: planton-oss-e2e-gcpevtrg-sa-prereq
      fieldPath: status.outputs.email
  labels:
    e2e-suite: gcp
  deletionPolicy: DELETE
