# Consumer-scoped GcpServiceAccount install profile for the trigger
# kind's workflow-destination lanes: the trigger identity. A workflow
# destination REQUIRES a service account (API-enforced at create:
# 400 "trigger.service_account is empty" — live-verified), and the
# account needs eventarc.eventReceiver to receive events plus
# workflows.invoker to mint the workflow executions. The cloud-side
# account id carries ${E2E_RUN_ID}; metadata.name stays fixed for FK
# resolution.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpServiceAccount
metadata:
  name: planton-oss-e2e-gcpevtrg-sa-prereq
  id: planton-oss-e2e-gcpevtrg-sa-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpeventarctrigger
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  serviceAccountId: e2e-evtrg-sa-${E2E_RUN_ID}
  displayName: Planton OSS E2E Eventarc trigger identity
  description: Ephemeral Eventarc trigger identity deployed as an E2E prerequisite; safe to delete
  projectIamRoles:
    - roles/eventarc.eventReceiver
    - roles/workflows.invoker
