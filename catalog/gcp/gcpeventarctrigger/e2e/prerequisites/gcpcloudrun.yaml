# Cloud Run fixture the trigger kind's lanes deploy first — a minimal
# private hello service the canonical trigger delivers to. Owned by THIS
# kind's folder (consumer-side prerequisite override) so the fixture
# rides the trigger's lanes without touching the GcpCloudRun folder.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudRun
metadata:
  name: planton-oss-e2e-gcprun-prereq
  id: planton-oss-e2e-gcprun-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpeventarctrigger
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  region: us-central1
  containers:
    - image: us-docker.pkg.dev/cloudrun/container/hello:latest
      ports:
        containerPort: 8080
      resources:
        cpu: "1"
        memory: 512Mi
  scaling:
    minInstanceCount: 0
    maxInstanceCount: 1
  ingress: INGRESS_TRAFFIC_ALL
  executionEnvironment: EXECUTION_ENVIRONMENT_GEN2
  deletionProtection: false
  deletionPolicy: DELETE
