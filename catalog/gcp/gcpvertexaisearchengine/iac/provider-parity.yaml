# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.
#
# One kind, three engine resources: engine_type selects which of the search,
# chat, and recommendation engines the modules build. The spec keeps the
# provider's own block names at its top level, so the arm-only blocks match
# by name on their own resource.

resources:
  google_discovery_engine_search_engine:
    mappings:
      - spec: spec.project_id
        arg: project
  google_discovery_engine_chat_engine:
    mappings:
      - spec: spec.project_id
        arg: project
  google_discovery_engine_recommendation_engine:
    mappings:
      - spec: spec.project_id
        arg: project
  # Controls are folded: they belong to one engine, nothing else references
  # one, and they share the engine's lifecycle. Every control carries the
  # solution type the engine arm hard-codes, so the spec derives it from
  # engine_type instead of asking twice.
  google_discovery_engine_control:
    specRoot: spec.controls
    mappings:
      - spec: spec.project_id
        arg: project
      - spec: spec.location
        arg: location
      - spec: spec.collection_id
        arg: collection_id
      - spec: spec.engine_id
        arg: engine_id
      - spec: spec.engine_type
        arg: solution_type
      - spec: spec.deletion_policy
        arg: deletion_policy
      # The provider's block is singular (active_time_range, a list); the
      # spec names the list for what it is.
      - spec: spec.controls.conditions.active_time_ranges.start_time
        arg: conditions.active_time_range.start_time
      - spec: spec.controls.conditions.active_time_ranges.end_time
        arg: conditions.active_time_range.end_time
  # The serving config is folded: the provider's create is a PATCH on the
  # engine's own default serving config and its delete a no-op, so it
  # configures the engine rather than owning a resource.
  google_discovery_engine_serving_config:
    specRoot: spec.serving_config
    mappings:
      - spec: spec.project_id
        arg: project
      - spec: spec.location
        arg: location
      - spec: spec.collection_id
        arg: collection_id
      - spec: spec.engine_id
        arg: engine_id
    exclusions:
      - arg: serving_config_id
        reason: >-
          the provider accepts only its default ("The unique ID of the
          serving config. Currently only accepts 'default_search'"), so the
          module leaves the argument to that default and the spec offers no
          lever that could only ever hold one value
  # The widget config is folded: a PATCH on the engine's default widget
  # config, which Google never deletes.
  google_discovery_engine_widget_config:
    specRoot: spec.widget_config
    mappings:
      - spec: spec.project_id
        arg: project
      - spec: spec.location
        arg: location
      - spec: spec.collection_id
        arg: collection_id
      - spec: spec.engine_id
        arg: engine_id
      # Single-leaf wrapper blocks (icon { url }, logo { url }) are lifted
      # to one field each.
      - spec: spec.widget_config.homepage_setting.shortcuts.icon_url
        arg: homepage_setting.shortcuts.icon.url
      - spec: spec.widget_config.ui_branding.logo_url
        arg: ui_branding.logo.url
      # The provider's block is singular (facet_field, a list); the spec
      # names the list for what it is.
      - spec: spec.widget_config.ui_settings.data_store_ui_configs.facet_fields.field
        arg: ui_settings.data_store_ui_configs.facet_field.field
      - spec: spec.widget_config.ui_settings.data_store_ui_configs.facet_fields.display_name
        arg: ui_settings.data_store_ui_configs.facet_field.display_name
    exclusions:
      - arg: widget_config_id
        reason: >-
          the provider accepts only its default ("The unique ID to use for
          the WidgetConfig. Currently only accepts
          'default_search_widget_config'"), so the module leaves the
          argument to that default
  # Assistants are folded: they live under one engine and nothing else
  # references them.
  google_discovery_engine_assistant:
    specRoot: spec.assistants
    mappings:
      - spec: spec.project_id
        arg: project
      - spec: spec.location
        arg: location
      - spec: spec.collection_id
        arg: collection_id
      - spec: spec.engine_id
        arg: engine_id
      - spec: spec.deletion_policy
        arg: deletion_policy
      # The single-leaf system_instruction wrapper is lifted to one field.
      - spec: spec.assistants.generation_config.additional_system_instruction
        arg: generation_config.system_instruction.additional_system_instruction
  google_project_service:
    internal: >-
      API enablement plumbing -- the module enables the owning API (and the
      Dialogflow API on the chat arm) so a fresh project works on the first
      deploy; not a knob of the kind.
