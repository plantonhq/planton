apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpvertexaisearchengine
spec:
  # Proven live on both engines (2026-11-19): a search engine, a search engine
  # with all five control actions wired through its serving config and the
  # widget configured, a chat engine creating its Dialogflow agent, and a
  # generic recommendation engine, each deployed, updated in place and
  # destroyed by an identity holding only this kind's permissions manifest,
  # with the re-plan clean. Google often refuses a fresh store's filter or
  # boost control for about a minute, so that scenario re-applies once
  # (e2e-deploy-retry); the Dialogflow agent a chat engine creates outlives it
  # and the lane releases it. Assistants, CMEK and the Enterprise tier stay
  # offline-only.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 60
