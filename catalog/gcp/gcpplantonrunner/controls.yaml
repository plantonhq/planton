# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: gcpplantonrunner
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The appliance's stored state is the runner token in Secret Manager and the operation logs in Cloud Logging -- both services encrypt at rest with Google-managed keys unconditionally.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: Neither the spec nor the modules expose a customer-managed key seam -- the token secret is created without a CMEK argument, so Google-managed keys are the only option this kind offers.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every connection is outbound and TLS -- the token secret resolves through Secret Manager's TLS-only endpoint at instance start, image pulls and log delivery ride Google's TLS-only APIs, and the runner's own channels to the control plane (queue polling, the outbound-initiated CloudOps tunnel) are TLS-carried by the platform. The service's inbound edge is Cloud Run's TLS terminator, and no caller is authorized to reach past it (see no-public-access).
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The modules grant no run.invoker on the service -- Cloud Run's default authenticated-only posture therefore refuses every caller, so nothing can invoke the runner from anywhere. The spec's own design states the posture -- zero inbound exposure; the runner only ever dials out.
      notes: The API-required ingress setting is INGRESS_TRAFFIC_ALL, but with no invoker grants nothing meaningful is reachable either way -- IAM refuses the request before it reaches the container.
    - control_id: restricted-ingress
      status: enforced_by_default
      evidence:
        type: module_default
        reference: With zero run.invoker grants, the service admits no callers whatsoever -- the strictest possible ingress restriction, stronger than any declared allow-list.
    - control_id: edge-protection
      status: not_applicable
      notes: No inbound request surface exists to filter -- no caller is authorized to invoke the service (see no-public-access), so a web application firewall has nothing to sit in front of.
    - control_id: rbac
      status: not_applicable
      notes: The appliance exposes no management or data plane of its own inside GCP -- work arrives through the Planton control plane, where runner registration and operation dispatch are governed by the platform's own access control, outside this manifest's choices.
    - control_id: workload-identity
      status: enforced_by_default
      evidence:
        type: module_default
        reference: The runner always runs as a dedicated service account -- the referenced service_account when supplied, else a permissionless account the modules create so the identity seam always exists. It is deliberately never the project's Compute Engine default service account, which typically carries broad project access the runner should not inherit. Cloud operations authenticate through the account's short-lived platform credentials; no static keys are injected anywhere in the service definition.
      notes: service_account composes the actual grants -- reference a GcpServiceAccount carrying exactly what keyless operations need; permissions can be granted later without replacing the runner. Either way the modules grant that account read access to the runner's own token secret, nothing else.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No legacy authentication path exists to disable -- the runner introduces itself to the control plane by joining with its runner token (delivered through Secret Manager, never in launch configuration) and serving on the identity it receives, and its GCP access is IAM-based through its service account.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Cloud Run streams the container's stdout and stderr to Cloud Logging unconditionally for every service -- the runner logs every operation it executes, and there is no off switch.
      notes: Retention follows the Cloud Logging bucket configuration of the project, owned outside this spec.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Cloud Run publishes service and instance metrics (CPU and memory utilization, instance count) to Cloud Monitoring automatically for every service -- no opt-in exists on the modules' resources.
    - control_id: backup-recovery
      status: not_applicable
      notes: The appliance is stateless by design -- the runner token is re-mintable material, and everything else is declarative and re-creatable from the manifest. Operation logs are the audit trail, governed by Cloud Logging retention, not backup.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Cloud Run is a regional service -- Google places and reschedules instances across the region's zones with no customer surface, so a zonal event means the single instance restarts in a surviving zone.
      notes: This is rescheduling, not replication -- the modules fix the instance count at one (a runner's identity is minted for one live instance; the registration's work queue serializes operations), so a zonal event means a restart, not a failover to a live replica.
    - control_id: deletion-protection
      status: not_applicable
      notes: The modules set deletion_protection to false deliberately -- orderly teardown is part of the appliance's contract (the runner is destroyed last, after the workloads it deploys), and the token makes it re-mintable standing infrastructure; the provider's default protection would turn every teardown into a two-step dance for no protective gain.
    - control_id: managed-patching
      status: configurable
      field_path: runner_version
      evidence:
        type: spec_default
        reference: Defaults to "latest" -- new instances pull the newest runner release on every (re)start, so the appliance tracks the patched build by default; pinning a version tag takes the patch cadence into your own hands for change control.
      notes: The compute layer beneath the instance is Cloud Run -- Google patches the hosts and container runtime with no customer surface. A pinned runner is patched by bumping the tag.
