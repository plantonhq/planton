# The second act of minimal.yaml: the same runner with more memory, a new
# revision of the same Cloud Run service (updated in place; the region and
# the name recreate it). The new revision joins the control plane again
# before it serves, so the update proves the join too. Not a scenario of its
# own (the second-act annotation keeps discovery from running it as a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpPlantonRunner
metadata:
  name: planton-oss-e2e-gcp-runner
  id: planton-oss-e2e-gcp-runner
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpplantonrunner
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-second-act: minimal.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
    planton.dev/e2e-required-env: PLANTON_E2E_RUNNER_TOKEN,PLANTON_E2E_RUNNER_ENDPOINT,PLANTON_E2E_RUNNER_VERSION
  tags:
    - planton-e2e
spec:
  region: us-central1
  token: ${E2E_ENV:PLANTON_E2E_RUNNER_TOKEN}
  controlPlaneEndpoint: ${E2E_ENV:PLANTON_E2E_RUNNER_ENDPOINT}
  runnerVersion: ${E2E_ENV:PLANTON_E2E_RUNNER_VERSION}
  memory: 1Gi
