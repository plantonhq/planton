syntax = "proto3";

package dev.planton.gcp.gcpnetworkendpointgroup.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpnetworkendpointgroup/v1alpha1/outputs.proto";
import "catalog/gcp/gcpnetworkendpointgroup/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-network-endpoint-group
message GcpNetworkEndpointGroup {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpNetworkEndpointGroup'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpNetworkEndpointGroupSpec spec = 4 [(buf.validate.field).required = true];
  GcpNetworkEndpointGroupStatus status = 5;
}

message GcpNetworkEndpointGroupStatus {
  GcpNetworkEndpointGroupStackOutputs outputs = 1;
}
