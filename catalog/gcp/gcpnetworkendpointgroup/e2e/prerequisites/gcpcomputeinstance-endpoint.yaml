# Extra-instance GcpComputeInstance fixture: the VM the zonal group's
# endpoint names. Private placement on the subnet fixture, no external IP,
# Spot so the minutes it lives cost cents.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpComputeInstance
metadata:
  name: planton-oss-e2e-gcpneg-vm
  id: planton-oss-e2e-gcpneg-vm
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpnetworkendpointgroup
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  zone: us-central1-a
  machineType: e2-micro
  bootDisk:
    image: debian-cloud/debian-12
    sizeGb: 10
    type: pd-balanced
    guestOsFeatures:
      - UEFI_COMPATIBLE
      - VIRTIO_SCSI_MULTIQUEUE
      - GVNIC
      - SEV_CAPABLE
      - SEV_LIVE_MIGRATABLE_V2
  networkInterfaces:
    - subnetwork:
        valueFrom:
          kind: GcpSubnetwork
          name: planton-oss-e2e-gcpneg-subnet
          fieldPath: status.outputs.subnetwork_self_link
  scheduling:
    provisioningModel: SPOT
    onHostMaintenance: TERMINATE
    instanceTerminationAction: DELETE
  shieldedInstanceConfig:
    enableSecureBoot: true
  deletionPolicy: DELETE
