# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpvertexaisearchdatastore
spec:
  gcp:
    groups:
      - purpose: EnableDiscoveryEngineApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
          - resourcemanager.projects.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_project_service enabling discoveryengine.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed. The provider reads the project with resourcemanager.projects.get before its services on every refresh, so a re-plan or destroy needs it (measured live). Proven 2026-11-19 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
      - purpose: ManageDataStore
        permissions:
          - discoveryengine.dataStores.create
          - discoveryengine.dataStores.get
          - discoveryengine.dataStores.update
          - discoveryengine.dataStores.delete
          - discoveryengine.operations.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_discovery_engine_data_store (Pulumi discoveryengine.DataStore) -- create, read/refresh, the in-place PATCHes (display_name, kms_key_name), destroy under deletion_policy DELETE (ABANDON and PREVENT call no API), and the long-running operations the provider polls. Proven 2026-11-19 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
      - purpose: ManageSchema
        permissions:
          - discoveryengine.schemas.create
          - discoveryengine.schemas.get
          - discoveryengine.schemas.delete
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_discovery_engine_schema (Pulumi discoveryengine.Schema) when spec.schema is declared -- create, read/refresh, destroy; every field is immutable, so there is no update. Proven 2026-11-19 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
      - purpose: ManageTargetSites
        permissions:
          - discoveryengine.targetSites.create
          - discoveryengine.targetSites.get
          - discoveryengine.targetSites.delete
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_discovery_engine_target_site (Pulumi discoveryengine.TargetSite), one per spec.target_sites[] entry on a website store -- create, read/refresh, destroy; every field is immutable. Proven 2026-11-19 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
      - purpose: ManageSitemaps
        permissions:
          - discoveryengine.sitemaps.create
          - discoveryengine.sitemaps.fetch
          - discoveryengine.sitemaps.delete
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_discovery_engine_sitemap (Pulumi discoveryengine.Sitemap), one per spec.sitemap_uris[] entry on an advanced site search store -- create, read/refresh (the sitemaps.fetch method; GCP defines no sitemaps.get), destroy. Proven 2026-11-19 -- an identity holding only this manifest deployed, updated and destroyed the kind on both engines.
