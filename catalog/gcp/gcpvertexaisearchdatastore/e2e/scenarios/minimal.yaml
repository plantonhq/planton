# GcpVertexAiSearchDataStore scenario: a structured (NO_CONTENT) store in
# the global location enrolled in search -- the shape Google's own provider
# test deploys. project_id is deliberately omitted: the store rides the
# provider's default project, which the harness exports as GOOGLE_PROJECT.
# The store id carries ${E2E_RUN_ID} because Google reserves a deleted
# store's id for a while; metadata.name stays fixed.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVertexAiSearchDataStore
metadata:
  name: planton-oss-e2e-gcpvsds-minimal
  id: planton-oss-e2e-gcpvsds-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpvertexaisearchdatastore
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  location: global
  dataStoreId: planton-oss-e2e-vsds-minimal-${E2E_RUN_ID}
  industryVertical: GENERIC
  contentConfig: NO_CONTENT
  solutionTypes:
    - SOLUTION_TYPE_SEARCH
