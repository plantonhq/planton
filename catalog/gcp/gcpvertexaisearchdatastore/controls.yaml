# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpvertexaisearchdatastore
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Vertex AI Search encrypts every data store's documents and index at rest with Google-managed keys without configuration.
    - control_id: enc-at-rest-cmk
      status: configurable
      field_path: kms_key_name
      evidence:
        type: spec_default
        reference: Unset means Google-managed encryption; a Cloud KMS key in the store's location (a multi-region key for global, us, or eu) encrypts the store under the customer-managed key. Updatable.
      notes: The 03-documents-rag preset references a GcpKmsKey. The Discovery Engine service agent needs encrypt/decrypt on the key as a prerequisite, and the location needs a CMEK registration (google_discovery_engine_cmek_config, a candidate kind).
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Every import and search is TLS over discoveryengine.googleapis.com; there is no plaintext path.
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A data store has no address of its own; it is reached only through the Discovery Engine API under IAM, or through an engine whose widget decides public exposure.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network listener exists to restrict; access is API-level and governed by IAM.
    - control_id: edge-protection
      status: not_applicable
      notes: No edge is served by the store; a website store CRAWLS a public site, it does not serve one.
    - control_id: rbac
      status: configurable
      field_path: acl_enabled
      evidence:
        type: spec_default
        reference: Managing the store and importing documents are governed by Discovery Engine IAM permissions. Unset means every caller who can search the store sees every document; acl_enabled makes each document carry its own access list, ingested with it and enforced per end user at search time.
      notes: The 03-documents-rag preset leaves ACLs off; enabling them needs the location's identity-provider configuration (google_discovery_engine_acl_config, a candidate kind). Immutable for the store's life.
    - control_id: workload-identity
      status: not_applicable
      notes: The store authenticates nothing; callers and engines use their own identities.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication paths exist to disable.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The store enforces no end-user sign-in; an engine's widget decides that, and acl_enabled decides what a signed-in user sees.
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Creating, changing, and deleting the store, its schema, target sites, and sitemaps land in Cloud Audit Logs (Admin Activity) unconditionally; document imports and searches are Data Access logs enabled at the project.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Discovery Engine emits indexing, import, and search metrics per data store to Cloud Monitoring without configuration.
    - control_id: backup-recovery
      status: not_applicable
      notes: The store's definition is declarative and re-creatable from source control; its documents are imported from their own sources of truth (BigQuery, Cloud Storage, a website, the API) and are re-imported, never restored.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: A data store lives in a Discovery Engine multi-region (global, us, or eu) and is replicated across it by Google; there is no zonal placement to configure.
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: Unset means DELETE -- the target sites, sitemaps, schema, and then the store are deleted, documents included; PREVENT makes any destroying plan fail; ABANDON removes everything from management while it keeps serving. The policy is fanned to every folded resource, and Google refuses to delete a store an engine still uses.
      notes: The 03-documents-rag preset sets PREVENT.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Vertex AI Search is fully Google-operated; there is no software surface the customer patches.
