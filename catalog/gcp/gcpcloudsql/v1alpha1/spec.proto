  option (buf.validate.message).cel = {
    id: "pool_requires_customer_cas"
    message: "server_ca_pool applies only when server_ca_mode is CUSTOMER_MANAGED_CAS_CA"
    expression: "this.server_ca_pool == '' || this.server_ca_mode == 'CUSTOMER_MANAGED_CAS_CA'"
