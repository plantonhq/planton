    id: "customer_cas_requires_pool"
    message: "server_ca_pool is required when server_ca_mode is CUSTOMER_MANAGED_CAS_CA"
    expression: "this.server_ca_mode != 'CUSTOMER_MANAGED_CAS_CA' || this.server_ca_pool != ''"
