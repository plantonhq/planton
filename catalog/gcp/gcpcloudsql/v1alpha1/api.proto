syntax = "proto3";

package dev.planton.gcp.gcpcloudsql.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpcloudsql/v1alpha1/outputs.proto";
import "catalog/gcp/gcpcloudsql/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-cloud-sql
message GcpCloudSql {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpCloudSql'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpCloudSqlSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpCloudSqlStatus status = 5;
}

//gcp-cloud-sql status
message GcpCloudSqlStatus {
  //outputs
  GcpCloudSqlOutputs outputs = 1;
}
