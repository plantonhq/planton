# Private-IP Postgres flagship: consumes the full private-services-access
# chain the registry installs (VPC → VPC_PEERING range → service networking
# connection) and asserts a PRIVATE address with no public PRIMARY IP.
# Also proves the CA Service certificate posture live: a Google-managed CAS
# CA with automatic rotation during maintenance, plus the explicit DELETE
# teardown policy (no-op against the provider default on re-plan).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudSql
metadata:
  name: planton-oss-e2e-gcpsql-private
  id: planton-oss-e2e-gcpsql-private
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpcloudsql
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  instanceName: planton-oss-e2e-sql-prv-${E2E_RUN_ID}
  region: us-central1
  databaseEngine: POSTGRESQL
  databaseVersion: POSTGRES_15
  tier: db-f1-micro
  deletionProtection: false
  deletionProtectionEnabled: false
  deletionPolicy: DELETE
  # Input-only opt-in: replicas (none here) would upgrade in place with the
  # primary on a major-version change. Never stored by the API, so the proof
  # is that it is accepted and re-plans clean.
  includeReplicasForMajorVersionUpgrade: true
  network:
    ipv4Enabled: false
    privateNetwork:
      valueFrom:
        kind: GcpVpcNetwork
        name: planton-oss-e2e-gcpvpc-prereq
        fieldPath: status.outputs.network_id
    enablePrivatePathForGoogleCloudServices: true
    serverCaMode: GOOGLE_MANAGED_CAS_CA
    serverCertificateRotationMode: AUTOMATIC_ROTATION_DURING_MAINTENANCE
