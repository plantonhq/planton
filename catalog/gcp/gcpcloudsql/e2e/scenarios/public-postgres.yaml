# Public-IP Postgres leaf: the smallest tier, no network block (Auth Proxy /
# connector path only — no authorized networks). The registry still installs
# the service networking prerequisite chain first; this scenario does not
# consume it. Instance names carry ${E2E_RUN_ID} because Cloud SQL reserves
# deleted names for about a week.
# Also proves the delete-time surface live: a final backup armed with
# 1-day retention (self-expiring — the sweep must still verify it), an
# explicit COUNT retention unit on daily backups, and the default
# ExecuteSql posture sent explicitly.
# Also proves the final-backup-on-delete arm live: destroy-verified must
# pass with the final backup armed, and the short retention (1 day)
# self-expires the backup so no orphan outlives the sweep window.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudSql
metadata:
  name: planton-oss-e2e-gcpsql-public
  id: planton-oss-e2e-gcpsql-public
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcloudsql
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  instanceName: planton-oss-e2e-sql-pub-${E2E_RUN_ID}
  region: us-central1
  databaseEngine: POSTGRESQL
  databaseVersion: POSTGRES_15
  tier: db-f1-micro
  deletionProtection: false
  deletionProtectionEnabled: false
  deletionPolicy: DELETE
  dataApiAccess: DISALLOW_DATA_API
  backup:
    enabled: true
    retainedBackups: 7
    retentionUnit: COUNT
  finalBackup:
    enabled: true
    retentionDays: 1
    description: e2e final backup arm
