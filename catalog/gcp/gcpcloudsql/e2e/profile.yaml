apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpcloudsql
spec:
  # Composed scenarios: the registry installs the full service networking
  # chain before every instance create. Cloud SQL instances are slow (~10–15
  # min each); run the package with a generous go test -timeout.
  tier: 1
  # Live-proven 2026-08-13 on both engines at the total-accounting spec:
  # private-postgres (PSA chain, GOOGLE_MANAGED_CAS_CA +
  # AUTOMATIC_ROTATION_DURING_MAINTENANCE — echoed in the stored object)
  # and public-postgres (final_backup 1-day retention verified to EXIST
  # post-destroy, retentionUnit COUNT, DISALLOW_DATA_API) x 2 engines,
  # all phases green under the apply-idempotency gate. The chain's
  # fixtures are scenario+run-scoped and the connection fixture ABANDONs
  # on teardown — Cloud SQL's producer hold on the peering was
  # live-measured beyond 42 minutes (see the fixture comments and
  # e2e/README.md).
  #
  # Offline-proven-only arms (deferred, with unblock conditions):
  #   - restore provenance (clone, restore_backup_context,
  #     point_in_time_restore_context, backupdr_backup) and DR pairing
  #     (failover_dr_replica_name): need a pre-existing SOURCE instance
  #     (and a Backup and DR vault for the backupdr arm). Unblock: a
  #     dedicated restore lane composing a source-instance fixture.
  #   - read pools (instance_type READ_POOL_INSTANCE, node_count,
  #     read_pool_auto_scale): need an ENTERPRISE_PLUS primary — a real
  #     cost step. Unblock: a dedicated read-pool lane on a throwaway
  #     ENTERPRISE_PLUS primary.
  #   - active_directory / entra_id: need a managed AD domain / Entra
  #     tenant fixture the harness lacks.
  #
  # Awaiting re-proof: the instance gained the replica self-recreation
  # threshold (replication_lag_max_seconds), the input-only major-version and
  # transaction-log opt-ins, the new-network-architecture switch, and the PSC
  # auto-connection policy; the private-postgres scenario now sets
  # include_replicas_for_major_version_upgrade. The next proof confirms the
  # opt-in is accepted and re-plans clean, and that the Computed arguments
  # left unset show no diff.
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 30
