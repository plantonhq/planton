# The second act of goto-next-and-logging.yaml: the global policy's
# description changed and its threat-intelligence rule's logging turned off,
# the two in-place updates a policy takes (the policy patched, one rule
# patched).
# Not a scenario of its own (the second-act annotation keeps discovery from
# running it as a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpNetworkFirewallPolicy
metadata:
  name: planton-oss-e2e-gcpnfwp-knobs
  id: planton-oss-e2e-gcpnfwp-knobs
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpnetworkfirewallpolicy
  annotations:
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e: "true"
    planton.dev/e2e-second-act: goto-next-and-logging.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
    # The target service account is the GcpServiceAccount install profile,
    # deployed as an extra fixture through the kind-name entry.
    planton.dev/e2e-prerequisites: "GcpServiceAccount"
  tags:
    - planton-e2e
spec:
  policyName: planton-oss-e2e-gcpnfwp-knobs-${E2E_RUN_ID} # per engine, so both engines' lanes can run at once in one project
  description: Planton E2E network firewall policy knobs, updated in place; safe to delete
  rules:
    - priority: 100
      action: deny
      direction: INGRESS
      ruleName: deny-threat-intel
      enableLogging: false
      match:
        srcThreatIntelligences: ["iplist-known-malicious-ips", "iplist-tor-exit-nodes"]
        layer4Configs:
          - ipProtocol: all
    - priority: 200
      action: deny
      direction: INGRESS
      ruleName: deny-geo
      match:
        srcRegionCodes: ["KP"]
        srcNetworkContext: INTERNET
        layer4Configs:
          - ipProtocol: tcp
          - ipProtocol: udp
    - priority: 300
      action: allow
      direction: EGRESS
      ruleName: allow-fqdn-out
      match:
        destFqdns: ["www.googleapis.com", "oauth2.googleapis.com"]
        destNetworkContext: INTERNET
        layer4Configs:
          - ipProtocol: tcp
            ports: ["443"]
    - priority: 400
      action: allow
      direction: INGRESS
      ruleName: allow-intra-vpc
      match:
        srcIpRanges: ["10.0.0.0/8"] # Google refuses a network context as an ingress rule's only source
        srcNetworkContext: INTRA_VPC
        layer4Configs:
          - ipProtocol: all
      targetServiceAccounts:
        - valueFrom:
            kind: GcpServiceAccount
            name: planton-oss-e2e-gsa-prereq
            fieldPath: status.outputs.email
    - priority: 65000
      action: goto_next
      direction: INGRESS
      ruleName: delegate
      match:
        srcIpRanges: ["0.0.0.0/0"] # every ingress rule names a source; goto_next hands the rest down
        layer4Configs:
          - ipProtocol: all
  associations:
    - name: planton-oss-e2e-gcpnfwp-knobs-prereq
      network:
        valueFrom:
          kind: GcpVpcNetwork
          name: planton-oss-e2e-gcpvpcnetwork-prereq
          fieldPath: status.outputs.network_self_link
  deletionPolicy: DELETE
