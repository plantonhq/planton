apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpnetworkfirewallpolicy
spec:
  # Proven live on both engines (2026-11-18): the global and regional
  # families, secure tags, threat lists, region codes, FQDNs and network
  # contexts, each scenario deployed and destroyed by an identity holding only
  # this kind's permissions manifest, and the global and regional policies
  # updated in place (a description and one rule patched). Measured: (1)
  # policy_type, target_type and the network-context enums left unset re-plan
  # clean, and an explicit VPC_POLICY round-trips; (2) Google refuses an
  # INGRESS rule that names no source or only a network context, which the
  # spec now refuses first; (3) rule_tuple_count is not an output -- Google
  # recounts it as the rules land after the policy, so an apply records the
  # policy's own figure; (4) the tagValues/{id} handles render identically and
  # the policy is destroyed before the tag value and key; (5) reading
  # google_project_service back needs resourcemanager.projects.get. The
  # INTERNAL_MANAGED_LB arm stays offline-only: it needs a regional
  # INTERNAL_MANAGED forwarding rule as its target, a fixture chain this
  # kind's lane does not carry.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
