apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: gcpfirebaseandroidapp
spec:
  # Awaiting the live proof lane. Offline bar met: both modules build and
  # validate, offline plans for the reference manifest and every scenario
  # are clean on the pinned providers (google + google-beta under the
  # recorded admission), and the accounting is total. Live facts the proof
  # lane confirms: (1) Firebase's DOCUMENTED propagation delay between a
  # new app and its first App Check configuration -- Google's own provider
  # examples wait 30 seconds; both modules order the configurations after
  # the registration and add no delay, and the play-integrity scenario is
  # the instrument that decides whether one is needed; (2) an app removed
  # under deletion_policy DELETE (immediate=true) reads back as 404 or as
  # state DELETED -- the verifier accepts both, the lane records which;
  # (3) the E2E identity holds roles/firebase.admin on the test project
  # (needed for :create and :remove on apps); (4) the config lookup reads
  # google-services.json after create on both engines and the
  # apply-idempotency re-plan is clean with the deferred data source;
  # (5) the with-api-key scenario proves the GcpApiKey edge: an
  # unrestricted key from the key kind's minimal fixture is accepted as the
  # app's api_key_id.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 25
