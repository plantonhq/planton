# Consumer-scoped GcpVpcNetwork install profile for the gcpdspc chain: a
# custom-mode VPC Datastream peers with. The cloud-side name carries the run
# id; metadata.name stays fixed for reference resolution across the chain.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpVpcNetwork
metadata:
  name: planton-oss-e2e-gcpdspc-vpc
  id: planton-oss-e2e-gcpdspc-vpc
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcpvpcnetwork
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  networkName: e2e-gcpdspc-vpc-${E2E_RUN_ID}
  autoCreateSubnetworks: false
