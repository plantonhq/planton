# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpdatastreamprivateconnection
spec:
  gcp:
    groups:
      - purpose: EnableApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
          - resourcemanager.projects.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_project_service enabling datastream.googleapis.com on the target project. disable_on_destroy is false in the module, so the disable permission is never needed. The provider reads the project with resourcemanager.projects.get before its services on every refresh, so a re-plan or destroy needs it (measured live). Proven 2026-11-18 -- an identity holding only this manifest deployed and destroyed the kind on both engines (a private connection has no in-place update).
      - purpose: ManagePrivateConnection
        permissions:
          - datastream.privateConnections.create
          - datastream.privateConnections.get
          - datastream.privateConnections.delete
          - datastream.operations.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_datastream_private_connection (Pulumi datastream.PrivateConnection) -- created, read on every refresh, deleted (with force), and its long-running operations polled. Names grounded in Google's Datastream roles page, which lists no update permission for private connections; the proof lane's capture confirms what a label change needs. roles/datastream.admin contains all four. Proven 2026-11-18 -- an identity holding only this manifest deployed and destroyed the kind on both engines (a private connection has no in-place update).
      - purpose: PeerWithVpc
        permissions:
          - compute.networks.get
          - compute.networks.addPeering
          - compute.networks.removePeering
        provenance: proven
        reach: target
        privilege: ordinary
        condition:
          spec_field_set: vpc_peering_config
        notes: Datastream creates and removes the peering on the named VPC on the caller's behalf, so the caller needs network rights there (roles/compute.networkAdmin contains all three). Not needed for the PSC interface arm. Proven 2026-11-18 -- an identity holding only this manifest deployed and destroyed the kind on both engines (a private connection has no in-place update).
