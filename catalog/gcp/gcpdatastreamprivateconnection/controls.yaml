# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpdatastreamprivateconnection
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: "A private connection stores no data; the streams that use it encrypt what they hold."
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: "No data at rest; a stream's customer_managed_encryption_key covers the data in flight."
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Traffic over the peering or PSC interface stays on Google's network; each connection profile adds TLS to the database session."
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "The connection's purpose is private reachability: databases reached through it need no public address."
    - control_id: restricted-ingress
      status: configurable
      field_path: vpc_peering_config.subnet
      evidence:
        type: spec_default
        reference: "Datastream's traffic arrives from the declared /29 (or the network attachment's subnet), which VPC firewall rules can allow narrowly to the database ports."
    - control_id: edge-protection
      status: not_applicable
      notes: "No edge is served."
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Creating, using, and deleting private connections requires datastream.privateConnections.* permissions."
    - control_id: workload-identity
      status: not_applicable
      notes: "The connection carries no credential; profiles carry the database sign-in."
    - control_id: no-legacy-auth
      status: not_applicable
      notes: "No authentication happens at the connection."
    - control_id: strong-user-auth
      status: not_applicable
      notes: "No end-user sign-in exists."
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Private connection administration is recorded in Cloud Audit Logs (Admin Activity)."
    - control_id: monitoring-integration
      status: not_applicable
      notes: "The connection emits no metrics of its own; streams report their health in Cloud Monitoring."
    - control_id: backup-recovery
      status: not_applicable
      notes: "The connection is redeclared from the spec; there is no data in it."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: "No backups exist."
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Datastream is a regional service; the connection has no zonal dependency."
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: "Unset means FORCE -- the connection and Datastream's routes are deleted on destroy; PREVENT makes destroy fail; ABANDON leaves it in GCP."
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Datastream is fully Google-operated; there is no software surface the customer patches."
