# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpbigquerytable
spec:
  gcp:
    groups:
      - purpose: EnableBigQueryApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
          - resourcemanager.projects.get
        provenance: derived
        reach: target
        privilege: ordinary
        notes: Covers google_project_service enabling bigquery.googleapis.com on the target project. disable_on_destroy is false in both modules, so the disable permission is never needed. The provider reads the project with resourcemanager.projects.get before its services on every refresh, so a re-plan or destroy needs it (measured live).
      - purpose: ManageTable
        permissions:
          - bigquery.tables.create
          - bigquery.tables.delete
          - bigquery.tables.get
          - bigquery.tables.update
        provenance: derived
        reach: target
        privilege: ordinary
        notes: Covers google_bigquery_table across all four arms -- native tables, logical views, materialized views, and external tables are one API resource. create at provision, get for read/refresh, update for mutable fields (schema columns, expiration, view query, labels), delete on destroy once deletion_protection is false. Google's own reference states creating a view requires the same permissions as creating a table. The committed action-inventory snapshot (pkg/iac/actioninventory/gcp.yaml) carries the bigquery service prefix and lists every permission here; the list was also verified against Google's BigQuery access-control reference (cloud.google.com/bigquery/docs/access-control) live.
      - purpose: ReadViewReferencedTables
        permissions:
          - bigquery.tables.getData
        provenance: derived
        reach: target
        privilege: ordinary
        condition:
          spec_field_set: view
        notes: BigQuery validates the defining query of the logical view at creation, and per Google's create-views documentation the creator "must also have permissions to query any tables that are referenced by the view's SQL query" (bigquery.tables.getData on each referenced table). Verified against Google's BigQuery documentation live; the committed inventory snapshot carries the bigquery service prefix and lists this permission.
      - purpose: ReadMaterializedViewReferencedTables
        permissions:
          - bigquery.tables.getData
        provenance: derived
        reach: target
        privilege: ordinary
        condition:
          spec_field_set: materialized_view
        notes: BigQuery validates the defining query of the materialized view at creation, and per Google's create-views documentation the creator "must also have permissions to query any tables that are referenced by the view's SQL query" (bigquery.tables.getData on each referenced table). Verified against Google's BigQuery documentation live; the committed inventory snapshot carries the bigquery service prefix and lists this permission.
