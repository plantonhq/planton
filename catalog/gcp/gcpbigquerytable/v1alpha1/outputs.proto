syntax = "proto3";

package dev.planton.gcp.gcpbigquerytable.v1alpha1;

// Outputs produced after provisioning a GCP BigQuery table.
message GcpBigQueryTableOutputs {
  // The short table ID (same as the spec's table_id input) — the value SQL
  // queries and foreign keys reference.
  string table_id = 1;

  // The fully qualified URI of the table.
  // Format: https://bigquery.googleapis.com/bigquery/v2/projects/{project}/datasets/{dataset}/tables/{table}
  string self_link = 2;

  // The GCP project that contains the table (resolved even under the
  // ambient-project fallback).
  string project = 3;

  // The dataset that contains the table.
  string dataset_id = 4;

  // The kind of table GCP materialized: TABLE, VIEW, MATERIALIZED_VIEW, or
  // EXTERNAL.
  string type = 5;

  // Geographic location of the table (inherited from the dataset).
  string location = 6;

  // The creation time of the table in milliseconds since epoch.
  int64 creation_time = 7;

  // The dotted fully qualified table name: {project}.{dataset}.{table}.
  // Pre-assembled so consumers that address tables in SQL-style dotted
  // form (Pub/Sub BigQuery delivery, query tooling) can reference the
  // table without string assembly.
  string qualified_name = 8;
}
