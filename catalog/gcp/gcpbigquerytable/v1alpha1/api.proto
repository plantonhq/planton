syntax = "proto3";

package dev.planton.gcp.gcpbigquerytable.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpbigquerytable/v1alpha1/outputs.proto";
import "catalog/gcp/gcpbigquerytable/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-bigquery-table
message GcpBigQueryTable {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpBigQueryTable'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpBigQueryTableSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpBigQueryTableStatus status = 5;
}

//gcp-bigquery-table status
message GcpBigQueryTableStatus {
  //outputs
  GcpBigQueryTableOutputs outputs = 1;
}
