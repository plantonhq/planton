# GcpBigQueryTable scenario: a day-partitioned, clustered native table on the
# prerequisite dataset. deletionProtection must be false so the ephemeral
# DESTROY can run (production keeps the default TRUE).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpBigQueryTable
metadata:
  name: planton-oss-e2e-gcpbqtbl-partitioned
  id: planton-oss-e2e-gcpbqtbl-partitioned
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpbigquerytable
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  datasetId:
    valueFrom:
      kind: GcpBigQueryDataset
      name: planton-oss-e2e-gcpbqds-prereq
      fieldPath: status.outputs.dataset_id
  tableId: e2e_bqtbl_native
  schema: '[{"name":"event_time","type":"TIMESTAMP","mode":"REQUIRED"},{"name":"customer_id","type":"INT64"},{"name":"event_type","type":"STRING"}]'
  timePartitioning:
    type: DAY
    field: event_time
  clustering:
    - customer_id
    - event_type
  requirePartitionFilter: true
  deletionProtection: false
  # Destroy really destroys in E2E: the live lanes prove the full lifecycle.
  deletionPolicy: DELETE
