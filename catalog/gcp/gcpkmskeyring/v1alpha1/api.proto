syntax = "proto3";

package dev.planton.gcp.gcpkmskeyring.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpkmskeyring/v1alpha1/outputs.proto";
import "catalog/gcp/gcpkmskeyring/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-kms-key-ring
message GcpKmsKeyRing {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpKmsKeyRing'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpKmsKeyRingSpec spec = 4 [(buf.validate.field).required = true];
  GcpKmsKeyRingStatus status = 5;
}

message GcpKmsKeyRingStatus {
  GcpKmsKeyRingOutputs outputs = 1;
}
