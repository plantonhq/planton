# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: gcpkmskeyring
spec:
  billing_model: free
  free_tier: "A key ring carries no meter -- Cloud KMS pricing is based on active key versions, their protection level, and cryptographic operations, and a ring is none of those: it is the permanent, undeletable container keys are grouped in. An empty ring costs nothing forever (which matters, because destroy only removes it from IaC state -- GCP has no delete API for rings, so every ring ever created persists), and a ring full of keys still bills nothing itself."
  notes: "No field of this spec buys anything: key_ring_name and location are permanent placement decisions. The real spend lives on the KEYS created inside the ring, billing as their own component on Cloud KMS's meters: each active key version costs $0.06/month at protection level SOFTWARE ($1.00/month for HSM; $3.00/month for EXTERNAL -- and RSA 3072+/EC HSM versions $2.50/month for the first 2,000 per account), prorated to actual active hours, and every cryptographic operation (encrypt, decrypt, sign, verify) bills $0.03 per 10,000 calls ($0.15 per 10,000 for HSM asymmetric and MAC operations). Destroyed key versions and admin operations are free, key rotation itself is free (the new version it mints is not), and the Always Free tier covers 100 active key versions plus 10,000 operations per month for keys created through Cloud KMS Autokey. The ring's one cost-shaped lever is location: it pins where every future key must live, and CMEK integrations require keys co-located with the data they protect."
