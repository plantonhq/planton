# GcpKmsKeyRing scenario: a regional ring. project_id is deliberately
# omitted (ambient project). Key rings are PERMANENT — no delete API —
# so the cloud-side key_ring_name carries ${E2E_RUN_ID}: the leftover
# ring is inert and free, and reruns never collide.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpKmsKeyRing
metadata:
  name: planton-oss-e2e-gcpkr-smoke
  id: planton-oss-e2e-gcpkr-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpkmskeyring
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  keyRingName: e2e-kr-${E2E_RUN_ID}
  location: us-central1
