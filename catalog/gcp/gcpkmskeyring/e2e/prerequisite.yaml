# Published install profile: consumers (a GcpKmsKey's key_ring_id
# reference, CMEK chains) attach in their scenarios. The cloud-side
# key_ring_name carries ${E2E_RUN_ID} (rings are permanent and their
# names are never reusable); metadata.name stays fixed for FK resolution.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpKmsKeyRing
metadata:
  name: planton-oss-e2e-gcpkr-prereq
  id: planton-oss-e2e-gcpkr-prereq
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpkmskeyring
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  keyRingName: e2e-kms-ring-${E2E_RUN_ID}
  location: us-central1
