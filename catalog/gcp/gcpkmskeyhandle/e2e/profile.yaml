apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpkmskeyhandle
spec:
  # Proven live on both engines (2026-11-19): a Cloud Storage key handle over
  # the project's own Autokey configuration, deployed and destroyed by an
  # identity holding only this kind's permissions manifest, with the re-plan
  # clean. A handle has no in-place update. Google keeps the handle and the
  # HSM key Autokey made for it, so the lane schedules that key's versions for
  # destruction (e2e-release-dependents autokey-key).
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
