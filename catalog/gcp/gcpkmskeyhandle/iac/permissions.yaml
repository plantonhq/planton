# Least-privilege permissions the IaC runner's GCP principal needs to
# provision, update, and destroy this component with the platform modules.
# Every entry is `derived` (static analysis of the module sources, cited in
# notes) until the live capture lane upgrades it to `proven`. Schema:
# iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: gcpkmskeyhandle
spec:
  gcp:
    groups:
      - purpose: EnableCloudKmsApi
        permissions:
          - serviceusage.services.enable
          - serviceusage.services.get
          - serviceusage.services.list
          - resourcemanager.projects.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_project_service enabling cloudkms.googleapis.com on the handle's project. disable_on_destroy is false, so the disable permission is never needed. The provider reads the project with resourcemanager.projects.get before its services on every refresh, so a re-plan or destroy needs it (measured live). Proven 2026-11-19 -- an identity holding only this manifest deployed and destroyed the kind on both engines; it has no in-place update.
      - purpose: ManageKeyHandle
        permissions:
          - cloudkms.keyHandles.create
          - cloudkms.keyHandles.get
          - cloudkms.operations.get
        provenance: proven
        reach: target
        privilege: ordinary
        notes: Covers google_kms_key_handle (Pulumi kms.KeyHandle) -- create is a long-running operation the provider polls, read on every refresh; delete makes no API call (Google keeps handles). Held on the project (roles/cloudkms.autokeyUser). The provider-default project lookup reads provider configuration only and needs no permission. Proven 2026-11-19 -- an identity holding only this manifest deployed and destroyed the kind on both engines; it has no in-place update.
