syntax = "proto3";

package dev.planton.gcp.gcpregionnetworkendpointgroup.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// GcpRegionNetworkEndpointGroupSpec defines a regional network endpoint group
// (NEG) — the bridge that lets a load balancer's backend service send traffic
// to something other than a group of Compute Engine VMs. A regional NEG names
// a set of endpoints in one region; the backend service references the NEG's
// self-link in its backends[].group.
//
// The endpoint type decides what the NEG points at:
//   - SERVERLESS (the default) — a Cloud Run service, a Cloud Functions
//     function, or an App Engine service. This is how serverless workloads sit
//     behind an external Application Load Balancer (custom domains, Cloud CDN,
//     Cloud Armor, IAP in front of Cloud Run).
//   - PRIVATE_SERVICE_CONNECT — a Private Service Connect endpoint fronting a
//     published producer service or a Google API.
//   - INTERNET_IP_PORT / INTERNET_FQDN_PORT — an external origin (an IP:port or
//     an FQDN:port) reached over the internet, e.g. an on-prem or third-party
//     backend fronted by a Google load balancer.
//   - GCE_VM_IP_PORTMAP — PSC port-mapping to VM IP:port targets.
//
// The whole resource is immutable in GCP: every field is ForceNew, so any
// change destroys and recreates the NEG. Because an in-use NEG cannot be
// deleted, downstream tooling that recreates one should create the replacement
// before destroying the original (create-before-destroy) to avoid a
// resourceInUseByAnotherResource error.
message GcpRegionNetworkEndpointGroupSpec {
  // The GCP project that owns the network endpoint group.
  // Can be a literal project ID or a reference to a GcpProject resource.
  // If omitted, the provider's default project is used.
  // Immutable: changing it destroys and recreates the NEG.
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];

  // Name of the network endpoint group in GCP. Must be 1-63 characters:
  // lowercase letters, digits, and hyphens; must start with a letter and end
  // with a letter or digit. If not specified, defaults to metadata.name.
  // Immutable: changing it destroys and recreates the NEG, briefly breaking
  // every backend service that references the old self_link.
  string network_endpoint_group_name = 2 [(buf.validate.field).cel = {
    id: "valid_network_endpoint_group_name"
    message: "network_endpoint_group_name must be RFC1035-compliant: 1-63 lowercase letters, digits, or hyphens; must start with a letter and end with a letter or digit"
    expression: "this == '' || this.matches('^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$')"
  }];

  // Region the NEG lives in (e.g. "us-central1"). Required — a regional NEG is
  // always scoped to one region, and a serverless NEG must be in the same
  // region as the Cloud Run/Functions/App Engine workload it fronts.
  // Immutable: a NEG cannot move between regions.
  string region = 3 [(buf.validate.field).cel = {
    id: "valid_region"
    message: "region is required and must be a valid GCP region name such as us-central1"
    expression: "this != '' && this.matches('^[a-z]([-a-z0-9]*[a-z0-9])?$')"
  }];

  // What kind of endpoints this NEG holds (default SERVERLESS). SERVERLESS
  // fronts Cloud Run/Functions/App Engine; PRIVATE_SERVICE_CONNECT fronts a
  // PSC endpoint; INTERNET_IP_PORT / INTERNET_FQDN_PORT front an external
  // origin; GCE_VM_IP_PORTMAP does PSC port mapping. Immutable.
  optional string network_endpoint_type = 4 [
    (dev.planton.shared.options.default) = "SERVERLESS",
    (buf.validate.field).cel = {
      id: "valid_network_endpoint_type"
      message: "network_endpoint_type must be one of SERVERLESS, PRIVATE_SERVICE_CONNECT, INTERNET_IP_PORT, INTERNET_FQDN_PORT, or GCE_VM_IP_PORTMAP"
      expression: "this == '' || this in ['SERVERLESS', 'PRIVATE_SERVICE_CONNECT', 'INTERNET_IP_PORT', 'INTERNET_FQDN_PORT', 'GCE_VM_IP_PORTMAP']"
    }
  ];

  // What this NEG fronts and which backend service consumes it — write it for
  // the operator tracing a request path later. Immutable.
  string description = 5 [(buf.validate.field).string.max_len = 2048];

  // The VPC network for PRIVATE_SERVICE_CONNECT, INTERNET, and
  // GCE_VM_IP_PORTMAP NEGs. Reference a GcpVpcNetwork or provide a network self-link
  // directly. Not used by (and rejected for) SERVERLESS NEGs — serverless
  // platforms are not attached to a VPC here. Immutable.
  dev.planton.shared.foreignkey.v1.StringValueOrRef network = 6 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpVpcNetwork,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.network_self_link"
  ];

  // The subnetwork for PRIVATE_SERVICE_CONNECT and GCE_VM_IP_PORTMAP NEGs.
  // Reference a GcpSubnetwork or provide a subnetwork self-link directly.
  // Not used by serverless or internet NEGs. Immutable.
  dev.planton.shared.foreignkey.v1.StringValueOrRef subnetwork = 7 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpSubnetwork,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.subnetwork_self_link"
  ];

  // The target of a PRIVATE_SERVICE_CONNECT or INTERNET NEG. For PSC it is the
  // published service-attachment URL or a Google API bundle name (e.g.
  // "asia-northeast3-cloudkms.googleapis.com"); required for PSC NEGs.
  // Immutable.
  string psc_target_service = 8 [(buf.validate.field).string.max_len = 2048];

  // Extra Private Service Connect settings for a PSC NEG. Only valid when
  // network_endpoint_type is PRIVATE_SERVICE_CONNECT.
  GcpRegionNetworkEndpointGroupPscData psc_data = 9;

  // The serverless target a SERVERLESS group fronts: exactly one of the arms
  // below, and none for the other endpoint types. Choosing an arm is the whole
  // statement for App Engine's default application, whose block carries
  // nothing else.
  oneof serverless_target {
    // Front a Cloud Run service.
    GcpRegionNetworkEndpointGroupCloudRun cloud_run = 10;

    // Front a Cloud Functions (Gen 2) function.
    GcpRegionNetworkEndpointGroupCloudFunction cloud_function = 11;

    // Front an App Engine service. The block may be empty to route to the
    // default App Engine application.
    GcpRegionNetworkEndpointGroupAppEngine app_engine = 12;
  }

  // Deletion policy for the NEG — what happens when this resource is
  // destroyed:
  //   ""        -- same as "DELETE" (provider default)
  //   "DELETE"  -- the NEG is deleted (GCP refuses while a backend
  //                service still references it — create the replacement
  //                before destroying the original)
  //   "PREVENT" -- destroy FAILS; protects the attachment a live backend
  //                service routes through
  //   "ABANDON" -- the NEG is removed from management but left in GCP
  string deletion_policy = 13 [(buf.validate.field).cel = {
    id: "valid_deletion_policy"
    message: "deletion_policy must be one of: DELETE, PREVENT, ABANDON"
    expression: "this == '' || this in ['DELETE', 'PREVENT', 'ABANDON']"
  }];

  option (buf.validate.message).cel = {
    id: "serverless_requires_exactly_one_block"
    message: "a SERVERLESS network endpoint group requires exactly one of cloud_run, cloud_function, or app_engine"
    expression: "(has(this.network_endpoint_type) && this.network_endpoint_type != '' ? this.network_endpoint_type : 'SERVERLESS') != 'SERVERLESS' || has(this.cloud_run) || has(this.cloud_function) || has(this.app_engine)"
  };

  option (buf.validate.message).cel = {
    id: "serverless_blocks_forbidden_otherwise"
    message: "cloud_run, cloud_function, and app_engine apply only to SERVERLESS network endpoint groups"
    expression: "(has(this.network_endpoint_type) && this.network_endpoint_type != '' ? this.network_endpoint_type : 'SERVERLESS') == 'SERVERLESS' || (!has(this.cloud_run) && !has(this.cloud_function) && !has(this.app_engine))"
  };

  option (buf.validate.message).cel = {
    id: "psc_requires_target_service"
    message: "a PRIVATE_SERVICE_CONNECT network endpoint group requires psc_target_service (the published service-attachment URL or Google API bundle)"
    expression: "(has(this.network_endpoint_type) && this.network_endpoint_type != '' ? this.network_endpoint_type : 'SERVERLESS') != 'PRIVATE_SERVICE_CONNECT' || this.psc_target_service != ''"
  };

  option (buf.validate.message).cel = {
    id: "psc_target_service_scope"
    message: "psc_target_service applies only to PRIVATE_SERVICE_CONNECT and INTERNET network endpoint groups"
    expression: "this.psc_target_service == '' || (has(this.network_endpoint_type) && this.network_endpoint_type != '' ? this.network_endpoint_type : 'SERVERLESS') in ['PRIVATE_SERVICE_CONNECT', 'INTERNET_IP_PORT', 'INTERNET_FQDN_PORT']"
  };

  option (buf.validate.message).cel = {
    id: "psc_data_scope"
    message: "psc_data applies only to PRIVATE_SERVICE_CONNECT network endpoint groups"
    expression: "!has(this.psc_data) || (has(this.network_endpoint_type) && this.network_endpoint_type != '' ? this.network_endpoint_type : 'SERVERLESS') == 'PRIVATE_SERVICE_CONNECT'"
  };

  option (buf.validate.message).cel = {
    id: "subnetwork_scope"
    message: "subnetwork applies only to PRIVATE_SERVICE_CONNECT and GCE_VM_IP_PORTMAP network endpoint groups"
    expression: "!has(this.subnetwork) || (has(this.network_endpoint_type) && this.network_endpoint_type != '' ? this.network_endpoint_type : 'SERVERLESS') in ['PRIVATE_SERVICE_CONNECT', 'GCE_VM_IP_PORTMAP']"
  };

  option (buf.validate.message).cel = {
    id: "network_not_for_serverless"
    message: "network applies only to non-serverless network endpoint groups (PSC, INTERNET, or GCE_VM_IP_PORTMAP)"
    expression: "!has(this.network) || (has(this.network_endpoint_type) && this.network_endpoint_type != '' ? this.network_endpoint_type : 'SERVERLESS') != 'SERVERLESS'"
  };
}

// Cloud Run target for a SERVERLESS NEG. Set service (optionally with tag),
// or url_mask to derive the service (and tag) from the request URL — at least
// one is required.
message GcpRegionNetworkEndpointGroupCloudRun {
  // The Cloud Run service to route to. Reference a GcpCloudRun resource or
  // provide the service name directly. GCP resolves endpoints at serving time,
  // so the service need not exist when the NEG is created. Immutable.
  dev.planton.shared.foreignkey.v1.StringValueOrRef service = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpCloudRun,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.service_name"
  ];

  // Route to a specific Cloud Run revision tag for fine-grained traffic
  // splitting (e.g. "canary"). Only meaningful with service. Immutable.
  string tag = 2 [(buf.validate.field).string.max_len = 1024];

  // A URL template that parses the service (and optional tag) out of each
  // request URL — for host/path-based fan-out to many services from one NEG
  // (e.g. "<service>.example.com/<tag>"). Immutable.
  string url_mask = 3 [(buf.validate.field).string.max_len = 1024];

  option (buf.validate.message).cel = {
    id: "cloud_run_service_or_url_mask"
    message: "a cloud_run block must set service or url_mask (or both)"
    expression: "has(this.service) || this.url_mask != ''"
  };
}

// Cloud Functions target for a SERVERLESS NEG. Set function, or url_mask to
// derive the function from the request URL — at least one is required.
message GcpRegionNetworkEndpointGroupCloudFunction {
  // The Cloud Functions function name to route to (case-sensitive). Accepts
  // a literal name or a reference to a GcpCloudFunction resource. GCP
  // resolves endpoints at serving time. Immutable.
  dev.planton.shared.foreignkey.v1.StringValueOrRef function = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpCloudFunction,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.name"
  ];

  // A URL template that parses the function name out of each request URL — for
  // routing many functions from one NEG. Immutable.
  string url_mask = 2 [(buf.validate.field).string.max_len = 1024];

  option (buf.validate.message).cel = {
    id: "cloud_function_function_or_url_mask"
    message: "a cloud_function block must set function or url_mask (or both)"
    expression: "has(this.function) || this.url_mask != ''"
  };
}

// App Engine target for a SERVERLESS NEG. All fields are optional: an empty
// block routes to the default App Engine application in the project.
message GcpRegionNetworkEndpointGroupAppEngine {
  // The App Engine service to route to. Empty routes to the default service.
  // Immutable.
  string service = 1 [(buf.validate.field).string.max_len = 1024];

  // The App Engine service version to route to. Empty routes to the version
  // split configured in App Engine. Immutable.
  string version = 2 [(buf.validate.field).string.max_len = 1024];

  // A URL template that parses the service (and version) out of each request
  // URL. Immutable.
  string url_mask = 3 [(buf.validate.field).string.max_len = 1024];
}

// Extra Private Service Connect settings for a PSC NEG.
message GcpRegionNetworkEndpointGroupPscData {
  // The producer port a consumer PSC NEG connects to. Empty connects to the
  // first port in the producer's advertised port range. Immutable.
  string producer_port = 1 [(buf.validate.field).string.max_len = 16];
}
