# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: gcpregionnetworkendpointgroup
spec:
  billing_model: free
  free_tier: "A regional network endpoint group is a pointer collection -- it names what a backend service sends traffic to -- and Google meters none of it. The complete Cloud Load Balancing meter list on Google's network pricing page (forwarding rules, data processing, internal-ALB proxy instances, authorization policies, custom request headers, and self-managed-certificate connections) contains no charge for NEG objects of any endpoint type."
  notes: "The NEG bills nothing, but network_endpoint_type decides which OTHER meters the traffic through it touches. SERVERLESS (the default) adds the fronted workload's own compute bill (Cloud Run, Cloud Functions, App Engine as their own kinds) on top of load balancer charges -- though Google explicitly waives serverless outbound data transfer for requests passed from the load balancer through a serverless NEG. INTERNET_IP_PORT / INTERNET_FQDN_PORT NEGs behind a regional load balancer REQUIRE a Cloud NAT gateway, which bills hourly at the more-than-32-VM-network rate plus NAT data processing, and internet data transfer out applies to traffic to the external origin including health check traffic. PRIVATE_SERVICE_CONNECT NEGs add PSC consumer data processing ($0.01 per GiB at the first tier, inbound and outbound) on traffic between the NEG and the published service, on top of load balancer charges. In every case the frontend spend -- forwarding rule hours and per-GiB LB data processing -- bills on the frontend kinds, and the backend service consuming this NEG is itself chargeless."
