# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: gcpmanagedkafkaconnectcluster
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Google encrypts the workers' disks and the connector state Kafka Connect keeps at rest."
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: "The Connect cluster offers no customer-managed key; its internal topics live on the Kafka cluster, whose kms_key applies."
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Workers reach the Kafka cluster over its TLS listeners and Google APIs over TLS."
    - control_id: no-public-access
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "The workers have no public address; they reach networks only through the private interfaces network_configs lists."
    - control_id: restricted-ingress
      status: configurable
      field_path: network_configs
      evidence:
        type: spec_default
        reference: "The workers' reach is exactly the private subnets network_configs lists; VPC firewall rules further restrict it."
    - control_id: edge-protection
      status: not_applicable
      notes: "No edge is served."
    - control_id: rbac
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Administering the Connect cluster requires managedkafka.connectClusters.* permissions, and attaching it requires managedkafka.clusters.attachConnectCluster on the Kafka cluster."
    - control_id: workload-identity
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Connectors act as the Managed Kafka service agent; access to other Google services is IAM grants to it, not stored keys."
    - control_id: no-legacy-auth
      status: not_applicable
      notes: "The Connect cluster exposes no client authentication path."
    - control_id: strong-user-auth
      status: not_applicable
      notes: "No end-user sign-in exists."
    - control_id: audit-logging
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Connect cluster administration is recorded in Cloud Audit Logs (Admin Activity) unconditionally."
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Google publishes Connect cluster and connector metrics to Cloud Monitoring without configuration."
    - control_id: backup-recovery
      status: not_applicable
      notes: "Connector state lives in Kafka Connect's internal topics on the Kafka cluster; there is nothing to back up here."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: "No backups exist."
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Google runs the Connect workers across zones of the region and reschedules tasks when a worker fails."
    - control_id: deletion-protection
      status: configurable
      field_path: deletion_policy
      evidence:
        type: spec_default
        reference: "Unset means DELETE -- the Connect cluster and its connectors are deleted on destroy; PREVENT makes destroy fail; ABANDON leaves it running."
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Google operates and patches the Kafka Connect workers."
