syntax = "proto3";

package dev.planton.gcp.gcpmanagedkafkaconnectcluster.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";

// GcpManagedKafkaConnectClusterCapacity sizes the Connect workers
// (`capacity_config`). Both values scale in place.
message GcpManagedKafkaConnectClusterCapacity {
  option (buf.validate.message).cel = {
    id: "capacity.memory_per_vcpu"
    expression: "this.vcpu_count < 3 || (this.memory_bytes >= this.vcpu_count * 1073741824 && this.memory_bytes <= this.vcpu_count * 8589934592)"
    message: "memory_bytes must keep a vCPU:GiB ratio between 1:1 and 1:8 (vcpu_count x 1073741824 to vcpu_count x 8589934592)"
  };

  // vCPUs for the Connect workers -- at least 3. Billed per vCPU-hour.
  // Sent as a decimal string.
  int64 vcpu_count = 1 [(buf.validate.field).int64.gte = 3];

  // Memory for the Connect workers, in BYTES as a plain number -- at least
  // 3 GiB (3221225472), at a vCPU:GiB ratio between 1:1 and 1:8. Billed per
  // GiB-hour. Sent as a decimal string.
  int64 memory_bytes = 2 [(buf.validate.field).int64.gte = 3221225472];
}

// GcpManagedKafkaConnectClusterNetworkConfig gives the Connect workers a
// Private Service Connect interface into one VPC network
// (`gcp_config.access_config.network_configs`), so connectors reach the
// Kafka cluster and the systems they move data to and from.
message GcpManagedKafkaConnectClusterNetworkConfig {
  // The subnet the workers' interface is placed in: a GcpSubnetwork
  // reference (its self link, which the modules trim to the
  // projects/{project}/regions/{region}/subnetworks/{subnet} form Google
  // requires) or a literal in either form. It must be in the Connect
  // cluster's region, and its CIDR range must be private (RFC 1918).
  dev.planton.shared.foreignkey.v1.StringValueOrRef primary_subnet = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpSubnetwork,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.subnetwork_self_link"
  ];

  // Extra DNS domains from this network the workers may resolve. For
  // MirrorMaker 2, add the target Kafka cluster's DNS domain -- the
  // bootstrap address without its leading "bootstrap." label and its port
  // (e.g. my-cluster.us-central1.managedkafka.my-project.cloud.goog).
  repeated string dns_domain_names = 2;
}

// GcpManagedKafkaConnectClusterSpec defines a Managed Service for Apache
// Kafka Connect cluster (`google_managed_kafka_connect_cluster`) -- Google-
// operated Kafka Connect workers attached to one Kafka cluster, running the
// connectors that move data between Kafka and other systems (Pub/Sub,
// BigQuery, Cloud Storage, another Kafka cluster through MirrorMaker 2).
//
// The connectors themselves are GcpManagedKafkaConnector blocks, owned by
// the teams whose data they move.
//
// Immutable: project_id, location, connect_cluster_id (a change replaces
// the Connect cluster and every connector on it). The attached Kafka
// cluster, capacity, networks, and labels update in place.
message GcpManagedKafkaConnectClusterSpec {
  // The GCP project the Connect cluster lives in: a literal project ID or
  // a GcpProject reference. If omitted, the provider's default project is
  // used.
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];

  // The region the workers run in, e.g. "us-central1". Immutable.
  string location = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.pattern = "^[a-z]+-[a-z]+[0-9]+$"
  ];

  // The Connect cluster's ID. Defaults to metadata.name. Immutable.
  string connect_cluster_id = 3;

  // The Kafka cluster the workers attach to (their internal topics and the
  // connectors' default cluster): a GcpManagedKafkaCluster reference (its
  // name output) or a literal full path
  // projects/{project}/locations/{location}/clusters/{cluster}. Mutable in
  // place.
  dev.planton.shared.foreignkey.v1.StringValueOrRef kafka_cluster = 4 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "kafka_cluster.full_path"
      expression: "!has(this.value) || this.value.matches('^projects/[^/]+/locations/[^/]+/clusters/[^/]+$')"
      message: "a literal kafka_cluster must be the full path projects/{project}/locations/{location}/clusters/{cluster}"
    },
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpManagedKafkaCluster,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.name"
  ];

  // vCPUs and memory for the workers.
  GcpManagedKafkaConnectClusterCapacity capacity_config = 5 [(buf.validate.field).required = true];

  // The VPC networks the workers reach -- at least one, at most 10.
  repeated GcpManagedKafkaConnectClusterNetworkConfig network_configs = 6 [
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.max_items = 10
  ];

  // Labels on the Connect cluster. The platform attribution labels are
  // added on top and win on a key conflict.
  map<string, string> labels = 7;

  // What happens to the Connect cluster when this resource is destroyed:
  //   "" / "DELETE" -- deleted, with its connectors
  //   "PREVENT"     -- destroy fails
  //   "ABANDON"     -- it leaves management and keeps running (and
  //                    billing) in GCP
  string deletion_policy = 8 [(buf.validate.field).cel = {
    id: "valid_deletion_policy"
    expression: "this == '' || this in ['DELETE', 'PREVENT', 'ABANDON']"
    message: "deletion_policy must be one of: DELETE, PREVENT, ABANDON"
  }];
}
