apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpmanagedkafkaconnectcluster
spec:
  # Proven live on both engines (2026-11-21), as an identity holding only this
  # kind's permissions manifest: a 3 vCPU Connect cluster on a Kafka cluster
  # fixture, its workers on the same subnet, deployed (Google took 7 to 37
  # minutes), re-planned clean, and destroyed; one more user label changed in
  # place (UpdateConnectCluster), judged from Google's Admin Activity log.
  # Deleting the Connect cluster leaves the network attachment Google made for
  # its workers on the subnet, which held it more than 25 minutes; on the
  # Terraform run that held the fixture subnet past its teardown (every phase
  # of the kind itself passed; the subnet was deleted by hand), and the
  # harness now deletes such attachments before a subnetwork's destroy, as the
  # Pulumi run shows.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 150
