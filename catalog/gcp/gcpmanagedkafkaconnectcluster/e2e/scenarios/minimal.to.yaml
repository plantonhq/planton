# The second act of minimal.yaml: the same Connect cluster with one more
# user label, a patch in place. Not a scenario of its own.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpManagedKafkaConnectCluster
metadata:
  name: planton-oss-e2e-gcpkcon-smoke
  id: planton-oss-e2e-gcpkcon-smoke
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpmanagedkafkaconnectcluster
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-second-act: minimal.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
  tags:
    - planton-e2e
spec:
  location: us-central1
  connectClusterId: e2e-connect-${E2E_RUN_ID}
  kafkaCluster:
    valueFrom:
      kind: GcpManagedKafkaCluster
      name: planton-oss-e2e-gcpkcon-kafka
      fieldPath: status.outputs.name
  capacityConfig:
    vcpuCount: 3
    memoryBytes: 3221225472
  networkConfigs:
    - primarySubnet:
        valueFrom:
          kind: GcpSubnetwork
          name: planton-oss-e2e-gcpkcon-subnet
          fieldPath: status.outputs.subnetwork_self_link
  labels:
    team: platform-e2e
    tier: e2e
  deletionPolicy: DELETE
