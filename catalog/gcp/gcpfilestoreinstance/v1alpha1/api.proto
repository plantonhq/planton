syntax = "proto3";

package dev.planton.gcp.gcpfilestoreinstance.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpfilestoreinstance/v1alpha1/outputs.proto";
import "catalog/gcp/gcpfilestoreinstance/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-filestore-instance
message GcpFilestoreInstance {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'GcpFilestoreInstance'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  GcpFilestoreInstanceSpec spec = 4 [(buf.validate.field).required = true];

  //status
  GcpFilestoreInstanceStatus status = 5;
}

//gcp-filestore-instance status
message GcpFilestoreInstanceStatus {
  //outputs
  GcpFilestoreInstanceOutputs outputs = 1;
}
