# Consumer-scoped GcpPrivateCaCertificateAuthority install profile for the
# gcpcmic chain: the enabled self-signed root the pool needs before it can
# issue. Deletion protection off, skip_grace_period, and
# ignore_active_certificates_on_deletion let teardown delete it at once so
# the pool can go too.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpPrivateCaCertificateAuthority
metadata:
  name: planton-oss-e2e-gcpcmic-root
  id: planton-oss-e2e-gcpcmic-root
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpprivatecacertificateauthority
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  location: us-central1
  pool:
    valueFrom:
      kind: GcpPrivateCaPool
      name: planton-oss-e2e-gcpcmic-pool
      fieldPath: status.outputs.name
  certificateAuthorityId: e2e-gcpcmic-root-${E2E_RUN_ID}
  type: SELF_SIGNED
  config:
    subjectConfig:
      subject:
        commonName: Planton E2E Issuance Root
        organization: Planton
    x509Config:
      caOptions:
        isCa: true
      keyUsage:
        baseKeyUsage:
          certSign: true
          crlSign: true
  keySpec:
    algorithm: EC_P256_SHA256
  lifetime: 2592000s
  deletionProtection: false
  skipGracePeriod: true
  ignoreActiveCertificatesOnDeletion: true
