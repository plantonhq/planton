# Consumer-scoped GcpPrivateCaPool install profile for the gcpcmic chain: a
# DevOps pool the issuance config names. The cloud-side ID carries the run
# id; metadata.name stays fixed for reference resolution.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpPrivateCaPool
metadata:
  name: planton-oss-e2e-gcpcmic-pool
  id: planton-oss-e2e-gcpcmic-pool
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpprivatecapool
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  location: us-central1
  caPoolId: e2e-gcpcmic-pool-${E2E_RUN_ID}
  tier: DEVOPS
