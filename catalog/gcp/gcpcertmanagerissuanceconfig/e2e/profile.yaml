apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpcertmanagerissuanceconfig
spec:
  # Proven live on both engines (2026-11-23): a global issuance config naming
  # a DevOps-tier pool that holds a self-signed root authority, as the
  # declared identity. Google accepts a DevOps pool. What the runs taught:
  # the module must create the Certificate Manager service agent and grant it
  # certificate requester on the pool before the config; the creator itself
  # needs privateca.caPools.use on the pool, and without it Google answers
  # only "Config validation failed"; and neither provider updates a config in
  # place, so the second act's label change is judged as the replacement it
  # is. The config is free; the authority bills only for the minutes the run
  # holds it, and no certificate is issued.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 25
