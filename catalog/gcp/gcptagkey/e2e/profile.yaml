apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcptagkey
spec:
  # Proven live on both engines (2026-11-18) on the PROJECT-owned arm, each
  # scenario deployed, updated in place and destroyed by an identity holding
  # only this kind's permissions manifest. Measured: (1) a project ID literal
  # parent re-plans clean (the provider's project-number diff suppression);
  # (2) the provider's `name` attribute is the bare number Google generated,
  # and the resource name is its id, so the modules export the id as `name`;
  # (3) the run id suffix keeps clear of the 30-day short-name reservation.
  # The organization-owned arm (and purpose / purpose_data, which need a VPC
  # and an organization) stays offline-only until an organization-scoped test
  # identity exists.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
