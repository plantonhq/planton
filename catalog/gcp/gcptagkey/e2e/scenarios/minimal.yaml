# Minimal GcpTagKey scenario: a PROJECT-owned key in the harness project --
# the shape that proves live with only roles/resourcemanager.tagAdmin on the
# project (an organization-owned key needs the organization identity). The
# short name carries the run id: a deleted key's name is reserved under its
# owner for 30 days.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpTagKey
metadata:
  name: planton-oss-e2e-gcptagk-minimal
  id: planton-oss-e2e-gcptagk-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: gcptagkey
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  parent:
    projectId:
      value: ${E2E_ENV:PLANTON_E2E_GCP_PROJECT_ID}
  shortName: planton-e2e-min-${E2E_RUN_ID}
