syntax = "proto3";

package dev.planton.gcp.gcptagkey.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcptagkey/v1alpha1/outputs.proto";
import "catalog/gcp/gcptagkey/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-tag-key
message GcpTagKey {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpTagKey'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpTagKeySpec spec = 4 [(buf.validate.field).required = true];
  GcpTagKeyStatus status = 5;
}

message GcpTagKeyStatus {
  GcpTagKeyStackOutputs outputs = 1;
}
