syntax = "proto3";

package dev.planton.gcp.gcpbillingbudget.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpbillingbudget/v1alpha1/outputs.proto";
import "catalog/gcp/gcpbillingbudget/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-billing-budget
message GcpBillingBudget {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpBillingBudget'];
  dev.planton.shared.CloudResourceMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpBillingBudgetSpec spec = 4 [(buf.validate.field).required = true];
  GcpBillingBudgetStatus status = 5;
}

message GcpBillingBudgetStatus {
  GcpBillingBudgetStackOutputs outputs = 1;
}
