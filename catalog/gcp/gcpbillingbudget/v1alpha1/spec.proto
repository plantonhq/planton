syntax = "proto3";

package dev.planton.gcp.gcpbillingbudget.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// GcpBillingBudgetSpecifiedAmount is a fixed budget amount in a currency.
message GcpBillingBudgetSpecifiedAmount {
  // The 3-letter ISO 4217 currency code. Must match the billing account's
  // currency; unset takes the account's currency.
  string currency_code = 1 [(buf.validate.field).cel = {
    id: "valid_currency_code"
    message: "currency_code must be a 3-letter ISO 4217 code such as USD"
    expression: "this == '' || this.matches('^[A-Z]{3}$')"
  }];

  // The whole units of the amount, e.g. 1000 for $1,000 when the currency is
  // USD. 0 with a non-zero nanos is a sub-unit budget.
  int64 units = 2 [(buf.validate.field).int64.gte = 0];

  // Fractional part of the amount in nano units (10^-9), 0 to 999,999,999.
  // 750,000,000 with units 1 is 1.75 in the currency.
  int32 nanos = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 999999999
  }];
}

// GcpBillingBudgetAmount sets the budgeted spend: exactly one of a fixed
// specified_amount or last_period_amount (the previous calendar period's
// actual spend, for a "no worse than last month" guardrail).
message GcpBillingBudgetAmount {
  option (buf.validate.message).cel = {
    id: "amount_exactly_one"
    message: "exactly one of specified_amount or last_period_amount sets the budget"
    expression: "has(this.specified_amount) != this.last_period_amount"
  };

  // A fixed amount in the billing account's currency.
  GcpBillingBudgetSpecifiedAmount specified_amount = 1;

  // Budget the previous calendar period's spend: the budget for this period
  // is what was spent last period. Only with a calendar_period filter,
  // never with a custom_period.
  bool last_period_amount = 2;
}

// GcpBillingBudgetThresholdRule fires a notification when spend crosses a
// share of the budget. Rules are independent; declare several to alert at
// 50%, 90%, and 100%.
message GcpBillingBudgetThresholdRule {
  // The share of the budget that triggers the alert, as a 1.0-based
  // fraction: 0.5 is 50%, 1.0 is 100%, 1.2 is 120% (over budget). Must be
  // greater than 0.
  double threshold_percent = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).double.gt = 0
  ];

  // What the threshold is compared against: CURRENT_SPEND (actual spend so
  // far, the default) or FORECASTED_SPEND (Google's projection of the
  // period's total, which alerts before the money is spent).
  optional string spend_basis = 2 [
    (dev.planton.shared.options.default) = "CURRENT_SPEND",
    (buf.validate.field).cel = {
      id: "valid_spend_basis"
      message: "spend_basis must be CURRENT_SPEND or FORECASTED_SPEND"
      expression: "this == '' || this in ['CURRENT_SPEND', 'FORECASTED_SPEND']"
    }
  ];
}

// GcpBillingBudgetDate is a calendar date for a custom budget period.
message GcpBillingBudgetDate {
  int32 year = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 9999
    }
  ];
  int32 month = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 12
    }
  ];
  int32 day = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).int32 = {
      gte: 1
      lte: 31
    }
  ];
}

// GcpBillingBudgetCustomPeriod is a fixed date range the budget tracks
// instead of a recurring calendar period -- a project's runway, a
// migration window. end_date unset means the budget runs open-ended from
// start_date.
message GcpBillingBudgetCustomPeriod {
  GcpBillingBudgetDate start_date = 1 [(buf.validate.field).required = true];
  GcpBillingBudgetDate end_date = 2;
}

// GcpBillingBudgetFilter narrows which spend the budget counts. Every
// filter is optional; an omitted filter includes everything the billing
// account pays for. Filters combine with AND.
message GcpBillingBudgetFilter {
  option (buf.validate.message).cel = {
    id: "period_exactly_one_or_none"
    message: "calendar_period and custom_period are alternatives; set at most one"
    expression: "!(this.calendar_period != '' && has(this.custom_period))"
  };
  option (buf.validate.message).cel = {
    id: "credit_types_need_specified_treatment"
    message: "credit_types applies only with credit_types_treatment INCLUDE_SPECIFIED_CREDITS"
    expression: "this.credit_types.size() == 0 || this.credit_types_treatment == 'INCLUDE_SPECIFIED_CREDITS'"
  };

  // Only usage from these projects counts: GcpProject references (resolved
  // to project numbers) or `projects/{number}` literals. Omitted means every
  // project the billing account pays for.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef projects = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_number",
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true
  ];

  // Only usage under these folders or organizations counts: GcpFolder
  // references (resolved to `folders/{id}`) or `organizations/{id}`
  // literals.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef resource_ancestors = 2 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpFolder,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.name",
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true
  ];

  // Only usage of these services counts, as `services/{service_id}` (the
  // id from the Cloud Billing catalog, e.g. services/6F81-5844-456A for
  // Compute Engine). Unset sends nothing.
  repeated string services = 3;

  // Only usage from these subaccounts counts, as
  // `billingAccounts/{account_id}`; naming the parent account includes
  // usage from the parent and every subaccount.
  repeated string subaccounts = 4;

  // Only usage carrying this label counts. One key with one value (the API
  // accepts a single pair). Unset sends nothing.
  map<string, string> labels = 5 [(buf.validate.field).map.max_pairs = 1];

  // How credits count against the budget: INCLUDE_ALL_CREDITS (the
  // default -- spend net of every credit), EXCLUDE_ALL_CREDITS (gross
  // spend), INCLUDE_SPECIFIED_CREDITS (net of the credit_types listed).
  optional string credit_types_treatment = 6 [
    (dev.planton.shared.options.default) = "INCLUDE_ALL_CREDITS",
    (buf.validate.field).cel = {
      id: "valid_credit_types_treatment"
      message: "credit_types_treatment must be INCLUDE_ALL_CREDITS, EXCLUDE_ALL_CREDITS, or INCLUDE_SPECIFIED_CREDITS"
      expression: "this == '' || this in ['INCLUDE_ALL_CREDITS', 'EXCLUDE_ALL_CREDITS', 'INCLUDE_SPECIFIED_CREDITS']"
    }
  ];

  // The credit types subtracted under INCLUDE_SPECIFIED_CREDITS, e.g.
  // COMMITTED_USAGE_DISCOUNT, SUSTAINED_USAGE_DISCOUNT, PROMOTION,
  // FREE_TIER.
  repeated string credit_types = 7;

  // The recurring period the budget resets on: MONTH (the default when
  // neither period is set), QUARTER, or YEAR. Alternative to custom_period.
  string calendar_period = 8 [(buf.validate.field).cel = {
    id: "valid_calendar_period"
    message: "calendar_period must be MONTH, QUARTER, or YEAR"
    expression: "this == '' || this in ['MONTH', 'QUARTER', 'YEAR']"
  }];

  // A fixed date range instead of a recurring period. Alternative to
  // calendar_period; incompatible with last_period_amount.
  GcpBillingBudgetCustomPeriod custom_period = 9;
}

// GcpBillingBudgetNotifications says where threshold alerts go beyond the
// default email to billing administrators: a Pub/Sub topic for automation
// (a Cloud Function that caps spend, a Slack bridge) and Cloud Monitoring
// notification channels for people. At least one of the two when the
// block is present.
message GcpBillingBudgetNotifications {
  option (buf.validate.message).cel = {
    id: "notifications_at_least_one"
    message: "set pubsub_topic, monitoring_notification_channels, or both"
    expression: "(has(this.pubsub_topic) && (this.pubsub_topic.value != '' || has(this.pubsub_topic.value_from))) || this.monitoring_notification_channels.size() > 0"
  };

  // The Pub/Sub topic budget notifications are published to (the full
  // budget state on every update, as JSON): a GcpPubSubTopic reference or
  // `projects/{project}/topics/{topic}`. The Billing service agent must be
  // a publisher on it.
  dev.planton.shared.foreignkey.v1.StringValueOrRef pubsub_topic = 1 [
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpPubSubTopic,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.topic_id"
  ];

  // Cloud Monitoring notification channels (email, SMS, Slack, PagerDuty)
  // that receive threshold alerts: GcpMonitoringNotificationChannel
  // references or `projects/{project}/notificationChannels/{id}`. Up to 5.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef monitoring_notification_channels = 2 [
    (buf.validate.field).repeated.max_items = 5,
    (dev.planton.shared.foreignkey.v1.default_kind) = GcpMonitoringNotificationChannel,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.channel_name"
  ];

  // Stop the default emails to the billing account's administrators and
  // users; only the channels above are notified.
  bool disable_default_iam_recipients = 3;

  // Also email the owners of the projects the budget filters on (only
  // with a single-project filter).
  bool enable_project_level_recipients = 4;

  // The JSON schema version of the Pub/Sub notification. Only "1.0"
  // exists; sent as such.
  optional string schema_version = 5 [
    (dev.planton.shared.options.default) = "1.0",
    (buf.validate.field).cel = {
      id: "valid_schema_version"
      message: "schema_version must be 1.0"
      expression: "this == '' || this == '1.0'"
    }
  ];
}

// GcpBillingBudgetSpec sets a spending guardrail on a Cloud Billing
// account: a budgeted amount for a period, the projects, folders, services,
// or labels the spend is measured over, the thresholds that alert, and
// where the alerts go. A budget never stops spending by itself -- it
// notifies; a Pub/Sub notification into a Cloud Function is how teams cap
// spend automatically. Declare one budget per project or environment for
// the per-team guardrail pattern, or one unfiltered budget per billing
// account for the whole bill.
//
// The budget lives on the billing account, not in a project, so the
// principal needs roles/billing.costsManager (or billing.admin) on the
// account. Everything but the billing account changes in place.
message GcpBillingBudgetSpec {
  option (buf.validate.message).cel = {
    id: "last_period_amount_needs_calendar_period"
    message: "last_period_amount budgets the previous calendar period, so the filter must not set custom_period"
    expression: "!this.amount.last_period_amount || !has(this.budget_filter) || !has(this.budget_filter.custom_period)"
  };

  // The Cloud Billing account the budget belongs to, as its ID
  // (`012345-6789AB-CDEF01`) or `billingAccounts/{id}`. Required; the
  // module normalizes to the resource name. Immutable.
  string billing_account = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "valid_billing_account"
      message: "billing_account must be a billing account ID such as 012345-6789AB-CDEF01, optionally prefixed with billingAccounts/"
      expression: "this.matches('^(billingAccounts/)?[A-Z0-9]{6}-[A-Z0-9]{6}-[A-Z0-9]{6}$')"
    }
  ];

  // Name shown in the Cloud Billing console, up to 60 characters. Defaults
  // to metadata.name.
  string display_name = 2 [(buf.validate.field).string.max_len = 60];

  // The budgeted amount: a fixed amount or last period's spend. Required.
  GcpBillingBudgetAmount amount = 3 [(buf.validate.field).required = true];

  // Which spend the budget counts. Omit to count everything the billing
  // account pays for, reset monthly.
  GcpBillingBudgetFilter budget_filter = 4;

  // The thresholds that alert, each a share of the budget against current
  // or forecasted spend. Omit for a budget that only reports.
  repeated GcpBillingBudgetThresholdRule threshold_rules = 5;

  // Where alerts go beyond the default administrator emails.
  GcpBillingBudgetNotifications notifications = 6;

  // Who may read the budget's data: ALL_USERS (anyone with billing.budgets
  // permissions on the account) or BILLING_ACCOUNT (only billing account
  // administrators). Unset lets Google apply its default.
  string ownership_scope = 7 [(buf.validate.field).cel = {
    id: "valid_ownership_scope"
    message: "ownership_scope must be ALL_USERS or BILLING_ACCOUNT"
    expression: "this == '' || this in ['ALL_USERS', 'BILLING_ACCOUNT']"
  }];

  // What destroy does to the budget:
  //   ""        -- same as "DELETE" (provider default)
  //   "DELETE"  -- the budget and its alerts are deleted
  //   "PREVENT" -- destroy FAILS; keeps a guardrail production spend
  //                depends on
  //   "ABANDON" -- the budget leaves management but keeps alerting
  string deletion_policy = 8 [(buf.validate.field).cel = {
    id: "valid_deletion_policy"
    message: "deletion_policy must be one of: DELETE, PREVENT, ABANDON"
    expression: "this == '' || this in ['DELETE', 'PREVENT', 'ABANDON']"
  }];
}
