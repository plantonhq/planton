# Provider-parity manifest: this kind's recorded judgment against the pinned
# google provider (checked by `planton provider-parity --check` and the
# lint.provider-parity CI lane; format documented in pkg/providerparity).
#
# Only divergences are recorded -- an argument absent from this file must
# match its spec field by exact name. Every exclusion carries its reason:
# omission is a decision, never an accident.

resources:
  google_billing_budget:
    mappings:
      # The spec names the notification block for what it is; the provider
      # inherits the API's all_updates_rule. Matching resumes name-for-name
      # below the subtree.
      - spec: spec.notifications
        arg: all_updates_rule

specExclusions:
  - field: spec.quota_project_id
    reason: >-
      configures the provider block, not the budget: it becomes the provider's
      billing_project with user_project_override, the quota project every
      Budget API call is billed to under a person's own credential
      (catalog/gcp/provider-config-parity.yaml lists billing_project as
      module-owned).
