apiVersion: qa.planton.dev/v1
kind: CatalogKindE2EProfile
metadata:
  name: gcpfolder
spec:
  # A folder exists only inside a Google Cloud Organization. Proven live on
  # both engines (2026-11-23, test organization planton-e2e.com) as the
  # declared identity, which the harness grants the manifest's folder
  # permissions in a custom role on the organization: a folder under the
  # organization and a folder nested in a folder fixture. Each second act
  # renames the folder, judged in place from the organization's and the
  # folder's Admin Activity logs (UpdateFolder). Destroy leaves the folder
  # DELETE_REQUESTED, which the verifier reads as gone; Google deletes a parent
  # folder whose child folder is pending deletion. Every E2E manifest sets
  # deletion_protection: false so the harness destroy succeeds, and display
  # names carry the run id (30-day reservation).
  tier: 2
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
