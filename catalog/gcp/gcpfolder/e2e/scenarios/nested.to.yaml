# The second act of nested.yaml: the same nested folder renamed, updated in
# place. Not a scenario of its own (the second-act annotation keeps
# discovery from running it as a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpFolder
metadata:
  name: planton-oss-e2e-gcpfldr-nested
  id: planton-oss-e2e-gcpfldr-nested
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpfolder
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-second-act: nested.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
    planton.dev/e2e-required-env: PLANTON_E2E_GCP_ORGANIZATION_ID
    planton.dev/e2e-prerequisites: "catalog/gcp/gcpfolder/e2e/prerequisite.yaml" # the parent folder; by path, since a kind is never its own prerequisite by name
  tags:
    - planton-e2e
spec:
  parent:
    folderId:
      valueFrom:
        kind: GcpFolder
        name: planton-oss-e2e-gcpfldr-prereq
        fieldPath: status.outputs.folder_id
  displayName: planton-e2e-nested2-${E2E_RUN_ID}
  deletionProtection: false
  deletionPolicy: DELETE
