# The second act of minimal.yaml: the same folder renamed, updated in place.
# The new display name carries the run id too. Not a scenario of its own
# (the second-act annotation keeps discovery from running it as a lane).
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpFolder
metadata:
  name: planton-oss-e2e-gcpfldr-minimal
  id: planton-oss-e2e-gcpfldr-minimal
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpfolder
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-identity: declared # the kind runs as exactly what its permissions manifest grants
    planton.dev/e2e-second-act: minimal.yaml
    planton.dev/e2e-expect-upgrade: in-place # judged from Google's audit log
    planton.dev/e2e-required-env: PLANTON_E2E_GCP_ORGANIZATION_ID
  tags:
    - planton-e2e
spec:
  parent:
    organizationId: ${E2E_ENV:PLANTON_E2E_GCP_ORGANIZATION_ID}
  displayName: planton-e2e-min2-${E2E_RUN_ID}
  deletionProtection: false
