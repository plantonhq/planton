# GcpCloudSchedulerJob scenario: an OIDC-authenticated HTTP target composed
# on the GcpServiceAccount prerequisite — the live proof of the token's
# service-account FK resolution plus the full HTTP surface (method, body,
# headers, attempt deadline). The target URL does not need to exist: the
# Scheduler API validates the job definition, not the endpoint, and the
# schedule never fires within the scenario's lifetime.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpCloudSchedulerJob
metadata:
  name: planton-oss-e2e-gcpcsj-http
  id: planton-oss-e2e-gcpcsj-http
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: gcpcloudschedulerjob
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  jobName: e2e-csj-http-${E2E_RUN_ID}
  location: us-central1
  # Yearly at midnight Jan 1 — guaranteed not to fire during the scenario.
  schedule: "0 0 1 1 *"
  timeZone: Etc/UTC
  description: E2E http-target scheduler job
  attemptDeadline: "600s"
  httpTarget:
    uri: https://e2e-target.example.com/api/trigger
    httpMethod: POST
    # Base64 of {"source":"e2e"}.
    body: eyJzb3VyY2UiOiJlMmUifQ==
    headers:
      Content-Type: application/json
    oidcToken:
      serviceAccountEmail:
        valueFrom:
          kind: GcpServiceAccount
          name: planton-oss-e2e-gsa-prereq
          fieldPath: status.outputs.email
      audience: https://e2e-target.example.com
  retryConfig:
    retryCount: 2
    minBackoffDuration: "5s"
    maxBackoffDuration: "300s"
    maxDoublings: 2
  # Destroy really destroys in E2E: the live lanes prove the full lifecycle.
  deletionPolicy: DELETE
