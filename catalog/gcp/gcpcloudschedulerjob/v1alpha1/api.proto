syntax = "proto3";

package dev.planton.gcp.gcpcloudschedulerjob.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/gcp/gcpcloudschedulerjob/v1alpha1/outputs.proto";
import "catalog/gcp/gcpcloudschedulerjob/v1alpha1/spec.proto";
import "shared/metadata.proto";

//gcp-cloud-scheduler-job
message GcpCloudSchedulerJob {
  string api_version = 1 [(buf.validate.field).string.const = 'gcp.planton.dev/v1alpha1'];
  string kind = 2 [(buf.validate.field).string.const = 'GcpCloudSchedulerJob'];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  GcpCloudSchedulerJobSpec spec = 4 [(buf.validate.field).required = true];
  GcpCloudSchedulerJobStatus status = 5;
}

message GcpCloudSchedulerJobStatus {
  GcpCloudSchedulerJobOutputs outputs = 1;
}
