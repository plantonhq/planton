syntax = "proto3";

package dev.planton.digitalocean.digitaloceandatabasefirewall.v1alpha1;

import "buf/validate/validate.proto";
import "shared/foreignkey/v1/foreign_key.proto";

// DigitalOceanDatabaseFirewallSpec models the full
// digitalocean_database_firewall resource surface: the inbound trusted
// sources of a DigitalOcean managed database cluster.
//
// DigitalOcean's API takes one polymorphic rule list of {type, value}
// rows; this spec replaces it with one TYPED list per source kind, so a
// value can never be paired with the wrong type and resources are wired by
// reference instead of hand-copied ids. The modules fan the lists back out
// to the provider's rows.
//
// The rule set is a PROPERTY of the cluster, not a standalone object:
// there is at most one per cluster (declare all trusted sources in one
// resource -- two resources on one cluster overwrite each other), every
// update replaces the full set, and "destroy" clears the set (an empty
// rule list), after which the cluster accepts connections from anywhere
// again -- destroying the firewall OPENS the database, a fact the
// verification tooling asserts as an empty rule list rather than a
// deleted object.
message DigitalOceanDatabaseFirewallSpec {
  // The provider requires at least one rule row; an empty set is rejected
  // at plan time upstream, so it is rejected at validation time here.
  option (buf.validate.message).cel = {
    id: "spec.at_least_one_rule"
    message: "at least one trusted source (ip_rules, droplet_ids, kubernetes_cluster_ids, app_ids, or tags) must be specified"
    expression: "size(this.ip_rules) > 0 || size(this.droplet_ids) > 0 || size(this.kubernetes_cluster_ids) > 0 || size(this.app_ids) > 0 || size(this.tags) > 0"
  };

  // The database cluster whose inbound sources these rules define. Use a
  // literal cluster UUID or a reference to a DigitalOceanDatabaseCluster
  // resource. Changing it moves the rule set to another cluster (replace).
  //
  // A read replica is its own cluster to DigitalOcean with its own
  // trusted-sources list, which starts EMPTY -- the primary's rules never
  // reach it. Protect a replica with a second firewall resource whose
  // cluster points at the replica: `valueFrom` with
  // `kind: DigitalOceanDatabaseReplica` and
  // `fieldPath: status.outputs.replica_id`, or its UUID as a literal.
  dev.planton.shared.foreignkey.v1.StringValueOrRef cluster = 1 [
    (buf.validate.field).required = true,
    (dev.planton.shared.foreignkey.v1.default_kind) = DigitalOceanDatabaseCluster,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.cluster_id"
  ];

  // (Optional) IPv4 addresses or IPv4 CIDR blocks trusted to reach the
  // cluster. IPv4 ONLY: DigitalOcean's database firewall rejects every IPv6
  // shape at apply (`422 invalid rule with type IP_ADDR because: invalid ip
  // format`, measured 2026-09-17 for both an address and a /32 prefix), so
  // the rule below refuses IPv6 at validation instead. A bare address and
  // its /32 form are both accepted and read back exactly as sent.
  repeated string ip_rules = 2 [(buf.validate.field).repeated.items.cel = {
    id: "ipv4_or_cidr"
    message: "must be an IPv4 address or IPv4 CIDR block (DigitalOcean database firewalls do not accept IPv6)"
    expression: "this.isIp(4) || this.isIpPrefix(4)"
  }];

  // (Optional) Droplets trusted to reach the cluster, as literal numeric
  // Droplet IDs or references to DigitalOceanDroplet resources.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef droplet_ids = 3 [
    (dev.planton.shared.foreignkey.v1.default_kind) = DigitalOceanDroplet,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.droplet_id"
  ];

  // (Optional) Kubernetes clusters trusted to reach the cluster, as
  // literal cluster UUIDs or references to DigitalOceanKubernetesCluster
  // resources.
  //
  // Containment-exempt: this is the database cluster's inbound trusted-
  // sources list; a Kubernetes cluster named here is a client the database
  // ADMITS, never the place the rule set lives. On a diagram the rule set
  // stays with its database cluster, with a line to each trusted cluster.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef kubernetes_cluster_ids = 4 [
    (dev.planton.shared.foreignkey.v1.default_kind) = DigitalOceanKubernetesCluster,
    (dev.planton.shared.foreignkey.v1.containment_exempt) = true,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.cluster_id"
  ];

  // (Optional) App Platform apps trusted to reach the cluster, as literal
  // app UUIDs or references to DigitalOceanApp resources.
  repeated dev.planton.shared.foreignkey.v1.StringValueOrRef app_ids = 5 [
    (dev.planton.shared.foreignkey.v1.default_kind) = DigitalOceanApp,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.app_id"
  ];

  // (Optional) Droplet tags trusted to reach the cluster: every Droplet
  // carrying a listed tag is trusted, and membership tracks the tag
  // automatically -- prefer tags over droplet_ids for dynamic fleets.
  repeated string tags = 6 [(buf.validate.field).repeated.items.string.pattern = "^[a-zA-Z0-9:\\-_]{1,255}$"];
}
