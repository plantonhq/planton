apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: digitaloceandatabasefirewall
spec:
  # Live-proven on BOTH engines, both scenarios, full lifecycle under the
  # idempotency gate, plus the blind import round-trip on every Terraform
  # lane (the BARE `{cluster_id}` -- the provider mints a random state id,
  # which is never compared; lossless on both scenarios). TWO scenarios on
  # the PostgreSQL cluster registry prerequisite (`planton-oss-e2e-dodb-min`):
  # `minimal` proves the ip_addr fan-out across the shapes DigitalOcean
  # accepts -- a plain IPv4, a /16 and a /24 CIDR -- AND the kind's unusual
  # destroy contract (the verifier asserts an EMPTY live rule list after
  # destroy -- delete is a PUT of an empty set, and the cluster then accepts
  # connections from anywhere); `full` proves droplet targeting through the
  # droplet_ids REFERENCE (the Droplet fixture rides the scenario
  # annotation, installing from that kind's minimal scenario beside the
  # cluster; the live rule list carried the fixture's id).
  #
  # Live-caught 2026-09-17 and fixed at the spec: DigitalOcean's database
  # firewall accepts IPv4 ONLY -- an IPv6 address and an IPv6 prefix both
  # answer `422 invalid rule with type IP_ADDR because: invalid ip format`
  # (the first minimal lane failed at DEPLOY on the IPv6 rule the scenario
  # carried), so `ipRules` now rejects IPv6 at validation. A bare IPv4 and
  # its /32 form are both accepted and read back exactly as written.
  # Measured the same day on a probe primary and its replica: a read
  # replica is its own cluster with its own, initially EMPTY firewall --
  # the primary's rules do not reach it; a rule PUT on the replica's UUID
  # lands on the replica alone. The kind's docs teach a second firewall
  # per replica with `cluster` pointing at the replica's `replica_id`; that
  # composition is measured by API, not yet by a lane (a replica fixture is
  # a second cluster-sized create -- run it when a session pays for one).
  #
  # Deliberately not in the live lanes: tag rules (a firewall tag rule must
  # name a tag a Droplet already carries -- the network firewall precedent;
  # prove with the Droplet fixture's identity tag when a session takes the
  # arm), kubernetes_cluster_ids (needs the ~5-min DOKS fixture), app_ids
  # (needs an App Platform fixture) -- all three are the SAME fan-out code
  # path the ip/droplet lanes prove. Firewall operations are 2-7 s; the
  # cluster fixture (4m30s-5m16s, ~$0.02/hour) plus the full lane's droplet
  # (~40 s, ~$0.009/hour) dominate; DEPENDENCIES-DOWN with the droplet is
  # ~40 s.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 35
