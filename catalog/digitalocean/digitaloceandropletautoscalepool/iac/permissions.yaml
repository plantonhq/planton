# Least-privilege permissions the IaC runner's DigitalOcean credential
# needs to provision, update, and destroy this component with the official
# modules. DigitalOcean authenticates with a bearer API token carrying
# named scopes; every group entry is `derived` (static analysis of the
# module sources, cited in notes) until the live capture lane upgrades it
# to `proven`. Schema: iac/componentpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: ComponentPermissions
metadata:
  name: digitaloceandropletautoscalepool
spec:
  digital_ocean:
    groups:
      - purpose: ManageAutoscalePool
        scopes:
          - droplet:read
          - droplet:create
          - droplet:update
          - droplet:delete
        provenance: derived
        notes: Covers digitalocean_droplet_autoscale's create/read/update/delete/import paths, both waiters included -- read the pool and list its members via GET /v2/droplets/autoscale/{id} and .../members (the create/delete waiters poll both) (droplet:read), create the pool via POST /v2/droplets/autoscale (droplet:create), update name/config/template via PUT /v2/droplets/autoscale/{id} (droplet:update), and delete the pool AND its member droplets via DELETE /v2/droplets/autoscale/{id}/dangerous (droplet:delete). A full-access token also works; it is never least-privilege.
      - purpose: ResolveSshKeys
        scopes:
          - ssh_key:read
        provenance: derived
        notes: The template names SSH keys members boot with.
      - purpose: ResolveVpc
        scopes:
          - vpc:read
        provenance: derived
        notes: Needed only when the template pins a VPC.
      - purpose: ResolveProject
        scopes:
          - project:read
        provenance: derived
        notes: Needed only when the template pins a project.
