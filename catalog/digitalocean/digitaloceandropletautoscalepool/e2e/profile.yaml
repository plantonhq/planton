apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: digitaloceandropletautoscalepool
spec:
  # pending_proof: the kind is NOT proven, blocked by an UPSTREAM PROVIDER
  # DEFECT on destroy (first live attempt 2026-09-16, provider v2.100.1 /
  # Pulumi bridge v4.79.1). Everything before destroy passed on BOTH engines
  # and BOTH scenarios: DEPLOY (~31-41s; DigitalOcean reports the pool
  # active at +1s and the member droplet active at ~+33s), the idempotency
  # gate (Terraform's refreshed plan clean -- the template's vpc_uuid is
  # sent explicitly because DigitalOcean fills the region's default VPC
  # when it is unset and reads it back, and the provider's field is
  # Optional but not Computed), VERIFY-RES (live status active AND at least
  # one member, each member active), and the Terraform blind import
  # round-trip (the one tolerated update is the declared
  # droplet_template.image slug-to-numeric-id normalization; re-sending
  # the identical slug is a no-op on DigitalOcean's side -- measured: no
  # member roll, no history event).
  # THE DEFECT: `digitalocean_droplet_autoscale`'s delete waiter accepts
  # only "OK" -> "Not Found", but after the dangerous DELETE the API
  # reports the pool `deleting` for several seconds while it terminates the
  # members, and the provider's refresh returns that status verbatim, so
  # every destroy fails `unexpected state 'deleting', wanted target 'Not
  # Found'` 5-6 seconds in (4 of 4 lanes). DigitalOcean completes the
  # deletion anyway (pool and member both 404 within ~10 seconds); the
  # engine is left holding a resource that no longer exists. Terraform
  # recovers on the next destroy (refresh reads 404 and drops it); Pulumi
  # needs `pulumi refresh` first, because a second Delete on a gone pool
  # answers 404 and the provider errors on that too. The one-line upstream
  # fix is to treat `deleting` (any non-404 status) as a pending state in
  # the delete waiter.
  # RE-MEASURED 2026-09-19 on Terraform at provider v2.101.1 (the newest
  # release; bridge v4.80.1 embeds the same commit): identical failure 7
  # seconds in after DEPLOY 26s, IDEMPOTENCY, VERIFY-RES, and the blind
  # round-trip all passed; the pool and its member 404'd ~70 seconds after
  # the DELETE this time (four earlier lanes: ~10 seconds), so the deletion
  # itself is variable and can approach the waiter's one-minute timeout.
  # The waiter's source is unchanged on upstream main; the defect is
  # tracked upstream as digitalocean/terraform-provider-digitalocean#1605.
  # UNBLOCK: a provider release carrying that fix AND a Pulumi bridge that
  # embeds it, then the pin bump; re-run the four lanes.
  # Watch items still standing: the dynamic lane's scale-up needs sustained
  # load (observation, not assertion). Deferred arms (no runner update
  # phase): template and scaling edits, in-place upstream. BILLING: each
  # lane runs one real s-1vcpu-1gb member (~$0.009/hr) for ~1-2 minutes.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 20
