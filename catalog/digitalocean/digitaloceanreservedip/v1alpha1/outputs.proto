syntax = "proto3";

package dev.planton.digitalocean.digitaloceanreservedip.v1alpha1;

// DigitalOceanReservedIpOutputs captures the key outputs after
// reserving an IP address. The address itself is the resource's API
// identity (there is no separate reserved-IP id).
message DigitalOceanReservedIpOutputs {
  // The reserved IP address (IPv4 or IPv6 per the spec's ip_version). This
  // IS the resource identity: imports, lookups, and assignments all address
  // the reservation by this value.
  string reserved_ip_address = 1;

  // The uniform resource name of the reservation (e.g.
  // "do:reservedip:203.0.113.10" or "do:reservedipv6:2001:db8::1"), as
  // used by DigitalOcean project membership.
  string urn = 2;
}
