# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: digitaloceanreservedip
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: An IP reservation stores no data.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No data at rest (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: The reservation itself serves no traffic; transport security is the posture of whatever droplet the address points at.
    - control_id: no-public-access
      status: not_applicable
      notes: A reserved IP is BY DEFINITION a public address -- that is the product. What it exposes is decided by the assigned droplet's own firewalling (the DigitalOceanFirewall kind), not by this resource.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No filtering surface of its own; ingress control belongs to the assigned droplet's firewall (see no-public-access).
    - control_id: edge-protection
      status: not_applicable
      notes: No HTTP edge; the address forwards at the network layer.
    - control_id: rbac
      status: not_applicable
      notes: Reserved IPs carry no permission model; API-token scopes govern who can manage them.
    - control_id: workload-identity
      status: not_applicable
      notes: No identity surface.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication surface.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: DigitalOcean exposes no per-reservation audit surface; account-level activity appears in the DigitalOcean team audit history.
    - control_id: monitoring-integration
      status: not_applicable
      notes: Reservations emit no metrics; traffic metrics belong to the assigned droplet.
    - control_id: backup-recovery
      status: not_applicable
      notes: "Nothing to back up -- but note the address itself is NOT recoverable: destroying the reservation releases the address permanently, and a recreated reservation gets a DIFFERENT address (documented in the GUIDE)."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backup surface (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: A reserved IP is a single regional address. It is itself an HA BUILDING BLOCK -- re-pointing the address between droplets is the manual-failover primitive -- but the resource has no redundancy posture of its own.
    - control_id: deletion-protection
      status: not_applicable
      notes: DigitalOcean offers no deletion-protection flag for reserved IPs; deletion releases the address permanently.
    - control_id: managed-patching
      status: not_applicable
      notes: Nothing to patch; an address runs no software.
