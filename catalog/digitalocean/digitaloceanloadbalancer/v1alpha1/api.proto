syntax = "proto3";

package dev.planton.digitalocean.digitaloceanloadbalancer.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/digitalocean/digitaloceanloadbalancer/v1alpha1/outputs.proto";
import "catalog/digitalocean/digitaloceanloadbalancer/v1alpha1/spec.proto";
import "shared/metadata.proto";

// digital-ocean-load-balancer
message DigitalOceanLoadBalancer {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'digital-ocean.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'DigitalOceanLoadBalancer'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  DigitalOceanLoadBalancerSpec spec = 4 [(buf.validate.field).required = true];

  //status
  DigitalOceanLoadBalancerStatus status = 5;
}

// digital-ocean-load-balancer status
message DigitalOceanLoadBalancerStatus {
  //outputs
  //  digital-ocean-load-balancer outputs
  DigitalOceanLoadBalancerOutputs outputs = 1;
}
