syntax = "proto3";

package dev.planton.digitalocean.digitaloceanloadbalancer.v1alpha1;

// DigitalOceanLoadBalancerOutputs captures the outputs after provisioning a DigitalOcean Load Balancer.
message DigitalOceanLoadBalancerOutputs {
  // Retired field. dns_name promised a DNS name the DigitalOcean API never
  // exposes for load balancers; every module left it empty. Its number and
  // name must never be reused with a different meaning.
  reserved 3;
  reserved "dns_name";

  // The unique identifier (UUID) of the created DigitalOcean Load Balancer.
  string load_balancer_id = 1;

  // The public IPv4 address assigned to the Load Balancer.
  string ip = 2;

  // The uniform resource name (URN) of the Load Balancer, usable with
  // DigitalOcean project resources.
  string urn = 4;

  // The IPv6 address of the Load Balancer, populated when network_stack is
  // DUALSTACK.
  string ipv6 = 5;
}
