# Least-privilege permissions the IaC runner's DigitalOcean credential
# needs to provision, update, and destroy this component with the official
# modules. DigitalOcean authenticates with a bearer API token carrying
# named scopes; every group entry is `derived` (static analysis of the
# module sources, cited in notes) until the live capture lane upgrades it
# to `proven`. Schema: iac/catalogkindpermissions/v1.
#
# The balancer resource takes no DigitalOcean tags, so no tag scope is
# needed -- backends attach by ID or by pre-existing droplet tag carried
# verbatim in the request body.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: digitaloceanloadbalancer
spec:
  digital_ocean:
    groups:
      - purpose: ManageLoadBalancer
        scopes:
          - load_balancer:create
          - load_balancer:read
          - load_balancer:update
          - load_balancer:delete
        provenance: derived
        notes: Covers digitalocean_loadbalancer's create/read/update/delete/import paths (waiters included) in both the Terraform and Pulumi modules -- create the balancer via POST /v2/load_balancers with type, region, size, forwarding rules, health check, firewall, backends, and network settings all riding the create body (load_balancer:create), read the balancer via GET /v2/load_balancers/{id} on refresh/import and while the create waiter polls for active status (load_balancer:read), in-place changes (rules, health check, sticky sessions, size_unit resizes, firewall, backend set) via PUT /v2/load_balancers/{id} (load_balancer:update), and destroy via DELETE /v2/load_balancers/{id} (load_balancer:delete). Scope names per https://docs.digitalocean.com/reference/api/scopes/, read 2026-08-22. A full-access token also works; it is never least-privilege.
      - purpose: ResolveCertificates
        scopes:
          - certificate:read
        provenance: derived
        notes: "Needed only when a forwarding rule or GLB domain carries a certificate name: the provider resolves the name against GET /v2/certificates to validate and build the request."
