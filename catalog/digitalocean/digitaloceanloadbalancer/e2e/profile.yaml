apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: digitaloceanloadbalancer
spec:
  # Live-proven on BOTH engines, both scenarios, full lifecycle under the
  # idempotency gate, plus the blind import round-trip (Terraform lane, zero
  # tolerated updates): `minimal` (a regional HTTP balancer with no VPC --
  # the region-default-VPC path -- and no members) and `full` (the VPC
  # fixture via the e2e-prerequisites annotation, tag targeting against a
  # scenario-local droplet fixture that carries the tag, an LB-level
  # firewall, cookie sticky sessions, full health-check thresholds, PROXY
  # protocol, backend keepalive, idle-timeout, and size_unit). Balancers
  # reach `active` in one to two minutes and bill ~$12/month prorated, so
  # the sweep costs pennies.
  #
  # What the first live runs taught: the load-balancer API ACCEPTS a
  # droplet_tag no resource carries (stored as a selector, no tag created,
  # empty member list) -- the alert-policy behavior, not the firewall's --
  # so the `full` scenario deploys a region-pinned, VPC-joined droplet
  # fixture carrying the tag (e2e/fixtures/droplet-nyc3.yaml) and the live
  # GET shows it in droplet_ids; a memberless tag would prove nothing.
  # Load-balancer names are unique per account, so both scenarios carry
  # ${E2E_RUN_ID}. Once in three identical creates a balancer never left
  # `new` inside the provider's 10-minute waiter and its deletion left a
  # ghost VPC member for ~45 minutes (the kind's GUIDE and the harness
  # README record the class); the re-run passed unchanged.
  #
  # Deliberately NOT in the live lanes: GLOBAL / domains / glb_settings
  # (needs a delegated domain), HTTPS / redirect_http_to_https /
  # tls_passthrough (need a certificate -- Let's Encrypt needs a delegated
  # domain), BYOIP `ip` (needs a BYOIP prefix on the account), and
  # `subnet_uuid` (needs a VPC subnet, which the catalog has no kind for yet
  # -- prove when one exists). Both engines wire both.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
