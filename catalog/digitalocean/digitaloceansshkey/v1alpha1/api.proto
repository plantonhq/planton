syntax = "proto3";

package dev.planton.digitalocean.digitaloceansshkey.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/digitalocean/digitaloceansshkey/v1alpha1/outputs.proto";
import "catalog/digitalocean/digitaloceansshkey/v1alpha1/spec.proto";
import "shared/metadata.proto";

// digital-ocean-ssh-key
message DigitalOceanSshKey {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'digital-ocean.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'DigitalOceanSshKey'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  DigitalOceanSshKeySpec spec = 4 [(buf.validate.field).required = true];

  //status
  DigitalOceanSshKeyStatus status = 5;
}

// digital-ocean-ssh-key status
message DigitalOceanSshKeyStatus {
  //outputs
  //  digital-ocean-ssh-key outputs
  DigitalOceanSshKeyOutputs outputs = 1;
}
