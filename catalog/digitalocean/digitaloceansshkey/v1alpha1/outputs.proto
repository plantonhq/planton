syntax = "proto3";

package dev.planton.digitalocean.digitaloceansshkey.v1alpha1;

// DigitalOceanSshKeyOutputs captures the key outputs after
// provisioning a DigitalOcean SSH key.
message DigitalOceanSshKeyOutputs {
  // Numeric id of the SSH key, as a string (for example "263654"). This is
  // the key's API identity and the ONLY id imports accept -- the
  // fingerprint does not work as an import id even though droplets accept
  // it as a key reference.
  string ssh_key_id = 1;

  // MD5 fingerprint of the key in colon-separated hex form, computed by
  // DigitalOcean from the key material (never derived locally). Droplets
  // accept it interchangeably with the numeric id in their ssh_keys list.
  string fingerprint = 2;
}
