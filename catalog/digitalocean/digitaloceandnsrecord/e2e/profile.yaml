apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: digitaloceandnsrecord
spec:
  # Live-proven on BOTH engines, all three scenarios, full lifecycle under
  # the idempotency gate, plus the blind import round-trip (Terraform lane),
  # every scenario riding the DigitalOceanDnsZone registry prerequisite
  # (installed from that kind's minimal scenario, its domain name carrying
  # the run token): `minimal` (an A record -- lifecycle + the domain
  # reference resolution + the record_id/domain outputs the verifier
  # addresses the record with), `full` (an SRV record with the
  # priority/weight/port presence trio and a custom TTL), and `caa`
  # (flags/tag with the explicit-zero flags quirk -- the provider drops the
  # 0 on create, the API defaults it to 0, and the round-trip agreed). The
  # two-part {domain},{record_id} import derived both halves from stack
  # outputs and planned no change on all three. Records are free API objects
  # that create in seconds.
  #
  # What the first live run taught: CNAME/MX/NS/SRV/CAA values must be
  # written fully qualified WITH the trailing dot (or zone-relative) -- the
  # provider appends the dot on read-back and forgives only those two
  # spellings, so a bare "letsencrypt.org" is a perpetual in-place update.
  # The scenarios, spec comments, and docs carry the dotted form.
  #
  # Known hazard outside a single record's control: DigitalOcean's API
  # deadlocks on CONCURRENT record writes to one domain (422 "Deadlock
  # found"). One standalone record is never affected; many applied at once
  # against the same zone can be -- the GUIDE points such sets at the zone
  # kind's serialized inline records.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
