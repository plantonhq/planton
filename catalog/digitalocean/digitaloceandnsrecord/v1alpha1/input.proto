syntax = "proto3";

package dev.planton.digitalocean.digitaloceandnsrecord.v1alpha1;

import "catalog/digitalocean/digitaloceandnsrecord/v1alpha1/api.proto";
import "catalog/digitalocean/provider.proto";

// DigitalOceanDnsRecordIacInput is the input to the IaC module.
// It contains the target resource and provider configuration.
message DigitalOceanDnsRecordIacInput {
  // target infra-component to be deployed
  DigitalOceanDnsRecord target = 1;
  // provider-config for DigitalOcean authentication
  dev.planton.digitalocean.DigitalOceanProviderConfig provider_config = 2;
}
