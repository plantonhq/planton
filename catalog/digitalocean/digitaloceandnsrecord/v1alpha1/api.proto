syntax = "proto3";

package dev.planton.digitalocean.digitaloceandnsrecord.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/digitalocean/digitaloceandnsrecord/v1alpha1/outputs.proto";
import "catalog/digitalocean/digitaloceandnsrecord/v1alpha1/spec.proto";
import "shared/metadata.proto";

// DigitalOceanDnsRecord is a Kubernetes Resource Model (KRM) style resource for managing
// individual DNS records within a DigitalOcean DNS zone (domain).
message DigitalOceanDnsRecord {
  // api-version
  string api_version = 1 [(buf.validate.field).string.const = "digital-ocean.planton.dev/v1alpha1"];

  // resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'DigitalOceanDnsRecord'];

  // metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  // spec
  DigitalOceanDnsRecordSpec spec = 4 [(buf.validate.field).required = true];

  // status
  DigitalOceanDnsRecordStatus status = 5;
}

// DigitalOceanDnsRecordStatus represents the observed state of a DigitalOcean DNS record.
message DigitalOceanDnsRecordStatus {
  // outputs from the IaC deployment
  DigitalOceanDnsRecordOutputs outputs = 1;
}
