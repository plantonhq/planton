# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: digitaloceancertificate
spec:
  billing_model: free
  free_tier: "A DigitalOcean certificate is a free object in both of its forms. The lets_encrypt branch has DigitalOcean issue and auto-renew a Let's Encrypt certificate at no charge -- DigitalOcean's own pricing documentation states 'There is no additional cost to use Let's Encrypt with load balancers' (https://docs.digitalocean.com/products/networking/load-balancers/details/pricing/, fetched 2026-08-22), and no DigitalOcean pricing page lists any charge for certificate objects. The custom branch stores and serves user-provided PEM material equally free -- what that material cost to obtain is the external CA's business, not DigitalOcean's."
  notes: "No field of this spec buys anything: the name, the Let's Encrypt domain list, and the uploaded PEM material are all control-plane configuration, and auto-renewals of Let's Encrypt certificates never bill. The real spend lives in the resources the certificate ATTACHES to -- a regional load balancer terminating HTTPS with it bills $12.00 per month per node (network load balancers $15.00 per month per node, per the same pricing page, fetched 2026-08-22) as its own component, and the DigitalOcean-managed DNS zones that Let's Encrypt validation requires are free (https://docs.digitalocean.com/products/networking/dns/details/pricing/, fetched 2026-08-22). Nothing about the certificate itself ever appears on an invoice."
