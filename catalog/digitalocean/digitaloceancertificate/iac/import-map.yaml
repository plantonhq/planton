apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: digitaloceancertificate
spec:
  # Certificates import by NAME, not UUID: a lets_encrypt certificate's UUID
  # rotates on every auto-renewal, so the provider uses the stable name as the
  # resource id. The module exports that id as the certificate_id
  # output -- zero user input when state is present. The PEM material
  # (private_key/leaf_certificate/certificate_chain) is never returned by the
  # API, so an imported custom certificate carries all three empty (recorded
  # as config-only tolerances in the provider import catalog).
  values:
    - name: certificate_name
      derivations:
        - from_output: certificate_id
      where_to_find: >-
        DigitalOcean control panel -> Settings -> Security -> Certificates
        (the certificate's name), or `doctl compute certificate list` (the
        Name column).
