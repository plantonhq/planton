# Least-privilege permissions the IaC runner's DigitalOcean credential
# needs to provision, update, and destroy this component with the official
# modules. DigitalOcean authenticates with a bearer API token carrying
# named scopes; every group entry is `derived` (static analysis of the
# module sources, cited in notes) until the live capture lane upgrades it
# to `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: digitaloceancertificate
spec:
  digital_ocean:
    groups:
      - purpose: ManageCertificate
        scopes:
          - certificate:read
          - certificate:create
          - certificate:delete
        provenance: derived
        notes: Covers digitalocean_certificate's create/read/delete/import paths, including the name<->UUID resolution the provider performs on every read -- read the certificate on refresh/import, where the provider resolves the stable NAME to the current UUID by listing, then gets (a Let's Encrypt certificate's UUID rotates on every auto-renewal) (certificate:read), create the certificate via POST /v2/certificates, where every argument is create-only so any change also creates the replacement first (certificate:create), and delete the certificate via DELETE /v2/certificates/{uuid}, where replacements destroy the old certificate after the new one exists (certificate:delete). No update scope exists to need -- digitalocean_certificate has no in-place update path; the modules replace on every change (create_before_destroy). A full-access token also works; it is never least-privilege.
