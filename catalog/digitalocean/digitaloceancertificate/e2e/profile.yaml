apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: digitaloceancertificate
spec:
  # Live-proven on BOTH engines: `minimal` uploads a CUSTOM certificate from
  # the throwaway self-signed pair embedded in the scenario (no domain
  # needed), full lifecycle, verified by NAME through ListByName -- the
  # reserved `minimal` name doubles as the fixture install profile for kinds
  # that compose a certificate. Certificates are free API objects creating in
  # seconds (the API took 17-33s to accept the upload live). Certificate
  # names are unique per account, so scenario names carry ${E2E_RUN_ID}.
  #
  # IMPORT ROUND-TRIP: `minimal` opts out by annotation, with the reason in
  # the lane log. The PEM trio is write-only AND ForceNew, so a blind import
  # leaves it empty, the config re-supplies it, and the only plan is a
  # replace -- which the oracle rightly refuses and which must never be
  # papered over (rotating certificate material is SUPPOSED to replace the
  # certificate). The kind's import map therefore stays offline-validated
  # until a PEM-free scenario proves it live; the GUIDE teaches adopters the
  # one-time replacement on their first apply after import.
  #
  # ENVIRONMENTAL GATE (recorded deferral): `lets-encrypt` needs a domain
  # delegated to the account's DigitalOcean DNS. The scenario declares
  # e2e-required-env PLANTON_E2E_DIGITALOCEAN_DELEGATED_DOMAIN and skips
  # honestly while it is unset (proven: both lanes report the skip with the
  # variable named). Unblock condition: export that variable with a delegated
  # apex and the arm runs unchanged, which also gives the import map its
  # PEM-free live proof. Until then the branch's wiring is proven by the
  # offline plan only.
  # Pulumi re-proven 2026-09-18 at bridge v4.79.1 (embedding provider
  # v2.100.1) on `minimal`: DEPLOY 18 s, IDEMPOTENCY PASS, DESTROY 11 s;
  # `lets-encrypt` still skips honestly while the delegated-domain variable is
  # unset -- every phase first run; the bridge bump changed nothing this
  # kind's lane can observe.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
