# Let's Encrypt scenario: DigitalOcean issues and auto-renews the
# certificate. ENVIRONMENTAL GATE: issuance requires every listed domain to
# be managed by DigitalOcean DNS in the account, so the lane needs an
# operator-arranged domain delegated to the account's nameservers, injected
# as PLANTON_E2E_DIGITALOCEAN_DELEGATED_DOMAIN (the bare apex, e.g.
# "example.com"). Where that variable is unset the runner records an honest
# skip per the e2e-required-env annotation instead of failing at the API;
# the branch's wiring is still proven by the offline plan. The moment the
# variable is exported the arm runs unchanged: a run-scoped subdomain of the
# delegated apex keeps every lane's names unique.
apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanCertificate
metadata:
  name: planton-oss-e2e-digitaloceancertificate-le
  id: planton-oss-e2e-digitaloceancertificate-le
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: digitaloceancertificate
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-required-env: PLANTON_E2E_DIGITALOCEAN_DELEGATED_DOMAIN
  tags:
    - planton-e2e
spec:
  certificateName: planton-e2e-le-cert-${E2E_RUN_ID}
  letsEncrypt:
    domains:
      - e2e-${E2E_RUN_ID}.${E2E_ENV:PLANTON_E2E_DIGITALOCEAN_DELEGATED_DOMAIN}
      - "*.e2e-${E2E_RUN_ID}.${E2E_ENV:PLANTON_E2E_DIGITALOCEAN_DELEGATED_DOMAIN}"
