# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: digitaloceancertificate
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The certificate is control-plane material held inside DigitalOcean's own platform, not a data store this component owns or configures -- neither the spec nor the modules expose any at-rest encryption surface. The closest protection is API behavior, not configuration -- DigitalOcean never returns uploaded PEM material (the private_key field is write-only; provisioner state holds only hashes).
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: There is no data store here to key (see enc-at-rest); DigitalOcean exposes no customer-managed-key option for certificate storage.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: This component's product IS transport encryption -- an X.509 certificate that consumers (DigitalOcean load balancer HTTPS forwarding rules) terminate TLS with, referenced by the certificate's stable name. The lets_encrypt branch has DigitalOcean issue and auto-renew the material itself, so it never silently outlives its validity; the custom branch serves exactly the PEM the operator uploaded.
      notes: How strong the TLS sessions are is decided where the certificate is consumed and, on the custom branch, by the key the operator generated -- the spec itself has no cipher or key-strength lever. Custom certificates never auto-renew, so an expired upload quietly degrades the consumers' handshakes until rotated (see managed-patching).
    - control_id: no-public-access
      status: not_applicable
      notes: A certificate is not a network endpoint -- there is nothing to expose or hide. Where it is served publicly is the consuming load balancer's posture.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network surface exists to filter; the certificate is an account-level object with no addresses or ports.
    - control_id: edge-protection
      status: not_applicable
      notes: The certificate receives no HTTP requests -- request filters have nothing to attach to.
    - control_id: rbac
      status: not_applicable
      notes: Who may create, read, or delete certificates is governed by DigitalOcean team membership and API token scopes -- account-level posture; the spec carries no access-control surface of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: The component runs no workloads and holds no cloud-API credentials. The certificate is itself a TLS server credential for the services that consume it, not a workload's cloud identity.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication path exists here to disable. The adjacent lever on the custom branch is cryptographic strength -- whatever key the operator uploads anchors consumers' handshakes; the lets_encrypt branch uses the key material DigitalOcean's ACME integration generates.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: The spec exposes no audit surface. Certificate management calls are captured in the DigitalOcean team's account-level activity history, not per-resource configuration.
    - control_id: monitoring-integration
      status: not_applicable
      notes: DigitalOcean publishes no per-certificate metrics or expiry alerts for this resource. The modules export the expiry_rfc3339 output (which moves forward on every Let's Encrypt auto-renewal) precisely so an external monitor can alarm on approaching expiry -- essential for custom certificates, which never renew themselves.
    - control_id: backup-recovery
      status: not_applicable
      notes: There is nothing to back up -- a lets_encrypt certificate re-issues entirely from the manifest's domain list, and a custom certificate re-uploads from the operator-held PEM material. The API's refusal to return private material means no copy could be taken from DigitalOcean anyway.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backups exist to retain (see backup-recovery).
    - control_id: multi-zone-ha
      status: not_applicable
      notes: Certificates are account-level objects in DigitalOcean's control plane with no zonal placement to configure; availability is the consuming load balancer's concern.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither DigitalOcean nor the modules expose a deletion-protection flag for certificates. The modules' create-before-destroy replacement ordering protects consumers during CHANGES (a load balancer referencing the stable name never observes a gap), but nothing refuses an outright destroy.
    - control_id: managed-patching
      status: configurable
      field_path: lets_encrypt
      evidence:
        type: spec_default
        reference: Renewal is this credential's patching analog, and the required certificate_source oneof decides it -- lets_encrypt is the branch field that makes managed rotation true. The lets_encrypt branch gives fully managed rotation -- DigitalOcean always auto-renews, each renewal minting a new certificate UUID behind the stable name with no human step. The custom branch never renews -- fresh PEM material must be re-uploaded before expiry, and every argument being create-only means rotation is a full (zero-downtime, create-before-destroy) replacement.
      notes: Choose lets_encrypt whenever the domains are DigitalOcean-DNS-managed; reserve custom for material an external CA must issue, and pair it with expiry monitoring on the expiry_rfc3339 output.
