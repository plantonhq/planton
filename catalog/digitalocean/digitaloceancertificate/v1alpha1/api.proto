syntax = "proto3";

package dev.planton.digitalocean.digitaloceancertificate.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/digitalocean/digitaloceancertificate/v1alpha1/outputs.proto";
import "catalog/digitalocean/digitaloceancertificate/v1alpha1/spec.proto";
import "shared/metadata.proto";

// digital-ocean-certificate
message DigitalOceanCertificate {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'digital-ocean.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'DigitalOceanCertificate'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  DigitalOceanCertificateSpec spec = 4 [(buf.validate.field).required = true];

  //status
  DigitalOceanCertificateStatus status = 5;
}

// digital-ocean-certificate status
message DigitalOceanCertificateStatus {
  //outputs
  //  digital-ocean-certificate outputs
  DigitalOceanCertificateOutputs outputs = 1;
}
