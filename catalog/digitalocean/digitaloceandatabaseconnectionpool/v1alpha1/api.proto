syntax = "proto3";

package dev.planton.digitalocean.digitaloceandatabaseconnectionpool.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/digitalocean/digitaloceandatabaseconnectionpool/v1alpha1/outputs.proto";
import "catalog/digitalocean/digitaloceandatabaseconnectionpool/v1alpha1/spec.proto";
import "shared/metadata.proto";

// digital-ocean-database-connection-pool
message DigitalOceanDatabaseConnectionPool {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'digital-ocean.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'DigitalOceanDatabaseConnectionPool'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  DigitalOceanDatabaseConnectionPoolSpec spec = 4 [(buf.validate.field).required = true];

  //status
  DigitalOceanDatabaseConnectionPoolStatus status = 5;
}

// digital-ocean-database-connection-pool status
message DigitalOceanDatabaseConnectionPoolStatus {
  //outputs
  //  digital-ocean-database-connection-pool outputs
  DigitalOceanDatabaseConnectionPoolOutputs outputs = 1;
}
