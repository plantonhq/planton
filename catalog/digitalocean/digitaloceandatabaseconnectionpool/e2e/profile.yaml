apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: digitaloceandatabaseconnectionpool
spec:
  # Live-proven on BOTH engines, both scenarios, full lifecycle under the
  # idempotency gate, plus the blind import round-trip on every Terraform
  # lane (`{cluster_id},{pool_name}` from the stack outputs; lossless on
  # both scenarios -- nothing tolerated). TWO scenarios on the PostgreSQL
  # cluster registry prerequisite (`planton-oss-e2e-dodb-min`): `minimal`
  # is a transaction-mode pool authenticating as the cluster's built-in
  # doadmin user (no user fixture needed; all eight outputs populated and
  # host/port asserted against the live pool); `inbound-user` omits the
  # user, proving DigitalOcean's inbound-user pool shape (clients bring
  # their own credentials; the password output is legitimately empty --
  # 7 of 8 outputs populated -- and the omitted user reads back stable
  # under the idempotency gate on both engines).
  #
  # Measured 2026-09-17: the cluster fixture creates in 4m58s-5m44s
  # (~$0.02/hour); the pool deploys in 2-8 s and destroys in 2-9 s. Every
  # cluster that reaches `online` leaves three `v1/dbaas/alerts/*` policies
  # behind after deletion -- sweep them.
  #
  # Pulumi re-proven 2026-09-18 at bridge v4.79.1 (embedding provider
  # v2.100.1) on `inbound-user`: cluster fixture 5m22s, DEPLOY 23 s,
  # IDEMPOTENCY PASS, VERIFY-RES PASS (7/8 outputs -- the inbound user's
  # password empty by contract), DESTROY 20 s, VERIFY-CLN PASS, first run.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 35
