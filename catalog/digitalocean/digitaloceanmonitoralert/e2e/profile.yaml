apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: digitaloceanmonitoralert
spec:
  # Live-proven on BOTH engines, both scenarios, full lifecycle under the
  # idempotency gate, plus the blind import round-trips (Terraform lane):
  # `minimal` (a droplet CPU alert with the droplet targeted by REFERENCE --
  # the fixture rides the e2e-prerequisites annotation and installs from
  # that kind's minimal scenario) and `tag-targeted` (tags only, no entity
  # ids, enabled=false, no fixture at all). Both blind imports re-planned as
  # no-ops with zero tolerances; the tag-targeted policy read `entities`
  # back as an empty list, so the watched materialization class never
  # appeared. Policies are free API objects (~7-20s); the droplet fixture
  # (~40s, ~$0.009/hour) dominates the `minimal` lane.
  #
  # What the live API taught (encoded in the spec comments and docs): a
  # policy's tag does NOT have to exist -- the API stores it as a selector
  # and neither requires nor creates it (a run-scoped tag no droplet carried
  # was accepted with HTTP 200, and /v2/tags had no such tag afterward),
  # the opposite of firewalls. Alert email goes only to VERIFIED team
  # members ("email is not verified"), so both scenarios read the recipient
  # from PLANTON_E2E_DIGITALOCEAN_ALERT_EMAIL and skip honestly when it is
  # unset.
  #
  # Deliberately NOT in the live lanes:
  # - slack delivery: needs a real incoming-webhook URL (environmental gate;
  #   unblock = a throwaway Slack workspace webhook exported as a
  #   PLANTON_E2E_ variable).
  # - load-balancer and database metric families: the same entities wiring
  #   the droplet lane proves; LB/cluster fixtures cost minutes for no new
  #   code path -- exercised whenever a lane pays for those fixtures anyway.
  # - in-place edits (threshold, window, channels): the runner has no update
  #   phase.
  # Pulumi re-proven 2026-09-18 at bridge v4.79.1 (embedding provider
  # v2.100.1) on `minimal`: droplet fixture 42 s, DEPLOY 11 s, IDEMPOTENCY
  # PASS, DESTROY 17 s -- every phase first run; the bridge bump changed
  # nothing this kind's lane can observe.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 20
