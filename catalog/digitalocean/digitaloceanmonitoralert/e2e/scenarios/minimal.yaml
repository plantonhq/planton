# Minimal DigitalOceanMonitorAlert: a droplet CPU alert with email
# delivery, targeting one Droplet by REFERENCE. Droplet targeting is an
# optional composition seam (a policy can target by tags instead), so the
# fixture rides the e2e-prerequisites annotation and installs from that
# kind's minimal scenario. Proves the lifecycle, the entities wiring, and
# the alert_id output the verifier addresses the policy with.
#
# DigitalOcean delivers alert email only to VERIFIED members of the team
# that owns the policy and rejects any other address at create time, so
# the recipient is the account-specific PLANTON_E2E_DIGITALOCEAN_ALERT_EMAIL
# (the operator's own verified address); the lane skips honestly when it
# is unset.
apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanMonitorAlert
metadata:
  name: planton-oss-e2e-digitaloceanmonitoralert-min
  id: planton-oss-e2e-digitaloceanmonitoralert-min
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: digitaloceanmonitoralert
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "DigitalOceanDroplet"
    planton.dev/e2e-required-env: PLANTON_E2E_DIGITALOCEAN_ALERT_EMAIL
  tags:
    - planton-e2e
spec:
  description: Planton E2E droplet CPU alert
  metricType: v1/insights/droplet/cpu
  compare: GreaterThan
  value: 95
  window: 5m
  dropletIds:
    - valueFrom:
        kind: DigitalOceanDroplet
        name: planton-oss-e2e-digitaloceandroplet-min
        fieldPath: status.outputs.droplet_id
  alerts:
    emails:
      - ${E2E_ENV:PLANTON_E2E_DIGITALOCEAN_ALERT_EMAIL}
