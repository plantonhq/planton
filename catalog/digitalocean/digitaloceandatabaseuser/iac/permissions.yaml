# Least-privilege permissions the IaC runner's DigitalOcean credential
# needs to provision, update, and destroy this component with the official
# modules. DigitalOcean authenticates with a bearer API token carrying
# named scopes; every group entry is `derived` (static analysis of the
# module sources, cited in notes) until the live capture lane upgrades it
# to `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: digitaloceandatabaseuser
spec:
  digital_ocean:
    groups:
      - purpose: ManageDatabaseUser
        scopes:
          - database:read
          - database:create
          - database:update
          - database:delete
        provenance: derived
        notes: Covers digitalocean_database_user's create/read/update/delete/import paths -- create the user via POST /v2/databases/{c}/users (database:create), read it back through GET /v2/databases/{c}/users/{n} on refresh/import (database:read), reset the MySQL auth plugin / update ACLs (database:update), and delete via DELETE /v2/databases/{c}/users/{n} (database:delete). Scope names per https://docs.digitalocean.com/reference/api/scopes/, read 2026-08-22. A full-access token also works; it is never least-privilege.
