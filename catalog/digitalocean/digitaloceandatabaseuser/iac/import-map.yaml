apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: digitaloceandatabaseuser
spec:
  # The user's identity is the (cluster, name) pair -- DigitalOcean mints no
  # standalone user id. Both halves are outputs, so zero user input
  # when state is present.
  values:
    - name: cluster_id
      derivations:
        - from_output: cluster_id
      where_to_find: >-
        DigitalOcean control panel -> Databases -> the cluster -> the UUID
        in the cluster's page URL, or `doctl databases list` (the ID
        column).
    - name: user_name
      derivations:
        - from_output: user_name
      where_to_find: >-
        DigitalOcean control panel -> Databases -> the cluster -> Users &
        Databases tab (the user's name), or `doctl databases user list
        <cluster-id>`.
