# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: digitaloceandatabaseuser
spec:
  billing_model: free
  notes: Database users are a feature of the managed database cluster and carry no charge of their own -- the cluster's node-hours (a DigitalOceanDatabaseCluster cost) are the entire bill. Adding, rotating, or removing users never changes what the cluster costs.
