# MySQL auth-plugin DigitalOceanDatabaseUser: a user on a MySQL cluster
# with an explicit mysql_native_password auth plugin -- the provider's own
# contract-test walk for this argument. The MySQL cluster deploys as a
# manifest-path fixture (the annotation below) because the auth plugin is
# MySQL-only and the kind's registry prerequisite installs a PostgreSQL
# cluster.
#
# No `settings` here, deliberately: a MySQL user never carries a settings
# object in DigitalOcean's responses and the API refuses a settings update
# on a MySQL cluster (`422 operation is not supported for this cluster
# type`), so a MySQL manifest that declared even `settings: {}` would fail
# every apply after the first. PostgreSQL users declare `settings: {}` for
# the opposite reason (see minimal).
apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanDatabaseUser
metadata:
  name: planton-oss-e2e-digitaloceandatabaseuser-mysql-auth
  id: planton-oss-e2e-digitaloceandatabaseuser-mysql-auth
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: digitaloceandatabaseuser
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "catalog/digitalocean/digitaloceandatabaseuser/e2e/fixtures/mysql-cluster.yaml"
  tags:
    - planton-e2e
spec:
  cluster:
    valueFrom:
      kind: DigitalOceanDatabaseCluster
      name: planton-oss-e2e-dodbu-mysql-fixture
      fieldPath: status.outputs.cluster_id
  userName: pltn-e2e-dodbu-auth
  mysqlAuthPlugin: mysql_native_password
