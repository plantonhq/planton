syntax = "proto3";

package dev.planton.digitalocean.digitaloceanvolume.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/digitalocean/digitaloceanvolume/v1alpha1/outputs.proto";
import "catalog/digitalocean/digitaloceanvolume/v1alpha1/spec.proto";
import "shared/metadata.proto";

// digital-ocean-volume
message DigitalOceanVolume {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'digital-ocean.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'DigitalOceanVolume'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  DigitalOceanVolumeSpec spec = 4 [(buf.validate.field).required = true];

  //status
  DigitalOceanVolumeStatus status = 5;
}

// digital-ocean-volume status
message DigitalOceanVolumeStatus {
  //outputs
  //  digital-ocean-volume outputs
  DigitalOceanVolumeOutputs outputs = 1;
}
