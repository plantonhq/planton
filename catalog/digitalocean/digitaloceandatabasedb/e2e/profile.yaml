apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: digitaloceandatabasedb
spec:
  # Live-proven on BOTH engines, full lifecycle under the idempotency gate,
  # plus the blind import round-trip on the Terraform lane
  # (`{cluster_id},{database_name}`, both from the stack outputs; lossless
  # -- nothing tolerated). ONE scenario: `minimal` -- an additional logical
  # database on the PostgreSQL cluster registry prerequisite
  # (`planton-oss-e2e-dodb-min`). The resource has exactly two create-only
  # arguments, so the minimal lane IS total coverage.
  #
  # Measured 2026-09-17: the cluster fixture creates in 4m40s-5m00s
  # (~$0.02/hour); the database itself deploys in 4-9 s and destroys in
  # 5-11 s; absence is answered within 2 s of the destroy. Every cluster
  # that reaches `online` leaves three `v1/dbaas/alerts/*` policies behind
  # after deletion, and they can appear minutes after the cluster is online
  # -- sweep them at session end, not only between lanes.
  #
  # Pulumi re-proven 2026-09-18 at bridge v4.79.1 (embedding provider
  # v2.100.1) on `minimal`: cluster fixture 5m27s, DEPLOY 26 s, IDEMPOTENCY
  # PASS, VERIFY-RES PASS, DESTROY 20 s, VERIFY-CLN PASS, first run.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 35
