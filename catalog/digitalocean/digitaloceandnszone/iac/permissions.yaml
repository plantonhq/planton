# Least-privilege permissions the IaC runner's DigitalOcean credential
# needs to provision, update, and destroy this component with the official
# modules. DigitalOcean authenticates with a bearer API token carrying
# named scopes; every group entry is `derived` (static analysis of the
# module sources, cited in notes) until the live capture lane upgrades it
# to `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: digitaloceandnszone
spec:
  digital_ocean:
    groups:
      - purpose: ManageDnsZone
        scopes:
          - domain:read
          - domain:create
          - domain:update
          - domain:delete
        provenance: derived
        notes: Covers digitalocean_domain's and digitalocean_record's create/read/update/delete/import paths -- read the zone via GET /v2/domains/{name} and each managed record via GET /v2/domains/{name}/records/{id} on refresh/import (domain:read), create the zone via POST /v2/domains, where ip_address rides the create body, and each record via POST /v2/domains/{name}/records (domain:create), make in-place record changes (values, ttl, per-type fields) via PUT /v2/domains/{name}/records/{id}, while the zone itself has no update path (domain_name changes recreate) (domain:update), and delete records via DELETE /v2/domains/{name}/records/{id} and the zone via DELETE /v2/domains/{name} (domain:delete). Scope names per https://docs.digitalocean.com/reference/api/scopes/, read 2026-08-22; the domain scope family covers "domains and domain records", which is exactly this module's whole surface -- one digitalocean_domain plus one digitalocean_record per record value. A full-access token also works; it is never least-privilege.
