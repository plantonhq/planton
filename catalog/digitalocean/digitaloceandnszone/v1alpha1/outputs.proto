syntax = "proto3";

package dev.planton.digitalocean.digitaloceandnszone.v1alpha1;

// DigitalOceanDnsZoneStackOutputs captures the identifiers exported after a
// DNS zone (domain) is provisioned on DigitalOcean.
message DigitalOceanDnsZoneStackOutputs {
  // The domain name of the DNS zone (e.g. "example.com").
  string zone_name = 1;

  // The zone's resource identifier. DigitalOcean addresses domains by NAME —
  // this is the domain name itself, not a UUID.
  string zone_id = 2;

  // DigitalOcean's authoritative name servers for every hosted zone
  // (ns1/ns2/ns3.digitalocean.com — a fixed platform-wide set the API does
  // not return per zone). Set these at the domain's registrar to delegate.
  repeated string name_servers = 3;

  // The uniform resource name of the domain (e.g. "do:domain:example.com").
  string urn = 4;

  // Numeric ids of the inline `records`, one entry per record value, keyed
  // by "<record name>-<record index>-<value index>" (the index positions in
  // the manifest's `records` list and that entry's `values` list, both from
  // 0 — e.g. "@-0-0", "www-1-0"). DigitalOcean addresses a record as
  // /v2/domains/{domain}/records/{id}, and state import takes
  // "{domain},{record_id}"; this map is where the second half comes from.
  // Empty for a zone with no inline records.
  map<string, string> record_ids = 5;
}
