# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: digitaloceandnszone
spec:
  billing_model: free
  free_tier: "DigitalOcean DNS hosting is free without qualification -- the provider's own pricing page says exactly 'DNS management is free' (https://docs.digitalocean.com/products/networking/dns/details/pricing/, fetched 2026-08-22). No meter counts zones, the records inside them, or the queries DigitalOcean's authoritative nameservers (ns1/ns2/ns3.digitalocean.com) answer."
  notes: "No field of this spec buys anything: the domain name, the inline record list, and the ip_address apex convenience are all free DNS control-plane configuration. The one real money question near this kind sits OUTSIDE DigitalOcean: adding a domain here does not purchase or renew it -- the registrar fee for owning the domain name is paid to the registrar, and the zone only resolves once that registrar delegates to DigitalOcean's nameservers. Beyond that, spend lives at the records' TARGETS -- the droplets, load balancers, and mail services the zone's records point to bill as their own catalog kinds."
