apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: digitaloceandnszone
spec:
  # Live-proven on BOTH engines, both scenarios, full lifecycle under the
  # idempotency gate, plus the blind import round-trip (Terraform lane):
  # `minimal` (a bare zone -- it doubles as the DigitalOceanDnsRecord kind's
  # install fixture; the harness falls back to a kind's minimal scenario
  # when no prerequisite.yaml exists) and `full` (the inline record fan-out
  # across A/CNAME/MX/TXT/SRV/CAA with multi-value flattening, a custom TTL,
  # and the create-only ip_address seed). The `full` round-trip re-imported
  # NINE resources blind -- the domain by NAME and all eight records as
  # {domain},{record_id}, the record ids derived per instance from the
  # record_ids map output -- with a clean plan, which is also the live proof
  # that ip_address is IGNORED after creation in both engines (ForceNew and
  # never read back: without the guard the first post-import plan was a zone
  # REPLACE). Zones and records are free API objects; a zone of N records
  # applies in ~2N seconds because both engines write records ONE AT A TIME
  # (DigitalOcean's API deadlocks on concurrent record writes to one domain
  # -- "422 Error 1213 Deadlock found", live-measured 1 in 8; Pulumi chains
  # the records, Terraform limits the client to one request per second).
  # Both scenarios carry ${E2E_RUN_ID} in the domain name: DigitalOcean
  # domain names are unique across ALL accounts.
  #
  # Two scenario shapes the idempotency gate demanded: hostname values are
  # written fully qualified WITH the trailing dot (the only spelling
  # DigitalOcean reports back unchanged -- a bare "letsencrypt.org" re-plans
  # forever), and the custom-TTL arm sits on a uniquely named record because
  # DigitalOcean harmonizes TTLs per hostname and the ip_address seed record
  # joins the apex A set.
  # Pulumi re-proven 2026-09-18 at bridge v4.79.1 (embedding provider
  # v2.100.1) on `full`: DEPLOY 16 s with the eight inline records serialized
  # through the dependency chain, IDEMPOTENCY PASS, DESTROY 15 s -- every
  # phase first run; the bridge bump changed nothing this kind's lane can
  # observe.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 15
