# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: digitaloceandatabasecluster
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "DigitalOcean encrypts managed database data at rest with LUKS on every cluster -- no configuration level can disable it (https://docs.digitalocean.com/products/databases/postgresql/details/features/, read 2026-08-22: 'Encrypts data at rest with LUKS and in transit with SSL')."
      notes: Platform-wide guarantee across all engines; the spec deliberately carries no encryption toggle because none exists.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: DigitalOcean offers no customer-managed-key option for managed databases -- encryption keys are platform-held with no CMK surface anywhere in the API.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Client connections to managed database clusters require SSL/TLS -- DigitalOcean's own feature documentation states data is encrypted in transit with SSL, and the cluster's connection details are SSL-required by default."
      notes: Both the public and private (VPC) endpoints speak TLS; connection strings exported by the modules carry the SSL requirement.
    - control_id: no-public-access
      status: configurable
      field_path: vpc
      evidence:
        type: spec_default
        reference: Unset leaves the cluster on the region's default network posture; setting a VPC (literal UUID or DigitalOceanVpc reference, create-only) gives the cluster a private endpoint inside that network.
      notes: "The honest caveat: a VPC-attached cluster still carries a public endpoint until trusted sources are restricted through a DigitalOceanDatabaseFirewall resource -- pairing both is what actually removes public reachability. Presets 01, 03, and 04 attach a VPC."
    - control_id: restricted-ingress
      status: not_applicable
      notes: Inbound restriction on a managed database is the trusted-sources rule set, which DigitalOcean models as a separate resource -- the DigitalOceanDatabaseFirewall kind targets this cluster from outside this spec. This spec carries no rule surface of its own.
    - control_id: edge-protection
      status: not_applicable
      notes: A managed database endpoint speaks database wire protocols, not HTTP -- no WAF or request filter attaches to it on DigitalOcean.
    - control_id: rbac
      status: not_applicable
      notes: Database-level users, roles, and grants are separate DigitalOceanDatabaseUser resources with their own lifecycles; management-plane access is governed by DigitalOcean team roles and API token scopes on the caller's side. This spec has no RBAC surface.
    - control_id: workload-identity
      status: not_applicable
      notes: Clients authenticate to the cluster with static database credentials -- DigitalOcean has no keyless, platform-issued identity path for database connections.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: The cluster itself exposes no weaker authentication path to disable -- TLS is required and credential policy per user (e.g. the MySQL auth plugin) lives on the DigitalOceanDatabaseUser resource, not here.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: DigitalOcean's managed databases expose engine logs and metrics, but log forwarding is a separate resource not modeled by this spec, and management-plane actions land in the team's account activity outside this component -- the spec wires no cluster-scoped audit log stream.
    - control_id: monitoring-integration
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "Cluster metrics (CPU, memory, disk, connections) flow to DigitalOcean Monitoring automatically for every managed database -- 'Cluster metrics and alerting' is a platform feature, not a spec choice."
      notes: Alert policies against those metrics are authored as DigitalOceanMonitorAlert resources; nothing here needs enabling.
    - control_id: backup-recovery
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "DigitalOcean takes full daily backups and maintains write-ahead logs for point-in-time restore within the previous seven days on the database engines -- automatic, not configurable (https://docs.digitalocean.com/products/databases/postgresql/details/features/, read 2026-08-22)."
      notes: "Caveat: the caching engines (redis/valkey) are ephemeral stores without the backup guarantee. The backup_restore field provisions a NEW cluster from an existing cluster's backup -- the restore path, consumed only at create."
    - control_id: backup-retention-policy
      status: not_applicable
      notes: Backup retention is fixed by DigitalOcean at seven days of point-in-time history -- neither the API nor the provider exposes a retention knob to tune to organizational policy.
    - control_id: multi-zone-ha
      status: configurable
      field_path: node_count
      evidence:
        type: spec_default
        reference: node_count 2 or 3 adds standby nodes with automatic failover -- DigitalOcean promotes a standby when the primary fails, preventing unplanned downtime; 1 is a single point of failure.
      notes: "Standbys are separate-hardware redundancy within the region (DigitalOcean regions are single facilities, not multi-AZ). The production preset pins 3 nodes; Kafka's 3-broker minimum is HA by construction."
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither the DigitalOcean API nor the provider offers a deletion-protection flag for database clusters -- nothing exists to refuse a delete until lifted.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: "DigitalOcean applies operating system and engine updates automatically to keep the service stable and secure -- patching cannot be turned off, only scheduled."
      notes: The maintenance_window field tunes WHEN the weekly update slot runs (presets 01 and 05 pin windows); DigitalOcean picks a slot when none is set.
