apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: digitaloceandatabasecluster
spec:
  # Live-proven on BOTH engines, all three scenarios, full lifecycle under
  # the idempotency gate, plus the blind import round-trip on every
  # Terraform lane (`{cluster_id}` UUID from the stack output). `minimal` is
  # a single-node PostgreSQL 16 on the cheapest slug proving the lifecycle
  # and the connection outputs (host/port/database_name asserted against the
  # live cluster; the round-trip was lossless -- nothing tolerated); it is
  # also the install fixture the database satellite kinds reference by name.
  # `mysql-full` composes the Vpc fixture through the e2e-prerequisites
  # annotation and proves private networking (the verifier asserts
  # private_host against the live private connection), custom storage (the
  # bare-MiB string wiring -- 30720 read back), a maintenance window
  # (`02:00` read back without seconds), sql_mode (read back verbatim), and
  # the user-tag + label composition (all seven tags read back exactly);
  # its round-trip tolerated exactly the two catalogued write-normalized
  # attributes, maintenance_window and sql_mode. `valkey` proves the newer
  # engine plus eviction_policy (engine and policy read back as sent); its
  # round-trip tolerated eviction_policy alone, likewise catalogued.
  #
  # What the live runs measured (2026-09-17): DEPLOY 3m53s-5m21s (the
  # provider waits for `online`); DESTROY 3-16 s and the cluster 404s within
  # a second; the fixture VPC tore down in 10-16 s with no ghost member (a
  # cleanly created and deleted cluster leaves its VPC at once -- the
  # hours-long ghost member class comes only from a FAILED create).
  # DigitalOcean caps a cluster's COMBINED tags -- every tag joined by
  # commas -- at 255 characters (255 passes, 256 fails with `422 combined
  # tags cannot exceed 255 characters`; colons count as one character); the
  # first live attempt (2026-09-16) had met the same limit under a
  # misreported `422 cluster name is not available`, which the API no longer
  # emits for this case. Both modules check the budget before creating
  # anything and fail with the exact arithmetic, and the scenarios' metadata
  # names use the kind's id prefix (`dodb`) because the six Planton label
  # tags carry metadata.name and metadata.id. An honest validation 422
  # creates nothing and does not poison later creates (an untagged control
  # created immediately afterwards). Every cluster that reaches `online`
  # leaves THREE auto-created `v1/dbaas/alerts/*` policies behind after
  # deletion (sweep class). Read back without a diff on either engine:
  # private_network_uuid and project_id populate from the region's default
  # VPC and the default project when unset (Optional+Computed).
  #
  # storage_autoscale rides the mysql-full scenario on both engines
  # (increment 10 GiB -- the API refuses an increment above the slug's
  # maximum plan storage, 30 GiB on db-s-1vcpu-1gb; the settings read back
  # from GET /v2/databases/{id}/autoscale, never from the cluster body).
  #
  # Deliberately not in the live lanes: backup_restore
  # (needs an existing cluster backup in the account), project_id (needs an
  # existing DigitalOcean project UUID -- the Project kind's fixture is the
  # unblock), kafka (3-node minimum makes it the most expensive arm; the
  # Kafka topic and schema kinds' shared fixture proves the engine live),
  # opensearch + ui_* outputs (deferred with kafka on cost). db-s-1vcpu-1gb
  # is ~$0.02/hour, so a three-scenario dual-engine sweep costs pennies. Run
  # ONE scenario per `go test` with a 60-minute budget: the failure path of
  # a VPC-attached lane is an 18-minute fixture teardown retry.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 35
