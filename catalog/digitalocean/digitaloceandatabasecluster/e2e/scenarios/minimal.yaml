# Minimal DigitalOceanDatabaseCluster: single-node PostgreSQL on the
# cheapest managed-database slug, no VPC, no tuning. Proves the full
# create/verify/destroy lifecycle and the cluster_id / host / port /
# connection outputs. Named `minimal` so it doubles as this kind's install
# profile when database satellites compose it as a fixture.
# The cluster name carries the run id: cluster names are unique per account
# (the API answers 422 "cluster name is not available"), and a delete returns
# before the cluster is gone, so a re-run must never reuse the previous name.
# The metadata name uses the kind's id prefix (`dodb`), the catalog's shape
# for long kind names: DigitalOcean caps a database cluster's combined tags
# (joined by commas) at 255 characters, and the six Planton label tags carry
# this name twice (`planton-ai_name:` and `planton-ai_id:`) -- the full kind
# name here would have joined to 257. This is the fixture the database
# satellite kinds reference by name.
apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanDatabaseCluster
metadata:
  name: planton-oss-e2e-dodb-min
  id: planton-oss-e2e-dodb-min
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: digitaloceandatabasecluster
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  clusterName: pltn-e2e-dodb-min-${E2E_RUN_ID}
  engine: pg
  engineVersion: "16"
  region: nyc3
  sizeSlug: db-s-1vcpu-1gb
  nodeCount: 1
