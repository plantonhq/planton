# Least-privilege permissions the IaC runner's DigitalOcean credential
# needs to provision, update, and destroy this component with the official
# modules. DigitalOcean authenticates with a bearer API token carrying
# named scopes; every group entry is `derived` (static analysis of the
# module sources, cited in notes) until the live capture lane upgrades it
# to `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: digitaloceancdn
spec:
  digital_ocean:
    groups:
      - purpose: ManageCdnEndpoint
        scopes:
          - cdn:read
          - cdn:create
          - cdn:update
          - cdn:delete
        provenance: derived
        notes: Covers digitalocean_cdn's create/read/update/delete/import paths -- read the endpoint via GET /v2/cdn/endpoints/{id} (cdn:read), create the endpoint via POST /v2/cdn/endpoints (cdn:create), update ttl / custom domain via PUT /v2/cdn/endpoints/{id} (cdn:update), and delete the endpoint via DELETE /v2/cdn/endpoints/{id} (cdn:delete). A full-access token also works; it is never least-privilege.
      - purpose: ResolveCertificate
        scopes:
          - certificate:read
        provenance: derived
        notes: Resolves the certificate NAME to its current UUID on create/update/read (FindCertificateByName lists, then gets) -- the certificate name<->id resolution the provider performs on every read.
