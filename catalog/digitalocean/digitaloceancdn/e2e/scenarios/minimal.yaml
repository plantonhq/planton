# Minimal DigitalOceanCdn: an edge endpoint fronting the Bucket install
# fixture BY REFERENCE (the e2e-prerequisites annotation), with the TTL
# left unset -- proves the provider's 3600 default read-back path and the
# cdn_id / endpoint outputs the verifier addresses the endpoint with. The
# bucket lane brings its own environmental gate: bucket deploys need the
# Spaces key pair alongside DIGITALOCEAN_TOKEN.
apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanCdn
metadata:
  name: planton-oss-e2e-digitaloceancdn-min
  id: planton-oss-e2e-digitaloceancdn-min
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: digitaloceancdn
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "DigitalOceanBucket"
  tags:
    - planton-e2e
spec:
  origin:
    valueFrom:
      kind: DigitalOceanBucket
      name: planton-oss-e2e-digitaloceanbucket-min
      fieldPath: status.outputs.bucket_domain_name
