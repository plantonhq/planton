apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: digitaloceancdn
spec:
  # green: proven live on BOTH engines (2026-09-16), both scenarios, every
  # phase including the idempotency gate and the blind import round-trip
  # (lossless: zero tolerated updates -- the UUID importer reads origin,
  # ttl, and endpoint back exactly). Both scenarios ride the Bucket install
  # fixture BY REFERENCE (origin = the fixture's bucket_domain_name), so
  # the lanes need the Spaces key pair beside DIGITALOCEAN_TOKEN for the
  # bucket module's data plane. `minimal` leaves ttl unset and DigitalOcean
  # reports 3600 back with no diff; `configured` sets 600.
  # What the lanes proved beyond existence: the verifier asserts the
  # `endpoint` output against the live endpoint (the hostname customers
  # CNAME to). The provider's read-after-destroy errors instead of settling,
  # so the verifier's own 404 is the kind's destroy proof -- measured: the
  # API answers 404 within two seconds of the DELETE. Endpoints are free.
  # Deferred arms: certificate + custom_domain (environmental gate -- needs
  # a delegated domain and a certificate, the Let's Encrypt class; unblock:
  # PLANTON_E2E_DIGITALOCEAN_DELEGATED_DOMAIN); ttl and certificate edits
  # (in-place upstream; the six-phase runner has no update phase).
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
