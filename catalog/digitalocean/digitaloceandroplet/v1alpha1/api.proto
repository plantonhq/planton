syntax = "proto3";

package dev.planton.digitalocean.digitaloceandroplet.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/digitalocean/digitaloceandroplet/v1alpha1/outputs.proto";
import "catalog/digitalocean/digitaloceandroplet/v1alpha1/spec.proto";
import "shared/metadata.proto";

// digital-ocean-droplet
message DigitalOceanDroplet {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = "digital-ocean.planton.dev/v1alpha1"];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = "DigitalOceanDroplet"];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  DigitalOceanDropletSpec spec = 4 [(buf.validate.field).required = true];

  //status
  DigitalOceanDropletStatus status = 5;
}

// digital-ocean-droplet status
message DigitalOceanDropletStatus {
  //outputs
  //  digital-ocean-droplet outputs
  DigitalOceanDropletOutputs outputs = 1;
}
