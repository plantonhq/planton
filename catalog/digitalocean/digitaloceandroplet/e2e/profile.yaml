apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: digitaloceandroplet
spec:
  # pending_proof: authored to the full offline bar (spec/CEL tests, both
  # engine builds, tofu validate green, checker-green parity manifest,
  # import map, presets, README/catalog/GUIDE). Live dual-engine proof has
  # not yet run. TWO scenarios: `minimal` is name + size + image only, with
  # NO region and NO vpc (proves the region-unset path where DigitalOcean
  # chooses, and the region-default-VPC path); `full` composes the VPC
  # fixture via the e2e-prerequisites annotation (the spec's vpc is
  # OPTIONAL, so the fixture is never a registry edge) plus weekly backups
  # with a policy window, monitoring and web-console agents, IPv6, tags,
  # cloud-init user data, graceful shutdown, and an explicit resize_disk.
  # Deliberately not in the live lanes: ssh_keys (a DigitalOceanSshKey
  # fixture can be composed through the typed reference; the scenario has
  # not yet been grown to carry one), volume_ids (needs a DigitalOceanVolume fixture -- rides that
  # kind's wave), gpu_partition_mode (GPU sizes are the expensive class AND
  # a Pulumi SDK v4.49.0 gap), and public_networking=false (Pulumi SDK gap;
  # it would also blind the verifier's public-IPv4 assertion). Droplets
  # create in about a minute and the smallest slug bills ~$0.009/hour, so a
  # full two-scenario dual-engine sweep costs pennies.
  tier: 1
  status: pending_proof
  validated_provisioners: []
  timeout_minutes: 15
