# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: digitaloceandroplet
spec:
  billing_model: always_on
  baseline_charges:
    - service_name: Droplets
      sku_meter: droplet instance
      pricing_unit: months
      description: The droplet bills per second (60-second minimum) from creation, capped at its size's flat monthly price -- an always-running droplet pays exactly the monthly cap, whether or not anything uses it.
  cost_drivers:
    - field_path: size
      sku_meter: droplet instance
      pricing_unit: months
      impact: "The size slug sets the flat monthly price -- the dominant term of the bill (s-1vcpu-1gb is 6.00 USD/mo, s-2vcpu-4gb is 24.00 USD/mo at https://www.digitalocean.com/pricing/droplets, retrieved 2026-08-22; DigitalOcean prices droplets identically in every region -- the pricing page carries one table with no region dimension)."
    - field_path: enable_backups
      sku_meter: automated backups
      pricing_unit: months
      impact: "Percentage-based automated backups add 20 percent (weekly plan) or 30 percent (daily plan) of the droplet's monthly cost while enabled (https://www.digitalocean.com/pricing/droplets, retrieved 2026-08-22)."
    - field_path: backup_policy.plan
      sku_meter: automated backups
      pricing_unit: months
      impact: "Selects the backup surcharge rate: weekly is 20 percent of droplet cost, daily is 30 percent; with backups enabled and no policy, DigitalOcean defaults to the daily plan."
  free_tier: ""
  estimate_exclusions:
    - "outbound data transfer beyond the size's included monthly allowance bills per GiB; inbound is free"
    - "attached block storage volumes (volume_ids) bill on their own DigitalOceanVolume components at 0.10 USD/GiB/mo -- attaching them adds no droplet-side charge"
    - "droplet snapshots bill 0.06 USD/GB per month (https://www.digitalocean.com/pricing/droplets, retrieved 2026-08-22) and are taken outside this spec"
    - "usage-based backup plans (per-GiB, custom retention) exist on DigitalOcean but this spec models only the percentage-based daily/weekly plans"
  notes: "Effective 2026-01-01 droplets bill per second with a 60-second minimum and the size's flat monthly price as a hard cap, so the monthly cap IS the committed charge for a droplet that exists all month. DigitalOcean prices droplets identically across regions -- region moves availability, not the rate. Destroying the droplet stops the meter; automated backups taken while it lived are retained per plan and stop accruing new charges with the droplet gone."
