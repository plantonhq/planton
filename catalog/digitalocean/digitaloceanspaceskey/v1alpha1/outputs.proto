syntax = "proto3";

package dev.planton.digitalocean.digitaloceanspaceskey.v1alpha1;

import "shared/options/options.proto";

// DigitalOceanSpacesKeyStackOutputs captures the key outputs after
// provisioning a Spaces access key.
message DigitalOceanSpacesKeyStackOutputs {
  // The access key ID (also the resource's API identity). Pairs with
  // secret_key as S3-style credentials against the Spaces endpoint.
  string access_key = 1;

  // The secret access key -- a SECRET. DigitalOcean returns it ONLY in the
  // create response; it can never be read again from the API, so this
  // output is the only place it ever exists. Both provisioners mark it
  // sensitive in their state.
  string secret_key = 2 [(dev.planton.shared.options.sensitive) = true];
}
