syntax = "proto3";

package dev.planton.digitalocean.digitaloceanspaceskey.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/digitalocean/digitaloceanspaceskey/v1alpha1/outputs.proto";
import "catalog/digitalocean/digitaloceanspaceskey/v1alpha1/spec.proto";
import "shared/metadata.proto";

// digital-ocean-spaces-key
message DigitalOceanSpacesKey {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'digital-ocean.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'DigitalOceanSpacesKey'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  DigitalOceanSpacesKeySpec spec = 4 [(buf.validate.field).required = true];

  //status
  DigitalOceanSpacesKeyStatus status = 5;
}

// digital-ocean-spaces-key status
message DigitalOceanSpacesKeyStatus {
  //outputs
  //  digital-ocean-spaces-key outputs
  DigitalOceanSpacesKeyOutputs outputs = 1;
}
