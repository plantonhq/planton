# Per-bucket DigitalOceanSpacesKey: a readwrite grant scoped to one bucket
# wired BY REFERENCE to the Bucket install fixture (the e2e-prerequisites
# annotation). The bucket lane brings its own environmental gate: bucket
# deploys need the Spaces key pair (SPACES_ACCESS_KEY_ID /
# SPACES_SECRET_ACCESS_KEY) alongside DIGITALOCEAN_TOKEN.
apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanSpacesKey
metadata:
  name: planton-oss-e2e-digitaloceanspaceskey-per-bucket
  id: planton-oss-e2e-digitaloceanspaceskey-per-bucket
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: digitaloceanspaceskey
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "DigitalOceanBucket"
    planton.dev/e2e-import-roundtrip-skip: >-
      digitalocean_spaces_key ships NO importer at the provider pin, and the
      secret_key exists only in the create response -- no import could ever
      restore it. The only reconcile after an adoption is a replace, which
      mints a SECOND key and orphans the first; the consequence is documented
      on the kind's GUIDE and the import catalog row.
  tags:
    - planton-e2e
spec:
  keyName: pltn-e2e-dospk-bkt-${E2E_RUN_ID}
  grants:
    - bucket:
        valueFrom:
          kind: DigitalOceanBucket
          name: planton-oss-e2e-digitaloceanbucket-min
          fieldPath: status.outputs.bucket_id
      permission: readwrite
