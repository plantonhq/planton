apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: digitaloceanspaceskey
spec:
  # green: proven live on BOTH engines (2026-09-16), both scenarios, every
  # phase including the idempotency gate. `full-access` is fixture-free and
  # token-only (the empty-bucket fullaccess grant grammar); `per-bucket`
  # rides the Bucket install fixture BY REFERENCE and therefore needs the
  # Spaces key pair SPACES_ACCESS_KEY_ID / SPACES_SECRET_ACCESS_KEY beside
  # DIGITALOCEAN_TOKEN (the bucket module's data plane). Keys are free;
  # each lane runs in seconds.
  # What the lanes proved beyond existence: the verifier signs one S3
  # request with the captured pair, so the write-once secret_key (returned
  # by DigitalOcean only in the create response) is proven REAL on both
  # engines -- a fullaccess key lists buckets; a bucket-scoped key is proven
  # by the S3 plane accepting the signature. A fresh pair is accepted by the
  # S3 plane within two seconds of the create response. A fullaccess grant
  # reads back with no bucket field. A deleted key answers 404 immediately.
  # Import round-trip: skipped by scenario annotation on both scenarios --
  # the resource ships no importer at the provider pin and the secret could
  # never be restored; a reconcile would mint a SECOND key (recorded on the
  # import catalog row and the kind's GUIDE).
  # Deferred arms (the six-phase runner has no update phase): rename and
  # grant-list replacement, both in-place upstream. Unblock: a runner update
  # phase.
  # Pulumi re-proven 2026-09-18 at bridge v4.79.1 (embedding provider
  # v2.100.1) on `per-bucket`: bucket fixture 21 s, DEPLOY 11 s, IDEMPOTENCY
  # PASS, the signed S3 call proving the secret in 1.4 s, DESTROY 16 s --
  # every phase first run; the bridge bump changed nothing this kind's lane
  # can observe.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
