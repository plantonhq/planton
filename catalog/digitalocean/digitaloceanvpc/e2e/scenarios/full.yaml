# Full VPC: description + explicit /24 range. The range deliberately avoids
# the prerequisite fixture's 10.60.0.0/24 and DigitalOcean's auto-assigned
# 10.x blocks.
apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanVpc
metadata:
  name: planton-oss-e2e-digitaloceanvpc-full-${E2E_RUN_ID}
  id: planton-oss-e2e-digitaloceanvpc-full-${E2E_RUN_ID}
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: digitaloceanvpc
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  description: Planton E2E full-surface VPC
  region: nyc3
  ipRangeCidr: "10.61.0.0/24"
