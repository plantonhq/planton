# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: digitaloceanvpc
spec:
  billing_model: free
  free_tier: "A DigitalOcean VPC is free to create and hold, and the traffic on it is free too -- the provider's own pricing page states 'Network traffic is free within a VPC network or between peered VPC networks in the same datacenter' and lists no charge for the VPC object itself (https://docs.digitalocean.com/products/networking/vpc/details/pricing/, fetched 2026-08-22). Private traffic inside the VPC does not count against member droplets' bandwidth allowances."
  notes: "No field of this spec buys anything: region placement, the description, and the CIDR choice (explicit or auto-assigned) are all free network control-plane configuration. The real spend lives in what runs INSIDE the network -- the droplets, Kubernetes clusters, databases, and load balancers placed in the VPC each bill as their own catalog kinds. The same pricing page's paid items all belong to OTHER resources this spec never provisions: cross-datacenter VPC peering bandwidth at $0.01 per GiB (billed on the peering, per the DigitalOceanVpcPeering kind), NAT gateways at $40.00 per month per size increment, and Partner Network Connect attachments."
