apiVersion: qa.planton.dev/v1
kind: ProviderE2EProfile
metadata:
  name: digitalocean
spec:
  # DigitalOcean authenticates with a scoped API token, never an OIDC
  # federation: the harness and BOTH IaC engines read the same ambient
  # DIGITALOCEAN_TOKEN environment variable (the exact name the upstream
  # terraform provider and the pulumi bridge resolve), so one credential
  # feeds deploys, destroys, and verification with zero plumbing.
  #
  # Spaces (object storage) is a separate credential plane: bucket lanes
  # additionally need SPACES_ACCESS_KEY_ID and SPACES_SECRET_ACCESS_KEY --
  # again the provider's own env names -- because Spaces buckets are only
  # reachable over the S3-compatible API, not the DigitalOcean REST API.
  # Lanes for every other kind run on the API token alone.
  #
  # ACCOUNT PRECONDITION (one-time, per region the lanes use): a default VPC
  # must already exist in every such region. A fresh account has none, the
  # first VPC created in a region becomes its default, and default VPCs
  # cannot be deleted -- the very first live lane stranded a Vpc scenario
  # that way. Setup stays read-only by design, so seeding lives in the
  # account runbook (see e2e/README.md, "DigitalOcean E2E"). A Droplet
  # created with NO region (the droplet kind's minimal scenario) lands
  # wherever DigitalOcean has capacity and, if that region had no default
  # VPC yet, DigitalOcean creates one on the fly -- so the seeded list grows
  # by itself (default-tor1, -blr1, -lon1, -sfo2 appeared this way in one
  # session; -nyc2, -sgp1, -sfo3 in the next); record, do not fight. Tags are the other residue class: every tag a lane's droplet or
  # volume declares outlives it, and DOKS adds its own (`k8s`, `k8s:<cluster
  # id>`, `k8s:worker`, `terraform:default-node-pool`) per cluster, so the
  # session-end sweep deletes them all.
  # Ghost VPC members are the third: a load balancer that never left `new`
  # or a database whose create failed can stay in `GET /v2/vpcs/{id}/members`
  # (URN, empty name) after the resource itself 404s, so the fixture VPC's
  # teardown fails `409 Can not delete VPC with members` and its CIDR stays
  # taken until DigitalOcean clears the ghost (45 minutes to more than a
  # day). Rename the stranded VPC to free the fixture name, move the Vpc
  # install fixture to the next unused /24 so the lanes keep running, and
  # delete the stranded VPC in a later sweep. The healthy cousin of this
  # class: after every DOKS cluster delete the worker droplets stay members
  # for ~2 minutes while the cluster itself already 404s -- the fixture
  # teardown's first attempt fails 409 and its retry succeeds; a lag, not a
  # ghost.
  # Database clusters leave a fourth residue: DigitalOcean auto-creates three
  # alert policies per cluster (`v1/dbaas/alerts/{cpu,memory,disk}_*`,
  # emailing a team member) that OUTLIVE the cluster -- the sweep lists
  # `GET /v2/monitoring/alerts` and deletes every `v1/dbaas/` policy whose
  # entity no longer exists (51 found after one session of database probes).
  #
  # DATABASE LANES: the account quota is 10 clusters (`412 maximum clusters
  # reached`); a cluster's COMBINED tags (joined by commas) may be at most
  # 255 characters (`422 combined tags cannot exceed 255 characters` -- an
  # honest validation refusal that creates nothing and poisons nothing, so
  # database scenario names use the kind's id prefix, e.g.
  # `planton-oss-e2e-dodb-min`, because the six Planton label tags carry
  # metadata.name twice); and a `POST /v2/databases` that fails PART-WAY
  # poisons the account for a few minutes -- every create then answers
  # `422 cluster name is not available` whatever the name -- and can leave
  # the ghost VPC member above. Never probe-create databases while a
  # database lane runs, and never retry a failed create inside that window.
  # The replica endpoint (`POST /v2/databases/{id}/replicas`) enforces the
  # same 255-character combined-tags cap, equally honestly. A read replica
  # is its own cluster under its own UUID -- with its own, initially EMPTY
  # firewall and its own three auto-created `v1/dbaas/alerts/*` policies,
  # which appear MINUTES after `online` (a sweep right after a lane can find
  # none; the session-end sweep is the one that counts). Every satellite
  # scenario deploys its own cluster fixture (~5 min), so a satellite kind
  # with two scenarios on two engines is four cluster creates.
  #
  # OPERATOR PRECONDITION (per machine): the alert lanes (monitor alerts,
  # uptime alert rows) read their email recipient from
  # PLANTON_E2E_DIGITALOCEAN_ALERT_EMAIL, because DigitalOcean delivers alert
  # email only to VERIFIED members of the team and rejects any other address
  # at create time. Each operator exports their own verified address beside
  # the token; the lanes skip honestly (planton.dev/e2e-required-env) when
  # it is unset rather than committing anyone's address to a scenario.
  credential_approach: api_token
  test_substrate: real_cloud
  default_cost_class: paid_ephemeral
  default_schedule_lane: weekly
  required_tools:
    - pulumi
    - tofu
  github_environment: e2e-digitalocean
  # Most DigitalOcean API objects create in seconds, but the account-level
  # droplet/volume quotas on a fresh account are modest; four concurrent
  # tests keeps lanes inside default limits.
  max_concurrent_tests: 4
  # assert_apply_idempotency re-plans every deployed scenario and fails on
  # any pending change -- the perpetual-diff class a customer would meet on
  # every re-apply (a hostname value DigitalOcean reports back with a
  # trailing dot the manifest omitted; a TTL DigitalOcean harmonized across
  # same-name records; a create-only argument the provider never reads
  # back). It stayed unarmed until the harness itself had a green baseline
  # (the first live session, on vpc/volume/certificate/registry), so a
  # harness defect could never be mistaken for a provider quirk; armed from
  # the second live session on. Prerequisite fixtures are outside its scope.
  assert_apply_idempotency: true
