apiVersion: qa.planton.dev/v1
kind: ProviderE2EProfile
metadata:
  name: digitalocean
spec:
  # DigitalOcean authenticates with a scoped API token, never an OIDC
  # federation: the harness and BOTH IaC engines read the same ambient
  # DIGITALOCEAN_TOKEN environment variable (the exact name the upstream
  # terraform provider and the pulumi bridge resolve), so one credential
  # feeds deploys, destroys, and verification with zero plumbing.
  #
  # Spaces (object storage) is a separate credential plane: bucket lanes
  # additionally need SPACES_ACCESS_KEY_ID and SPACES_SECRET_ACCESS_KEY --
  # again the provider's own env names -- because Spaces buckets are only
  # reachable over the S3-compatible API, not the DigitalOcean REST API.
  # Lanes for every other kind run on the API token alone.
  #
  # ACCOUNT PRECONDITION (one-time, per region the lanes use): a default VPC
  # must already exist in every such region. A fresh account has none, the
  # first VPC created in a region becomes its default, and default VPCs
  # cannot be deleted -- the very first live lane stranded a Vpc scenario
  # that way. Setup stays read-only by design, so seeding lives in the
  # account runbook (see e2e/README.md, "DigitalOcean E2E"). A Droplet
  # created with NO region (the droplet kind's minimal scenario) lands
  # wherever DigitalOcean has capacity and, if that region had no default
  # VPC yet, DigitalOcean creates one on the fly -- so the seeded list grows
  # by itself (default-tor1, -blr1, -lon1, -sfo2 appeared this way in one
  # session); record, do not fight. Tags are the other residue class: every tag a lane's droplet or
  # volume declares outlives it, so the session-end sweep deletes them.
  credential_approach: api_token
  test_substrate: real_cloud
  default_cost_class: paid_ephemeral
  default_schedule_lane: weekly
  required_tools:
    - pulumi
    - tofu
  github_environment: e2e-digitalocean
  # Most DigitalOcean API objects create in seconds, but the account-level
  # droplet/volume quotas on a fresh account are modest; four concurrent
  # tests keeps lanes inside default limits.
  max_concurrent_tests: 4
  # assert_apply_idempotency re-plans every deployed scenario and fails on
  # any pending change -- the perpetual-diff class a customer would meet on
  # every re-apply (a hostname value DigitalOcean reports back with a
  # trailing dot the manifest omitted; a TTL DigitalOcean harmonized across
  # same-name records; a create-only argument the provider never reads
  # back). It stayed unarmed until the harness itself had a green baseline
  # (the first live session, on vpc/volume/certificate/registry), so a
  # harness defect could never be mistaken for a provider quirk; armed from
  # the second live session on. Prerequisite fixtures are outside its scope.
  assert_apply_idempotency: true
