syntax = "proto3";

package dev.planton.digitalocean.digitaloceankubernetesnodepool.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/digitalocean/digitaloceankubernetesnodepool/v1alpha1/outputs.proto";
import "catalog/digitalocean/digitaloceankubernetesnodepool/v1alpha1/spec.proto";
import "shared/metadata.proto";

// digital-ocean-kubernetes-node-pool
message DigitalOceanKubernetesNodePool {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'digital-ocean.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'DigitalOceanKubernetesNodePool'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  DigitalOceanKubernetesNodePoolSpec spec = 4 [(buf.validate.field).required = true];

  //status
  DigitalOceanKubernetesNodePoolStatus status = 5;
}

// digital-ocean-kubernetes-node-pool status
message DigitalOceanKubernetesNodePoolStatus {
  //outputs
  //  digital-ocean-kubernetes-node-pool outputs
  DigitalOceanKubernetesNodePoolOutputs outputs = 1;
}
