apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: digitaloceankubernetesnodepool
spec:
  # Live-proven on BOTH engines, both scenarios, full lifecycle under the
  # idempotency gate, plus the blind import round-trip on the Terraform lane
  # (`{node_pool_id}` bare UUID -- the provider's importer found the pool by
  # scanning the account's clusters; both scenarios re-imported with a plan
  # that proposed no change and tolerated nothing). `minimal` is a fixed
  # one-node pool on the cheapest DOKS-capable slug proving the lifecycle
  # and the two identity outputs (the verifier addresses the pool directly
  # as /clusters/{cluster_id}/node_pools/{node_pool_id}, which proves both
  # outputs in one call, and asserts every node running). `full` proves
  # autoscaling 1-2, two node labels, a PreferNoSchedule taint, and pool
  # tags including a colon-form tag. Both ride the registry prerequisite
  # edge to DigitalOceanKubernetesCluster (its `minimal` profile is the
  # install fixture, which itself composes the Vpc fixture).
  #
  # What the live runs measured: DEPENDENCIES-UP 5-5.5 min (VPC + cluster);
  # pool DEPLOY 1.5-2 min (the provider returns only when every node is
  # running); pool DESTROY 70-80 s (nodes drain and terminate first);
  # DEPENDENCIES-DOWN ~3.5 min including the fixture VPC's one expected 409
  # retry while the cluster's droplets leave the VPC. Tags read back exactly
  # as sent (the provider filters only DOKS's own k8s:/terraform: tags);
  # labels and the taint read back verbatim; the autoscaled pool produced
  # no idempotency or post-import diff -- but only because the autoscaler
  # had not acted before the gate ran. The cluster kind's inline pool,
  # which shares this schema, later autoscaled to two nodes within minutes
  # of creation and both provisioners planned `node_count 2 -> 1` against
  # its stated count (the provider writes the live count back into
  # node_count on every read and re-sends a stated one on update; its
  # diff-suppress hides the difference only while stated equals live). The
  # contract is now the provider's own: an autoscaled pool states NO
  # node_count (the spec rejects both together), both engines send none,
  # and the pool starts at min_nodes; `full` carries that shape. The pool's
  # node and Droplet ids are
  # deliberately not outputs (they churn by design); Droplet-scoped wiring
  # goes through the pool's tags.
  #
  # Deliberately not in the live lanes: gpu_partition_mode (both engines
  # wire it; GPU sizes are the expensive class and the field means nothing
  # on a non-GPU size -- unblocks when an owner funds a GPU node). The pool
  # bills only its nodes (~$0.018/hour on s-1vcpu-2gb); the fixture cluster
  # dominates the lane's wall clock. Run ONE scenario per `go test` with a
  # 75-minute budget: each lane is three lifecycles deep.
  #
  # Pulumi re-proven 2026-09-18 at bridge v4.79.1 (embedding provider
  # v2.100.1) on `full` under the no-node_count contract: cluster fixture
  # 5m51s, DEPLOY 1m39s, IDEMPOTENCY PASS, VERIFY-RES PASS (every node
  # running), DESTROY 1m31s, VERIFY-CLN PASS, first run.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 40
