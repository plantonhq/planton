# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/componentcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: ComponentControlProfile
metadata:
  name: digitaloceandatabasereplica
spec:
  controls:
    - control_id: enc-at-rest
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: DigitalOcean Managed Databases encrypt storage at rest as a managed-service property; replicas are full managed database nodes and inherit it. No off switch exists.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: DigitalOcean Managed Databases offer no customer-managed keys.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Replica endpoints require TLS exactly like primary endpoints; the uri/private_uri outputs carry sslmode=require connection strings.
    - control_id: no-public-access
      status: configurable
      field_path: vpc
      evidence:
        type: spec_default
        reference: Setting vpc places the replica's private endpoint in the named VPC (private_host/private_uri); unset uses the target region's default VPC.
      notes: A public endpoint always exists on DigitalOcean managed databases; restrict who can reach it with the replica's own trusted-sources rules (see restricted-ingress). VPC placement is create-only.
    - control_id: restricted-ingress
      status: not_applicable
      notes: Inbound restriction is the replica's OWN trusted-sources rule set, which DigitalOcean models as a separate resource -- a DigitalOceanDatabaseFirewall whose cluster references this replica (its replica_id output) targets it from outside this spec. The set starts empty and the primary's rules never reach it (measured live), so a replica with no firewall of its own stays reachable from anywhere with the primary's credentials.
    - control_id: edge-protection
      status: not_applicable
      notes: No HTTP edge; there is no request-filtering surface.
    - control_id: rbac
      status: not_applicable
      notes: A replica is read-only and serves the PRIMARY's users and grants; it has no access-control surface of its own.
    - control_id: workload-identity
      status: not_applicable
      notes: Authentication is database-credential based; no keyless path exists upstream.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: No authentication-protocol choice exists on the replica.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: No replica-level audit surface exists upstream.
    - control_id: monitoring-integration
      status: not_applicable
      notes: The resource exposes no metrics wiring of its own; DigitalOcean database metrics and the DigitalOceanMonitorAlert kind target clusters.
    - control_id: backup-recovery
      status: not_applicable
      notes: DigitalOcean backs up the PRIMARY, not replicas -- a replica is disposable read capacity, recreated from the primary by IaC. Losing a replica loses no data.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backup surface (see backup-recovery).
    - control_id: multi-zone-ha
      status: configurable
      field_path: region
      evidence:
        type: spec_default
        reference: region is required and free to differ from the primary's -- a cross-region replica provides geographically redundant read capacity (and a manual promotion target in DigitalOcean's console).
      notes: The replica itself is single-node; true HA standbys are the PRIMARY cluster's node_count. This control covers the read path's geographic redundancy only.
    - control_id: deletion-protection
      status: not_applicable
      notes: DigitalOcean offers no deletion-protection flag for replicas. Related hazard taught on the spec -- tags are create-only upstream, so a retag REPLACES the replica (a fresh seed from the primary, not a data loss).
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: Replicas are managed database nodes; DigitalOcean applies maintenance through the cluster family's managed channel (windows are configured on the primary).
