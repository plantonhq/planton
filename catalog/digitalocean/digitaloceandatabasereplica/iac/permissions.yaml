# Least-privilege permissions the IaC runner's DigitalOcean credential
# needs to provision, update, and destroy this component with the official
# modules. DigitalOcean authenticates with a bearer API token carrying
# named scopes; every group entry is `derived` (static analysis of the
# module sources, cited in notes) until the live capture lane upgrades it
# to `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: digitaloceandatabasereplica
spec:
  digital_ocean:
    groups:
      - purpose: ManageDatabaseReplica
        scopes:
          - database:read
          - database:create
          - database:update
          - database:delete
        provenance: derived
        notes: Covers digitalocean_database_replica's create/read/update/delete/import paths -- read the replica through GET /v2/databases/{c}/replicas/{n} (database:read), create the replica via POST /v2/databases/{c}/replicas (database:create), perform in-place size/storage resize via PUT /v2/databases/{replica_id}/resize (database:update), and delete it via DELETE /v2/databases/{c}/replicas/{n} (database:delete). A full-access token also works; it is never least-privilege.
