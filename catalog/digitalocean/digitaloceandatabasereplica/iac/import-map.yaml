apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: digitaloceandatabasereplica
spec:
  # DigitalOcean reads replicas by the (primary cluster, replica name)
  # pair -- the replica's own UUID has no read endpoint. Both halves are
  # outputs, so zero user input when state is present.
  values:
    - name: cluster_id
      derivations:
        - from_output: cluster_id
      where_to_find: >-
        DigitalOcean control panel -> Databases -> the PRIMARY cluster ->
        the UUID in the cluster's page URL, or `doctl databases list` (the
        ID column).
    - name: replica_name
      derivations:
        - from_output: replica_name
      where_to_find: >-
        DigitalOcean control panel -> Databases -> the primary cluster ->
        Settings -> Read-only replicas (the replica's name), or `doctl
        databases replica list <cluster-id>`.
