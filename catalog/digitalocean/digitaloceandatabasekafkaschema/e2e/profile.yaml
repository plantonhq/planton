apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: digitaloceandatabasekafkaschema
spec:
  # green: proven live on BOTH engines (2026-09-17), the one scenario
  # (`minimal` IS the kind's total surface -- all four arguments required,
  # all create-only), every phase including the idempotency gate. The lane
  # rides the kind's OWN General Purpose Kafka fixture (`gd-2vcpu-8gb` x 3,
  # ~9.5-11 min to create, ~$0.30/hour) plus the PostgreSQL registry
  # prerequisite (~5 min); the GP plan is not a cost choice: DigitalOcean's
  # schema registry exists only on General Purpose Kafka plans (a Basic
  # cluster answers every registry call 412 and refuses to enable it, 422
  # "not supported for current plan"), and a fresh GP cluster comes with
  # the registry ENABLED. Registering the subject takes ~10-17 s; the
  # subject 404s within two seconds of the DELETE.
  # What the lanes proved beyond existence: the registry stores every
  # Avro/JSON schema in canonical form (keys sorted, no whitespace) and the
  # provider's Read stores that text verbatim, so both modules canonicalize
  # JSON-typed schemas before sending -- the scenario's schema is written
  # in human key order (type, name, fields) on purpose and Terraform's
  # REFRESHED idempotency plan read "No changes". Protobuf schemas are sent
  # verbatim and the registry reformats them (measured: a blank line after
  # the syntax line), so a protobuf subject re-plans a replacement on
  # every refreshed Terraform plan -- a recorded provider caveat on the
  # GUIDE, not a deferral (no protobuf scenario: the class is measured and
  # documented, and a lane would only prove the known replacement).
  # Import round-trip: the type is declared `not_importable_upstream_reason`
  # in aa_import/catalog.yaml (the importer restores only cluster_id at
  # the pin), so the Terraform lane skipped the import and the
  # reconcile-apply RE-REGISTERED the subject -- a registry-side no-op
  # (an identical re-register answers 201 with the same schema id and
  # version, measured). Re-evaluate on any provider pin bump.
  # SERIALIZATION with the topic kind is no longer required (the two kinds
  # deploy differently named fixtures), but Kafka lanes are still run one
  # at a time for the account's database quota and the machine.
  # Deferred arms: schema evolution is destroy+recreate upstream and drops
  # all versions -- the GUIDE steers customers to their producers' registry
  # client for evolution; the runner has no update phase.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 45
