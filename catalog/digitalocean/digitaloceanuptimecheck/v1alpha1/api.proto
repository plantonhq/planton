syntax = "proto3";

package dev.planton.digitalocean.digitaloceanuptimecheck.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/digitalocean/digitaloceanuptimecheck/v1alpha1/outputs.proto";
import "catalog/digitalocean/digitaloceanuptimecheck/v1alpha1/spec.proto";
import "shared/metadata.proto";

// digital-ocean-uptime-check
message DigitalOceanUptimeCheck {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = 'digital-ocean.planton.dev/v1alpha1'];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = 'DigitalOceanUptimeCheck'];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  DigitalOceanUptimeCheckSpec spec = 4 [(buf.validate.field).required = true];

  //status
  DigitalOceanUptimeCheckStatus status = 5;
}

// digital-ocean-uptime-check status
message DigitalOceanUptimeCheckStatus {
  //outputs
  //  digital-ocean-uptime-check outputs
  DigitalOceanUptimeCheckOutputs outputs = 1;
}
