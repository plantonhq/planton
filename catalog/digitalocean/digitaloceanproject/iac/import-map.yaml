apiVersion: iac.planton.dev/v1
kind: ComponentImportMap
metadata:
  name: digitaloceanproject
spec:
  # The project imports by its bare UUID. Every argument is read back;
  # two normalize on the way (recorded in aa_import/catalog.yaml): purpose
  # comes back with the API's "Other: " prefix stripped by the provider,
  # and environment comes back capitalized ("Production") -- the provider
  # only diff-suppresses that, so state holds the capitalized form against
  # the lowercase config. Never adopt the account's DEFAULT project: it
  # reads back is_default=true against a manifest that leaves the flag
  # unset, and the first apply would try to un-default it.
  values:
    - name: project_id
      derivations:
        - from_stack_output: project_id
      where_to_find: >-
        DigitalOcean control panel -> the project -> Settings (the UUID in
        the page URL), or `doctl projects list` (the ID column).
