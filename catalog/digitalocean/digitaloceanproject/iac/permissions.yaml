# Least-privilege permissions the IaC runner's DigitalOcean credential
# needs to provision, update, and destroy this component with the official
# modules. DigitalOcean authenticates with a bearer API token carrying
# named scopes; every group entry is `derived` (static analysis of the
# module sources, cited in notes) until the live capture lane upgrades it
# to `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: digitaloceanproject
spec:
  digital_ocean:
    groups:
      - purpose: ManageProject
        scopes:
          - project:read
          - project:create
          - project:update
          - project:delete
        provenance: derived
        notes: Covers digitalocean_project's create/read/update/delete/import paths -- read the project through GET /v2/projects/{id} (project:read), create the project via POST /v2/projects (project:create), update fields via PATCH /v2/projects/{id} (project:update), and delete the project via DELETE /v2/projects/{id} (project:delete). Scope names verified against https://docs.digitalocean.com/reference/api/scopes/, retrieved 2026-08-22. A full-access token also works; it is never least-privilege.
      - purpose: AssignResources
        scopes:
          - project:assign_resource
        provenance: derived
        notes: (Re)assign member resources via POST /v2/projects/{id}/resources; also covers destroy-time relocation of members to the default project.
