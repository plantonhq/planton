# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: digitaloceanproject
spec:
  billing_model: free
  notes: Projects are DigitalOcean's free organizational containers -- creating, populating, or deleting one never changes what anything costs. The bill belongs entirely to the member resources, each priced by its own kind.
