syntax = "proto3";

package dev.planton.digitalocean.digitaloceanbucket.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/digitalocean/digitaloceanbucket/v1alpha1/outputs.proto";
import "catalog/digitalocean/digitaloceanbucket/v1alpha1/spec.proto";
import "shared/metadata.proto";

// digital-ocean-bucket
message DigitalOceanBucket {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = "digital-ocean.planton.dev/v1alpha1"];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = "DigitalOceanBucket"];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  DigitalOceanBucketSpec spec = 4 [(buf.validate.field).required = true];

  //status
  DigitalOceanBucketStatus status = 5;
}

// digital-ocean-bucket status
message DigitalOceanBucketStatus {
  //outputs
  //  digital-ocean-bucket outputs
  DigitalOceanBucketOutputs outputs = 1;
}
