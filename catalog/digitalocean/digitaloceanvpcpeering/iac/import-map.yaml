apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: digitaloceanvpcpeering
spec:
  # The peering imports by its UUID (passthrough importer). Lossless: name,
  # vpc_ids, and status are all read back.
  values:
    - name: peering_id
      derivations:
        - from_output: peering_id
      where_to_find: >-
        DigitalOcean control panel -> Networking -> VPC -> the VPC's
        "Peering connections" tab, or the API
        (`doctl` has no peering command at this writing; GET /v2/vpcs/peerings).
