apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: digitaloceanvpcpeering
spec:
  # green: proven live on BOTH engines (2026-09-17), the one scenario
  # (`minimal` IS the kind's total create surface: name + exactly two
  # VPCs), every phase including the idempotency gate and the blind import
  # round-trip (LOSSLESS by the bare UUID, zero tolerated updates). The
  # catalog's first dual-fixture-of-one-kind scenario worked as designed:
  # the runner deployed the registry prerequisite's install VPC first, then
  # the scenario-declared second VPC (DEPENDENCIES-UP ~16 s), and resolved
  # vpc_1/vpc_2 by name. Measured: DEPLOY 12-18 s (the provider waits for
  # ACTIVE), DESTROY 13-22 s (it waits through DELETING), the peering 404s
  # within a second of the wait ending, both VPCs tore down in ~18 s.
  # The peering name carries the run id: names are unique per team and a
  # delete passes through DELETING before the name is free.
  # The lifecycle status is not an output (an apply-time snapshot could only
  # ever read ACTIVE); the verifier asserts existence live.
  # Deferred arms (no runner update phase): rename, the kind's only in-place
  # update upstream.
  # Pulumi re-proven 2026-09-18 at bridge v4.79.1 (embedding provider
  # v2.100.1) on `minimal`: both VPC fixtures 18 s, DEPLOY 13 s, IDEMPOTENCY
  # PASS, DESTROY 16 s -- every phase first run; the bridge bump changed
  # nothing this kind's lane can observe.
  tier: 1
  status: green
  validated_provisioners:
    - pulumi
    - terraform
  timeout_minutes: 15
