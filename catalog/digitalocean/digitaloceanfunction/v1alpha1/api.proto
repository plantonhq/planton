syntax = "proto3";

package dev.planton.digitalocean.digitaloceanfunction.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/digitalocean/digitaloceanfunction/v1alpha1/outputs.proto";
import "catalog/digitalocean/digitaloceanfunction/v1alpha1/spec.proto";
import "shared/metadata.proto";

// digital-ocean-function
message DigitalOceanFunction {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = "digital-ocean.planton.dev/v1alpha1"];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = "DigitalOceanFunction"];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  DigitalOceanFunctionSpec spec = 4 [(buf.validate.field).required = true];

  //status
  DigitalOceanFunctionStatus status = 5;
}

// digital-ocean-function status
message DigitalOceanFunctionStatus {
  //outputs
  //  digital-ocean-function outputs
  DigitalOceanFunctionOutputs outputs = 1;
}
