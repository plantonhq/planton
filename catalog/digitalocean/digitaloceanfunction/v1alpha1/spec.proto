syntax = "proto3";

package dev.planton.digitalocean.digitaloceanfunction.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/digitalocean/app_spec.proto";
import "catalog/digitalocean/region.proto";
import "shared/foreignkey/v1/foreign_key.proto";

// DigitalOceanFunctionSpec deploys serverless functions as an App Platform
// app with a single functions component. The provider has no standalone
// Functions resource; both engines create digitalocean_app.
//
// Runtime, memory, timeout, entrypoint, and schedules are NOT on this spec.
// They live in the repo's project.yml (inside source_directory), which App
// Platform reads at deploy time. Putting those knobs on the spec would
// silently do nothing.
message DigitalOceanFunctionSpec {
  option (buf.validate.message).cel = {
    id: "function_one_source"
    message: "set exactly one source: git, github, gitlab, or bitbucket. Use git with a public clone URL when the DigitalOcean account has no linked GitHub/GitLab/Bitbucket connection"
    expression: "(has(this.git) ? 1 : 0) + (has(this.github) ? 1 : 0) + (has(this.gitlab) ? 1 : 0) + (has(this.bitbucket) ? 1 : 0) == 1"
  };

  // Functions component name inside the app.
  string function_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 32
  ];

  DigitalOceanRegion region = 2 [(buf.validate.field).required = true];

  DigitalOceanAppGitSource git = 3;
  DigitalOceanAppGithubSource github = 4;
  DigitalOceanAppGitlabSource gitlab = 5;
  DigitalOceanAppBitbucketSource bitbucket = 6;

  // Directory inside the repo that contains project.yml and the packages
  // tree, for example packages/api.
  string source_directory = 7 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];

  repeated DigitalOceanAppEnvVar envs = 8;
  repeated DigitalOceanAppComponentAlert alerts = 9;
  repeated DigitalOceanAppLogDestination log_destinations = 10;

  // Retired field. project_id was a literal project UUID written before the
  // Project kind existed. Its number must never be reused with a different
  // meaning; the field returns below as a typed reference that also accepts
  // a literal UUID.
  reserved 11;

  // (Optional) The project the functions app is created in. Reference a
  // DigitalOceanProject resource (the default wiring resolves its
  // project_id output) or pass a literal project UUID. When unset, the app
  // lands in the account's default project.
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 12 [
    (dev.planton.shared.foreignkey.v1.default_kind) = DigitalOceanProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];
}
