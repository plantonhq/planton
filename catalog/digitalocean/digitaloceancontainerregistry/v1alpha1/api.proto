syntax = "proto3";

package dev.planton.digitalocean.digitaloceancontainerregistry.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/digitalocean/digitaloceancontainerregistry/v1alpha1/outputs.proto";
import "catalog/digitalocean/digitaloceancontainerregistry/v1alpha1/spec.proto";
import "shared/metadata.proto";

// digital-ocean-container-registry
message DigitalOceanContainerRegistry {
  //api-version
  string api_version = 1 [(buf.validate.field).string.const = "digital-ocean.planton.dev/v1alpha1"];

  //resource-kind
  string kind = 2 [(buf.validate.field).string.const = "DigitalOceanContainerRegistry"];

  //metadata
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];

  //spec
  DigitalOceanContainerRegistrySpec spec = 4 [(buf.validate.field).required = true];

  //status
  DigitalOceanContainerRegistryStatus status = 5;
}

// digital-ocean-container-registry status
message DigitalOceanContainerRegistryStatus {
  //outputs
  //  digital-ocean-container-registry outputs
  DigitalOceanContainerRegistryOutputs outputs = 1;
}
