# Least-privilege permissions the IaC runner's DigitalOcean credential
# needs to provision, update, and destroy this component with the official
# modules. DigitalOcean authenticates with a bearer API token carrying
# named scopes; every group entry is `derived` (static analysis of the
# module sources, cited in notes) until the live capture lane upgrades it
# to `proven`. Schema: iac/catalogkindpermissions/v1.
#
# The registry takes no DigitalOcean tags (no tag scope).
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: digitaloceancontainerregistry
spec:
  digital_ocean:
    groups:
      - purpose: ManageRegistry
        scopes:
          - registry:create
          - registry:read
          - registry:update
          - registry:delete
        provenance: derived
        notes: Covers digitalocean_container_registry and digitalocean_container_registry_docker_credentials create/read/update/delete paths in both the Terraform and Pulumi modules -- create the registry via POST /v2/registry, where name, tier, and region ride the create body (registry:create), read the registry via GET /v2/registry on refresh (registry:read), change the subscription tier via POST /v2/registry/subscription, the only mutable field (registry:update), and destroy via DELETE /v2/registry, which deletes every stored image (registry:delete). Scope names per https://docs.digitalocean.com/reference/api/scopes/, read 2026-08-22. A full-access token also works; it is never least-privilege.
      - purpose: MintDockerCredentials
        scopes:
          - registry:read
          - registry:update
        provenance: derived
        notes: "When the spec's docker_credentials block is set: the runner mints/re-mints the Docker credential via GET /v2/registry/docker-credentials, and DigitalOcean's own OpenAPI spec (registry_get_dockerCredentials.yml) declares BOTH registry:read and registry:update on that endpoint. The minted Docker credential is itself a SECRET exported through the docker_credentials output -- these scopes are what let the runner mint it, not what consumers use to pull."
