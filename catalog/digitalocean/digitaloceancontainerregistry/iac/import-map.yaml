apiVersion: iac.planton.dev/v1
kind: CatalogKindImportMap
metadata:
  name: digitaloceancontainerregistry
spec:
  # The registry imports by NAME (the resource id is the registry name; an
  # account holds exactly one registry). The module exports it as the
  # registry_name output -- zero user input when state is present.
  #
  # The docker-credentials resource this module optionally creates is NOT
  # importable at the current provider pin: its importer is passthrough, but
  # its Read requires registry_name from prior state (which passthrough never
  # sets), so import always fails -- and even a fixed importer could not
  # recover `write`/`expiry_seconds` (the API never returns them) without
  # minting a fresh token as a side effect. The proof lane's blind round-trip
  # covers the registry resource and records the credentials resource as
  # excluded for exactly this reason (see aa_import/catalog.yaml).
  values:
    - name: registry_name
      derivations:
        - from_output: registry_name
      where_to_find: >-
        DigitalOcean control panel -> Container Registry (the registry's
        name), or `doctl registry get` (the Name column).
