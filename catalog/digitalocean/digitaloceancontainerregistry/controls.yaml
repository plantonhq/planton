# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: digitaloceancontainerregistry
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: The spec has no encryption surface -- DOCR's backing storage is platform-managed with no customer-facing encryption control anywhere in the API.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: DigitalOcean offers no customer-managed-key service anywhere on the platform -- no CMK surface exists for the registry.
    - control_id: enc-in-transit
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The registry endpoint (registry.digitalocean.com) serves the Docker Registry API over HTTPS only -- pushes and pulls cannot travel plaintext, and nothing in the spec or API can weaken that.
      notes: Platform-wide guarantee.
    - control_id: no-public-access
      status: not_applicable
      notes: The registry endpoint is always DigitalOcean's shared authenticated endpoint -- no anonymous access exists, and no private-endpoint or network-placement option exists either. There is no exposure knob to configure in either direction.
    - control_id: restricted-ingress
      status: not_applicable
      notes: DOCR offers no source-IP restriction -- access control is entirely credential-based (see rbac), with no network rule surface.
    - control_id: edge-protection
      status: not_applicable
      notes: The registry speaks the Docker Registry API behind DigitalOcean's shared endpoint -- no WAF or request-filter surface is exposed to configure.
    - control_id: rbac
      status: configurable
      field_path: docker_credentials.write
      evidence:
        type: spec_default
        reference: Defaults false -- the minted credential is read-only (pull); true mints a push-capable credential. Omitting the docker_credentials block entirely mints nothing, the most restrictive posture.
      notes: The one credential covers the whole registry -- DOCR has no per-repository grants. The preset mints a write credential for CI push pipelines. Team-member access to the registry through the control panel rides DigitalOcean team roles, outside this spec.
    - control_id: workload-identity
      status: not_applicable
      notes: Registry consumers authenticate with the minted Docker credential or a DigitalOcean API token -- no keyless, platform-issued identity path exists. DOKS clusters integrate through the cluster kind's registry_integration, which distributes pull credentials, not workload identity.
    - control_id: no-legacy-auth
      status: configurable
      field_path: docker_credentials.expiry_seconds
      evidence:
        type: spec_default
        reference: Unset defers to the API maximum -- roughly 50 years, an effectively non-expiring static credential; setting an expiry bounds the credential's life, and changing the value re-mints it in place (the rotation path).
      notes: The preset pins 30 days and rotates by re-apply. A leaked non-expiring pull/push credential is the kind's biggest practical risk, which is why the spec's default of minting nothing matters.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: DOCR exposes no push/pull access log or audit configuration -- management-plane actions land in the team's account activity outside this component.
    - control_id: monitoring-integration
      status: not_applicable
      notes: DigitalOcean exposes no registry-scoped metrics surface -- storage consumption is visible in the control panel but nothing integrates with DigitalOcean Monitoring or alerting.
    - control_id: backup-recovery
      status: not_applicable
      notes: DigitalOcean offers no backup service for registry contents -- images are re-pushable artifacts whose source of truth is the build pipeline, not the registry.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: With no backup channel (see backup-recovery), no retention knob exists. Garbage collection of untagged manifests is an on-demand API action outside this spec.
    - control_id: multi-zone-ha
      status: not_applicable
      notes: The registry is a single managed endpoint with data in one region (the optional region field) -- DigitalOcean offers no replication or multi-region registry to configure.
    - control_id: deletion-protection
      status: not_applicable
      notes: Neither the DigitalOcean API nor the provider offers a deletion-protection flag for the registry -- nothing exists to refuse a delete, and deleting the registry deletes every stored image.
    - control_id: managed-patching
      status: enforced_by_default
      evidence:
        type: provider_default
        reference: The registry is a fully managed service -- DigitalOcean operates and updates the registry software invisibly, with no version or patch surface exposed anywhere in the API.
      notes: There is nothing for the operator to patch.
