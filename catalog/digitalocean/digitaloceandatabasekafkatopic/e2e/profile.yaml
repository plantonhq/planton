apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: digitaloceandatabasekafkatopic
spec:
  # pending_proof: proven on TERRAFORM only (2026-09-17), both scenarios,
  # every phase including the idempotency gate and the blind import
  # round-trips; the PULUMI lanes are BLOCKED AT THE TREE'S PIN by an
  # upstream provider defect the bridge has not yet caught up with.
  # Terraform (provider v2.101.0 under the ~> 2.99 float): `minimal` and
  # `configured` DEPLOY in 15-32 s, IDEMPOTENCY PASS on the refreshed plan,
  # DESTROY ~4 s, the topic 404s within two seconds; both round-trips
  # re-imported blind by "{cluster_id},{topic_name}" tolerating exactly the
  # declared config-only `partition_count` (the provider's Read echoes the
  # prior state value, which is empty after an import, so the plan reads
  # `0 -> 3`; the reconcile-apply's equal-count update is an API no-op).
  # The declared write-normalized `config.min_insync_replicas` tolerance
  # never fired: the provider DOES read it back from the server (`minimal`
  # read 1, `configured` read the 2 it sent), so the catalog note records
  # the measurement.
  # THE PULUMI BLOCKER: the pinned bridge (pulumi-digitalocean v4.53.0)
  # embeds terraform-provider-digitalocean v2.67.0, whose topic Create
  # dereferences the topic in the API's create response -- and DigitalOcean
  # now creates topics asynchronously, answering `accepted` ("topic is
  # still provisioning") with NO topic body, so the provider panics
  # (nil pointer, resource_database_kafka_topic.go:318) on every create.
  # Upstream fixed it in v2.99.1 (PR #1563: derive the id from the request
  # and wait until the topic is readable); the first bridge carrying that
  # upstream is v4.78.1 (2026-08-07; latest v4.79.1 embeds v2.100.1).
  # Nothing in the module can avoid a panic inside the provider's Create.
  # UNBLOCK: bump the root go.mod pulumi-digitalocean/sdk/v4 pin to
  # >= v4.78.1 (a queue-wide change -- one pin for all 31 kinds -- decided by
  # the owner), re-verify every kind's PARITY-EXCEPTION guard at the new
  # pin, then re-run `TestDigitalOceanDatabaseKafkaTopic_Pulumi`.
  # Both scenarios ride the shared Basic-plan Kafka fixture (`db-s-2vcpu-4gb`
  # x 3 -- the smallest Kafka-eligible size; ~11-12 min to create) plus the
  # PostgreSQL registry prerequisite (~5 min); each lane is ~12.5 min.
  # Deferred arms (no runner update phase): partition growth and config
  # edits are in-place upstream.
  tier: 1
  status: pending_proof
  validated_provisioners:
    - terraform
  timeout_minutes: 45
