# Configured DigitalOceanDatabaseKafkaTopic: explicit partitions and
# replication plus a config block exercising every leaf class -- the two
# enum walls, signed and unsigned 64-bit tunables (retention at -1 =
# unlimited size cap alongside a real time cap), the float ratio, the
# local-default min_insync_replicas, and a bool. Rides the same shared
# Kafka fixture as the minimal scenario.
apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanDatabaseKafkaTopic
metadata:
  name: planton-oss-e2e-digitaloceandatabasekafkatopic-cfg
  id: planton-oss-e2e-digitaloceandatabasekafkatopic-cfg
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-catalog-kind: digitaloceandatabasekafkatopic
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "catalog/digitalocean/digitaloceandatabasekafkatopic/e2e/fixtures/kafka-cluster.yaml"
  tags:
    - planton-e2e
spec:
  cluster:
    valueFrom:
      kind: DigitalOceanDatabaseCluster
      name: planton-oss-e2e-digitalocean-kafka-fixture
      fieldPath: status.outputs.cluster_id
  topicName: pltn-e2e-dokft-cfg
  partitionCount: 3
  replicationFactor: 2
  config:
    cleanupPolicy: delete
    compressionType: producer
    messageTimestampType: create_time
    minInsyncReplicas: 2
    retentionBytes: -1
    retentionMs: 259200000
    segmentBytes: 209715200
