# Least-privilege permissions the IaC runner's DigitalOcean credential
# needs to provision, update, and destroy this component with the official
# modules. DigitalOcean authenticates with a bearer API token carrying
# named scopes; every group entry is `derived` (static analysis of the
# module sources, cited in notes) until the live capture lane upgrades it
# to `proven`. Schema: iac/catalogkindpermissions/v1.
apiVersion: iac.planton.dev/v1
kind: CatalogKindPermissions
metadata:
  name: digitaloceandatabasekafkatopic
spec:
  digital_ocean:
    groups:
      - purpose: ManageKafkaTopic
        scopes:
          - database:read
          - database:create
          - database:update
          - database:delete
        provenance: derived
        notes: Covers digitalocean_database_kafka_topic's create/read/update/delete/import paths -- read the topic via GET /v2/databases/{cluster}/topics/{name} (database:read), create the topic via POST /v2/databases/{cluster}/topics, where DigitalOcean's own OpenAPI spec (databases_create_kafka_topic.yml) declares database:create on this endpoint (database:create), update partitions/replication/config via PUT /v2/databases/{cluster}/topics/{name}, where the OpenAPI spec (databases_update_kafka_topic.yml) declares database:update (database:update), and delete the topic via DELETE /v2/databases/{cluster}/topics/{name}, where the OpenAPI spec (databases_delete_kafka_topic.yml) declares database:delete (database:delete). Scope names per https://docs.digitalocean.com/reference/api/scopes/, read 2026-08-22. A full-access token also works; it is never least-privilege.
