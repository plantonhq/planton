# Control profile: this component's posture against every control in the
# central catalog (catalog/_compliance/controls-catalog.yaml). Every control
# is examined; not_applicable states why. Evidence is verifiable against the
# spec contract and the official modules. Schema:
# compliance/catalogkindcontrolprofile/v1.
apiVersion: compliance.planton.dev/v1
kind: CatalogKindControlProfile
metadata:
  name: digitaloceandatabasekafkatopic
spec:
  controls:
    - control_id: enc-at-rest
      status: not_applicable
      notes: Storage encryption is a property of the owning Kafka CLUSTER (DigitalOcean encrypts managed-database disks by default); a topic is a logical namespace inside it with no storage posture of its own.
    - control_id: enc-at-rest-cmk
      status: not_applicable
      notes: No customer-managed-key surface exists on DigitalOcean managed databases, and none on topics (see enc-at-rest).
    - control_id: enc-in-transit
      status: not_applicable
      notes: Transport security is the cluster's posture (DigitalOcean managed Kafka requires TLS connections); a topic has no endpoints of its own.
    - control_id: no-public-access
      status: not_applicable
      notes: Reachability is the cluster's posture (its trusted-sources firewall); a topic has no network surface of its own.
    - control_id: restricted-ingress
      status: not_applicable
      notes: No network surface (see no-public-access); ingress control lives on the DigitalOceanDatabaseFirewall kind.
    - control_id: edge-protection
      status: not_applicable
      notes: No HTTP edge; there is no request-filtering surface.
    - control_id: rbac
      status: not_applicable
      notes: Per-topic access control lives on the cluster's USERS (the DigitalOceanDatabaseUser kind's kafka_acls pair topics with permissions), not on the topic resource itself.
    - control_id: workload-identity
      status: not_applicable
      notes: Kafka authentication is credential-based per database user; no keyless / federated alternative exists upstream.
    - control_id: no-legacy-auth
      status: not_applicable
      notes: Authentication protocol choices are the cluster's posture, not the topic's.
    - control_id: strong-user-auth
      status: not_applicable
      notes: The component itself enforces no end-user sign-in -- it packages no human sign-in surface; any credentials it carries are workload or administrative access, whose posture rbac and workload-identity carry.
    - control_id: audit-logging
      status: not_applicable
      notes: DigitalOcean exposes no per-topic audit surface; account-level activity appears in the DigitalOcean team audit history.
    - control_id: monitoring-integration
      status: not_applicable
      notes: Topics emit no metrics of their own; cluster-level database metrics are the DigitalOceanMonitorAlert kind's dbaas family.
    - control_id: backup-recovery
      status: not_applicable
      notes: DigitalOcean managed Kafka has no topic-level backup surface; the topic definition is recreated by IaC from the spec, and message data retention is governed by the topic's own retention config.
    - control_id: backup-retention-policy
      status: not_applicable
      notes: No backup surface (see backup-recovery); retention_ms/retention_bytes govern LOG retention, which is data lifecycle, not backup.
    - control_id: multi-zone-ha
      status: enforced_by_default
      evidence:
        type: spec_validation
        reference: replication_factor carries a CEL floor of 2 (mirroring the provider's own validator) and DigitalOcean defaults to 2 when unset -- a single-copy topic is unrepresentable.
      notes: Replicas spread across the owning cluster's brokers; the replication ceiling is the cluster's node count (API-enforced), so the cluster's own sizing bounds how far topic redundancy can go.
    - control_id: deletion-protection
      status: not_applicable
      notes: DigitalOcean offers no deletion-protection flag for topics; deleting the topic drops its messages (documented in the GUIDE).
    - control_id: managed-patching
      status: not_applicable
      notes: Broker software patching is the managed cluster's posture; a topic runs no software.
