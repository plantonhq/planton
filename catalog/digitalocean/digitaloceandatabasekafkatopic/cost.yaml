# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: digitaloceandatabasekafkatopic
spec:
  billing_model: free
  notes: Topics are free API objects inside a managed Kafka cluster -- the cluster's nodes bill, the topics on them do not. Partition count and retention settings shape how the CLUSTER's paid storage and throughput are consumed, but DigitalOcean meters nothing per topic.
