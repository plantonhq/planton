# Cost profile: what drives this component's bill. Field paths are
# spec-relative proto field names, held to the served contract by the
# catalog-data conformance gate. Schema: finops/catalogkindcostprofile/v1.
apiVersion: finops.planton.dev/v1
kind: CatalogKindCostProfile
metadata:
  name: digitaloceanfirewall
spec:
  billing_model: free
  free_tier: "DigitalOcean Cloud Firewalls are free without qualification -- the provider's own pricing page states 'DigitalOcean Cloud Firewalls are available at no additional cost' (https://docs.digitalocean.com/products/networking/firewalls/details/pricing/, fetched 2026-08-22). No meter counts firewalls, rules, rule sources, or the traffic the firewall inspects and drops."
  notes: "No field of this spec buys anything: the rule sets, the tag attachments, and the droplet attachments are all free network control-plane configuration. The real spend lives in what the firewall PROTECTS -- the droplets attached by ID or tag bill hourly at their size's rate as their own catalog kind, and the load balancers or Kubernetes clusters named as rule sources bill as theirs. The firewall changes which packets reach them, never what they cost."
