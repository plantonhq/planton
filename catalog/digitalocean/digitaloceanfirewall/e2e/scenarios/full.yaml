# Full-surface DigitalOceanFirewall: proves LIVE droplet targeting through
# the droplet_ids reference (the Droplet fixture rides the e2e-prerequisites
# annotation -- droplet targeting is OPTIONAL on the kind, so it is never a
# registry edge) plus tag targeting and a rule-level tag source. The tag
# arms name the fixture Droplet's own Planton identity tag: the API rejects
# a firewall naming a tag that does not exist yet ("422 tag ... does not
# exist" -- firewalls never create tags; Droplets do), so the one tag a
# fresh account is guaranteed to carry at this point is one the fixture
# Droplet created. Rule-level droplet / kubernetes / load balancer sources
# are deferred arms -- see profile.yaml.
apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanFirewall
metadata:
  name: planton-oss-e2e-digitaloceanfirewall-full
  id: planton-oss-e2e-digitaloceanfirewall-full
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: digitaloceanfirewall
  annotations:
    planton.dev/e2e: "true"
    planton.dev/e2e-prerequisites: "DigitalOceanDroplet"
  tags:
    - planton-e2e
spec:
  firewallName: pltn-e2e-dofw-full-${E2E_RUN_ID}
  dropletIds:
    - valueFrom:
        kind: DigitalOceanDroplet
        name: planton-oss-e2e-digitaloceandroplet-min
        fieldPath: status.outputs.droplet_id
  tags:
    - planton-ai_name:planton-oss-e2e-digitaloceandroplet-min
  inboundRules:
    - protocol: tcp
      portRange: "443"
      sourceAddresses:
        - 0.0.0.0/0
        - ::/0
    - protocol: tcp
      portRange: "22"
      sourceAddresses:
        - 192.0.2.0/24
      sourceTags:
        - planton-ai_name:planton-oss-e2e-digitaloceandroplet-min
  outboundRules:
    - protocol: tcp
      portRange: all
      destinationAddresses:
        - 0.0.0.0/0
        - ::/0
    - protocol: icmp
      destinationAddresses:
        - 0.0.0.0/0
