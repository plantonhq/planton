apiVersion: qa.planton.dev/v1
kind: ComponentE2EProfile
metadata:
  name: digitaloceankubernetescluster
spec:
  # Live-proven on BOTH engines, both scenarios, full lifecycle under the
  # idempotency gate, plus the blind import round-trip on the Terraform lane
  # (`{cluster_id}` UUID; both scenarios re-imported with a plan that
  # proposed no change and tolerated nothing -- the provider's node_count
  # diff-suppress against actual_node_count and its filtering of the
  # terraform:default-node-pool tag both held live). `minimal` is a one-node
  # cluster on the cheapest DOKS-capable slug proving the create/verify/
  # destroy lifecycle and the identity outputs (the verifier asserts
  # api_server_endpoint, urn, default_node_pool_id, cluster_subnet, and
  # service_subnet against the live cluster; named `minimal` so it doubles
  # as the node-pool kind's cluster fixture). `hardened` proves the
  # control-plane firewall, a maintenance policy (read back with
  # DigitalOcean's own 4h duration), cluster-autoscaler tuning
  # (scale_down_unneeded_time "1m30s" read back verbatim), an explicit
  # surge_upgrade, the routing-agent addon, and a default pool with labels,
  # a taint, tags, and autoscaling 1-2. Both ride the VPC registry
  # prerequisite (the spec's vpc is REQUIRED, so the fixture is a registry
  # edge, never a per-scenario annotation).
  #
  # What the live runs measured: DEPLOY 5-7 minutes per cluster; the cluster
  # 404s within seconds of DELETE (DESTROY 2-10 s) while its worker Droplets
  # stay VPC members for ~2 minutes, so the fixture VPC's first teardown
  # attempt fails 409 and the runner's retry absorbs it (DEPENDENCIES-DOWN
  # ~2-3 minutes). An explicit ha=false is honored on a 1.35 cluster (no
  # idempotency diff). kubernetesVersion is a minor prefix in both scenarios
  # because DigitalOcean retires patch slugs every few weeks; the read-back
  # is the full slug and both engines ignore drift on the field.
  # ipv4_address reads back EMPTY on clusters created today (single-replica
  # included) -- the API server is reachable only by the endpoint hostname.
  # Cluster names carry ${E2E_RUN_ID} because a DOKS delete runs for minutes
  # after the API accepts it.
  #
  # Deliberately not in the live lanes, each with its unblock: highly_available
  # (HA control plane bills ~$40/month extra -- prove when an owner funds it);
  # GPU node pools and the GPU addons (gpu_partition_mode, the AMD/NVIDIA
  # device plugins, DRA drivers, RDMA plugin -- GPU Droplets are the most
  # expensive arm and the toggles mean nothing on a non-GPU pool; the
  # offline plans prove the wiring on both engines); sso (needs a real OIDC
  # issuer and client -- prove when an identity provider is arranged for the
  # account); isolated_workers (the API requires a NAT gateway attached to
  # the cluster's VPC and the nodes bill as dedicated hardware -- prove when
  # an owner funds it); worker_subnet_uuid (needs a VPC subnet, which the
  # catalog has no kind for yet -- prove when one exists); the peer-to-peer
  # OCI registry plugin and the CoreDNS autoscaler ARE in the hardened lane
  # (both engines); registry_integration (needs a DOCR registry in the account --
  # a same-session fixture from the ContainerRegistry kind would prove it);
  # destroy_all_associated_resources (a destroy-behavior flag a test should
  # never exercise against a shared account); custom cluster/service subnets
  # (create-only CIDRs; the offline plan proves the wiring). Clusters bill
  # per node hourly (s-1vcpu-2gb ~$0.018/hour), so the two-scenario
  # dual-engine sweep costs a few cents.
  tier: 1
  status: green
  validated_provisioners: [pulumi, terraform]
  timeout_minutes: 40
