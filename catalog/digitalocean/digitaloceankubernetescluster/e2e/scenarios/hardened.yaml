# Hardened DigitalOceanKubernetesCluster: proves the surfaces the minimal
# lane leaves at defaults -- an enabled control-plane firewall, a
# maintenance policy (the day leaf the old collapsed string could not
# express), cluster-autoscaler tuning, an explicit surge_upgrade, the
# three addon toggles that need no GPU hardware (routing agent, the
# peer-to-peer OCI registry plugin, and the CoreDNS autoscaler -- all three
# asserted ON; on this version the autoscaler defaults OFF, so the explicit
# true is a real assertion), and a default pool exercising labels, a taint,
# pool tags, and autoscaling. Deliberately absent, each with its unblock on
# the profile: highly_available (cost), sso (needs an OIDC issuer),
# isolated_workers (needs a NAT gateway on the VPC and bills dedicated
# hardware), worker_subnet_uuid (needs a VPC subnet the catalog has no kind
# for), gpu_partition_mode and the GPU addons (GPU droplets are the
# expensive arm), and custom subnets (create-only CIDRs add no verify value
# over the offline plan).
# clusterName carries ${E2E_RUN_ID} and kubernetesVersion is a minor prefix
# for the reasons the minimal scenario's header gives.
apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanKubernetesCluster
metadata:
  name: planton-oss-e2e-digitaloceankubernetescluster-hard
  id: planton-oss-e2e-digitaloceankubernetescluster-hard
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: digitaloceankubernetescluster
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  clusterName: pltn-e2e-doks-hard-${E2E_RUN_ID}
  region: nyc3
  kubernetesVersion: "1.35"
  vpc:
    valueFrom:
      kind: DigitalOceanVpc
      name: planton-oss-e2e-digitaloceanvpc-prereq
      fieldPath: status.outputs.vpc_id
  surgeUpgrade: true
  maintenancePolicy:
    day: sunday
    startTime: "02:00"
  # 0.0.0.0/0 proves the firewall block's wiring without locking the
  # harness out -- its egress IP is unknown, and a real allowlist would
  # block the verifier's API access to the cluster.
  controlPlaneFirewall:
    enabled: true
    allowedAddresses:
      - "0.0.0.0/0"
  clusterAutoscalerConfiguration:
    scaleDownUtilizationThreshold: 0.5
    scaleDownUnneededTime: "1m30s"
    expanders:
      - least-waste
  routingAgent:
    enabled: true
  p2pOciRegistryPlugin:
    enabled: true
  corednsAutoscaler:
    enabled: true
  tags:
    - planton-e2e
  defaultNodePool:
    size: s-1vcpu-2gb
    nodeCount: 1
    autoScale: true
    minNodes: 1
    maxNodes: 2
    labels:
      e2e-arm: hardened
    taints:
      - key: dedicated
        value: e2e
        effect: PreferNoSchedule
    tags:
      - planton-e2e
