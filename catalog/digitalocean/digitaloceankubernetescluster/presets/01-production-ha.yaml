apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanKubernetesCluster
metadata:
  name: my-production-cluster
spec:
  clusterName: my-production-cluster
  region: nyc3
  kubernetesVersion: "1.35"
  vpc:
    valueFrom:
      kind: DigitalOceanVpc
      name: my-vpc
      fieldPath: status.outputs.vpc_id
  highlyAvailable: true
  autoUpgrade: true
  maintenancePolicy:
    day: sunday
    startTime: "03:00"
  registryIntegration: true
  controlPlaneFirewall:
    enabled: true
    allowedAddresses:
      - "203.0.113.0/24"
  tags:
    - production
    - kubernetes
  defaultNodePool:
    size: s-4vcpu-8gb
    nodeCount: 3
    autoScale: true
    minNodes: 2
    maxNodes: 5
