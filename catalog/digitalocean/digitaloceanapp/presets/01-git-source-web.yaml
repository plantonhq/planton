apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanApp
metadata:
  name: my-web-app
spec:
  appName: my-web-app
  region: nyc
  services:
    - name: web
      git:
        repoCloneUrl: https://github.com/digitalocean/sample-nodejs.git
        branch: main
      instanceSizeSlug: basic-xxs
      instanceCount: 1
      envs:
        - key: NODE_ENV
          plaintext: production
