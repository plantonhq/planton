# Composed DigitalOceanApp: an HTTP service plus a background worker,
# both from public Docker Hub images. Proves the multi-component app
# spec (service + worker families) without GitHub, private registries,
# or any field that needs a fixture or an environment variable (no vpc,
# custom domain, or alert destinations -- the alerted scenario carries
# the alert arms behind its email gate).
#
# appName carries ${E2E_RUN_ID}: App Platform app names are unique across
# the account and capped at 32 characters. 20 + 10 (run id + engine
# suffix) = 30.
apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanApp
metadata:
  name: planton-oss-e2e-digitaloceanapp-comp
  id: planton-oss-e2e-digitaloceanapp-comp
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: digitaloceanapp
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  appName: pltn-e2e-doapp-comp-${E2E_RUN_ID}
  region: nyc
  services:
    - name: web
      image:
        registryType: docker_hub
        registry: library
        repository: nginx
        tag: latest
      instanceSizeSlug: basic-xxs
      instanceCount: 1
      httpPort: 80
  workers:
    - name: worker
      image:
        registryType: docker_hub
        registry: library
        repository: nginx
        tag: latest
      instanceSizeSlug: basic-xxs
      instanceCount: 1
