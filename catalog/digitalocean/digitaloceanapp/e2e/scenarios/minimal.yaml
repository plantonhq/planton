# Minimal DigitalOceanApp: one HTTP service from a public Docker Hub
# image. No GitHub connection, no private registry, no custom domain.
# Proves the image-source service path, region placement, and the
# app_id / default_hostname / live_url outputs.
#
# appName carries ${E2E_RUN_ID}: App Platform app names are unique across
# the account and capped at 32 characters, so a fixed name would collide
# with a stalled or concurrent lane. 19 + 10 (run id + engine suffix) = 29.
apiVersion: digital-ocean.planton.dev/v1alpha1
kind: DigitalOceanApp
metadata:
  name: planton-oss-e2e-digitaloceanapp-min
  id: planton-oss-e2e-digitaloceanapp-min
  org: planton-oss
  env: e2e
  labels:
    managed-by: planton-e2e
    e2e-component: digitaloceanapp
  annotations:
    planton.dev/e2e: "true"
  tags:
    - planton-e2e
spec:
  appName: pltn-e2e-doapp-min-${E2E_RUN_ID}
  region: nyc
  services:
    - name: web
      image:
        registryType: docker_hub
        registry: library
        repository: nginx
        tag: latest
      instanceSizeSlug: basic-xxs
      instanceCount: 1
      httpPort: 80
