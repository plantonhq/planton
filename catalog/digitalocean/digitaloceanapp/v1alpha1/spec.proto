syntax = "proto3";

package dev.planton.digitalocean.digitaloceanapp.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/digitalocean/app_spec.proto";
import "catalog/digitalocean/region.proto";
import "shared/foreignkey/v1/foreign_key.proto";
import "shared/options/options.proto";

// DigitalOceanAppSpec is the full App Platform application: any mix of
// services, workers, jobs, static sites, functions, and in-app databases,
// plus domains, ingress, alerts, and VPC placement.
//
// The app name is spec.app_name (2-32 characters, the provider's limit).
// Component instance sizes are free-form slugs such as basic-xxs or
// professional-s - the provider does not publish a closed list, so new
// sizes work without a catalog change.
message DigitalOceanAppSpec {
  option (buf.validate.message).cel = {
    id: "app_has_a_component"
    message: "add at least one component: a service, worker, job, static site, or function - an empty app cannot deploy"
    expression: "size(this.services) + size(this.workers) + size(this.jobs) + size(this.static_sites) + size(this.functions) > 0"
  };

  // App name, unique in the DigitalOcean account. DNS-friendly, 2-32
  // characters. This is spec.name in the Terraform resource.
  string app_name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 2,
    (buf.validate.field).string.max_len = 32,
    (buf.validate.field).string.pattern = "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
  ];

  // Region slug, for example nyc3. Required to place the app.
  DigitalOceanRegion region = 2 [(buf.validate.field).required = true];

  repeated DigitalOceanAppService services = 3;
  repeated DigitalOceanAppWorker workers = 4;
  repeated DigitalOceanAppJob jobs = 5;
  repeated DigitalOceanAppStaticSite static_sites = 6;
  repeated DigitalOceanAppFunctionComponent functions = 7;
  repeated DigitalOceanAppDatabase databases = 8;

  repeated DigitalOceanAppDomain domains = 9;
  repeated DigitalOceanAppEnvVar envs = 10;
  repeated DigitalOceanAppAlert alerts = 11;
  DigitalOceanAppIngress ingress = 12;

  DigitalOceanAppEgressType egress = 13;
  DigitalOceanAppMaintenance maintenance = 14;

  // VPC the app's egress is placed in. Optional. The Pulumi SDK at v4.49.0
  // cannot set this; Terraform wires it and Pulumi fails loudly if it is set.
  dev.planton.shared.foreignkey.v1.StringValueOrRef vpc = 15 [
    (dev.planton.shared.foreignkey.v1.default_kind) = DigitalOceanVpc,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.vpc_id",
    (dev.planton.shared.options.diagram_label) = "in vpc"
  ];

  // Feature flags App Platform accepts as free-form strings.
  repeated string features = 16;

  bool disable_edge_cache = 17;
  bool disable_email_obfuscation = 18;
  bool enhanced_threat_control_enabled = 19;

  // Retired field. project_id was a literal project UUID written before the
  // Project kind existed. Its number must never be reused with a different
  // meaning; the field returns below as a typed reference that also accepts
  // a literal UUID.
  reserved 20;

  // (Optional) The project the app is created in. Reference a
  // DigitalOceanProject resource (the default wiring resolves its
  // project_id output) or pass a literal project UUID. When unset, the app
  // lands in the account's default project.
  dev.planton.shared.foreignkey.v1.StringValueOrRef project_id = 21 [
    (dev.planton.shared.foreignkey.v1.default_kind) = DigitalOceanProject,
    (dev.planton.shared.foreignkey.v1.default_kind_field_path) = "status.outputs.project_id"
  ];
}

// HTTP service that receives external or internal traffic.
message DigitalOceanAppService {
  option (buf.validate.message).cel = {
    id: "service_one_source"
    message: "set exactly one source for this service: git, github, gitlab, bitbucket, or image"
    expression: "(has(this.git) ? 1 : 0) + (has(this.github) ? 1 : 0) + (has(this.gitlab) ? 1 : 0) + (has(this.bitbucket) ? 1 : 0) + (has(this.image) ? 1 : 0) == 1"
  };
  option (buf.validate.message).cel = {
    id: "service_autoscale_or_count"
    message: "when autoscaling is set, leave instance_count unset - App Platform ignores a fixed count while autoscaling is on"
    expression: "!has(this.autoscaling) || this.instance_count == 0u"
  };

  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Working directory inside the repo for the build.
  string source_dir = 2;
  DigitalOceanAppGitSource git = 3;
  DigitalOceanAppGithubSource github = 4;
  DigitalOceanAppGitlabSource gitlab = 5;
  DigitalOceanAppBitbucketSource bitbucket = 6;
  DigitalOceanAppImageSource image = 7;

  // Runtime identifier App Platform auto-detects when omitted, for example
  // node-js or go.
  string environment_slug = 8;
  string dockerfile_path = 9;
  string build_command = 10;
  string run_command = 11;

  // Instance size slug, for example basic-xxs, basic-s, professional-xs.
  // Current slugs are listed in the DigitalOcean App Platform docs; the
  // provider does not validate the value.
  string instance_size_slug = 12 [(dev.planton.shared.options.recommended_default) = "basic-xxs"];
  // Fixed instance count when autoscaling is off. Default 1.
  uint32 instance_count = 13 [(dev.planton.shared.options.recommended_default) = "1"];

  optional uint32 http_port = 14 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 65535
  }];
  repeated uint32 internal_ports = 15;

  DigitalOceanAppHealthCheck health_check = 16;
  // Liveness probe. Terraform wires this; Pulumi at v4.49.0 fails loudly if set.
  DigitalOceanAppHealthCheck liveness_health_check = 17;
  DigitalOceanAppAutoscaling autoscaling = 18;
  DigitalOceanAppTermination termination = 19;

  repeated DigitalOceanAppEnvVar envs = 20;
  repeated DigitalOceanAppComponentAlert alerts = 21;
  repeated DigitalOceanAppLogDestination log_destinations = 22;
}

// Background worker. No HTTP port. Autoscaling is supported.
message DigitalOceanAppWorker {
  option (buf.validate.message).cel = {
    id: "worker_one_source"
    message: "set exactly one source for this worker: git, github, gitlab, bitbucket, or image"
    expression: "(has(this.git) ? 1 : 0) + (has(this.github) ? 1 : 0) + (has(this.gitlab) ? 1 : 0) + (has(this.bitbucket) ? 1 : 0) + (has(this.image) ? 1 : 0) == 1"
  };
  option (buf.validate.message).cel = {
    id: "worker_autoscale_or_count"
    message: "when autoscaling is set, leave instance_count unset - App Platform ignores a fixed count while autoscaling is on"
    expression: "!has(this.autoscaling) || this.instance_count == 0u"
  };
  option (buf.validate.message).cel = {
    id: "worker_no_drain"
    message: "drain_seconds is a service-only HTTP drain; workers only honor grace_period_seconds"
    expression: "!has(this.termination) || !has(this.termination.drain_seconds)"
  };

  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string source_dir = 2;
  DigitalOceanAppGitSource git = 3;
  DigitalOceanAppGithubSource github = 4;
  DigitalOceanAppGitlabSource gitlab = 5;
  DigitalOceanAppBitbucketSource bitbucket = 6;
  DigitalOceanAppImageSource image = 7;
  string environment_slug = 8;
  string dockerfile_path = 9;
  string build_command = 10;
  string run_command = 11;
  string instance_size_slug = 12 [(dev.planton.shared.options.recommended_default) = "basic-xxs"];
  uint32 instance_count = 13 [(dev.planton.shared.options.recommended_default) = "1"];
  // Liveness probe. Terraform wires this; Pulumi at v4.49.0 fails loudly if set.
  DigitalOceanAppHealthCheck liveness_health_check = 14;
  DigitalOceanAppAutoscaling autoscaling = 15;
  DigitalOceanAppTermination termination = 16;
  repeated DigitalOceanAppEnvVar envs = 17;
  repeated DigitalOceanAppComponentAlert alerts = 18;
  repeated DigitalOceanAppLogDestination log_destinations = 19;
}

enum DigitalOceanAppJobKind {
  digital_ocean_app_job_kind_unspecified = 0;
  pre_deploy = 1;
  post_deploy = 2;
  failed_deploy = 3;
}

// Job that runs around a deployment. kind selects pre_deploy, post_deploy,
// or failed_deploy. No autoscaling.
message DigitalOceanAppJob {
  option (buf.validate.message).cel = {
    id: "job_one_source"
    message: "set exactly one source for this job: git, github, gitlab, bitbucket, or image"
    expression: "(has(this.git) ? 1 : 0) + (has(this.github) ? 1 : 0) + (has(this.gitlab) ? 1 : 0) + (has(this.bitbucket) ? 1 : 0) + (has(this.image) ? 1 : 0) == 1"
  };
  option (buf.validate.message).cel = {
    id: "job_no_drain"
    message: "drain_seconds is a service-only HTTP drain; jobs only honor grace_period_seconds"
    expression: "!has(this.termination) || !has(this.termination.drain_seconds)"
  };

  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string source_dir = 2;
  DigitalOceanAppGitSource git = 3;
  DigitalOceanAppGithubSource github = 4;
  DigitalOceanAppGitlabSource gitlab = 5;
  DigitalOceanAppBitbucketSource bitbucket = 6;
  DigitalOceanAppImageSource image = 7;
  string environment_slug = 8;
  string dockerfile_path = 9;
  string build_command = 10;
  string run_command = 11;
  string instance_size_slug = 12 [(dev.planton.shared.options.recommended_default) = "basic-xxs"];
  uint32 instance_count = 13 [(dev.planton.shared.options.recommended_default) = "1"];
  DigitalOceanAppJobKind kind = 14;
  DigitalOceanAppTermination termination = 15;
  repeated DigitalOceanAppEnvVar envs = 16;
  repeated DigitalOceanAppComponentAlert alerts = 17;
  repeated DigitalOceanAppLogDestination log_destinations = 18;
}

// Static site. No instance size, no alerts, no log destinations, no image
// source - the site is built from git.
message DigitalOceanAppStaticSite {
  option (buf.validate.message).cel = {
    id: "static_site_one_source"
    message: "set exactly one source for this static site: git, github, gitlab, or bitbucket"
    expression: "(has(this.git) ? 1 : 0) + (has(this.github) ? 1 : 0) + (has(this.gitlab) ? 1 : 0) + (has(this.bitbucket) ? 1 : 0) == 1"
  };

  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  string source_dir = 2;
  DigitalOceanAppGitSource git = 3;
  DigitalOceanAppGithubSource github = 4;
  DigitalOceanAppGitlabSource gitlab = 5;
  DigitalOceanAppBitbucketSource bitbucket = 6;
  string environment_slug = 7;
  string dockerfile_path = 8;
  string build_command = 9;
  // Directory of built assets. App Platform auto-scans _static, dist, and
  // public when omitted.
  string output_dir = 10;
  string index_document = 11;
  string error_document = 12;
  string catchall_document = 13;
  repeated DigitalOceanAppEnvVar envs = 14;
}

// Functions component inside an app. Runtime, memory, timeout, and schedules
// live in the repo's project.yml - App Platform reads that file from
// source_dir and Terraform cannot set those knobs. Source is git only (no
// container image).
message DigitalOceanAppFunctionComponent {
  option (buf.validate.message).cel = {
    id: "function_one_source"
    message: "set exactly one source for this functions component: git, github, gitlab, or bitbucket"
    expression: "(has(this.git) ? 1 : 0) + (has(this.github) ? 1 : 0) + (has(this.gitlab) ? 1 : 0) + (has(this.bitbucket) ? 1 : 0) == 1"
  };

  string name = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.min_len = 1
  ];
  // Directory inside the repo that contains project.yml and the packages tree.
  string source_dir = 2;
  DigitalOceanAppGitSource git = 3;
  DigitalOceanAppGithubSource github = 4;
  DigitalOceanAppGitlabSource gitlab = 5;
  DigitalOceanAppBitbucketSource bitbucket = 6;
  repeated DigitalOceanAppEnvVar envs = 7;
  repeated DigitalOceanAppComponentAlert alerts = 8;
  repeated DigitalOceanAppLogDestination log_destinations = 9;
}
