syntax = "proto3";

package dev.planton.digitalocean.digitaloceanapp.v1alpha1;

import "buf/validate/validate.proto";
import "catalog/digitalocean/digitaloceanapp/v1alpha1/outputs.proto";
import "catalog/digitalocean/digitaloceanapp/v1alpha1/spec.proto";
import "shared/metadata.proto";

// DigitalOcean App Platform application.
message DigitalOceanApp {
  string api_version = 1 [(buf.validate.field).string.const = "digital-ocean.planton.dev/v1alpha1"];
  string kind = 2 [(buf.validate.field).string.const = "DigitalOceanApp"];
  dev.planton.shared.CatalogObjectMetadata metadata = 3 [(buf.validate.field).required = true];
  DigitalOceanAppSpec spec = 4 [(buf.validate.field).required = true];
  DigitalOceanAppStatus status = 5;
}

message DigitalOceanAppStatus {
  DigitalOceanAppOutputs outputs = 1;
}
