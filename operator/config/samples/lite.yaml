# Lite deployment profile for Kind clusters and local development.
#
# All defaults: single-instance PostgreSQL via CloudNativePG, minimal
# storage, optional components enabled for validation. Placeholder images
# for control plane and console (real images require external config).
#
# Usage:
#   kubectl apply -f config/samples/lite.yaml
#   kubectl get plantonplatform -w
apiVersion: planton.ai/v1
kind: PlantonPlatform
metadata:
  name: planton
  namespace: default
spec:
  version: v0.0.45
  database:
    postgresql:
      storageSize: 1Gi
    redis:
      storageSize: 256Mi
  # The bundled secrets manager (spec.vault) is deployed by default and keeps
  # its data in the platform's database, so a lab install has nothing to size
  # for it. Opting out is the deliberate act:
  #   vault:
  #     enabled: false
  controlPlane:
    image:
      repository: nginx
      tag: 1.27-alpine
  console:
    image:
      repository: nginx
      tag: 1.27-alpine
