syntax = "proto3";

package dev.planton.shared.options;

import "google/protobuf/descriptor.proto";

message KeyValuePair {
  string key = 1;
  string value = 2;
}

extend google.protobuf.FieldOptions {
  string default = 60001;
  string recommended_default = 60002;
  repeated KeyValuePair recommended_default_map = 60003;
  // Marks a field as holding a secret value (a credential, token, password, key,
  // etc.). Downstream platforms (e.g. Planton) use this to force the value to be
  // a reference to a managed secret rather than plaintext, and to resolve that
  // reference just-in-time at deploy. Applies to each string slot the field holds:
  // a string, each element of a repeated string, each value of a map, and the
  // literal value of a StringValueOrRef (a StringValueOrRef's cross-resource
  // value_from is not a secret literal and is left to reference resolution). A
  // message-typed field is not itself a slot; mark the secret fields inside it.
  bool sensitive = 60004;

  // Justification that a field whose NAME matches the secret-coverage heuristic
  // (password|token|secret|key|credential|...) is intentionally NOT a secret
  // value -- e.g. a public key, an access-key *id*, a resource *name*, or a key
  // *algorithm*. A non-empty value exempts the field from the secret-coverage gap
  // report and records WHY (the value is the audit trail).
  //
  // This is read ONLY by secret-coverage tooling. It has NO effect on enforcement
  // or just-in-time resolution: a field is secret-by-default solely when
  // `sensitive` is true, so an exemption can never let a secret field accept
  // plaintext. Setting both `sensitive` and `sensitive_exempt_reason` on the same
  // field is a contradiction the coverage gate rejects.
  string sensitive_exempt_reason = 60005;

  // Human-authored label for the dependency edge this reference field creates in
  // architecture/deployment diagrams. Authored on the CONSUMER's reference field
  // (a StringValueOrRef/ValueFromRef-typed field, beside `default_kind`), because
  // only the consumer knows what the relationship MEANS: an AwsNatGateway's
  // subnet_id reads "in public subnet", not "subnet_id".
  //
  // Downstream platforms surface this on the rendered edge. When absent, clients
  // fall back to automatic humanization of the referenced field path, so coverage
  // is never required — author a label only where the automatic text is
  // inadequate. Keep labels short (2-4 words), lowercase, human: they are read on
  // a diagram at a glance, not in a form.
  string diagram_label = 60006;

  // Marks a workload kind's IMAGE SLOT: the field where a deployment pipeline
  // injects the container image it built. Authored on the CONTAINER-CARRYING
  // field of the spec (never on a leaf inside a shared container message,
  // where sidecars would inherit it), with the value naming the dotted
  // subpath from each element to the image, e.g. "image" on a repeated
  // container list, or "app.image" on a singular container group whose `app`
  // is the one injectable container.
  //
  // The injection SEMANTICS derive from the annotated field's own shape and
  // are implemented once per consumer stack, never per kind:
  //   - a REPEATED annotated field is blank-fill: elements whose image is
  //     empty receive the built reference; explicitly authored images
  //     (sidecars) are untouched — leaving the image blank IS the authoring
  //     contract, so there is no placeholder grammar to typo;
  //   - a SINGULAR annotated field is unconditional: the subpath's image is
  //     set outright (the kind models one injectable container);
  //   - a subpath resolving to a repo+tag MESSAGE receives the reference
  //     SPLIT (host/path:tag and host/path@digest both parse); a subpath
  //     resolving to a string receives it whole.
  //
  // Consumers: the offline deploy lane's injection walks these annotations
  // from descriptors; hosted control planes keep authored per-kind injectors
  // and hold them to these annotations with an agreement test — the two can
  // never drift silently. Annotate a kind ONLY when every consumer stack
  // injects it; an annotation without a hosted injector fails that gate.
  string artifact_image_slot = 60007;

  // Marks a workload kind's VERSION SLOT: a spec field deployment pipelines
  // stamp from the git branch (folded into the field's own grammar), part of
  // the kind's deploy-target contract beside artifact_image_slot. Stamping
  // is skipped when no branch rides the deploy — the field's authored or
  // defaulted value stands.
  bool artifact_version_slot = 60008;

  // Marks a field that exists so the manifest can say what the wire spells by
  // the absence or shape of OTHER fields -- and that no engine forwards. The
  // canonical cases: a selector's `match_all: true` where the upstream spelling
  // is an empty selector, and an access config's `ephemeral: true` where the
  // provider's spelling is a config without a static address. Without such a
  // field, "select everything" and "nothing was authored" are the same empty
  // block on every door, and a form cannot tell one from the other.
  //
  // Every engine path honors the marker by construction, never per kind: the
  // tfvars converter drops the field before any Terraform module sees it (so a
  // verbatim CRD projection never reaches the apiserver with an unknown key,
  // and a hand-written module never declares a variable for it), the
  // variables.tf generator emits no variable, and provider parity treats it as
  // an exclusion with a derived reason. A Pulumi module reads the field only
  // to derive the upstream shape (or not at all, where the validation rules
  // already guarantee that shape) and never forwards it.
  //
  // The field's validation rules carry its meaning: a message-level rule
  // forbids the marked field beside the content it stands in for, and another
  // refuses the block that names neither. The marker says nothing about
  // validation; it only says "this word is the manifest's, not the wire's".
  bool manifest_only = 60009;

  // Marks a field whose value is written where anyone who can VIEW the
  // resource reads it -- an environment variable in a Cloud Run revision, an
  // ECS task definition, a Kubernetes pod spec -- and names the sibling field,
  // in the same message, where the kind keeps a secret instead.
  //
  // The hazard it records: a platform that resolves secret references before
  // a module runs (Planton's `$secret/...`) hands the module a plain value,
  // and the module writes it wherever the manifest put it. In a field like
  // this one, that is the revision or the task definition itself, readable by
  // every viewer and, on ECS, kept forever in immutable revisions. The home
  // field is the one the module turns into a secret in a store (a Kubernetes
  // Secret, a Secret Manager secret, a Secrets Manager secret) that the
  // workload reads by reference.
  //
  // Downstream platforms refuse a secret reference anywhere within the marked
  // field (its nested messages, list elements and map values included) and
  // name the home in the refusal, so the fix is one move. Documentation and
  // the explain report render the home beside the field. The value is the
  // home's proto field name (e.g. "secret_value", "secrets"); a catalog test
  // proves every home names a field that exists beside the marked one.
  string secret_home = 60010;
}

extend google.protobuf.EnumValueOptions {
  string display_label = 60050;
}
