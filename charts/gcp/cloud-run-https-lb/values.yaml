params:
  # ── Identity ────────────────────────────────────────────────────────────

  - name: appName
    description: >
      Base name for every resource the chart creates (the load balancer's
      address, certificate, NEG, backend service, URL map, proxy, and
      forwarding rule all derive from it, prefixed with the environment).
      Keep it short and DNS-safe: lowercase letters, digits, and hyphens.
    value: web-app

  - name: region
    description: >
      GCP region the Cloud Run service runs in (e.g. us-central1). The
      serverless network endpoint group is created in the same region —
      the load balancer itself is global.
    value: us-central1

  - name: domain
    description: >
      The domain the load balancer serves (e.g. app.example.com). The
      Google-managed certificate is issued for exactly this domain, and
      the optional DNS record publishes it. The certificate activates
      only after the domain's DNS points at the load balancer's IP —
      until then the LB serves the IP directly.
    value: app.example.com

  # ── The Cloud Run service ───────────────────────────────────────────────

  - name: deployService
    description: >
      When true, the chart deploys its own Cloud Run service (from
      containerImage) and fronts it. Set false to front a Cloud Run
      service you already run — name it in existingServiceName. The
      deployed service accepts traffic only from the load balancer
      (ingress INTERNAL_LOAD_BALANCER), so the run.app URL cannot bypass
      Cloud Armor or your domain.
    type: bool
    value: true

  - name: existingServiceName
    description: >
      Name of the existing Cloud Run service to front when deployService
      is false. Must live in the same region and project as this chart's
      resources. Ignored while deployService is true. For the load
      balancer to be the only entry point, set that service's ingress to
      INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER yourself — the chart never
      mutates a service it does not own.
    value: my-existing-service

  - name: containerImage
    description: >
      Container image for the chart-deployed Cloud Run service. The
      default is Google's public hello image — replace it with your
      application image. Ignored when deployService is false.
    value: us-docker.pkg.dev/cloudrun/container/hello:latest

  # ── Optional protections and DNS ───────────────────────────────────────

  - name: cloudArmorEnabled
    description: >
      When true, the chart creates a Cloud Armor security policy with
      Layer-7 DDoS defense enabled and attaches it to the backend
      service. Add your own allow/deny rules to the policy resource as
      your exposure model firms up — the chart ships it open (GCP's
      default allow) so enabling protection never breaks serving.
    type: bool
    value: false

  - name: dnsEnabled
    description: >
      When true, the chart publishes an A record for the domain in the
      Cloud DNS zone named by dnsZoneName, pointing at the load
      balancer's static IP. Leave false when DNS lives outside Cloud DNS
      — then create the A record at your DNS host yourself.
    type: bool
    value: false

  - name: dnsZoneName
    description: >
      Name of the GcpDnsZone Infra Component (the Planton resource name,
      not the DNS name) that hosts the domain. The zone must already
      exist in the target environment — typically deployed by your DNS
      chart. Ignored while dnsEnabled is false.
    value: my-dns-zone
