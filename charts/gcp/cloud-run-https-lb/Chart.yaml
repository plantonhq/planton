apiVersion: infra-hub.planton.ai/v1alpha1
kind: InfraChart
metadata:
  name: GCP Cloud Run HTTPS Load Balancer
spec:
  selector:
    kind: platform
  description: >-
    A production HTTPS front door for Cloud Run: a global external load
    balancer with a static IP, a Google-managed certificate, a serverless
    NEG, and modern EXTERNAL_MANAGED routing — with optional Cloud Armor
    protection and Cloud DNS wiring. Deploys a hello service by default,
    or fronts a Cloud Run service you already run.
  iconUrl: https://downloads.planton.ai/catalog/logos/gcp/gcpcloudrun/logo.svg
  webLinks:
    chartWebUrl: https://github.com/plantonhq/planton/tree/main/charts/gcp/cloud-run-https-lb
    readmeRawUrl: https://raw.githubusercontent.com/plantonhq/planton/refs/heads/main/charts/gcp/cloud-run-https-lb/README.md
