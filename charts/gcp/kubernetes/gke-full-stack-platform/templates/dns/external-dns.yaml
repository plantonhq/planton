# external-dns and its keyless GCP identity — the controller that turns
# Kubernetes exposure into real Cloud DNS records: it watches Services and
# the active routing surface (Ingresses, or Gateway API HTTPRoutes when the
# gateway arm is on) and publishes matching records. Together with the
# issuers, this closes the "deploy a service, get a name and a certificate"
# loop with zero manual DNS work.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpServiceAccount
metadata:
  name: "{{ values.env }}-gke-external-dns"
spec:
  serviceAccountId: "{{ values.env }}-external-dns"
  projectId:
    value: "{{ values.gcp_project_id }}"
  description: external-dns Cloud DNS identity for the {{ values.env }}-gke cluster
  projectIamRoles:
    # Cloud DNS record writes need dns.admin; the API offers no
    # zone-scoped grant, so project scope is the honest deploy-time shape —
    # the controller's OWN zone and domain filters below are what scope
    # which records it actually touches.
    - roles/dns.admin
---
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGkeWorkloadIdentityBinding
metadata:
  name: "{{ values.env }}-gke-external-dns-wi"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  serviceAccountEmail:
    valueFrom:
      name: "{{ values.env }}-gke-external-dns"
  # Chart truth: the module pins the controller ServiceAccount's name to
  # metadata.name — so the KSA is the resource name rendered below, in the
  # conventional "external-dns" namespace.
  ksaNamespace: external-dns
  ksaName: "{{ values.env }}-external-dns"
---
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesExternalDns
metadata:
  name: "{{ values.env }}-external-dns"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: GcpGkeCluster
      name: "{{ values.env }}-gke"
      type: runs_on
    # The identity handshake must be effective before the first record
    # write — nothing flows from the binding, so the edge is explicit.
    - kind: GcpGkeWorkloadIdentityBinding
      name: "{{ values.env }}-gke-external-dns-wi"
      type: depends_on
spec:
  # Conventional home, not parameterized (one good answer; the controller is
  # tiny and namespace-invisible to workloads).
  namespace:
    value: external-dns
  createNamespace: true
  googleCloudDns:
    project:
      # The project whose Cloud DNS zones the controller manages — the same
      # honest-literal project everything in this chart lives in.
      value: "{{ values.gcp_project_id }}"
    # Zone scope by REFERENCE: each entry resolves the GcpDnsZone's zone ID
    # at deploy time through the annotated composition key — the chart can
    # never carry a stale or mis-formatted zone ID. The zones live outside
    # this chart (they usually predate the cluster); the offline validator
    # reports these as unresolved by design.
    zoneIdFilters:
{% for zone in values.dns_zone_names %}
      - valueFrom:
          name: "{{ zone }}"
{% endfor %}
    # No key JSON: with it absent the controller authenticates through its
    # ServiceAccount's ambient GCP identity — the Workload Identity binding
    # below.
  workloadIdentity:
    gke:
      serviceAccountEmail:
        valueFrom:
          name: "{{ values.env }}-gke-external-dns"
  # Watch the exposure surface this chart actually installs — Services
  # always, plus Ingresses OR Gateway API HTTPRoutes depending on the active
  # arm. Watching a surface that has no controller would only produce dead
  # records.
  sources:
    - service
{% if values.use_gateway_api | bool %}
    - gateway-httproute
{% else %}
    - ingress
{% endif %}
  # Domain scope is the first guardrail: even with broad zone credentials
  # the controller refuses names outside these suffixes.
  domainFilters:
{% for domain in values.dns_domains %}
    - "{{ domain }}"
{% endfor %}
  # Distinct ownership ID per cluster sharing a zone — the TXT registry is
  # what stops two controllers from fighting over the same records. The
  # policy stays at the kind's default "upsert-only" (create and update,
  # never delete): the safe posture for zones that also hold records managed
  # by hand or by other systems.
  txtOwnerId: "{{ values.dns_txt_owner_id }}"
