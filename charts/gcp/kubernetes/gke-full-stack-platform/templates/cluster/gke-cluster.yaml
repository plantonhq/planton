# The node service account and the GKE control plane. The cluster resource
# is ALSO where the one-run contract starts: the planton.dev/connection-name
# annotation makes the platform publish a Kubernetes provider connection from
# this cluster's outputs under a chart-controlled name — every Kubernetes
# resource in this chart consumes that same name via planton.dev/connection
# (one values param drives both sides, so they can never drift) and carries a
# runs_on relationship edge back to this resource so ordering is structural.
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpServiceAccount
metadata:
  # ONE dedicated node identity serves the system pool AND every pool node
  # auto-provisioning creates — Google's own least-privilege guidance: the
  # Compute Engine DEFAULT service account nodes would otherwise run as
  # carries project-wide Editor in many projects, and any pod that escapes
  # Workload Identity inherits whatever the node identity can do.
  name: "{{ values.env }}-gke-nodes"
spec:
  serviceAccountId: "{{ values.env }}-gke-nodes"
  projectId:
    value: "{{ values.gcp_project_id }}"
  description: Least-privilege node identity for the {{ values.env }}-gke cluster (system pool + auto-provisioned pools)
  projectIamRoles:
    # Google's documented minimum for GKE nodes — the consolidated role
    # covering the logging/monitoring writes the node agents perform.
    - roles/container.defaultNodeServiceAccount
    # Private image pulls from Artifact Registry. Workload permissions are
    # NOT granted here — they ride per-controller Workload Identity
    # bindings, never the node identity.
    - roles/artifactregistry.reader
---
apiVersion: gcp.planton.dev/v1alpha1
kind: GcpGkeCluster
metadata:
  # This name is load-bearing beyond the cluster itself: node pools attach
  # by it, and it prefixes every identity this chart composes. Rendered
  # from env so one chart deploys many environments.
  name: "{{ values.env }}-gke"
  annotations:
    # PUBLISH: the platform creates a Kubernetes provider connection named
    # by this value from the cluster's outputs (endpoint, CA, exec
    # credentials).
    planton.dev/connection-name: "{{ values.cluster_connection_name }}"
spec:
  projectId:
    value: "{{ values.gcp_project_id }}"
  # A region here (not a zone) makes the cluster REGIONAL: control-plane
  # replicas in three zones, no control-plane outage during upgrades — the
  # production posture. Zonal clusters are cheaper but trade away exactly
  # the availability a baseline exists to provide.
  location: "{{ values.region }}"
  network:
    valueFrom:
      name: "{{ values.env }}-gke-vpc"
  subnetwork:
    valueFrom:
      name: "{{ values.env }}-gke-subnet"
  # The pod/service ranges by NAME — literals matching what the subnetwork
  # template declares (both sides render from the same values, so they can
  # never drift), while the subnetwork REFERENCE above carries the ordering
  # edge. Naming planned ranges instead of letting GKE create unnamed ones
  # keeps address-space governance in this chart.
  ipAllocation:
    clusterSecondaryRangeName:
      value: "{{ values.env }}-gke-pods"
    servicesSecondaryRangeName:
      value: "{{ values.env }}-gke-services"
  # Dataplane V2 (eBPF/Cilium) — Google's recommendation for new clusters:
  # native NetworkPolicy enforcement with no Calico add-on, dataplane
  # observability, FQDN policy support. Immutable, so the baseline picks
  # the modern dataplane once, for the cluster's whole life.
  datapathProvider: ADVANCED_DATAPATH
  # Private nodes: no public IPs on any node — the internet cannot dial the
  # fleet. Outbound rides Cloud NAT (network/nat.yaml) for internet traffic
  # and private Google access for Google APIs. The control plane keeps its
  # public endpoint (scoped below) so operators and the deploying platform
  # reach the API from outside the VPC; nodes talk to it privately either
  # way. Modern GKE places the control plane over Private Service Connect —
  # no peering CIDR to plan.
  privateCluster:
    enablePrivateNodes: true
{% if values.master_authorized_cidrs %}
  masterAuthorizedNetworks:
    cidrBlocks:
{% for cidr in values.master_authorized_cidrs %}
      - cidrBlock: "{{ cidr }}"
{% endfor %}
{% endif %}
{% if values.use_gateway_api | bool %}
  # The gateway exposure arm rides GKE's NATIVE Gateway API support:
  # enabling the channel makes Google install the Gateway API CRDs, run the
  # gateway controller, and provide the gke-l7-* GatewayClasses — the chart
  # installs none of that itself (exposure/gateway.yaml only creates the
  # shared Gateway).
  gatewayApiChannel: CHANNEL_STANDARD
{% endif %}
  # Node auto-provisioning — GKE's built-in answer to "provision machines
  # when pods need them, remove them when idle" (the role Karpenter plays
  # on clusters whose cloud has no native equivalent). NAP creates and
  # deletes whole node pools, picking machine shapes from actual pod
  # requests, within the hard resource ceilings below.
  clusterAutoscaling:
    enabled: true
    resourceLimits:
      # The cost brake — NAP never provisions beyond these totals, and the
      # spec REQUIRES them (an unbounded NAP is an unbounded bill).
      - resourceType: cpu
        maximum: {{ values.nap_cpu_max }}
      - resourceType: memory
        maximum: {{ values.nap_memory_max_gib }}
    autoProvisioningDefaults:
      # Every NAP-created pool runs as the dedicated node identity above —
      # the reference is also the ordering edge.
      serviceAccount:
        valueFrom:
          name: "{{ values.env }}-gke-nodes"
      # cloud-platform is the norm with Workload Identity: IAM on the
      # service account governs actual access, and narrower OAuth scopes
      # only mask IAM decisions behind opaque scope errors.
      oauthScopes:
        - https://www.googleapis.com/auth/cloud-platform
      diskSizeGb: {{ values.system_node_disk_size_gb }}
{% if values.default_compute_class_enabled | bool %}
    # Makes the class named `default` (cluster/compute-class.yaml) apply to
    # every pod that selects no class.
    defaultComputeClassEnabled: true
{% endif %}
  # Engine-side delete guard (the field default, spelled out because it is
  # a day-2 decision): destroying this cluster requires first setting this
  # to false — the README's day-2 section covers the teardown order.
  deletionProtection: true
