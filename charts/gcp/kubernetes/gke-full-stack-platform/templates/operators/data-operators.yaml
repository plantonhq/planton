# The operator layer — what makes this the FULL-STACK platform: the
# cluster-resident operators that full-stack applications' data services
# ride. The doctrine: this chart installs OPERATORS (one per cluster,
# watching every namespace); per-app databases, caches, queues, and topics
# deploy as their own resources — or through the app-data-services chart —
# into each application's namespace, against this cluster's connection.
#
# CloudNativePG is unconditional: Postgres is the standard. Everything else
# is a toggle — install an operator when the first application needs its
# engine, not before.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesCloudNativePgOperator
metadata:
  name: "{{ values.env }}-cnpg"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: GcpGkeCluster
      name: "{{ values.env }}-gke"
      type: runs_on
spec:
  namespace:
    # Upstream convention; permanent while the kept CRDs pin release
    # ownership to it.
    value: cnpg-system
  createNamespace: true
  # Cluster-wide is CNPG's default — spelled out because it is the load-
  # bearing posture of this whole layer: applications declare
  # KubernetesPostgres resources in THEIR OWN namespaces and this one
  # operator reconciles them all.
  watch:
    clusterWide: true
{% if values.mysql_operator_enabled | bool %}
---
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesPerconaMysqlOperator
metadata:
  name: "{{ values.env }}-percona-mysql"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: GcpGkeCluster
      name: "{{ values.env }}-gke"
      type: runs_on
spec:
  namespace:
    value: percona-mysql
  createNamespace: true
  # The upstream default watches its own namespace only — widened here
  # because a platform operator serves every application namespace.
  watch:
    clusterWide: true
{% endif %}
{% if values.mongodb_operator_enabled | bool %}
---
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesPerconaMongoOperator
metadata:
  name: "{{ values.env }}-percona-mongo"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: GcpGkeCluster
      name: "{{ values.env }}-gke"
      type: runs_on
spec:
  namespace:
    value: percona-mongo
  createNamespace: true
  # Widened for the same reason as the MySQL operator above.
  watch:
    clusterWide: true
{% endif %}
{% if values.kafka_operator_enabled | bool %}
---
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesStrimziKafkaOperator
metadata:
  name: "{{ values.env }}-strimzi"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: GcpGkeCluster
      name: "{{ values.env }}-gke"
      type: runs_on
spec:
  namespace:
    value: kafka
  createNamespace: true
  # Strimzi's chart default watches its own namespace; any_namespace is its
  # cluster-wide arm. Note Strimzi's own contract: a namespace must EXIST
  # before a Kafka cluster is declared in it — application namespaces
  # created by app deployments satisfy this naturally.
  watch:
    anyNamespace: true
{% endif %}
{% if values.rabbitmq_operator_enabled | bool %}
---
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesRabbitMqOperator
metadata:
  name: "{{ values.env }}-rabbitmq-operator"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: GcpGkeCluster
      name: "{{ values.env }}-gke"
      type: runs_on
spec: {}
  # No fields by design: the operator installs from its official release
  # manifest into its fixed rabbitmq-system namespace and watches ALL
  # namespaces out of the box — the cluster-wide posture this layer wants
  # is the kind's own default.
{% endif %}
{% if values.keda_enabled | bool %}
---
# KEDA — event-driven autoscaling: scales workloads on external signals
# (queue depth, Kafka consumer lag, cloud metrics, cron) including to and
# from zero — the layer beyond the CPU-based HPA that GKE's built-in
# metrics pipeline serves. A cluster singleton: Kubernetes allows exactly
# one external-metrics provider, and KEDA registers it.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKeda
metadata:
  name: "{{ values.env }}-keda"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: GcpGkeCluster
      name: "{{ values.env }}-gke"
      type: runs_on
spec:
  # Conventional home; permanent while the kept CRDs pin release ownership
  # to it. Internal TLS stays on KEDA's own certificate operator (the
  # kind default) — wiring it to the in-chart Let's Encrypt issuers
  # would be wrong: public ACME cannot issue for cluster-internal names.
  namespace:
    value: keda
  createNamespace: true
{% endif %}
