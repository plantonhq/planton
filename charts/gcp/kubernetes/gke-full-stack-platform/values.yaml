params:
  # ── Cluster identity & binding ───────────────────────────────────────────
  - name: cluster_connection_name
    description: >
      Name under which the GKE cluster PUBLISHES its Kubernetes provider
      connection, and by which every in-chart Kubernetes resource CONSUMES
      it — the one-run contract that lets this chart create a cluster and
      deploy onto it in the same apply. One value drives both sides, so the
      producer and its consumers can never drift. Must be unique among the
      organization's connections; a per-environment name like
      "gke-prod" keeps multiple deployments of this chart apart.
    value: gke-full-stack

  - name: gcp_project_id
    description: >
      The GCP project ID everything in this chart lives in — network,
      cluster, service accounts, DNS writes, the backup bucket. Nothing in
      the deployed graph produces it, so it is an honest literal — MUST be
      changed. It also names the cluster's implicit Workload Identity pool
      (<project>.svc.id.goog), which is what makes every keyless binding in
      this chart composable at deploy time.
    value: my-project-id

  - name: region
    description: >
      GCP region everything in this chart lives in (e.g. "us-central1").
      The cluster is REGIONAL in this region — control-plane replicas in
      three zones — and the subnetwork, Cloud NAT, and node pools follow it.
    value: us-central1

  # ── Network (the chart provisions its own VPC) ───────────────────────────
  - name: subnet_cidr
    description: >
      Primary IPv4 CIDR of the cluster subnetwork — the range NODES draw
      real IPs from. GCP subnet primary ranges can be EXPANDED later but
      never shrunk, so /20 (~4k addresses) leaves room without hoarding
      RFC1918 space. Must not overlap networks you will peer or VPN to.
    value: 10.10.0.0/20

  - name: pods_cidr
    description: >
      Secondary IPv4 range for POD IPs (VPC-native alias IPs). Every pod
      consumes a real address from this range and GKE slices it per node
      (default 110 pods/node ≈ a /24 slice per node), so size it big: /14
      (~256k addresses) comfortably serves hundreds of nodes. Immutable —
      undersizing this is the classic un-fixable GKE mistake.
    value: 10.16.0.0/14

  - name: services_cidr
    description: >
      Secondary IPv4 range for Kubernetes SERVICE (ClusterIP) addresses.
      Services are far fewer than pods — /20 (~4k) is generous. Immutable.
    value: 10.20.0.0/20

  # ── GKE control plane ────────────────────────────────────────────────────
  - name: master_authorized_cidrs
    type: list
    description: >
      IPv4 CIDRs allowed to reach the cluster's PUBLIC API endpoint. Empty
      leaves the public endpoint open to any IP that presents valid Google
      credentials (IAM and RBAC still hold the door). Restricting this to
      your office/VPN egress ranges is the single cheapest hardening step —
      nodes never depend on it (they reach the control plane privately).
    value: []

  # ── System node pool (the fixed floor NAP builds on) ─────────────────────
  - name: system_node_machine_type
    description: >
      Compute Engine machine type for the SYSTEM node pool — the small,
      always-on pool that hosts cluster-critical pods (the addon
      controllers this chart installs) so autoscaling never depends on
      capacity it manages itself. e2-standard-4 (4 vCPU, 16 GB) fits the
      baseline's controllers with room; GKE's e2-medium default is too
      small once cert-manager, external-dns, and an ingress controller land.
    value: e2-standard-4

  - name: system_nodes_min_per_zone
    description: >
      Autoscaling floor of the system pool, PER ZONE (a regional cluster
      spans three zones, so "1" means three nodes cluster-wide) — the
      production minimum: controllers keep zone spread and no single node
      drain takes the platform's control loops down.
    value: "1"

  - name: system_nodes_max_per_zone
    description: >
      Autoscaling ceiling of the system pool, PER ZONE. The system pool
      holds only cluster-critical pods, so it rarely needs to grow —
      application capacity is node auto-provisioning's job, not this
      pool's.
    value: "2"

  - name: system_node_disk_size_gb
    description: >
      Boot disk per system node, in GB. 100 (GKE's own default) is
      comfortable for image-heavy clusters; smaller disks fill up fast once
      a few DaemonSets pull images.
    value: "100"

  # ── Node auto-provisioning (the self-provisioning fleet) ─────────────────
  - name: nap_cpu_max
    description: >
      Ceiling on the TOTAL vCPUs node auto-provisioning may create
      cluster-wide — the blast-radius guard that caps what a runaway
      workload (or a mistake) can spend. Provisioning stops at the limit;
      raise it as the platform grows.
    value: "100"

  - name: nap_memory_max_gib
    description: >
      Ceiling on the TOTAL memory (GiB) node auto-provisioning may create
      cluster-wide — the second half of the cost brake. Keep it roughly
      proportional to nap_cpu_max for the machine shapes your workloads
      request (4 GiB per vCPU matches general-purpose shapes).
    value: "400"

  # ── Default compute class (opt-in, stockout fallback) ───────────────────
  - name: default_compute_class_enabled
    type: bool
    description: >
      Turn on the cluster's default compute class and declare one: every
      pod that selects no class runs on the system pool first, then on the
      families below, in order. A busy region runs out of one machine type
      for hours at a time; with this on, GKE creates the next family's
      nodes instead of leaving pods pending. Off by default because it
      changes which machine families the cluster buys.
    value: false

  - name: default_compute_class_families
    type: list
    description: >
      The machine families the default class falls back through, in order
      (only used when default_compute_class_enabled is true). Keep them
      interchangeable: same CPU architecture and boot disk type. n2d, c3d,
      n2 and t2d are all x86 on pd-balanced, across AMD and Intel capacity.
      A fourth-generation family (c4, c4d, n4) boots only from Hyperdisk
      and does not belong in this list.
    value:
      - n2d
      - c3d
      - n2
      - t2d

  - name: default_compute_class_min_cores
    description: >
      The fewest vCPUs a fallback node may have, the same on every family
      so a fallback node fits the pods the first choice would have run
      (only used when default_compute_class_enabled is true).
    value: "4"

  # ── Spot capacity (opt-in, scale-to-zero) ────────────────────────────────
  - name: spot_pool_enabled
    type: bool
    description: >
      Add a scale-to-zero Spot node pool: deeply discounted (60-91%)
      capacity for fault-tolerant workloads, tainted so nothing lands there
      without opting in (toleration + nodeSelector on cloud.google.com/gke-spot).
      Costs nothing while idle — the pool starts at zero nodes and GKE
      reclaims Spot VMs with 30s notice, so keep stateful and singleton
      workloads on the default capacity.
    value: false

  - name: spot_machine_type
    description: >
      Machine type for the Spot pool (only used when spot_pool_enabled is
      true). Pick the shape your batch/fault-tolerant workloads actually
      request; Spot discounts apply to nearly every family.
    value: e2-standard-4

  - name: spot_nodes_max_per_zone
    description: >
      Autoscaling ceiling of the Spot pool, PER ZONE (the floor is zero —
      scale-to-zero is the point). Only used when spot_pool_enabled is
      true.
    value: "3"

  # ── Exposure (pick one entry-point model) ────────────────────────────────
  - name: use_gateway_api
    type: bool
    description: >
      Exposure arm switch. False (default) installs ingress-nginx as the
      cluster's default IngressClass — the battle-tested entry point every
      tutorial assumes. True instead enables GKE's NATIVE Gateway API
      support (Google installs the CRDs, the gateway controller, and the
      gke-l7-* GatewayClasses as part of the cluster — nothing to install)
      and creates a shared platform Gateway on the class selected by
      gateway_class. One entry point, one mental model, never both.
    value: false

  - name: ingress_replicas
    description: >
      Replicas of the ingress-nginx controller (only used when
      use_gateway_api is false). Two is the production floor: the
      controller is the single entry point for all HTTP traffic, and with
      one replica every node drain is a traffic outage.
    value: "2"

  - name: gateway_class
    type: string_enum
    enumValues:
      - gke-l7-global-external-managed
      - gke-l7-regional-external-managed
      - gke-l7-rilb
    description: >
      GKE-provided GatewayClass the shared Gateway binds to (only used when
      use_gateway_api is true). gke-l7-global-external-managed provisions a
      global external Application Load Balancer (anycast IP — the default
      for internet-facing platforms); gke-l7-regional-external-managed
      provisions a regional external ALB; gke-l7-rilb provisions an
      INTERNAL ALB for platforms whose traffic never leaves the VPC.
    value: gke-l7-global-external-managed

  # ── DNS (Cloud DNS) ──────────────────────────────────────────────────────
  - name: dns_zone_names
    type: list
    description: >
      Planton resource names of the GcpDnsZone resources this platform
      manages. The zone IDs flow in by reference at deploy time, so the
      format can never be wrong. The zones must exist in the target
      environment when this chart deploys — they usually predate the
      cluster (the offline validator reports them as unresolved by
      design). Replace the placeholder with your zone resource names.
    value:
      - my-dns-zone

  - name: dns_domains
    type: list
    description: >
      Domain suffixes external-dns is allowed to manage (e.g. "example.com"
      covers every name under it). The first guardrail against the
      controller touching unrelated zones the credentials can see — keep it
      as narrow as the platform's real domains.
    value:
      - example.com

  - name: dns_txt_owner_id
    description: >
      Ownership ID this cluster's external-dns writes into its TXT registry
      records. Every cluster sharing a DNS zone MUST use a distinct value —
      it is what stops one cluster's controller from fighting over (or,
      under a sync policy, deleting) another cluster's records.
    value: gke-full-stack

  # ── TLS certificates (Let's Encrypt) ─────────────────────────────────────
  - name: acme_email
    description: >
      Email registered with the Let's Encrypt ACME account. Expiry notices
      and account notifications go here — use a team alias, not a personal
      address. MUST be changed; Let's Encrypt rejects example.com addresses.
    value: platform-team@example.com

  - name: acme_http01_enabled
    type: bool
    description: >
      Adds an opt-in HTTP-01 solver beside the default DNS-01 solver:
      Certificates labeled "acme-solver: http01" solve over HTTP through
      this chart's entry point. For domains whose DNS lives outside the
      Cloud DNS zones this chart manages. DNS-01 remains the default — it
      issues wildcards and works for services that are not publicly
      reachable.
    value: false

  # ── Secrets (External Secrets Operator + GCP Secret Manager) ─────────────
  - name: external_secrets_enabled
    type: bool
    description: >
      Install the External Secrets Operator with a cluster-wide store
      reading GCP Secret Manager — keyless, through the operator's own
      Workload Identity binding. Workloads then declare ExternalSecrets
      naming secrets in Secret Manager and receive native Kubernetes
      Secrets; no secret value ever lands in a manifest.
    value: true

  # ── Backups (Velero → GCS) ───────────────────────────────────────────────
  - name: velero_enabled
    type: bool
    description: >
      The self-backing-up half of the story: a GCS bucket, a dedicated
      backup identity with Velero's documented permission set, the
      VolumeSnapshotClass its CSI snapshots require, and Velero on a
      schedule. Restore is one command away when a namespace is deleted or
      a cluster migrates. Off only for clusters whose disaster-recovery
      story lives elsewhere.
    value: true

  - name: velero_schedule
    description: >
      Cron schedule (UTC) of the recurring cluster backup (only used when
      velero_enabled is true). The default backs up daily at 01:00 UTC —
      align it with your low-traffic window.
    value: "0 1 * * *"

  - name: velero_backup_ttl
    description: >
      How long scheduled backups are retained before Velero's garbage
      collector removes them (Go duration; 720h = 30 days). Storage is the
      only cost of a longer window — GCS is cheap, re-creating lost state
      is not.
    value: 720h

  # ── The operator layer (what makes this the FULL-STACK platform) ─────────
  # CloudNativePG installs unconditionally — Postgres is the standard.
  # Each further operator is a toggle: install it when the first application
  # needs its engine, not before. All operators watch EVERY namespace, so
  # applications declare their data services in their own namespaces (or
  # through the app-data-services chart) against this cluster's connection.
  - name: mysql_operator_enabled
    type: bool
    description: >
      Install the Percona XtraDB Cluster operator (cluster-wide watch) so
      applications can declare KubernetesMysql databases — Galera-replicated
      MySQL with proxies and scheduled backups — in their own namespaces.
    value: false

  - name: mongodb_operator_enabled
    type: bool
    description: >
      Install the Percona Server for MongoDB operator (cluster-wide watch)
      so applications can declare KubernetesMongodb replica sets — with
      failover elections and PBM backups — in their own namespaces.
    value: false

  - name: kafka_operator_enabled
    type: bool
    description: >
      Install the Strimzi operator (any-namespace watch) so applications can
      declare KubernetesKafka clusters, topics, and users in their own
      namespaces. Note Strimzi's own contract: a namespace must exist before
      a Kafka cluster is declared in it.
    value: false

  - name: rabbitmq_operator_enabled
    type: bool
    description: >
      Install the RabbitMQ cluster operator (watches all namespaces, its
      upstream default) so applications can declare KubernetesRabbitMq
      brokers in their own namespaces. Requires cert-manager — already part
      of this chart's baseline.
    value: false

  - name: keda_enabled
    type: bool
    description: >
      Install KEDA for event-driven autoscaling — workloads scale on queue
      depth, Kafka consumer lag, cloud metrics, or cron, including to and
      from zero. A cluster singleton (Kubernetes allows one external-metrics
      provider). Install it when the first workload actually scales on
      events.
    value: false
