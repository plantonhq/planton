# OpenBao — the self-hosted secrets manager (the open-source Vault
# lineage): KV secrets, dynamic credentials, PKI, and the Kubernetes auth
# method the cluster's workloads authenticate through.
#
# THE SEAL LIFECYCLE — read before the first deploy: a fresh OpenBao
# server starts UNINITIALIZED and SEALED, and its pods report NotReady BY
# DESIGN until `bao operator init` and unseal are run against the API —
# runtime operations no deployment tool can perform declaratively, and
# this chart deliberately does not try. A deploy that never turns "ready"
# until you initialize it is the designed behavior, not a failure; the
# Services stay addressable for exactly those calls (the README's
# after-deployment section is the runbook). Capture the unseal keys and
# root token from the init output and store them OUTSIDE the cluster.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOpenBao
metadata:
  name: "{{ values.env }}-openbao"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # JOINS the chart-owned namespace: co-location is the platform grain —
  # one namespace, one security boundary, one place to look — and on
  # PostgreSQL storage it is also required: the database password rides a
  # secretKeyRef, which can only reach Secrets in this namespace.
  namespace:
    valueFrom:
      name: "{{ values.env }}-identity-ns"
  createNamespace: false
  server:
{% if values.openbao_storage == "postgresql" %}
    # PostgreSQL storage in the chart's own database, BY REFERENCE (the -rw
    # Service; the operator-maintained `<db>-app` Secret's `password` key —
    # the selector's own default, so only the name is declared). The
    # username is a plain-string field by the spec's contract, honest here
    # because database.yaml declares the same `identity` owner role — the
    # same literal OpenFGA's arm renders from. No data volume: the database
    # holds the data, and its backup is the vault's. maxParallel bounds the
    # connections EACH server opens — this database is shared by three
    # consumers and a default PostgreSQL allows 100 in total, while
    # OpenBao's own default is 128 per server.
    postgresql:
      host:
        valueFrom:
          name: "{{ values.env }}-identity-db"
      # Bootstrapped by the database's post_init_sql — see database.yaml.
      database: openbao
      username: identity
      passwordSecret:
        secretName:
          valueFrom:
            name: "{{ values.env }}-identity-db"
      maxParallel: 32
{% else %}
    # Integrated Raft storage: every replica persists to its own volume and
    # the cluster elects a leader; the module renders the retry_join stanzas
    # that make the peers actually form a cluster. One replica is a legal
    # Raft cluster of one and the right start for a platform's secrets
    # store; raise the count when the cluster has the nodes for it.
    raft:
      dataStorage:
        size: "{{ values.openbao_disk_size }}"
{% endif %}
    # KNOW THIS on either engine: the chart ships a REQUIRED hostname
    # anti-affinity, so the cluster needs at least as many schedulable
    # nodes as replicas. Bootstrap: initialize pod-0, unseal EVERY pod;
    # Raft peers then join automatically, PostgreSQL standbys wait for the
    # HA lock.
    replicas: {{ values.openbao_replicas }}
  # TLS stays off at the listener: in-cluster traffic, with TLS at the
  # composed exposure in front (the same posture as Keycloak above).
  # End-to-end listener TLS is a day-2 values change (tls.enabled +
  # tls.certSecretName referencing a KubernetesCertificate) once
  # cert-manager is present — the component renders listener and scheme
  # together, so the flip is safe by construction.
