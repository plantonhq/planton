# The PostgreSQL cluster backing Keycloak AND OpenFGA — reconciled by
# CloudNativePG into a primary plus streaming replicas with automated
# failover. Applications connect through the operator-maintained -rw
# Service, which re-points to the new primary after a failover; the
# application credential lives in the operator-maintained `<name>-app`
# Secret. Both handles flow into the consumers BY REFERENCE, so the wiring
# can never drift.
#
# ONE OWNER ROLE FOR EVERY DATABASE — the one-owner shape is load-bearing,
# not a shortcut: the operator maintains exactly ONE application credential
# Secret (`<name>-app`, for the bootstrap owner), and EVERY consumer reads
# its credentials from it by reference. A role per database would leave
# the other roles without a maintained Secret. initdb creates `keycloak`
# owned by the `identity` role, and post_init_sql (run once as superuser,
# right after initdb) creates `openfga` under the same owner — and, when
# the vault stores here, `openbao` too. Ownership gives every server's
# schema work everything it needs with NO create-database grant.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesPostgres
metadata:
  name: "{{ values.env }}-identity-db"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
{% if values.install_cnpg_operator | bool %}
  relationships:
    # The database is a CloudNativePG custom resource — the operator (and
    # its CRDs) must exist before this deploys. No spec field consumes an
    # operator output, so the edge is declared explicitly. When the toggle
    # installs no operator, the edge goes with it: a resident operator is
    # already running, and ordering against it is not this chart's to
    # declare.
    - kind: KubernetesCloudNativePgOperator
      name: "{{ values.env }}-cnpg-operator"
      type: depends_on
{% endif %}
spec:
  # JOINS the namespace the chart owns (namespace.yaml) — referencing the
  # namespace resource makes the created-before-used ordering structural.
  namespace:
    valueFrom:
      name: "{{ values.env }}-identity-ns"
  createNamespace: false
  instances: {{ values.postgres_instances }}
  storage:
    size: "{{ values.postgres_disk_size }}"
  bootstrap:
    initdb:
      # The identity store. The owner role is named explicitly (rather
      # than inheriting the database name) because authorization.yaml
      # declares the same value as its database username — both sides
      # render from the same well-known literal, which is what keeps a
      # plain-string username field honest.
      database: keycloak
      owner: identity
      postInitSql:
        # The authorization store — OpenFGA's tuples and models. CREATE
        # DATABASE cannot run inside the application database's own
        # session, which is why this rides post_init_sql (superuser,
        # against `postgres`) and not post_init_application_sql.
        - CREATE DATABASE openfga OWNER identity;
{% if values.openbao_storage == "postgresql" %}
        # The secrets store — OpenBao's KV and HA lock tables, created by
        # the server itself on first start; ownership covers them.
        - CREATE DATABASE openbao OWNER identity;
{% endif %}
