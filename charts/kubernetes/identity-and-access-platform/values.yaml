params:
  # ── Cluster binding ──────────────────────────────────────────────────────
  - name: connection
    description: >
      Slug of the Planton Kubernetes provider connection that selects the
      cluster this chart deploys onto. When set, every resource in the chart
      carries it as an explicit connection annotation, overriding the
      environment- and organization-level default connections. Leave empty to
      deploy onto the environment's default Kubernetes connection — the right
      choice when the environment maps one-to-one to a cluster.
    value: ""

  # ── Placement ────────────────────────────────────────────────────────────
  - name: namespace
    description: >
      Kubernetes namespace the whole platform lives in — the database,
      Keycloak, its operator, OpenFGA, and OpenBao together, deliberately:
      Keycloak and OpenFGA read the database password through secretKeyRefs
      (namespace-local by Kubernetes design), and the Keycloak operator's
      namespaced watch only reconciles declarations beside it. Change it to
      run a second independent identity stack on the same cluster.
    value: identity

  - name: install_cnpg_operator
    type: bool
    description: >
      Installs the CloudNativePG operator (the engine that reconciles the
      database) into cnpg-system. The operator is a one-per-cluster
      singleton — its Helm release name, cluster-scoped CRDs, and webhook
      identity are fixed upstream, so a second installation fights the
      first. Keep true on a cluster that does not run CloudNativePG yet;
      set false on operator-ready clusters (any cluster provisioned by a
      full-stack platform chart already runs it), and the resident operator
      reconciles this chart's database instead.
    value: true

  - name: install_keycloak_operator
    type: bool
    description: >
      Installs the Keycloak operator INTO the platform's namespace — its
      default watch is namespaced, so the operator and the Keycloak
      declaration live side by side, and several isolated identity stacks
      can coexist on one cluster. Set false only when a CLUSTER-WIDE
      Keycloak operator is already resident: a namespaced operator in some
      other namespace cannot see this chart's declaration, and Keycloak
      would never reconcile.
    value: true

  # ── Database sizing ──────────────────────────────────────────────────────
  - name: postgres_instances
    description: >
      Number of PostgreSQL instances: one primary plus the rest as streaming
      replicas with automated failover. 2 (default) is the floor for a
      database that survives node loss — every Keycloak realm, user, and
      OpenFGA authorization tuple lives here, so the database's availability
      IS the platform's availability. 3 is the production convention; 1 is a
      single point of failure for evaluation only.
    value: "2"

  - name: postgres_disk_size
    description: >
      Persistent volume size per PostgreSQL instance (a Kubernetes quantity,
      e.g. "10Gi"). Identity data grows slowly; authorization tuples grow
      with usage — watch the openfga database once relationship writes ramp.
      Grows are applied in place when the storage class supports expansion;
      shrinks are rejected.
    value: 10Gi

  # ── Keycloak ─────────────────────────────────────────────────────────────
  - name: keycloak_hostname
    description: >
      The public base URL users and applications reach Keycloak at — a FULL
      URL with scheme (e.g. "https://auth.example.com"), because tokens,
      issuer URLs, and redirects are minted for exactly this address, and
      the server refuses bare hostnames the moment admin or backchannel
      hostname options enter the picture. MUST BE CHANGED: the default is a
      placeholder that deploys but mints tokens for a domain you do not
      own. TLS terminates at the exposure you compose in front (the chart
      pairs plain pod HTTP with X-Forwarded-* header trust).
    value: https://auth.example.com

  - name: keycloak_instances
    description: >
      Keycloak server replicas. 1 (default) fits a platform getting
      started; raise to 2+ for HA — instances discover each other through
      the operator's headless Service and form an Infinispan cluster
      automatically, no extra configuration. Each instance holds working
      caches only; durable state is all in PostgreSQL.
    value: "1"

  # ── OpenFGA ──────────────────────────────────────────────────────────────
  - name: openfga_preshared_api_key
    description: >
      The pre-shared API key every OpenFGA client presents (Authorization:
      Bearer) — authentication is ON by default because an open OpenFGA
      lets anything with network reach read and rewrite every authorization
      decision in the platform. MUST BE CHANGED — the default is a
      placeholder, not a credential. The module materializes it into the
      server's authn-keys Secret; only the Secret name renders into chart
      values. Rotate by updating the value on the deployed resource.
    value: change-me

  # ── OpenBao ──────────────────────────────────────────────────────────────
  - name: openbao_storage
    type: string_enum
    enumValues:
      - raft
      - postgresql
    description: >
      Where the secrets manager keeps its data. raft (default): OpenBao's
      integrated storage — one volume per replica, leader election, and
      the engine Raft snapshots (the kind's backup block) exist for; the
      vault's disaster recovery is its own. postgresql: the vault stores
      in this chart's PostgreSQL, in an `openbao` database bootstrapped
      under the same `identity` owner as Keycloak's and OpenFGA's, with
      host and password by reference — no volume, high availability
      through the backend's lock table, and ONE database backup covers
      identity, authorization, and secrets together; there are no Raft
      snapshots, and the kind refuses a backup block on this engine.
      Choose postgresql when the database is the platform's backed-up
      truth and you want the vault inside that boundary; keep raft when
      the vault must outlive the database or ship its own snapshots.
    value: raft

  - name: openbao_replicas
    description: >
      OpenBao server replicas. 1 (default) is the honest start on either
      engine. On raft, 3 is the smallest size that survives one member's
      loss with quorum intact and 5 survives two; even numbers buy
      nothing — quorum math. On postgresql there is no quorum: any second
      replica is a warm standby that takes the HA lock when the active
      one dies. Needs at least as many schedulable nodes as replicas —
      the chart ships a required hostname anti-affinity.
    value: "1"

  - name: openbao_disk_size
    description: >
      Persistent volume size for OpenBao's Raft data (a Kubernetes
      quantity; one volume per replica). Only used when openbao_storage
      is raft — a PostgreSQL-stored vault claims no data volume. Secrets
      are small — 10Gi is generous — but the volume also carries Raft
      snapshots; grow it before enabling aggressive audit or snapshot
      schedules.
    value: 10Gi
