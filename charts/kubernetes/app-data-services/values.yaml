params:
  # ── Cluster binding ──────────────────────────────────────────────────────
  - name: connection
    description: >
      Slug of the Planton Kubernetes provider connection that selects the
      cluster this data layer deploys onto. When set, every resource in the
      chart carries it as an explicit connection annotation, overriding the
      environment- and organization-level default connections. Leave empty
      to deploy onto the environment's default Kubernetes connection.
    value: ""

  # ── Application identity ─────────────────────────────────────────────────
  - name: namespace
    description: >
      The APPLICATION'S namespace — set it per app ("payments", "orders");
      it is also this deployment's identity, prefixing every resource name
      so many apps' data layers coexist in one environment. The data
      services live in the app's own namespace deliberately: credentials
      arrive as Kubernetes Secrets, and a workload can only read Secrets in
      its own namespace. Deploy this chart once per application, each with
      its own value here.
    value: app-data

  # ── Database ─────────────────────────────────────────────────────────────
  - name: database_name
    description: >
      Name of the application database created at bootstrap. The owning
      role gets the same name (the operator's convention), and its
      generated password lands in the credential Secret the outputs point
      at — your app connects as this user, to this database.
    value: app

  - name: postgres_instances
    description: >
      Number of PostgreSQL instances: one primary plus the rest as
      streaming replicas with automated failover. 1 (default) reflects
      per-app economics — data layers multiply per application, and many
      apps tolerate a brief database restart. Raise to 2 (failover) or 3
      (the production convention) for the applications whose data layer
      must survive node loss without interruption.
    value: "1"

  - name: postgres_disk_size
    description: >
      Persistent volume size per PostgreSQL instance (a Kubernetes
      quantity, e.g. "10Gi"). Grows are applied in place when the storage
      class supports expansion; shrinks are rejected.
    value: 10Gi

  # ── Cache ────────────────────────────────────────────────────────────────
  - name: valkey_enabled
    type: bool
    description: >
      Deploys a Valkey cache beside the database — the Redis-compatible
      store for sessions, rate limits, and hot lookups. Standalone (one
      instance) with a persistent volume so the cache restarts warm. Turn
      off for apps that only need the database.
    value: true

  - name: valkey_password
    description: >
      Password for the cache's "default" ACL user — authentication is ON
      by default because an open cache is readable and writable by
      anything that reaches its Service. The platform materializes it
      into the cache's auth Secret; your app reads it from there.
      On Planton the value is a reference to a managed secret, resolved at deploy
      so the password is never stored with the project: create it with
      `planton secret set app-data-services-valkey-password --string` (or name an environment's own as
      `$secret/@<env>/<slug>`). A deploy without the platform takes the literal.
    value: $secret/app-data-services-valkey-password

  - name: valkey_max_memory
    description: >
      Memory ceiling for the cached dataset, as a Valkey size ("256mb",
      "1gb"). At the ceiling the cache EVICTS least-recently-used keys —
      the correct cache behavior (without a ceiling, the pod's memory
      limit becomes the bound and hitting it is an OOM kill, not an
      eviction). Size the pod's memory above this with headroom for
      persistence forks.
    value: 256mb

  - name: valkey_disk_size
    description: >
      Persistent volume size for the cache (a Kubernetes quantity). The
      volume lets the cache restart WARM from its last snapshot instead of
      empty — cheap insurance against a thundering herd on the database
      after every pod restart. Size it near valkey_max_memory.
    value: 2Gi
