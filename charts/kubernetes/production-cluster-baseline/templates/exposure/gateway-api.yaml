{% if values.use_gateway_api | bool %}
# Gateway API — the modern exposure arm (replaces ingress-nginx when
# use_gateway_api is true). Four resources compose the story:
#
#   CRDs → GatewayClass → Gateway (in its own namespace)
#
# Deliberately NOT installed here: a Gateway API implementation (NGINX Gateway
# Fabric, Istio, Envoy Gateway, a cloud controller). Which implementation is a
# platform choice with its own lifecycle and configuration surface — this arm
# provides the standard resources it programs, and gateway_controller_name
# names the implementation you run.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesGatewayApiCrds
metadata:
  name: "{{ values.env }}-gateway-api-crds"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # Standard channel: the GA/beta resources (GatewayClass, Gateway, HTTPRoute,
  # GRPCRoute, ReferenceGrant, ...). The experimental channel exists for
  # pre-GA resources; a production baseline stays on standard. The CRD bundle
  # version rides the kind's own default — the release the catalog's
  # Gateway API projections target.
  installChannel:
    channel: standard
---
# The GatewayClass binds Gateways to the implementation. Cluster-scoped and
# name-stable: HTTPRoute authors never see it, only the Gateway below does.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesGatewayClass
metadata:
  name: "{{ values.env }}-gateway-class"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
  relationships:
    # The GatewayClass is itself a Gateway API custom resource — the CRDs must
    # exist first. Nothing in its spec consumes a CRDs output, so the edge is
    # declared explicitly.
    - kind: KubernetesGatewayApiCrds
      name: "{{ values.env }}-gateway-api-crds"
      type: depends_on
spec:
  # Must match the controllerName your Gateway API implementation announces —
  # and it is IMMUTABLE once created (the admission webhook rejects changes).
  controllerName: "{{ values.gateway_controller_name }}"
  description: Platform baseline gateway class
---
# A dedicated namespace for the shared Gateway. Owned by this chart (the
# Gateway kind, faithful to upstream, cannot create namespaces itself), and
# referenced below so the create-before-use ordering is structural.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesNamespace
metadata:
  name: "{{ values.env }}-gateway-namespace"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  name: gateway
---
# The shared platform Gateway — the single entry point application HTTPRoutes
# attach to from any namespace.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesGateway
metadata:
  name: "{{ values.env }}-gateway"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  namespace:
    valueFrom:
      # The in-chart namespace above — the reference resolves its name AND
      # orders the namespace before the Gateway in the deploy graph.
      name: "{{ values.env }}-gateway-namespace"
  gatewayClassName:
    valueFrom:
      # Resolves the GatewayClass's name output; also the ordering edge.
      name: "{{ values.env }}-gateway-class"
  listeners:
    # One HTTP listener, open to routes from every namespace — the baseline
    # posture that lets application teams attach HTTPRoutes without touching
    # this Gateway. HTTPS listeners are deliberately NOT pre-created: each TLS
    # listener needs a certificate for ITS hostnames, which is per-application
    # decision-making — the README's after-deployment section walks through
    # adding the first one with a Certificate from the in-chart issuers.
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
{% endif %}
