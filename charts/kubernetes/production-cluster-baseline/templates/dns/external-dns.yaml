# external-dns — the controller that turns Kubernetes exposure into real DNS
# records: it watches Services and the active routing surface (Ingresses, or
# Gateway API HTTPRoutes when the gateway arm is on) and publishes matching
# records into the provider selected by dns_provider. Together with the
# issuers, this closes the "deploy a service, get a name and a certificate"
# loop with zero manual DNS work.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesExternalDns
metadata:
  name: "{{ values.env }}-external-dns"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # Conventional home, not parameterized (one good answer; the controller is
  # tiny and namespace-invisible to workloads).
  namespace:
    value: external-dns
  createNamespace: true
{% if values.dns_provider == "route53" %}
  awsRoute53:
    region: "{{ values.aws_region }}"
    # Zone scope by REFERENCE: each entry resolves the AwsRoute53Zone's zone
    # ID at deploy time through the annotated composition key — the chart can
    # never carry a stale or mis-formatted zone ID. The zones live outside
    # this chart (they exist before the cluster does); the offline validator
    # reports these as unresolved by design.
    zoneIdFilters:
{% for zone in values.dns_zone_names %}
      - valueFrom:
          name: "{{ zone }}"
{% endfor %}
    # No static keys: with them absent the controller authenticates through
    # its ServiceAccount's ambient AWS identity — the workloadIdentity binding
    # below, or the node role.
{% elif values.dns_provider == "cloud_dns" %}
  googleCloudDns:
    project:
      # A literal project ID: nothing in the deployed graph produces it, so a
      # described parameter is the honest shape (StringValueOrRef also accepts
      # a GcpProject reference for platforms that manage projects in Planton).
      value: "{{ values.gcp_project_id }}"
    zoneIdFilters:
{% for zone in values.dns_zone_names %}
      - valueFrom:
          name: "{{ zone }}"
{% endfor %}
{% elif values.dns_provider == "azure_dns" %}
  azureDns:
    resourceGroup: "{{ values.azure_resource_group }}"
    subscriptionId: "{{ values.azure_subscription_id }}"
    zoneIdFilters:
{% for zone in values.dns_zone_names %}
      - valueFrom:
          name: "{{ zone }}"
{% endfor %}
{% elif values.dns_provider == "cloudflare" %}
  cloudflare:
    # Materialized as a Kubernetes Secret wired into the controller's
    # environment — never rendered into chart values or pod specs.
    apiToken: "{{ values.cloudflare_api_token }}"
    zoneIdFilters:
{% for zone in values.dns_zone_names %}
      - valueFrom:
          name: "{{ zone }}"
{% endfor %}
{% endif %}
{% if values.workload_identity_provider != "none" and values.external_dns_identity_name != "" %}
  workloadIdentity:
{% if values.workload_identity_provider == "eks" %}
    eks:
      roleArn:
        valueFrom:
          name: "{{ values.external_dns_identity_name }}"
{% elif values.workload_identity_provider == "gke" %}
    gke:
      serviceAccountEmail:
        valueFrom:
          name: "{{ values.external_dns_identity_name }}"
{% elif values.workload_identity_provider == "aks" %}
    aks:
      clientId:
        valueFrom:
          name: "{{ values.external_dns_identity_name }}"
{% if values.azure_tenant_id != "" %}
      tenantId: "{{ values.azure_tenant_id }}"
{% endif %}
{% endif %}
{% endif %}
  # Watch the exposure surface this chart actually installs — Services always,
  # plus Ingresses OR Gateway API HTTPRoutes depending on the active arm.
  # Watching a surface that has no controller would only produce dead records.
  sources:
    - service
{% if values.use_gateway_api | bool %}
    - gateway-httproute
{% else %}
    - ingress
{% endif %}
  # Domain scope is the first guardrail: even with broad zone credentials the
  # controller refuses names outside these suffixes.
  domainFilters:
{% for domain in values.dns_domains %}
    - "{{ domain }}"
{% endfor %}
  # Distinct ownership ID per cluster sharing a zone — the TXT registry is
  # what stops two controllers from fighting over the same records. The
  # policy stays at the kind's default "upsert-only" (create and update,
  # never delete): the safe posture for zones that also hold records managed
  # by hand or by other systems.
  txtOwnerId: "{{ values.dns_txt_owner_id }}"
