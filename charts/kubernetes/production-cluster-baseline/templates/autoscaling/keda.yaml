{% if values.keda_enabled | bool %}
# KEDA — event-driven autoscaling: scales workloads on external signals
# (queue depth, Kafka consumer lag, cloud metrics, cron) including to and
# from zero — the layer beyond CPU-based HPA that metrics-server serves. A
# cluster singleton: Kubernetes allows exactly one external-metrics provider,
# and KEDA registers it. Off by default — install it when the first workload
# actually scales on events.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKeda
metadata:
  name: "{{ values.env }}-keda"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # Conventional home; permanent while the kept CRDs pin release ownership to
  # it. Internal TLS stays on KEDA's own certificate operator (the kind
  # default) — wiring it to the in-chart Let's Encrypt issuers would be wrong:
  # public ACME cannot issue for cluster-internal service names.
  namespace:
    value: keda
  createNamespace: true
{% endif %}
