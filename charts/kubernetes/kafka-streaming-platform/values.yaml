params:
  # ── Cluster binding ──────────────────────────────────────────────────────
  - name: connection
    description: >
      Slug of the Planton Kubernetes provider connection that selects the
      cluster this platform deploys onto. When set, every resource in the
      chart carries it as an explicit connection annotation, overriding the
      environment- and organization-level default connections. Leave empty
      to deploy onto the environment's default Kubernetes connection.
    value: ""

  # ── Placement ────────────────────────────────────────────────────────────
  - name: namespace
    description: >
      Kubernetes namespace the whole platform lives in — the operator, the
      Kafka cluster, and every topic, user, and client component together.
      One namespace is Strimzi's own grain: topic and user declarations are
      only reconciled in the cluster's namespace, and the operator's default
      watch scope is exactly its own namespace. Change it to run a second
      independent platform on the same cluster (see install_strimzi_operator
      before you do).
    value: kafka

  - name: install_strimzi_operator
    type: bool
    description: >
      Installs the Strimzi operator (the engine that reconciles the Kafka
      cluster, topics, and users) beside the Kafka cluster, watching this
      namespace only. Keep true on a cluster that does not run Strimzi yet.
      Set false on operator-ready clusters — any cluster provisioned by a
      full-stack platform chart runs a resident cluster-wide Strimzi whose
      fixed-name cluster roles a second install would fight over — and the
      resident operator reconciles this namespace instead.
    value: true

  # ── Kafka cluster sizing ─────────────────────────────────────────────────
  - name: dedicated_controllers
    type: bool
    description: >
      false (default): one node pool carries both the KRaft controller and
      broker roles — the compact high-availability shape for small-to-mid
      platforms. true: a dedicated 3-node controller pool runs beside the
      broker pool, isolating the metadata quorum from broker load — the
      shape to grow into when broker count or throughput climbs and quorum
      latency starts to matter.
    value: false

  - name: broker_replicas
    description: >
      Number of Kafka nodes serving data (the combined pool's size when
      dedicated_controllers is false; the broker pool's size when true).
      3 is the floor for a cluster that survives one broker loss under the
      default replication settings — keep it odd while the nodes also carry
      the controller role (the KRaft quorum needs a majority). Lowering it
      below replication_factor makes topic creation fail at reconcile time.
    value: "3"

  - name: broker_disk_size
    description: >
      Persistent volume size per Kafka node (a Kubernetes quantity, e.g.
      "20Gi"). Kafka is a storage-bound system: size for retention x
      throughput x replication_factor, and grow before the disks fill —
      brokers with full disks stop accepting writes cluster-wide.
    value: 20Gi

  # ── Durability posture ───────────────────────────────────────────────────
  - name: replication_factor
    description: >
      Copies of every partition, applied as the cluster default and to the
      internal offsets/transaction topics. MUST be less than or equal to
      broker_replicas — the brokers cannot hold more copies than there are
      brokers. 3 with min_insync_replicas 2 is the production convention
      (acknowledged writes survive one broker loss); lower both to 1 only
      for single-broker evaluation.
    value: "3"

  - name: min_insync_replicas
    description: >
      Minimum in-sync copies an acknowledged write must reach (applied to
      the cluster default and the internal transaction topics). The
      durability contract reads replication_factor minus one: 3/2 keeps
      writes flowing through a single broker loss and refuses writes rather
      than silently under-replicating past it.
    value: "2"

  # ── Topics and client identities ─────────────────────────────────────────
  - name: topic_names
    type: list
    description: >
      Kafka topics created declaratively, one per entry (alphanumerics,
      '.', '_' and '-'). Each becomes a first-class topic resource the
      platform reconciles — partitions grow declaratively, and DELETING an
      entry deletes the topic AND ITS DATA. Add topics here as the
      platform's canonical topic inventory.
    value:
      - events

  - name: topic_partitions
    description: >
      Partitions per declared topic — the parallelism ceiling for that
      topic's consumers. Partitions can be INCREASED later but never
      decreased, and increasing them remaps keys on keyed topics: plan up
      front for topics with semantic partitioning.
    value: "3"

  - name: user_names
    type: list
    description: >
      Kafka client identities created declaratively, one per entry. Each
      becomes a SCRAM-SHA-512 principal whose password the operator
      generates into a Secret named after the user — applications read
      credentials from the Secret, never from configuration. The rendered
      principal and Secret name is "<env>-user-<entry>".
    value:
      - app

  # ── Schema registry ──────────────────────────────────────────────────────
  - name: schema_registry_enabled
    type: bool
    description: >
      Deploys Karapace — the open-source, Confluent-API-compatible schema
      registry — wired to this cluster over TLS with its own dedicated
      SCRAM identity. The registry is what makes producer/consumer schema
      evolution safe; existing Schema Registry clients point at it
      unchanged. Turn off only when schemas are governed elsewhere.
    value: true

  # ── Management console ───────────────────────────────────────────────────
  - name: kafka_ui_enabled
    type: bool
    description: >
      Deploys the Kafbat UI management console — topic browsing, message
      inspection, consumer-group lag, and (when enabled) schema-registry
      and Connect views — wired to this cluster over TLS with its own
      dedicated SCRAM identity. The console stays ClusterIP-internal;
      its login is still enabled because anyone who reaches it holds the
      cluster credential it carries.
    value: true

  - name: kafka_ui_username
    description: >
      Login username for the console's single account (the console's form
      login authenticates exactly one user; OAuth2/LDAP compose through
      the deployed resource's escape hatch).
    value: admin

  - name: kafka_ui_password
    description: >
      Login password for the console account. The platform materializes
      it into a Secret-backed environment variable; it never lands in
      rendered chart values.
      On Planton the value is a reference to a managed secret, resolved at deploy
      so the password is never stored with the project: create it with
      `planton secret set kafka-streaming-platform-ui-password --string` (or name an environment's own as
      `$secret/@<env>/<slug>`). A deploy without the platform takes the literal.
    value: $secret/kafka-streaming-platform-ui-password

  # ── Kafka Connect ────────────────────────────────────────────────────────
  - name: connect_enabled
    type: bool
    description: >
      Deploys a Kafka Connect cluster wired to this Kafka over TLS with its
      own dedicated SCRAM identity, managed declaratively (connectors are
      declared as KubernetesKafkaConnector resources, never through the
      REST API). The stock image carries ONLY the MirrorMaker 2 connectors
      — real integrations add plugins on the deployed resource (see the
      README). Off by default: enable it when you have connectors to run.
    value: false

  # ── Migration (MirrorMaker 2) ────────────────────────────────────────────
  - name: mirror_enabled
    type: bool
    description: >
      Deploys MirrorMaker 2 streaming an EXISTING Kafka cluster's topics
      and consumer-group offsets INTO this platform — the migration path
      off Confluent/MSK/a datacenter cluster. Consumers cut over without
      reprocessing because committed offsets are checkpointed across.
      Configure the mirror_source_* parameters before enabling.
    value: false

  - name: mirror_source_bootstrap_servers
    description: >
      Bootstrap address (host:port) of the SOURCE cluster to mirror from —
      usually an external address (a Confluent/MSK bootstrap endpoint, a
      datacenter cluster). MUST BE CHANGED when mirror_enabled is true; the
      placeholder exists only so a fresh render validates.
    value: source-kafka.example.com:9092

  - name: mirror_source_auth_mechanism
    type: string_enum
    enumValues:
      - scram-sha-512
      - scram-sha-256
      - plain
    description: >
      SASL mechanism the source cluster authenticates: scram-sha-512 for
      MSK SCRAM and Strimzi-managed sources, plain for Confluent Cloud API
      keys. Only used when mirror_source_username is set.
    value: scram-sha-512

  - name: mirror_source_username
    description: >
      SASL username on the source cluster (for Confluent Cloud: the API
      key). Leave empty for an unauthenticated source — common only for
      in-datacenter migrations over private networks.
    value: ""

  - name: mirror_source_password_secret_name
    description: >
      Name of an EXISTING Kubernetes Secret in this platform's namespace
      holding the source password (for Confluent Cloud: the API secret)
      under the key "password". Create it before deploying — the README
      gives the exact command. External credentials always ride a Secret
      you own; they are never chart parameters.
    value: ""

  - name: mirror_source_ca_secret_name
    description: >
      Name of an EXISTING Kubernetes Secret in this platform's namespace
      holding the source cluster's CA certificate under the key "ca.crt" —
      required when the source uses a private CA (a Strimzi cluster's own
      CA, a corporate CA). Leave empty for public-CA TLS endpoints
      (Confluent Cloud) or plaintext sources.
    value: ""

  - name: mirror_topics_pattern
    description: >
      Regex of source topics to mirror (Kafka regex form; comma-separated
      lists also work, e.g. "orders,payments.*"). The default mirrors
      everything except the engine's built-in internal-topic exclusions.
    value: ".*"

  - name: mirror_keep_topic_names
    type: bool
    description: >
      true (default): mirrored topics keep their ORIGINAL names — the
      migration posture, letting producers and consumers cut over without
      renaming. false: mirrored topics are prefixed with the source alias
      ("source.orders") — the posture for permanent multi-cluster
      replication where both clusters stay live.
    value: true
