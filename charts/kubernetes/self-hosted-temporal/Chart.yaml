apiVersion: infra-hub.planton.ai/v1alpha1
kind: InfraChart
metadata:
  name: Kubernetes Self-Hosted Temporal
spec:
  selector:
    kind: platform
  description: >-
    A production-shaped Temporal on your own cluster in one deploy — the
    durable workflow engine with its PostgreSQL wiring already right: a
    CloudNativePG-managed database bootstrapped with both stores Temporal
    requires, credentials flowing by reference through operator-maintained
    Secrets, the Web UI on, and your first Temporal namespace created
    declaratively.
  iconUrl: https://downloads.planton.ai/catalog/logos/kubernetes/kubernetestemporal/logo.svg
  webLinks:
    chartWebUrl: https://github.com/plantonhq/planton/tree/main/charts/kubernetes/self-hosted-temporal
    readmeRawUrl: https://raw.githubusercontent.com/plantonhq/planton/refs/heads/main/charts/kubernetes/self-hosted-temporal/README.md
