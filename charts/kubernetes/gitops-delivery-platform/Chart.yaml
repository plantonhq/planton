apiVersion: infra-hub.planton.ai/v1alpha1
kind: InfraChart
metadata:
  name: Kubernetes GitOps Delivery Platform
spec:
  selector:
    kind: platform
  description: >-
    Git as the deployment truth from day one — Argo CD continuously
    syncing your clusters from repositories, and Argo Workflows running
    the pipelines behind them, with the durability wiring already right:
    workflow artifacts and archived logs on an in-cluster S3 store, run
    history in a CloudNativePG-managed PostgreSQL that outlives the
    workflow objects themselves, and every credential flowing by
    reference through operator-maintained Secrets. SSO is one toggle
    away; nothing is exposed until you compose exposure in front.
  iconUrl: https://downloads.planton.ai/catalog/logos/kubernetes/kubernetesargocd/logo.svg
  webLinks:
    chartWebUrl: https://github.com/plantonhq/planton/tree/main/charts/kubernetes/gitops-delivery-platform
    readmeRawUrl: https://raw.githubusercontent.com/plantonhq/planton/refs/heads/main/charts/kubernetes/gitops-delivery-platform/README.md
