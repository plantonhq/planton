# Argo Workflows — the pipeline engine behind the delivery platform:
# container-native DAGs for CI jobs, batch processing, and the automation
# Argo CD deploys but does not run. This kind installs the ENGINE only;
# Workflows, WorkflowTemplates, and CronWorkflows are plain custom
# resources declared afterwards. Workflow pods run as the runner
# ServiceAccount (the chart's default `argo-workflow`), never the
# controller's — annotate THAT identity for cloud access.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesArgoWorkflows
metadata:
  name: "{{ values.env }}-argo-workflows"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # JOINS the chart-owned namespace — the same one the artifact store and
  # the archive database live in. Co-location is load-bearing: the
  # controller reads the artifact-store keys and the archive credentials
  # from Secrets in its OWN namespace (see namespace.yaml).
  namespace:
    valueFrom:
      name: "{{ values.env }}-gitops-ns"
  createNamespace: false
{% if values.artifact_store_enabled | bool %}
  artifactRepository:
    # Step logs archived beside artifacts — the UI shows logs after pods
    # are gone, which is half the reason an artifact store exists.
    archiveLogs: true
    s3:
      # Declared at the store's install — see artifacts.yaml. The bucket
      # must exist before the first write; Argo Workflows never creates
      # it.
      bucket: workflow-artifacts
      # Endpoint AND credentials Secret by reference — each rides its
      # field's annotated composition key (the store's s3_endpoint and
      # s3_credentials_secret_name outputs), and the credential key-name
      # defaults already match the store's generated Secret, so nothing
      # else is declared. Plain HTTP: an in-cluster store without TLS
      # (never set insecure towards real S3).
      endpoint:
        valueFrom:
          name: "{{ values.env }}-gitops-artifacts"
      insecure: true
      credentialsSecret:
        secretName:
          valueFrom:
            name: "{{ values.env }}-gitops-artifacts"
{% endif %}
{% if values.archive_enabled | bool %}
  archive:
    engine: postgres
    # The three-seam wiring into the database, entirely by reference:
    # host resolves the -rw Service (always the current primary), and
    # the credentials Secret name resolves the operator-maintained
    # `<db>-app` Secret — its username/password keys are the selector
    # defaults, so only the name is declared. `database` restates the
    # bootstrap value (see database.yaml); the controller creates its
    # tables there on first boot.
    host:
      valueFrom:
        name: "{{ values.env }}-gitops-db"
    database: workflows
    credentialsSecret:
      name:
        valueFrom:
          name: "{{ values.env }}-gitops-db"
  # With history safe in the archive, the cluster keeps only a working
  # set of completed Workflow CRs per outcome — the UI still shows
  # everything, served from the database. Without the archive (toggle
  # off) this block deliberately disappears too: pruning CRs would then
  # DELETE the only copy of the history.
  retentionPolicy:
    completed: 20
    failed: 10
    errored: 10
{% endif %}
  # Everything else rides the kind's defaults: the Argo server on
  # (plain HTTP behind composed exposure), `server` auth mode, the runner
  # ServiceAccount created in the install namespace only, CRDs installed
  # full-schema and KEPT on uninstall (removing them would delete every
  # Workflow in the cluster), and no instance-id label — this is the
  # cluster's one Argo Workflows install.
