# Argo CD — the GitOps control plane: it watches your repositories and
# continuously reconciles the cluster to what Git declares. This kind
# installs the CONTROL PLANE only; Applications, AppProjects, and
# ApplicationSets are plain custom resources you declare afterwards (the
# README's after-deployment section creates the first one). On first start
# the application generates its admin password into the fixed-name
# `argocd-initial-admin-secret` (key `password`) — the fixed name is why
# one namespace holds exactly one Argo CD.
#
# The chart's bundled single-pod Redis serves as the cache, deliberately:
# Argo CD uses Redis as a DISPOSABLE cache (losing it costs a re-sync,
# never state), so the lean default is the honest one — the HA and
# external-Valkey arms are values changes on the deployed resource when
# availability needs grow.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesArgocd
metadata:
  name: "{{ values.env }}-argocd"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # JOINS the namespace the chart owns (namespace.yaml) — referencing the
  # namespace resource makes the created-before-used ordering structural.
  namespace:
    valueFrom:
      name: "{{ values.env }}-gitops-ns"
  createNamespace: false
{% if values.argocd_domain != "" %}
  # The public hostname (name only, no scheme) embedded in SSO redirect
  # URLs, CLI login hints, and notification links. Set alongside the
  # exposure you compose in front; empty keeps relative links.
  domain: "{{ values.argocd_domain }}"
{% endif %}
{% if values.sso_enabled | bool %}
  sso:
    # Direct OIDC against your identity provider — the natural target is
    # the Kubernetes Identity and Access Platform chart's Keycloak
    # (issuer: <keycloak-url>/realms/<realm>). KNOW THIS about the client
    # secret: it rides a PRE-CREATED Secret in this namespace (external
    # credentials are never chart parameters), the Secret must carry the
    # key named below AND the label `app.kubernetes.io/part-of: argocd`
    # or Argo CD refuses to read it. An empty secret name means a PUBLIC
    # client (PKCE) — no secret involved at all.
    oidc:
      name: oidc
      issuer: "{{ values.sso_oidc_issuer }}"
      clientId: "{{ values.sso_oidc_client_id }}"
{% if values.sso_oidc_client_secret_secret_name != "" %}
      clientSecretSecret:
        name: "{{ values.sso_oidc_client_secret_secret_name }}"
        # The key inside that Secret — a chart constant so the pre-create
        # instruction in the README is exact.
        key: clientSecret
{% endif %}
{% endif %}
  # Everything else rides the kind's secure defaults: the local
  # admin user enabled (disable it only AFTER SSO works — the spec's own
  # warning), TLS-serving server, CRDs installed and KEPT on uninstall
  # (removing them would delete every Application in the cluster), and
  # ClusterIP services — exposure composes in front over the exported
  # server handle.
