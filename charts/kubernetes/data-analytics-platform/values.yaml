params:
  # ── Cluster binding ──────────────────────────────────────────────────────
  - name: connection
    description: >
      Slug of the Planton Kubernetes provider connection that selects the
      cluster this platform deploys onto. When set, every resource in the
      chart carries it as an explicit connection annotation, overriding the
      environment- and organization-level default connections. Leave empty
      to deploy onto the environment's default Kubernetes connection — the
      right choice when the environment maps one-to-one to a cluster.
    value: ""

  # ── Placement ────────────────────────────────────────────────────────────
  - name: namespace
    description: >
      Kubernetes namespace the whole platform lives in — the database, the
      lake, the cache, and every analytics workload together, deliberately:
      Airflow, Trino and Superset all read database and cache passwords
      through Secret references, and a Secret can only be read from the
      workload's own namespace, so co-location is the design, not a
      convenience. Change it to run a second independent analytics platform
      on the same cluster.
    value: analytics

  - name: install_cnpg_operator
    type: bool
    description: >
      Installs the CloudNativePG operator (the engine that reconciles the
      database) into cnpg-system. The operator is a one-per-cluster
      singleton — its Helm release name, cluster-scoped CRDs, and webhook
      identity are fixed upstream, so a second installation fights the
      first. Keep true on a cluster that does not run CloudNativePG yet;
      set false on operator-ready clusters (any cluster provisioned by a
      full-stack platform chart already runs it), and the resident operator
      reconciles this chart's database instead.
    value: true

  - name: install_spark_operator
    type: bool
    description: >
      Installs the Apache Spark Kubernetes operator beside the platform,
      watching the whole cluster (the one-operator-per-cluster posture).
      It turns SparkApplication declarations — your batch and streaming
      jobs — into running Spark drivers and executors. Set false on
      clusters that already run the Spark operator; your jobs then need a
      service account with pod-management rights in this chart's namespace
      (the README's day-2 notes walk through it).
    value: true

  # ── Database sizing ──────────────────────────────────────────────────────
  - name: postgres_instances
    description: >
      Number of PostgreSQL instances: one primary plus the rest as
      streaming replicas with automated failover. 2 (default) is the floor
      for a database that survives node loss — Airflow's run history,
      Superset's dashboards, and the warehouse tables all live here, so
      the database's availability IS the platform's availability. 3 is the
      production convention; 1 is a single point of failure for evaluation
      only.
    value: "2"

  - name: postgres_disk_size
    description: >
      Persistent volume size per PostgreSQL instance (a Kubernetes
      quantity, e.g. "20Gi"). The warehouse database grows with the data
      your pipelines land — size for the tables you plan to keep, not the
      lake (raw files belong in the lake buckets). Grows are applied in
      place when the storage class supports expansion; shrinks are
      rejected.
    value: 20Gi

  # ── Data lake ────────────────────────────────────────────────────────────
  - name: lake_buckets
    type: list
    description: >
      S3 buckets created in the SeaweedFS data lake at install — where
      Spark jobs and Airflow pipelines read and write raw and intermediate
      data. Add one entry per dataset domain ("raw", "curated",
      "exports"). Removing an entry later does NOT delete the bucket or
      its data. Lowercase S3 naming rules apply.
    value:
      - lake

  - name: lake_disk_size
    description: >
      Persistent volume size for the lake's volume-server tier (a
      Kubernetes quantity) — the disk actually holding object data. Size
      it for your datasets; the master and filer tiers keep their small
      defaults. Grows are applied in place when the storage class supports
      expansion.
    value: 30Gi

  # ── Cache ────────────────────────────────────────────────────────────────
  - name: valkey_password
    description: >
      Password for the cache's "default" ACL user — authentication is ON
      by default because an open cache is readable and writable by
      anything that reaches its Service. The platform materializes it
      into the cache's auth Secret; Superset reads it from there by
      reference.
      On Planton the value is a reference to a managed secret, resolved at deploy
      so the password is never stored with the project: create it with
      `planton secret set data-analytics-platform-valkey-password --string` (or name an environment's own as
      `$secret/@<env>/<slug>`). A deploy without the platform takes the literal.
    value: $secret/data-analytics-platform-valkey-password

  - name: valkey_max_memory
    description: >
      Memory ceiling for Superset's cached query results and Celery
      queues, as a Valkey size ("256mb", "1gb"). At the ceiling the cache
      EVICTS least-recently-used keys — the correct cache behavior
      (without a ceiling, the pod's memory limit becomes the bound and
      hitting it is an OOM kill, not an eviction).
    value: 256mb

  - name: valkey_disk_size
    description: >
      Persistent volume size for the cache (a Kubernetes quantity). The
      volume lets the cache restart WARM from its last snapshot instead of
      empty — cheap insurance against a thundering herd of re-computed
      dashboard queries after every pod restart. Size it near
      valkey_max_memory.
    value: 2Gi

  # ── Airflow ──────────────────────────────────────────────────────────────
  - name: dags_git_repo
    description: >
      Git repository holding your DAG files — the push-to-deploy pipeline
      path: a git-sync sidecar on every Airflow component keeps DAGs
      current within seconds of a push. HTTPS clone URL for public
      repositories (private repos and SSH need credential Secrets — the
      README's day-2 notes walk through it). Leave empty to run DAGs baked
      into a custom Airflow image instead.
    value: ""

  - name: dags_git_ref
    description: >
      Git revision to sync DAGs from — a branch name, tag, or commit hash.
      Only meaningful when dags_git_repo is set. Empty syncs the
      repository's default branch.
    value: ""

  - name: airflow_triggerer_disk_size
    description: >
      Persistent volume size for Airflow's triggerer (a Kubernetes
      quantity). The component's upstream default is 100Gi — far more than
      its small local state needs; 2Gi carries production installs
      comfortably. Raise it only if you run very large fleets of deferred
      operators.
    value: 2Gi

  - name: pgbouncer_enabled
    type: bool
    description: >
      Puts PgBouncer connection pooling between Airflow and the metadata
      database. Airflow opens MANY short-lived database connections (every
      task heartbeat is one) — pooling is the production posture, which is
      why this defaults on. Turn off only for small evaluation installs
      where connection pressure is not a concern.
    value: true

  # ── Trino ────────────────────────────────────────────────────────────────
  - name: trino_workers
    description: >
      Number of Trino worker pods — the compute that executes query
      splits (the coordinator plans, workers scan and join). 2 (default)
      gives real parallelism on modest clusters; scale with concurrent
      query load and data size.
    value: "2"

  - name: trino_fault_tolerant_execution_enabled
    type: bool
    description: >
      Turns on Trino's fault-tolerant execution: failed TASKS retry
      instead of failing the whole query, with intermediate exchange data
      spooled durably to a dedicated bucket in this chart's lake. The
      batch/ETL posture — long-running queries survive worker loss and
      pair naturally with spot capacity. Off (default) is the interactive
      posture: lower latency, a worker loss fails the running query. The
      spool bucket is created only when this is on.
    value: false
