# The platform cache — Redis-compatible Valkey backing Superset's query
# cache and Celery queues. Standalone with a persistent volume so it
# restarts WARM from its last snapshot instead of empty (an empty cache
# after every restart sends a thundering herd of re-computed dashboard
# queries at the database and Trino). Replication is deliberately not the
# default: a cache's contract tolerates brief unavailability, and the
# replicated shape is a values change away on the deployed resource.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesValkey
metadata:
  name: "{{ values.env }}-analytics-cache"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # JOINS the namespace the chart owns (namespace.yaml) — co-location is
  # load-bearing: Superset reads this cache's password through a Secret
  # reference, which can only reach Secrets in its own namespace.
  namespace:
    valueFrom:
      name: "{{ values.env }}-analytics-ns"
  createNamespace: false
  persistence:
    size: "{{ values.valkey_disk_size }}"
  config:
    # The cache posture: a hard memory ceiling with least-recently-used
    # eviction. Without max_memory the pod's memory limit is the only
    # bound — and hitting THAT is an OOM kill, not an eviction. allkeys-lru
    # (rather than the server's noeviction default) is what makes this a
    # cache: old entries make room for new ones; nothing here is the
    # source of truth.
    maxMemory: "{{ values.valkey_max_memory }}"
    maxMemoryPolicy: allkeys-lru
  # Authentication is DECLARED because the kind ships with auth OFF
  # by upstream default (anyone with network reach gets full read/write).
  # The "default" user is the one plain AUTH <password> clients map to —
  # and the one the spec requires, since without it unauthenticated
  # clients keep full access. The password is a MUST-CHANGE parameter,
  # materialized into the `<name>-auth` Secret under the USERNAME as its
  # key — bi.yaml reads it back by reference from exactly there.
  auth:
    users:
      - name: default
        password: "{{ values.valkey_password }}"
