# The data lake — SeaweedFS with its S3 gateway on, where Spark jobs and
# Airflow pipelines read and write raw and intermediate data. S3
# authentication is on by default: the component generates stable admin
# and read-only credential pairs into the `<name>-s3-secret` Secret
# (survives upgrades AND uninstall), and every declared bucket exists
# before the first job runs. Removing a bucket entry later does NOT delete
# the bucket or its data — buckets are data, not configuration.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesSeaweedFs
metadata:
  name: "{{ values.env }}-analytics-lake"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # JOINS the namespace the chart owns (namespace.yaml) — referencing the
  # namespace resource makes the created-before-used ordering structural.
  namespace:
    valueFrom:
      name: "{{ values.env }}-analytics-ns"
  createNamespace: false
  # Only the volume-server tier (the disk actually holding object data) is
  # sized by parameter; the master and filer tiers keep the kind's
  # small defaults, which carry this single-instance topology comfortably.
  volume:
    dataVolume:
      size: "{{ values.lake_disk_size }}"
  s3:
    # enabled and enable_auth stay on their secure defaults (true) — the
    # S3 gateway with generated credentials IS this resource's purpose
    # here.
    buckets:
{% for bucket in values.lake_buckets %}
      - name: "{{ bucket }}"
{% endfor %}
{% if values.trino_fault_tolerant_execution_enabled | bool %}
      # Trino's fault-tolerant execution spools intermediate exchange data
      # here (query.yaml wires the exchange manager at this bucket). The
      # bucket exists only while the toggle is on — it is engine plumbing,
      # not a dataset, and it never appears in the user's bucket list.
      - name: trino-spool
{% endif %}
