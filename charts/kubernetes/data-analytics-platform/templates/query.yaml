# Trino — the distributed SQL engine: one coordinator planning queries,
# a worker fleet executing them. Secured by default: password
# authentication with a generated admin credential (`<name>-auth`), the
# required internal-communication shared secret, and fail-closed plain
# HTTP on the data plane are all composed by the component — nothing to
# configure here, nothing to weaken. The in-image tpch/tpcds sample
# catalogs stay on (the kind's default), so SQL works on the first
# login before any pipeline has landed data.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesTrino
metadata:
  name: "{{ values.env }}-trino"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
{% if values.trino_fault_tolerant_execution_enabled | bool %}
  relationships:
    # With fault-tolerant execution on, Trino spools exchange data into
    # the lake's trino-spool bucket using the lake's generated credential
    # Secret — both consumed as render-known literals (properties files
    # and env names cannot carry references), so no valueFrom edge exists
    # to order the deploys. This edge declares that ordering explicitly:
    # the lake (bucket + credential Secret) must exist before a
    # spooling-enabled Trino starts. The edge goes with the toggle — an
    # interactive-posture Trino has no dependency on the lake.
    - kind: KubernetesSeaweedFs
      name: "{{ values.env }}-analytics-lake"
      type: depends_on
{% endif %}
spec:
  # JOINS the chart-owned namespace — the same one the database lives in.
  # Co-location is load-bearing: the warehouse catalog's password reaches
  # Trino as an environment variable from the database's credential
  # Secret, readable only from this namespace (see namespace.yaml).
  namespace:
    valueFrom:
      name: "{{ values.env }}-analytics-ns"
  createNamespace: false
  workers:
    replicas: {{ values.trino_workers }}
  catalogs:
    postgres:
      # The warehouse catalog — `SELECT ... FROM warehouse.public.<table>`
      # over the tables your pipelines land. Host and credential Secret
      # resolve the database's outputs by reference (the annotated
      # composition keys — kind and fieldPath deliberately omitted); the
      # password reaches Trino through the component's env-substitution
      # seam, never a rendered properties file.
      - name: warehouse
        host:
          valueFrom:
            name: "{{ values.env }}-analytics-db"
        database: warehouse
        # The bootstrap owner role declared in database.yaml — both sides
        # render from the same chart-controlled literal. Its grants bound
        # what queries through this catalog can read and write: ownership
        # of the warehouse, exactly.
        username: analytics
        passwordSecret:
          secretName:
            valueFrom:
              name: "{{ values.env }}-analytics-db"
{% if values.trino_fault_tolerant_execution_enabled | bool %}
  faultTolerantExecution:
    # TASK retries — the batch/ETL posture: a lost worker re-runs its
    # tasks instead of failing the whole query. QUERY retry (the
    # interactive flavor) is deliberately not chosen here: whoever flips
    # this toggle is running long batch queries, and TASK is the policy
    # that pairs with worker autoscaling and spot capacity.
    retryPolicy: TASK
    exchangeManager:
      baseDirectories:
        - "s3://trino-spool"
      # Every property below is render-known from names this chart itself
      # controls, and the property names are the engine's own at the
      # pinned release: the lake's S3 gateway Service is
      # `<lake-name>-s3` on port 8333, endpoint-only configuration is
      # valid (the engine requires region OR endpoint), and path-style
      # addressing is required because virtual-hosted bucket DNS does not
      # resolve against an in-cluster Service. The credentials arrive as
      # environment variables (extraEnvFromSecret below) referenced
      # through the engine's own ${ENV:...} substitution — never literals
      # in a properties file.
      additionalProperties:
        - "exchange.s3.endpoint=http://{{ values.env }}-analytics-lake-s3.{{ values.namespace }}.svc.cluster.local:8333"
        - "exchange.s3.path-style-access=true"
        - "exchange.s3.aws-access-key=${ENV:EXCHANGE_AWS_ACCESS_KEY}"
        - "exchange.s3.aws-secret-key=${ENV:EXCHANGE_AWS_SECRET_KEY}"
  extraEnvFromSecret:
    # The lake's generated S3 credential Secret (`<lake-name>-s3-secret`,
    # stable across upgrades) — its name is render-known because this
    # chart names the lake. The admin pair is deliberate: the spool bucket
    # is engine plumbing owned by this platform, not a shared dataset a
    # read-only credential should fence.
    EXCHANGE_AWS_ACCESS_KEY:
      secretName: "{{ values.env }}-analytics-lake-s3-secret"
      secretKey: admin_access_key_id
    EXCHANGE_AWS_SECRET_KEY:
      secretName: "{{ values.env }}-analytics-lake-s3-secret"
      secretKey: admin_secret_access_key
{% endif %}
