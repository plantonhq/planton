# Apache Airflow — the platform's scheduler: the API server (UI + REST),
# scheduler, DAG processor and triggerer, with the migration and
# admin-bootstrap Jobs. The executor stays on the kind's default —
# KubernetesExecutor: every task runs as its own ephemeral pod, so there
# is no broker, no idle worker fleet, and Spark-bound tasks simply submit
# SparkApplications against the operator installed beside it. That default
# is also why this template declares NO broker block: the component
# rejects one outside the Celery family (the cache in cache.yaml serves
# Superset, not Airflow). Moving to CeleryExecutor is a day-2 values
# change — the README walks through it.
#
# The admin password, Fernet key, API secret key and JWT signing secret
# are all generated by the component into Secrets — the upstream
# admin/admin default never ships.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesAirflow
metadata:
  name: "{{ values.env }}-airflow"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # JOINS the chart-owned namespace — the same one the database lives in.
  # Co-location is load-bearing: the component reads the database
  # credential Secret at deploy time to compose Airflow's connection
  # Secrets, and Secrets are only readable from the workload's own
  # namespace (see namespace.yaml).
  namespace:
    valueFrom:
      name: "{{ values.env }}-analytics-ns"
  createNamespace: false
  database:
    postgres:
      # The three-seam wiring into the database, entirely by reference:
      # host resolves the -rw Service (always the current primary), and
      # the password Secret name resolves the operator-maintained
      # `<db>-app` credential Secret — maintained across failovers, never
      # rendered into values. Each reference rides its field's annotated
      # composition key, so kind and fieldPath are deliberately omitted.
      host:
        valueFrom:
          name: "{{ values.env }}-analytics-db"
      # The bootstrap owner role declared in database.yaml — a plain-string
      # field by the spec's contract, honest here because BOTH sides render
      # from the same literal this chart controls. The database_name
      # default ("airflow") matches the bootstrap exactly — restating it
      # would only create a second place for the contract to drift.
      username: analytics
      passwordSecret:
        secretName:
          valueFrom:
            name: "{{ values.env }}-analytics-db"
{% if values.dags_git_repo != "" %}
  dags:
    gitSync:
      # Push-to-deploy pipelines: a git-sync sidecar on every component
      # keeps DAGs current within seconds of a push. Private repositories
      # add a credential Secret on the deployed resource — the README's
      # day-2 notes walk through it. When dags_git_repo is empty this
      # whole block is absent and DAGs come baked into the image (the
      # kind's documented default posture).
      repo: "{{ values.dags_git_repo }}"
      ref: "{{ values.dags_git_ref }}"
{% endif %}
  components:
    triggerer:
      # The one component whose upstream default disk (100Gi) far
      # outweighs its need — its local state is tiny; the parameter keeps
      # it honest for the cluster at hand.
      persistenceSize: "{{ values.airflow_triggerer_disk_size }}"
{% if values.pgbouncer_enabled | bool %}
  pgbouncer:
    # Airflow opens MANY short-lived database connections (every task
    # heartbeat is one); PgBouncer multiplexes them onto a small pooled
    # set so the database's connection slots stay available for the
    # warehouse and Superset. The component composes the PgBouncer
    # credential file from the same referenced Secret as the database
    # wiring above — nothing renders into values here either.
    enabled: true
{% endif %}
