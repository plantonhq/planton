# Langfuse itself: the web server (UI, public API, OTLP ingestion endpoint)
# and the worker, wired to the four stores BY REFERENCE. Each reference
# names only the resource: the kind and the output path come from the
# field's composition default, so a host resolves to the store's Service and
# a password to the store's own Secret, which Langfuse reads at runtime and
# never copies. Those references are also what order the deploy: the
# InfraPipeline brings up all four stores before Langfuse.
#
# Everything sensitive is either generated by the module or declared as a
# managed secret, and either way lands in the module's `<name>-secrets`
# Secret, never in Helm values.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesLangfuse
metadata:
  name: "{{ values.env }}-langfuse"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  namespace:
    valueFrom:
      name: "{{ values.env }}-langfuse-ns"
  createNamespace: false
{% if values.hostname != "" %}
{% if values.cluster_issuer != "" %}
  externalUrl: "https://{{ values.hostname }}"
{% else %}
  externalUrl: "http://{{ values.hostname }}"
{% endif %}
{% endif %}
  postgres:
    host:
      valueFrom:
        name: "{{ values.env }}-langfuse-pg"
    # The database owner database.yaml bootstraps.
    username: langfuse
    passwordSecret:
      secretName:
        valueFrom:
          name: "{{ values.env }}-langfuse-pg"
  clickhouse:
    host:
      valueFrom:
        name: "{{ values.env }}-langfuse-ch"
    # The user clickhouse.yaml declares; its password Secret stores it under
    # this name, the key Langfuse reads by default.
    username: langfuse
    passwordSecret:
      secretName:
        valueFrom:
          name: "{{ values.env }}-langfuse-ch"
    # Cluster mode on (the kind's default): replicated tables on Keeper. The
    # cluster name follows the ClickHouse resource.
    cluster:
      name:
        valueFrom:
          name: "{{ values.env }}-langfuse-ch"
  redis:
    standalone:
      host:
        valueFrom:
          name: "{{ values.env }}-langfuse-valkey"
    username:
      valueFrom:
        name: "{{ values.env }}-langfuse-valkey"
    # Valkey keys its auth Secret by user name, so the key is a reference
    # too, never the generic "password".
    passwordSecret:
      secretName:
        valueFrom:
          name: "{{ values.env }}-langfuse-valkey"
      secretKey:
        valueFrom:
          name: "{{ values.env }}-langfuse-valkey"
  blobStorage:
    target:
      s3Compatible:
        endpoint:
          valueFrom:
            name: "{{ values.env }}-langfuse-s3"
        bucket: langfuse
        credentialsSecret:
          secretName:
            valueFrom:
              name: "{{ values.env }}-langfuse-s3"
{% if values.media_public_endpoint != "" %}
    # Presigned URLs for media and exports are signed for the public
    # address; Langfuse itself keeps reading through the in-cluster one.
    mediaUpload:
      publicEndpoint: "{{ values.media_public_endpoint }}"
    batchExport:
      publicEndpoint: "{{ values.media_public_endpoint }}"
{% endif %}
{% if values.salt_secret != "" or values.encryption_key_secret != "" %}
  secrets:
{% if values.salt_secret != "" %}
    salt: "$secret/{{ values.salt_secret }}"
{% endif %}
{% if values.encryption_key_secret != "" %}
    encryptionKey: "$secret/{{ values.encryption_key_secret }}"
{% endif %}
{% endif %}
  init:
    # The admin owns the seeded organization; its password is generated and
    # readable through the admin_password_secret output.
    admin:
      email: "{{ values.admin_email }}"
  auth:
    # Nobody else can create an account until the admin invites them.
    disableSignUp: true
{% if values.high_availability | bool %}
  # Langfuse's production sizing: 2 CPU and 4 GiB requested per pod, two
  # replicas of each workload spread across zones, one always kept through
  # voluntary disruptions.
  web:
    replicas: 2
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 4Gi
    pdb:
      minAvailable: "1"
    scheduling:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
  worker:
    replicas: 2
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 4Gi
    pdb:
      minAvailable: "1"
    scheduling:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
{% endif %}
