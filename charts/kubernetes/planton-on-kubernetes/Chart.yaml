apiVersion: infra-hub.planton.ai/v1alpha1
kind: InfraChart
metadata:
  name: Planton on Kubernetes
spec:
  selector:
    kind: platform
  description: >-
    Run Planton itself on your own cluster. One deploy installs the
    Planton operator (once per cluster) and declares a complete
    self-hosted platform — control plane, web console, identity server,
    databases, secrets manager, and an in-cluster deployment runner — in
    its own namespace. Zero-config by design: the version is the one
    required choice, the built-in gateway serves console and sign-in over
    a single port-forward, and the first visitor becomes the admin.
    Optional refinements: a real hostname with TLS, storage class and
    size, and the operator toggle that lets a second platform join a
    cluster already running one.
  iconUrl: https://downloads.planton.ai/catalog/logos/kubernetes/kubernetesplantonplatform/logo.svg
  webLinks:
    chartWebUrl: https://github.com/plantonhq/planton/tree/main/charts/kubernetes/planton-on-kubernetes
    readmeRawUrl: https://raw.githubusercontent.com/plantonhq/planton/refs/heads/main/charts/kubernetes/planton-on-kubernetes/README.md
