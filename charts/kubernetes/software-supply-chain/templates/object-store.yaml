# The blob store — an in-cluster S3 object store holding every image
# layer, chart, and artifact Harbor serves. Object storage (rather than a
# filesystem volume) is what unlocks the registry's production scaling
# shape: stateless registry replicas sharing one store.
#
# THE IDENTITY SECRET, declared-on-both-sides: SeaweedFS takes its S3
# identities from this chart-created Secret (`existing_config_secret` —
# when set, the store generates nothing), and Harbor declares the SAME
# key pair on its storage arm (registry.yaml), where its module
# materializes them under the registry driver's fixed contract keys.
# Harbor's existing-secret site pins its OWN key names, and the store's
# generated Secret pins different ones — declaring one chart-controlled
# pair on both sides is the only shape where neither side's key contract
# is violated. The Secret carries BOTH the identities JSON (the key the
# S3 gateway consumes) and the flat admin credential keys, mirroring the
# generated `-s3-secret` shape so the store's exported
# s3_credentials_secret_name output keeps its documented key contract
# for any future consumer. Every value here is a secret, so on Planton each
# is a reference to one key of the install's credentials secret, resolved at
# deploy; the identities JSON is its own key because it carries the pair.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesSecret
metadata:
  name: "{{ values.env }}-supply-s3cfg"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  name: "{{ values.env }}-supply-s3cfg"
  # JOINS the namespace the chart owns (namespace.yaml).
  namespace:
    valueFrom:
      name: "{{ values.env }}-supply-ns"
  opaque:
    data:
      admin_access_key_id: "{{ values.s3_access_key }}"
      admin_secret_access_key: "{{ values.s3_secret_key }}"
      seaweedfs_s3_config: "{{ values.s3_identities_config }}"
---
# SeaweedFS with its S3 gateway on, identities user-owned via the Secret
# above, and the registry bucket created before Harbor's first push.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesSeaweedFs
metadata:
  name: "{{ values.env }}-supply-objects"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
  relationships:
    # The identity Secret is consumed by NAME (a plain-string chart
    # contract — no reference carries the ordering), so the edge is
    # declared explicitly: the gateway pods mount the Secret and fail
    # without it.
    - kind: KubernetesSecret
      name: "{{ values.env }}-supply-s3cfg"
      type: depends_on
spec:
  # JOINS the namespace the chart owns (namespace.yaml).
  namespace:
    valueFrom:
      name: "{{ values.env }}-supply-ns"
  createNamespace: false
  volume:
    dataVolume:
      size: "{{ values.objects_disk_size }}"
  s3:
    # The gateway serves this chart's declared identities — nothing is
    # generated. Removing the bucket entry later would NOT delete the
    # bucket or its data.
    existingConfigSecret: "{{ values.env }}-supply-s3cfg"
    buckets:
      - name: registry-blobs
