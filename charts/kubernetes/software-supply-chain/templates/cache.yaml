# The registry cache — Redis-compatible Valkey backing Harbor's sessions,
# job queues, and manifest cache. Standalone with a persistent volume so
# it restarts WARM instead of empty (an empty cache after every restart
# stampedes the database), with a hard memory ceiling and
# least-recently-used eviction — the cache posture: at the ceiling old
# entries make room for new ones instead of the pod OOM-killing.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesValkey
metadata:
  name: "{{ values.env }}-supply-cache"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # JOINS the namespace the chart owns (namespace.yaml) — co-location is
  # load-bearing: Harbor's module reads the declared cache credential in
  # this same namespace.
  namespace:
    valueFrom:
      name: "{{ values.env }}-supply-ns"
  createNamespace: false
  persistence:
    size: "{{ values.valkey_disk_size }}"
  config:
    maxMemory: "{{ values.valkey_max_memory }}"
    maxMemoryPolicy: allkeys-lru
  # Authentication is DECLARED because the kind ships with auth OFF
  # by upstream default (anyone with network reach gets full read/write).
  # The "default" user is the one plain AUTH <password> clients map to.
  # The password is a MUST-CHANGE parameter declared on BOTH sides — here
  # and on Harbor's cache arm (registry.yaml), which materializes it into
  # its own `-redis-auth` Secret under the Harbor chart's fixed
  # REDIS_PASSWORD key. Declaring the same chart-controlled value on both
  # sides is the composition recipe the cache field itself teaches:
  # Valkey's auth Secret keys entries BY USERNAME, a shape Harbor's
  # fixed-key contract cannot consume by reference.
  auth:
    users:
      - name: default
        password: "{{ values.valkey_password }}"
