# Harbor — the private registry at the center of the supply chain: OCI
# images and charts, projects with role-based access, replication, and
# Trivy vulnerability scanning (on by default — this chart leaves the
# kind's secure default alone). Every data arm composes from the
# first-class kinds declared beside it; nothing stateful lives inside
# Harbor's own pods, which is what makes every Harbor component
# horizontally scalable later. The module generates the admin credential
# into its `-admin-auth` Secret — the chart's public default password
# never ships.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesHarbor
metadata:
  name: "{{ values.env }}-harbor"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # JOINS the chart-owned namespace — the same one the database, cache,
  # and object store live in. Co-location is load-bearing: the external
  # database/cache credential Secrets are read from this namespace (see
  # namespace.yaml).
  namespace:
    valueFrom:
      name: "{{ values.env }}-supply-ns"
  createNamespace: false
  # LOAD-BEARING FOR PUSHES AND PULLS, not a display setting: Harbor
  # embeds this URL in the token-service address returned to every OCI
  # client, so docker login/push/pull FAIL AUTH when the address the
  # client dialed does not match it. Set it to what your composed
  # exposure actually serves — an https URL with TLS terminating in
  # front of Harbor is the intended shape.
  externalUrl: "{{ values.harbor_external_url }}"
  database:
    external:
      # Host and password Secret by reference — the -rw Service (always
      # the current primary) and the operator-maintained `<db>-app`
      # Secret, whose `password` key is exactly the key the Harbor chart
      # pins for its external-database Secret contract: the credential
      # composes untouched.
      host:
        valueFrom:
          name: "{{ values.env }}-supply-db"
      # The bootstrap owner role declared in database.yaml — both sides
      # render from the same chart-controlled literal.
      username: harbor
      passwordSecretName:
        valueFrom:
          name: "{{ values.env }}-supply-db"
      # Bootstrapped at the database's initdb — see database.yaml.
      coreDatabase: registry
  cache:
    external:
      # Address by reference (the cache's write endpoint); the password
      # DECLARED on both sides from one chart-controlled parameter (see
      # cache.yaml — the composition recipe this field itself teaches).
      # Harbor's module materializes it into `<name>-redis-auth` under
      # the chart's REDIS_PASSWORD contract key; nothing
      # credential-bearing rides rendered values.
      addr:
        valueFrom:
          name: "{{ values.env }}-supply-cache"
      password: "{{ values.valkey_password }}"
  storage:
    s3:
      # Declared at the store's install — see object-store.yaml.
      bucket: registry-blobs
      # The registry's s3 driver requires a region value even for
      # non-AWS endpoints — a constant, not a knob: in-cluster stores
      # ignore it.
      region: us-east-1
      # Endpoint by reference (the store's S3 gateway); credentials are
      # the SAME chart-controlled pair the identity Secret declares —
      # Harbor's module materializes them into `<name>-storage-auth`
      # under the registry driver's fixed contract keys.
      endpoint:
        valueFrom:
          name: "{{ values.env }}-supply-objects"
      credentials:
        accessKey: "{{ values.s3_access_key }}"
        secretKey: "{{ values.s3_secret_key }}"
      # REQUIRED for in-cluster stores clients cannot reach — a redirect
      # would hand every docker pull an unreachable URL.
      disableRedirect: true
      # Plain HTTP to the in-cluster gateway; client-facing TLS
      # terminates at the composed exposure in front of Harbor.
      secure: false
