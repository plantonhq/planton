{% if values.tekton_enabled | bool %}
# Tekton — in-cluster CI as Kubernetes-native pipelines. ONE toggle gates
# the OPERATOR and the CONFIG together, deliberately: the config never
# reconciles without the operator, the operator alone deploys nothing
# (auto-install is disabled by the component — the declaration below is
# the single owner), and BOTH are one-per-cluster (the operator's
# namespace and every resource name are upstream-fixed; the admission
# webhook allows exactly one TektonConfig, named `config` regardless of
# metadata.name). A separate toggle per half would create flip variants
# that deploy something inert. Set tekton_enabled false on any cluster
# that already runs Tekton.
#
# The operator installs into the upstream-fixed `tekton-operator`
# namespace (baked into the release manifest's own cross-references —
# not configurable, not this chart's namespace). The spec is empty by
# design: the release manifest is the contract, and the component pins
# the release.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesTektonOperator
metadata:
  name: "{{ values.env }}-tekton-operator"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec: {}
---
# The TektonConfig declaration — the single owner of the cluster's Tekton
# installation. Profile `all` = Pipelines + Triggers + Dashboard, into
# the operator-owned `tekton-pipelines` target namespace (the kind
# default). KNOW THIS about that namespace: the operator creates AND
# DELETES it with this resource — it is never chart-owned, and nothing
# else should live there. Destroy ordering is designed-in: this
# resource's deletion waits for the operator to tear the components down,
# so the operator must outlive it — the dependency edge below gives the
# platform's graph exactly that order (create after, destroy before).
#
# The dashboard ships with NO built-in authentication — it stays
# ClusterIP, and any exposure composed in front needs an authenticating
# layer (the README says it louder).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesTekton
metadata:
  name: "{{ values.env }}-tekton"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
  relationships:
    # No spec field consumes an operator output (the coupling is the
    # cluster-global TektonConfig contract), so the ordering edge is
    # declared explicitly. Both resources live inside one toggle, so the
    # edge can never dangle.
    - kind: KubernetesTektonOperator
      name: "{{ values.env }}-tekton-operator"
      type: depends_on
spec:
  # The full profile: Pipelines (the engine), Triggers (event-driven
  # runs), Dashboard (the UI). Rendered explicitly because the profile
  # IS this chart's pitch — narrow it on the deployed resource for
  # engine-only clusters.
  profile: all
{% endif %}
