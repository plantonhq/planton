# Loki — the log store. Monolithic single-binary mode on a persistent volume:
# the honest shape for a per-cluster stack (simple-scalable mode requires
# object storage and pays off at multi-tenant scale — see the README's day-2
# notes for that migration). Log SHIPPING is collection.yaml's job; Grafana
# queries this store through its gateway.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesLoki
metadata:
  name: "{{ values.env }}-loki"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
  relationships:
    # Loki's ServiceMonitor (below) is a Prometheus-operator custom resource
    # — the stack's CRDs must exist before this deploys. No spec field
    # consumes an output, so the edge is declared explicitly.
    - kind: KubernetesKubePrometheusStack
      name: "{{ values.env }}-metrics"
      type: depends_on
spec:
  namespace:
    valueFrom:
      name: "{{ values.env }}-observability-ns"
  createNamespace: false
  # Asynchronous deletion after this window; an explicit production choice —
  # empty would keep logs forever.
  retentionPeriod: "{{ values.loki_retention }}"
  caching:
    # THE SCHEDULING TRAP, defused by parameter: the upstream chart sizes
    # these caches for production log volume (chunks cache 8192MB → a ~9.8Gi
    # container request that never schedules on smaller nodes; the atomic
    # install then rolls the WHOLE release back after its timeout). The
    # params default to sizes that actually deploy and teach the math.
    chunksCacheMemoryMb: {{ values.loki_chunks_cache_memory_mb }}
    resultsCacheMemoryMb: {{ values.loki_results_cache_memory_mb }}
  # Lets this Prometheus watch Loki itself — the stack monitors its own
  # log store.
  serviceMonitorEnabled: true
