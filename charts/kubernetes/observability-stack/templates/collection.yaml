# Telemetry collection — the OpenTelemetry layer that FEEDS the stores:
#
#   otel-operator     reconciles OpenTelemetryCollector custom resources
#   otlp-gateway      (Deployment)  the stable OTLP endpoint applications
#                                   push logs and traces to; fans out to
#                                   Loki and Tempo
#   cluster-logs      (DaemonSet)   reads every container's log files on
#                                   every node, enriches with Kubernetes
#                                   metadata, ships to Loki
#
# PREREQUISITE: the operator's admission webhooks are served with a
# cert-manager certificate — cert-manager must already run on this cluster
# (the production-cluster-baseline chart provides it). The collectors are
# operator-reconciled custom resources; the platform's dependency graph
# orders them after the operator automatically (registry prerequisite).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOtelOperator
metadata:
  # NAMING: the modules enforce a 30-character budget on this name (the
  # operator chart derives long child names from it).
  name: "{{ values.env }}-otel-operator"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
  relationships:
    # The operator's ServiceMonitor needs the stack's CRDs; nothing in its
    # spec consumes an output, so the edge is explicit.
    - kind: KubernetesKubePrometheusStack
      name: "{{ values.env }}-metrics"
      type: depends_on
spec:
  namespace:
    valueFrom:
      name: "{{ values.env }}-observability-ns"
  createNamespace: false
  # The webhook block stays empty ON PURPOSE: the chart then manages its own
  # self-signed cert-manager Issuer — the right choice for almost everyone.
  serviceMonitorEnabled: true
---
# The OTLP gateway — the one address application teams configure in their
# OTel SDKs/agents: logs go to Loki, traces to Tempo. A Deployment sized by
# replicas because it is a stateless fan-out.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOtelCollector
metadata:
  name: "{{ values.env }}-otlp-gateway"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  namespace:
    valueFrom:
      name: "{{ values.env }}-observability-ns"
  createNamespace: false
  mode: deployment
  replicas: {{ values.otlp_gateway_replicas }}
  # The pipeline IS the product: the collector's own config document, on its
  # upstream contract. The exporter endpoints are RENDER-KNOWN literals
  # composed from this chart's own resource names — a collector config is a
  # plain document, so deploy-time references cannot reach inside it; naming
  # both sides from the same template values keeps producer and consumer
  # structurally in sync (Loki's gateway service is "<name>-gateway" on port
  # 80 with OTLP ingest at /otlp; Tempo serves OTLP gRPC on 4317).
  configYaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      batch: {}
    exporters:
      otlphttp:
        endpoint: http://{{ values.env }}-loki-gateway.observability.svc.cluster.local/otlp
      otlp:
        endpoint: {{ values.env }}-tempo.observability.svc.cluster.local:4317
        tls:
          # In-cluster plaintext between the gateway and Tempo.
          insecure: true
    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp]
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 512Mi
{% if values.cluster_logs_enabled | bool %}
---
# Identity for the log-collection DaemonSet: the k8sattributes processor
# asks the API server who owns each log file's pod, which needs real RBAC —
# so the collector runs as its own ServiceAccount with exactly that grant.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesServiceAccount
metadata:
  name: "{{ values.env }}-cluster-logs-sa"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  name: cluster-logs-collector
  namespace:
    valueFrom:
      name: "{{ values.env }}-observability-ns"
---
# The read-only grant behind pod-metadata enrichment: get/list/watch on the
# workload identity chain. Cluster-scoped because the DaemonSet enriches
# logs from EVERY namespace.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesRbac
metadata:
  name: "{{ values.env }}-cluster-logs-rbac"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  clusterScope: {}
  createRole:
    rules:
      - verbs: ["get", "list", "watch"]
        apiGroups: [""]
        resources: ["pods", "namespaces", "nodes"]
      - verbs: ["get", "list", "watch"]
        apiGroups: ["apps"]
        resources: ["replicasets"]
  subjects:
    - serviceAccount:
        # References the ServiceAccount above — the identity and its grant
        # deploy in one run, in the right order, by construction.
        name:
          valueFrom:
            name: "{{ values.env }}-cluster-logs-sa"
        namespace:
          value: observability
---
# The per-node log collector. Reads container log files from the host,
# enriches with pod/namespace/node metadata, ships to Loki over OTLP.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesOtelCollector
metadata:
  name: "{{ values.env }}-cluster-logs"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
  relationships:
    # The collector names its ServiceAccount as a plain string (the CR's own
    # shape) and functions only once the RBAC grant is effective — both
    # edges declared explicitly since nothing flows through spec fields.
    - kind: KubernetesServiceAccount
      name: "{{ values.env }}-cluster-logs-sa"
      type: depends_on
    - kind: KubernetesRbac
      name: "{{ values.env }}-cluster-logs-rbac"
      type: depends_on
spec:
  namespace:
    valueFrom:
      name: "{{ values.env }}-observability-ns"
  createNamespace: false
  mode: daemonset
  configYaml: |
    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        operators:
          # The container parser: splits runtime-format log lines and
          # extracts pod/container identity from the file path.
          - type: container
    processors:
      k8sattributes: {}
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      batch: {}
    exporters:
      otlphttp:
        endpoint: http://{{ values.env }}-loki-gateway.observability.svc.cluster.local/otlp
    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp]
  serviceAccount: cluster-logs-collector
  volumes:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
      hostPath:
        path: /var/log/pods
        type: Directory
    # File-offset checkpoints survive collector restarts — no re-shipping
    # of already-collected logs after upgrades.
    - name: checkpoints
      mountPath: /var/lib/otelcol-checkpoints
      hostPath:
        path: /var/lib/otelcol-checkpoints
        type: DirectoryOrCreate
  scheduling:
    tolerations:
      # Collect from control-plane nodes too, where they exist.
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
  # Container runtimes write pod log files readable only by root; the
  # default collector image runs non-root, and without this the filelog
  # receiver reports permission errors instead of shipping logs.
  podSecurityContext:
    runAsUser: 0
{% endif %}
