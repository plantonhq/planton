apiVersion: infra-hub.planton.ai/v1alpha1
kind: InfraChart
metadata:
  name: Kubernetes ML Platform
spec:
  selector:
    kind: platform
  description: >-
    Declare an ML platform in one manifest — JupyterHub notebooks for
    every team member, MLflow tracking and model registry with durable
    S3 artifact storage, and a Ray cluster for distributed training, all
    secured by default: generated sign-in credentials, token-guarded Ray
    APIs, and a CloudNativePG-managed PostgreSQL bootstrapped with both
    backing databases. Notebooks open pre-wired — the tracking server and
    the Ray client address are already in every user's environment.
  iconUrl: https://downloads.planton.ai/catalog/logos/kubernetes/kubernetesmlflow/logo.svg
  webLinks:
    chartWebUrl: https://github.com/plantonhq/planton/tree/main/charts/kubernetes/ml-platform
    readmeRawUrl: https://raw.githubusercontent.com/plantonhq/planton/refs/heads/main/charts/kubernetes/ml-platform/README.md
