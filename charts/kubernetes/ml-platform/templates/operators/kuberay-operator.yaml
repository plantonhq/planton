{% if values.install_kuberay_operator | bool %}
# The KubeRay operator — the controller that turns this chart's Ray
# cluster declaration into running head and worker pods. It JOINS the
# platform's namespace (it is part of this stack's compute story) and
# watches EVERY namespace — the kind's default and upstream's normal
# one-operator-per-cluster posture; fencing the watch would only invite
# the silently-ignored-declaration trap on the next Ray cluster someone
# declares elsewhere.
#
# No admission webhook, no certificate machinery: the operator validates
# in its reconcile loop, so this install carries no cert-manager
# dependency. Its three ray.io CRDs install once and are KEPT on
# uninstall (the crds/ directory posture) — a chart upgrade never touches
# them.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesKubeRayOperator
metadata:
  name: "{{ values.env }}-kuberay-operator"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # JOINS the namespace the chart owns (namespace.yaml) — referencing the
  # namespace resource makes the created-before-used ordering structural.
  namespace:
    valueFrom:
      name: "{{ values.env }}-ml-ns"
  createNamespace: false
{% endif %}
