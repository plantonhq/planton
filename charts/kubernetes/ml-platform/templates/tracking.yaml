# MLflow — the tracking server and model registry: where every
# experiment, run, metric and registered model lives. Secured by default:
# basic authentication is on with a component-generated admin password
# (`<name>-admin-auth`) — the upstream open server and its
# admin/password1234 example never ship. The backend-store connection URI
# (which embeds the database password) is composed at deploy time into a
# component-owned Secret from the referenced credential — nothing
# credential-bearing appears in any rendered manifest.
#
# Both production seams are external by construction here — PostgreSQL
# for metadata, S3 for artifacts — which is exactly what unlocks scaling
# the server beyond one replica later (a values change on the deployed
# resource; the component enforces the pairing).
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesMlflow
metadata:
  name: "{{ values.env }}-mlflow"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # JOINS the chart-owned namespace — the same one the database and the
  # artifact store live in. Co-location is load-bearing: the component
  # reads the database credential Secret at deploy time to compose the
  # connection URI, and the artifact credentials ride a Secret reference —
  # both readable only from this namespace (see namespace.yaml).
  namespace:
    valueFrom:
      name: "{{ values.env }}-ml-ns"
  createNamespace: false
  backendStore:
    postgres:
      # The three-seam wiring into the database, entirely by reference:
      # host resolves the -rw Service (always the current primary), and
      # the password Secret name resolves the operator-maintained
      # `<db>-app` credential Secret — maintained across failovers, never
      # rendered into values. Each reference rides its field's annotated
      # composition key, so kind and fieldPath are deliberately omitted.
      host:
        valueFrom:
          name: "{{ values.env }}-ml-db"
      # The bootstrap owner role declared in database.yaml — a
      # plain-string field by the spec's contract, honest here because
      # BOTH sides render from the same literal this chart controls. The
      # database_name default ("mlflow") matches the bootstrap exactly —
      # restating it would only create a second place for the contract to
      # drift.
      username: ml
      passwordSecret:
        secretName:
          valueFrom:
            name: "{{ values.env }}-ml-db"
  artifactStore:
    s3Compatible:
      # The artifact seam, entirely by reference: endpoint resolves the
      # store's S3 gateway endpoint, and the credentials Secret name
      # resolves its generated `-s3-secret` — the key names inside it
      # keep the kind's defaults (the admin pair), so they are
      # deliberately not restated. The bucket is a render-known literal
      # matching what artifacts.yaml declares — both sides render from
      # this chart's own design, which is what keeps the pairing honest.
      endpoint:
        valueFrom:
          name: "{{ values.env }}-ml-artifacts"
      bucket: mlflow-artifacts
      credentialsSecret:
        secretName:
          valueFrom:
            name: "{{ values.env }}-ml-artifacts"
