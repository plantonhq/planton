# The Ray cluster — the platform's distributed compute: notebooks and
# applications dial the client port, jobs submit through the dashboard
# port, workers execute. Token authentication stays on its secure default:
# the operator provisions a bearer-token Secret NAMED EXACTLY AFTER THIS
# RESOURCE (key `auth_token`), and every API surface requires it — an
# open Ray cluster executes arbitrary code for anyone who reaches it, so
# the open posture never ships from this catalog.
#
# STATE TRUTH the operator's design imposes: the head pod's control store
# lives in memory — losing the HEAD loses running jobs and the cluster
# rebuilds empty (workers are always expendable). That is the honest
# posture for a training cluster whose results land in MLflow, and the
# durable-state extension (an external Redis-protocol store via the
# component's GCS fault-tolerance arm) is a values change away — the
# README's day-2 notes walk through it.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesRayCluster
metadata:
  name: "{{ values.env }}-ray"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
{% if values.install_kuberay_operator | bool %}
  relationships:
    # The Ray cluster is a ray.io custom resource — the operator (and its
    # CRDs) must exist before this deploys. No spec field consumes an
    # operator output, so the edge is declared explicitly. When the
    # toggle installs no operator, the edge goes with it: a resident
    # operator is already running, and ordering against it is not this
    # chart's to declare.
    - kind: KubernetesKubeRayOperator
      name: "{{ values.env }}-kuberay-operator"
      type: depends_on
{% endif %}
spec:
  # JOINS the namespace the chart owns (namespace.yaml) — the same one
  # the notebooks live in, so RAY_ADDRESS resolves in-namespace and the
  # token Secret is readable where clients run.
  namespace:
    valueFrom:
      name: "{{ values.env }}-ml-ns"
  createNamespace: false
  # Version and image move in LOCKSTEP: the kind derives the node
  # image from this version, and Ray's client protocol requires notebooks
  # and jobs to run a closely matching Ray — which is why the version is
  # a parameter teams pin to their code, not a chart constant.
  rayVersion: "{{ values.ray_version }}"
  head:
    # The head runs the control store, the dashboard and the scheduler —
    # and deliberately NO application work (the component renders
    # num-cpus 0 by default): a task-loaded head starves the control
    # store and destabilizes the whole cluster. Sized fixed at a modest
    # floor; upstream's production guidance starts heads at 4 CPU / 8Gi —
    # raise it on the deployed resource as the cluster grows.
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
  workerGroups:
    # One homogeneous CPU group — the capacity story. Requests and limits
    # are set IDENTICALLY from the parameters: Ray schedules tasks
    # against declared capacity, and a worker whose limit exceeds its
    # request advertises parallelism the node may not honor under
    # pressure. A GPU group is a day-2 addition on the deployed resource
    # (its own group with accelerator limits, selectors and tolerations).
    - name: workers
      replicas: {{ values.ray_worker_replicas }}
      resources:
        requests:
          cpu: "{{ values.ray_worker_cpu }}"
          memory: "{{ values.ray_worker_memory }}"
        limits:
          cpu: "{{ values.ray_worker_cpu }}"
          memory: "{{ values.ray_worker_memory }}"
