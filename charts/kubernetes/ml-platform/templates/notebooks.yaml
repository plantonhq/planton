# JupyterHub — every team member's notebook home: the hub spawns a
# dedicated notebook pod (and a persistent home volume, claim-<username>)
# per user at login, and the proxy routes each user to their server.
# Secured by default: the upstream any-username-no-password door never
# ships — sign-in uses a component-generated shared password
# (`<name>-auth`), delivered to the hub as an environment variable, never
# through rendered values (the hub's own chart embeds ALL rendered values
# readably inside its hub Secret, which is exactly why credentials only
# ride env indirection on this component).
#
# Hub state lives in the composed PostgreSQL rather than the default
# sqlite volume: it survives PVC loss and gets snapshotted with the
# database fleet — the platform posture.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesJupyterHub
metadata:
  name: "{{ values.env }}-jupyterhub"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # JOINS the chart-owned namespace — the same one the database lives in.
  # Co-location is load-bearing (the database password below is mounted
  # from a Secret in this namespace), and JupyterHub's chart-fixed
  # internal names make it one-per-namespace regardless (see
  # namespace.yaml).
  namespace:
    valueFrom:
      name: "{{ values.env }}-ml-ns"
  createNamespace: false
  hub:
    database:
      postgres:
        # The three-seam wiring into the database, entirely by reference:
        # host resolves the -rw Service, and the password Secret name
        # resolves the operator-maintained `<db>-app` credential Secret —
        # the hub mounts it through its chart's existing-secret seam, so
        # the rendered connection URL stays credential-free. Each
        # reference rides its field's annotated composition key, so kind
        # and fieldPath are deliberately omitted. The database_name
        # default ("jupyterhub") matches the bootstrap in database.yaml
        # exactly — restating it would only create a second place for the
        # contract to drift.
        host:
          valueFrom:
            name: "{{ values.env }}-ml-db"
        username: ml
        passwordSecret:
          secretName:
            valueFrom:
              name: "{{ values.env }}-ml-db"
  # authentication is deliberately absent: empty = shared-password
  # sign-in with the component-generated credential — the secure default.
  # Real identity (GitHub/Google/OIDC — a Keycloak composes naturally)
  # is a day-2 values change on the deployed resource.
  singleUser:
    # The OOM ceiling for each user's notebook pod — a runaway notebook
    # dies at it instead of taking the node down (the upstream default is
    # unlimited). The guarantee keeps the kind's default (1G); users
    # needing more capacity belong on the Ray cluster next door.
    memoryLimit: "{{ values.notebook_memory_limit }}"
    extraEnv:
      # The platform's pre-wired client environment — both values are
      # render-known literals composed from names this chart itself
      # controls (this env surface is a plain map by the component's
      # design: no references, no secrets — secret material would land
      # readably in the hub's values-embedding Secret).
      #
      # MLflow: the tracking URI alone is deliberate — auth is ON over
      # there, so each user pairs it with their own
      # MLFLOW_TRACKING_USERNAME/PASSWORD in the notebook (the README's
      # after-deployment section shows the admin bootstrap).
      MLFLOW_TRACKING_URI: "http://{{ values.env }}-mlflow.{{ values.namespace }}.svc.cluster.local:5000"
      # Ray: ray.init() reads RAY_ADDRESS and dials the cluster's client
      # port. The API is token-guarded — notebooks present the token from
      # the operator-provisioned Secret named after the Ray cluster (the
      # README shows the one-liner).
      RAY_ADDRESS: "ray://{{ values.env }}-ray-head-svc.{{ values.namespace }}.svc.cluster.local:10001"
