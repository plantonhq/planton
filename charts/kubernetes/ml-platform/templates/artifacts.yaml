# The artifact store — SeaweedFS with its S3 gateway on, where MLflow
# physically keeps models, datasets, plots and every other run artifact.
# S3 authentication is on by default: the component generates stable
# admin and read-only credential pairs into the `<name>-s3-secret` Secret
# (survives upgrades AND uninstall), and the mlflow-artifacts bucket
# exists before the tracking server's first write. MLflow PROXIES all
# artifact traffic, so notebooks and training jobs never touch these
# credentials — they talk only to the tracking server.
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesSeaweedFs
metadata:
  name: "{{ values.env }}-ml-artifacts"
{% if values.connection != "" %}
  annotations:
    planton.dev/connection: "{{ values.connection }}"
{% endif %}
spec:
  # JOINS the namespace the chart owns (namespace.yaml) — referencing the
  # namespace resource makes the created-before-used ordering structural.
  namespace:
    valueFrom:
      name: "{{ values.env }}-ml-ns"
  createNamespace: false
  # Only the volume-server tier (the disk actually holding object data) is
  # sized by parameter; the master and filer tiers keep the kind's
  # small defaults, which carry this single-instance topology comfortably.
  volume:
    dataVolume:
      size: "{{ values.artifacts_disk_size }}"
  s3:
    # enabled and enable_auth stay on their secure defaults (true) — the
    # authenticated S3 gateway IS this resource's purpose here. Removing
    # the bucket entry later would NOT delete the bucket or its data.
    buckets:
      - name: mlflow-artifacts
