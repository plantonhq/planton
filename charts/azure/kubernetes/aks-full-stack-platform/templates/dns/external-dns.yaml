# external-dns and its keyless Azure identity — the controller that turns
# Kubernetes exposure into real Azure DNS records: it watches Services and
# the active routing surface (Ingresses, or Gateway API HTTPRoutes when the
# gateway arm is on) and publishes matching records. Together with the
# issuers, this closes the "deploy a service, get a name and a certificate"
# loop with zero manual DNS work.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureUserAssignedIdentity
metadata:
  name: "{{ values.env }}-aks-external-dns"
spec:
  region: "{{ values.region }}"
  resourceGroup:
    valueFrom:
      name: "{{ values.env }}-aks-rg"
  name: "{{ values.env }}-aks-external-dns"
---
apiVersion: azure.planton.dev/v1alpha1
kind: AzureFederatedIdentityCredential
metadata:
  name: "{{ values.env }}-aks-external-dns-fic"
spec:
  name: "{{ values.env }}-aks-external-dns-fic"
  userAssignedIdentity:
    valueFrom:
      name: "{{ values.env }}-aks-external-dns"
  issuer:
    valueFrom:
      # The cluster's OIDC issuer — the trust anchor, by reference.
      name: "{{ values.env }}-aks"
  # Chart truth: the module pins the controller ServiceAccount's name to
  # metadata.name — so the subject names the resource name rendered below,
  # in the conventional "external-dns" namespace.
  subject: system:serviceaccount:external-dns:{{ values.env }}-external-dns
---
{% for zone in values.dns_zone_names %}
# Record-write rights on exactly the zones this platform manages — Azure
# DNS's zone-scoped RBAC at work (the identity can touch nothing else the
# subscription holds). Cross-chart references by design: the zones predate
# the cluster.
apiVersion: azure.planton.dev/v1alpha1
kind: AzureRoleAssignment
metadata:
  name: "{{ values.env }}-aks-external-dns-{{ zone }}"
spec:
  scope:
    valueFrom:
      kind: AzureDnsZone
      name: "{{ zone }}"
      fieldPath: status.outputs.zone_id
  roleDefinitionName: DNS Zone Contributor
  principalId:
    valueFrom:
      name: "{{ values.env }}-aks-external-dns"
  skipServicePrincipalAadCheck: true
  description: external-dns publishes records in {{ zone }} ({{ values.env }}-aks)
---
{% endfor %}
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesExternalDns
metadata:
  name: "{{ values.env }}-external-dns"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: AzureAksCluster
      name: "{{ values.env }}-aks"
      type: runs_on
    # The federated trust must be effective before the first record write —
    # nothing flows from the credential, so the edge is explicit.
    - kind: AzureFederatedIdentityCredential
      name: "{{ values.env }}-aks-external-dns-fic"
      type: depends_on
spec:
  # Conventional home, not parameterized (one good answer; the controller
  # is tiny and namespace-invisible to workloads).
  namespace:
    value: external-dns
  createNamespace: true
  azureDns:
    # The zones' home coordinates — honest literals: the zones predate this
    # chart, so nothing in the deployed graph produces them.
    subscriptionId: "{{ values.subscription_id }}"
    resourceGroup: "{{ values.dns_zone_resource_group }}"
    # Zone scope by REFERENCE: each entry resolves the AzureDnsZone's ARM
    # ID at deploy time through the annotated composition key — the chart
    # can never carry a stale or mis-formatted zone ID. The zones live
    # outside this chart; the offline validator reports these as unresolved
    # by design.
    zoneIdFilters:
{% for zone in values.dns_zone_names %}
      - valueFrom:
          name: "{{ zone }}"
{% endfor %}
    # No service principal, no managed-identity client ID: with both absent
    # the controller authenticates through Azure AD Workload Identity — the
    # federation below.
  workloadIdentity:
    aks:
      clientId:
        valueFrom:
          name: "{{ values.env }}-aks-external-dns"
  # Watch the exposure surface this chart actually installs — Services
  # always, plus Ingresses OR Gateway API HTTPRoutes depending on the
  # active arm. Watching a surface that has no controller would only
  # produce dead records.
  sources:
    - service
{% if values.use_gateway_api | bool %}
    - gateway-httproute
{% else %}
    - ingress
{% endif %}
  # Domain scope is the first guardrail: even with zone-scoped grants the
  # controller refuses names outside these suffixes.
  domainFilters:
{% for domain in values.dns_domains %}
    - "{{ domain }}"
{% endfor %}
  # Distinct ownership ID per cluster sharing a zone — the TXT registry is
  # what stops two controllers from fighting over the same records. The
  # policy stays at the kind's default "upsert-only" (create and update,
  # never delete): the safe posture for zones that also hold records
  # managed by hand or by other systems.
  txtOwnerId: "{{ values.dns_txt_owner_id }}"
