# external-dns and its IRSA role — the controller that turns Kubernetes
# exposure into real Route 53 records: it watches Services and the active
# routing surface (Ingresses, or Gateway API HTTPRoutes when the gateway arm
# is on) and publishes matching records. Together with the issuers, this
# closes the "deploy a service, get a name and a certificate" loop with zero
# manual DNS work.
apiVersion: aws.planton.dev/v1alpha1
kind: AwsIamRole
metadata:
  name: "{{ values.env }}-eks-external-dns-irsa"
spec:
  region: "{{ values.region }}"
  description: external-dns Route 53 role for the {{ values.env }}-eks cluster
  oidcTrust:
    providerArn:
      valueFrom:
        name: "{{ values.env }}-eks-oidc"
    providerUrl:
      valueFrom:
        name: "{{ values.env }}-eks-oidc"
        fieldPath: status.outputs.provider_url
    subjects:
      # Chart truth: the module pins the controller ServiceAccount's name to
      # metadata.name — so the subject is the resource name rendered below,
      # in the conventional "external-dns" namespace.
      - "system:serviceaccount:external-dns:{{ values.env }}-external-dns"
  inlinePolicies:
    # external-dns's documented Route 53 permission set. Writes ride the
    # hostedzone wildcard at deploy time (zone IDs are not render-known);
    # the controller's OWN zone-id filters below scope what it touches, and
    # the README's day-2 section shows pinning the Resource entries to exact
    # zone ARNs.
    route53-records:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Action: route53:ChangeResourceRecordSets
          Resource: "arn:aws:route53:::hostedzone/*"
        - Effect: Allow
          Action:
            - route53:ListHostedZones
            - route53:ListResourceRecordSets
            - route53:ListTagsForResources
          Resource: "*"
---
apiVersion: kubernetes.planton.dev/v1alpha1
kind: KubernetesExternalDns
metadata:
  name: "{{ values.env }}-external-dns"
  annotations:
    planton.dev/connection: "{{ values.cluster_connection_name }}"
  relationships:
    - kind: AwsEksCluster
      name: "{{ values.env }}-eks"
      type: runs_on
spec:
  # Conventional home, not parameterized (one good answer; the controller is
  # tiny and namespace-invisible to workloads).
  namespace:
    value: external-dns
  createNamespace: true
  awsRoute53:
    region: "{{ values.region }}"
    # Zone scope by REFERENCE: each entry resolves the AwsRoute53Zone's zone
    # ID at deploy time through the annotated composition key — the chart
    # can never carry a stale or mis-formatted zone ID. The zones live
    # outside this chart (they usually predate the cluster); the offline
    # validator reports these as unresolved by design.
    zoneIdFilters:
{% for zone in values.dns_zone_names %}
      - valueFrom:
          name: "{{ zone }}"
{% endfor %}
    # No static keys: with them absent the controller authenticates through
    # its ServiceAccount's ambient AWS identity — the IRSA binding below.
  workloadIdentity:
    eks:
      roleArn:
        valueFrom:
          name: "{{ values.env }}-eks-external-dns-irsa"
  # Watch the exposure surface this chart actually installs — Services
  # always, plus Ingresses OR Gateway API HTTPRoutes depending on the active
  # arm. Watching a surface that has no controller would only produce dead
  # records.
  sources:
    - service
{% if values.use_gateway_api | bool %}
    - gateway-httproute
{% else %}
    - ingress
{% endif %}
  # Domain scope is the first guardrail: even with broad zone credentials
  # the controller refuses names outside these suffixes.
  domainFilters:
{% for domain in values.dns_domains %}
    - "{{ domain }}"
{% endfor %}
  # Distinct ownership ID per cluster sharing a zone — the TXT registry is
  # what stops two controllers from fighting over the same records. The
  # policy stays at the kind's default "upsert-only" (create and update,
  # never delete): the safe posture for zones that also hold records managed
  # by hand or by other systems.
  txtOwnerId: "{{ values.dns_txt_owner_id }}"
