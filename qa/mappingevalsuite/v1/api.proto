syntax = "proto3";

package dev.planton.qa.mappingevalsuite.v1;

import "qa/mappingevalsuite/v1/spec.proto";
import "shared/metadata.proto";

// MappingEvalSuite declares a seeded-account evaluation for import mapping:
// deploy the listed fixture manifests (the ground truth), scan the account
// blind, have a proposer emit an ImportMappingProposal, and machine-score
// the proposal against what was actually deployed. Follows the KRM pattern
// (apiVersion + kind + metadata + spec).
// Lives at {provider}/aa_eval/suites/{name}.yaml.
//
// Example:
//   apiVersion: qa.planton.dev/v1
//   kind: MappingEvalSuite
//   metadata:
//     name: network-staples
//   spec:
//     members:
//       - kind_dir: awsvpc
//         manifest_path: catalog/aws/awsvpc/v1alpha1/e2e/prerequisite.yaml
//       - kind_dir: awssubnet
//         manifest_path: catalog/aws/awssubnet/v1alpha1/e2e/scenarios/routed.yaml
//     scan_scope:
//       region: us-west-2
message MappingEvalSuite {
  string api_version = 1;
  string kind = 2;
  dev.planton.shared.CatalogObjectMetadata metadata = 3;
  MappingEvalSuiteSpec spec = 4;
}
