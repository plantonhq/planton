# The skills' eval question bank.
#
# Each question is something a real person asks an agent that loaded a
# skill, with the answer the platform actually gives (the ground truth) and
# machine-checkable `checks` that pin that answer to the sentences of the
# skill that teach it. `eval_test.go` verifies every check against the
# embedded skill on every test run, so an edit that drops or changes a
# sentence an answer depends on fails with the question named -- the
# teaching can never quietly rot.
#
# A green test proves the sentences are still there, not that a reader
# finds them. That is the fresh-reader protocol in skills/README.md
# ("Proving the teaching"): an agent given only the skill answers these
# questions, and its answers are graded against `answer`.
#
# Authoring rules for checks:
#   - `skill` names the skill directory (planton); `file` is SKILL.md or
#     references/<name>.md inside it.
#   - Patterns are RE2 regexes matched against the whole file. The files
#     are hard-wrapped prose, so a phrase that may cross a line break joins
#     its words with \s+ and turns on (?s) where it needs to.
#   - Pin checks to durable teaching -- commands with their flags, rules,
#     the exact words the product prints -- never to an example's numbers.

questions:
  - id: engineer-promote-keeping-values
    persona: platform engineer
    question: >
      I have a chart in my workspace. Install it as app-infra in qa, then
      carry it to prod without overwriting the values prod already set.
      What do I run, and what travels?
    answer: >
      Install it into qa with `planton chart install app-infra <chart-dir>
      --env qa` -- the same plan, show, consent and apply as any stack
      change, creating the stack because the name is new. Then
      `planton infra stack promote app-infra --from qa --to prod`. qa's
      live template, its values.yaml and its chart version travel; every
      value prod set stays. A value travels only when named with
      `--bring <name>`; a param the template newly requires asks for
      `--set name=value`. A first promotion into an environment with no
      stack of that name creates it there with every value from the
      source. Into a protected prod the promotion is a request an approver
      decides, and `-m` is required.
    checks:
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: 'planton chart install <stackName> \. --env <env>'
      - skill: planton
        file: references/infra.stack-promotion.md
        pattern: 'planton infra stack promote <slug> --from <env> --to <env>'
      - skill: planton
        file: references/infra.stack-promotion.md
        pattern: '\*\*Stays\*\*: every value the target environment set'
      - skill: planton
        file: references/infra.stack-promotion.md
        pattern: 'named with `--bring <name>`'
      - skill: planton
        file: references/infra.stack-promotion.md
        pattern: '\*\*A first promotion\*\*'
      - skill: planton
        file: references/infra.stack-promotion.md
        pattern: '(?s)Into a protected environment\*\*\s+the\s+promotion\s+is\s+a\s+request'

  - id: engineer-review-and-approve
    persona: platform engineer
    question: >
      A change to app-infra in prod is waiting for approval. How do I read
      it, how is it approved, and what can stop the approval?
    answer: >
      Read it with `planton infra stack review app-infra --env prod`:
      Destroy and Replace rows first (a Replace destroys and recreates the
      resource, so what it holds does not carry over), its impact,
      warnings, readers, who can approve and when it lapses, and the
      review's digest last. Approving is a person's decision: `planton
      infra stack approve app-infra --env prod --review-digest <d>`
      approves exactly the review read, every Destroy and Replace in it,
      and nobody types or names a resource. At a terminal it shows the
      review and asks; `--yes` alone approves the current review. An agent
      approves only on its person's word, and never a run its own person
      started. The platform refuses an approval when the review changed
      since it was read, a row is Blocked (including a Replace the
      requester has no destroy rights for), or the approver is the person
      who asked while another approver exists. A request nobody decides
      within 7 days lapses and closes Lapsed, having applied nothing.
    checks:
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: '(?s)planton infra stack review\s+<stackName> --env prod'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: 'planton infra stack approve <stackName> --env prod --review-digest <d>\n'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: 'Deciding is the user''s act, never yours'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: '(?s)every\s+Destroy\s+and\s+Replace\s+in\s+it:\s+nobody\s+types\s+or\s+names\s+a\s+resource'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: '(?s)\*\*Never\s+approve\s+a\s+run\s+your\s+own\s+person\s+started\*\*'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: 'This review changed since you read it'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: 'needs the requester''s destroy rights'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: '(?s)A request nobody decides within 7 days lapses'

  - id: engineer-drift-and-reconcile
    persona: platform engineer
    question: >
      Someone resized the orders database in the AWS console during an
      incident. How do I find out what changed, and how do I put it back?
    answer: >
      Run a drift check: `planton infra stack drift check <stack> --env
      <env>` (or `planton infra component drift check` for one resource).
      It writes nothing and never waits for an approver. Each resource
      reads In Sync, Drifted (each setting as Applied by Planton and In
      the Cloud Now) or Couldn't Check. Whether to revert is the person's
      call: Reconcile (`planton infra stack reconcile <stack> --env <env>`)
      plans the declaration the stack already holds, then shows, asks and
      applies like any plan -- it takes apply's flags, so `-m "<why>"
      --plan-digest <d>` applies exactly the plan read, and `--dry-run`
      stops at it (a request in a protected environment); or
      keep the cloud's change by carrying the value into the template.
      Once drift is found, any next plan includes the resource as Update
      and applying puts the declaration back.
    checks:
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: 'planton infra stack drift check <stackName> --env <env>'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: 'planton infra stack reconcile <stackName> --env <env> --org <org> -m "<why>" --plan-digest <d>'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: 'Ask which they want\*\* — this is the user''s decision'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: 'Keep the cloud''s change: edit the template'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: 'Drifted: 3 changes made outside Planton'

  - id: engineer-roll-back
    persona: platform engineer
    question: >
      The last change to app-infra in qa broke it. How do I go back to
      revision 8, and what should I know before I do?
    answer: >
      List revisions with `planton infra stack history app-infra --env qa`,
      then `planton infra stack rollback app-infra --env qa
      --to-revision 8`. It plans r8's declaration fresh against today's
      cloud as a new revision, through the same plan, show, consent and
      apply. Module versions stay current; data destroyed since comes back
      empty; a resource kept on its provider since plans Adopt
      (`--adopt Kind/name`); nothing its author chose then is carried. The
      target must have applied, and a roll back is refused while a request
      waits or a run is in flight.
    checks:
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: 'planton infra stack history <stackName> --env <env>'
      - skill: planton
        file: references/infra.stack-promotion.md
        pattern: 'planton infra stack rollback <slug> --env <env> \[--to-revision N\]'
      - skill: planton
        file: references/infra.stack-promotion.md
        pattern: 'Module versions stay current'
      - skill: planton
        file: references/infra.stack-promotion.md
        pattern: 'Data destroyed since comes back empty'

  - id: engineer-removed-from-template
    persona: platform engineer
    question: >
      I deleted a bucket's template from app-infra. What happens to the
      bucket when I apply, and how do I keep it running instead?
    answer: >
      The plan reads it Destroy: it is destroyed on its provider, only
      after everything the plan applies has applied. The person's yes to
      the plan (at a terminal, or `--plan-digest` / `--yes` without one)
      covers every Destroy and Replace row, so each is said by name before
      they answer; nobody types or names a resource to consent. To keep it,
      apply with `--keep Kind/name` (the stack lets go of it and it keeps
      running and billing on its provider), or mark it
      `planton.dev/keep-on-provider: "true"` under the resource's
      metadata.annotations so the stack never destroys it. A kept resource keeps what it depends on. A resource marked
      prevent-destroy, with its own deletion protection on, or still read
      by something else blocks only its destroy: Keep applies the plan
      around it.
    checks:
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: 'No longer in the templates: destroyed on its provider once everything the plan applies has applied'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: '(?s)The user''s yes\s+covers every Destroy and Replace row the plan shows'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: '(?s)nobody types or names a resource to consent to it'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: 'planton\.dev/keep-on-provider: "true"   # never destroyed'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: 'goes `--keep Kind/name`'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: 'planton\.dev/keep-on-provider: "true"'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: '(?s)A kept resource keeps\s+what it depends on'

  - id: developer-redeploy-after-hand-edit
    persona: developer
    question: >
      I changed checkout-api's queue settings by hand in the cloud console.
      How do I see what moved and put the service's configuration back?
    answer: >
      `planton service drift check checkout-api --env <env>` compares every
      resource of the environment's current deployment with the cloud and
      writes nothing. Then `planton service redeploy checkout-api --env
      <env>` applies the current deployment again, exactly as it runs:
      resources that still match are skipped and the drifted ones run, so
      a redeploy is how drift is put back. `--dry-run` shows what the run
      would do first; a protected environment still stops at its gate.
      Keeping the console change means carrying it into the service's
      configuration and deploying.
    checks:
      - skill: planton
        file: references/service.delivery-verbs.md
        pattern: 'planton service drift check <service> --env <env>'
      - skill: planton
        file: references/service.delivery-verbs.md
        pattern: 'planton service redeploy <service> --env <env>'
      - skill: planton
        file: references/service.delivery-verbs.md
        pattern: 'a redeploy is how drift is put back'
      - skill: planton
        file: references/service.delivery-verbs.md
        pattern: 'Promote, rollback, redeploy and deploy each take `--dry-run`'

  - id: developer-push-removes
    persona: developer
    question: >
      I removed a cache and the orders database from checkout-api's
      kustomize tree and pushed. What happens to them?
    answer: >
      Both are removals of the run: listed from the start, carried out at
      the very end, after everything declared applied, the rollout
      verified and the deployment record was written. In an unprotected
      environment the push is the declaration itself, so both are
      destroyed without asking, the database too; marking one
      `planton.dev/keep-on-provider: "true"` before removing it keeps it
      running. In a protected environment the approver decides every
      removal at the gate: each is destroyed unless kept
      (`planton service resolve-env-manual-gate … approve --keep
      Kind/name`), and a removal that appears after the approval asks on
      its own (`planton service removal destroy|keep <service> <number>
      <env> <Kind/name>`). A failed apply or verification removes nothing.
    checks:
      - skill: planton
        file: references/service.delivery-verbs.md
        pattern: 'carries out each one at the very end, after everything declared applied'
      - skill: planton
        file: references/service.delivery-verbs.md
        pattern: '\*\*Destroyed\*\* — the default, a database included'
      - skill: planton
        file: references/service.delivery-verbs.md
        pattern: 'In an unprotected environment nothing asks'
      - skill: planton
        file: references/service.delivery-verbs.md
        pattern: 'In a protected environment, the approver decides every removal'
      - skill: planton
        file: references/service.delivery-verbs.md
        pattern: 'planton service removal keep checkout-api 131 prod AwsRdsInstance/orders-db'
      - skill: planton
        file: references/service.delivery-verbs.md
        pattern: 'A failed apply or a failed verification removes nothing'

  - id: developer-delete-keeping-database
    persona: developer
    question: >
      I want to delete checkout-api but keep its production database
      running. How?
    answer: >
      Mark the database `planton.dev/keep-on-provider: "true"` before
      `planton service delete checkout-api`: the cascade destroys the rest
      and releases the database, still running on its provider and
      adoptable. Or delete with Keep Resources
      (`--retain-infra-components`), which releases every resource. The
      delete is refused up front when a resource is marked prevent-destroy,
      has deletion protection on, or is still read by something else, and
      when the service has deployments in a protected environment.
    checks:
      - skill: planton
        file: references/service.delete-cascade.md
        pattern: '`planton\.dev/keep-on-provider: "true"`\*\* — never destroyed'
      - skill: planton
        file: references/service.delete-cascade.md
        pattern: 'planton service delete <service> --retain-infra-components'
      - skill: planton
        file: references/service.delete-cascade.md
        pattern: 'is marked prevent-destroy\. Remove the mark, or delete with Keep Resources'
      - skill: planton
        file: references/service.delete-cascade.md
        pattern: 'Something else still reads a resource'

  - id: agent-apply-reviewed-plan-in-ci
    persona: coding agent
    question: >
      In CI, how do I apply exactly the stack plan a person reviewed on
      the pull request, and what happens if something moved since?
    answer: >
      Plan with `-o markdown` and post it; the digest is on the plan (its
      "Apply it:" line, the markdown's "Plan digest:", `plan_digest` in
      JSON). Apply with `planton infra stack apply <stack> . --env <env>
      -m "<why>" --plan-digest <d>`: it plans again and applies only while
      the fresh plan is that one, otherwise it refuses saying the plan is
      out of date. The digest is consent given in advance to every Destroy
      and Replace in that plan; `--yes` consents too, without pinning the
      plan. With neither and no terminal, the apply refuses with the
      command plus `--yes`, saying what the plan destroys and replaces.
      Into a protected environment the apply files a request and ends with
      exit 0 and the review lines.
    checks:
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: '--plan-digest <digest from the plan you showed>'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: '`-o json` as `plan_digest`'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: '(?s)saying the plan is out of\s+date'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: '(?s)`--plan-digest` and `--yes` are\s+both consent given in advance to every Destroy and Replace row'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: '(?s)"Add\s+--yes to Proceed Without Asking"'
      - skill: planton
        file: references/infra.stack-promotion.md
        pattern: '--dry-run -o markdown'

  - id: agent-follow-and-exit-codes
    persona: coding agent
    question: >
      I started a run. How do I follow it to the end and tell success,
      failure and "waiting for a person" apart in a script?
    answer: >
      `planton follow <run-id>` reads the run's kind from its prefix
      (ij_, infpipe_, svcpipe_) and exits 0 when the run is done, 1 when it
      failed or was cancelled (or the id names no run), 3 when it waits for
      a person, with the line before saying who runs what. Branch on the
      code, never the words. A stack apply follows its run and exits
      non-zero when it fails; a stack plan exits 0 planned, 1 when it does
      not build, a resource is blocked or a run is in flight, 2 when it
      could not be made, and 4 with `--detailed-exitcode` when applying
      would change something.
    checks:
      - skill: planton
        file: references/craft.planton-cli.md
        pattern: 'planton follow <run-id> --plain'
      - skill: planton
        file: references/craft.planton-cli.md
        pattern: '(?s)`3` it waits for a person'
      - skill: planton
        file: references/craft.planton-cli.md
        pattern: 'Branch on the code, never on the words'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: '(?s)`2` the plan could not be\s+made'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: '(?s)the exit\s+code is non-zero when the followed run fails'

  - id: agent-rerun-by-id
    persona: coding agent
    question: >
      A run failed on a timeout. How do I run it again from its id, and
      when is a rerun the wrong move?
    answer: >
      `planton rerun <run-id>` takes any run's id (ij_, infpipe_,
      svcpipe_, extrun_) and follows the new run (`--no-follow` returns).
      It is a mutation: confirm first; when it still destroys or replaces
      something it asks, and `--yes` answers once the person agreed. Exit 0 done
      (or a request waiting for its approver), 1 failed or refused, 3 a
      person must decide. A stack run's rerun repeats its revision and is
      refused once a newer revision exists or the stack was undeployed;
      a service delivery run (promote, rollback, deploy, redeploy) is never
      rerun -- the refusal names the verb to ask again.
    checks:
      - skill: planton
        file: references/craft.planton-cli.md
        pattern: 'planton rerun <run-id>\s+# any run; follows it to the end'
      - skill: planton
        file: references/craft.planton-cli.md
        pattern: '`ij_` an Infra Job'
      - skill: planton
        file: references/infra.deployed-stacks.md
        pattern: 'rerun is refused once a newer revision exists'
      - skill: planton
        file: references/service.delivery-verbs.md
        pattern: '## A delivery run is never rerun'

  - id: agent-stranger-reads-as-not-found
    persona: coding agent
    question: >
      My script ran `planton get Service checkout-api` against another
      team's organization and it exited 3. Does that mean they have no
      service by that name?
    answer: >
      No. A record in an organization you are not part of answers exactly
      like a record that does not exist: the same exit 3 and the same
      sentence, by id or by organization and slug. Check the instance and
      organization first with `planton context get`. Inside an
      organization you belong to, a record you may not read is a refusal
      instead: the Access Needed banner names the roles that could and who
      can grant them, and the command exits 1.
    checks:
      - skill: planton
        file: references/craft.planton-cli.md
        pattern: 'A record in an organization you are not part of answers exactly like a record that does not exist'
      - skill: planton
        file: references/craft.planton-cli.md
        pattern: 'a record you may not read is a refusal, not a miss'

  - id: approver-opens-the-run-by-id
    persona: release approver
    question: >
      I am only a Release Approver on prod. A run is waiting on me, but the
      service's page refuses me and `planton service logs checkout-api 130`
      fails. How do I read what I am approving?
    answer: >
      Approve on an environment lets you read every run that waits at a
      gate there, or once did -- its record, logs and live status -- but
      not the service, so the service page, its run list and the
      `<service> <number>` handle refuse you. Name the run by its id
      (svcpipe_...), which the waiting queue, Home's Waiting on You and the
      gate notification carry: `planton service logs svcpipe_...`, then
      `planton service resolve-env-manual-gate svcpipe_... prod approve`.
    checks:
      - skill: planton
        file: references/service.reading-a-run.md
        pattern: 'Approve on an environment lets a person read every run that waits at a gate in that environment, or once did'
      - skill: planton
        file: references/service.reading-a-run.md
        pattern: 'Name the run by its id for them'

  - id: admin-puts-the-company-logo-on-self-hosted
    persona: platform engineer
    question: >
      We run Planton on our own cluster. Put our logo (acme.png, and a white
      version, acme-white.png) on it, sign-in page included. Do I add it to
      the PlantonPlatform?
    answer: >
      No -- the installation's logo is held by the product, not the
      declaration. As an installation administrator run
      `planton branding set-logo acme.png --dark-theme acme-white.png`: one
      change sets the logo and its version for the dark theme, and every
      surface of the installation draws it in place of Planton's mark. The
      sign-in page is light by design, so it shows the logo itself (never
      the white version), else Planton's mark, read from the installation
      itself -- no operator change and no identity-server restart.
    checks:
      - skill: planton
        file: SKILL.md
        pattern: 'What the product itself holds is changed through the product instead, never the declaration'
      - skill: planton
        file: references/self-hosted.branding.md
        pattern: 'planton branding set-logo logo\.png --dark-theme light\.png'
      - skill: planton
        file: references/self-hosted.branding.md
        pattern: '(?s)version\s+for\s+the\s+dark\s+theme,\s+else\s+the\s+logo,\s+else\s+Planton''s\s+mark'

  - id: owner-puts-the-console-at-planton-acme-com
    persona: platform engineer
    question: >
      We're on the Team plan. Put our Planton console at planton.acme.com.
      Our acme.com zone is a Cloudflare zone we deployed through Planton.
      What do you do?
    answer: >
      Confirm the organization by name and the change first, then
      `planton custom-domain set planton.acme.com --no-wait -o json` (or
      apply_custom_domain) and read the setup guide (`planton custom-domain
      prompt -o json`) for the record and the zone. Before touching DNS,
      look up whether Planton already manages that zone: list the
      organization's infra components (`planton search infra-components
      --all-envs -o json`, or list_infra_components) and find the
      CloudflareDnsZone whose spec.zoneName is acme.com. It does, so propose
      a CloudflareDnsRecord -- a CNAME from planton.acme.com to the
      organization's label under plantonedge.com, proxied false, its zoneId
      wired with valueFrom to the zone component -- show it, and apply it
      through Planton on the person's yes. Then verify (`planton
      custom-domain verify --wait --timeout 8m -o json`), never looking the name up
      through a public resolver before it is Live; act on reading.diagnosis
      (record_missing and record_not_yet_public mean wait), and repeat until
      exit 0, the recorded state Live.
    checks:
      - skill: planton
        file: SKILL.md
        pattern: 'references/organization\.custom-domain\.md'
      - skill: planton
        file: references/organization.custom-domain.md
        pattern: 'planton custom-domain set planton\.acme\.com --no-wait -o json'
      - skill: planton
        file: references/organization.custom-domain.md
        pattern: '## Planton-managed DNS first'
      - skill: planton
        file: references/organization.custom-domain.md
        pattern: 'planton search infra-components --all-envs -o json'
      - skill: planton
        file: references/organization.custom-domain.md
        pattern: '\| `CloudflareDnsZone` \| `spec\.zoneName` \|'
      - skill: planton
        file: references/organization.custom-domain.md
        pattern: 'kind: CloudflareDnsRecord'
      - skill: planton
        file: references/organization.custom-domain.md
        pattern: 'never look the name up yourself'
      - skill: planton
        file: references/organization.custom-domain.md
        pattern: 'planton custom-domain verify --wait --timeout 8m -o json'

  - id: custom-domain-record-proxied
    persona: coding agent
    question: >
      `planton custom-domain verify --wait -o json` exits 2 with cause
      record_proxied for planton.acme.com. Our Cloudflare proxies that name.
      What now?
    answer: >
      The name answers with Cloudflare's addresses, so public DNS can't see
      where it points. Either set the record to DNS only with CNAME
      flattening off, or, when the name must stay proxied, keep the CNAME
      and add the TXT beside it (reading.diagnosis.records_to_add holds the
      TXT, _planton-verification.planton.acme.com holding the organization's
      label) -- through Planton when Planton manages the zone -- then verify
      again. Nothing is removed.
    checks:
      - skill: planton
        file: references/organization.custom-domain.md
        pattern: '\| `record_proxied` \|.*DNS only with CNAME flattening off, or keep it proxied and add the TXT beside the CNAME'
      - skill: planton
        file: references/organization.custom-domain.md
        pattern: 'Act on `reading\.diagnosis`'
      - skill: planton
        file: references/organization.custom-domain.md
        pattern: '\*\*2\*\* not Live yet'

  - id: custom-domain-blocked-by-caa
    persona: platform engineer
    question: >
      Our custom domain says the certificate is blocked by a CAA record.
      What do we change?
    answer: >
      Cause certificate_blocked_by_caa: a CAA record on the domain forbids
      the certificate authorities Planton uses. Add CAA records allowing
      letsencrypt.org and pki.goog (or remove the CAA record) -- as a
      Planton change when the zone is a Planton-managed infra component --
      then verify again. Never add a CAA record that leaves either out.
    checks:
      - skill: planton
        file: references/organization.custom-domain.md
        pattern: 'Add CAA records allowing `letsencrypt\.org` and `pki\.goog`, or remove the CAA record'
      - skill: planton
        file: references/organization.custom-domain.md
        pattern: 'never add a CAA record that leaves out `letsencrypt\.org` and `pki\.goog`'

  - id: app-at-app-acme-com-is-a-service-domain
    persona: developer
    question: >
      Put my app at app.acme.com.
    answer: >
      That is a service's own hostname, not the organization's console
      address, so the custom-domain verbs do not apply. A name outside the
      environment's {label}.{env-domain} convention is composed as real
      infra-catalog resources beside the service (the carrier with the
      hostname authored, the DNS record, the certificate), wired with
      valueFrom onto the service's deployed outputs.
    checks:
      - skill: planton
        file: SKILL.md
        pattern: 'Not this: the organization''s console address → `organization\.custom-domain\.md`'
      - skill: planton
        file: SKILL.md
        pattern: 'Not this: a service''s own hostname → `service\.serving-domains-custom\.md`'
      - skill: planton
        file: references/service.serving-domains-custom.md
        pattern: 'never as switches on the service record'

  - id: agent-connects-gcp-for-the-user
    persona: developer, through a coding agent
    question: >
      Connect my GCP project acme-prod to Planton.
    answer: >
      Read the plan first, which changes nothing -- `planton connect gcp
      --project acme-prod -o json` -- then explain with its real values: the
      setup runs as them, on this machine, with the gcloud sign-in they
      already have, and writes a trust and a role only this connection can
      use in their own project; Planton keeps no key. Tell them who it runs
      as, where, what Planton may deploy, what it leaves alone, anything it
      changes for other connections, and that the connection will be usable
      by every environment and become the organization's default GCP
      connection when there is none. Ask, naming the identity and the
      project. Only on their yes run the plan's `run` command (it carries
      --yes and every choice the plan was asked with), narrate each step,
      and read the verdict back.
    checks:
      - skill: planton
        file: SKILL.md
        pattern: '(?s)Connecting a cloud is the person''s informed decision'
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: '\*\*Read the plan first; it changes nothing\.\*\*'
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: 'the plan''s `run` command carries exactly what the plan was asked with'
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: '\*\*Ask, naming the identity, the target and who may use it:\*\*'
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: '\*\*`--yes` is the person''s yes, given ahead\.\*\*'

  - id: security-lead-asks-what-planton-can-do
    persona: security lead, wary of granting access
    question: >
      Before I let you connect our AWS account: what exactly will Planton be
      able to do in it, and does it keep our credentials?
    answer: >
      Planton can deploy, change and destroy exactly the kinds the grant
      covers, with the permissions the catalog lists for them, in a role that
      is the connection's own, plus any predefined roles the plan's `granted`
      names -- each read to the person. The default grant never includes Owner
      or Editor, and never permissions above the target; power over who has
      access and the tier above the target are separate opt-ins. A keyless
      connection stores no secret: each deploy gets a short-lived token only
      this connection's trust accepts, and the person's own sign-in never
      leaves their machine. `--print-documents` shows every permission
      before anything runs.
    checks:
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: '\*\*It can do what the grant says, nothing more\.\*\*'
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: '(?s)never\s+includes\s+Owner\s+or\s+Editor'
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: '\*\*Planton keeps no key\.\*\*'
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: 'Your sign-in never leaves this machine'

  - id: security-lead-asks-how-to-take-it-back
    persona: security lead, wary of granting access
    question: >
      If we change our minds, how do we take Planton's access away?
    answer: >
      The role is theirs: they can narrow or delete it in their own cloud at
      any time, and deleting the trust cuts Planton off at once.
      `planton connect aws cleanup <slug>` prints what deleting the
      connection leaves in their cloud and the script that removes the trust
      and the role Planton set up; `planton delete AwsProviderConnection
      <slug>` deletes the connection.
    checks:
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: '\*\*You stay in control, in your own cloud\.\*\*'
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: 'planton connect gcp cleanup <slug>` prints what deleting the connection leaves'

  - id: security-lead-asks-whether-planton-reads-data
    persona: security lead, wary of granting access
    question: >
      Can Planton read our data with this connection?
    answer: >
      Answer from the rendered permissions, never with a blanket no: the
      grant includes what the granted kinds need to manage their resources,
      which for some kinds includes reading the resource's contents (a
      secret store's versions, for example). Show the permissions with
      --print-documents, name any that read data, and offer to grant only
      the kinds they need.
    checks:
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: 'Answer from the documents, never with a blanket no'
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: 'Never tell the person Planton "can''t read anything"'

  - id: aws-with-a-named-profile
    persona: platform engineer
    question: >
      Connect our prod AWS account; my profile for it is prod-admin.
    answer: >
      `planton connect aws --profile prod-admin -o json` for the plan, shown
      and agreed, then the plan's run command. The script refuses to act
      when the profile is signed in to a different account than the target,
      and the setup never falls back to another sign-in it finds.
    checks:
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: 'AWS `--account-id` and `--profile`'
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: 'never another sign-in it happens to find'
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: 'The script says the AWS CLI is signed in to another account'

  - id: verdict-with-blocked-kinds
    persona: platform engineer
    question: >
      The connection says "171 of 186 GCP Kinds Can Deploy". What now?
    answer: >
      The headline counts against the grant. Blocked kinds are ones the grant
      covers that cannot deploy yet, each with its missing permissions: apply
      the grant again from the connection's Permissions section, never build
      a second role by hand. Kinds outside the grant are what the person
      chose, not a fault. Re-run `planton connect gcp verify <slug>` after a
      change.
    checks:
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: 'never by building a second role by hand'
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: 'the cloud may still be spreading the new role: verify again in a minute'
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: 'Not a fault -- what they chose'
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: 'planton connect gcp verify <slug>` re-runs Verify any time'

  - id: connect-stopped-half-way
    persona: developer
    question: >
      planton connect azure stopped half-way. Do I have to clean up first?
    answer: >
      No. Run the same command again: the script adopts what it already
      made, and an existing keyless connection with the same trust goes
      straight to Verify. Every failure after the script ran names the
      command that resumes.
    checks:
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: 'running the same command again picks up where it stopped'

  - id: windows-without-bash
    persona: developer on Windows
    question: >
      planton connect gcp says this machine has no bash. What do I do?
    answer: >
      Print the exact script with --print-documents and run it in the cloud's
      own browser shell (Google Cloud Shell), which has bash and is already
      signed in as them; the script ends by printing what Planton needs, and
      the connection is created from those values in the console's wizard or
      with `planton apply -f` on a manifest naming them, then verified.
    checks:
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: 'the person runs it in Google Cloud Shell, AWS CloudShell or Azure Cloud Shell'
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: 'slug: <slug>      # exactly the slug the script was printed for: the trust pins it'

  - id: connect-digitalocean
    persona: developer
    question: >
      Connect my DigitalOcean account.
    answer: >
      DigitalOcean has no keyless trust: `planton connect digitalocean
      --print-documents` prints the scopes the token needs and where to
      create it. The person creates the token and runs the connect command
      themselves with it in their own shell (DIGITALOCEAN_TOKEN, or stdin),
      so it never enters the conversation or a flag; `planton connect
      digitalocean --region <region>` stores it as the organization secret,
      connects and verifies. Unlike keyless, Planton does keep this token.
    checks:
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: 'so the token is never pasted into the conversation and never a command-line flag you write'
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: 'planton connect digitalocean --region <region>`'

  - id: security-lead-asks-whether-the-identity-is-shared
    persona: security lead, wary of granting access
    question: >
      Could another Planton connection in our GCP project end up with this
      connection's permissions, or could another company's Planton use our
      trust?
    answer: >
      The trust admits only this Planton's issuer and only this connection's
      subject, so no other organization or Planton can present it. But by
      default the role is granted to the service account
      planton-provisioner@<project>, which every Planton connection in the
      project may sign in as, so each of them can do what their roles allow
      together; the plan's reachesOthers names them. To keep this
      connection's role apart, name a service account of its own with
      --service-account (Azure: --app-name). AWS gives every connection its
      own role.
    checks:
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: '\*\*Say plainly when the identity is shared\.\*\*'
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: '--service-account <name>@<project>\.iam\.gserviceaccount\.com'
      - skill: planton
        file: references/infra.connecting-clouds.md
        pattern: 'no other connection, organization or Planton can present it'
